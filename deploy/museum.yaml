apiVersion: v1
kind: Namespace
metadata:
  name: sankofa-museum
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum
  namespace: sankofa-museum
  labels: {app.kubernetes.io/name: museum}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: museum}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: museum}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: museum
          image: MUSEUM_IMAGE
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: museum
  namespace: sankofa-museum
spec:
  selector: {app.kubernetes.io/name: museum}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: museum
  namespace: sankofa-museum
  annotations:
    # With cert-manager and this ClusterIssuer (hack/stand/letsencrypt.yaml)
    # the certificate is issued automatically; without them nginx serves its
    # default certificate.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [MUSEUM_HOST]
      secretName: museum-tls
  rules:
    - host: MUSEUM_HOST
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: museum, port: {name: http}}}}
---
# OPTIONAL: a second public domain. Remove this entire Ingress document when
# using only MUSEUM_HOST (see docs/self-host.md). www redirects to the bare
# domain; the certificate covers both names.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: museum-domain
  namespace: sankofa-museum
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [PUBLIC_HOST, www.PUBLIC_HOST]
      secretName: museum-domain-tls
  rules:
    - host: PUBLIC_HOST
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: museum, port: {name: http}}}}
---
# The storeroom: a cache of the Cabinet of Curiosities hidden in the cluster
# (content/cabinet/cluster.yaml, checked by pkg/cabinet's tests).
apiVersion: v1
kind: ConfigMap
metadata:
  name: storeroom
  namespace: sankofa-museum
  labels: {app.kubernetes.io/name: museum}
data:
  inventory.en.txt: |-
    STOREROOM OF THE SANKOFA MUSEUM. Inventory, kept by the steward.
    Shelf A: a student's trunk from McGrawville, New York. Empty; its woodcut hangs upstairs.
    Shelf B: a ship steward's chest from the Lembrança, Rio de Janeiro to New York, 1847.
    The chest has no keyhole, only a lock of letters.
    Word for the lock: lembranca (Portuguese for memory; the lock has no cedilla).
    Inside the chest: the steward's keys, and one of them opens the last shelf.
    Shelf C, the last: a bread basket, sent home to Brazil. Look for it among the countries.
    Nothing here is thrown away. What is put away is remembered.
  inventory.ru.txt: |-
    КЛАДОВАЯ МУЗЕЯ САНКОФА. Опись ведёт стюард.
    Полка А: студенческий сундук из Макгроувилла, штат Нью-Йорк. Пуст; его гравюра висит наверху.
    Полка Б: сундук корабельного стюарда с «Лембрансы», Рио-де-Жанейро — Нью-Йорк, 1847 год.
    Замочной скважины у сундука нет, только замок с буквами.
    Слово для замка: lembranca (по-португальски «память»; седиль замок не берёт).
    В сундуке — ключи стюарда, и один из них отпирает последнюю полку.
    Полка В, последняя: хлебная корзина, отправленная домой, в Бразилию. Ищите её среди стран.
    Здесь ничего не выбрасывают. Что убрано на полку — то помнят.
