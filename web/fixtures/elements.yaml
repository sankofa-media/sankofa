# Placeholder elements of music for tests and screenshots, until the real
# layer (content/roots/elements.yaml and `carries` on each link) lands.
# Not museum content: the end-to-end tests serve it in place of
# data/elements.json and lay `carries` over the exported links.
elements:
- id: rap-flow
  name: Rap flow
  nameRu: рэп-флоу
  what: "[placeholder] Rhymes delivered in rhythm over a beat, their placement and speed as much a part of the music as the words."
  whatRu: "[заглушка] Рифмы, произнесённые в ритм поверх бита: их место и скорость — такая же часть музыки, как слова."
  origin: [hip-hop]
  sources:
  - {title: "Placeholder source A", url: "https://example.org/a"}
- id: the-riff
  name: The riff
  nameRu: рифф
  what: "[placeholder] A short repeated figure that carries a song."
  whatRu: "[заглушка] Короткая повторяющаяся фигура, на которой держится песня."
  origin: [funk]
  sources: []
- id: improvisation
  name: Improvisation
  nameRu: импровизация
  what: "[placeholder] Music made up in the moment of playing."
  whatRu: "[заглушка] Музыка, которая сочиняется в момент игры."
  origin: [jazz]
  sources: []
- id: blue-notes
  name: Blue notes
  nameRu: блюзовые ноты
  what: "[placeholder] Notes bent between the major and the minor."
  whatRu: "[заглушка] Ноты, изогнутые между мажором и минором."
  origin: [blues]
  sources: []
- id: call-and-response
  name: Call and response
  nameRu: перекличка
  what: "[placeholder] One voice sings a line and the others answer."
  whatRu: "[заглушка] Один голос запевает, остальные отвечают."
  origin: [work-songs]
  sources: []
- id: offbeat
  name: The offbeat
  nameRu: офбит
  what: "[placeholder] The chop of the guitar between the beats."
  whatRu: "[заглушка] Удар гитары между долями."
  origin: [reggae]
  sources: []
# `carries` (and optionally how/howRu) laid over exported links, by "artist>to".
carries:
  ed-sheeran>root:eminem: {carries: [rap-flow], how: "[placeholder] A fast, tightly packed rap delivery, learned by heart from a record.", howRu: "[заглушка] Быстрая, плотная рэп-подача, выученная наизусть по пластинке."}
  eminem>root:rakim: {carries: [rap-flow]}
  eminem>root:labi-siffre: {carries: [the-riff]}
  eminem>card:funk: {carries: [the-riff]}
  rakim>card:hip-hop: {carries: [rap-flow]}
  rakim>root:john-coltrane: {carries: [improvisation]}
  john-coltrane>root:miles-davis: {carries: [improvisation]}
  john-coltrane>card:jazz: {carries: [improvisation]}
  miles-davis>root:charlie-parker: {carries: [improvisation]}
  miles-davis>card:jazz: {carries: [improvisation]}
  charlie-parker>card:jazz: {carries: [improvisation]}
  labi-siffre>card:jazz: {carries: [improvisation]}
  led-zeppelin>card:blues: {carries: [blue-notes]}
  led-zeppelin>root:howlin-wolf: {carries: [blue-notes]}
  howlin-wolf>root:charley-patton: {carries: [blue-notes]}
  howlin-wolf>card:blues: {carries: [blue-notes]}
  charley-patton>card:blues: {carries: [blue-notes]}
  aquarium>card:reggae: {carries: [offbeat]}
  the-beatles>card:rock-n-roll: {carries: [blue-notes]}
