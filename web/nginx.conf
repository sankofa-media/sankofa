server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects (/features/angel -> /features/angel/) stay on the host and
    # scheme the reader used, not nginx's own :8080 behind the ingress.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml application/atom+xml application/manifest+json;
    gzip_min_length 1024;
    # The pre-rendered pages, llms.txt and the feeds are UTF-8 (Russian among them).
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml application/atom+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;

    # Every page: the home and the pre-rendered ones (/features/<id>/,
    # /ru/cards/<id>/ ..., served as <dir>/index.html), always revalidated.
    location ~ (^|/)index\.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # A location with its own add_header drops the server-level ones, so each
    # repeats the security headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # What search engines and assistants read: the robots rules, the sitemap,
    # llms.txt and the feeds of special projects. Fresh within the hour.
    location ~ ^/(robots\.txt|sitemap(-[0-9]+)?\.xml|(ru/)?llms(-full)?\.txt|(ru/)?features\.atom)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # Link-preview pictures of the special projects, redrawn with each release.
    location /social/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # Media files keep their names across releases, so they are cached for a
    # week and revalidated, not marked immutable.
    location /media/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # Subtitles for the voices' <track>: with nosniff a browser reads captions
    # only as text/vtt, so say so whatever nginx's type table holds.
    location ~ ^/data/voices/[a-z0-9.-]+\.vtt$ {
        types { }
        default_type text/vtt;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' https://tile.loc.gov; frame-src https://www.youtube-nocookie.com; connect-src 'self'; frame-ancestors 'none'" always;
    }
    # Optional cluster integration; the standalone image serves static content.
    include /etc/nginx/museum/*.conf;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
