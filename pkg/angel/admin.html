<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Angel queue</title>
<style>
  :root { color-scheme: light dark; --bg: #faf8f5; --fg: #1d1b19; --muted: #6b655e; --line: #ddd6cc; --accent: #8a2b1d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161412; --fg: #ece7e0; --muted: #9a9289; --line: #34302b; --accent: #e08a6f; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  form, .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input, select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  input { flex: 1; min-width: 12rem; }
  button { cursor: pointer; }
  button.pub { border-color: var(--accent); color: var(--accent); }
  article { border-top: 1px solid var(--line); padding: 12px 0; }
  .text { white-space: pre-wrap; font-size: 1.1rem; }
  .meta, .tr { color: var(--muted); font-size: .9rem; }
  #msg { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Angel: words, notes and pulses for the owner</h1>
  <form id="auth">
    <input id="token" type="password" placeholder="ANGEL_ADMIN_TOKEN" autocomplete="off">
    <select id="status">
      <option value="">pending, review, reported</option>
      <option value="published">published</option>
      <option value="rejected">rejected</option>
      <option value="hidden">hidden</option>
      <option value="crisis">crisis</option>
      <option value="queued">queued</option>
      <option value="feedback">Museum feedback</option>
      <option value="notes">Negative: reader notes</option>
      <option value="pulses">readers' pulses</option>
    </select>
    <button>Load</button>
  </form>
  <p id="msg"></p>
  <section id="list"></section>
</main>
<script>
  // The token lives only in this tab's memory: no cookies, no storage.
  const $ = (id) => document.getElementById(id);
  const api = location.pathname.replace(/admin\/?$/, "");
  const auth = () => ({ Authorization: "Bearer " + $("token").value });
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  async function loadPulses() {
    const r = await fetch(api + "admin/pulses", { headers: auth() });
    const list = $("list");
    list.replaceChildren();
    if (!r.ok) { $("msg").textContent = "Error " + r.status + ": " + ((await r.json().catch(() => ({}))).error || ""); return; }
    const { pulses } = await r.json();
    $("msg").textContent = pulses.length ? pulses.length + " pulse(s), newest first" : "No pulses yet.";
    for (const p of pulses) {
      const a = el("article");
      const bpm = Math.round(60000 * p.rr.length / p.rr.reduce((x, y) => x + y, 0));
      a.append(el("div", "text", bpm + " bpm · " + p.rr.length + " beats"));
      a.append(el("div", "meta", ["#" + p.id, p.source, p.day, p.hidden ? "hidden" : "shown"].join(" · ")));
      const action = p.hidden ? "publish" : "hide";
      const b = el("button", action === "publish" ? "pub" : "", action);
      b.onclick = async () => {
        const r = await fetch(api + "admin/pulses/" + p.id, { method: "POST", headers: { ...auth(), "Content-Type": "application/json" }, body: JSON.stringify({ action }) });
        if (r.ok) loadPulses(); else $("msg").textContent = "Error " + r.status;
      };
      const bar = el("div", "bar");
      bar.append(b);
      a.append(bar);
      list.append(a);
    }
  }
  async function loadFeedback(before = 0) {
    const r = await fetch(api + "admin/feedback?before=" + before, { headers: auth() });
    const list = $("list");
    list.replaceChildren();
    if (!r.ok) { $("msg").textContent = "Error " + r.status; return; }
    const data = await r.json();
    $("msg").textContent = data.feedback.length + " message(s), newest first";
    for (const f of data.feedback) {
      const a = el("article");
      a.append(el("div", "meta", [f.id, f.kind, f.status, f.created].join(" · ")), el("div", "text", f.text), el("div", "meta", f.contact), el("div", "text", JSON.stringify(f.page, null, 2)));
      const status = f.status === "open" ? "done" : "open";
      const b = el("button", "", status);
      b.onclick = async () => {
        const r = await fetch(api + "admin/feedback/" + f.id, { method: "POST", headers: { ...auth(), "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
        if (r.ok) loadFeedback(before); else $("msg").textContent = "Error " + r.status;
      };
      a.append(b); list.append(a);
    }
    if (data.next) { const more = el("button", "", "Older messages"); more.onclick = () => loadFeedback(data.next); list.append(more); }
  }
  async function load(before = 0) {
    const st = $("status").value;
    if (st === "feedback") return loadFeedback(before);
    if (st === "pulses") return loadPulses();
    const isNotes = st === "notes";
    const r = await fetch(api + (isNotes ? "admin/notes?before=" + before : "admin/queue" + (st ? "?status=" + encodeURIComponent(st) : "")), { headers: auth() });
    const list = $("list");
    list.replaceChildren();
    if (!r.ok) { $("msg").textContent = "Error " + r.status + ": " + ((await r.json().catch(() => ({}))).error || ""); return; }
    const data = await r.json();
    const words = isNotes ? data.notes : data.words;
    $("msg").textContent = words.length ? words.length + (isNotes ? " note(s), newest first" : " word(s)") : "Nothing here.";
    for (const w of words) {
      const a = el("article");
      a.append(el("div", "text", w.text || "(no text kept)"));
      if (w.tr_en || w.tr_ru) a.append(el("div", "tr", [w.tr_en && "en: " + w.tr_en, w.tr_ru && "ru: " + w.tr_ru].filter(Boolean).join(" · ")));
      a.append(el("div", "meta", ["#" + w.id, w.status, w.lang, w.theme, w.day, w.reports ? w.reports + " report(s)" : "", w.voice ? "voice" : "", w.reason].filter(Boolean).join(" · ")));
      const bar = el("div", "bar");
      for (const action of ["publish", "hide"]) {
        const b = el("button", action === "publish" ? "pub" : "", action);
        b.onclick = async () => {
          const r = await fetch(api + (isNotes ? "admin/notes/" : "admin/words/") + w.id, { method: "POST", headers: { ...auth(), "Content-Type": "application/json" }, body: JSON.stringify({ action }) });
          if (r.ok) a.remove(); else $("msg").textContent = "Error " + r.status + ": " + ((await r.json().catch(() => ({}))).error || "");
        };
        bar.append(b);
      }
      a.append(bar);
      list.append(a);
    }
    if (isNotes && data.next) {
      const more = el("button", "", "Older notes");
      more.onclick = () => load(data.next);
      list.append(more);
    }
  }
  $("auth").onsubmit = (e) => { e.preventDefault(); load(); };
</script>
</body>
</html>
