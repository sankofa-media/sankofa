# Two benchmark Griots recording the throwaway control plane (vapi):
# griot-pg: PostgreSQL, two replicas, one leader records, both serve reads.
# griot-sqlite: SQLite on its own volume, one replica.
# IMAGE and BENCH_IMAGE are replaced with digests from push_in_stand (run.sh).
apiVersion: apps/v1
kind: Deployment
metadata: {name: griot-pg, namespace: griot-bench}
spec:
  replicas: 2
  selector: {matchLabels: {app: griot-pg}}
  template:
    metadata: {labels: {app: griot-pg, griot: bench}}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: griot-pg}}}
      containers:
        - name: griot
          image: IMAGE
          args: [--kubeconfig=/pki/kubeconfig, --store=postgres, --leader-elect, --lease-namespace=default,
                 --no-sync, --webhooks=false, --pulse=, --apiservice=, --metrics=:9090,
                 --tls-cert-file=/serving/griot.crt, --tls-key-file=/serving/griot.key,
                 --retention=0, --retain-every=1m, --audit-listen=:9444, --audit-client-ca=/pki/ca.crt]
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: griot-postgres, key: password}}
            - {name: GRIOT_DSN, value: "postgres://griot@postgres.griot-bench.svc:5432/griot?sslmode=disable"}
          ports: [{name: https, containerPort: 8443}, {name: metrics, containerPort: 9090}, {name: audit, containerPort: 9444}]
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}}
          volumeMounts: [{name: pki, mountPath: /pki}, {name: serving, mountPath: /serving}]
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1536Mi}}
      volumes:
        - {name: pki, secret: {secretName: vapi-pki}}
        - {name: serving, secret: {secretName: griot-serving}}
---
apiVersion: v1
kind: Service
metadata: {name: griot-pg, namespace: griot-bench}
spec:
  selector: {app: griot-pg}
  ports: [{name: https, port: 443, targetPort: 8443}, {name: metrics, port: 9090}, {name: audit, port: 9444}]
---
# Phase 1 used the node's disk: a PVC of the default (replicated) class never
# attached. This one uses the kubevirt class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: griot-sqlite, namespace: griot-bench}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kubevirt
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: griot-sqlite, namespace: griot-bench}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: griot-sqlite}}
  template:
    metadata: {labels: {app: griot-sqlite, griot: bench}}
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: griot
          image: IMAGE
          args: [--kubeconfig=/pki/kubeconfig, --store=sqlite, --db=/data/memory.db,
                 --no-sync, --webhooks=false, --pulse=, --apiservice=, --metrics=:9090,
                 --tls-cert-file=/serving/griot.crt, --tls-key-file=/serving/griot.key,
                 --retention=0, --retain-every=1m]
          ports: [{name: https, containerPort: 8443}, {name: metrics, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}}
          volumeMounts: [{name: pki, mountPath: /pki}, {name: serving, mountPath: /serving}, {name: data, mountPath: /data}]
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1536Mi}}
        # The bench binary next to the SQLite file: samples metrics, and
        # `kubectl exec ... griot-bench retain --store sqlite --dsn /data/memory.db`
        # measures retention on the live file.
        - name: bench
          image: BENCH_IMAGE
          args: [metrics, --urls=http://localhost:9090/metrics, --every=10s, --duration=24h]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: pki, secret: {secretName: vapi-pki}}
        - {name: serving, secret: {secretName: griot-serving}}
        - {name: data, persistentVolumeClaim: {claimName: griot-sqlite}}
---
apiVersion: v1
kind: Service
metadata: {name: griot-sqlite, namespace: griot-bench}
spec:
  selector: {app: griot-sqlite}
  ports: [{name: https, port: 443, targetPort: 8443}, {name: metrics, port: 9090}]
