# Names of cards as running text writes them, when the title does not.
#
# The museum links the first mention of a card in a block of text it renders
# from data (the Workshop, the cabinet, documents, country headers, Roots, the
# engine room). It knows every card by its title (without the parenthesis,
# the leading "The" and the subtitle), its `inline` name, and the names below.
# Russian names are given in the nominative: their case forms are matched by
# themselves ("Сан Ра" also finds «Сана Ра», «Сану Ра»).
#
# `never` lists names a title gives that are too often an ordinary word or
# another place of the same name to be linked by themselves.
#
# web/scripts/build-names.ts turns this into data/names.json and writes the
# report of unlinked mentions to dist/link-gaps.txt.
