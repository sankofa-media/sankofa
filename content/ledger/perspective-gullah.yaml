# Perspective rewrite of gullah (2026-11-15): shared frame, {male} Lorenzo Dow Turner, {female} the women who
# carried the Mende song (Amelia Dawley and Baindu Jabati). One entry per fact in the new or rewritten paragraphs.
# The opening explainer paragraph is the existing text, only condensed, and keeps its earlier sourcing; its one
# reworded claim (outsiders dismissed Gullah as broken English) is sourced below.
# Recording year: the Indiana University archive record dates the recording to July 31, 1933 and the Harris Neck
# Land Trust gives 1933; Facing South (1997) says 1932. The archival record is primary, so the card keeps 1933.
# Smithsonian Magazine itself refused automated access (403); its text was read in the Bunk History excerpt.
- card: gullah
  copy: both
  fact: "Outsiders long dismissed Gullah as broken English"
  sources:
    - {title: "College of Charleston: Word, Shout, Song exhibition (2012)", url: "https://today.cofc.edu/2012/01/04/college-to-host-word-shout-song-lorenzo-dow-turner-connecting-community-through-language/", quote: "the Gullah/Geechee communities in South Carolina and Georgia, whose speech was dismissed as \"baby talk\" and \"bad English.\""}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "Americans might still consider Gullah merely broken English, if not for Lorenzo Dow Turner."}
- card: gullah
  copy: both
  fact: "In 1933 at Harris Neck, Georgia, Lorenzo Dow Turner recorded Amelia Dawley singing a song"
  sources:
    - {title: "Indiana University Libraries: Dow Turner Collections", url: "https://libraries.indiana.edu/dow-turner", quote: "Sample 1: A Mende song by Amelia Dawley. July 31, 1933. Harris Neck, Georgia."}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "In 1933 African American linguist Lorenzo Turner and musicologist Lydia Parish visited Harris Neck and recorded 53-year-old Amelia Dawley singing a song that had been taught to her by her mother."}
- card: gullah
  copy: both
  fact: "The song had five lines and was in a language Dawley did not know"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "a five-line song he learned from a woman living in a remote Georgia fishing village, Amelia Dawley. Although Amelia did not know the meaning of the syllables in the song"}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "The song, in a language unknown to Mrs. Dawley, had been passed down in her family from mother to daughter"}
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "She has a five-line song that is essentially the same as Jabati's song, Opala said."}
- card: gullah
  copy: both
  fact: "The song was in Mende, a language of Sierra Leone"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "a Sierra Leonean graduate student in the U.S. recognized it as Mende, his native tongue."}
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "Now Mary Moran knows the song she sings is a funeral song from the Mende people of southern Sierra Leone."}
- card: gullah
  copy: male
  fact: "Turner first heard Gullah in the summer of 1929 at South Carolina State College"
  sources:
    - {title: "University of Chicago Magazine: Lorenzo Dow Turner, PhD'26 (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "While teaching summer school at South Carolina State College in 1929, Turner listened as two students spoke what sounded like broken English."}
    - {title: "American Folklore Society, Notable Folklorists of Color: Lorenzo Dow Turner", url: "https://notablefolkloristsofcolor.org/portfolio/lorenzo-dow-turner/", quote: "During summer 1929, while teaching at South Carolina State College, Dr. Turner heard Black students speaking a distinctive language"}
- card: gullah
  copy: male
  fact: "Earlier scholars heard only imperfect English in Gullah; Turner heard words that were not English"
  sources:
    - {title: "University of Chicago Magazine: Lorenzo Dow Turner, PhD'26 (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "Other linguists had studied it before, but they determined that it contained no vestiges of African languages. [...] \"As he got more used to the speech, he could hear in there the English words, but there were words that were not English,\""}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "Through his recordings, Turner found that many Gullah words did not have any English precursors."}
    - {title: "College of Charleston: Word, Shout, Song exhibition (2012)", url: "https://today.cofc.edu/2012/01/04/college-to-host-word-shout-song-lorenzo-dow-turner-connecting-community-through-language/", quote: "Convinced that the speech pattern was not illiterate English but instead a distinct language incorporating words and structure from African languages"}
    - {title: "Charles Joyner, Afro-American Folklife Scholarship: A Case Study of the Sea Islands (Smithsonian, 1988)", url: "https://folklife-media.si.edu/docs/festival/program-book-articles/FESTBK1988_19.pdf", quote: "Ambrose Elliott Gonzales in The Black Border (1922) and Reed Smith in Gullah (1926) argued that the speech of Black Sea Islanders was the imperfect result of the attempt of \"savage and primitive\" people to acquire the complex language of a more \"highly civilized\" race."}
- card: gullah
  copy: male
  fact: "He took island speakers by rowboat to the mainland, where there was electricity for his hundred-pound recorder"
  sources:
    - {title: "University of Chicago Magazine: Lorenzo Dow Turner, PhD'26 (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "Using a 100-pound recorder [...] he had to transport the participants by rowboat to the mainland, where there was electricity for the recorder."}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "He often had to ferry islanders back to Charleston, as many islands did not have the electricity required to run his cumbersome, hundred pound recording device."}
- card: gullah
  copy: male
  fact: "Africanisms in the Gullah Dialect (1949) traced thousands of Gullah words and personal names to African languages"
  sources:
    - {title: "Folkstreams: Dr. Lorenzo Turner and the Gullah Language", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language", quote: "In his book, Turner listed nearly 4,000 items of African language origin [...] These African retentions (or \"Africanisms\") included thousands of personal names, entire African words"}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Lorenzo Turner, an African American linguist who cataloged more than 3000 names and words of African origin among the Gullah"}
    - {title: "Smithsonian Folkways SFW40258 liner notes", url: "https://folkways-media.si.edu/docs/folkways/artwork/SFW40258.pdf", quote: "Lorenzo Dow Turner noted more than 300 African loanwords and 4,000 personal names used by the Gullah Geechee people in his seminal study Africanisms in the Gullah Dialect (1949)."}
- card: gullah
  copy: male
  fact: "The book showed that slavery had not erased the memory of Africa"
  sources:
    - {title: "University of Chicago Magazine: Lorenzo Dow Turner, PhD'26 (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "\"Until then it was pretty much thought that all of the African knowledge and everything had been erased by slavery. Turner showed that was not true,\" Amos says."}
    - {title: "Indiana University Libraries: Dow Turner Collections", url: "https://libraries.indiana.edu/dow-turner", quote: "Turner proved that there were significant cultural retentions of African cultures among African Americans."}
- card: gullah
  copy: male
  fact: "In 1990, following Turner's recording, Joseph Opala and Cynthia Schmidt found Baindu Jabati in Senehun Ngola still singing the song"
  sources:
    - {title: "Smithsonian Magazine excerpt via Bunk History (2024)", url: "https://bunkhistory.org/resources/how-the-memory-of-a-song-reunited-two-women-separated-by-the-trans-atlantic-slave-trade", quote: "In 1990, the researchers traveled around the country's Pujehun District, playing the song for villagers [...] they found a small village, Senehun Ngola, and a woman named Baindu Jabati who astonished them by singing a nearly identical version of the song."}
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "In 1989, Opala and Schmidt located Turner's recording of Dawley. [...] Finally, Schmidt came upon Baindu Jabati. When Schmidt played a tape recording of the song, Jabati sang along."}
    # Facing South gives no year for the find; the year 1990 rests on Smithsonian (Bunk History) and College of Charleston.
    - {title: "College of Charleston: Word, Shout, Song exhibition (2012)", url: "https://today.cofc.edu/2012/01/04/college-to-host-word-shout-song-lorenzo-dow-turner-connecting-community-through-language/", quote: "a later major discovery by scholars Joseph Opala, Tazieff Schmidt, and Cynthia Koroma who, in 1990, realized a song passed down through generations connected the Mende people of Sierra Leone to their American kin in Georgia."}
- card: gullah
  copy: female
  fact: "The song came down through women; Dawley learned it from her mother"
  sources:
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "a song that had been taught to her by her mother. The song [...] had been passed down in her family from mother to daughter as far back as anyone in Harris Neck could remember."}
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "The song came from her mother, Amelia Dawley. Amelia Dawley got it from her mother, Tawba Shaw, and her grandmother, Catherine, both born in slavery."}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "there was also continuity since the song was passed down by women on both sides."}
- card: gullah
  copy: female
  fact: "In the Georgia family the song was sung to amuse the children"
  sources:
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "They used it to entertain the children. To make them dance."}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Though transformed in plantation culture to a children's rhyme"}
- card: gullah
  copy: female
  fact: "Among the Mende it was a funeral song, and women preside over funerals"
  sources:
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "Women in the Mende culture preside over funerals and births."}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "a dirge performed during a graveside ceremony called Tenjami or \"crossing the river.\" Her grandmother taught her the song because birth and death rites are women's responsibilities in Mende culture."}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "it was sung in Senehun Ngola by women as they prepared the body of a loved one for burial."}
- card: gullah
  copy: female
  fact: "In 1990 Cynthia Schmidt, searching southern Sierra Leone with Joseph Opala and Tazieff Koroma, played the recording in Senehun Ngola and Baindu Jabati sang along"
  sources:
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "In Sierra Leone, Koroma, who's from the Mende tribe, joined Schmidt on a search for the song in Sierra Leone. They went from village to village. Finally, Schmidt came upon Baindu Jabati. When Schmidt played a tape recording of the song, Jabati sang along."}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Opala joined with ethnomusicologist Cynthia Schmidt and Sierra Leonean linguist Tazieff Koroma in an arduous search [...] Koroma recognized one word as unique to a dialect spoken only in southern Sierra Leone. On their last day in the area, Cynthia Schmidt discovered a woman, Baindu Jabati, living in the remote interior village of Senehum Ngola"}
    - {title: "Smithsonian Magazine excerpt via Bunk History (2024)", url: "https://bunkhistory.org/resources/how-the-memory-of-a-song-reunited-two-women-separated-by-the-trans-atlantic-slave-trade", quote: "In 1990, the researchers traveled around the country's Pujehun District, playing the song for villagers"}
- card: gullah
  copy: female
  fact: "Jabati's grandmother taught her the song and foretold that it would one day bring her lost kin"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "At the same time she made the uncanny prediction that there would be a return of lost kinsman and that Baindu would recognize them through this song."}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "Years earlier, Bendu's grandmother had told her that this song, which had been passed down in her village from mother to daughter for centuries, would one day reunite her to long-lost relatives."}
- card: gullah
  copy: female
  fact: "In the civil war rebels razed the village and held Jabati captive"
  sources:
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "Within a few years, Senehun Ngola was burned and flattened. Jabati, apparently the last person in the country who knew the Mende funeral song, was captured and held by rebels."}
    - {title: "Smithsonian Magazine excerpt via Bunk History (2024)", url: "https://bunkhistory.org/resources/how-the-memory-of-a-song-reunited-two-women-separated-by-the-trans-atlantic-slave-trade", quote: "During the conflict, Jabati was enslaved by rebels, who killed several of her family members and razed her village."}
- card: gullah
  copy: both
  fact: "In 1997 Dawley's daughter Mary Moran came to Senehun Ngola and was received with jubilation"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Finally in 1997, Mary Moran and her family could travel and, after a painful visit to Bunce Island, were received with jubilation in Senehum Ngola."}
    - {title: "Facing South: Ties That Bind (1997)", url: "https://facingsouth.org/1997/05/ties-bind", quote: "During the lengthy, musical welcoming procession — reserved for local chiefs and visiting VIPs — hundreds swarmed through the hot, dusty village of Senehun Ngola to greet Moran and her family."}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "In 1997 Amelia's daughter, Mary Moran, and other members of the Moran family were invited to Sierra Leone"}
- card: gullah
  copy: both
  fact: "The two women sang the song together, and the film The Language You Cry In (1998) shows the meeting"
  sources:
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "There, in the small village of Senehun Ngola, Mary and Bendu Jabati met and sang this song together for the first time."}
    - {title: "Smithsonian Magazine excerpt via Bunk History (2024)", url: "https://bunkhistory.org/resources/how-the-memory-of-a-song-reunited-two-women-separated-by-the-trans-atlantic-slave-trade", quote: "By 1997, the war had eased enough for Moran to travel to Senehun Ngola, where her meeting with Jabati was recorded for The Language You Cry In ."}
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "As we watch Mary and Baindu reunited in a tearful rendition of this ancient song"}
