  - card: haya-steel
    fact: "Haya smelting ended in the early 20th century when cheap European tools arrived; only very old people remembered it"
    verdict: corrected
    sources:
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Because the Haya can now buy inexpensive, European-made steel tools ... they stopped producing their own steel some 50 years ago. Thus the only Haya who could recall details of the steelmaking process were very old"}
      - {title: "Nicholas David, Lost in the third hermeneutic?, Mediterranean Archaeology 14 (2001), table 1", url: "https://ucalgary.ca/sukur/Lib/NDavid%20Lostin3HermMeditArch2001.pdf", quote: "Haya NW Tanzania ~1925 1976–84 9 Schmidt 1997 [table 1: date smelting abandoned] ... The Haya on the other hand had not smelted for half a century"}
    note: "Nicholas David quote replaced with verbatim table text."
  - card: haya-steel
    fact: "Peter Schmidt came to study Haya oral history"
    verdict: confirmed
    sources:
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "his goal was to study their complex heritage, which is passed orally from one generation to the next"}
      - {title: "University of Florida Anthropology: Peter Schmidt, PhD", url: "https://anthro.ufl.edu/2019/07/31/peterschmidtarchaeology/", quote: "His research used oral traditions, ethnoarchaeology ... with long-term fieldwork programs in Buhaya, Tanzania"}
    note: ""
  - card: haya-steel
    fact: "With metallurgist Donald Avery; in 1976 elders built a traditional furnace from memory and smelted"
    verdict: confirmed
    sources:
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Two years ago, at the request of the scientists and working entirely from memory, the Haya constructed a traditional furnace ... Metallurgy Professor Donald Avery"}
      - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "Ethnographic and technological observations of iron smelting among the Raya [Haya] people of NW Tanzania during 1976 and 1979"}
    note: ""
  - card: haya-steel
    fact: "Clay blowpipes carried the blast into the furnace; Schmidt and Avery concluded the air was preheated; the smelts of 1976 and 1979 produced steel (attributed by check: preheating remains debated, Nicholas David 2001)"
    verdict: corrected
    sources:
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Using these pipes to force preheated air into the furnace ... high enough to produce their carbon steel"}
      - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "Ethnographic and technological observations of iron smelting among the Raya people of NW Tanzania during 1976 and 1979 ... employed preheating of the air blast—a highly efficient technique—and formed a massive steel"}
    note: "Card stated preheating as fact; reworded as Schmidt and Avery's conclusion, because Nicholas David (2001) notes 'the continuing controversy regarding preheating' (single source, so no dispute field added) and reports that the first smelt was unsuccessful; JFA 1983 abstract (via OpenAlex) confirms steel from the 1976 and 1979 smelts."
  - card: haya-steel
    fact: "From 1977 excavations near Kemondo Bay found furnaces much like the rebuilt one, from the first centuries AD"
    verdict: corrected
    sources:
      - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "Excavations in 1977 at the KM2 site near Kemondo Bay ... dating to the first six centuries A.C., that shared many similarities to the living iron-smelting technology"}
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "they discovered the remnants of 13 furnaces nearly identical in design ... between 1,500 and 2,000 years old"}
    note: "'of the same kind' softened to 'much like it' (Time: 'nearly identical'; JFA: 'shared many similarities')."
  - card: haya-steel
    fact: "In Science (1978) Schmidt and Avery argued Haya forebears 1,500-2,000 years ago used preheating and made carbon steel"
    verdict: confirmed
    sources:
      - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "these people and their forebears 1500 to 2000 years ago practiced a highly advanced iron smelting technology based on preheating principles and, as a result, produced carbon steel"}
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Writing in the current issue of Science, Schmidt and ... Avery ... report that as long as 2,000 years ago, the Haya people were producing medium-carbon steel in preheated, forced-draft furnaces"}
    note: ""
  - card: haya-steel
    fact: "The claim went against a history of iron-making written from European evidence"
    verdict: confirmed
    sources:
      - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "Western scientists and students of history have long explained the iron bloomery process by evidence available from European archeology"}
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "will help to change scholarly and popular ideas that technological sophistication developed in Europe but not in Africa"}
    note: ""
  - card: great-zimbabwe
