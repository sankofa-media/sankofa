    verdict: confirmed
    sources:
      - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "the Haya of northwestern Tanzania"}
      - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "the Haya people of Tanzania on the western shore of Lake Victoria"}
