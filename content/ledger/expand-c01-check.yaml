# Second, independent check (2026-11-14) of content/ledger/expand-c01.yaml (batch c01).
# Every cited URL was reopened (curl; UNESCO and SANParks via archive.org snapshots; Crossref/OpenAlex for the
# Science, JFA and History in Africa abstracts; The Zimbabwean via WebFetch). Each quote was matched verbatim
# (ignoring spacing and punctuation; '...' joins fragments) against the fetched text by script.
# Independence: all sahistory.org.za pages (incl. the Guy and Esterhuysen chapters) count as ONE publisher;
# UNESCO list pages and the ICOMOS evaluation count as one; Pretoria News and The Star are one outlet.
# verdict: confirmed | corrected (card wording or sources changed) | refuted | unconfirmed (removed from the card).
entries:
  - card: blombos-cave
