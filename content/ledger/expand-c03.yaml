# Batch c03 (2026-11-13): every fact in the bodies and wow lines of the c03 cards,
# each with two or more independent sources actually opened and a verbatim quote.
# Britannica, UNESCO and Met pages were read through Wayback Machine snapshots (sites block bots).
- card: djenne-mosque
  fact: "Djenné stands on hillocks above the seasonal floods"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "The city, which sits on hillocks (small hills) known as toguère , becomes an island during the area’s seasonal flooding."}
    - {title: "UNESCO World Heritage Centre: Old Towns of Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/116/", quote: "are built on hillocks ( toguere ) as protection from the seasonal floods"}
- card: djenne-mosque
  fact: "Djenné is one of the oldest towns of sub-Saharan Africa; Djenné-Djeno dates from about 250 BCE"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "Djenné-Jeno , an ancient city dating as far back as 250 bce —one of the oldest known cities in sub-Saharan Africa"}
    - {title: "UNESCO World Heritage Centre: Old Towns of Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/116/", quote: "Inhabited since 250 B.C."}
- card: djenne-mosque
  fact: "Djenné grew as a market on the trans-Saharan gold trade"
  sources:
    - {title: "UNESCO World Heritage Centre: Old Towns of Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/116/", quote: "Djenné became a market centre and an important link in the trans-Saharan gold trade"}
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "its situation at the head of the trade routes to the gold mines of Bitou"}
- card: djenne-mosque
  fact: "Djenné became a centre of Muslim learning"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "By the mid-17th century, Djenné was renowned as a centre of Muslim learning."}
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "The mosque and surrounding town, a historical center of Islamic learning"}
- card: djenne-mosque
  fact: "The Great Mosque is the largest mud-brick building in the world"
  sources:
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "the annual replastering of the world's largest mud-brick building"}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "the mosque is considered the world’s largest earthen structure"}
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "which is the largest mud construction in the world"}
- card: djenne-mosque
  fact: "In the 19th century, under the Fulani ruler Seku Amadu, the old mosque was left in ruins"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "he allowed Djenné’s mosque to fall into ruin"}
    - {title: "Félix Dubois, Timbuctoo the Mysterious (1896), full text", url: "https://archive.org/stream/timbuctoomysteri00duborich/timbuctoomysteri00duborich_djvu.txt", quote: "he commanded the destruction of the old mosque (1830). All that now remains of it is a heap of ruins"}
- card: djenne-mosque
  fact: "The mosque was rebuilt in 1906–07 under French rule, in the local earthen style"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "Under the French, Djenné’s large mud-walled Great Mosque was rebuilt in 1906–07."}
    - {title: "UNESCO World Heritage Centre: Old Towns of Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/116/", quote: "The reconstruction of the Mosque (1906-1907) resulted in the creation of a monument representing local religious architecture."}
    - {title: "Zamani Project: Great Mosque of Djenné", url: "https://zamaniproject.org/site-mali-djenne-great-mosque.html", quote: "constructed in 1907 in Adobe"}
- card: djenne-mosque
  fact: "Upkeep of the mosque is led by Djenné's own masons"
  sources:
    - {title: "UNESCO World Heritage Centre: Old Towns of Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/116/", quote: "The transmission of construction techniques is entrusted to the Barey Corporation, stone masons from generation to generation."}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "Chief mason Mafoune Djenepo inspected the fresh coating."}
- card: djenne-mosque
  fact: "Every year before the rainy season thousands of people replaster the mosque"
  sources:
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "Djenne’s mosque requires a new layer of mud each year before the rainy season starts in June"}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "Thousands of Malians have replastered the iconic earthen mosque in the historic city of Djenne during an annual ceremony"}
- card: djenne-mosque
  fact: "Women and girls carry water for the mud; men and boys climb and apply the new layer"
  sources:
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "Traditionally, women and girls fetch water from the nearby river to mix with clay to make the mud, and men and boys climb the mosque and apply the new layer."}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "one of the women tasked with carrying water for the plaster mix"}
- card: djenne-mosque
  fact: "UNESCO listed Djenné as World Heritage in 1988"
  sources:
    - {title: "Encyclopaedia Britannica: Djenné (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Djenne", quote: "were collectively designated a UNESCO World Heritage site in 1988"}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "has been on UNESCO’s World Heritage list since 1988"}
- card: djenne-mosque
  fact: "Put on the World Heritage in Danger list in 2016 because of the conflict in central Mali; replastering continues"
  sources:
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "The building has been on UNESCO’s World Heritage in Danger list since 2016."}
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "The site was added to the endangered heritage list in 2016 due to its location in central Mali"}
- card: askia-muhammad
  fact: "Songhai, centred on Gao on the middle Niger, dominated the western Sahel in the 15th–16th centuries"
  sources:
    - {title: "Encyclopaedia Britannica: Songhai empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Songhai-empire", quote: "great trading state of West Africa (flourished 15th–16th century), centred on the middle reaches of the Niger River"}
    - {title: "UNESCO World Heritage Centre: Tomb of Askia (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/1139/", quote: "the Songhai Empire, which once dominated the Sahel lands of West Africa"}
- card: askia-muhammad
  fact: "Sonni Ali, the empire's great conqueror, died in 1492"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "Sonni ʿAlī, the ruler who had solidified the Songhai empire from 1464 to 1492"}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "Sunni Ali died in November 1492 and was succeeded by his son, Sunni Baru."}
- card: askia-muhammad
  fact: "In April 1493 Muhammad Ture defeated Sonni Baru, took the throne and the title askia, which named his dynasty"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "In the Battle of Anfao on April 12, 1493, Muḥammad’s forces, though inferior in number, were victorious."}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "met and defeated Baru in April 1493. He declared himself king and took the title of Askia."}
    - {title: "Ousmane Kane, Askiya Muhammad, Encyclopedia of Islam and the Muslim World (Encyclopedia.com)", url: "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/askiya-muhammad-r-1493-1529", quote: "established the dynasty known as the Askiya"}
- card: askia-muhammad
  fact: "He made Islam the religion of the state"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "Establishing Islam as the official religion of the nobles"}
    - {title: "UNESCO World Heritage Centre: Tomb of Askia (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/1139/", quote: "Islam was adopted as the official religion"}
- card: askia-muhammad
  fact: "In 1496 he set off on pilgrimage to Mecca"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "in 1496 Muḥammad undertook a pilgrimage to Mecca"}
    - {title: "Ousmane Kane, Askiya Muhammad, Encyclopedia of Islam and the Muslim World (Encyclopedia.com)", url: "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/askiya-muhammad-r-1493-1529", quote: "In 1496, Askiya Muhammad set off for the pilgrimage to Mecca."}
- card: askia-muhammad
  fact: "He came home with the title of caliph"
  sources:
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "named him the Caliph of the Western Sudan"}
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "the jinn of Mecca had had Muḥammad named caliph"}
    - {title: "Ousmane Kane, Askiya Muhammad, Encyclopedia of Islam and the Muslim World (Encyclopedia.com)", url: "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/askiya-muhammad-r-1493-1529", quote: "appointed by the Abbassid caliph al-Mutwakkil as his deputy to rule Songhai in his name"}
- card: askia-muhammad
  fact: "He organised provinces under governors"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "dividing Songhai into provinces and placed each under a governor"}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "four great provinces, each governed by members, or favorites, of the ruling family"}
- card: askia-muhammad
  fact: "He built a professional army and a fleet of war canoes"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "A standing army and a fleet of war canoes were organized"}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "he advanced the professionalization of the army that had been started by Ali and built a stronger navy"}
- card: askia-muhammad
  fact: "His campaigns reached west towards the Atlantic and east into the Hausa states"
  sources:
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "he eventually expanded almost to the Atlantic coast. In the east ... conquering for the first time much of Hausaland by 1512"}
    - {title: "Encyclopaedia Britannica: Songhai empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Songhai-empire", quote: "against the kingdom of Fouta-Toro in Senegal , and to the east against the Hausa states"}
- card: askia-muhammad
  fact: "In 1528, old and nearly blind, he was deposed and his eldest son Musa took the throne"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia: Fall from power and death, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia/Fall-from-power-and-death", quote: "Embittered, half blind ... Musa, his eldest son, plotted against him ... Musa then dispossessed his father, taking the name Askia Mūsā."}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "Muhammad himself was deposed by three of his sons in 1528, when he was old and blind. The eldest of these sons, Musa, took the throne"}
    - {title: "Ousmane Kane, Askiya Muhammad, Encyclopedia of Islam and the Muslim World (Encyclopedia.com)", url: "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/askiya-muhammad-r-1493-1529", quote: "He was deposed in 1528 by his son Musa."}
- card: askia-muhammad
  fact: "He was exiled to an island in the Niger"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia: Fall from power and death, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia/Fall-from-power-and-death", quote: "the old Askia Muḥammad was banished to an island in the river"}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "promptly exiled his uncle to an island on the Niger River, where he remained until 1537"}
- card: askia-muhammad
  fact: "In 1537 his son Ismail took power and brought him back to Gao, where he died in 1538"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia: Fall from power and death, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia/Fall-from-power-and-death", quote: "In 1537 his third successor, his son Askia Ismaïl, recalled his father to Gao."}
    - {title: "Encyclopedia of World Biography: Askia Muhammad Ture (Encyclopedia.com)", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/askia-muhammad-ture", quote: "until 1537, when another son, Ismail, gained the throne and recalled him. By then Askia Muhammad was ill, and he died the next year."}
- card: askia-muhammad
  fact: "He was buried in Gao under the earthen pyramid he built, which still stands"
  sources:
    - {title: "Jean Rouch, Muhammad I Askia: Fall from power and death, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia/Fall-from-power-and-death", quote: "He was buried in Gao, under a pyramid of earth surmounted by wooden spikes. His tomb is still standing"}
    - {title: "UNESCO World Heritage Centre: Tomb of Askia (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/list/1139/", quote: "The spectacular pyramidal structure was built by Askia Mohamed, Emperor of the Songhai Empire in 1495."}
- card: askia-muhammad
  fact: "His reign is told in the Tarikh al-Sudan and the Tarikh al-Fattash"
  sources:
    - {title: "Ousmane Kane, Askiya Muhammad, Encyclopedia of Islam and the Muslim World (Encyclopedia.com)", url: "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/askiya-muhammad-r-1493-1529", quote: "According to the two Tawarikh, or \"histories\" ( Tarikh al-Sudan and Tarikh al-Fattash )"}
    - {title: "Jean Rouch, Muhammad I Askia, Encyclopaedia Britannica (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/biography/Muhammad-I-Askia", quote: "The chronicler Mahmud Kati, who accompanied Muḥammad, wrote in Taʾrīkh al-fattāsh"}
- card: koumbi-saleh
  fact: "Ghana, called Wagadu by its rulers and unrelated to the modern republic, was the first great trading empire of the western Sahel"
  sources:
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "Ghana , first of the great medieval trading empires of western Africa ... Called Wagadu by its rulers"}
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "Ghana (Wagadu), the earliest known empire of the western Sudan ... modern-day and ancient Ghana share no direct historical connections"}
- card: koumbi-saleh
  fact: "By the end of the 8th century its fame had reached North Africa"
  sources:
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "first entered the historical consciousness of North Africa near the end of the eighth century"}
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "The first written references to the empire are those of Arabic geographers and historians from the 8th century"}
- card: koumbi-saleh
  fact: "Its Soninke kings stood between Saharan salt traders and the gold of the south; North Africans called it the land of gold"
  sources:
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "Ghana was populated by Soninke clans of Mande -speaking people who acted as intermediaries between the Arab and Amazigh ( Berber ) salt traders to the north and the producers of gold and ivory to the south."}
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "Famous to North Africans as the “Land of Gold,”"}
- card: koumbi-saleh
  fact: "The 11th-century Andalusian geographer al-Bakri described the capital"
  sources:
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "According to the 11th-century Spanish-Arab chronicler Abū ʿUbayd al-Bakrī"}
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "the eleventh-century Andalusian geographer Abu ‘Ubayd al-Bakri"}
- card: koumbi-saleh
  fact: "The capital was two towns on a plain; the Muslim merchants' town had twelve mosques"
  sources:
    - {title: "Al-Bakri on Ghana (trans. Levtzion & Hopkins), Boston University African Studies Center", url: "https://www.bu.edu/africa/outreach/teachingresources/history/ancient-to-medieval-history/k_o_ghana/", quote: "The city of Ghana consists of two towns situated on a plain. One of these towns, which is inhabited by Muslims, is large and possesses twelve mosques"}
    - {title: "El-Bekri, Description de l'Afrique septentrionale, trans. de Slane, full text (archive.org)", url: "https://archive.org/details/fr103andalus05", quote: "GHANA se compose de deux villes situées dans une plaine. Celle qui est habitée par les musulmans est très grande et renferme douze mosquées"}
    - {title: "Encyclopaedia Britannica: Kumbi (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Kumbi", quote: "two cities, one of which was occupied by the king, the other by Muslim traders"}
- card: koumbi-saleh
  fact: "The king's town lay six miles away, with dwellings all the way between"
  sources:
    - {title: "Al-Bakri on Ghana (trans. Levtzion & Hopkins), Boston University African Studies Center", url: "https://www.bu.edu/africa/outreach/teachingresources/history/ancient-to-medieval-history/k_o_ghana/", quote: "The king’s town is six miles distant from this one… Between these two towns are continuous habitations."}
    - {title: "El-Bekri, Description de l'Afrique septentrionale, trans. de Slane, full text (archive.org)", url: "https://archive.org/details/fr103andalus05", quote: "La ville habitée par le roi est à six milles de celle-ci ... Le territoire qui les sépare est couvert d'habitations."}
- card: koumbi-saleh
  fact: "The king held audience in a pavilion ringed by ten horses in gold cloth, guarded by fine dogs in gold and silver collars"
  sources:
    - {title: "Al-Bakri on Ghana (trans. Levtzion & Hopkins), Boston University African Studies Center", url: "https://www.bu.edu/africa/outreach/teachingresources/history/ancient-to-medieval-history/k_o_ghana/", quote: "a domed pavilion around which stand ten horses covered with gold-embroidered materials ... At the door of the pavilion are dogs of excellent pedigree ... Round their necks they wear collars of gold and silver"}
    - {title: "El-Bekri, Description de l'Afrique septentrionale, trans. de Slane, full text (archive.org)", url: "https://archive.org/details/fr103andalus05", quote: "il s’assied dans un pavillon, autour duquel sont rangés dix chevaux couverts de caparaçons en étoffes d’or ... La porte du pavillon est gardée par des chiens d'une race excellente ... ils portent des colliers d’or et d'argent"}
- card: koumbi-saleh
  fact: "Koumbi Saleh in southeastern Mauritania is taken to be the capital, but the identification is tentative"
  sources:
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "that of the 11th century has been tentatively identified by archaeologists as Kumbi (or Koumbi Saleh)"}
    - {title: "UNESCO Tentative List: Site archéologique de Koumbi Saleh (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/tentativelists/1546/", quote: "Le site de Kumbi Saleh, capitale de l'Empire du Ghana"}
- card: koumbi-saleh
  fact: "Archaeologists dug there in campaigns across the 20th century, uncovering the remains of a large town"
  sources:
    - {title: "UNESCO Tentative List: Site archéologique de Koumbi Saleh (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/tentativelists/1546/", quote: "il n'a été fouillé qu'a partir de 1939 ... A partir de 1960, Serge Robert et Sophie berthier ont entamé la fouille de nouvelles concessions ... l'emploi très particulier des plaques de schiste ... dont le périmètre dépasse 10 km"}
    - {title: "S. K. McIntosh, review of Berthier (1997), Journal of African History 41 (2000)", url: "https://cambridge.org/core/journals/journal-of-african-history/article/abs/capital-of-ancient-ghana-recherches-archeologiques-sur-la-capitale-de-lempire-de-ghana-etude-dun-secteur-dhabitat-a-koumbi-saleh-mauritanie-campagnes-iiiiiivv-197576-198081-by-sophie-berthier-cambridge-monographs-in-african-archaeology-41-oxford-archaeopress-1997-pp-143-33-isbn-0860548686/BCAB90B691F44378B364DA4A2AA161A5", quote: "Etude d'un secteur d'habitat à Koumbi Saleh, Mauritanie. Campagnes II–III–IV–V, 1975–76 – 1980–81"}
    - {title: "Encyclopaedia Britannica: Kumbi (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Kumbi", quote: "at the height of its prosperity, before 1240, was the greatest city of western Africa with a population of more than 15,000"}
- card: koumbi-saleh
  fact: "Ghana weakened in the late 11th century in a long struggle with the Almoravids"
  sources:
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "Ghana’s preeminence faded toward the end of the eleventh century, when its power was broken by a long struggle with the Almoravids"}
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "Ghana began to decline in the 11th century with the emergence of the Muslim Almoravids"}
- card: koumbi-saleh
  fact: "Ghana then fell to the Soso"
  sources:
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Ghana Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ghan/hd_ghan.htm", quote: "Ghana subsequently fell to the expanding Soso kingdom."}
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "in 1203, one of these, the Susu , occupied the capital"}
- card: koumbi-saleh
  fact: "Sunjata defeated the Soso and power passed to his new empire of Mali"
  sources:
    - {title: "Met Heilbrunn Timeline: The Empires of the Western Sudan: Mali Empire (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/mali/hd_mali.htm", quote: "Sundiata Keita (“the hungering lion”) led a Mande revolt against the powerful Soso king Sumanguru Kante that marked the ascension of the Mali empire"}
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "what was left of the empire of Ghana was incorporated into his new empire of Mali"}
- card: koumbi-saleh
  fact: "The town was abandoned in the 13th century"
  sources:
    - {title: "UNESCO Tentative List: Site archéologique de Koumbi Saleh (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://whc.unesco.org/en/tentativelists/1546/", quote: "son abandon n'est attesté que vers la moitié du 13è\" siècle"}
    - {title: "Encyclopaedia Britannica: Ghana, historical West African empire (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Ghana-historical-West-African-empire", quote: "In 1240 the city was destroyed by the Mande emperor Sundiata"}
- card: nok-terracottas
  fact: "Nok people in central Nigeria made fired-clay figures of people and animals in the first millennium BCE"
  sources:
    - {title: "Encyclopaedia Britannica: Nok culture (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nok-culture", quote: "The most characteristic Nok artifacts are clay figurines of animals and stylized human beings"}
    - {title: "Dunne, Höhn et al., Making the invisible visible (University of Bristol repository)", url: "https://research-information.bris.ac.uk/ws/portalfiles/portal/313538950/NOK_plant_paper_final_version_re_reviewer_comments.pdf", quote: "The Middle Nok phase, considered the main phase of the Nok culture ... is marked by the abundant presence of terracotta figurines"}
- card: nok-terracottas
  fact: "They are the earliest large figurative sculptures known in Africa outside Egypt"
  sources:
    - {title: "Dunne, Höhn et al., Making the invisible visible (University of Bristol repository)", url: "https://research-information.bris.ac.uk/ws/portalfiles/portal/313538950/NOK_plant_paper_final_version_re_reviewer_comments.pdf", quote: "terracotta figurines which constitute the earliest large-sized figurative art objects in Africa outside Egypt"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "the Nok sculptural tradition emerged in the ninth century B.C., making it the oldest in Africa outside of Egypt"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "the Nok terracotta figurines became the earliest large-sized figurative art"}
- card: nok-terracottas
  fact: "Most show people with elaborate hairstyles, and the eyes are pierced through"
  sources:
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "ELABORATE HAIRSTYLES for both men and women ... PERFORATIONS in the pupils, nostrils, mouth, and ears"}
    - {title: "Encyclopaedia Britannica: Nok culture (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nok-culture", quote: "perforated eyes of an elliptical or triangular shape are typical of the style"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "Head of a human Nok terracotta figurine with elaborate hairstyle or headgear"}
- card: nok-terracottas
  fact: "The first piece, a small monkey head, turned up in 1928 in the tin mines around Nok"
  sources:
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "One piece, too striking to be disregarded, appeared in 1928: a small monkey head, sculpted in terra-cotta."}
    - {title: "Encyclopaedia Britannica: Nok culture (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nok-culture", quote: "First discovered in 1928 in the small tin-mining village of Nok"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "The first figurine was found in 1928."}
- card: nok-terracottas
  fact: "A head found in 1943 that had served as a scarecrow reached the British archaeologist Bernard Fagg in Jos"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "In 1943, British archaeologist Bernard Fagg received a visitor in the central Nigerian town of Jos ... The visitor carried a terracotta head that, he said, had been perched atop a scarecrow in a nearby yam field."}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "a miner found another terra-cotta head and took it home, where he used it as a scarecrow ... brought it to Jos, where he showed it to Bernard Fagg"}
- card: nok-terracottas
  fact: "Fagg gathered nearly 200 pieces in a few years and named the culture after Nok"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "soon gathered nearly 200 terracottas through purchase, persuasion, and his own excavations ... which he named Nok"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "In the course of just a few years ... Fagg managed to collect almost 200 terra-cottas"}
- card: nok-terracottas
  fact: "At Taruga Fagg found iron-smelting furnaces with figurines inside and around them"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "One excavation site, near the village of Taruga, revealed something else Fagg had not expected: iron furnaces ... inside the furnaces and around them"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "no fewer than 13 iron-smelting furnaces ... Nok figurines were found close by and even inside these furnaces"}
- card: nok-terracottas
  fact: "Demand among collectors in Europe and the US fuelled illegal digging that destroyed sites"
  sources:
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "high demand for Nok terra-cottas among collectors in Europe and the U.S. This encouraged hundreds of clandestine excavations"}
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "an almost 40-year campaign of looting at Nok sites fed by the growing appetite for African antiquities among collectors in the United States and Europe"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "the Nok Culture became a victim of illegal diggings and internationally operating art dealers"}
- card: nok-terracottas
  fact: "In the 2000s a Frankfurt team under Breunig and Rupp, with Nigerian researchers and villagers including former diggers, resumed excavation"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "Breunig and his colleague Nicole Rupp are leading a team of German and Nigerian researchers, students, and even former looters"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "many villagers have joined our team since the beginning of initial fieldwork in 2005"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "Peter Breunig, who resumed research into Nok culture in the 2000s"}
- card: nok-terracottas
  fact: "Radiocarbon dates place the figures back to about 900 BCE"
  sources:
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "Recent radiocarbon measurements of charcoal particles from the interior of terracotta figurines point to earlier dates of 800 to 900 BCE"}
    - {title: "Dunne, Höhn et al., Making the invisible visible (University of Bristol repository)", url: "https://research-information.bris.ac.uk/ws/portalfiles/portal/313538950/NOK_plant_paper_final_version_re_reviewer_comments.pdf", quote: "Middle Nok (900-400 BC)"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "the Nok sculptural tradition emerged in the ninth century B.C."}
- card: nok-terracottas
  fact: "Nok holds some of the earliest evidence for iron working in West Africa"
  sources:
    - {title: "Dunne, Höhn et al., Making the invisible visible (University of Bristol repository)", url: "https://research-information.bris.ac.uk/ws/portalfiles/portal/313538950/NOK_plant_paper_final_version_re_reviewer_comments.pdf", quote: "some of the earliest evidence for iron production in West Africa, c. mid-first millennium BC"}
    - {title: "Breunig & Rupp, Outline of a New Research Project on the Nok Culture, Nyame Akuma 73 (2010)", url: "https://static1.squarespace.com/static/5bd0e66f8d97400eb0099556/t/5bddff4c8a922de6f7b1a874/1541275468604/Nyame+Akuma+Issue+073-breunig.pdf", quote: "iron- smelting furnaces in Nok contexts ... amongst the earliest evidence of metallurgy in sub- Saharan Africa"}
- card: nok-terracottas
  fact: "The scarecrow head is known as the Jemaa Head after its village"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "the scarecrow head—now called the Jemaa Head after the village where it was found"}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "which is now known as the Jemaa Head, after the village where it was found"}
- card: nok-terracottas
  fact: "Fagg's early dating put Nok around 500 BCE (dispute)"
  sources:
    - {title: "Roger Atwood, The Nok of Nigeria, Archaeology (AIA)", url: "https://archaeology.org/issues/online/features/the-nok-of-nigeria/", quote: "Soil analysis from the spots where the artifacts were found dated them to around 500 B.C."}
    - {title: "Carlos Micó, The ancient Nigerian sculptures that rewrote African history, National Geographic", url: "https://www.nationalgeographic.com/history/article/nigeria-nok-terra-cotta", quote: "Analysis of the soil layers where the pieces were found yielded dates of around 500 B.C."}
- card: igbo-ukwu
  fact: "Igbo-Ukwu is in the lower Niger region of southeastern Nigeria"
  sources:
    - {title: "Smarthistory: Igbo-Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/igbo-ukwu/", quote: "flourished in the Lower Niger region of modern-day Nigeria"}
    - {title: "Encyclopaedia Britannica: Igbo Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Igbo-Ukwu", quote: "Igbo Ukwu, near the southwestern city of Onitsha"}
- card: igbo-ukwu
  fact: "Around the 9th century a wealthy society, ancestors of today's Igbo, cast the bronzes"
  sources:
    - {title: "Encyclopaedia Britannica: Igbo Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Igbo-Ukwu", quote: "ancestors of the modern Igbo (Ibo) had, as early as the 9th century, a sophisticated society with surpluses of wealth"}
    - {title: "Alice Apley, Igbo-Ukwu (ca. 9th Century), Met Heilbrunn Timeline (Wayback snapshot)", url: "https://web.archive.org/web/2020/http://www.metmuseum.org/toah/hd/igbo/hd_igbo.htm", quote: "The people of Igbo-Ukwu, ancestors of present-day Igbo"}
- card: igbo-ukwu
  fact: "The objects include ritual vessels, pendants, a crown and staff ornaments"
  sources:
    - {title: "Alice Apley, Igbo-Ukwu (ca. 9th Century), Met Heilbrunn Timeline (Wayback snapshot)", url: "https://web.archive.org/web/2020/http://www.metmuseum.org/toah/hd/igbo/hd_igbo.htm", quote: "In addition to a variety of ritual vessels ... including pendants, crowns and breastplates, staff ornaments"}
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "Receptacles 25 ... Pendants, anklets, wristlets, belt ... Staff heads, ornaments ... Crown"}
- card: igbo-ukwu
  fact: "Made by lost-wax in leaded bronze, they are the earliest artistic castings known from sub-Saharan Africa"
  sources:
    - {title: "Encyclopaedia Britannica: Igbo Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Igbo-Ukwu", quote: "elaborate castings of leaded bronze. The earliest artistic castings from sub-Saharan Africa"}
    - {title: "Alice Apley, Igbo-Ukwu (ca. 9th Century), Met Heilbrunn Timeline (Wayback snapshot)", url: "https://web.archive.org/web/2020/http://www.metmuseum.org/toah/hd/igbo/hd_igbo.htm", quote: "They are likely among the earliest groups of West Africans to employ the lost-wax casting techniques"}
- card: igbo-ukwu
  fact: "In 1938 Isaiah Anozie, digging a water cistern in his compound, struck dozens of cast objects"
  sources:
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "dates to 1938, when Isaiah Anozie was digging a water cistern at his compound"}
    - {title: "Smarthistory: Igbo-Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/igbo-ukwu/", quote: "In 1938, while digging a cistern on his property, Nigerian farmer Isaiah Anozie unearthed dozens of intricate objects made of cast bronze."}
- card: igbo-ukwu
  fact: "In 1959–60 Thurstan Shaw excavated and named three sites after the Anozie brothers"
  sources:
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "From November 1959 to February 1960, Shaw excavated in Isaiah Anozie’s compound (Igbo Isaiah) ... Igbo Richard (left), Igbo Isaiah (center), and Igbo Jonah (right)"}
    - {title: "Smarthistory: Igbo-Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/igbo-ukwu/", quote: "Shaw uncovered three sites on the Anozie family property, and he named them after the Anozie brothers"}
- card: igbo-ukwu
  fact: "Igbo Isaiah held a store of ritual bronzes; Igbo Richard a high-ranking burial with beaded wristlets and anklets, pectoral and copper crown"
  sources:
    - {title: "Smarthistory: Igbo-Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/igbo-ukwu/", quote: "In Igbo Isaiah (top of page), Shaw found a repository of elaborate cast bronze objects ... Igbo Richard contained evidence of an elite burial"}
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "the extravagant personal adornment, including beaded wristlets and anklets, a pectoral, and a copper crown or diadem"}
- card: igbo-ukwu
  fact: "The sites yielded more than 100,000 glass and carnelian beads"
  sources:
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "plus over 165,000 glass and carnelian beads"}
    - {title: "Smarthistory: Igbo-Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/igbo-ukwu/", quote: "Shaw found over 100,000 glass beads"}
- card: igbo-ukwu
  fact: "Shaw's radiocarbon dates pointed to the 9th century; age and origins of materials have been debated since"
  sources:
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "Shaw considered that the four clustered dates exhibited a “striking congruence…in the ninth century AD” ... has generated decades of debate on the possible origins of these materials and their technology and likely chronology"}
    - {title: "Alice Apley, Igbo-Ukwu (ca. 9th Century), Met Heilbrunn Timeline (Wayback snapshot)", url: "https://web.archive.org/web/2020/http://www.metmuseum.org/toah/hd/igbo/hd_igbo.htm", quote: "(though this date remains controversial)"}
- card: igbo-ukwu
  fact: "Igbo-Ukwu's casters worked centuries before Benin and Ife, in a style of their own"
  sources:
    - {title: "Encyclopaedia Britannica: Igbo Ukwu (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/place/Igbo-Ukwu", quote: "Some three or four centuries later, the smiths of Ife ... a highly developed bronze art with a distinctive style of its own"}
    - {title: "Alice Apley, Igbo-Ukwu (ca. 9th Century), Met Heilbrunn Timeline (Wayback snapshot)", url: "https://web.archive.org/web/2020/http://www.metmuseum.org/toah/hd/igbo/hd_igbo.htm", quote: "bronze casting developed several centuries later in other parts of Nigeria"}
    - {title: "S. K. McIntosh, Igbo-Ukwu at 50, African Archaeological Review (2022), PMC", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", quote: "“utterly unlike the work of either Benin or Ife"}
- card: ife-heads
  fact: "For the Yoruba Ife is where the world and humans were made and the seat of sacred kingship; the Ooni descends from Oduduwa"
  sources:
    - {title: "Met Heilbrunn Timeline: Ife (from ca. 6th Century) (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ife/hd_ife.htm", quote: "According to the Yoruba worldview, Ife is the place of origin of all humankind ... it remains the seat of Yoruba sacred kingship. The oni (king) of Ife, himself considered to be descended from the god Odudua"}
    - {title: "The British Museum, Head of a ruler, Ife, Smarthistory (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/?p=57972", quote: "Today, Ife is regarded as the legendary homeland of the Yoruba-speaking peoples. Even today, its ruler is thought of as the descendant of the original creator gods."}
- card: ife-heads
  fact: "Between the 12th and 15th centuries Ife was a rich city-state making naturalistic sculpture in terracotta, stone and copper alloys"
  sources:
    - {title: "British Museum press release: Kingdom of Ife (2010) (Wayback snapshot)", url: "https://web.archive.org/web/2012/http://www.britishmuseum.org/about_us/news_and_press/press_releases/2010/kingdom_of_ife.aspx", quote: "From the 12th to the 15th centuries, Ife flourished as a powerful, cosmopolitan and wealthy city-state ... a refined and highly naturalistic sculptural tradition in stone, terracotta, brass and copper-alloy"}
    - {title: "Met Heilbrunn Timeline: Ife (from ca. 6th Century) (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ife/hd_ife.htm", quote: "Between ca. 1200 and 1500, Ife developed into a flourishing artistic center. The discovery of Ife’s now famous naturalistic bronzes, terracottas, and stone sculptures"}
- card: ife-heads
  fact: "In 1910 Leo Frobenius dug at Ife"
  sources:
    - {title: "BBC Radio 4, A History of the World in 100 Objects, ep. 63 transcript", url: "https://www.bbc.co.uk/ahistoryoftheworld/about/transcripts/episode63/", quote: "In 1910, when the German anthropologist Leo Frobenius found the very first brass head in a shrine outside the city of Ife"}
    - {title: "Lost in Space? Reconstructing Frank Willett's excavations at Ita Yemoo, Afrique: Archéologie & Arts 17 (2021)", url: "https://journals.openedition.org/aaa/3328", quote: "In 1910, the German anthropologist Leo Frobenius was the first European scholar to excavate here"}
    - {title: "Curator, National Museum Ile-Ife: address at Frobenius Institute exhibition (PDF)", url: "https://frobenius-institut.de/images/stories/Ausstellungen/Nigeria/speech%20adesina.pdf", quote: "in November 1910, he visited lle-lfe and carried out \"crude\" excavations in Olokun grove"}
- card: ife-heads
  fact: "Frobenius decided the art descended from Atlantis"
  sources:
    - {title: "BBC Radio 4, A History of the World in 100 Objects, ep. 63 transcript", url: "https://www.bbc.co.uk/ahistoryoftheworld/about/transcripts/episode63/", quote: "The lost island of Atlantis must have sunk off the coast of Nigeria, and the Greek survivors stepped ashore to make this astonishing sculpture."}
    - {title: "James Kline, Leo Frobenius, EBSCO Research Starters", url: "https://ebsco.com/research-starters/history/leo-frobenius", quote: "Frobenius was so impressed with the Yoruba culture that he imagined that he had discovered the descendants of Atlantis."}
    - {title: "Curator, National Museum Ile-Ife: address at Frobenius Institute exhibition (PDF)", url: "https://frobenius-institut.de/images/stories/Ausstellungen/Nigeria/speech%20adesina.pdf", quote: "His reports and comments about Ife Arts and Civilization being evidence of the lost Atlantis of the Greeks"}
- card: ife-heads
  fact: "In 1938 an accidental find in the Wunmonije compound near the Ooni's palace revealed a cache of cast heads; some eighteen such Ife heads are known"
  sources:
    - {title: "Curator, National Museum Ile-Ife: address at Frobenius Institute exhibition (PDF)", url: "https://frobenius-institut.de/images/stories/Ausstellungen/Nigeria/speech%20adesina.pdf", quote: "The accidental finds of about eighteen (18) exquisite Bronze heads in one single location in Wunmonije Compound near Ooni's palace in 1938"}
    - {title: "Lost in Space? Reconstructing Frank Willett's excavations at Ita Yemoo, Afrique: Archéologie & Arts 17 (2021)", url: "https://journals.openedition.org/aaa/3328", quote: "In 1938, the accidental unearthing in the courtyard of the Wunmonjie compound of an impressive cache of new brass heads"}
    - {title: "British Museum/BBC, A History of the World: Ife head (object page)", url: "https://www.bbc.co.uk/ahistoryoftheworld/objects/Z1CgMudYTJWzpTi-TW1IAA", quote: "Eighteen heads have been found in total"}
- card: ife-heads
  fact: "The finds caused a sensation; Europeans at first assumed African artists could not have made them"
  sources:
    - {title: "The British Museum, Head of a ruler, Ife, Smarthistory (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://smarthistory.org/?p=57972", quote: "created a sensation in the western world. It was initially assumed that these beautiful sculptures could not have been made in Africa by African artists."}
    - {title: "Met Heilbrunn Timeline: Ife (from ca. 6th Century) (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ife/hd_ife.htm", quote: "challenged European assumptions about the nature of African art"}
    - {title: "Lost in Space? Reconstructing Frank Willett's excavations at Ita Yemoo, Afrique: Archéologie & Arts 17 (2021)", url: "https://journals.openedition.org/aaa/3328", quote: "shook the Western perception of African art"}
- card: ife-heads
  fact: "Later excavations dated Ife sculpture to the 12th–15th centuries and confirmed it as Ife's own work"
  sources:
    - {title: "Curator, National Museum Ile-Ife: address at Frobenius Institute exhibition (PDF)", url: "https://frobenius-institut.de/images/stories/Ausstellungen/Nigeria/speech%20adesina.pdf", quote: "excavations conducted in Ife since 1943 ... revealed large quantities of sculptures dated between 12 and 15 Centuries further confirmed Leo-Frobenius report about the originality of Ife Arts"}
    - {title: "British Museum press release: Kingdom of Ife (2010) (Wayback snapshot)", url: "https://web.archive.org/web/2012/http://www.britishmuseum.org/about_us/news_and_press/press_releases/2010/kingdom_of_ife.aspx", quote: "From the 12th to the 15th centuries, Ife flourished"}
- card: ife-heads
  fact: "The heads forced Europeans to rethink Africa's place in the history of art"
  sources:
    - {title: "BBC Radio 4, A History of the World in 100 Objects, ep. 63 transcript", url: "https://www.bbc.co.uk/ahistoryoftheworld/about/transcripts/episode63/", quote: "they forced Europeans to rethink Africa's place in the cultural history of the world"}
    - {title: "Met Heilbrunn Timeline: Ife (from ca. 6th Century) (Wayback snapshot)", url: "https://web.archive.org/web/2020/https://www.metmuseum.org/toah/hd/ife/hd_ife.htm", quote: "initiated significant debates concerning the antiquity of its past"}
- card: meroitic-script
  fact: "Meroitic is the writing of Kush, whose capital Meroë stood on the Nile in Sudan some 200 km from Khartoum"
  sources:
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "Meroë, a city which is about 6 km north-east of the modern Kabushiya station near Shendi, Sudan, about 200 km north-east of modern Khartoum"}
    - {title: "BBC News: Sudan statues show ancient script (16 Dec 2008)", url: "https://news.bbc.co.uk/2/hi/africa/7786361.stm", quote: "a site close to Sudan's 50-odd Meroe pyramids, about 200 km (120 miles) north of the capital Khartoum"}
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "Meroitic was the language of the ancient kingdom of Kush, in Northern Sudan."}
- card: meroitic-script
  fact: "It appeared around 200 BCE and lasted until after the fall of Meroë in the 4th century CE"
  sources:
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "The language was used from about 200 bce until about the 4th century ce ."}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "Meroitic was used until some time after the fall of the Meroitic Empire in the first half of the fourth century CE"}
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "The script actually outlived the fall of Meroe (ca. AD 350)"}
- card: meroitic-script
  fact: "Two forms: hieroglyphs from Egyptian for royal/religious monuments, cursive from demotic for the rest"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "The Meroites used two different scripts, cursive and hieroglyphic ... The hieroglyphic script was restricted to the royal sphere ... cursive script is an offshoot of early Ptolemaic demotic"}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "The script has a monumental form, derived from Egyptian Hieroglyphs, and a cursive form, derived from Egyptian Demotic, which was used considerably more frequently"}
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "hieroglyphic, used mainly for royal or religious inscriptions in stone"}
- card: meroitic-script
  fact: "Each form has 23 signs"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "Both sets amount to twenty-three signs plus a word-divider"}
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "each script having 23 signs"}
- card: meroitic-script
  fact: "Written usually right to left"
  sources:
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "Texts were usually written from right to left"}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "The direction of writing is right-to-left"}
- card: meroitic-script
  fact: "Dots divide words and phrases"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "a word-divider, made of three dots in early cursive and hieroglyphic scripts, reduced to two dots in later cursive script"}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "Three vertical dots are used in Hieroglyphs and early Cursive"}
- card: meroitic-script
  fact: "It is an alphasyllabary with an inherent a"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "alphasyllabary (Hintze 1973), comparable to Indic, Ethiopic or Old Persian ... inherent /a/"}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "If there is no vowel inserted between two consonants, the consonant is read with an inherent a."}
- card: meroitic-script
  fact: "Francis Llewellyn Griffith deciphered it around 1910, starting from funerary inscriptions"
  sources:
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "The funerary texts are the most numerous, and it was with these that scholars, notably Francis L. Griffith, began the decipherment in 1910."}
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "Both of them were deciphered between 1909 and 1911 by the British Egyptologist Francis Llewelyn Griffith"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "Griffith began deciphering the Meroitic script in 1910"}
- card: meroitic-script
  fact: "No bilingual text has been found; beyond names, titles and a few words it remains largely untranslated"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "The reason for the poor knowledge of the language is the lack of bilingual texts"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "it remains only partially decrypted, due to a lack of bilingual texts"}
    - {title: "Everson, Proposal for encoding Meroitic, WG2 N3665 (2009)", url: "https://www.unicode.org/L2/L2009/09250-n3665-meroitic.pdf", quote: "the language itself remains unknown, apart from names and a few other words"}
    - {title: "BBC News: Sudan statues show ancient script (16 Dec 2008)", url: "https://news.bbc.co.uk/2/hi/africa/7786361.stm", quote: "we can't understand it, apart from a few long words and the names of people"}
- card: meroitic-script
  fact: "Some linguists place Meroitic in Eastern Sudanic (Nilo-Saharan), close to Nubian"
  sources:
    - {title: "Claude Rilly, Recent Research on Meroitic, Ityopis 1 (2011)", url: "http://www.ityopis.org/Issues-1_files/ITYOPIS-I-Rilly.pdf", quote: "It belongs to the Nilo-Saharan phylum and more accurately to a sub-branch termed “Northern East Sudanic” (NES), together with Nara, Nubian, Tama and Nyimang."}
    - {title: "Encyclopaedia Britannica: Meroitic language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Meroitic-language", quote: "some scholars believe the language to be related to Nilo-Saharan languages (more specifically the Eastern Sudanic branch)"}
- card: meroitic-script
  fact: "Old Nubian's alphabet borrowed a few letters from Meroitic"
  sources:
    - {title: "Everson & Emmel, Revision of the Coptic block, WG2 N2744 (2004)", url: "https://www.unicode.org/wg2/docs/n2744.pdf", quote: "In the case of Old Nubian, which is a Nilo- Saharan language, some additional letters seem to have been borrowed from Meroitic."}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "Nubian scribes adapted it to their own language, adding some letters borrowed from Meroitic"}
    - {title: "Helmut Satzinger, Some Peculiarities of Greek and Coptic Epigraphy from Nubia (2004)", url: "https://homepage.univie.ac.at/helmut.satzinger/Texte/EpigrNubia.pdf", quote: "more signs are taken from the linear version of the Meroitic script"}
- card: geez-script
  fact: "The Ge'ez (Ethiopic) script writes the languages of Ethiopia and Eritrea, including Amharic and Tigre"
  sources:
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "writing system used to write the Geʿez literary and ecclesiastical language and the Amharic, Tigre, and Tigrinya languages of Ethiopia and Eritrea"}
    - {title: "Unicode Standard 17.0, ch. 19.1 Ethiopic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "its script has been adopted for modern use in writing several languages of central east Africa, including Amharic, Tigre, and Oromo"}
- card: geez-script
  fact: "Letters stand for consonants; attached vowel marks make syllables"
  sources:
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "26 letters, all representing consonants , which may be transformed into syllabic symbols by the attachment of the appropriate vocalic markers to the letters"}
    - {title: "Unicode Standard 17.0, ch. 19.1 Ethiopic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "The syllables of the Ethiopic script are traditionally presented as a two-dimensional matrix of consonant-vowel combinations."}
- card: geez-script
  fact: "Unlike its Arabian parent, it runs left to right"
  sources:
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "The direction of writing, unlike that of Sabaean and the other Semitic languages , is from left to right"}
    - {title: "Columbia Encyclopedia 6th ed.: Ethiopic (Encyclopedia.com)", url: "https://www.encyclopedia.com/literature-and-arts/language-linguistics-and-literary-terms/language-and-linguistics/ethiopic", quote: "the Ethiopic script has been written from left to right, though previously the direction of writing was from right to left"}
- card: geez-script
  fact: "It grew out of the South Arabian alphabet and first wrote Ge'ez, the language of Aksum"
  sources:
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "Apparently derived from Sabaean, a South Semitic script"}
    - {title: "Columbia Encyclopedia 6th ed.: Ethiopic (Encyclopedia.com)", url: "https://www.encyclopedia.com/literature-and-arts/language-linguistics-and-literary-terms/language-and-linguistics/ethiopic", quote: "it seems to be derived from the alphabetic South Semitic writing of the Old South Arabian inscriptions"}
    - {title: "Unicode Standard 17.0, ch. 19.1 Ethiopic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "The Ethiopic syllabary originally evolved for writing the Semitic language Ge’ez."}
- card: geez-script
  fact: "The earliest Ge'ez inscriptions mark consonants only"
  sources:
    - {title: "Encyclopaedia Britannica: Geʿez language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Geez-language", quote: "The oldest known inscription in the language dates from the 3rd or 4th century and is written in a script that does not indicate vowels."}
    - {title: "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (1991), PDF (Wayback)", url: "https://web.archive.org/web/20030501053851/http://www.dskmariam.org/artsandlitreature/litreature/pdf/aksum.pdf", quote: "the unvocalised Ge`ez inscription of Ezana (DAE 7)"}
- card: geez-script
  fact: "In the 4th century vowels began to be written; commonly dated to Ezana's reign"
  sources:
    - {title: "Encyclopaedia Britannica: Geʿez language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Geez-language", quote: "Subsequent inscriptions found in the ancient Ethiopian capital of Aksum were written from the 4th through the 9th century in a script that does indicate vowels."}
    - {title: "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (1991), PDF (Wayback)", url: "https://web.archive.org/web/20030501053851/http://www.dskmariam.org/artsandlitreature/litreature/pdf/aksum.pdf", quote: "it commonly accepted that the development of vocalisation occurred during his reign"}
- card: geez-script
  fact: "Under Ezana Aksum turned to Christianity"
  sources:
    - {title: "Columbia Encyclopedia 6th ed.: Ethiopic (Encyclopedia.com)", url: "https://www.encyclopedia.com/literature-and-arts/language-linguistics-and-literary-terms/language-and-linguistics/ethiopic", quote: "Since the 4th cent. AD, when Ethiopia was Christianized"}
    - {title: "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (1991), PDF (Wayback)", url: "https://web.archive.org/web/20030501053851/http://www.dskmariam.org/artsandlitreature/litreature/pdf/aksum.pdf", quote: "the conversion of the kingdom to Christianity in the reign of king Ezana of Aksum in the fourth century AD"}
- card: geez-script
  fact: "Inscriptions of Ezana survive both with and without vowels"
  sources:
    - {title: "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (1991), PDF (Wayback)", url: "https://web.archive.org/web/20030501053851/http://www.dskmariam.org/artsandlitreature/litreature/pdf/aksum.pdf", quote: "the unvocalised Ge`ez inscription of Ezana (DAE 7) ... the `monotheistic' vocalised Ge`ez inscription DAE 11"}
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "Inscriptions from the 4th century occur in the Geʿez language both in Sabaean and in varieties of the Ethiopic script."}
- card: geez-script
  fact: "Ge'ez stopped being spoken in the Middle Ages but remains the liturgical language of the Ethiopian Orthodox Church"
  sources:
    - {title: "Encyclopaedia Britannica: Geʿez language (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Geez-language", quote: "Although the language ceased to be spoken popularly sometime between 900 and 1200, it continues as a liturgical language"}
    - {title: "Columbia Encyclopedia 6th ed.: Ethiopic (Encyclopedia.com)", url: "https://www.encyclopedia.com/literature-and-arts/language-linguistics-and-literary-terms/language-and-linguistics/ethiopic", quote: "ceased to be a spoken tongue in Ethiopia some time before the 14th cent. AD ... still in use in the liturgy of the Ethiopian Orthodox Church"}
    - {title: "Unicode Standard 17.0, ch. 19.1 Ethiopic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "Ge’ez itself is now limited to liturgical usage"}
- card: geez-script
  fact: "The same letters have been in use some seventeen centuries (4th century to today)"
  sources:
    - {title: "Encyclopaedia Britannica: Ethiopic alphabet (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Ethiopic-alphabet", quote: "the Ethiopic script probably originated in the early 4th century ad"}
    - {title: "Unicode Standard 17.0, ch. 19.1 Ethiopic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "its script has been adopted for modern use in writing several languages"}
- card: old-nubian
  fact: "Old Nubian is the written language of medieval Christian Nubia on the Nile (southern Egypt, northern Sudan)"
  sources:
    - {title: "Helmut Satzinger, Some Peculiarities of Greek and Coptic Epigraphy from Nubia (2004)", url: "https://homepage.univie.ac.at/helmut.satzinger/Texte/EpigrNubia.pdf", quote: "The population of Christian Nubia was essentially of non-Egyptian tongue ... This is the idiom which is called Old Nubian."}
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "Old Nubian, a literary language written in the Nubian kingdoms of Nobadia and Makuria"}
    - {title: "Encyclopaedia Britannica: Nubian languages (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nubian-languages", quote: "group of languages spoken in Sudan and southern Egypt , chiefly along the banks of the Nile River"}
- card: old-nubian
  fact: "It is an ancient form of Nile Nubian, closest to today's Nobiin"
  sources:
    - {title: "Helmut Satzinger, Some Peculiarities of Greek and Coptic Epigraphy from Nubia (2004)", url: "https://homepage.univie.ac.at/helmut.satzinger/Texte/EpigrNubia.pdf", quote: "they spoke an ancient form of Fiyadikkya (Fadicha) Nubian, or Nobiîn. This is the idiom which is called Old Nubian."}
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "it’s a close relative of Old Nubian"}
- card: old-nubian
  fact: "It belongs to the Nilo-Saharan family"
  sources:
    - {title: "Encyclopaedia Britannica: Nubian languages (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nubian-languages", quote: "These languages are now considered to be a part of the Nilo-Saharan language family ."}
    - {title: "Everson & Emmel, Revision of the Coptic block, WG2 N2744 (2004)", url: "https://www.unicode.org/wg2/docs/n2744.pdf", quote: "Old Nubian, which is a Nilo- Saharan language"}
- card: old-nubian
  fact: "Its texts run from the late 8th century to the 14th"
  sources:
    - {title: "Encyclopaedia Britannica: Nubian languages (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nubian-languages", quote: "Documents in Old Nubian ... date from the end of the 8th century to the beginning of the 14th century."}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "Old Nubian was still in use until the 14th century"}
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "from around the 8th century up to the 15th century"}
- card: old-nubian
  fact: "It was written in the Coptic alphabet, itself from Greek"
  sources:
    - {title: "Encyclopaedia Britannica: Nubian languages (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nubian-languages", quote: "written, as is modern Nubian, in an adaptation of the Coptic alphabet"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "the Coptic script, an alphabet almost entirely derived from Greek"}
    - {title: "Helmut Satzinger, Some Peculiarities of Greek and Coptic Epigraphy from Nubia (2004)", url: "https://homepage.univie.ac.at/helmut.satzinger/Texte/EpigrNubia.pdf", quote: "Its script is Greek, augmented for two Coptic signs"}
- card: old-nubian
  fact: "Scribes added letters for Nubian sounds, a few taken from Meroitic"
  sources:
    - {title: "Everson & Emmel, Revision of the Coptic block, WG2 N2744 (2004)", url: "https://www.unicode.org/wg2/docs/n2744.pdf", quote: "some additional letters seem to have been borrowed from Meroitic"}
    - {title: "Helmut Satzinger, Some Peculiarities of Greek and Coptic Epigraphy from Nubia (2004)", url: "https://homepage.univie.ac.at/helmut.satzinger/Texte/EpigrNubia.pdf", quote: "more signs are taken from the linear version of the Meroitic script"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "adding some letters borrowed from Meroitic to accommodate specific sounds"}
- card: old-nubian
  fact: "Old Nubian has its own punctuation: a full stop and marks for direct and indirect questions"
  sources:
    - {title: "Everson & Emmel, Revision of the Coptic block, WG2 N2744 (2004)", url: "https://www.unicode.org/wg2/docs/n2744.pdf", quote: "COPTIC OLD NUBIAN FULL STOP: divides clauses ... COPTIC OLD NUBIAN DIRECT QUESTION MARK: ends direct ques tions ... COPTIC OLD NUBIAN INDIRECT QUESTION MARK: ends indirect questions"}
    - {title: "Unicode Standard 17.0, ch. 7.3 Coptic", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-7/", quote: "Several other historic forms of punctuation are known only from Old Nubian texts."}
- card: old-nubian
  fact: "Most surviving texts are Christian writings translated from Greek; others are documents"
  sources:
    - {title: "Encyclopaedia Britannica: Nubian languages (Wayback snapshot)", url: "https://web.archive.org/web/2025/https://www.britannica.com/topic/Nubian-languages", quote: "These are usually translations of Christian writings originally in Greek"}
    - {title: "van Gerven Oei, A note on the Old Nubian morpheme -ⲁ, Nubian Voices II (2015) (Wayback)", url: "https://web.archive.org/web/2023/https://hcommons.org/deposits/objects/hc:13212/datastreams/CONTENT/content", quote: "to address the ⲁ-morpheme in Old Nubian texts, both lit- erary and documentary"}
- card: old-nubian
  fact: "As Islam spread and Arabic took hold, Nubians stopped writing their language"
  sources:
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "when the spread of Islam led Nubians to increasingly adopt the Arabic language and script"}
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "started to be challenged by Arabic from the 12th century, in a process that accelerated with the gradual Islamisation of Nubia"}
- card: old-nubian
  fact: "In recent decades Nubians (incl. diaspora) are reviving the alphabet for Nobiin, with typefaces modelled on manuscripts"
  sources:
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "Eujayl developed a font he’s named Sawarda ... based on Old Nubian manuscripts"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "The effort to revive the Nubian script has mainly been led by members of the diaspora."}
- card: zulu-beadwork
  fact: "Beadwork was women's work"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "Beadwork had always been a female activity"}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "Always made by women and mainly worn by women"}
- card: zulu-beadwork
  fact: "In the late 19th century European glass beads became plentiful through trade and beadwork took on a role in courtship"
  sources:
    - {title: "V&A: Necklace, Xhosa or Zulu-speaking peoples, 1850–1900 (O351)", url: "https://collections.vam.ac.uk/item/O351/necklace-unknown", quote: "the tiny glass beads from which most beadwork in the area is produced only became available in large quantities in the late 19th century. These beads were mass-produced in Europe"}
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "it was in the late nineteenth century that beadwork began to take on symbolic meaning in Zulu courtship"}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "beads first arrived in Africa as items of trade"}
- card: zulu-beadwork
  fact: "Colours and shapes told if a woman was single, promised or married, and where she came from"
  sources:
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "The colours and shapes in the beadwork worn showed whether the wearer was available for marriage, already promised in marriage, already married ... including where they came from."}
    - {title: "V&A: Necklace, Xhosa or Zulu-speaking peoples, 1850–1900 (O351)", url: "https://collections.vam.ac.uk/item/O351/necklace-unknown", quote: "through colour and design, communicated the wearer’s ethnicity, age, regional roots, wealth and status"}
- card: zulu-beadwork
  fact: "A young woman could give beadwork to a man; by wearing it he showed he returned her feelings"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "It often began with a gift of a single strand of white beads ( ucu ) ... By accepting and wearing the ucu , he reciprocated her advances."}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "Beadwork is sometimes given to men by women as love tokens and worn by men to show their commitment to a woman."}
- card: zulu-beadwork
  fact: "Pieces grew more elaborate, including panels Europeans call 'love letters'"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "the beadwork became increasing elaborate, with what are commonly referred to by Europeans as 'love letters'"}
    - {title: "V&A: Necklace, Xhosa or Zulu-speaking peoples, 1850–1900 (O351)", url: "https://collections.vam.ac.uk/item/O351/necklace-unknown", quote: "The rectangular beadwork panels on this necklace are commonly known as 'love letters'"}
- card: zulu-beadwork
  fact: "Each colour has two faces: red passion or anger, yellow fertility or thirst and withering"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "red beads can stand for passion and desire but also anger and pain ... yellow can symbolize pumpkins and thus wealth and fertility but it can also represent thirst and withering away"}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "Red – physical love and strong feelings or anger and impatience ... Yellow – A garden and fertility or thirst and withering"}
- card: zulu-beadwork
  fact: "Only white was always good"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "The only colour that is consistently positive in white"}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "White – love, purity and virginity or no negative meaning"}
- card: zulu-beadwork
  fact: "Order and dominance of colours could change the message"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "the dominance and order of the colours can completely alter the local interpretation"}
    - {title: "Horniman Museum: Zulu beadwork pin HC.1999.1024", url: "https://horniman.ac.uk/object/HC.1999.1024", quote: "their meaning changes depending on which colours are placed next to them"}
- card: zulu-beadwork
  fact: "There is no single key; meanings varied by region and changed over time"
  sources:
    - {title: "Museums Victoria: Northern Nguni Zulu Beadwork – Courtship Meanings (Wayback snapshot)", url: "https://web.archive.org/web/2024/https://collections.museumsvictoria.com.au/articles/16600", quote: "There is no fixed code for the means attributed to colours or designs, and such elements vary widely across regions and with the fashions of the times."}
    - {title: "Chipangura & Seabela, Meanings of Zulu Beadwork, Museum Worlds 12 (2024), Maynooth repository", url: "https://mural.maynoothuniversity.ie/id/eprint/21505/1/museum-worlds-armw120103.pdf", quote: "color combinations show regional and ethnic identities. Over time these regional ethnicities have been renegotiated, which has led to the emergence of hybrid styles in the beadwork"}
- card: djenne-mosque
  fact: "A fresh coat of mud shields the walls from the Sahel rains"
  sources:
    - {title: "AFP via Arab News: Ancient Malian city celebrates annual replastering of mosque (14 June 2025)", url: "https://www.arabnews.pk/node/2604511/world", quote: "shields the mosque from harsh weather ahead of the Sahel region’s often violent rainy season"}
    - {title: "Associated Press via KSAT: Thousands replaster Mali's Great Mosque of Djenne (13 May 2024)", url: "https://www.ksat.com/news/world/2024/05/13/in-mali-thousands-replaster-the-great-mosque-of-djenne-under-threat-from-conflict/", quote: "Djenne's mosque requires a new layer of mud each year before the start of the rainy season in June."}
- card: old-nubian
  fact: "New typefaces are modelled on the medieval manuscripts"
  sources:
    - {title: "Middle East Eye: Reading Nubian: books for a new generation", url: "https://www.middleeasteye.net/discover/nubian-sudan-egypt-books-discovering-language-new-generation", quote: "Eujayl developed a font he’s named Sawarda ... based on Old Nubian manuscripts"}
    - {title: "New Lines Magazine: In Egypt and Sudan, Nubians Are Trying To Bring an Alphabet Back From the Dead", url: "https://newlinesmag.com/spotlight/in-egypt-and-sudan-nubians-are-trying-to-bring-an-alphabet-back-from-the-dead/", quote: "Eujayl developed a Nubian font, based on the archives of Old Nubian"}
