# Second, independent check of the perspective rewrite of gullah (2026-11-15).
# Every source below was opened by the checker; quotes were matched verbatim against the fetched page text
# (Smithsonian Magazine itself is read through the Bunk History reprint of the same article, counted once).
# Edits applied: male "rowed" -> "took ... by rowboat" (sources say he transported or ferried them, not that he rowed);
# male "Others had found no African trace" -> "Earlier scholars heard only imperfect English" (second source added);
# female "to make children dance" -> "to amuse the children" (only Facing South mentions dancing);
# sources list: University of Chicago Magazine year 2011 -> 2010; Joyner (Smithsonian, 1988) added.
# Word counts after edits (EN): male 234, female 233 (limit 235 for a language card). Lint passes for gullah.
- card: gullah
  copy: both
  fact: "Gullah grew among enslaved West and Central Africans on the rice, Sea Island cotton and indigo plantations of coastal South Carolina and Georgia"
  verdict: confirmed
  sources:
    - {title: "NPS: Gullah Geechee Cultural Heritage Corridor", url: "https://www.nps.gov/guge/index.htm", quote: "descendants of West and Central Africans who were enslaved and bought to the lower Atlantic states of North Carolina, South Carolina, Florida, and Georgia to work on the coastal rice, Sea Island cotton and indigo plantations."}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "The list of tribes that scholars believe the Gullah people descended from"}
  note: "Kenyon lists West African (Mandingo, Wolof, Akan) and Central African (Makongo, Kimbundu) groups; the plantation crops rest on NPS and the earlier explainers-check entry (NPS + Smithsonian Folkways SFW40258)."
- card: gullah
  copy: both
  fact: "Its words are mostly English, its grammar is not simply English, and it keeps African words"
  verdict: confirmed
  sources:
    - {title: "Smithsonian Folkways SFW40258 liner notes", url: "https://folkways-media.si.edu/docs/folkways/artwork/SFW40258.pdf", quote: "Although Gullah borrows its lexicon from English, its grammatical structure actually lies in West African languages such as Igbo, Yoruba, Efik, Twi, and others."}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "Some of the main differences between Gullah and American English involve verb tense, naming, and singular and plural nouns."}
  note: "African words: Folkstreams 'entire African words found in Gullah conversations'."
- card: gullah
  copy: both
  fact: "Outsiders long dismissed Gullah as broken English"
  verdict: confirmed
  sources:
    - {title: "College of Charleston: Word, Shout, Song exhibition (2012)", url: "https://today.cofc.edu/2012/01/04/college-to-host-word-shout-song-lorenzo-dow-turner-connecting-community-through-language/", quote: "whose speech was dismissed as \"baby talk\" and \"bad English.\""}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "Americans might still consider Gullah merely broken English, if not for Lorenzo Dow Turner."}
  note: ""
- card: gullah
  copy: both
