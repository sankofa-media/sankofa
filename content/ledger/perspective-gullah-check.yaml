    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "In 1933 African American linguist Lorenzo Turner and musicologist Lydia Parish visited Harris Neck"}
  note: "Facing South (1997) says 'In 1932, Turner ... recorded Dawley'. The dated archival record at Indiana (which holds the recording) settles it; this is a press slip rather than a scholarly dispute, so the dispute field stays empty."
- card: gullah
  copy: both
  fact: "The song had five lines and was in a language Dawley did not know"
  verdict: confirmed
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "a five-line song he learned from a woman living in a remote Georgia fishing village, Amelia Dawley. Although Amelia did not know the meaning of the syllables in the song"}
    - {title: "Harris Neck Land Trust: Amelia's Song", url: "https://harrisnecklandtrust.org/amelias-song", quote: "in a language unknown to Mrs. Dawley"}
  note: "Five lines also in Facing South: 'She has a five-line song that is essentially the same as Jabati's song'."
