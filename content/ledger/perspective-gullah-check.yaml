- card: gullah
  copy: male
  fact: "Turner first heard Gullah in the summer of 1929 at South Carolina State College"
  verdict: confirmed
  sources:
    - {title: "University of Chicago Magazine: Lorenzo Dow Turner, PhD'26 (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "While teaching summer school at South Carolina State College in 1929, Turner listened as two students spoke what sounded like broken English."}
    - {title: "American Folklore Society, Notable Folklorists of Color: Lorenzo Dow Turner", url: "https://notablefolkloristsofcolor.org/portfolio/lorenzo-dow-turner/", quote: "During summer 1929, while teaching at South Carolina State College, Dr. Turner heard Black students"}
