- card: gullah
  copy: male
  fact: "Earlier scholars heard only imperfect English in Gullah; Turner heard words that were not English"
  verdict: corrected
  sources:
    - {title: "University of Chicago Magazine (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "Other linguists had studied it before, but they determined that it contained no vestiges of African languages."}
    - {title: "Charles Joyner, Afro-American Folklife Scholarship: A Case Study of the Sea Islands (Smithsonian, 1988)", url: "https://folklife-media.si.edu/docs/festival/program-book-articles/FESTBK1988_19.pdf", quote: "argued that the speech of Black Sea Islanders was the imperfect result of the attempt of \"savage and primitive\" people to acquire the complex language of a more \"highly civilized\" race."}
  note: "Card said 'Others had found no African trace in it'; only the Chicago magazine says that in so many words (Kenyon and College of Charleston describe Turner's finding, not his predecessors). Reworded to what both sources state; 'words that were not English' is in Chicago and Kenyon ('many Gullah words did not have any English precursors')."
- card: gullah
  copy: male
  fact: "He took island speakers by rowboat to the mainland, where there was electricity for his hundred-pound recorder"
  verdict: corrected
  sources:
    - {title: "University of Chicago Magazine (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "he had to transport the participants by rowboat to the mainland, where there was electricity for the recorder."}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "He often had to ferry islanders back to Charleston, as many islands did not have the electricity required to run his cumbersome, hundred pound recording device."}
  note: "Card said 'He rowed'; neither source says Turner rowed himself. Reworded (RU: «переправлял на вёсельной лодке»)."
- card: gullah
  copy: male
  fact: "Africanisms in the Gullah Dialect (1949) traced thousands of Gullah words and names to African languages"
  verdict: confirmed
  sources:
    - {title: "Folkstreams: Dr. Lorenzo Turner and the Gullah Language", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language", quote: "In his book, Turner listed nearly 4,000 items of African language origin"}
    - {title: "Charles Joyner (Smithsonian, 1988)", url: "https://folklife-media.si.edu/docs/festival/program-book-articles/FESTBK1988_19.pdf", quote: "Lorenzo Dow Turner, on the other hand, suggested in his Africanisms in the Gullah Dialect (1949) that thousands of African words persisted in Gullah"}
  note: "Also Newsreel ('more than 3000 names and words') and Folkways ('more than 300 African loanwords and 4,000 personal names'). Most of the thousands are personal names, which 'words and names' covers."
- card: gullah
  copy: male
  fact: "The book showed that slavery had not erased the memory of Africa"
  verdict: confirmed
  sources:
    - {title: "University of Chicago Magazine (2010)", url: "https://magazine.uchicago.edu/1012/features/legacy.shtml", quote: "\"Until then it was pretty much thought that all of the African knowledge and everything had been erased by slavery. Turner showed that was not true,\""}
    - {title: "Indiana University Libraries: Dow Turner Collections", url: "https://libraries.indiana.edu/dow-turner", quote: "Turner proved that there were significant cultural retentions of African cultures among African Americans."}
