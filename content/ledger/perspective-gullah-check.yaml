- card: gullah
  copy: male
  fact: "In 1990, following Turner's recording, Joseph Opala and Cynthia Schmidt found Baindu Jabati in Senehun Ngola still singing the song"
  verdict: confirmed
  sources:
    - {title: "Smithsonian Magazine via Bunk History (Joshua Kagavi, 2024)", url: "https://bunkhistory.org/resources/how-the-memory-of-a-song-reunited-two-women-separated-by-the-trans-atlantic-slave-trade", quote: "In 1990, the researchers traveled around the country's Pujehun District, playing the song for villagers"}
    - {title: "College of Charleston: Word, Shout, Song exhibition (2012)", url: "https://today.cofc.edu/2012/01/04/college-to-host-word-shout-song-lorenzo-dow-turner-connecting-community-through-language/", quote: "scholars Joseph Opala, Tazieff Schmidt, and Cynthia Koroma who, in 1990, realized a song passed down through generations connected the Mende people of Sierra Leone to their American kin in Georgia."}
  note: "Smithsonian: 'they found a small village, Senehun Ngola, and a woman named Baindu Jabati who astonished them by singing a nearly identical version of the song.' Facing South dates only the finding of the recording (1989) and gives no year for the trip; it does not contradict 1990. College of Charleston garbles the first names (Tazieff Schmidt, Cynthia Koroma) but confirms the year and team."
