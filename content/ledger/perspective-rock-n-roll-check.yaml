  verdict: confirmed
  sources:
    - {title: "Tennessee Encyclopedia: Sun Records", url: "https://tennesseeencyclopedia.net/entries/sun-records/", quote: "By 1952, Phillips had tired of recording hits for other firms. ... He started his own record company, turning to the name “Sun”"}
