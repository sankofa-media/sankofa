- card: rock-n-roll
  fact: "(unledgered) By the mid-1950s the name rock and roll meant mostly white musicians"
  verdict: unconfirmed
  sources:
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "By the mid-1950s, as more and more white teenagers began to listen to rhythm and blues, the scope of the term rock and roll expanded and was primarily applied to white musicians"}
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "by the end of the 1960s, the majority of musicians and fans associated with the music were white"}
