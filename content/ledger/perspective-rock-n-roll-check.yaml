  fact: "(new) In 1955 Pat Boone covered Fats Domino's \"Ain't That a Shame\""
  verdict: confirmed
  sources:
    - {title: "uDiscover Music: Fats Domino", url: "https://www.udiscovermusic.com/artists/fats-domino", quote: "In May 1955 it entered the R&B charts ... Its progress on the main Billboard chart was hampered by a cover version by Mr Vanilla, Pat Boone"}
    - {title: "American Masters, Fats Domino and the Birth of Rock n Roll, documentary transcript, PBS", url: "https://pbswisconsin.org/watch/american-masters/american-masters-fats-domino-and-birth-rock-n-roll/", quote: "Pat Boone comin' out with your record next week ... While \"Ain't That a Shame\" was burning up the 1955 R&B and pop charts"}
  note: "Boone's No. 1 is stated only by uDiscover, so the card does not claim it."
- card: rock-n-roll
  fact: "(unledgered) wow and dispute: \"Rocket 88\" is often called the first rock and roll single; the claim is debated, with the Rock Hall and the New Rolling Stone Encyclopedia allowing it and 1940s records by Tharpe and Roy Brown named as earlier"
  verdict: confirmed
  sources:
    - {title: "Saturday Evening Post: The Very First Rock and Roll Song", url: "https://www.saturdayeveningpost.com/2021/03/the-very-first-rock-and-roll-song/", quote: "the Rock and Roll Hall of Fame and The New Rolling Stone Encyclopedia of Rock and Roll allow that this is probably the case ... Sister Rosetta Tharpe’s “Strange Things Happening Every Day” from 1944"}
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "Nowadays ‘Rocket “88”’ is often billed as the first rock and roll record, but rock and roll was the product of a gradual evolution and there are earlier competitors for this distinction."}
  note: "Roy Brown ('Good Rocking Tonight', 1947) is named in the Saturday Evening Post; Blues Foundation: 'one of many blues and R&B singles cited in retrospect as the first rock 'n' roll record'. Carnegie Hall: 'credited to its vocalist Jackie Brenston' supports the wow line."
