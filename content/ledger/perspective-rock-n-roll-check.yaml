# Second, independent check (2026-11-15) of content/ledger/perspective-rock-n-roll.yaml
# and content/cards/rock-n-roll.md / rock-n-roll.ru.md. Every cited URL was reopened;
# quotes are copied from the fetched page or PDF text.
# verdict: confirmed | corrected (card wording or sources changed) |
#          refuted | unconfirmed (removed from the card).
# Entries whose fact starts with "(unledgered)" check claims the first ledger did not record.
# Word count per copy (limit 235, genre card): EN male 231, female 232; RU male 212, female 212.
# Both copies read as complete stories (frame, story, outcome); RU marks the same paragraphs.
- card: rock-n-roll
  fact: "Rock and roll ran on an aggressive beat, loud electric guitar, saxophone solos and pounding piano, and grew out of rhythm and blues"
  verdict: confirmed
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "characterized by an aggressive beat and prominent electric guitars, saxophone solos, and pumping pianos"}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "In the early 1950s, rock and roll — originally a euphemism for sex — was virtually synonymous with rhythm and blues."}
  note: "Case Western ECH also: 'rock expanded from its R&B base'."
- card: rock-n-roll
  fact: "(unledgered) The phrase was old blues slang for sex"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Cleveland History: Freed, Alan", url: "https://case.edu/ech/articles/f/freed-alan", quote: "Mintz and Freed called the music Rock 'n' Roll (believed to be an old blues reference to sex)"}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "rock and roll — originally a euphemism for sex"}
  note: "Added to the ledger."
- card: rock-n-roll
  fact: "In 1951 in Cleveland the DJ Alan Freed began playing rhythm and blues and calling it rock and roll"
  verdict: corrected
  sources:
    - {title: "Encyclopedia of Cleveland History: Freed, Alan", url: "https://case.edu/ech/articles/f/freed-alan", quote: "In 1951 Freed was hired to host a classical music program on Cleveland’s WJW-Radio ... with Freed spinning rhythm-and-blues records by black musicians. ... Mintz and Freed called the music Rock 'n' Roll"}
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "in 1951, Cleveland disc jockey Alan Freed began calling his rhythm and blues radio show “Moondog’s Rock and Roll Party.”"}
  note: "Card text unchanged. The ledger's second source (uDiscover) speaks of Freed's Brooklyn Paramount shows in New York, not Cleveland or 1951, and its quote was partly paraphrased; replaced with Carnegie Hall."
- card: rock-n-roll
  fact: "(unledgered) Fats Domino of New Orleans: \"What they call rock 'n' roll is rhythm and blues\""
  verdict: confirmed
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "In 1965 Fats Domino said, “What they call rock ‘n’ roll is rhythm and blues. I’ve been playing it for 15 years in New Orleans.”"}
    - {title: "American Masters, Fats Domino and the Birth of Rock n Roll, documentary transcript, PBS", url: "https://pbswisconsin.org/watch/american-masters/american-masters-fats-domino-and-birth-rock-n-roll/", quote: "Well, what they call rock 'n' roll now is rhythm and blues. I've been playin' for 15 years in New Orleans."}
  note: "Added to the ledger."
- card: rock-n-roll
  fact: "In March 1951 Ike Turner's Kings of Rhythm recorded \"Rocket 88\" at Sam Phillips's studio in Memphis"
  verdict: confirmed
  sources:
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "created in a March 5, 1951 session at Sam Phillips’ legendary Memphis Recording Service studio. Piano player Ike Turner showed up with his Kings of Rhythm"}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "Recorded March 5, 1951, at Memphis Recording Service, Memphis, Tennessee."}
  note: "The Mississippi Blues Trail gives March 7 (after Guralnick); the month agrees, so the card rightly says only March."
- card: rock-n-roll
  fact: "The band were young men from Clarksdale, Mississippi, who came up Highway 61 to Memphis"
  verdict: confirmed
  sources:
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "The band that traveled up Highway 61 to make the record in Memphis consisted of Ike Turner, Jackie Brenston, Raymond Hill, Willie Kizart ... and Willie “Bad Boy” Sims, all aged 17 to 20."}
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "During the 61-mile trip from Clarksdale, Mississippi to Memphis"}
  note: ""
- card: rock-n-roll
  fact: "On it: Turner's piano, two saxophones, drums and a guitar with a distorted buzz"
  verdict: confirmed
  sources:
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "Ike Turner, piano; Willie Kizart, electric guitar; Willie Sims, drums; Raymond Hill, tenor sax, and Brenston, tenor sax and vocals ... Kizart’s loud and accidentally fuzz-toned guitar"}
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "many historians opine that the distorted buzz in the guitar sound ... qualified it as the first example of rock ‘n’ roll"}
  note: "Blues Foundation gives the same line-up; Wooster listening guide: 'Drums, electrical guitar, 2 saxophones'."
- card: rock-n-roll
  fact: "Chess issued the record under the name of Jackie Brenston, Turner's saxophonist, who sang it; Turner's name was not on it"
  verdict: corrected
  sources:
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "turned the mike over to one of his saxophonists, Jackie Brenston ... presented the results to Chess Records as one single by Ike Turner and his Kings of Rhythm and another by Jackie Brenston and his Delta Cats"}
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "Turner couldn’t have been pleased his name was missing from the label without credit to the Kings of Rhythm"}
  note: "Was 'Chess Records credited it to Jackie Brenston'. Blues Foundation and Blues Trail say Phillips presented the tape to Chess under Brenston's name, so the credit was not Chess's decision; reworded to 'Chess Records issued it under the name of ... who sang it' (RU: «выпустил запись под именем ...»)."
- card: rock-n-roll
  fact: "It became Chess Records' first number one on the rhythm and blues chart"
  verdict: confirmed
  sources:
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "it was also the first No. 1 rhythm & blues hit for Chicago-based Chess Records"}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "reaching No. 1 on the R&B charts (Chess Records' first chart-topper)"}
  note: ""
