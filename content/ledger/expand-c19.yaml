# Batch c19 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a short quote.
# Notes: the two Museum of Broadcast Communications entries are separate articles by different authors; Phillips Collection pages count as one source.

- card: circus-1936
  fact: "Circus (Tsirk) is a 1936 Soviet musical comedy directed by Grigori Aleksandrov"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "Circus (1936), a beloved musical comedy directed by Grigori Aleksandrov"}
    - {title: "Gerald McCausland, Circus (USSR, 1936), New East Film Symposium, University of Pittsburgh", url: "https://neweastcinema.pitt.edu/?p=5211", quote: "Grigorii Aleksandrov's Circus is one of the most successful and enduring works of Soviet cinema"}
- card: circus-1936
  fact: "It became one of the best-loved Soviet films"
  sources:
    - {title: "Gerald McCausland, Circus (USSR, 1936), New East Film Symposium, University of Pittsburgh", url: "https://neweastcinema.pitt.edu/?p=5211", quote: "Upon its release in 1936, it immediately became a favorite with both the political elite and mass audiences"}
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "a beloved musical comedy directed by Grigori Aleksandrov"}
- card: circus-1936
  fact: "Lyubov Orlova plays Marion Dixon, an American circus performer who flees racist persecution because her son is Black and finds a new life in the Soviet circus"
  sources:
    - {title: "Gerald McCausland, Circus (USSR, 1936), New East Film Symposium, University of Pittsburgh", url: "https://neweastcinema.pitt.edu/?p=5211", quote: "It chronicles the journey of Marion Dixon... from the USA to the USSR, from racist persecution to multi-ethnic tolerance"}
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "As the interracial child of American performer Marion Dixon"}
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "мать черного младенца"}
- card: circus-1936
  fact: "Jimmy was played by three-year-old James Patterson"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "In 1936, three-year-old James starred in"}
    - {title: "Mac Carey, This DC poet was once the USSR's biggest kid actor, Washingtonian (2022)", url: "https://www.washingtonian.com/2022/05/10/this-dc-poet-was-once-the-ussrs-biggest-kid-actor", quote: "When Patterson was three years old, he starred in the Russian film Circus"}
- card: circus-1936
  fact: "His father Lloyd Patterson was an African American who came to the USSR (1932) with a group of Black Americans, drawn by the promise of racial equality"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "Lloyd Patterson arrived in the Soviet Union in 1932 as part of a group of 21 Black artists, actors, and intellectuals"}
    - {title: "Mac Carey, This DC poet was once the USSR's biggest kid actor, Washingtonian (2022)", url: "https://www.washingtonian.com/2022/05/10/this-dc-poet-was-once-the-ussrs-biggest-kid-actor", quote: "emigrated with other Black intellectuals in the 1930s, drawn by the promise of supposed Soviet racial equality"}
- card: circus-1936
  fact: "His mother, Vera Aralova, was a Soviet theatre artist"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "Vera Aralova, a Soviet theater artist and fashion designer"}
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "театральной художницы Веры Ипполитовны Араловой"}
- card: circus-1936
  fact: "In the finale the audience sings the child a lullaby and Solomon Mikhoels, holding him, sings a verse in Yiddish"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "Solomon Mikhoels holding you in the final scene and singing a Yiddish lullaby"}
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "Колыбельную на идиш Джиму Паттерсону поет Соломон Михоэлс"}
- card: circus-1936
  fact: "James graduated from the Nakhimov naval school in Riga and served in the Black Sea Fleet"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "James Patterson graduated from Riga Nakhimov Naval Academy in 1951"}
    - {title: "Mac Carey, This DC poet was once the USSR's biggest kid actor, Washingtonian (2022)", url: "https://www.washingtonian.com/2022/05/10/this-dc-poet-was-once-the-ussrs-biggest-kid-actor", quote: "became a sailor with the Soviet Black Sea Fleet"}
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "будущий нахимовец, старший лейтенант подводного флота"}
- card: circus-1936
  fact: "He became a poet, a member of the Soviet Writers' Union"
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "joined the Soviet Writers' Union, and published poetry collections"}
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "а затем советский поэт с главной темой - дружба России и Африки"}
    - {title: "Mac Carey, This DC poet was once the USSR's biggest kid actor, Washingtonian (2022)", url: "https://www.washingtonian.com/2022/05/10/this-dc-poet-was-once-the-ussrs-biggest-kid-actor", quote: "He also had a long career as a poet."}
- card: circus-1936
  fact: "After the Soviet collapse he and his mother moved to Washington, D.C."
  sources:
    - {title: "Sasha Razor, The Only One Left: A Conversation with James Lloydovich Patterson About Grigori Aleksandrov's Circus, Los Angeles Review of Books (2020)", url: "https://lareviewofbooks.org/article/the-only-one-left-a-conversation-with-james-lloydovich-patterson-about-grigori-aleksandrovs-circus", quote: "James Patterson and his mother immigrated to the United States, settling in Washington, DC, in 1995"}
    - {title: "Mac Carey, This DC poet was once the USSR's biggest kid actor, Washingtonian (2022)", url: "https://www.washingtonian.com/2022/05/10/this-dc-poet-was-once-the-ussrs-biggest-kid-actor", quote: "Following the collapse of the Soviet Union, Patterson—then in his sixties—and his mother moved to DC"}
- card: circus-1936
  fact: "The film was propaganda against American racism"
  sources:
    - {title: "Radio Liberty (Radio Svoboda), Sergei Yurienen: \"Tsirk\"", url: "https://www.svoboda.org/a/24204619.html", quote: "Конечно, это был выпад и против Америки, и пропаганда"}
    - {title: "Gerald McCausland, Circus (USSR, 1936), New East Film Symposium, University of Pittsburgh", url: "https://neweastcinema.pitt.edu/?p=5211", quote: "from racist persecution to multi-ethnic tolerance"}
- card: treemonisha
  fact: "Treemonisha is a three-act opera by Scott Joplin, who wrote both libretto and music"
  sources:
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "Treemonisha, which synthesized his musical ideas into a conventional, three-act opera. He also wrote the libretto"}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "Scott Joplin composed the music and wrote the libretto for the opera Treemonisha"}
- card: treemonisha
  fact: "Joplin wrote Maple Leaf Rag and The Entertainer"
  sources:
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "his classic rags for piano, including \"Maple Leaf Rag\" and \"The Entertainer\""}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "ragtime compositions such as \"The Entertainer\" and \"Maple Leaf Rag.\""}
- card: treemonisha
  fact: "He grew up in north-east Texas and settled in New York"
  sources:
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "Joplin spent his childhood in northeastern Texas"}
    - {title: "Theodore Albrecht, Joplin, Scott, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/joplin-scott", quote: "born about 1867 possibly at Caves Spring, near Linden in Northeast Texas"}
    - {title: "Theodore Albrecht, Joplin, Scott, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/joplin-scott", quote: "settled down there permanently in 1911, to devote his serious energies to the production of Treemonisha"}
- card: treemonisha
  fact: "Publishers rejected it and he printed the piano-vocal score at his own expense in 1911"
  sources:
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "Treemonisha , published at his own expense in 1911"}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "Publishers ... rejected Treemonisha . Joplin published the piano-vocal score at his own expense in 1911."}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "had invested in the 1911 publication of Treemonisha"}
- card: treemonisha
  fact: "The opera is set on a plantation in Arkansas near Texarkana (in 1884)"
  sources:
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "The scene of the Opera is laid on a plantation somewhere in the State of Arkansas, Northeast of the Town of Texarkana"}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "adopted and raised by a couple on a plantation in Texarkana"}
- card: treemonisha
  fact: "A couple find a baby under a tree and name her Treemonisha"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "Because the baby was found under a tree, she is named Treemonisha."}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "One day, Monisha found a baby under a tree and they named her Treemonisha."}
- card: treemonisha
  fact: "She is the only educated person in her community; conjurers kidnap her; she is rescued and becomes leader"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "Treemonisha is kidnapped by the so-called \"conjure men,\" but is rescued and returned home, where she becomes a leader among her community."}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "Treemonisha is kidnapped by a conjurer who is fearful that the educated Treemonisha poses a threat"}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "Treemonisha, the only educated member of the community, calls him out."}
- card: treemonisha
  fact: "Its theme is education for women as well as men"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "The theme of the work--the importance of an education for both men and women"}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "the central theme of Joplin's opera is progress and the advancement of a rural community through education"}
- card: treemonisha
  fact: "Joplin could not raise the money for a staging"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "Joplin was never able to raise the funds to produce Treemonisha"}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "did not find financial support for staging the opera"}
- card: treemonisha
  fact: "In 1915 he played it at the piano for possible backers; nothing followed"
  sources:
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "an unsuccessful reading for potential backers in 1915, with Joplin playing the piano part"}
    - {title: "Theodore Albrecht, Joplin, Scott, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/joplin-scott", quote: "Treemonisha, mounted unsuccessfully early in 1915"}
- card: treemonisha
  fact: "He died in a Manhattan state hospital in April 1917"
  sources:
    - {title: "Theodore Albrecht, Joplin, Scott, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/joplin-scott", quote: "he entered the Manhattan State Hospital, where he died on April 1, 1917"}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "died on April 1, 1917, at Manhattan State Hospital"}
- card: treemonisha
  fact: "A 1970s revival of interest in Joplin brought it back"
  sources:
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "As a result of the renewed interest in Joplin Treemonisha was given its first fully staged performance"}
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "Interest in Joplin and ragtime was further stimulated in the 1970s"}
- card: treemonisha
  fact: "The Atlanta Symphony gave the first full staging in 1972, directed by Katherine Dunham"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "It was not staged until 1972, when it was presented under the auspices of Morehouse College in Atlanta, directed by Katherine Dunham"}
    - {title: "CALS Encyclopedia of Arkansas: Treemonisha", url: "https://encyclopediaofarkansas.net/entries/treemonisha-12200/", quote: "On January 28, 1972, there was a premiere performance ... The fully staged opera featured the Atlanta Symphony Orchestra"}
    - {title: "Encyclopaedia Britannica: Scott Joplin", url: "https://www.britannica.com/biography/Scott-Joplin", quote: "first produced by a troupe in Atlanta , Georgia , directed and choreographed by Katherine Dunham"}
- card: treemonisha
  fact: "Houston Grand Opera produced it in 1975"
  sources:
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "its true premiere for the opera-going public was at the Houston Grand Opera in 1975"}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "Houston Grand Opera gave the opera its professional public premiere in 1975"}
- card: treemonisha
  fact: "In 1976 Joplin received a posthumous Pulitzer Prize for it (59 years after his 1917 death)"
  sources:
    - {title: "Theodore Albrecht, Joplin, Scott, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/joplin-scott", quote: "In 1976 Joplin was posthumously awarded a Pulitzer Prize for Treemonisha"}
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "he was awarded a posthumous Pulitzer Prize in 1976"}
- card: treemonisha
  fact: "It waited about sixty years for a stage"
  sources:
    - {title: "Alan Westby, Scott Joplin, Treemonisha and American Opera, Los Angeles Public Library (2017)", url: "https://www.lapl.org/collections-resources/blogs/lapl/scott-joplin-treemonisha-and-american-opera", quote: "first fully staged performance over 60 years after its composition"}
    - {title: "Library of Congress, Ragtime collection: Treemonisha", url: "https://www.loc.gov/collections/ragtime/articles-and-essays/treemonisha/", quote: "It was not staged until 1972"}
- card: the-crisis
  fact: "The Crisis is the magazine of the NAACP"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "The Crisis , American quarterly magazine published by the National Association for the Advancement of Colored People (NAACP)"}
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "The NAACP subsequently launched The Crisis Magazine, a Record of the Darker Race, a monthly publication meant to help in the fight for full civil rights."}
- card: the-crisis
  fact: "The first issue appeared in November 1910, edited by W. E. B. Du Bois, who said it would show the danger of race prejudice"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "In his editorial for the first issue (November 1910), he wrote that the magazine would \"show the danger of race prejudice"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "The first issue appeared on November 1, 1910"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "those facts and arguments which show the danger of race prejudice"}
- card: the-crisis
  fact: "The Crisis denounced lynching consistently"
  sources:
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "The Crisis consistently denounced lynching and the October 1919 issue was devoted to this question."}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "\"The Work of a Mob\" documents the murder of Mary Turner"}
- card: the-crisis
  fact: "By 1919 monthly circulation passed 100,000"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "by the end of its first decade had achieved a monthly circulation of 100,000 copies"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "By 1919, monthly circulation exceeded 100,000"}
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "Du Bois announced a circulation of 104,000 for the June 1919 issue"}
- card: the-crisis
  fact: "Jessie Redmon Fauset was literary editor from 1919 to 1926"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "especially from 1919 to 1926, when Jessie Redmon Fauset was its literary editor"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "Jessie Redmon Fauset, the magazine's literary editor from 1919 to 1926"}
- card: the-crisis
  fact: "Fauset found or encouraged Langston Hughes, Countee Cullen and Jean Toomer"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "The writers she discovered or encouraged included the poets Arna Bontemps , Langston Hughes , and Countee Cullen and the novelist-poet Jean Toomer"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "identified and promoted new talent: Langston Hughes, Countee Cullen, Jean Toomer"}
- card: the-crisis
  fact: "In 1921 The Crisis printed Hughes's \"The Negro Speaks of Rivers\""
  sources:
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "Hughes gained early recognition when The Crisis published \"The Negro Speaks of Rivers\" in 1921."}
    - {title: "Library of Congress, Today in History, 1 February", url: "https://www.loc.gov/item/today-in-history/february-01/", quote: "Hughes's poem \"The Negro Speaks of Rivers,\" ... was published in Crisis , the magazine of the NAACP, in 1921."}
- card: the-crisis
  fact: "In 1919 The Crisis announced The Brownies' Book, launched by Du Bois and Fauset in 1920"
  sources:
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "In 1920, Jessie Fauset assisted Du Bois in the creation of this offshoot of The Crisis, to which she contributed regularly throughout its 24 issues, in 1920-21"}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "In the October 1919 Crisis Du Bois and his collaborators ... outlined seven objectives for the new magazine"}
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "The magazine ran from January 1920 to December 1921 under the editorship of W. E. B. Du Bois, Augustus Granville Dill ... and Jessie Fauset"}
- card: the-crisis
  fact: "Du Bois edited it for its first 24 years and left in 1934"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "for its first 24 years, was edited by W.E.B. Du Bois"}
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "from its creation until 1934"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "Six months later, he resigned."}
- card: the-crisis
  fact: "For Harlem Renaissance writers it was a main door into print"
  sources:
    - {title: "Encyclopaedia Britannica: The Crisis", url: "https://www.britannica.com/topic/The-Crisis-American-magazine", quote: "The Crisis was an important medium for the young Black writers of the Harlem Renaissance"}
    - {title: "Neal Caren (ed.), Dare You Fight (UNC Chapel Hill): Voice of a Movement", url: "https://www.dareyoufight.org/background.html", quote: "The Crisis became a launching pad for Black writers."}
- card: brownies-book
  fact: "The Brownies' Book was a monthly for African American children, January 1920 – December 1921"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "a monthly magazine specifically written for African American children ... The magazine ran from January 1920 to December 1921"}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "The magazine, which existed from January 1920 to December 1921"}
- card: brownies-book
  fact: "It was announced in The Crisis in 1919"
  sources:
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "In the October 1919 Crisis Du Bois and his collaborators ... outlined seven objectives for the new magazine"}
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "which had actually been announced in the issue of August 1919, on page 223"}
- card: brownies-book
  fact: "Du Bois edited it with Dill as business manager and Fauset as literary editor"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "under the editorship of W. E. B. Du Bois, Augustus Granville Dill (who served as business manager) and Jessie Fauset (as literary editor"}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "Augustus Granville Dill, who served as business manager; and Jessie Redmon Fauset, who was the literary editor"}
- card: brownies-book
  fact: "Its first aim: to make colored children realize that being colored is a normal, beautiful thing; another, familiarity with the history and achievements of the race"
  sources:
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "(a) To make colored children realize that being \"colored\" is a normal, beautiful thing. (b) To make them familiar with the history and achievements of the Negro race."}
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "It celebrated African American identity, urged racial pride, and encouraged its young readers to aspire to positions of leadership"}
- card: brownies-book
  fact: "It celebrated Black identity, urged racial pride, encouraged readers toward leadership"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "It celebrated African American identity, urged racial pride, and encouraged its young readers to aspire to positions of leadership within their communities."}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "It was necessary, therefore, to emphasize the beauty and normality of being \"colored,\" as laid out in the magazine's first objective."}
- card: brownies-book
  fact: "Issues mixed stories, poems, games and African folk tales with readers' contributions"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "comprised of stories (folktales, fantasies, as well as more realistic stories), poems, games, articles on current events, and photographs of and letters from young readers"}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "featured biographies, poetry, songs, stories ... The magazine also published material submitted by readers"}
- card: brownies-book
  fact: "A teenage Langston Hughes contributed; in 1921 it printed his poems, later his stories"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "In 1921, the magazine became the first to publish Hughes's poetry. In later issues, Hughes also contributed nonfiction pieces, a play, and a short story"}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "a teenaged Langston Hughes contributed poems, stories, and games"}
- card: brownies-book
  fact: "It lasted 24 issues"
  sources:
    - {title: "Dzanouni, Le Dantec-Lowry and Parfait, From One Crisis to the Other, European Journal of American Studies 11-1 (2016)", url: "https://journals.openedition.org/ejas/11432", quote: "to which she contributed regularly throughout its 24 issues, in 1920-21"}
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "The magazine ran from January 1920 to December 1921"}
- card: brownies-book
  fact: "It was among the first sustained efforts to write for Black children"
  sources:
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "It was the first sustained effort to create a body of writing that exclusively addressed the needs of African American children."}
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "one of the first substantial periodicals created specifically for the \"children of the sun.\""}
- card: brownies-book
  fact: "Its promise that Black children could be great, heroic or beautiful runs through African American children's books today"
  sources:
    - {title: "Jonda McNair and Rudine Sims Bishop, The Enduring Legacy of The Brownies' Book, The Horn Book (2018)", url: "https://www.hbook.com/story/great-heroic-beautiful-enduring-legacy-brownies-book", quote: "Both the magazine and much of contemporary African American children's literature convey the important idea that black children can indeed be great, heroic, and beautiful."}
    - {title: "University of Nebraska–Lincoln, The Tar Baby and the Tomahawk: The Brownies' Book", url: "https://childlit.unl.edu/topics/edi.brownies.html", quote: "The Brownies' Book was instrumental in promoting future African American children's literature."}
- card: in-dahomey
  fact: "In Dahomey opened on Broadway at the New York Theatre in 1903"
  sources:
    - {title: "Internet Broadway Database: In Dahomey (1903)", url: "https://www.ibdb.com/broadway-production/5695", quote: "Theatres New York Theatre (Feb 18, 1903 - Apr 04, 1903)"}
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "In Dahomey was a Broadway success"}
- card: in-dahomey
  fact: "Music by Will Marion Cook, lyrics by Paul Laurence Dunbar"
  sources:
    - {title: "Internet Broadway Database: In Dahomey (1903)", url: "https://www.ibdb.com/broadway-production/5695", quote: "Music by Will Marion Cook ; Book by Jesse A. Shipp ; Lyrics by Paul Laurence Dunbar"}
    - {title: "Gallatin Galleries, New York University: Transformation! exhibition texts", url: "https://wp.nyu.edu/gallatingalleries/?p=15811", quote: "In 1903, the musical In Dahomey, featuring music by Will Marion Cook and lyrics by Paul Laurence Dunbar"}
- card: in-dahomey
  fact: "Its stars were Bert Williams and George Walker and the cast was entirely Black"
  sources:
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "The show, which featured a cast of only Black performers, In Dahomey"}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "The cast consisted entirely of Black American performers. Among them was the comedy dance team of Bert Williams and George Walker."}
- card: in-dahomey
  fact: "Williams played the slow-witted stock character, then a standard if racist role, within minstrel and vaudeville conventions"
  sources:
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "shuffling Black man that was then a standard, if racist, role in vaudeville"}
    - {title: "Gallatin Galleries, New York University: Transformation! exhibition texts", url: "https://wp.nyu.edu/gallatingalleries/?p=15811", quote: "minstrelsy, cakewalk, and blackface, which made a burlesque of Black musical traditions while also providing African American actors and musicians with new opportunities"}
- card: in-dahomey
  fact: "The show was written, composed and played by Black artists and was a Broadway success"
  sources:
    - {title: "Gallatin Galleries, New York University: Transformation! exhibition texts", url: "https://wp.nyu.edu/gallatingalleries/?p=15811", quote: "became the first Broadway musical written and starring a Black cast"}
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "In Dahomey was a Broadway success"}
- card: in-dahomey
  fact: "In May 1903 the company took it to the Shaftesbury Theatre, London"
  sources:
    - {title: "Jeffrey Green, historian: \"In Dahomey\", London, 1903", url: "https://jeffreygreen.co.uk/in-dahomey-london-1903", quote: "In Dahomey opened at the Shaftesbury Theatre, London on 16 May 1903."}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "The musical 'In Dahomey' transferred from New York to London in May 1903."}
- card: in-dahomey
  fact: "Londoners expected the cakewalk, and Williams and Walker's version caused a sensation in dance halls"
  sources:
    - {title: "Jeffrey Green, historian: \"In Dahomey\", London, 1903", url: "https://jeffreygreen.co.uk/in-dahomey-london-1903", quote: "Audiences expected the 1890s cakewalk dance and the management added it in mid-June."}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "Their version of the 'Cakewalk' and 'Buck and Wing' caused a sensation in London dancehalls."}
- card: in-dahomey
  fact: "A shortened version was given as a command performance for the king at Buckingham Palace"
  sources:
    - {title: "Jeffrey Green, historian: \"In Dahomey\", London, 1903", url: "https://jeffreygreen.co.uk/in-dahomey-london-1903", quote: "a truncated version had been presented to the king at Buckingham Palace on 27 June"}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "A royal command performance of the musical at Buckingham Palace secured the show's success"}
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "played a command performance at Buckingham Palace"}
- card: in-dahomey
  fact: "It then toured Britain into 1904"
  sources:
    - {title: "Jeffrey Green, historian: \"In Dahomey\", London, 1903", url: "https://jeffreygreen.co.uk/in-dahomey-london-1903", quote: "it toured to Scotland in mid-1904"}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "it subsequently toured Britain"}
- card: in-dahomey
  fact: "Williams and Walker went on to Bandanna Land in 1908"
  sources:
    - {title: "Encyclopaedia Britannica: Bert Williams", url: "https://www.britannica.com/biography/Bert-Williams", quote: "Other successes followed, notably Abyssinia (1906), Bandanna Land (1908)"}
    - {title: "Gallatin Galleries, New York University: Transformation! exhibition texts", url: "https://wp.nyu.edu/gallatingalleries/?p=15811", quote: "Sons of Ham (1900), In Dahomey (1903), and Bandanaland (1908)"}
- card: in-dahomey
  fact: "In Dahomey set a standard for Black performance on the London stage lasting into the 1920s"
  sources:
    - {title: "Jeffrey Green, historian: \"In Dahomey\", London, 1903", url: "https://jeffreygreen.co.uk/in-dahomey-london-1903", quote: "The show set a standard for black dance/song/acting that lasted into the 1920s"}
    - {title: "London Museum: In Dahomey programme, Shaftesbury Theatre, 1903", url: "https://londonmuseum.org.uk/collections/v/object-547796/in-dahomey", quote: "A royal command performance of the musical at Buckingham Palace secured the show's success and it subsequently toured Britain. At least three cast members then settled in London."}
- card: the-harp-savage
  fact: "The Harp was made by Augusta Savage for the 1939 New York World's Fair"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "was commissioned by the New York World's Fair of 1939 to create a sculpture"}
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "In the late 1930s Savage was commissioned to create a sculpture for the 1939 New York World's Fair"}
- card: the-harp-savage
  fact: "Savage was born in Green Cove Springs, Florida, in 1892"
  sources:
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "Augusta Savage (born February 29, 1892, Green Cove Springs, Florida"}
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "Augusta Savage born Green Cove Springs, FL 1892"}
- card: the-harp-savage
  fact: "She opened a studio school in Harlem in 1932"
  sources:
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "founding the Savage Studio of Arts and Crafts in Harlem in 1932"}
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, chronology", url: "https://lawrencemigration.phillipscollection.org/artist/chronology", quote: "1932 Artist Augusta Savage opens the Savage School of Arts and Crafts in Harlem."}
- card: the-harp-savage
  fact: "In 1934 she became the first African American member of the National Association of Women Painters and Sculptors"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "In 1934 she became the first African-American member of the National Association of Women Painters and Sculptors."}
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "In 1934 Savage became the first African American elected to the National Association of Women Painters and Sculptors"}
- card: the-harp-savage
  fact: "In 1937 she became the first director of the Harlem Community Art Center"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "She was appointed the first director of the Harlem Community Art Center"}
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "In 1937 she assumed the role of the inaugural director at the Harlem Community Art Center"}
- card: the-harp-savage
  fact: "She fought for Black artists in the WPA art projects and helped young painters such as Jacob Lawrence in"
  sources:
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "Savage also fought successfully for the inclusion of Black artists in WPA projects."}
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, chronology", url: "https://lawrencemigration.phillipscollection.org/artist/chronology", quote: "With the assistance of Augusta Savage , is accepted into the WPA/FAP easel division."}
- card: the-harp-savage
  fact: "Theme from Lift Every Voice and Sing by James Weldon Johnson"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "Inspired by the lyrics of James Weldon Johnson's poem Lift Every Voice and Sing"}
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "The piece, The Harp , inspired by James Weldon Johnson 's poem \"Lift Every Voice and Sing,\""}
    - {title: "University of Pennsylvania, Weitzman School: Augusta Savage (1892–1962)", url: "https://architecture.sas.upenn.edu/node/947", quote: "inspired by the song written by NAACP leader, James Weldon Johnson"}
- card: the-harp-savage
  fact: "She named it Lift Every Voice and Sing; the fair called it The Harp"
  sources:
    - {title: "University of Pennsylvania, Weitzman School: Augusta Savage (1892–1962)", url: "https://architecture.sas.upenn.edu/node/947", quote: "In this piece, which was renamed \"The Harp\" by the World's Fair Commission"}
    - {title: "The Studio Museum in Harlem: Augusta Savage", url: "https://studiomuseum.org/artists/augusta-savage", quote: "Savage created Lift Every Voice and Sing (also known as The Harp )"}
- card: the-harp-savage
  fact: "It stood sixteen feet high, in plaster"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "the sixteen-foot sculpture. Cast in plaster"}
    - {title: "The Studio Museum in Harlem: Augusta Savage", url: "https://studiomuseum.org/artists/augusta-savage", quote: "a sixteen-foot plaster sculpture"}
- card: the-harp-savage
  fact: "Twelve Black singers in graduated heights formed the strings; the hand of God the sounding board"
  sources:
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "a group of twelve stylized black singers in graduated heights that symbolized the strings of the harp. The sounding board was formed by the hand and arm of God"}
    - {title: "University of Pennsylvania, Weitzman School: Augusta Savage (1892–1962)", url: "https://architecture.sas.upenn.edu/node/947", quote: "the soundboard of the harp is formed by the hand of God, the strings formed by the choir members robes, and the twelve singers"}
- card: the-harp-savage
  fact: "There was no money to cast it in bronze, and it was destroyed after the fair"
  sources:
    - {title: "University of Pennsylvania, Weitzman School: Augusta Savage (1892–1962)", url: "https://architecture.sas.upenn.edu/node/947", quote: "it was destroyed at the conclusion of the fair, as Savage did not have enough money to have it cast in bronze"}
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "No funds were available to cast The Harp ... After the fair closed it was demolished"}
    - {title: "The Studio Museum in Harlem: Augusta Savage", url: "https://studiomuseum.org/artists/augusta-savage", quote: "a sixteen-foot plaster sculpture that was destroyed following the close of the Fair"}
- card: the-harp-savage
  fact: "Many of her other works were lost for lack of funds"
  sources:
    - {title: "The Studio Museum in Harlem: Augusta Savage", url: "https://studiomuseum.org/artists/augusta-savage", quote: "She had very few financial resources, which directly contributed to the loss of many of her sculptures."}
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "it and many other works by Savage were never cast in durable materials and were later lost or destroyed"}
- card: the-harp-savage
  fact: "She died in New York in 1962"
  sources:
    - {title: "Encyclopaedia Britannica: Augusta Savage", url: "https://www.britannica.com/biography/Augusta-Savage", quote: "died March 26, 1962, New York, New York"}
    - {title: "Smithsonian American Art Museum: Augusta Savage", url: "https://americanart.si.edu/artist/augusta-savage-4269", quote: "died New York City 1962"}
- card: the-harp-savage
  fact: "She is remembered as a teacher of a generation of Harlem artists"
  sources:
    - {title: "The Studio Museum in Harlem: Augusta Savage", url: "https://studiomuseum.org/artists/augusta-savage", quote: "In her commitment to teaching ... of young people, including Gwendolyn Knight and Norman Lewis"}
    - {title: "University of Pennsylvania, Weitzman School: Augusta Savage (1892–1962)", url: "https://architecture.sas.upenn.edu/node/947", quote: "Her legacy is so prevalent in both her own body of work and that of her students"}
- card: migration-series
  fact: "Sixty small tempera paintings by Jacob Lawrence, 1940–41"
  sources:
    - {title: "Lee Rosenbaum, CultureGrrl, ArtsJournal (April 2015)", url: "https://www.artsjournal.com/culturegrrl/2015/04/one-way-ticket-lawrences-migration-series-should-remain-whole-after-momas-showing-with-video.html", quote: "the 60 small tempera paintings chronicling the movement of millions of African-Americans from South to North"}
    - {title: "Steven Zucker and Beth Harris, Jacob Lawrence, The Migration Series, Smarthistory", url: "https://smarthistory.org/jacob-lawrence-the-migration-series/", quote: "Jacob Lawrence, The Migration Series , 1940-41, 60 panels, tempera on hardboard"}
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "a series of 60 paintings and accompanying captions"}
- card: migration-series
  fact: "It tells the Great Migration of Black Southerners to Northern cities beginning in WWI"
  sources:
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, introduction", url: "https://lawrencemigration.phillipscollection.org/the-migration-series", quote: "the Great Migration, the flight of over a million African Americans from the rural South to the industrial North following the outbreak of World War I"}
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "narrate the story of the Great Migration"}
- card: migration-series
  fact: "First caption: During the World War there was a great migration north by southern Negroes"
  sources:
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "Panel 1: During World War I there was a great migration north by southern African"}
    - {title: "Steven Zucker and Beth Harris, Jacob Lawrence, The Migration Series, Smarthistory", url: "https://smarthistory.org/jacob-lawrence-the-migration-series/", quote: "\"During the World War, there was a great migration north by Southern Negroes.\""}
- card: migration-series
  fact: "Lawrence was born in Atlantic City, New Jersey, in 1917"
  sources:
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "born September 7, 1917, Atlantic City , New Jersey"}
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, chronology", url: "https://lawrencemigration.phillipscollection.org/artist/chronology", quote: "September 7: Jacob Armstead Lawrence is born in Atlantic City, New Jersey"}
- card: migration-series
  fact: "In Harlem he studied under Charles Alston at the Harlem Art Workshop and came to know Augusta Savage"
  sources:
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "At the Harlem Art Workshop ... in 1932, he studied under Charles H. Alston . Through Alston, he met artists and writers associated with the Harlem Renaissance , including Augusta Savage"}
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, chronology", url: "https://lawrencemigration.phillipscollection.org/artist/chronology", quote: "continues to study with Charles Alston at the WPA Harlem Art Workshop"}
- card: migration-series
  fact: "A Julius Rosenwald Fund grant let him take on the subject"
  sources:
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "Lawrence received a grant from the Julius Rosenwald Fund and started working on The Migration of the American Negro"}
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, chronology", url: "https://lawrencemigration.phillipscollection.org/artist/chronology", quote: "Awarded a $1,500 fellowship from the Julius Rosenwald Fund to complete a series of paintings on \"the great Negro migration during the World War,\""}
- card: migration-series
  fact: "He wrote a caption for each panel and conceived the sixty as one unit"
  sources:
    - {title: "The Phillips Collection, Jacob Lawrence: The Migration Series, introduction", url: "https://lawrencemigration.phillipscollection.org/the-migration-series", quote: "wrote captions to accompany each panel. Like the storyboards of a film, he saw the panels as one unit"}
    - {title: "Lee Rosenbaum, CultureGrrl, ArtsJournal (April 2015)", url: "https://www.artsjournal.com/culturegrrl/2015/04/one-way-ticket-lawrences-migration-series-should-remain-whole-after-momas-showing-with-video.html", quote: "He had conceived it as a unit and insisted it be kept that way."}
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "60 paintings and accompanying captions"}
- card: migration-series
  fact: "He was 23"
  sources:
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "Lawrence was just 23 when he created this masterpiece of narrative painting"}
    - {title: "Lee Rosenbaum, CultureGrrl, ArtsJournal (April 2015)", url: "https://www.artsjournal.com/culturegrrl/2015/04/one-way-ticket-lawrences-migration-series-should-remain-whole-after-momas-showing-with-video.html", quote: "within months of their completion by the precocious 23-year-old"}
- card: migration-series
  fact: "Shown at the Downtown Gallery in New York in late 1941"
  sources:
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "The series was shown at the Downtown Gallery in New York City in 1941"}
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "Soon after the series was exhibited at a New York art gallery in late 1941"}
- card: migration-series
  fact: "In 1942 MoMA bought the thirty even-numbered panels and the Phillips the odd-numbered"
  sources:
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "The Phillips Collection purchased the odd numbered panels and the Museum of Modern Art acquired the 30 even numbered panels"}
    - {title: "Lee Rosenbaum, CultureGrrl, ArtsJournal (April 2015)", url: "https://www.artsjournal.com/culturegrrl/2015/04/one-way-ticket-lawrences-migration-series-should-remain-whole-after-momas-showing-with-video.html", quote: "In the 1942 ... divvied up by the Museum of Modern Art (which bought the even-numbered panels) and the Phillips Collection in Washington (the odd-numbered panels)"}
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "the two institutions ultimately purchased it jointly, splitting the pieces between them"}
- card: migration-series
  fact: "The halves were reunited in Washington in 2008 and at MoMA in 2015"
  sources:
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "Exhibition May 3, 2008 - October 26, 2008 ... This exhibition brings the series together in its original sequence"}
    - {title: "Lee Rosenbaum, CultureGrrl, ArtsJournal (April 2015)", url: "https://www.artsjournal.com/culturegrrl/2015/04/one-way-ticket-lawrences-migration-series-should-remain-whole-after-momas-showing-with-video.html", quote: "One-Way Ticket: Jacob Lawrence's Migration Series and Other Works (to Sept. 7)"}
    - {title: "Museum of Modern Art: Jacob Lawrence, panel 60, exhibition history", url: "https://www.moma.org/collection/works/78550", quote: "One-Way Ticket: Jacob Lawrence's Migration Series and Other Visions of the Great Movement North Apr 3–Sep 7, 2015"}
- card: migration-series
  fact: "Flat, bright colour; one of the great narrative works of American painting"
  sources:
    - {title: "Encyclopaedia Britannica: Jacob Lawrence", url: "https://www.britannica.com/biography/Jacob-Lawrence", quote: "The abstract figures and flat primary colours that would become the hallmarks of Lawrence's style"}
    - {title: "The Phillips Collection: The Great American Epic (exhibition, 2008)", url: "https://www.phillipscollection.org/events/2008-05-03-exhibition-lawrence-migration-series", quote: "this masterpiece of narrative painting, which uses vivid patterns and colors"}
- card: mbube
  fact: "Mbube means lion in Zulu"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "He called the song Mbube , Zulu for lion."}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "originally called Mbube (or Lion , in Zulu)"}
- card: mbube
  fact: "Solomon Linda, a Zulu migrant worker, recorded it in Johannesburg in 1939 with the Evening Birds"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "In 1939, a Zulu migrant worker and entertainer who called himself Solomon Linda stood before a microphone in Johannesburg's first recording studio"}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "After Linda and his group the Evening Birds released \"Mbube\" in 1939"}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "Linda composed the song ... in 1939 in Johannesburg."}
- card: mbube
  fact: "Linda improvised a falsetto line"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "improvising falsetto vocal lines against a rolling, driving vocal chant"}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "featuring Linda's beguiling falsetto lilt"}
- card: mbube
  fact: "Gallo released it and it became a hit in South Africa"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "the recording of Mbube released by Gallo Records, already a good seller in South Africa"}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "It became a hit throughout South Africa."}
- card: mbube
  fact: "Linda signed his rights over to the record company"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "Solomon Linda had assigned his worldwide copyright in Mbube to the Gallo Record Company for a consideration of 10 shillings."}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "Linda and his wife had sold the rights to his song to a local company in 1939"}
- card: mbube
  fact: "In the early 1950s Pete Seeger misheard the Zulu words and called it Wimoweh; the Weavers charted it"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "In the early 1950s the recording of Mbube ... came to the attention of Pete Seeger ... which he called Wimoweh (a corruption of the Zulu lyrics"}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "Mishearing the lyric and assuming it was a folk song, he changed the title to \"Wimoweh,\" recorded it with the Weavers in 1952, and mainlined Linda's melody onto the pop charts."}
- card: mbube
  fact: "In 1961 new lyrics made it The Lion Sleeps Tonight, a number one for the Tokens"
  sources:
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "what became \"The Lion Sleeps Tonight,\" a Number One hit in 1961"}
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "later reworked into another version in the 1960s by song writers George Weiss, Hugo Peretti and Luigi Creatore, as The Lion Sleeps Tonight . In this form the song became a major hit"}
- card: mbube
  fact: "It later went into Disney's The Lion King"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "Then in the mid-1990s it was incorporated into the Disney musical The Lion King ."}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "the song was used in Walt Disney's international hit The Lion King , released in 1994"}
- card: mbube
  fact: "More than 150 artists have recorded it"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "More than 150 different artists have recorded it"}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "covered by ... more than 150 artists worldwide"}
- card: mbube
  fact: "Linda received almost nothing and died in poverty in 1962"
  sources:
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "never benefitted from his song's popularity. He died in poverty in 1962."}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "For decades, Linda barely received any compensation"}
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "he died a pauper"}
- card: mbube
  fact: "A Rolling Stone exposé by Rian Malan described his daughters' poverty, and the family sued in South Africa"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "journalist Rian Malan wrote an article for Rolling Stone magazine ... the Linda daughters ... were living in abject poverty"}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "a Rolling Stone story had tipped the world off to the situation and Linda's family sued Disney"}
- card: mbube
  fact: "They invoked an imperial copyright rule returning rights to the estate 25 years after death"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "where an author assigned his copyright during his lifetime, 25 years after his death the copyright reverted to the Executor of his estate"}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "according to copyright law in the British Commonwealth at the time, the rights to the song were to revert back to the composer's heirs 25 years after his death"}
- card: mbube
  fact: "They attached Disney's South African trademarks"
  sources:
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "\"attaching\" some 200 registered trade marks owned by Walt Disney Enterprises in South Africa"}
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "the family won a court order to attach more than 240 Disney trademarks registered in South Africa"}
- card: mbube
  fact: "In 2006 they settled with Abilene Music; Linda credited as co-composer; heirs got past and future royalties"
  sources:
    - {title: "CBC News: South African family settles 'Lion Sleeps Tonight' lawsuit (2006)", url: "https://www.cbc.ca/news/entertainment/south-african-family-settles-lion-sleeps-tonight-lawsuit-1.607085", quote: "Linda's heirs had reached a settlement with U.S. music publishing house Abilene Music ... compensation [that takes into account] past and future use"}
    - {title: "Owen Dean, Copyright in the Courts: The Return of the Lion, WIPO Magazine (2006)", url: "https://wipo.int/web/wipo-magazine/articles/copyright-in-the-courts-the-return-of-the-lion-35180", quote: "Solomon Linda is acknowledged as a co-composer of The Lion Sleeps Tonight"}
    - {title: "David Browne, 'The Lion Sleeps Tonight': The Ongoing Saga, Rolling Stone (2019)", url: "https://www.rollingstone.com/music/music-features/lion-sleeps-tonight-lion-king-update-879663/", quote: "Linda ... would belatedly receive a co-writing credit ... his family would be handed a lump sum for past royalties and a cut of future revenue"}
- card: all-negro-hour
  fact: "The All-Negro Hour first aired on WSBC Chicago on 3 November 1929"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "On 3 November 1929 at 5:00 P.M., Cooper launched The All-Negro Hour"}
    - {title: "TeachRock: Pioneers of Early Black Radio", url: "https://teachrock.org/wp-content/uploads/Pioneers-of-Early-Black-Radio.pdf", quote: "On November 3, 1929, white-owned radio station WSBC in Chicago premiered \"The All-Negro Hour,\""}
- card: all-negro-hour
  fact: "Radio then had Black singers but no Black announcers or hosts"
  sources:
    - {title: "TeachRock: Pioneers of Early Black Radio", url: "https://teachrock.org/wp-content/uploads/Pioneers-of-Early-Black-Radio.pdf", quote: "while Black artists often appeared in early radio broadcasts, radio shows did not have Black announcers, actors, or masters of ceremonies"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "the only time he ever heard blacks on radio was when they were singing, never speaking"}
- card: all-negro-hour
  fact: "Jack L. Cooper was born in 1888"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "Born in Memphis, Tennessee, 18 September 1888."}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "Jack Leroy Cooper (1888-1970)"}
- card: all-negro-hour
  fact: "He had been a boxer and vaudeville song-and-dance man"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "Boxed in 160 amateur bouts; ... performed as dancer, singer, actor, and comedian in traveling vaudeville shows"}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "winning the Ohio Negro welterweight title ... Cooper began his entertainment career as a dancer and comic on the Theater Owners Booking Association"}
- card: all-negro-hour
  fact: "He wrote on the theatre for the Chicago Defender"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "In 1924 he was covering the theater scene for the Chicago Defender"}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "the position of assistant theater editor at the influential Chicago Defender"}
- card: all-negro-hour
  fact: "The paper sent him to Washington in the mid-1920s, where he began in radio on WCAP"
  sources:
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "the newspaper selected him to help open up its new Washington, D.C. office in 1925. Later that year, the producer of a show on WCAP in Washington, D.C., hired Cooper"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio (separate entry, different author)", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "While on assignment in Washington in 1925, Cooper began writing, producing, and starring in his own black vaudeville show on WCAP."}
- card: all-negro-hour
  fact: "Back in Chicago he sought a station for a show by Black people for Black listeners; Silverstein's WSBC, selling time to immigrant groups, agreed"
  sources:
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "In 1929, Joseph Silverstein, owner of WSBC, a low-power station that catered mainly to Chicago's large immigrant population, agreed to air Cooper's The All-Negro Hour ."}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "He returned to Chicago determined to produce radio programming by black people for black people. ... Joseph Sil­verstein, who owned WSBC, a small station that featured various ethnic programs"}
- card: all-negro-hour
  fact: "The show offered music, comedy and serial sketches"
  sources:
    - {title: "TeachRock: Pioneers of Early Black Radio", url: "https://teachrock.org/wp-content/uploads/Pioneers-of-Early-Black-Radio.pdf", quote: "featured music, comedy, and serial dramas"}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "focused on live music and vaudeville comedy but gradually incorporated the comedy serials"}
- card: all-negro-hour
  fact: "In 1932 a performer walked out over pay; Cooper played records into a microphone and kept doing so"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "One Sunday evening in 1932, The All-Negro Hour's pianist walked out on the show at the last minute to protest Cooper's refusal to give her a pay raise. In her absence, the boss improvised by putting a microphone by a small record player and spinning records."}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio (separate entry, different author)", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "One of Cooper's live broadcasts was threatened in 1932 when the key performer abruptly quit over a pay dispute. Cooper creatively set up a phonograph, placed a microphone in front of it"}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "Cooper popularized playing records on the radio."}
- card: all-negro-hour
  fact: "He is remembered as America's first Black disc jockey"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "his status as America's first black disc jockey"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio (separate entry, different author)", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "Inadvertently, he had become the first African-American disc jockey."}
- card: all-negro-hour
  fact: "He built an empire; by the late 1940s over 40 hours a week on four Chicago stations"
  sources:
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "By the late 1940s, Cooper produced over 40 hours of radio each week on four radio stations."}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "By 1947 Jack L. Cooper Presentations was producing programs on Chicago's WSBC, WHFC, WBEE, and WAAF. He controlled some 40 hours of airtime"}
- card: all-negro-hour
  fact: "He died in Chicago in 1970"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "Died in Chicago, 12 January 1970."}
    - {title: "Willie Brenc, Jack Leroy Cooper (1888–1970), BlackPast.org", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "Jack L. Cooper died on January 12, 1970 in Chicago."}
- card: all-negro-hour
  fact: "His model led to stations such as WDIA Memphis, which in 1949 put an all-Black staff on air"
  sources:
    - {title: "TeachRock: Pioneers of Early Black Radio", url: "https://teachrock.org/wp-content/uploads/Pioneers-of-Early-Black-Radio.pdf", quote: "In 1949, station WDIA in Memphis, Tennessee, became the first to employ an all-Black on-air announcing staff."}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: Cooper, Jack L.", url: "https://www.museum.tv/radio-encyclopedia-3/cooper-jack-l", quote: "WDIA in Memphis, the first all-black-appeal station in America (1949) would be the culmination of what Cooper had begun in the late 1920s."}
- card: tropiques
  fact: "Tropiques was a cultural review published in Fort-de-France, Martinique, 1941–1945"
  sources:
    - {title: "Brown University Library, Liberation Journals Index: Tropiques", url: "https://library.brown.edu/liberation/aboutJournals.php?journ=8", quote: "Tropiques, \"Revue Culturelle\" Fort-de-France, Martinique. 1941-1945"}
    - {title: "Paul-Louis Biondi, Tropiques, Surrealism at One Hundred, Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/tropiques", quote: "With fourteen issues between 1941 and 1945, Tropiques"}
- card: tropiques
  fact: "Martinique was ruled for Vichy by Admiral Georges Robert under heavy censorship"
  sources:
    - {title: "Paul-Louis Biondi, Tropiques, Surrealism at One Hundred, Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/tropiques", quote: "Under Admiral Georges Robert, the Vichy high commissioner to the Antilles, heavy censorship was enforced"}
    - {title: "Anny Dominique Curtius, Tropiques: Le dialogue créole écopoétique, Présence Africaine 189 (2014)", url: "https://lllc.uiowa.edu/sites/lllc.uiowa.edu/files/2025-06/Tropiques%20Le%20dialogue%20e%CC%81copoe%CC%81tique%20d%27Aime%CC%81%20et%20Suzanne%20Ce%CC%81saire.pdf", quote: "la quasi- dictature de l'Amiral Robert, représentant du gouvernement de Vichy de 1939 à 1943 en Martinique"}
    - {title: "Katerina Gonzalez Seligmann, Tropiques, Revolutionary Papers", url: "https://revolutionarypapers.org/?p=305", quote: "subject to Vichy censorship for half-run"}
- card: tropiques
  fact: "Founders included Aimé Césaire, Suzanne Césaire and René Ménil"
  sources:
    - {title: "Paul-Louis Biondi, Tropiques, Surrealism at One Hundred, Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/tropiques", quote: "In addition to Aimé and Suzanne Césaire, René Ménil helped found the literary journal"}
    - {title: "Katerina Gonzalez Seligmann, Tropiques, Revolutionary Papers", url: "https://revolutionarypapers.org/?p=305", quote: "Editorial Collective: Aimé Césaire, Suzanne Césaire, René Ménil"}
- card: tropiques
  fact: "They wanted Martinique to have its own literature and thought"
  sources:
    - {title: "Paul-Louis Biondi, Tropiques, Surrealism at One Hundred, Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/tropiques", quote: "a tool towards the realization of a project of Martinican literary and cultural production"}
