# Second, independent check of the wedgwood-medallion perspective rewrite (2026-11-15).
# Every source below was opened by the checker. Quotes marked [...] are condensed.
# Corrections applied to the card (.md and .ru.md) and to perspective-wedgwood-medallion.yaml:
#  - "Clarkson asked him for as many as he could spare" rested on the V&A article alone;
#    replaced by "received a whole consignment" (Clarkson 1808 + V&A object record).
#  - "a leading abolitionist" -> "a committed abolitionist" (V&A + Hunt).
#  - "Men set the cameos into ... snuffboxes" -> "Some set ..." (sources say "some", not men).
#  - "a curate's wife" -> "a clergyman's wife" (curate only attested for 1807).
#  - Brookes sentence was missing from the ledger; added with two sources.
# Word counts per copy after fixes: EN male 173, female 219; RU male 157, female 218. Lint: 456 cards OK.
- fact: "In 1787 the abolition committee adopted the kneeling-man image as its seal"
  verdict: confirmed
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "a seal commissioned by the Committee for the Abolition of the Slave Trade on 5 July 1787"}
    - {title: "Oberlin College Library: The Kneeling Slave", url: "https://oberlincollegelibrary.org/speccoll/exhibits/show/subjectsoffreedom/kneeling", quote: "adopted in 1787 as the official seal for the Society for the Abolition of the Slave Trade in England"}
  note: ""
- fact: "Granville Sharp was among the founders of the 1787 committee"
  verdict: confirmed
  sources:
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "In 1787, he was one of the committee of people, mostly Quakers, who set up the Society"}
    - {title: "The Clapham Society: Granville Sharp", url: "https://claphamsociety.com/article/24-granville-sharp/", quote: "In 1787 he was one of the twelve founding signatories to The Society for the Abolition of the Slave Trade."}
  note: ""
- fact: "That same year Wedgwood had it made in jasperware, probably modelled by William Hackwood"
  verdict: confirmed
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "sculpted in 1787, probably by William Hackwood, Wedgwood's best modeller"}
    - {title: "American Philosophical Society: Anti-Slavery Medallion", url: "https://www.amphilsoc.org/item-detail/anti-slavery-medallion", quote: "William Hackwood and Josiah Wedgwood [...] c. 1787 [...] Ceramic jasperware"}
  note: "Historic Deerfield also gives Hackwood, 1787."
- fact: "Wedgwood, a committed abolitionist, gave the cameos away"
  verdict: corrected
  sources:
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "Mr. Wedgwood made a liberal donation of these, when finished, among his friends."}
    - {title: "Tristram Hunt, The Radical Potter (2021), excerpt in Literary Hub", url: "https://lithub.com/how-the-potter-josiah-wedgwood-created-an-iconic-abolitionist-medallion/", quote: "Together with his political hero Major John Cartwright, Wedgwood was elected on to the Committee."}
  note: "Was 'a leading abolitionist'; neither source says leading. Free distribution also in V&A ('distributed for free') and Historic Deerfield ('distribute them freely as did Wedgwood')."
- fact: "Thomas Clarkson received a whole consignment of the cameos"
  verdict: corrected
  sources:
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "I received from him no less than five hundred of them myself."}
    - {title: "Victoria and Albert Museum, object record 414:1304-1885", url: "https://collections.vam.ac.uk/item/O79580", quote: "Wedgwood is known to have sent consignments to both the American statesman Benjamin Franklin [...] and Thomas Clarkson"}
  note: "Was 'asked him for as many as he could spare': only the V&A article quotes that letter; no second independent source found (Margolin, Hunt, thepotteries.org checked). Fitzwilliam record giving 500 could not be opened (TLS error), so the number stays out of the text."
- fact: "In 1788 a batch reached Benjamin Franklin in Philadelphia"
  verdict: confirmed
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "In 1788, Wedgwood sent a batch to future Founding Father Benjamin Franklin"}
    - {title: "Oberlin College Library: The Kneeling Slave", url: "https://oberlincollegelibrary.org/speccoll/exhibits/show/subjectsoffreedom/kneeling", quote: "In 1788, a consignment of the cameos was shipped to Benjamin Franklin in Philadelphia."}
  note: ""
- fact: "Franklin wrote back that the figure 'may have an Effect equal to that of the best written Pamphlet'"
  verdict: confirmed
  sources:
    - {title: "American Philosophical Society: Anti-Slavery Medallion", url: "https://www.amphilsoc.org/item-detail/anti-slavery-medallion", quote: "may have an Effect equal to that of the best written Pamphlet, in procuring Favour to those oppressed People."}
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "the best written Pamphlet in procuring Favour to these oppressed People"}
