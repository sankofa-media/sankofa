  verdict: corrected
  sources:
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "Some had them inlaid in gold on the lid of their snuff-boxes."}
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "used them to decorate snuff boxes"}
  note: "Was 'Men set...'; no source specifies men. The V&A article quotes the same Clarkson passage, so it is not counted separately."
- fact: "The Brookes print, a plan of captives packed into a ship's hull, was the medallion's partner in the campaign"
  verdict: confirmed
  sources:
