    - {title: "West Bromwich Local History Society: Lucy Townsend", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "On April 8th, 1825 Lucy Townsend held a meeting at her home in West Bromwich"}
