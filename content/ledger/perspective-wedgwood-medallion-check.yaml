    - {title: "West Bromwich Local History Society: Lucy Townsend", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "She married Rev. Charles Townsend, curate of West Bromwich in 1807."}
  note: "Was 'a curate's wife'; curacy is attested for 1807 only, so the wording now follows what both sources share."
