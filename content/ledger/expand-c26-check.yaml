  - card: daughters-of-the-dust
    fact: "After its 1991 Sundance premiere it opened in cinemas in January 1992, the first feature by an African American woman with a general theatrical release in the US"
    verdict: corrected
    sources:
      - {title: "UCLA Film & Television Archive, L.A. Rebellion: Julie Dash", url: "https://cinema.ucla.edu/collections/la-rebellion/filmmakers/julie-dash", quote: "was the first film by an African American woman to receive a general theatrical release in the United States"}
      - {title: "Yale University Library, Film Notes: Daughters of the Dust", url: "https://web.library.yale.edu/film/notes/fn00079", quote: "no feature film by an African-American woman received general theatrical distribution across the United States until January 15, 1992, when writer/director Julie Dash's DAUGHTERS OF THE DUST was released by Kino International"}
    note: "Card said \"Released in 1991\"; the film premiered at Sundance in January 1991 but its theatrical release was 15 January 1992 (AFI, Yale, Charleston City Paper). EN/RU body reworded; AFI, Yale and City Paper added to card sources."
