    note: ""
  - card: daughters-of-the-dust
    fact: "Julie Dash grew up in New York in a household where Gullah culture was alive"
    verdict: confirmed
    sources:
      - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "You grew up in a household with this [Gullah] culture around you even though you grew up in New York City."}
      - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "Born and raised in a Queens , New York , housing project"}
    note: "Sundance (interviewer statement Dash accepts) and Encyclopedia.com (Queens housing project; father's Gullah accent) agree."
  - card: daughters-of-the-dust
