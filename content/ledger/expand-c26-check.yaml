    sources:
      - {title: "UCLA Film & Television Archive, L.A. Rebellion: Daughters of the Dust", url: "https://cinema.ucla.edu/collections/la-rebellion/daughters-of-the-dust/", quote: "off the coast of South Carolina and Georgia where they maintain strong connections to African linguistic and cultu"}
