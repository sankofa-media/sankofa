  verdict: confirmed
  sources:
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "Lillian Hardin was born in Memphis, Tennessee, in 1898. ... She entered Fisk University while still in her teens."}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "at Fisk University in Nashville"}
  note: "LAHM blog: 'received a certificate from Fisk University'."
