  verdict: confirmed
  sources:
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "By 1921, Lil was pianist for trumpet player Joe \"King\" Oliver's Creole Jazz Band at the Royal Gardens."}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "In 1921, Lil joined King Oliver's Creole Jazz Band at the Dreamland"}
