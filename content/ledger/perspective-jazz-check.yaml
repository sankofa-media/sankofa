    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "The wedding took place February 5, 1924 ... wasting his time playing second cornet to Oliver"}
