# Batch c11 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a verbatim quote.
# No cards dropped. Web search quota ran out mid-run; remaining sources were fetched by known URL.

- card: mary-prince
  fact: "Mary Prince was born into slavery around 1788 at Brackish Pond, Bermuda"
  sources:
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince was born around 1788 at Brackish Pond in Devonshire"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Mary Prince was born in Brackish Pond, Bermuda, in 1788"}
- card: mary-prince
  fact: "Britain outlawed the slave trade in 1807, but slavery in the colonies continued until the Abolition Act of 1833"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "The 1807 Abolition of the Slave Trade act had made it illegal for British subjects to ‘buy’ and ‘sell’ enslaved people throughout the British empire"}
    - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "The second brought about the abolition of the institution of slavery itself when the Abolition of Slavery Act was passed in 1833"}
- card: mary-prince
  fact: "She was sold to the salt ponds of Turks Island, returned to Bermuda, and was then sold to John Wood of Antigua"
  sources:
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "After a period working in the salt ponds of Turks Island, she returned to Bermuda and was sold once more, this time to John Wood of Antigua"}
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Darrell agreed to hire her to the Woods, who later purchased her for £100"}
- card: mary-prince
  fact: "In December 1826 she married Daniel James, a free carpenter, in the Moravian church"
  sources:
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "In December 1826 she married a free Black man Daniel James, a widowed carpenter, in the Moravian Church"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "a free carpenter and cooper named Daniel James, whom she married in December of 1826"}
- card: mary-prince
  fact: "In 1828 the Woods brought her to London"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "In 1828, Prince was brought from Antigua to London to work as a servant for her abusive enslavers of 10 years, the Woods"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Prince accompanied the Woods to England in 1828"}
- card: mary-prince
  fact: "The Woods refused to let her buy her freedom; returning to Antigua would mean re-enslavement"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "if she were to return to her husband in Antigua, she would be re-enslaved"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "When Wood refused to sell Prince her freedom—which would allow her to return to her family in Antigua without being re-enslaved"}
- card: mary-prince
  fact: "In November 1828 she left the Woods and went to the Anti-Slavery Society"
  sources:
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "November 1828 —Leaves the Woods household and finds her way to the offices of the Anti-Slavery Society"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "she worked for the Wood family until November of that year, when she left their household and consulted with a local anti-slavery society"}
- card: mary-prince
  fact: "She lived in the household of Thomas Pringle, secretary of the Anti-Slavery Society, and dictated her story to Susanna Strickland"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "She told her life story to writer Susanna Strickland, who compiled the text. Pringle edited the final document."}
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince had dictated her story to Susanna Strickland, who was a frequent houseguest of Thomas Pringle"}
- card: mary-prince
  fact: "Quotation: 'I have been a slave — I have felt what a slave feels, and I know what a slave knows'"
  sources:
    - {title: "Documenting the American South (UNC): The History of Mary Prince, full text (1831)", url: "https://docsouth.unc.edu/neh/prince/prince.html", quote: "I have been a slave--I have felt what a slave feels, and I know what a slave knows"}
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "I have felt what a slave feels, and I know what a slave knows"}
- card: mary-prince
  fact: "Her History (1831) was the first life story of a Black woman published in Britain"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "It was the first narrative of a Black woman to be published in Britain."}
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Bermudian National Hero Mary Prince was the first woman to publish an account of her life in slavery."}
- card: mary-prince
  fact: "It was printed three times in 1831"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "It was widely read and printed three times in 1831."}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "it became so popular that three editions were printed that year"}
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "It was a best seller, with three editions sold that year"}
- card: mary-prince
  fact: "Two libel suits followed; she testified in both; Wood won his case"
  sources:
    - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "Mary’s book was at the centre of two court cases"}
    - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "Although Woods won his case against Pringle and was awarded £25 in damages"}
    - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince, aged 45, by then half blind and in poor health, gave evidence at both trials"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Wood sued Pringle for libel and won by default"}
- card: mary-prince
  fact: "After 1833 she disappears from the record"
  sources:
    - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "We don’t know much of what happened to Prince after 1833"}
    - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "This court case marks the last time Prince appears in the public record."}
- card: maria-firmina-dos-reis
  fact: "She was born in São Luís, Maranhão, in 1822 or 1825 (sources disagree)"
  sources:
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "Maria Firmina dos Reis, nascida em onze de outubro de 1825 em São Luís"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "Ela foi batizada em 21 de dezembro de 1825"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "justificar por este Juiso que nasceo no dia 11 de Março do anno de 1822"}
- card: maria-firmina-dos-reis
  fact: "Slavery in Brazil lasted until 1888"
  sources:
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "Em 1888, ao assinar a Lei Imperial de Nº 3353, a princesa regente, Maria Isabel, declarava livres todos os negros cativos."}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "ela compôs o Hino da libertação dos escravos, em 1888"}
- card: maria-firmina-dos-reis
  fact: "She grew up with relatives in Guimarães"
  sources:
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "tia materna, mudou-se para o município de Guimarães"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "viveu a maior parte de sua vida com sua família extensa"}
- card: maria-firmina-dos-reis
  fact: "In 1847 she won a public examination for primary-school teacher"
  sources:
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "Em 1847, com vinte e cinco anos, Reis vence concurso público para a"}
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "Nomeação - O Progresso 13/8/1847"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "Firmina já era professora concursada no município de Guimarães"}
- card: maria-firmina-dos-reis
  fact: "In 1859 she published Úrsula signed 'Uma maranhense'"
  sources:
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "nome não estava contido na capa; ao contrário, constava apenas “Uma maranhense”"}
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "O romance Úrsula foi publicado por Firmina dos Reis em 1859 pela tipografia Progresso"}
- card: maria-firmina-dos-reis
  fact: "The preface says the book is worth little because written by a woman, a Brazilian woman, yet publishes it"
  sources:
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "Sei que pouco vale este romance, porque escrito por uma mulher, e mulher brasileira"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "Sei que pouco vale este romance, porque escrito por uma mulher, e mulher brasileira de educação acanhada"}
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "e ainda assim o dou a lume"}
- card: maria-firmina-dos-reis
  fact: "In the novel old Susana recalls her life in Africa and the crossing in a slave ship's hold, which she calls a tomb"
  sources:
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "a velha africana Preta Susana rememora como era sua vida na África, conta como se deu a sua transformação em escrava e como foi a sua viagem de travessia do Atlântico no porão de um navio negreiro"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "Trinta dias de cruéis tormentos e de falta absoluta de tudo quanto é mais necessário à vida passamos n’essa sepultura"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "Ao nomear o porão de sepultura"}
- card: maria-firmina-dos-reis
  fact: "Úrsula is now counted as the first novel by a Black woman in Brazil"
  sources:
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "o hoje considerado primeiro romance de autoria feminina negra"}
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "Primeiro Romance de autoria negra"}
- card: maria-firmina-dos-reis
  fact: "She published the story 'A Escrava' in 1887"
  sources:
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "o conto A Escrava (1887)"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "A Escrava (1887), conto abolicionista"}
- card: maria-firmina-dos-reis
  fact: "In 1888 she wrote a hymn for the liberation of the enslaved"
  sources:
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "ela compôs o Hino da libertação dos escravos, em 1888"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "compõe o Hino à libertação dos escravos"}
- card: maria-firmina-dos-reis
  fact: "After retiring she founded at Maçaricó a free school for boys and girls together, the first mixed school in Maranhão, which did not last"
  sources:
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "ao se aposentar, no início da década de 1880, teria fundado, na localidade de Maçaricó, a primeira escola mista e gratuita do Maranhão"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "pouco mais de dois anos depois, teve que ser fechada"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "fundação da primeira escola mista para meninos e meninas no estado do Maranhão"}
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "Essa informação complementa os dados sobre o fechamento das aulas em Maçaricó"}
- card: maria-firmina-dos-reis
  fact: "She died in Guimarães in 1917"
  sources:
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "falecida em onze de novembro de 1917 em Guimarães"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "faleceu em Guimarães, estado do Maranhão, em 11 de novembro de 1917"}
- card: maria-firmina-dos-reis
  fact: "The novel was forgotten until researchers brought it back; a facsimile appeared in 1975"
  sources:
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "A segunda edição foi resultado da digitalização desse livro (um fac-símile), e foi publicada em 1975"}
    - {title: "LabGen, Universidade Federal Fluminense: Apresentando Firmina (2021)", url: "https://labgen.uff.br/wp-content/uploads/sites/77/2021/08/Maria-Firmina-dos-Reis.pdf", quote: "Em 1975, José Nascimento Morais Filho publica a versão atualizada do texto"}
    - {title: "Patricia Fernanda Massetti de Lima: A mente de uma maranhense transgressora, RICS (UFMA, 2020)", url: "https://cajapio.ufma.br/index.php/ricultsociedade/article/download/13908/7541/41769", quote: "O resgate e renascimento de seu nome para as letras foram obras de José Nascimento de Morais Filho (1975)"}
- card: maria-firmina-dos-reis
  fact: "In Úrsula the enslaved characters tell their own stories"
  sources:
    - {title: "Luciana Martins Diogo and Ana Paula Cavalcanti Simioni: Da sujeição à subjetivação, Opiniães (USP, 2017)", url: "https://revistas.usp.br/opiniaes/article/download/122553/129554/256315", quote: "os enunciados provenientes das personagens negras são narrados por elas mesmas"}
    - {title: "Ingrid Meurer: Maria Firmina dos Reis, Mulheres na Filosofia (Unicamp, 2024)", url: "https://www.blogs.unicamp.br/mulheresnafilosofia/wp-content/uploads/sites/178/2024/07/Verbete-Maria-Firmina-dos-Reis-PDF.docx.pdf", quote: "A história do par trágico, Tancredo e Úrsula, é envolvida pelas experiências dos personagens negros Susana e Túlio, e estes então vêm a assumir o protagonismo narrativo."}
- card: mary-ann-shadd
  fact: "Born free in 1823 in Wilmington, Delaware, a slave state"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "b. 9 Oct. 1823 in Wilmington, Del."}
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "She was born in 1823 in the slave state of Delaware. Her parents were free African Americans who were dedicated to abolitionism."}
- card: mary-ann-shadd
  fact: "Eldest child of an abolitionist family whose home sheltered people escaping slavery"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "The eldest child of a prominent black abolitionist"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "Their home was a stop on the Underground Railroad"}
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "Shadd and her family actively helped freedom seekers"}
- card: mary-ann-shadd
  fact: "The 1850 Fugitive Slave Act allowed freedom seekers in free states to be returned; Black Americans left for Canada"
  sources:
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "This law made it legal to force freedom seekers in free states to return to enslavement."}
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "the black refugees who had fled from the United States to Upper Canada after the passage of the Fugitive Slave Act in 1850"}
- card: mary-ann-shadd
  fact: "In 1851 she moved to Windsor and opened a school for refugees' children"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "in the fall of 1851 Shadd moved to Windsor, where she opened a school"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "in 1851 moved to Windsor, where she opened a private school for the children of freedom seekers"}
- card: mary-ann-shadd
  fact: "In 1852 she published A Plea for Emigration"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "In the summer of 1852 she had published A plea for emigration"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "In 1852, she published A Plea for Emigration; or Notes of Canada West"}
- card: mary-ann-shadd
  fact: "The first issue of the Provincial Freeman appeared in March 1853"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "the first issue appeared in March"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "A first edition of The Provincial Freeman appeared on 24 March 1853."}
- card: mary-ann-shadd
  fact: "Samuel Ringgold Ward lent his name as editor because a woman's name might alienate readers; Shadd was the driving force"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "Ward only lent his name to the newspaper to generate interest and subscriptions"}
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "she nevertheless represented the driving force behind the new enterprise"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "Shadd had asked Samuel Ringgold Ward, Black abolitionist and lecturer for the Anti-Slavery Society of Canada , to lend his name and expertise as editor"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "Shadd was aware that her name on the masthead could alienate a readership"}
- card: mary-ann-shadd
  fact: "She spent a year on lecture tours raising subscriptions"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "Publication was then suspended for a year while Shadd travelled in the United States and Canada on a lecture tour to raise money"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "Shadd spent a year collecting subscriptions and building interest in her paper by taking to the lecture circuit"}
- card: mary-ann-shadd
  fact: "From 1854 the paper appeared weekly in Toronto under the motto 'Self-reliance is the true road to independence'"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "With the motto “Self-Reliance is the True Road to Independence,” the Freeman , now based in Toronto, began appearing on a regular basis"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "On 25 March 1854, The Provincial Freeman began publishing weekly out of Toronto"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "The paper’s motto, “Self-reliance is the true road to independence,”"}
- card: mary-ann-shadd
  fact: "The paper moved to Chatham and eventually folded"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "the paper was moved to Chatham"}
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "publication ceased entirely"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "After moving the newspaper to Chatham , Canada West, in 1855"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "the demise of The Provincial Freeman"}
- card: mary-ann-shadd
  fact: "She was the first Black woman in North America to publish and edit a newspaper"
  sources:
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "Mary Ann Shadd became the first Black woman in North America to publish and edit a newspaper"}
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "Cary became the first black, female newspaper editor in North American history"}
- card: mary-ann-shadd
  fact: "During the Civil War she recruited Black soldiers for the Union army"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "in late 1863 she accepted an invitation from Martin Robinson Delany to serve as an enlistment recruiter"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "She was hired by Dr. Martin Delany to recruit Black soldiers during the Civil War"}
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "Cary returned to the U.S. to help recruit soldiers for the Union Army."}
- card: mary-ann-shadd
  fact: "She taught in Washington, studied law at Howard University and was one of the first Black women to practise law"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "Supporting herself by teaching, she would eventually receive a law degree from Howard University in 1883."}
    - {title: "National Park Service: Mary Ann Shadd Cary", url: "https://www.nps.gov/people/mary-ann-shadd-cary.htm", quote: "she enrolled in the first class of Howard University Law School located in Washington, DC"}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "she later went on to study and practise law in Washington D.C., being one of the first Black women to do so"}
- card: mary-ann-shadd
  fact: "She died in Washington in 1893"
  sources:
    - {title: "Jason H. Silverman: Shadd, Mary Ann Camberton (Cary), Dictionary of Canadian Biography", url: "https://www.biographi.ca/en/bio/shadd_mary_ann_camberton_12E.html", quote: "d. 5 June 1893 in Washington, D.C."}
    - {title: "Adrienne Shadd: Mary Ann Shadd, The Canadian Encyclopedia", url: "https://www.thecanadianencyclopedia.ca/en/article/mary-ann-shadd", quote: "died 5 June 1893 in Washington, D.C."}
- card: aleijadinho
  fact: "Antônio Francisco Lisboa was born in Vila Rica (Ouro Preto), probably in 1738"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "Aleijadinho (born August 9, 1738?, Villa Rica [now Ouro Prêto], Brazil"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "Lisboa worked primarily and initially in Vila Rica, the capital of the captaincy of Minas Gerais. The name of the city changed to Ouro Preto"}
- card: aleijadinho
  fact: "He was the son of the Portuguese architect Manuel Francisco Lisboa and an African woman"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "the son of the Portuguese architect Manoel Francisco Lisboa and an African woman"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "was the son of a Portuguese-born architect , Manuel Francisco da Costa Lisboa, and an African slave named Isabel"}
- card: aleijadinho
  fact: "He was the most celebrated sculptor-architect of the Minas churches"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "was a prolific and influential Brazilian sculptor and architect"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "was a preeminent Brazilian High Baroque sculptor for and designer of churches and their interiors"}
- card: aleijadinho
  fact: "A disease, possibly leprosy, deformed his limbs and gave him his nickname 'little cripple'"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "led to the deformation of his limbs (his sobriquet means “Little Cripple”)"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "the appearance in 1777 of the symptoms of a disabling disease, which may have been leprosy"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "means “little cripple,”"}
- card: aleijadinho
  fact: "He lost the use of his hands but kept working with tools strapped to his arms"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "He eventually lost the use of his hands, but he continued working with tools strapped to his arms"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "he lost the use of his extremities, so he had to be carried about by his slaves, who also secured sculpting instruments to his hands"}
- card: aleijadinho
  fact: "In the late 1790s he made life-size cedar figures of the Passion for the chapels at Congonhas"
  sources:
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "From 1795 to 1799, working in wood, he produced six sanctuaries or chapels with scenes of the Way of the Cross"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "six chapels holding life-size painted figures carved in cedar wood"}
    - {title: "UNESCO World Heritage Centre: Sanctuary of Bom Jesus do Congonhas", url: "https://whc.unesco.org/en/list/334/", quote: "the polychrome wooden sculptures depicting scenes of Christ’s Passion housed in the chapels"}
- card: aleijadinho
  fact: "Between 1800 and 1805 he carved the twelve soapstone prophets on the stairway parapets"
  sources:
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "From 1800 to 1805, working in stone, he produced statues of twelve prophets."}
    - {title: "Agência Gov (EBC): Conheça Congonhas, onde a principal obra de Aleijadinho se tornou Patrimônio Mundial da Unesco (2026)", url: "https://agenciagov.ebc.com.br/noticias/202608/conheca-congonhas-mg-onde-a-principal-obra-de-aleijadinho-se-tornou-patrimonio-mundial-da-unesco", quote: "12 Profetas: esculturas em pedra-sabão, produzidas por Aleijadinho entre 1800 e 1805"}
    - {title: "UNESCO World Heritage Centre: Sanctuary of Bom Jesus do Congonhas", url: "https://whc.unesco.org/en/list/334/", quote: "carrying on its parapets statues of the twelve prophets in soapstone"}
- card: aleijadinho
  fact: "He died in 1814"
  sources:
    - {title: "Encyclopaedia Britannica: Aleijadinho", url: "https://www.britannica.com/biography/Aleijadinho", quote: "died November 18, 1814, Mariana"}
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "Lisboa died on November 18, 1814"}
- card: aleijadinho
  fact: "The sanctuary at Congonhas was inscribed on the World Heritage List in 1985"
  sources:
    - {title: "UNESCO World Heritage Centre: Sanctuary of Bom Jesus do Congonhas", url: "https://whc.unesco.org/en/list/334/", quote: "Date of Inscription: 1985"}
    - {title: "Agência Gov (EBC): Conheça Congonhas, onde a principal obra de Aleijadinho se tornou Patrimônio Mundial da Unesco (2026)", url: "https://agenciagov.ebc.com.br/noticias/202608/conheca-congonhas-mg-onde-a-principal-obra-de-aleijadinho-se-tornou-patrimonio-mundial-da-unesco", quote: "Reconhecido como Patrimônio Mundial pela Unesco desde 1985"}
- card: aleijadinho
  fact: "The prophets are counted among the summits of Brazilian Baroque"
  sources:
    - {title: "Agência Gov (EBC): Conheça Congonhas, onde a principal obra de Aleijadinho se tornou Patrimônio Mundial da Unesco (2026)", url: "https://agenciagov.ebc.com.br/noticias/202608/conheca-congonhas-mg-onde-a-principal-obra-de-aleijadinho-se-tornou-patrimonio-mundial-da-unesco", quote: "consideradas uma das maiores obras da arte barroca brasileira"}
    - {title: "UNESCO World Heritage Centre: Sanctuary of Bom Jesus do Congonhas", url: "https://whc.unesco.org/en/list/334/", quote: "reflecting the apex of Christian art in Latin America, as expressed in the work of Aleijadinho"}
- card: aleijadinho
  fact: "In the eighteenth century the gold-mining province of Minas Gerais saw a great wave of church building"
  sources:
    - {title: "Edward A. Riedinger: Antônio Francisco Lisboa, EBSCO Research Starters (2024)", url: "https://ebsco.com/research-starters/history/antonio-francisco-lisboa", quote: "The height of the phenomenon occurred in the gold and diamond mining province of Minas Gerais (general mines) during the eighteenth century."}
    - {title: "Agência Gov (EBC): Conheça Congonhas, onde a principal obra de Aleijadinho se tornou Patrimônio Mundial da Unesco (2026)", url: "https://agenciagov.ebc.com.br/noticias/202608/conheca-congonhas-mg-onde-a-principal-obra-de-aleijadinho-se-tornou-patrimonio-mundial-da-unesco", quote: "A construção do santuário começou em 1757, após uma promessa feita pelo minerador português Feliciano Mendes"}
- card: chica-da-silva
  fact: "Brazil's diamonds came from a district run from Tejuco, today's Diamantina"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "who had the monopoly on extraction of ore in the region of the hamlet of Tejuco, today the city of Diamantina, in Minas Gerais"}
    - {title: "Tribunal de Justiça de Minas Gerais (Memória do Judiciário): Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "que despontou como a maior produtora de diamantes do mundo"}
- card: chica-da-silva
  fact: "Francisca da Silva was born enslaved in Milho Verde in the early 1730s, daughter of the African Maria da Costa from the Mina Coast and a Portuguese man"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "Chica was born between 1731 and 1735 in a small village near Tejuco. She was the illegitimate daughter of the African slave Maria da Costa and Portuguese Captain Antonio Caetano de Sá."}
    - {title: "Tribunal de Justiça de Minas Gerais (Memória do Judiciário): Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "nascida no então Arraial de Milho Verde, na Vila do Príncipe do Serro Frio, filha do militar branco Antônio Caetano de Sá e de Maria da Costa, que foi trazida ao Brasil, como escravizada, da Costa da Mina"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "Maria da Costa, who was born in the Costa da Mina"}
- card: chica-da-silva
  fact: "In 1753 João Fernandes de Oliveira, newly arrived to run the royal diamond contract, bought her and freed her that December"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "In 1753, Chica was bought by João Fernandes de Oliveira, who had just arrived in Tejuco to administer the lucrative diamond contract won by his father. Chica and Fernandes soon began a long-term relationship and he granted her freedom that December."}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "Soon afterward, in December of the same year, he granted Chica her freedom."}
    - {title: "Tribunal de Justiça de Minas Gerais (Memória do Judiciário): Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "O encontro, em 1753, entre a jovem e João Fernandes de Oliveira, contratador de diamantes"}
- card: chica-da-silva
  fact: "They lived together unmarried for about seventeen years and had thirteen children"
  sources:
    - {title: "Tribunal de Justiça de Minas Gerais (Memória do Judiciário): Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "Do contratador, com quem ela viveu em concubinato por cerca de 17 anos, a escravizada ganhou a alforria e 13 filhos"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "They had thirteen children, four boys and nine girls, but they never legalized their relationship"}
- card: chica-da-silva
  fact: "Her daughters were schooled at the Macaúbas convent"
  sources:
    - {title: "Tribunal de Justiça de Minas Gerais (Memória do Judiciário): Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "no Recolhimento de Nossa Senhora da Conceição de Monte Alegre de Macaúbas, em Santa Luzia (MG), onde viviam, como internas, as filhas de Chica da Silva"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "She had her daughters educated at the best educational establishment of the Minas"}
- card: chica-da-silva
  fact: "She owned houses, jewels and enslaved people"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "She was also the owner of many slaves and of a house near those of the important local people."}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, o testamento", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/o-testamento.htm", quote: "Entre os bens que lista, estão joias, peças com diamantes, ouro, casas e um significativo número de escravizados."}
- card: chica-da-silva
  fact: "She belonged to the leading brotherhoods, including those for whites"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "her children belonged to the principal brotherhoods, whether of white, brown, or black people"}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, o testamento", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/o-testamento.htm", quote: "uma das quatro irmandades à qual ela pertencia"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "belonged to important religious brotherhoods"}
- card: chica-da-silva
  fact: "In 1771 Fernandes left for Portugal over an inheritance and never returned"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "1771 Fernandes is forced to return to Portugal to resolve a family inheritance dispute and never returns."}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "he had to return to Portugal in 1771 to resolve family disputes over the paternal inheritance and never returned"}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, o testamento", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/o-testamento.htm", quote: "quando o contratador de diamantes partiu para Portugal para resolver questões relacionadas à herança deixada pelo pai"}
- card: chica-da-silva
  fact: "She died in 1796 and was buried in São Francisco, whose brotherhood was for the white elite"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "February 15, 1796 Chica dies and is buried at the Igreja de São Francisco (Church of Saint Francis of Assisi), whose brotherhood was normally reserved for the local white elite."}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, o testamento", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/o-testamento.htm", quote: "Nos assoalhos do interior da Igreja de São Francisco de Assis, uma das quatro irmandades à qual ela pertencia, Francisca foi enterrada"}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "publicado em 1868, portanto, mais de sete décadas depois da morte dela, ocorrida em 1796"}
- card: chica-da-silva
  fact: "In 1868 a memoirist portrayed her as coarse and graceless"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-92874/", quote: "1868 Joaquim Felício dos Santos, a memorialist from the city of Diamantina, begins to construct the mythical figure of Chica"}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "de “feições grosseiras, alta corpulenta, trazia a cabeça raspada e coberta com uma cabeleira anelada (...); não possuía graças, não possuía beleza, não possuía espírito."}
- card: chica-da-silva
  fact: "The 1976 film Xica da Silva made her a seductress"
  sources:
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "o filme “Xica da Silva”, de 1976, do cineasta Cacá Diegues, que popularizou Chica da Silva e solidificou uma imagem distorcida da personagem real"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "in the cinema with the film Xica da Silva , directed by Cac á Diegues, in 1976"}
- card: chica-da-silva
  fact: "Historians find neither tyrant nor seductress but a freedwoman using the system's few openings for her children"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "nor was she a shrew, a witch, or a seductress. She knew, as was common for freedwomen of the period, how to take advantage of the few possibilities that the system offered her."}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "o mito se ancora de alguma forma no passado, mas não corresponde ao que Francisca da Silva foi"}
- card: boa-morte-sisterhood
  fact: "The Sisterhood is a confraternity of older Black women in Cachoeira, Bahia, devoted to Our Lady of the Good Death"
  sources:
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "Atualmente, a Irmandade da Boa Morte é composta por pouco mais de duas dezenas de senhoras negras"}
    - {title: "Secretaria de Cultura da Bahia: Festa da Irmandade de Nossa Senhora da Boa Morte (2025)", url: "https://www.ba.gov.br/cultura/noticias/2025-08/63424/autoridades-da-cultura-participam-da-festa-da-irmandade-de-nossa-senhora-da", quote: "Criada por mulheres negras alforriadas no período da escravidão"}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "A Irmandade da Boa Morte é uma confraria de mulheres negras"}
- card: boa-morte-sisterhood
  fact: "It is said to have been founded around 1820 near the Barroquinha church in Salvador and to have moved to Cachoeira"
  sources:
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "possivelmente por volta de 1820, nas"}
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "proximidades da Barroquinha, em Salvador"}
    - {title: "IPAC (Instituto do Patrimônio Artístico e Cultural da Bahia): Estado inaugura Centro Cultural Irmandade da Boa Morte (2014)", url: "https://www.ba.gov.br/ipac/noticias/estado-inaugura-centro-cultural-irmandade-da-boa-morte-em-cachoeira-nesta-sexta-15", quote: "Inicialmente esta devoção acontecia na Igreja da Barroquinha, de onde migraram a partir da década de 1820."}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "Por volta de 1820, a Irmandade da Boa Morte foi fundada"}
- card: boa-morte-sisterhood
  fact: "By tradition its aims were buying letters of manumission and ensuring decent burial"
  sources:
    - {title: "IPAC (Instituto do Patrimônio Artístico e Cultural da Bahia): Estado inaugura Centro Cultural Irmandade da Boa Morte (2014)", url: "https://www.ba.gov.br/ipac/noticias/estado-inaugura-centro-cultural-irmandade-da-boa-morte-em-cachoeira-nesta-sexta-15", quote: "tinham como objetivos angariar fundos para a compra de cartas de alforria; assegurar a cada uma das integrantes da Irmandade um enterro adequado"}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "tinham por objetivo auxiliar na compra de alforria de seus irmãos escravos, ofertarem um enterro digno"}
- card: boa-morte-sisterhood
  fact: "Most of its documents were lost, damaged or stolen; its history relies on oral memory"
  sources:
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "Boa parte dos documentos relativos à pesquisa e pertencentes à Irmandade da Boa Morte foi perdida, danificada e roubada."}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "Os nomes das irmãs fundadoras da irmandade da Boa Morte são cercados de incertezas no meio acadêmico."}
- card: boa-morte-sisterhood
  fact: "Candidates must be mature women past forty or fifty"
  sources:
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "acima de 40/50 anos"}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "as irmãs de bolsa, aspirantes a irmã da boa morte que passam por uma observação de três anos"}
- card: boa-morte-sisterhood
  fact: "Many sisters are initiates or leaders of Candomblé houses; they belong to both church and terreiro"
  sources:
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "Em sua maioria as irmãs entrevistadas detêm o comando da casa e de terreiros de candomblés"}
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "senhoras negras que circulam livremente, e com muita naturalidade, no mundo religioso católico e no mundo religioso do Candomblé"}
- card: boa-morte-sisterhood
  fact: "Every August, around the Assumption, they hold masses and processions for Our Lady of the Good Death"
  sources:
    - {title: "Secretaria de Cultura da Bahia: Festa da Irmandade de Nossa Senhora da Boa Morte (2025)", url: "https://www.ba.gov.br/cultura/noticias/2025-08/63424/autoridades-da-cultura-participam-da-festa-da-irmandade-de-nossa-senhora-da", quote: "Realizada anualmente no mês de agosto"}
    - {title: "Secretaria de Cultura da Bahia: Festa da Irmandade de Nossa Senhora da Boa Morte (2025)", url: "https://www.ba.gov.br/cultura/noticias/2025-08/63424/autoridades-da-cultura-participam-da-festa-da-irmandade-de-nossa-senhora-da", quote: "cortejos, missas, procissões"}
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "Devoção à Nossa Senhora da Boa Morte, da Assunção ou da Glória"}
    - {title: "Luana Verena Nascimento Machado: Poder feminino e identidade na Irmandade da Boa Morte, master's dissertation, UFRB (2013)", url: "https://www1.ufrb.edu.br/pgcienciassociais/images/documentos/Dissertações/CD_DISSEluana.pdf", quote: "A festa tem seu marco inicial no dia 13 de agosto"}
- card: boa-morte-sisterhood
  fact: "In 2010 Bahia registered the feast as intangible heritage"
  sources:
    - {title: "IPAC (Instituto do Patrimônio Artístico e Cultural da Bahia): Estado inaugura Centro Cultural Irmandade da Boa Morte (2014)", url: "https://www.ba.gov.br/ipac/noticias/estado-inaugura-centro-cultural-irmandade-da-boa-morte-em-cachoeira-nesta-sexta-15", quote: "reconhece a Festa da Boa Morte como Patrimônio Imaterial do Estado da Bahia"}
    - {title: "Armando Alexandre Castro: Irmãs de fé: tradição e turismo no recôncavo baiano, Caderno Virtual de Turismo (2010)", url: "https://www.ivt.coppe.ufrj.br/caderno/article/download/476/259/1317", quote: "Em junho de 2010, foi reconhecida oficialmente como Patrimônio Imaterial da Bahia"}
    - {title: "Secretaria de Cultura da Bahia: Festa da Irmandade de Nossa Senhora da Boa Morte (2025)", url: "https://www.ba.gov.br/cultura/noticias/2025-08/63424/autoridades-da-cultura-participam-da-festa-da-irmandade-de-nossa-senhora-da", quote: "Reconhecida como Patrimônio Imaterial da Bahia desde 2010"}
- card: baianas-do-acaraje
  fact: "Acarajé is a bean fritter ground on a stone and fried in dendê palm oil"
  sources:
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "A receita manda moer o feijão fradinho em pilão de pedra"}
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "feitas com azeite de dendê"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "ralado na pedra"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "feitas com azeite de dendê"}
- card: baianas-do-acaraje
  fact: "It is sold on Salvador's streets by baianas de acarajé"
  sources:
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "É uma prática tradicional de produção e venda, em tabuleiro, das chamadas comidas de baiana, feitas com azeite de dendê e ligadas ao culto dos orixás, amplamente disseminadas em Salvador."}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "O ofício da baiana e a venda de acarajé têm sua origem em Salvador"}
- card: baianas-do-acaraje
  fact: "The recipe came from the Gulf of Benin"
  sources:
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "tem origem no Golfo de Benim, na África Ocidental"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "A receita do acarajé surgiu no Golfo do Benin"}
- card: baianas-do-acaraje
  fact: "In colonial Salvador enslaved and freed women made and sold acarajé through the streets on trays and in baskets"
  sources:
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "ainda no período colonial, onde mulheres (escravizadas ou libertas) faziam os acarajés e, quando caía a noite, estes eram vendidos em cestos ou tabuleiros colocados na cabeça"}
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "Presente desde o período colonial brasileiro, quando mulheres negras saíam vendendo seus acarajés em gamelas pelas ruas da cidade de Salvador"}
- card: baianas-do-acaraje
  fact: "In Candomblé acarajé belongs to Xangô and Oyá (Iansã); the first sellers were initiated women, many daughters of Iansã"
  sources:
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "A iguaria está ligada ao culto dos orixás do candomblé, Xangô e Oyá"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "No início, todas as pessoas que produziam e comercializavam o acarajé eram iniciadas no candomblé, numa prática restrita a mulheres, em geral filhas-de-santo- dedicadas ao culto de Xangô e Oiá (Iansã)"}
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "E a maioria das mulheres de Iansã iam vender o acarajé."}
- card: baianas-do-acaraje
  fact: "In 2002 ABAM, Ilê Axé Opô Afonjá and CEAO/UFBA requested registration"
  sources:
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "O pedido de registro do Acarajé como bem cultural de natureza imaterial foi proposto em 2002 pela Associação de Baianas de Acarajé, Mingau e Receptivos do Estado da Bahia(ABAM), pelo Terreiro Ilê Axé Opô Afonjá e pelo Centro de Estudos Afro Orientais da Universidade Federal da Bahia (CEAO/UFBA)."}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "a formulação Carta de Pedido, foi realizada em 5 de novembro de 2002, por representantes de três entidades"}
- card: baianas-do-acaraje
  fact: "IPHAN inscribed the trade (not a recipe) in 2005, defined as the traditional practice of producing and selling baiana foods on a tray"
  sources:
    - {title: "IPHAN, Superintendência na Bahia: Patrimônio Imaterial", url: "https://www.gov.br/iphan/pt-br/superintendencias/bahia/patrimonio-imaterial", quote: "Está inscrito no Livro dos Saberes desde 2005 como Patrimônio Cultural Imaterial do Brasil."}
    - {title: "Governo da Bahia: Ipac revalida registro especial do ofício das baianas de acarajé (2024)", url: "https://www.ba.gov.br/comunicacao/2024/11/noticias/ipac-revalida-registro-especial-do-oficio-das-baianas-de-acaraje-neste-sabado-23", quote: "Este ofício foi registrado como Patrimônio Imaterial do Brasil pelo Iphan em 2005"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "A prática tradicional de produção e venda, em tabuleiro, das chamadas comidas de baiana, feitas com azeite de dendê e ligadas ao culto dos orixás"}
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "O Registro passou a focar"}
- card: baianas-do-acaraje
  fact: "Evangelical vendors selling 'bolinho de Jesus' and refusing the dress are accused of erasing its African religion"
  sources:
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "os grupos evangélicos que vendem o \"bolinho de Jesus\" na tentativa de apagar a relação com as religiões de matriz africana presente no ofício das baianas"}
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "A Associação se preocupa com a prática da comercialização das baianas evangélicas. Pois, muitas delas se recusam a utilizarem o traje típico"}
- card: baianas-do-acaraje
  fact: "Since 2010, 25 November is the National Day of the Baiana de Acarajé"
  sources:
    - {title: "Debora Simões de Souza Mendel: O Ofício das Baianas de Acarajé, Patrimônio e Memória (UNESP, 2019)", url: "https://pem.assis.unesp.br/index.php/pem/article/download/3264/2574/13805", quote: "o Dia Nacional da Baiana de Acarajé, a ser comemorado, anualmente, no dia 25 de novembro” (BRASIL, 2010)"}
    - {title: "IPHAN: Parecer técnico de reavaliação do Ofício das Baianas de Acarajé (2021)", url: "https://www.gov.br/iphan/pt-br/assuntos/noticias/aberta-consulta-publica-sobre-quatro-tres-bens-culturais/oficio-da-baianas-de-acaraje-sei_iphan-2956233-parecer-tecnico.pdf/@@download/file", quote: "2010 Instituição do Dia Nacional das Baianas de Acarajé em 25 de novembro"}
- card: senor-de-los-milagros
  fact: "Pachacamilla was a neighbourhood of Black and Indigenous people on Lima's edge"
  sources:
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "entonces un sector periférico con presencia afrodescendiente e indígena"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "se inició en el barrio de San Sebastián, ubicado al oeste de la ciudad, ocupado por negros e indígenas"}
- card: senor-de-los-milagros
  fact: "Around 1651 an enslaved man from Angola painted Christ crucified on an adobe wall"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "habría sido pintada por un esclavo originario de Angola. Fue hecha en una pared de adobe"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "en el año 1651, un negro de Angola pintó sobre una pared de adobe la imagen de Cristo crucificado"}
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "la imagen data de 1651 y fue realizada al temple por un esclavo angoleño sobre un muro de adobe en Pachacamilla"}
- card: senor-de-los-milagros
  fact: "On 13 November 1655 an earthquake struck Lima and Callao; the wall stayed standing and people began to gather"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "El 13 de noviembre de 1655, un terremoto sacudió Lima y Callao, dejando muertos y trayendo abajo diferentes construcciones de ese entonces. No obstante, la pared de adobe con el Cristo pintado en ella se mantuvo en pie. Desde ese momento, empezaron las reuniones y peregrinaciones"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "el muro de la ermita subsistió al terremoto de 1655"}
- card: senor-de-los-milagros
  fact: "In 1671 the viceroy was asked to have it erased; up to three attempts failed"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "Las autoridades religiosas, en el año de 1671, solicitaron al virrey Pedro Fernández de Castro (Conde de Lemos) que se borre la imagen y que se prohíban las reuniones en torno a ella. Se cuenta que hubo hasta tres intentos por borrar la pintura, pero ninguno pudo concretarse."}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "se dio el mandato de borrar la imagen del muro en setiembre de 1671 durante el gobierno del virrey Conde de Lemos, sin que pudieran lograrlo a pesar de ser varios los intentos"}
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "después hubo tres intentos de borrarla, pero todos fracasaron"}
- card: senor-de-los-milagros
  fact: "The first mass was said beside the wall on 14 September 1671"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "El 14 de septiembre de 1671 se ofreció la primera misa"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "La primera misa se celebró junto a la imagen pintada en el muro el 14 de setiembre de 1671."}
- card: senor-de-los-milagros
  fact: "After the October 1687 earthquake Sebastián de Antuñano had an oil copy painted and carried in the first procession"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "En octubre de 1687, un violento terremoto remeció Lima y Callao, pero la imagen del Cristo de Pachacamilla se mantuvo en pie. Por esta razón, Sebastián de Antuñano (gran impulsor de la devoción al Señor de los Milagros) mandó sacar una copia de la imagen al óleo, realizando la primera procesión por las calles de Lima."}
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "tras el terremoto de 1687, el devoto Sebastián de Antuñano mandó a pintar una copia y con ella se dio origen a la primera procesión del Señor de los Milagros"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "El 20 de octubre de 1687, con motivo de un nuevo terremoto, una copia de la imagen que Antuñano poseía, fue sacada en procesión"}
- card: senor-de-los-milagros
  fact: "The wall now stands at the high altar of the Las Nazarenas sanctuary"
  sources:
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "donde hoy se encuentra el altar mayor del Santuario de Las Nazarenas"}
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "el muro pintado en 1651, motivo de creación del templo y monasterio de las Nazarenas"}
- card: senor-de-los-milagros
  fact: "Processions each October, the purple month"
  sources:
    - {title: "Universidad Ricardo Palma: 1 de octubre, mes morado (2016)", url: "https://www.urp.edu.pe/pdf/id/14618/n/1-octubre-mes-morado.pdf", quote: "Cada año en el mes de octubre, la imagen del Señor de los Milagros recorre las calles de Lima"}
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "El Señor de los Milagros continuará tiñendo de morado todo lo que resta del mes de octubre"}
    - {title: "Ministerio de Cultura del Perú: Señor de los Milagros (document)", url: "https://cdn.www.gob.pe/uploads/document/file/1400159/Cultura.pdf.pdf", quote: "el color morado"}
- card: senor-de-los-milagros
  fact: "Its first devotees were Afro-Peruvians and Indigenous people; it is Peru's most important religious feast"
  sources:
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "Sus primeros devotos fueron “afroperuanos e indígenas del entorno"}
    - {title: "El Comercio (Lima): Señor de los Milagros, un viaje a sus orígenes telúricos (2025), with Carlos Piccone, PUCP", url: "https://elcomercio.pe/somos/historias/senor-de-los-milagros-un-viaje-a-sus-origenes-teluricos-y-de-una-devocion-que-permanece-intacta-durante-siglos-noticia/", quote: "la celebración religiosa más importante del Perú"}
    - {title: "Biblioteca Nacional del Perú: La BNP conserva y protege documentos sobre el Señor de los Milagros (2023)", url: "https://www.bnp.gob.pe/?p=30923", quote: "La más conocida de estas últimas es la Procesión del Señor de los Milagros, donde millones de fieles"}
- card: martin-de-porres
  fact: "Born in Lima in 1579; died in Lima in 1639"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "born 1579, Lima , Viceroyalty of Peru [now in Peru]—died November 3, 1639, Lima"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "(December 9, 1579 – November 3, 1639)"}
- card: martin-de-porres
  fact: "His father was a Spanish nobleman and his mother a free Black woman from Panama; unmarried; father abandoned the family"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "Born of a liaison between a Spanish grandee and a free Black woman and later abandoned by his father"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "He was the son of a freed woman of Panama, probably black but also possibly of indigenous stock, and a Spanish grandee of Lima, Peru. His parents never married each other."}
- card: martin-de-porres
  fact: "He grew up poor, stigmatised for illegitimate birth and mixed race"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "was raised in poverty and bore the stigmas of both his illegitimate birth and his mixed race"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "Martin was reared in poverty, locked into a low level of Lima’s society."}
- card: martin-de-porres
  fact: "As a boy he was apprenticed to a barber-surgeon and learned bloodletting and medicines"
  sources:
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "When Martin de Porres was 12, his mother apprenticed him to a barber-surgeon. Martin learned how to cut hair and also how to draw blood"}
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "He was placed to study with a barber-surgeon, where he learned bloodletting and the administration of medicines."}
- card: martin-de-porres
  fact: "As a teenager he served the Dominicans as a lay helper and only years later became a full lay brother"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "he began to volunteer with the Dominicans at age 15"}
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "Martín was considered an exception and became a Dominican lay brother in 1610"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "Martin de Porres applied to the Dominicans to be a “lay helper,” not feeling himself worthy to be a religious brother. After nine years"}
- card: martin-de-porres
  fact: "He worked in infirmary, kitchen, laundry; gave food and alms to the poor; cared for newly enslaved Africans; raised dowries"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "helped care for the sick in the monastery infirmary and also worked in the kitchen and doing laundry"}
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "He ministered to the waves of newly enslaved Africans being brought to the city and raised money for the dowries of poor girls"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "took care of slaves brought from Africa"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "obtaining thousands of dollars for dowries for poor girls"}
- card: martin-de-porres
  fact: "He kept stray cats and dogs and excused the kitchen mice"
  sources:
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "He would excuse the raids of mice and rats on the grounds that they were underfed; he kept stray cats and dogs at his sister’s house."}
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "his loving care extended to animals, including stray cats and dogs, beasts of the field, and even kitchen vermin"}
- card: martin-de-porres
  fact: "John XXIII canonised him in 1962, praising his care for Black and mixed-race people then held almost as abject servants"
  sources:
    - {title: "John XXIII: Homily at the canonisation of Martin de Porres, 6 May 1962 (Vatican)", url: "https://www.vatican.va/content/john-xxiii/la/homilies/1962/documents/hf_j-xxiii_hom_19620506_martino-porres.html", quote: "Homilia Ioannis PP. XXIII, d. VI m. Maii a. 1962"}
    - {title: "John XXIII: Homily at the canonisation of Martin de Porres, 6 May 1962 (Vatican)", url: "https://www.vatican.va/content/john-xxiii/la/homilies/1962/documents/hf_j-xxiii_hom_19620506_martino-porres.html", quote: "homines vel nigrae cutis vel mixto genere natos, qui tunc temporis abiecta quasi servitia habebantur"}
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "was canonized in 1962 by Pope John XXIII"}
- card: martin-de-porres
  fact: "He is the patron saint of social justice"
  sources:
    - {title: "Encyclopaedia Britannica: Saint Martin de Porres", url: "https://www.britannica.com/biography/Saint-Martin-de-Porres", quote: "He is the patron saint of social justice"}
    - {title: "Franciscan Media: Saint Martin de Porres", url: "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/", quote: "Race Relations Radio Social Justice"}
- card: candombe-montevideo
  fact: "Candombe drum calls belong to the Afro-Uruguayan Sur, Palermo and Cordón districts"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "the llamadas de tambores de candombe or candombe drum calls enliven the Sur, Palermo and Cordón districts in southern Montevideo, Uruguay, home to a population of African descent"}
    - {title: "Luis Jure: El repique del candombe, Escuela Universitaria de Música, Universidad de la República (archived)", url: "https://web.archive.org/web/20110929144457/http://www.eumus.edu.uy/docentes/jure/perico/perico.html", quote: "Desfile Oficial de Llamadas que recorre los barrios Sur y Palermo"}
- card: candombe-montevideo
  fact: "It is played on three drums, chico, repique and piano; names denote sizes and rhythmic roles; piano is the largest and deepest"
  sources:
    - {title: "Luis Jure: El repique del candombe, Escuela Universitaria de Música, Universidad de la República (archived)", url: "https://web.archive.org/web/20110929144457/http://www.eumus.edu.uy/docentes/jure/perico/perico.html", quote: "Con los nombres de chico, repique y piano se denominan no sólo los tres tamaños de los tambores afro-montevideanos, sino también sus respectivas funciones dentro de la estructura rítmica de la llamada."}
    - {title: "IMPO (Uruguay): Ley N° 18.059 (2006)", url: "https://www.impo.com.uy/bases/leyes/18059-2006", quote: "el toque de los tambores denominados chico, repique y piano"}
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "The beat of the largest and deepest drum, the piano"}
- card: candombe-montevideo
  fact: "Drummers heat and tune the drum skins over fires"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "The practice of the candombe begins around communal fires as people gather to tune their drums"}
    - {title: "Luis Jure: El repique del candombe, Escuela Universitaria de Música, Universidad de la República (archived)", url: "https://web.archive.org/web/20110929144457/http://www.eumus.edu.uy/docentes/jure/perico/perico.html", quote: "el tambor no necesita ser templado a fuego"}
- card: candombe-montevideo
  fact: "The playing is handed down within families of African descent"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "Transmitted within families of African descent"}
    - {title: "Luis Jure: El repique del candombe, Escuela Universitaria de Música, Universidad de la República (archived)", url: "https://web.archive.org/web/20110929144457/http://www.eumus.edu.uy/docentes/jure/perico/perico.html", quote: "Eduardo \"Cacho\" Giménez (padre de Malumba, a quien mencionáramos arriba)"}
- card: candombe-montevideo
  fact: "The piano beat differs by neighbourhood, so the call unites and distinguishes districts"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "is distinctive to each of the three neighbourhoods, so that the organized call and response structure of the candombe both unites the districts and signals their individual identities"}
    - {title: "Luis Jure: El repique del candombe, Escuela Universitaria de Música, Universidad de la República (archived)", url: "https://web.archive.org/web/20110929144457/http://www.eumus.edu.uy/docentes/jure/perico/perico.html", quote: "Esto también es característico de Ansina -por oposición a Cuareim, por ejemplo-"}
- card: candombe-montevideo
  fact: "In 2006 Uruguay made 3 December the National Day of Candombe, Afro-Uruguayan Culture and Racial Equity, to value the contribution of people of African descent"
  sources:
    - {title: "IMPO (Uruguay): Ley N° 18.059 (2006)", url: "https://www.impo.com.uy/bases/leyes/18059-2006", quote: "Artculo 1 Declrase el 3 de diciembre"}
    - {title: "IMPO (Uruguay): Ley N° 18.059 (2006)", url: "https://www.impo.com.uy/bases/leyes/18059-2006", quote: "de la contribucin de la poblacin afrodescendiente a la construccin nacional"}
    - {title: "Ministerio de Educación y Cultura (Uruguay): Día Nacional del Candombe, la Cultura Afrouruguaya y la Equidad Racial (2020)", url: "https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/dia-nacional-del-candombe-cultura-afrouruguaya-equidad-racial", quote: "Desde el 2006, cada 3 de diciembre se celebra el Día Nacional del Candombe, la Cultura Afrouruguaya y la Equidad Racial."}
    - {title: "Ministerio de Educación y Cultura (Uruguay): Día Nacional del Candombe, la Cultura Afrouruguaya y la Equidad Racial (2020)", url: "https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/dia-nacional-del-candombe-cultura-afrouruguaya-equidad-racial", quote: "de la contribución de la población afrodescendiente a la construcción nacional"}
- card: candombe-montevideo
  fact: "The law describes candombe as created by Afro-Uruguayans from their ancestral African legacy"
  sources:
    - {title: "IMPO (Uruguay): Ley N° 18.059 (2006)", url: "https://www.impo.com.uy/bases/leyes/18059-2006", quote: "creado por los afrouruguayos a partir del legado ancestral africano"}
    - {title: "UNESCO Intangible Cultural Heritage: Candombe and its socio-cultural space, a community practice", url: "https://ich.unesco.org/en/RL/candombe-and-its-socio-cultural-space-a-community-practice-00182", quote: "Transmitted within families of African descent, the candombe is recognized as an expression of resistance as well as a Uruguayan musical celebration"}
