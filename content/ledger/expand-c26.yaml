    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "as well as more than 18 radio stations and cable franchises"}
