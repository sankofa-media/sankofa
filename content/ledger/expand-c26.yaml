- card: for-colored-girls
  fact: "Seven women are each named only by the colour they wear (lady in red, lady in brown...)"
  sources:
    - {title: "Kathleen Mills, EBSCO Research Starters: Shange's for colored girls . . . Presents the Black Female Psyche (2021)", url: "https://www.ebsco.com/research-starters/womens-studies-and-feminism/shanges-colored-girls-presents-black-female-psyche/", quote: "are identified simply by the colors they wear as Lady in Brown, Lady in Yellow, Lady in Red, Lady in Green, Lady in Purple, Lady in Blue, and Lady in Orange"}
