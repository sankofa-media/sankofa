    - {title: "Jessica Nicholson, Billboard: Radio Hall of Fame 2024 Legends of Radio Inductees (19 August 2024)", url: "https://www.billboard.com/business/radio/2024-radio-hall-of-fame-legends-of-radio-inductees-1235755704/", quote: "The company later acquired WBLS-FM"}
    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "In 1974, he and his investors added WBLS-FM to their holdings"}
