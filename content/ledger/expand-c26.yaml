    - {title: "Rolling Stone, The 500 Greatest Songs of All Time: Johnny B. Goode (archived)", url: "https://web.archive.org/web/20061228112332/http://www.rollingstone.com/news/story/6595852/johnny_b_goode", quote: "Johnny came from \"deep down in Louisiana, close to New Orleans,\" ... Johnny \"never ever learned to read or write so well,\""}
