- card: for-colored-girls
  fact: "They tell of relationships, racism, sexism, violence and rape, and of survival"
  sources:
    - {title: "Associated Press via NBC News: Ntozake Shange, author of 'For Colored Girls' fame, has died (28 October 2018)", url: "https://www.nbcnews.com/news/us-news/author-ntozake-shange-colored-girls-fame-has-died-n925336", quote: "describes the racism, sexism, violence and rape experienced by seven black women"}
