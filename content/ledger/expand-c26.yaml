    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "In 1971, while still serving as borough president, Sutton began investing in media companies ... He also invested in AM station, WLIB, making it the first black-owned radio station in New York."}
