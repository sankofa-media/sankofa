# Expansion batch c26 (2026-11-13): every fact in the bodies and wow lines of the c26 cards,
# with at least two independent sources and a supporting quote from each.
# Quotes with [...] are elided or completed from context; '...' joins two passages of the same page.
# Associated Press copies (NBC News, Los Angeles Times) count as one source; Reis's own texts and BBC Brasil's quotes of Reis count as one.
# Britannica and Poetry Foundation were read from archive.org snapshots.
- card: daughters-of-the-dust
  fact: "On the Sea Islands off South Carolina and Georgia, descendants of enslaved Africans kept a culture of their own, the Gullah"
  sources:
    - {title: "UCLA Film & Television Archive, L.A. Rebellion: Daughters of the Dust", url: "https://cinema.ucla.edu/collections/la-rebellion/daughters-of-the-dust/", quote: "off the coast of South Carolina and Georgia where they maintain strong connections to African linguistic and cultu"}
    - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "a place isolated from the mainland where the descendents of African slaves struggled to maintain their unique lifestyle"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "Gullah, a West African-influenced English dialect preserved off the coast of Georgia , South Carolina"}
- card: daughters-of-the-dust
  fact: "Julie Dash grew up in New York in a household where Gullah culture was alive"
  sources:
    - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "You grew up in a household with this [Gullah] culture around you even though you grew up in New York City."}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "Born and raised in a Queens , New York , housing project"}
- card: daughters-of-the-dust
  fact: "Her father was Gullah"
  sources:
    - {title: "NPR, All Things Considered: 'Daughters Of The Dust' Re-Released Following Attention From Beyoncé (20 November 2016)", url: "https://www.npr.org/2016/11/20/502797705/daughters-of-the-dust-re-released-following-attention-from-beyonc", quote: "I understand that your dad was Gullah. Do I have that right? DASH: Yes, you do."}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "until she noticed her father ' s \"funny accent\" ... Many years later she recognized it as Gullah"}
- card: daughters-of-the-dust
  fact: "Her first feature is set in 1902: the Peazant family gathers on a Sea Island before leaving for the mainland"
  sources:
    - {title: "Sundance Institute: Your Next Double Feature: Daughters of the Dust and The Farewell", url: "https://www.sundance.org/blogs/your-next-double-feature-daughters-of-the-dust-and-the-farewell/", quote: "Set in 1902, Dash's narrative feature debut centers on the Peazant family on Ibo Landing in South Carolina's Sea Islands"}
    - {title: "NPR, All Things Considered: 'Daughters Of The Dust' Re-Released Following Attention From Beyoncé (20 November 2016)", url: "https://www.npr.org/2016/11/20/502797705/daughters-of-the-dust-re-released-following-attention-from-beyonc", quote: "the Peazant family living on one of the Sea Islands off the coast of South Carolina ... as they prepared to start new lives on the U.S. mainland in 1902"}
    - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "in 1902, a family gathers on South Carolina's Sea Islands to bid farewell to their home"}
- card: daughters-of-the-dust
  fact: "Nana Peazant, the matriarch, keeps the old beliefs and refuses to go, fearing lost ties and traditions"
  sources:
    - {title: "UCLA Film & Television Archive, L.A. Rebellion: Daughters of the Dust", url: "https://cinema.ucla.edu/collections/la-rebellion/daughters-of-the-dust/", quote: "Nana Peazant, the aged matriarch, refuses to migrate and frets over the possibility of broken family ties and lost traditions."}
    - {title: "Sundance Institute: Your Next Double Feature: Daughters of the Dust and The Farewell", url: "https://www.sundance.org/blogs/your-next-double-feature-daughters-of-the-dust-and-the-farewell/", quote: "While Nana Peazant (Cora Lee Day), the community matriarch, continues to live by her ancestors' old beliefs and rituals"}
- card: daughters-of-the-dust
  fact: "The film is dreamlike and impressionistic in style"
  sources:
    - {title: "Peter Bradshaw, The Guardian: Daughters of the Dust review (31 May 2017)", url: "https://www.theguardian.com/film/2017/may/31/daughters-of-the-dust-review", quote: "It is a mysterious, fabular and sometimes dreamlike film"}
    - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "Visually stunning and impressionistic in style"}
- card: daughters-of-the-dust
  fact: "It won the cinematography award at the 1991 Sundance Film Festival"
  sources:
    - {title: "Ben Ward, Sundance Institute: From the Collection: Julie Dash's 1991 Sundance Award-Winning Daughters of the Dust", url: "https://www.sundance.org/blogs/from-the-collection-julie-dashs-1991-sundance-award-winning-daughters-of-the-dust-3/", quote: "won the 1991 Festival's Excellence in Cinematography Award"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "best cinematography award, Sundance Film Festival, 1991, for Daughters of the Dust"}
- card: daughters-of-the-dust
  fact: "Released in 1991, it was the first feature by an African American woman with a general theatrical release in the US"
  sources:
    - {title: "UCLA Film & Television Archive, L.A. Rebellion: Julie Dash", url: "https://cinema.ucla.edu/collections/la-rebellion/filmmakers/julie-dash", quote: "Daughters of the Dust (1991) — was the first film by an African American woman to receive a general theatrical release in the United States"}
    - {title: "NPR, All Things Considered: 'Daughters Of The Dust' Re-Released Following Attention From Beyoncé (20 November 2016)", url: "https://www.npr.org/2016/11/20/502797705/daughters-of-the-dust-re-released-following-attention-from-beyonc", quote: "In 1991, Julie Dash became the first African-American female director to achieve nationwide theatrical distribution of her film"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Dash, Julie 1952(?)–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/dash-julie-1952", quote: "the first nationally distributed feature-length film by an African American woman"}
- card: daughters-of-the-dust
  fact: "In 2016 Beyoncé's visual album Lemonade drew on its imagery"
  sources:
    - {title: "Tega Okiti, Sight and Sound (BFI): The black feminine on screen: 11 key auteurs (2017)", url: "https://www.bfi.org.uk/sight-and-sound/features/black-feminine-screen-11-key-auteurs", quote: "An unbroken line can be traced back from Beyoncé's landmark visual album of 2016, Lemonade, through to Julie Dash's breakthrough 1991 feature"}
    - {title: "NPR, All Things Considered: 'Daughters Of The Dust' Re-Released Following Attention From Beyoncé (20 November 2016)", url: "https://www.npr.org/2016/11/20/502797705/daughters-of-the-dust-re-released-following-attention-from-beyonc", quote: "many people saw these visuals revived earlier this year in Beyonce's visual album \"Lemonade\""}
    - {title: "Peter Bradshaw, The Guardian: Daughters of the Dust review (31 May 2017)", url: "https://www.theguardian.com/film/2017/may/31/daughters-of-the-dust-review", quote: "its imagery and style inspired Beyoncé's Lemonade video"}
- card: daughters-of-the-dust
  fact: "A restored print returned to cinemas"
  sources:
    - {title: "NPR, All Things Considered: 'Daughters Of The Dust' Re-Released Following Attention From Beyoncé (20 November 2016)", url: "https://www.npr.org/2016/11/20/502797705/daughters-of-the-dust-re-released-following-attention-from-beyonc", quote: "now the film has been newly restored and is being released again"}
    - {title: "Peter Bradshaw, The Guardian: Daughters of the Dust review (31 May 2017)", url: "https://www.theguardian.com/film/2017/may/31/daughters-of-the-dust-review", quote: "this restored 1991 gem ... it now has a cinema re-release"}
- card: atlantics-diop
  fact: "In 2009 Mati Diop made a short documentary, Atlantiques, in Dakar about young men leaving by fishing boat for Spain in search of work"
  sources:
    - {title: "Catherine Wheatley, Sight and Sound (BFI): Atlantics review: a mysterious fable of class, migration and heartbreak", url: "https://www.bfi.org.uk/sight-and-sound/reviews/atlantics-review-mysterious-fable-class-migration-heartbreak", quote: "Atlantiques, her 2009 short about a group of young Senegalese men – boys, really – attempting to cross the ocean aboard a small fishing boat. They were bound for Spain in search of work"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "her very first documentary short Atlantiques (2009)"}
    - {title: "Charlotte Pavard, Festival de Cannes: Atlantique (Atlantics) by Mati Diop: the luminous wreckage of Senegalese youth (2019)", url: "https://www.festival-cannes.com/en/2019/atlantique-atlantics-by-mati-diop-the-luminous-wreckage-of-senegalese-youth/", quote: "previously examined ten years earlier in a short film of the same name ( Atlantiques , 2009)"}
- card: atlantics-diop
  fact: "Diop is French-Senegalese"
  sources:
    - {title: "Charlotte Pavard, Festival de Cannes: Atlantique (Atlantics) by Mati Diop: the luminous wreckage of Senegalese youth (2019)", url: "https://www.festival-cannes.com/en/2019/atlantique-atlantics-by-mati-diop-the-luminous-wreckage-of-senegalese-youth/", quote: "the French-Senegalese filmmaker explores a subject dear to her heart"}
    - {title: "Associated Press via CBC News: Mati Diop becomes first black female filmmaker to compete in Cannes (17 May 2019)", url: "https://www.cbc.ca/news/entertainment/mati-diop-first-black-female-director-cannes-1.5140643", quote: "French-Senegalese director Mati Diop's feature film debut"}
- card: atlantics-diop
  fact: "The feature turned to the women who stay behind"
  sources:
    - {title: "Sunday Times (South Africa): Black female director's film debut a first in Cannes' 72-year history (17 May 2019)", url: "https://www.sundaytimes.timeslive.co.za/sunday-times/lifestyle/2019-05-17-black-female-directors-film-debut-a-first-in-cannes-72-year-history/", quote: "After devoting a short film to the men who leave by sea, my current interest is in the women who stay behind"}
    - {title: "Bilal Qureshi, NPR: 'Atlantics' Is A Haunting Refugee Story — Of The Women Left Behind In Senegal (23 November 2019)", url: "https://www.npr.org/2019/11/23/780847003/atlantics-is-a-haunting-refugee-story-of-the-women-left-behind-in-senegal", quote: "It's the story of the women they've left behind."}
    - {title: "Catherine Wheatley, Sight and Sound (BFI): Atlantics review: a mysterious fable of class, migration and heartbreak", url: "https://www.bfi.org.uk/sight-and-sound/reviews/atlantics-review-mysterious-fable-class-migration-heartbreak", quote: "Atlantics, tells the other side of the story: that of the women left behind"}
- card: atlantics-diop
  fact: "A futuristic tower is going up on the Dakar shore"
  sources:
    - {title: "Festival de Cannes: Atlantique (Atlantics), credits, synopsis and awards", url: "https://www.festival-cannes.com/f/atlantique/", quote: "Along the Atlantic coast, a soon-to-be-inaugurated futuristic tower looms over a suburb of Dakar."}
    - {title: "Peter Bradshaw, The Guardian: Atlantique review (16 May 2019)", url: "https://www.theguardian.com/film/2019/may/16/atlantique-review-cannes-mati-diop-senegal-mystery", quote: "a huge, futurist luxury tower is being constructed, looming on the beachfront skyline facing the Atlantic Ocean"}
- card: atlantics-diop
  fact: "Ada, 17, loves Souleiman, one of the builders, but is promised to a rich man"
  sources:
    - {title: "Festival de Cannes: Atlantique (Atlantics), credits, synopsis and awards", url: "https://www.festival-cannes.com/f/atlantique/", quote: "Ada, 17, is in love with Souleiman, a young construction worker. But she has been promised to another man."}
    - {title: "Justin Chang, Los Angeles Times: Review: Atlantics (14 November 2019)", url: "https://www.latimes.com/entertainment-arts/movies/story/2019-11-14/review-atlantics-netflix-senegal", quote: "Souleiman's 17-year-old girlfriend, Ada"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "Ada has been betrothed to Omar, a rich man"}
- card: atlantics-diop
  fact: "The workers have not been paid for weeks"
  sources:
    - {title: "Peter Bradshaw, The Guardian: Atlantique review (16 May 2019)", url: "https://www.theguardian.com/film/2019/may/16/atlantique-review-cannes-mati-diop-senegal-mystery", quote: "like everyone else he has not got paid for weeks"}
    - {title: "Catherine Wheatley, Sight and Sound (BFI): Atlantics review: a mysterious fable of class, migration and heartbreak", url: "https://www.bfi.org.uk/sight-and-sound/reviews/atlantics-review-mysterious-fable-class-migration-heartbreak", quote: "a group of labourers are protesting that they have not been paid for weeks"}
- card: atlantics-diop
  fact: "One night Souleiman and his comrades set off by boat for Spain"
  sources:
    - {title: "Bilal Qureshi, NPR: 'Atlantics' Is A Haunting Refugee Story — Of The Women Left Behind In Senegal (23 November 2019)", url: "https://www.npr.org/2019/11/23/780847003/atlantics-is-a-haunting-refugee-story-of-the-women-left-behind-in-senegal", quote: "a group of young men set off on a boat for Spain from the coast of Senegal"}
    - {title: "Justin Chang, Los Angeles Times: Review: Atlantics (14 November 2019)", url: "https://www.latimes.com/entertainment-arts/movies/story/2019-11-14/review-atlantics-netflix-senegal", quote: "setting out in a small boat bound for Spain"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "Souleiman has decided to take a boat with his colleagues to Spain that night"}
- card: atlantics-diop
  fact: "A fire ruins Ada's wedding and a strange fever spreads"
  sources:
    - {title: "Festival de Cannes: Atlantique (Atlantics), credits, synopsis and awards", url: "https://www.festival-cannes.com/f/atlantique/", quote: "a fire ruins Ada's wedding and a mysterious fever starts to spread"}
    - {title: "Catherine Wheatley, Sight and Sound (BFI): Atlantics review: a mysterious fable of class, migration and heartbreak", url: "https://www.bfi.org.uk/sight-and-sound/reviews/atlantics-review-mysterious-fable-class-migration-heartbreak", quote: "the abandoned girls grow feverish"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "someone in the wedding party sets fire to the polyester coverlet"}
- card: atlantics-diop
  fact: "Possessed women with milk-white eyes demand from the developer the wages owed to the men"
  sources:
    - {title: "Justin Chang, Los Angeles Times: Review: Atlantics (14 November 2019)", url: "https://www.latimes.com/entertainment-arts/movies/story/2019-11-14/review-atlantics-netflix-senegal", quote: "scenes of temporarily possessed women, with their chillingly zombified, milk-white eyes, confronting Mr. Ndiaye (Diankou Sembene), the boss who refuses to pay his workers' wages"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "stare back at the camera with white, early zombie-movie eyes and invade the home of N'Diaye, demanding he repay to them the debt owed to his male construction workers"}
- card: atlantics-diop
  fact: "The film is in Wolof"
  sources:
    - {title: "Charlotte Pavard, Festival de Cannes: Atlantique (Atlantics) by Mati Diop: the luminous wreckage of Senegalese youth (2019)", url: "https://www.festival-cannes.com/en/2019/atlantique-atlantics-by-mati-diop-the-luminous-wreckage-of-senegalese-youth/", quote: "in telling this story shot in Wolof"}
    - {title: "Justin Chang, Los Angeles Times: Review: Atlantics (14 November 2019)", url: "https://www.latimes.com/entertainment-arts/movies/story/2019-11-14/review-atlantics-netflix-senegal", quote: "(In Wolof with English subtitles)"}
- card: atlantics-diop
  fact: "It is a ghost story, a love story and a migration story"
  sources:
    - {title: "Bilal Qureshi, NPR: 'Atlantics' Is A Haunting Refugee Story — Of The Women Left Behind In Senegal (23 November 2019)", url: "https://www.npr.org/2019/11/23/780847003/atlantics-is-a-haunting-refugee-story-of-the-women-left-behind-in-senegal", quote: "Mati Diop On 'Atlantics,' A Ghost Story, A Love Story And A Refugee Story"}
    - {title: "Justin Chang, Los Angeles Times: Review: Atlantics (14 November 2019)", url: "https://www.latimes.com/entertainment-arts/movies/story/2019-11-14/review-atlantics-netflix-senegal", quote: "a mystery, a ghost story and a tale of bodily possession"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "the lyrical, richly evocative ghost story Atlantics"}
- card: atlantics-diop
  fact: "In May 2019 Diop was the first Black woman director in the Cannes competition"
  sources:
    - {title: "Andrew Pulver, The Guardian: Bong Joon-ho's Parasite wins Palme d'Or at Cannes film festival (25 May 2019)", url: "https://www.theguardian.com/film/2019/may/25/bong-joon-hos-parasite-wins-palme-dor-at-cannes-film-festival", quote: "Diop had atttracted considerable attention before the festival as the first black woman to have a film selected for competition"}
    - {title: "Associated Press via CBC News: Mati Diop becomes first black female filmmaker to compete in Cannes (17 May 2019)", url: "https://www.cbc.ca/news/entertainment/mati-diop-first-black-female-director-cannes-1.5140643", quote: "French-Senegalese director is the first black woman to direct a film in the festival's 72-year history"}
    - {title: "Antoinette Isama, OkayAfrica: Cannes 2019: Mati Diop Snags Grand Prix Award (2019)", url: "https://www.okayafrica.com/cannes-2019-mati-diop-snags-grand-prix-award-and-a-netflix-acquisition-for-atlantique/193689", quote: "the first black woman to be included in the competition"}
- card: atlantics-diop
  fact: "The film won the Grand Prix"
  sources:
    - {title: "Festival de Cannes: Atlantique (Atlantics), credits, synopsis and awards", url: "https://www.festival-cannes.com/f/atlantique/", quote: "Grand Prix 2019"}
    - {title: "Andrew Pulver, The Guardian: Bong Joon-ho's Parasite wins Palme d'Or at Cannes film festival (25 May 2019)", url: "https://www.theguardian.com/film/2019/may/25/bong-joon-hos-parasite-wins-palme-dor-at-cannes-film-festival", quote: "The Grand Prix – considered the runners-up award – went to Senegalese director Mati Diop for Atlantique"}
    - {title: "Bilal Qureshi, NPR: 'Atlantics' Is A Haunting Refugee Story — Of The Women Left Behind In Senegal (23 November 2019)", url: "https://www.npr.org/2019/11/23/780847003/atlantics-is-a-haunting-refugee-story-of-the-women-left-behind-in-senegal", quote: "her first feature won the Grand Prix"}
- card: atlantics-diop
  fact: "Her uncle Djibril Diop Mambéty made Touki Bouki in 1973; she paid tribute to it in A Thousand Suns (2013)"
  sources:
    - {title: "Charlotte Pavard, Festival de Cannes: Atlantique (Atlantics) by Mati Diop: the luminous wreckage of Senegalese youth (2019)", url: "https://www.festival-cannes.com/en/2019/atlantique-atlantics-by-mati-diop-the-luminous-wreckage-of-senegalese-youth/", quote: "In 2013, she directed Mille Soleils ( A Thousand Suns ), a documentary about Touki Bouki , the feature film directed in 1973 by her uncle, the Senegalese filmmaker Djibril Diop Mambety"}
    - {title: "Leslie Felperin, The Hollywood Reporter: Atlantics (Atlantique) review (2019)", url: "https://www.hollywoodreporter.com/movies/movie-reviews/atlantics-review-1211196/", quote: "A Thousand Suns (2013) , her acclaimed medium-length tribute to Senegalese film classic Touki Bouki (1973), directed by her uncle Djibril Diop Mambety"}
- card: atlantics-diop
  fact: "Touki Bouki follows young Dakar lovers dreaming of going to France"
  sources:
    - {title: "Festival de Cannes: Touki Bouki, Cannes Classics 2008", url: "https://www.festival-cannes.com/en/f/touki-bouki/", quote: "have met in Dakar, Senegal's capital. Alienated and disaffected with Senegal and Africa, they long to go to Paris"}
    - {title: "Margarita Landazuri, TCM: Touki Bouki", url: "https://www.tcm.com/articles/770468/touki-bouki", quote: "longing to escape Dakar, the capital of Senegal, and go to France"}
- card: for-colored-girls
  fact: "Shange was born Paulette Williams in Trenton, New Jersey, in 1948"
  sources:
    - {title: "Encyclopaedia Britannica: Ntozake Shange (archived 2019)", url: "https://web.archive.org/web/20191016052309/https://www.britannica.com/biography/Ntozake-Shange", quote: "original name Paulette Linda Williams , (born October 18, 1948, Trenton , New Jersey"}
    - {title: "Academy of American Poets, Poets.org: Ntozake Shange", url: "https://www.poets.org/poet/ntozake-shange", quote: "Ntozake Shange was born Paulette Williams on October 18, 1948, in Trenton, New Jersey."}
- card: for-colored-girls
  fact: "She studied at Barnard College and the University of Southern California"
  sources:
    - {title: "Encyclopaedia Britannica: Ntozake Shange (archived 2019)", url: "https://web.archive.org/web/20191016052309/https://www.britannica.com/biography/Ntozake-Shange", quote: "Shange attended Barnard College (B.A., 1970) and the University of Southern California (M.A., 1973)."}
    - {title: "Poetry Foundation: Ntozake Shange (archived 2020)", url: "https://web.archive.org/web/2020/https://www.poetryfoundation.org/poets/ntozake-shange", quote: "Shange attended Barnard College and the University of Southern California, earning both a BA and MA in American Studies."}
    - {title: "Associated Press via NBC News: Ntozake Shange, author of 'For Colored Girls' fame, has died (28 October 2018)", url: "https://www.nbcnews.com/news/us-news/author-ntozake-shange-colored-girls-fame-has-died-n925336", quote: "she went on to graduate from Barnard College and got a master's degree from the University of Southern California"}
- card: for-colored-girls
  fact: "She took the name Ntozake, 'she who comes with her own things', and Shange, 'she who walks like a lion'"
  sources:
    - {title: "Academy of American Poets, Poets.org: Ntozake Shange", url: "https://www.poets.org/poet/ntozake-shange", quote: "It was during this time that she took the name \"Ntozake\" (\"she who comes into her own things\") \"Shange\" (\"she who walks like a lion\")"}
    - {title: "Poetry Foundation: Ntozake Shange (archived 2020)", url: "https://web.archive.org/web/2020/https://www.poetryfoundation.org/poets/ntozake-shange", quote: "took her African name, which means \"she who comes with her own things\" and she \"who walks like a lion.\""}
- card: for-colored-girls
  fact: "She developed the piece in the San Francisco Bay Area with a few women poets and dancers in bars and studios"
  sources:
    - {title: "Kathleen Mills, EBSCO Research Starters: Shange's for colored girls . . . Presents the Black Female Psyche (2021)", url: "https://www.ebsco.com/research-starters/womens-studies-and-feminism/shanges-colored-girls-presents-black-female-psyche/", quote: "Shange began to develop her choreopoem in San Francisco's coffeehouses, bars, and studios, improvising with five female poets and dancers"}
    - {title: "Stephi Wild, BroadwayWorld: The History of for colored girls... and its Journey on Stage and Screen (24 April 2022)", url: "https://www.broadwayworld.com/article/The-History-of-FOR-COLORED-GIRLS-and-its-Journey-on-Stage-and-Screen-20220424", quote: "first performed by Shange and four other artists at women's bar, Bacchanal, which is located outside Berkeley, California"}
- card: for-colored-girls
  fact: "She coined the word choreopoem for poetry joined to dance and music"
  sources:
