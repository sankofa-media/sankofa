    - {title: "NASA Jet Propulsion Laboratory: NASA Spacecraft Embarks on Historic Journey Into Interstellar Space (12 September 2013)", url: "https://www.jpl.nasa.gov/news/nasa-spacecraft-embarks-on-historic-journey-into-interstellar-space/", quote: "NASA's Voyager 1 spacecraft officially is the first human-made object to venture into interstellar space ... the heliosphere, the bubble of charged particles surrounding the sun"}
