- card: wlib-inner-city
  fact: "He was a lawyer whose clients included Malcolm X"
  sources:
    - {title: "Godfrey Hodgson, The Guardian: Percy Sutton obituary (8 March 2010)", url: "https://www.theguardian.com/theguardian/2010/mar/08/percy-sutton-obituary", quote: "He was lawyer to Malcolm X and his widow, Betty Shabazz"}
    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "representing controversial figures such as Malcolm X"}
