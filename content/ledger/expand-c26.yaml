    - {title: "Godfrey Hodgson, The Guardian: Percy Sutton obituary (8 March 2010)", url: "https://www.theguardian.com/theguardian/2010/mar/08/percy-sutton-obituary", quote: "he acquired WLIB-AM, the first radio station in New York to be African-American-owned"}
- card: wlib-inner-city
  fact: "Inner City Broadcasting added WBLS-FM"
