    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "In 1981, Sutton also made headlines when he and his investment partners bought the crumbling Apollo Theater in Harlem"}
