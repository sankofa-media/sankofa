    - {title: "Isabel Vincent, New York Post: Fall of the house of Percy Sutton (3 January 2010)", url: "https://nypost.com/2010/01/03/fall-of-the-house-of-percy-sutton/", quote: "In 1981 Sutton bought the landmark Apollo Theater for $225,000 in bankruptcy court."}
- card: wlib-inner-city
  fact: "It reopened in 1985 after renovation with a TV studio used for It's Showtime at the Apollo"
  sources:
    - {title: "Jessica Nicholson, Billboard: Radio Hall of Fame 2024 Legends of Radio Inductees (19 August 2024)", url: "https://www.billboard.com/business/radio/2024-radio-hall-of-fame-legends-of-radio-inductees-1235755704/", quote: "The theater was renovated and reopened in 1985 and included a cable television studio that was used to produce the variety show It's Showtime at the Apollo ."}
    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "The theater reopened in 1985, and boasted more than $20 million in renovations, including a cable television studio that was used to produce the variety show It's Showtime at the Apollo ."}
    - {title: "Apollo Theater: History", url: "https://www.apollotheater.org/about/history/", quote: "Under Sutton's ownership, the Theater was equipped with a recording and television studio."}
- card: wlib-inner-city
  fact: "Sutton died in December 2009, aged 89"
  sources:
    - {title: "Commemorative Air Force Rise Above: Percy Ellis Sutton (profiles of Tuskegee Airmen)", url: "https://cafriseabove.org/percy-ellis-sutton/", quote: "Percy Ellis Sutton November 24, 1920 – December 26, 2009"}
    - {title: "Godfrey Hodgson, The Guardian: Percy Sutton obituary (8 March 2010)", url: "https://www.theguardian.com/theguardian/2010/mar/08/percy-sutton-obituary", quote: "Percy Sutton, who has died aged 89"}
- card: sweet-mother
  fact: "Prince Nico Mbarga was born in Nigeria in 1950"
  sources:
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "Prince Nico Mbarga, born in Nigeria in 1950, was a highlife musician"}
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "Born to a Nigerian mother and a Cameroonian father on Jan 1, 1950 in Abakaliki, Nigeria"}
- card: sweet-mother
  fact: "As a teenager he spent the Nigerian civil war years in Cameroon, where his music took shape"
  sources:
    - {title: "Sami Kent, Narratively: His Biggest Hit Sold More Copies Than Any of the Beatles' (2017)", url: "https://www.narratively.com/p/his-biggest-hit-sold-more-copies-than-any-of-the-beatles-so-why-havent-you-heard-of-him", quote: "the Biafran War in 1967 that saw him, at 17, flee across the border to Cameroon, where he mastered the guitar"}
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "Prince Nico's music was inspired by the five years he spent in Cameroon during the Nigerian Civil War in the late 1960's."}
- card: sweet-mother
  fact: "In the 1970s he led Rocafil Jazz in Nigeria, playing highlife"
  sources:
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "a highlife musician, renowned for his hit song \"Sweet Mother\", which he recorded with his band Rocafil Jazz in 1976"}
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "He formed his own group, Rocafil Jazz, after returning to Nigeria two years later"}
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "Performed in the highlife style"}
- card: sweet-mother
  fact: "In 1974 EMI turned the song down as childish"
  sources:
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "in 1974 EMI thought it only had \"childish appeal\" and turned it down"}
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "EMI had turned down the demo-tape of \"Sweet Mother\" in 1974, citing its childish appeal as reason."}
- card: sweet-mother
  fact: "It is a song in praise of mothers, sung in Pidgin English"
  sources:
    - {title: "BBC News: Sweet Mother is Africa's anthem (31 December 2004)", url: "https://news.bbc.co.uk/2/hi/africa/4137879.stm", quote: "the 1976 hit celebrating motherhood"}
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "sung in Pidgin English"}
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "was sung in Pidgin English"}
- card: sweet-mother
  fact: "Rocafil Jazz released it on another label in 1976"
  sources:
    - {title: "NigeriaExchange: Prince Nico Mbarga, celebrity profile", url: "http://www.ngex.com/entertainment/pages/nicombarga.htm", quote: "In December of 1976, Rogers All Stars, a recording company in Anambra State, recorded the album. In 1976, Prince Nico and his band, Rocafil Jazz, released ... \"Sweet Mother\""}
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "Luckily, it was released two years later"}
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "which he recorded with his band Rocafil Jazz in 1976"}
- card: sweet-mother
  fact: "It sold more than 13 million copies"
  sources:
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "sold more than 13 million copies"}
    - {title: "Sami Kent, Narratively: His Biggest Hit Sold More Copies Than Any of the Beatles' (2017)", url: "https://www.narratively.com/p/his-biggest-hit-sold-more-copies-than-any-of-the-beatles-so-why-havent-you-heard-of-him", quote: "had sold at least thirteen million copies across the African continent"}
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "it went on to sell more than 13-million copies"}
- card: sweet-mother
  fact: "It was his only hit on that scale"
  sources:
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "It was his only really big hit"}
    - {title: "Sami Kent, Narratively: His Biggest Hit Sold More Copies Than Any of the Beatles' (2017)", url: "https://www.narratively.com/p/his-biggest-hit-sold-more-copies-than-any-of-the-beatles-so-why-havent-you-heard-of-him", quote: "\"Sweet Mother,\" his 1976 one-hit wonder"}
- card: sweet-mother
  fact: "He was killed in a motorcycle accident on 24 June 1997"
  sources:
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "Prince Nico Mbarga was killed in a motorcycle accident on 24 June 1997."}
    - {title: "Sami Kent, Narratively: His Biggest Hit Sold More Copies Than Any of the Beatles' (2017)", url: "https://www.narratively.com/p/his-biggest-hit-sold-more-copies-than-any-of-the-beatles-so-why-havent-you-heard-of-him", quote: "thrown off a motorbike by a car in Calabar, Nigeria ... On June 24, 1997, Prince Nico Mbarga was pronounced dead."}
- card: sweet-mother
  fact: "In 2004 BBC readers and listeners chose it as Africa's favourite song from a shortlist of ten"
  sources:
    - {title: "BBC News: Sweet Mother is Africa's anthem (31 December 2004)", url: "https://news.bbc.co.uk/2/hi/africa/4137879.stm", quote: "Sweet Mother by Prince Nico Mbarga has been voted Africa's favourite song by BBC readers and listeners. Chosen from a shortlist of 10"}
    - {title: "Charles Leonard, Mail & Guardian: Celebrate Africa Day: African albums you have to hear (22 May 2014)", url: "https://mg.co.za/friday/2014-05-22-african-albums-you-have-to-hear/", quote: "In 2004 the BBC conducted a poll to discover Africa's favourite song. The winner was Nigerian singer Prince Nico Mbarga's delightful Sweet Mother ."}
- card: sweet-mother
  fact: "It is called Africa's anthem"
  sources:
    - {title: "BBC News: Sweet Mother is Africa's anthem (31 December 2004)", url: "https://news.bbc.co.uk/2/hi/africa/4137879.stm", quote: "Sweet Mother is Africa's anthem"}
    - {title: "Radio Netherlands Archives: Afroscene, interview with Prince Nico Mbarga (Ann Bolsover)", url: "https://www.radionetherlandsarchives.org/afroscene-interview-with-prince-nico-mbarga/", quote: "Sometimes it has even been called \"Africa's anthem\"."}
- card: a-subtlety
  fact: "The Domino Sugar factory in Williamsburg stopped production in 2004 and was awaiting demolition in 2014"
  sources:
    - {title: "Zach Sokol, Vice: How Kara Walker built a 75-foot-long candy sphinx in the abandoned Domino Sugar factory (8 May 2014)", url: "https://www.vice.com/en/article/how-kara-walker-built-a-75-foot-long-candy-sphinx-in-the-abandoned-domino-sugar-factory/", quote: "Williamsburg's legendary Domino Sugar Factory will open its doors to the public for the first time since factory operations ceased in 2004."}
    - {title: "Creative Time: Kara Walker, A Subtlety", url: "https://creativetime.org/projects/karawalker/", quote: "on the Occasion of the demolition of the Domino Sugar Refining Plant"}
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "the then-defunct Williamsburg Domino Sugar factory ... on the Occasion of the demolition of the Domino Sugar Refining Plant."}
- card: a-subtlety
  fact: "Creative Time commissioned it as Walker's first large public work"
  sources:
    - {title: "Creative Time: Kara Walker, A Subtlety", url: "https://creativetime.org/projects/karawalker/", quote: "In late spring of 2014, Creative Time presented the first large-scale public project by Kara Walker"}
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "her most recent public-art project, which was also her first public-art project"}
    - {title: "Carolina A. Miranda, Los Angeles Times: Q&A: Kara Walker on the bit of sugar sphinx she saved (13 October 2014)", url: "https://www.latimes.com/entertainment/arts/miranda/la-et-cam-kara-walker-on-her-sugar-sphinx-the-piece-she-saved-video-shes-making-20141013-column.html", quote: "a commission for the arts nonprofit Creative Time"}
- card: a-subtlety
  fact: "Its full title"
  sources:
    - {title: "Creative Time: Kara Walker, A Subtlety", url: "https://creativetime.org/projects/karawalker/", quote: "or the Marvelous Sugar Baby an Homage to the unpaid and overworked Artisans who have refined our Sweet tastes from the cane fields to the Kitchens of the New World"}
    - {title: "Kara Rooney, The Brooklyn Rail: Kara Walker with Kara Rooney (May 2014)", url: "https://brooklynrail.org/2014/05/art/kara-walker-with-kara-rooney/", quote: "A Subtlety, or the Marvelous Sugar Baby, an Homage to the unpaid and overworked Artisans who have refined our Sweet tastes from the cane fields to the Kitchens"}
- card: a-subtlety
  fact: "A foam body about 75 feet long and 35 feet high coated in tons of sugar"
  sources:
    - {title: "Zach Sokol, Vice: How Kara Walker built a 75-foot-long candy sphinx in the abandoned Domino Sugar factory (8 May 2014)", url: "https://www.vice.com/en/article/how-kara-walker-built-a-75-foot-long-candy-sphinx-in-the-abandoned-domino-sugar-factory/", quote: "Resting at 75-feet-long and 35-feet-tall ... it's a colossal foam sculpture that's been encrusted in a layer of powdered sugar ... over 30 tons of sugar"}
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "stood 35 feet by 75 feet ... A foam skeleton overlaid with 40 tons of sugar, water, and resin"}
- card: a-subtlety
  fact: "A sphinx with the kerchiefed head of a mammy figure, gleaming white"
  sources:
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "a Sphinx creature with the kerchiefed head of a mammy figure"}
    - {title: "Zach Sokol, Vice: How Kara Walker built a 75-foot-long candy sphinx in the abandoned Domino Sugar factory (8 May 2014)", url: "https://www.vice.com/en/article/how-kara-walker-built-a-75-foot-long-candy-sphinx-in-the-abandoned-domino-sugar-factory/", quote: "a massive, sugar-coated sculpture that resembles a combination between the mammy archetype and the sphinx ... a goddess-like sculpture that's bright white"}
    - {title: "Carolina A. Miranda, Los Angeles Times: Q&A: Kara Walker on the bit of sugar sphinx she saved (13 October 2014)", url: "https://www.latimes.com/entertainment/arts/miranda/la-et-cam-kara-walker-on-her-sugar-sphinx-the-piece-she-saved-video-shes-making-20141013-column.html", quote: "a 75-foot-long menacing mammy figure crafted entirely out of ghostly white sugar"}
- card: a-subtlety
  fact: "Statues of Black boys carrying baskets of fruit stood around her"
  sources:
    - {title: "Zach Sokol, Vice: How Kara Walker built a 75-foot-long candy sphinx in the abandoned Domino Sugar factory (8 May 2014)", url: "https://www.vice.com/en/article/how-kara-walker-built-a-75-foot-long-candy-sphinx-in-the-abandoned-domino-sugar-factory/", quote: "fifteen statues of little boys ... boys holding banana-holding baskets"}
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "protected by an infantry of black-boy figurines carrying agricult[ural]"}
- card: a-subtlety
  fact: "Visitors took joking selfies and Walker had a camera crew film them"
  sources:
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "sent a camera crew to film the crowds as they preened, laughed, and selfied around her"}
    - {title: "Carolina A. Miranda, Los Angeles Times: Q&A: Kara Walker on the bit of sugar sphinx she saved (13 October 2014)", url: "https://www.latimes.com/entertainment/arts/miranda/la-et-cam-kara-walker-on-her-sugar-sphinx-the-piece-she-saved-video-shes-making-20141013-column.html", quote: "the ways in which she spied on people taking selfies in front of it"}
- card: a-subtlety
  fact: "After the show the sphinx was broken up; Walker kept the left hand"
  sources:
    - {title: "Carolina A. Miranda, Los Angeles Times: Q&A: Kara Walker on the bit of sugar sphinx she saved (13 October 2014)", url: "https://www.latimes.com/entertainment/arts/miranda/la-et-cam-kara-walker-on-her-sugar-sphinx-the-piece-she-saved-video-shes-making-20141013-column.html", quote: "She was knocked down over a week period ... There's one piece left: her left hand."}
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "the Sugar Baby was conceived to be wiped away, too — to be almost completely destroyed ... the left hand of the Sugar Baby, making the figa gesture, will be displayed"}
- card: a-subtlety
  fact: "The film of the visitors became a work of its own"
  sources:
    - {title: "Doreen St. Félix, Vulture: After Her Sugar Sphinx, Kara Walker Is a Whole Different Kind of Public Figure (2017)", url: "https://www.vulture.com/2017/04/kara-walker-after-a-subtlety.html", quote: "producing a kind of surveillance footage. Then she screened the result at Sikkema Jenkins"}
    - {title: "Carolina A. Miranda, Los Angeles Times: Q&A: Kara Walker on the bit of sugar sphinx she saved (13 October 2014)", url: "https://www.latimes.com/entertainment/arts/miranda/la-et-cam-kara-walker-on-her-sugar-sphinx-the-piece-she-saved-video-shes-making-20141013-column.html", quote: "Q&A: Kara Walker on the bit of sugar sphinx she saved, video she's making"}
- card: onesimus
  fact: "In 1706 Cotton Mather's congregation bought him an enslaved West African man as a gift, and Mather named him Onesimus"
  sources:
    - {title: "Erin Blakemore, History.com: How an Enslaved African Man in Boston Helped Save Generations from Smallpox", url: "https://www.history.com/articles/smallpox-vaccine-onesimus-slave-cotton-mather", quote: "In 1706, an enslaved West African man was purchased for the prominent Puritan minister Cotton Mather by his congregation. Mather gave him the name Onesimus"}
    - {title: "College of Physicians of Philadelphia, History of Vaccines: Onesimus Spreads Wisdom That Saves Lives of Bostonians During a Smallpox Epidemic", url: "https://www.historyofvaccines.org/blog/black-history-month-onesimus-spreads-wisdom-that-saves-lives-of-bostonians-during-a-smallpox-epidemic/", quote: "Mather had bought Onesimus in 1706"}
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "Onesimus, an enslaved West African who had been \"gifted\" to Mather by members of his congregation"}
- card: onesimus
  fact: "Onesimus said he had 'undergone an Operation...' and that it was common among the 'Guramantese'"
  sources:
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "he had undergone an Operation, which had given him something of the Small-Pox, and would forever preserve him from it, adding that it was often used among the Guramantese"}
    - {title: "Paul Revere House: Onesimus, Mather, and the Origins of Inoculation in Boston", url: "https://www.paulreverehouse.org/onesimus-mather-and-the-origins-of-inoculation-in-boston/", quote: "he had undergone an Operation, which had given him something of the Small-Pox & would forever preserve him from it; adding that it was ofte[n used]"}
- card: onesimus
  fact: "In 1716 Mather described it in a letter to the Royal Society in London"
  sources:
    - {title: "Paul Revere House: Onesimus, Mather, and the Origins of Inoculation in Boston", url: "https://www.paulreverehouse.org/onesimus-mather-and-the-origins-of-inoculation-in-boston/", quote: "In his 1716 letter, Mather emphasized how Africans were at the forefront of such practices"}
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "In an earlier letter to the Royal Society, Mather wrote, Enquiring of my Negro-man Onesimus"}
    - {title: "Erin Blakemore, History.com: How an Enslaved African Man in Boston Helped Save Generations from Smallpox", url: "https://www.history.com/articles/smallpox-vaccine-onesimus-slave-cotton-mather", quote: "But in 1716, Onesimus told him something he did believe"}
- card: onesimus
  fact: "In 1721 a devastating smallpox epidemic struck Boston"
  sources:
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "a devastating outbreak of smallpox in Boston in 1721"}
    - {title: "Mass Moments (Mass Humanities): Dr. Boylston Experiments with Smallpox Inoculation, June 26, 1721", url: "https://www.massmoments.org/moment-details/dr-boylston-experiments-with-smallpox-inoculation.html", quote: "When an epidemic broke out in Boston in 1721, Mather wanted to try this method."}
- card: onesimus
  fact: "Most doctors rejected inoculation; Zabdiel Boylston took it up"
  sources:
    - {title: "Mass Moments (Mass Humanities): Dr. Boylston Experiments with Smallpox Inoculation, June 26, 1721", url: "https://www.massmoments.org/moment-details/dr-boylston-experiments-with-smallpox-inoculation.html", quote: "Mather ... tell doctors what he knew about inoculation; all but one ignored him. The surgeon Zabdiel Boylston found Mather persuasive"}
    - {title: "Paul Revere House: Onesimus, Mather, and the Origins of Inoculation in Boston", url: "https://www.paulreverehouse.org/onesimus-mather-and-the-origins-of-inoculation-in-boston/", quote: "Only one doctor listened and heeded Mather's arguments: Zabdiel Boylston."}
- card: onesimus
  fact: "Boylston inoculated his young son and enslaved people of his household, then hundreds more"
  sources:
    - {title: "Mass Moments (Mass Humanities): Dr. Boylston Experiments with Smallpox Inoculation, June 26, 1721", url: "https://www.massmoments.org/moment-details/dr-boylston-experiments-with-smallpox-inoculation.html", quote: "I inoculated my Son Thomas, of about six, my Negro Man, Jack, thrity six, and Jackey, two an half Years old."}
    - {title: "Paul Revere House: Onesimus, Mather, and the Origins of Inoculation in Boston", url: "https://www.paulreverehouse.org/onesimus-mather-and-the-origins-of-inoculation-in-boston/", quote: "After testing the procedure on his young son and on two of his enslaved persons, Jack and Moll, Boylston began inoculations in earnest."}
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "Of the 242 people he inoculated (including his teenage son and enslaved people in his household)"}
- card: onesimus
  fact: "Someone threw an explosive through the window of Mather's house"
  sources:
    - {title: "Erin Blakemore, History.com: How an Enslaved African Man in Boston Helped Save Generations from Smallpox", url: "https://www.history.com/articles/smallpox-vaccine-onesimus-slave-cotton-mather", quote: "An explosive device was thrown through his windows with an angry note."}
    - {title: "College of Physicians of Philadelphia, History of Vaccines: Onesimus Spreads Wisdom That Saves Lives of Bostonians During a Smallpox Epidemic", url: "https://www.historyofvaccines.org/blog/black-history-month-onesimus-spreads-wisdom-that-saves-lives-of-bostonians-during-a-smallpox-epidemic/", quote: "one local terrorist did exactly that, throwing a bomb through Mather's window"}
    - {title: "Mass Moments (Mass Humanities): Dr. Boylston Experiments with Smallpox Inoculation, June 26, 1721", url: "https://www.massmoments.org/moment-details/dr-boylston-experiments-with-smallpox-inoculation.html", quote: "Cotton Mather's house was firebombed"}
- card: onesimus
  fact: "About one in forty of Boylston's patients died against one in seven in the town"
  sources:
    - {title: "Houghton Library, Harvard University: Three Bostonians and the Smallpox Epidemic of 1721 (2020)", url: "https://sites.harvard.edu/houghton-library/2020/06/04/three-bostonians-and-the-smallpox-epidemic-of-1721/", quote: "just six, or about one in 40, succumbed to the illness. Citywide the death toll approached 850, or a mortality rate of one in seven"}
    - {title: "Erin Blakemore, History.com: How an Enslaved African Man in Boston Helped Save Generations from Smallpox", url: "https://www.history.com/articles/smallpox-vaccine-onesimus-slave-cotton-mather", quote: "only six died—one in 40, as opposed to one in seven deaths among the population of Boston"}
    - {title: "College of Physicians of Philadelphia, History of Vaccines: Onesimus Spreads Wisdom That Saves Lives of Bostonians During a Smallpox Epidemic", url: "https://www.historyofvaccines.org/blog/black-history-month-onesimus-spreads-wisdom-that-saves-lives-of-bostonians-during-a-smallpox-epidemic/", quote: "one in forty people inoculated by Boylston died from smallpox. In those who acquired it naturally, one in seven died"}
- card: onesimus
  fact: "Little is known of his later life except that he partly bought his freedom by paying towards a replacement"
  sources:
    - {title: "Erin Blakemore, History.com: How an Enslaved African Man in Boston Helped Save Generations from Smallpox", url: "https://www.history.com/articles/smallpox-vaccine-onesimus-slave-cotton-mather", quote: "Nothing is known of his later life other than that he partiall[y] purchased his freedom. To do so ... he gave Mather money to purchase another enslaved person."}
    - {title: "Paul Revere House: Onesimus, Mather, and the Origins of Inoculation in Boston", url: "https://www.paulreverehouse.org/onesimus-mather-and-the-origins-of-inoculation-in-boston/", quote: "Onesimus, who indirectly purchased his freedom by providing \"a Summ, towards the purchase of a Negro-Lad\" so that Mather could buy another enslaved person to replace him"}
    - {title: "College of Physicians of Philadelphia, History of Vaccines: Onesimus Spreads Wisdom That Saves Lives of Bostonians During a Smallpox Epidemic", url: "https://www.historyofvaccines.org/blog/black-history-month-onesimus-spreads-wisdom-that-saves-lives-of-bostonians-during-a-smallpox-epidemic/", quote: "Onesimus would go on to partially purchase his freedom"}
- card: capitein
  fact: "The Dutch West India Company held the castle of Elmina on the Gold Coast"
  sources:
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "the Dutch West India Company, which owned the Elmina Castle, where Capitein would live and serve"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (A)", url: "https://dacb.org/stories/ghana/capitein-jacobus/", quote: "appointed a preacher and schoolmaster at Elmina by the authorities of the Dutch Reformed Church at the request of the directors of the Dutch West India Company"}
- card: capitein
  fact: "Born around 1717, he was enslaved at about seven"
  sources:
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "Capitein was born about 1717 and was captured by Steenhart when he was approximately seven years old."}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "Capitein was born around 1717 on the African Gold Coast (present-day Ghana). In 1725, at the age of seven or eight, he was bought as a slave"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "he was kidnapped from his parents at the age of seven or eight"}
- card: capitein
  fact: "The slave trader Arnold Steenhart gave him to his friend Jacob van Goch, a Company man"
  sources:
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "he was bought as a slave by a Dutch slave trader Arnold Steenhart, who gave Capitein as a present to his friend Jacob van Goch, a Dutch West India Company merchant"}
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "His abductor, the slave trader Arnold Steenhart ... presented as a gift, Captain Jacob van Goch"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "sold to Dutch sea-captain named Arnold Steenhard who gave him as a present to his friend the merchant Jacob van Gogh"}
- card: capitein
  fact: "In 1728 van Goch took him to Middelburg in the Netherlands, where slavery did not exist"
  sources:
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "put on a ship that sailed from Elmina on 14 April 1728 to the Dutch city of Middelburg ... because slavery did not exist within the Netherlands"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "In 1728, at the age of eleven, Van Goch took Capitein with him to the Netherlands"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "before leaving with him for Holland in 1728. With his entry into The Netherlands , Capitein won his freedom since slavery at that time was officially banned"}
- card: capitein
  fact: "He grew up in The Hague, attended its Latin School and was baptised"
  sources:
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "Capitein went to The Hague where he lived in Van Goch's house for several years, taking classes at the Latin School there ... He was baptised in 1735"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "In The Hague Capitein learned the Heidelberg Catechism and was baptized ... spent six and a half years at the Latin School in The Hague"}
- card: capitein
  fact: "He entered Leiden University in 1737"
  sources:
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "before registering at Leiden University in 1737"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "begin his studies in theology at the University of Leiden in 1737"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "In 1737, at the age of twenty, Capitein left The Hague and moved to Leiden"}
- card: capitein
  fact: "In 1742 he defended a Latin dissertation arguing slavery is compatible with Christian freedom"
  sources:
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (A)", url: "https://dacb.org/stories/ghana/capitein-jacobus/", quote: "His academic achievement was crowned with a Latin dissertation, delivered on March 10, 1742, entitled \"De Servitute Libertati Christianiae Non Contraria,\" defending the theme that slavery was not \"contrary to Christian freedom\""}
    - {title: "Jos Damen, Leiden University, Top 450: The story of Jacobus Capitein", url: "https://top450.universiteitleiden.nl/en/", quote: "On 10 March 1742, Jacobus Capitein defended his book Dissertatio politico-theologica de servitute, libertati christianæ non co[ntraria]"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "His dissertation on slavery and Christian liberty (as not being opposed to each other) was presented in 1742"}
- card: capitein
  fact: "It won him wide attention among theologians and slave traders"
  sources:
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "gained him widespread attention and appreciation among theologians and slave traders"}
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "Capitein's dissertation was successful, and the Dutch translation had four editions in one year."}
- card: capitein
  fact: "That year he sailed back to Elmina as the Company's minister and schoolmaster"
  sources:
    - {title: "Leiden Special Collections Blog: Leiden dissertation 1742: slavery not against the Bible (2020)", url: "https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible", quote: "In July 1742, Capitein sailed to Elmina to bring God's word to the heathens there."}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "in the same year boarded a ship to return to Africa. Immediately after his arrival in Elmina in October 1742"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (A)", url: "https://dacb.org/stories/ghana/capitein-jacobus/", quote: "appointed a preacher and schoolmaster at Elmina"}
- card: capitein
  fact: "He started a school and translated the Lord's Prayer and the Ten Commandments into Fante"
  sources:
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (A)", url: "https://dacb.org/stories/ghana/capitein-jacobus/", quote: "he had the Lord's Prayer, parts of the Catechism, the Twelve Articles of Belief, and the Ten Commandme[nts]"}
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "He tried to revive a religious school for mulatto children ... and translated religious texts into Fanti."}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "The publishers especially took exception with Capitein's translation of the fourth commandment"}
- card: capitein
  fact: "He found little support from the Company or the church authorities in Amsterdam"
  sources:
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "setbacks and personal defeats stemming from the lack of support by the West Indian Trading Company and his church Classis in Holland"}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (C)", url: "https://dacb.org/stories/ghana/capitein-jacobus3/", quote: "his deteriorating relationship and miscommunications with the Dutch West India Company and the Classis of Amsterdam"}
- card: capitein
  fact: "He died at Elmina in February 1747, about thirty"
  sources:
    - {title: "Nikolaus Wirth, BlackPast.org: Jacobus Elisa Johannes Capitein (ca. 1717-1747) (2007)", url: "https://blackpast.org/global-african-history/capitein-jacobus-elisa-johannes-1717-1747/", quote: "Capitein died on 1st February 1747, aged about 30."}
    - {title: "Jos Damen, Leiden University, Top 450: The story of Jacobus Capitein", url: "https://top450.universiteitleiden.nl/en/", quote: "He died in 1747 at the age of 30 near Fort Elmina in what is now Ghana."}
    - {title: "Dictionary of African Christian Biography: Capitein, Jacobus (A)", url: "https://dacb.org/stories/ghana/capitein-jacobus/", quote: "Jacobus Eliza Johannes Capitein (c.1717 – February 1747)"}
- card: males-revolt-1835
  fact: "Salvador's enslaved Africans worked in the streets as porters, tradesmen and vendors, handing owners a share of earnings"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "esses homens e mulheres escravizados contratavam com seus senhores entregar certa quantia diária ou semanal de dinheiro"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Many Hausa and Yoruba worked as ganhadores , slaves-for-hire who sold their labor on the streets of Salvador."}
- card: males-revolt-1835
  fact: "Most of the Muslim rebels were Yoruba speakers, called Nagô in Bahia"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "os malês eram especificamente os muçulmanos de língua iorubá, conhecidos como nagôs na Bahia"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Hausa and Yoruba, also known as Nagô"}
    - {title: "Valentina Fraiz and Eduardo Magossi, Revista Pesquisa FAPESP: Revolts intensified repression of enslaved people (November 2025)", url: "https://revistapesquisa.fapesp.br/en/revolts-intensified-repression-of-enslaved-people/", quote: "a group led by the Malês , the name given to Nago Muslims"}
- card: males-revolt-1835
  fact: "They met to pray and to learn to write passages of the Qur'an"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "rezas e aulas em que se exercitavam a recitação, a memorização e a escrita de passagens do Corão"}
    - {title: "Valentina Fraiz and Eduardo Magossi, Revista Pesquisa FAPESP: Revolts intensified repression of enslaved people (November 2025)", url: "https://revistapesquisa.fapesp.br/en/revolts-intensified-repression-of-enslaved-people/", quote: "These enslaved people wrote passages from the Qur'an and other literary works they remembered"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Through instruction in the Qur'an, clerics won converts to Islam"}
- card: males-revolt-1835
  fact: "The rising was set for the early hours of Sunday 25 January 1835, near the end of Ramadan"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "Na madrugada de 25 de janeiro de 1835, um domingo ... O próprio levante foi marcado para acontecer no final do mês sagrado do Ramadã"}
    - {title: "Tribunal de Justiça do Estado da Bahia: O Tribunal da Relação da Bahia e a Revolta dos Malês", url: "https://www.tjba.jus.br/portal/o-tribunal-da-relacao-da-bahia-e-a-revolta-dos-males/", quote: "no dia 24 de janeiro de 1835 (sábado) ... na qual se celebra o fim do Ramadã"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "The rebellion also corresponded with the end of the Muslim holiday Ramadan. The rebellion was set to begin on January 25 at 5:00am"}
- card: males-revolt-1835
  fact: "It was betrayed and fighting began in the night"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "Os rebeldes tinham planejado o levante para acontecer nas primeiras horas da manhã do dia 25, mas foram denunciados."}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Their plans, however, were betrayed."}
    - {title: "Tribunal de Justiça do Estado da Bahia: O Tribunal da Relação da Bahia e a Revolta dos Malês", url: "https://www.tjba.jus.br/portal/o-tribunal-da-relacao-da-bahia-e-a-revolta-dos-males/", quote: "ouviu comentários sobre uma insurreição escrava. A companheira de Domingos, Guilhermina Rosa de Souza, naquela noite, por volta das 21h, dividiu o boato"}
- card: males-revolt-1835
  fact: "Rebels wore white Muslim robes"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "Os malês foram para as ruas guerrear usando um abadá branco, espécie de camisolão tipicamente muçulmano"}
    - {title: "Tribunal de Justiça do Estado da Bahia: O Tribunal da Relação da Bahia e a Revolta dos Malês", url: "https://www.tjba.jus.br/portal/o-tribunal-da-relacao-da-bahia-e-a-revolta-dos-males/", quote: "Os rebeldes estavam vestidos de branco"}
- card: males-revolt-1835
  fact: "They first attacked the jail holding the elderly leader Pacífico Licutan and failed to free him"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "A Câmara foi atacada porque em seu subsolo existia uma prisão onde se encontrava preso um dos líderes malês mais estimados, o idoso Pacifico Licutan ... O ataque à prisão não foi bem sucedido."}
    - {title: "Tribunal de Justiça do Estado da Bahia: O Tribunal da Relação da Bahia e a Revolta dos Malês", url: "https://www.tjba.jus.br/portal/o-tribunal-da-relacao-da-bahia-e-a-revolta-dos-males/", quote: "situada no subsolo da Câmara de Vereadores, onde se achava preso o idoso Pacífico Licutan"}
- card: males-revolt-1835
  fact: "About 600 people took part"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "A revolta envolveu cerca de 600 homens"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "involved an estimated six hundred Yoruba and Hausa from present-day Nigeria"}
- card: males-revolt-1835
  fact: "They were cornered at the cavalry barracks of Água de Meninos and more than seventy rebels were killed"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "foram barrados no quartel da cavalaria em Água de Meninos ... com a morte de mais de 70 rebeldes"}
    - {title: "André Bernardo, BBC News Brasil: O legado de negros muçulmanos que se rebelaram na Bahia (9 May 2018)", url: "https://www.bbc.com/portuguese/brasil-44011770", quote: "foram encurralados em Água de Meninos, local do Quartel da Cavalaria. Foi ali que se deu a batalha final. Antes do nascer do sol, 73 rebeldes já tinham tombado mortos"}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "left some seventy Africans dead"}
- card: males-revolt-1835
  fact: "Hundreds were arrested"
  sources:
    - {title: "André Bernardo, BBC News Brasil: O legado de negros muçulmanos que se rebelaram na Bahia (9 May 2018)", url: "https://www.bbc.com/portuguese/brasil-44011770", quote: "Os mais de 500 presos foram interrogados, julgados e punidos."}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Raids continued for months; hundreds of Africans eventually found themselves in police custody"}
- card: males-revolt-1835
  fact: "Police seized Arabic writings and amulets holding Qur'anic verses"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "amuletos protetores, que eram cópias em papel de rezas e passagens do Corão ... Pela quantidade de amuletos apreendidos pela polícia em 1835"}
    - {title: "Tribunal de Justiça do Estado da Bahia: O Tribunal da Relação da Bahia e a Revolta dos Malês", url: "https://www.tjba.jus.br/portal/o-tribunal-da-relacao-da-bahia-e-a-revolta-dos-males/", quote: "portavam amuletos com frases corânicas em árabe"}
- card: males-revolt-1835
  fact: "Sentences ranged from flogging to deportation to Africa for freed men"
  sources:
    - {title: "André Bernardo, BBC News Brasil: O legado de negros muçulmanos que se rebelaram na Bahia (9 May 2018)", url: "https://www.bbc.com/portuguese/brasil-44011770", quote: "As penas variavam de açoites para os escravos a deportação para os libertos."}
    - {title: "Encyclopedia of African-American Culture and History (Encyclopedia.com): Malê Rebellion", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/male-rebellion", quote: "Freedmen ... more commonly, deportation to the African coast. Floggings ranged from fifty to twelve hundred lashes."}
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "prisão simples, prisão com trabalho, açoite, morte e deportação para a África"}
- card: males-revolt-1835
  fact: "Four men were shot by a firing squad"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "Todos quatro foram executados por um pelotão de fuzilamento no Campo da Pólvora, no dia 14 de maio de 1835."}
    - {title: "André Bernardo, BBC News Brasil: O legado de negros muçulmanos que se rebelaram na Bahia (9 May 2018)", url: "https://www.bbc.com/portuguese/brasil-44011770", quote: "os condenados foram mesmo fuzilados, em praça pública, por um pelotão improvisado"}
    - {title: "Valentina Fraiz and Eduardo Magossi, Revista Pesquisa FAPESP: Revolts intensified repression of enslaved people (November 2025)", url: "https://revistapesquisa.fapesp.br/en/revolts-intensified-repression-of-enslaved-people/", quote: "Sixteen people were sentenced to death, but only four were executed."}
- card: males-revolt-1835
  fact: "Fear spread through the Empire of Brazil and repression of Africans grew harsher"
  sources:
    - {title: "João José Reis, A Revolta dos Malês em 1835 (Universidade Federal da Bahia; archived)", url: "https://web.archive.org/web/20140116070821/http://www.educacao.salvador.ba.gov.br/documentos/a-revolta-dos-males.pdf", quote: "Um medo que, aliás, se difundiu pelas demais províncias do Império do Brasil ... uma repressão abusiva"}
