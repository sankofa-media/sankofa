    - {title: "Gabe Pressman, NBC New York: Percy Sutton: A Legend Gone (28 December 2009)", url: "https://www.nbcnewyork.com/news/local/percy-sutton-a-legend-gone/2121500/", quote: "After his defeat in the 1977 mayoral election, Sutton gave up his personal involvement in politics"}
