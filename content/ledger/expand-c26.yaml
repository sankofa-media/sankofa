- card: johnny-b-goode
  fact: "In 1977 NASA launched two Voyagers, each with a gold-plated record of sounds and music of Earth"
  sources:
    - {title: "Mark D. Kaufman, Popular Science: Chuck Berry is gone, but his music is still flying through the cosmos (21 March 2017)", url: "https://www.popsci.com/chuck-berry-golden-record-voyager/", quote: "The two Voyager spacecraft , launched in 1977, each have a gleaming gold-plated copper record entitled \"The Sounds From Earth,\""}
    - {title: "Timothy Ferris, The New Yorker: How the Voyager Golden Record Was Made (2017)", url: "https://www.newyorker.com/tech/annals-of-technology/voyager-golden-record-40th-anniversary-timothy-ferris", quote: "a pair of phonograph records, were launched aboard the twin Voyager space probes in August and September of 1977"}
    - {title: "NASA Science: Golden Record contents, sounds and music", url: "https://science.nasa.gov/mission/voyager/golden-record-contents/sounds/", quote: "United States \"Johnny B. Goode\" written and performed by Chuck Berry"}
- card: johnny-b-goode
  fact: "Alan Lomax derided the song as adolescent; Carl Sagan replied that the planet has many adolescents"
  sources:
    - {title: "Timothy Ferris, The New Yorker: How the Voyager Golden Record Was Made (2017)", url: "https://www.newyorker.com/tech/annals-of-technology/voyager-golden-record-40th-anniversary-timothy-ferris", quote: "going so far as to politely remind Lomax, who derided Berry's music as \"adolescent,\" that Earth is home to many adolescents"}
    - {title: "Mark D. Kaufman, Popular Science: Chuck Berry is gone, but his music is still flying through the cosmos (21 March 2017)", url: "https://www.popsci.com/chuck-berry-golden-record-voyager/", quote: "Alan Lomax ... called rock music too adolescent to be included ... Carl Sagan, who famously argued, \"There are a lot of adolescents on the planet.\""}
- card: johnny-b-goode
  fact: "Johnny B. Goode is on the Golden Record"
  sources:
    - {title: "NASA Science: Golden Record contents, sounds and music", url: "https://science.nasa.gov/mission/voyager/golden-record-contents/sounds/", quote: "3:14 United States \"Johnny B. Goode\" written and performed by Chuck Berry"}
    - {title: "Mark D. Kaufman, Popular Science: Chuck Berry is gone, but his music is still flying through the cosmos (21 March 2017)", url: "https://www.popsci.com/chuck-berry-golden-record-voyager/", quote: "whomever—or whatever—comes across it will be gifted with Berry's potent tale about \"Johnny B. Goode,\""}
    - {title: "Timothy Ferris, The New Yorker: How the Voyager Golden Record Was Made (2017)", url: "https://www.newyorker.com/tech/annals-of-technology/voyager-golden-record-40th-anniversary-timothy-ferris", quote: "Lomax, who derided Berry's music as \"adolescent,\""}
- card: johnny-b-goode
