          note: "'It rejected the blues idiom itself' was too sweeping: Faust's acid blues, Amon Düül II's heavy riffing, Ash Ra Tempel's Stooges-derived rock and Can's turn to James Brown's funk are exceptions in the same sources. What is supported is the rejection of blues-rock and blues forms and harmonies by most bands, and by name for Neu!, Rother and Kraftwerk. The 'kept the beat' clause had rock-and-roll backing only; Reynolds' Bo Diddley passage added. Art rock fits only its psychedelic/Velvet Underground side; krautrock avoided prog virtuosity. Rother's Cream/Hendrix item is listening, not testimony (dimension sound only). The Clash text quoted a second sentence not in its quote; split into its own item. Schmidt's 'another music history' is about New York 1966 and is kept without dimensions."
          changes: "how/howRu: 'Most of its bands rejected the blues idiom of that rock … Black music came back in another form, as the funk groove Can took from James Brown'; '— not the virtuoso suites of progressive rock'. Added evidence: Reynolds (Bo Diddley, rhythm), Reynolds (James Brownian motion, rhythm), Clash (originals, no dimension). Retyped Rother Cream/Hendrix to listening."
          quotes:
            - url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "As the influence of James Brownian motion kicked in, Can began to fuse 'head' and 'booty', atmosphere and groove, like nobody else save Miles Davis."
            - url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "Krautrock brought into focus an idea latent in rock, from Bo Diddley to the Stooges to the Modern Lovers: that the rhythmic essence of rock music, what made it different from jazz, was a kind of machinic compulsion."
            - url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "miraculously avoided prog-rock's bombastics, its cult of virtuosity-for-virtuosity's-sake."
            - url: "https://www.kqed.org/arts/13807595/a-good-way-to-master-the-future-an-interview-with-holger-czukay-1997"
              quote: "rather than emulating American and British rock trends"
            - url: "https://www.clashmusic.com/features/fortunes-of-krautrock-an-interview-with-michael-rother/"
              quote: "I love Little Richard, I love a lot of chuck berry stuff and Jimi Hendrix, but they were the originals."
      - to: "style:free-jazz"
        kind: "style"
        scope: "career"
        how: "Part of krautrock came straight from West German free jazz: Guru Guru, led by the drummer Mani Neumeier, fused acid rock with free jazz, and Can’s drummer Jaki Liebezeit and Neumeier had both played the free jazz of Manfred Schoof and Peter Brötzmann. From it came collective, free improvisation. But krautrock put back what free jazz had given up — a fixed, repeated pulse: Liebezeit left free jazz because it allowed nothing rhythmically structured."
        dimensions: ["performance","rhythm","sound"]
        research:
          - type: "critics"
            dimensions: ["performance"]
            title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
            url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
            quote: "CAN's core was a quartet of lapsed avant-garde and free jazz musicians (bassist Holger Czukay, guitarist Michael Karoli, keyboardist Irmin Schmidt and drummer Jaki Leibezeit) who--blown away by the VU and the Beatles' \"I Am The Walrus\"-- decided rock was where it was at."
          - type: "critics"
            dimensions: ["performance"]
            title: "The Quietus (Ben Graham): Still Growing — Hans-Joachim Irmler and Jaki Liebezeit interviewed (2015)"
            url: "https://thequietus.com/interviews/hans-joachim-irmler-jaki-liebezeit-interview/"
            quote: "He played with Chet Baker in Barcelona and then joined the Manfred Schoof Quintet, generally regarded as one of the pioneering European free jazz outfits. In 1966 he played on the album Globe Unity which featured Peter Brotzmann on alto saxophone and Liebezeit drumming in the left channel while Mani Neumeier, later to form Guru Guru, drummed in the right."
          - type: "testimony"
            dimensions: ["performance","rhythm"]
            title: "Modern Drummer: Jaki Liebezeit — Hero to a Generation of Thinking Alternative Groovers (2017)"
            url: "https://www.moderndrummer.com/2017/01/jaki-liebezeit-hero-generation-thinking-alternative-groovers/"
            quote: "In the mid-’60s I was the first free jazz drummer in Germany. But I stopped that because, to my mind, I couldn’t develop any further in that genre. In free jazz you just weren’t allowed to play anything that was harmonically or rhythmically structured."
          - type: "testimony"
            dimensions: ["rhythm"]
            title: "Louder / Prog (Rob Hughes): ‘We never saw ourselves as a rock group’ — the Prog interview with Can’s Irmin Schmidt (2019)"
            url: "https://www.loudersound.com/features/we-never-saw-ourselves-as-a-rock-group-the-prog-interview-with-cans-irmin-schmidt"
            quote: "I thought, “Shit, I don’t want a free jazz drummer.” And then it turned out that he didn’t want to be one anymore anyway."
          - type: "critics"
            dimensions: ["sound","performance"]
            title: "Classical Music (Steve Wright): Ranked — the 17 greatest krautrock albums of all time (2025)"
            url: "https://www.classical-music.com/features/recordings/best-krautrock-albums"
            quote: "Fusing acid rock, free jazz, and avant-garde noise, Guru Guru—led by powerhouse drummer Mani Neumeier—created a cosmic freak-out that felt both anarchic and visionary. The album’s relentless energy and improvisational chaos"
        check:
          verdict: "weakened"
          flags: ["overstated-how","proxy"]
          note: "Free jazz as a stylistic source is directly supported only for Guru Guru and as the background of Liebezeit and Mani Neumeier. Reynolds' 'quartet of lapsed avant-garde and free jazz musicians' is loose (Czukay and Karoli came from Stockhausen's circle); Schmidt did not want a free jazz drummer. Czukay's 'instant compositions' quote says nothing about free jazz and was a proxy; removed from this step (kept as a trait source). The how was honest that krautrock restored the pulse. The step stays as a career step for part of krautrock, worded as such."
          changes: "how/howRu now open 'Part of krautrock came straight from West German free jazz: Guru Guru … fused acid rock with free jazz, and … Liebezeit and Neumeier had both played the free jazz of Manfred Schoof and Peter Brötzmann.' Reynolds item text qualified ('of the four, it was Liebezeit who came from free jazz'). Czukay item removed."
          quotes:
            - url: "https://www.classical-music.com/features/recordings/best-krautrock-albums"
              quote: "Fusing acid rock, free jazz, and avant-garde noise"
            - url: "https://www.loudersound.com/features/we-never-saw-ourselves-as-a-rock-group-the-prog-interview-with-cans-irmin-schmidt"
              quote: "I didn’t want a free jazz drummer. I wanted somebody like Max Roach"
            - url: "https://www.kqed.org/arts/13807595/a-good-way-to-master-the-future-an-interview-with-holger-czukay-1997"
              quote: "I just studied with [composer Karlheinz] Stockhausen; I didn’t have any practical experience."
artists:
  - id: "kraftwerk"
    links:
      - to: "style:krautrock"
        kind: "style"
        scope: "career"
        how: "Kraftwerk came out of the West German experimental rock that British critics called krautrock. Ralf Hütter and Florian Schneider began with freely improvised music in Organisation (1969) and on the first Kraftwerk albums of 1970–73, played happenings and art events, crossed paths with Can and Faust at festivals, and shared the scene’s aim of a music of their own, away from Anglo-American structures based on the blues. Kraftwerk later called those records ‘archaeology’ and date their career from Autobahn (1974), but that is where their method formed: Autobahn made electronic the long, hypnotic, repeated pulse they took from that scene."
        dimensions: ["performance","sound","rhythm","harmony-form","image"]
        research:
          - type: "critics"
            dimensions: ["performance","sound"]
            title: "Rock & Roll Hall of Fame (Rob Bowman): Kraftwerk induction essay (2021)"
            url: "https://rockhall25.wpenginepowered.com/wp-content/uploads/2025/10/Kraftwerk_26746_RNRHF_2021_Highres-11.pdf"
            quote: "After recording an album of freely improvised music with a group called Organisation in 1969, Hütter and Schneider began working as a duo under the moniker Kraftwerk"
          - type: "critics"
            dimensions: ["performance"]
            title: "Rock & Roll Hall of Fame (Rob Bowman): Kraftwerk induction essay (2021)"
            url: "https://rockhall25.wpenginepowered.com/wp-content/uploads/2025/10/Kraftwerk_26746_RNRHF_2021_Highres-11.pdf"
            quote: "Hütter refers to them as “archaeology,” and the group maintains that its career officially started in 1974 with the more pop-oriented album Autobahn."
          - type: "testimony"
            dimensions: ["performance","image"]
            title: "Red Bull Music Academy Daily (Jon Savage): Interview — Kraftwerk (Ralf Hütter, 1991)"
            url: "https://daily.redbullmusicacademy.com/2012/08/kraftwerk-interview"
            quote: "Through the 50s and 60s everything was Americanised, directed towards consumer behaviour. So, we were part of this ’68 movement, where suddenly there were possibilities, and we performed at happenings and art situations. Then we started just with sound, to establish some form of industrial German sound"
          - type: "testimony"
            dimensions: ["performance"]
            title: "Red Bull Music Academy Daily (Jon Savage): Interview — Kraftwerk (Ralf Hütter, 1991)"
            url: "https://daily.redbullmusicacademy.com/2012/08/kraftwerk-interview"
            quote: "We would cross paths every once in a while, playing festivals. We have been friends with Holger since the very old days, art gallery concerts, sure."
          - type: "testimony"
            dimensions: ["harmony-form","image"]
            title: "Red Bull Music Academy: Michael Rother lecture (Tokyo, 2014)"
            url: "https://www.redbullmusicacademy.com/lectures/michael-rother-tokyo-2014"
            quote: "That was, for me, the first situation where I discovered that I was not completely alone with my idea of creating a music that was different, different from Anglo-American musical structures that are mostly, or were mostly, based on the blues."
          - type: "testimony"
            dimensions: ["performance"]
            title: "Red Bull Music Academy: Michael Rother lecture (Tokyo, 2014)"
            url: "https://www.redbullmusicacademy.com/lectures/michael-rother-tokyo-2014"
            quote: "This was very wild, improvised music, and in the studio, we had the same clinical situation, and we didn’t really get far"
          - type: "testimony"
            dimensions: ["image"]
            title: "Red Bull Music Academy Daily (Jon Savage): Interview — Kraftwerk (Ralf Hütter, 1991)"
            url: "https://daily.redbullmusicacademy.com/2012/08/kraftwerk-interview"
            quote: "our roots are more in film music, classical music, German electronic music and in machine-generated rhythm patterns, things like that."
          - type: "critics"
            dimensions: ["sound"]
            title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
            url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
            quote: "Although they were only \"rock\" for an instant, KRAFTWERK ought to be mentioned around about here. For three fascinating albums (and an interesting prequel as ORGANISATION), Ralf Hutter and Florian Schneider jumbled the New York minimalist school (La Monte Young, John Cage, Steve Reich etc) with German avant-electronics (Stockhausen)."
          - type: "critics"
            dimensions: ["sound"]
            title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
            url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
            quote: "Elsewhere, Kraftwerk's avant-classical and psychedelic roots are showing: there's John Cage-like gamelan chimes, clusters of woozy guitar-harmonics and droopy, almost Hawaian-souding bottleneck-glissandos, echo-chamber freak-outs, Beach Boys/barbershop harmonies and even Byrdsy backwards-guitar."
          - type: "critics"
            dimensions: ["rhythm"]
            title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
            url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
            quote: "Despite the fact that its robotic riff is played on a flute rather than a synth, \"Ruckzuck\" prophesises the hypnotic rush of \"Trance Europe Express\""
          - type: "critics"
            dimensions: ["rhythm","sound"]
            title: "Classical Music (Steve Wright): Ranked — the 17 greatest krautrock albums of all time (2025)"
            url: "https://www.classical-music.com/features/recordings/best-krautrock-albums"
            quote: "With Trans-Europe Express, Kraftwerk completed their metamorphosis from experimental krautrockers to sleek electro-pioneers."
          - type: "listening"
            dimensions: ["sound"]
            title: "The Guardian (Marcus Barnes): From Germany to Detroit and back — how Kraftwerk forged an industrial exchange (2020)"
            url: "https://www.theguardian.com/music/2020/may/25/from-germany-to-detroit-and-back-how-kraftwerk-forged-an-industrial-exchange"
            quote: "When Schneider and Ralf Hütter started Kraftwerk in 1970, their influences included several Detroit-based acts including the Stooges, MC5 and, according to later member Karl Bartos, Berry Gordy’s Motown label."
        check:
          verdict: "corrected"
          flags: ["overstated-how"]
          note: "'Played … festivals alongside Can and Faust' overstated Hütter, who says only that they crossed paths at festivals. Hütter calls the early records 'archaeology' and the band dates its career from Autobahn; that does not defeat career scope, since the method formed there, but it is now stated once with its own evidence. The Reynolds item claimed he counts Kraftwerk among krautrock bands without that passage in its quote; split into two items. Rother's 1971 line-up was Schneider, Rother and Dinger without Hütter, but he jammed with Hütter; the text is accurate. Rother's 'very wild, improvised music' added. Barnes' Motown clause is second-hand via Bartos, as the text says. Quotes verbatim after whitespace normalisation (Rother transcript breaks 'Anglo-' / 'American' across a line)."
          changes: "how/howRu: 'played happenings and art events, crossed paths with Can and Faust at festivals'; added the 'archaeology' sentence. Added evidence: Rock Hall 'archaeology' (critics, performance), Rother 'very wild, improvised music' (testimony, performance), Reynolds 'only rock for an instant' (critics, sound). storyRu: dash chain removed; story says krautrock stood 'partly' on free jazz."
          quotes:
            - url: "https://daily.redbullmusicacademy.com/2012/08/kraftwerk-interview"
              quote: "We would cross paths every once in a while, playing festivals."
            - url: "https://rockhall25.wpenginepowered.com/wp-content/uploads/2025/10/Kraftwerk_26746_RNRHF_2021_Highres-11.pdf"
              quote: "Hütter refers to them as “archaeology,” and the group maintains that its career officially started in 1974 with the more pop-oriented album Autobahn."
            - url: "https://www.redbullmusicacademy.com/lectures/michael-rother-tokyo-2014"
              quote: "I jammed with Ralf Hütter but I never played as Kraftwerk with Ralf Hütter"
    legacy:
      cards: ["planet-rock","detroit-techno"]
      text: "Kraftwerk’s main bond with Black music runs the other way. In the Bronx, Afrika Bambaataa played “Trans-Europe Express” in his sets and in 1982, with Arthur Baker, rebuilt it and the beat of “Numbers” on a Roland TR-808 for “Planet Rock”; in Detroit, Juan Atkins and other young Black musicians joined Kraftwerk’s machines to the funk of Parliament-Funkadelic and made techno. This is what Kraftwerk gave, not what they grew from, so it is not a step of their route."
      sources:
        - url: "https://www.theguardian.com/music/2020/may/25/from-germany-to-detroit-and-back-how-kraftwerk-forged-an-industrial-exchange"
          quote: "Kraftwerk’s pioneering approach, using synthesisers and sequenced drum arrangements to evoke robotic or industrial rhythms, became the blueprint for Detroit musicians such as Juan Atkins, who coined the term “techno”."
        - url: "https://www.theguardian.com/music/2020/may/25/from-germany-to-detroit-and-back-how-kraftwerk-forged-an-industrial-exchange"
          quote: "As with Bambaataa’s iconic Planet Rock, produced with Arthur Baker (another Kraftwerk fan), Atkins’ early work draws heavily on Kraftwerk’s tropes and themes."
        - url: "https://exclaim.ca/music/article/kraftwerk-days_of_future_past"
          quote: "the album's regimented hypno-pulses lay the groundwork for electro-funk, ambient, and synth-pop."
      check:
        verdict: "confirmed"
        note: "Matches the planet-rock card (Trans-Europe Express in Bambaataa's sets, the Numbers beat, rebuilt with Arthur Baker on a TR-808) and the detroit-techno card (young Black musicians who loved Parliament-Funkadelic and Kraftwerk). The TR-808 detail rests on the card."
        quotes:
          - url: "https://www.theguardian.com/music/2020/may/25/from-germany-to-detroit-and-back-how-kraftwerk-forged-an-industrial-exchange"
            quote: "As with Bambaataa’s iconic Planet Rock, produced with Arthur Baker (another Kraftwerk fan), Atkins’ early work draws heavily on Kraftwerk’s tropes and themes."
