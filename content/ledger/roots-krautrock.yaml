            quote: "But because of that so many German groups tried to play English music, and it doesn’t work. Because the language is not your mother language; you sing in English and you try to play like English bands, and I don’t think there’s any need for that. But Faust and Can were two examples of groups that didn’t sound at all English."
          - type: "testimony"
