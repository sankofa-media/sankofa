# Perspective rewrite of the hip-hop card (2026-11-15): {male} paragraph on DJ Kool Herc,
# {female} paragraph on Cindy Campbell's 1973 party and Sylvia Robinson's "Rapper's Delight".
# The shared explainer paragraph lost one list of venues and is otherwise unchanged; the shared
# closing is unchanged. Every page below was opened for this ledger. The Spokesman-Review article
# is a Washington Post story (Kim Bellware) and is counted as the Washington Post, once.
- card: hip-hop
  copy: male
  fact: "Clive Campbell grew up among the sound systems of Kingston, Jamaica"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "Clive and Cindy Campbell were born and raised in Jamaica’s capital city, Kingston; from an early age, they were exposed to the island’s sound system culture"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "Growing up in the Trenchtown neighborhood of Kingston, Jamaica, young Clive was immersed in U-Roy, the Skatalites, and other local acts, and saw and heard his first sound systems."}
- card: hip-hop
  copy: male
  fact: "In the Bronx, as DJ Kool Herc, he played parties on his father's sound system"
  sources:
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "Campbell, better known as DJ Kool Herc, had amassed a loyal following using his father’s sound system to DJ at block, house and basement parties."}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "His father, a mechanic, already had a sound system"}
- card: hip-hop
  copy: male
  fact: "He saw dancers wait for the drum breaks in funk and soul records"
  sources:
    - {title: "HISTORY: Hip-hop is born at a teen party in the Bronx", url: "https://www.history.com/this-day-in-history/hip-hop-is-born-at-a-birthday-party-in-the-bronx", quote: "“I was noticing people used to wait for particular parts of the record to dance, maybe [to] do their specialty move.” Those moments tended to occur at the drum breaks"}
    - {title: "Encyclopedia.com (Contemporary Musicians): Kool Herc", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/kool-herc", quote: "waiting for the funky part of the record"}
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "Herc spun primarily funk and soul, as well as the occasional rock record. ... Once the dancers heard that, all they wanted to hear were the breaks."}
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "Herc cued and repeated percussion \"breaks\" in soul and funk music to extend the high-energy moments dancers craved."}
- card: hip-hop
  copy: male
  fact: "He switched between two copies of one record on two turntables to stretch the break, and called it the merry-go-round"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "He called his distinctive approach the merry-go-round ... \"I had two copies of the same record and I went for the yolk, the butter.\""}
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "He called this his \"Merry-Go-Round\" technique, and with it, he could make the breaks last as long as he wanted."}
- card: hip-hop
  copy: male
  fact: "On the microphone he talked over the records, as Jamaican DJs did"
  sources:
    - {title: "HISTORY: Hip-hop is born at a teen party in the Bronx", url: "https://www.history.com/this-day-in-history/hip-hop-is-born-at-a-birthday-party-in-the-bronx", quote: "Herc often emulated the style of Jamaican “selectors” (DJs) by “toasting” (i.e., talking) over the records he spun"}
    - {title: "Rock & Roll Hall of Fame: DJ Kool Herc", url: "https://rockhall.com/inductees/dj-kool-herc/", quote: "Jamaican-born DJ Kool Herc brought sound system traditions from his homeland, “toasting” via microphone over LPs."}
- card: hip-hop
  copy: male
  fact: "The party usually dated as the start was his sister Cindy Campbell's, in August 1973"
  sources:
    - {title: "HISTORY: Hip-hop is born at a teen party in the Bronx", url: "https://www.history.com/this-day-in-history/hip-hop-is-born-at-a-birthday-party-in-the-bronx", quote: "His sister’s party on August 11, however, put him before his biggest crowd ever"}
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "But Cindy and Herc’s party at 1520 Sedgwick Avenue, held 50 years ago, is widely recognized as laying the foundation upon which hip-hop was built."}
- card: hip-hop
  copy: male
  fact: "Grandmaster Flash and Afrika Bambaataa built on his breaks and overshadowed him"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "He called his distinctive approach the merry-go-round and it would influence other pioneering Bronx hip-hop DJs including Grandmaster Flash and Afrika Bambaataa."}
    - {title: "Encyclopedia.com (Contemporary Musicians): Kool Herc", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/kool-herc", quote: "the rise of Grandmaster Flash & the Furious Five and Bambaataa's numerous crews stole much of his stature as a deejay"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "other DJs, like Flash or Jam Master Jay, attained more prominence"}
- card: hip-hop
  copy: male
  fact: "He survived a stabbing and later drug addiction"
  sources:
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "He was stabbed in a club and later battled drug addiction."}
    - {title: "Encyclopedia.com (Contemporary Musicians): Kool Herc", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/kool-herc", quote: "In 1977, Herc was stabbed three times at one of his own events. He survived ... the hard times returned as he struggled with a drug addiction"}
- card: hip-hop
  copy: male
  fact: "In 2023 the Rock & Roll Hall of Fame inducted him for musical influence"
  sources:
    - {title: "Rock & Roll Hall of Fame: DJ Kool Herc", url: "https://rockhall.com/inductees/dj-kool-herc/", quote: "Inducted: 2023 Category: Musical Influence"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo, 2023)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "Further vindication for Herc arrives this November, when he'll be inducted into the Rock & Roll Hall of Fame with a Musical Influence Award."}
- card: hip-hop
  copy: female
  fact: "In August 1973 Cindy Campbell needed money for school clothes"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "On Aug. 11, 1973, high school student Cindy Campbell threw a party in the recreation room of her family’s Bronx apartment building to earn money for new back-to-school clothes."}
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "They were throwing a party to raise funds for Cindy’s back-to-school wardrobe."}
- card: hip-hop
  copy: female
  fact: "She threw the party in her building's recreation room at 1520 Sedgwick Avenue"
  sources:
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "Jamaican immigrant Clive Campbell and his sister Cindy rented their apartment building’s recreation room at 1520 Sedgwick Ave. in the Bronx, New York."}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "The white-walled rec room at 1520 Sedgwick, a complex of 102 units, was usually home to birthday parties and tenant meetings, and Cindy rented it for $25."}
- card: hip-hop
  copy: female
  fact: "She wrote the invitations on index cards"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "Cindy hand wrote invitations on index cards"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "Writing out invites on index cards, she charged 25 cents for girls, double that for the boys."}
- card: hip-hop
  copy: female
  fact: "She charged girls 25 cents and boys 50"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "charged a modest admission fee (25 cents for ladies, 50 cents for \"fellas\")"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "she charged 25 cents for girls, double that for the boys"}
- card: hip-hop
  copy: female
  fact: "She asked her brother, DJ Kool Herc, to play"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "she asked her 18-year-old brother Clive to play the music. Clive, better known as DJ Kool Herc"}
    - {title: "Encyclopedia.com (Contemporary Musicians): Kool Herc", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/kool-herc", quote: "My sister asked me to give a party one day. Actually, she wanted me to play at a party"}
- card: hip-hop
  copy: female
  fact: "The party raised a few hundred dollars"
  sources:
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "When it was over, Cindy ... had raised a few hundred dollars to buy new duds."}
    - {title: "Encyclopedia.com (Contemporary Musicians): Kool Herc", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/kool-herc", quote: "we gave a party and charged about twenty-five cents to come in and made 300 dollars."}
- card: hip-hop
  copy: female
  fact: "The parties soon outgrew the room"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "By the end of 1973, the recreation room couldn't accommodate the size of the crowds attending Herc's parties"}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "The parties continued in the rec room for a bit, but they soon outgrew the space and reemerged in nearby parks"}
- card: hip-hop
  copy: female
  fact: "Sylvia Robinson had sung the 1950s hit \"Love Is Strange\" (as half of Mickey & Sylvia)"
  sources:
    - {title: "Contemporary Musicians: Robinson, Sylvia, via Encyclopedia.com", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/robinson-sylvia", quote: "In 1956 Mickey & Sylvia were signed to RCA and released \"Love Is Strange,\" ... \"Love Is Strange\" was a hit on both rhythm-and-blues and pop charts"}
    - {title: "Kim Bellware, Washington Post: The unlikely origins of Rapper's Delight (via The Spokesman-Review, 2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "Robinson had been a hitmaker in her own right, beginning in the 1950s as half of the duo Mickey and Sylvia. (Their hit single “Love Is Strange” ...)"}
    - {title: "Jay Lustig, NJArts.net (2022)", url: "https://www.njarts.net/95697", quote: "as a member of the duo Mickey & Sylvia (1957’s “Love Is Strange”)"}
- card: hip-hop
  copy: female
  fact: "In 1979 her record company faced bankruptcy"
  sources:
    - {title: "Kim Bellware, Washington Post: The unlikely origins of Rapper's Delight (via The Spokesman-Review, 2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "In 1979, the 43-year-old Robinson and her husband, Joe, were facing bankruptcy after the collapse of their label, All Platinum Records."}
    - {title: "Contemporary Musicians: Robinson, Sylvia, via Encyclopedia.com", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/robinson-sylvia", quote: "The company had already filed for Chapter 11 bankruptcy when Robinson was taken for her birthday to the New York club Harlem World in 1979."}
- card: hip-hop
  copy: female
  fact: "She watched a Harlem club go wild as its DJ talked over the music"
  sources:
    - {title: "Kim Bellware, Washington Post: The unlikely origins of Rapper's Delight (via The Spokesman-Review, 2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "when her niece threw her a birthday party at the Harlem World nightclub, Robinson spotted an opportunity when she heard the DJ, Lovebug Starski, laying down rhymes and catchphrases as he spun dance tracks. “As I was sitting there, the dee jay was playing music and talking over the music, and the kids were going crazy,”"}
    - {title: "Contemporary Musicians: Robinson, Sylvia, via Encyclopedia.com", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/robinson-sylvia", quote: "\"I was sitting there and saw children out on the floor dancing, and this guy was talking over the records. Anything he said made them go crazy,\""}
- card: hip-hop
  copy: female
  fact: "She put together the Sugarhill Gang and produced \"Rapper's Delight\""
  sources:
    - {title: "Jay Lustig, NJArts.net (2022)", url: "https://www.njarts.net/95697", quote: "She put together the Sugarhill Gang trio and produced the single, which became a Top 40 hit."}
    - {title: "Library of Congress, National Recording Registry: Rapper's Delight essay", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RappersDelight.pdf", quote: "Upon its release in 1979, the Sugarhill Gang’s song, produced by Sylvia Robinson"}
    - {title: "Contemporary Musicians: Robinson, Sylvia, via Encyclopedia.com", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/robinson-sylvia", quote: "Jackson was quickly teamed with two other local rappers, high school student Master Gee and flower salesman Wonder Mike, and the Sugarhill Gang was born."}
- card: hip-hop
  copy: female
  fact: "\"Rapper's Delight\" was rap's first hit"
  sources:
    - {title: "Jay Lustig, NJArts.net (2022)", url: "https://www.njarts.net/95697", quote: "Rap didn’t begin with “Rapper’s Delight,” but that was the genre’s first hit single."}
    - {title: "Rolling Stone: Kool Herc and the History of Hip-Hop's First Day (via Yahoo)", url: "https://ca.news.yahoo.com/kool-herc-history-mystery-hip-134136707.html", quote: "Then there's \"Rapper's Delight,\" the 1979 hit by the Sugarhill Gang (based on Chic's \"Good Times\") that was the first rap hit."}
- card: hip-hop
  copy: female
  fact: "It came out on her new Sugar Hill label"
  sources:
    - {title: "Contemporary Musicians: Robinson, Sylvia, via Encyclopedia.com", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/robinson-sylvia", quote: "with Robinson, founded Sugar Hill label and pioneered the idea of recording rap music, 1979"}
    - {title: "Jay Lustig, NJArts.net (2022)", url: "https://www.njarts.net/95697", quote: "Sylvia Robinson, whose Englewood-based Sugar Hill Records released landmark rap singles by the Sugarhill Gang ( “Rapper’s Delight” )"}
    - {title: "Rock & Roll Hall of Fame: Sylvia Robinson", url: "https://rockhall.com/inductees/sylvia-robinson/", quote: "But as the founder and leader of the pioneering Sugar Hill label..."}
- card: hip-hop
  copy: female
  fact: "In 2022 she entered the Rock & Roll Hall of Fame"
  sources:
    - {title: "Rock & Roll Hall of Fame: Sylvia Robinson", url: "https://rockhall.com/inductees/sylvia-robinson/", quote: "Sylvia Robinson Inducted: 2022 Category: Ahmet Ertegun Award"}
    - {title: "Jay Lustig, NJArts.net (2022)", url: "https://www.njarts.net/95697", quote: "will be inducted into the Rock and Roll Hall of Fame, in the Non-Performers category, this year. ... (The Non-Performers category is officially known as the Ahmet Ertegun Award.)"}
