# Ledger for expansion batch c09: one entry per fact used in card bodies and wow lines,
# each with two independent sources and a verbatim quote.
- card: mocambo-lisbon
  fact: "In the 1440s Portuguese ships began landing West African captives at Lagos in the Algarve"
  sources:
    - {title: "Yesenia Barragan, Uncovering Lisbon's Forgotten History of Slavery, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "Sometime between 1441 and 1444 (there is no historical consensus on the exact year) ... the first black captives from West Africa landed on the Portuguese beach of Lagos"}
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal at the time of the trade of enslaved people, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "first arrived in considerable numbers at the Algarvian ports, namely at Lagos in 1444"}
- card: mocambo-lisbon
  fact: "Within decades Lisbon became the main port through which enslaved Africans entered Portugal"
  sources:
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "from the 1480s onward and until the 16th century, Lisbon became the main port of entrance of slaves"}
    - {title: "Yesenia Barragan, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "in 1512 the Portuguese king ordered that all slaves entering Portugal would be required to disembark in Lisbon"}
- card: mocambo-lisbon
  fact: "By the sixteenth century about one Lisboan in ten was Black, enslaved or free (also wow)"
  sources:
    - {title: "Yesenia Barragan, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "Historian John L. Vogt estimates that 10% of Lisbon's population was black (both enslaved and free) during the sixteenth century."}
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "by 1551 Africans represented 10% of the population of the city, counting for 9.950 of its 100.000 inhabitants"}
- card: mocambo-lisbon
  fact: "Black Lisboans founded the brotherhood of Our Lady of the Rosary of Black Men, the first Black brotherhood in Lisbon and believed to be the first in Portugal, for devotion and mutual protection"
  sources:
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "create their own spaces for devotion and social protection, being the Confraria da Nossa Senhora do Rosário dos Homens Pretos (Confraternity of Our Lady of the Rosary of Black Man) the first of such institutions to be established in Portugal"}
    - {title: "Lucilene Reginaldo, Rosários dos pretos, Studia Historica. Historia Moderna 38 (2016)", url: "https://revistas.usal.es/uno/index.php/Studia_Historica/article/download/shhmo2016381123151/14889", quote: "Acredita-se que a primeira irmandade de negros de Lisboa foi instituída na Igreja do Convento de São Domingos. Provavelmente, desde o final do século xv, havia neste convento uma irmandade de N. S. do Rosário"}
- card: mocambo-lisbon
  fact: "As more Africans won their freedom, a Black neighbourhood called Mocambo grew on the north-western edge of Lisbon (also wow)"
  sources:
    - {title: "Yesenia Barragan, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "Over time, a black neighborhood called Mocambo (located in the present-day neighborhood of Santa Catarina) formed in northwestern Lisbon as a place of black refuge."}
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "Initially captives, in time many slaves became freedmen ... led to the creation in Lisbon in 1593 of the Bairro do Mocambo ... Located on the outskirts of Lisbon"}
- card: mocambo-lisbon
  fact: "The name Mocambo comes from an Angolan (Kimbundu) word for a hideout or refuge (also wow)"
  sources:
    - {title: "Yesenia Barragan, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "Mocambo was named after the Kimbundu (an Angolan language) word for 'hideout'"}
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "named after an Angolan word meaning small village or place of refuge"}
- card: mocambo-lisbon
  fact: "Bodies of enslaved Africans were thrown into a pit, remembered in the name Rua do Poço dos Negros, in what was once Mocambo"
  sources:
    - {title: "Yesenia Barragan, Black Perspectives (AAIHS)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "Beneath the pavement of today's Rua do Poço dos Negros (Street of the Blacks' Pit) lies a mass burial pit of enslaved Africans in what used to be Mocambo."}
    - {title: "Aurora Almada e Santos, MANIFEST project (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "King D. Manuel I instructed the construction of the Poço dos Negros (Pit of the Blacks) where the bodies of deceased slaves were thrown"}

- card: cais-do-valongo
  fact: "Over three centuries Brazil took in more enslaved Africans than any other country in the Americas, some four million"
  sources:
    - {title: "Getty: An Antidote for Social Amnesia. The Memory Space of the Cais do Valongo", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "Over the course of more than three centuries, the Portuguese colony of Brazil bought and exploited the largest number of African slaves in the Americas, with some estimates reaching over four million."}
    - {title: "Archaeology magazine (AIA): Rio de Janeiro, Brazil", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "In total, some four million Africans were shipped to Brazil between 1550 and 1888."}
- card: cais-do-valongo
  fact: "In 1811 Rio de Janeiro built the stone Valongo wharf for landing enslaved Africans"
  sources:
    - {title: "UNESCO World Heritage Centre: Valongo Wharf Archaeological Site", url: "https://whc.unesco.org/en/list/1548/", quote: "The wharf started being built in 1811 to facilitate the debarkation of enslaved Africans arriving in Brazil."}
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "Valongo Wharf (Cais do Valongo). Built in 1811, it was the disembark-ation point for at least 500,000 enslaved Africans"}
- card: cais-do-valongo
  fact: "Around the wharf stood warehouses, markets, a quarantine station and a cemetery"
  sources:
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "Valongo was a slave mercantile complex that included, in addition to the wharf, warehouses, markets, a quarantine station, and a cemetery."}
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "auxiliary structures, such as warehouses, quarantine facilities, the lazaretto and the New African cemetery"}
- card: cais-do-valongo
  fact: "Between half a million and a million captives landed there (also wow: up to a million); estimates differ"
  sources:
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "the disembark-ation point for at least 500,000 enslaved Africans"}
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "approximately a million Africans walked on the Cais do Valongo's paved floors"}
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "It is estimated that up to 900,000 African captives entered the Americas via Valongo."}
- card: cais-do-valongo
  fact: "In 1843 the wharf was paved over to welcome Teresa Cristina, bride of Pedro II, and renamed the Empress Wharf (also wow)"
  sources:
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "The pé de moleque was covered in granite blocks in 1843 for the arrival of Empress Teresa Cristina ... The Cais do Valongo was renamed the Cais da Imperatriz (Empress Wharf)"}
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "Empress Wharf (Cais da Imperatriz), so named to commemorate the arrival of Princess Teresa Cristina of the Two Sicilies to marry Emperor Dom Pedro II in 1843. Beneath it was another site, Valongo Wharf"}
- card: cais-do-valongo
  fact: "Later landfill buried the wharves"
  sources:
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "The wharf was completely covered again in 1911 as part of the urban renovation"}
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "Its earthen cover for the past 168 years has enabled this sensitive site to be preserved"}
- card: cais-do-valongo
  fact: "In 2011 building works for the 2016 Olympics uncovered the wharf (also wow)"
  sources:
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "In 2011 an archeological site of global importance resurfaced in Rio de Janeiro ... unearthed during the excavation phase of another urban renewal campaign ... in anticipation of the 2016 Olympic Games"}
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "The modest fragments of Valongo Wharf, which were left exposed to the public after their excavation in 2011"}
- card: cais-do-valongo
  fact: "The excavation was led by archaeologist Tania Andrade Lima"
  sources:
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "Head archaeologist Tania Andrade Lima, of the Museu Nacional/Universidade Federal do Rio de Janeiro"}
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "The archeologist Tania Andrade Lima, who worked on the Cais do Valongo excavation"}
- card: cais-do-valongo
  fact: "The original paving of irregular stones laid on the beach sand was found"
  sources:
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "The lowest of these with floor pavings in pé de moleque style represents the remains of the Valongo Wharf ... built ... directly on the sand of the beach"}
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "Stones of irregular shape and size were arranged in a layer of sand"}
- card: cais-do-valongo
  fact: "Tens of thousands of objects belonging to or taken from the captives were found: charms/amulets, rings, stones used in African worship, cowrie shells (also wow)"
  sources:
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "Tens of thousands of objects were unearthed, many of which were either taken from slaves, or lost or hidden by them. The finds include delicate bracelets, rings woven from vegetable fiber, charms, lumps of amethyst and stones used in African worship, and cowrie shells, then common currency in Africa."}
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "archeologists uncovered thousands of objects that belonged to the African slaves, such as amulets, rings, ceramics, smoking pipes, horns and shells, and copper coins"}
- card: cais-do-valongo
  fact: "In 2017 UNESCO made Valongo a World Heritage Site as the most important physical trace of the arrival of enslaved Africans in the Americas (also wow)"
  sources:
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "Date of Inscription: 2017 ... It is the most important physical trace of the arrival of African slaves on the American continent."}
    - {title: "Getty", url: "https://www.getty.edu/news/an-antidote-for-social-amnesia-the-memory-space-of-the-cais-do-valongo", quote: "in July 2017, UNESCO recognized the Cais do Valongo as a World Heritage Site, acknowledging its importance as a physical trace"}
- card: cais-do-valongo
  fact: "The remains lie open in a city square as an open-air memorial"
  sources:
    - {title: "Archaeology magazine (AIA)", url: "https://archaeology.org/issues/march-april-2013/off-the-grid/rio-de-janeiro-brazil-empress-valongo-wharf/", quote: "A new square displays the exposed remains of the Valongo Wharf and the Empress Wharf as an open-air museum"}
    - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "encompasses the entirety of Jornal do Comércio Square ... fragments of Valongo Wharf, which were left exposed to the public"}

- card: estevanico
  fact: "Estevanico came from Azemmour on Morocco's Atlantic coast (also wow)"
  sources:
    - {title: "Donald E. Chipman, Estevanico, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Estevanico, also spelled Estebanico, was a native of Azamor on the Atlantic coast of Morocco."}
    - {title: "Saudi Aramco World (2002): Esteban of Azemmour and His New World Adventures", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "a man better known in his native Morocco as 'al-Zemmouri' ('the man from Azemmour')"}
    - {title: "Rick Hendricks, Esteban (?–1539), Encyclopedia of Latin American History and Culture", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esteban-1539", quote: "Esteban, a black Arab from the Atlantic coast of Morocco"}
- card: estevanico
  fact: "He was enslaved by Andrés Dorantes and in 1528 landed in Florida with the Narváez expedition"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "became the slave of Andrés Dorantes de Carranza. The African accompanied his master as a member of the Pánfilo de Narváez expedition, approximately 300 men who landed in mid-April 1528 near present-day Tampa Bay."}
    - {title: "Saudi Aramco World (2002)", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "Andres de Dorantes, looking for a personal servant, purchased him in a slave market of Castile. In 1527, Dorantes's royal connections won him a commission and orders to join the expeditionary force of Pámfilo de Narváez ... Esteban, as he was now known, accompanied Dorantes."}
- card: estevanico
  fact: "The survivors built makeshift boats; Estevanico's ran aground on the Texas coast near Galveston (also wow: wreck)"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Narváez chose to slaughter his horses, build five makeshift barges ... After a month at sea, that raft landed on Galveston Island, or perhaps more likely to the west of it."}
    - {title: "Saudi Aramco World (2002)", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "The boat ran aground with such force that it revived the men on it, who were almost dead. They were on the island of Malhado near modern-day Galveston Island, Texas."}
- card: estevanico
  fact: "Local peoples enslaved the castaways; four escaped (Estevanico, Dorantes, Castillo, Cabeza de Vaca) and walked across Texas and northern Mexico"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "They were later captured and enslaved by Coahuiltecan Indians ... In fall 1532 the three men were joined in slavery by Álvar Núñez Cabeza de Vaca ... By early 1535 these four castaways had escaped their captors"}
    - {title: "Rick Hendricks, Encyclopedia of Latin American History and Culture", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esteban-1539", quote: "traveled across Florida, Texas, and northern Mexico from 1527 until 1536 with his owner and Andrés Dorantes, Alvar Núñez Cabeza De Vaca, and Castillo Maldonado"}
    - {title: "Saudi Aramco World (2002)", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "Fifteen of the survivors—including Cabeza de Vaca, Castillo, Dorantes and Esteban—were enslaved and dispersed among several local tribes"}
- card: estevanico
  fact: "Native communities fed and honoured them as healers (also wow)"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Throughout their travels in both Texas and Mexico, the three Spaniards and Estevanico gained fame and sustenance as faith healers among Indians."}
    - {title: "Saudi Aramco World (2002)", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "Esteban, too, soon became a healer, ministering to increasing numbers of patients."}
- card: estevanico
  fact: "In 1536, eight years after landing, they reached Spanish Mexico and Mexico City (also wow: eight years)"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "the four men encountered Spaniards north of San Miguel de Culiacán and then traveled on to Mexico City, arriving there in late July 1536"}
    - {title: "Britannica: Esteban (archived June 2025)", url: "http://web.archive.org/web/20250612211617/https://www.britannica.com/biography/Esteban", quote: "Núñez Cabeza de Vaca and Estebán, a Moorish slave who was the first black man known to have entered Florida—reached Culiacán, Mexico, in 1536"}
- card: estevanico
  fact: "In 1539 Viceroy Antonio de Mendoza sent him as guide and scout for Fray Marcos de Niza, who sought the Seven Cities of Cíbola (also wow)"
  sources:
    - {title: "National Park Service, Coronado National Memorial: Fray Marcos de Niza", url: "https://www.nps.gov/coro/learn/historyculture/fray-marcos-de-niza.htm", quote: "The Viceroy appointed Esteban, an enslaved African who did not have the power that the free Spaniards had to refuse the Viceroy, to guide Fray Marcos."}
    - {title: "Rick Hendricks, Encyclopedia of Latin American History and Culture", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esteban-1539", quote: "In 1539, Esteban guided Franciscan friar Marcos de Niza in his search for the Seven Cities of Cíbola."}
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "By 1539 Dorantes had either sold or loaned Estevanico to Viceroy Antonio de Mendoza, who assigned the African to the company of Fray Marcos de Niza"}
- card: estevanico
  fact: "Ranging far ahead of the friar, he reached the Zuni town of Hawikuh in today's New Mexico and was killed there (also wow)"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Estevanico approached the Zuni pueblo of Hawikuh in western New Mexico where he was killed by numerous arrows fired into his body"}
    - {title: "National Park Service: Fray Marcos de Niza", url: "https://www.nps.gov/coro/learn/historyculture/fray-marcos-de-niza.htm", quote: "They reported that Esteban and many of his Indian companions had been killed at the Zuni pueblo of Háwikuh"}
    - {title: "Rick Hendricks, Encyclopedia of Latin American History and Culture", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esteban-1539", quote: "Esteban and a number of Indian allies ranged far ahead of Niza ... He was killed at Hawikuh, the southernmost of the six Zuni pueblos."}
- card: estevanico
  fact: "The circumstances of his death are debated; Spanish reports blamed his conduct (dispute)"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Coronado, upon reaching Hawikuh one year later in 1540, reported to the viceroy that 'Estevanico's death could be blamed on his cruelties and assaults on Indian women.'"}
    - {title: "National Park Service: Fray Marcos de Niza", url: "https://www.nps.gov/coro/learn/historyculture/fray-marcos-de-niza.htm", quote: "Scholars have been debating what happened next ever since."}
- card: estevanico
  fact: "A year later, in 1540, Coronado's expedition followed the friar's reports north"
  sources:
    - {title: "Rick Hendricks, Encyclopedia of Latin American History and Culture", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esteban-1539", quote: "Niza's report of his travels with Esteban helped persuade Vásquez de Coronado to launch his 1540 expedition"}
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Francisco Vázquez de Coronado, upon reaching Hawikuh one year later in 1540"}
- card: estevanico
  fact: "He was the first African known to cross Texas and one of the first people from the Old World to explore the American Southwest"
  sources:
    - {title: "Donald E. Chipman, Handbook of Texas Online", url: "https://www.tshaonline.org/handbook/entries/estevanico", quote: "Estevanico was assuredly the first African to traverse Texas"}
    - {title: "Saudi Aramco World (2002)", url: "https://archive.aramcoworld.com/issue/200202/esteban.of.azemmour.and.his.new.world.adventures.htm", quote: "He was, in fact, one of the first natives of the Old World to explore the American Southwest."}

- card: john-caesar
  fact: "The First Fleet arrived in January 1788 to found a convict settlement at Sydney Cove/Botany Bay"
  sources:
    - {title: "Chris Cunneen and Mollie Gillen, Caesar, John Black, Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "He embarked on 6 January 1787 in the Alexander, which reached Botany Bay with the First Fleet on 19 January next year."}
    - {title: "City of Parramatta: Bushrangers in Parramatta, part 1", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "From the time of the establishment of the European settlement at Sydney Cove in January 1788, members of the largely convict population attempted to break free"}
- card: john-caesar
  fact: "John Caesar, of African parentage, possibly born on Madagascar, came as a First Fleet convict (also wow)"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "John Black Caesar (c.1763-1796), convict and bushranger of unknown African parentage, may have been born on Madagascar."}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "One of the earliest documented absconders was First Fleet convict John Caesar who came to be known as Black Caesar. Thought to have been born in Madagascar"}
- card: john-caesar
  fact: "In England he was convicted of theft and sentenced to seven years' transportation"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "charged with the theft of some £12 from a dwelling house, he was sentenced to transportation for seven years"}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "he made his way to London where he was convicted of theft and sentenced to seven years transportation to NSW"}
- card: john-caesar
  fact: "The colony was a prison without walls and he escaped repeatedly (also wow)"
  sources:
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "the colony was a prison 'without walls' ... after a series of robberies, convictions and repeated escapes from custody"}
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "Fourteen days later he stole arms and escaped into the bush ... He decamped in July 1794 but was soon back in custody."}
- card: john-caesar
  fact: "In December 1789 he stole a canoe and a gun and escaped; about a month later he gave himself up"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "on 22 December Caesar escaped in a stolen canoe, again taking a gun ... on 31 January 1790 he returned to camp"}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "In December 1789 ... Caesar stole a canoe from Garden Island but gave himself up a month later at Rosehill."}
- card: john-caesar
  fact: "A 1790 death sentence was commuted and he was sent to Norfolk Island"
  sources:
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "In March 1790 he received a death sentence which was commuted to serving his original term in Norfolk Island."}
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "On 4 March Governor Phillip sent Caesar in the Supply to Norfolk Island."}
- card: john-caesar
  fact: "Back in Sydney he escaped again"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "Caesar returned to Port Jackson in the Kitty twelve months later ... He decamped in July 1794"}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "On his return to Sydney, Caesar reverted to his former life of habitual crime, capture and escape."}
- card: john-caesar
  fact: "Late in 1795, in a clash with Aboriginal warriors, he wounded their leader Pemulwuy"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "Late in 1795 he was with a party at Botany Bay that was attacked by Aboriginal warriors led by Pemulwuy, whom Caesar wounded."}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "Briefly hailed as a hero when he was credited with attacking Aboriginal leader Pemulwuy"}
- card: john-caesar
  fact: "In December 1795 he escaped for the last time and lived by raiding settlers' farms"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "The convict escaped from custody for the last time in December 1795 and led a gang of absconders and vagabonds in the Port Jackson area"}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "he soon returned to living by raiding the farms of settlers in the Parramatta district"}
- card: john-caesar
  fact: "Governor John Hunter offered a reward (five gallons of spirits) for his capture"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "on 29 January 1796 Governor Hunter offered a reward of five gallons of spirits for his capture"}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "A reward was posted by Governor Hunter in January 1796 ... Rewards for information leading to the capture of bushrangers usually consisting of a quantity of spirits"}
- card: john-caesar
  fact: "In February 1796 John Wimbow tracked him near Strathfield and shot him; he died some hours later"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "On 15 February Caesar was shot by John Wimbow at Liberty Plains (Strathfield) and died after being carried to Thomas Rose's hut."}
    - {title: "City of Parramatta", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "prompted John Winbow and another man to track Caesar to his hide out near Strathfield. On 14 February 1796 Caesar was shot by Winbow and died several hours later."}
- card: john-caesar
  fact: "He is remembered as Australia's first bushranger (also wow)"
  sources:
    - {title: "Australian Dictionary of Biography", url: "https://adb.anu.edu.au/biography/caesar-john-black-12829", quote: "led a gang of absconders and vagabonds in the Port Jackson area—becoming Australia's first bushranger"}
    - {title: "City of Parramatta: Bushrangers in Parramatta, part 1", url: "https://historyandheritage.cityofparramatta.nsw.gov.au/blog/2017/06/28/bushrangers-in-parramatta-part-1", quote: "One of the earliest documented absconders was First Fleet convict John Caesar who came to be known as Black Caesar"}

- card: tula
  fact: "In 1795 the Netherlands became the Batavian Republic under French revolutionary influence, and France had abolished slavery"
  sources:
    - {title: "DutchNews.nl: Dutch state rehabilitates leader of 1795 revolt against slavery", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "The 1795 revolt was inspired by the declaration of the Batavian Republic in the Netherlands in January that year, an offshoot of the French revolution that received military support from Paris."}
    - {title: "Rijksoverheid: Nederland rehabiliteert Curaçaose verzetsheld Tula", url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/10/05/nederland-rehabiliteert-curacaose-verzetsheld-tula", quote: "Tula wist dat Frankrijk de slavernij had afgeschaft en beredeneerde dat Nederland, dat op dat moment bezet was door de Fransen, ook de slavernij moest afschaffen."}
- card: tula
  fact: "News of the French Revolution and of the revolution in Saint-Domingue/Haiti reached Curaçao and Tula"
  sources:
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "he was well aware of the situation in Haiti, where a slave revolt led by Toussaint had taken over the Colonial regime. He was aware of the French Revolution"}
    - {title: "Rijksoverheid: Speech of State Secretary Van Huffelen (5 October 2023)", url: "https://www.rijksoverheid.nl/documenten/toespraken/2023/10/05/speech-staatssecretaris-alexandra-van-huffelen-ter-gelegenheid-van-de-rehabilitatie-van-tula", quote: "De idealen van de Franse revolutie, die via Frankrijk ook de tot slaaf gemaakte mensen op Haïti bereikten - daarvan vond Tula dat die ook moesten gelden voor hem en de zijnen."}
- card: tula
  fact: "On 17 August 1795 the enslaved people of the Knip (Kenepa) plantation, led by Tula, refused to work"
  sources:
    - {title: "Rijksoverheid: Nederland rehabiliteert Curaçaose verzetsheld Tula", url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/10/05/nederland-rehabiliteert-curacaose-verzetsheld-tula", quote: "Op 17 augustus 1795 legden de tot slaaf gemaakten van plantage Knip onder leiding van Tula het werk neer."}
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "Tula was one of a group of 50 captive slaves who downed tools on the Kenepa plantation on August 17, 1795"}
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "Tula was a slave field worker on plantation 'Knip' ... his slaves, 'refuse to do service (...)', 17 August 1795."}
- card: tula
  fact: "They marched across the island, freeing prisoners on the way"
  sources:
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "marched towards the island's capital, Willemstad, to demand their freedom"}
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "Did I do wrong by releasing 22 of my brothers from their confinement, which they were unjustly thrown into?"}
    - {title: "Rijksoverheid: Speech of State Secretary Van Huffelen", url: "https://www.rijksoverheid.nl/documenten/toespraken/2023/10/05/speech-staatssecretaris-alexandra-van-huffelen-ter-gelegenheid-van-de-rehabilitatie-van-tula", quote: "Deed ik er fout aan om tweeëntwintig broeders uit de gevangenis te bevrijden, waar ze ten onrechte in zaten?"}
- card: tula
  fact: "The colony sent the priest Jacobus Schinck to negotiate; Tula told him they wished no one harm, sought only freedom, and argued that French Black people were freed and Holland was under the French (also wow)"
  sources:
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "Father Jacobus Schinck, who was sent during the revolt in 1795 by the colonial government as a mediator ... 'We have been abused too much, we do not seek to harm anyone, and we are just seeking our freedom. French Negroes gained their freedom, Holland was occupied by the French, then we must be free here'"}
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "'We do not seek to harm anyone, but seek our freedom,' Tula is quoted as saying in records of the event. 'The French black [slaves] have been given their freedom, Holland has been occupied by the French, therefore we should also be free.'"}
- card: tula
  fact: "Tula asked whether all people did not descend from Adam and Eve"
  sources:
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "Sir, Father, do not all the people stem from a common father Adam and Eve?"}
    - {title: "Rijksoverheid: Speech of State Secretary Van Huffelen", url: "https://www.rijksoverheid.nl/documenten/toespraken/2023/10/05/speech-staatssecretaris-alexandra-van-huffelen-ter-gelegenheid-van-de-rehabilitatie-van-tula", quote: "Is niet iedereen op aarde een afstammeling van Adam en Eva?"}
- card: tula
  fact: "The answer was gunfire; troops crushed the revolt and captured its leaders"
  sources:
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "Nine members of the group were killed when they refused to go back to work and the leaders, including Tula, were rounded up"}
    - {title: "Rijksoverheid: Speech of State Secretary Van Huffelen", url: "https://www.rijksoverheid.nl/documenten/toespraken/2023/10/05/speech-staatssecretaris-alexandra-van-huffelen-ter-gelegenheid-van-de-rehabilitatie-van-tula", quote: "Tula probeerde het eerst met woorden, maar die woorden werden beantwoord met geweerschoten."}
- card: tula
  fact: "On 3 October 1795 Tula was tortured and executed and his body displayed as a warning"
  sources:
    - {title: "Rijksoverheid: Nederland rehabiliteert Curaçaose verzetsheld Tula", url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/10/05/nederland-rehabiliteert-curacaose-verzetsheld-tula", quote: "de op 3 oktober 1795 op gruwelijke wijze gemartelde en vermoorde Curaçaose verzetsheld Tula ... Tula werd als afschrikwekkend voorbeeld voor anderen als eerste gemarteld en terechtgesteld en daarna letterlijk tentoongesteld."}
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "the leaders, including Tula, were rounded up and tortured before being executed on October 3."}
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "The execution took place on 3 October 1795 at 'Rif' (the Reef)"}
- card: tula
  fact: "Schinck's notes are almost the only surviving record of Tula's own words"
  sources:
    - {title: "Curaçao History: 1795 Tula", url: "https://www.curacaohistory.com/detail/1795-tula", quote: "Father Jacobus Schinck ... is the only one who had spoken with Tula and whose recordings are preserved in the government archives."}
    - {title: "Rijksoverheid: Speech of State Secretary Van Huffelen", url: "https://www.rijksoverheid.nl/documenten/toespraken/2023/10/05/speech-staatssecretaris-alexandra-van-huffelen-ter-gelegenheid-van-de-rehabilitatie-van-tula", quote: "En ook van Tula's woorden is weinig bewaard gebleven. ... Tegen de pater Jacobus Schinck, sprak hij"}
- card: tula
  fact: "In 2010 Curaçao declared Tula a national hero"
  sources:
    - {title: "Rijksoverheid: Nederland rehabiliteert Curaçaose verzetsheld Tula", url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/10/05/nederland-rehabiliteert-curacaose-verzetsheld-tula", quote: "is Tula in dat jaar door de Curaçaose regering officieel uitgeroepen tot nationale held van Curaçao"}
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "The government of Curacao has recognised Tula as a national hero since 2010"}
- card: tula
  fact: "In October 2023, 228 years after his death, the Dutch government formally rehabilitated Tula (also wow)"
  sources:
    - {title: "Rijksoverheid: Nederland rehabiliteert Curaçaose verzetsheld Tula", url: "https://www.rijksoverheid.nl/actueel/nieuws/2023/10/05/nederland-rehabiliteert-curacaose-verzetsheld-tula", quote: "228 jaar na de dag van zijn dood krijgt Tula eerherstel van de Nederlandse regering."}
    - {title: "DutchNews.nl", url: "https://www.dutchnews.nl/2023/10/dutch-state-rehabilitates-leader-of-1795-revolt-against-slavery", quote: "The leader of a slave uprising on the island of Curacao is being formally rehabilitated by the Dutch government, 228 years after he was put to death."}

- card: carlota-lucumi
  fact: "Among the enslaved Africans of the Matanzas sugar estates were people from Yoruba lands, called Lucumí in Cuba"
  sources:
    - {title: "Eugene Godfried, Carlota: Lukumí/Yoruba Woman Fighter for Liberation (AfroCubaWeb, 2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "We use the denomination lukumi/yoruba when referring to Carlota and others"}
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "Ferminia, Carlota, and their companions Eduardo, a Fula; Narciso and Felipe, Lucumis"}
- card: carlota-lucumi
  fact: "Carlota, a Lucumí woman enslaved at the Triunvirato mill in Matanzas, was a leader of the rising of 5 November 1843 (also wow)"
  sources:
    - {title: "Granma: Celebran acto central por el aniversario 40 de la Operación Carlota (2015)", url: "http://www.granma.cu/cuba/2015-11-05/celebran-acto-central-por-el-aniversario-40-de-la-operacion-carlota", quote: "en honor a la esclava rebelde del ingenio Triunvirato, protagonista de una de las más grandes sublevaciones de esclavos de Cuba, que tuvo lugar el 5 de noviembre de 1843"}
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "after the enslaved Lucumi woman who served as a leader in it ... took control of the Acana sugar mill on November 5, 1843"}
- card: carlota-lucumi
  fact: "Fermina, from the neighbouring Acana estate, had been chained up after an earlier revolt and was then freed; accounts differ how"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "The latter had been led by an enslaved woman named Ferminia, who was promptly captured and imprisoned, then escaped, released, or rescued—depending on the narrative—prior to the Matanzas uprising."}
    - {title: "Eugene Godfried, AfroCubaWeb (2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "Fermina, of the sugar - estate Acana, who was very active in the rebellion of August 2nd, was arrested, chained and locked up. She was liberated by her colleagues in struggle on November 3rd."}
- card: carlota-lucumi
  fact: "The rebels set fire to buildings, killed overseers and moved from estate to estate, freeing others (also wow: across the mills)"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "killing the mayoral and his assistant and setting several buildings on fire before moving on to nearby mills. After setting fires and killing overseers on several other plantations"}
    - {title: "Eugene Godfried, AfroCubaWeb (2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "Together they broke the chains of their brothers and sisters in the areas known as Sabanilla del Encomendador, Guanbana, Santa Ana"}
- card: carlota-lucumi
  fact: "The governor's troops hunted them down; Carlota was killed and her body torn apart"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "the team was captured by Matanzas Governor Antonio Garcia Oña's troops at San Rafael Igenio. Carlota was killed and quartered during the capture"}
    - {title: "Eugene Godfried, AfroCubaWeb (2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "A heavy persecution was unleashed by the powerful Governor's troops hunting the lukum/Yoruba woman Carlota ... The repressive forces tied her to horses sent to run in opposite direction in order to destroy her body completely"}
- card: carlota-lucumi
  fact: "Fermina was shot by a firing squad in March 1844"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "the others—including Ferminia--died in a firing squad in March, 1844"}
    - {title: "Eugene Godfried, AfroCubaWeb (2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "Fermina, por otro lado, fue fusilada en marzo 1844 con cuatro colegas lukumíes/yorubas y tres gangas."}
- card: carlota-lucumi
  fact: "In 1844 the colony unleashed brutal repression against enslaved and free people of colour"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "That same year, during the La Escalera events, slave owners and authorities began a brutal and systematic repression of suspected leaders in various uprisings."}
    - {title: "Eugene Godfried, AfroCubaWeb (2006)", url: "http://www.afrocubaweb.com/carlota.htm", quote: "The year 1844 became known as the 'year of the lashes', because of the many cases of bloody repression against descendants of Africans both enslaved and freed men and women."}
- card: carlota-lucumi
  fact: "Revolutionary Cuba made Carlota a symbol of women's resistance"
  sources:
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "Carlota quickly became the symbol for feminine strength against a brutal system"}
    - {title: "Tania Díaz Castro, La historia censurada de la esclava Carlota (CubaNet, 2017)", url: "https://www.cubanet.org/la-historia-censurada-de-la-esclava-carlota/", quote: "Los de hoy, la han declarado 'patrimonio cubano de rebeldía contra la opresión', 'símbolo de la mujer cubana revolucionaria'"}
- card: carlota-lucumi
  fact: "Cuba's military mission to Angola in the mid-1970s was named Operation Carlota in her honour (also wow: more than 130 years later)"
  sources:
    - {title: "Granma (2015)", url: "http://www.granma.cu/cuba/2015-11-05/celebran-acto-central-por-el-aniversario-40-de-la-operacion-carlota", quote: "La misión militar cubana en Angola se denominó Operación Carlota, en honor a la esclava rebelde del ingenio Triunvirato ... 40 aniversario del inicio de la Operación Carlota"}
    - {title: "Myra Ann Houser, Avenging Carlota in Africa (2015)", url: "https://web.archive.org/web/20240606093414/https://scholarlycommons.obu.edu/cgi/viewcontent.cgi?article=1041&context=articles", quote: "Cuba named its 1974 military mission in Angola 'Operation Carlota' after the enslaved Lucumi woman who served as a leader in it"}

- card: black-seminoles
  fact: "In Florida free Black people and people escaping slavery found refuge among and allied with the Seminoles, becoming known as Black Seminoles or Seminole Maroons (also wow)"
  sources:
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "The Black Seminoles were a group of free blacks and runaway slaves (also known as maroons) who allied with the Seminole Indians in Florida"}
    - {title: "Kevin Mulroy, John Horse (ca. 1812–1882), BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "John Horse ... was the dominant personality in Seminole Maroon affairs for half a century ... by 1826 he was living in his owner's village near Tampa Bay, Florida"}
- card: black-seminoles
  fact: "When the US set out to remove the Seminoles west, Black Seminoles fought the US Army in the Second Seminole War, 1835–1842 (also wow)"
  sources:
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "During the Second Seminole War (1835–1842), they fiercely fought against the U.S. Army"}
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "During the Second Seminole War, 1835-42, he initially led Maroons against U.S. forces in Florida"}
- card: black-seminoles
  fact: "John Horse led Maroon fighters in Florida, then in 1837 accepted removal to Indian Territory (Oklahoma) on a promise of freedom"
  sources:
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "offered the promise of freedom, he agreed to surrender and relocate west with the Seminoles in March 1837"}
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "After the Second Seminole War (1835-1842), most Seminoles and Black Seminoles were resettled in Oklahoma"}
- card: black-seminoles
  fact: "In Indian Territory their freedom was fragile and they feared re-enslavement"
  sources:
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "Fearing that his family, and his fellow Maroons would be reenslaved"}
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "many Black Seminoles were resettled in Oklahoma by 1845, but they faced subjugation by the Creek Indians"}
    - {title: "Texas Standard (2023)", url: "https://texasstandard.org/stories/black-seminoles-texas-mexico-mascogos-cuisine-sofkee-tacos-texas/", quote: "Mascogos are descendants of Black Seminoles who escaped from slavery in the mid-1800s"}
- card: black-seminoles
  fact: "In 1849 John Horse led his people with Seminole allies into Mexico (also wow)"
  sources:
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "Horse entered into an alliance with disaffected Seminoles and left Indian Territory in November 1849 for northern Mexico."}
    - {title: "Texas Standard (2023)", url: "https://texasstandard.org/stories/black-seminoles-texas-mexico-mascogos-cuisine-sofkee-tacos-texas/", quote: "Black Seminole leader John Horse and about 180 Black Seminoles staged a mass escape in 1849 to northern Mexico"}
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "In 1849, many Black Seminoles relocated to Coahuila, Mexico, and were known as Mascogos."}
- card: black-seminoles
  fact: "Mexico gave them land at El Nacimiento in Coahuila in exchange for guarding the frontier, and called them Mascogos (also wow)"
  sources:
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "Naming Horse's followers Mascogos, the Mexicans in 1852 gave the Maroons, Seminoles, and a band of Southern Kickapoos separate land grants at Nacimiento to establish military colonies. In exchange for land, tools, and livestock, the immigrants agreed to fight against Apache and Comanche raiders."}
    - {title: "Texas Standard (2023)", url: "https://texasstandard.org/stories/black-seminoles-texas-mexico-mascogos-cuisine-sofkee-tacos-texas/", quote: "The Mexican government welcomed the Seminole allies as border guards on the frontier, and they settled in Nacimiento, Coahuila."}
- card: black-seminoles
  fact: "Some later returned to Texas; descendants live today in Texas, Oklahoma and Coahuila, including at El Nacimiento (also wow)"
  sources:
    - {title: "Britannica: Black Seminoles", url: "http://web.archive.org/web/20260805040057/https://www.britannica.com/topic/Black-Seminoles", quote: "Today, descendants of the Black Seminoles live in small communities in Texas, Oklahoma, and Mexico."}
    - {title: "Kevin Mulroy, BlackPast.org", url: "https://www.blackpast.org/?p=62190", quote: "During the summer of 1870, John Horse and many of the Mascogos returned to the United States and settled near Fort Duncan, Texas."}
    - {title: "Texas Standard (2023)", url: "https://texasstandard.org/stories/black-seminoles-texas-mexico-mascogos-cuisine-sofkee-tacos-texas/", quote: "Black Seminoles here in Nacimiento are really kind of holding onto their roots"}

- card: saamaka
  fact: "The Saamaka (Saramaka) are one of six Maroon peoples of Suriname"
  sources:
    - {title: "Inter-American Court of Human Rights: Saramaka People v. Suriname, Judgment of 28 November 2007", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "the Saramaka people are one of the six distinct Maroon groups in Suriname"}
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "the people formerly known as 'Saramaka' began calling themselves, in their official documents, 'Saamaka' ... Maroon Peoples such as the Saamaka (and five similar groups)"}
- card: saamaka
  fact: "Their ancestors were enslaved Africans who escaped into the interior and built autonomous communities (also wow: freed themselves)"
  sources:
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "whose ancestors were African slaves forcibly taken to Suriname during the European colonization in the 17th century. Their ancestors escaped to the interior regions of the country where they established autonomous communities."}
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "the Saamaka People - some 55,000 descendants of self-liberated African slaves"}
- card: saamaka
  fact: "In 1762 the Dutch signed a peace treaty with the Saamaka (also wow)"
  sources:
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "Their rebel ancestors fought for nearly a century and finally signed a peace treaty with the Dutch colonizers that granted them their freedom and territory in 1762."}
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "the history behind the Treaty of 1762 between the Dutch crown and the Saramaka people"}
- card: saamaka
  fact: "They live in villages along the (Upper) Suriname River and govern themselves by their own customary law"
  sources:
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "Saamakas managed to organize their more than sixty villages strung out along the Suriname River ... they regulate themselves, at least partially, by their own norms, customs, and/or traditions"}
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "on behalf of the Saramaka people of the Upper Suriname River ... regulating themselves, at least partially, by their own norms, customs, and/or traditions"}
- card: saamaka
  fact: "In the 1990s the state granted logging and mining concessions on Saamaka land"
  sources:
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "during the 1990s, Saamakas suddenly found their territory invaded by Chinese and other multinational logging and mining companies which were extracting resources with the explicit permission of the State"}
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "degradation caused by foreign companies that have received mining concessions in the area ... the alleged environmental and social impacts of logging concessions"}
- card: saamaka
  fact: "Silvi Adjako, a Saamaka farmer, had her gardens/farms destroyed by a foreign logging company"
  sources:
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "Silvi Adjako (pictured here), whose gardens were destroyed by the Chinese loggers"}
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "Silvi Adjako ... is a member of the Matjau lö (clan), and testified regarding the alleged destruction of her farms by a foreign logging company"}
- card: saamaka
  fact: "In 2000 Saamaka leaders petitioned the Inter-American Commission on Human Rights"
  sources:
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "petition No. 12.338 presented to the Secretariat of the Commission on October 27, 2000 by the Association of Saramaka Authorities ... and twelve Saramaka captains"}
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "In 2000, they petitioned the Inter-American Commission for Human Rights, eventually leading to their 2007 victory before the Court."}
- card: saamaka
  fact: "On 28 November 2007 the Inter-American Court ruled Suriname had violated their rights and ordered it to delimit, demarcate and grant collective title to their territory, per customary law and after consultation (also wow)"
  sources:
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "Judgment of November 28, 2007 ... The State shall delimit, demarcate, and grant collective title over the territory of the members of the Saramaka people, in accordance with their customary laws, and through previous, effective and fully informed consultations with the Saramaka people"}
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "The Judgment also concluded that the State had violated Articles 3 (Right to Juridical Personality), 21 (Right to Property), and 25 (Right to Judicial Protection)"}
- card: saamaka
  fact: "The judgment treated a Maroon people like an Indigenous people, with collective rights to ancestral land"
  sources:
    - {title: "Richard Price, Cultural Survival", url: "https://www.culturalsurvival.org/news/saramaka-people-v-suriname-human-rights-victory-and-its-messy-aftermath", quote: "Henceforth, Saamakas, and other Maroons throughout the Americas, would be treated as equivalent to Indigenous Peoples in international law"}
    - {title: "Inter-American Court of Human Rights", url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf", quote: "group with a special relationship with its ancestral territory"}

- card: solitude
  fact: "In 1794 revolutionary France abolished slavery, proclaimed in Guadeloupe in June 1794"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage: Solitude", url: "https://memoire-esclavage.org/tcpdf/403", quote: "Le 2 juin 1794, l'abolition de l'esclavage est décrétée à la Guadeloupe"}
    - {title: "Ville de Paris: Solitude, une statue emblématique", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "À la première abolition de l'esclavagisme, annoncée sur place en juin 1794"}
- card: solitude
  fact: "In 1802 Napoleon Bonaparte sent General Richepanse with troops to restore colonial order and slavery in Guadeloupe (also wow)"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "en 1802 le général Richepanse est envoyé par Bonaparte pour rétablir l'ordre colonial dans l'île"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "En mai 1802, les troupes françaises débarquent en Guadeloupe sur ordre de Bonaparte pour rétablir l'esclavagisme."}
    - {title: "Outremers360 (2022)", url: "https://outremers360.com/bassin-atlantique-appli/histoire-il-y-a-220-ans-etait-suppliciee-la-mulatresse-solitude-figure-emblematique-de-la-resistance-a-lesclavage-en-guadeloupe", quote: "En 1802, Napoléon Bonaparte étant au pouvoir, il décide de rétablir l'esclavage ... sous les ordres du général Richepanse"}
- card: solitude
  fact: "In May 1802 Louis Delgrès led free men of colour and former slaves in armed resistance"
  sources:
    - {title: "Outremers360 (2022)", url: "https://outremers360.com/bassin-atlantique-appli/histoire-il-y-a-220-ans-etait-suppliciee-la-mulatresse-solitude-figure-emblematique-de-la-resistance-a-lesclavage-en-guadeloupe", quote: "c'est sans compter sur la volonté des « libres de couleur » et des anciens esclaves de demeurer sans chaînes. Ils prennent les armes sous la direction du colonel martiniquais Louis Delgrès"}
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "s'oppose aux officiers libres noirs et mulâtres, menés par le Martiniquais Louis Delgrès"}
- card: solitude
  fact: "Solitude took up arms while a few months pregnant (also wow)"
  sources:
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Parmi eux, de nombreuses femmes, dont Solitude, enceinte de quelques mois."}
    - {title: "Outremers360 (2022)", url: "https://outremers360.com/bassin-atlantique-appli/histoire-il-y-a-220-ans-etait-suppliciee-la-mulatresse-solitude-figure-emblematique-de-la-resistance-a-lesclavage-en-guadeloupe", quote: "bien qu'enceinte de quelques mois, Solitude rejoint les troupes de Delgrès et qu'elle combat même à ses côtés"}
- card: solitude
  fact: "She was captured around 23 May 1802 (also wow)"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "avant d'être faite prisonnière lors de l'attaque du camp Palerme par le général Gobert, le 23 mai 1802"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Solitude est faite prisonnière vers le 23 mai 1802."}
- card: solitude
  fact: "Sentenced to death, she was executed on 29 November 1802, the day after giving birth (also wow)"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "Arrêtée, elle est condamnée alors qu'elle est enceinte. Lacour indique qu'elle ne sera « suppliciée » que le 29 novembre 1802, le lendemain de son accouchement."}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Elle est condamnée à mort et suppliciée le 29 novembre de la même année, le lendemain de son accouchement."}
- card: solitude
  fact: "Her story survived through oral testimony recorded by the 19th-century historian Auguste Lacour"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "Son histoire s'est transmise à travers un témoignage oral repris l'historien Auguste Lacour dans son Histoire de la Guadeloupe en 1858"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Au XIX e siècle, le seul ouvrage ancien faisant référence à Solitude est intitulé Histoire de la Guadeloupe, d'Auguste Lacour (1805-1869), paru en 1855."}
- card: solitude
  fact: "André Schwarz-Bart's 1972 novel La Mulâtresse Solitude gave her an imagined biography and brought her out of oblivion"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "l'écrivain André Schwartz-Bart fera un roman, La mulâtresse Solitude, paru en 1972, qui la fera revivre en lui inventant une biographie"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Il faudra attendre 1972 et un roman d'André Schwarz-Bart, La Mulâtresse Solitude, pour que la résistante guadeloupéenne sorte de l'oubli."}
    - {title: "Outremers360 (2022)", url: "https://outremers360.com/bassin-atlantique-appli/histoire-il-y-a-220-ans-etait-suppliciee-la-mulatresse-solitude-figure-emblematique-de-la-resistance-a-lesclavage-en-guadeloupe", quote: "De sa véritable histoire, on sait finalement peu de choses, nombre d'éléments ayant été romancés ou extrapolés, notamment par l'ouvrage à succès d'André Schwarz-Bart"}
- card: solitude
  fact: "In 1999 Les Abymes in Guadeloupe raised a statue to her"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "Depuis mai 1999, une statue lui est dédiée dans la commune des Abymes en Guadeloupe"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Une statue de cette dernière est d'ailleurs inaugurée par la commune des Abymes en Guadeloupe."}
- card: solitude
  fact: "In 2020 Paris named a garden after her"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/tcpdf/403", quote: "le 26 septembre 2020, la mairie de Paris a inauguré un jardin portant son nom dans le 17ème arrondissement"}
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "dans le jardin du 17 e qui porte déjà son nom, renommé et inauguré en septembre 2020"}
- card: solitude
  fact: "On 10 May 2022 her bronze statue was unveiled in Paris, the first statue of a Black woman in the city (also wow)"
  sources:
    - {title: "Ville de Paris", url: "https://www.paris.fr/pages/un-jardin-en-hommage-a-la-resistance-contre-l-esclavagisme-10901", quote: "Avec cette statue, inaugurée le 10 mai 2022 ... C'est aussi la première statue d'une femme noire dans Paris."}
    - {title: "Outremers360 (2022)", url: "https://outremers360.com/bassin-atlantique-appli/histoire-il-y-a-220-ans-etait-suppliciee-la-mulatresse-solitude-figure-emblematique-de-la-resistance-a-lesclavage-en-guadeloupe", quote: "C'est la première femme noire à avoir une statue à Paris ... Le monument a été inauguré cette année, le 10 mai"}

- card: sarah-ann-gill
  fact: "Barbadian planters saw Methodist missionaries, who preached equality before God, as allies of the British anti-slavery campaign"
  sources:
    - {title: "Bridwell Library, SMU: An Unfinished Bible Translation from Barbados", url: "https://bridwell.omeka.net/exhibits/show/earlymethodists/authorsreaders/shrewsbury", quote: "he did preach the equality of all humanity before God. This angered the local slave owners, who feared a rebellion."}
    - {title: "Phyllis Haigh, Dissenting Missionaries, Public Opinion and the British Press (Sheffield Hallam University, 2020)", url: "https://shura.shu.ac.uk/27167/1/Haigh_2020_MPhil_DissentingMissionariesPublic.pdf", quote: "anti-missionary hostilities in Barbados because of the white islanders' belief that Shrewsbury was in league with the British abolitionists"}
    - {title: "Barbados Advocate: Sarah Ann Gill's Pastor lecture (Alan Cobley), archived", url: "https://web.archive.org/web/20150207093957/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=17571", quote: "local Whites blamed abolitionists and missionaries on spreading a message of equality before God among the slaves in the region"}
- card: sarah-ann-gill
  fact: "Sarah Ann Gill, born 1795, was a free woman of colour and a devout Methodist in Bridgetown (also wow: woman of colour)"
  sources:
    - {title: "Parliament of Barbados, Museum of Parliament", url: "https://www.barbadosparliament.com/page_content/show_content/61", quote: "The Right Excellent Sarah Ann Gill (1795–1866)"}
    - {title: "Caribbean National Weekly (2022)", url: "https://www.caribbeannationalweekly.com/posts/sarah-ann-gill-held-firm-to-her-beliefs", quote: "Born February 16, 1795, Gill was a social and religious leader in Barbados during the era of slavery. She was born to a black mother and a white father"}
    - {title: "Barbados Advocate: Heroes on Stage, archived", url: "https://web.archive.org/web/20120226125006/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=9818", quote: "Ann Gill, a free colored woman in Barbados, emerged during the 1820s as a charismatic leader in the fledgling Methodist church."}
- card: sarah-ann-gill
  fact: "By 28 she was a widow (also wow: young widow)"
  sources:
    - {title: "Barbados Advocate: Gill a trailblazer, archived", url: "https://web.archive.org/web/20120226124953/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=10024", quote: "He stressed that the 28-year-old widow struck a decisive blow for religious tolerance in Barbados"}
    - {title: "Caribbean National Weekly (2022)", url: "https://www.caribbeannationalweekly.com/posts/sarah-ann-gill-held-firm-to-her-beliefs", quote: "Sarah married Alexander George Gill ... and inherited property from him at his death when she was 28 years old."}
- card: sarah-ann-gill
  fact: "In October 1823 a mob of white slave owners destroyed the Methodist chapel in Bridgetown (also wow)"
  sources:
    - {title: "Bridwell Library, SMU", url: "https://bridwell.omeka.net/exhibits/show/earlymethodists/authorsreaders/shrewsbury", quote: "On October 20, 1823, a mob of slave owners destroyed Shrewsbury's chapel and injured several members of the congregation"}
    - {title: "Barbados Advocate: Heroes on Stage, archived", url: "https://web.archive.org/web/20120226125006/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=9818", quote: "In 1823, a mob of prominent members of the white community destroyed with fire the Methodist Chapel in Bridgetown."}
    - {title: "Phyllis Haigh (2020)", url: "https://shura.shu.ac.uk/27167/1/Haigh_2020_MPhil_DissentingMissionariesPublic.pdf", quote: "This escalated to such a level that Shrewsbury's Bridgetown chapel was completely destroyed"}
- card: sarah-ann-gill
  fact: "The missionary William Shrewsbury fled with his wife to St Vincent"
  sources:
    - {title: "Bridwell Library, SMU", url: "https://bridwell.omeka.net/exhibits/show/earlymethodists/authorsreaders/shrewsbury", quote: "Shrewsbury and his wife were forced to flee by boat to the island of St. Vincent."}
    - {title: "Barbados Advocate: Sarah Ann Gill's Pastor lecture, archived", url: "https://web.archive.org/web/20150207093957/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=17571", quote: "after he was forced to leave Barbados for St. Vincent and later, South Africa because of the serious threat to his wife and unborn child from angry mobs"}
- card: sarah-ann-gill
  fact: "Gill opened her own house for worship and kept services going (also wow)"
  sources:
    - {title: "Caribbean National Weekly (2022)", url: "https://www.caribbeannationalweekly.com/posts/sarah-ann-gill-held-firm-to-her-beliefs", quote: "she opened her home as a church and kept the faith going ... took the extraordinary step of continuing to hold services in her home"}
    - {title: "Barbados Advocate: Sarah Ann Gill celebrated in song, archived", url: "https://web.archive.org/web/20120226124958/http://www.barbadosadvocate.com/newsitem.asp?more=lifestyle&NewsID=10045", quote: "Mrs Gill, a devout Methodist, continued to practice her chosen faith despite constant and severe persecution. She was taken before the law courts for holding illegal meetings and received threats to burn her house."}
- card: sarah-ann-gill
  fact: "She was repeatedly threatened (also wow)"
  sources:
    - {title: "Caribbean National Weekly (2022)", url: "https://www.caribbeannationalweekly.com/posts/sarah-ann-gill-held-firm-to-her-beliefs", quote: "Sarah Ann was persecuted continuously for one year with threats of grievous bodily harm"}
    - {title: "Barbados Advocate: Sarah Ann Gill celebrated in song, archived", url: "https://web.archive.org/web/20120226124958/http://www.barbadosadvocate.com/newsitem.asp?more=lifestyle&NewsID=10045", quote: "received threats to burn her house"}
- card: sarah-ann-gill
  fact: "She was brought before the authorities for holding illegal meetings and went on holding services (also wow: prosecution)"
  sources:
    - {title: "Barbados Advocate: Sarah Ann Gill celebrated in song, archived", url: "https://web.archive.org/web/20120226124958/http://www.barbadosadvocate.com/newsitem.asp?more=lifestyle&NewsID=10045", quote: "She was taken before the law courts for holding illegal meetings"}
    - {title: "Caribbean National Weekly (2022)", url: "https://www.caribbeannationalweekly.com/posts/sarah-ann-gill-held-firm-to-her-beliefs", quote: "questioned by magistrates about supposedly having guns and ammunition in her home, and finally, prosecuted by the House of Assembly. On each occasion ... she not only defended herself and defied the authorities, but also took the extraordinary step of continuing to hold services in her home."}
- card: sarah-ann-gill
  fact: "In 1998 Barbados chose ten National Heroes and she was the only woman among them (also wow)"
  sources:
    - {title: "Parliament of Barbados, Museum of Parliament", url: "https://www.barbadosparliament.com/page_content/show_content/61", quote: "In 1998, Barbados chose ten National Heroes. ... The Right Excellent Sarah Ann Gill (1795–1866)"}
    - {title: "Barbados Advocate: Gill a trailblazer, archived", url: "https://web.archive.org/web/20120226124953/http://www.barbadosadvocate.com/newsitem.asp?more=local&NewsID=10024", quote: "THIS country's lone female national hero, the Right Excellent Sarah Ann Gill ... She is truly deserving of the honour bestowed upon her in 1998 by the Barbados Government"}
