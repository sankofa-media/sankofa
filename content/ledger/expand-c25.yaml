    - {title: "Canadian Press, CBC News (2016)", url: "https://www.cbc.ca/1.3763564", quote: "Marley paraphrased those words in 1980’s Redemption Song."}
- card: redemption-song
  fact: "Garvey, a Jamaican, founded the UNIA in 1914 to promote Black pride and unity"
  sources:
    - {title: "Encyclopaedia Britannica: Marcus Garvey (archived 2024)", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "he founded (August 1, 1914) the Universal Negro Improvement and Conservation Association and African Communities League, usually called the Universal Negro Improvement Association (UNIA) ... his gospel of Black pride"}
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "Marcus Garvey was a Jamaican civil rights leader ... emphasized Black pride and called on the African diaspora to unite in Africa ... Garvey founded the Universal Negro Improvement Association (UNIA) in 1914."}
    - {title: "Canadian Press, CBC News (2016)", url: "https://www.cbc.ca/1.3763564", quote: "Marcus Garvey founded the Universal Negro Improvement Association in 1914"}
- card: redemption-song
  fact: "UNIA branches spread far beyond Jamaica"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "UNIA halls quickly opened around the world, including in Canada."}
    - {title: "Encyclopaedia Britannica: Marcus Garvey (archived 2024)", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "Garvey went to the United States (1916) and soon established branches of the UNIA in Harlem and the other principal ghettos of the North."}
- card: redemption-song
  fact: "In 1918 a UNIA branch opened at Glace Bay, Cape Breton, Nova Scotia"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "In 1918, the migrants set up one of Canada’s first UNIA halls in Glace Bay, Nova Scotia."}
    - {title: "Canadian Press, CBC News (2016)", url: "https://www.cbc.ca/1.3763564", quote: "The UNIA location established in Glace Bay in 1918 is the only one left in Canada."}
- card: redemption-song
  fact: "By 1937 the movement had dwindled and Garvey had been deported from the US"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "By the 1930s, Garvey’s movement had dwindled and he had been deported from the United States."}
    - {title: "Encyclopaedia Britannica: Marcus Garvey (archived 2024)", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "in 1927 his sentence was commuted by U.S. Pres. Calvin Coolidge, and he was deported as an undesirable alien. He was never able to revive the movement abroad"}
- card: redemption-song
  fact: "On 1 October 1937, on a speaking tour, he spoke to Sydney's UNIA members at Menelik Hall (wow and body)"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "In 1937, he set out on what would be his final speaking tour. ... On 1 October, Sydney’s mayor introduced him to a full house at Menelik Hall."}
    - {title: "Paul H. Williams, The Gleaner (2025)", url: "https://jamaica-gleaner.com/article/news/20251016/marcus-garvey-greatest-black-man-ever", quote: "On his last night in Canada, October 1, 1937, in Sydney, Nova Scotia, he gave a speech"}
    - {title: "University of Ottawa, Black Canadian History Exhibit: Menelik Hall", url: "https://omeka.uottawa.ca/mathieu-black-canadian-history-exhibit/items/show/39", quote: "In the hall Marcus Garvey gave his \"the work that has been done\" speech in 1937 to members of the Sydney branch of the UNIA."}
    - {title: "Toronto Public Library blog (2014)", url: "https://blogs.tpl.ca/arts_culture/2014/02/bob-marleys-redemption-song-the-canadian-connection/", quote: "a speech that Marcus Garvey gave in Menelik Hall in Whitney Pier / Sydney ... Nova Scotia October 1937"}
- card: redemption-song
  fact: "Towards the end he spoke the quoted lines on mental slavery (wow and body)"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "Towards the end, he spoke these lines: We are going to emancipate ourselves from mental slavery because whilst others might free the body, none but ourselves can free the mind."}
    - {title: "Toronto Public Library blog (2014)", url: "https://blogs.tpl.ca/arts_culture/2014/02/bob-marleys-redemption-song-the-canadian-connection/", quote: "“We are going to emancipate ourselves from mental slavery because whilst others might free the body, none but ourselves can free the mind."}
    - {title: "Canadian Press, CBC News (2016)", url: "https://www.cbc.ca/1.3763564", quote: "“We are going to emancipate ourselves from mental slavery … none but ourselves can free the mind.”"}
- card: redemption-song
  fact: "Garvey died in London in 1940"
  sources:
    - {title: "Encyclopaedia Britannica: Marcus Garvey (archived 2024)", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "Marcus Garvey (born August 17, 1887, St. Ann’s Bay, Jamaica—died June 10, 1940, London"}
    - {title: "Paul H. Williams, The Gleaner (2025)", url: "https://jamaica-gleaner.com/article/news/20251016/marcus-garvey-greatest-black-man-ever", quote: "Marcus Mosiah Garvey died on June 10, 1940 at age 52. He was buried in St Mary’s Catholic Cemetery in London."}
- card: redemption-song
  fact: "Marley followed the Rastafari faith"
  sources:
    - {title: "Encyclopaedia Britannica: Bob Marley (archived 2024)", url: "https://www.britannica.com/biography/Bob-Marley", quote: "A revolution in Jamaican identity was also forged through the Wailers’ Rastafari faith"}
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "[Marley] converted to Rastafarianism and often used language from Garvey"}
- card: redemption-song
  fact: "Marley turned the passage into the song's central lyric"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "there is no question that Marley turned portions of that speech into the central lyric of “Redemption Song”: “Emancipate yourselves from mental slavery/None but ourselves can free our minds.”"}
    - {title: "Canadian Press, CBC News (2016)", url: "https://www.cbc.ca/1.3763564", quote: "Marley paraphrased those words in 1980’s Redemption Song."}
    - {title: "Paul H. Williams, The Gleaner (2025)", url: "https://jamaica-gleaner.com/article/news/20251016/marcus-garvey-greatest-black-man-ever", quote: "They were introduced to the world by Bob Marley in Redemption Song."}
- card: moolaade
  fact: "Moolaade is a 2004 film written and directed by Ousmane Sembene of Senegal"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "Réalisé par : Ousmane SEMBENE Année de production : 2004 Pays : Sénégal ... Ousmane SEMBENE Scénario / Dialogues"}
    - {title: "Encyclopaedia Britannica: Ousmane Sembène (archived 2024)", url: "https://www.britannica.com/biography/Ousmane-Sembene", quote: "Moolaadé (2004; “Protection”) ... [Ousmane Sembène] was a Senegalese w[riter and film director]"}
- card: moolaade
  fact: "It is about the cutting of girls in a village, called purification"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "quatre fillettes se sauvent de la Purification = Excision"}
    - {title: "Rotten Tomatoes: Moolaadé synopsis", url: "https://www.rottentomatoes.com/m/moolaade", quote: "For fear of enduring genital mutilation, a group of girls flee their own \"purification\" ceremony"}
    - {title: "Claske Dijkema, Irénées (2008)", url: "http://www.irenees.net/bdf_fiche-documentation-579_en.html", quote: "An African film about ending excision in a small village"}
- card: moolaade
  fact: "Its title means protection"
  sources:
    - {title: "Encyclopaedia Britannica: Ousmane Sembène (archived 2024)", url: "https://www.britannica.com/biography/Ousmane-Sembene", quote: "Moolaadé (2004; “Protection”)"}
    - {title: "Claske Dijkema, Irénées (2008)", url: "http://www.irenees.net/bdf_fiche-documentation-579_en.html", quote: "The four other girls seek « magical protection » (moolaadé)"}
- card: moolaade
  fact: "Colle, herself cut, had kept her only daughter from the ritual"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "Collé Gallo Ardo Sy, mère, excisée avait soustrait son unique fille de la Purification."}
    - {title: "Claske Dijkema, Irénées (2008)", url: "http://www.irenees.net/bdf_fiche-documentation-579_en.html", quote: "[paraphrase] She refuses to have her daughter circumcised"}
- card: moolaade
  fact: "Four girls flee the ceremony and ask Colle for moolaade; she grants it (wow and body)"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "quatre fillettes se sauvent de la Purification = Excision, et demandent à Collé Ardo Sy le Moolaadé"}
    - {title: "Claske Dijkema, Irénées (2008)", url: "http://www.irenees.net/bdf_fiche-documentation-579_en.html", quote: "The four other girls seek « magical protection » (moolaadé) by a woman (Colle)"}
    - {title: "Rotten Tomatoes: Moolaadé synopsis", url: "https://www.rottentomatoes.com/m/moolaade", quote: "Collé casts a spell to protect the girls"}
- card: moolaade
  fact: "The village is thrown into turmoil and the elders are outraged"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "Le village est en ébullition: deux valeurs s’affrontent: droit d’asile et l’antique tradition d’exciser les fillettes."}
    - {title: "Rotten Tomatoes: Moolaadé synopsis", url: "https://www.rottentomatoes.com/m/moolaade", quote: "Collé casts a spell to protect the girls, which causes much consternation among the village elders."}
- card: moolaade
  fact: "In retaliation the men take away the women's radios"
  sources:
    - {title: "Rotten Tomatoes: Moolaadé synopsis", url: "https://www.rottentomatoes.com/m/moolaade", quote: "In retaliation, they confiscate all radios from the women villagers"}
    - {title: "Claske Dijkema, Irénées (2008)", url: "http://www.irenees.net/bdf_fiche-documentation-579_en.html", quote: "This shift takes place when the men take away women’s radio’s, rallying them behind one cause."}
- card: moolaade
  fact: "It won the Un Certain Regard prize at Cannes in 2004 (wow and body)"
  sources:
    - {title: "Festival de Cannes: Moolaadé", url: "https://www.festival-cannes.com/f/moolaade/", quote: "MOOLAADE Ousmane SEMBENE 2004 Un Certain Regard Prix Un Certain Regard - Fondation Groupama Gan pour le Cinéma 2004"}
    - {title: "Encyclopaedia Britannica: Ousmane Sembène (archived 2024)", url: "https://www.britannica.com/biography/Ousmane-Sembene", quote: "Moolaadé (2004; “Protection”), which received the prize for Un Certain Regard at Cannes"}
- card: moolaade
  fact: "Sembene was the maker of Black Girl (La Noire de..., 1966)"
  sources:
    - {title: "Encyclopaedia Britannica: Ousmane Sembène (archived 2024)", url: "https://www.britannica.com/biography/Ousmane-Sembene", quote: "His 1966 feature film, La Noire de… ( Black Girl )"}
