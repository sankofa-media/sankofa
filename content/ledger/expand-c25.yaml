# Expansion batch c25 (2026-11-13): every fact in the bodies and wow lines of the c25 cards,
# with at least two independent sources and a supporting quote from each.
# Quotes in [brackets] or marked [paraphrase] are condensed or contextual; re-open those pages before reuse.
# Britannica pages were read from archive.org snapshots (2024); the live site blocks automated readers.
# Robin Denselow's Guardian and Songlines pieces are one author and are never counted as two sources.
- card: soul-train
  fact: "Soul Train premiered on WCIU-TV in Chicago on 17 August 1970 as a local show"
  sources:
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "On Aug. 17, 1970, \"Soul Train\" premiered on WCIU-TV in Chicago."}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Cornelius, Don 1936–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/cornelius-don-1936", quote: "On August 17, 1970, the very first Soul Train premiered on WCIU-TV Channel 26."}
    - {title: "Encyclopaedia Britannica: Soul Train (archived 2024)", url: "https://www.britannica.com/topic/Soul-Train", quote: "It initially aired in 1970 on Chicago television station WCIU-TV."}
- card: soul-train
  fact: "Cornelius sold tyres and insurance and worked as a Chicago police officer before broadcasting"
  sources:
    - {title: "Contemporary Black Biography (Encyclopedia.com): Cornelius, Don 1936–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/cornelius-don-1936", quote: "so I sold tires, cars, and insurance."}
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "Cornelius worked as a journalist, insurance salesman and police officer"}
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "worked several different jobs, from tire salesman to police officer"}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "worked as a police officer in Chicago"}
- card: soul-train
  fact: "He was an announcer and news reporter at WVON radio"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "working as a disc jockey, announcer, and news reporter for the radio station WVON"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Cornelius, Don 1936–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/cornelius-don-1936", quote: "In 1966 he landed a part-time job as an announcer with WVON in Chicago."}
    - {title: "Arionne Nettles, WBEZ Chicago: The history of Soul Train (2023)", url: "https://www.wbez.org/stories/history-of-soul-train-tv-show-chicago/01829b6c-5b73-42bd-8cb3-2b39ac8951b8", quote: "Don was a news guy who filled in as a disc jockey from time to time."}
- card: soul-train
  fact: "He then worked as a news and sports reporter at the UHF station WCIU"
  sources:
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "while employed as a news and sports reporter at Chicago UHF station WCIU"}
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "hosting the news and sports program A Black’s View of the News on the Chicago station WCIU"}
- card: soul-train
  fact: "Cornelius paid for the pilot / the show with his own money (wow and body)"
  sources:
    - {title: "Arionne Nettles, WBEZ Chicago: The history of Soul Train (2023)", url: "https://www.wbez.org/stories/history-of-soul-train-tv-show-chicago/01829b6c-5b73-42bd-8cb3-2b39ac8951b8", quote: "Don used $400 of his own money to produce the pilot."}
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "who hosted the show and funded it with his own money"}
- card: soul-train
  fact: "George Johnson of Johnson Products, a Black-owned hair-products maker, backed the show"
  sources:
    - {title: "Encyclopaedia Britannica: Soul Train (archived 2024)", url: "https://www.britannica.com/topic/Soul-Train", quote: "George Johnson, founder and president of Johnson Products Company (a Black-owned hair-product manufacturer), whose support enabled the program to move into national syndication in 1971"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Cornelius, Don 1936–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/cornelius-don-1936", quote: "He found the perfect primary sponsor in George Johnson, president of Johnson Products"}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "Black-centered companies like Johnson Products Company had ads for Black-centered products like Afro Sheen"}
- card: soul-train
  fact: "National syndication began on 2 October 1971"
  sources:
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "get it syndicated weekly on a handful of other stations across the country, beginning on October 2, 1971"}
    - {title: "Contemporary Black Biography (Encyclopedia.com): Cornelius, Don 1936–", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/cornelius-don-1936", quote: "Soul Train went on the air October 2, 1971, and was aired once a week."}
- card: soul-train
  fact: "Production moved to Los Angeles"
  sources:
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "inspiring Cornelius to move Soul Train to Los Angeles for its second season"}
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "Cornelius moved production of his hit show from Chicago to Los Angeles."}
- card: soul-train
  fact: "The Soul Train Line: two rows of dancers with an aisle down which pairs danced (wow and body)"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "the “Soul Train Line,” which featured two dancers strutting down the space together between two lines of dancers"}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "Dancers queued up in two rows with a corridor down the middle"}
    - {title: "Arionne Nettles, WBEZ Chicago: The history of Soul Train (2023)", url: "https://www.wbez.org/stories/history-of-soul-train-tv-show-chicago/01829b6c-5b73-42bd-8cb3-2b39ac8951b8", quote: "dancers take turns making their way down an aisle of other dancers, showing off their moves"}
- card: soul-train
  fact: "Cornelius signed off wishing love, peace and soul"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "his signature sign-off: “We wish you love, peace, and soul.”"}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "As always, in parting, we wish you love, peace and SOUL!"}
- card: soul-train
  fact: "He stepped down as host in 1993 and kept producing; new episodes ended in 2006"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "Cornelius retired as host of Soul Train in 1993 but continued to produce new installments until 2006."}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "in 1993, he decided it was time to step away from regular hosting duties ... Production on new episodes of Soul Train eventually ended in 2006"}
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "Cornelius hosted \"Soul Train\" until 1993. The show continued until 2006"}
- card: soul-train
  fact: "One of the longest-running syndicated programmes in American television"
  sources:
    - {title: "Encyclopaedia Britannica: Soul Train (archived 2024)", url: "https://www.britannica.com/topic/Soul-Train", quote: "it was one of the longest-running syndicated programs in American television history"}
    - {title: "WNIJ (Northern Public Radio): This week in Illinois history, Soul Train premieres (2021)", url: "https://www.northernpublicradio.org/wnij-news/2021-08-16/this-week-in-illinois-history-soul-train-premieres-august-17-1970", quote: "making it one of the longest-running syndicated shows in television history"}
- card: soul-train
  fact: "Cornelius took his own life in 2012"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "he died of a self-inflicted gunshot wound in 2012"}
    - {title: "Television Academy: Cool Train Running", url: "https://www.televisionacademy.com/node/595701", quote: "Four years later, he died of a self-inflicted gunshot wound [after selling the franchise in 2008]"}
- card: soul-train
  fact: "The show presented young Black Americans' dance, fashion and hairstyles nationally"
  sources:
    - {title: "Encyclopaedia Britannica: Don Cornelius (archived 2024)", url: "https://www.britannica.com/biography/Don-Cornelius", quote: "youthful African American fashions, hairstyles, and dance moves"}
    - {title: "Encyclopaedia Britannica: Soul Train (archived 2024)", url: "https://www.britannica.com/topic/Soul-Train", quote: "the first to prominently feature African American musical acts and dancers"}
    - {title: "Arionne Nettles, WBEZ Chicago: The history of Soul Train (2023)", url: "https://www.wbez.org/stories/history-of-soul-train-tv-show-chicago/01829b6c-5b73-42bd-8cb3-2b39ac8951b8", quote: "[paraphrase] Cornelius wanted a show that portrayed Black youth differently than national media did"}
- card: combahee-statement
  fact: "The statement is dated April 1977"
  sources:
    - {title: "The Combahee River Collective Statement (April 1977), reprint in Yale American Studies reader", url: "https://americanstudies.yale.edu/sites/default/files/files/Keyword%20Coalition_Readings.pdf", quote: "[1] This statement is dated April 1977."}
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "In April 1977, the CRC issued 'The Combahee River Collective Statement.'"}
- card: combahee-statement
  fact: "The collective was a Black feminist group in Boston formed in 1974"
  sources:
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "Black, feminist, lesbian, socialist group primarily based in Boston ... operated from 1974 to 1980"}
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "The Combahee River Collective formed in Boston, in 1974"}
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "In 1974, sisters Barbara and Beverly Smith and Demita Frazier founded the CRC."}
- card: combahee-statement
  fact: "Its members responded to racism in the feminist movement and sexism in Black political groups"
  sources:
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "[racism] within the feminist movement and sexism and homophobia within the civil rights movement"}
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "The women of the C.R.C. drew on their experiences in Black, male-dominated organizations."}
- card: combahee-statement
  fact: "They broke away from the Boston chapter of the National Black Feminist Organization"
  sources:
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "The group broke from the Boston chapter of the National Black Feminist Organization"}
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "The Combahee River Collective started as a breakaway group from the National Black Feminist Organization."}
    - {title: "Marian Jones, The Nation: oral history (2021)", url: "https://www.thenation.com/article/society/combahee-river-collective-oral-history/", quote: "Barbara and Demita Frazier established the Boston chapter of the NBFO"}
- card: combahee-statement
  fact: "Founders: Barbara Smith, her sister Beverly Smith and Demita Frazier"
  sources:
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "In 1974, sisters Barbara and Beverly Smith and Demita Frazier founded the CRC."}
    - {title: "Marian Jones, The Nation: oral history (2021)", url: "https://www.thenation.com/article/society/combahee-river-collective-oral-history/", quote: "the collective’s founders—Demita Frazier, Beverly Smith, and Barbara Smith"}
- card: combahee-statement
  fact: "Demita Frazier had been a member of the Black Panther Party in Chicago"
  sources:
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "cofounder Demita Frazier, who was an active member of the Chicago Black Panther Party"}
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "Demita Frazier had been a member of the Black Panther Party in Ch[icago]"}
- card: combahee-statement
  fact: "The name came from a book Barbara Smith owned about Tubman's Combahee River raid"
  sources:
    - {title: "Arielle Gray, WBUR (2019)", url: "https://www.wbur.org/news/2019/06/10/boston-combahee-river-collective-intersectional-black-feminism", quote: "They took their name, the Combahee River Collective, from a book Smith owned detailing the historic raid on Combahee River"}
    - {title: "Marian Jones, The Nation: oral history (2021)", url: "https://www.thenation.com/article/society/combahee-river-collective-oral-history/", quote: "There was a little book that I had the opportunity to find and read, which talks about and describes Harriet Tubman’s raid on the Combahee River."}
- card: combahee-statement
  fact: "The name honoured Tubman and signalled that liberation required political action (wow and body)"
  sources:
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "by naming the group after the Combahee River Raid, they were both honoring Harriet Tubman and indicating that liberation required political action"}
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "They chose the name to honor and draw inspiration from Harriet Tubman's 1863 Combahee River raid"}
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "named the organization after the raid organized by Harriet Tubman on the Combahee River"}
- card: combahee-statement
  fact: "The statement was written for Zillah Eisenstein's anthology"
  sources:
    - {title: "Marian Jones, The Nation: oral history (2021)", url: "https://www.thenation.com/article/society/combahee-river-collective-oral-history/", quote: "the statement was written for a book, Zillah Eisenstein’s Capitalist Patriarchy and the Case for Socialist Feminism"}
    - {title: "The Combahee River Collective Statement (April 1977), reprint in Yale American Studies reader", url: "https://americanstudies.yale.edu/sites/default/files/files/Keyword%20Coalition_Readings.pdf", quote: "\"The Combahee River Collective Statement,\" copyright © 1978 by Zillah Eisenstein."}
- card: combahee-statement
  fact: "It describes the major systems of oppression as interlocking"
  sources:
    - {title: "The Combahee River Collective Statement (April 1977), reprint in Yale American Studies reader", url: "https://americanstudies.yale.edu/sites/default/files/files/Keyword%20Coalition_Readings.pdf", quote: "the major systems of oppression are interlocking"}
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "coined terms such as identity politics and interlocking oppression"}
- card: combahee-statement
  fact: "It named its approach identity politics, with the quoted sentence; it put the phrase into circulation (wow and body)"
  sources:
    - {title: "The Combahee River Collective Statement (April 1977), reprint in Yale American Studies reader", url: "https://americanstudies.yale.edu/sites/default/files/files/Keyword%20Coalition_Readings.pdf", quote: "This focusing upon our own oppression is embodied in the concept of identity politics. We believe that the most profound and potentially most radical politics come directly out of our own identity"}
    - {title: "Marian Jones, The Nation: oral history (2021)", url: "https://www.thenation.com/article/society/combahee-river-collective-oral-history/", quote: "They coined the term “identity politics” to describe their unique position as Black women"}
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "[paraphrase] The group introduced the term in the statement"}
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "coined terms such as identity politics"}
- card: combahee-statement
  fact: "In 1979, during a series of murders of Black women in Boston, the collective issued pamphlets about the killings"
  sources:
    - {title: "Arielle Gray, WBUR (2019)", url: "https://www.wbur.org/news/2019/06/10/boston-combahee-river-collective-intersectional-black-feminism", quote: "In 1979, the collective was spurred to action when 12 black women were murdered in Boston within the span of five months. This series of pamphlets was created by the Combahee River Collective"}
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "In 1979, when 11 Black women and one white woman in Boston were found murdered in the span of five months ... The CRC also produced a pamphlet"}
- card: combahee-statement
  fact: "The collective marched in protest in 1979"
  sources:
    - {title: "Mariana Brandman, Massachusetts Women's History", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "On April 28, 1979, together with other local progressive groups, they organized a 500-person march"}
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "The members of the Combahee River Collective march down Massachusetts Avenue, Boston, at a 1979 memorial for murdered women of color."}
- card: combahee-statement
  fact: "The group stopped meeting around 1980 (see dispute)"
  sources:
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "operated from 1974 to 1980"}
    - {title: "Arielle Gray, WBUR (2019)", url: "https://www.wbur.org/news/2019/06/10/boston-combahee-river-collective-intersectional-black-feminism", quote: "The collective met regularly between 1974 to 1981."}
- card: combahee-statement
  fact: "Identity politics became one of the most argued-over terms in American politics"
  sources:
    - {title: "Keeanga-Yamahtta Taylor, The New Yorker (2020)", url: "https://www.newyorker.com/news/our-columnists/until-black-women-are-free-none-of-us-will-be-free", quote: "the C.R.C. pioneered the notion of “identity politics,” perhaps one of the most controversial and misunderstood terms in all of U.S. politics"}
    - {title: "Encyclopaedia Britannica: Combahee River Collective (archived 2024)", url: "https://www.britannica.com/topic/Combahee-River-Collective", quote: "[terms] that have become popular lenses through which to understand political constituencies’ needs and preferences"}
- card: losing-ground
  fact: "Losing Ground is a 1982 feature by Kathleen Collins, one of the first Black women to direct a narrative feature"
  sources:
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "Losing Ground, the 1982 masterwork of the late Kathleen Collins ... One of the first Black women to direct a narrative feature film"}
    - {title: "The Hollywood Reporter: National Film Registry 2020 (Library of Congress descriptions)", url: "https://www.hollywoodreporter.com/news/the-dark-knight-a-clockwork-orange-and-the-joy-luck-club-enter-national-film-registry", quote: "One of the first features directed by an African American woman"}
- card: losing-ground
  fact: "Sara (Seret Scott), a philosophy professor, researches the philosophical and religious meaning of ecstatic experience (wow and body)"
  sources:
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "stars Seret Scott as Sara Rogers, a professor of philosophy researching the philosophical and religious meaning of the “ecstatic experience”"}
    - {title: "The Hollywood Reporter: National Film Registry 2020 (Library of Congress descriptions)", url: "https://www.hollywoodreporter.com/news/the-dark-knight-a-clockwork-orange-and-the-joy-luck-club-enter-national-film-registry", quote: "Sara (Seret Scott), an African American philosophy professor ... struggles to research the philosophical and religious meaning of ecstatic experience"}
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "Sara is a philosophy professor"}
- card: losing-ground
  fact: "Her husband Victor, a painter (Bill Gunn), sells a painting to a museum and rents a country house for the summer"
  sources:
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "Bill Gunn as her artist husband Victor, who rents a house in the country to celebrate his sale of a painting to a museum"}
    - {title: "The Hollywood Reporter: National Film Registry 2020 (Library of Congress descriptions)", url: "https://www.hollywoodreporter.com/news/the-dark-knight-a-clockwork-orange-and-the-joy-luck-club-enter-national-film-registry", quote: "whose artist husband, Victor (Bill Gunn), rents a country house for a month to celebrate a recent museum sale"}
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "her handsome painter husband Victor (Bill Gunn)"}
- card: losing-ground
  fact: "Sara seeks to study ecstasy and to discover it for herself; the marriage unravels"
  sources:
    - {title: "The Hollywood Reporter: National Film Registry 2020 (Library of Congress descriptions)", url: "https://www.hollywoodreporter.com/news/the-dark-knight-a-clockwork-orange-and-the-joy-luck-club-enter-national-film-registry", quote: "as Sara struggles to research the philosophical and religious meaning of ecstatic experience … and to discover it for herself"}
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "through her studies, she finds herself and her marriage unraveling"}
- card: losing-ground
  fact: "In 1982 the film played festivals but was not picked up for theatrical distribution (wow and body)"
  sources:
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "In 1982, when Kathleen Collins’s Losing Ground (her second feature) premiered at festivals, it was not picked up for theatrical distribution."}
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "she struggled to get funding and distribution for her work"}
- card: losing-ground
  fact: "Collins died in 1988 at 46 and her work went largely unseen for years"
  sources:
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "whose work was largely unseen for decades after her death in 1988 at the age of 46"}
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "Since she died of breast cancer at just 46 in 1988, a good deal of this work went unreleased for years"}
- card: losing-ground
  fact: "Her daughter Nina Collins raised money for the restoration, completed in 2015; Milestone Films released it (wow and body)"
  sources:
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "Nina Collins raised funding for a partial restoration of her mother’s film and worked with Milestone Films to release it ... In 2015, Milestone showed Losing Ground"}
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "The movie was restored in 2015 thanks to efforts by Collins’s daughter, Nina, with a physical release from Milestone Films coming the following year."}
- card: losing-ground
  fact: "Added to the National Film Registry in 2020"
  sources:
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "In 2020, it was added to the National Film Registry."}
    - {title: "The Hollywood Reporter: National Film Registry 2020 (Library of Congress descriptions)", url: "https://www.hollywoodreporter.com/news/the-dark-knight-a-clockwork-orange-and-the-joy-luck-club-enter-national-film-registry", quote: "Kathleen Collins’ Losing Ground (1982) [among the 2020 National Film Registry selections]"}
- card: losing-ground
  fact: "A film by and about a Black woman intellectual"
  sources:
    - {title: "Jourdain Searles, Hyperallergic (2022)", url: "https://hyperallergic.com/743670/kathleen-collins-losing-ground/", quote: "a film made by and about a Black intellectual woman in a complicated marriage"}
    - {title: "Yale Library: Film Archive awarded Film Foundation grant to restore Kathleen Collins masterwork (2022)", url: "https://library.yale.edu/news/film-archive-awarded-film-foundation-grant-restore-kathleen-collins-masterwork", quote: "[paraphrase] a pioneering Black writer and filmmaker; her heroine is a professor of philosophy"}
- card: dbc-pirate
  fact: "DBC was an unlicensed (pirate) London station of the early 1980s"
  sources:
    - {title: "Apiento, Test Pressing (2009)", url: "https://testpressing.org/magazine/dread-broadcasting-corp", quote: "the first black music pirate station in the UK"}
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "pretty much every weekend during the early 1980s ... the advantages of being illegal"}
- card: dbc-pirate
  fact: "Reggae had little airtime on British radio; Lepke wanted more exposure for Black music"
  sources:
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "So exposure for reggae music was only about a couple of hours a week, if that. ... a need for black music to get more exposure"}
    - {title: "DX Archive: Dread Broadcasting Corporation / JBC", url: "https://www.dxarchive.com/landbased_uk_london_dbc-jbc.html", quote: "DBC aimed to play reggae music which at the time was missing on the UK airwaves."}
- card: dbc-pirate
  fact: "Its founder was Leroy Anderson, known as Lepke"
  sources:
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "Born Leroy Anderson, Lepke was the brother of radio presenter Ranking Miss P."}
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "Lepke, AKA Leroy George Anderson, set up the Dread Broadcast Corporation in 1981"}
- card: dbc-pirate
  fact: "In 1981 he got a medium-wave transmitter from a friend and set up the aerial in his back garden in Neasden (wow and body; see dispute)"
  sources:
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "In 1981 he acquired a medium wave transmitter from a friend ... strung it up in his back garden in Neasden"}
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "set up the Dread Broadcast Corporation in 1981, with a undersized AM mast in his back garden"}
    - {title: "Apiento, Test Pressing (2009)", url: "https://testpressing.org/magazine/dread-broadcasting-corp", quote: "He began broadcasting from a shed in his Neasden back garden in in October 1980"}
- card: dbc-pirate
  fact: "DBC is remembered as Britain's first Black music pirate station / first Black-owned station in Europe (wow and body)"
  sources:
    - {title: "Apiento, Test Pressing (2009)", url: "https://testpressing.org/magazine/dread-broadcasting-corp", quote: "the first black music pirate station in the UK"}
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "DBC (a play on the name BBC) was the first black owned radio station in Europe"}
- card: dbc-pirate
  fact: "Reggae was its core, alongside R&B, soul, funk, African music and calypso"
  sources:
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "While reggae may have been DBC’s focus ... complemented by an R&B and ska show, soul ’n’ funk, African music and calypso"}
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "DBC broadcast a wide range of black music"}
- card: dbc-pirate
  fact: "The station later moved to FM"
  sources:
    - {title: "DX Archive: Dread Broadcasting Corporation / JBC", url: "https://www.dxarchive.com/landbased_uk_london_dbc-jbc.html", quote: "The station later moved to FM"}
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "those we could reach across most of London when we went FM"}
- card: dbc-pirate
  fact: "Its jingle: tune in if yuh rankin'"
  sources:
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "Tune in if yuh rankin’…"}
    - {title: "Apiento, Test Pressing (2009)", url: "https://testpressing.org/magazine/dread-broadcasting-corp", quote: "As Lepke said: 'tune in if yu rankin'."}
- card: dbc-pirate
  fact: "When DBC stopped, some of its DJs carried on as JBC"
  sources:
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "Once DBC stopped transmitting some of its DJs joined JBC."}
    - {title: "DX Archive: Dread Broadcasting Corporation / JBC", url: "https://www.dxarchive.com/landbased_uk_london_dbc-jbc.html", quote: "following closure around 1984, some of the presenters carried on the station under the name JBC"}
- card: dbc-pirate
  fact: "Lepke died in March 2018"
  sources:
    - {title: "The Wire: Dread Broadcasting Corporation founder Lepke has died (2018)", url: "https://www.thewire.co.uk/news/50350/dread-broadcasting-corporation-founder-lepke-has-died", quote: "DJ Lepke, founder of Dread Broadcasting Corporation (DBC), died on 14 March. [published 25 March 2018]"}
    - {title: "Lloyd Bradley, Red Bull Music Academy Daily (2018)", url: "https://daily.redbullmusicacademy.com/2018/04/a-tribute-to-dbc-lepke", quote: "when Leroy passed away in late March of this year [April 2018]"}
- card: rivers-of-babylon
  fact: "Rivers of Babylon is a reggae song by the Melodians of Kingston, produced by Leslie Kong (see dispute for date)"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "in 1967 the group took the song \"Rivers Of Babylon\" to record producer Leslie Kong"}
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "“Rivers of Babylon,” from 1971, is by vocal duo The Melodians (Brent Dowe and James McNaughton), again backed by The Dynamites and Leslie Kong"}
- card: rivers-of-babylon
  fact: "Rastafari was popular among Kingston's musicians by then"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "proved particularly popular among the rocksteady and reggae musicians who by the 1960s were performing and recording regularly in Kingston, Jamaica"}
    - {title: "Encyclopaedia Britannica: Bob Marley (archived 2024)", url: "https://www.britannica.com/biography/Bob-Marley", quote: "the Wailers’ Rastafari faith, a creed popular among the impoverished people of the Caribbean"}
- card: rivers-of-babylon
  fact: "Its words adapt Psalm 137 and Psalm 19:14 (wow and body)"
  sources:
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "these sentiments are expressed by adapting from the Bible passages Psalm 19:14 and Psalm 137:1"}
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "Another Scripture, Psalm 19 verse 14 \"Let the words of my mouth and the meditation of my heart be acceptable in thy sight,\" were used for another verse"}
- card: rivers-of-babylon
  fact: "Brent Dowe and McNaughton took the composer credit"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "it was The Melodians’ Brent Dowe and Trevor McNaughton who claimed composer credits"}
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "The Melodians (Brent Dowe and James McNaughton)"}
- card: rivers-of-babylon
  fact: "For Rastafarians, Babylon is any oppressive or unjust government; in Jamaica also the police"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "In the Rastafarian faith, the term \"Babylon\" is used for any governmental system which is either oppressive or unjust. In Jamaica, Rastafarians also use \"Babylon\" to refer to the police"}
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "Such lyrics were concerned with Rastafarian religious beliefs and issues of social justice."}
- card: rivers-of-babylon
  fact: "It came to be heard as a Rastafarian anthem (wow: Rastafarian reggae song)"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "was seen as something of a Rastafarian anthem"}
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "Such lyrics were concerned with Rastafarian religious beliefs"}
- card: rivers-of-babylon
  fact: "It reached audiences abroad on The Harder They Come soundtrack (1972)"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "The group’s recording finally found something of an international audience when used in the reggae orientated crime film starring Jimmy Cliff, The Harder They Come which came out in 1972."}
    - {title: "Michael Garnice, Library of Congress NRR essay: The Harder They Come", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/The-Harder-They-Come_Garnice.pdf", quote: "[the song is discussed as a track of] “The Harder They Come”--Jimmy Cliff, et.al. (1972)"}
- card: rivers-of-babylon
  fact: "In 1978 Frank Farian had his group Boney M record it"
  sources:
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "It was in 1978 though that the song found an international pop audience when producer Frank Farian got his studio creation Boney M to cover the song."}
    - {title: "Encyclopaedia Britannica: Boney M (archived 2024)", url: "https://www.britannica.com/topic/Boney-M", quote: "Boney M, a foursome from the Caribbean (via Britain and the Netherlands) brought together by German producer Frank Farian"}
- card: rivers-of-babylon
  fact: "Boney M's version entered the UK chart on 29 April 1978, reached number one on 13 May, 40 weeks on chart (wow: UK number one)"
  sources:
    - {title: "Official Charts: Rivers of Babylon / Brown Girl in the Ring, chart history", url: "https://officialcharts.com/songs/boney-m-rivers-of-babylonbrown-girl-in-the-ring", quote: "Peak position 1 ... First Chart Date 29/04/1978 ... 40 weeks - 29/04/1978 to 27/01/1979 ... 13/05/1978 peak"}
    - {title: "Cross Rhythms: Rivers of Babylon, the unlikely history of a pop hit based on Psalm 137", url: "https://www.crossrhythms.co.uk/articles/music/Rivers_Of_Babylon_The_unlikely_history_of_a_pop_hit_based_on_Psalm_137/50257/p1/", quote: "In 1978 the Germany-based pop disco group Boney M made number one in the UK charts with \"Rivers Of Babylon\""}
- card: yeke-yeke
  fact: "Ye ke ye ke is a 1987 single by Mory Kante, singer and kora player from Guinea"
  sources:
    - {title: "The New York Times (2020), quoted by ArtsJournal", url: "https://artsjournal.org/?p=224110", quote: "[His] 1987 single “Yé Ké Yé Ké” was a hit"}
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "known internationally for 1987 hit \"Yé ké yé ké\""}
    - {title: "The Star (Kenya), from BBC (2020)", url: "https://www.the-star.co.ke/news/2020-05-23-mory-kant-african-music-star-who-sang-yk-yk-dies-aged-70/", quote: "was known as a distinguished player of kora"}
- card: yeke-yeke
  fact: "The kora is the West African harp of the griots, hereditary musicians whose songs carry news and history; Kante was born into a griot family (wow and body)"
  sources:
    - {title: "The New York Times (2020), quoted by ArtsJournal", url: "https://artsjournal.org/?p=224110", quote: "[He] came from a family of griots, the dynastic West African musicians whose songs carry news and chronicle history ... the kora, the traditional griot’s harp"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "Kanté came from a jali or griot family of hereditary musicians and historians ... the kora, the ancient west African harp"}
    - {title: "The Star (Kenya), from BBC (2020)", url: "https://www.the-star.co.ke/news/2020-05-23-mory-kant-african-music-star-who-sang-yk-yk-dies-aged-70/", quote: "Born in a famous family of \"griots\" - West African musicians and storytellers ... kora - a West African harp"}
- card: yeke-yeke
  fact: "He was sent to Mali to continue his training"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "At age seven, he was sent to Mali to learn vocals and the kora harp"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "at 15 was sent to Bamako, the Malian capital, to live with his aunt ... Here he continued his griot education"}
- card: yeke-yeke
  fact: "In Bamako he joined the Rail Band and took over as lead singer when Salif Keita left"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "Kanté would join Mali’s Rail Band in 1971, becoming the group’s vocalist upon the departure of Salif Keita"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "Salif Keita was their star vocalist, and Kanté was hired to play the balafon and guitar"}
    - {title: "Robin Denselow, Songlines (2020) [same author as the Guardian obituary; not counted as independent of it]", url: "https://songlines.co.uk/news/guinean-musician-mory-kante-has-died-aged-70", quote: "[Songlines, same author] Two years later, when Salif left to join Les Ambassadeurs, Mory took over as lead singer"}
- card: yeke-yeke
  fact: "He later settled in Paris"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "He would make a move to Paris in 1980"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "in 1984 he moved to Paris, where he eventually achieved his goal"}
- card: yeke-yeke
  fact: "The song was released as a single from Akwaba Beach"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "Released as a single from his third studio album, Akwaba Beach"}
    - {title: "Robin Denselow, Songlines (2020) [same author as the Guardian obituary; not counted as independent of it]", url: "https://songlines.co.uk/news/guinean-musician-mory-kante-has-died-aged-70", quote: "it was the opening track on his best-selling 1987 album Akwaba Beach"}
- card: yeke-yeke
  fact: "He played an amplified kora with the instruments of Western pop (wow: plugged in the kora)"
  sources:
    - {title: "The New York Times (2020), quoted by ArtsJournal", url: "https://artsjournal.org/?p=224110", quote: "he electrified the kora, the traditional griot’s harp, and he fused African music with styles and instruments from Western pop"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "Kanté played an amplified version of the instrument, which was matched against a stomping bass line, brass, drums"}
- card: yeke-yeke
  fact: "He was nicknamed the electronic griot"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "earning himself the nickname \"the electronic griot.\""}
    - {title: "The Star (Kenya), from BBC (2020)", url: "https://www.the-star.co.ke/news/2020-05-23-mory-kant-african-music-star-who-sang-yk-yk-dies-aged-70/", quote: "he had been nicknamed \"the electronic griot\""}
- card: yeke-yeke
  fact: "A hit first in Africa and then across Europe"
  sources:
    - {title: "The New York Times (2020), quoted by ArtsJournal", url: "https://artsjournal.org/?p=224110", quote: "was a hit, first in Africa and then across Europe"}
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "became a top five hit in France, Switzerland, Germany and the Netherlands"}
- card: yeke-yeke
  fact: "First African single to sell more than a million copies (wow and body)"
  sources:
    - {title: "The New York Times (2020), quoted by ArtsJournal", url: "https://artsjournal.org/?p=224110", quote: "It became the first African single to sell more than a million copies"}
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "the song was the first African single to sell more than one million copies"}
    - {title: "Robin Denselow, The Guardian obituary (2020), via Yahoo News", url: "https://sg.news.yahoo.com/mory-kant-obituary-163911795.html", quote: "became the first African single to sell over a million copies"}
- card: yeke-yeke
  fact: "Kante died in Conakry in May 2020, aged 70"
  sources:
    - {title: "Calum Slingerland, Exclaim! (2020)", url: "https://exclaim.ca/music/article/african_music_star_mory_kant_dies_at_70", quote: "Published May 22, 2020 ... he passed in Conakry, Guinea ... He was 70."}
    - {title: "The Star (Kenya), from BBC (2020)", url: "https://www.the-star.co.ke/news/2020-05-23-mory-kant-african-music-star-who-sang-yk-yk-dies-aged-70/", quote: "Kanté died in hospital on Friday in the capital, Conakry, aged 70 [2020-05-23]"}
- card: yeelen
  fact: "Yeelen's title means brightness or light"
  sources:
    - {title: "Al Jazeera (2025)", url: "https://www.aljazeera.com/news/2025/2/20/mali-filmmaker-souleymane-cisse-father-of-african-cinema-dies-at-age-84", quote: "“Yeelen” (“Brightness”)"}
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "Translating as ‘Brightness’ or ‘Light’"}
    - {title: "Festival de Cannes: Yeelen", url: "https://www.festival-cannes.com/f/yeelen/", quote: "YEELEN (LA LUMIÈRE)"}
- card: yeelen
  fact: "A 1987 feature by the Malian Souleymane Cisse drawn from Bambara legends (wow and body)"
  sources:
    - {title: "Al Jazeera (2025)", url: "https://www.aljazeera.com/news/2025/2/20/mali-filmmaker-souleymane-cisse-father-of-african-cinema-dies-at-age-84", quote: "“Yeelen” (“Brightness”), which draws on legends from west Africa’s Bambara people"}
    - {title: "Melody Chironda, allAfrica (2025)", url: "https://allafrica.com/stories/202502200398.html", quote: "a film inspired by the legends of the Bambara people"}
    - {title: "Ministère de la Culture: Hommage de Rachida Dati à Souleymane Cissé (2025)", url: "https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-madame-rachida-dati-ministre-de-la-culture-a-monsieur-souleymane-cisse", quote: "Yeelen (La Lumière) mêlant quête initiatique et traditions bambaras"}
- card: yeelen
  fact: "Cisse was born in 1940 in Bamako under French colonial rule"
  sources:
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "Born in 1940 in Bamako under French colonial rule"}
    - {title: "Ministère de la Culture: Hommage de Rachida Dati à Souleymane Cissé (2025)", url: "https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-madame-rachida-dati-ministre-de-la-culture-a-monsieur-souleymane-cisse", quote: "Né en 1940 au Mali"}
- card: yeelen
  fact: "He studied film at the state film institute in Moscow"
  sources:
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "a free filmmaking education at the Gerasimov Institute of Cinematography in Moscow (VGIK)"}
    - {title: "CNC: Souleymane Cissé, disparition d'une légende du cinéma africain (2025)", url: "https://www.cnc.fr/cinema/actualites/souleymane-cisse-disparition-dune-legende-du-cinema-africain_2347072", quote: "Souleymane Cissé part alors se former à l’Institut national de la cinématographie de Moscou dont il ressort diplômé en 1969"}
    - {title: "Ministère de la Culture: Hommage de Rachida Dati à Souleymane Cissé (2025)", url: "https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-madame-rachida-dati-ministre-de-la-culture-a-monsieur-souleymane-cisse", quote: "formé à l’Institut national de la cinématographie de Moscou"}
- card: yeelen
  fact: "His earlier features dealt with work, power and youth in modern Mali"
  sources:
    - {title: "Ministère de la Culture: Hommage de Rachida Dati à Souleymane Cissé (2025)", url: "https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-madame-rachida-dati-ministre-de-la-culture-a-monsieur-souleymane-cisse", quote: "Avec Baara (Le Travail) en 1978 ... Finyé (Le Vent) en 1982, un portrait saisissant de la jeunesse malienne"}
    - {title: "African Studies Centre Leiden (2025)", url: "https://www.ascleiden.nl/content/library-weekly/souleymane-cisse", quote: "uncompromising depictions of military violence, abuse of money and power, trade unionism ... over Bamako’s women and youth"}
- card: yeelen
  fact: "Plot: Nianankoro seeks the magic powers his sorcerer father refuses to pass on for fear of an equal; the father pursues him (wow and body)"
  sources:
    - {title: "CNC: Souleymane Cissé, disparition d'une légende du cinéma africain (2025)", url: "https://www.cnc.fr/cinema/actualites/souleymane-cisse-disparition-dune-legende-du-cinema-africain_2347072", quote: "l’histoire d’un jeune homme qui entreprend un long voyage à travers le Mali pour acquérir les pouvoirs magiques de la tradition Bambara que son père refuse de lui donner, par peur de le voir devenir son égal"}
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "Following the journey of Nianankoro, a young man who must confront his sorcerer father to claim his destiny"}
- card: yeelen
  fact: "Set across the landscapes of the Sahel"
  sources:
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "vast Sahelian la[ndscapes]"}
    - {title: "Festival de Cannes: Yeelen", url: "https://www.festival-cannes.com/f/yeelen/", quote: "Une sécheresse atroce sévit dans tout le Sahel."}
- card: yeelen
  fact: "It won the Jury Prize at Cannes in 1987 (wow and body)"
  sources:
    - {title: "Festival de Cannes: Yeelen", url: "https://www.festival-cannes.com/f/yeelen/", quote: "Prix du Jury (Ex-aequo) 1987"}
    - {title: "Al Jazeera (2025)", url: "https://www.aljazeera.com/news/2025/2/20/mali-filmmaker-souleymane-cisse-father-of-african-cinema-dies-at-age-84", quote: "winner of the jury’s prize at the 1987 Cannes Film Festival for his film, Yeelen"}
    - {title: "African Studies Centre Leiden (2025)", url: "https://www.ascleiden.nl/content/library-weekly/souleymane-cisse", quote: "won the Jury Prize at the 1987 Cannes Film Festival"}
- card: yeelen
  fact: "Cisse was the first filmmaker from sub-Saharan Africa to win a prize at Cannes (wow and body; see dispute)"
  sources:
    - {title: "CNC: Souleymane Cissé, disparition d'une légende du cinéma africain (2025)", url: "https://www.cnc.fr/cinema/actualites/souleymane-cisse-disparition-dune-legende-du-cinema-africain_2347072", quote: "film qui fit de lui le premier cinéaste d’Afrique subsaharienne à être primé au Festival de Cannes en 1987"}
    - {title: "Melody Chironda, allAfrica (2025)", url: "https://allafrica.com/stories/202502200398.html", quote: "the first Black African director to win a feature film award at the Cannes Film Festival"}
- card: yeelen
  fact: "In 2023 the Directors' Fortnight gave him the Carrosse d'Or"
  sources:
    - {title: "Ministère de la Culture: Hommage de Rachida Dati à Souleymane Cissé (2025)", url: "https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-madame-rachida-dati-ministre-de-la-culture-a-monsieur-souleymane-cisse", quote: "En 2023, la Quinzaine des cinéastes lui avait remis le prestigieux prix du Carrosse d’or"}
    - {title: "Al Jazeera (2025)", url: "https://www.aljazeera.com/news/2025/2/20/mali-filmmaker-souleymane-cisse-father-of-african-cinema-dies-at-age-84", quote: "In 2023, Cannes honoured him again with the Carrosse d’Or"}
- card: yeelen
  fact: "He died at a clinic in Bamako in February 2025, aged 84"
  sources:
    - {title: "Melody Chironda, allAfrica (2025)", url: "https://allafrica.com/stories/202502200398.html", quote: "died at a Bamako clinic aged 84 [20 February 2025]"}
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "His death on Wednesday at a clinic in Bamako, Mali at the age of eighty-four"}
    - {title: "African Studies Centre Leiden (2025)", url: "https://www.ascleiden.nl/content/library-weekly/souleymane-cisse", quote: "He passed away on 19 February 2025, in a clinic in Bamako, Mali, at the age of 84."}
- card: yeelen
  fact: "Just before he was due in Ouagadougou to chair the FESPACO jury (see dispute)"
  sources:
    - {title: "Sarah Jilani, ArtReview (2025)", url: "https://artreview.com/malian-filmmaker-souleymane-cisse-1940-2025-taught-us-how-to-see-obituary-sarah-jilani-opinion-african-cinema", quote: "Cissé had been due to fly to Burkina Faso capital’s Ouagadougou the very next day to chair the jury at the 29th edition of FESPACO"}
    - {title: "CNC: Souleymane Cissé, disparition d'une légende du cinéma africain (2025)", url: "https://www.cnc.fr/cinema/actualites/souleymane-cisse-disparition-dune-legende-du-cinema-africain_2347072", quote: "décédé à 84 ans, trois jours avant qu’il ne prenne la présidence du jury « fiction long métrage » du 29e Fespaco à Ouagadougou"}
- card: rappers-delight
  fact: "Rapper's Delight (1979) by the Sugarhill Gang carried rap onto the pop charts"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "“Rapper’s Delight” (1979), which was the first rap song to achieve mainstream success on the pop charts"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "It was the first time a rap song had crossed over to major mainstream success."}
- card: rappers-delight
  fact: "Hip-hop then lived at parties and on street corners in New York"
  sources:
    - {title: "Bo Emerson, Atlanta Journal-Constitution (2020)", url: "https://www.ajc.com/entertainment/music/rapper-delight-1979-song-introduced-rap-mass-audience/53RFZotbExCc2GDI1w6VpK", quote: "Hip-hop was happening, in dance halls, at high school gyms and on street corners in Queens, Brooklyn and the Bronx."}
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "hip-hop, a musical and cultural movement that originated in the Black urban underground scene"}
- card: rappers-delight
  fact: "Sylvia and Joe Robinson faced bankruptcy as All Platinum collapsed (wow and body)"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "Faced with impending financial bankruptcy, the Robinsons dissolved their All Platinum label and reorganized it as Sugar Hill Records"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "the 43-year-old Robinson and her husband, Joe, were facing bankruptcy after the collapse of their label, All Platinum Records"}
- card: rappers-delight
  fact: "Sylvia Robinson was a record-business veteran"
  sources:
    - {title: "Encyclopaedia Britannica: Sugar Hill Records (archived 2024)", url: "https://www.britannica.com/topic/Sugar-Hill-Records", quote: "Launched in 1979 by industry veterans Sylvia and Joe Robinson"}
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "Robinson, formerly half of rhythm and blues (R&B) duo Mickey & Sylvia, was the founder of All Platinum Records"}
- card: rappers-delight
  fact: "Sugar Hill Records was based in Englewood, New Jersey, and named after a Harlem neighbourhood"
  sources:
    - {title: "Encyclopaedia Britannica: Sugar Hill Records (archived 2024)", url: "https://www.britannica.com/topic/Sugar-Hill-Records", quote: "Sugar Hill Records, based in Englewood, New Jersey, was named after the upmarket section of Harlem"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "christening them the Sugarhill Gang – named after a wealthy neighborhood in Harlem ... Jersey-based producer Sylvia Robinson"}
- card: rappers-delight
  fact: "Robinson assembled three unknowns: Wonder Mike, Master Gee and Big Bank Hank (wow and body)"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "The group was formed in Englewood, New Jersey, in 1979 when record producer Sylvia Robinson decided to put together a group ... None of the group members had professionally rapped before"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "For Sugarhill Gang members Big Bank Hank, Wonder Mike and Master Gee, their whirlwind origin story started outside a New Jersey pizza parlor"}
- card: rappers-delight
  fact: "She found Big Bank Hank working at a pizza parlour in Englewood"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "Big Bank Hank worked at a pizza parlor in Englewood, where the auditions took place."}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "Robinson discovered Henry “Big Bank Hank” Jackson when he was rapping over tapes while working at the Crispy Crust pizza joint in Englewood."}
- card: rappers-delight
  fact: "Recorded in a single take"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "recorded their first song, “Rapper’s Delight,” in the summer of 1979 in one take"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "it was laid down in a single take"}
- card: rappers-delight
  fact: "Over the bass line of Chic's Good Times (wow and body)"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "Chic’s “Good Times,” supplied the bass line that underlies the rest of “Rapper’s Delight.”"}
    - {title: "Eric Reese, Library of Congress NRR essay: Rapper's Delight", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RappersDelight.pdf", quote: "the song opened with Bernard Edward’s distinctive bass line from Chic’s “Good Times,”"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "she chose the riff from Chic’s “Good Times,”"}
- card: rappers-delight
  fact: "Some of Hank's rhymes were written by Grandmaster Caz, who was left off the credits"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "upon the single’s release, the credits listed only Robinson and the three group members, leaving off Grandmaster Caz, Love De-Luxe, and Chic"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "Curtis Brown, better known as Grandmaster Caz or Casanova Fly, wasn’t so lucky. ... Jackson asked Caz to write some rhymes for him"}
- card: rappers-delight
  fact: "Not the first rap record, but the first in the pop Top 40, at number 36 on the Hot 100 (wow and body)"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "reached number 4 on the Hot Soul Singles chart in the United States and number 36 on the Billboard Hot 100 chart ... Although it was not the first rap single, it was the first to cross over to the pop charts"}
    - {title: "Encyclopaedia Britannica: Sugar Hill Records (archived 2024)", url: "https://www.britannica.com/topic/Sugar-Hill-Records", quote: "“Rapper’s Delight” (1979) by the Sugarhill Gang was the first to make the Top 40"}
    - {title: "Eric Reese, Library of Congress NRR essay: Rapper's Delight", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RappersDelight.pdf", quote: "Not that it was the first rap song released ... number 36 on the US “Billboard Hot 100” chart"}
- card: rappers-delight
  fact: "Rodgers and Edwards threatened to sue and won a songwriting credit"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "Nile Rodgers, and bassist, Bernard Edwards, threatened legal action ... The songwriting credit for “Rapper’s Delight” was changed to include their names"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "Rodgers and Chic bassist Bernard Edwards threatened to sue, eventually settling and receiving songwriting credits"}
    - {title: "Eric Reese, Library of Congress NRR essay: Rapper's Delight", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RappersDelight.pdf", quote: "settled out of court resulting in giving writing co-credits to “Rapper’s Delight” to Nile Rodgers and Bernard Edwards"}
- card: rappers-delight
  fact: "An estimated 14 million copies sold (see dispute)"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "The recording went on to sell an estimated 14 million copies"}
    - {title: "Kim Bellware, The Washington Post via The Spokesman-Review (2023)", url: "https://spokesman.com/stories/2023/aug/08/the-unlikely-origins-of-rappers-delight-hip-hops-f", quote: "selling 14 million records"}
- card: rappers-delight
  fact: "Added to the National Recording Registry in 2011"
  sources:
    - {title: "Encyclopaedia Britannica: The Sugarhill Gang (archived 2024)", url: "https://www.britannica.com/topic/the-Sugarhill-Gang", quote: "In 2011 the U.S. Library of Congress added “Rapper’s Delight” to the National Recording Registry"}
    - {title: "Eric Reese, Library of Congress NRR essay: Rapper's Delight", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RappersDelight.pdf", quote: "“Rapper’s Delight”-- Sugarhill Gang (1979) Added to the National Registry: 2011"}
- card: redemption-song
  fact: "Redemption Song closes Uprising (1980), the last album Marley released in his lifetime"
  sources:
    - {title: "Jon Tattrie, The Canadian Encyclopedia (2017)", url: "https://thecanadianencyclopedia.ca/en/article/the-african-nova-scotian-roots-of-bob-marleys-redemption-song", quote: "“Redemption Song,” the final track on what would be his final album, Uprising"}
