  verdict: confirmed
  sources:
    - {title: "Associated Press via Christian Science Monitor: This is Sojourner Truth, new documents reveal more to her story (15 June 2022)", url: "https://www.csmonitor.com/USA/2022/0615/This-is-Sojourner-Truth-New-documents-reveal-more-to-her-story", quote: "In 1828, years before she took the name Sojourner Truth, a Black woman who had escaped slavery with her infant daughter won a court fight in New York’s Hudson Valley to bring her son, Peter, home from Alabama."}
    - {title: "National Women's History Museum: Sojourner Truth", url: "https://www.womenshistory.org/education-resources/biographies/sojourner-truth", quote: "Truth fled with only her infant daughter, Sophia ... With the support of the Van Wagenens, Truth successfully sued for the return of her five-year-old son, Peter. After a year-long legal battle, a judge of the Ulster County Courthouse ruled in her favor"}
