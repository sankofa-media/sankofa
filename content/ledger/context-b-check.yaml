- card: stolen-legacy
  fact: "The Egyptian 'mystery system' in Stolen Legacy derives from Masonic lore traced by scholars to an eighteenth-century French novel, the Abbé Terrasson's Sethos."
  verdict: corrected
  sources:
    - {title: "Bryn Mawr Classical Review 1996.05.07: Lawrence Tritle on Lefkowitz", url: "https://bmcr.brynmawr.edu/1996/1996.05.07", quote: "Lefkowitz rejects James’ argument that there was any sort of a universal “Egyptian mystery system.” ... The discussion of “Egyptian mysteries” leads to one detailing the emergence of Masonic rituals and beliefs from the French Enlightenment work Sethos published by the Abbé J. Terrasson"}
    - {title: "Thomas G. Palaima, review of Not Out of Africa, National Review, 25 March 1996", url: "https://sites.utexas.edu/scripts/files/2020/06/1996-TGP-revNotOutOfAfrica.pdf", quote: "myth of Egypt as the fons et origo of all European learning and culture was invented in the eighteenth century in a popular Bildungsroman ... By tracing an intellectual pedigree from Terrasson through Blyden, Du Bois, and Garvey to James"}
  note: "Both sources are reviews of one book, Lefkowitz's Not Out of Africa, so the Terrasson genealogy rests on a single scholar. The card said 'scholars trace'; it now attributes the tracing to Lefkowitz, which the two independent reviews confirm."
- card: stolen-legacy
  fact: "Stolen Legacy became an important text of the Afrocentric movement."
  verdict: confirmed
  sources:
    - {title: "Thomas G. Palaima, review of Not Out of Africa, National Review, 25 March 1996", url: "https://sites.utexas.edu/scripts/files/2020/06/1996-TGP-revNotOutOfAfrica.pdf", quote: "the entire Afrocentrist intellectual movement of which Stolen Legacy is an important component"}
    - {title: "Bryn Mawr Classical Review 1996.05.07: Lawrence Tritle on Lefkowitz", url: "https://bmcr.brynmawr.edu/1996/1996.05.07", quote: "Lefkowitz refutes the Afrocentric assertion that the Greeks “stole” their philosophy from Egypt, a point made most famous in G. James’ Stolen Legacy."}
