# Facts behind the {male}/{female} paragraphs of radio-haiti and the shared
# paragraphs rewritten for them; sources opened 2026-11-15.
- card: radio-haiti
  copy: male
  fact: Jean Dominique had trained as an agronomist.
  sources:
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "Dominique was an out-of-work agronomist who, to get a job, became involved in a rural, all-music radio station."}
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "Dominique trained as an agronomist"}
- card: radio-haiti
  copy: male
  fact: Dominique took the side of the peasantry and the poor; the station championed the stories of the poor and landless.
  sources:
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "aligned himself with the peasantry and the poor"}
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "Over four decades, Dominique's station, Radio Haiti-Inter, championed the stories of the poor and landless."}
- card: radio-haiti
  copy: male
  fact: The station carried microphones into rural areas and broadcast in Creole.
  sources:
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "Because we had news in Creole, because we could bring microphones to rural areas"}
    - {title: "NEH: Voices of Change", url: "https://www.neh.gov/divisions/preservation/featured-project/tune-in-tuesdays-voices-change-preserving-radio-haiti", quote: "interviews with farmers and leaders of grassroots peasant organizations"}
- card: radio-haiti
  copy: both
  fact: Radio Haïti-Inter was the first to broadcast systematically in Creole, the country's main language.
  sources:
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "the first systematic broadcasting in Creole, the country's main language"}
    - {title: "Women's eNews (2004)", url: "https://womensenews.org/2004/05/montas-kept-risking-it-all-haiti/", quote: "The station began the first broadcasts in Creole and covered a voodoo festival that unnerved the authorities."}
- card: radio-haiti
  copy: both
  fact: On 3 April 2000 Dominique was shot dead at the station; the station guard Jean-Claude Louissaint was killed with him.
  sources:
    - {title: "CPJ (April 2000): Prominent radio journalist gunned down", url: "https://cpj.org/2000/04/prominent-radio-journalist-gunned-down/", quote: "Shortly after 6 a.m. on April 3, Dominique arrived at Radio Ha•ti Inter to host the 7 a.m. news program."}
    - {title: "Amnesty International UK: killing of Jean Dominique must not go unpunished", url: "https://www.amnesty.org.uk/press-releases/haiti-killing-jean-dominique-must-not-go-unpunished", quote: "Station guard Jean Claude Louissaint was killed with him."}
- card: radio-haiti
  copy: male
  fact: Montas kept the station going after the murder until threats closed it in 2003.
  sources:
    - {title: "Christian Science Monitor (2007)", url: "https://www.csmonitor.com/2007/0227/p20s01-wogi.html", quote: "finally shut it down for good in 2003 after her bodyguard was killed and the death threats multiplied."}
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "attacks and threats forced her to eventually shut the station down in 2003."}
- card: radio-haiti
  copy: female
  fact: In the 1980 crackdown Montas was jailed along with the station's reporters, who were tortured, and was then expelled to the United States.
  sources:
    - {title: "Women's eNews (2004)", url: "https://womensenews.org/2004/05/montas-kept-risking-it-all-haiti/", quote: "Montas was held in prison for several days, stripped to her underwear and listened to the cries of her reporters, as they were tortured in the next cell."}
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "his wife, Michèle Montas, and other Haiti Inter staff were arrested and deported by the regime"}
    - {title: "Duke Rubenstein Library blog (2015)", url: "https://blogs.library.duke.edu/rubenstein/2015/11/20/radio-haiti-you-are-the-rain-if-you-didnt-fall-we-could-not-bloom-repression-and-remembrance-on-november-28/", quote: "More than a dozen of Radio Haiti's journalists were imprisoned, tortured, and expelled."}
- card: radio-haiti
  copy: female
  fact: After the murder Montas ran the station and anchored the daily newscast.
  sources:
    - {title: "CPJ (December 2002): Gunmen attack radio station director", url: "https://cpj.org/2002/12/gunmen-attack-radio-station-director/", quote: "Montas has run the station ever since, serving as anchor of the daily newscast."}
    - {title: "Christian Science Monitor (2007)", url: "https://www.csmonitor.com/2007/0227/p20s01-wogi.html", quote: "Montas kept the station going after the murder"}
- card: radio-haiti
  copy: female
  fact: When the station returned to the air she opened with "Bonjour, Jean", her habitual greeting, and every day greeted him and counted the days since the murder.
  sources:
    - {title: "The Nation: 'Bonjour, Jean'", url: "https://www.thenation.com/?p=78618", quote: "A month after Dominique's death, Montas reopened Radio Haiti Inter, starting her first solo broadcast with her habitual greeting to Dominique, \"Bonjour, Jean.\""}
    - {title: "WNYC On the Media (26 December 2003): Sounds of Silence", url: "https://wnycstudios.org/podcasts/otm/segments/130495-sounds-of-silence", quote: "Every day I've been saying good morning to my husband, every day counting the number of days since he was assassinated."}
    - {title: "Women's eNews (2004)", url: "https://womensenews.org/2004/05/montas-kept-risking-it-all-haiti/", quote: "said good morning to her slain husband"}
- card: radio-haiti
  copy: female
  fact: On Christmas Day 2002 gunmen at her home killed her bodyguard Maxime Séide.
  sources:
    - {title: "CPJ (December 2002): Gunmen attack radio station director", url: "https://cpj.org/2002/12/gunmen-attack-radio-station-director/", quote: "The gunmen then opened fire, killing security guard Maxim Séide, 26, who died at the scene."}
    - {title: "RSF: Tentative d'assassinat de la directrice de Radio Haïti Inter", url: "https://rsf.org/fr/tentative-dassassinat-de-la-directrice-de-radio-ha%C3%AFti-inter", quote: "l'un de ses gardes du corps, Maxime Séide, a trouvé la mort"}
- card: radio-haiti
  copy: female
  fact: On 22 February 2003 Montas took the station off the air, saying "We have already lost three lives, we refuse to lose more."
  sources:
    - {title: "RSF: Radio Haïti Inter cesse d'émettre", url: "https://rsf.org/fr/radio-ha%C3%AFti-inter-cesse-d%C3%A9mettre", quote: "Nous avons déjà perdu trois vies, nous refusons d'en perdre davantage."}
    - {title: "SIP-IAPA: Haiti (2003)", url: "https://en.sipiapa.org/notas/1125926-haiti", quote: "we have already lost three lives and we refuse to lose more."}
    - {title: "CPJ: Attacks on the Press 2003, Haiti", url: "https://cpj.org/2004/03/attacks-on-the-press-2003-haiti/", quote: "stopped broadcasting indefinitely because of constant threats and harassment of its staff"}
- card: radio-haiti
  copy: female
  fact: Montas went into exile and in 2007 became spokesperson for UN Secretary-General Ban Ki-moon.
  sources:
    - {title: "UN News (January 2007)", url: "https://news.un.org/en/story/2007/01/204862", quote: "Attempts to kill Ms. Montas twice forced her into exile and cost the life of her bodyguard in 2002"}
    - {title: "Christian Science Monitor (27 February 2007)", url: "https://www.csmonitor.com/2007/0227/p20s01-wogi.html", quote: "is settling in to her new role as spokesperson for the UN secretary general."}
- card: radio-haiti
  copy: both
  fact: The station's tapes are open online at Duke.
  sources:
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "tapes, archives and other documents from Radio Haiti will be preserved at Duke and made accessible online"}
    - {title: "NEH: Voices of Change", url: "https://www.neh.gov/divisions/preservation/featured-project/tune-in-tuesdays-voices-change-preserving-radio-haiti", quote: "Duke University is preserving and making accessible the comprehensive audio and written archives of Radio Haiti"}
- card: radio-haiti
  copy: both
  fact: Jean Dominique bought the station and ran it in Port-au-Prince with Michèle Montas, his wife and co-anchor.
  sources:
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "Jean Dominique was gunned down outside the radio station he owned and ran in Port Au-Prince"}
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "Michele Montas, station co-anchor and widow of Jean Dominique"}
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "then bought the station in 1971, renaming it Radio Haïti Inter"}
- card: radio-haiti
  copy: both
  fact: Creole is the language most Haitians speak.
  sources:
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "It was the first radio station to deliver news and commentary in Creole, the language most people there speak"}
    - {title: "NEH: Voices of Change", url: "https://www.neh.gov/divisions/preservation/featured-project/tune-in-tuesdays-voices-change-preserving-radio-haiti", quote: "Haitian Creole (a language spoken by 90% of the Haitian population)"}
- card: radio-haiti
  copy: both
  fact: The Duvalier regime raided the station on 28 November 1980 and the couple went into exile.
  sources:
    - {title: "Duke University Libraries: Radio Haiti papers (collection guide)", url: "https://archives.lib.duke.edu/catalog/radiohaitipapers", quote: "until 28 November 1980, when Jean-Claude Duvalier's government cracked down on the independent press and human rights activists. Radio Haiti was ransacked, and the station's journalists were arrested then exiled."}
    - {title: "Christian Science Monitor (2007)", url: "https://www.csmonitor.com/2007/0227/p20s01-wogi.html", quote: "They fled into exile twice – in 1981 when the Duvalier regime destroyed the radio station"}
    - {title: "Duke Rubenstein Library blog (2015)", url: "https://blogs.library.duke.edu/rubenstein/2015/11/20/radio-haiti-you-are-the-rain-if-you-didnt-fall-we-could-not-bloom-repression-and-remembrance-on-november-28/", quote: "On November 28, 1980, the Duvalier regime unleashed a campaign of violent repression on the independent press and human rights activists, destroying the Radio Haiti station"}
- card: radio-haiti
  copy: both
  fact: When Jean-Claude Duvalier fled in 1986, thousands met the couple at the airport, and they rebuilt the station with the help of ordinary Haitians.
  sources:
    - {title: "Duke Rubenstein Library blog (2015)", url: "https://blogs.library.duke.edu/rubenstein/2015/11/20/radio-haiti-you-are-the-rain-if-you-didnt-fall-we-could-not-bloom-repression-and-remembrance-on-november-28/", quote: "many thousands of people – “une masse en délire,” a delirious crowd, according to the Haitian newspaper Le Nouvelliste – received them at the airport ... With assistance from the Haitian people – many of whom, though very poor, gave what little money they could afford — the station reopened in 1986."}
    - {title: "Potomitan: The Agronomist (Charlot Lucien)", url: "https://potomitan.info/vedrine/dominique.php", quote: "They returned in 1986 and, with the support of the population, rebuilt the radio and reconstructed their team."}
    - {title: "Women's eNews (2004)", url: "https://womensenews.org/2004/05/montas-kept-risking-it-all-haiti/", quote: "Much to their amazement, a crowd of about 60,000 greeted them at the airport."}
- card: radio-haiti
  copy: both
  fact: After the 1991 coup they fled again and returned in 1994.
  sources:
    - {title: "Haiti Support Group: Dominique, Jean", url: "https://haitisupportgroup.org/dominique-jean/", quote: "only to leave again in 1991 when the army seized power. He came back in 1994, after that regime fell too."}
    - {title: "Women's eNews (2004)", url: "https://womensenews.org/2004/05/montas-kept-risking-it-all-haiti/", quote: "With Aristide's restoration in 1994, Montas and her husband returned and again restored the devastated radio station."}
- card: radio-haiti
  copy: both
  fact: Who ordered Dominique's killing has never been established in court.
  sources:
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "No one knows exactly who was behind the assasination"}
    - {title: "CPJ (January 2014)", url: "https://cpj.org/2014/01/cpj-calls-on-haitian-authorities-to-act-in-dominiq/", quote: "justice will not be served until all responsible parties, from the gunmen to the mastermind, have been prosecuted"}
    - {title: "IPI (2014)", url: "https://ipi.media/amid-new-evidence-ipi-and-acm-push-for-justice-for-murdered-haiti-journalist/", quote: "recommending the indictment of nine persons accused of participating in Dominique's killing, including the alleged mastermind, former Senator Mirlande Libérus Pavert"}
