# Perspective rewrite of rhythm-and-blues (2026-11-15): shared frame (explainer, the Billboard renaming,
# the outcome), {male} Louis Jordan, {female} Ruth Brown. One entry per fact in the body.
# Quotes marked [...] are condensed. Revised 2026-11-15 by the second check (see perspective-rhythm-and-blues-check.yaml).
- card: rhythm-and-blues
  copy: both
  fact: "Rhythm and blues was the dance music of Black urban America after the Second World War"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues (Portia K. Maultsby)", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "Rhythm and blues is a form of Black dance music that has its origins in the post-World War II era (1939–1945)"}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "R&B reflected the confluence of jazz, blues, gospel, and vocal-harmony group music that took place in cities such as New York, Detroit, Chicago, Memphis, Philadelphia, and New Orleans after World War II."}
- card: rhythm-and-blues
  copy: both
  fact: "Swing orchestras shrank to small jump bands"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "Former swing band members reduced the 12–16-member ensemble to a seven- or eight-piece group consisting of rhythm section, alto and tenor sax, and trumpet."}
    - {title: "Mark Puryear, Tell It Like It Is, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "By the end of the 1930s, swing bands like Chick Webb's influenced artists such as Louis Jordan, who incorporated swing horn riffs into the jump blues."}
- card: rhythm-and-blues
  copy: both
  fact: "From the 1940s into the early 1950s the jump bands kept a boogie-woogie bass and a shuffle beat, with a saxophone out front"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "These combos, popular from the1940s through the early-1950s, retained the boogie-woogie foundation, the shuffle beat, and the riffing horn patterns from swing. [...] The up-tempo style known as \"jump blues\" is characterized by a 12-bar blues structure, boogie-woogie bass line, shuffle rhythms [...], syncopated horn riffs, solo alto saxophone"}
    - {title: "Mark Puryear, Tell It Like It Is, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "his music melded elements of swing and blues, incorporating the shuffle rhythm, boogie-woogie bass lines, and short horn patterns or riffs. [...] The saxophone was one of the first instruments to take prominence as a lead instrumental voice in R&B ensembles"}
- card: rhythm-and-blues
  copy: both
  fact: "The drums hit hard on the backbeat"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "substituted for swing rhythms and heavy backbeats on 2 and 4"}
    - {title: "Mark Puryear, Tell It Like It Is, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "R&B now encompasses a wide breadth from blues shuffles with a back beat to boogie-woogie"}
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "With her backbeat-heavy sound and saucy vocal style, the fabulous Miss Rhythm broke new ground"}
- card: rhythm-and-blues
  copy: both
  fact: "Vocal groups brought close harmony from church"
  sources:
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "After World War II, dozens of important vocal groups, starting with the \"bird groups,\" drew heavily from the gospel tradition and dominated black popular music."}
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "The lead singers of the first rhythm and blues vocal harmony groups [...] employed phrasing, shading, and timing techniques closely aligned with those of jubilee quartets."}
- card: rhythm-and-blues
  copy: both
  fact: "Billboard filed these records as \"Race\" until Jerry Wexler proposed \"rhythm and blues\"; in 1949 the chart took the new name"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "the term itself is attributed to Jerry Wexler, a writer for Billboard, who coined it in 1949 for the magazine's Black music chart to replace the term \"Race Music\""}
    - {title: "Mark Puryear, Tell It Like It Is, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "The term R&B was first used as a music category label in 1949 in the entertainment magazine Billboard. Coined by then-music journalist and later Atlantic Records executive Jerry Wexler to replace the older categories of \"race music\" or \"race records\""}
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "It was 1949 when Billboard changed the name of its \"Race Music\" category to \"Rhythm and Blues\""}
- card: rhythm-and-blues
  copy: both
  fact: "Wexler was a writer at Billboard and proposed the name for its Black music chart"
  sources:
    - {title: "Associated Press obituary via Taipei Times (2008)", url: "https://www.taipeitimes.com/News/world/archives/2008/08/17/2003420595", quote: "Wexler landed a job writing for Billboard magazine in the late 1940s [...] There he coined the term \"rhythm and blues\" for the magazine's black music charts; previously, they were listed under \"race records.\""}
    - {title: "Contemporary Authors, via Encyclopedia.com: Wexler, Jerry 1917-2008", url: "https://www.encyclopedia.com/arts/educational-magazines/wexler-jerry-1917-2008-gerald-wexler", quote: "Born January 10, 1917 [...] he coined that phrase as early as 1949 or 1950. Wexler was working as a writer for the trade magazine Billboard at the time"}
    - {title: "Rock & Roll Hall of Fame: Jerry Wexler", url: "https://www.rockhall.com/inductees/jerry-wexler", quote: "As a music reporter, he also coined the term \"rhythm and blues.\""}
- card: rhythm-and-blues
  copy: male
  fact: "Louis Jordan was born in 1908 in Brinkley, Arkansas, the son of a bandleader"
  sources:
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "Louis Jordan was born on July 8, 1908, in Brinkley (Monroe County). His father, Dardanelle (Yell County) native James Aaron Jordan, led the Brinkley Brass Band"}
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "Born in tiny Brinkley, Ark. in 1908, Jordan learned to play the saxophone from his father, a bandleader for a leading vaudeville minstrel group called the Rabbit's Foot Company."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "Born on July 8, 1908, in Brinkley, Arkansas, Jordan was the son of Jim Jordan, a bandleader and music teacher."}
- card: rhythm-and-blues
  copy: male
  fact: "He started with the Rabbit Foot Minstrels"
  sources:
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "After playing with the Rabbit Foot Minstrels as a youth and attending college as a music major, Jordan moved to Philadelphia, eventually joining up with bandleader Chick Webb."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "His first professional engagement was with Fat Chappelle's Rabbit Foot Minstrels, playing clarinet and dancing throughout the South."}
- card: rhythm-and-blues
  copy: male
  fact: "He sang and played saxophone in Chick Webb's band"
  sources:
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "His most important job, though, came in 1936 when he joined drummer Chick Webb's orchestra [...] Webb hired Jordan as a singer, sideman, and announcer."}
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "In 1936, he joined nationally popular drummer Chick Webb's Savoy Ballroom Band."}
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "One of the most popular and successful bandleaders of his day, the saxophonist and singer broke from the mainstream jazz of the Swing Era"}
- card: rhythm-and-blues
  copy: male
  fact: "Webb fired him in 1938 for trying to take Ella Fitzgerald into a band of his own"
  sources:
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "In 1938, Jordan was fired by Webb for trying to convince Fitzgerald and others to join his new band."}
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "Jordan performed with Webb's band for two years, but when he tried to leave the group, with singer Ella Fitzgerald and two others in tow, Webb fired him."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "In the summer of 1938, Jordan left Webb's orchestra to form his own, nine-piece, band"}
- card: rhythm-and-blues
  copy: male
  fact: "His Tympany Five was a small band"
  sources:
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "The small size of Jordan's Tympany Five made it innovative structurally and musically in the Big Band era."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "That December, after changing the name of his band to the Tympany Five, Jordan reduced the size of the unit to six members (later it would number seven or eight)."}
- card: rhythm-and-blues
  copy: male
  fact: "The Tympany Five recorded \"Caldonia\" and \"Ain't Nobody Here but Us Chickens\""
  sources:
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "Following his 1945 million-seller \"Caldonia,\" Jordan and the Tympany Five continued to score hits, among them [...] \"Nobody Here But Us Chickens,\""}
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "up-tempo songs like \"Choo Choo Ch'Boogie\" (number one for eighteen weeks) and \"Ain't Nobody Here But Us Chickens\" (number one for seventeen weeks)"}
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "Jazz musician Louis Jordan and His Tympany Five [...] provided the model for this rhythm and blues combo style heard in \"Caldonia\" (1945)."}
- card: rhythm-and-blues
  copy: male
  fact: "His records topped the charts for 113 weeks in all"
  sources:
    - {title: "Rock & Roll Hall of Fame: Louis Jordan", url: "https://www.rockhall.com/inductees/louis-jordan", quote: "Louis Jordan topped the R&B charts for a total of one hundred thirteen weeks, an unheard of accomplishment."}
    - {title: "Blues Foundation, Blues Hall of Fame: Louis Jordan", url: "https://www.blues.org/award-search/louis-jordan-was-the-most-popula", quote: "His 18 No. 1 hits on the race and R&B charts spent a total of 113 weeks in the top slot, almost twice as many weeks as any other artist in the history of rhythm & blues, according to Joel Whitburn's Billboard books."}
- card: rhythm-and-blues
  copy: male
  fact: "Rock and roll pushed him aside in the 1950s"
  sources:
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "By the time he returned in early 1953 with his Tympany Five, rock 'n' roll had captured the world's attention, and Jordan's jumping R&B became a thing of the past."}
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "The sounds Jordan pioneered conspired to slow his record sales as R&B and rock and roll emerged."}
- card: rhythm-and-blues
  copy: male
  fact: "Chuck Berry, James Brown and Ray Charles named him as an influence"
  sources:
    - {title: "NPR: Louis Jordan, Jukebox King (2008)", url: "https://www.npr.org/2008/03/04/87905064/louis-jordan-jukebox-king", quote: "Chuck Berry, James Brown and Ray Charles all cited Jordan's influence on their work."}
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "A host of prominent musicians claim his influence, including Ray Charles, James Brown, Bo Diddley, and Chuck Berry."}
- card: rhythm-and-blues
  copy: male
  fact: "He died in Los Angeles in 1975"
  sources:
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "on February 4, 1975, he died in Los Angeles, California."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Jordan, Louis", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-jordan", quote: "he returned home to Los Angeles, where he died on February 4, 1975."}
- card: rhythm-and-blues
  copy: male
  fact: "In 1987 he entered the Rock and Roll Hall of Fame"
  sources:
    - {title: "Rock & Roll Hall of Fame: Louis Jordan", url: "https://www.rockhall.com/inductees/louis-jordan", quote: "Inducted: 1987 Category: Musical Influence"}
    - {title: "Encyclopedia of Arkansas: Louis Thomas Jordan (1908-1975)", url: "https://encyclopediaofarkansas.net/entries/louis-thomas-jordan-1685/", quote: "Jordan was inducted into the Rock and Roll Hall of Fame in 1987"}
- card: rhythm-and-blues
  copy: female
  fact: "Ruth Brown was born in Portsmouth, Virginia, in 1928"
  sources:
    - {title: "Contemporary Musicians, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Born Ruth Weston in Portsmouth, Virginia, in 1928, Ruth grew up the oldest of seven children in a strict church-going household."}
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Brown was born in Portsmouth, Virginia, on January 12, 1928."}
- card: rhythm-and-blues
  copy: female
  fact: "She sang in her father's church choir"
  sources:
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "She started singing at four years old in her father's church choir in Portsmouth, Va."}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Her father was a choir director with little patience or appreciation for \"the devil's music,\" as he called the blues. She sang at church functions throughout her childhood"}
- card: rhythm-and-blues
  copy: female
  fact: "A car crash on her way to join Atlantic in New York kept her in hospital for almost a year"
  sources:
    - {title: "Contemporary Musicians / Contemporary Black Biography, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Brown was on her way to New York to begin recording when she was involved in a car accident that left her hospitalized for close to a year."}
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "Soon after, Atlantic Records offered her contract and a debut concert at the Apollo in New York City. [...] A serious auto accident kept her from performing that show, and she spent a year in the hospital"}
- card: rhythm-and-blues
  copy: female
  fact: "Her first single, \"So Long\", came out on Atlantic in 1949"
  sources:
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "In 1949 she recorded \"So Long\" for Atlantic, which went to No. 4 on the R&B chart."}
    - {title: "Chicago Sun-Times: Ruth Brown's Rainbow (2006)", url: "https://chicago.suntimes.com/news/2006/11/24/18584697/ruth-brown-s-rainbow", quote: "I played the first track Brown ever recorded: \"So Long,\" (May 25, 1949, Atlantic) with Amos Milburn on piano."}
- card: rhythm-and-blues
  copy: female
  fact: "\"Teardrops from My Eyes\" followed in 1950"
  sources:
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "Her second hit, 1950's \"Teardrops From My Eyes,\" went to No. 1."}
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "\"Teardrops from My Eyes\" was released in 1950."}
- card: rhythm-and-blues
  copy: female
  fact: "Her hits made Atlantic known as \"The House that Ruth Built\""
  sources:
    - {title: "Rock & Roll Hall of Fame: Ruth Brown", url: "https://www.rockhall.com/inductees/ruth-brown", quote: "They called Atlantic 'the house that Ruth built' for good reason—her two dozen hits put the budding company on the map."}
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "Atlantic soon became known as \"The House that Ruth Built.\""}
    - {title: "Western News, Western University: Researcher explores label exploitation of R&B artists (2015)", url: "https://news.westernu.ca/2015/11/professor-explores-label-exploitation-of-a-generation-of-rb-artists/", quote: "Because of Brown's success, Atlantic [...] was known as \"the house that Ruth built.\""}
- card: rhythm-and-blues
  copy: female
  fact: "Yet she saw no royalties"
  sources:
    - {title: "Western News, Western University: Researcher explores label exploitation of R&B artists (2015)", url: "https://news.westernu.ca/2015/11/professor-explores-label-exploitation-of-a-generation-of-rb-artists/", quote: "Ruth Brown, once known as the 'Queen of R&B,' signed on with Atlantic Records in 1949, but would not see a dime in royalties from the label until the 1980s."}
    - {title: "Chicago Sun-Times: Ruth Brown's Rainbow (2006)", url: "https://chicago.suntimes.com/news/2006/11/24/18584697/ruth-brown-s-rainbow", quote: "When they met in 1983 Brown told Begle that despite the fact the market was full of Ruth Brown reissues and compliations, she had not received a royalty check since the early 1960s."}
- card: rhythm-and-blues
  copy: female
  fact: "She left Atlantic in the early 1960s"
  sources:
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Brown left Atlantic Records in the early 1960s after she claimed the label started cheating her."}
    - {title: "Chicago Sun-Times: Ruth Brown's Rainbow (2006)", url: "https://chicago.suntimes.com/news/2006/11/24/18584697/ruth-brown-s-rainbow", quote: "Brown was the most commercially successful act at Atlantic between 1949 and 1962"}
- card: rhythm-and-blues
  copy: female
  fact: "She then drove a bus and cleaned houses"
  sources:
    - {title: "Contemporary Musicians, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Brown lived on Long Island, New York, where she worked as a bus driver, a teacher for the mentally retarded, and a house cleaner"}
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "After leaving the record label, Brown experienced more misfortune. She held a series of low-paying jobs as a floor scrubber and bus driver."}
- card: rhythm-and-blues
  copy: female
  fact: "The label said she owed it money"
  sources:
    - {title: "Contemporary Black Biography, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Atlantic Records, which had been dubbed The House that Ruth Built, claimed she owed them $30,000 in studio fees."}
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Atlantic waived unrecouped debts held by Brown and thirty-five other musicians of her era"}
- card: rhythm-and-blues
  copy: female
  fact: "She fought back; Atlantic wrote off her debts and those of other artists of her era and paid back royalties"
  sources:
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Because she spoke out, Atlantic waived unrecouped debts held by Brown and thirty-five other musicians of her era and agreed to pay twenty years' worth of retroactive royalties."}
    - {title: "Chicago Sun-Times: Ruth Brown's Rainbow (2006)", url: "https://chicago.suntimes.com/news/2006/11/24/18584697/ruth-brown-s-rainbow", quote: "Atlantic pledged to erase all negative balances claimed against older artists and recalcuate royalties from 1970 to the present."}
    - {title: "Western News, Western University: Researcher explores label exploitation of R&B artists (2015)", url: "https://news.westernu.ca/2015/11/professor-explores-label-exploitation-of-a-generation-of-rb-artists/", quote: "Atlantic also renegotiated contracts after the fact, and wiped the royalty debt of its artists, pushing other major record labels to follow suit."}
- card: rhythm-and-blues
  copy: female
  fact: "Atlantic helped found the Rhythm and Blues Foundation"
  sources:
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Atlantic also contributed almost $2 million to start the Rhythm and Blues Foundation, which pushed for royalty reform and distributed millions of dollars to musicians in need."}
    - {title: "Contemporary Black Biography, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Atlantic also contributed $1.5 million to start the Rhythm & Blues Foundation, an organization dedicated to helping ailing and needy entertainers from the previous decades."}
    - {title: "Western News, Western University: Researcher explores label exploitation of R&B artists (2015)", url: "https://news.westernu.ca/2015/11/professor-explores-label-exploitation-of-a-generation-of-rb-artists/", quote: "the company paid more than $2 million to form the Rhythm and Blues Foundation, which ever since, has doled out money to aging artists in need."}
- card: rhythm-and-blues
  copy: female
  fact: "On Broadway she won a Tony for Black and Blue"
  sources:
    - {title: "NPR: Forebears, Ruth Brown, The Fabulous Miss Rhythm (2017)", url: "https://text.npr.org/559070707", quote: "a Tony-award winning performance in Black And Blue"}
    - {title: "Contemporary Musicians, via Encyclopedia.com: Brown, Ruth", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "Her performance in Broadway's Black and Blue won her a Tony Award for Best Actress in a Musical"}
- card: rhythm-and-blues
  copy: both
  fact: "By the mid-1960s R&B had helped give rise to soul"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "In the mid-1960s, the combo style transformed into a new sound labeled \"soul.\""}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "By 1964 black popular music had acquired a new name: soul music."}
- card: rhythm-and-blues
  copy: both
  fact: "Out of R&B, the blues and gospel came rock and roll"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "Rock 'n' Roll was the inevitable clash of African American rhythm and blues with elements of swing, boogie-woogie, urban blues"}
    - {title: "Case Western Reserve University, Encyclopedia of Cleveland History: Rock & Roll", url: "https://case.edu/ech/articles/r/rock-roll", quote: "Yet few would disagree that it emanates primarily from a handful of traditionally Black styles: blues, jazz, and gospel."}
- card: rhythm-and-blues
