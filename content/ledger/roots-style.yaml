        research:
          - type: "analysis"
            dimensions: ["performance"]
            title: "Carnegie Hall, Timeline of African American Music: Free Jazz/Avant-Garde"
            url: "https://timeline.carnegiehall.org/genres/free-jazz-avant-garde"
            quote: "Bebop and its spinoffs of the 1940s and ’50s took jazz to places that had been unimaginable to earlier generations of fans. During the following decades, the music continued to stretch limits."
