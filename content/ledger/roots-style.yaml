styles:
  - id: "bebop"
    from:
      - to: "card:jazz"
        kind: "style"
        scope: "career"
        how: "Bebop grew out of swing-era jazz: it kept the riffs, the 4/4 swing time and the standard tunes of the Kansas City and big-band players, then loaded the chords with higher intervals and moved the music from the dance hall to the small combo."
        dimensions: ["rhythm", "harmony-form", "performance", "image"]
        research:
          - type: "analysis"
            dimensions: ["rhythm", "performance", "image"]
            title: "Carnegie Hall, Timeline of African American Music: Bebop"
            url: "https://timeline.carnegiehall.org/genres/bebop"
            quote: "Bebop is a jazz style that evolved during the 1940s, directly out of and as a reaction to the restrictions of the swing bands of the 1930s. Drawing upon some of the riffs characteristic of swing"
          - type: "analysis"
            dimensions: ["performance"]
            title: "Carnegie Hall, Timeline of African American Music: Bebop"
            url: "https://timeline.carnegiehall.org/genres/bebop"
            quote: "many swing musicians of the 1940s retreated to smaller combos that were easier to organize and, likewise, provided more freedom for individual artists to express themselves."
          - type: "analysis"
            dimensions: ["harmony-form", "rhythm"]
            title: "Library of Congress, National Recording Registry: “Ko Ko” — Charlie Parker (essay by Ed Komara)"
            url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/ko-ko.pdf"
            quote: "They show him making use of these “higher intervals,” such as the 9th, 11th and 13th scale tones in addition to the more often used root (1st), 3rd, 5th and 7th scale tones. But playing those tones in an even 8/8 meter sometimes clashes with the 4/4 swing time."
          - type: "analysis"
            dimensions: ["performance"]
            title: "Library of Congress, National Recording Registry: “Ko Ko” — Charlie Parker (essay by Ed Komara)"
            url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/ko-ko.pdf"
            quote: "“Ko Ko” was Charlie Parker’s signature jazz piece, conceived during his apprenticeship with Kansas City bands and hatched in the after-hours clubs of New York City."
        check:
          verdict: "confirmed"
          note: "Every quote was found on the reopened page and supports the link's text, how and dimensions."
          quotes:
            - url: "https://timeline.carnegiehall.org/genres/bebop"
              quote: "Bebop is a jazz style that evolved during the 1940s, directly out of and as a reaction to the restrictions of the swing bands of the 1930s. Drawing upon some of the riffs characteristic of swing"
            - url: "https://timeline.carnegiehall.org/genres/bebop"
              quote: "many swing musicians of the 1940s retreated to smaller combos that were easier to organize and, likewise, provided more freedom for individual artists to express themselves."
  - id: "free-jazz"
    from:
      - to: "style:bebop"
        kind: "style"
        scope: "career"
