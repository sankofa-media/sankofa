# Second, independent check (2026-11-14) of content/ledger/expand-c12.yaml.
# Every source was re-downloaded and each quote below was matched against the fetched text.
# Britannica blocks bots (Cloudflare): read via web.archive.org snapshots of Oct-Nov 2026.
# openedition.org (Ramsey) and discoverpuertorico.com read via web.archive.org snapshots.
# verdict: confirmed | corrected (card wording or sources changed) | refuted | unconfirmed (removed from the card).
# Independence rulings:
#  - The two argentina.gob.ar notes (Ministry of Culture monument note, banknote note) = one source; Infobae, Mindef, BCRA and InfoLEG are each independent.
#  - UNESCO's Villa Mella text derives from the nomination prepared by the Museo del Hombre Dominicano team (the MHD page says so; UNESCO credits MHD), so UNESCO + MHD = ONE source. Independent: Tejeda Ortiz (Acento), Afropop Worldwide, Diario Libre, Historia General del Pueblo Dominicano.
#  - Murphy's Britannica article and Murphy's Encyclopedia of Religion article = same author; used together only where a third, independent source (the Supreme Court opinion) agrees. The Supreme Court opinion cites the Encyclopedia of Religion in places, so it is used for facts it states on the record (persecution, exiles, ordinances).
#  - NATT blog (Lovell Francis) and the NATT exhibition PDF = one source (same publisher); Weiss, NALIS and Britannica are independent.
#  - RCI's two pages = one source; Outremers360's two pages = one source; Outremers360's 2026 text repeats Le Routard's wording on St Lawrence and 1916, so Outremers360 (2026) + Le Routard = one source; Outremers360 (2024, Eline Ulysse) is a different text.
#  - Discover Puerto Rico (official destination organisation) is used only where Fiet or another source agrees.
entries:
# ---------------- remedios-del-valle ----------------
- card: remedios-del-valle
  fact: "María Remedios del Valle was a Black woman born in Buenos Aires (1766 per the Ministry of Culture; 1766–67 per other accounts)"
  verdict: confirmed
  sources:
    - {title: "Argentina.gob.ar (Ministerio de Cultura): Un monumento para María Remedios del Valle (2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "Nació en Buenos Aires en 1766. De origen afrodescendiente"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "nació en la ciudad de Buenos Aires entre 1766 y 1767"}
  note: "Mindef also: 'nacida en Buenos Aires ... era negra'. Year kept as a dispute."
- card: remedios-del-valle
  fact: "In 1810 she followed the Army of the North with her husband and two sons, one of them adopted"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "se incorporó al ejército auxiliar para las provincias del norte el 6 de julio de 1810, con su marido y dos hijos, uno adoptado"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "en el que estaban enrolados su marido y sus dos hijos, uno de ellos adoptado, se les unió"}
  note: ""
- card: remedios-del-valle
  fact: "She tended the wounded and fought at Tucumán and Salta and in the 1813 defeats at Vilcapugio and Ayohuma"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Participó en las acciones de Desaguadero, Tucumán, Salta, Vilcapugio y Ayohuma como combatiente"}
    - {title: "Argentina.gob.ar (Ministerio de Cultura): Un monumento para María Remedios del Valle (2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "en las victorias de Tucumán y Salta (1812 y 1813), y en las derrotas de Vilcapugio y Ayohuma (1813)"}
  note: "Tending the wounded: argmon 'cuidado y atención de soldados'; Mindef 'servir en los hospitales de sangre'."
- card: remedios-del-valle
  fact: "Manuel Belgrano gave her the rank of captain"
  verdict: corrected
  sources:
    - {title: "Argentina.gob.ar (Ministerio de Cultura): Un monumento para María Remedios del Valle (2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "Belgrano le confirió el grado de capitana del Ejército"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Su admiración por su valentía lo llevó a nombrarla capitana del ejército"}
    - {title: "Ley 26.852, InfoLEG (archived 2026)", url: "http://web.archive.org/web/20260922040003/https://servicios.infoleg.gob.ar/infolegInternet/anexos/210000-214999/214825/norma.htm", quote: "a quien el General Manuel Belgrano le confirió el grado de Capitana por su arrojo y valor en el campo de batalla"}
  note: "Ledger's two argentina.gob.ar pages are one publisher; Infobae and the text of Law 26,852 added. Card unchanged."
- card: remedios-del-valle
  fact: "Taken prisoner after Ayohuma, she helped patriot prisoners escape and was flogged in public for nine days"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Aprovechó para ayudar a huir a varios jefes patriotas y fue condenada a la pena de azotes. Durante nueve días fue flagelada públicamente"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Asistió a los maltrechos prisioneros patriotas, y a algunos los ayudó a escaparse. Fue castigada ... a ser azotada durante nueve días"}
  note: ""
- card: remedios-del-valle
  fact: "She escaped and returned to the army"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "logró huir y volvió al ejército para pelear o para servir en los hospitales de sangre"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Cuando logró fugarse, estuvo en las filas de Martín Miguel de Güemes"}
  note: ""
- card: remedios-del-valle
  fact: "The war took her husband and both sons"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Había perdido marido e hijos en la guerra"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Su esposo y sus dos hijos murieron en combate"}
  note: ""
- card: remedios-del-valle
  fact: "Back in Buenos Aires she lived by begging, until General Juan José Viamonte, who had known her on campaign, spoke for her"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "El general Juan José Viamonte, que la conoció durante las campañas de la independencia, informó favorablemente"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Juan José Viamonte, fue quien la descubrió en la ciudad de Buenos Aires mendigando"}
  note: "Begging: Mindef 'tuvo que recurrir a la mendicidad'."
- card: remedios-del-valle
  fact: "She was granted a captain's pay, then the rank of sergeant major of cavalry"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "con el sueldo de capitán de infantería. En 1829 fue ascendida a “sargenta mayor de caballería”"}
    - {title: "Argentina.gob.ar (Ministerio de Cultura): Un monumento para María Remedios del Valle (2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "le concedió el cargo de sargento mayor de caballería en 1829"}
  note: "Infobae also: 'se le otorgó un sueldo correspondiente al de capitán de infantería'."
- card: remedios-del-valle
  fact: "She took the name Remedios Rosas in gratitude to the governor Juan Manuel de Rosas"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Rosas la destinó a la plana mayor activa, por lo cual ella, en agradecimiento, tomó el nombre de Remedios Rosas"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "En agradecimiento, ella le pidió permiso y se cambió el apellido, incorporando el de Rosas"}
  note: ""
- card: remedios-del-valle
  fact: "An army register of 8 November 1847 notes her death"
  verdict: confirmed
  sources:
    - {title: "Ministerio de Defensa, Las mujeres y sus luchas en la historia argentina (2006), archived PDF", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "En la del 8 de noviembre de 1847 una nota reza: “Baja. El mayor de caballería Da. Remedios Rosas falleció.”"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Su necrológica se resumió en un registro del ejército, fechado el 8 de noviembre de 1847"}
  note: ""
- card: remedios-del-valle
  fact: "By Law 26,852 Argentina keeps 8 November as the National Day of Afro-Argentines in her honour"
  verdict: corrected
  sources:
    - {title: "Ley 26.852, InfoLEG (archived 2026)", url: "http://web.archive.org/web/20260922040003/https://servicios.infoleg.gob.ar/infolegInternet/anexos/210000-214999/214825/norma.htm", quote: "Institúyese el día 8 de noviembre como “Día Nacional de los/as afroargentinos/as y de la cultura afro” en conmemoración de María Remedios del Valle"}
    - {title: "Adrián Pignatelli, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "En su homenaje, desde 2013, el 8 de noviembre es el día del afroargentino y de la cultura afro"}
  note: "The two argentina.gob.ar notes are one publisher; the law's own text (InfoLEG, archived; the live normativa page returns HTTP 500) added as primary source for the number."
- card: remedios-del-valle
  fact: "Her portrait appears on banknotes beside Belgrano's"
  verdict: confirmed
  sources:
    - {title: "Argentina.gob.ar: Heroínas y héroes ... vuelven a ilustrar los billetes (2022)", url: "https://www.argentina.gob.ar/noticias/heroinas-y-heroes-de-nuestra-historia-vuelven-ilustrar-los-billetes-de-pesos-argentinos", quote: "María Remedios del Valle y Manuel Belgrano ($500)"}
    - {title: "BCRA: nuevos billetes de 10.000 y 20.000 pesos (archived 2025)", url: "https://web.archive.org/web/20250611160705/https://www.bcra.gob.ar/Noticias/nuevos-billetes-10-y-20mil.asp", quote: "El billete de $10.000 tendrá las imágenes de Manuel Belgrano y de María Remedios del Valle"}
  note: "Planned $500 note (2022) and issued $10,000 note (BCRA); both pair her with Belgrano."
# ---------------- mary-seacole ----------------
- card: mary-seacole
  fact: "Mary Seacole was born in Kingston, Jamaica, in 1805 to a Scottish soldier and a free Black Jamaican 'doctress' who cared for invalids at her boarding house"
  verdict: confirmed
  sources:
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "Mary Seacole (born 1805, Kingston, Jamaica—died May 14, 1881, London"}
    - {title: "Mary Seacole, Wonderful Adventures (1857), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/23031/pg23031.txt", quote: "I was born in the town of Kingston, in the island of Jamaica"}
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "born Mary Jane Grant in Jamaica in 1805 to a Scottish army father and a Creole mother"}
  note: "Mother's boarding house: Britannica 'provided care for invalids at her boardinghouse'; memoir 'My mother kept a boarding-house in Kingston, and was ... an admirable doctress'."
- card: mary-seacole
  fact: "She learned Creole herbal healing from her mother and called herself a 'doctress'"
  verdict: confirmed
  sources:
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "“doctress”, a word she used to describe the traditional Creole herbal healing work she learned from her mother in Jamaica"}
    - {title: "Mary Seacole, Wonderful Adventures (1857), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/23031/pg23031.txt", quote: "the ambition to become a doctress early took firm root in my mind"}
  note: ""
- card: mary-seacole
  fact: "She nursed yellow fever patients in Jamaica and cholera victims in Panama"
  verdict: confirmed
  sources:
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "she gained further nursing experience during a cholera epidemic in Panama , and, after returning to Jamaica , she cared for yellow fever victims"}
    - {title: "Mary Seacole, Wonderful Adventures (1857), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/23031/pg23031.txt", quote: "the yellow fever never made a more determined effort to exterminate the English in Jamaica than it did in that dreadful year"}
  note: "London Museum also: cholera outbreak at Cruces (New Granada, now Panama)."
- card: mary-seacole
  fact: "In 1854, amid reports of soldiers left without care in the Crimean War, she offered to serve as an army nurse and was refused, which she attributed to prejudice"
  verdict: confirmed
  sources:
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "Seacole was in London in 1854 when reports of the lack of necessities and breakdown of nursing care for soldiers in the Crimean War began to be made public. Despite her experience, her offers to serve as an army nurse were refused, and she attributed her rejection to racial prejudice"}
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "her attempt to apply in-person at the War Office to serve as a war nurse was unsuccessful"}
  note: "Reports also in the memoir: 'Then we knew that the hospitals were full to suffocation'. LM quotes her question about 'duskier skin'."
- card: mary-seacole
  fact: "She resolved to go 'upon my own responsibility and at my own cost'"
  verdict: confirmed
  sources:
    - {title: "Mary Seacole, Wonderful Adventures (1857), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/23031/pg23031.txt", quote: "If in no other way, then would I upon my own responsibility and at my own cost"}
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Undeterred, Seacole funded her own trip to the Crimea in 1855"}
  note: ""
- card: mary-seacole
  fact: "In 1855, with Thomas Day, a relative of her late husband, she set up the British Hotel near Balaclava, selling food, supplies and medicines to the army"
  verdict: confirmed
  sources:
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "She and Thomas Day, a relative of her late husband, set up the so-called British Hotel near where fighting had been in Balaclava"}
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "In 1855, with the help of a relative of her husband, she went to Crimea as a sutler, setting up the British Hotel to sell food, supplies, and medicines to the troops"}
  note: ""
- card: mary-seacole
  fact: "She went to the front to tend the wounded, who called her 'Mother Seacole'"
  verdict: confirmed
  sources:
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "she also visited the battlefront to care for wounded soldiers ... “appreciate[d] ‘Mother’ Seacole, as she is affectionately called”"}
    - {title: "Mary Seacole, Wonderful Adventures (1857), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/23031/pg23031.txt", quote: "There were few officers of the 97th to whom Mother Seacole was not well known"}
  note: "Britannica: 'a familiar figure at the transfer points for casualties from the front'."
- card: mary-seacole
  fact: "Peace left her with unsold stock and debts, and she was declared bankrupt"
  verdict: confirmed
  sources:
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Seacole and Day were left with leftover stocks of food and equipment – and outstanding debts. Soon after Seacole returned to England, she was declared bankrupt"}
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "At the war’s end she returned to England destitute and was declared bankrupt"}
  note: ""
- card: mary-seacole
  fact: "Her memoir Wonderful Adventures of Mrs Seacole in Many Lands came out in 1857 and became a bestseller"
  verdict: confirmed
  sources:
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "In 1857 her autobiography, Wonderful Adventures of Mrs. Seacole in Many Lands , was published and became a best seller"}
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Still, her Wonderful Adventures was a bestseller"}
  note: ""
- card: mary-seacole
  fact: "She died in London in 1881, was forgotten, and is now widely recognised again; a statue stands at St Thomas' Hospital"
  verdict: corrected
  sources:
    - {title: "London Museum: Mary Seacole", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Seacole died in London in 1881 ... Though well-loved in her time, Seacole was lost to history after her death ... A statue commemorating her stands outside St Thomas’ Hospital in Lambeth"}
    - {title: "Britannica: Mary Seacole (archived 31 Oct 2026)", url: "http://web.archive.org/web/20261031001736/https://www.britannica.com/biography/Mary-Seacole", quote: "After her death she fell into obscurity but in 2004 took first place in the 100 Great Black Britons poll"}
    - {title: "Mary Seacole Trust", url: "https://www.maryseacoletrust.org.uk/", quote: "a statue of Mary was unveiled at St Thomas’ Hospital in London, opposite the Houses of Parliament, in June 2016"}
  note: "Ledger had the statue on the London Museum only; Mary Seacole Trust added as second source for the 'further' item."
# ---------------- haitian-vodou ----------------
- card: haitian-vodou
  fact: "Vodou grew up in colonial Saint-Domingue among enslaved people from Dahomey and other African lands, under Catholic pressure"
  verdict: confirmed
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou (archived 7 Nov 2026)", url: "http://web.archive.org/web/20261107232449/https://www.britannica.com/topic/Vodou", quote: "by the descendants of the Dahomean , Kongo , Yoruba , and other ethnic groups who had been enslaved and transported to colonial Saint-Domingue ... and partly Christianized by Roman Catholic missionaries"}
    - {title: "Encyclopedia of Occultism and Parapsychology: Voudou, Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "The dominant group came from Dahomey ... The plantation owners in Haiti attempted to impose Catholicism on the slave population"}
  note: "Britannica puts the Christianising in the 16th and 17th centuries; card's start year 1700 is an approximation, not stated in the body."
- card: haitian-vodou
  fact: "Its name comes from a Fon/Dahomean word for spirit or god"
  verdict: confirmed
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou (archived 7 Nov 2026)", url: "http://web.archive.org/web/20261107232449/https://www.britannica.com/topic/Vodou", quote: "The word Vodou means “spirit” or “deity” in the Fon language of the African kingdom of Dahomey"}
    - {title: "Leslie G. Desmangles, The Faces of the Gods (1992), excerpt on Corbett's Haiti list (archived)", url: "https://web.archive.org/web/20210301160256/http://www.hartford-hwp.com/archives/43a/123.html", quote: "a distortion of the Dahomean (or Beninois) word vodu (meaning god or spirit )"}
  note: ""
- card: haitian-vodou
  fact: "Believers hold that God rules the world with the help of the lwa, served with prayers, songs and offerings"
  verdict: confirmed
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou (archived 7 Nov 2026)", url: "http://web.archive.org/web/20261107232449/https://www.britannica.com/topic/Vodou", quote: "the spirits were made by God to help him govern humanity and the natural world ... to offer prayers and perform various devotional rites"}
