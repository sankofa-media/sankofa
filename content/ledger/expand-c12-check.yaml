# ---------------- merikins ----------------
- card: merikins
  fact: "When the British fleet entered Chesapeake Bay in the War of 1812, enslaved people from Maryland and Virginia, later Georgia, escaped to its ships"
  verdict: confirmed
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "Recruited by the British first in Maryland and Virginia and later in Georgia ... men, women and children rowed out perilously into the Chesapeake Bay by canoe to reach the squadron"}
    - {title: "NALIS: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "They were recruited mainly from Chesapeake Bay, shores of Virginia and Maryland, as well as from the coast of Georgia"}
  note: ""
- card: merikins
  fact: "Many men enlisted in the Corps of Colonial Marines, six companies who fought against their former masters"
  verdict: confirmed
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "the six Black companies became the 3rd Battalion Colonial Marines ... took up arms against their ex-masters as a disciplined military unit"}
    - {title: "NALIS: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "they were recruited into a total of six (6) military companies"}
  note: ""
- card: merikins
  fact: "After the war they were garrisoned in Bermuda and refused transfer to the West India Regiments, holding Britain to the promise of free settlement"
  verdict: confirmed
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "garrisoned in Bermuda on Ireland Island ... When transfer to the West India Regiments was proposed and the men again rejected the idea ... Their persistent intransigence finally led the British government to offer to place them in Trinidad as independent farmers"}
    - {title: "NATT: Our African Legacy, Roots and Routes", url: "https://h.natt.gov.tt/sites/default/files/Our_African_Legacy_Roots_and_Routes.pdf", quote: "the soldiers were temporarily settled in the garrison at Bermuda where they were offered a choice of either serving in the West India Regiment or being settled as free men in a British colony. Vehemently refusing the former"}
  note: "The 'bargain': Cochrane's proclamation of 2 April 1814, printed by NALIS: 'with a view of entering into His Majesty’s Service, or of being received as Free Settlers into some of His Majesty’s Colonies'."
- card: merikins
  fact: "In 1815 and 1816 more than seven hundred men, women and children were landed in Trinidad"
  verdict: confirmed
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "In 1815 and 1816 Trinidad welcomed over seven hundred free Black American settlers"}
    - {title: "Lovell Francis, National Archives of Trinidad and Tobago blog (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "in the years 1815-1816, 544 men, 83 women and 85 children of African origin arrived as freed people"}
  note: "NATT PDF ('over 700') is the same publisher as the NATT blog."
- card: merikins
  fact: "Most people of African descent in Trinidad stayed enslaved until 1838"
  verdict: corrected
  sources:
    - {title: "Lovell Francis, National Archives of Trinidad and Tobago blog (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "the vast majority of persons of their hue and ethnicity were still uncomfortably ensconced in chattel servitude until 1838"}
    - {title: "Britannica: Trinidad and Tobago, History (archived 5 Nov 2026)", url: "http://web.archive.org/web/20261105024335/https://www.britannica.com/place/Trinidad-and-Tobago/History", quote: "Slavery was abolished in two stages between 1834 and 1838"}
  note: "Ledger's two NATT items are one publisher; Britannica added."
- card: merikins
  fact: "They were settled around the mission of Savanna Grande, now Princes Town, each company in its own village; the area is still called the Company Villages"
  verdict: confirmed
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "around the Mission of Savanna Grande , now Princes Town , mostly within the area known since then as The Company Villages"}
    - {title: "NALIS: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "They were settled in the South of Trinidad, in the Naparima District/Savanna Grande (now Princes Town). Many of the “Merikin” Company Villages have completely changed their original names"}
  note: "Each company its own village: NATT PDF 'The village names were based on the naval companies'; Weiss names Fourth, Fifth, Sixth Company villages."
- card: merikins
  fact: "The land was forested"
  verdict: confirmed
  sources:
    - {title: "Lovell Francis, National Archives of Trinidad and Tobago blog (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "carving thriving communities out of heavily forested land"}
    - {title: "NALIS: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "It is famous for its mixed farming and large virgin forest areas such as Cata Hill"}
  note: ""
- card: merikins
  fact: "They were called Merikins, a Creole rendering of 'American'"
  verdict: confirmed
  sources:
    - {title: "Lovell Francis, National Archives of Trinidad and Tobago blog (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "eventually dubbed Merikens, a Creole rendering of the word American"}
    - {title: "NALIS: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "they meant to say that I am American but instead they said I am “Merikin”"}
  note: ""
# ---------------- loiza-vejigantes ----------------
- card: loiza-vejigantes
  fact: "Loíza, on Puerto Rico's north-east coast, is the island's centre of African heritage"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "Loíza’s African-Puerto Rican population base and the Fiestas of Santiago Apóstol ... make that locality the seat of African cultural influence in Puerto Rico"}
    - {title: "Comboni Missionaries: Puerto Rico, Dancing People", url: "https://www.combonimissionaries.co.uk/?p=6823", quote: "the Saint James feast held in Loiza, a village that combines Spanish culture and African traditions"}
  note: "North-east coast: Fiet 'in Loíza, on the northeast coast'; Comboni 'north-eastern beach of Puerto Rico'."
- card: loiza-vejigantes
  fact: "Every July Loíza keeps the Fiestas of Santiago Apóstol, St James, warrior saint of Spain said to have driven out the Moors"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "celebrated annually from July 25 to 28 ... The warrior St. James is the patron saint of Spain, credited with appearing miraculously to help drive the Moors from the Iberian peninsula"}
    - {title: "Cesiach López Maldonado, Primera Hora (29 July 2017)", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Se dice que Santiago, durante la conquista medieval europea, decapitaba a los moros, por eso su apodo de “Santiago Mata Moros”"}
  note: ""
- card: loiza-vejigantes
  fact: "Legend: a small carved image of the saint was found among the roots of a cork tree at Las Carreras outside the town"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "the legend says, that fishermen found the carved wooden image of Santiago Apóstol (now Santiago of the Children) under a cork tree"}
    - {title: "Cesiach López Maldonado, Primera Hora (29 July 2017)", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "en el sector Las Carreras apareció entre un hueco en las raíces de un centenario árbol de corcho, una talla religiosa de un santo montado a caballo"}
  note: ""
- card: loiza-vejigantes
  fact: "The legend's date is disputed: around 1830 (Fiet) or 1600 (Primera Hora)"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "The date usually cited for the discovery is around 1830"}
    - {title: "Cesiach López Maldonado, Primera Hora (29 July 2017)", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Según la historia, que data de 1600"}
  note: "Kept as a dispute; card years [1830] follow Fiet."
- card: loiza-vejigantes
  fact: "Three images, St James of the Men, of the Women and of the Children, are carried in procession on 26, 27 and 28 July"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "Santiago of the Men (July 26), Santiago of the Women (July 27) and “Santiaguito” or Santiago of the Children (July 28)"}
    - {title: "Cesiach López Maldonado, Primera Hora (29 July 2017)", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Los días siguiente (26, 27 y 28 de julio) le tocaba el turno a la procesión de los santos, Santiago el de los Hombres, Santiago el de las Mujeres y Santiago el de los Niños"}
  note: ""
- card: loiza-vejigantes
  fact: "Masked characters: Caballeros, Locas (men dressed as women), ragged Viejos and devilish vejigantes"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "devilish Vejigantes , fancy-dressed Spaniards or Caballeros , cross-dressed Locas ... and tattered Viejos or Old Men"}
    - {title: "Comboni Missionaries: Puerto Rico, Dancing People", url: "https://www.combonimissionaries.co.uk/?p=6823", quote: "The vejigante image is the antithesis of the caballero figure, it represents evil, the devil that S. James must fight"}
  note: "Discover Puerto Rico also: 'the Locas , men dressed as crazy women'."
- card: loiza-vejigantes
  fact: "Ponce's vejigante masks are papier-mâché; Loíza's are carved from coconut and crowned with horns"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "the Vejigante of pre-Lenten Carnival in Ponce, on the south coast, with its paper-maché mask, and the Vejigante ... in Loíza ... with its mask carved from coconut husks"}
    - {title: "Cesiach López Maldonado, Primera Hora (29 July 2017)", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "la máscara era de coco"}
  note: "Horns: Discover Puerto Rico 'long, thin wooden horns arranged like a crown'; Comboni 'has horns on the front or on the side of the mask'."
- card: loiza-vejigantes
  fact: "The masks are said to bring the ancestors back from the other world"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "it evokes the egungun quality of calling forth the ancestors and allowing them to return"}
    - {title: "Discover Puerto Rico: The Vejigante Mask (archived 11 Jan 2026)", url: "http://web.archive.org/web/20260111233220/https://www.discoverpuertorico.com/article/vejigante-mask-symbol-puerto-rican-heritage", quote: "These masks are said to symbolize ancestors returning from the other world"}
  note: "Discover Puerto Rico attributes this to the scholar quoted (Aguilar); accepted together with Fiet."
- card: loiza-vejigantes
  fact: "Local carvers make them, among them Castor Ayala and his family"
  verdict: confirmed
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista (Harvard)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "The artist Castor Ayala solidified the classical mask style in the 1950s, 60s, and 70s. His son Raúl"}
    - {title: "Museo de las Américas: La cultura loiceña ...", url: "https://museolasamericas.org/en/la-cultura-loicena-en-tiempos-de-las-fiestas-en-honor-a-santiago-apostol", quote: "Castor y Carlos Ayala, Celele Pizarro, Félix Cepeda, Pedro Laviera, Raúl Ayala"}
  note: ""
