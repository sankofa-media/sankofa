    - {title: "Derat et al., Antiquity 95 (2021), abstract", url: "https://www.cambridge.org/core/journals/antiquity/article/abs/rockcut-churches-of-lalibela-and-the-cave-church-of-washa-mikael-troglodytism-and-the-christianisation-of-the-ethiopian-highlands/DC1B8FC2A2221141A7E648F9B9219755", quote: "Recent research, however, has shown that the rock-cut churches were not created ex nihilo."}
  note: "The attribution rests on Phillipson's own account; Derat's independent team confirms the underlying point that the site has older roots."
- card: lalibela
  fact: "A French team reading cuts, openings and spoil heaps asks whether one grand plan or a centre reshaped over time"
  verdict: corrected
  sources:
    - {title: "Fauvelle-Aymar et al., Antiquity 84 (2010), abstract", url: "https://www.cambridge.org/core/journals/antiquity/article/rockcut-stratigraphy-sequencing-the-lalibela-churches/B53C45E7808B62840E6C5BF3F6380B88", quote: "Do they belong to one grand ceremonial monastic plan, or a long-lived ritual centre, continually refashioned over time? ... embedded in the cuts and openings, the spoil heaps, and even in the now vanished sediments, the stratigraphic sequence is there to be read."}
    - {title: "Derat et al., Antiquity 95 (2021), abstract", url: "https://www.cambridge.org/core/journals/antiquity/article/abs/rockcut-churches-of-lalibela-and-the-cave-church-of-washa-mikael-troglodytism-and-the-christianisation-of-the-ethiopian-highlands/DC1B8FC2A2221141A7E648F9B9219755", quote: "New archaeological evidence has emerged for an earlier, local troglodytic culture, particularly at Washa Mika'el"}
  note: "The two Antiquity papers share authors (one team). Body now states the team's result (older local cave-church tradition) and the open question stays in the dispute line; Phillipson's CWA ('These first monuments were not originally churches ... converted to ecclesiastical use') is the independent second source for a long development."
