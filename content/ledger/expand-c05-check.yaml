    - {title: "DW (2021)", url: "https://www.dw.com/en/taytu-betul-ethiopias-strategic-empress-african-roots/a-57010781", quote: "Taytu is said to have commanded 5,000 infantry and 600 cavalry ... at an Italian-built fort in Mekelle, where she defeated the Italians by cutting off their water supply"}
