    - {title: "DW (2021)", url: "https://www.dw.com/en/taytu-betul-ethiopias-strategic-empress-african-roots/a-57010781", quote: "Taytu had vehemently opposed deals with Italy and the Treaty of Wuchale, which effectively made Ethiopia an Italian protectorate on paper."}
  note: ""
- card: taytu-betul
  fact: "Led about five thousand soldiers; cut the Italians off from water; campaign ended at Adwa 1896"
  verdict: confirmed
  sources:
