    - {title: "Wiley, SAH (2014)", url: "https://www.sah.org/publications/sah-blog/sah-blog/2014/12/04/the-new-flower-addis-ababa-and-the-project-of-african-modernity", quote: "It was at Finfinne that Empress Taytu Betul renamed the city “Addis Ababa,”"}
  note: "LOC agrees ('She founded Addis Ababa ... and named it')."
