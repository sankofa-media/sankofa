# Second, independent check (2026-11-14) of content/ledger/expand-c05.yaml.
# Every cited URL was re-downloaded and every ledger quote was matched against the
# fetched text (openedition.org blocks bots: Wion's two articles were read via
# web.archive.org snapshots of 2025-12-11 and 2026-04-12; Minneapolis Institute of
# Art labels via search.artsmia.org/id/<n>).
# verdict: confirmed | corrected (card wording or sources changed) |
#          refuted | unconfirmed (removed from the card).
# Independence rulings used throughout:
#  - BBC News articles of 2005 and 2008 = one source (same publisher).
#  - Pletser (2012) and Pletser & Huylebrouck (2016) = one source (same authors); Keller is independent of them.
#  - Art Institute of Chicago labels = one source; Cleveland, Minneapolis, Palmer (Penn State) and Carlos (Emory) are each independent.
#  - DACB articles by Thornton and by Brockman = one source (same publisher); Hendrickx (Pharos) is independent.
#  - Internazionale (Franchin) summarises Jonathan Egid's Aeon essay, so it is not independent of Cantor & Egid; it is treated as independent of Herbjørnsrud (different author and argument).
#  - Encyclopedia of World Biography (Gale) entry on Amina is weak (calls Hausaland "north Africa", garbles "Bellow"); used only where a second independent source agrees.
entries:
# ---------------- ishango-bone ----------------
- card: ishango-bone
  fact: "Bone handle about ten centimetres long"
  verdict: confirmed
  sources:
    - {title: "Keller, The fables of Ishango (BibNum 2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "Placed lengthwise (10 cm)"}
    - {title: "Pletser, arXiv:1204.1019", url: "https://arxiv.org/pdf/1204.1019", quote: "The Ishango bone is a 10-cm long curved bone"}
  note: ""
- card: ishango-bone
  fact: "Found at Ishango, east DR Congo, near the Uganda border"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "close to the border with Uganda"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "not far from the present border between Congo and Uganda"}
  note: ""
- card: ishango-bone
  fact: "Found by Jean de Heinzelin in the 1950s"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "Discovered in 1957 by the Belgian archaeologist Jean de Heinzelin"}
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "discovered by archaeologist Jean de Heinzelin in the late 1950s"}
  note: "Pletser 2012 says 'in the early fifties'; the decade is consistent, the exact year is not, so the card keeps 'the 1950s'."
- card: ishango-bone
  fact: "Dated to more than 20,000 years ago"
  verdict: corrected
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "It is usually dated to 20,000 years BCE"}
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "The accepted dating is of 22,000 years"}
  note: "The two figures agree (20,000 BCE = about 22,000 years ago); the dispute line wrongly presented them as alternatives and was rewritten."
- card: ishango-bone
  fact: "A quartz fragment in one end shows it was a tool handle"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "A fragment of quartz affixed to one end shows that it was a tool handle"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "encased in its narrower (top) extremity a fragment of quartz"}
  note: ""
- card: ishango-bone
  fact: "Three columns of grouped notches"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "three rows of more or less parallel but asymmetrically grouped notches"}
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "the arrangement of the notches on three columns suggests an arithmetical"}
  note: "Ledger's P&H quote (column sums) replaced by one that states the three columns."
- card: ishango-bone
  fact: "De Heinzelin in Scientific American 1962: one column holds 11, 13, 17, 19, the primes between 10 and 20"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "published his results in Scientific American in June 1962: Take the first column, for example: 11, 13, 17 and 19 are all prime numbers"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "to see in the G column the four prime numbers between 10 and 20"}
  note: ""
- card: ishango-bone
  fact: "Another column pairs 3 with 6 and 4 with 8, as if doubling"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "3 is doubled to 6, 4 to 8 and 5 to 10"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "the first four groups of the M column suggest duplication by 2"}
  note: ""
- card: ishango-bone
  fact: "De Heinzelin suggested an arithmetical game"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "they may represent an arithmetical game of some sort"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "de Heinzelin's arithmetic game interpretation"}
  note: ""
- card: ishango-bone
  fact: "Alexander Marshack read it as a calendar"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "Alexander Marshack’s interpretation of the bone as a lunar calendar"}
    - {title: "Pletser (2012)", url: "https://arxiv.org/pdf/1204.1019", quote: "A. Marshack [Mar] suggested a different usage for the bone as a lunar calendar"}
  note: ""
- card: ishango-bone
  fact: "Pletser and Huylebrouck proposed a count mixing tens and twelves"
  verdict: corrected
  sources:
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "a people who were counting by mixing bases 10 and 12 (or 6)"}
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "the derived base 12 was used for larger numbers"}
  note: "'Dropped the primes' rested only on the authors' own statement; removed. Wording now 'proposed instead a count that mixed tens and twelves'."
- card: ishango-bone
  fact: "Keller: worn or barely visible notches make numeric readings suspect"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "Several of the notches are worn way or barely visible, which immediately makes any numeric interpretation suspect."}
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "Several of the notches are worn way or barely visible, which immediately makes any numeric interpretation suspect"}
  note: "P&H quote Keller in order to answer him: it confirms the attribution, not the claim itself, which the card presents as Keller's view."
- card: ishango-bone
  fact: "On show at the Royal Belgian Institute of Natural Sciences, Brussels; called humanity's oldest mathematical tool"
  verdict: confirmed
  sources:
    - {title: "Keller (2010)", url: "http://www.bibnum.education.fr/sites/default/files/ishango-analysis_v2.pdf", quote: "It is on display at the Royal Belgian Institute of Natural Sciences, in Brussels, and presented to visitors as “humanity’s oldest calculator”"}
    - {title: "Pletser & Huylebrouck (2016)", url: "https://arxiv.org/pdf/1607.00860.pdf", quote: "can be considered as the oldest mathematical tool of humankind"}
  note: ""
# ---------------- kuba-kingdom ----------------
- card: kuba-kingdom
  fact: "Kingdom took shape in the 17th century under kings such as Shyaam"
  verdict: corrected
  sources:
    - {title: "Art Institute of Chicago: Panel (103017)", url: "https://www.artic.edu/artworks/103017", quote: "According to oral tradition, the 17th-century Kuba king Shyaam introduced plush-textured raffia textiles to his kingdom."}
    - {title: "Cleveland Museum of Art: Knife (ikul) 1916.721", url: "https://clevelandart.org/art/1916.721", quote: "Introduced by King Shyaam in the second quarter of the 17th century"}
  note: "The 17th-century foundation comes only from AIC labels (another AIC label says 16th century). Card now says only that oral tradition remembers Shyaam, a 17th-century king; the dispute line about AIC labels stays."
- card: kuba-kingdom
  fact: "Hierarchical court society; rank in dress and regalia (raffia hats, belts, pendants)"
  verdict: confirmed
  sources:
    - {title: "Art Institute of Chicago: Pendant (148324)", url: "https://www.artic.edu/artworks/148324", quote: "individuals have signaled court rank and status with their elaborate dress"}
    - {title: "Cleveland Museum of Art: Hat (laket) 1915.465", url: "https://clevelandart.org/art/1915.465", quote: "Titled Kuba men and prominent women wear the laket , a small ornate dome-shaped hat"}
  note: "Palmer catalogue 36 also lists hats and belts."
- card: kuba-kingdom
  fact: "Designs had names; the interlace is imbol; motifs pass from cloth to carved wood"
  verdict: confirmed
  sources:
    - {title: "Cleveland Museum of Art: Box 1976.185", url: "https://clevelandart.org/art/1976.185", quote: "Each design, derived from weaving patterns, has its own name---for example the interlace is called imbol"}
    - {title: "Minneapolis Institute of Art: Panel (3789)", url: "https://collections.artsmia.org/art/3789", quote: "Patterns used for embroidery are drawn from over 200 traditional designs which are also used for wood carving, basketry, and ceramics."}
  note: "AIC belt label also names imbol."
- card: kuba-kingdom
  fact: "Raffia cloth was the most prestigious art"
  verdict: confirmed
  sources:
    - {title: "Minneapolis Institute of Art: Panel (3789)", url: "https://collections.artsmia.org/art/3789", quote: "Finely worked cut-pile embroideries are objects of great prestige in Kuba society."}
    - {title: "Art Institute of Chicago: Panel (103017)", url: "https://www.artic.edu/artworks/103017", quote: "Raffia panels have long been considered valuable in Central Africa."}
  note: "Card said 'most prized'; softened to 'most prestigious'."
- card: kuba-kingdom
  fact: "Men set up looms and wove small square panels"
  verdict: confirmed
  sources:
    - {title: "Minneapolis Institute of Art: Panel (3789)", url: "https://collections.artsmia.org/art/3789", quote: "Kuba men set up the looms and weave the raffia cloth"}
    - {title: "Carlos Museum, Emory", url: "https://digitalprojects.carlos.emory.edu/exhibits/show/objects-for-personal-use-and-a/textiles/about", quote: "the men weave the fiber culled from the outer layers of the fronds on diagonal looms, resulting in the small square panels"}
  note: ""
- card: kuba-kingdom
  fact: "Women embroidered and appliquéd; finest panels in cut pile, a tufted plush stitch"
  verdict: confirmed
  sources:
    - {title: "Palmer Museum, Penn State, cat. 36", url: "https://exhibitions.psu.edu/s/african-brilliance/page/catalogue-36", quote: "Women are responsible for the decorative elements and designs, including embroidery and pile work with needles, appliqué"}
    - {title: "Minneapolis Institute of Art: Panel (3789)", url: "https://collections.artsmia.org/art/3789", quote: "The finest cut-pile embroideries, as in these examples, combine a flat stem stitch with a tufted plush stitch"}
  note: ""
- card: kuba-kingdom
  fact: "A skirt sewn by several women of one family, each a section"
  verdict: confirmed
  sources:
    - {title: "Art Institute of Chicago: Woman's Ceremonial Skirt (134096)", url: "https://www.artic.edu/artworks/134096", quote: "several women from the same extended family would contribute different sections"}
    - {title: "Minneapolis Institute of Art: Woman's ceremonial skirt (3268)", url: "https://collections.artsmia.org/art/3268", quote: "several women within the lineage contributing one or more sections"}
  note: ""
- card: kuba-kingdom
  fact: "Appliqué shapes sit where the cloth had small holes"
  verdict: confirmed
  sources:
    - {title: "Art Institute of Chicago: Ceremonial Skirt (110059)", url: "https://www.artic.edu/artworks/110059", quote: "the placement of the shapes is often determined by small holes or tears in the raffia fabric"}
    - {title: "Minneapolis Institute of Art: Woman's Ceremonial Skirt (83666)", url: "https://collections.artsmia.org/art/83666", quote: "The use of appliqué is believed to have evolved from a need to patch small holes"}
  note: ""
- card: kuba-kingdom
  fact: "Worn on ceremonial occasions, above all funerals"
  verdict: confirmed
  sources:
    - {title: "Minneapolis Institute of Art: Woman's ceremonial skirt (3268)", url: "https://collections.artsmia.org/art/3268", quote: "who would wear it on ceremonial occasions, especially funerals"}
    - {title: "Art Institute of Chicago: Panel (103017)", url: "https://www.artic.edu/artworks/103017", quote: "frequently displayed at court ceremonies and funerals"}
  note: ""
- card: kuba-kingdom
  fact: "Laid out around the dead, then wrapped round the body or buried with it"
  verdict: corrected
  sources:
    - {title: "Palmer Museum, Penn State, cat. 36", url: "https://exhibitions.psu.edu/s/african-brilliance/page/catalogue-36", quote: "Elaborately decorated raffia textiles are part of the significant suite of gifts presented by family and clan members to display on the occasion of a funeral. ... These cloths are later wrapped around or buried with the body"}
    - {title: "Carlos Museum, Emory", url: "https://digitalprojects.carlos.emory.edu/exhibits/show/objects-for-personal-use-and-a/textiles/about", quote: "once sewn together, serve as burial cloth demonstrating the status of the dead"}
  note: "'Laid out around the dead' was not in any source; now 'relatives brought them to be displayed'."
- card: kuba-kingdom
  fact: "Royal masks danced the founding of the kingdom (card had tied this to funerals)"
  verdict: corrected
  sources:
    - {title: "Art Institute of Chicago: Helmet Mask (Bwoom) 99540", url: "https://www.artic.edu/artworks/99540", quote: "During performances the masks reenact episodes in the foundation of the kingdom."}
    - {title: "Cleveland Museum of Art: Mask (Bwoom) 1935.304", url: "https://clevelandart.org/art/1935.304", quote: "All three are protagonists in the reenactment of the foundation of the Kuba kingdom. Outside the capital, however, bwoom appears in different non-royal contexts"}
  note: "No source places the masks at funerals; the 'while' linking them was removed and the sentence now begins 'At court'."
- card: kuba-kingdom
  fact: "Families still keep the cloths, show them at funerals, bury them with important adults"
  verdict: confirmed
  sources:
    - {title: "Art Institute of Chicago: Panel (103017)", url: "https://www.artic.edu/artworks/103017", quote: "Today they continue to be collected by families, used in funeral displays, and buried with important adults."}
    - {title: "Palmer Museum, Penn State, cat. 36", url: "https://exhibitions.psu.edu/s/african-brilliance/page/catalogue-36", quote: "or sometimes saved by the family and stored for a future occasion"}
  note: ""
# ---------------- aksum-obelisk ----------------
- card: aksum-obelisk
  fact: "Aksum, northern Ethiopia, capital of a great trading empire in the first centuries AD, trading through Adulis"
  verdict: confirmed
  sources:
    - {title: "Mark Rose, Of Obelisks and Empire, Archaeology (AIA) 2009", url: "https://archive.archaeology.org/0905/abstracts/aksum.html", quote: "In the first century A.D., an unknown merchant recorded details of the Red Sea trade, and mentioned Adulis, the harbor of \"the city of the people called Aksumites\""}
    - {title: "Zamani Project: Stelae Field of Aksum", url: "https://zamaniproject.org/site-ethiopia-aksum-stelae-field.html", quote: "some 200 km inland from the strategic ancient port of Adulis on the Red Sea coast of modern Eritrea. During the first seven centuries AD it was the capital of a major empire."}
  note: ""
- card: aksum-obelisk
  fact: "Graves of rulers and nobles marked by huge carved monoliths"
  verdict: confirmed
  sources:
    - {title: "Rose (2009)", url: "https://archive.archaeology.org/0905/abstracts/aksum.html", quote: "monolithic obelisks were raised to mark the burials of rulers and nobility"}
    - {title: "Zamani Project", url: "https://zamaniproject.org/site-ethiopia-aksum-stelae-field.html", quote: "each marked by a huge monolithic stela carved to represent a multi-storied building"}
  note: ""
- card: aksum-obelisk
  fact: "Of three colossal stelae meant to align, only one stood in modern times; Stele 2 had fallen long before"
  verdict: confirmed
  sources:
    - {title: "Rose (2009)", url: "https://archive.archaeology.org/0905/abstracts/aksum.html", quote: "they were intended to form a single alignment, but only one remained standing into modern times ... Stele 2 fell as well, but perhaps only in the seventh century"}
    - {title: "BBC News (4 Sep 2008)", url: "https://news.bbc.co.uk/1/hi/world/africa/7597589.stm", quote: "It had been lying on the ground for centuries when the Italians found it"}
  note: ""
- card: aksum-obelisk
  fact: "About 24 m tall and over 150 tonnes"
  verdict: confirmed
  sources:
    - {title: "BBC News (19 Apr 2005)", url: "https://news.bbc.co.uk/2/hi/africa/4458105.stm", quote: "Weighs 160 tons 24m tall"}
    - {title: "Corriere della Sera (26 May 2008)", url: "http://www.corriere.it/cronache/08_maggio_26/l_obelisco_conteso_rinasce_ad_axum_6f8d4c02-2aec-11dd-9793-00144f02aabc.shtml", quote: "pesante 152 tonnellate e alto 23.4 metri"}
  note: ""
- card: aksum-obelisk
  fact: "Taken to Rome in 1937 as a war trophy; set up in front of the building now used by FAO"
  verdict: confirmed
  sources:
    - {title: "Rose (2009)", url: "https://archive.archaeology.org/0905/abstracts/aksum.html", quote: "Taken to Rome as a war trophy by Mussolini's forces in 1937"}
    - {title: "Corriere della Sera (2008)", url: "http://www.corriere.it/cronache/08_maggio_26/l_obelisco_conteso_rinasce_ad_axum_6f8d4c02-2aec-11dd-9793-00144f02aabc.shtml", quote: "dal 28 ottobre 1937 al dicembre 2003 era collocato a Roma, di fronte all’edificio della Fao"}
  note: ""
- card: aksum-obelisk
  fact: "After the war Ethiopia asked for it back; in 1947 Italy pledged to return it"
  verdict: corrected
  sources:
    - {title: "BBC News (4 Jun 2008)", url: "https://news.bbc.co.uk/2/hi/africa/7435314.stm", quote: "In 1947, Italy signed a pledge to the UN to give back the obelisk"}
    - {title: "Christian Science Monitor (8 Apr 1996)", url: "https://www.csmonitor.com/1996/0408/08072.html", quote: "In the 1947 peace treaty with the United Nations, Italy promised to return within 18 months art and historical loot taken from Ethiopia after its invasion in October 1935. Half a century later, the promises still have not been met."}
  note: "Corriere (ledger's second source) does not mention 1947; replaced by CSM and added to card sources. Wording now 'in the peace treaty of 1947 Italy undertook to return what it had looted'."
- card: aksum-obelisk
  fact: "Lightning struck its top in May 2002"
  verdict: confirmed
  sources:
    - {title: "BBC News (4 Jun 2008)", url: "https://news.bbc.co.uk/2/hi/africa/7435314.stm", quote: "a lightning strike in 2002"}
    - {title: "Corriere della Sera (2008)", url: "http://www.corriere.it/cronache/08_maggio_26/l_obelisco_conteso_rinasce_ad_axum_6f8d4c02-2aec-11dd-9793-00144f02aabc.shtml", quote: "durante il violentissimo temporale del 27 maggio 2002. Una saetta colp la vetta della stele"}
  note: "Corriere page text drops accented letters (colpì)."
- card: aksum-obelisk
  fact: "Flown back in three sections in 2005; raised again on its site in 2008 in a UNESCO project with Italian money and Ethiopian partners"
  verdict: confirmed
  sources:
    - {title: "Rose (2009)", url: "https://archive.archaeology.org/0905/abstracts/aksum.html", quote: "Taken by Mussolini in 1937, the Aksum Obelisk was returned, in three pieces, in 2005. Last year, it was re-erected in its original position in a joint UNESCO, Italian, and Ethiopian project."}
    - {title: "Corriere della Sera (2008)", url: "http://www.corriere.it/cronache/08_maggio_26/l_obelisco_conteso_rinasce_ad_axum_6f8d4c02-2aec-11dd-9793-00144f02aabc.shtml", quote: "fondi italiani gestiti dall’organismo culturale dell’Onu"}
  note: "BBC 2005 adds that it arrived by Antonov aircraft."
- card: aksum-obelisk
  fact: "A symbol of Ethiopian history; its return closed a dispute dating from the war"
  verdict: confirmed
  sources:
    - {title: "Corriere della Sera (2008)", url: "http://www.corriere.it/cronache/08_maggio_26/l_obelisco_conteso_rinasce_ad_axum_6f8d4c02-2aec-11dd-9793-00144f02aabc.shtml", quote: "Cos si chiuder un lungo contenzioso tra l’Etiopia e l’Italia, nato nel dopoguerra quando l’impero etiope chiese indietro uno dei simboli della propria storia"}
    - {title: "BBC News (4 Jun 2008)", url: "https://news.bbc.co.uk/2/hi/africa/7435314.stm", quote: "The Axum Obelisk, a symbol of Ethiopias identity"}
  note: ""
# ---------------- lalibela ----------------
- card: lalibela
  fact: "Town in the mountains of northern Ethiopia, a great pilgrimage place; named after a Zagwe king; tradition of a new Jerusalem"
  verdict: confirmed
  sources:
    - {title: "Phillipson, Current World Archaeology 18 (2006)", url: "https://world-archaeology.com/features/lalibela-ethiopa-rock-hewn-churches", quote: "High in the mountains of northern Ethiopia, Lalibela is one of the most important pilgrimage places of the Ethiopian Orthodox Church."}
    - {title: "Zamani Project: Lalibela", url: "https://zamaniproject.org/site-ethiopia-lalibela-rock-hewn-churches.html", quote: "named for the 12th century Zagwe king Gebre Mesqel Lalibela. After Muslim conquests halted Christian pilgramages to the holy land, King Lalibela set out to construct a symbolic version of Jerusalem, the ‘New Jerusalem’."}
  note: "Walker (Popular Archaeology) also: 'He was to build a new Jerusalem'."
- card: lalibela
  fact: "Eleven churches carved inside and out from soft volcanic tuff; some in pits reached by trenches, some cut into a cliff"
  verdict: corrected
  sources:
    - {title: "Phillipson, CWA (2006)", url: "https://world-archaeology.com/features/lalibela-ethiopa-rock-hewn-churches", quote: "Lalibela is famed for its 11 Medieval churches ... The Lalibela churches are carved, inside and out, from soft volcanic rock. Their architecture is extremely diverse: some stand as isolated blocks in deep pits, while others have been cut into the face of a cliff."}
    - {title: "Zamani Project", url: "https://zamaniproject.org/site-ethiopia-lalibela-rock-hewn-churches.html", quote: "famed for its 11 rock-hewn churches ... some cut into the face of a cliff, and others in carved pits accessed by long passages or trenches"}
  note: "'Each church is a single piece of stone' contradicted the cliff-cut churches; now 'each church remains one with the rock it was cut from'."
- card: lalibela
  fact: "Largest is Biete Medhane Alem, House of the Saviour of the World"
  verdict: confirmed
  sources:
    - {title: "Zamani Project", url: "https://zamaniproject.org/site-ethiopia-lalibela-rock-hewn-churches.html", quote: "With five aisles, Biete Medhani Alem is believed to be the largest monolithic church in the world."}
    - {title: "Samuel Walker, Popular Archaeology", url: "https://popular-archaeology.com/article/through-pilgrim-eyes-the-creation-of-significance/", quote: "Bete Medhane Alem, or Savior of the World Church. As the largest church"}
  note: ""
- card: lalibela
  fact: "Names such as Golgotha and the Tomb of Adam echo the Holy Land"
  verdict: confirmed
  sources:
    - {title: "Phillipson, CWA (2006)", url: "https://world-archaeology.com/features/lalibela-ethiopa-rock-hewn-churches", quote: "bear names like the Tomb of Adam or the Church of Golgotha which mirror those of places visited by pilgrims to Jerusalem"}
    - {title: "Zamani Project", url: "https://zamaniproject.org/site-ethiopia-lalibela-rock-hewn-churches.html", quote: "Biete Golgotha ... and Adams Tomb"}
  note: ""
- card: lalibela
  fact: "Tradition: all churches finished within King Lalibela's reign"
  verdict: corrected
  sources:
    - {title: "Phillipson, CWA (2006)", url: "https://world-archaeology.com/features/lalibela-ethiopa-rock-hewn-churches", quote: "These exceptional buildings are said to have been built during the 25 year reign of King Lalibela"}
    - {title: "Zamani Project", url: "https://zamaniproject.org/site-ethiopia-lalibela-rock-hewn-churches.html", quote: "King Lalibela set out to construct a symbolic version of Jerusalem"}
