# Second, independent fact-check of batch c11 (2026-11-14).
# Every quote below was re-read in the source page by this checker (text match on the fetched page).
# Furtado on Enslaved.org and on Encyclopedia.com count as ONE source (same author).

entries:
  - card: mary-prince
    fact: "Mary Prince was born into slavery around 1788 at Brackish Pond, Bermuda"
    verdict: confirmed
    sources:
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince was born around 1788 at Brackish Pond in Devonshire"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Mary Prince was born in Brackish Pond, Bermuda, in 1788"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "Britain outlawed the slave trade in 1807, but slavery in the colonies continued until the Abolition Act of 1833"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "The 1807 Abolition of the Slave Trade act had made it illegal for British subjects to ‘buy’ and ‘sell’ enslaved people throughout the British empire"}
      - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "The second brought about the abolition of the institution of slavery itself when the Abolition of Slavery Act was passed in 1833"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "She was sold to the salt ponds of Turks Island, returned to Bermuda, and was then sold to John Wood of Antigua"
    verdict: corrected
    sources:
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "After a period working in the salt ponds of Turks Island, she returned to Bermuda and was sold once more, this time to John Wood of Antigua"}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Darrell agreed to hire her to the Woods, who later purchased her for £100"}
    note: "\"John Wood, a merchant\" rested on Bermuda Biographies alone; \"a merchant\" removed from the card."
  - card: mary-prince
    fact: "In December 1826 she married Daniel James, a free carpenter, in the Moravian church"
    verdict: confirmed
    sources:
      - {title: "Mary Prince: The History of Mary Prince (London, 1831), full text, Documenting the American South", url: "https://docsouth.unc.edu/neh/prince/prince.html", quote: "We were joined in marriage, about Christmas 1826, in the Moravian Chapel at Spring Gardens"}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "In December 1826 she married a free Black man Daniel James, a widowed carpenter, in the Moravian Church"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "a free carpenter and cooper named Daniel James, whom she married in December of 1826"}
    note: "\"In the Moravian church\" was single-sourced in the summary; confirmed by her own 1831 text (primary)."
  - card: mary-prince
    fact: "In 1828 the Woods brought her to London"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "In 1828, Prince was brought from Antigua to London to work as a servant for her abusive enslavers of 10 years, the Woods"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Prince accompanied the Woods to England in 1828"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "The Woods refused to let her buy her freedom; returning to Antigua would mean re-enslavement"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "if she were to return to her husband in Antigua, she would be re-enslaved"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "When Wood refused to sell Prince her freedom—which would allow her to return to her family in Antigua without being re-enslaved"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "In November 1828 she left the Woods and went to the Anti-Slavery Society"
    verdict: confirmed
    sources:
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "November 1828 —Leaves the Woods household and finds her way to the offices of the Anti-Slavery Society"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "she worked for the Wood family until November of that year, when she left their household and consulted with a local anti-slavery society"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "She lived in the household of Thomas Pringle, secretary of the Anti-Slavery Society, and dictated her story to Susanna Strickland"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "She told her life story to writer Susanna Strickland, who compiled the text. Pringle edited the final document."}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince had dictated her story to Susanna Strickland, who was a frequent houseguest of Thomas Pringle"}
    note: "Secretary: London Museum + Bermuda Biographies. Note DocSouth/Bermuda date entry into the household to late 1829; card does not give a date."
  - card: mary-prince
    fact: "Quotation: 'I have been a slave — I have felt what a slave feels, and I know what a slave knows'"
    verdict: confirmed
    sources:
      - {title: "Documenting the American South (UNC): The History of Mary Prince, full text (1831)", url: "https://docsouth.unc.edu/neh/prince/prince.html", quote: "I have been a slave--I have felt what a slave feels, and I know what a slave knows"}
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "I have felt what a slave feels, and I know what a slave knows"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "Her History (1831) was the first account by a woman of her own life in slavery to be published in Britain"
    verdict: corrected
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "It was the first narrative of a Black woman to be published in Britain."}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Bermudian National Hero Mary Prince was the first woman to publish an account of her life in slavery."}
    note: "Was \"first life story of a Black woman published in Britain\": only London Museum says that; Bermuda Biographies says \"first woman to publish an account of her life in slavery\". Narrowed to what both support."
  - card: mary-prince
    fact: "It was printed three times in 1831"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "It was widely read and printed three times in 1831."}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "it became so popular that three editions were printed that year"}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "It was a best seller, with three editions sold that year"}
    note: "Both sources opened; quote matches; independent publishers."
  - card: mary-prince
    fact: "Two libel suits followed; she testified in both; Wood won his case"
    verdict: confirmed
    sources:
      - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "Surviving court records show that Mary appeared as a witness on both occasions."}
      - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "Mary’s book was at the centre of two court cases"}
      - {title: "Royal Museums Greenwich: Who was Mary Prince?", url: "https://rmg.co.uk/stories/topics/who-was-mary-prince", quote: "Although Woods won his case against Pringle and was awarded £25 in damages"}
      - {title: "Bermuda Biographies: Mary Prince", url: "https://bermudabiographies.bm/Biographies/Biography-MaryPrince.html", quote: "Prince, aged 45, by then half blind and in poor health, gave evidence at both trials"}
      - {title: "Documenting the American South (UNC): The History of Mary Prince, summary", url: "https://docsouth.unc.edu/neh/prince/summary.html", quote: "Wood sued Pringle for libel and won by default"}
    note: "Testimony at both trials: RMG (\"appeared as a witness on both occasions\") + Bermuda Biographies. Wood won: RMG + DocSouth."
  - card: mary-prince
    fact: "After 1833 she disappears from the record"
    verdict: confirmed
    sources:
      - {title: "London Museum: The life story of Mary Prince", url: "https://www.londonmuseum.org.uk/collections/london-stories/the-life-story-of-mary-prince", quote: "We don’t know much of what happened to Prince after 1833"}
