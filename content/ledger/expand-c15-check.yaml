  - card: lelia-gonzalez
    fact: "She coined 'pretuguês' for the Africanised Portuguese of Brazil, tracing the 'r' of 'Framengo', for which Black speakers were mocked, to African languages lacking an 'l'"
    verdict: corrected
    sources:
        - {title: "Juliana S. Bartholomeu, Lélia Gonzalez, Enciclopédia de Antropologia, Universidade de São Paulo (2019)", url: "https://ea.fflch.usp.br/autor/lelia-gonzalez", quote: "“Pretuguês” é o termo por ela cunhado para se referir à tradição africana presente na língua portuguesa falada no Brasil"}
        - {title: "Juliana S. Bartholomeu, Lélia Gonzalez, Enciclopédia de Antropologia, Universidade de São Paulo (2019)", url: "https://ea.fflch.usp.br/autor/lelia-gonzalez", quote: "a presença do “r” no lugar do “l” (quando se diz “framengo”, por exemplo) pode remeter à ausência da letra \"l\" em certos idiomas africanos do tronco linguístico bantu"}
        - {title: "Cláudia Pons Cardoso, Amefricanizando o feminismo: o pensamento de Lélia Gonzalez, Revista Estudos Feministas 22:3 (2014)", url: "https://www.redalyc.org/pdf/381/38132698015.pdf", quote: "aquilo que chamo de pretoguês e que nada mais é do que marca de africanização do português falado no Brasil"}
        - {title: "Cláudia Pons Cardoso, Amefricanizando o feminismo: o pensamento de Lélia Gonzalez, Revista Estudos Feministas 22:3 (2014)", url: "https://www.redalyc.org/pdf/381/38132698015.pdf", quote: "É engraçado como eles [sociedade branca elitista] gozam a gente quando a gente diz que é Framengo. Chamam a gente de ignorante"}
        - {title: "Cláudia Pons Cardoso, Amefricanizando o feminismo: o pensamento de Lélia Gonzalez, Revista Estudos Feministas 22:3 (2014)", url: "https://www.redalyc.org/pdf/381/38132698015.pdf", quote: "a presença desse r no lugar do l nada mais é do que a marca lingüística de um idioma africano, no qual o l inexiste"}
    note: "'African languages lacking an l' rested on USP alone; Cardoso quotes Gonzalez's own 1983 text ('no qual o l inexiste')."
  - card: lelia-gonzalez
    fact: "In a 1988 essay she proposed Amefricanity, the Black experience of the whole continent visible in revolts and free settlements such as quilombos, palenques and maroon communities"
    verdict: confirmed
    sources:
        - {title: "Samantha Azambuja, O que é amefricanidade?, Sesc São Paulo (2022)", url: "http://web.archive.org/web/20260310091912/https://www.sescsp.org.br/editorial/amefricanidade/", quote: "No texto “A categoria político-cultural de amefricanidade” (1988), a pensadora afirma que essa categoria pode ser observada desde os primórdios da presença negra nas Américas"}
        - {title: "Instituto Odara: Gonzalez, Lélia. A categoria político-cultural de amefricanidade (introduction and text)", url: "http://web.archive.org/web/20260214201454/https://institutoodara.org.br/public/gonzalez-lelia-a-categoria-politico-cultural-de-amefricanidade-tempo-brasileiro-rio-de-janeiro-v-92-n-93-p-69-82-jan-jun-1988b-p-69-82/", quote: "Argumenta ainda que a “Amefricanidade esteve manifesta nas revoltas, nas estratégias de resistência cultural, no desenvolvimento de formas alternativas de organização social livre, cuja expressão concreta se encontra nos quilombos, cimarrones, cumbres"}
        - {title: "Samantha Azambuja, O que é amefricanidade?, Sesc São Paulo (2022)", url: "http://web.archive.org/web/20260310091912/https://www.sescsp.org.br/editorial/amefricanidade/", quote: "cuja expressão concreta se encontra nos quilombos, cimarrones, cumbes, palenques, marronages, maroom societies, espraiadas pelas mais diferentes paragens de todo o continente"}
        - {title: "Cláudia Pons Cardoso, Amefricanizando o feminismo: o pensamento de Lélia Gonzalez, Revista Estudos Feministas 22:3 (2014)", url: "https://www.redalyc.org/pdf/381/38132698015.pdf", quote: "Amefricanidade, categoria cunhada por Lélia Gonzalez nos anos de 1980"}
    note: ""
