# Second, independent check (2026-11-14) of content/ledger/expand-c15.yaml (batch c15).
# Every cited URL was reopened with curl (archive.org snapshots where the ledger cites them); the Goethe-Institut,
# Literary Hub and The Berliner pages were fetched fresh. Each quote was matched verbatim (ignoring spacing, case and
# punctuation; '...' joins fragments) against the fetched text by script; all quotes below match.
# Independence: two Encyclopedia.com entries (Stubbs; Women in World History) are separate works by different authors;
# the two Schwartz pages count as one source; the Buenos Aires Times (AFP) piece paraphrases the Goldman Prize profile
# and counts as the same text for the facts it copies; EcuRed (a wiki) is never used as one of the two required sources.
# Open Library (bot wall, unreadable) was dropped. Sources listed per entry are the ones in the revised c15 ledger.
# verdict: confirmed | corrected (card wording or sources changed) | refuted | unconfirmed (removed from the card).
entries:
  - card: lelia-gonzalez
    fact: "Lélia Gonzalez was a Brazilian anthropologist and activist, born in Belo Horizonte in 1935, died 1994"
    verdict: corrected
    sources:
        - {title: "Juliana S. Bartholomeu, Lélia Gonzalez, Enciclopédia de Antropologia, Universidade de São Paulo (2019)", url: "https://ea.fflch.usp.br/autor/lelia-gonzalez", quote: "Intelectual e ativista negra, Lélia de Almeida Gonzalez (1935-1994)"}
        - {title: "El País Brasil: Lélia Gonzalez, onipresente (25 October 2020)", url: "https://brasil.elpais.com/cultura/2020-10-25/lelia-gonzalez-onipresente.html", quote: "Lélia Gonzalez (Belo Horizonte, 1935-1994)"}
        - {title: "Luiza Bairros, Lembrando Lélia Gonzalez (1994), via Geledés", url: "https://www.geledes.org.br/lembrando-lelia-gonzalez-por-luiza-bairros/", quote: "nasceu em 1º de fevereiro de 1935"}
        - {title: "Juliana S. Bartholomeu, Lélia Gonzalez, Enciclopédia de Antropologia, Universidade de São Paulo (2019)", url: "https://ea.fflch.usp.br/autor/lelia-gonzalez", quote: "Lélia migra de Belo Horizonte para o Rio de Janeiro em 1942"}
        - {title: "Juliana S. Bartholomeu, Lélia Gonzalez, Enciclopédia de Antropologia, Universidade de São Paulo (2019)", url: "https://ea.fflch.usp.br/autor/lelia-gonzalez", quote: "Realiza mestrado em comunicação social e doutorado em antropologia"}
        - {title: "Samantha Azambuja, O que é amefricanidade?, Sesc São Paulo (2022)", url: "http://web.archive.org/web/20260310091912/https://www.sescsp.org.br/editorial/amefricanidade/", quote: "Para a antropóloga, é importante ultrapassar uma visão romantizada da África"}
    note: "Added USP (migrated from Belo Horizonte, doctorate in anthropology) and Sesc ('a antropóloga') so birthplace and 'anthropologist' each rest on two sources."
