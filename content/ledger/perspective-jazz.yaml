# Perspective rewrite of jazz (2026-11-15): shared frame, {male} Louis Armstrong, {female} Lil Hardin.
# One entry per fact in the new or rewritten paragraphs. The opening explainer paragraph is the
# existing text, only condensed, and keeps its earlier sourcing. Quotes marked [...] are condensed.
- card: jazz
  copy: both
  fact: "Buddy Bolden, a cornetist, was the first king of jazz"
  sources:
    - {title: "National Park Service, New Orleans Jazz NHP: Charles 'Buddy' Bolden", url: "https://www.nps.gov/jazz/learn/historyculture/bolden.htm", quote: "Buddy Bolden played the cornet (an instrument similar to the trumpet) like no one before him. ... there was never a recording made of the first king of jazz"}
    - {title: "Bruce Boyd Raeburn, Traditional New Orleans Jazz, 64 Parishes", url: "https://64parishes.org/entry/traditional-new-orleans-jazz", quote: "the band led by Buddy Bolden, the first cornet king of jazz"}
- card: jazz
  copy: both
  fact: "Bolden was committed to an asylum in 1907"
  sources:
    - {title: "Library of Congress, Now See Hear!: The Elusive Buddy Bolden (2014)", url: "https://blogs.loc.gov/now-see-hear/2014/11/the-elusive-buddy-bolden/", quote: "In June of 1907 was committed to the Louisiana State Insane Asylum at Jackson, Louisiana"}
    - {title: "James Karst, Buddy Bolden's Blues, 64 Parishes (2020)", url: "https://64parishes.org/buddy-boldens-blues", quote: "In 1907, the very year that Bolden was sent away"}
- card: jazz
  copy: both
  fact: "Bolden left no known recording"
  sources:
    - {title: "Library of Congress, Now See Hear!: The Elusive Buddy Bolden (2014)", url: "https://blogs.loc.gov/now-see-hear/2014/11/the-elusive-buddy-bolden/", quote: "despite the fact that no sound recording of him exists!"}
    - {title: "National Park Service, New Orleans Jazz NHP: Charles 'Buddy' Bolden", url: "https://www.nps.gov/jazz/learn/historyculture/bolden.htm", quote: "Sadly, there was never a recording made of the first king of jazz and we will never know exactly how Bolden sounded."}
- card: jazz
  copy: both
  fact: "The first jazz record, \"Livery Stable Blues\" (1917), was made by the white Original Dixieland Jass Band"
  sources:
    - {title: "Library of Congress, Folklife Today: The Painful Birth of Blues and Jazz (2017)", url: "https://blogs.loc.gov/folklife/2017/02/birth-of-blues-and-jazz/", quote: "what is generally acknowledged as the first recording of jazz was released. \"Livery Stable Blues,\" performed by the Original Dixieland Jass Band ... a recording of a white band performing an African American genre"}
    - {title: "National Park Service: A New Orleans Jazz History", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm", quote: "the ODJB had greater success with a recording of \"Livery Stable Blues\" for Victor in February 1917."}
    - {title: "The Irish Times: Remembering the real 'inventors of jazz' (2017)", url: "https://www.irishtimes.com/culture/music/remembering-the-real-inventors-of-jazz-1.3144305", quote: "The Original Dixieland Jazz Band (ODJB) consisted of five white musicians from New Orleans"}
- card: jazz
  copy: both
  fact: "The band claimed to have invented jazz rather than credit its Black teachers"
  sources:
    - {title: "Library of Congress, Folklife Today: The Painful Birth of Blues and Jazz (2017)", url: "https://blogs.loc.gov/folklife/2017/02/birth-of-blues-and-jazz/", quote: "far from crediting the New Orleans African American musicians they learned from, these young musicians claimed to have \"invented\" jazz."}
    - {title: "American Heritage, John McDonough: The Diamond Jubilee of Jazz (1992)", url: "https://www.americanheritage.com/diamond-jubilee-jazz", quote: "So LaRocca not only said he wrote them all but claimed he had invented jazz."}
    - {title: "A Closer Walk (WWOZ): Nick LaRocca's House", url: "https://acloserwalknola.com/places/nick-laroccas-house/", quote: "his denial of the debt he owed to African American musicians has deeply complicated his legacy. Though his style and repertoire owed much to black bands"}
- card: jazz
  copy: both
  fact: "In 1920 Mamie Smith's \"Crazy Blues\" showed that Black artists' records would sell"
  sources:
    - {title: "NPR: Mamie Smith and the Birth of the Blues Market (2006)", url: "https://text.npr.org/6473116", quote: "Until 1920, no black singer had been recorded doing a blues song. ... It sold 10,000 recordings the first week and 75,000 within a month."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Smith, Mamie", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/smith-mamie", quote: "\"Crazy Blues\" also inaugurated the \"race music\" industry"}
- card: jazz
  copy: both
  fact: "The Chicago Defender urged Black Southerners north"
  sources:
    - {title: "New Georgia Encyclopedia: Robert Sengstacke Abbott", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/robert-sengstacke-abbott-1868-1940/", quote: "The Defender considerably influenced the Great Migration, the period when large numbers of African Americans moved from the South to urban areas in the North"}
    - {title: "NPR via WFAE (2019)", url: "https://www.wfae.org/2019-07-10/chicago-defender-ends-print-edition-to-continue-as-an-online-only-newspaper", quote: "Black Southerners by the tens of thousands harkened to Abbott's call to go north."}
- card: jazz
  copy: male
  fact: "In New Orleans Louis Armstrong took lessons from the city's top cornetist, King Oliver"
  sources:
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "Mentored by the city's top cornetist, Joe \"King\" Oliver, Armstrong soon became one of the most in-demand cornetists in town"}
    - {title: "Encyclopedia.com: Louis Armstrong", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-armstrong", quote: "he scrounged up the money to continue lessons with one of his musical idols, Joe \"King\" Oliver."}
    - {title: "Louis Armstrong House Museum, West End Blog: Joe Oliver The King", url: "https://www.louisarmstronghouse.org/?p=3607", quote: "I guess I was about 14. Joe gave me cornet lessons"}
- card: jazz
  copy: male
  fact: "In 1922 Oliver sent for Armstrong to join his band in Chicago"
  sources:
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "In 1922, King Oliver sent for Armstrong to join his band in Chicago."}
    - {title: "Encyclopedia.com: Louis Armstrong", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-armstrong", quote: "Armstrong joined Oliver in Chicago, Illinois, in 1922, remaining there until 1924, when he went to New York City to play with Fletcher Henderson's band."}
- card: jazz
  copy: male
  fact: "After a year in New York with Fletcher Henderson, Armstrong returned in 1925 to record under his own name"
  sources:
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "A year in New York with Fletcher Henderson and His Orchestra proved unsatisfying so Armstrong returned to Chicago in 1925 and began making records under his own name for the first time."}
    - {title: "Encyclopedia.com: Louis Armstrong", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-armstrong", quote: "He was with Henderson for more than a year, returning to Chicago in November 1925 ... Armstrong made his first recording as a leader, \"My Heart,\" on Nov. 12, 1925."}
- card: jazz
  copy: both
  fact: "The Hot Five and Hot Seven turned jazz from an ensemble music into a soloist's art"
  sources:
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "Armstrong's improvised solos transformed jazz from an ensemble-based music into a soloist's art"}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Louis Armstrong", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-armstrong", quote: "they showed that jazz was becoming a soloist's art."}
- card: jazz
  copy: female
  fact: "Lil Hardin was a pianist from Memphis who studied at Fisk University"
  sources:
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "Born Lillian Hardin on February 3, 1898, in Memphis, Tennessee; ... studied classical piano at Fisk University"}
    - {title: "Louis Armstrong House Museum, West End Blog: But, What About Lil? (2018)", url: "https://www.louisarmstronghouse.org/?p=3641", quote: "received a certificate from Fisk University"}
    - {title: "Louis Armstrong House Museum: Memphis to Paris (On a Piano Stool) (2019)", url: "https://www.louisarmstronghouse.org/?p=3613", quote: "Originally from Memphis, Tennessee, Armstrong went to Fisk University for a year"}
- card: jazz
  copy: female
  fact: "In 1921 she joined King Oliver's Creole Jazz Band in Chicago"
  sources:
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "By 1921, Lil was pianist for trumpet player Joe \"King\" Oliver's Creole Jazz Band at the Royal Gardens."}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "In 1921, Lil joined King Oliver's Creole Jazz Band at the Dreamland"}
    - {title: "Louis Armstrong House Museum, West End Blog: But, What About Lil? (2018)", url: "https://www.louisarmstronghouse.org/?p=3641", quote: "Lil met Louis Armstrong while playing with King Oliver's band in Chicago."}
- card: jazz
  copy: female
  fact: "In 1924 she married the band's second cornetist, Louis Armstrong"
  sources:
    - {title: "Library of Congress, In the Muse: Remembering Lil Hardin Armstrong (2019)", url: "https://blogs.loc.gov/music/2019/02/remembering-lil-hardin-armstrong/", quote: "She married Louis Armstrong on February 4, 1924 and helped groom him for stardom."}
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "married Louis Armstrong, February 5, 1924 ... In 1922, Oliver took the unusual artistic step of hiring a second trumpet player besides himself, a young man from New Orleans named Louis Armstrong."}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "Her husband, she thought, was wasting his time playing second cornet to Oliver."}
- card: jazz
  copy: female
  fact: "She persuaded him to leave Oliver for New York, to play as Fletcher Henderson's star soloist"
  sources:
    - {title: "National Park Service: A New Orleans Jazz History", url: "https://www.nps.gov/jazz/learn/historyculture/jazz_history.htm", quote: "In 1924, Lil Hardin (who became Mrs. Armstrong in that year) persuaded Louis to join Fletcher Henderson as a star soloist in New York."}
    - {title: "Encyclopedia.com: Louis Armstrong", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/louis-armstrong", quote: "encouraged by his second wife, Lil Hardin, Armstrong joined the jazz orchestra of Fletcher Henderson in New York City."}
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "In 1924, Armstrong married Hardin, who urged Armstrong to leave Oliver and try to make it on his own."}
- card: jazz
  copy: female
  fact: "A year later he was back, making the Hot Five records, with her at the piano"
  sources:
    - {title: "Library of Congress, In the Muse: Remembering Lil Hardin Armstrong (2019)", url: "https://blogs.loc.gov/music/2019/02/remembering-lil-hardin-armstrong/", quote: "She also appeared as pianist with Louis on his justly famous Hot Five recordings with Kid Ory, Johnny Dodds and Johnny St. Cy."}
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "But in 1925 it was Louis' move to Lil's band that launched his independent success. ... On the famous Hot Five and Hot Seven recordings, Lil was both pianist and musical director"}
    - {title: "Louis Armstrong House Museum: Biography", url: "https://www.louisarmstronghouse.org/biography/", quote: "A year in New York with Fletcher Henderson and His Orchestra proved unsatisfying so Armstrong returned to Chicago in 1925"}
- card: jazz
  copy: female
  fact: "She wrote tunes for the Hot Five, such as \"Struttin' with Some Barbecue\""
  sources:
    - {title: "Library of Congress, In the Muse: Remembering Lil Hardin Armstrong (2019)", url: "https://blogs.loc.gov/music/2019/02/remembering-lil-hardin-armstrong/", quote: "writer of some of his enduring classics, such as \"Struttin' with Some Barbecue,\" which has been covered more than 500 times."}
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "many compositions on these famous recordings, including \"Struttin' With Some Barbecue,\" \"Brown Gal,\" and \"Lonesome Blues,\" are the works of Lil Armstrong."}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "\"Struttin' with Some Barbecue\" and other early compositions she had written for Louis"}
- card: jazz
  copy: female
  fact: "She died in 1971 at a concert in his memory"
  sources:
    - {title: "Women in World History via Encyclopedia.com: Armstrong, Lil Hardin (1898-1971)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/armstrong-lil-hardin-1898-1971", quote: "died of a heart attack on August 27, 1971, in Chicago, Illinois, while performing at a memorial concert for her late former husband, Louis Armstrong"}
    - {title: "Memphis Music Hall of Fame: Lil Hardin Armstrong", url: "https://memphismusichalloffame.com/inductee/lilhardinarmstrong/", quote: "during a televised performance paying tribute to her love"}
