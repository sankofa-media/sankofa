# Batch c33 (2026-11-14): facts in card bodies and wow lines, each with two or more independent sources and a quote.
# Dropped: mbube-settlement-2006 (duplicate of existing card mbube, which already tells the 1939 recording and the 2006 settlement).

- card: patricia-bath
  fact: "Born in Harlem, New York, in 1942"
  sources:
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "born on November 4, 1942, in Harlem, New York City"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "Bath was born on November 4, 1942 in Harlem, New York"}
- card: patricia-bath
  fact: "Her father, a Trinidad immigrant, was the first Black motorman on the New York subway"
  sources:
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "Her father, an immigrant from Trinidad, worked as the first Black motorman for the New York City subway system"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "a Trinidadian immigrant and the first black motorman in the New York City subway system"}
- card: patricia-bath
  fact: "At Harlem Hospital about half the eye-clinic patients were visually impaired or blind, few at Columbia"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "At Harlem Hospital, where there were many African American patients, nearly half were blind or visually impaired. But at Columbia Eye Clinic, the blindness rate was markedly lower."}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "the eye clinic of Harlem where half of the patients were visually impaired or blind and Columbia, where only a few patients suffered from blindness"}
- card: patricia-bath
  fact: "Her study found blindness among Black people double the white rate, largely from lack of access to eye care"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "blindness among African Americans was nearly double the rate of blindness among whites. She concluded that this was largely due to many African Americans' lack of access to ophthalmic care"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "blindness among blacks was double that among whites due to the lack of access of proper eye care"}
- card: patricia-bath
  fact: "She founded community ophthalmology, with trained volunteers screening at senior centres and day-care programmes"
  sources:
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "community ophthalmology in which trained eye care volunteers visit senior centers and day care programs to test the vision"}
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "Bath coined the term “community ophthalmology,” ... trained volunteers to deliver basic eye care, screenings ... with both senior centers and daycare programs"}
- card: patricia-bath
  fact: "Moved to Los Angeles in 1974; first woman faculty member at UCLA's Jules Stein Eye Institute in 1975"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "Bath moved to Los Angeles that year [1974] ... In 1975, Bath became ... the first woman faculty member at the UCLA Jules Stein Eye Institute"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "In 1975, she became the first woman faculty member of the UCLA Jules Stein Eye Institute"}
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "In 1974, Bath moved to Los Angeles"}
- card: patricia-bath
  fact: "In 1983 she became the first woman in the US to chair an ophthalmology residency programme"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "In 1983, Bath was named chair of the Ophthalmology Residency Training Program ... Bath was the first woman in the country to hold such a position"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "in 1983, she chaired the ophthalmology residency training program at Drew and UCLA, becoming the first woman to hold that position in the nation"}
- card: patricia-bath
  fact: "In 1981 she went to Berlin to study laser technology and began work on the probe"
  sources:
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "In 1981, Bath traveled to Berlin University to learn more about laser technology"}
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "In 1981, Bath studied laser technologies at the Laser Medical Center in West Berlin"}
- card: patricia-bath
  fact: "The Laserphaco Probe enters through a tiny incision and uses a laser to break up the cataract, which is then removed"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "uses a laser to vaporize cataracts via a tiny, 1-millimeter insertion into a patient's eye. After using the Laserphaco Probe to remove a cataract"}
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "used a fiber-optic laser to break apart cataracts through a small incision ... which were then removed using suction"}
- card: patricia-bath
  fact: "Patent granted 17 May 1988, the first to a Black woman physician for a medical invention"
  sources:
    - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "On May 17, 1988, Bath received U.S. Patent No. 4,744,360 ... becoming the first Black woman physician to receive a U.S. medical patent"}
    - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "the first African American woman physician to receive a patent for a medical invention ... On May 17, 1988, Bath received a patent"}
    - {title: "Google Patents: US4744360A", url: "https://patents.google.com/patent/US4744360A/en", quote: "Publication date 1988-05-17 ... Inventor Patricia E. Bath"}
- card: patricia-bath
  fact: "She died in 2019"
  sources:
    - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "until she passed away on May 30, 2019, due to complications from cancer"}
    - {title: "UCLA Health: In memoriam, Dr. Patricia Bath, 76 (2019)", url: "https://www.uclahealth.org/news/release/in-memoriam-dr-patricia-bath-76-physician-and-inventor-who-helped-restore-or-improve-vision-for-millions", quote: "Dr. Patricia Bath ... has died of complications from cancer. She was 76."}
- card: tamayo-mendez
  fact: "Born in Guantánamo, Cuba, in 1942"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "born Jan. 29, 1942, Guantánamo , Cuba"}
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "Arnaldo Tamayo Méndez ( Guantánamo , 29 de enero de 1942 )"}
- card: tamayo-mendez
  fact: "Orphaned as a small child and adopted"
  sources:
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "En edad muy temprana quedó huérfano de madre y padre"}
    - {title: "Spacefacts: Arnaldo Tamayo Méndez", url: "https://www.spacefacts.de/bios/international/english/tamayo-mendez_arnaldo.htm", quote: "Was adopted when he was 1 year old"}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "a heartfelt article about Tamayo’s adoptive parents, Rafael Tamayo and Esperanza Méndez"}
- card: tamayo-mendez
  fact: "From age 13 he worked as a shoeshine boy and carpenter's helper"
  sources:
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "Comenzó a trabajar a los 13 años como limpiabotas y ayudante de carpintero."}
    - {title: "History Hit: Arnaldo Tamayo Méndez, Cuba's Forgotten Cosmonaut", url: "https://www.historyhit.com/arnaldo-tamayo-mendez-cubas-forgotten-cosmonaut/", quote: "Tamayo began working aged 13 as a shoeshine, vegetable seller and milk delivery boy, and later worked as a carpenter’s assistant"}
- card: tamayo-mendez
  fact: "After the 1959 revolution he joined the Cuban air force and became a fighter pilot"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "After the revolution of 1959 , Tamayo Méndez joined the Cuban air force as a pilot."}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "Arnaldo Tamayo, an Afro-Cuban fighter pilot from the small province of Guantánamo"}
- card: tamayo-mendez
  fact: "Chosen in 1978 as Cuba's Interkosmos candidate"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "He was selected as a cosmonaut candidate in March 1978 as part of the Soviet Union’s Intercosmos program"}
    - {title: "Spacefacts: Arnaldo Tamayo Méndez", url: "https://www.spacefacts.de/bios/international/english/tamayo-mendez_arnaldo.htm", quote: "Selection date: 01.03.1978 Selection group: Interkosmos-2"}
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "En 1978 fue seleccionado para integrarse al Programa Intercosmos"}
- card: tamayo-mendez
  fact: "He trained at Star City near Moscow"
  sources:
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "se trasladó a la Villa Estelar en la Unión Soviética para cumplir con el entrenamiento"}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "once he had moved to Star City"}
- card: tamayo-mendez
  fact: "Launched 18 September 1980 on Soyuz 38 with commander Yuri Romanenko"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "traveled into space aboard Soyuz 38 with Soviet cosmonaut Yury Romanenko on Sept. 18, 1980"}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "The Joint Cuban–Soviet mission launched on 18 September 1980 ... Soyuz 38 commander Romanenko"}
- card: tamayo-mendez
  fact: "Docked with Salyut 6, did experiments, landed 26 September after almost eight days"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "During the eight-day mission, Soyuz 38 docked with the Salyut 6 space station , and Tamayo Méndez and Romanenko conducted several scientific experiments"}
    - {title: "Spacefacts: Arnaldo Tamayo Méndez", url: "https://www.spacefacts.de/bios/international/english/tamayo-mendez_arnaldo.htm", quote: "Soyuz 38 ... 18.09. - 26.09.1980 7d 20h 43m"}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "and concluded on 26 September"}
- card: tamayo-mendez
  fact: "Received the Order of Lenin and Hero of the Soviet Union; first Hero of the Republic of Cuba from Fidel Castro"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "awarded the first title of Hero of the Republic of Cuba by Fidel Castro and was also bestowed with the Order of Lenin and the title of Hero of the Soviet Union"}
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "Condecorado con la primera medalla honorífica de Héroe de la República de Cuba ... En Moscú , recibió la Orden de Lenin y la estrella de Oro de Héroe de la Unión Soviética"}
- card: tamayo-mendez
  fact: "First Cuban, first Latin American and first person of African descent in space"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "He was the first Latin American, the first person of African descent , and the first Cuban to fly in space."}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "This is Arnaldo Tamayo Méndez, the first Cuban, Latin American, Span"}
- card: tamayo-mendez
  fact: "Guion Bluford became the first African American in space in 1983"
  sources:
    - {title: "Encyclopaedia Britannica: Guion Bluford (archived)", url: "http://web.archive.org/web/2026/https://www.britannica.com/biography/Guion-Bluford", quote: "the first African American launched into space ... On August 30, 1983, he rode into Earth orbit on the shuttle orbiter Challenger on the STS-8 mission."}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "Guion Bluford, the first African American astronaut, travelled to space aboard the Challenger during the STS-8 mission in 1983"}
- card: tamayo-mendez
  fact: "Rose to brigadier general"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "Tamayo Méndez eventually rose to the rank of brigadier general in the air force"}
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "General de brigada"}
- card: tamayo-mendez
  fact: "Ran Cuba's civil defence organisation"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "served ... as the director of Cuba’s civil defense organization"}
    - {title: "Spacefacts: Arnaldo Tamayo Méndez", url: "https://www.spacefacts.de/bios/international/english/tamayo-mendez_arnaldo.htm", quote: "later Director of Organization for Civil Defense in Cuba"}
- card: tamayo-mendez
  fact: "Sat as a deputy in the National Assembly"
  sources:
    - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "In 1980 he became a member of the Cuban legislature, the National Assembly of People’s Power."}
    - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "Diputado ante la Asamblea Nacional del Poder Popular de Cuba."}
    - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "Arnaldo Tamayo had been appointed deputy to the National Assembly"}
- card: phiona-mutesi
  fact: "Katwe is the largest slum in Kampala"
  sources:
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "Katwe, the largest of eight slums in Kampala, Uganda"}
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Katwe, the biggest and possibly toughest slum in Uganda's capital city"}
- card: phiona-mutesi
  fact: "Coach Robert Katende ran a children's chess programme where children got porridge"
  sources:
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "drawing kids from the slum with the promise of soccer and postgame porridge ... Katende started offering chess after soccer games"}
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "he could go to the chess program to get a cup of porridge ... Mutesi's coach and mentor, Robert Katende"}
- card: phiona-mutesi
  fact: "Her family had no food; she followed her brother, who went for porridge"
  sources:
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "We didn't have food at home ... My brother knew about chess, and he could go to the chess program to get a cup of porridge."}
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "Pouches of curry powder, salt and tea leaves are the only hints of food."}
- card: phiona-mutesi
  fact: "She had never heard of chess; there is no word for it in Luganda"
  sources:
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Mutesi herself had never seen or heard of chess. There isn't even a word for it in her native language."}
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "so foreign that there's no word for it in Luganda, their native language. Chess."}
- card: phiona-mutesi
  fact: "She was a natural and aggressive player"
  sources:
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Katende says she was a natural talent ... I notice that she's very aggressive"}
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "dominating them with her aggressive style"}
- card: phiona-mutesi
  fact: "In 2010, as a teenager, she played for Uganda's women's team at the Olympiad in Khanty-Mansiysk, Siberia"
  sources:
    - {title: "Tim Crothers, Africa's female chess prodigy, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "She had no idea that her win would send her to the city of Khanty-Mansiysk ... Phiona is 14 ... she will travel to Siberia"}
    - {title: "OlimpBase: Khanty-Mansiysk 2010 (women), Uganda", url: "https://olimpbase.org/2010w/2010uga.html", quote: "39th Chess Olympiad (women): Khanty-Mansiysk 2010 ... Uganda ... 2 Mutesi, Phiona"}
- card: phiona-mutesi
  fact: "At Istanbul 2012 she scored 4.5/9, the 50 per cent required"
  sources:
    - {title: "Kawowo Sports: Uganda gets first titled lady players (2012)", url: "https://kawowo.com/?p=21344", quote: "Mutesi and Amoko have each got 4.5 points out of 9 games played, which is a 50% score, the mandatory requirement"}
    - {title: "OlimpBase: Istanbul 2012 (women), Uganda", url: "https://olimpbase.org/2012w/2012uga.html", quote: "40th Chess Olympiad (women): Istanbul 2012 ... Mutesi, Phiona ... 4½ 9 3 3 3 50.0"}
- card: phiona-mutesi
  fact: "She earned the FIDE title Woman Candidate Master"
  sources:
    - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "after this year's Chess Olympiad in Istanbul, Turkey, Mutesi qualified for an official World Chess Federation title: Woman Candidate Master"}
    - {title: "Kawowo Sports: Uganda gets first titled lady players (2012)", url: "https://kawowo.com/?p=21344", quote: "Phiona Mutesi and Ivy Clare Amoko are set to attain Woman Candidate Master (WCM) titles"}
- card: phiona-mutesi
  fact: "She and Ivy Amoko became the first titled women in Ugandan chess"
  sources:
    - {title: "Kawowo Sports: Uganda gets first titled lady players (2012)", url: "https://kawowo.com/?p=21344", quote: "the two will become the first titled female players in Ugandan chess history"}
    - {title: "Chessgames.com: Phiona Mutesi, player biography", url: "https://www.chessgames.com/perl/chessplayer?pid=127569", quote: "She and Ivy Claire Amoko share the honour of being the first Ugandan women to have won FIDE titles."}
- card: barbara-hillary
  fact: "Born in New York in 1931, raised in Harlem by her mother after her father died when she was small"
  sources:
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "Born in New York City, New York, on June 12, 1931, to Viola Jones Hillary and raised in Harlem"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "Born in New York City in 1931, Hillary was raised by her mother, Viola Jones Hillary, following her father’s death when she was 2 years old"}
- card: barbara-hillary
  fact: "Her mother was a domestic worker/cleaner"
  sources:
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "As a domestic worker, she earned her liv"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "supporting the family by working as a cleaner"}
- card: barbara-hillary
  fact: "She studied at the New School and specialised in gerontology"
  sources:
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "attended the New School University ... She used her studies in Gerontology to establish a career in nursing"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "earned her Bachelor of Arts and Master’s degrees from the New School and became a nurse with a specialty in gerontology"}
- card: barbara-hillary
  fact: "She worked as a nurse for 55 years"
  sources:
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "after a 55-year career as a nurse"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "After 55 years in the nursing field, Hillary retired."}
- card: barbara-hillary
  fact: "Breast cancer in her twenties; lung-cancer surgery cost about 25% of her breathing capacity"
  sources:
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "At age 67, Hillary survived lung cancer ... lose 25 percent of her breathing capacity ... breast cancer the first time in her twenties"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "she had lost around 25 percent of her breathing capacity after undergoing lung cancer surgery in her 60s ... breast cancer in her 20s"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "she had lost 25 percent of her breathing capacity as a result of surgery from lung cancer"}
- card: barbara-hillary
  fact: "After retiring she went dog-sledding in Quebec and photographed polar bears in Manitoba"
  sources:
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "she set out for Canada, going dog-sledding in Quebec and photographing polar bears in Manitoba"}
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "After photographing polar bears in Manitoba, Canada"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "participating in a dog-sledding event in Quebec, Canada"}
- card: barbara-hillary
  fact: "She learned no Black woman had reached the North Pole and resolved to be first"
  sources:
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "when she discovered that no African-American woman had ever reached the North Pole, she resolved to become the first"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "It was during this event that she learned that no Black woman had ever ventured and made it the North Pole"}
- card: barbara-hillary
  fact: "She raised about $25,000, mostly through donations"
  sources:
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "she raised the necessary $25,000, mostly through donations"}
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "Hillary eventually raised over $25,000 to fund her expedition"}
- card: barbara-hillary
  fact: "She travelled via Norway to a camp on the drifting ice"
  sources:
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "After traveling from New York to Norway, camping out on a moving ice floe, and taking a helicopter ride"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "deposited at a Norwegian base camp, about 30 miles from the North Pole"}
- card: barbara-hillary
  fact: "On 23 April 2007, at 75, she skied to the North Pole, the first Black woman known to do so"
  sources:
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "Barbara Hillary skied into the North Pole on April 23, 2007. At age 75, she became the first African-American woman"}
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "On April 23, 2007 ... the first African American woman to do so"}
    - {title: "The New School News: Barbara Hillary dies at 88 (2019)", url: "https://blogs.newschool.edu/news/?p=23834", quote: "After traveling to the North Pole in 2007, at the age of 75"}
- card: barbara-hillary
  fact: "In 2011, at 79, she stood at the South Pole (four years later)"
  sources:
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "the first African American woman on record to stand on the South Pole on January 6, 2011, at age 79"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "in 2011, she stood at the South Pole"}
    - {title: "The New School News: Barbara Hillary dies at 88 (2019)", url: "https://blogs.newschool.edu/news/?p=23834", quote: "Hillary reached the South Pole four years later"}
- card: barbara-hillary
  fact: "In 2019 she visited Mongolian nomads whose way of life climate change was eroding"
  sources:
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "Hillary traveled to Outer Mongolia, where she visited a nomadic tribe whose way of life was rapidly disappearing because of climate change"}
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "In 2019, she traveled to outer Mongolia to investigate the impact of climate change"}
    - {title: "Smithsonian Magazine: Barbara Hillary dies at 88 (2019; archived)", url: "http://web.archive.org/web/2020/https://www.smithsonianmag.com/smart-news/barbara-hillary-pioneering-african-american-adventurer-has-died-180973663/", quote: "travelled to Outer Mongolia, where she spent time with nomadic groups whose way of life is being threatened by climate change"}
- card: barbara-hillary
  fact: "She died in Queens in November 2019, aged 88"
  sources:
    - {title: "BlackPast, Vanessa Pitts: Barbara Hillary (1931-2019)", url: "https://www.blackpast.org/african-american-history/hillary-barbara-1931/", quote: "she passed away on November 23, 2019, at a hospital in Queens, New York. She was 88 years old"}
    - {title: "New York Amsterdam News: Barbara Hillary (12 Dec 2019)", url: "https://amsterdamnews.com/news/2019/12/12/barbara-hillary-first-black-woman-north-and-south/", quote: "died on Nov. 24 in a hospital in Far Rockaway, Queens. She was 88"}
    - {title: "The New School News: Barbara Hillary dies at 88 (2019)", url: "https://blogs.newschool.edu/news/?p=23834", quote: "died on Saturday at a hospital in Far Rockaway, Queens. She was 88"}
- card: marie-van-brittan-brown
  fact: "She was a nurse living in Jamaica, Queens"
  sources:
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "Brown was born in 1922 in Jamaica, Queens, New York. She started off her career working as a nurse."}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "Marie Van Brittan Brown was a nurse who lived in Jamaica, Queens"}
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "Marie Van Brittan Brown and Albert L. Brown, both of 151-58 135th Ave., Jamaica, N.Y."}
- card: marie-van-brittan-brown
  fact: "Her husband Albert was an electronics technician"
  sources:
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "Her husband, Albert Brown, was an electronics technician."}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "Her husband, Albert Brown, was an electronics technician."}
- card: marie-van-brittan-brown
  fact: "Long hours, often alone at night, in a high-crime area; she wanted to see who was at the door"
  sources:
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "Brown worked long hours and would return home late at night ... she was often alone at night. Fearful of being vulnerable in a high crime neighborhood"}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "When she got worried about crime in her neighborhood, she decided to do something about it."}
- card: marie-van-brittan-brown
  fact: "Patent filed 1 August 1966 by the couple"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "Filed Aug. 1, 1966, Ser. No. 569,319"}
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "In 1966, Brown, along with the assistance of her husband, invented a security system"}
- card: marie-van-brittan-brown
  fact: "A camera on the inside of the door slid up and down to see visitors of different heights"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "a vertical ridge 32 which fits slidably in a groove 33 formed in a vertical rail 34 secured by brackets 35 to the rear side of the door 22"}
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "a sliding camera ... the sliding camera was able to capture images of people who were different heights"}
- card: marie-van-brittan-brown
  fact: "The picture went to a monitor inside"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "a video picture is transmitted by wireless to a video receiver located in a bedroom or other room"}
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "a sliding camera, television monitors"}
- card: marie-van-brittan-brown
  fact: "Microphone and loudspeaker for two-way talk"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "includes audio intercommunication equipment so that the house occupant can converse with the visitor"}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "a two-way microphone and a speaker that allowed the homeowner to see and communicate with visitors"}
- card: marie-van-brittan-brown
  fact: "Radio-controlled lock and alarm to summon a guard or police"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "the door is equipped with a radio controlled lock ... a radio controlled alarm may also be provided for alerting a guard, policeman or watchman"}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "It also had a radio-controlled lock and an alarm to alert a nearby security guard."}
- card: marie-van-brittan-brown
  fact: "US patent 3,482,037 granted 2 December 1969 to both"
  sources:
    - {title: "Google Patents: US3482037A, Home security system utilizing television surveillance", url: "https://patents.google.com/patent/US3482037A/en", quote: "Publication date 1969-12-02 ... Inventor Marie Van Brittan Brown Albert L Brown"}
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "In 1969, Brown and her husband received a patent for the invention under the U.S. Patent number 3,482,037"}
- card: marie-van-brittan-brown
  fact: "She died in 1999, aged 76"
  sources:
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "Brown passed away at the age of 76 in 1999"}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "She died in 1999 at the age of 76."}
- card: marie-van-brittan-brown
  fact: "Her design paved the way for today's video security systems in buildings, offices and banks"
  sources:
    - {title: "Lemelson-MIT Program: Marie Van Brittan Brown", url: "https://lemelson.mit.edu/resources/marie-van-brittan-brown", quote: "still relevant in today’s society with use in places such as banks, office buildings, and apartment complexes"}
    - {title: "Sade Baderinwa, ABC7 New York (23 Feb 2021)", url: "https://abc7ny.com/marie-van-brittan-brown-home-security-system-black-history-month-abc7-unite/10364175/", quote: "Brown's invention paved the way for the high-tech security systems used today."}
- card: gladys-west
  fact: "Born 1930 in Sutherland, Dinwiddie County, Virginia; parents had a small farm; she harvested crops"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "Gladys Mae Brown was born in rural Sutherland, Dinwiddie County, Virginia. Her parents owned a small farm ... helping to harvest crops on the family farm"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "Born on October 27, 1930, Gladys Mae Brown resided in Sutherland, Virginia in rural Dinwiddie County. Her parents owned their small farm and West picked corn, cotton, and tobacco"}
- card: gladys-west
  fact: "Valedictorian; full scholarship to Virginia State College, a historically Black college; maths degrees"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "As valedictorian of her high-school graduating class, Brown received a full scholarship to Virginia State College ... a historically Black college . She earned a bachelor of science in mathematics in 1952 and later a master’s degree"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "As valedictorian of her high school class, she earned a full scholarship to Virginia State College ... In 1955, she received a master’s in mathematics"}
- card: gladys-west
  fact: "Hired 1956 at the Dahlgren naval weapons lab, its fourth Black employee"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "In 1956 Brown was hired as a mathematician by the U.S. Naval Proving Ground ... a weapons laboratory in Dahlgren, Virginia, as only their fourth Black employee"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "first offer from the U.S. Naval Weapons Laboratory in Dahlgren, Virginia in 1956 ... the second Black woman hired and the fourth Black employee"}
- card: gladys-west
  fact: "She married Ira West, another Black mathematician on the base"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "There she met Ira V. West, another Black mathematician on the base; the couple married in 1957"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "Another Black mathematician on base, Ira V. West, became Gladys Brown’s husband in 1957"}
- card: gladys-west
  fact: "She moved from hand calculation to programming; NORC project on Pluto's motion relative to Neptune"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "She eventually transitioned from solving those equations herself to programming computers ... Naval Ordinance Research Calculator (NORC) ... to determine the movements of Pluto in relation to Neptune"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "West’s work at Dahlgren began with the Naval Ordinance Research Calculator (NORC). In 1962 she helped program NORC for Project 29V, which established the motion of the planet Pluto relative to Neptune"}
- card: gladys-west
  fact: "In 1978 she became project manager of Seasat, an ocean-observing satellite"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "In 1978 West was named project manager of Seasat , an experimental U.S. ocean surveillance satellite"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "In 1978, West was project manager for SEASAT, the first earth-orbiting satellite designed for remote sensing of the Earth’s oceans"}
- card: gladys-west
  fact: "From Seasat came GEOSAT and programs modelling gravity, tides etc. to compute orbits and the geoid"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "Out of West’s work on Seasat came GEOSAT ... By teaching a computer to account for gravity, tides, and other forces ... These calculations made it possible to determine a model for the exact shape of Earth, called a geoid"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "This project led to the GEOSAT satellite ... In 1986, she published a guide outlining the use of GEOSAT data for calculating geoid heights"}
- card: gladys-west
  fact: "That model and its updates let GPS calculate positions accurately"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "It is this model, and later updates, that allows the GPS system to make accurate calculations of any place on Earth."}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "West’s modeling directly contributed to the ubiquitous use of the global positioning system (GPS) today ... West’s work made the accuracy of today’s GPS possible"}
- card: gladys-west
  fact: "She retired in 1998"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "Though she retired from the base in 1998 at age 68"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "where she worked until retirement in 1998"}
- card: gladys-west
  fact: "She earned a doctorate at 70"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "she received a Ph.D. in public administration and policy affairs from Virginia Polytechnic Institute in 2000 at age 70"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "After retirement and at 70 years old, West completed her PhD in public administration"}
- card: gladys-west
  fact: "Recognition in 2018 from the Virginia legislature and the Air Force Space and Missile Pioneers Hall of Fame"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "formally recognized for her contribution to the development of GPS by the Virginia General Assembly in 2018. That same year she was also inducted into the Air Force Space and Missile Pioneers Hall of Fame"}
    - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "On February 26, 2018, the Virginia Senate passed a joint resolution ... On December 6, 2018, the Air Force inducted West into the Space and Missiles Pioneers Hall of Fame"}
- card: gladys-west
  fact: "She died in January 2026, aged 95"
  sources:
    - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "West died on January 17, 2026, at her home in Alexandria, Virginia, at the age of 95."}
    - {title: "Scripps News: Gladys West dies at 95 (Jan 2026)", url: "https://www.scrippsnews.com/obituaries/gladys-west-mathematician-whose-work-made-gps-possible-dies-at-95", quote: "has died at the age of 95 ... West passed away over the weekend"}
- card: zwarte-piet
  fact: "Zwarte Piet, Sinterklaas's helper, was traditionally played by white performers in blackface"
  sources:
    - {title: "DutchNews.nl: Rutte changed his views on Zwarte Piet (June 2020)", url: "https://www.dutchnews.nl/2020/06/dutch-prime-minister-tells-mps-he-has-changed-his-views-on-zwarte-piet/", quote: "the controversial sidekick of Sinterklaas who is traditionally played by a white person in blackface makeup"}
    - {title: "Reuters via Stabroek News (29 Aug 2015)", url: "https://stabroeknews.com/2015/08/29/news/world/dutch-must-end-black-pete-racial-stereotypes-u-n-body", quote: "its “Black Pete” Christmas tradition, where white performers black up to entertain children"}
    - {title: "Prakken d'Oliveira: Dutch Ombudsman ruling (17 Oct 2014)", url: "https://www.prakkendoliveira.nl/en/news/2014/dutch-ombudsman-arrest-of-protesters-against-zwarte-piet-in-violation-of-human-rights", quote: "The figure of “Zwarte Piet” is the traditional manservant of Sinterklaas ... actors in blackface"}
- card: zwarte-piet
  fact: "On 12 November 2011 at the Sinterklaas arrival in Dordrecht, Quinsy Gario and another activist wore 'Zwarte Piet is racisme' T-shirts and were arrested for disturbing public order"
  sources:
    - {title: "NL Times: Police arrest of Zwarte Piet protestors a mistake (17 Oct 2014)", url: "https://nltimes.nl/2014/10/17/police-arrest-zwarte-piet-protestors-mistake-report", quote: "At the Sinterklaas arrival on November 12th, 2011, the men wore T-shirts with the slogan \"Zwarte Piet is Racism\" and were arrested for disrupting public order"}
    - {title: "Prakken d'Oliveira: Dutch Ombudsman ruling (17 Oct 2014)", url: "https://www.prakkendoliveira.nl/en/news/2014/dutch-ombudsman-arrest-of-protesters-against-zwarte-piet-in-violation-of-human-rights", quote: "the arrest of artists Quinsy Gario and Jerry Afriyie at the annual public arrival ceremony of “Sinterklaas” in 2011 in Dordrecht ... T-shirts that read \"Zwarte Piet is Racisme\""}
    - {title: "DutchNews.nl: Zwarte Piet protesters wrongly arrested (17 Oct 2014)", url: "https://www.dutchnews.nl/2014/10/black_pete_protesters_complain/", quote: "Police in Dordrecht wrongfully arrested two men on an anti-Zwarte Piet demonstration"}
- card: zwarte-piet
  fact: "In October 2014 the National Ombudsman ruled the arrests unlawful, disproportionately violent and a breach of fundamental rights"
  sources:
    - {title: "DutchNews.nl: Zwarte Piet protesters wrongly arrested (17 Oct 2014)", url: "https://www.dutchnews.nl/2014/10/black_pete_protesters_complain/", quote: "The ombudsman ruled their arrest was unlawful, disproportionately violent and a violation of their human rights"}
    - {title: "Prakken d'Oliveira: Dutch Ombudsman ruling (17 Oct 2014)", url: "https://www.prakkendoliveira.nl/en/news/2014/dutch-ombudsman-arrest-of-protesters-against-zwarte-piet-in-violation-of-human-rights", quote: "In his report of 15 October 2014 ... the police 'has violated the requirement that fundamental rights have to be respected' ... the arrest was deemed both unlawful and disproportionately violent"}
    - {title: "NL Times: Police arrest of Zwarte Piet protestors a mistake (17 Oct 2014)", url: "https://nltimes.nl/2014/10/17/police-arrest-zwarte-piet-protestors-mistake-report", quote: "The National Ombudsman declared their complaint against the police valid."}
- card: zwarte-piet
  fact: "In August 2015 CERD said Black Pete is sometimes portrayed with negative stereotypes and is experienced by many people of African descent as a vestige of slavery"
  sources:
    - {title: "UN CERD, CERD/C/NLD/CO/19-21 (28 Aug 2015)", url: "https://bijlagen.nos.nl/nos/docs/cerd.pdf", quote: "the character of Black Pete is sometimes portrayed in a manner that reflects negative stereotypes of people of African descent and is experienced by many people of African descent as a vestige of slavery"}
    - {title: "Reuters via Stabroek News (29 Aug 2015)", url: "https://stabroeknews.com/2015/08/29/news/world/dutch-must-end-black-pete-racial-stereotypes-u-n-body", quote: "A U.N. body called on the Netherlands on Friday to revamp its “Black Pete” Christmas tradition ... as many saw it as a “vestige of slavery”"}
    - {title: "DutchNews.nl: UN committee calls for changes to Zwarte Piet (28 Aug 2015)", url: "https://www.dutchnews.nl/2015/08/un-committee-calls-for-changes-to-zwarte-piet-negative-stereotypes/", quote: "as a vestige of slavery’, the report says"}
- card: zwarte-piet
  fact: "CERD recommended actively promoting removal of those features and investigating/prosecuting attacks on protesters"
  sources:
    - {title: "UN CERD, CERD/C/NLD/CO/19-21 (28 Aug 2015)", url: "https://bijlagen.nos.nl/nos/docs/cerd.pdf", quote: "the Committee recommends that the State party actively promote the elimination of those features ... and that attacks on protesters be effectively investigated and duly prosecuted"}
    - {title: "DutchNews.nl: UN committee calls for changes to Zwarte Piet (28 Aug 2015)", url: "https://www.dutchnews.nl/2015/08/un-committee-calls-for-changes-to-zwarte-piet-negative-stereotypes/", quote: "The committee also urged the Dutch government to make sure that attacks on anti-Zwarte Piet protesters be effectively investigated and prosecuted."}
- card: zwarte-piet
  fact: "Sooty Petes were introduced by the Sinterklaasjournaal broadcaster in 2014"
  sources:
    - {title: "IamExpat, Mina Solanki (20 Sep 2019)", url: "https://www.iamexpat.nl/expat-info/dutch-expat-news/only-sooty-piets-present-national-sinterklaas-arrival-event", quote: "Back in 2014, the NTR introduced the sooty Piet to the public"}
    - {title: "DutchNews.nl: Sooty Piets take over (9 Nov 2021)", url: "https://www.dutchnews.nl/2021/11/soot-piets-take-over-blackface-out-of-favour-in-most-towns-and-cities/", quote: "introducing sooty Piets in 2014 and that year, the popular seasonal television programme Sinterklaasjournaal began phasing out the traditional version"}
- card: zwarte-piet
  fact: "From 2019 all Petes at the televised national arrival were sooty, and more towns followed"
  sources:
    - {title: "IamExpat, Mina Solanki (20 Sep 2019)", url: "https://www.iamexpat.nl/expat-info/dutch-expat-news/only-sooty-piets-present-national-sinterklaas-arrival-event", quote: "This year, only Piets (Sinterklaas’ helpers) with soot marks on their faces will feature in the Sinterklaas arrival event instead of completely black makeup."}
    - {title: "DutchNews.nl: Sooty Piets take over (9 Nov 2021)", url: "https://www.dutchnews.nl/2021/11/soot-piets-take-over-blackface-out-of-favour-in-most-towns-and-cities/", quote: "Since 2019, all Piets on the programme and in Amsterdam have been sooty ... the blackface version had been replaced by sooty Piets in 123 towns"}
    - {title: "U-Today: What the bleep is... Sinterklaas in 2020?", url: "https://utoday.nl/news/69149/what-the-bleep-is-sinterklaas-in-2020", quote: "Multiple municipalities choose to replace the traditional Black Pete with a ‘sooty’ Pete"}
- card: zwarte-piet
  fact: "In June 2020 Rutte told parliament his view had changed greatly; government would not force change"
  sources:
    - {title: "DutchNews.nl: Rutte changed his views on Zwarte Piet (June 2020)", url: "https://www.dutchnews.nl/2020/06/dutch-prime-minister-tells-mps-he-has-changed-his-views-on-zwarte-piet/", quote: "During a debate in parliament on Thursday evening, Rutte said his perspective on Zwarte Piet had undergone ‘ major changes ‘ ... it is not the government’s job to make this happen"}
    - {title: "U-Today: What the bleep is... Sinterklaas in 2020?", url: "https://utoday.nl/news/69149/what-the-bleep-is-sinterklaas-in-2020", quote: "While Prime Minister Rutte had a change of mind in June about the appearance of Black Pete, he doesn’t want the government to force a change."}
- card: windrush-scandal
  fact: "Between 1948 and 1973 many Commonwealth citizens, mostly Caribbean, came to the UK: the Windrush generation"
  sources:
    - {title: "National Audit Office: Handling of the Windrush situation (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "Between 1948 and 1973 many Commonwealth citizens came to the UK ... particularly those from Caribbean nations, have recently become known as the Windrush generation"}
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "who came to the UK between 1948 and 1973, mostly from Caribbean countries. This group came to be known collectively as the Windrush generation"}
- card: windrush-scandal
  fact: "Named after the ship Empire Windrush, which brought Caribbean migrants to Tilbury in June 1948"
  sources:
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "after the ship HMT Empire Windrush ... to the UK on 22 June 1948"}
    - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "Newly arrived Jamaican immigrants on board the 'Empire Windrush' at Tilbury, on 22 June 1948."}
    - {title: "Civil Service World (2018)", url: "https://www.civilserviceworld.com/professions/article/fury-over-revelation-that-home-office-destroyed-thousands-of-windrush-landing-cards", quote: "Jamaican immigrants arriving in Tilbury from the ex-troopship HMT Empire Windrush."}
- card: windrush-scandal
  fact: "The 1971 Act (in force 1973) confirmed settled people's right to stay but gave no documents and no records were kept"
  sources:
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "The 1971 Immigration Act confirmed that the Windrush generation had, and have, the right of abode in the UK. But they were not given any documents to demonstrate this status. Nor were records kept."}
    - {title: "National Audit Office: Handling of the Windrush situation (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "the Immigration Act 1971, which came into force in 1973. At this time, Commonwealth immigrants already settled in the UK were given indefinite leave to remain, but many were not issued with any documentation, and the Home Office (the Department) kept no records"}
- card: windrush-scandal
  fact: "Many children travelled on their parents' passports"
  sources:
    - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "many who arrived in the 1950s and 1960s had travelled on their parents’ passports"}
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "some callers had arrived in the UK on parents’ passports, which they no longer had"}
- card: windrush-scandal
  fact: "In 2012 Theresa May introduced a 'hostile environment' requiring employers, landlords and health services to check status"
  sources:
    - {title: "CNN, Smith-Spark and Polglase (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "The measures, introduced in 2012, require employers, landlords and health service providers to demand evidence of legal immigration status. At the time, May said they were designed to create a “hostile environment”"}
    - {title: "Channel 4 News FactCheck, Georgina Lee (24 Apr 2018)", url: "https://www.channel4.com/news/factcheck/factcheck-who-destroyed-the-windrush-landing-cards", quote: "In May 2012, Theresa May declared : “the aim is to create here in Britain a really hostile environment for illegal migration.”"}
- card: windrush-scandal
  fact: "People lost jobs, were refused healthcare and benefits, detained, removed or refused re-entry"
  sources:
    - {title: "National Audit Office: Handling of the Windrush situation (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "being denied access to public services, being detained in the UK or at the border, or removed from, or refused re-entry to, the UK"}
    - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "It meant British citizens were wrongly deported, dismissed from their jobs and deprived of vital services"}
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "jobs lost, lives uprooted"}
- card: windrush-scandal
  fact: "Landing-card slips with arrival dates were destroyed in 2010"
  sources:
    - {title: "CNN, Smith-Spark and Polglase (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "The landing card slips were “securely disposed” of in 2010, the Home Office said."}
    - {title: "Channel 4 News FactCheck, Georgina Lee (24 Apr 2018)", url: "https://www.channel4.com/news/factcheck/factcheck-who-destroyed-the-windrush-landing-cards", quote: "it wasn’t until October 2010 ... that the registry slips were actually disposed of"}
    - {title: "Civil Service World (2018)", url: "https://www.civilserviceworld.com/professions/article/fury-over-revelation-that-home-office-destroyed-thousands-of-windrush-landing-cards", quote: "thousands of documents relating to the Windrush generation were destroyed by the department in 2010"}
- card: windrush-scandal
  fact: "The Home Office said the slips were not reliable evidence of residence or status"
  sources:
    - {title: "CNN, Smith-Spark and Polglase (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "they did not provide any reliable evidence relating to ongoing residence in the UK or their immigration status,” a Home Office spokesperson said"}
    - {title: "Civil Service World (2018)", url: "https://www.civilserviceworld.com/professions/article/fury-over-revelation-that-home-office-destroyed-thousands-of-windrush-landing-cards", quote: "Home Office insists that decision was taken by then UK Border Agency and did not provide any reliable evidence relating to residence claims"}
- card: windrush-scandal
  fact: "In April 2018 the government acknowledged unfair treatment and set up a taskforce; compensation followed"
  sources:
    - {title: "National Audit Office: Handling of the Windrush situation (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "In April 2018, the government acknowledged that the Windrush generation had been treated unfairly and set up a taskforce ... The Department is now moving to identify affected individuals, and to compensate them."}
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "the establishment of a taskforce to give them urgent help to formalise their legal status ... Windrush Compensation Scheme"}
- card: windrush-scandal
  fact: "In March 2020 Williams found it 'foreseeable and avoidable' and 'institutional ignorance and thoughtlessness' on race"
  sources:
    - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "what happened to those affected by the Windrush scandal was foreseeable and avoidable ... an institutional ignorance and thoughtlessness towards the issue of race"}
    - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "An official report into the Windrush scandal has concluded it was \"foreseeable and avoidable\" ... “institutional ignorance and thoughtlessness towards the issue of race”"}
    - {title: "Electronic Immigration Network (20 Mar 2020)", url: "https://www.ein.org.uk/news/lessons-learned-review-windrush-scandal-profound-institutional-failure-immigration-hostile", quote: "Williams found that the Home Office showed \"ignorance and thoughtlessness\" on the issue of race"}
- card: windrush-scandal
  fact: "Priti Patel told the Commons she was 'truly sorry'"
  sources:
    - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "On Thursday, home secretary Priti Patel apologised in the House of Commons ... I am truly sorry"}
    - {title: "Electronic Immigration Network (20 Mar 2020)", url: "https://www.ein.org.uk/news/lessons-learned-review-windrush-scandal-profound-institutional-failure-immigration-hostile", quote: "Home Secretary Priti Patel said ... I am truly sorry. For the actions that spanned decades."}
- card: stephen-lawrence
  fact: "On the night of 22 April 1993 Stephen Lawrence, 18, waited at a bus stop on Well Hall Road, Eltham, with Duwayne Brooks"
  sources:
    - {title: "Court of Appeal, R v Dobson (18 May 2011), Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "On 22 nd April 1993, just after 10.35 in the evening, a young man, Stephen Lawrence, then 18 years old, was waiting at a bus stop at Eltham with a close friend of the same age, Duwayne Brooks."}
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "It was just after 10.35 pm on 22 April 1993 that Stephen Lawrence was waiting at a bus stop on Well Hall Road, Eltham with a friend, Duwayne Brooks."}
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "they came at around 22:30 to the bus stop in Well Hall Road"}
- card: stephen-lawrence
  fact: "A group of white youths crossed the road, one used racist abuse, they surrounded and stabbed him twice"
  sources:
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "the group of five or six white youths ... the group came quickly across the road and literally engulfed Stephen ... one or more of the group stabbed Stephen twice"}
    - {title: "Court of Appeal, R v Dobson (18 May 2011), Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "a group of white youths crossed the road towards them. One of the youths used abusive racist language."}
- card: stephen-lawrence
  fact: "He ran over a hundred yards, collapsed and died"
  sources:
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "managed somehow to get to his feet and to run over 100 yards to the point where he fell"}
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "was taken to hospital where, tragically, he died shortly after"}
- card: stephen-lawrence
  fact: "In 1996 his parents' private prosecution of three suspects ended in acquittal; double jeopardy barred retrial"
  sources:
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "Three of the prime suspects were taken to trial in 1996 in a private prosecution ... The trial resulted in the acquittal of all three accused. They can never be tried again in any circumstances in the present state of the law."}
    - {title: "Court of Appeal, R v Dobson (18 May 2011), Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "Stephen Lawrence’s parents began a private prosecution and, in April 1996, Gary Dobson, Luke Knight and Neil Acourt were tried for murder ... the ancient rule against double jeopardy represented an insuperable barrier to a second prosecution"}
- card: stephen-lawrence
  fact: "The Macpherson inquiry reported in February 1999, criticised the investigation and found institutional racism in the Met and other institutions"
  sources:
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "The collective failure of an organisation to provide an appropriate and professional service to people because of their colour, culture, or ethnic origin ... institutional racism, within the terms of its description set out in Paragraph 6.34 above, exists both in the Metropolitan Police Service and in other Police Services and other institutions countrywide"}
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "In February 1999, the inquiry concluded that the Metropolitan Police was institutionally racist and was highly critical of the original investigation."}
- card: stephen-lawrence
  fact: "The report raised reconsidering the double jeopardy rule"
  sources:
    - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "at least the issue deserves debate and reconsideration perhaps by the Law Commission, or by Parliament. (See Recommendation 38)."}
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "It was recommended that the rule against double jeopardy (preventing a second trial for the same offence) should be abrogated"}
- card: stephen-lawrence
  fact: "Part 10 of the Criminal Justice Act 2003 allows retrial after acquittal for very serious offences on new and compelling evidence"
  sources:
    - {title: "CPS legal guidance: Retrial of serious offences", url: "https://www.cps.gov.uk/legal-guidance/retrial-serious-offences", quote: "Part 10 of the Criminal Justice Act 2003 (the 2003 Act) reforms the law relating to double jeopardy, by permitting retrials in respect of a number of very serious offences, where new and compelling evidence"}
    - {title: "Court of Appeal, R v Dobson (18 May 2011), Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "Until Part 10 of the Criminal Justice Act 2003 ( the 2003 Act ) came into force the ancient rule against double jeopardy represented an insuperable barrier"}
- card: stephen-lawrence
  fact: "After forensic advances, the Court of Appeal quashed Dobson's acquittal in May 2011"
  sources:
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "In 2006, advances in forensic science led to a review of the forensic evidence ... On 18 May 2011, Dobson’s acquittal was quashed"}
    - {title: "Police Professional: Stephen Lawrence killers refused leave to appeal (2012)", url: "https://policeprofessional.com/?p=106536", quote: "Developments in forensic technology, unavailable to police at the time of the original murder investigation, helped secure the convictions."}
    - {title: "Court of Appeal, R v Dobson (18 May 2011), Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "This is an application by the prosecution for the acquittal of Gary Dobson to be quashed and for a re-trial to be ordered under section 76"}
- card: stephen-lawrence
  fact: "On 3 January 2012 Dobson and Norris were convicted of murder"
  sources:
    - {title: "Court of Appeal, Norris v R [2013] EWCA Crim 712, Find Case Law", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2013/712", quote: "On 3 January 2012, both were unanimously convicted of murder."}
    - {title: "Police Professional: Stephen Lawrence killers refused leave to appeal (2012)", url: "https://policeprofessional.com/?p=106536", quote: "Gary Dobson and David Norris were found guilty of being involved in the unprovoked attack on the 18-year-old as he waited at a bus stop with a friend in 1993."}
