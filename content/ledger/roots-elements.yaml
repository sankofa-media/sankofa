# Ledger of the musical-element layer of Roots (content/roots/elements.yaml).
# Generated from the per-link review and the independent second check; quotes are verbatim from the opened sources.
description: 'Evidence for the `carries` tags of content/roots/*.yaml: for every link that carries a musical element, the element and the passages of the link''s sources that support it. Links with `carries: []` are listed under anecdoteOnly with the reason given in their `how`.'
