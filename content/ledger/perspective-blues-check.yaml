  fact: "The blues grew out of work songs, field hollers and spirituals, and passed on into jazz, gospel and rock and roll"
  verdict: confirmed
  sources:
    - {title: "Carnegie Hall Timeline of African American Music: Rural/Folk Blues", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues", quote: "The three-line rural blues form emerged out of African American work songs, field calls and protest songs, game songs and social songs, spirituals, and folk ballads."}
