- card: blues
  copy: female
  fact: "Mamie Smith's \"Crazy Blues\" of 1920 opened the record market to Black women singers"
  verdict: confirmed
  sources:
    - {title: "Library of Congress, Songs of America: Blues", url: "https://www.loc.gov/collections/songs-of-america/articles-and-essays/musical-styles/popular-songs-of-the-day/blues/", quote: "In 1920, African-American singer Mamie Smith's \"Crazy Blues,\" a song about frustrated love reached a national audience, and started a vogue for women blues singers in band settings."}
