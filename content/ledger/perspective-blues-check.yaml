# Second, independent check of content/cards/blues.md / blues.ru.md and
# content/ledger/perspective-blues.yaml (2026-11-15). Every source quoted below was opened
# by the checker. The New York Times obituary (2019) could not be opened (paywall/blocked)
# and is not counted; the visitmississippi.org copy of the Blues Trail marker is the same
# text as msbluestrail.org and is counted once. The shared explainer paragraph is covered
# by explainers-check.yaml; its corrected wording is what the card carries.
# Word count per copy after fixes: male 222, female 235 (genre limit 235).
- card: blues
  copy: male
  fact: "Around 1903 W. C. Handy led an orchestra in Clarksdale, Mississippi, playing dances for white and Black audiences"
  verdict: confirmed
  sources:
    - {title: "National Park Service: W. C. Handy", url: "https://www.nps.gov/locations/lowermsdeltaregion/wc-handy.htm", quote: "In 1903, he moved to Clarksdale, Mississippi, to direct the Colored Knights of Pythias, an entourage that performed for both whites and blacks."}
    - {title: "Mississippi Blues Trail: W.C. Handy Encounters the Blues", url: "https://msbluestrail.org/?p=487", quote: "Handy, who led an orchestra in Clarksdale from 1903 to 1905, traveled throughout the Delta and beyond, playing dances for both white and African American audiences"}
  note: ""
