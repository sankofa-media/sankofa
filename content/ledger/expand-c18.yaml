    - {title: "Hérodote.net: 2 octobre 1925, Joséphine Baker lance la Revue nègre", url: "https://www.herodote.net/almanach-ID-3598.php", quote: "La Revue nègre , avec 12 musiciens et 8 danseuses dont elle"}
- card: revue-negre
  fact: "Josephine Baker was born in St. Louis in 1906 (19 in October 1925)"
  sources:
    - {title: "Britannica: Josephine Baker", url: "https://www.britannica.com/biography/Josephine-Baker", quote: "Josephine Baker (born June 3, 1906, St. Louis, Missouri"}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "Née le 3 juin 1906 à Saint-Louis (Missouri)"}
    - {title: "Ordre de la Libération: Joséphine Freda Baker", url: "https://www.ordredelaliberation.fr/fr/medailles/josephine-freda-baker", quote: "03 juin 1906 Lieu de naissance : Saint-Louis"}
- card: revue-negre
  fact: "She had danced in the chorus of the touring Shuffle Along"
  sources:
    - {title: "Britannica: Josephine Baker", url: "https://www.britannica.com/biography/Josephine-Baker", quote: "In 1923 she joined the chorus in a road company performing the musical comedy Shuffle Along"}
    - {title: "Internet Broadway Database: Shuffle Along (1921)", url: "https://www.ibdb.com/broadway-production/shuffle-along-9073", quote: "She danced in the chorus from August 1922 through the end of the tour in the fall of 1923."}
- card: revue-negre
  fact: "Her 'Danse sauvage' was the sensation of the show"
  sources:
    - {title: "Britannica: Josephine Baker", url: "https://www.britannica.com/biography/Josephine-Baker", quote: "In 1925 she went to Paris to dance at the Théâtre des Champs-Élysées in La Revue Nègre and introduced her danse sauvage to France"}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "Elle rencontre d’emblée un très vif succès, dansant le charleston dans une scène appelée La Danse sauvage"}
    - {title: "Petit Palais: Josephine Baker study day, recap (with Nathalie Sergent, Théâtre des Champs-Élysées)", url: "https://www.petitpalais.paris.fr/sites/default/files/eng_-_josephine_baker_-_recap_study_day_1.pdf", quote: "the famous \"Jazz Nègre,\" the true highlight of the show, which earned Josephine the nickname \"Queen of the Wild Dance.\""}
- card: revue-negre
  fact: "The staging fed a primitivist fantasy; Baker played with racist stereotypes while remaining powerful"
  sources:
    - {title: "Petit Palais: Josephine Baker study day, recap (with Nathalie Sergent, Théâtre des Champs-Élysées)", url: "https://www.petitpalais.paris.fr/sites/default/files/eng_-_josephine_baker_-_recap_study_day_1.pdf", quote: "Baker's dance, which manages to play with racist stereotypes while remaining both desirable and powerful at the same time"}
    - {title: "The Scholar & Feminist Online (Barnard Center for Research on Women): Synesthetic rhythms, African American music and dance through Parisian eyes", url: "https://sfonline.barnard.edu/synesthetic-rhythmsafrican-american-music-and-dance-through-parisian-eyes/", quote: "“Josephine Baker was primitivist-modernism on two legs, the cubists’ art nègre in naked, human form.”"}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "vêtue d’un simple pagne et de fausses bananes, rythmée par des tambours sur fond de décor de savane"}
- card: revue-negre
  fact: "Paul Colin's posters, with cubist distortions, made her silhouette an Art Deco icon"
  sources:
    - {title: "Musée franco-américain du château de Blérancourt: La Revue nègre, 1925 (Paul Colin)", url: "https://museefrancoamericain.fr/collection/objet/la-revue-negre-1925", quote: "Cette œuvre est l’une des plus grandes réussites de l’Art déco dans la mesure où les déformations cubistes rendent admirablement le rythme du jazz"}
    - {title: "Petit Palais: Josephine Baker study day, recap (with Nathalie Sergent, Théâtre des Champs-Élysées)", url: "https://www.petitpalais.paris.fr/sites/default/files/eng_-_josephine_baker_-_recap_study_day_1.pdf", quote: "It was thanks to the illustrator Paul Colin, who created the posters for the revue, that Josephine Baker's stylized silhouette became iconic, with its Art Deco curves."}
- card: revue-negre
  fact: "She became a star of the Folies-Bergère"
  sources:
    - {title: "Britannica: Josephine Baker", url: "https://www.britannica.com/biography/Josephine-Baker", quote: "achieved star billing at the Folies-Bergère"}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "lui écrit en 1925 une chanson qu’elle interprète aux Folies Bergère"}
- card: revue-negre
  fact: "She took French citizenship through marriage in 1937"
  sources:
    - {title: "Ordre de la Libération: Joséphine Freda Baker", url: "https://www.ordredelaliberation.fr/fr/medailles/josephine-freda-baker", quote: "Joséphine Baker obtient la nationalité française par son mariage avec Jean Lion en novembre 1937."}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "Ce mariage « français » lui permet de solliciter la nationalité française."}
    - {title: "Britannica: Josephine Baker", url: "https://www.britannica.com/biography/Josephine-Baker", quote: "She became a French citizen in 1937."}
- card: revue-negre
  fact: "From 1939 she worked for French counter-espionage"
  sources:
    - {title: "Ordre de la Libération: Joséphine Freda Baker", url: "https://www.ordredelaliberation.fr/fr/medailles/josephine-freda-baker", quote: "elle se met dès 1939 au service du contre-espionnage français"}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "résistante durant la Seconde Guerre mondiale en tant qu’agente du contre-espionnage français"}
- card: revue-negre
  fact: "On 30 November 2021 she entered the Panthéon, the first Black woman there"
  sources:
    - {title: "Ordre de la Libération: Joséphine Freda Baker", url: "https://www.ordredelaliberation.fr/fr/medailles/josephine-freda-baker", quote: "Joséphine Baker est entrée au Panthéon le 30 novembre 2021, devenant la sixième femme et la première femme noire à être panthéonisée."}
    - {title: "Archives nationales: La France rend hommage à Joséphine Baker", url: "https://www.archives-nationales.culture.gouv.fr/dossiers-thematiques/la-france-rend-hommage-josephine-baker", quote: "Sixième femme – mais première femme noire – à entrer au Panthéon le 30 novembre 2021"}
- card: blackbirds-1926
  fact: "Blackbirds was an all-Black revue built around Florence Mills; in 1926 it went from Harlem to Paris and the London Pavilion"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "Mills starred in Blackbirds of 1926 at Harlem ’ s Alhambra Theatre. ... it opened in Paris , London, and several other British cities. At London ’ s Pavilion Theatre"}
    - {title: "Zakiya Adair, BlackPast: Florence Mills (1896-1927)", url: "https://www.blackpast.org/african-american-history/mills-florence-1896-1927/", quote: "the internationally-successful Blackbird Revue , which toured at the London Pavilion, in Paris, France, and other European cities"}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "Blackbirds is a huge success in Paris and Ostend. ... Blackbirds opens at London Pavilion in September."}
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "In 1926 she appeared in Blackbirds (1926) ... She took Blackbirds to London and Paris"}
- card: blackbirds-1926
  fact: "Mills was born in Washington, D.C., in 1896"
  sources:
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "Florence Mills (born January 25, 1896, in or near Washington, D.C."}
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "in Washington, D.C.; died in New York City of paralytic ileus"}
- card: blackbirds-1926
  fact: "She became a star in Shuffle Along in 1921"
  sources:
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "Her breakthrough came in 1921, when she landed the lead role in the Broadway musical Shuffle Along"}
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "Shuffle Along , which was the first legitimate African American musical comedy ... made Mills a star"}
- card: blackbirds-1926
  fact: "In 1923 in Dover Street to Dixie in London audiences gave her an ovation before every song"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "In 1923, Mills was invited to appear in London in a stage work entitled Dover Street to Dixie ... she received a fervent ovation before every song she sang"}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "Florence Mills received an ovation each time she came on stage - before every song she sang"}
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "the following year she traveled to London to perform in From Dover to Dixie"}
- card: blackbirds-1926
  fact: "Blackbirds opened at Harlem's Alhambra Theatre"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "Mills starred in Blackbirds of 1926 at Harlem ’ s Alhambra Theatre"}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "Blackbirds plays the Alhambra in Harlem, Florence's farewell to her friends and supporters before departing for France & England"}
- card: blackbirds-1926
  fact: "Her trademark song was \"I'm a Little Blackbird Looking for a Bluebird\""
  sources:
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "singing “I’m a Little Blackbird Looking for a Bluebird,” which became her trademark song"}
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "The show — featuring her signature tune, “ I ’ m a Little Black-bird Looking for a Bluebird ”"}
- card: blackbirds-1926
  fact: "She sang in a high, birdlike voice"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "She sang with an unusually high-pitched voice that was sometimes described as birdlike"}
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "she mesmerized the audience with her uninhibited dance, hauntingly high voice"}
- card: blackbirds-1926
  fact: "London society entertained the cast at parties"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "Mills was a celebrated guest at the glittering parties of young aristocrats and creative types"}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "Blackbirds parties become the rage, with high society folk entertaining the performers"}
- card: blackbirds-1926
  fact: "The Prince of Wales, the future Edward VIII, reportedly saw it more than twenty times"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "At London ’ s Pavilion Theatre the Prince of Wales , who later became King Edward VIII , reportedly saw Blackbirds over twenty times."}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "The Prince of Wales is a frequent audience member, singing along with Florence"}
- card: blackbirds-1926
  fact: "The schedule exhausted her; seriously ill, she returned home in 1927"
  sources:
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "serious illness forced her return to America in 1927"}
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "The heavy touring schedule for Blackbirds took a devastating toll on Mills ’ s health and she was forced to withdraw from the show."}
- card: blackbirds-1926
  fact: "She died in New York on 1 November 1927, aged 31, after an operation"
  sources:
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "died November 1, 1927, New York City, New York) ... (aged 31)"}
    - {title: "Zakiya Adair, BlackPast: Florence Mills (1896-1927)", url: "https://www.blackpast.org/african-american-history/mills-florence-1896-1927/", quote: "She died in New York City on November 1, 1927, from an infection after surgery."}
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "she became seriously ill and was admitted to New York ’ s Hospital for Joint Diseases for an appendectomy. On November 1, 1927, Mills died"}
- card: blackbirds-1926
  fact: "Harlem gave her its grandest funeral: thousands in the church, up to 150,000 in the streets"
  sources:
    - {title: "Contemporary Black Biography (via Encyclopedia.com): Mills, Florence 1896–1927", url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/mills-florence-1896-1927", quote: "The number of mourners at Mills ’ s funeral at Harlem ’ s Mount Zion African Methodist Episcopal Church was estimated at 5,000, while 150,000 lined the streets outside. ... the people of Harlem gave her the grandest funeral within their considerable power"}
    - {title: "Bill Egan, FlorenceMills.com: Biography", url: "http://www.florencemills.com/biography.htm", quote: "Florence Mills funeral was the largest Harlem had ever seen."}
    - {title: "Britannica: Florence Mills", url: "https://www.britannica.com/biography/Florence-Mills", quote: "Her funeral was attended by some 150,000 mourners."}
    - {title: "Zakiya Adair, BlackPast: Florence Mills (1896-1927)", url: "https://www.blackpast.org/african-american-history/mills-florence-1896-1927/", quote: "Three thousand fans attended her funeral in Harlem and thousands more saw her funeral procession"}
