# Expansion batch c18 (2026-11-13): every fact in the bodies and wow lines of
# strange-fruit, precious-lord, tutti-frutti, within-our-gates, aspects-of-negro-life,
# fire-1926, negro-world, shuffle-along, revue-negre, blackbirds-1926.
# Each fact has >= 2 independent sources with a supporting quote; '...' marks elided text, [brackets] mark editorial notes.
- card: strange-fruit
  fact: "Abel Meeropol, the author, was a Jewish high-school teacher from the Bronx"
  sources:
    - {title: "Library of Congress blog: The Power of a Poem (2015)", url: "https://blogs.loc.gov/loc/2015/04/the-power-of-a-poem/", quote: "a Jewish high-school teacher from the Bronx"}
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "Meeropol, who was a white Jewish man from the Bronx , wore many hats: high school teacher, author, composer, and social activist"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "a Jewish American teacher from the Bronx"}
- card: strange-fruit
  fact: "He wrote under the pen name Lewis Allan"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "Under his pen name Lewis Allan, Meeropol wrote “Bitter Fruit”"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "writing under the pen name Lewis Allan"}
- card: strange-fruit
  fact: "He was moved by a photograph of the August 1930 lynching of two Black teenagers, Thomas Shipp and Abram Smith, in Marion, Indiana, showing their bodies hanging above a white crowd"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "The photograph that moved him to write the poem was of the August 7, 1930, lynching of 18-year-old Thomas Shipp and 19-year-old Abram Smith. The shocking image shows the bodies of the teenagers hanging from a tree branch, with a crowd of white men and women surrounding the tree."}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "after seeing a photo depicting the lynching of two Black teens in Indiana in 1930"}
    - {title: "Biography.com: Billie Holiday and Strange Fruit", url: "https://www.biography.com/news/billie-holiday-strange-fruit", quote: "a 1930 photo that captured the lynching of two Black men in Indiana"}
- card: strange-fruit
  fact: "The poem, first called \"Bitter Fruit\", was published in 1937 in The New York Teacher, a union magazine"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "The poem was published in 1937 in The New York Teacher , the magazine of the city’s teacher’s union"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "The poem was published in the journal The New York Teacher in 1937"}
    - {title: "Library of Congress blog: The Power of a Poem (2015)", url: "https://blogs.loc.gov/loc/2015/04/the-power-of-a-poem/", quote: "In 1937, his poem originally titled “Bitter Fruit” was published"}
- card: strange-fruit
  fact: "Meeropol set the poem to music himself"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "Meeropol composed music to accompany his poem"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "before Meeropol decided to turn the poem into lyrics and set it to music"}
- card: strange-fruit
  fact: "In 1939 the 23-year-old Billie Holiday began singing it at Café Society in Greenwich Village, New York's first integrated nightclub"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "At first, the 23-year-old Holiday was apprehensive about performing “Strange Fruit.” ... when she began singing it at Café Society in 1939, her audiences were awestruck"}
    - {title: "Biography.com: Billie Holiday and Strange Fruit", url: "https://www.biography.com/news/billie-holiday-strange-fruit", quote: "In March 1939, a 23-year-old Billie Holiday walked up to the mic at West 4th's Cafe Society"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "working at New York's first integrated nightclub, Café Society in Greenwich Village"}
- card: strange-fruit
  fact: "She feared harassment and violence, but audiences were stunned"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "she feared harassment and violence by racist listeners. However, when she began singing it at Café Society in 1939, her audiences were awestruck"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "was (rightfully) concerned about being targeted at her performances. But the positive audience responses and frequent requests"}
- card: strange-fruit
  fact: "She sang it last; waiters stopped serving, the room went dark, a spotlight lit her face, no encore"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "Holiday sang it last, in a darkened room, with a spotlight on her face. The nightclub staff stopped serving during the song ... She did not perform an encore"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "prompted Holiday to close out every performance with the song. Ahead of time, the waiters would stop serving so there was a deathly silence in the room, then a spotlight would shine on Holiday’s face"}
    - {title: "Biography.com: Billie Holiday and Strange Fruit", url: "https://www.biography.com/news/billie-holiday-strange-fruit", quote: "the room went completely black, save for a spotlight on her face ... there was no encore"}
- card: strange-fruit
  fact: "Columbia would not record it, fearing Southern record shops and radio, so she recorded it for the small Commodore label"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "Columbia declined, fearing the reactions of Southern record retailers and radio stations, but allowed her to record it on the independent Commodore label"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "Commodore Records who recorded the song with Holiday and the Café Society Band in 1939"}
- card: strange-fruit
  fact: "The record sold more than a million copies"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "with the single selling more than one million copies"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "eventually selling 1 million copies to become the best selling record of Holiday’s career"}
- card: strange-fruit
  fact: "Time named it the song of the century in 1999"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "In 1999 Time named it the song of the century"}
    - {title: "PBS American Masters: The story behind Billie Holiday's Strange Fruit", url: "https://www.pbs.org/wnet/americanmasters/the-story-behind-billie-holidays-strange-fruit/17738", quote: "It was named “Song of the Century,” by Time in 1999"}
    - {title: "Library of Congress blog: The Power of a Poem (2015)", url: "https://blogs.loc.gov/loc/2015/04/the-power-of-a-poem/", quote: "In 1999, Time magazine named “Strange Fruit” the song of the century."}
- card: strange-fruit
  fact: "It was among the first recordings chosen for the Library of Congress's National Recording Registry"
  sources:
    - {title: "Britannica: Strange Fruit (song)", url: "https://www.britannica.com/topic/Strange-Fruit-song", quote: "it was one of the first 50 songs inducted into the National Recording Registry by the Library of Congress"}
    - {title: "Library of Congress blog: The Power of a Poem (2015)", url: "https://blogs.loc.gov/loc/2015/04/the-power-of-a-poem/", quote: "In 2002, it was selected for preservation in the inaugural National Recording Registry."}
- card: precious-lord
  fact: "Thomas A. Dorsey built blues-based gospel in Chicago in the early 1930s"
  sources:
    - {title: "PBS, This Far by Faith: Thomas Dorsey", url: "https://www.pbs.org/thisfarbyfaith/people/thomas_dorsey.html", quote: "Thomas Dorsey ... music -- the African American religious music which married secular blues to a sacred text"}
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "\"Precious Lord\" was written in Chicago in 1932"}
    - {title: "New Georgia Encyclopedia: Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "the first of his religious songs to mirror lyrically the emotional and personal impact of his blues compositions"}
- card: precious-lord
  fact: "Dorsey made his name in the blues as Georgia Tom, playing for Ma Rainey"
  sources:
    - {title: "PBS, This Far by Faith: Thomas Dorsey", url: "https://www.pbs.org/thisfarbyfaith/people/thomas_dorsey.html", quote: "Under the name Georgia Tom he performed with blues artist Ma Rainey and her Wild Cats Jazz Band."}
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "Dorsey put together the \"Wild Cats Jazz Band\" to play for Ma Rainey in 1925."}
- card: precious-lord
  fact: "In August 1932 he left his pregnant wife Nettie to sing at a revival in St. Louis; a telegram called him home"
  sources:
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "One hot August afternoon I had to go to St. Louis, where I was to be the featured soloist at a large revival meeting. I didn’t want to go. Nettie was in the last month of pregnancy ... a messenger boy ran up with a Western Union telegram"}
    - {title: "Kathryn Kemp, Christianity Today / Christian History: The Father of Gospel Music Wanted to Be a Secular Star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "The musician had gone to St. Louis to sing at a revival. During his trip, he received a telegram telling him to return home— his wife had just died in childbirth."}
- card: precious-lord
  fact: "Nettie died in childbirth and their son died the next day"
  sources:
    - {title: "New Georgia Encyclopedia: Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "In 1932 Dorsey’s wife, Nettie Harper, died during childbirth, and their son died the following day."}
    - {title: "Kathryn Kemp, Christianity Today / Christian History: The Father of Gospel Music Wanted to Be a Secular Star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "his wife had just died in childbirth. His infant son died the next day."}
    - {title: "PBS, This Far by Faith: Thomas Dorsey", url: "https://www.pbs.org/thisfarbyfaith/people/thomas_dorsey.html", quote: "in August 1932, Dorseys life was thrown into crisis when his wife and son died during childbirth"}
- card: precious-lord
  fact: "On the Saturday after her death he sat at a piano with his friend Theodore Frye and the song came"
  sources:
    - {title: "Kathryn Kemp, Christianity Today / Christian History: The Father of Gospel Music Wanted to Be a Secular Star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "The following Saturday after Nettie’s death, Dorsey met up with his friend Theodore Frye. There, he later said, God gave him the words and melody"}
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "On the following Saturday evening he took me up to Malone’s Poro College ... I sat down at the piano"}
- card: precious-lord
  fact: "He set new words to an old hymn tune by George Allen sung to \"Must Jesus Bear the Cross Alone\""
  sources:
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "MAITLAND ... by George Allen (1812-1877), paired with the text \"Must Jesus Bear the Cross Alone.\" Arranging this tune and adding his own words"}
    - {title: "PBS, This Far by Faith: Thomas Dorsey", url: "https://www.pbs.org/thisfarbyfaith/people/thomas_dorsey.html", quote: "Dorsey based the music of his most popular and widely performed gospel song on and old hymn called \"Must Jesus Bear the Cross Alone?\" by George Allen. The lyrics, however, were written by Dorsey."}
- card: precious-lord
  fact: "Frye introduced it at Ebenezer Baptist Church in Atlanta, Martin Luther King Sr.'s church"
  sources:
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "He gave the song to Frye who introduced it to the choir at Atlanta's Ebenezer Baptist Church ... Martin Luther King, Sr. was the pastor of Ebenezer at this time"}
    - {title: "Kathryn Kemp, Christianity Today / Christian History: The Father of Gospel Music Wanted to Be a Secular Star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "Frye introduced the song to Martin Luther King Sr.’s Ebenezer Church."}
- card: precious-lord
  fact: "It was one of Martin Luther King Jr.'s favourite songs"
  sources:
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "Martin Luther King Jr. drew inspiration from this, his favorite song."}
    - {title: "National Civil Rights Museum: Ben Branch", url: "https://civilrightsmuseum.org/blog/ben-branch/", quote: "Branch’s instrumental rendition of this gospel song was one of MLK’s favorites"}
    - {title: "Ernie Suggs, Atlanta Journal-Constitution: Last moments of Martin Luther King filled with normalcy (2018)", url: "https://www.ajc.com/news/last-moments-martin-luther-king-filled-with-normalcy/gzRKKQF2EfRGu44opcUxPO/", quote: "one of his favorite songs, \"Precious Lord, Take My Hand,\""}
- card: precious-lord
  fact: "On 4 April 1968, from the Lorraine Motel balcony in Memphis, King asked Ben Branch to play it at that night's meeting; minutes later he was shot"
  sources:
    - {title: "National Civil Rights Museum: Ben Branch", url: "https://civilrightsmuseum.org/blog/ben-branch/", quote: "King had asked Branch to play “Precious Lord, Take My Hand” at a rally later that day ... Just minutes after this conversation, an assassin’s bullet would take Dr. King’s life on the balcony of the Lorraine Motel."}
    - {title: "Ernie Suggs, Atlanta Journal-Constitution: Last moments of Martin Luther King filled with normalcy (2018)", url: "https://www.ajc.com/news/last-moments-martin-luther-king-filled-with-normalcy/gzRKKQF2EfRGu44opcUxPO/", quote: "From his second-floor balcony of the Lorraine Motel in Memphis, he spo tted Ben Branch ... and asked that he play it at the meeting that night, \"real pretty.\""}
    - {title: "Stanford King Institute: Assassination of Martin Luther King, Jr.", url: "https://kinginstitute.stanford.edu/assassination-martin-luther-king-jr", quote: "At 6:05 P.M. on Thursday, 4 April 1968, Martin Luther King was shot dead while standing on a balcony outside his second-floor room at the Lorraine Motel in Memphis, Tennessee."}
- card: precious-lord
  fact: "Ben Branch was a bandleader"
  sources:
    - {title: "National Civil Rights Museum: Ben Branch", url: "https://civilrightsmuseum.org/blog/ben-branch/", quote: "this one of Ben Branch and his orchestra taken in the early 1950s"}
    - {title: "Ernie Suggs, Atlanta Journal-Constitution: Last moments of Martin Luther King filled with normalcy (2018)", url: "https://www.ajc.com/news/last-moments-martin-luther-king-filled-with-normalcy/gzRKKQF2EfRGu44opcUxPO/", quote: "Ben Branch, the director of the director of the Operation Breadbasket band"}
- card: precious-lord
  fact: "Mahalia Jackson sang it at King's funeral"
  sources:
    - {title: "Stanford King Institute: Jackson, Mahalia", url: "https://kinginstitute.stanford.edu/jackson-mahalia", quote: "After King’s assassination , Jackson honored his last request by singing “Precious Lord” at his funeral."}
    - {title: "64 Parishes: Mahalia Jackson", url: "https://64parishes.org/entry/mahalia-jackson", quote: "she sang Dorsey’s most famous song, “Take My Hand, Precious Lord” at King’s funeral"}
- card: precious-lord
  fact: "Lyndon B. Johnson asked for it at his own funeral"
  sources:
    - {title: "C. Michael Hawn, History of Hymns: Precious Lord, Take My Hand (UMC Discipleship Ministries, 2014)", url: "https://www.umcdiscipleship.org/resources/history-of-hymns-precious-lord-take-my-hand", quote: "President Lyndon B. Johnson requested that \"Precious Lord\" be sung at his funeral."}
    - {title: "Kathryn Kemp, Christianity Today / Christian History: The Father of Gospel Music Wanted to Be a Secular Star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "The song later played during both Martin Luther King Jr. and Lyndon B. Johnson’s funerals."}
- card: tutti-frutti
  fact: "The record opens with the shout \"A wop bop a loo bop, a lop bam boom!\""
  sources:
    - {title: "Britannica: Little Richard", url: "https://www.britannica.com/biography/Little-Richard", quote: "howled “ Tutti Frutti,” with its unforgettable exhortation, “A wop bop a loo bop, a lop bam boom!”"}
    - {title: "Library of Congress National Recording Registry essay (Masino): Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Tutti-Frutti_Masino.pdf", quote: "the song features the signature phrase, “A wop bop a loo bop, a lop bam boom!”"}
- card: tutti-frutti
  fact: "Little Richard was born Richard Penniman in Macon, Georgia"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "Though he was born with the rather pedestrian name of Richard Wayne Penniman ... Born in Macon, Georgia"}
    - {title: "Britannica: Little Richard", url: "https://www.britannica.com/biography/Little-Richard", quote: "Little Richard (born December 5, 1932, Macon , Georgia , U.S. ... Original name: Richard Wayne Penniman"}
- card: tutti-frutti
  fact: "His early-1950s records had attracted little notice"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "The couple of songs he recorded and released for them however obtained little attention."}
    - {title: "Britannica: Little Richard", url: "https://www.britannica.com/biography/Little-Richard", quote: "His first recordings in the early 1950s, produced in the soothing jump-blues style of Roy Brown, showed none of the soaring vocal reach"}
- card: tutti-frutti
  fact: "On 14 September 1955 he recorded at J&M Studio in New Orleans for Specialty with producer Bumps Blackwell; the session was going badly"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "One particular recording session, this one on September 14, 1955 was, typically, not going well."}
    - {title: "Library of Congress National Recording Registry essay (Masino): Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Tutti-Frutti_Masino.pdf", quote: "In September of 1955, Little Richard recorded “Tutti Frutti” in a session at J&M Studio in New Orleans ... Produced by Robert “Bumps” Blackwell"}
    - {title: "Britannica: Little Richard", url: "https://www.britannica.com/biography/Little-Richard", quote: "His breakthrough came in September 1955 at a recording session at J & M Studio in New Orleans"}
- card: tutti-frutti
  fact: "During a break he played an obscene number from his club act"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "at a break ... Little Richard sat down at the piano and banged out an old, slightly obscene ditty he had often performed as filler in his nightclub dates"}
    - {title: "Rolling Stone: Little Richard, 20 Essential Songs — Tutti-Frutti (1955)", url: "https://www.rollingstone.com/music/music-lists/little-richard-20-essential-songs-15792/tutti-frutti-1955-209077/", quote: "the frustrated number Richard pounded out during a break in an unproductive recording session"}
    - {title: "Ann Powers, NPR: Little Richard Made Music Vibrate In All The Right Ways (2020)", url: "https://www.npr.org/2020/05/10/853494775/little-richard-made-music-vibrate-in-all-the-right-ways", quote: "But the song was obscene – all about \"good booty\""}
- card: tutti-frutti
  fact: "Blackwell brought in local songwriter Dorothy LaBostrie to rewrite the lyrics"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "Local songwriter Dorothy LaBostrie was drafted by Bumps to rework the lyrics."}
    - {title: "Ann Powers, NPR: Little Richard Made Music Vibrate In All The Right Ways (2020)", url: "https://www.npr.org/2020/05/10/853494775/little-richard-made-music-vibrate-in-all-the-right-ways", quote: "Blackwell enlisted an ambitious young songwriter, Dorothy LaBostrie, to sub in some lyrics"}
    - {title: "Rolling Stone: Little Richard, 20 Essential Songs — Tutti-Frutti (1955)", url: "https://www.rollingstone.com/music/music-lists/little-richard-20-essential-songs-15792/tutti-frutti-1955-209077/", quote: "producer Bumps Blackwell hired songwriter Dorothy LaBostrie to temper the original lyrics"}
- card: tutti-frutti
  fact: "By one of his accounts the phrase came from his days washing dishes in Macon"
  sources:
    - {title: "Rolling Stone: Little Richard, 20 Essential Songs — Tutti-Frutti (1955)", url: "https://www.rollingstone.com/music/music-lists/little-richard-20-essential-songs-15792/tutti-frutti-1955-209077/", quote: "Or – depends when you asked him – it was how he talked back to his boss as a dishwasher at the Macon Greyhound station."}
    - {title: "Library of Congress National Recording Registry essay (Masino): Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Tutti-Frutti_Masino.pdf", quote: "something Richard came up with while working in a restaurant in Macon. Disgusted that he had to wash dishes"}
- card: tutti-frutti
  fact: "It crossed to the pop chart and reached No. 17"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "reach #17 on the pop chart"}
    - {title: "Rolling Stone: Pat Boone Remembers Little Richard (2020)", url: "https://www.rollingstone.com/music/music-features/pat-boone-little-richard-997029/", quote: "(Little Richard’s version only made it to Number 17.)"}
    - {title: "Library of Congress National Recording Registry essay (Masino): Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Tutti-Frutti_Masino.pdf", quote: "Little Richard’s “Tutti Frutti” crossed over from the R&B charts to the Pop charts"}
- card: tutti-frutti
  fact: "Pat Boone's cover, with tamer lyrics, reached No. 12"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "Pat Boone’s version of “Tutti Frutti” hit the charts in February 1956 and climbed all the way up to number 12"}
    - {title: "Rolling Stone: Pat Boone Remembers Little Richard (2020)", url: "https://www.rollingstone.com/music/music-features/pat-boone-little-richard-997029/", quote: "his “Tutti Frutti” was far more embraced on pop radio, hitting Number 12"}
- card: tutti-frutti
  fact: "Boone changed the lyrics further"
  sources:
    - {title: "Rolling Stone: Pat Boone Remembers Little Richard (2020)", url: "https://www.rollingstone.com/music/music-features/pat-boone-little-richard-997029/", quote: "So I changed it to “pretty little Susie is the gal for me.”"}
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "Boone’s version had slightly better diction but considerably less free-for-all passion"}
- card: tutti-frutti
  fact: "Remaking Black records for white audiences was common in the 1950s and showed how segregated the business was"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "it was much more common in the 1950s, especially the practice of remaking “black” records for white audiences by having them recorded by white artists"}
    - {title: "Rolling Stone: Pat Boone Remembers Little Richard (2020)", url: "https://www.rollingstone.com/music/music-features/pat-boone-little-richard-997029/", quote: "In a sign of how segregated the music business was at the time"}
- card: tutti-frutti
  fact: "Elvis Presley covered it too"
  sources:
    - {title: "PBS American Masters: Little Richard biography and career timeline", url: "https://www.pbs.org/wnet/americanmasters/little-richard-biography-and-career-timeline/27612/", quote: "Pat Boone and then Elvis cover “Tutti Frutti.”"}
    - {title: "Library of Congress National Recording Registry essay (Masino): Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Tutti-Frutti_Masino.pdf", quote: "Elvis and the Beatles would both go on to record their own versions of Little Richard’s classic song."}
- card: tutti-frutti
  fact: "It became a founding record of rock and roll"
  sources:
    - {title: "Cary O'Dell, Library of Congress National Recording Registry essay: Tutti Frutti", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/TuttiFrutti.pdf", quote: "the song was a major breakthrough into a brave, scary, saucy new world called rock ‘n’ roll"}
    - {title: "Britannica: Little Richard", url: "https://www.britannica.com/biography/Little-Richard", quote: "a flamboyant American singer and pianist whose hit songs of the mid-1950s were defining moments in the development of rock and roll"}
- card: within-our-gates
  fact: "Within Our Gates (1920) is the oldest known surviving feature film by an African American director"
  sources:
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "the earliest known surviving feature film directed by an African American—was preserved by the Library of Congress"}
    - {title: "Smithsonian Magazine: Watch the oldest-known surviving film by an African-American director", url: "https://www.smithsonianmag.com/smart-news/watch-oldest-known-surviving-film-african-american-director-180962035/", quote: "Watch the Oldest-Known Surviving Film by an African-American Director"}
- card: within-our-gates
  fact: "Oscar Micheaux was born in 1884 in Metropolis, Illinois"
  sources:
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "Oscar Micheaux was born in 1884 in Metropolis, Illinois, the son of former slaves."}
    - {title: "Britannica: Oscar Micheaux", url: "https://www.britannica.com/biography/Oscar-Micheaux", quote: "Oscar Micheaux (born January 2, 1884, Metropolis, Ill., U.S."}
- card: within-our-gates
  fact: "He was a Pullman porter and a South Dakota homesteader and wrote The Homesteader about it"
  sources:
    - {title: "Britannica: Oscar Micheaux", url: "https://www.britannica.com/biography/Oscar-Micheaux", quote: "While working as a Pullman porter, Micheaux purchased a relinquished South Dakota homestead in 1906. ... his experiences became the subject of a series of self-published books, including The Homesteader (1917)"}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "from Pullman porter to farmer, Micheaux wrote a memoir based on his experiences homesteading in South Dakota. The book, titled The Homesteader"}
- card: within-our-gates
  fact: "When a Black film company sought the rights, he filmed it himself"
  sources:
    - {title: "Britannica: Oscar Micheaux", url: "https://www.britannica.com/biography/Oscar-Micheaux", quote: "In 1917 he was approached by an African American film company for movie rights to The Homesteader . He refused the offer but liked the idea and made his own film version"}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "attracted the attention of the Lincoln Motion Picture Company ... so Micheaux set about turning the book into a film on his own"}
- card: within-our-gates
  fact: "His second feature answered Griffith's The Birth of a Nation"
  sources:
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "Various sources, including the Library of Congress, described the film as Micheaux’s response to D. W. Griffith’s The Birth of a Nation (1915"}
    - {title: "Smithsonian Magazine: Watch the oldest-known surviving film by an African-American director", url: "https://www.smithsonianmag.com/smart-news/watch-oldest-known-surviving-film-african-american-director-180962035/", quote: "In response, Micheaux made Within Our Gates"}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "a fascinating and cogent response to the racist accusations of Griffith"}
- card: within-our-gates
  fact: "Evelyn Preer plays Sylvia Landry, who goes north to raise money for a school for poor Black children"
  sources:
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "tells the story of Sylvia Landry (Evelyn Preer), a young African-American woman from the South who heads north to raise money for a rural school for black children"}
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "Sylvia takes a job at a Southern school for poor black children ... Sylvia decides to go to Boston to find a rich benefactor"}
- card: within-our-gates
  fact: "A flashback shows a white mob lynching a Black man"
  sources:
    - {title: "Jeff Stafford, TCM: Within Our Gates (1920)", url: "https://www.tcm.com/articles/silent/86539/within-our-gates-1920", quote: "it contained a scene in which a black man is lynched by a white mob"}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "The film’s depiction of a brutal lynching in a flashback sequence"}
- card: within-our-gates
  fact: "Chicago's censor board took two months to pass it; it opened in Chicago in January 1920"
  sources:
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "The film was scheduled to open on 12 Jan 1920 at Hammond’s Vendome Theatre in Chicago ... The past two months had reportedly been spent getting approval from the Chicago Censor Board."}
    - {title: "Jeff Stafford, TCM: Within Our Gates (1920)", url: "https://www.tcm.com/articles/silent/86539/within-our-gates-1920", quote: "At first the film, which eventually had its premiere in Chicago, was rejected by the Chicago Board of Movie Censors"}
- card: within-our-gates
  fact: "Prints were cut over the lynching scenes"
  sources:
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "the picture might have been edited down to six reels, due to controversy over scenes of lynching, rape, and racial conflict"}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "led to much of the most controversial material being removed shortly after its release, through censorship cuts"}
- card: within-our-gates
  fact: "White theatre owners in the South refused to book it"
  sources:
    - {title: "Jeff Stafford, TCM: Within Our Gates (1920)", url: "https://www.tcm.com/articles/silent/86539/within-our-gates-1920", quote: "white theatre owners in the south who catered to black patronage were also offended by Within Our Gates and refused to book it"}
    - {title: "Smithsonian Magazine: Watch the oldest-known surviving film by an African-American director", url: "https://www.smithsonianmag.com/smart-news/watch-oldest-known-surviving-film-african-american-director-180962035/", quote: "Southern movie theaters boycotted the film"}
- card: within-our-gates
  fact: "It was thought lost for decades until a print titled La Negra was identified in the Filmoteca Española in Madrid"
  sources:
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "The film was thought lost for decades, until a film scholar identified a print titled LA NEGRA held in the Filmoteca Española in Madrid"}
    - {title: "Smithsonian Magazine: Watch the oldest-known surviving film by an African-American director", url: "https://www.smithsonianmag.com/smart-news/watch-oldest-known-surviving-film-african-american-director-180962035/", quote: "Within Our Gates was presumed as lost for decades, until that single print called La Negra was discovered in Spain."}
    - {title: "Blackbird (VCU): Oscar Micheaux's Within Our Gates", url: "https://blackbird.vcu.edu/v14n1/gallery/micheaux_o/micheaux.shtml", quote: "The film was thought lost until a single surviving print, under the title La Negra , was found in an archive in Madrid."}
- card: within-our-gates
  fact: "It came to the Library of Congress in 1990 and was restored in 1993"
  sources:
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "That print was repatriated to the Library of Congress in 1990 and subsequently preserved."}
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "was preserved by the Library of Congress’ Motion Picture, Broadcasting and Recorded Sound Division in 1993 from a single surviving print"}
    - {title: "Jeff Stafford, TCM: Within Our Gates (1920)", url: "https://www.tcm.com/articles/silent/86539/within-our-gates-1920", quote: "a copy was discovered in the Spanish Film Archive in Madrid in 1990"}
- card: within-our-gates
  fact: "Only four original English intertitles survived; the rest were translated back from Spanish"
  sources:
    - {title: "AFI Catalog: Within Our Gates (1920)", url: "https://catalog.afi.com/Film/2186-WITHIN-OURGATES", quote: "The original English intertitles remain lost, except in four cases"}
    - {title: "Blackbird (VCU): Oscar Micheaux's Within Our Gates", url: "https://blackbird.vcu.edu/v14n1/gallery/micheaux_o/micheaux.shtml", quote: "The Library of Congress restored the print and translated the intertitles from Spanish back into English in the 1990s."}
- card: within-our-gates
  fact: "It shows lynching from the perspective of its Black victims"
  sources:
    - {title: "Smithsonian Magazine: Watch the oldest-known surviving film by an African-American director", url: "https://www.smithsonianmag.com/smart-news/watch-oldest-known-surviving-film-african-american-director-180962035/", quote: "Like The Birth of a Nation , it portrays a lynching and racial violence—but from a black perspective."}
    - {title: "Brian Meacham, Yale Film Archive: Film Notes, Within Our Gates", url: "https://web.library.yale.edu/node/173201", quote: "a fascinating and cogent response to the racist accusations of Griffith"}
- card: aspects-of-negro-life
  fact: "Douglas painted the four-mural cycle in 1934 for the 135th Street branch of the NYPL, now the Schomburg Center"
  sources:
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "Aaron Douglas completed this four-panel mural, entitled Aspects of Negro Life , in 1934 ... At the time, the Schomburg Center for Research in Black Culture was the 135th Street branch of The New York Public Library."}
    - {title: "Kansas Historical Society, Kansapedia: Aaron Douglas", url: "https://www.kshs.org/kansapedia/aaron-douglas/12036", quote: "One mural series, Aspects of Negro Life , was completed in 1934 for the 135th Street branch of the New York Public Library."}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "the Works Progress Administration asked him to paint four murals for the 135th Street Branch of the New York Public Library"}
- card: aspects-of-negro-life
  fact: "The commission came through a federal New Deal art programme"
  sources:
    - {title: "New Deal Art Registry: Schomburg Center for Research in Black Culture", url: "https://newdealartregistry.org/map/SchomburgCenterForResearchInBlackCulture/NewYork/NY", quote: "Program: Public Work of Arts Project (PWAP)"}
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "in 1934 through the Public Works of Art Project (PWAP)"}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "the Works Progress Administration asked him to paint four murals"}
- card: aspects-of-negro-life
  fact: "Douglas was born in Topeka, Kansas, in 1899"
  sources:
    - {title: "Kansas Historical Society, Kansapedia: Aaron Douglas", url: "https://www.kshs.org/kansapedia/aaron-douglas/12036", quote: "Born: May 26, 1899, Topeka."}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "Aaron Douglas (born May 26, 1899, Topeka , Kansas"}
- card: aspects-of-negro-life
  fact: "He was the leading artist-illustrator of the Harlem Renaissance"
  sources:
    - {title: "Kansas Historical Society, Kansapedia: Aaron Douglas", url: "https://www.kshs.org/kansapedia/aaron-douglas/12036", quote: "Aaron Douglas was the most prominent artist-illustrator of the Harlem Renaissance"}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "was an American painter and graphic artist who played a leading role in the Harlem"}
- card: aspects-of-negro-life
  fact: "He drew the cover of FIRE!!"
  sources:
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "Fire!! had a bright red cover with Primitivist, cubist-inspired art by Aaron Douglas."}
    - {title: "Princeton University Library Graphic Arts: FIRE!! Devoted to Younger Negro Artists (with Thomas H. Wirth, FIRE!! in Retrospect)", url: "https://graphicarts.princeton.edu/2020/02/02/fire-devoted-to-younger-negro-artists/", quote: "Cover design: Aaron Douglas."}
- card: aspects-of-negro-life
  fact: "The four panels are The Negro in an African Setting, An Idyll of the Deep South, From Slavery Through Reconstruction and Song of the Towers"
  sources:
    - {title: "Kansas Historical Society, Kansapedia: Aaron Douglas", url: "https://www.kshs.org/kansapedia/aaron-douglas/12036", quote: "The titles of the four murals are: The Negro In An African Setting , An Idyll of the Deep South , From Slavery Through Reconstruction , and Song of the Towers ."}
    - {title: "New Deal Art Registry: Schomburg Center for Research in Black Culture", url: "https://newdealartregistry.org/map/SchomburgCenterForResearchInBlackCulture/NewYork/NY", quote: "\"An Idyll of the Deep South\" ... \"From Slavery to Reconstruction\" ... \"Song of the Towers\" ... \"The Negro in an African Setting\""}
- card: aspects-of-negro-life
  fact: "Together they run from African roots through slavery to the Great Migration"
  sources:
    - {title: "National Humanities Center, The Making of African American Identity: Aaron Douglas, Song of the Towers", url: "https://nationalhumanitiescenter.org/pds/maai3/migrations/text9/text9read.htm", quote: "The murals outline black history from its African roots through the Great Migration."}
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "Douglas painted these murals to reflect African and African American history, the African American present, and his vision of a promising future."}
- card: aspects-of-negro-life
  fact: "His style used stylised, geometric forms drawing on African sculpture, jazz, dance and cubism"
  sources:
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "graphically incisive motifs and the dynamic incorporation of such influences as African sculpture, jazz music, dance, and abstract geometric forms"}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "Douglas incorporated synthetic cubist forms with stylized and geometric shapes drawn from African art ."}
- card: aspects-of-negro-life
  fact: "In Song of the Towers concentric circles fill the centre (rings of light in the wow)"
  sources:
    - {title: "National Humanities Center, The Making of African American Identity: Aaron Douglas, Song of the Towers", url: "https://nationalhumanitiescenter.org/pds/maai3/migrations/text9/text9read.htm", quote: "Dominating its center is a series of concentric circles, framed by jutting rectangular prisms."}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "He used the rhythm of circles, diagonals, and wavy lines to energize his illustrations"}
- card: aspects-of-negro-life
  fact: "A saxophonist at the centre raises his instrument before the city, expressing the creativity and freedom of the 1920s and the migration north"
  sources:
    - {title: "National Humanities Center, The Making of African American Identity: Aaron Douglas, Song of the Towers", url: "https://nationalhumanitiescenter.org/pds/maai3/migrations/text9/text9read.htm", quote: "more prominent in the mural's center is a saxophone player, with his instrument and free hand raised aloft. Placed before the city"}
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "It is symbolic of the migration of African peoples from the rural South and the Caribbean to the urban industrial centers of the North just after World War I. Standing on the wheel of life in the center of the composition, a saxophonist expresses the creativity of the 1920s and the freedom"}
- card: aspects-of-negro-life
  fact: "Douglas left New York in 1939 to build Fisk University's art department"
  sources:
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "By 1939, Douglas had left New York City to teach at Fisk University"}
    - {title: "Kansas Historical Society, Kansapedia: Aaron Douglas", url: "https://www.kshs.org/kansapedia/aaron-douglas/12036", quote: "in 1939 when Charles S. Johnson, the first African American president of Fisk University, invited him to develop Fisk's art department"}
- card: aspects-of-negro-life
  fact: "The murals are still in the Schomburg and are his best-known work"
  sources:
    - {title: "Living New Deal: Schomburg Center, Douglas Murals (quoting Treasures of The New York Public Library)", url: "https://livingnewdeal.org/sites/schomburg-center-douglas-murals-new-york-ny/", quote: "Site Survival: Extant ... Among his best-known works, the four panels of Aspects of Negro Life"}
    - {title: "Britannica: Aaron Douglas", url: "https://www.britannica.com/biography/Aaron-Douglas", quote: "Collectively titled Aspects of Negro Life , these murals represent the pinnacle of his artistic achievement"}
    - {title: "New Deal Art Registry: Schomburg Center for Research in Black Culture", url: "https://newdealartregistry.org/map/SchomburgCenterForResearchInBlackCulture/NewYork/NY", quote: "Location: Research and Reference Room"}
- card: fire-1926
  fact: "In summer 1926 Thurman, Hurston, Douglas, Davis, Nugent, Bennett and Hughes decided to publish a Negro quarterly of the arts"
  sources:
    - {title: "Langston Hughes, The Big Sea (1940), part III: Black Renaissance (Toronto Metropolitan University Pressbooks edition)", url: "https://pressbooks.library.torontomu.ca/thebigsea/?p=217", quote: "During the summer of 1926, Wallace Thurman, Zora Neale Hurston, Aaron Douglas, John P. Davis, Bruce Nugent, Gwendolyn Bennett, and I decided to publish “a Negro quarterly of the arts” to be called Fire"}
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "conceived in Washington, D.C., by poet Langston Hughes and writer and graphic artist Richard Nugent . The two, along with an editorial board comprising Zora Neale Hurston , Gwendolyn Bennett , John Davis , and Aaron Douglas"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "Associate Editor(s): Langston Hughes Zora Neale Hurston Gwendolyn Bennett Aaron Douglas Richard Bruce John Davis"}
- card: fire-1926
  fact: "As Hughes remembered it, the name meant burning up old ideas, and the magazine would be an outlet beyond The Crisis and Opportunity"
  sources:
    - {title: "Langston Hughes, The Big Sea (1940), part III: Black Renaissance (Toronto Metropolitan University Pressbooks edition)", url: "https://pressbooks.library.torontomu.ca/thebigsea/?p=217", quote: "the idea being that it would burn up a lot of the old, dead conventional Negro-white ideas of the past ... provide us with an outlet for publication not available in the limited pages of the small Negro magazines then existing, the Crisis , Opportunity"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "‘to provide… an outlet for publishing not existing in the hospitable but limited pages of The Crisis or Opportunity ‘”"}
- card: fire-1926
  fact: "Thurman edited it"
  sources:
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "selected the brilliant young critic and novelist Wallace Henry Thurman to edit the publication"}
    - {title: "Langston Hughes, The Big Sea (1940), part III: Black Renaissance (Toronto Metropolitan University Pressbooks edition)", url: "https://pressbooks.library.torontomu.ca/thebigsea/?p=217", quote: "Thurman was to edit it"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "Editor(s): Wallace Thurman"}
- card: fire-1926
  fact: "The only issue came out in November 1926 with a red cover by Douglas"
  sources:
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "despite its demise after the first issue (November 1926)"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "Date of Publication: November 1926 (1.1) ... Fire!! had a bright red cover with Primitivist, cubist-inspired art by Aaron Douglas."}
    - {title: "Princeton University Library Graphic Arts: FIRE!! Devoted to Younger Negro Artists (with Thomas H. Wirth, FIRE!! in Retrospect)", url: "https://graphicarts.princeton.edu/2020/02/02/fire-devoted-to-younger-negro-artists/", quote: "Cover design: Aaron Douglas. Illustrations: Richard Bruce and Aaron Douglas. Vol 1, no. 1, Nov. 1926."}
- card: fire-1926
  fact: "Contents included work by Hurston, Hughes and Countee Cullen"
  sources:
    - {title: "Princeton University Library Graphic Arts: FIRE!! Devoted to Younger Negro Artists (with Thomas H. Wirth, FIRE!! in Retrospect)", url: "https://graphicarts.princeton.edu/2020/02/02/fire-devoted-to-younger-negro-artists/", quote: "Color Struck, a play in four scenes by Zora Neale Hurston ... From the Dark Tower by Counteé Cullen ... Elevator Boy by Langston"}
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "Thurman solicited art, poetry, fiction, drama, and essays from his editorial advisers, as well as from such leading figures of the New Negro movement as Countee Cullen"}
- card: fire-1926
  fact: "Nugent's \"Smoke, Lilies and Jade\" appeared in it, the first literary work on an explicitly homosexual theme published by a Black writer"
  sources:
    - {title: "Princeton University Library Graphic Arts: FIRE!! Devoted to Younger Negro Artists (with Thomas H. Wirth, FIRE!! in Retrospect)", url: "https://graphicarts.princeton.edu/2020/02/02/fire-devoted-to-younger-negro-artists/", quote: "Smoke, Lilies and Jade, a novel, part 1 by Richard Bruce"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "his famous “Smoke, Lilies, and Jade,” which was “the first literary work on an explicitly homosexual theme” to be published by a black person"}
- card: fire-1926
  fact: "The white press barely noticed it; senior figures like Du Bois dismissed it, the young were enthusiastic"
  sources:
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "Responses to the magazine ranged from minimal notice in the white press to heated contention among African American critics. Among the latter, the senior rank of intellectuals , such as W.E.B. Du Bois , tended to dismiss it as self-indulgent, while younger figures reacted with enthusiasm."}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "Opportunity “endorsed the journal enthusiastically,” whereas The Crisis ignored it, as did most white-owned presses"}
- card: fire-1926
  fact: "The money ran out"
  sources:
    - {title: "Britannica: Fire!! (American magazine)", url: "https://www.britannica.com/topic/Fire-American-magazine", quote: "Financial viability quickly proved unattainable"}
    - {title: "Modernist Journals Project (Davidson College): Fire!!", url: "https://modernistmagazines.org/american/fire/", quote: "the necessary funds for a continuation of the magazine were unavailable"}
