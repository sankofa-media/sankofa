    - {title: "Encyclopedia of African-American Culture and History (via Encyclopedia.com): Negro World", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/negro-world", quote: "it was already banned in some British Caribbean territories, Trinidad and British Guiana among them"}
