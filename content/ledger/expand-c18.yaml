    - {title: "The Gleaner: The story of Marcus Garvey, part II (2023)", url: "https://jamaica-gleaner.com/article/news/20231005/story-marcus-garvey-part-ii", quote: "colonial authorities felt threatened by The Negro World because of its strong Pan-African and anticolonial sentiments"}
