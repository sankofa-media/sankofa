- card: negro-world
  fact: "He preached Black pride, an independent Black economy and a Black-governed nation in Africa"
  sources:
    - {title: "Britannica: Marcus Garvey", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "which sought, among other things, to build in Africa a Black-governed nation ... he preached an independent Black economy ... he urged Black Americans to be proud of their identity"}
