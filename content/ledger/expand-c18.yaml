    - {title: "JSTOR Daily: Marcus Garvey's journey began in Central America", url: "https://daily.jstor.org/marcus-garveys-journey-began-in-central-america", quote: "When the authorities in Belize banned the UNIA paper Negro World"}
- card: negro-world
  fact: "Britain and France banned it across their colonies"
  sources:
    - {title: "The National Archives (UK) blog: Garveyism, a letter from the black working class", url: "https://blog.nationalarchives.gov.uk/garveyism-a-letter-from-the-black-working-class", quote: "Britain along with France banned the Negro World newspaper"}
    - {title: "University of Illinois Library, Black Literature collection record: Marcus Garvey", url: "https://bibleaves.library.illinois.edu/catalog/CC_X08856", quote: "British and French authorities deported all UNIA organizers and banned the Negro World from all their colonies"}
- card: negro-world
  fact: "Black seamen, sometimes on their own, smuggled copies around the world"
  sources:
    - {title: "Encyclopedia of African-American Culture and History (via Encyclopedia.com): Negro World", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/negro-world", quote: "Official circulation efforts were supplemented by itinerant seamen who, sometimes acting entirely on their own, took the paper around the world."}
    - {title: "University of Illinois Library, Black Literature collection record: Marcus Garvey", url: "https://bibleaves.library.illinois.edu/catalog/CC_X08856", quote: "but seamen continued to smuggle the paper throughout the world"}
