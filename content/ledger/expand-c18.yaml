    - {title: "Brian D. Valencia, New York Public Library for the Performing Arts: Musical of the Month, Shuffle Along (2012)", url: "https://www.nypl.org/blog/2012/02/10/musical-month-shuffle-along", quote: "Tied to that plot by the thinnest of strands is the unadorned musical-comedy love story"}
