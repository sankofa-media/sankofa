    - {title: "Library of Congress, Chronicling America directory: The Negro World (New York, N.Y.) 1917-1933", url: "https://www.loc.gov/item/sn84037003/", quote: "Official organ of: Universal Negro Improvement Association. ... Vol. 32, no. 11 (Oct. 17, 1933)."}
- card: negro-world
  fact: "Garvey was born in Jamaica in 1887"
  sources:
