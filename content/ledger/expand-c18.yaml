- card: negro-world
  fact: "The paper carried a section in Spanish"
  sources:
    - {title: "Library of Congress, Chronicling America directory: The Negro World (New York, N.Y.) 1917-1933", url: "https://www.loc.gov/item/sn84037003/", quote: "English; includes a section in Spanish."}
    - {title: "NYPL Digital Collections: The Negro World", url: "https://digitalcollections.nypl.org/collections/the-negro-world", quote: "Language: Includes a section in Spanish"}
    - {title: "Encyclopedia of African-American Culture and History (via Encyclopedia.com): Negro World", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/negro-world", quote: "Sections of the paper were for a time published in French and Spanish."}
- card: negro-world
  fact: "Its circulation is said to have reached 200,000 in the 1920s"
  sources:
    - {title: "Encyclopedia of African-American Culture and History (via Encyclopedia.com): Negro World", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/negro-world", quote: "The Negro World 's circulation is said to have reached 200,000 in the 1920s"}
    - {title: "The Gleaner: The story of Marcus Garvey, part II (2023)", url: "https://jamaica-gleaner.com/article/news/20231005/story-marcus-garvey-part-ii", quote: "a worldwide phenomenon with a peak circulation of 200,000"}
    - {title: "University of Illinois Library, Black Literature collection record: Marcus Garvey", url: "https://bibleaves.library.illinois.edu/catalog/CC_X08856", quote: "boasted a circulation as high as 200,000 by 1924"}
