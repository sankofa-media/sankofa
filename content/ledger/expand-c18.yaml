  fact: "He founded the UNIA in Jamaica in 1914 and moved to the US in 1916"
  sources:
    - {title: "Britannica: Marcus Garvey", url: "https://www.britannica.com/biography/Marcus-Garvey", quote: "he founded (August 1, 1914) the Universal Negro Improvement and Conservation Association ... Garvey went to the United States (1916)"}
