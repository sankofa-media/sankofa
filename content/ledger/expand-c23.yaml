  fact: "Ngema died in a car crash in 2023"
  sources:
    - {title: "Mogomotsi Magome, Associated Press: Mbongeni Ngema ... killed in a car crash at 68 (2023)", url: "https://www.click2houston.com/entertainment/2023/12/28/mbongeni-ngema-south-african-playwright-and-creator-of-sarafina-is-killed-in-a-car-crash-at-68/", quote: "Ngema was killed in a head-on accident while returning from a funeral"}
