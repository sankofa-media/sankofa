- card: american-gothic-parks
  fact: "Parks was born in Fort Scott, Kansas, in 1912"
  sources:
    - {title: "Gordon Parks Foundation: Gordon Parks, biography", url: "https://www.gordonparksfoundation.org/gordon-parks/biography", quote: "Born into poverty and segregation in Fort Scott, Kansas, in 1912"}
    - {title: "Kansas Historical Society, Kansapedia: Gordon Parks", url: "https://www.kansashistory.gov/kansapedia/gordon-parks/12165", quote: "born November 30, 1912, in Fort Scott, Kansas"}
- card: american-gothic-parks
  fact: "Parks was self-taught"
  sources:
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "self-trained photographer ... Gordon Parks"}
    - {title: "Gordon Parks Foundation: Gordon Parks, biography", url: "https://www.gordonparksfoundation.org/gordon-parks/biography", quote: "After buying a camera at a pawnshop, he taught himself how to use it"}
- card: american-gothic-parks
  fact: "In 1942 Parks came to Washington to work for the photography section of the FSA"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "In January 1942, Parks arrived in Washington, D.C., to work for the Farm Security Administration (FSA)."}
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "In 1942 ... secured an apprenticeship with the photography branch of the Farm Security Administration"}
- card: american-gothic-parks
  fact: "Within days Parks met bigotry and discrimination he had not expected"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "Parks found bigotry everywhere ... After just a few days, Parks was utterly demoralized."}
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "I had experienced a kind of bigotry and discrimination [in Washington, D.C.] that I never expected to experience."}
- card: american-gothic-parks
  fact: "Ella Watson cleaned the FSA offices"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "Parks approached a Black woman who was cleaning the FSA offices. Her name was Ella Watson."}
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "Ella Watson, who was a housekeeper at FSA headquarters"}
- card: american-gothic-parks
  fact: "Watson was supporting herself and her grandchildren"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "She was now working to support herself and her two grandchildren."}
    - {title: "Jovonna Jones, Southern Cultures 28:2 (2022): Walking with Ella Watson", url: "https://www.southerncultures.org/article/walking-with-ella-watson/", quote: "holding her grandkids ... her adopted granddaughter"}
- card: american-gothic-parks
  fact: "Posed before the flag with a broom in one hand and a mop in the other"
  sources:
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "I put her before the American flag with a broom in one hand and a mop in another."}
    - {title: "National Archives, Prologue (Summer 1997): Pioneering photographers", url: "https://www.archives.gov/publications/prologue/1997/summer/pioneering-photographers", quote: "Ella Watson standing grimly, hauntingly, with mop and broom, next to an American flag"}
- card: american-gothic-parks
  fact: "The picture answers Grant Wood's American Gothic"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "referring to and reinterpreting Grant Wood's celebrated 1930 painting of the same name"}
    - {title: "Buffalo AKG Art Museum: Gordon Parks, American Gothic, Washington, D.C. (1942)", url: "https://buffaloakg.org/artworks/p2017111-american-gothic-washington-dc", quote: "He self-consciously composed the image as an echo of Grant Wood's famous 1930 painting American Gothic"}
- card: american-gothic-parks
  fact: "Filed as 'Washington, D.C. Government charwoman'"
  sources:
    - {title: "Library of Congress: Washington, D.C. Government charwoman (LC-USF34-013407-C)", url: "https://www.loc.gov/item/2017765074/", quote: "title: Washington, D.C. Government charwoman; 1942; Parks, Gordon, photographer (LoC JSON record)"}
    - {title: "Jovonna Jones, Southern Cultures 28:2 (2022): Walking with Ella Watson", url: "https://www.southerncultures.org/article/walking-with-ella-watson/", quote: "the iconic portrait for which they are both known: Washington, DC Government Charwoman"}
- card: american-gothic-parks
  fact: "Parks photographed Watson at home, with her family and in her neighbourhood"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "for four months gave him access to her home and her community ... joyous photos of life within the walls of Watson's church"}
    - {title: "Jovonna Jones, Southern Cultures 28:2 (2022): Walking with Ella Watson", url: "https://www.southerncultures.org/article/walking-with-ella-watson/", quote: "He posed Watson in her apartment ... holding her grandkids"}
- card: american-gothic-parks
  fact: "One of his best-known photographs"
  sources:
    - {title: "Gordon Parks Foundation: Washington, D.C., and Ella Watson, 1942", url: "https://www.gordonparksfoundation.org/gordon-parks/photography-archive/washington-d-c-and-ella-watson-1942", quote: "Among the most famous pictures Parks ever took"}
    - {title: "Kansas Historical Society, Kansapedia: Gordon Parks", url: "https://www.kansashistory.gov/kansapedia/gordon-parks/12165", quote: "one of his best known photographs, American Gothic, Washington, D.C."}
- card: american-gothic-parks
  fact: "Staff photographer for Life"
  sources:
    - {title: "Gordon Parks Foundation: Gordon Parks, biography", url: "https://www.gordonparksfoundation.org/gordon-parks/biography", quote: "a position as the first African American staff photographer for Life"}
    - {title: "Kansas Historical Society, Kansapedia: Gordon Parks", url: "https://www.kansashistory.gov/kansapedia/gordon-parks/12165", quote: "earned Parks a staff position as writer and photographer with Life"}
- card: american-gothic-parks
  fact: "In 1969 he turned his novel The Learning Tree into a Hollywood film"
  sources:
    - {title: "Gordon Parks Foundation: Gordon Parks, biography", url: "https://www.gordonparksfoundation.org/gordon-parks/biography", quote: "In 1969 he became the first African American to write and direct a major Hollywood studio feature film ... The Learning Tree, 1969"}
    - {title: "Kansas Historical Society, Kansapedia: Gordon Parks", url: "https://www.kansashistory.gov/kansapedia/gordon-parks/12165", quote: "The Learning Tree, which he adapted to the movie screen in 1969"}
- card: american-gothic-parks
  fact: "Parks died in 2006"
  sources:
    - {title: "Gordon Parks Foundation: Gordon Parks, biography", url: "https://www.gordonparksfoundation.org/gordon-parks/biography", quote: "continued working until his death in 2006"}
    - {title: "Kansas Historical Society, Kansapedia: Gordon Parks", url: "https://www.kansashistory.gov/kansapedia/gordon-parks/12165", quote: "Died: March 7, 2006, New York City"}
- card: ringgold-die
  fact: "Die was painted in 1967 and belongs to the American People series"
  sources:
    - {title: "Hyperallergic: The fantastic life of Faith Ringgold (2018)", url: "https://hyperallergic.com/477794/the-fantastic-life-of-faith-ringgold/", quote: "'American People Series #20: Die' (1967)"}
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "This 1967, oil on canvas painting is the final work in her American People series"}
- card: ringgold-die
  fact: "Ringgold was born in Harlem in 1930"
  sources:
    - {title: "Hyperallergic: The fantastic life of Faith Ringgold (2018)", url: "https://hyperallergic.com/477794/the-fantastic-life-of-faith-ringgold/", quote: "Faith Ringgold was born on October 8, 1930, amid a cultural renaissance in Harlem"}
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "Born: October 8, 1930 - New York City"}
- card: ringgold-die
  fact: "It responds to the race riots of 1967 / the 1960s"
  sources:
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "during the Long Hot Summer of 1967 when Ringgold was making the paintings, forty-three people died in race-related uprisings in Detroit"}
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "this work depicts the race riots of the 1960s in America as a melee of random violence"}
- card: ringgold-die
  fact: "Bloodied Black and white figures in formal clothes fighting or fleeing"
  sources:
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "The repeating adult figures, African Americans and whites, are injured, and fighting or fleeing ... well-dressed appearances"}
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "the middle-class clothes of the day ... 'these people are not the people who are normally in the street fighting'"}
- card: ringgold-die
  fact: "Two children cling to each other at the centre"
  sources:
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "a white boy and an African-American girl huddle together in the center of the canvas"}
    - {title: "Andrew Russeth, ARTnews: Faith Ringgold on her early art and activism at MoMA (2016), reprinted by ACA Galleries", url: "https://acagalleries.com/news/44/", quote: "Two terrified children hold each other amid the mayhem."}
- card: ringgold-die
  fact: "Ringgold drew on Picasso's Guernica"
  sources:
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "Influenced by both Picasso's Guernica and the depiction of race riots in Jacob Lawrence's The Migration Series"}
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "Guernica showed her that the most effective way to protest and memorialize violence ... was to take absolute care with composition"}
- card: ringgold-die
  fact: "Newman invited her to show at Spectrum on 57th Street and let her use the gallery as a studio; her first solo show"
  sources:
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "In 1967, Robert Newman, director of the Spectrum Gallery on 57th Street in New York invited Ringgold to show these works, and ... to use the gallery as her studio"}
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "an invitation from Robert Newman for a solo show at his co-op gallery Spectrum ... the then-closed gallery that Newman allowed her to use as a studio"}
- card: ringgold-die
  fact: "Famous for story quilts such as Tar Beach"
  sources:
    - {title: "Arwa Mahdawi, The Guardian: The quilts that made America quake (2019)", url: "https://www.theguardian.com/artanddesign/2019/jun/04/faith-ringgold-new-york-artist-serpentine-gallery-london", quote: "Tar Beach #2, one of her signature 'story quilts'"}
    - {title: "The Art Story: Faith Ringgold", url: "https://www.theartstory.org/artist/ringgold-faith/", quote: "Important Art: ... Tar Beach (1988) ... her 1991 children's book Tar Beach"}
- card: ringgold-die
  fact: "MoMA acquired Die in 2016"
  sources:
    - {title: "Hyperallergic: The fantastic life of Faith Ringgold (2018)", url: "https://hyperallergic.com/477794/the-fantastic-life-of-faith-ringgold/", quote: "MoMA had only recently acquired (in 2016) ... 'American People Series #20: Die' (1967)"}
    - {title: "Andrew Russeth, ARTnews: Faith Ringgold on her early art and activism at MoMA (2016), reprinted by ACA Galleries", url: "https://acagalleries.com/news/44/", quote: "Earlier this year [2016], the Museum of Modern Art in New York acquired ... American People Series #20: Die"}
- card: ringgold-die
  fact: "Twelve feet long, painted on two panels, oil"
  sources:
    - {title: "Andrew Russeth, ARTnews: Faith Ringgold on her early art and activism at MoMA (2016), reprinted by ACA Galleries", url: "https://acagalleries.com/news/44/", quote: "a potent 12-foot-long scene ... painted Die on two 6-foot-square canvases"}
    - {title: "Phaidon: Anatomy of an artwork, Die (1967) by Faith Ringgold", url: "https://www.phaidon.com/blogs/stories/anatomy-of-an-artwork-die-1967-by-faith-ringgold", quote: "Oil on canvas, two panels, 72 x 144 in (182.9 x 365.8 cm)"}
- card: liberation-of-aunt-jemima
  fact: "Made in 1972"
  sources:
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "It began in 1972, with a breakthrough work titled 'The Liberation of Aunt Jemima'"}
    - {title: "NPR: Life is a collage for artist Betye Saar (2006)", url: "https://www.npr.org/templates/story/story.php?storyId=6688207", quote: "'The Liberation of Aunt Jemima' was exhibited in 1972."}
