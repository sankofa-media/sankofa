- card: sarafina
  fact: "Mandela released 11 February 1990 after 27 years (third decade in prison in 1987)"
  sources:
    - {title: "South African History Online: Nelson Rolihlahla Mandela", url: "https://www.sahistory.org.za/people/nelson-rolihlahla-mandela", quote: "On Sunday 11 February, after 27 years in prison, Mandela was released from Victor Verster"}
