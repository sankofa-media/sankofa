- card: liberation-of-aunt-jemima
  fact: "In the late 1960s, after a 1967 show of Joseph Cornell's boxes at the Pasadena Art Museum, she turned to assemblage"
  sources:
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "around 1967, when Saar visited an exhibition of the works of Joseph Cornell at the Pasadena Art Museum ... 'I immediately started collecting stuff after I saw that show'"}
    - {title: "Hammer Museum, Now Dig This!: Betye Saar", url: "https://hammer.ucla.edu/now-dig-this/artists/betye-saar/", quote: "After seeing Joseph Cornell's retrospective at the Pasadena Art Museum in 1967, Saar too began to encase her objects in boxes"}
- card: liberation-of-aunt-jemima
  fact: "She collected demeaning images, above all the mammy figure of American kitsch"
  sources:
    - {title: "Associated Press via CNN: Artist Betye Saar ... has died at 99 (2026)", url: "https://www.cnn.com/2026/07/27/style/betye-saar-artist-death", quote: "memorabilia she collected that denigrated Black people, included a 'mammy'"}
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "she's acquired debasing kitsch objects at flea markets and garage sales ... a stereotypical mammy figurine"}
- card: liberation-of-aunt-jemima
  fact: "She armed a smiling mammy figurine with a rifle and a hand grenade"
  sources:
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "she took a stereotypical mammy figurine — and armed her with a rifle and a grenade"}
    - {title: "Associated Press via CNN: Artist Betye Saar ... has died at 99 (2026)", url: "https://www.cnn.com/2026/07/27/style/betye-saar-artist-death", quote: "She smiles, but holds a rifle and a hand grenade."}
- card: liberation-of-aunt-jemima
  fact: "The work made her name and launched a series reclaiming derogatory images"
  sources:
    - {title: "NPR: Life is a collage for artist Betye Saar (2006)", url: "https://www.npr.org/templates/story/story.php?storyId=6688207", quote: "she created the piece that would make her reputation and launch a series of art aimed at reclaiming the derogatory images of Blacks"}
    - {title: "Hammer Museum, Now Dig This!: Betye Saar", url: "https://hammer.ucla.edu/now-dig-this/artists/betye-saar/", quote: "whose lasting influence was secured by her iconic reclamation of the Aunt Jemima figure"}
- card: tutu-enwonwu
  fact: "Enwonwu (1917–1994), founding father of Nigerian modernism"
  sources:
    - {title: "Tate Modern: Nigerian Modernism (exhibition)", url: "https://www.tate.org.uk/whats-on/tate-modern/nigerian-modernism", quote: "the celebrated Nigerian modernist painter Ben Enwonwu (1917–1994)"}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "Benedict Chukwukadibia Enwonwu M.B.E (Nigerian, 1917-1994)"}
- card: tutu-enwonwu
  fact: "Painted in 1974"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "Ben Enwonwu's 1974 painting of the Ife princess Adetutu Ademiluyi"}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "Enwonwu painted three versions of Tutu during 1973-74"}
- card: tutu-enwonwu
  fact: "The sitter was the Ife princess Adetutu Ademiluyi, known as Tutu"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "painting of the Ife princess Adetutu Ademiluyi, known as Tutu"}
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "Depicting the Ife princess Adetutu Ademiluyi (abbreviated as 'Tutu')"}
- card: tutu-enwonwu
  fact: "After the Biafran war; three versions; symbol of national reconciliation"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "painted three versions of Tutu and the image became a symbol of national reconciliation"}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "the image became a symbol of national reconciliation for a country struggling for unity in the wake of the Nigerian-Biafran conflict"}
- card: tutu-enwonwu
  fact: "A national icon, nicknamed the African Mona Lisa"
  sources:
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "Often dubbed the 'African Mona Lisa'"}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "described by ... Ben Okri as Africa's Mona Lisa ... 'The portrait of Tutu is a national icon in Nigeria'"}
- card: tutu-enwonwu
  fact: "All three were lost for decades"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "But all three were lost and became the subject of much speculation."}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "All three paintings had been considered lost until Giles Peppiatt discovered the current picture"}
- card: tutu-enwonwu
  fact: "Peppiatt was regularly sent Tutus that turned out to be prints"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "He estimated he gets sent a Tutu every eight weeks and it invariably turns out to be a print."}
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "People brought him a number of prints but they all transpired to be fakes."}
- card: tutu-enwonwu
  fact: "Late in 2017 a north London family asked him to look at a painting that had hung in their flat for 30 years"
  sources:
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "late last year, a family in north London approached him asking him to come and see a painting"}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "discovered the current picture in a London apartment, where it had hung for the past 30 years"}
- card: tutu-enwonwu
  fact: "Sold at Bonhams London on 28 February 2018 for £1,205,000"
  sources:
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "achieving £1,205,000 at Bonhams Africa Now sale in London today (28 February)"}
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "has sold for over $1.6 million (£1,205,000)"}
- card: tutu-enwonwu
  fact: "More than four times the top estimate"
  sources:
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "It had an estimate of £200,000-300,000."}
    - {title: "Mark Brown, The Guardian: Tutu's return (2018)", url: "https://www.theguardian.com/artanddesign/2018/feb/06/tutus-return-missing-nigerian-masterpiece-found-in-london-flat-ben-enwonwu", quote: "It is expected to sell for between £200,000 and £300,000."}
- card: tutu-enwonwu
  fact: "Bidders in Lagos followed live"
  sources:
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "the sale was broadcast live to a Bonhams auction event in Lagos, where bidders were able to participate in real time"}
    - {title: "Okechukwu Uwaezuoke, ThisDay (Lagos): Enwonwu's Tutu sets new record, sells for £1.205m (2018)", url: "https://www.thisdaylive.com/2018/03/01/enwonwus-tutu-sets-new-record-sells-for-1-205m/", quote: "broadcast live to a Bonhams auction event at The Wheatbaker Hotel in Lagos ... started broadcasting live to the Lagos participants at 6 pm"}
- card: tutu-enwonwu
  fact: "A record for Enwonwu"
  sources:
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "set a new world record for the artist's work at auction"}
    - {title: "Okechukwu Uwaezuoke, ThisDay (Lagos): Enwonwu's Tutu sets new record, sells for £1.205m (2018)", url: "https://www.thisdaylive.com/2018/03/01/enwonwus-tutu-sets-new-record-sells-for-1-205m/", quote: "set a new record for the artist's work at an auction"}
- card: tutu-enwonwu
  fact: "The other two versions were still missing"
  sources:
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "The artist created two other pictures of Ademiluyi, both of which remain missing."}
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "All three paintings had been considered lost until Giles Peppiatt discovered the current picture"}
- card: tutu-enwonwu
  fact: "Painting had hung in the north London flat for thirty years"
  sources:
    - {title: "Bonhams press release: Africa's Mona Lisa smashes world record at Bonhams Africa Now sale in London (28 February 2018)", url: "https://www.bonhams.com/press_release/25681/", quote: "in a London apartment, where it had hung for the past 30 years"}
    - {title: "CNN Style: Ben Enwonwu's Tutu at auction (2018)", url: "https://edition.cnn.com/style/article/ben-enwonwu-tutu-painting-auction/index.html", quote: "the painting had been hanging there for the last 30 years"}
- card: wdia
  fact: "WDIA was one of the new Memphis stations after WWII"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "It was the second new station (after KWAM in 1946), to go on the air in Memphis after the war"}
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "there seemed no need for a sixth radio station playing formats similar to the city's other five stations"}
- card: wdia
  fact: "Black programmes on radio since the All-Negro Hour of 1929"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "receptive to Cooper's desire to produce and air The All Negro Hour in 1929"}
    - {title: "Willie Brenc, BlackPast.org: Jack Leroy Cooper (2013)", url: "https://blackpast.org/aah/cooper-jack-leroy-1888-1970", quote: "In 1929, Joseph Silverstein, owner of WSBC ... agreed to air Cooper's The All-Negro Hour"}
- card: wdia
  fact: "No station had given its whole day to Black listeners before WDIA"
  sources:
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "the nation's first all-black radio station"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "until WDIA's entire schedule was completely filled with various black blocks ... Fulltime black-oriented radio was born."}
- card: wdia
  fact: "In 1948 WDIA was failing"
  sources:
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "In 1948, when the new WDIA radio station was about to go under"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "found survival in the new competitive market very difficult. John Pepper, one of the WDIA owners, was ready to quit."}
- card: wdia
  fact: "Ferguson and Pepper turned to Black listeners; Ferguson hired Nat D. Williams"
  sources:
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "Its owners, Bert Ferguson and John R. Pepper, hired ... the first publicly identified black disc jockey"}
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "Shortly afterwards Ferguson hired Nat D. Williams"}
- card: wdia
  fact: "Williams was a history teacher at Booker T. Washington High School"
  sources:
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "took a teaching job at Booker T. Washington High School in South Memphis. There, he brought history and social studies to life"}
    - {title: "Shelby County Register plaque text: Nat D. Williams (via Read the Plaque)", url: "http://readtheplaque.com/plaque/nat-d-williams", quote: "A history teacher in the Memphis City schools"}
- card: wdia
  fact: "Amateur nights at the Palace Theater on Beale Street from 1935"
  sources:
    - {title: "Shelby County Register plaque text: Nat D. Williams (via Read the Plaque)", url: "http://readtheplaque.com/plaque/nat-d-williams", quote: "Amateur Night on Beale Street, which he began in 1935 at the Old Palace Theater"}
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "He was host of the Palace Theater's famed Beale Street Amateur Night"}
- card: wdia
  fact: "In 1948 Williams became the first Black radio announcer in Memphis"
  sources:
    - {title: "Shelby County Register plaque text: Nat D. Williams (via Read the Plaque)", url: "http://readtheplaque.com/plaque/nat-d-williams", quote: "In 1948, Nat D. Williams became the first black radio announcer in Memphis"}
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "the first African-American disc jockey in Memphis"}
- card: wdia
  fact: "His afternoon show brought money; Black blocks of R&B and gospel filled the schedule"
  sources:
    - {title: "Museum of Broadcast Communications, Encyclopedia of Radio: African-Americans in Radio", url: "https://www.museum.tv/radio-encyclopedia/african-americans-in-radio", quote: "Williams' afternoon program soon brought financial success to WDIA ... until WDIA's entire schedule was completely filled with various black blocks of rhythm-and-blues and gospel"}
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "The programming change proved successful"}
- card: wdia
  fact: "By summer 1949 the first US station with an all-Black on-air staff"
  sources:
    - {title: "Memphis Music Hall of Fame: Nat D. Williams", url: "http://memphismusichalloffame.com/inductee/natdwilliams/", quote: "by the summer of 1949 it became the first station in the United States with an entire cast of black disc jockeys"}
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "In 1948-49 white-owned WDIA ... the nation's first all-black radio station"}
- card: wdia
  fact: "B.B. King was a WDIA disc jockey by 1949"
  sources:
    - {title: "Mississippi Blues Trail: B.B. King Birthplace", url: "https://msbluestrail.org/blues-trail-markers/b-b-king-birthplace", quote: "By 1949 he had found work as a deejay on radio station WDIA"}
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "Recording greats B. B. King and Rufus Thomas worked as disc jockeys"}
- card: wdia
  fact: "WDIA stayed white-owned"
  sources:
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "white-owned WDIA in Memphis"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "Although WDIA ... played music oriented for a black audience, WERD was the only black-owned station to do so at that time."}
- card: destination-freedom
  fact: "WMAQ Chicago, Sunday mornings, 27 June 1948 to August 1950"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "aired on WMAQ in Chicago, Illinois from June 27, 1948 until its cancellation in August of 1950 ... every Sunday morning"}
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "Airing between June 1948 and August 1950 ... Despite airing on Sunday mornings"}
- card: destination-freedom
  fact: "Black performers heard mostly in comedy recycling minstrel stereotypes"
  sources:
    - {title: "Ashleigh Lawrence-Sanders, Black Perspectives (AAIHS) (2018)", url: "https://www.aaihs.org/history-memory-and-the-power-of-black-radio/", quote: "they often appeared in only comedic shows that perpetrated age-old Black stereotypes and minstrelsy"}
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "African-American performers who, as a whole, struggled to find roles outside of comedy programming"}
- card: destination-freedom
  fact: "Durham born in rural Mississippi 1917, to Chicago 1923, Great Migration"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "Born September 6, 1917 in Raymond, Mississippi ... moved north as part of the Great Migration. In 1923 the Durham family settled in Chicago."}
    - {title: "Sonja D. Williams, Flow: Word warrior, Richard Durham (2015)", url: "https://www.flowjournal.org/2015/05/word-warrior-richard-durham/", quote: "Born in rural Mississippi in September 1917, Richard Durham's family migrated ... to Chicago, Illinois in 1923."}
- card: destination-freedom
  fact: "He learned radio writing in the WPA Writers' Project"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "Durham learned how to become a radio scriptwriter while working with the Writers Project of the WPA"}
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "Durham found work in the radio division of the WPA-sponsored Illinois Writers Project"}
- card: destination-freedom
  fact: "Reporter for the Chicago Defender"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "award-winning investigative reporter for the Chicago Defender"}
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "worked as an editor and journalist for the black-owned Chicago Defender"}
- card: destination-freedom
  fact: "Here Comes Tomorrow, first radio soap about a Black family"
  sources:
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "created the first soap opera focused on an African American family, Here Comes Tomorrow"}
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "he debuted the earliest known black soap opera ... 'Here Comes Tomorrow,' that followed the post-War problems of the Redmond family"}
- card: destination-freedom
  fact: "Episode on Crispus Attucks"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "featured profiles on Crispus Attucks"}
    - {title: "Ashleigh Lawrence-Sanders, Black Perspectives (AAIHS) (2018)", url: "https://www.aaihs.org/history-memory-and-the-power-of-black-radio/", quote: "'The Knock Kneed Man,' told the story of Crispus Attucks"}
- card: destination-freedom
  fact: "Episode on Frederick Douglass"
  sources:
    - {title: "Colin McBride, BlackPast.org: Richard Durham (2014)", url: "https://www.blackpast.org/african-american-history/durham-richard-1917-1984/", quote: "Crispus Attucks, Denmark Vesey, and Frederick Douglass"}
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "historical giants such as Harriet Tubman and Frederick Douglass"}
- card: destination-freedom
  fact: "Episode on Harriet Tubman"
  sources:
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "historical giants such as Harriet Tubman"}
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "including Harriet Tubman, Jackie Robinson, and Ida B. Wells"}
- card: destination-freedom
  fact: "Black stars of his own day"
  sources:
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "biographies of black stars including Duke Ellington and Louis Armstrong"}
    - {title: "Sonja D. Williams, Flow: Word warrior, Richard Durham (2015)", url: "https://www.flowjournal.org/2015/05/word-warrior-richard-durham/", quote: "notable contemporary and historical black leaders, including entertainer Lena Horne, diplomat Ralph Bunche"}
- card: destination-freedom
  fact: "Black lives dramatised as a fight for freedom"
  sources:
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "Durham's recurring theme of social and economic freedom"}
    - {title: "Sonja D. Williams, Flow: Word warrior, Richard Durham (2015)", url: "https://www.flowjournal.org/2015/05/word-warrior-richard-durham/", quote: "boldly advocating for freedom, justice and equality for Negroes and all oppressed people"}
- card: destination-freedom
  fact: "WMAQ kept final approval and often insisted on changes"
  sources:
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "WMAQ, retained the right of final approval for all of Durham's scripts and not infrequently used this power to insist on changes"}
    - {title: "Ashleigh Lawrence-Sanders, Black Perspectives (AAIHS) (2018)", url: "https://www.aaihs.org/history-memory-and-the-power-of-black-radio/", quote: "after his Crispus Attucks script was sent back with substantial edits ... wrestled frequently over the supposed militant tone"}
- card: destination-freedom
  fact: "Durham went on writing for radio and television"
  sources:
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "Durham was subsequently hired to write for sponsored network series"}
    - {title: "Sonja D. Williams, Flow: Word warrior, Richard Durham (2015)", url: "https://www.flowjournal.org/2015/05/word-warrior-richard-durham/", quote: "authored a pioneering black drama series on television"}
- card: destination-freedom
  fact: "Durham died in 1984"
  sources:
    - {title: "National Radio Hall of Fame: Richard Durham", url: "https://www.radiohalloffame.com/richard-durham", quote: "Richard Durham died on April 27, 1984."}
    - {title: "Sonja D. Williams, Flow: Word warrior, Richard Durham (2015)", url: "https://www.flowjournal.org/2015/05/word-warrior-richard-durham/", quote: "Until his death in 1984, Durham remained a crusading writer"}
- card: destination-freedom
  fact: "wow: managers fought him over the scripts"
  sources:
    - {title: "Ryan Ellett, Library of Congress, National Recording Registry essay: Destination Freedom", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/DestinationFreedom.pdf", quote: "not infrequently used this power to insist on changes"}
    - {title: "Ashleigh Lawrence-Sanders, Black Perspectives (AAIHS) (2018)", url: "https://www.aaihs.org/history-memory-and-the-power-of-black-radio/", quote: "Durham and the in-house writers at NBC wrestled frequently over the supposed militant tone of his work"}
- card: mary-dee
  fact: "WHOD was a 250-watt station that debuted in 1948 with ethnic programming for immigrants"
  sources:
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "first went on the air on Aug. 1, 1948 ... the 'station of nations'"}
    - {title: "Pittsburgh Broadcast Review: Porky Chedwick (archived)", url: "https://web.archive.org/web/20200709061303/https://www.pbrtv.com/more/special-articles/porky-chedwick-radios-most-ignored-pioneer/", quote: "WHOD AM 860, whose manifest would be to provide ethnic and foreign language programming for Pittsburgh's vast immigrant blue-collar ... 'The Porky Chedwick Show' ... originated in 1948"}
- card: mary-dee
  fact: "Homestead is just outside Pittsburgh"
  sources:
    - {title: "Pittsburgh Broadcast Review: Porky Chedwick (archived)", url: "https://web.archive.org/web/20200709061303/https://www.pbrtv.com/more/special-articles/porky-chedwick-radios-most-ignored-pioneer/", quote: "a small daytime station coming to the suburb"}
    - {title: "Pittsburgh City Paper: Life after WAMO (archived)", url: "https://web.archive.org/web/20150909085913/https://www.pghcitypaper.com/pittsburgh/life-after-wamo/Content?oid=1343383", quote: "WHOD, a modest Homestead AM station"}
- card: mary-dee
  fact: "Mary Dee Dudley is believed to have been the first Black woman DJ in the US"
  sources:
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "Mary Dee Dudley, who is believed to have been the first female, African American disc jockey in the country"}
    - {title: "Pittsburgh Tribune-Review: Music in the Hill ... (archived)", url: "https://web.archive.org/web/20191214164834/https://archive.triblive.com/aande/music/music-in-the-hill-was-a-way-of-life-until-progress-silenced-venues/", quote: "Homestead's WHOD radio's Mary Dee Dudley, aka 'Mary Dee,' the first black female radio DJ"}
- card: mary-dee
  fact: "Porky Chedwick played records of Black musicians he had collected"
  sources:
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "Chedwick collected obscure recordings of African American musicians and started playing them on WHOD"}
    - {title: "Pittsburgh Broadcast Review: Porky Chedwick (archived)", url: "https://web.archive.org/web/20200709061303/https://www.pbrtv.com/more/special-articles/porky-chedwick-radios-most-ignored-pioneer/", quote: "The records Porky aired on WHOD were ones he had collected over the years"}
- card: mary-dee
  fact: "In the late 1940s WHOD delivered Black music and news"
  sources:
    - {title: "Pittsburgh City Paper: Life after WAMO (archived)", url: "https://web.archive.org/web/20150909085913/https://www.pghcitypaper.com/pittsburgh/life-after-wamo/Content?oid=1343383", quote: "Black radio in Pittsburgh started small in the late 1940s. Back then, WHOD ... delivered black music and news."}
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "WHOD played Greek music, Hebrew tunes, polkas and music by African American performers"}
- card: mary-dee
  fact: "In 1956 WHOD dropped its immigrant programming and became WAMO"
  sources:
    - {title: "Pittsburgh Broadcast Review: Porky Chedwick (archived)", url: "https://web.archive.org/web/20200709061303/https://www.pbrtv.com/more/special-articles/porky-chedwick-radios-most-ignored-pioneer/", quote: "WHOD, abandoned its ethnic manifest in 1956 ... re-christened the station WAMO ... WAMO's format became country"}
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "WHOD changed its call letters to WAMO ... changed its format to country and western"}
- card: mary-dee
  fact: "WAMO went on to launch Black radio careers"
  sources:
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "WAMO was the R&B force through the '70s, '80s and '90s ... 'the premier Black radio station in the city of Pittsburgh'"}
    - {title: "Pittsburgh City Paper: Life after WAMO (archived)", url: "https://web.archive.org/web/20150909085913/https://www.pghcitypaper.com/pittsburgh/life-after-wamo/Content?oid=1343383", quote: "WAMO's heyday, however, came in the 1960s, during the civil-rights movement."}
- card: mary-dee
  fact: "'The station of nations' and immigrant audience"
  sources:
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "calling itself the 'station of nations'"}
    - {title: "Pittsburgh Broadcast Review: Porky Chedwick (archived)", url: "https://web.archive.org/web/20200709061303/https://www.pbrtv.com/more/special-articles/porky-chedwick-radios-most-ignored-pioneer/", quote: "'The Station of Nations,' WHOD"}
- card: mary-dee
  fact: "Black radio in Pittsburgh began from that small start"
  sources:
    - {title: "Pittsburgh City Paper: Life after WAMO (archived)", url: "https://web.archive.org/web/20150909085913/https://www.pghcitypaper.com/pittsburgh/life-after-wamo/Content?oid=1343383", quote: "Black radio in Pittsburgh started small in the late 1940s. Back then, WHOD..."}
    - {title: "Joe Pinchot, Pittsburgh Magazine: WAMO celebrates 75 years on the radio in Pittsburgh (2023)", url: "https://www.pittsburghmagazine.com/?p=228963", quote: "WHOD played ... music by African American performers"}
- card: werd
  fact: "Blayton bought the 1,000-watt WERD in 1949 for $50,000"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "The 1,000-watt station, purchased for $50,000"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "In 1949, Blayton made history when he bought the 1,000-watt Atlanta radio station WERD for $50,000."}
- card: werd
  fact: "Blayton taught at Atlanta University"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "Jesse B. Blayton, a professor at Atlanta University and a bank president"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "Blayton also taught accounting at Atlanta University"}
- card: werd
  fact: "By most accounts the first African American station owner (contested: KPRS)"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "WERD in Atlanta became the first radio station in America to be owned by an African American"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "making him the first African American to own and operate a radio station in the United States"}
- card: werd
  fact: "WDIA played to Black listeners from 1948 but was white-owned"
  sources:
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "Although WDIA, established in Memphis, Tennessee in 1948, played music oriented for a black audience, WERD was the only black-owned station"}
    - {title: "Anne-Leslie Owens, Tennessee Encyclopedia: WDIA", url: "https://tennesseeencyclopedia.net/entries/wdia/", quote: "In 1948-49 white-owned WDIA"}
- card: werd
  fact: "In the Prince Hall Masonic building on Auburn Avenue"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "located in the Prince Hall Masons Grand Lodge at 334 Auburn Avenue"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "The station's location in the Prince Hall Masonic Lodge Building"}
- card: werd
  fact: "Blayton turned it toward Black listeners"
  sources:
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "Blayton changed the program format and focused on the local African American audience."}
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "played music and other programming of interest to Black listeners"}
- card: werd
  fact: "In the 1960s the SCLC had its headquarters in the same building"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "also home to Martin Luther King Jr.'s Southern Christian Leadership Conference (SCLC) during the 1960s"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "which also housed the headquarters of the Southern Christian Leadership Conference"}
- card: werd
  fact: "King used WERD for public statements; accounts differ on how"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "It has been said that King would bang on the ceiling with a broomstick ... the WERD disc jockey upstairs would lower a microphone from the window above"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "often walked upstairs to the WERD studio to make public statements"}
- card: werd
  fact: "Blayton sold WERD in 1968 on retiring"
  sources:
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "Jesse B. Blayton, Sr. sold WERD in 1968 upon his retirement."}
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "Blayton Sr. sold the station to white owners in 1968."}
- card: werd
  fact: "Blayton died in Atlanta in 1977"
  sources:
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "He died on September 7, 1977 in Atlanta."}
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "until his death on September 7, 1977"}
- card: werd
  fact: "Blayton inducted into the Radio Hall of Fame in 1995"
  sources:
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "was inducted into the Radio Hall of Fame in 1995"}
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "In 1995, he was inducted into the Radio Hall of Fame."}
- card: werd
  fact: "For almost twenty years Black Atlanta had a station its own people owned"
  sources:
    - {title: "Nick Manos, BlackPast.org: Jesse B. Blayton, Sr. (2009)", url: "https://www.blackpast.org/african-american-history/blayton-sr-jesse-b-1879-1977/", quote: "bought ... in 1949 ... sold WERD in 1968"}
    - {title: "Laurence W. Etling, New Georgia Encyclopedia: WERD", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/werd/", quote: "bought it in 1949 ... sold the station to white owners in 1968"}
