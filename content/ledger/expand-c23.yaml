- card: sarafina
  fact: "Hugh Masekela worked with Ngema on the score"
  sources:
    - {title: "Lincoln Center Theater: Sarafina! (1987)", url: "https://www.lct.org/shows/sarafina/", quote: "South African trumpeter Hugh Masekela ... collaborated with Ngema on the lively score"}
    - {title: "Broadway.com: Mbongeni Ngema, Tony-nominated Sarafina! playwright and director, dies at 68 (2023)", url: "https://www.broadway.com/buzz/203632/mbongeni-ngema-tony-nominated-sarafina-playwright-and-director-dies-at-68/", quote: "Ngema collaborated with South African jazz great Hugh Masekela on the score"}
- card: sarafina
  fact: "The story follows a schoolgirl, Sarafina, who inspires her classmates to fight segregation"
  sources:
    - {title: "Encyclopaedia of South African Theatre, Film, Media and Performance (ESAT), Stellenbosch University: Sarafina!", url: "https://esat.sun.ac.za/index.php/Sarafina", quote: "one girl named Sarafina, who inspired her classmates with her commitment to the struggle against apartheid"}
    - {title: "Mogomotsi Magome, Associated Press: Mbongeni Ngema ... killed in a car crash at 68 (2023)", url: "https://www.click2houston.com/entertainment/2023/12/28/mbongeni-ngema-south-african-playwright-and-creator-of-sarafina-is-killed-in-a-car-crash-at-68/", quote: "told the story of a student and how she inspired her peers to fight against racial segregation"}
- card: sarafina
  fact: "Leleti Khumalo played the title role"
  sources:
    - {title: "Playbill: Sarafina!, Broadway (1988)", url: "https://playbill.com/production/sarafina-cort-theatre-vault-0000003489", quote: "Leleti Khumalo — Sarafina (Original)"}
    - {title: "Encyclopaedia of South African Theatre, Film, Media and Performance (ESAT), Stellenbosch University: Sarafina!", url: "https://esat.sun.ac.za/index.php/Sarafina", quote: "Leleti Khumalo played the title role, Sarafina"}
