  fact: "A small box assemblage"
  sources:
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "a small, shoe box-size assemblage"}
    - {title: "NPR: Life is a collage for artist Betye Saar (2006)", url: "https://www.npr.org/templates/story/story.php?storyId=6688207", quote: "It was a wooden box displaying a full-figured, smiling black mammy"}
- card: liberation-of-aunt-jemima
  fact: "Saar was born in Los Angeles in 1926"
  sources:
    - {title: "NPR: Life is a collage for artist Betye Saar (2006)", url: "https://www.npr.org/templates/story/story.php?storyId=6688207", quote: "Born in Los Angeles back in 1926"}
    - {title: "Los Angeles Times, Carolina A. Miranda column: Betye Saar (2016)", url: "https://www.latimes.com/entertainment/arts/miranda/la-ca-cam-betye-saar-20160501-story.html", quote: "Saar was born Betye Brown in Los Angeles on July 30, 1926"}
- card: liberation-of-aunt-jemima
  fact: "She had trained in design and was raising three daughters"
  sources:
    - {title: "NPR: Life is a collage for artist Betye Saar (2006)", url: "https://www.npr.org/templates/story/story.php?storyId=6688207", quote: "She was a mother, raising three daughters"}
