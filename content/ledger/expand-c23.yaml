- card: sarafina
  fact: "Based on the Soweto uprising of 16 June 1976; thousands of students"
  sources:
    - {title: "South African History Online: 16 June 1976, Soweto Uprising", url: "https://www.sahistory.org.za/article/june-16-soweto-youth-uprising", quote: "between 3000 and 10 000 students"}
