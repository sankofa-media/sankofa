- card: sarafina
  fact: "Ngema wrote the book, music and lyrics and directed"
  sources:
    - {title: "Playbill: Sarafina!, Broadway (1988)", url: "https://playbill.com/production/sarafina-cort-theatre-vault-0000003489", quote: "Book / Music / Lyrics / Director: Mbongeni Ngema"}
