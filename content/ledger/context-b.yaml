# Context pass (cards jerry-lawson … zong): every new fact added while rewriting
# card bodies for context and outcomes, each with at least two independent
# sources and a verbatim supporting quote from each.
- card: jerry-lawson
  fact: "Before the Channel F, home consoles played only the games built into them"
  sources:
    - {title: "The Henry Ford: The F Stands for Fun, Jerry Lawson and the Fairchild Channel F (2021)", url: "https://www.thehenryford.org/explore/blog/jerry-lawson-and-the-fairchild-channel-f-video-entertainment-system", quote: "Until the invention of the video game cartridge, home video games were built directly onto the ROM storage and soldered permanently onto the main circuit board."}
    - {title: "The Washington Post via Bangor Daily News: Gerald Lawson, engineer whose innovation changed video games, dies at 70 (2011)", url: "https://www.bangordailynews.com/2011/04/25/news/gerald-lawson-engineer-whose-innovation-changed-video-games-dies-at-70/", quote: "Unlike other units whose games were preprogrammed by the manufacturer, the Fairchild Channel F enabled players to switch cartridges"}
- card: jerry-lawson
  fact: "Around 1980 Lawson left Fairchild and founded Video Soft (Videosoft), which made software for the Atari 2600"
  sources:
    - {title: "The Henry Ford: The F Stands for Fun, Jerry Lawson and the Fairchild Channel F (2021)", url: "https://www.thehenryford.org/explore/blog/jerry-lawson-and-the-fairchild-channel-f-video-entertainment-system", quote: "Around 1980, Lawson left Fairchild to form Videosoft (ironically, a company dedicated to producing games and software for Atari)"}
    - {title: "The Washington Post via Bangor Daily News: Gerald Lawson, engineer whose innovation changed video games, dies at 70 (2011)", url: "https://www.bangordailynews.com/2011/04/25/news/gerald-lawson-engineer-whose-innovation-changed-video-games-dies-at-70/", quote: "After leaving Fairchild in 1980, he launched Videosoft, a Santa Clara-based company that developed software for the Atari 2600 gaming system"}
- card: jerry-lawson
  fact: "In March 2011 the IGDA's Minority Special Interest Group honoured him, and he died in April 2011"
  sources:
    - {title: "The Strong National Museum of Play: Collection documents the career of video game pioneer Jerry Lawson", url: "https://www.museumofplay.org/blog/collection-documents-the-career-of-video-game-pioneer-jerry-lawson/", quote: "Before he passed away in April 2011, the International Game Developers Association’s Minority Special Interest Group honored him for his contributions to the gaming industry."}
    - {title: "The Washington Post via Bangor Daily News: Gerald Lawson, engineer whose innovation changed video games, dies at 70 (2011)", url: "https://www.bangordailynews.com/2011/04/25/news/gerald-lawson-engineer-whose-innovation-changed-video-games-dies-at-70/", quote: "In March, Lawson was honored by the International Game Developers Association’s Minority Special Interest Group at the Game Developers Conference in San Francisco."}
- card: jerry-lawson
  fact: "The interchangeable cartridge transformed the industry and was carried on in later consoles"
  sources:
    - {title: "The Strong National Museum of Play: Collection documents the career of video game pioneer Jerry Lawson", url: "https://www.museumofplay.org/blog/collection-documents-the-career-of-video-game-pioneer-jerry-lawson/", quote: "The Channel F’s removable game cartridges transformed the industry"}
    - {title: "The Henry Ford: The F Stands for Fun, Jerry Lawson and the Fairchild Channel F (2021)", url: "https://www.thehenryford.org/explore/blog/jerry-lawson-and-the-fairchild-channel-f-video-entertainment-system", quote: "the programmable and interchangeable video game cartridge, which continues to be adapted into modern gaming systems."}
- card: juan-latino
  fact: "He married Ana de Carleval (Carlobal/Carloval), a woman of a noble Granada family"
  sources:
    - {title: "Cambridge University Library: Juan Latino", url: "https://languagecollections-blog.lib.cam.ac.uk/2020/07/10/juan-latino-16th-century-afro-spaniard-freed-slave-poet-and-latin-professor", quote: "Latino married a noble woman, Ana de Carleval"}
    - {title: "BlackPast.org: Juan Latino (ca. 1518–ca. 1594)", url: "https://www.blackpast.org/global-african-history/latino-juan-c-1518-c-1594/", quote: "gave him access to the best houses in Granada where he found his wife Ana Carlobal."}
    - {title: "Eduardo Soler Fiérrez, Juan Latino: biografía", url: "http://culturaypensamientodelospueblosnegros.com/juan-latino-biografia-esclavo-catedratico-granada/", quote: "Logró casarse con Ana de Carloval con la que tuvo cuatro hijos, una dama distinguida hija de un veinticuatro"}
- card: juan-latino
  fact: "With the backing of Archbishop Pedro Guerrero he became a Latin professor in Granada"
  sources:
    - {title: "Cambridge University Library: Juan Latino", url: "https://languagecollections-blog.lib.cam.ac.uk/2020/07/10/juan-latino-16th-century-afro-spaniard-freed-slave-poet-and-latin-professor", quote: "The Archbishop of Granada, Pedro Guerrero appointed him to the professorship of Arts."}
    - {title: "BlackPast.org: Juan Latino (ca. 1518–ca. 1594)", url: "https://www.blackpast.org/global-african-history/latino-juan-c-1518-c-1594/", quote: "Latino, with the help of his protector Archbishop Pedro Guerrero, took up his job as a lecturer in the Cathedral school."}
- card: juan-latino
  fact: "He taught for decades"
  sources:
    - {title: "University of Granada: ¿Quién fue Juan Latino?", url: "https://patrimonio.ugr.es/bien-inmaterial/quien-fue-juan-latino/", quote: "catedrático de Gramática y Lengua Latina de la Universidad de Granada, cargo que ostentó durante cuatro décadas."}
    - {title: "Eduardo Soler Fiérrez, Juan Latino: biografía", url: "http://culturaypensamientodelospueblosnegros.com/juan-latino-biografia-esclavo-catedratico-granada/", quote: "se hizo un excelente maestro que ejerció durante muchos años, ya que fue muy longevo."}
- card: juan-latino
  fact: "He died an old man around (or after) 1594"
  sources:
    - {title: "Cambridge University Library: Juan Latino", url: "https://languagecollections-blog.lib.cam.ac.uk/2020/07/10/juan-latino-16th-century-afro-spaniard-freed-slave-poet-and-latin-professor", quote: "Latino had a long academic career and died in old age ca. 1594."}
    - {title: "BlackPast.org: Juan Latino (ca. 1518–ca. 1594)", url: "https://www.blackpast.org/global-african-history/latino-juan-c-1518-c-1594/", quote: "Latino died on an unknown date after 1594."}
- card: juan-latino
  fact: "In 1652 a Spanish play (Diego Jiménez de Enciso) put his life on stage"
  sources:
    - {title: "Cambridge University Library: Juan Latino", url: "https://languagecollections-blog.lib.cam.ac.uk/2020/07/10/juan-latino-16th-century-afro-spaniard-freed-slave-poet-and-latin-professor", quote: "Diego Jiménez de Enciso wrote a comedy based on Latino’s life (1652)."}
    - {title: "BlackPast.org: Juan Latino (ca. 1518–ca. 1594)", url: "https://www.blackpast.org/global-african-history/latino-juan-c-1518-c-1594/", quote: "the black humanist himself became the object of literature in Diego Jiménez de Enciso’s play La famosa comedia the Juan Latino (1652)"}
- card: kente
  fact: "Kente is a cloth of what is now Ghana"
  sources:
    - {title: "North Carolina Museum of Art: Man’s Cloth in the Darkoro Yesre Pattern", url: "https://learn.ncartmuseum.org/artwork/mans-cloth-in-the-darkoro-yesre-certainly-one-day-you-will-laugh-pattern/", quote: "Kente cloth is a textile that originated in Ghana, West Africa, centuries ago."}
    - {title: "SUNY Cortland: Kente Tradition Grows Stronger (12 March 2019)", url: "https://www2.cortland.edu/news/kente-tradition-grows-stronger", quote: "The traditional, woven kente cloth of Ghana, originally worn by royalty"}
- card: kente
  fact: "The finest kente was once reserved for Asante royalty"
  sources:
    - {title: "North Carolina Museum of Art: Man’s Cloth in the Darkoro Yesre Pattern", url: "https://learn.ncartmuseum.org/artwork/mans-cloth-in-the-darkoro-yesre-certainly-one-day-you-will-laugh-pattern/", quote: "The finest, most intricate kente cloths were once reserved for Akan and Asante royalty."}
    - {title: "SUNY Cortland: Kente Tradition Grows Stronger (12 March 2019)", url: "https://www2.cortland.edu/news/kente-tradition-grows-stronger", quote: "The traditional, woven kente cloth of Ghana, originally worn by royalty"}
- card: kente
  fact: "Bonwire is still the leading centre (capital) of kente weaving"
  sources:
    - {title: "Bowers Museum: Kente Cloth and Naming Conventions", url: "https://bowers.org/index.php/collection/collections-blog/weaving-history-kente-cloth-and-naming-conventions-in-ghana", quote: "two brothers from the Ashanti village of Bonwire, which remains to date the capital of kente"}
    - {title: "Touring Ghana: Bonwire Kente Weaving Village", url: "https://touringghana.com/bonwire-kente-weaving-village/", quote: "Bonwire (a leading town for the production of Kente in Ghana)"}
- card: kente
  fact: "Kente became a symbol of connection to Africa (pan-African identity) for Black Americans"
  sources:
    - {title: "SUNY Cortland: Kente Tradition Grows Stronger (12 March 2019)", url: "https://www2.cortland.edu/news/kente-tradition-grows-stronger", quote: "serves as an important symbol for many African-Americans to highlight their connection to the African continent."}
    - {title: "Bowers Museum: Kente Cloth and Naming Conventions", url: "https://bowers.org/index.php/collection/collections-blog/weaving-history-kente-cloth-and-naming-conventions-in-ghana", quote: "it has now been adopted as symbol of pan-African identity."}
- card: liberia
  fact: "In 1980 soldiers led by (Master Sergeant) Samuel Doe killed President William Tolbert"
  sources:
    - {title: "Library of Congress Country Study, Liberia (1985), via GlobalSecurity: The April 12 Coup", url: "https://www.globalsecurity.org/military/library/report/1985/liberia_1_april12coup.htm", quote: "Led by Master Sergeant Samuel Kanyon Doe, they entered the Executive Mansion, where they killed Tolbert and 27 members of the president's security guard."}
    - {title: "Encyclopedia of World Biography, via Encyclopedia.com: Samuel Kanyon Doe", url: "https://encyclopedia.com/people/history/african-history-biographies/samuel-kanyon-doe", quote: "They stormed the executive mansion and killed President Tolbert."}
- card: liberia
  fact: "The coup ended the rule of the True Whig Party, the party of the Americo-Liberian settler elite"
  sources:
    - {title: "Encyclopedia of World Biography, via Encyclopedia.com: Samuel Kanyon Doe", url: "https://encyclopedia.com/people/history/african-history-biographies/samuel-kanyon-doe", quote: "His seizure of power ended 110 years of rule by the True Whig Party"}
    - {title: "Encyclopedia of World Biography, via Encyclopedia.com: Samuel Kanyon Doe", url: "https://encyclopedia.com/people/history/african-history-biographies/samuel-kanyon-doe", quote: "The True Whig Party had been in power since 1870, and for most of this period Liberian society was dominated by Americo-Liberians"}
    - {title: "Library of Congress Country Study, Liberia (1985), via GlobalSecurity: The April 12 Coup", url: "https://www.globalsecurity.org/military/library/report/1985/liberia_1_april12coup.htm", quote: "Several hundred government officials, politicians, and leaders of the True Whig Party were rounded up and were either detained or placed under house arrest."}
    - {title: "Library of Congress Country Study, Liberia (1985), via GlobalSecurity: The April 12 Coup", url: "https://www.globalsecurity.org/military/library/report/1985/liberia_1_april12coup.htm", quote: "Doe ordered the Constitution suspended, banned political parties"}
- card: mansa-musa
  fact: "Mali was a West African empire rich in gold"
  sources:
    - {title: "South African History Online: The Kingdom of Mali and the city of Timbuktu in the 14th century", url: "https://sahistory.org.za/article/summary-kingdom-mali-and-city-timbuktu-14th-century", quote: "gold flowing northward from the Bambuk and Bure goldfields"}
    - {title: "Northwestern Magazine: A Golden Age, King Mansa Musa’s Reign", url: "https://magazine.northwestern.edu/features/caravans-of-gold-fragments-in-time/a-golden-age-king-mansa-musas-reign", quote: "traveling with an entourage that included 8,000 courtiers, 12,000 servants and 100 camel loads of pure gold."}
- card: mansa-musa
  fact: "Returning from Mecca, Musa brought scholars and an Andalusian architect, and Timbuktu gained the great Djinguereber (Djingareyber) mosque"
  sources:
    - {title: "Northwestern Magazine: A Golden Age, King Mansa Musa’s Reign", url: "https://magazine.northwestern.edu/features/caravans-of-gold-fragments-in-time/a-golden-age-king-mansa-musas-reign", quote: "When the emperor returned from Mecca to Timbuktu, he brought back scholars and an Andalusian architect from Cairo to build a great mosque — Djinguereber"}
    - {title: "South African History Online: The Kingdom of Mali and the city of Timbuktu in the 14th century", url: "https://sahistory.org.za/article/summary-kingdom-mali-and-city-timbuktu-14th-century", quote: "Returning from Mecca, Musa brought with him the Andalusian-Egyptian poet and architect Abu Ishaq al-Sahili"}
    - {title: "South African History Online: The Kingdom of Mali and the city of Timbuktu in the 14th century", url: "https://sahistory.org.za/article/summary-kingdom-mali-and-city-timbuktu-14th-century", quote: "The three great mosques of Timbuktu - Djingareyber (c. 1327)"}
- card: misogyny-in-hip-hop
  fact: "Dr. Dre pleaded no contest to the assault charge"
  sources:
    - {title: "NBC News: Apple responds after Dr. Dre's apology to women he's hurt (22 August 2015)", url: "https://www.nbcnews.com/pop-culture/celebrity/apple-responds-after-dr-dres-apology-women-hes-hurt-n414156", quote: "Dre pleaded no contest to a charge of assault and battery"}
    - {title: "Dazed: Dr. Dre addresses Dee Barnes assault (2017)", url: "https://www.dazeddigital.com/music/article/36725/1/dr-dre-addresses-dee-barnes-assault", quote: "Dre pleaded no contest to misdemeanor battery"}
    - {title: "FACT: Dr. Dre addresses Dee Barnes assault in The Defiant Ones (2017)", url: "https://factmag.com/2017/07/12/dr-dre-addresses-dee-barnes-assault-the-defiant-ones-hbo", quote: "The rapper pleaded no contest to misdemeanor battery"}
- card: misogyny-in-hip-hop
  fact: "Barnes's lawsuit against Dre was settled out of court"
  sources:
    - {title: "Dazed: Dr. Dre addresses Dee Barnes assault (2017)", url: "https://www.dazeddigital.com/music/article/36725/1/dr-dre-addresses-dee-barnes-assault", quote: "settled out of court with Barnes after she sued for $22 million."}
    - {title: "FACT: Dr. Dre addresses Dee Barnes assault in The Defiant Ones (2017)", url: "https://factmag.com/2017/07/12/dr-dre-addresses-dee-barnes-assault-the-defiant-ones-hbo", quote: "Barnes reportedly sued for $22 million, with the case being settled out of court."}
- card: misogyny-in-hip-hop
  fact: "Misogynoir means misogyny directed specifically at Black women"
  sources:
    - {title: "Northwestern: Misogynoir enters Merriam-Webster", url: "https://news.northwestern.edu/stories/2023/05/professor-coins-new-word-misogynoir", quote: "to describe the specific type of oppression that Black women experience often characterized by a combination of racism and sexism."}
    - {title: "Word Origins: misogynoir (2021)", url: "https://www.wordorigins.org/big-list-entries/misogynoir", quote: "a term for misogyny that is unique to or specifically directed at Black women."}
- card: misogyny-in-hip-hop
  fact: "The word misogynoir is now in dictionaries"
  sources:
    - {title: "Northwestern: Misogynoir enters Merriam-Webster", url: "https://news.northwestern.edu/stories/2023/05/professor-coins-new-word-misogynoir", quote: "“Misogynoir” — the newest word included in Merriam-Webster’s dictionary — was coined by Northwestern’s School of Communication associate professor Moya Bailey."}
    - {title: "Dictionary.com: misogynoir", url: "https://www.dictionary.com/browse/misogynoir", quote: "misogynoir ... noun the specific hatred, dislike, distrust, and prejudice directed toward Black women"}
- card: misogyny-in-hip-hop
  fact: "The Tip Drill video aired only on BET's late-night show Uncut"
  sources:
    - {title: "The Hilltop / HU News Service: Spelman says no to Nelly (2004)", url: "https://hunewsservice.com/?p=1355", quote: "which has only been approved to air on BET’s after-hours video program Uncut and local rap video shows due to its racy content."}
    - {title: "Houston Chronicle: Female students spurn Nelly over explicit rap video", url: "https://www.chron.com/entertainment/music/article/female-students-spurn-nelly-over-explicit-rap-1973875.php", quote: "has become popular on BET's late night Uncut show."}
- card: nanny-of-the-maroons
  fact: "The Maroons were people who escaped slavery and formed free communities, Nanny's in the Blue Mountains"
  sources:
    - {title: "National Library of Jamaica: The Maroons", url: "https://www.nlj.gov.jm/history-notes/The%20Maroons%20edited%20final.htm", quote: "The Jamaican Maroons are often described as enslaved Africans and persons of noticeable African descent who ran away or escaped from their masters or owners to acquire and preserve their freedom."}
    - {title: "Colonial Williamsburg: Nanny, Slavery and Remembrance", url: "https://slaveryandremembrance.org/people/person/?id=PP023", quote: "In 1720, Nanny had become the leader of a maroon settlement, Nanny Town, located in the Blue Mountain region."}
- card: nanny-of-the-maroons
  fact: "In 1734 the British took Nanny Town"
  sources:
    - {title: "National Library of Jamaica: The Maroons", url: "https://www.nlj.gov.jm/history-notes/The%20Maroons%20edited%20final.htm", quote: "In 1734, the English managed to capture a major Maroon settlement, Nanny Town"}
    - {title: "Colonial Williamsburg: Nanny, Slavery and Remembrance", url: "https://slaveryandremembrance.org/people/person/?id=PP023", quote: "In 1734, British commander Stoddard destroyed Nanny Town"}
- card: nanny-of-the-maroons
  fact: "The treaties secured Maroon freedom and land but obliged the signers to turn back/return new runaways"
  sources:
    - {title: "AAIHS Black Perspectives: Freedom as Marronage as Anti-capitalism", url: "https://www.aaihs.org/freedom-as-marronage-as-anti-capitalism/", quote: "While grand marronage communities who signed the Treaty – which did not include Jamaican national hero Queen Nanny – attained a measure of recognized autonomy, in return they assented to repelling any new runaway slaves."}
    - {title: "National Library of Jamaica: The Maroons", url: "https://www.nlj.gov.jm/history-notes/The%20Maroons%20edited%20final.htm", quote: "the flogging of two Maroons who were convicted of stealing pigs by a runaway slave they had returned to the authorities in adherence with one of the articles of the Treaties."}
- card: nanny-of-the-maroons
  fact: "The Moore Town Maroons honour Nanny as their leader"
  sources:
    - {title: "National Library of Jamaica: The Maroons", url: "https://www.nlj.gov.jm/history-notes/The%20Maroons%20edited%20final.htm", quote: "another treaty was signed a year later by Nanny, perhaps the most celebrated leader of the Moore Town Maroons."}
    - {title: "Jamaica Gleaner: Nanny was real, not a myth (2018)", url: "http://past.jamaica-gleaner.com/article/lead-stories/20181012/nanny-was-real-not-myth-govt-conferred-order-national-hero-nanny-1976", quote: "Nanny of the Maroon's resting place \"Bump Grave\" in Moore Town, Portland."}
- card: nardal-sisters
  fact: "At the Clamart salon students from the French Caribbean and Africa (Senghor, Césaire) met Harlem Renaissance figures (Claude McKay, Alain Locke)"
  sources:
    - {title: "Marie-Adeline Tavares, Paulette Nardal aux sources de l'internationalisme noir", url: "https://laviedesidees.fr/IMG/pdf/20250527_nardal.pdf", quote: "étudiants à Paris, que sont Léopold Sédar Senghor ou encore Aimé Césaire, croisent les grandes figures de la Harlem Renaissance de passage en France comme Claude McKay, Alain Locke ou Countee Cullen."}
    - {title: "Princeton University Library: La Revue du monde noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/la-revue-du-monde-noir", quote: "the Clamart Salon became the space of encounter between the intellectuals of the Negritude movement and those of the Harlem Renaissance"}
- card: nardal-sisters
  fact: "Césaire, Senghor and Léon-Gontran Damas went on to found Négritude"
  sources:
    - {title: "Princeton University Library: La Revue du monde noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/la-revue-du-monde-noir", quote: "Aimé Césaire, Léopold Sédar Senghor , and Léon-Gontran Damas – the trio that would later be famously known as les Trois Pères of the Negritude movement"}
    - {title: "Modernist Magazines: La Revue du monde noir", url: "https://modernistmagazines.org/european/la-revue-du-monde-noir/", quote: "three of whom would go on to found the Négritude movement: Aimé Césaire, Léopold Senghor, and Léon Damas"}
- card: nardal-sisters
  fact: "The women's contribution was long overlooked"
  sources:
    - {title: "Modernist Magazines: La Revue du monde noir", url: "https://modernistmagazines.org/european/la-revue-du-monde-noir/", quote: "Her contributions to the Négritude movement, too, are often overlooked"}
    - {title: "Marie-Adeline Tavares, Paulette Nardal aux sources de l'internationalisme noir", url: "https://laviedesidees.fr/IMG/pdf/20250527_nardal.pdf", quote: "l’effacement presque total d’une génération de femmes"}
- card: nardal-sisters
  fact: "Back in Martinique Paulette Nardal founded the Rassemblement féminin and a journal (La Femme dans la cité) for women about to vote for the first time"
  sources:
    - {title: "Marie-Adeline Tavares, Paulette Nardal aux sources de l'internationalisme noir", url: "https://laviedesidees.fr/IMG/pdf/20250527_nardal.pdf", quote: "Rentrée à la Martinique en 1939, Paulette Nardal y fonde au sortir du second conflit mondial un périodique, La Femme dans la cité, et un mouvement d’incitation au vote des Martiniquaises, le Rassemblement féminin."}
    - {title: "AAIHS Black Perspectives, Annette Joseph-Gabriel: The Legacy of Martinican Women in French Politics", url: "https://www.aaihs.org/?p=21977", quote: "In 1944, she founded the Rassemblement féminin (Feminine Rally)"}
    - {title: "AAIHS Black Perspectives, Annette Joseph-Gabriel: The Legacy of Martinican Women in French Politics", url: "https://www.aaihs.org/?p=21977", quote: "Nardal therefore saw Woman in the City as an important platform from which to engage in pertinent and sometimes controversial conversations about the role that Martinican women would play as first-time voters"}
- card: nardal-sisters
  fact: "Paulette Nardal died in 1985"
  sources:
    - {title: "Marie-Adeline Tavares, Paulette Nardal aux sources de l'internationalisme noir", url: "https://laviedesidees.fr/IMG/pdf/20250527_nardal.pdf", quote: "Paulette Nardal est d’ailleurs « largement inconnue en Martinique » lorsqu’elle meurt, le 16 février 1985."}
    - {title: "Modernist Magazines: La Revue du monde noir", url: "https://modernistmagazines.org/european/la-revue-du-monde-noir/", quote: "Paulette Nardal (1896 – 1985)"}
- card: ngugi
  fact: "Ngũgĩ criticised the elites/government of independent Kenya"
  sources:
    - {title: "Daily Maverick / Reuters: Ngugi wa Thiong'o dies at 87 (2025)", url: "https://www.dailymaverick.co.za/article/2025-05-29-ngugi-wa-thiongo-kenyan-author-who-reckoned-with-colonial-legacy-dies-at-87.md", quote: "whose sharp criticisms of post-independence elites led to his jailing and two decades in exile"}
    - {title: "NPR via WUSF: Ngũgĩ obituary", url: "https://www.wusf.org/2025-05-29/ngugi-wa-thiongo-kenyan-literary-giant-who-fought-colonialism-dies-at-87", quote: "the Kenyan writer and novelist who critiqued colonial rule as well as the post-colonial Kenyan government"}
- card: ngugi
  fact: "Harassed after his release, he went into exile in 1982"
  sources:
    - {title: "The Star Kenya: Who was Ngũgĩ wa Thiong’o", url: "https://www.the-star.co.ke/news/2025-05-29-who-was-ngugi-wa-thiongo", quote: "Following his release from prison in December 1978, Ngũgĩ faced continued harassment"}
    - {title: "The Star Kenya: Who was Ngũgĩ wa Thiong’o", url: "https://www.the-star.co.ke/news/2025-05-29-who-was-ngugi-wa-thiongo", quote: "compelled him and his family to go into self-imposed exile in 1982, a period that would last for 22 years."}
    - {title: "Daily Maverick / Reuters: Ngugi wa Thiong'o dies at 87 (2025)", url: "https://www.dailymaverick.co.za/article/2025-05-29-ngugi-wa-thiongo-kenyan-author-who-reckoned-with-colonial-legacy-dies-at-87.md", quote: "He went into exile in 1982 after he said he had learnt of plans by President Daniel arap Moi’s security services to arrest and kill him."}
- card: ngugi
  fact: "He taught at the University of California, Irvine"
  sources:
    - {title: "Daily Maverick / Reuters: Ngugi wa Thiong'o dies at 87 (2025)", url: "https://www.dailymaverick.co.za/article/2025-05-29-ngugi-wa-thiongo-kenyan-author-who-reckoned-with-colonial-legacy-dies-at-87.md", quote: "He became a professor of English and comparative literature at the University of California-Irvine."}
    - {title: "NPR via WUSF: Ngũgĩ obituary", url: "https://www.wusf.org/2025-05-29/ngugi-wa-thiongo-kenyan-literary-giant-who-fought-colonialism-dies-at-87", quote: "Ngũgĩ eventually became a professor of comparative literature at the University of California, Irvine"}
- card: ngugi
  fact: "He returned to Kenya in 2004 after about twenty-two years in exile"
  sources:
    - {title: "The Star Kenya: Who was Ngũgĩ wa Thiong’o", url: "https://www.the-star.co.ke/news/2025-05-29-who-was-ngugi-wa-thiongo", quote: "In 2004, Ngũgĩ returned to Kenya after more than two decades in exile."}
    - {title: "Daily Maverick / Reuters: Ngugi wa Thiong'o dies at 87 (2025)", url: "https://www.dailymaverick.co.za/article/2025-05-29-ngugi-wa-thiongo-kenyan-author-who-reckoned-with-colonial-legacy-dies-at-87.md", quote: "After two decades in exile, he returned to Kenya in 2004"}
- card: nollywood
  fact: "The film came out of a time of economic hardship in Nigeria (late 1980s–early 1990s, structural adjustment)"
  sources:
    - {title: "MUBI Notebook: Nollywood Unlimited and Living in Bondage", url: "https://mubi.com/en/notebook/posts/mubi-podcast-expanded-nollywood-unlimited-and-living-in-bondage", quote: "the film’s enduring narrative is rooted in the socio-economic problems of late 80s and early 90s Nigeria."}
    - {title: "Africa Is a Country: Who started Nollywood? (2026)", url: "https://africasacountry.com/2026/09/who-started-nollywood", quote: "landed hard in a country deep in structural adjustment-era desperation, when stories of ritual money were part of the cultural air people breathed."}
- card: nollywood
  fact: "Plot: Andy Okeke joins an occult society, sacrifices his wife for wealth and is haunted by her ghost; stories of ritual money were current"
  sources:
    - {title: "ThisDay: 'Living in Bondage', where new and old school meld (2019)", url: "https://www.thisdaylive.com/2019/10/26/living-in-bondage-where-new-and-old-school-meld", quote: "follows the story of an ambitious young man Andy Okeke (played by Kenneth Okonkwo) who sacrificed his wife to become wealthy."}
    - {title: "MUBI Notebook: Nollywood Unlimited and Living in Bondage", url: "https://mubi.com/en/notebook/posts/mubi-podcast-expanded-nollywood-unlimited-and-living-in-bondage", quote: "Driven by greed, he joins the occult and sacrifices his wife as part of a money-making ritual."}
    - {title: "ThisDay: 'Living in Bondage', where new and old school meld (2019)", url: "https://www.thisdaylive.com/2019/10/26/living-in-bondage-where-new-and-old-school-meld", quote: "The consequences of his actions would later haunt him as the spirit of his dead wife sought justice."}
    - {title: "MUBI Notebook: Nollywood Unlimited and Living in Bondage", url: "https://mubi.com/en/notebook/posts/mubi-podcast-expanded-nollywood-unlimited-and-living-in-bondage", quote: "Thanks to Merit’s restive ghost however, public celebrations will cause Andy much torture."}
    - {title: "Africa Is a Country: Who started Nollywood? (2026)", url: "https://africasacountry.com/2026/09/who-started-nollywood", quote: "a man who joins an occult society and sacrifices his wife for wealth, only to be haunted by what he’s done"}
- card: nollywood
  fact: "In 2019 a sequel, Living in Bondage: Breaking Free, was released in cinemas"
  sources:
    - {title: "ThisDay: 'Living in Bondage', where new and old school meld (2019)", url: "https://www.thisdaylive.com/2019/10/26/living-in-bondage-where-new-and-old-school-meld", quote: "Nouah announced the remake had become a sequel now titled, Living in Bondage: Breaking Free."}
    - {title: "ThisDay: 'Living in Bondage', where new and old school meld (2019)", url: "https://www.thisdaylive.com/2019/10/26/living-in-bondage-where-new-and-old-school-meld", quote: "The sequel is set for release in cinemas on November 8"}
    - {title: "MUBI Notebook: Nollywood Unlimited and Living in Bondage", url: "https://mubi.com/en/notebook/posts/mubi-podcast-expanded-nollywood-unlimited-and-living-in-bondage", quote: "its recent 2019 sequel Living in Bondage: Breaking Free"}
- card: nsibidi
  fact: "The Abakuá society is still active in Cuba today"
  sources:
    - {title: "OnCuba Magazine: Chivo que rompe tambó, verdad y mito del abakuá", url: "https://oncubanews.com/informe/chivo-que-rompe-tambo-verdad-y-mito-del-abakua", quote: "Desde 2005, una Resolución dictada por el Ministerio de Justicia reconoce a la Asociación Abakuá de Cuba"}
    - {title: "Ivor L. Miller, Abakuá, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/abakua", quote: "Abakuá consider their society to exist as a separate state within the nation, with their own language and laws."}
- card: nsibidi
  fact: "Elphinstone Dayrell was the British District Commissioner at Ikom, and his 1911 article gave nsibidi signs with their meanings"
  sources:
    - {title: "Royal Anthropological Institute archives MS 23", url: "https://therai.org.uk/archives-and-manuscripts/manuscript-contents/0023-dayrell-elphinstone-ms-23/", quote: "Dayrell, FRGS, FRAI, District Commissioner Ikom, Southern Nigeria [Ikom, 20 May 1911]"}
    - {title: "Dayrell, JRAI 41 (1911): nsibidi signs of the Egbo society", url: "https://zenodo.org/records/1449623/files/article.pdf", quote: "Further Notes on 'Nsibidi Signs with Their Meanings from the Ikom District, Southern Nigeria. Author(s): Elphinstone Dayrell"}
- card: nzinga
  fact: "Ndongo was a kingdom of the Mbundu (Kimbundu) people, in today's Angola"
  sources:
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "The Kingdom of Ndongo was established by the Mbundu people living on the Western coast of Central Africa."}
    - {title: "Boston University: The Enduring Power of Queen Njinga", url: "https://www.bu.edu/articles/2011/the-enduring-power-of-queen-njinga", quote: "Today the Kimbundu, Njinga’s tribe, comprise 23 percent of Angola’s population"}
- card: nzinga
  fact: "From Luanda the Portuguese waged war on Ndongo for land and slaves"
  sources:
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "From the 1580s Portugal was in constant war with the Kingdom of Ndongo in an effort to conquer more land and acquire more slaves"}
    - {title: "Linda Heywood: Njinga, Dictionary of African Christian Biography", url: "https://dacb.org/stories/angola/njinga/", quote: "de Novais and subsequent royal officials made constant wars in their desire to establish a permanent coastal enclave and strategic military outposts along the Kwanza River for their slave trading activities."}
- card: nzinga
  fact: "In Luanda she won a peace treaty and was baptised Ana de Sousa, but fighting soon resumed"
  sources:
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "To improve her negotiating position she allowed herself to be baptised as a Catholic and took the Christian name Ana de Sousa"}
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "Njinga managed to negotiate a peace treaty with the Portuguese, but it was broken by the Portuguese almost as soon as she had left Luanda."}
    - {title: "Linda Heywood: Njinga, Dictionary of African Christian Biography", url: "https://dacb.org/stories/angola/njinga/", quote: "she went to Luanda and conducted successful peace negotiations."}
    - {title: "Linda Heywood: Njinga, Dictionary of African Christian Biography", url: "https://dacb.org/stories/angola/njinga/", quote: "Njinga, at forty years, took the baptismal name of Azevedo’s wife Ana, who also served as her godmother, and the surname de Sousa"}
- card: nzinga
  fact: "The Dutch held Luanda from 1641 until 1648, when the Portuguese drove them out"
  sources:
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "in 1641 an armada of Dutch ships attacked and seized Luanda"}
    - {title: "South African History Online: Njinga Ana de Sousa", url: "https://sahistory.org.za/people/njinga-ana-de-sousa", quote: "The tide would turn in 1648 however, as an armada from Brazil came to the assistance of the Portuguese forces"}
    - {title: "John K. Thornton, Legitimacy and Political Power: Queen Njinga, 1624-1663, Journal of African History 32 (1991)", url: "https://www.cambridge.org/core/product/identifier/S0021853700025329/type/journal_article", quote: "Dutch soldiers who served in her army during the Dutch occupation of Angola, 1641–8"}
- card: nzinga
  fact: "She died in 1663 at about eighty, still a queen"
  sources:
    - {title: "Boston University: The Enduring Power of Queen Njinga", url: "https://www.bu.edu/articles/2011/the-enduring-power-of-queen-njinga", quote: "Njinga, who was born around 1583 and whose cinematic life ended peacefully at 80"}
    - {title: "Linda Heywood: Njinga, Dictionary of African Christian Biography", url: "https://dacb.org/stories/angola/njinga/", quote: "one of the Capuchin missionaries who ministered to Njinga from 1657 to her death in 1663"}
- card: rock-n-roll
  fact: "Chess Records issued \"Rocket 88\" crediting Jackie Brenston, one of Ike Turner's saxophonists, and in June 1951 it went to number one on Billboard's rhythm and blues chart."
  sources:
    - {title: "Blues Foundation Hall of Fame: Rocket 88 (Jim O'Neal, 1991)", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "turned the mike over to one of his saxophonists, Jackie Brenston, for the uptempo 'Rocket '88.' ... 1 on the R&B charts (Chess Records' first chart-topper)"}
    - {title: "Saturday Evening Post: The Very First Rock and Roll Song", url: "https://www.saturdayeveningpost.com/2021/03/the-very-first-rock-and-roll-song/", quote: "Licensed to Chess Records, who switched the band's name on the label, the song went to #1 on the Billboard R&B records chart that June"}
- card: rock-n-roll
  fact: "White singers built careers on covers of Black artists' records, and by the mid-1950s the name rock and roll was applied mostly to white musicians such as Elvis Presley, though Black musicians remained crucial to the music."
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "Several established and/or advanced their careers in rock ‘n’ roll by covering the recordings of Black artists"}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "By the mid-1950s, as more and more white teenagers began to listen to rhythm and blues, the scope of the term rock and roll expanded and was primarily applied to white musicians such as Elvis Presley ... However, black musicians remained crucial to the development of rock and roll even after the term was being applied mostly to white musicians."}
- card: rosetta-tharpe
  fact: "Sister Rosetta Tharpe was born in 1915 in Cotton Plant, Arkansas, and as a child performed with her mother, an evangelist of the (Pentecostal) Church of God in Christ."
  sources:
    - {title: "Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "Rosetta Tharpe was born in Cotton Plant (Woodruff County) on March 20, 1915, to Katie Bell Nubin Atkins—an evangelist, singer, and mandolin player for the Church of God in Christ (COGIC) ... By age six, she appeared regularly with her mother"}
    - {title: "PBS American Masters: Timeline, the years of Sister Rosetta Tharpe", url: "https://www.pbs.org/wnet/americanmasters/timeline-the-years-of-sister-rosetta-tharpe/2487/", quote: "1915 – Rosie Etta Atkins is born in Cotton Plant, Arkansas, on March 20 ... 1920s-30s – Rosabell and her mother, Katie Bell, evangelize for the Church of God in Christ."}
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "With her mother, an evangelist, she came of age as a singer and instrumentalist at Southern tent meetings, churches, and religious revivals."}
- card: rosetta-tharpe
  fact: "The 1964 Manchester performance was filmed for British television before an audience of young British fans."
  sources:
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "The Blues and Gospel Caravan, as the TV show based on the 1964 tour was dubbed, was filmed at a defunct suburban Manchester, England, railroad station ... On one side of the tracks are bleachers filled with long-haired white British kids"}
    - {title: "Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "The burgeoning British rock-and-roll scene of the early 1960s benefitted many of the pioneering African-American gospel/blues singers, as they were often credited as influences by the young, roots-based rockers."}
- card: rosetta-tharpe
  fact: "After a stroke in 1970 she lost a leg (amputation)."
  sources:
    - {title: "Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "A stroke in 1970 necessitated a leg amputation and caused speech difficulties, but it merely slowed her down."}
    - {title: "PBS American Masters: Timeline, the years of Sister Rosetta Tharpe", url: "https://www.pbs.org/wnet/americanmasters/timeline-the-years-of-sister-rosetta-tharpe/2487/", quote: "1970 – Rosetta falls ill, probably with a stroke, in Switzerland ... 1971 – Rosetta undergoes amputation of a leg due to complications from diabetes."}
- card: saint-georges
  fact: "Joseph Bologne was born in Guadeloupe to a French planter and an enslaved woman, Nanon, and was taken to France as a child."
  sources:
    - {title: "Handel and Haydn Society: Joseph Bologne", url: "https://handelandhaydn.org/joseph-bologne-chevalier-de-saint-georges-through-the-years/", quote: "his birth to an enslaved mother, Nanon, on the Caribbean island of Basse-Terre, part of the French colony of Guadeloupe. ... Soon the family was forced to flee to France"}
    - {title: "BBC Music Magazine: Paul Riley on Joseph Bologne", url: "https://www.classical-music.com/features/composers/bologne-joseph", quote: "Born in Guadeloupe ... to a French colonial plantation owner, George Bologne de Saint-Georges, ... and his mistress, a young Senegalese slave, Joseph was taken to Paris at an early age to acquire the education of a gentleman."}
- card: saint-georges
  fact: "Proposed as director of the Paris Opéra, he was blocked when singers objected, partly on racial grounds, to working under him, and he did not get the post."
  sources:
    - {title: "Handel and Haydn Society: Joseph Bologne", url: "https://handelandhaydn.org/joseph-bologne-chevalier-de-saint-georges-through-the-years/", quote: "he was put forward as a proposed music director of the Paris Opéra, where four leading female singers petitioned Marie Antoinette to prevent them from having to “submit to the orders of a mulatto.” He was denied the job"}
    - {title: "BBC Music Magazine: Paul Riley on Joseph Bologne", url: "https://www.classical-music.com/features/composers/bologne-joseph", quote: "The directorship of the Paris Opéra was up for grabs, and to many he was the obvious candidate. ... Partly racially motivated, and perhaps fearful too at how a new broom might sweep clean, a small cabal within the company objected and Bologne withdrew."}
- card: saint-georges
  fact: "He was imprisoned during the Terror, survived, and died in Paris in 1799."
  sources:
    - {title: "Handel and Haydn Society: Joseph Bologne", url: "https://handelandhaydn.org/joseph-bologne-chevalier-de-saint-georges-through-the-years/", quote: "Bologne was imprisoned the following year during the deadly paranoia of the Reign of Terror. ... before dying of an infection in 1799."}
    - {title: "BBC Music Magazine: Paul Riley on Joseph Bologne", url: "https://www.classical-music.com/features/composers/bologne-joseph", quote: "he endured lengthy imprisonment – only escaping Madame La Guillotine by a whisker. ... Bologne died in Paris in 1799 of a bladder infection."}
- card: slavevoyages
  fact: "SlaveVoyages was led among others by the historian David Eltis of Emory University; the 2008 website covered nearly 35,000 voyages."
  sources:
    - {title: "Emory Report: Slave trade database goes online (24 November 2008)", url: "https://news.emory.edu/emory-report-archive/erarchive/2008/November/Nov24/SlaveTradeDatabase.htm", quote: "“‘Voyages’ provides searchable information on almost 35,000 trans-Atlantic voyages hauling human cargo, as well as maps, images and data on some individual Africans transported,” says Eltis."}
    - {title: "Associated Press via Lawrence Journal-World: Database catalogs slaves' trans-Atlantic treks", url: "https://www2.ljworld.com/news/2008/dec/06/database-catalogs-slaves-trans-atlantic-treks/", quote: "said Emory history professor David Eltis, who helped direct the project. ... includes searchable information on nearly 35,000 trips"}
- card: slavevoyages
  fact: "African Origins uses the Africans' own names to help trace their homelands."
  sources:
    - {title: "Nicholas Radburn, USC Dornsife (2017)", url: "https://dornsife.usc.edu/news/stories/a-digital-archive-of-slave-voyages-details-the-largest-forced-migration-in-history/", quote: "By combining those names with information from Voyages on liberated Africans’ ports of origin, the Origins website aims to better understand the homelands from which enslaved people came."}
    - {title: "Associated Press via Lawrence Journal-World: Database catalogs slaves' trans-Atlantic treks", url: "https://www2.ljworld.com/news/2008/dec/06/database-catalogs-slaves-trans-atlantic-treks/", quote: "because the database lists the slaves’ African names — which were later Westernized — researching an ancestor by name is difficult."}
- card: slavevoyages
  fact: "In 2025 Harvard's Hutchins Center announced that SlaveVoyages, with all its databases, would make its permanent home at Harvard."
  sources:
    - {title: "Harvard Gazette: Slave trade database moving to Harvard (April 2025)", url: "https://news.harvard.edu/gazette/story/2025/04/slave-trade-database-moving-to-harvard/", quote: "Word of the project’s upcoming move was shared recently by Henry Louis Gates Jr., ... director of the Hutchins Center for African & African American Research."}
    - {title: "Harvard Crimson: Initiative to Digitize Records of Slave Trade Will Move to Harvard (28 April 2025)", url: "https://www.thecrimson.com/article/2025/4/28/slavevoyages-research-moves-to-harvard/", quote: "“I’m pleased to tell you today that the SlaveVoyages site, with all of its databases, will live in perpetuity here at Harvard University,” Gates announced"}
- card: sojourner-truth
  fact: "Sojourner Truth was born Isabella in 1797, enslaved in Dutch-speaking Ulster County, New York."
  sources:
    - {title: "National Park Service: Sojourner Truth", url: "https://www.nps.gov/articles/sojourner-truth.htm", quote: "Born into slavery in 1797, Isabella Baumfree, who later changed her name to Sojourner Truth"}
    - {title: "National Women's History Museum: Sojourner Truth", url: "https://www.womenshistory.org/education-resources/biographies/sojourner-truth", quote: "Born Isabella Bomfree in 1797 in Dutch-speaking Ulster County, New York, she grew up enslaved by multiple owners."}
- card: sojourner-truth
  fact: "She walked away from slavery and in 1843 took the name Sojourner Truth to preach."
  sources:
    - {title: "National Park Service: Sojourner Truth", url: "https://www.nps.gov/articles/sojourner-truth.htm", quote: "“I did not run away, I walked away by daylight….” After experiencing a religious conversion, Isabella became an itinerant preacher and in 1843 changed her name to Sojourner Truth."}
    - {title: "National Women's History Museum: Sojourner Truth", url: "https://www.womenshistory.org/education-resources/biographies/sojourner-truth", quote: "In 1843, she declared that the Spirit had called her to preach the truth, renaming herself Sojourner Truth."}
- card: sojourner-truth
  fact: "Gage's 1863 version became the famous one and is still reprinted."
  sources:
    - {title: "Library of Congress, Headlines & Heroes: Sojourner Truth's most famous speech (2021)", url: "https://blogs.loc.gov/headlinesandheroes/2021/04/sojourner-truths-most-famous-speech/", quote: "Twelve years passed before the more famous version of Truth’s speech appeared ... In 1972, Gage’s version was presented without dialect by Miriam Schneir in her Feminism: The Essential Historical Writings and such versions continue to appear to the present."}
    - {title: "The Sojourner Truth Project: Compare the speeches", url: "https://www.thesojournertruthproject.com/compare-the-speeches", quote: "The most common yet inaccurate rendering of Truth's speech—the one that introduced the famous phrase \"Ar'n't I a woman?\"—was constructed by Frances Dana Gage"}
- card: sojourner-truth
  fact: "Truth went on speaking for abolition and women's rights and died in Battle Creek, Michigan, in 1883."
  sources:
    - {title: "National Park Service: Sojourner Truth", url: "https://www.nps.gov/articles/sojourner-truth.htm", quote: "She continued to speak out for the rights of African Americans and women during and after the Civil War. ... Sojourner Truth died in Battle Creek, Michigan, in 1883."}
    - {title: "Library of Congress, Headlines & Heroes: Sojourner Truth's most famous speech (2021)", url: "https://blogs.loc.gov/headlinesandheroes/2021/04/sojourner-truths-most-famous-speech/", quote: "Gage’s account, as well as Stowe’s profile, added to Truth’s fame while she continued to lecture until 1880. There were many obituaries following Sojourner Truth’s death on November 26, 1883"}
- card: spirituals
  fact: "In 1873 the Fisk Jubilee Singers sang for Queen Victoria."
  sources:
    - {title: "National Geographic: The Fisk Jubilee Singers", url: "https://www.nationalgeographic.com/history/article/the-fisk-jubilee-singers-amazing-story-from-slavery-to-stardom", quote: "A large portrait of the original Singers (background) was a gift from Queen Victoria following a command performance for Her Majesty in 1873."}
    - {title: "PBS American Experience: Jubilee Singers", url: "https://www.pbs.org/wgbh/americanexperience/films/singers/", quote: "Only one day after their London debut, the singers were astonished to find themselves performing before none other than Queen Victoria herself."}
- card: spirituals
  fact: "The Jubilee Singers' money saved Fisk University and built Jubilee Hall, which still stands on the campus."
  sources:
    - {title: "Fisk University: History", url: "https://www.fisk.edu/about/history/", quote: "raised funds that preserved their University and permitted construction of Jubilee Hall, the South's first permanent structure built for the education of black students. As a designated National Historical Landmark, today, Jubilee Hall remains the dramatic focal point of Fisk's campus."}
    - {title: "PBS American Experience: Jubilee Singers", url: "https://www.pbs.org/wgbh/americanexperience/films/singers/", quote: "The singers who returned to Nashville were honored by Fisk for raising over one hundred and sixty-thousand dollars to complete Jubilee Hall, and save their school."}
    - {title: "National Geographic: The Fisk Jubilee Singers", url: "https://www.nationalgeographic.com/history/article/the-fisk-jubilee-singers-amazing-story-from-slavery-to-stardom", quote: "They introduced Black spirituals to the world—and saved their university from financial ruin."}
- card: steelpan
  fact: "Trinidad's British colonial authorities banned drumming, people turned to tamboo bamboo, and when bamboo too was banned, oil drums followed."
  sources:
    - {title: "Oxford Business Group: The story of the steel drum in Trinidad and Tobago (2015)", url: "https://oxfordbusinessgroup.com/reports/trinidad-tobago/2015-report/economy/the-story-of-the-steel-drum-in-trinidad-and-tobago", quote: "This was followed by a ban on the unlicensed playing of all percussion, string and wood-wind instruments. In one of the initial attempts to circumvent the ban, local residents innovated by creating the Tamboo-Bamboo ... by the 1930s it too was banned, triggering a new wave of musical innovation."}
    - {title: "Discover Trinidad and Tobago: The steelpan", url: "https://www.discovertnt.com/articles/Trinidad/Steelbands/136/3/19", quote: "When the colonial government banned drumming, bamboo branches were used in what came to be known as tambu bamboo bands. During World War II, the government banned both tambu bamboo and Carnival."}
- card: stolen-legacy
  fact: "The Egyptian 'mystery system' in Stolen Legacy derives from Masonic lore traced by scholars to an eighteenth-century French novel, the Abbé Terrasson's Sethos."
  sources:
    - {title: "Bryn Mawr Classical Review 1996.05.07: Lawrence Tritle on Lefkowitz", url: "https://bmcr.brynmawr.edu/1996/1996.05.07", quote: "Lefkowitz rejects James’ argument that there was any sort of a universal “Egyptian mystery system.” ... The discussion of “Egyptian mysteries” leads to one detailing the emergence of Masonic rituals and beliefs from the French Enlightenment work Sethos published by the Abbé J. Terrasson"}
    - {title: "Thomas G. Palaima, review of Not Out of Africa, National Review, 25 March 1996", url: "https://sites.utexas.edu/scripts/files/2020/06/1996-TGP-revNotOutOfAfrica.pdf", quote: "myth of Egypt as the fons et origo of all European learning and culture was invented in the eighteenth century in a popular Bildungsroman ... By tracing an intellectual pedigree from Terrasson through Blyden, Du Bois, and Garvey to James"}
- card: stolen-legacy
  fact: "Stolen Legacy became an important text of the Afrocentric movement."
  sources:
    - {title: "Thomas G. Palaima, review of Not Out of Africa, National Review, 25 March 1996", url: "https://sites.utexas.edu/scripts/files/2020/06/1996-TGP-revNotOutOfAfrica.pdf", quote: "the entire Afrocentrist intellectual movement of which Stolen Legacy is an important component"}
    - {title: "Bryn Mawr Classical Review 1996.05.07: Lawrence Tritle on Lefkowitz", url: "https://bmcr.brynmawr.edu/1996/1996.05.07", quote: "Lefkowitz refutes the Afrocentric assertion that the Greeks “stole” their philosophy from Egypt, a point made most famous in G. James’ Stolen Legacy."}
- card: stono-drum-ban
  fact: "South Carolina in 1739 had an enslaved Black majority, and Spanish Florida promised freedom to escaped slaves."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "resulted in legislation designed to control slaves and lessen the chances of insurrection by the colony’s black majority population ... claim freedom in Spanish-controlled Florida"}
    - {title: "National Humanities Center: The Stono Rebellion", url: "http://nationalhumanitiescenter.org/pds/becomingamer/peoples/text4/stonorebellion.pdf", quote: "the King of Spain (then at Peace with Great Britain) promised Protection and freedom to all Negroes Slaves that would resort thither."}
    - {title: "Smithsonian NMAAHC: Becoming Black, resistance", url: "https://www.searchablemuseum.com/becoming-black-resistance/", quote: "The Akan, Bambara, Igbo, and others formed a Black majority in the Lowcountry."}
- card: stono-drum-ban
  fact: "Several of the rebels came from Kongo."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "several of the insurgents originated from the heavily Catholic Kongo"}
    - {title: "Smithsonian NMAAHC: Becoming Black, resistance", url: "https://www.searchablemuseum.com/becoming-black-resistance/", quote: "Nearly 100 enslaved Africans beat drums and carried a banner marked \"Liberty\" while chanting the same in Kongolese: \"Lukango!\""}
- card: stono-drum-ban
  fact: "The rebels killed at least twenty white colonists (accounts give about twenty to about forty)."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "About forty whites and probably as many blacks were killed during the Stono insurrection."}
    - {title: "National Humanities Center: The Stono Rebellion", url: "http://nationalhumanitiescenter.org/pds/becomingamer/peoples/text4/stonorebellion.pdf", quote: "stole weapons and killed about twenty white settlers as they headed south."}
- card: stono-drum-ban
  fact: "That afternoon the militia routed them in a field; rebels were killed on the spot and most of those who escaped were hunted down."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "By four o’clock between twenty and one hundred armed planters and militiamen ... confronted the rebels in what was thereafter known as “the battlefield.” ... Thirty members of the rebel force escaped, many of whom were hunted down the following week."}
    - {title: "National Humanities Center: The Stono Rebellion", url: "http://nationalhumanitiescenter.org/pds/becomingamer/peoples/text4/stonorebellion.pdf", quote: "Soon most were killed or captured, tried, and executed ... Such as were taken in the field also, were, after being examined, shot on the Spot"}
- card: stono-drum-ban
  fact: "Stono was the colony's largest slave rising."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "claim freedom in Spanish-controlled Florida, South Carolina’s largest and bloodiest slave insurrection"}
    - {title: "Smithsonian NMAAHC: Becoming Black, resistance", url: "https://www.searchablemuseum.com/becoming-black-resistance/", quote: "South Carolina’s Stono Rebellion was the largest slave uprising in the British mainland colonies prior to the American Revolution."}
- card: stono-drum-ban
  fact: "The 1740 Negro Act also stopped owners from freeing slaves at will."
  sources:
    - {title: "South Carolina Encyclopedia: Mark M. Smith, Stono Rebellion", url: "https://www.scencyclopedia.org/sce/entries/stono-rebellion/", quote: "The 1740 Negro Act made the manumission of slaves dependent on a special act of the assembly and mandated patrol service for every militiaman."}
    - {title: "National Humanities Center: The Stono Rebellion", url: "http://nationalhumanitiescenter.org/pds/becomingamer/peoples/text4/stonorebellion.pdf", quote: "South Carolina enacted stricter limitations on slaves’ conduct ... and also banned slaveholders from freeing their slaves."}
- card: sun-ra
  fact: "Sun Ra wrapped his music in a mythology of outer space and ancient Egypt, and Arkestra concerts were spectacles of costumes and lights."
  sources:
    - {title: "National Endowment for the Arts: Sun Ra", url: "https://www.arts.gov/honors/jazz/sun-ra", quote: "An outsider who linked the African-American experience with ancient Egyptian mythology and outer space"}
    - {title: "NPR Jazz Profiles: Sun Ra, Cosmic Swing", url: "https://text.npr.org/15774733", quote: "led to his mythic music about space and Egypt. ... His concerts with the Sun Ra Arkestra were theatrical spectacles, incorporating electronics, synthesizers, rarely used instruments, lights and costumes."}
    - {title: "Encyclopedia of Alabama: Herman Blount", url: "https://encyclopediaofalabama.org/article/herman-blount-sun-ra/", quote: "Sun Ra and the Arkestra performed in long robes made of richly decorated metallic fabric. Dancers dressed in science-fiction attire, and light displays also accompanied Arkestra performances."}
- card: sun-ra
  fact: "Sun Ra died in 1993, and the Arkestra continues under saxophonist Marshall Allen."
  sources:
    - {title: "Encyclopedia of Alabama: Herman Blount", url: "https://encyclopediaofalabama.org/article/herman-blount-sun-ra/", quote: "The Arkestra continues to perform today, directed by alto saxophonist Marshall Allen, who joined the group in 1958."}
    - {title: "National Endowment for the Arts: Sun Ra", url: "https://www.arts.gov/honors/jazz/sun-ra", quote: "Since Sun Ra's death, the Arkestra has continued to perform under the direction of Allen."}
    - {title: "NPR Jazz Profiles: Sun Ra, Cosmic Swing", url: "https://text.npr.org/15774733", quote: "Sun Ra recorded and performed until his death on May 30, 1993. ... Today, Sun Ra's Arkestra still lives on, led by Marshall Allen."}
- card: sun-ra
  fact: "Afrofuturism, the term Mark Dery coined in 1993, names Black art imagining the future through science fiction and technology; Sun Ra is among its best-known examples/forerunners."
  sources:
    - {title: "Los Angeles Review of Books", url: "https://lareviewofbooks.org/article/afrofuturism-africanfuturism-and-the-language-of-black-speculative-literature", quote: "Speculative fiction that treats African-American themes and addresses African-American concerns in the context of twentieth-century technoculture ... might for want of a better term, be called “Afrofuturism.”"}
    - {title: "Vanderbilt University course page", url: "https://www.vanderbilt.edu/AnS/english/English295/carroll/afrofut.html", quote: "Jazz artist Sun Ra, Jimi Hendrix, funkmaster George Clinton and the Funkadelic/Parliament crew, and producer Lee \"Scratch\" Perry have been heavily influential and are the most immediately recognizable examples of the Afrofuturist aesthetic."}
    - {title: "PBS American Masters: Sun Ra biography and career timeline", url: "https://www.pbs.org/wnet/americanmasters/sun-ra-biography-and-career-timeline/37462", quote: "Remembered as the “Godfather of Afrofuturism,” he fused ancient Egyptian and interstellar metaphors into a powerful musical and spiritual vision"}
- card: sunjata
  fact: "In the epic Sunjata is the son of Sogolon; a scheming stepmother drives him and his mother into exile, and he returns at the head of an alliance of neighbouring kingdoms."
  sources:
    - {title: "UC Berkeley ORIAS: Sundiata", url: "https://orias.berkeley.edu/resources-teachers/monomyth-heros-journey-project/sundiata", quote: "his mother, Sogolon ... when his position is usurped through the scheming of his step-mother, he bravely accepts his exile ... Sunjata relies on ancestral ties with neighboring kingdoms in order to assemble an alliance large enough to defeat Sumanguru."}
    - {title: "Boston University African Studies Center: Sundiata, an Epic (teaching guide to D. T. Niane)", url: "https://www.bu.edu/africa/outreach/teachingresources/history/ancient-to-medieval-history/k_o_mali/sundiata-an-epic", quote: "Sogolon Kedjou second wife of Maghan mother of Sundiata ... EXILE Why did Djata accept exile? ... Where was Sogolon and her family sent after she became ill? ... THE RETURN How had exile benefited Sundiata?"}
- card: sunjata
  fact: "Sunjata defeated Sumaoro (Sumanguru) at the battle of Kirina."
  sources:
    - {title: "National Geographic: Sundiata Keita", url: "https://education.nationalgeographic.org/resource/sundiata-keita/", quote: "he defeated Sumanguru at the battle of Kirina in 1235 C.E."}
    - {title: "Boston University African Studies Center: Sundiata, an Epic (teaching guide to D. T. Niane)", url: "https://www.bu.edu/africa/outreach/teachingresources/history/ancient-to-medieval-history/k_o_mali/sundiata-an-epic", quote: "KRINA How did the king/sorcerers send their declarations of war? ... How would you describe the battle of Krina?"}
- card: sunjata
  fact: "Kouyaté griots in Nyagassola, Guinea, keep the Sosso-Bala, a balafon said to have belonged to Sumaoro Kanté, and pass it down the generations."
  sources:
    - {title: "UNESCO ICH: Cultural space of Sosso-Bala", url: "https://ich.unesco.org/en/RL/cultural-space-of-sosso-bala-00009", quote: "Originally owned and played by King Sumaoro Kanté ... The original Sosso-Bala is preserved in a round mud hut ... in the village of Nyagassola in northern Guinea, an area occupied by the Dökala family, the Kouyaté griots of Nyagassola."}
    - {title: "Vincent Zanetti, Cahiers d'ethnomusicologie 6 (1993)", url: "https://journals.openedition.org/ethnomusicologie/1512", quote: "l'authentique balafon du roi Soumaoro Kanté ... transmis de génération en génération par les descendants directs de Bala Fassèkè Kouyaté ... dévoilé pour la première fois par le doyen des griots Kouyaté, à Nyagassola"}
- card: talking-drums
  fact: "At his mission at Yalemba, Carrington's wife called him home from the forest to lunch by drum."
  sources:
    - {title: "Time: Education, Boomlay (22 November 1954)", url: "https://time.com/archive/6609281/education-boomlay/", quote: "Last week TIME Correspondent Israel Shenker found Carrington at Yalemba ... Often when her husband is in the jungle, Mrs. Carrington beats out a quick tattoo to summon him back to lunch"}
    - {title: "Freeman Dyson, How We Know, New York Review of Books (2011)", url: "https://www.nybooks.com/articles/2011/03/10/how-we-know/", quote: "Carrington was taking a walk in the forest and his wife wished to call him home for lunch. ... Carrington heard the message and came home."}
- card: talking-drums
  fact: "Carrington published The Talking Drums of Africa in 1949; the drum language was already fading, and by 1954 only one pupil in ten at his school could speak on the drums."
  sources:
    - {title: "Freeman Dyson, How We Know, New York Review of Books (2011)", url: "https://www.nybooks.com/articles/2011/03/10/how-we-know/", quote: "He arrived in Africa in 1938 and published his findings in 1949 in a book, The Talking Drums of Africa. ... By the time Carrington wrote his book, the use of drum language was already fading and schoolchildren were no longer learning it."}
    - {title: "Time: Education, Boomlay (22 November 1954)", url: "https://time.com/archive/6609281/education-boomlay/", quote: "Since only one pupil in ten knows how to speak on the drums, he has planned a special course to keep the ancient art alive."}
- card: talking-drums
  fact: "The drums keep only the tones, so drummers add redundant stock phrases until only one meaning fits."
  sources:
    - {title: "Freeman Dyson, How We Know, New York Review of Books (2011)", url: "https://www.nybooks.com/articles/2011/03/10/how-we-know/", quote: "In passing from human Kele to drum language, all the information contained in vowels and consonants is lost. ... When enough redundant words are added, the meaning of the message becomes unique."}
    - {title: "Penguin Random House: The Information, opening excerpt", url: "https://penguinrandomhousesecondaryeducation.com/book/?isbn=9781400096237", quote: "Drummers would not say, “Come back home,” but rather, Make your feet come back the way they went, make your legs come back the way they went"}
- card: timbuktu-manuscripts
  fact: "In the Middle Ages Timbuktu grew as a trading town at the northern bend of the Niger and became a centre of Islamic learning"
  sources:
    - {title: "CSMC Hamburg: The Timbuktu manuscripts", url: "https://www.csmc.uni-hamburg.de/timbuktu/manuscripts.html", quote: "Timbuktu emerged in the 12th century as a trading town on the northern bend of the river Niger"}
    - {title: "National Geographic: Timbuktu Manuscripts Burned by Islamists (2013)", url: "https://www.nationalgeographic.com/science/article/130129-mali-timbuktu-manuscripts-islamists-fighting-geography-culture", quote: "The city emerged as a wealthy center of trade, Islam, and learning during the 13th century"}
- card: timbuktu-manuscripts
  fact: "Timbuktu's scholars wrote on (Islamic) law and mathematics"
  sources:
    - {title: "CSMC Hamburg: The Timbuktu manuscripts", url: "https://www.csmc.uni-hamburg.de/timbuktu/manuscripts.html", quote: "Islamic law and mathematics"}
    - {title: "Library of Congress: Ancient Manuscripts from the Desert Libraries of Timbuktu", url: "https://www.loc.gov/exhibits/mali/mali-exhibit.html", quote: "instructing students of Islamic law"}
    - {title: "Library of Congress: Ancient Manuscripts from the Desert Libraries of Timbuktu", url: "https://www.loc.gov/exhibits/mali/mali-exhibit.html", quote: "Explanations of the Problems in Arithmetic with Examples"}
- card: timbuktu-manuscripts
  fact: "French and Malian troops retook Timbuktu in late January 2013"
  sources:
    - {title: "Al Jazeera: French-led troops regain Timbuktu from rebels (2013)", url: "https://www.aljazeera.com/news/2013/1/29/french-led-troops-regain-timbuktu-from-rebels", quote: "French and Malian troops have taken control of the historic Malian city of Timbuktu"}
    - {title: "National Geographic: Timbuktu Manuscripts Burned by Islamists (2013)", url: "https://www.nationalgeographic.com/science/article/130129-mali-timbuktu-manuscripts-islamists-fighting-geography-culture", quote: "French and Malian troops surrounded Timbuktu on Monday"}
- card: timbuktu-manuscripts
  fact: "Before the town was retaken, militants set fire to the Ahmed Baba Institute; some 4,000 of its manuscripts were burned or stolen"
  sources:
    - {title: "The World, quoting UNESCO's David Stehl (2013)", url: "https://theworld.org/stories/2013/07/03/islamists-have-destroyed-one-tenth-timbuktus-ancient-manuscripts-un-finds", quote: "4,203 manuscripts were either burned by the Islamists or stolen"}
    - {title: "University of Hamburg CSMC: Risks and Rewards (2023)", url: "https://www.csmc.uni-hamburg.de/about/blog/2023-08-29-timbuktu.html", quote: "around 4,000 manuscripts were destroyed"}
    - {title: "Al Jazeera: French-led troops regain Timbuktu from rebels (2013)", url: "https://www.aljazeera.com/news/2013/1/29/french-led-troops-regain-timbuktu-from-rebels", quote: "the fire at the Ahmed Baba Centre for Documentation and Research"}
- card: timbuktu-manuscripts
  fact: "The rescued manuscripts stayed in Bamako"
  sources:
    - {title: "CSMC Hamburg: The Timbuktu manuscripts", url: "https://www.csmc.uni-hamburg.de/timbuktu/manuscripts.html", quote: "At the present time, the manuscripts are deposited in various locations around Bamako"}
    - {title: "The World, quoting UNESCO's David Stehl (2013)", url: "https://theworld.org/stories/2013/07/03/islamists-have-destroyed-one-tenth-timbuktus-ancient-manuscripts-un-finds", quote: "securing manuscripts transferred to Bamako"}
- card: tuskegee
  fact: "The men were told they were being treated for 'bad blood'"
  sources:
    - {title: "CDC: Untreated Syphilis Study timeline", url: "https://www.cdc.gov/tuskegee/about/timeline.html", quote: "Researchers told the men they were being treated for “bad blood,”"}
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "bad blood"}
- card: tuskegee
  fact: "They were given free meals and burial insurance"
  sources:
    - {title: "CDC: Untreated Syphilis Study timeline", url: "https://www.cdc.gov/tuskegee/about/timeline.html", quote: "the men received free medical exams, free meals, and burial insurance"}
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "free meals on visit days"}
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "burial insurance to cover the cost of a funeral"}
- card: tuskegee
  fact: "Their informed consent was never obtained"
  sources:
    - {title: "CDC: About the USPHS Untreated Syphilis Study at Tuskegee", url: "https://www.cdc.gov/tuskegee/about/index.html", quote: "researchers did not collect informed consent from participants"}
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "informed consent"}
- card: tuskegee
  fact: "A lawsuit (class action, 1973) won survivors and heirs a $10 million settlement"
  sources:
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "filed a class action lawsuit, which resulted in a settlement of $10 million"}
    - {title: "CDC: Untreated Syphilis Study timeline", url: "https://www.cdc.gov/tuskegee/about/timeline.html", quote: "resulting in a $10 million, out-of-court settlement in 1974"}
    - {title: "CDC: About the USPHS Untreated Syphilis Study at Tuskegee", url: "https://www.cdc.gov/tuskegee/about/index.html", quote: "The $10-million settlement was divided into four categories"}
- card: tuskegee
  fact: "The 1974 National Research Act, a response to the study, required review boards to approve federally funded research on people"
  sources:
    - {title: "Encyclopedia of Science, Technology, and Ethics (Gale): Institutional Review Boards", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/institutional-review-boards", quote: "one year after the unethical Tuskegee syphilis study was discontinued"}
    - {title: "Encyclopedia of Science, Technology, and Ethics (Gale): Institutional Review Boards", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/institutional-review-boards", quote: "established a statutory requirement for review of FDA- and DHEW-funded research"}
    - {title: "ASU Embryo Project Encyclopedia: The Tuskegee Syphilis Study (1932–1972)", url: "https://embryo.asu.edu/pages/tuskegee-syphilis-study-1932-1972", quote: "mandated institutional review board, or IRB, approval of human studies"}
    - {title: "Capili and Anastasi, Ethical Guidelines and the Institutional Review Board, American Journal of Nursing (2024)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10885741", quote: "The National Research Act (NRA) was passed in 1974 in response to public outcry over the Tuskegee Syphilis Study"}
- card: tutuola
  fact: "Tutuola became the first Nigerian writer to win international recognition"
  sources:
    - {title: "Harry Ransom Center: Amos Tutuola collection, biographical sketch", url: "https://research.hrc.utexas.edu/fasearch/pdf/00131.pdf", quote: "Tutuola became the first Nigerian novelist to win international acclaim"}
    - {title: "Gale Contextual Encyclopedia of World Literature: Tutuola, Amos", url: "https://www.encyclopedia.com/arts/encyclopedias-almanacs-transcripts-and-maps/tutuola-amos", quote: "Amos Tutuola was the first Nigerian writer to achieve international recognition"}
- card: tutuola
  fact: "He followed the book with My Life in the Bush of Ghosts (1954) and other books"
  sources:
    - {title: "Harry Ransom Center: Amos Tutuola collection, biographical sketch", url: "https://research.hrc.utexas.edu/fasearch/pdf/00131.pdf", quote: "The Palm-Wine Drinkard was followed by My Life in the Bush Ghosts (1954)"}
    - {title: "Gale Contextual Encyclopedia of World Literature: Tutuola, Amos", url: "https://www.encyclopedia.com/arts/encyclopedias-almanacs-transcripts-and-maps/tutuola-amos", quote: "My Life in the Bush of Ghosts (1954)"}
- card: tutuola
  fact: "He died in Nigeria in 1997"
  sources:
    - {title: "Harry Ransom Center: Amos Tutuola collection, biographical sketch", url: "https://research.hrc.utexas.edu/fasearch/pdf/00131.pdf", quote: "Amos Tutuola died in Nigeria in 1997"}
    - {title: "Gale Contextual Encyclopedia of World Literature: Tutuola, Amos", url: "https://www.encyclopedia.com/arts/encyclopedias-almanacs-transcripts-and-maps/tutuola-amos", quote: "He died in Ibadan in June 1997"}
- card: tutuola
  fact: "He was a (government) messenger in Lagos when he wrote it (already in ledger as 'government messenger'; recorded for the RU wording)"
  sources:
    - {title: "Harry Ransom Center: Amos Tutuola collection, biographical sketch", url: "https://research.hrc.utexas.edu/fasearch/pdf/00131.pdf", quote: "While working as a messenger for the Department of Labor"}
    - {title: "Gale Contextual Encyclopedia of World Literature: Tutuola, Amos", url: "https://www.encyclopedia.com/arts/encyclopedias-almanacs-transcripts-and-maps/tutuola-amos", quote: "He found employment as a messenger for the Department of Labor in Lagos"}
- card: underground-railroad-myths
  fact: "The Underground Railroad was a loose network of Black and white people who hid and guided people escaping slavery in the US, up to the Civil War"
  sources:
    - {title: "Encyclopedia of Greater Philadelphia: Underground Railroad", url: "https://philadelphiaencyclopedia.org/essays/underground-railroad/", quote: "The loosely connected organization of white and Black people helped hide and guide enslaved people"}
    - {title: "National Park Service: What is the Underground Railroad?", url: "https://www.nps.gov/subjects/undergroundrailroad/what-is-the-underground-railroad.htm", quote: "through the end of the Civil War"}
- card: underground-railroad-myths
  fact: "Despite historians' objections, educators (and the wider public) took up the quilt code story"
  sources:
    - {title: "International Quilt Museum: Underground Railroad Quilts?", url: "https://worldquilts.quiltstudy.org/americanstory/node/123", quote: "educators, journalists, public history organizations, and others have embraced it as truth"}
    - {title: "House Divided, Dickinson College: 1999 quilt code claims gain attention", url: "https://housedivided.dickinson.edu/sites/ugrr/1999-quilt-code-claims-gain-attention/", quote: "popular interest in possible Underground Railroad quilt codes has skyrocketed in subsequent years"}
- card: vai-script
  fact: "The script was standardised in 1899 and again in 1962, at a conference at the University of Liberia"
  sources:
    - {title: "Unicode Standard 18.0, chapter 19, Vai", url: "https://www.unicode.org/versions/Unicode18.0.0/core-spec/chapter-19/", quote: "standardization efforts in 1899 and again at a 1962 conference at the University of Liberia"}
    - {title: "Rovenchak, Mačutek and Riley, Distribution of complexities in the Vai script, Glottometrics 18 (2009)", url: "https://glottometrics.iqla.org/wp-content/uploads/2021/06/g18zeit.pdf", quote: "standardized in 1899 and finally in 1962 by a committee in the"}
    - {title: "Institute of the Estonian Language, KNAB: Vai syllabary (2012)", url: "https://arhiiv.eki.ee/knab/lat/kblvai2.pdf", quote: "in 1899 and again in 1962"}
- card: vai-script
  fact: "In 2008 Unicode 5.1 encoded the Vai script"
  sources:
    - {title: "Unicode Consortium: Unicode 5.1.0 (2008)", url: "https://www.unicode.org/versions/Unicode5.1.0/", quote: "with the addition of the Cham, Lepcha, Ol Chiki, Rejang, Saurashtra, Sundanese, and Vai scripts"}
    - {title: "Unicode Consortium: Unicode 5.1.0 (2008)", url: "https://www.unicode.org/versions/Unicode5.1.0/", quote: "Released: 2008 April 4"}
    - {title: "Rovenchak, Mačutek and Riley, Distribution of complexities in the Vai script, Glottometrics 18 (2009)", url: "https://glottometrics.iqla.org/wp-content/uploads/2021/06/g18zeit.pdf", quote: "became a part of the Unicode standard, version 5.1"}
- card: vai-script
  fact: "Because Vai was documented from its beginnings, researchers could trace its letters simplifying over time; the more complex a sign was at first, the more it simplified"
  sources:
    - {title: "Kelly, Winters, Miton and Morin, The Predictable Evolution of Letter Shapes, Current Anthropology (2021)", url: "https://bura.brunel.ac.uk/bitstream/2438/28951/3/FullText.pdf", quote: "Vai has the advantage of having been systematically documented from its earliest beginnings until the present day"}
    - {title: "Kelly, Winters, Miton and Morin, The Predictable Evolution of Letter Shapes, Current Anthropology (2021)", url: "https://bura.brunel.ac.uk/bitstream/2438/28951/3/FullText.pdf", quote: "letters simpliﬁed to a greater extent when their initial complexity was higher"}
    - {title: "Discover Magazine: African Script Sheds Light on Evolution of Writing", url: "https://www.discovermagazine.com/african-script-sheds-light-on-evolution-of-writing-43355", quote: "whereas the simpler signs barely budge at all"}
- card: walkers-appeal
  fact: "The Appeal was first published in September 1829"
  sources:
    - {title: "DocSouth: John C. Inscoe, David Walker, Dictionary of North Carolina Biography", url: "https://docsouth.unc.edu/nc/walker/bio.html", quote: "In September 1829 Walker first published his famous seventy-six-page pamphlet"}
    - {title: "Encyclopedia.com (Gale): Walker, David", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/walker-david", quote: "First published in late 1829"}
- card: walkers-appeal
  fact: "Walker was an agent for Freedom's Journal, the first Black newspaper in the United States"
  sources:
    - {title: "National Park Service: David Walker", url: "https://www.nps.gov/people/david-walker.htm", quote: "Walker also became a principal agent for Freedom's Journal , the first Black newspaper published in the United States"}
    - {title: "Encyclopedia.com (Gale): Walker, David", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/walker-david", quote: "an agent for Freedom's Journal , the first black newspaper in America"}
- card: walkers-appeal
  fact: "The Appeal went through three editions, the last in June 1830"
  sources:
    - {title: "Encyclopedia.com (Gale): Walker, David", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/walker-david", quote: "the Appeal went through three quick editions, each featuring minor changes, the last being published in June 1830"}
    - {title: "DocSouth: John C. Inscoe, David Walker, Dictionary of North Carolina Biography", url: "https://docsouth.unc.edu/nc/walker/bio.html", quote: "Two revised editions, each increasingly militant and inflammatory in tone, were published early in 1830"}
- card: walkers-appeal
  fact: "Southern authorities seized copies; Georgia, North Carolina and other states passed laws against antislavery literature and against teaching Black people to read"
  sources:
    - {title: "Encyclopedia.com (Gale): Walker, David", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/walker-david", quote: "by seizing copies of it when they could, initiating laws banning distribution of antislavery literature"}
    - {title: "R. J. Ellis, American History Through Literature 1820–1870, via Encyclopedia.com: Walker's Appeal", url: "https://www.encyclopedia.com/arts/culture-magazines/walkers-appeal", quote: "laws were passed in Georgia, Louisiana, Mississippi, and North Carolina to prevent"}
    - {title: "DocSouth: John C. Inscoe, David Walker, Dictionary of North Carolina Biography", url: "https://docsouth.unc.edu/nc/walker/bio.html", quote: "Harsh penalties were to be levied on anyone for teaching slaves to read or write and for circulating seditious publications"}
- card: walkers-appeal
  fact: "Rumour held that Walker was killed; official records gave consumption as the cause of death"
  sources:
    - {title: "National Park Service: David Walker", url: "https://www.nps.gov/people/david-walker.htm", quote: "leading some to speculate that he may have been killed"}
    - {title: "National Park Service: David Walker", url: "https://www.nps.gov/people/david-walker.htm", quote: "official records noted his cause of death as consumption"}
    - {title: "Encyclopedia.com (Gale): Walker, David", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/walker-david", quote: "Walker's untimely death in 1830 was rumored to have been caused by these forces of reaction, though it is also likely that he fell victim to consumption"}
- card: wedgwood-medallion
  fact: "Parliament abolished the British slave trade in 1807"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "prohibiting the trade of enslaved people in the British Empire"}
    - {title: "The National Archives (UK): The 1833 Abolition of Slavery Act and compensation claims", url: "https://www.nationalarchives.gov.uk/explore-the-collection/explore-by-time-period/georgians/1833-abolition-of-slavery-act-and-compensation-claims/", quote: "1807 Abolition of the Slave Trade Act"}
- card: wedgwood-medallion
  fact: "An act freeing enslaved people in British colonies took effect in 1834"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "It was not until 1834 that the emancipation of enslaved people occurred in British colonies"}
    - {title: "The National Archives (UK): The 1833 Abolition of Slavery Act and compensation claims", url: "https://www.nationalarchives.gov.uk/explore-the-collection/explore-by-time-period/georgians/1833-abolition-of-slavery-act-and-compensation-claims/", quote: "When the Act came into effect on 1 August 1834"}
- card: what-black-means
  fact: "The 1924 Racial Integrity Act forbade a white person to marry anyone but a white person"
  sources:
    - {title: "Encyclopedia Virginia: Brendan Wolfe, Racial Integrity Laws", url: "https://encyclopediavirginia.org/entries/racial-integrity-laws-1924-1930/", quote: "it would be against the law for a white person to marry anyone but a white person"}
    - {title: "Loving v. Virginia, 388 U.S. 1 (1967), Cornell LII", url: "https://www.law.cornell.edu/supremecourt/text/388/1", quote: "the absolute prohibition of a 'white person' marrying other than another 'white person,'"}
- card: what-black-means
  fact: "The ban stood until 1967, when the US Supreme Court struck it down in Loving v. Virginia"
  sources:
    - {title: "Encyclopedia Virginia: Brendan Wolfe, Racial Integrity Laws", url: "https://encyclopediavirginia.org/entries/racial-integrity-laws-1924-1930/", quote: "in Loving v. Virginia, ruled that the prohibition of interracial marriages was unconstitutional"}
    - {title: "Loving v. Virginia, 388 U.S. 1 (1967), Cornell LII", url: "https://www.law.cornell.edu/supremecourt/text/388/1", quote: "Decided June 12, 1967"}
    - {title: "Loving v. Virginia, 388 U.S. 1 (1967), Cornell LII", url: "https://www.law.cornell.edu/supremecourt/text/388/1", quote: "These convictions must be reversed"}
- card: wpa-narratives
  fact: "The Federal Writers' Project (WPA) was a Depression-era New Deal program that gave jobs to unemployed writers"
  sources:
    - {title: "Encyclopedia of Arkansas: WPA Slave Narratives", url: "https://encyclopediaofarkansas.net/entries/wpa-slave-narratives-4041/", quote: "sponsored unemployed writers to undertake assorted research and writing assignments"}
    - {title: "MDAH Mississippi History Now: WPA Slave Narratives", url: "https://mshistory.mdah.ms.gov/issue/wpa-slave-narratives", quote: "to provide jobs for unemployed workers during the Great Depression"}
- card: wpa-narratives
  fact: "In 1972 George P. Rawick published the interviews as The American Slave"
  sources:
    - {title: "Encyclopedia of Arkansas: WPA Slave Narratives", url: "https://encyclopediaofarkansas.net/entries/wpa-slave-narratives-4041/", quote: "George P. Rawick compiled them into a collection, publishing sixteen volumes in 1972"}
    - {title: "MDAH Mississippi History Now: WPA Slave Narratives", url: "https://mshistory.mdah.ms.gov/issue/wpa-slave-narratives", quote: "George Rawick, ed., The American Slave: A Composite Autobiography. 19 vols., Westport, Conn., 1972"}
- card: yaa-asantewaa
  fact: "Asante fighters besieged the British in the fort at Kumasi"
  sources:
    - {title: "A. A. Boahen, Encyclopaedia Africana: Yaa Asantewaa", url: "https://encyclopaediaafricana.com/asantewaa-yaa/", quote: "had been besieged in the fort at Kumase"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "storming a fort in Kumasi, where the British had sought refuge"}
- card: yaa-asantewaa
  fact: "Within months a British expeditionary force put the revolt down"
  sources:
    - {title: "A. A. Boahen, Encyclopaedia Africana: Yaa Asantewaa", url: "https://encyclopaediaafricana.com/asantewaa-yaa/", quote: "the revolt was suppressed in July 1900 by a British expeditionary force"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "Months later, the British governor sent sufficient troops to put down the revolt"}
- card: yaa-asantewaa
  fact: "She was captured with other leaders before her exile to the Seychelles"
  sources:
    - {title: "A. A. Boahen, Encyclopaedia Africana: Yaa Asantewaa", url: "https://encyclopaediaafricana.com/asantewaa-yaa/", quote: "Among the leaders of the revolt who were captured"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "The British captured Yaa Asantewaa and 15 of her advisors and banished them all to the Seychelles"}
- card: yaa-asantewaa
  fact: "Prempeh was allowed home only in 1924"
  sources:
    - {title: "BBC via MyJoyOnline: Celebrating the Ghanaian king banished by the British (2024)", url: "https://www.myjoyonline.com/celebrating-the-ghanaian-king-banished-by-the-british/", quote: "It was not until 1924 that the British allowed Prempeh to return home"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "Three years later, the king and the remaining members of the exiled Ashanti court returned home"}
- card: yaa-asantewaa
  fact: "The war of 1900 is named after her (the Yaa Asantewaa War)"
  sources:
    - {title: "A. A. Boahen, Encyclopaedia Africana: Yaa Asantewaa", url: "https://encyclopaediaafricana.com/asantewaa-yaa/", quote: "is named after her"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "Yaa Asantewaa War"}
- card: yaa-asantewaa
  fact: "Asante lies in present-day Ghana"
  sources:
    - {title: "BBC via MyJoyOnline: Celebrating the Ghanaian king banished by the British (2024)", url: "https://www.myjoyonline.com/celebrating-the-ghanaian-king-banished-by-the-british/", quote: "Ghanaian king"}
    - {title: "Africa Defense Forum: Nana Yaa Asantewaa and the War of the Golden Stool (2022)", url: "https://adf-magazine.com/2022/08/nana-yaa-asantewaa-and-the-war-of-the-golden-stool/", quote: "a symbol of freedom for Ghana"}
- card: zong
  fact: "The Zong carried about twice as many captives as it was built for"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "It was twice the number the ship was designed for"}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "This number was around twice that for which the ship was safely designed for"}
- card: zong
  fact: "Its master was Luke Collingwood"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "The ship's master, Luke Collingwood"}
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "Captain Luke Collingwood"}
- card: zong
  fact: "The crew later claimed the water was running out, which the insurers disputed"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "The ship's crew later claimed that their drinking water was running out"}
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "There was however no such shortage"}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "water supplies on the vessel were low"}
- card: zong
  fact: "Outrage over the killings fed the abolition society founded in 1787"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "a direct line of descent from outrage at the Zong affair in 1783 to the founding of the Abolition Society in 1787"}
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "the obvious brutality of the massacre did help anti-slavery campaigners"}
- card: octavia-butler
  fact: "Kindred's heroine, a Black woman from 1976 Los Angeles, is pulled back to antebellum Maryland to save a white man, the slaveholder's son who is her ancestor."
  sources:
    - {title: "Seattle Times (AP), 26 February 2006", url: "https://archive.seattletimes.com/archive/20060226/webbutlerobit26/octavia-butler-prominent-science-fiction-author-dies-at-58", quote: "It concerned a black woman who travels back in time to the South to save a white man."}
    - {title: "EBSCO Research Starters: Kindred by Octavia E. Butler", url: "https://www.ebsco.com/research-starters/literature-and-writing/kindred-octavia-e-butler", quote: "TIME OF PLOT: June 9-July 4, 1976, and the early nineteenth century LOCALE: Los Angeles and Maryland ... Rufus Weylin , Dana's white ancestor in antebellum Maryland Tom Weylin , Rufus's father, a slave owner"}
- card: octavia-butler
  fact: "Parable of the Sower (1993) is set in the Los Angeles area of the mid-2020s, where walled communities hide from a collapsing society."
  sources:
    - {title: "EBSCO Research Starters: Parable of the Sower", url: "https://www.ebsco.com/research-starters/literature-and-writing/parable-sower-octavia-e-butler", quote: "The story begins in the dystopian future of 2024 in Robledo, California, in a gated community near Los Angeles"}
    - {title: "Publishers Weekly review of Parable of the Sower", url: "https://www.publishersweekly.com/9780941423991", quote: "by 2025, global warming, pollution, racial and ethnic tensions and other ills have precipitated a worldwide decline. In the Los Angeles area, small beleaguered communities of the still-employed hide behind makeshift walls"}
- card: octavia-butler
  fact: "She died in 2006 after a fall outside her home in Lake Forest Park, near Seattle."
  sources:
    - {title: "Seattle Times (AP), 26 February 2006", url: "https://archive.seattletimes.com/archive/20060226/webbutlerobit26/octavia-butler-prominent-science-fiction-author-dies-at-58", quote: "died after falling and striking her head on the cobbled walkway outside her home ... Butler was found outside her home in the north Seattle suburb of Lake Forest Park on Friday."}
    - {title: "EBSCO Research Starters: Octavia E. Butler", url: "https://www.ebsco.com/research-starters/biography/octavia-e-butler", quote: "Butler died of complications from a fall outside her home in Lake Forest, Washington."}
- card: oliver-golden
  fact: "Golden was a communist."
  sources:
    - {title: "Meredith Roman, Journal of Russian American Studies (2022)", url: "https://journals.ku.edu/jras/article/download/17979/16210", quote: "Oliver Golden, an African American communist who led a team of Black agricultural specialists to the U.S.S.R. in 1931 to help develop the cotton industry in Uzbekistan"}
    - {title: "RFE/RL (2009): For Russian Blacks, Obama visit stirs special interest", url: "https://www.rferl.org/amp/For_Russian_Blacks_Obama_Visit_Stirs_Special_Interest/1770531.html", quote: "Oliver Golden, became a member of the Communist Party in the United States after he failed to find work as anything but a waiter despite having a college degree"}
- card: oliver-golden
  fact: "The 1931 team numbered sixteen."
  sources:
    - {title: "Indiana University Libraries: African Americans in Soviet Russia", url: "https://guides.libraries.indiana.edu/c.php?g=792963&p=5681557", quote: "In 1931 a group of 16 African American agricultural specialists traveled to Uzbekistan to work at an experimental cotton farm"}
    - {title: "Colonial Beach Historical Society and Museum: African American history", url: "https://www.cbhistoryandmuseum.org/african-american-history", quote: "In 1931 Oliver Golden, an agricultural specialist who had studied at Tuskegee Institute , organized a group of sixteen black Americans"}
- card: oliver-golden
  fact: "His wife Bertha Bialek was a Polish-born Jewish labour activist."
  sources:
    - {title: "Meredith Roman, Journal of Russian American Studies (2022)", url: "https://journals.ku.edu/jras/article/download/17979/16210", quote: "Bertha Bialek, a Polish-born, Jewish-American labor activist"}
    - {title: "Indiana University Libraries: African Americans in Soviet Russia", url: "https://guides.libraries.indiana.edu/c.php?g=792963&p=5681557", quote: "Golden brought along his second wife Bertha Bialek, who was of Polish Jewish origin."}
- card: oliver-golden
  fact: "Golden stayed; their daughter Lily was born in Tashkent in 1934, and he died in 1940, when she was six."
  sources:
    - {title: "Lily Golden, Autobiography (africana.ru)", url: "https://africana.ru/Golden/info/autobiography.htm", quote: "Я родилась в Ташкенте в 1934 году. Когда мне исполнилось шесть лет, мой отец умер."}
    - {title: "Indiana University Libraries: African Americans in Soviet Russia", url: "https://guides.libraries.indiana.edu/c.php?g=792963&p=5681557", quote: "John Oliver Golden (1887 – 1940) ... Most of them left after a few months, but two - Golden and George Tynes – stayed on. ... Their daughter Lily Golden (1934 – 2010)"}
- card: oliver-golden
  fact: "Lily Golden worked for more than thirty years at the Institute of Africa in Moscow."
  sources:
    - {title: "Lily Golden, Autobiography (africana.ru)", url: "https://africana.ru/Golden/info/autobiography.htm", quote: "Когда в 1959 году открылся Институт Африки при Академии наук СССР я перешла на работу туда и проработала там больше 30 лет"}
    - {title: "Indiana University Libraries: African Americans in Soviet Russia", url: "https://guides.libraries.indiana.edu/c.php?g=792963&p=5681557", quote: "Their daughter Lily Golden (1934 – 2010) graduated from Moscow State University, worked in the Institute of African Studies"}
- card: oliver-golden
  fact: "Lily Golden married Abdullah Hanga, a revolutionary from Zanzibar; Yelena Khanga is their daughter."
  sources:
    - {title: "Meredith Roman, Journal of Russian American Studies (2022)", url: "https://journals.ku.edu/jras/article/download/17979/16210", quote: "Khanga's mother, Lily Golden (b. 1934) married Abdullah Hanga, a revolutionary leader from Zanzibar who was studying in Moscow in the early 1960s."}
    - {title: "RFE/RL (2009)", url: "https://www.rferl.org/amp/For_Russian_Blacks_Obama_Visit_Stirs_Special_Interest/1770531.html", quote: "Lily -- who went on to marry Abdullah Khanga, a political leader from Zanzibar"}
- card: omar-ibn-said
  fact: "In his thirties he was captured in a war and shipped across the ocean to be sold."
  sources:
    - {title: "Library of Congress blog (2019): Educated and Enslaved, story map", url: "https://blogs.loc.gov/loc/2019/07/new-omar-bin-said-story-map/", quote: "he was an educated and respected man in his early 30s, a devout Muslim, when he was taken prisoner during a regional conflict and sold into slavery"}
    - {title: "Lowcountry Digital History Initiative: Omar ibn Said", url: "https://ldhi.library.cofc.edu/exhibits/show/african-muslims-in-the-south/five-african-muslims/omar-ibn-said--1770-1864", quote: "Said was captured in his early thirties and sold into the trans-Atlantic slave trade around the age of thirty-seven."}
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "Then there came to our place a large army, who killed many men, and took me, and brought me to the great sea, and sold me into the hands of the Christians"}
- card: omar-ibn-said
  fact: "He was caught in Fayetteville after going into a church to pray."
  sources:
    - {title: "Documenting the American South: summary by Patrick E. Horn", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "Said escaped and made his way to Fayetteville, North Carolina, where he was imprisoned after entering a Christian church to pray."}
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "On the new moon I went into a church to pray. A lad saw me and rode off to the place of his father and informed him that he had seen a black man in the church."}
- card: omar-ibn-said
  fact: "General James Owen bought him."
  sources:
    - {title: "Documenting the American South: summary", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "Said became the legal property of General James Owen of Bladen County"}
    - {title: "Lowcountry Digital History Initiative: Omar ibn Said", url: "https://ldhi.library.cofc.edu/exhibits/show/african-muslims-in-the-south/five-african-muslims/omar-ibn-said--1770-1864", quote: "Said was eventually purchased by a prominent man in the area, General James Owen."}
- card: omar-ibn-said
  fact: "In the autobiography he wrote that Owen did not beat him or let him go hungry."
  sources:
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "I continue in the hand of Jim Owen who never beats me, nor scolds me. I neither go hungry nor naked"}
    - {title: "Library of Congress blog (2019)", url: "https://blogs.loc.gov/loc/2019/07/new-omar-bin-said-story-map/", quote: "I continue in the hands of Jim Owen who does not beat me, nor calls me bad names, nor subjects me to hunger, nakedness, or hard work"}
- card: omar-ibn-said
  fact: "He later became a Christian."
  sources:
    - {title: "Lowcountry Digital History Initiative: Omar ibn Said", url: "https://ldhi.library.cofc.edu/exhibits/show/african-muslims-in-the-south/five-african-muslims/omar-ibn-said--1770-1864", quote: "Said attended the local Presbyterian Church and was baptized as a Christian in 1821."}
    - {title: "Documenting the American South: summary", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "Said's later conversion to Christianity rendered him a celebrity of sorts"}
- card: omar-ibn-said
  fact: "He was never freed and died still enslaved."
  sources:
    - {title: "Library of Congress blog (2019)", url: "https://blogs.loc.gov/loc/2019/07/new-omar-bin-said-story-map/", quote: "He died in 1863, still enslaved, during the Civil War."}
    - {title: "Lowcountry Digital History Initiative: Omar ibn Said", url: "https://ldhi.library.cofc.edu/exhibits/show/african-muslims-in-the-south/five-african-muslims/omar-ibn-said--1770-1864", quote: "Unlike Suleiman Diallo and Rahman, Said was never granted freedom."}
- card: palmares
  fact: "Macaco was the capital of Palmares."
  sources:
    - {title: "Fundação Cultural Palmares: Dandara e Zumbi", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/dandara-e-zumbi/", quote: "conseguiu tomar a capital palmarina – Macaco –"}
    - {title: "Flávio Gomes, Palmares, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/palmares", quote: "The primary quilombo, known by the name Macaco (Monkey), was the political and administrative center, functioning as the capital of Palmares."}
- card: palmares
  fact: "Palmares resisted for almost a century."
  sources:
    - {title: "Reis and Gomes, Quilombo: Brazilian Maroons during Slavery, Cultural Survival Quarterly", url: "https://www.culturalsurvival.org/publications/cultural-survival-quarterly/quilombo-brazilian-maroons-during-slavery", quote: "resisted for almost a century the various punitive expeditions sent out against it, and was finally destroyed only in 1694-1695"}
    - {title: "Fundação Cultural Palmares: Quilombo", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/quilombo/", quote: "resistindo por quase cem anos aos ataques holandeses, luso-brasileiros e de bandeirantes paulistas"}
- card: palmares
  fact: "Ganga Zumba accepted a peace deal with the governor of Pernambuco; Zumbi refused it, the deal failed and Zumbi became leader."
  sources:
    - {title: "Fundação Cultural Palmares: Dandara e Zumbi", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/dandara-e-zumbi/", quote: "após um malfadado acordo de paz entre o rei palmarino Ganga Zumba e o governador de Pernambuco, Pedro de Almeida, Zumbi, que se recusara a aderir a esse acordo, rebelou-se e se tornou o novo rei"}
    - {title: "Flávio Gomes, Palmares, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/palmares", quote: "Portuguese colonial authorities ... began proposing peace treaties ... While an agreement was initially accepted in 1678, it was later rejected by the quilombos and sabotaged by the ranchers and businessmen who were interested in the lands occupied by the quilombos."}
- card: palmares
  fact: "Domingos Jorge Velho was a hired bandeirante (mercenary frontier fighter)."
  sources:
    - {title: "Fundação Cultural Palmares: Quilombo", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/quilombo/", quote: "Domingos Jorge Velho, bandeirante contratado com a incumbência de sufocar Palmares"}
    - {title: "Flávio Gomes, Palmares, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/palmares", quote: "destroyed in 1695 by a large force of bandeirantes (mercenary fighters)"}
- card: palmares
  fact: "Zumbi escaped the fall of Macaco, fought on, and was betrayed by one of his own men before he was killed."
  sources:
    - {title: "Fundação Cultural Palmares: Dandara e Zumbi", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/dandara-e-zumbi/", quote: "ele escapou ao cerco que destruiu Macaco, tendo resistido, ainda, durante um ano com seus guerrilheiros nas matas alagoanas, até ser denunciado por um de seus homens de confiança"}
    - {title: "Flávio Gomes, Palmares, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/palmares", quote: "The well-protected leader of Palmares was eventually betrayed; he was found and assassinated on November 20, 1695."}
- card: paper-bag-test
  fact: "Kerr's book (2006) is built largely on oral history and documents the rumours and legends about complexion themselves."
  sources:
    - {title: "University of Tennessee Press: The Paper Bag Principle", url: "https://utpress.org/9781621902652/the-paper-bag-principle/", quote: "considers the function of oral history in shaping community dynamics among African American residents of the nation's capitol. The only attempt to document rumor and legends relating to complexion in Black communities"}
    - {title: "Chronicle of Higher Education via History News Network (2007)", url: "https://www.hnn.us/article/prejudice-against-dark-skinned-students-at-howard-", quote: "Drawing largely on oral history, Ms. Kerr traces color prejudice -- \"or the belief in color prejudice\" -- at Howard"}
- card: paper-bag-test
  fact: "Women perceived as light-skinned also served about 11% less time."
  sources:
    - {title: "theGrio (2011)", url: "https://thegrio.com/2011/06/23/is-justice-colorblind-in-post-racial-america", quote: "Light skinned black women also served roughly 11 percent less time in prison than their dark skin counterparts."}
    - {title: "The Root (2011)", url: "https://www.theroot.com/the-lighter-the-skin-the-shorter-the-prison-term", quote: "Women with light skin also served 11 percent less time than darker women."}
- card: paper-bag-test
  fact: "The study accounted for the type of crime and the women's criminal records."
  sources:
    - {title: "The Root (2011)", url: "https://www.theroot.com/the-lighter-the-skin-the-shorter-the-prison-term", quote: "The study took into account the type of crimes the women committed and each woman's criminal history to generate apples-to-apples comparisons."}
    - {title: "NewsOne (2011)", url: "https://newsone.com/1328605/light-skin-black-women-prison-sentences/", quote: "the study authors controlled factors including prior record, conviction date and weight; they also considered if the woman in question was serving time for robbery or homicide"}
- card: partus-1662
  fact: "William Grinsted acted for Elizabeth Key in her freedom suit, and she later married him."
  sources:
    - {title: "Library of Virginia, Dictionary of Virginia Biography: Elizabeth Key", url: "https://www.lva.virginia.gov/collections/dvb/bio/key-elizabeth-fl-1655-1660", quote: "One of the court records identified Grinsted as her attorney. What that meant was that he was her attorney in fact, not an attorney at law. ... By the summer of 1660 Elizabeth Key Grinsted had another son and a daughter named Elizabeth."}
    - {title: "African American National Biography: Elizabeth Key", url: "https://projects.kora.matrix.msu.edu/files/16-23-101311/Elizabeth_Key_AANB.pdf", quote: "Her lawyer, William Grinsted, petitioned the court for her freedom on several grounds. ... That Key later married Grinsted is also noteworthy."}
- card: partus-1662
  fact: "A county jury freed her, the General Court reversed the verdict, and a committee of the General Assembly upheld her claim to freedom."
  sources:
    - {title: "Library of Virginia, Dictionary of Virginia Biography: Elizabeth Key", url: "https://www.lva.virginia.gov/collections/dvb/bio/key-elizabeth-fl-1655-1660", quote: "On 20 January 1656, a Northumberland County jury decided that Elizabeth should be free. ... it is clear that the court ruled against her. ... The committee of burgesses therefore determined that under all the existing rules of law, even without any clear parliamentary or Virginia statutes and in spite of the General Court's verdict, she was entitled to her freedom and to her father's surname."}
    - {title: "African American National Biography: Elizabeth Key", url: "https://projects.kora.matrix.msu.edu/files/16-23-101311/Elizabeth_Key_AANB.pdf", quote: "following an appeal by the executor of Mottram's estate (another justice of the peace) to the Virginia General Court, which ruled that Elizabeth Key was indeed a slave. ... The committee agreed with the original decision of the Northumberland County Court"}
- card: partus-1662
  fact: "Under the 1662 act the children of white men by enslaved women were born slaves for life."
  sources:
    - {title: "Library of Virginia, Dictionary of Virginia Biography: Elizabeth Key", url: "https://www.lva.virginia.gov/collections/dvb/bio/key-elizabeth-fl-1655-1660", quote: "Thereafter, at the time of their birth the children of white male Virginians and enslaved female laborers legally became somebody's slave property for life."}
    - {title: "Encyclopedia Virginia: Negro womens children to serve according to the condition of the mother (1662)", url: "https://encyclopediavirginia.org/primary-documents/negro-womens-children-to-serve-according-to-the-condition-of-the-mother-1662/", quote: "This was a reversal of the usual common law presumption that the status of the child was determined by the father. The act enabled the reproduction of one's own labor force."}
- card: phillis-wheatley
  fact: "She was brought to Boston in 1761 and named after the ship that carried her, the Phillis."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "Wheatley was named for the ship, the Phillis , that brought her to Boston on 11 July 1761, and the Wheatley family who enslaved her."}
    - {title: "Boston Public Library (2023): Tracing the Life of Phillis Wheatley Peters", url: "https://www.bpl.org/blogs/post/tracing-the-life-of-phillis-wheatley-peters/", quote: "she arrived in Boston Harbor in the summer of 1761. There, she was purchased by her enslavers, the prominent Bostonian couple Susanna and John Wheatley, who renamed Phillis after the ship that had brought her to the city."}
- card: phillis-wheatley
  fact: "Soon after returning from London in 1773 she was freed; she wrote that her master had 'given me my freedom'."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "\"Since my return to America my Master, has at the desire of my friends in England given me my freedom.\" ~Phillis Wheatley to David Wooster, 18 October 1773"}
    - {title: "Boston Public Library (2023)", url: "https://www.bpl.org/blogs/post/tracing-the-life-of-phillis-wheatley-peters/", quote: "In this letter dated May 6, 1774, Wheatley Peters – now a free woman – writes to the abolitionist minister Samuel Hopkins"}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "she likely negotiated for her freedom, leveraging her fame, pressure from her English admirers"}
- card: phillis-wheatley
  fact: "She married John Peters, a free Black man."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "She married John Peters, a free Black man living in Boston"}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "In 1778, Wheatley married John Peters, a free Black man from Boston"}
- card: phillis-wheatley
  fact: "Her proposed second volume was never published, during the war years in Boston."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "Phillis Wheatley drew up proposals for a second volume of poetry which was never published, probably due to wartime shortages in Boston."}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "she started work on a second collection. This volume, which would have included thirteen letters and thirty-three poems, was never finished."}
- card: phillis-wheatley
  fact: "She was living in a boardinghouse when she died in December 1784."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "By 1784 Wheatley was living in a boardinghouse, and in December of that year both she and her third child passed away."}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "To support her family, she worked as a maid in a boardinghouse while continuing to write poetry. Wheatley became ill and died on December 5th, 1784"}
- card: planet-rock
  fact: "Afrika Bambaataa was a Bronx DJ and the founder of the Universal Zulu Nation."
  sources:
    - {title: "theGrio (9 April 2026): Hip hop pioneer Afrika Bambaataa dies at age 67", url: "https://thegrio.com/2026/04/09/hip-hop-pioneer-afrika-bambaataa-dies-at-age-67/", quote: "The Bronx-born rapper, DJ, and founder of the Universal Zulu Nation"}
    - {title: "Complex (2026)", url: "https://www.complex.com/music/a/backwoodsaltar/afrika-bambaataa-dead-hip-hop-pioneer", quote: "Bambaataa was also one of the founders of the hip-hop awareness group, Universal Zulu Nation."}
- card: planet-rock
  fact: "\"Planet Rock\" became one of hip-hop's earliest hits and most influential tracks."
  sources:
    - {title: "theGrio (9 April 2026)", url: "https://thegrio.com/2026/04/09/hip-hop-pioneer-afrika-bambaataa-dies-at-age-67/", quote: "His 1982 single \"Planet Rock\" is one of the most influential hip hop tracks ever made."}
    - {title: "Complex (2026)", url: "https://www.complex.com/music/a/backwoodsaltar/afrika-bambaataa-dead-hip-hop-pioneer", quote: "His album Planet Rock , which consisted of singles released from 1980 to 1986, was one of the genre's earliest successes."}
    - {title: "Red Bull Music Academy (2013): Arthur Baker on Planet Rock", url: "https://daily.redbullmusicacademy.com/2013/04/key-tracks-arthur-baker-on-planet-rock/", quote: "the record was so hot, people just went for it"}
- card: planet-rock
  fact: "After the 2016 accusations Bambaataa stepped down as head of the Zulu Nation."
  sources:
    - {title: "The Guardian (23 May 2025)", url: "https://www.theguardian.com/music/2025/may/23/hip-hop-pioneer-afrika-bambaataa-loses-civil-case-suing-him-for-child-sexual-abuse", quote: "The musician denied all allegations in a 2016 interview with Fox 5 News, but left his position as the head of his Universal Zulu Nation organisation"}
    - {title: "Complex (2026)", url: "https://www.complex.com/music/a/backwoodsaltar/afrika-bambaataa-dead-hip-hop-pioneer", quote: "Many members of the Zulu Nation resigned following the allegations, and Bambaataa also stood down from his leadership role as a result."}
- card: radio-haiti
  fact: "Creole is the language most Haitians speak."
  sources:
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "It was the first radio station to deliver news and commentary in Creole, the language most people there speak"}
    - {title: "NEH: Voices of Change, preserving Radio Haiti", url: "https://www.neh.gov/divisions/preservation/featured-project/tune-in-tuesdays-voices-change-preserving-radio-haiti", quote: "Reporting in Haitian Creole (a language spoken by 90% of the Haitian population) as well as French"}
- card: radio-haiti
  fact: "When Jean-Claude Duvalier fled in 1986, Dominique and Montas returned to a crowd that nearly carried them to the wrecked station, which reopened."
  sources:
    - {title: "Duke Rubenstein Library blog (2015)", url: "https://blogs.library.duke.edu/rubenstein/2015/11/20/radio-haiti-you-are-the-rain-if-you-didnt-fall-we-could-not-bloom-repression-and-remembrance-on-november-28/", quote: "on February 7, 1986 ... Jean-Claude Duvalier and his family boarded a US Air Force cargo plane and fled to France. On March 4, Jean Dominique and Michèle Montas returned to Port-au-Prince, where many thousands of people ... received them at the airport and nearly carried them to the old Radio Haiti station on Rue du Quai. ... The station had been ravaged, their equipment smashed."}
    - {title: "Amnesty International (2002): Haiti, Jean Dominique investigation", url: "https://www.amnesty.org/fr/wp-content/uploads/sites/8/2021/06/amr360012002fr.pdf", quote: "ont par la suite apporté des fonds pour contribuer à la réouverture de la station de radio. Celle-ci a recommencé à émettre fin 1986."}
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "Jean Dominique on his return from exile to Haiti, 1986."}
- card: radio-haiti
  fact: "Who ordered Dominique's killing was never established."
  sources:
    - {title: "Committee to Protect Journalists (25 March 2003)", url: "https://cpj.org/2003/03/six-men-indicted-for-journalists-murderalleged-mas/", quote: "the indictment issued in Haiti on Friday, March 21, which failed to charge the masterminds behind the murder of prominent Haitian journalist Jean Leópold Dominique"}
    - {title: "The World (2022)", url: "https://theworld.org/stories/2022/05/04/radio-haiti-archives-find-home-duke-university", quote: "No one knows exactly who was behind the assasination — but Dominique had plenty of enemies."}
- card: radio-haiti
  fact: "Montas kept running the station until gunmen attacked her home; threats then closed it."
  sources:
    - {title: "Committee to Protect Journalists (25 March 2003)", url: "https://cpj.org/2003/03/six-men-indicted-for-journalists-murderalleged-mas/", quote: "On December 25, 2002, gunmen attacked Montas' house, killing one of her bodyguards. Two months later, Montas, who has run Radio Haïti-Inter since her husband's murder and has anchored the daily newscast, stopped broadcasting because of constant threats and harassment."}
    - {title: "WUNC (2015): Bringing Back Radio Haiti", url: "https://www.wunc.org/show/the-state-of-things/2015-02-25/bringing-back-radio-haiti-a-station-that-told-the-overlooked-stories", quote: "Montas continued running the station until an attempt on her own life in 2003 forced her to close the station for good."}
- card: reggae
  fact: "Clive Campbell (DJ Kool Herc), from Kingston, moved to the Bronx in 1967 and built a Kingston-style sound system there."
  sources:
    - {title: "GRAMMY.com (2023): DJ Kool Herc and Cindy Campbell, Jamaican roots", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "Clive arrived in the Bronx in 1967. With the help of his father, Herc set up his own sound system, The Herculoids, its powerful, rumbling sonic replicating what he heard in his Kingston youth"}
    - {title: "Red Bull Music Academy (2018): Interview, DJ Kool Herc", url: "https://daily.redbullmusicacademy.com/2018/01/kool-herc-interview", quote: "Marrying the bass-heavy sensibilities of his native Kingston, Jamaica, to the party vibe of the Bronx, Herc created a soundsystem that could dominate any rival. ... I came here in 1967, aged 13."}
- card: reggae
  fact: "As DJ Kool Herc he played the Bronx parties from which hip-hop grew."
  sources:
    - {title: "GRAMMY.com (2023)", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "On Aug. 11, 1973, high school student Cindy Campbell threw a party in the recreation room of her family's Bronx apartment building ... she asked her 18-year-old brother Clive to play the music. Clive, better known as DJ Kool Herc"}
    - {title: "Red Bull Music Academy (2018): Interview, DJ Kool Herc", url: "https://daily.redbullmusicacademy.com/2018/01/kool-herc-interview", quote: "the teenage block parties that birthed an entire global culture"}
- card: rhythm-and-blues
  fact: "Jerry Wexler later joined Atlantic Records as a partner and producer."
  sources:
    - {title: "Contemporary Authors, via Encyclopedia.com: Wexler, Jerry 1917-2008", url: "https://www.encyclopedia.com/arts/educational-magazines/wexler-jerry-1917-2008-gerald-wexler", quote: "In 1953 he joined Atlantic Records, as a vice president, partner, and record producer for artists like the Drifters."}
    - {title: "Mark Puryear, Tell It Like It Is, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "Coined by then-music journalist and later Atlantic Records executive Jerry Wexler to replace the older categories of \"race music\" or \"race records,\""}
    - {title: "Rock and Roll Hall of Fame: Jerry Wexler", url: "https://www.rockhall.com/inductees/jerry-wexler", quote: "Jerry Wexler's position at Atlantic Records (an upstart, indie label at the time) allowed him to work hands-on with artists and revolutionize the recording process."}
- card: rhythm-and-blues
  fact: "Decades later Ruth Brown fought Atlantic for unpaid royalties; the label paid her and dozens of other artists of her era, and the Rhythm and Blues Foundation grew out of her fight."
  sources:
    - {title: "NPR Forebears: Ruth Brown (2017)", url: "https://text.npr.org/559070707", quote: "Brown then used her new fame to leverage Atlantic Records into paying her back royalties — and she didn't stop there. The deal she cut with the label also allowed dozens of other musicians to recoup their earnings as well. In 1988 she helped found the Rhythm & Blues Foundation"}
    - {title: "BlackPast: Ruth Brown (1928-2006)", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Because she spoke out, Atlantic waived unrecouped debts held by Brown and thirty-five other musicians of her era and agreed to pay twenty years' worth of retroactive royalties. Atlantic also contributed almost $2 million to start the Rhythm and Blues Foundation"}
    - {title: "Diane Moroff, Brown, Ruth, Contemporary Musicians, via Encyclopedia.com", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "she spent far too much of her hard-earned money trying to win back royalties from Atlantic Records — eventually, with the help of her longtime fan and lawyer, Howell Begles, she not only got herself some paychecks but helped to establish the Rhythm and Blues Foundation"}
- card: rinse-fm
  fact: "Slimzee's 2005 ASBO banned him for five years from the roofs of taller buildings in Tower Hamlets, on pain of prison."
  sources:
    - {title: "Building (22 April 2005): Pirate DJ silenced in rooftop radio purge", url: "https://www.building.co.uk/pirate-dj-silenced-in-rooftop-radio-purge/3050083.article", quote: "A pirate radio DJ has been banned from rooftops over four storeys ... Magistrates last week agreed to Tower Hamlets council's request to impose the five-year, borough-wide ban against 23-year-old Dean Fullman, aka DJ Slimzee."}
    - {title: "Dummy: The Dummy guide to Rinse FM", url: "https://dmy.co/features/the-dummy-guide-to-rinse-fm/", quote: "As recently as 2005, Slimzee was given an \"unprecedented\" ASBO and banned for five years from the roof of any building in Tower Hamlets with more than four storeys"}
    - {title: "Time Out (2024): 30 years of Rinse FM", url: "https://www.timeout.com/london/music/rinse-fm-cover-interview", quote: "in 2005, Slimzee was arrested and given an ASBO, which would send him to prison if he was caught above the third floor of a building"}
- card: rinse-fm
  fact: "Rinse started its own record label, which launched the singer Katy B."
  sources:
    - {title: "Time Out (2024): 30 years of Rinse FM", url: "https://www.timeout.com/london/music/rinse-fm-cover-interview", quote: "Geeneus established Rinse Recordings as a label in 2003. ... In about 2006, Geeneus met Katy B and worked with the network of Rinse talent to eventually drop her legendary debut album, 'On a Mission'."}
    - {title: "Dazed (2024): Rinse FM at 30, an oral history", url: "https://www.dazeddigital.com/music/article/62542/1/rinse-fm-at-30-an-oral-history-of-the-notorious-east-london-radio", quote: "Geeneus turned his attention to Rinse the record label. He released a number of grime, dubstep and funky records throughout the 2000s, then around 2007 he heard about a singer from south London who was really into raving, now known as Katy B."}
- card: rinse-fm
  fact: "The station turned thirty in 2024."
  sources:
    - {title: "Time Out (2024): 30 years of Rinse FM", url: "https://www.timeout.com/london/music/rinse-fm-cover-interview", quote: "It's 30 years to the day since Rinse FM's legendary first broadcast on the day of Notting Hill Carnival."}
    - {title: "Dazed (2024): Rinse FM at 30, an oral history", url: "https://www.dazeddigital.com/music/article/62542/1/rinse-fm-at-30-an-oral-history-of-the-notorious-east-london-radio", quote: "Rinse FM at 30: an oral history of the notorious London radio station"}
- card: robert-smalls
  fact: "Smalls was born enslaved in Beaufort, South Carolina, in 1839."
  sources:
    - {title: "National Park Service: Robert Smalls", url: "https://www.nps.gov/people/robert-smalls.htm", quote: "Robert Smalls was born in 1839, enslaved by a local planter in Beaufort, South Carolina."}
    - {title: "US House of Representatives, History, Art & Archives: Robert Smalls", url: "https://history.house.gov/People/Listing/S/SMALLS,-Robert-(S000502)/", quote: "Robert Smalls was born enslaved on April 5, 1839, in Beaufort, South Carolina."}
- card: robert-smalls
  fact: "He died in Beaufort in 1915, when segregation had taken hold."
  sources:
    - {title: "National Park Service: Robert Smalls", url: "https://www.nps.gov/people/robert-smalls.htm", quote: "By the time Robert Smalls died in February 1915, southern Democrats had completely retaken the political landscape of the south and instituted harsh segregation policies."}
    - {title: "US House of Representatives, History, Art & Archives: Robert Smalls", url: "https://history.house.gov/People/Listing/S/SMALLS,-Robert-(S000502)/", quote: "Over time, his duties as collector became more onerous in the face of racism and segregation in Beaufort. He was forced to step down in 1913 ... Smalls died in his Beaufort home on February 23, 1915."}
- card: jerry-lawson
  fact: "Video Soft's one official release was the Color Bar Generator, a utility cartridge for television repair"
  sources:
    - {title: "The Henry Ford: The F Stands for Fun, Jerry Lawson and the Fairchild Channel F (2021)", url: "https://www.thehenryford.org/explore/blog/jerry-lawson-and-the-fairchild-channel-f-video-entertainment-system", quote: "but only one cartridge found official release: a technical tool for television repair called “Color Bar Generator.”"}
    - {title: "The Strong National Museum of Play: Collection documents the career of video game pioneer Jerry Lawson", url: "https://www.museumofplay.org/blog/collection-documents-the-career-of-video-game-pioneer-jerry-lawson/", quote: "In 1984, the company released its novel Color Bar Generator utility cartridge for the Atari 2600."}
- card: jerry-lawson
  fact: "He died in April 2011, aged 70, of complications of diabetes"
  sources:
    - {title: "The Washington Post via Bangor Daily News: Gerald Lawson, engineer whose innovation changed video games, dies at 70 (2011)", url: "https://www.bangordailynews.com/2011/04/25/news/gerald-lawson-engineer-whose-innovation-changed-video-games-dies-at-70/", quote: "Lawson, who lived in Santa Clara, Calif., died April 9 of complications of diabetes in El Camino Hospital in Mountain View"}
    - {title: "Vintage Computing and Gaming: Jerry Lawson (1940-2011)", url: "https://www.vintagecomputing.com/index.php/archives/755", quote: "Jerry Lawson died Saturday morning, April 9th, 2011, at the age of 70."}
    - {title: "Vintage Computing and Gaming: Jerry Lawson (1940-2011)", url: "https://www.vintagecomputing.com/index.php/archives/755", quote: "This New York Times obituary quotes Lawson’s wife as saying that Lawson died from “complications of diabetes.”"}
- card: ngugi
  fact: "Days after his return in 2004, armed men broke into his Nairobi apartment and beat him and his wife; police called it a robbery, others a political attack"
  sources:
    - {title: "BBC News: Kenyan writer's wife was raped (2004)", url: "http://news.bbc.co.uk/2/hi/africa/3569480.stm", quote: "Four thieves broke into their apartment on Wednesday night armed with guns and a machete, beating up the couple, burning him with cigarettes and stealing money,"}
    - {title: "BBC News: Renowned Kenyan author attacked (2004)", url: "http://news.bbc.co.uk/2/hi/africa/3558050.stm", quote: "Police say they believe the attack is not politically motivated."}
    - {title: "The Star Kenya: Who was Ngũgĩ wa Thiong’o", url: "https://www.the-star.co.ke/news/2025-05-29-who-was-ngugi-wa-thiongo", quote: "However, his homecoming was tragically marred by a violent, politically charged attack on him and his second wife, Njeeri wa Ngũgĩ, in their Nairobi apartment."}
- card: octavia-butler
  fact: "She gave a Black woman's voice to a genre long dominated by white men."
  sources:
    - {title: "EBSCO Research Starters: Octavia E. Butler", url: "https://www.ebsco.com/research-starters/biography/octavia-e-butler", quote: "Butler brought an African American woman's voice to science fiction, a genre traditionally dominated by white men."}
    - {title: "Seattle Times (AP), 26 February 2006", url: "https://archive.seattletimes.com/archive/20060226/webbutlerobit26/octavia-butler-prominent-science-fiction-author-dies-at-58", quote: "Octavia E. Butler, the first black woman to gain national prominence as a science fiction writer"}
- card: octavia-butler
  fact: "She left her papers, including her self-motivational notes, to the Huntington Library."
  sources:
    - {title: "Online Archive of California: Octavia E. Butler Papers, Huntington Library", url: "https://oac.cdlib.org/findaid/ark:/13030/c8hm5br8/admin/", quote: "Acquisition information: Bequest of Octavia E. Butler, August 2008 (Boxes 1-354, 387-392, oversize folders 1-18) and July 2017"}
    - {title: "Good Black News (2017)", url: "https://goodblacknews.org/2017/07/03/sci-fi-writer-octavia-butlers-inspirational-notes-to-herself-on-display-at-huntington-library-in-ca-through-87/", quote: "presents about 100 items, including manuscripts, photographs and notebooks filled with writing and self-motivational notes, including one that reads in part, 'My novels go onto the bestseller lists. … So be it! See to it!'"}
- card: omar-ibn-said
  fact: "He had spent twenty-five years in study before he was enslaved."
  sources:
    - {title: "Documenting the American South: summary by Patrick E. Horn", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "After receiving 25 years of schooling in Africa, he was enslaved and transported to Charleston, South Carolina."}
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "I continued my studies twenty-five years."}
- card: omar-ibn-said
  fact: "The crossing took a month and a half."
  sources:
    - {title: "Documenting the American South: summary", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "his crossing of \"the great sea\" for a month and a half testifies to the raw violence of the slave trade"}
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "we sailed upon the great sea a month and a half, when we came to a place called Charleston"}
- card: omar-ibn-said
  fact: "He landed in Charleston around 1807."
  sources:
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831 (headnote)", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "About 1807 he was captured and taken to Charleston, South Carolina to be sold."}
    - {title: "Lowcountry Digital History Initiative: Omar ibn Said", url: "https://ldhi.library.cofc.edu/exhibits/show/african-muslims-in-the-south/five-african-muslims/omar-ibn-said--1770-1864", quote: "Scholars estimate that the slave ship that brought Said to Charleston, South Carolina landed in 1807."}
- card: omar-ibn-said
  fact: "When a man from Charleston came to buy him, he answered 'No, no, no, no, no, no, no'."
  sources:
    - {title: "National Humanities Center: Autobiography of Omar ibn Said, 1831", url: "https://nationalhumanitiescenter.org/pds/maai/community/text3/religionomaribnsaid.pdf", quote: "a man by the name of Mitchell came to buy me. He asked me if I were willing to go to Charleston City. I said \"No, no, no, no, no, no, no, I am not willing to go to Charleston. I stay in the hand of Jim Owen.\""}
    - {title: "Documenting the American South: summary", url: "https://docsouth.unc.edu/nc/omarsaid/summary.html", quote: "he does report that on one occasion a Charleston man named Mitchell tried to purchase him from Owen. \"I said 'No, no, no, no, no, no, no,'\" Said recalled"}
- card: palmares
  fact: "Palmares became the most famous quilombo in Brazil and the model for the study of quilombos."
  sources:
    - {title: "Reis and Gomes, Quilombo: Brazilian Maroons during Slavery, Cultural Survival Quarterly", url: "https://www.culturalsurvival.org/publications/cultural-survival-quarterly/quilombo-brazilian-maroons-during-slavery", quote: "Palmares became the prototype of the quilombo in Brazilian historical and anthropological literature."}
    - {title: "Fundação Cultural Palmares: Quilombo", url: "https://www.gov.br/palmares/pt-br/departamentos/protecao-preservacao-e-articulacao/serra-da-barriga-1/quilombo/", quote: "No Brasil, a mais famosa comunidade quilombola foi Palmares"}
- card: phillis-wheatley
  fact: "At about fourteen she published her first poem in a newspaper (Newport Mercury, 1767)."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "her first published poem, \"On Messrs Hussey and Coffin,\" appeared in 1767 in the Newport Mercury"}
    - {title: "Boston Public Library (2023)", url: "https://www.bpl.org/blogs/post/tracing-the-life-of-phillis-wheatley-peters/", quote: "Phillis Wheatley Peters' first published poem – On Messrs. Hussey and Coffin – appeared in the Newport Mercury on December 21, 1767, when she was 14 years old."}
- card: phillis-wheatley
  fact: "In 1770 an elegy on George Whitefield made her famous."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "In 1770, her elegy on the death of George Whitefield, a celebrated evangelical Methodist minister who had traveled through the American colonies, drew international attention"}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "Her 1770 poem \"An Elegiac Poem, on the Death of the Celebrated Divine George Whitefield,\" dedicated to a famous English preacher, made her a household name"}
- card: phillis-wheatley
  fact: "In 1773 she sailed to London, where the book was published that September."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "the family's son Nathaniel to England, where plans for the publication had begun, but she was called home by the illness of Susannah Wheatley, and departed before the book appeared in September"}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "In March 1773, with financial support from the English Countess of Huntingdon, who was an admirer of her work, Wheatley traveled to London with the Wheatley's son to publish her first collection of poems"}
- card: phillis-wheatley
  fact: "Poems on Various Subjects was the first known book of poetry by a Black woman."
  sources:
    - {title: "Massachusetts Historical Society: Phillis Wheatley", url: "https://www.masshist.org/features/endofslavery/wheatley", quote: "Phillis Wheatley was the author of the first known book of poetry by a Black woman, published in London in 1773."}
    - {title: "National Women's History Museum: Phillis Wheatley", url: "https://www.womenshistory.org/education-resources/biographies/phillis-wheatley", quote: "Phillis Wheatley Peters is broadly recognized as the first African American and the second U.S. woman to publish a book of poetry."}
- card: radio-haiti
  fact: "After the 1991 coup the new rulers attacked the station, and the couple went into exile again, returning in 1994."
  sources:
    - {title: "Amnesty International (2002): Haiti, Jean Dominique investigation", url: "https://www.amnesty.org/fr/wp-content/uploads/sites/8/2021/06/amr360012002fr.pdf", quote: "Les instigateurs du coup d'État qui ont renversé Jean-Bertrand Aristide sept mois seulement après son entrée en fonction ont également pris Radio Haïti Inter pour cible. Les traces de balles sont encore visibles sur les murs de l'immeuble. Jean Dominique et sa famille sont alors repartis en exil aux États-Unis et ne sont rentrés au pays qu'après le retour à un système constitutionnel en 1994."}
    - {title: "Duke Today (2014)", url: "https://today.duke.edu/2014/04/radiohaitiarchives", quote: "The tapes survived the Haitian security forces in 1991 who ransacked the building. ... they were exiled twice from the country."}
- card: robert-smalls
  fact: "A champion of public schools, he helped write South Carolina's new constitution in 1868."
  sources:
    - {title: "National Park Service: Robert Smalls", url: "https://www.nps.gov/people/robert-smalls.htm", quote: "Smalls became an advocate for public education, including for himself. In 1868, he served as a delegate to the South Carolina state convention that wrote a new state constitution. Smalls lobbied for public education to be a key component of the new document."}
    - {title: "US House of Representatives, History, Art & Archives: Robert Smalls", url: "https://history.house.gov/People/Listing/S/SMALLS,-Robert-(S000502)/", quote: "He embarked on business ventures, opening a store and a school for Black students in 1867. ... He was a delegate to the 1868 South Carolina constitutional convention"}
