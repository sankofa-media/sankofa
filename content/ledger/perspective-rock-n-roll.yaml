# Perspective rewrite of rock-n-roll (2026-11-15): shared frame, {male} Ike Turner and Jackie Brenston
# ("Rocket 88"), {female} Sister Rosetta Tharpe and Big Mama Thornton ("Hound Dog").
# One entry per fact in the new or rewritten paragraphs. The shared opening and closing paragraphs are the
# existing text, only condensed, and keep the card's earlier sourcing; entries for them are given where quoted.
# Not used because sources disagree: the exact session date (Propes: 5 March; Guralnick via Blues Trail: 7 March)
# and Turner's pay ($20 per Propes; $60 in a later Chicago Tribune interview). Brenston's "greenhorn" quote
# was dropped: only the Mississippi Blues Trail marker gives it.
- card: rock-n-roll
  copy: both
  fact: "Rock and roll ran on an aggressive beat and loud electric guitar, with saxophone and piano, and grew out of rhythm and blues"
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "characterized by an aggressive beat and prominent electric guitars"}
    - {title: "Case Western Reserve University, Encyclopedia of Cleveland History: Rock & Roll", url: "https://case.edu/ech/articles/r/rock-roll", quote: "rock expanded from its R&B base to include the rockabilly format"}
- card: rock-n-roll
  copy: both
  fact: "In Cleveland the DJ Alan Freed played rhythm and blues and called it rock and roll"
  sources:
    - {title: "Encyclopedia of Cleveland History: Freed, Alan", url: "https://case.edu/ech/articles/f/freed-alan", quote: "with Freed spinning rhythm-and-blues records by black musicians. ... Mintz and Freed called the music Rock 'n' Roll."}
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "in 1951, Cleveland disc jockey Alan Freed began calling his rhythm and blues radio show “Moondog’s Rock and Roll Party.”"}
- card: rock-n-roll
  copy: both
  fact: "White singers built careers on covers of Black records; in 1955 Pat Boone covered Fats Domino's \"Ain't That a Shame\""
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "advanced their careers in rock 'n' roll by covering the recordings of Black artists"}
    - {title: "uDiscover Music: Fats Domino", url: "https://www.udiscovermusic.com/artists/fats-domino", quote: "In May 1955 it entered the R&B charts ... Its progress on the main Billboard chart was hampered by a cover version by Mr Vanilla, Pat Boone"}
    - {title: "American Masters, Fats Domino and the Birth of Rock n Roll, documentary transcript, PBS", url: "https://pbswisconsin.org/watch/american-masters/american-masters-fats-domino-and-birth-rock-n-roll/", quote: "a fellow by the name of Pat Boone comin' out with your record next week. ... While \"Ain't That a Shame\" was burning up the 1955 R&B and pop charts"}
- card: rock-n-roll
  copy: male
  fact: "In March 1951 Ike Turner's Kings of Rhythm recorded \"Rocket 88\" at Sam Phillips's studio in Memphis"
  sources:
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "created in a March 5, 1951 session at Sam Phillips' legendary Memphis Recording Service studio. Piano player Ike Turner showed up with his Kings of Rhythm"}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "Recorded March 5, 1951, at Memphis Recording Service"}
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "The disputed recording date was actually March 7, according to Peter Guralnick"}
- card: rock-n-roll
  copy: male
  fact: "The band were young men from Clarksdale, Mississippi, who came up Highway 61 to Memphis"
  sources:
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "The band that traveled up Highway 61 to make the record in Memphis consisted of Ike Turner, Jackie Brenston, Raymond Hill, Willie Kizart ... and Willie \"Bad Boy\" Sims, all aged 17 to 20."}
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "During the 61-mile trip from Clarksdale, Mississippi to Memphis ... somewhere along Highway 61"}
- card: rock-n-roll
  copy: male
  fact: "On it: Turner's piano, two saxophones, drums and a distorted electric guitar"
  sources:
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "Ike Turner, piano; Willie Kizart, electric guitar; Willie Sims, drums; Raymond Hill, tenor sax, and Brenston, tenor sax and vocals ... Kizart's loud and accidentally fuzz-toned guitar"}
    - {title: "Prof. Freeze, MUSC-21600 The Art of Rock Music: Rocket 88 listening guide, College of Wooster", url: "https://theartofrockmusic.voices.wooster.edu/wp-content/uploads/sites/180/2015/01/Rocket-88-Jackie-Brenston-1951.pdf", quote: "Drums, electrical guitar, 2 saxophones, solo vocals ... Introduction features piano Boogie-woogie pattern in distorted electric guitar."}
- card: rock-n-roll
  copy: male
  fact: "Chess issued the record under the name of Jackie Brenston, Turner's saxophonist, who sang it; Turner's name was not on the label"
  sources:
    - {title: "Library of Congress: Steve Propes on Rocket 88", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Rocket-88_Propes.pdf", quote: "Turner couldn't have been pleased his name was missing from the label without credit to the Kings of Rhythm"}
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "The Delta Cats were actually Ike Turner's Kings of Rhythm from Clarksdale."}
- card: rock-n-roll
  copy: male
  fact: "It became Chess Records' first number one on the rhythm and blues chart"
  sources:
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "it was also the first No. 1 rhythm & blues hit for Chicago-based Chess Records"}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "reaching No. 1 on the R&B charts (Chess Records' first chart-topper)"}
- card: rock-n-roll
  copy: male
  fact: "Brenston went out on his own and never had another hit"
  sources:
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "Brenston rocketed to a brief period of stardom, taking off on his own to tour the country in 1951-1952, but he sold his rights to \"Rocket '88'\" to Phillips and never had another hit."}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "motivating Brenston to split from Turner and launch his own short-lived career"}
    - {title: "Bear Family Records: Jackie Brenston", url: "https://www.bear-family.com/brenston-jackie/?c=128563", quote: "His further Chess records, cut with Phineas Newborn Sr.'s band in Memphis and then in Chicago, went nowhere."}
- card: rock-n-roll
  copy: male
  fact: "In the end Brenston went back to Turner's band as a sideman"
  sources:
    - {title: "Bear Family Records: Jackie Brenston", url: "https://www.bear-family.com/brenston-jackie/?c=128563", quote: "so by the mid-'50s Jackie was back with the Kings of Rhythm"}
    - {title: "Mississippi Blues Trail: Rocket \"88\" marker, Lyon", url: "https://msbluestrail.org/?p=452", quote: "He finally rejoined Turner's band as a sideman in St. Louis."}
- card: rock-n-roll
  copy: male
  fact: "In 1952 Phillips started his own label, Sun"
  sources:
    - {title: "Encyclopedia of Alabama: Sam Phillips", url: "https://encyclopediaofalabama.org/article/sam-phillips/", quote: "In 1952, he renamed his label Sun Records."}
    - {title: "Tennessee Encyclopedia: Sun Records", url: "https://tennesseeencyclopedia.net/?p=1664", quote: "By 1952, Phillips had tired of recording hits for other firms. ... He started his own record company, turning to the name \"Sun.\""}
- card: rock-n-roll
  copy: male
  fact: "In 1954, in the same studio, Phillips recorded Elvis Presley"
  sources:
    - {title: "Encyclopedia of Alabama: Sam Phillips", url: "https://encyclopediaofalabama.org/article/sam-phillips/", quote: "On July 5, 1954, in Phillips's recording studio, a young Tennessee truck driver named Elvis Presley picked up a guitar"}
    - {title: "Tennessee Encyclopedia: Sun Records", url: "https://tennesseeencyclopedia.net/?p=1664", quote: "In the summer of 1954, Presley, along with guitarist Scotty Moore and bass player Bill Black"}
    - {title: "Blues Foundation Hall of Fame: Rocket 88", url: "https://www.blues.org/award-search/rocket-88-is-one-of-many-blues-a", quote: "Producer Sam Phillips recorded it at his Memphis Recording Service, where Elvis Presley would launch his recording career three years later"}
- card: rock-n-roll
  copy: female
  fact: "Sister Rosetta Tharpe came of age singing beside her mother, an evangelist"
  sources:
    - {title: "Central Arkansas Library System, Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "an evangelist, singer, and mandolin player ... Both mother and daughter worked as members of an evangelistic troupe"}
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "With her mother, an evangelist, she came of age as a singer and instrumentalist"}
- card: rock-n-roll
  copy: female
  fact: "In 1938 she made her first Decca records, among them \"Rock Me\""
  sources:
    - {title: "PBS American Masters: Timeline, the years of Sister Rosetta Tharpe", url: "https://www.pbs.org/wnet/americanmasters/timeline-the-years-of-sister-rosetta-tharpe/2487/", quote: "Rosetta records her first Decca sides, including \"Rock Me,\""}
    - {title: "Central Arkansas Library System, Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "Tharpe was signed to Decca Records in 1938 and was successful immediately."}
- card: rock-n-roll
  copy: female
  fact: "In 1938 she took gospel onto the stages of New York nightclubs"
  sources:
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "She ultimately gained bigger fame in 1938, when she began appearing on the stages of prominent New York nightclubs"}
    - {title: "PBS American Masters: Timeline, the years of Sister Rosetta Tharpe", url: "https://www.pbs.org/wnet/americanmasters/timeline-the-years-of-sister-rosetta-tharpe/2487/", quote: "1938 – “Sister Rosetta Tharpe” joins the cast of the fall 1938 Cotton Club Revue"}
- card: rock-n-roll
  copy: female
  fact: "She later played electric guitar"
  sources:
    - {title: "Rock and Roll Hall of Fame: Sister Rosetta Tharpe", url: "https://www.rockhall.com/inductees/sister-rosetta-tharpe", quote: "her roaring mastery of her trusty Gibson Les Paul Custom"}
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "playing electric guitar from the outfield while wearing a white wedding gown"}
- card: rock-n-roll
  copy: female
  fact: "Rock and roll called her its godmother"
  sources:
    - {title: "Gayle Wald: Why We Keep Rediscovering the Flamboyant Godmother of Rock", url: "https://whatitmeanstobeamerican.org/encounters/why-we-keep-rediscovering-the-flamboyant-godmother-of-rock/", quote: "proclaiming Tharpe the \"godmother\" of rock"}
    - {title: "PBS American Masters: Timeline, the years of Sister Rosetta Tharpe", url: "https://www.pbs.org/wnet/americanmasters/timeline-the-years-of-sister-rosetta-tharpe/2487/", quote: "Sister Rosetta Tharpe: The Godmother of Rock & Roll [film title]"}
- card: rock-n-roll
  copy: female
  fact: "In August 1952 Big Mama Thornton recorded \"Hound Dog\", written for her by Jerry Leiber and Mike Stoller"
  sources:
    - {title: "Michael Sporke, Library of Congress: Hound Dog", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/HoundDog.pdf", quote: "On 13 August 1952, Willie Mae Thornton ... recorded ... \"Hound Dog.\" ... Mike Stoller and Jerry Lieber wrote \"Hound Dog\" especially for Big Mama."}
    - {title: "HISTORY: Hound Dog is recorded for the first time", url: "https://www.history.com/this-day-in-history/august-13/hound-dog-is-recorded-for-the-first-time-by-big-mama-thornton", quote: "Otis asked two young songwriters on the Los Angeles music scene if they would write something, especially for Thornton. ... Those songwriters were Jerry Lieber and Mike Stoller"}
    - {title: "Encyclopedia of Alabama: Willie Mae 'Big Mama' Thornton", url: "https://encyclopediaofalabama.org/?p=15700", quote: "They offered her a 12-bar blues vocal called \"Hound Dog,\""}
- card: rock-n-roll
  copy: female
  fact: "Released in 1953, it topped the rhythm and blues chart"
  sources:
    - {title: "Encyclopedia of Alabama: Willie Mae 'Big Mama' Thornton", url: "https://encyclopediaofalabama.org/?p=15700", quote: "was released nationwide in 1953 and soon topped the R&B charts."}
    - {title: "Rock & Roll Hall of Fame: Big Mama Thornton", url: "https://www.rockhall.com/inductees/big-mama-thornton", quote: "Her original 1953 recording of \"Hound Dog\" ... Thornton's hit No. 1 R&B"}
- card: rock-n-roll
  copy: female
  fact: "Elvis Presley's 1956 version became an international hit"
  sources:
    - {title: "Yale University Library, OHAM exhibit: Big Mama Thornton part 2", url: "https://onlineexhibits.library.yale.edu/s/ohamstruggles/page/bmt2", quote: "In 1956, Elvis Presley released his own version of \"Hound Dog,\" which became an international hit."}
    - {title: "Michael Sporke, Library of Congress: Hound Dog", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/HoundDog.pdf", quote: "by 1956, the rock 'n' roll age was already universal. Elvis Presley recorded \"Hound Dog\" to international acclaim."}
- card: rock-n-roll
  copy: female
  fact: "For the rest of her life Thornton told how Presley grew rich on her song while she, as she said in 1974, made zero"
  sources:
    - {title: "Michael Sporke, Library of Congress: Hound Dog", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/HoundDog.pdf", quote: "Big Mama Thornton would, for the rest of her life, tell how Elvis got rich and famous with \"her\" song."}
    - {title: "Yale University Library, OHAM exhibit: Big Mama Thornton part 2", url: "https://onlineexhibits.library.yale.edu/s/ohamstruggles/page/bmt2", quote: "Although Elvis Presley made a million, a billion, and I made zero,...I was still pushing. [1974]"}
    - {title: "Encyclopedia of Alabama: Willie Mae 'Big Mama' Thornton", url: "https://encyclopediaofalabama.org/?p=15700", quote: "Elvis Presley's 1956 version, heavily refined for mainstream audiences, [brought him fame and financial reward]"}
- card: rock-n-roll
  copy: female
  fact: "The Rock and Roll Hall of Fame inducted Tharpe in 2018"
  sources:
    - {title: "Rock and Roll Hall of Fame: Sister Rosetta Tharpe", url: "https://www.rockhall.com/inductees/sister-rosetta-tharpe", quote: "2018 [inductee, Musical Influence]"}
    - {title: "Central Arkansas Library System, Encyclopedia of Arkansas: Sister Rosetta Tharpe", url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/", quote: "In 2018, Tharpe was inducted into the Rock and Roll Hall of Fame in the Early Influence category."}
- card: rock-n-roll
  copy: female
  fact: "The Rock and Roll Hall of Fame inducted Thornton in 2024"
  sources:
    - {title: "Rock & Roll Hall of Fame: Big Mama Thornton", url: "https://www.rockhall.com/inductees/big-mama-thornton", quote: "2024 [inductee, Musical Influence]"}
    - {title: "Variety: Rock Hall 2024 inductees", url: "https://au.variety.com/2024/awards/news/rock-hall-2024-inductees-cher-jimmy-buffett-mary-j-blige-dave-matthews-peter-frampton-foreigner-13515/", quote: "It's a diverse list that stretches from R&B/rock pioneer Big Mama Thornton to pop superstars"}
- card: rock-n-roll
  copy: both
  fact: "The phrase rock and roll was old blues slang for sex"
  sources:
    - {title: "Encyclopedia of Cleveland History: Freed, Alan", url: "https://case.edu/ech/articles/f/freed-alan", quote: "Mintz and Freed called the music Rock 'n' Roll (believed to be an old blues reference to sex)"}
    - {title: "Encyclopedia of African-American Culture and History, via Encyclopedia.com: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "rock and roll — originally a euphemism for sex — was virtually synonymous with rhythm and blues"}
- card: rock-n-roll
  copy: both
  fact: "Fats Domino of New Orleans: \"What they call rock 'n' roll is rhythm and blues\""
  sources:
    - {title: "Carnegie Hall, Timeline of African American Music: Rock 'n' Roll", url: "https://timeline.carnegiehall.org/genres/rock-n-roll", quote: "In 1965 Fats Domino said, “What they call rock ‘n’ roll is rhythm and blues. I’ve been playing it for 15 years in New Orleans.”"}
    - {title: "American Masters, Fats Domino and the Birth of Rock n Roll, documentary transcript, PBS", url: "https://pbswisconsin.org/watch/american-masters/american-masters-fats-domino-and-birth-rock-n-roll/", quote: "Well, what they call rock 'n' roll now is rhythm and blues. I've been playin' for 15 years in New Orleans."}
