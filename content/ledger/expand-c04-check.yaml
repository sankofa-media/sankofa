# Second, independent fact-check of batch c04 (expand-c04.yaml), 2026-11-14.
# Every source was re-opened. Britannica, whc.unesco.org HTML pages, JSTOR, Smarthistory,
# the Met Heilbrunn Timeline and the UNESCO shop could not be opened (bot challenge / 403 / 429),
# so facts that leaned on them were re-sourced or removed. Quotes below are verbatim from the
# opened pages; [...] marks an elision.
entries:
  - card: swahili
    fact: "Swahili is a Bantu language of the East African coast"
    verdict: confirmed
    sources:
      - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
        url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
        quote: "Kiswahili, an African language of the Bantu-family"
      - title: "Nobuko Yoneda, Traces of Indian Ocean Trade in the Swahili Language, in Currents of Metamorphosis across the Indian Ocean (University of Osaka, 2025)"
        url: "https://ir.library.osaka-u.ac.jp/repo/ouka/all/101089/CMIO_003.pdf"
        quote: "Swahili is a Bantu language belonging to the Niger-Congo phylum."
    note: "Encyclopaedia Britannica pages could not be opened (bot challenge, archive.org and reader proxies unavailable); replaced by Yoneda (Osaka 2025). Africa Renewal credits UNESCO as its source, so not counted separately."
  - card: swahili
    fact: "Its vocabulary carries traces of Indian Ocean trade, above all many Arabic loanwords"
    verdict: confirmed
    sources:
      - title: "Nobuko Yoneda, Traces of Indian Ocean Trade in the Swahili Language, in Currents of Metamorphosis across the Indian Ocean (University of Osaka, 2025)"
        url: "https://ir.library.osaka-u.ac.jp/repo/ouka/all/101089/CMIO_003.pdf"
        quote: "Swahili, the lingua franca of East Africa, is a language that uniquely blends the grammar of the indigenous Bantu languages with a significant number of loanwords from various external sources, primarily Arabic."
      - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
        url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
        quote: "Its changing vocabulary echoes the long-term impacts and effects of a transregional history of human connectivity, also across the Indian Ocean, with the Red Sea, the Gulf"
    note: "Britannica replaced by Yoneda; Kresse alone did not name Arabic."
  - card: swahili
    fact: "For most of its history Swahili was written in Arabic script; the oldest firmly dated Swahili writing on paper is from the early eighteenth century"
    verdict: corrected
    sources:
      - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
        url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
        quote: "the Swahili coast has been praised for its rich manuscript culture in Arabic script (also called ‘Ajami’, but this term is not commonly used here)"
      - title: "Ann Biersteker, Manuscript Cultures 17 (2021), University of Hamburg CSMC"
        url: "https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc17-biersteker.pdf"
        quote: "The oldest confirmed Swahili writing on paper is correspondence written in the early eighteenth century (1711–1724): letters that were confiscated by the Portuguese and taken to the Portuguese archives in Goa; see Alpers, 1975; Sultan Fatima binti Muhammad Mkubwa 2007"
      - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
        url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
        quote: "circa seventy Swahili letters, part of the Livro das Monções and kept in the Goan archive, which are currently considered the oldest existing Swahili manuscripts dating back to the early 18 th century"
    note: "'For most of its history' is not stated by any opened source; card now says 'For centuries'. Britannica unopenable."
