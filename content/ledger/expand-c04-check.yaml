  - card: swahili
    fact: "Swahili travelled inland along caravan routes carrying ivory and captives into Central Africa and became a lingua franca"
    verdict: corrected
    sources:
      - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
        url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
        quote: "Trade routes, created by caravans (largely concerned with acquiring slaves and ivory and bringing brass and cloth) reached far into Central Africa, and Swahili was long used as mediating lingua franca between people of different origin and unequal status."
      - title: "Nasor Malik, Extension of Kiswahili during the German colonial administration in continental Tanzania (former Tanganyika), 1885–1917, Afrikanistische Arbeitspapiere 47 (1996)"
        url: "https://ul.qucosa.de/api/qucosa%3A11639/attachment/ATT-0/"
        quote: "Kiswahili was already established as a lingua franca in the coastal region and along the trade routes from the coast to the interior"
    note: "'Carrying ivory and captives into Central Africa' rests on Kresse alone (Britannica unopenable); removed. Card keeps caravan routes into the interior and lingua franca, confirmed by Malik (1996)."
