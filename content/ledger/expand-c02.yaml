  fact: "The reading is contested (dispute: Espenshade; Ferguson concedes he suggested rather than proved)"
  sources:
    - title: "Christopher Espenshade, A River of Doubt (ScholarWorks UMass)"
      url: "https://scholarworks.umass.edu/server/api/core/bitstreams/e6975976-00a2-4461-80f3-455dd0d69cbd/content"
      quote: "In this essay, I argue that marked Colonoware bowl fragments recovered from rivers in coastal South Carolina do not support an inference that African Americans engaged in waterside spiritual ceremonies"
    - title: "Leland Ferguson, Comments on Espenshade's A River of Doubt (ScholarWorks UMass)"
      url: "https://hdl.handle.net/20.500.14394/843"
      quote: "I agree with Christopher Espenshade: I did not prove \"an association of marked Colonoware bowls with riverside ritual in 18th century South Carolina;\" ... I did, however, strongly suggest that to have been the case."
