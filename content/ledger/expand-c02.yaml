# Batch c02 (2026-11-13): one entry per fact in the bodies and wow lines of
# taharqa, amanirenas, faras-cathedral, gnawa, osun-osogbo, dogon-sirius,
# ifa-divination, lusona, lukasa, dikenga. Each fact has >= 2 independent sources.
# Pages blocked to bots were read through web.archive.org snapshots.
- card: taharqa
  fact: "From the 8th century BC kings of Kush, a Nubian kingdom in today's Sudan, ruled Egypt as its 25th Dynasty"
  sources:
    - title: "British Museum: Sphinx of Taharqo EA1770, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/Y_EA1770"
      quote: "In the eighth century BC they turned the tables on Egypt and acquired control of Upper Egypt, extending full control over the whole of the land at the beginning of the reign of Shabaka"
    - title: "Allen and Hill, Egypt in the Third Intermediate Period, Met Heilbrunn Timeline"
      url: "https://www.metmuseum.org/toah/hd/tipd/hd_tipd.htm"
      quote: "an independent native dynasty began to rule Nubia, or Kush, from Napata in what is now the Sudan ... This begins Dynasty 25, or the Kushite Period"
- card: taharqa
  fact: "Taharqa reigned 690-664 BC (also wow: he ruled all of Egypt)"
  sources:
    - title: "Encyclopaedia Britannica: Taharqa"
      url: "https://www.britannica.com/biography/Taharqa"
      quote: "Taharqa (flourished 7th century bce ) was the fourth king (reigned 690–664 bce ) of the 25th dynasty of ancient Egypt"
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "Taharqo (690–664 BC), the penultimate and greatest king of the 25th Dynasty"
- card: taharqa
  fact: "The Bible names him 'Tirhakah king of Ethiopia' (also wow)"
  sources:
    - title: "2 Kings 19:9, KJV (Bible Gateway)"
      url: "https://www.biblegateway.com/passage/?search=2+Kings+19%3A9&version=KJV"
      quote: "Tirhakah king of Ethiopia, Behold, he is come out to fight against thee"
    - title: "James K. Hoffmeier, Judah's African Ally: Taharqa and the Kingdom of Cush, BAR (2025)"
      url: "https://library.biblicalarchaeology.org/article/judahs-african-ally-taharqa-and-the-kingdom-of-cush/"
      quote: "Known as Tirhaqah in the Bible, he must have been only a young prince when he led Cush's army to Judah's defense in 701."
- card: taharqa
  fact: "Jebel Barkal is a flat-topped sandstone hill about 100 m high"
  sources:
    - title: "UNESCO WHC: Gebel Barkal and the Sites of the Napatan Region"
      url: "https://whc.unesco.org/en/list/1073"
      quote: "buried near the 100m high, flat-topped sandstone rock"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "une table de grès ferrugineux d'une centaine de mètres de hauteur"
- card: taharqa
  fact: "The god Amun was believed to dwell in Jebel Barkal"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "believing the hill to be occupied by a primeval form of their state god Amun of Karnak"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "C'est là que réside Amon de Napata auquel fut dédié un temple dès le début du Nouvel Empire"
- card: taharqa
  fact: "Taharqa built a temple to Mut at the foot of Barkal, its rear halls cut into the rock"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "B 300: Temple of the goddess Mut (“Mother”), also built by Taharqo ... which was cut into the cliff just to the left (west) of the pinnacle base"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "dédié à la déesse Mout, par Taharqa ... L'arrière du temple, à partir de la deuxième salle hypostyle, est creusé dans le djebel"
- card: taharqa
  fact: "An inscription of Taharqa was carved on the summit of the Barkal pinnacle; scaffolding holes survive; King Nastasen restored it (also wow)"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "a monument, which Taharqo placed on the virtually inaccessible summit of the Jebel Barkal pinnacle ... Holes cut in the opposing rock walls ... The panel inscription names two kings, Taharqo and Nastasen (late fourth century BC), indicating that the original monument was rebuilt and restored by the later king"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "une inscription de Taharqa (-690/-664) y fut d'ailleurs découverte ainsi que les trous d'un échafaudage, et une autre inscription du roi Nastasen qui le restaure à la fin du IVe siècle av. J.-C."
- card: taharqa
  fact: "In 671 BC Esarhaddon of Assyria took Memphis and Taharqa retreated south"
  sources:
    - title: "Encyclopaedia Britannica: Esarhaddon"
      url: "https://www.britannica.com/biography/Esarhaddon"
      quote: "until 671, when he seized Memphis and defeated the Egyptian king Taharqa , who fled south"
    - title: "Allen and Hill, Egypt in the Third Intermediate Period, Met Heilbrunn Timeline"
      url: "https://www.metmuseum.org/toah/hd/tipd/hd_tipd.htm"
      quote: "were broken by an Assyrian invasion in ca. 671 B.C. The current pharaoh, Taharqo, retreated south"
- card: taharqa
  fact: "Taharqa was buried in a large pyramid at Nuri"
  sources:
    - title: "Encyclopaedia Britannica: Taharqa"
      url: "https://www.britannica.com/biography/Taharqa"
      quote: "he fled south to Nubia , where he died and was buried in a large pyramid at Nuri"
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "Nuri, 10 km upstream and on the opposite bank, is the site of the pyramid of Taharqo (690–664 BC)"
- card: taharqa
  fact: "Later kings of Kush were buried around him at Nuri"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "The cemetery was founded by Taharqo about 664 BC and was used for the next four centuries by 19 of his successors and some 53 queens"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "il se fit enterrer dans le voisinage, suivi en cela par d'autres rois et leurs familles, d'où la très belle série de pyramides"
- card: taharqa
  fact: "Statues of Taharqa were found in a pit (cache) beside Barkal's great temple B 500"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "Reisner, by pure chance, discovered a hoard of ten granite royal statues, representing ... Taharqo and four of his five successors ... The larger statue pit at Jebel Barkal, 20 m northeast of the NE end of the first pylon of B 500"
    - title: "Brigitte Gratien (CNRS), Le djebel Barkal et le temple à Amon, Clio"
      url: "https://www.clio.fr/BIBLIOTHEQUE/pdf/pdf_le_djebel_barkal_et_le_temple_a_amon.pdf"
      quote: "D'une cachette au nord du premier pylône du temple B 500, on exhuma des statues ... des rois Taharqa, Senkamanisken, Anlamani, Aspelta"
- card: taharqa
  fact: "Kush outlived the loss of Egypt by centuries"
  sources:
    - title: "Kendall and Mohamed, Sudan's Holy Mountain: Jebel Barkal and Its Temples (NCAM, 2022)"
      url: "https://history.org.uk/files/download/28107/1704705744/Sudan_Holy_Mountain_Jebel_Barkal_and_its_Temples.pdf"
      quote: "their heirs continued to preside over a southern kingdom that would last for another millennium"
    - title: "UNESCO WHC: Gebel Barkal and the Sites of the Napatan Region"
      url: "https://whc.unesco.org/en/list/1073"
      quote: "testimony to the Napatan (900 to 270 BC) and Meroitic (270 BC to 350 AD) cultures, of the second kingdom of Kush"
- card: taharqa
  fact: "Jebel Barkal and Nuri are a UNESCO World Heritage Site since 2003"
  sources:
    - title: "UNESCO WHC: Gebel Barkal and the Sites of the Napatan Region"
      url: "https://whc.unesco.org/en/list/1073"
      quote: "The sites (Gebel Barkal, Kurru, Nuri, Sanam and Zuma) ... Date of Inscription: 2003"
    - title: "Lipscomb University Lanier Center for Archaeology: Nuri Necropolis"
      url: "https://archaeology.lipscomb.edu/excavations/nuri-archaeological-expedition/nuri-necropolis"
      quote: "UNESCO World Heritage: Since 2003, Nuri (together with Jebel Barkal and other Napatan sites) has been recognized as part of a World Heritage landscape."
- card: amanirenas
  fact: "Kush had its capital at Meroë in the 20s BC"
  sources:
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "buried beneath the steps of a native temple dedicated to Victory at the Kushite capital Meroë"
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "the people of Meroë—the capital of Kush"
- card: amanirenas
  fact: "Kushite ruling queens bore the title kandake, rendered Candace by Greek and Roman writers"
  sources:
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "her role as Kandake , or female ruler, was not unusual in the region"
    - title: "Strabo, Geography 17.1.54 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/17A3*.html"
      quote: "the generals of Queen Candacê, who was ruler of the Aethiopians in my time"
- card: amanirenas
  fact: "Augustus defeated Antony and Cleopatra and took Egypt as a Roman province"
  sources:
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "In 31 BC Augustus defeated Mark Antony and Cleopatra at the battle of Actium and took possession of Egypt, which became a Roman province."
    - title: "Joshua J. Mark, The Meroe Head, World History Encyclopedia (2012)"
      url: "https://www.worldhistory.org/article/186/the-meroe-head/"
      quote: "Octavian Caesar (the future Augustus) defeated Mark Antony and Cleopatra VII of Egypt at the Battle of Actium and claimed Egypt as a Roman province"
- card: amanirenas
  fact: "In 25 BC, while part of the Roman force was away in Arabia, the Kushites took Syene, Elephantine and Philae, enslaved the inhabitants and pulled down statues of Augustus (also wow)"
  sources:
    - title: "Strabo, Geography 17.1.54 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/17A3*.html"
      quote: "emboldened by the fact that a part of the Roman force in Aegypt had been drawn away with Ælius Gallus ... took Syenê and Elephantinê and Philae, and enslaved the inhabitants, and also pulled down the statues of Caesar"
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "Amanirenas strategically rallied her army during a temporary withdrawal of the Roman troops for a campaign in Arabia. Her forces managed to capture the Roman-occupied cities of Aswan, Philae and Elephantine. The Kush forces plundered the cities and enslaved th"
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "an invading Kushite army looted many of them when they raided Roman forts and settlements in Upper Egypt in 25 BC"
- card: amanirenas
  fact: "Strabo, a contemporary, described the queen as 'a masculine sort of woman, and blind in one eye'"
  sources:
    - title: "Strabo, Geography 17.1.54 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/17A3*.html"
      quote: "Queen Candacê, who was ruler of the Aethiopians in my time — a masculine sort of woman, and blind in one eye"
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "Strabo famously describes Amanirenas as a “masculine woman with one eye destroyed.”"
- card: amanirenas
  fact: "The prefect Petronius struck back and razed Napata"
  sources:
    - title: "Strabo, Geography 17.1.54 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/17A3*.html"
      quote: "Petronius attacked and captured Napata too, from which her son had fled, and rased it to the ground"
    - title: "Cassius Dio, Roman History 54.5 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/54*.html"
      quote: "took Napata, their capital, among other cities. This place was razed to the ground"
- card: amanirenas
  fact: "Her forces attacked again; envoys reached Augustus at Samos, obtained what they asked, and the tribute was cancelled"
  sources:
    - title: "Strabo, Geography 17.1.54 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/17A3*.html"
      quote: "Meantime Candacê marched against the garrison with many thousands of men ... they went to Samos ... And when the ambassadors had obtained everything they pled for, he even remitted the tributes"
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "Amanirenas sent emissaries to Samos to negotiate with Augustus, where he granted Amanirenas two important concessions. The first was the cancellation of the tax"
    - title: "Cassius Dio, Roman History 54.5 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/54*.html"
      quote: "Thereupon the Ethiopians attacked the garrisons ... and compelled Candace to make terms with him"
- card: amanirenas
  fact: "Most of the looted statues were returned"
  sources:
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "Most were later returned as a result of negotiations between the Meroitic Queen Candace and the Roman general Petronius."
    - title: "Joshua J. Mark, The Meroe Head, World History Encyclopedia (2012)"
      url: "https://www.worldhistory.org/article/186/the-meroe-head/"
      quote: "Roman forces reclaimed many of the statues intact and others were returned following the peace treaty"
- card: amanirenas
  fact: "One bronze head of Augustus was buried beneath the steps of a temple to Victory at Meroë, apparently so captors would tread on it (also wow)"
  sources:
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "this head remained buried beneath the steps of a native temple dedicated to Victory at the Kushite capital Meroë. It seems likely that it was torn from a statue and placed there deliberately so as to be permanently below the feet of its Meroitic captors."
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "a bronze head of Augustus Caesar found buried beneath the steps of a temple dedicated to Victory at the Kushite capital Meroë ... deliberately placed at the feet of its captors"
- card: amanirenas
  fact: "John Garstang's excavation found the head early in the 20th century; it is in the British Museum"
  sources:
    - title: "British Museum: The Meroë Head 1911,0901.1, curator's comments"
      url: "https://www.britishmuseum.org/collection/object/G_1911-0901-1"
      quote: "Excavated by: Prof John Garstang ... Museum number 1911,0901.1"
    - title: "Joshua J. Mark, The Meroe Head, World History Encyclopedia (2012)"
      url: "https://www.worldhistory.org/article/186/the-meroe-head/"
      quote: "was not discovered until excavations in Meroe by Professor John Garstang uncovered it in 1910 ... Today the Meroe Head is a part of the collection of the British Museum."
- card: amanirenas
  fact: "Dispute: Roman sources name only 'Candace'; identification with Amanirenas is modern, and Strabo's account is questioned"
  sources:
    - title: "Kai Mora, The Nubian Queen Who Fought Back Caesar's Army, HISTORY (2022)"
      url: "https://www.history.com/articles/nubian-queen-amanirenas-roman-army"
      quote: "The main written account of the war is a text completed around 21 B.C. called Geographical Sketches by the Greek historian Strabo ... some historians question that account"
    - title: "Cassius Dio, Roman History 54.5 (Loeb, LacusCurtius)"
      url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/54*.html"
      quote: "with Candace as their leader"
- card: faras-cathedral
  fact: "Faras (Pachoras) was a leading town of Nobadia, whose rulers became Christian in the 6th century"
  sources:
    - title: "National Museum in Warsaw: Faras Gallery"
      url: "https://www.mnw.art.pl/en/collections/permanent-galleries/faras-gallery/"
      quote: "the cathedral in the city of Faras, a large urban centre in the Medieval kingdom of Nobadia ... Nobadian rulers ... converted to Christianity around 548 AD"
    - title: "Popular Archaeology: Artifacts of Christian Nubia Revealed"
      url: "https://popular-archaeology.com/article/artifacts-of-christian-nubia-revealed/"
      quote: "Faras (formerly Pachoras), a city that was an important administrative and cultural center of the medieval African kingdom of Nobadia ... Christian period (ca. mid-6th-14th centuries)"
- card: faras-cathedral
  fact: "A cathedral was built at Faras early in the 8th century"
  sources:
    - title: "National Museum in Warsaw: Faras Gallery"
      url: "https://www.mnw.art.pl/en/collections/permanent-galleries/faras-gallery/"
      quote: "Polish archaeologists taking part in the Nubia Campaign discovered the subsequent 8th century cathedral"
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
      url: "https://www.czasopisma.pan.pl//Content/126642/PDF/6_ACADEMIA_EN_4_44_2014_Jakobielski_The_Wizard.pdf"
      quote: "Bishop Paulos had built the cathedrol ... in the year 707"
- card: faras-cathedral
  fact: "Its walls were painted from the 8th to the 14th century with saints, archangels and Nubian bishops (also wow)"
  sources:
    - title: "National Museum in Warsaw: Faras Gallery"
      url: "https://www.mnw.art.pl/en/collections/permanent-galleries/faras-gallery/"
      quote: "religious-themed paintings created in the 8th to 14th centuries"
    - title: "Popular Archaeology: Artifacts of Christian Nubia Revealed"
      url: "https://popular-archaeology.com/article/artifacts-of-christian-nubia-revealed/"
      quote: "Its walls were decorated with magnificent mural paintings on religious themes, dating from the 8th-14th centuries ... The depictions of saints, archangels and Nubian bishops"
- card: faras-cathedral
  fact: "The Aswan High Dam threatened to flood the area and UNESCO appealed for the rescue of Nubia's monuments (also wow)"
  sources:
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
      url: "https://www.czasopisma.pan.pl//Content/126642/PDF/6_ACADEMIA_EN_4_44_2014_Jakobielski_The_Wizard.pdf"
      quote: "In 1958, UNESCO made an appeal to rescue the monuments of Nubia"
    - title: "National Museum in Warsaw: Faras Gallery"
      url: "https://www.mnw.art.pl/en/collections/permanent-galleries/faras-gallery/"
      quote: "The Nubia Campaign was an extensive international mission to preserve ancient legacies threatened by flooding from the imminent construction of the Aswan High Dam"
- card: faras-cathedral
  fact: "A Polish mission led by Kazimierz Michałowski dug at Faras 1961-1964 and uncovered the cathedral"
  sources:
    - title: "gov.pl (Embassy of Poland in South Africa): Treasures of Africa in the heart of Poland"
      url: "https://www.gov.pl/web/southafrica/treasures-of-africa-in-the-heart-of-poland"
      quote: "Under the auspices of UNESCO, in the years 1961-1964, Poles conducted excavations ... It was headed by prof. Kazimierz Michałowski"
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
      url: "https://www.czasopisma.pan.pl//Content/126642/PDF/6_ACADEMIA_EN_4_44_2014_Jakobielski_The_Wizard.pdf"
      quote: "You worked with Prof. Kazimierz Michalowski on the Faras excavations in 1961-64 ... When digging, he came across the wall of the cathedral."
- card: faras-cathedral
  fact: "More than a hundred paintings were taken off the walls"
  sources:
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
      url: "https://www.czasopisma.pan.pl//Content/126642/PDF/6_ACADEMIA_EN_4_44_2014_Jakobielski_The_Wizard.pdf"
      quote: "The removal of around 120 paintings."
    - title: "Popular Archaeology: Artifacts of Christian Nubia Revealed"
      url: "https://popular-archaeology.com/article/artifacts-of-christian-nubia-revealed/"
      quote: "Over 120 paintings were preserved, 67 of which are today in the collection of the National Museum in Warsaw."
- card: faras-cathedral
  fact: "Among them is Bishop Petros with Saint Peter, painted 974-997"
  sources:
    - title: "Popular Archaeology: Artifacts of Christian Nubia Revealed"
      url: "https://popular-archaeology.com/article/artifacts-of-christian-nubia-revealed/"
      quote: "BISHOP PETROS WITH SAINT PETER  Sudan, Faras, AD 974–997"
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
      url: "https://www.czasopisma.pan.pl//Content/126642/PDF/6_ACADEMIA_EN_4_44_2014_Jakobielski_The_Wizard.pdf"
      quote: "Bishop Petros with St. Peter. Sudan, Faras, 974-997. Tempera on mud plaster"
- card: faras-cathedral
  fact: "Sudan and Poland divided the finds"
  sources:
    - title: "gov.pl (Embassy of Poland in South Africa): Treasures of Africa in the heart of Poland"
      url: "https://www.gov.pl/web/southafrica/treasures-of-africa-in-the-heart-of-poland"
      quote: "the governments of both countries offered to the countries that offered to conduct excavations half of the future finds"
    - title: "Stefan Jakobielski, The Wizard of Faras, Academia PAS 4/44 (2014)"
