    - title: "Tim Brookes, Sona, Atlas of Endangered Alphabets"
      url: "https://www.endangeredalphabets.net/alphabets/sona/"
      quote: "The drawn line may represent a river, a fence, a wall, a journey ... sometimes the dots themselves are enlarged or altered, becoming characters in the story"
    - title: "Ivars Peterson, Sand Drawings and Mirror Curves, Science News (2001)"
      url: "https://www.sciencenews.org/article/sand-drawings-and-mirror-curves"
      quote: "a rabbit, positioned at point B, discovers a salt mine (point A). Immediately, a lion (point C) ... The rabbit ... makes a fence to isolate the mine"
- card: lusona
  fact: "Paulus Gerdes showed symmetry and monolinearity were cultural values and families of sona follow construction rules"
  sources:
    - title: "Demaine, Demaine, Taslakian and Toussaint, Sand drawings and Gaussian graphs, J. Mathematics and the Arts (2007)"
      url: "https://erikdemaine.org/papers/Sona_JMA/paper.pdf"
      quote: "Paulus Gerdes ... divides these drawings into classes based on the dimensions of the grid of dots and their method of construction, and studies monolinearity and symmetry as cultural values"
    - title: "Darrah Chavey, Strip Symmetry Groups of African Sona Designs, Bridges 2010"
      url: "https://static1.bridgesmathart.org/2010/cdrom/proceedings/69/paper_69.pdf"
      quote: "The conclusion of Gerdes [8], where chapter 3 is titled “Symmetry and Monolinearity as Cultural Values,” is that symmetry and monolinearity are both strongly desired features"
- card: lusona
  fact: "In plaited-mat designs the number of loops equals the gcd of rows and columns, Euclid's algorithm (also wow)"
  sources:
    - title: "Ivars Peterson, Sand Drawings and Mirror Curves, Science News (2001)"
      url: "https://www.sciencenews.org/article/sand-drawings-and-mirror-curves"
      quote: "For a plaited mat design on an m by n rectangular array, you would need as many curves as the greatest common divisor of m and n"
    - title: "Demaine, Demaine, Taslakian and Toussaint, Sand drawings and Gaussian graphs, J. Mathematics and the Arts (2007)"
      url: "https://erikdemaine.org/papers/Sona_JMA/paper.pdf"
      quote: "One such algorithm uses Euclid’s algorithm for computing the greatest common divisor of two natural numbers."
- card: lusona
  fact: "UNESCO inscribed sona in 2023"
  sources:
