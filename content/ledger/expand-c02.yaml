  fact: "Bakongo priests of Africa's south-west coast drew the cosmos as a cross: one line the boundary between living and dead, the other the path of power from below to above (also wow)"
  sources:
    - title: "Leland Ferguson, Magic Bowls, NPS African American Heritage and Ethnography"
      url: "https://www.nps.gov/ethnography/aah/aaheritage/lowCountry_furthRdg4.htm"
      quote: "depictions of the cosmos traditional among Bakongo priests from the southwest coast of Africa ... a simple cross with one line representing the boundary between the living world and that of the dead, and the other representing the path of power from below to above"
    - title: "DAACS: Colonoware"
      url: "https://new.daacs.org/?p=238"
      quote: "The cosmogram is a geometric representation of the cosmos used traditionally among Bakongo priests from the southwest coast of Africa. The basic form is a cross with one line representing the boundary between the living world and the dead, and the other representing the path of power"
