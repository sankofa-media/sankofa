  fact: "The living world is imagined as a mountain over water, the land of the dead"
  sources:
    - title: "Leland Ferguson, Magic Bowls, NPS African American Heritage and Ethnography"
      url: "https://www.nps.gov/ethnography/aah/aaheritage/lowCountry_furthRdg4.htm"
      quote: "Bakongo philosophers explain the land of the living as a mountain over a watery barrier separating this world from the land of the dead beneath."
    - title: "Kara Ann Morrow, Bakongo Afterlife and Cosmological Direction, Athanor XX"
      url: "https://journals.flvc.org/athanor/article/download/126599/126087/207232"
      quote: "The N’Kongo ... thought of the earth as a mountain over a body of water which is the land of the dead, called Mpemba."
- card: dikenga
  fact: "The sun rises over the living, sets into the water, lights the land of the dead at night and rises again: birth, death and rebirth"
  sources:
    - title: "Leland Ferguson, Magic Bowls, NPS African American Heritage and Ethnography"
      url: "https://www.nps.gov/ethnography/aah/aaheritage/lowCountry_furthRdg4.htm"
      quote: "Each day the sun rises over the earth and proceeds ... across the sky to set in the water. Then, during earthly nighttime, the sun illuminates the underside of the universe, the land of the dead, until it rises again ... representing the continuity of life: birth, death, and rebirth"
    - title: "Kara Ann Morrow, Bakongo Afterlife and Cosmological Direction, Athanor XX"
      url: "https://journals.flvc.org/athanor/article/download/126599/126087/207232"
      quote: "In Mpemba the sun rises and sets just as it does in the land of the living"
