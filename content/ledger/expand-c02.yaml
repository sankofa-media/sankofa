  fact: "Sona are not an alphabet for sounds but signs made for telling"
  sources:
    - title: "Tim Brookes, Sona, Atlas of Endangered Alphabets"
      url: "https://www.endangeredalphabets.net/alphabets/sona/"
      quote: "If we define writing as an organized series of visual symbols that represent the basic sounds of a language, the sona sand designs ... push that definition so far it finds itself utterly out of its depth"
    - title: "UNESCO ICH: Sona, drawings and geometric figures on sand"
      url: "https://ich.unesco.org/en/RL/sona-drawings-and-geometric-figures-on-sand-01994"
      quote: "The figures and drawings are viewed as a means of transmitting stories, knowledge and collective memory"
- card: lusona
  fact: "The drawer smooths the sand, presses a grid of equidistant dots with fingertips, then draws a line around the dots (also wow)"
  sources:
    - title: "Ivars Peterson, Sand Drawings and Mirror Curves, Science News (2001)"
      url: "https://www.sciencenews.org/article/sand-drawings-and-mirror-curves"
      quote: "The storyteller would clean and smooth the ground, then use his fingertips to press into the sand a rectangular grid of equidistant dots. As he talked, he would trace a winding line among the dots."
    - title: "UNESCO ICH: Sona, drawings and geometric figures on sand"
      url: "https://ich.unesco.org/en/RL/sona-drawings-and-geometric-figures-on-sand-01994"
      quote: "Practitioners mark reference points on a wet floor covered in sand using their index finger and pinkie, then trace lines around these points."
    - title: "Tim Brookes, Sona, Atlas of Endangered Alphabets"
      url: "https://www.endangeredalphabets.net/alphabets/sona/"
      quote: "begins by cleaning and smoothing the sand or dust, and then uses his fingertips to create a matrix pattern of equidistant dots"
- card: lusona
  fact: "Often the line is a single unbroken closed line (also wow)"
  sources:
    - title: "Ivars Peterson, Sand Drawings and Mirror Curves, Science News (2001)"
      url: "https://www.sciencenews.org/article/sand-drawings-and-mirror-curves"
      quote: "More often than not, he would draw the line in one continuous motion to create a closed loop."
    - title: "Darrah Chavey, Strip Symmetry Groups of African Sona Designs, Bridges 2010"
      url: "https://static1.bridgesmathart.org/2010/cdrom/proceedings/69/paper_69.pdf"
      quote: "a grid of dots with a curve passing through the grid ... to form a single continuous curve"
