      url: "https://www.sciencenews.org/article/sand-drawings-and-mirror-curves"
      quote: "To accompany the telling of a story or recounting of a fable, men of the Chokwe people ... traditionally made sand drawings, called sona , to illustrate the tale. These highly stylized geometric illustrations also served as memory aids."
    - title: "UNESCO ICH: Sona, drawings and geometric figures on sand"
      url: "https://ich.unesco.org/en/RL/sona-drawings-and-geometric-figures-on-sand-01994"
      quote: "a means of transmitting stories, knowledge and collective memory to new generations"
- card: lusona
  fact: "The line could stand for a fence, a river or a path; the dots for figures of the story"
