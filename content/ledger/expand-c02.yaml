  sources:
    - title: "Leland Ferguson, Magic Bowls, NPS African American Heritage and Ethnography"
      url: "https://www.nps.gov/ethnography/aah/aaheritage/lowCountry_furthRdg4.htm"
      quote: "called my attention to the similarity of the marks to Bakongo cosmograms ... suggests an interpretation of the bowls as receptacles in a ritual similar to those involving minkisi"
    - title: "DAACS: Colonoware"
      url: "https://new.daacs.org/?p=238"
      quote: "Researchers have postulated these infrequently occurring marks ... have some religious or curing significance (Ferguson 1992, 1999; Ogata 1995) ... Some archaeologists believe these marked bowls to be examples from such ceremonies."
