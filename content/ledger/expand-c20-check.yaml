    - {title: "OUPblog, Joanna Dee Das (2017)", url: "https://blog.oup.com/2017/06/katherine-dunham-artist-activist/", quote: "she re-staged Southland in 1953 in Paris, then let it drop from her repertoire"}
  note: ""
- card: southland-dunham
  fact: "When the State Department began sending dance companies abroad, starting with Limón's in 1954, it did not support Dunham's; some historians link this to Southland"
