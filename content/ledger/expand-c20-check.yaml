# ---------------- ol-man-river-robeson ----------------
- card: ol-man-river-robeson
  fact: "\"Ol' Man River\" is sung by Joe in Show Boat, the 1927 Broadway musical by Kern and Hammerstein"
  verdict: corrected
  sources:
    - {title: "American Heritage, John Steele Gordon (2007)", url: "https://www.americanheritage.com/content/miracle-was-show-boat", quote: "On December 27, 1927—80 years ago today—American musical theater changed forever with the opening, at New York’s Ziegfeld Theatre, of Show Boat."}
    - {title: "NPR 100: Show Boat (2000)", url: "https://www.npr.org/2000/04/17/1073053/npr-100-i-showboat-i", quote: "Then in 1927, a show by Jerome Kern and Oscar Hammerstein opened. It was called \"Show Boat,\" ... Paul Robeson , who played Joe, the African-American dock worker in the original London production, sang what would become his signature song \"Ol' Man River.\""}
  note: "No ledger source gave the 1927 Broadway date; American Heritage and NPR added to card sources."
- card: ol-man-river-robeson
  fact: "An early script pencils in Robeson for Joe, but he was not available for the Broadway premiere"
  verdict: corrected
  sources:
    - {title: "Scott McMillin, Theatre Survey 41:2 (extract)", url: "https://www.cambridge.org/core/journals/theatre-survey/article/abs/paul-robeson-will-voderys-jubilee-singers-and-the-earliest-script-of-the-kernhammerstein-show-boat/01B43190F593D05F28A88E5C9A8371CC", quote: "Paul Robeson, Elizabeth Hines, and Guy Robertson are penciled in for the roles of Joe, Magnolia, and Gaylord"}
