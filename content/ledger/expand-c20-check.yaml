  sources:
    - {title: "Review of Holger Weiss, International Review of Social History (Cambridge Core)", url: "https://resolve.cambridge.org/core/product/623EDD943B4FD01B77C6A8EDBCEC0D13/core-reader", quote: "The ITUC-NW, founded in 1928, was the “Comintern's answer to the ‘Negro Question’”"}
    - {title: "Marxists Internet Archive, Susan Campbell", url: "https://www.marxists.org/history/international/comintern/negro-worker/index.htm", quote: "Its sponsoring organization was the International Trade Union Committee of Negro Workers (ITUCNW), also begun in 1928."}
  note: ""
- card: negro-worker
  fact: "It was meant to reach Black workers in Africa and the Americas"
  verdict: confirmed
  sources:
    - {title: "Black Central Europe, Logan Carter", url: "https://blackcentraleurope.com/george-padmore-publishes-the-negro-worker-in-hamburg-1929-1933/", quote: "specifically in Africa and the Americas"}
