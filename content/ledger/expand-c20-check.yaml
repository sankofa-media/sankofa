    - {title: "Constance Valis Hill (extract and notes)", url: "https://www.cambridge.org/core/journals/dance-research-journal/article/katherine-dunhams-southland-protest-in-the-face-of-repression/3BC1A9A6CC783CB93399D49F6F0FAC7E", quote: "Southland was produced by special arrangement with the Symphony of Chile"}
  note: ""
- card: southland-dunham
