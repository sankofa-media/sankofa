    - {title: "5280, 6 September 2012", url: "https://5280.com/cleo-parker-robinson-dance-ensemble-revives-southland", quote: "the Cleo Parker Robinson Dance Ensemble is recreating the production for its U.S. world premiere ... Friday, September 14 and Saturday, September 15 ... at the Newman Center for the Performing Arts on the University of Denver campus"}
