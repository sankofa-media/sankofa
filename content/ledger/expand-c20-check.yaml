# ---------------- southland-dunham ----------------
- card: southland-dunham
  fact: "Katherine Dunham created Southland, a ballet about lynching, in 1951"
  verdict: confirmed
  sources:
    - {title: "Constance Valis Hill, Dance Research Journal 26:2 (extract, Cambridge Core)", url: "https://www.cambridge.org/core/journals/dance-research-journal/article/katherine-dunhams-southland-protest-in-the-face-of-repression/3BC1A9A6CC783CB93399D49F6F0FAC7E", quote: "In 1951 ... Katherine Dunham created Southland , a dramatic ballet Americana about what was by then the century-long practice of lynching."}
    - {title: "Wendy Perron (Dance Magazine, 2000)", url: "https://wendyperron.com/?p=11645", quote: "In Dunham’s Southland (1951), an impassioned response to the lynchings of blacks"}
  note: ""
- card: southland-dunham
