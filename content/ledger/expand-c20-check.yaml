    - {title: "Review of Holger Weiss", url: "https://resolve.cambridge.org/core/product/623EDD943B4FD01B77C6A8EDBCEC0D13/core-reader", quote: "George Padmore (Trinidad, 1902–1959; Footnote 1 his real name was Malcolm Nurse)"}
  note: ""
