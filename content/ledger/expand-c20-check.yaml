    - {title: "Valeria Marino, CoSMo 27 (bibliography)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "« Nègreries. Conscience raciale et révolution sociale ». L’Étudiant Noir, 3 (mai-juin) : 1-2."}
  note: "SEP independently: 'That is when Aimé Césaire coined for that conscience of a global blackness the concept of “negritude”.'"
