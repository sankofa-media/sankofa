# ---------------- etudiant-noir ----------------
- card: etudiant-noir
  fact: "A student paper published in Paris in 1935 by students from France's colonies"
  verdict: confirmed
  sources:
    - {title: "Princeton University Library, Paul-Louis Biondi", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Published in 1935 in Paris, the student journal was dedicated to writing about the black colonial diaspora of the French empire."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne", url: "https://plato.stanford.edu/entries/negritude/", quote: "the creation, in 1934–1935, of the journal L’Etudiant noir (The Black Student)"}
  note: ""
- card: etudiant-noir
  fact: "It grew out of L'Étudiant martiniquais, the bulletin of the Association of Martinican Students"
  verdict: confirmed
  sources:
    - {title: "Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Originally, the publication assumed the title L’Étudiant martiniquais , it served as the bulletin for the Association of Martinican Students in France"}
    - {title: "Stanford Encyclopedia of Philosophy", url: "https://plato.stanford.edu/entries/negritude/", quote: "to take the place of another periodical, L’Etudiant martiniquais (The Martiniquan Student)"}
  note: ""
- card: etudiant-noir
  fact: "With the new name the paper spoke for Caribbean and African students together, with Césaire at its heart"
  verdict: corrected
  sources:
    - {title: "Valeria Marino, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Le groupe à l’origine de L’Étudiant Noir rassemblait à la fois des étudiants antillais et africains ... une série d’articles qu’Aimé Césaire publie par la suite dans L’Étudiant Noir"}
    - {title: "Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "it changed under the editorship of Aimé Césaire, who also assumed the presidency of the association in 1934, and its focus shifted towards a collective exploration and vision of black Francophonie"}
  note: "Césaire's presidency from 1934 rests on Princeton alone (citing Miller); dropped from the card. SEP also: 'a move from the consideration of a regional origin to the affirmation of the call ... for a “black internationalism”'."
- card: etudiant-noir
  fact: "Césaire and Damas had been classmates at the Lycée Schoelcher in Martinique"
  verdict: confirmed
  sources:
    - {title: "Princeton University Library", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Césaire and Damas were childhood friends, having met at their Martinique high school, the Lycée Schoelcher."}
    - {title: "Stanford Encyclopedia of Philosophy", url: "https://plato.stanford.edu/entries/negritude/", quote: "They were classmates in Fort-de-France, Martinique, where they both graduated from Victor Schoelcher High School."}
  note: ""
- card: etudiant-noir
  fact: "In Paris, at the Lycée Louis-le-Grand, Césaire befriended Senghor"
  verdict: corrected
  sources:
