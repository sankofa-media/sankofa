    - {title: "Encyclopaedia Britannica: Léopold Senghor (archive.org snapshot)", url: "https://www.britannica.com/biography/Leopold-Senghor", quote: "In 1928 Senghor went to Paris on a partial scholarship and continued his formal studies at the Lycée Louis-le-Grand"}
  note: "Princeton cites Diagne for this meeting, so it is not independent of the SEP entry. The year 1931 is dropped; Britannica on Césaire adds 'Together with Senghor ... Césaire was educated in Paris'."
