    - {title: "5280, Daliah Singer (2012)", url: "https://5280.com/cleo-parker-robinson-dance-ensemble-revives-southland", quote: "a young woman whose false accusation of rape against a black man results in his murder"}
  note: "'Beaten by her lover', 'field hand' and 'an act of kindness' appear only in the CBS Colorado report; removed."
- card: southland-dunham
  fact: "Julie Belafonte, who danced the accuser, later recalled how hard the role was"
  verdict: confirmed
  sources:
    - {title: "CBS Colorado (2012)", url: "https://www.cbsnews.com/colorado/news/katherine-dunhams-southland-finally-has-its-u-s-premiere", quote: "\"It was very difficult for me at the time to actually do this,\" Belafonte said."}
    - {title: "Wendy Perron (2000)", url: "https://wendyperron.com/?p=11645", quote: "“It was very, very difficult for me,” Belafonte recalls."}
  note: "Two separate interviews twelve years apart."
