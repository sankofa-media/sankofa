# Second, independent check (2026-11-14) of content/ledger/expand-c20.yaml.
# Every cited URL was reopened (curl; archive.org snapshots for Britannica and Verso,
# which block scripts); quotes are copied from the fetched page text.
# verdict: confirmed | corrected (card wording or sources changed) |
#          refuted | unconfirmed (removed from the card).
# Independence notes: BlackPast's cigar-strike entry repeats the LDHI exhibit text
# (counted as one source); The Heritage Portal article repeats the SAHO biography in
# places (counted as one where the wording matches); Princeton's L'Étudiant noir page
# cites Diagne for the Césaire-Senghor meeting, so it is not independent of the SEP
# entry on that point; JazzStandards quotes Handy's autobiography (one source for
# Handy's own recollections).

# ---------------- st-louis-blues ----------------
- card: st-louis-blues
  fact: "W. C. Handy published \"St. Louis Blues\" in 1914"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "in 1914 Handy penned his masterpiece, \"St. Louis Blues.\""}
    - {title: "NPR, Margaret Howze: The NPR 100: 'St. Louis Blues' (2000)", url: "https://www.npr.org/2000/01/16/1069234/st-louis-blues", quote: "In 1914, W.C. Handy, a middle-class African American, wrote \"St. Louis Blues.\""}
  note: ""
- card: st-louis-blues
  fact: "Handy, a bandleader, was born in Florence, Alabama"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "William Christopher Handy was born in Florence, Lauderdale County, on November 16, 1873"}
    - {title: "University of Pittsburgh, Voices Across Time", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "William Christopher Handy (1873–1958), known as the \"father of the blues,\" was born in Florence, Alabama."}
  note: ""
- card: st-louis-blues
  fact: "Handy had made his home in Memphis"
  verdict: corrected
  sources:
    - {title: "University of Pittsburgh, Voices Across Time", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "In 1903 he made his home in Memphis, Tennessee, where he continued his work as a band leader"}
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "they teamed up in 1913 to found the Pace & Handy Music Company in Memphis"}
  note: "Supported; the Beale Street detail is not in the card. Wording now 'had made his home in Memphis'."
- card: st-louis-blues
  fact: "In the early 1890s Handy was stranded in St. Louis without money, and those hard times went into the song, which opens with \"I hate to see de evenin' sun go down\""
  verdict: corrected
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "Handy took to the road with a vocal quartet, which ran low on funds and became stranded in St. Louis in 1892. There, he first heard snatches of folk material that would later go into his most famous composition"}
    - {title: "Tennessee Encyclopedia, Teresa Biddle-Douglass: William Christopher \"W. C.\" Handy", url: "https://tennesseeencyclopedia.net/entries/william-christopher-handy/", quote: "In the early 1890s Handy's first real attempt to make music his profession landed him in St. Louis, broke and alone. A low point in his life, the hard times he experienced in that city later inspired his most famous work"}
    - {title: "University of Pittsburgh, Voices Across Time", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "the A phrase consists of the line \"I hate to see de ev'nin' sun go down,\""}
  note: "The exact year 1892 and the vocal quartet rest on EOA alone; the 'sleeping on the cobbles' remark rests only on Handy's memoir as quoted by JazzStandards. Both removed; card now says 'early 1890s'."
- card: st-louis-blues
  fact: "Handy gave the blues a section in the rhythm of the tango"
  verdict: corrected
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "The rhythm for this section is a habanera, or tango, with a sultry air."}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "I tricked the dancers by arranging a tango introduction, breaking abruptly into a low-down blues."}
  note: "The motive (tricking the dancers, tango 'in vogue') is Handy's own recollection, available only through his memoir as quoted by JazzStandards; a search found no independent authority. Motive removed from body and wow."
- card: st-louis-blues
  fact: "Unable to find a publisher for his songs, Handy went into business with Harry Pace; their firm Pace & Handy published the song"
  verdict: corrected
  sources:
    - {title: "Encyclopaedia Britannica: W.C. Handy (archive.org snapshot)", url: "https://www.britannica.com/biography/W-C-Handy", quote: "Unable to find a publisher for the songs he was beginning to write, Handy formed a partnership with Harry Pace and founded Pace & Handy Music Company"}
    - {title: "JazzStandards.com", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "Failing to find a music publisher who would accept his song, Handy and sometime collaborator Harry H. Pace published “St. Louis Blues” under the recently formed Pace and Handy Music Company."}
  note: "The Pittsburgh quote in the ledger only says Handy had a publishing company with Pace; it does not support the rejection. Britannica added."
- card: st-louis-blues
  fact: "Sales were modest at first; from around 1921 it became an immense hit"
  verdict: unconfirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "although it was only a minor hit during the first few years after its release. Beginning around 1921, it grew in popularity"}
    - {title: "Tennessee Encyclopedia", url: "https://tennesseeencyclopedia.net/entries/william-christopher-handy/", quote: "An immediate hit upon its release in 1914–and again in 1925"}
  note: "Contradicted by the Tennessee Encyclopedia; the 1921 date rests on EOA alone. Sentence removed."
- card: st-louis-blues
  fact: "Bessie Smith recorded it in 1925 with Louis Armstrong on cornet; the slow version set the standard"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "The 1925 version, featuring Bessie Smith and Louis Armstrong, set the standard for slower, bluesier versions."}
    - {title: "NPR (2000)", url: "https://www.npr.org/2000/01/16/1069234/st-louis-blues", quote: "its definitive 1925 recording by Bessie Smith, with cornet accompaniment by Louis Armstrong"}
  note: ""
- card: st-louis-blues
  fact: "One of the most recorded compositions in history"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "one of the most frequently recorded compositions in history"}
    - {title: "JazzStandards.com", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "the song was the most-recorded of all time from the 1930’s until “ Star Dust ” took the title over twenty years later"}
  note: ""
- card: st-louis-blues
  fact: "Handy became known as the \"Father of the Blues\""
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "became known as the \"Father of the Blues\" for his contributions to that musical genre"}
    - {title: "University of Pittsburgh, Voices Across Time", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "W. C. Handy, known as the \"father of the blues,\""}
  note: ""
- card: st-louis-blues
  fact: "It carried the blues into dance bands and jazz"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of Alabama", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "Early recordings of \"St. Louis Blues\" tend to be brisk, in keeping with the mania for dancing during the World War I years"}
    - {title: "JazzStandards.com", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "none has enjoyed more recordings by jazz artists than W.C. Handy’s classic, “St. Louis Blues.”"}
  note: ""

# ---------------- we-shall-overcome ----------------
- card: we-shall-overcome
  fact: "\"We Shall Overcome\" became the anthem of the civil rights movement"
  verdict: confirmed
  sources:
    - {title: "American Heritage, Allan M. Winkler (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "Its simple words and music would go on to become the anthem of the civil-rights movement"}
    - {title: "David J. Garrow: expert report (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "It was “We Shall Overcome,” theme song of the Civil Rights Movement."}
  note: "Garrow substituted for BlackPast as the independent second source."
- card: we-shall-overcome
  fact: "On 22 October 1945 more than a thousand workers at the American Tobacco Company's cigar factory in Charleston walked out; Black and white strikers picketed"
  verdict: confirmed
  sources:
    - {title: "LDHI (College of Charleston): The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "Over one thousand Cigar Factory workers in Charleston walked off their jobs on October 22, demanding back pay and a pay increase of twenty-five cents per hour."}
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "In October 1945, a thousand black and white workers at the American Tobacco Company in Charlestown, South Carolina, struck for higher pay and better working conditions."}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "The biracial group of strikers began picketing outside the brick factory building"}
  note: "BlackPast repeats the LDHI wording; LDHI used instead."
- card: we-shall-overcome
  fact: "The strikers demanded higher pay; they picketed through the winter"
  verdict: confirmed
  sources:
    - {title: "LDHI: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "demanding back pay and a pay increase of twenty-five cents per hour"}
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "For five months, Lucille Simmons, a black worker with a lovely alto voice, led workers each night in song."}
  note: ""
- card: we-shall-overcome
  fact: "Lucille Simmons, a Black striker, turned an old hymn's \"I\" into \"we\": \"We will overcome\""
  verdict: confirmed
  sources:
    - {title: "LDHI: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "In her rich and powerful voice, she changed the spiritual, “I Will Overcome One Day,\" into “We Will Overcome.”"}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "singing a well-known hymn, “I’ll Be All Right,” and altering it to give voice to the striking workers’ own aspirations: “We Will Overcome.”"}
  note: "The two differ on the source hymn; the card's dispute field records this."
- card: we-shall-overcome
  fact: "The song came to close each day of picketing"
  verdict: confirmed
  sources:
    - {title: "LDHI: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "The song came to signal the end of the day for picketing strikers."}
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "led workers each night in song. “I Will Overcome,” they sang as they sought to keep up their spirits"}
  note: "BlackPast's sentence repeats LDHI; American Heritage used as the independent source."
- card: we-shall-overcome
  fact: "Strikers added verses such as \"We will win our rights\""
  verdict: confirmed
  sources:
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "they added new verses, such as “We will win our rights,” and “We will win this fight.”"}
    - {title: "LDHI: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "as they sang together, “we will win our rights someday.”"}
  note: ""
- card: we-shall-overcome
  fact: "The strike ended in April 1946"
  verdict: confirmed
  sources:
    - {title: "BlackPast, Samuel Momodu", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "Finally, on April 1, 1946, company officials agreed that workers would receive back pay, a pay raise of 8 cents per hour"}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "The strike ended without success in April 1946"}
  note: ""
- card: we-shall-overcome
  fact: "Anna Lee Bonneau and Evelyn Risher took the song to the Highlander Folk School in Monteagle, Tennessee, and taught it to Zilphia Horton"
  verdict: confirmed
  sources:
    - {title: "LDHI: Aftermath", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/aftermath", quote: "Two members of Charleston’s Local 15, Anna Lee Bonneau and Evelyn Risher, taught Highlander co-founder Zilphia Horton the song"}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "two participants, Anna Lee Bonneau and Evelyn Risher, traveled to the Highlander ... Monteagle, TN, to take part in a one-week workshop"}
  note: "LDHI dates the workshop 1947, Garrow to a month after the strike (1946); the card gives no year, so no change."
- card: we-shall-overcome
  fact: "Horton passed the song to Pete Seeger"
  verdict: confirmed
  sources:
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "One of those who learned the song from Zilphia was Pete Seeger."}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "Horton had shared “We Will Overcome” with folk singer Pete Seeger"}
  note: ""
- card: we-shall-overcome
  fact: "By 1952 New York singers had recorded it as \"We Shall Overcome\""
  verdict: confirmed
  sources:
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "in 1952, a recording used the phrase “We Shall Overcome” rather than “We Will Overcome.” It featured Laura Duncan as soloist, with The Jewish Young Singers as chorus"}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "By no later than early 1952, New York musical friends of Seeger ... had recorded Horton’s song under a new title: “We Shall Overcome,”"}
  note: ""
- card: we-shall-overcome
  fact: "In April 1960 Guy Carawan of Highlander led the students founding SNCC in Raleigh in singing it"
  verdict: confirmed
  sources:
    - {title: "American Heritage (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "In April 1960, 126 young civil rights activists joined together in song in Raleigh, N.C., as they gathered for the founding of the Student Non-Violent Coordinating Committee"}
    - {title: "Garrow report", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "On Saturday night April 16 Highlander’s Guy Carawan led the entire group in singing “We Shall Overcome,”"}
  note: ""
- card: we-shall-overcome
  fact: "On 15 March 1965 President Johnson, asking Congress for a voting rights law, said \"And we shall overcome\""
  verdict: confirmed
  sources:
    - {title: "The American Presidency Project", url: "https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-american-promise", quote: "who must overcome the crippling legacy of bigotry and injustice. And we shall overcome."}
    - {title: "Miller Center", url: "https://millercenter.org/the-presidency/presidential-speeches/march-15-1965-speech-congress-voting-rights", quote: "who must overcome the crippling legacy of bigotry and injustice. And we shall overcome."}
  note: "Two independent archives of the primary text; American Heritage also describes the speech."

# ---------------- nkosi-sikelel-iafrika ----------------
- card: nkosi-sikelel-iafrika
  fact: "Written in 1897 by Enoch Sontonga, a Methodist mission school teacher, as a hymn in Xhosa"
  verdict: corrected
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Nkosi Sikelel' iAfrika was composed in 1897 by Enoch Sontonga, a Methodist mission school teacher. The words of the first stanza were originally written in Xhosa as a hymn."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "As a choirmaster in his school, Enoch Sontonga composed the first two stanzas of democratic South Africa’s anthem in 1897."}
  note: "The Heritage Portal and ASC Leiden report that the melody may be Joseph Parry's 'Aberystwyth'; the card now says so and has a dispute field."
- card: nkosi-sikelel-iafrika
  fact: "(dispute) Some hold that Sontonga set his words to an existing hymn tune, Joseph Parry's \"Aberystwyth\""
  verdict: corrected
  sources:
    - {title: "African Studies Centre Leiden: Enoch Sontonga", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "Some sources say he wrote the tune the same year, but others contend that the tune was written by Joseph Parry as 'Aberystwyth' and that Sontonga merely wrote new wo[rds]"}
    - {title: "The Heritage Portal, Daluxolo Moloantoa (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "He based the melody on the hymn tune 'Aberystwyth', by Joseph Parry."}
  note: "Added as a dispute, not as fact."
- card: nkosi-sikelel-iafrika
  fact: "Sontonga was choirmaster at a Methodist mission school near Johannesburg and wrote it for his school choir"
  verdict: corrected
  sources:
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "he was sent to a Methodist mission school in Nancefield, near Johannesburg in 1896. He taught here for nearly eight years. Sontonga was the choirmaster at his school ... Although initially intended for his school choir"}
    - {title: "African Studies Centre Leiden", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "worked as a teacher and choirmaster at the Methodist Mission school in Nancefield, near Johannesburg for eight years. The first verse and chorus of 'Nkosi Sikelel' iAfrika' was composed in 1897 and it was originally intended to be a school anthem."}
  note: "The Heritage Portal copies the SAHO sentences verbatim here (one source). ASC Leiden added to card sources."
- card: nkosi-sikelel-iafrika
  fact: "The title means \"God bless Africa\""
  verdict: confirmed
  sources:
    - {title: "South African Government", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Nkosi Sikelel' iAfrika (God Bless Africa)"}
    - {title: "African Studies Centre Leiden", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "the Xhosa song 'Nkosi Sikelel' iAfrika' (English: 'God Bless Africa')"}
  note: ""
- card: nkosi-sikelel-iafrika
  fact: "Sontonga died in 1905"
  verdict: confirmed
  sources:
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "He passed away on the 18th of April in 1905, at the age of 32."}
    - {title: "African Studies Centre Leiden", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "On 18 April 1905, South African composer Enoch Mankayi Sontonga died in Johannesburg at the age of 32."}
  note: ""
- card: nkosi-sikelel-iafrika
  fact: "Samuel Mqhayi added seven more stanzas in Xhosa"
  verdict: confirmed
  sources:
    - {title: "South African Government", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Seven additional stanzas in Xhoza were later added by the poet, Samuel Mqhayi."}
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "A well-known Xhosa poet, Samuel Mqhayi, wrote seven additional stanzas for the song."}
  note: ""
- card: nkosi-sikelel-iafrika
  fact: "The choir of John Dube's Ohlange Institute in Natal made it popular"
  verdict: confirmed
  sources:
    - {title: "South African Government", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Nkosi Sikelel' iAfrika was popularised at concerts held in Johannesburg by Reverend JL Dube's Ohlange Zulu Choir."}
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In 1901, John Langalibalele Dube founded the Ohlange Institute. The choir at this institute popularised the anthem."}
  note: "Natal location from The Heritage Portal ('Ohlange High School in Kwa-Zulu Natal')."
- card: nkosi-sikelel-iafrika
  fact: "In 1912 it closed the founding meeting of the South African Native National Congress"
  verdict: confirmed
  sources:
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "The Ohlange Institute’s choir offered a rendition of the song after a closing prayer at the South African Native National Congress’ (later African National Congress) meeting in January 1912."}
    - {title: "African Studies Centre Leiden", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "They played it at the South African Native National Congress meeting in 1912. It was sung after the closing prayer"}
  note: "Heritage Portal also agrees; ASC Leiden used as the clearly separate second source."
- card: nkosi-sikelel-iafrika
  fact: "It was recorded in London in 1923"
  verdict: confirmed
  sources:
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "“Nkosi sikelel’ iAfrika” was first recorded on 16 October 1923, in London"}
    - {title: "Nkwazi Magazine, Mutale Chisulo (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "Solomon Plaatje, a writer and founding member of the ANC, was the first to have the song recorded in London in 1923."}
  note: "ASC Leiden also: 'It was recorded in London ... in 1923'."
- card: nkosi-sikelel-iafrika
  fact: "By 1925 it was the ANC's official closing anthem"
  verdict: confirmed
  sources:
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "By 1925 \"Nkosi Sikelel ‘iAfrika\" had become the official song of the African National Congress (ANC)"}
    - {title: "African Studies Centre Leiden", url: "https://www.ascleiden.nl/content/library-weekly/enoch-sontonga", quote: "the ANC adopted it as its official closing anthem in 1925"}
  note: ""
- card: nkosi-sikelel-iafrika
  fact: "In the 1960s newly independent Zambia set its own words to the melody; Tanzania's anthem uses the same tune"
  verdict: corrected
  sources:
    - {title: "Nkwazi Magazine (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "When Zambia adopted this liberation song as its national anthem in 1964, officials decided to commission new lyrics for the familiar melody."}
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In the 1960s, Zambia adopted the song as its national anthem. ... Tanzania (then Tanganyika) translated it into Swahili, “Mungu ibariki Afrika”, also adopting it as its national anthem."}
  note: "SAHO gives both '1960s' and '1960' for Zambia; the exact 1964 date rests on Nkwazi alone, so the card now says 'in the 1960s'."
- card: nkosi-sikelel-iafrika
  fact: "In 1994 South Africa had two national anthems, Nkosi Sikelel' iAfrika and Die Stem, the old anthem"
  verdict: corrected
  sources:
    - {title: "South African Government", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "stated that the Republic of South Africa would have two national anthems. They were Nkosi Sikelel' iAfrika and The Call of South Africa ( Die Stem van Suid-Afrika )."}
    - {title: "South African History Online", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In 1994 \"Nkosi Sikelel ‘iAfrika\" and “Die Stem van Suid Afrika”, the old South African anthem, became our official national song."}
  note: ""
- card: nkosi-sikelel-iafrika
  fact: "Die Stem had been the official anthem since 1957"
  verdict: unconfirmed
  sources:
