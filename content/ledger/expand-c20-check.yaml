    - {title: "Review of Holger Weiss", url: "https://resolve.cambridge.org/core/product/623EDD943B4FD01B77C6A8EDBCEC0D13/core-reader", quote: "The First International Conference of Negro Workers, held in Hamburg in July 1930"}
