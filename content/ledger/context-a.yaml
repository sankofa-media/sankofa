  fact: "In the 1930s, in the Vargas era, persecution eased and a legal, schooled capoeira took shape"
  sources:
    - {title: "Smithsonian Folklife Festival: Capoeira", url: "https://festival.si.edu/blog/capoeira-from-occult-martial-art-to-international-dance", quote: "The oppression of capoeira diminished significantly during the 1930s."}
    - {title: "T. J. Desch-Obi, Capoeira, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/capoeira", quote: "a populist policy led by President Getúlio Vargas attempted to create a Brazilian identity"}
- card: capoeira
  fact: "Their students carried capoeira across Brazil and around the world"
  sources:
    - {title: "T. J. Desch-Obi, Capoeira, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/capoeira", quote: "Students of Mestre Bimba spread this new variant throughout Brazil and more recently the world."}
    - {title: "Smithsonian Folklife Festival: Capoeira", url: "https://festival.si.edu/blog/capoeira-from-occult-martial-art-to-international-dance", quote: "Today, we find people all over the world practicing capoeira."}
- card: capoeira
  fact: "Once a crime, capoeira became a symbol of Brazil"
  sources:
    - {title: "ReVista, Harvard: Axé Capoeira", url: "https://revista.drclas.harvard.edu/axe-capoeira/", quote: "UNESCO's designation of capoeira as a form of Brazilian intangible cultural heritage"}
    - {title: "T. J. Desch-Obi, Capoeira, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/capoeira", quote: "is now recognized as a Brazilian national sport"}
- card: carolina-maria-de-jesus
  fact: "Quarto de Despejo sold tens of thousands of copies within months"
  sources:
    - {title: "Revista Pesquisa FAPESP: A multifaceted author", url: "https://revistapesquisa.fapesp.br/en/a-multifaceted-author/", quote: "sold 50,000 copies within just a month of its release"}
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "sales exceeded 90,000 copies"}
- card: carolina-maria-de-jesus
  fact: "It was eventually translated into 13 languages"
  sources:
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "Eventually her work was translated into 13 languages and was published in 40 countries."}
    - {title: "Google Doodles (2019)", url: "https://doodles.google/doodle/carolina-maria-de-jesus-105th-birthday/", quote: "It was eventually translated into 13 different languages and distributed in more than 40 countries"}
- card: carolina-maria-de-jesus
  fact: "With the money she moved her family into a brick house outside the favela"
  sources:
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "move her family into a small brick house in the working-class neighborhood of Imirim"}
    - {title: "Revista Pesquisa FAPESP", url: "https://revistapesquisa.fapesp.br/en/a-multifaceted-author/", quote: "a brick house in a São Paulo suburb, where she moved after leaving the Canindé district"}
- card: carolina-maria-de-jesus
  fact: "Her later books, some published at her own expense, found few readers"
  sources:
    - {title: "Revista Pesquisa FAPESP", url: "https://revistapesquisa.fapesp.br/en/a-multifaceted-author/", quote: "two more books—with her own money ... with indifference"}
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "Carolina's third book, Provérbios de Carolina Maria de Jesús, exhausted what money she had set aside."}
- card: carolina-maria-de-jesus
  fact: "By the late 1960s she was close to poverty again and withdrew to a small farm at Parelheiros on the edge of São Paulo"
  sources:
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "by the late 1960s she was again living on the edge of poverty"}
    - {title: "Revista Pesquisa FAPESP", url: "https://revistapesquisa.fapesp.br/en/a-multifaceted-author/", quote: "refuge on a farm on the outskirts of the city"}
- card: carolina-maria-de-jesus
  fact: "She died in 1977 on the verge of destitution"
  sources:
    - {title: "Robert M. Levine, LARR 29:1 (1994)", url: "https://www.cambridge.org/core/journals/latin-american-research-review/article/cautionary-tale-of-carolina-maria-de-jesus/5321F967C3A31A99C06BFB2CB1E5E537", quote: "Carolina died in 1977, on the verge of indigence."}
    - {title: "Encyclopedia.com: Jesús, Carolina Maria de", url: "https://www.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/jesus-carolina-maria-de-c-1913-1977", quote: "by the late 1960s she was again living on the edge of poverty"}
# Fork G4: new facts added to cards douglass-covey … granville-sharp (2026-11-13)
- card: granville-sharp
  fact: "Strong's master later sold him to a Jamaica planter and had him seized; Sharp brought the case before the Lord Mayor, who set Strong free"
  sources:
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "Lisle sold the young man to a Jamaica planter called James Kerr for £30. ... The mayor agreed that Strong had committed no crime and should thus be set free."}
    - {title: "London Museum: Granville Sharp", url: "https://londonmuseum.org.uk/collections/v/object-752028/granville-sharp/", quote: "succeeded in classifying as a freeman ... after he was thrown out by his master despite attempts to bring him back to slavery"}
- card: granville-sharp
  fact: "Strong's health was ruined by the beating and he died young, at about 25"
  sources:
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "Strong himself, his health permanently damaged from Lisle's beating, died at the age of 25"}
    - {title: "Christian History Institute: Granville Sharp spent a lifetime on abolition", url: "https://christianhistoryinstitute.org/dailystory/permalink/granville-sharp-spent-a-lifetime-on-abolition-of-slavery-and-other-good-causes", quote: "Strong, whom Lisle had badly beaten some months earlier, soon died of the after-effects of the brutality."}
- card: granville-sharp
  fact: "Sharp backed James Somerset; on 22 June 1772 Lord Mansfield ruled a master could not seize a slave in England to send him abroad for sale; Somerset was freed, but slavery was not abolished"
  sources:
    - {title: "English Heritage: The Somerset case", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "a master could not seize a slave in England and detain him preparatory to sending him out of the realm to be sold"}
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "Somerset was discharged ... Mansfield had not ruled that slavery was illegal in England, merely that no-one had a right 'to take a slave by force to be sold abroad'."}
- card: granville-sharp
  fact: "Sharp's demand for a murder trial over the Zong failed: no one was ever prosecuted"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "Sharp wrote to the prime minister asking for a murder trial. ... None of the murderers were ever prosecuted."}
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "while no-one was prosecuted, the incident mobilised public feeling against the slave trade"}
- card: granville-sharp
  fact: "Disease and war killed most of the Sierra Leone settlers"
  sources:
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "the colony, ravaged by war and disease, failed. By 1791, only 60 of the colonists survived."}
    - {title: "Abraham Farfán and María del Pilar López-Uribe, Africa at LSE (2020)", url: "https://blogs.lse.ac.uk/africaatlse/2020/06/27/british-founding-sierra-leone-slave-trade/", quote: "decimated by disease, hunger and hostility from its neighbours"}
- card: granville-sharp
  fact: "In 1789 a local Temne ruler burned Granville Town"
  sources:
    - {title: "Abraham Farfán and María del Pilar López-Uribe, Africa at LSE (2020)", url: "https://blogs.lse.ac.uk/africaatlse/2020/06/27/british-founding-sierra-leone-slave-trade/", quote: "Granville Town, the first settlement, was burned down in 1789 by the local Temne suzerain, King Jimmy."}
    - {title: "Black Loyalists: Our Story, Our People (Canada's Digital Collections): The Sierra Leone Company", url: "https://blackloyalist.com/cdc/story/exodus/company.htm", quote: "In 1789, the local chief of the Temne tribe attacked the settlement over a dispute over rent for the land. ... Granville Town, the main settlement, was completely destroyed"}
- card: granville-sharp
  fact: "The colony was refounded (Sierra Leone Company, new settlers) and today's Freetown grew from the 1787 settlement"
  sources:
    - {title: "Clapham Society: Granville Sharp", url: "https://claphamsociety.com/article/24-granville-sharp/", quote: "That original settlement later became Freetown, the capital of Sierra Leone."}
    - {title: "Columbia Encyclopedia via Encyclopedia.com: Freetown", url: "https://www.encyclopedia.com/places/africa/sierra-leone-political-geography/freetown", quote: "Freetown was founded by the British in 1787 as a settlement for freed slaves from England, Nova Scotia and Jamaica."}
    - {title: "Black Loyalists: The Sierra Leone Company", url: "https://blackloyalist.com/cdc/story/exodus/company.htm", quote: "Undaunted, Granville Sharp and the Sierra Leone Company continued their efforts."}
- card: granville-sharp
  fact: "Sharp died in 1813"
  sources:
    - {title: "Brycchan Carey: Granville Sharp", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "Granville Sharp died in Fulham, south-west London, on 6 July 1813."}
    - {title: "Clapham Society: Granville Sharp", url: "https://claphamsociety.com/article/24-granville-sharp/", quote: "6th July 1813 ... He is buried in All Saints Church, Fulham."}
- card: equiano
  fact: "As a boy he was owned by the naval officer Michael Pascal, who named him Gustavus Vassa"
  sources:
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "Pascal gave the boy the name of Gustavus Vassa"}
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "forced on him by enslaver Michael Pascal in 1754"}
- card: equiano
  fact: "Later the Quaker merchant Robert King of Montserrat put him to work trading, and he bought his freedom from King in 1766 for £40"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Olaudah Equiano", url: "https://www.slaveryandremembrance.org/people/person/?id=PP003", quote: "a Quaker named Robert King in Montserrat ... King recognized Equiano's skills and put him to work in marketing rather than in the fields."}
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "which he purchased from one of his enslavers Robert King in 1766 for £40"}
- card: equiano
  fact: "In 1787 he was commissary for the Sierra Leone expedition and was dismissed after publicly condemning its management"
  sources:
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "The Navy Board stood up for him, but he was sacked nonetheless."}
    - {title: "Paul Lovejoy, Equiano's World: Associates in abolition", url: "https://equianosworld.org/associates-abolition.php", quote: "was hired as Commissary Officer for the expedition. ... Following his public condemnation of the plan, Vassa was dismissed from his position."}
- card: equiano
  fact: "He toured Britain and Ireland with the book, at readings arranged by local abolition committees"
  sources:
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "going on lecture tours around England, Scotland, Wales, and Ireland ... it was local abolition committees who arranged the lectures and readings at which he was present"}
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "travelled across the country to present the case for abolishing slavery"}
- card: equiano
  fact: "In 1792 he married Susanna Cullen; they had two daughters"
  sources:
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "on 7 April 1792 he married an Englishwoman, Susanna Cullen, at Soham in Cambridgeshire"}
    - {title: "Paul Lovejoy, Equiano's World", url: "https://equianosworld.org/associates-abolition.php", quote: "In 1792, he married a white woman named Suzannah Cullen. ... The couple had two daughters, Anne Marie Vassa and Joanna Vassa."}
- card: equiano
  fact: "He died in London on 31 March 1797"
  sources:
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "He died in London on 31 March 1797."}
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "Equiano died in March 1797."}
- card: douglass-covey
  fact: "His owner Thomas Auld hired him out to Covey for one year"
  sources:
    - {title: "Frederick Douglass, Narrative (1845), ch. X, Documenting the American South", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "let me for one year to a man named Edward Covey"}
    - {title: "NPS: Chronology of Frederick Douglass", url: "https://www.nps.gov/frdo/learn/kidsyouth/chronology.htm", quote: "1834, January 1: Begins year as field hand under Edward Covey, the 'slave breaker'"}
- card: douglass-covey
  fact: "For the first six months Covey whipped him almost every week"
  sources:
    - {title: "Frederick Douglass, Narrative (1845), ch. X", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "During the first six months, of that year, scarce a week passed without his whipping me."}
    - {title: "PBS Wisconsin, Becoming Frederick Douglass: Battling the slave breaker", url: "https://pbswisconsin.org/watch/becoming-frederick-douglass/battling-slave-breaker-ydsxqo/", quote: "After six months of taking these brutal beatings, Frederick had enough."}
- card: douglass-covey
  fact: "The fight, in August 1834, lasted nearly two hours"
  sources:
    - {title: "Frederick Douglass, Narrative (1845), ch. X", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "for nearly two hours"}
    - {title: "PBS Wisconsin, Becoming Frederick Douglass", url: "https://pbswisconsin.org/watch/becoming-frederick-douglass/battling-slave-breaker-ydsxqo/", quote: "He and Covey had this epic two-hour battle"}
    - {title: "NPS: Chronology of Frederick Douglass", url: "https://www.nps.gov/frdo/learn/kidsyouth/chronology.htm", quote: "1834, August: Fights with Covey; is not whipped thereafter."}
- card: douglass-covey
  fact: "Covey did not have him publicly whipped, because it would have cost him his reputation as a breaker"
  sources:
    - {title: "Frederick Douglass, Narrative (1845), ch. X", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "his reputation would have been lost"}
    - {title: "PBS Wisconsin, Becoming Frederick Douglass (Derrick Spires)", url: "https://pbswisconsin.org/watch/becoming-frederick-douglass/battling-slave-breaker-ydsxqo/", quote: "was against Covey's best interest"}
- card: douglass-covey
  fact: "He remained enslaved four more years and escaped north on 3 September 1838"
  sources:
    - {title: "Frederick Douglass, Narrative (1845), ch. X-XI", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "though I remained a slave four years afterwards ... the third day of September"}
    - {title: "NPS: Chronology of Frederick Douglass", url: "https://www.nps.gov/frdo/learn/kidsyouth/chronology.htm", quote: "1838, September 3: Escapes north by train and boat."}
- card: douglass-covey
  fact: "He published his Narrative in 1845"
  sources:
    - {title: "NPS: Chronology of Frederick Douglass", url: "https://www.nps.gov/frdo/learn/kidsyouth/chronology.htm", quote: "1845, May 28: Narrative of the Life of Frederick Douglass, an American Slave, published"}
    - {title: "Documenting the American South: Narrative (Boston, 1845)", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "Narrative of the Life of Frederick Douglass, an American Slave. Written by Himself. Boston: Published at the Anti-Slavery Office, 1845."}
- card: douglass-covey
  fact: "He was born enslaved in Talbot County, Maryland"
  sources:
    - {title: "NPS: Chronology of Frederick Douglass", url: "https://www.nps.gov/frdo/learn/kidsyouth/chronology.htm", quote: "Holme Hill Farm on Tuckahoe Creek, Talbot County"}
    - {title: "Frederick Douglass, Narrative (1845), ch. I", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "I was born in Tuckahoe, near Hillsborough, and about twelve miles from Easton, in Talbot county, Maryland."}
- card: du-bois-infographics
