    - {title: "Encyclopedia.com: Freedom's Journal", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/freedoms-journal", quote: "The paper's circulation extended to eleven U.S. states, the District of Columbia, Haiti, Europe, and Canada."}
