    - {title: "Buffalo State University Archives: Freedom's Journal", url: "https://library.buffalostate.edu/archives/mfc/freedoms_journal", quote: "following the resignation of Cornish over differences regarding African American colonization of Africa ... Russwurm had begun to promote the colonization movement lead by the American Colonization Society"}
    - {title: "Encyclopedia.com: Freedom's Journal", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/freedoms-journal", quote: "The details are murky, but Cornish left Freedom's Journal in September 1827."}
- card: freedoms-journal
  fact: "Cornish tried to revive the paper as The Rights of All, which was short-lived"
  sources:
    - {title: "EBSCO Research Starters: John Brown Russwurm", url: "https://www.ebsco.com/research-starters/history/john-brown-russwurm/", quote: "Cornish later attempted to revive the publication under a new name, The Rights of All. That publication was short-lived."}
    - {title: "Encyclopedia.com: Freedom's Journal", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/freedoms-journal", quote: "a newspaper called The Rights of All in 1829, which only lasted six months"}
- card: freedoms-journal
  fact: "Russwurm governed Maryland-in-Liberia from 1836 until his death in 1851"
  sources:
    - {title: "Encyclopedia.com: John Brown Russwurm", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/john-brown-russwurm", quote: "Russwurm governed the colony from 1836 until 1851 ... He died on June 17, 1851."}
    - {title: "EBSCO Research Starters: John Brown Russwurm", url: "https://www.ebsco.com/research-starters/history/john-brown-russwurm/", quote: "In 1836, he became governor of the Maryland colony in Liberia. ... After his death, the colony eventually became part of the independent Republic of Liberia."}
- card: gannibal
  fact: "He studied in France from 1717 to 1723"
  sources:
    - {title: "Saint Petersburg Encyclopedia: D. Y. Guzevich, Gannibal", url: "https://encspb.ru/object/2804035654?dv=2853952566&lc=en", quote: "Studied in France (1717-23, from 1720 - in the artillery school in LaFerre)."}
    - {title: "Russian Biographical Dictionary: Gannibal", url: "https://ru.wikisource.org/wiki/РБС/ВТ/Ганнибал,_Абрам_Петрович", quote: "В 1717 г. Г. отправлен был царем во Францию для изучения инженерных наук ... в начале 1723 г. явился в Петербург."}
- card: gannibal
  fact: "After Peter's death he fell into disgrace and was sent off to Siberia"
  sources:
    - {title: "Brockhaus and Efron: Gannibal", url: "https://ru.wikisource.org/wiki/ЭСБЕ/Ганнибал,_Абрам_Петрович", quote: "был отправлен в Сибирь (1727) перенести город Селингинск на новое место"}
    - {title: "Vokrug Sveta: Из Африки в Сибирь: как арап Петра Великого в ссылку попал", url: "https://www.vokrugsveta.ru/articles/iz-afriki-v-sibir-kak-arap-petra-velikogo-v-ssylku-popal-id740147", quote: "Меншиков решил сослать его подальше от двора."}
- card: gannibal
  fact: "Elizabeth granted him Mikhailovskoye (Pskov district) in 1742"
  sources:
    - {title: "Russian Biographical Dictionary: Gannibal", url: "https://ru.wikisource.org/wiki/РБС/ВТ/Ганнибал,_Абрам_Петрович", quote: "Михайловская Губа в Псковском уезде с 569 душами крестьян (пожалована 12 января 1742 г.)"}
    - {title: "Pushkin Museum-Reserve Mikhailovskoye: history", url: "https://pushkinland.ru/2018/english/res1.php", quote: "On 12 January, 1742 most of the land which made up Mikhalovskaya Guba was granted in perpetuity ... by decree of Empress Elizabeth"}
    - {title: "Russian Life: Pushkin's estates (1999)", url: "https://www.russianlife.com/magazine/june-july-1999/pushkins-estates/", quote: "received as part of a larger grant from Empress Elizabeth in 1742 for his services to her father, Peter the Great"}
- card: gannibal
  fact: "He retired in 1762 and died in 1781 at Suyda"
  sources:
    - {title: "Russian Biographical Dictionary: Gannibal", url: "https://ru.wikisource.org/wiki/РБС/ВТ/Ганнибал,_Абрам_Петрович", quote: "9 июня 1762 г. Г. был уволен в отставку за старостью ... где и скончался 14 мая 1781 г."}
    - {title: "Saint Petersburg Encyclopedia: Gannibal", url: "https://encspb.ru/object/2804035654?dv=2853952566&lc=en", quote: "Gannibal retired in 1762 ... of Suyda Sofiysky District, St. Petersburg Province"}
- card: gannibal
  fact: "His son Osip was Pushkin's maternal grandfather"
  sources:
    - {title: "Brockhaus and Efron: Gannibal", url: "https://ru.wikisource.org/wiki/ЭСБЕ/Ганнибал,_Абрам_Петрович", quote: "Дочь другого сына Г., Осипа, была матерью А. С. Пушкина."}
    - {title: "Pushkin Museum-Reserve Mikhailovskoye", url: "https://pushkinland.ru/2018/english/res1.php", quote: "The estate was created by Pushkin's grandfather, Osip Abramovich Gannibal"}
- card: gannibal
  fact: "Pushkin spent two years of exile at Mikhailovskoye"
  sources:
    - {title: "Pushkin Museum-Reserve Mikhailovskoye", url: "https://pushkinland.ru/2018/english/res1.php", quote: "From 1824 until the end of his life Pushkin made frequent visit to Mikhailovskoye, where he also spent two years in exile."}
    - {title: "Russian Life: Pushkin's estates (1999)", url: "https://www.russianlife.com/magazine/june-july-1999/pushkins-estates/", quote: "a return from Odessa to Mikhailovskoe in August 1824 as an extension of his exile ... left largely to himself at Mikhailovskoe for the next two years"}
- card: gannibal
  fact: "The novel begun in 1827 was published only after Pushkin's death (1837), under a title given by its editors, The Moor of Peter the Great"
  sources:
    - {title: "Catharine Theimer Nepomnyashchy, introduction to Under the Sky of My Africa (Northwestern University Press, 2006)", url: "https://api.pageplace.de/preview/DT0400.9780810162051_A49429564/preview-9780810162051_A49429564.pdf", quote: "uncompleted attempt at a novel, titled by the editors who published it shortly after the poet's death, The Blackamoor of Peter the Great"}
    - {title: "Wikisource, Арап Петра Великого (text from FEB edition, with notes)", url: "https://ru.wikisource.org/wiki/Арап_Петра_Великого_(Пушкин)", quote: "Впервые как целостное произведение напечатан после смерти Пушкина под заглавием «Арап Петра Великого» (в рукописи Пушкина название отсутствует) в журнале «Современник», 1837"}
- card: general-dumas
  fact: "In Egypt he quarrelled with Napoleon over the campaign and asked to return to France"
  sources:
    - {title: "Enslaved.org: Thomas-Alexandre Dumas", url: "https://enslaved.org/fullStory/16-23-92891/", quote: "Dumas criticized Napoleon's leadership, and after a dispute, Dumas requested to return to France."}
    - {title: "Fondation pour la mémoire de l'esclavage: Thomas Alexandre Dumas", url: "https://memoire-esclavage.org/biographies/thomas-alexandre-dumas", quote: "Mais les deux hommes s'opposent, et Dumas réalise rapidement que la campagne est un échec."}
- card: general-dumas
  fact: "He was held at Taranto by forces of the Kingdom of Naples and released in 1801"
  sources:
    - {title: "Columbia Encyclopedia via Encyclopedia.com: Dumas, Thomas-Alexandre", url: "https://www.encyclopedia.com/reference/encyclopedias-almanacs-transcripts-and-maps/dumas-thomas-alexandre", quote: "imprisoned (1799–1801) by forces loyal to the king of Naples"}
    - {title: "Enslaved.org: Thomas-Alexandre Dumas", url: "https://enslaved.org/fullStory/16-23-92891/", quote: "Dumas is released from prison and returns to France."}
- card: general-dumas
  fact: "He never received the pension owed for his captivity"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/biographies/thomas-alexandre-dumas", quote: "Il ne recevra jamais ses arriérés de pension liés à sa captivité."}
    - {title: "Enslaved.org", url: "https://enslaved.org/fullStory/16-23-92891/", quote: "denying him of his full pension and refusing his admission into the French Legion of Honor"}
- card: general-dumas
  fact: "He died at Villers-Cotterêts in 1806"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/biographies/thomas-alexandre-dumas", quote: "le 26 février 1806 à Villers-Cotterêts"}
    - {title: "Enslaved.org", url: "https://enslaved.org/fullStory/16-23-92891/", quote: "Dumas dies of stomach cancer at the age of 43 in Villers-Cotterêts, France."}
- card: general-dumas
  fact: "A statue of the general in Paris was destroyed during the German occupation; a sculpture of shackles now commemorates him"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage", url: "https://memoire-esclavage.org/biographies/thomas-alexandre-dumas", quote: "Cette statue fondue sous l'Occupation en 1942 pour en récupérer le métal ... l'œuvre Fers, réalisée en 2008 par l'artiste Driss Sans-Arcidet"}
    - {title: "Enslaved.org", url: "https://enslaved.org/fullStory/16-23-92891/", quote: "destroyed during World War II by occupying Nazi forces ... a set of shackles, one open and the other closed"}
- card: gospel
  fact: "Mahalia Jackson sang 'Take My Hand, Precious Lord' at Martin Luther King Jr.'s funeral (1968)"
  sources:
    - {title: "64 Parishes: Mahalia Jackson", url: "https://64parishes.org/entry/mahalia-jackson", quote: "Five years later, she sang Dorsey's most famous song, \"Take My Hand, Precious Lord\" at King's funeral."}
    - {title: "Christianity Today: The father of gospel music, Thomas Dorsey (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "The song later played during both Martin Luther King Jr. and Lyndon B. Johnson's funerals."}
- card: gospel
  fact: "Dorsey died in Chicago in 1993, having written hundreds of songs"
  sources:
    - {title: "New Georgia Encyclopedia: Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "Dorsey died in Chicago on January 23, 1993"}
    - {title: "Christianity Today (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "Dorsey died in 1993 ... the greatest song I have written out of near four hundred gospel songs"}
- card: funk
  fact: "When Stubblefield was fighting cancer, Prince paid $90,000 of his medical bills"
  sources:
    - {title: "NPR: Clyde Stubblefield dies at 73", url: "https://www.nprillinois.org/2017-02-18/clyde-stubblefield-james-browns-funky-drummer-dies-at-73", quote: "Prince donated $90,000 to help him pay his hospital bills"}
    - {title: "Associated Press via ABC: Clyde Stubblefield dies at 73", url: "https://www.abc.net.au/news/2017-02-19/james-browns-funky-drummer-clyde-stubblefield-dies-at-73/8284220", quote: "Prince personally paid $90,000 to cover his bills"}
- card: funk
  fact: "Stubblefield died in 2017, aged 73"
  sources:
    - {title: "NPR (18 February 2017)", url: "https://www.nprillinois.org/2017-02-18/clyde-stubblefield-james-browns-funky-drummer-dies-at-73", quote: "Stubblefield was 73"}
    - {title: "Associated Press via ABC (19 February 2017)", url: "https://www.abc.net.au/news/2017-02-19/james-browns-funky-drummer-clyde-stubblefield-dies-at-73/8284220", quote: "died on Saturday aged 73"}
