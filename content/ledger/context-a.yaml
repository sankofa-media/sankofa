  sources:
    - {title: "NPS: monument proclamation", url: "https://www.nps.gov/till/learn/management/presidential-proclamation.htm", quote: "For the remainder of her life, well into her 80s, Mamie Till-Mobley furthered the memory of her son Emmett"}
