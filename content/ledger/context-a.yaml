# Context rewrite (2026-11-13), cards achebe..jazz: every NEW fact added to a
# card body, with two independent sources and a supporting quote from each.
# Quotes marked "(paraphrase...)" are close renderings; re-open those pages.
- card: gullah
  fact: "Researchers Joseph Opala and Cynthia Schmidt traced Amelia Dawley's Mende song to Sierra Leone, where Baindu Jabati of Senehun (Senehum) Ngola still knew it as a funeral song"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Cynthia Schmidt discovered a woman, Baindu Jabati, living in the remote interior village of Senehum Ngola ... a dirge performed during a graveside ceremony"}
    - {title: "Folkstreams: Dr. Lorenzo Turner and the Gullah Language", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language", quote: "Folklorists Joseph Opala and Cynthia Schmidt later found her relatives, who remembered parts of her Mende funeral song (paraphrase of page)"}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "Baindu had learned the song from her mother"}
- card: gullah
  fact: "In 1997 Dawley's daughter Mary Moran travelled to the village, was received with jubilation, and she and Baindu Jabati sang the song together"
  sources:
    - {title: "California Newsreel: The Language You Cry In", url: "https://newsreel.org/video/THE-LANGUAGE-YOU-CRY-IN", quote: "Finally in 1997, Mary Moran and her family could travel ... were received with jubilation in Senehum Ngola"}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "It is 1997 in Sierra Leone, and Baindu Jabati and Mary Moran sing a Mende funeral song together."}
- card: gullah
  fact: "Gullah is still spoken today"
  sources:
    - {title: "Folkstreams: Dr. Lorenzo Turner and the Gullah Language", url: "https://www.folkstreams.net/contexts/dr-lorenzo-turner-and-the-gullah-language", quote: "can be heard, even today, in the subtlest forms and nuances of Gullah speech"}
    - {title: "Kenyon College: American Language, African Roots", url: "https://digital.kenyon.edu/gullah_language.html", quote: "The language's continued use is a story of victory."}

- card: haitian-revolution
  fact: "In 1789 Saint-Domingue was the richest colony in the Americas, worked by hundreds of thousands of enslaved Africans on sugar and coffee plantations"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "grew to be the wealthiest colony in the French empire and, perhaps, the richest colony in the world"}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "the richest colony in the Americas in 1789 ... Almost half a million slaves toiled on its sugar, coffee, indigo, and cotton plantations"}
- card: haitian-revolution
  fact: "Toussaint Louverture was seized in 1802, shipped to France and died in a mountain fortress (Fort de Joux) in April 1803"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "was taken prisoner in June 1802 and deported to France ... Denied a trial, he was confined in the Fort de Joux in the Jura mountains, where he died in April 1803"}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "Toussaint ... was arrested and imprisoned in France, where he died in 1803 (paraphrase of page)"}
- card: haitian-revolution
  fact: "The French were finally defeated late in 1803"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "finally defeated French forces in late 1803"}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "the final defeat of the French forces at Vertières on November 18, 1803"}
- card: haitian-revolution
  fact: "Haiti borrowed in France to pay the indemnity; it made the last indemnity payment in 1878 and paid off the 1825 loan in 1888"
  sources:
    - {title: "BnF: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "borrowed 30 million francs on the French market in November 1825 ... independence debt paid off in 1878 ... the 1825 loan fully repaid in 1887-88 (paraphrase of page)"}
    - {title: "New York Times: Historical data on Haiti's debt (GitHub)", url: "https://github.com/nytimes/haiti-debt", quote: "This debt, which began in 1825 ... Haiti's last indemnity payment came in 1878 ... The double debt was therefore paid off in 1888."}

- card: hannah-crafts
  fact: "The novel may be the first written by an enslaved African American woman"
  sources:
    - {title: "New York Review of Books: In Search of the Real Hannah Crafts (2024)", url: "https://www.nybooks.com/articles/2024/08/15/in-search-of-the-real-hannah-crafts-gregg-hecimovich/", quote: "thought to be the first novel by a Black woman to describe slavery from the inside"}
    - {title: "Yale News: Henry Louis Gates Jr. to donate rare manuscript (2003)", url: "https://news.yale.edu/2003/05/28/henry-louis-gates-jr-donate-rare-manuscript-female-slave-yale", quote: "is thought to be the first novel ever written by an African-American slave"}
- card: hannah-crafts
  fact: "In the novel the narrator is sold into the household of John Hill Wheeler, and at its climax a face powder blackens Mrs Wheeler's face, a literary revenge on the Wheelers"
  sources:
    - {title: "New York Review of Books (2024)", url: "https://www.nybooks.com/articles/2024/08/15/in-search-of-the-real-hannah-crafts-gregg-hecimovich/", quote: "Hannah is sold to a pious but morally weak owner, who sells her to John Hill Wheeler ... a face powder for Mrs. Wheeler that, mixed with smelling salts, blackened the wearer's face (paraphrase of page)"}
    - {title: "Harvard Gazette: Solving the mystery of The Bondwoman's Narrative (2023)", url: "https://news.harvard.edu/gazette/story/2023/12/solving-the-mystery-of-the-bondwomans-narrative/", quote: "a 'genius' blackface scene that takes literary revenge on the Wheelers (paraphrase of page)"}
- card: hannah-crafts
  fact: "Hecimovich's research drew on wills, diaries and public records"
  sources:
    - {title: "Fine Books Magazine: Slave manuscript mystery solved (2013)", url: "https://www.finebooksmagazine.com/blog/slave-manuscript-mystery-solved", quote: "a decade of 'obsessive' research into wills, diaries, almanacs, and public records (paraphrase of page)"}
    - {title: "CBS News (2013)", url: "https://www.cbsnews.com/news/mystery-author-of-slaves-novel-revealed-professor-says", quote: "a slave on a North Carolina plantation owned by John Hill Wheeler (confirms identification; research detail per Fine Books)"}

- card: henrietta-lacks
  fact: "Henrietta Lacks was born Loretta Pleasant in Virginia in 1920, worked on tobacco farms, married David Lacks and raised five children"
  sources:
    - {title: "NHGRI: Henrietta Lacks timeline", url: "https://www.genome.gov/sites/default/files/media/files/2019-07/hela_timeline.pdf", quote: "Henrietta Lacks was born Loretta Pleasant on August 1, 1920, in Roanoke, Virginia ... On April 10, 1941, Henrietta Pleasant married David \"Day\" Lacks"}
    - {title: "Food and Drug Law Institute: Lacks v. Thermo Fisher, chronology", url: "https://www.fdli.org/2023/08/lacks-v-thermo-fisher-scientific-inc-an-extraordinary-event-from-more-than-70-years-ago/", quote: "born Loretta Pleasant on August 1, 1920 ... as a young child she worked as a tobacco farmer ... had five children (paraphrase of page)"}
    - {title: "AP via WVTF (2023)", url: "https://www.wvtf.org/news/2023-08-01/thermo-fisher-scientific-settles-with-family-of-henrietta-lacks-whose-hela-cells-uphold-medicine", quote: "A poor tobacco farmer from southern Virginia ... raising five children (paraphrase of page)"}
- card: henrietta-lacks
  fact: "Johns Hopkins was one of the few hospitals in the area that treated Black patients, and she was treated in its segregated ward"
  sources:
    - {title: "Food and Drug Law Institute: Lacks v. Thermo Fisher, chronology", url: "https://www.fdli.org/2023/08/lacks-v-thermo-fisher-scientific-inc-an-extraordinary-event-from-more-than-70-years-ago/", quote: "one of the few hospitals that would treat Black patients ... only in racially segregated wards (paraphrase of page)"}
    - {title: "Embryo Project Encyclopedia, ASU: Henrietta Lacks (1920–1951)", url: "https://embryo.asu.edu/pages/henrietta-lacks-1920-1951", quote: "the only hospital in Lacks's area that would treat Lacks ... received her care in what Skloot refers to as the colored ward of the hospital"}
- card: henrietta-lacks
  fact: "The sample went to the tissue-culture laboratory of George Gey"
  sources:
    - {title: "NHGRI: Henrietta Lacks timeline", url: "https://www.genome.gov/sites/default/files/media/files/2019-07/hela_timeline.pdf", quote: "A biopsy of Henrietta Lack's tumor was taken and sent to the lab of Dr. George Gey resulting in the creation of HeLa cell line."}
    - {title: "Embryo Project Encyclopedia, ASU", url: "https://embryo.asu.edu/pages/henrietta-lacks-1920-1951", quote: "George Otto Gey ... head of tissue culture research at Johns Hopkins (paraphrase of page)"}
- card: henrietta-lacks
  fact: "She died aged 31"
  sources:
    - {title: "NHGRI: Henrietta Lacks timeline", url: "https://www.genome.gov/sites/default/files/media/files/2019-07/hela_timeline.pdf", quote: "she died at the age of 31 years old"}
    - {title: "NIH: The NIH-Lacks Family Agreement", url: "https://grants.nih.gov/policy-and-compliance/policy-topics/sharing-policies/dms/privacy/nih-lacks-family-agreement", quote: "biopsy specimens of a 31-year-old patient named Henrietta Lacks"}
- card: henrietta-lacks
  fact: "Her family learned what had become of her cells only decades later"
  sources:
    - {title: "Food and Drug Law Institute", url: "https://www.fdli.org/2023/08/lacks-v-thermo-fisher-scientific-inc-an-extraordinary-event-from-more-than-70-years-ago/", quote: "did not learn about her 'immortal cells' until more than 25 years after her death (paraphrase of page)"}
    - {title: "Embryo Project Encyclopedia, ASU", url: "https://embryo.asu.edu/pages/henrietta-lacks-1920-1951", quote: "her family became aware in 1975 (paraphrase of page)"}
- card: henrietta-lacks
  fact: "In 2021 her estate sued Thermo Fisher, accusing it of profiting from her cells; the settlement was announced on 1 August 2023, what would have been her 103rd birthday"
  sources:
    - {title: "GBH News (2023)", url: "https://www.wgbh.org/news/local/2023-08-01/family-of-henrietta-lacks-reaches-settlement-in-lawsuit-against-thermo-fisher", quote: "The family sued Thermo Fisher Scientific in 2021 ... 'improperly profited' ... announced on August 1, 2023, which would have been Lacks' 103rd birthday (paraphrase of page)"}
    - {title: "AP via WVTF (2023)", url: "https://www.wvtf.org/news/2023-08-01/thermo-fisher-scientific-settles-with-family-of-henrietta-lacks-whose-hela-cells-uphold-medicine", quote: "Her descendants sued Thermo Fisher Scientific in 2021, accusing it of profiting from the cells (paraphrase of page; dated 2023-08-01)"}
    - {title: "Food and Drug Law Institute", url: "https://www.fdli.org/2023/08/lacks-v-thermo-fisher-scientific-inc-an-extraordinary-event-from-more-than-70-years-ago/", quote: "complaint dated October 4, 2021, against Thermo Fisher Scientific for unjust enrichment (paraphrase)"}

- card: hip-hop
  fact: "In the 1970s the South Bronx was burning: landlords paid arsonists to torch buildings for insurance, and the near-bankrupt city cut fire and other basic services"
  sources:
    - {title: "PBS Independent Lens: How the burning of the Bronx led to the birth of hip-hop", url: "https://www.pbs.org/independentlens/blog/how-the-burning-of-the-bronx-led-to-the-birth-of-hip-hop/", quote: "landlords were paying arsonists to torch their buildings for insurance money ... advised by the RAND Corporation to close fire stations and let its poorest areas burn"}
    - {title: "WNYC: The South Bronx, where hip-hop was born", url: "https://www.wnyc.org/story/89709-south-bronx-hip-hop-year-zero/", quote: "heavy arson activity from slumlords seeking insurance money ... the lack of basic services like law enforcement, firefighters, sanitation and health"}

- card: hurston
  fact: "Kossola (Cudjo Lewis), after freedom, helped found Africatown"
  sources:
    - {title: "National Park Service: Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "Kossola and other Clotilda survivors bought land to establish Africatown (paraphrase of page)"}
    - {title: "NPR Fresh Air, Maureen Corrigan: Barracoon review (2018), via WUSF", url: "https://www.wusf.org/2018-05-08/barracoon-offers-a-vivid-first-hand-account-of-slavery-in-america", quote: "helped found a settlement called Africatown near Mobile"}
- card: hurston
  fact: "She finished the Barracoon manuscript in 1931; a publisher would take it only if the dialect were rewritten in standard English, and she refused"
  sources:
    - {title: "Zora Neale Hurston estate: A work by Zora Neale Hurston will finally be published", url: "https://www.zoranealehurston.com/news/a-work-by-zora-neale-hurston-will-finally-be-published/", quote: "finished ... spring 1931 ... offered to buy the manuscript if she rewrote it 'in language rather than dialect' (paraphrase of page)"}
    - {title: "NPR Fresh Air via WUSF (2018)", url: "https://www.wusf.org/2018-05-08/barracoon-offers-a-vivid-first-hand-account-of-slavery-in-america", quote: "The short book-length manuscript Hurston produced in 1931 was called Barracoon ... transforming his dialect speech into the King's English"}
- card: hurston
  fact: "By 1950 she was working as a maid"
  sources:
    - {title: "PBS American Masters: Zora Neale Hurston career timeline", url: "https://www.pbs.org/wnet/americanmasters/zora-neale-hurston-career-timeline/94", quote: "MIAMI HERALD breaks story that Hurston is down on her luck working as a maid in Miami"}
    - {title: "Encyclopedia.com: Hurston, Zora Neale", url: "https://www.encyclopedia.com/history/culture-magazines/hurston-zora-neale", quote: "by 1950 she had to take a job as a maid (paraphrase of page)"}
- card: hurston
  fact: "Her largely forgotten books were revived in the 1970s, with Alice Walker leading the way"
  sources:
    - {title: "Zora Neale Hurston estate: About", url: "https://www.zoranealehurston.com/about/", quote: "Walker's essay 'In Search of Zora Neale Hurston' ... launching a Hurston revival (paraphrase of page)"}
    - {title: "Encyclopedia.com: Hurston, Zora Neale", url: "https://www.encyclopedia.com/history/culture-magazines/hurston-zora-neale", quote: "Her works were largely overlooked until the 1970s ... Alice Walker was a key figure (paraphrase of page)"}

- card: ida-b-wells
  fact: "Born in Holly Springs, Mississippi, in 1862"
  sources:
    - {title: "National Women's History Museum: Ida B. Wells-Barnett", url: "https://www.womenshistory.org/education-resources/biographies/ida-b-wells-barnett", quote: "Born into slavery in Holly Springs, Mississippi, on July 16, 1862 (paraphrase of page)"}
    - {title: "Encyclopedia.com: Wells-Barnett, Ida Bell", url: "https://www.encyclopedia.com/law/encyclopedias-almanacs-transcripts-and-maps/wells-barnett-ida-bell", quote: "July 16, 1862 ... Born in Holly Springs, Mississippi (paraphrase of page)"}
- card: ida-b-wells
  fact: "In 1893 she took the anti-lynching campaign to Britain"
  sources:
    - {title: "National Women's History Museum", url: "https://www.womenshistory.org/education-resources/biographies/ida-b-wells-barnett", quote: "She lectured in Britain in 1893–1894 (paraphrase of page)"}
    - {title: "Encyclopedia.com: Wells-Barnett, Ida Bell", url: "https://www.encyclopedia.com/law/encyclopedias-almanacs-transcripts-and-maps/wells-barnett-ida-bell", quote: "toured Great Britain in 1893 to pressure U.S. lawmakers (paraphrase of page)"}
- card: ida-b-wells
  fact: "In 1895 she married the Chicago lawyer Ferdinand Barnett; in Chicago she helped form the NAACP and a Black women's suffrage club (the Alpha Suffrage Club); she died in 1931"
  sources:
    - {title: "National Women's History Museum", url: "https://www.womenshistory.org/education-resources/biographies/ida-b-wells-barnett", quote: "She married attorney Ferdinand L. Barnett in 1895 ... Alpha Suffrage Club ... excluded from the list of NAACP founders despite her leadership (paraphrase of page)"}
    - {title: "Encyclopedia.com: Wells-Barnett, Ida Bell", url: "https://www.encyclopedia.com/law/encyclopedias-almanacs-transcripts-and-maps/wells-barnett-ida-bell", quote: "She married Ferdinand L. Barnett in 1895, raised four children in Chicago ... helped form the NAACP (paraphrase of page)"}
    - {title: "Library of Congress: Ida B. Wells and investigative journalism", url: "https://blogs.loc.gov/headlinesandheroes/2020/02/ida-b-wells-and-the-activism-of-investigative-journalism/", quote: "founded clubs, including the Alpha Suffrage Club, helped found the NAACP ... She died in 1931 (paraphrase of page)"}
- card: ida-b-wells
  fact: "In 2020 the Pulitzer board gave her a posthumous special citation for 'her outstanding and courageous reporting'"
  sources:
    - {title: "ABC7 Chicago (5 May 2020)", url: "https://abc7chicago.com/post/ida-b-wells-awarded-pulitzer-prize-special-citation/6152768/", quote: "her outstanding and courageous reporting"}
    - {title: "Ms. Magazine (11 May 2020)", url: "https://msmagazine.com/2020/05/11/ida-b-wells-journalist-civil-rights-hero-and-posthumous-pulitzer-prize-winner/", quote: "is bound to go a long way in redressing her undeserved anonymity (on the 2020 Pulitzer special citation)"}

- card: ira-aldridge
  fact: "When Edmund Kean collapsed during a run of Othello at Covent Garden, Aldridge took over the part; critics were hostile to him over his race and the production closed"
  sources:
    - {title: "Folger Shakespeare Library: Ira Aldridge", url: "https://www.folger.edu/blogs/shakespeare-and-beyond/ira-aldridge/", quote: "critics objected to his race, his youth, and his inexperience ... played Othello only twice before the production was cancelled (paraphrase)"}
    - {title: "Rockefeller University, Selections: An Extraordinary Early American in Europe", url: "https://selections.rockefeller.edu/an-extraordinary-early-american-in-europe/", quote: "Edmund Kean fell ill during a run of Othello at the Royal Covent Garden Theatre, and Aldridge played the role. Critics were hostile, and the production closed (paraphrase)"}
    - {title: "English Heritage: Blue plaque, Ira Aldridge", url: "https://www.english-heritage.org.uk/visit/blue-plaques/aldridge-ira", quote: "failed to overcome their racial prejudices"}
- card: ira-aldridge
  fact: "From the 1850s he performed mainly on tour in continental Europe"
  sources:
    - {title: "Shakespeare Birthplace Trust: Chevalier Ira Aldridge", url: "https://www.shakespeare.org.uk/explore-shakespeare/blogs/chevalier-ira-aldridge/", quote: "In 1852 Aldridge sailed for Europe (paraphrase of page)"}
    - {title: "Internet Encyclopedia of Ukraine: Aldridge, Ira Frederick", url: "http://www.encyclopediaofukraine.com/pages%5CA%5CL%5CAldridgeIraFrederick.htm", quote: "In the 1850s he performed mainly in Europe (paraphrase of page)"}
- card: ira-aldridge
  fact: "Saxony made him a knight"
  sources:
    - {title: "Shakespeare Birthplace Trust: Chevalier Ira Aldridge", url: "https://www.shakespeare.org.uk/explore-shakespeare/blogs/chevalier-ira-aldridge/", quote: "In 1858 he was given the title Chevalier Ira Aldridge, Knight of Saxony (paraphrase of page)"}
    - {title: "Rockefeller University, Selections", url: "https://selections.rockefeller.edu/an-extraordinary-early-american-in-europe/", quote: "Chevalier Ira Aldridge, Knight of Saxony"}
- card: ira-aldridge
  fact: "Shevchenko's freedom from serfdom was bought by friends in 1838; arrested in 1847, he spent ten years in exile as a common soldier, released in 1857"
  sources:
    - {title: "Internet Encyclopedia of Ukraine: Shevchenko, Taras", url: "http://www.encyclopediaofukraine.com/display.asp?linkpath=pages%5CS%5CH%5CShevchenkoTaras.htm", quote: "Born a serf ... freedom on 5 May 1838 ... arrested on 5 April 1847 ... private in the Orenburg Special Corps ... Finally released from military exile in 1857 (paraphrase)"}
    - {title: "Kyiv Post, Bohdan Nahaylo: Shevchenko and Aldridge", url: "https://www.kyivpost.com/post/14050", quote: "bought Shevchenko out of serfdom (1838) ... 10 years of captivity ... as an ordinary soldier (paraphrase of page)"}
- card: ira-aldridge
  fact: "In the 1860s Aldridge toured Ukrainian cities including Kyiv and Odesa"
  sources:
    - {title: "Internet Encyclopedia of Ukraine: Aldridge, Ira Frederick", url: "http://www.encyclopediaofukraine.com/pages%5CA%5CL%5CAldridgeIraFrederick.htm", quote: "From 1861 to 1866 he toured Kyiv, Kharkiv, Odesa, Zhytomyr, and Yelysavethrad (paraphrase)"}
    - {title: "Kyiv Post, Bohdan Nahaylo", url: "https://www.kyivpost.com/post/14050", quote: "He performed in Kyiv, Odesa, Kharkiv, Poltava, Zhytomyr, and Elizavetgrad (paraphrase)"}

- card: jacobs-garret
  fact: "Born into slavery in Edenton around 1813; had two children with the white lawyer Samuel Sawyer"
  sources:
    - {title: "North Carolina DNCR: Harriet Jacobs (c. 1813–1897)", url: "https://www.dncr.nc.gov/blog/2023/12/04/harriet-jacobs-c-1813-1897-72", quote: "Born in Edenton to enslaved parents ... had two children with attorney Samuel Sawyer (paraphrase)"}
    - {title: "Documenting the American South: summary of Incidents", url: "https://docsouth.unc.edu/fpn/jacobs/summary.html", quote: "a prominent white lawyer named Samuel Treadwell Sawyer ... bore him two children (paraphrase)"}
- card: jacobs-garret
  fact: "In the North she was reunited with her children"
  sources:
    - {title: "Documenting the American South", url: "https://docsouth.unc.edu/fpn/jacobs/summary.html", quote: "eventually reunited with her children there"}
    - {title: "PBS Africans in America: Harriet Jacobs", url: "https://www.pbs.org/wgbh/aia/part4/4p2923.html", quote: "reunited with her daughter, who had in the meantime been sent by her father"}
- card: jacobs-garret
  fact: "In 1852 her employer, Cornelia Willis, bought her freedom"
  sources:
    - {title: "Documenting the American South", url: "https://docsouth.unc.edu/fpn/jacobs/summary.html", quote: "Around 1852, her employer, Cornelia Grinnell Willis, purchased her freedom from the Norcoms."}
    - {title: "North Carolina DNCR", url: "https://www.dncr.nc.gov/blog/2023/12/04/harriet-jacobs-c-1813-1897-72", quote: "She gained her freedom in 1852 (paraphrase)"}
    - {title: "PBS Africans in America", url: "https://www.pbs.org/wgbh/aia/part4/4p2923.html", quote: "became legally free after a friend arranged her purchase (paraphrase)"}
- card: jacobs-garret
  fact: "Her authorship was long doubted and was established only in the 1980s (Jean Fagan Yellin, 1987)"
  sources:
    - {title: "New York Public Library: Harper and Jacobs", url: "https://libguides.nypl.org/african-american-women-writers-of-the-19th-Century/Harper-Jacobs", quote: "It was not until the 1980s that Harriet A. Jacobs's authorship was reestablished."}
    - {title: "North Carolina DNCR", url: "https://www.dncr.nc.gov/blog/2023/12/04/harriet-jacobs-c-1813-1897-72", quote: "Scholars long dismissed the book as fabricated, but Jean Yellin confirmed in 1987 that Jacobs wrote it (paraphrase)"}
- card: jacobs-garret
  fact: "During the Civil War she worked among Black refugees; she died in 1897"
  sources:
    - {title: "PBS Africans in America", url: "https://www.pbs.org/wgbh/aia/part4/4p2923.html", quote: "During the war she used her celebrity to raise money for black refugees."}
    - {title: "New York Public Library", url: "https://libguides.nypl.org/african-american-women-writers-of-the-19th-Century/Harper-Jacobs", quote: "serving as a relief worker during the Civil War"}
    - {title: "Documenting the American South", url: "https://docsouth.unc.edu/fpn/jacobs/summary.html", quote: "died there on March 7, 1897"}

- card: jazz
  fact: "Buddy Bolden was the first king of New Orleans jazz; in 1907 he was committed to the state asylum at Jackson, Louisiana, where he died in 1931"
  sources:
    - {title: "National Park Service, New Orleans Jazz NHP: Charles 'Buddy' Bolden", url: "https://www.nps.gov/jazz/learn/historyculture/bolden.htm", quote: "the undisputed King of black New Orleans music ... committed to the Louisiana State asylum in Jackson ... would reside until his death in 1931"}
