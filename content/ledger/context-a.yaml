    - {title: "Transition (Harvard): A Significant Occurrence, W. E. B. Du Bois, the Paris Exposition and the Banquet", url: "https://transitionmagazine.fas.harvard.edu/a-significant-occurrence-w-e-b-du-bois-the-paris-exposition-and-the-banquet/", quote: "won not only a Grand Prize but also seventeen additional medals of gold, silver, and bronze ... He had won a Grand Prix, a gold medal and a bronze medal"}
    - {title: "New York Review of Books: The Color Line (2021)", url: "https://www.nybooks.com/articles/2021/08/19/du-bois-color-line-paris-exposition/", quote: "Du Bois himself won a gold medal."}
    - {title: "Nightingale: Du Bois's data visualizations, part 1", url: "https://nightingaledvs.com/w-e-b-du-bois-staggering-data-visualizations-are-as-powerful-today-as-they-were-in-1900-part-1/", quote: "was awarded two grand prizes, several gold and silver medals, and 2 honorable mentions"}
- card: emmett-till
  fact: "The trial opened in Sumner on 19 September 1955"
  sources:
    - {title: "NPS: Emmett Till and Mamie Till-Mobley National Monument proclamation", url: "https://www.nps.gov/till/learn/management/presidential-proclamation.htm", quote: "The trial for the murder of Emmett Till began just weeks after his lynching, on September 19, 1955"}
