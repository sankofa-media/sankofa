    - {title: "Buffalo State University Archives: Freedom's Journal", url: "https://library.buffalostate.edu/archives/mfc/freedoms_journal", quote: "following the resignation of Cornish over differences regarding African American colonization of Africa ... Russwurm had begun to promote the colonization movement lead by the American Colonization Society"}
    - {title: "Encyclopedia.com: Freedom's Journal", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/freedoms-journal", quote: "The details are murky, but Cornish left Freedom's Journal in September 1827."}
- card: freedoms-journal
