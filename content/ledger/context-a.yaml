    - {title: "Stanford Encyclopedia of Philosophy", url: "https://plato.stanford.edu/archives/spr2025/entries/18thGerman-preKant/", quote: "On the Impassivity of the Human Mind"}
    - {title: "Wikimedia Commons: title page, Wittenberg 1734 (primary: the Latin title)", url: "https://commons.wikimedia.org/wiki/File:Anton_Wilhelm_Amo_(c._1703_%E2%80%93_c._1759)_-_Dissertatio_inauguralis_philosophica_de_humanae_mentis_apatheia,_Wittenberg,_1734,_title_page.jpg", quote: "Dissertatio inauguralis philosophica de humanae mentis apatheia"}
- card: anthony-johnson
  fact: "A neighbour, Robert Parker, kept Casor; the court found Parker held him unjustly, ordered him returned to Johnson and made Parker pay the costs"
  sources:
    - {title: "Encyclopedia Virginia: Court ruling on Anthony Johnson and his servant (1655)", url: "https://encyclopediavirginia.org/primary-documents/court-ruling-on-anthony-johnson-and-his-servant-1655/", quote: "doe fynde that the said Mr. Robert Parker most unjustly keepeth the said Negro from Anthony Johnson his master ... And that mr. Robert Parker make payment of all charge in the suit."}
    - {title: "Encyclopedia.com: Anthony Johnson", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/johnson-anthony", quote: "the court ruled that Parker had acquired Casor illegally"}
- card: anthony-johnson
  fact: "In the 1660s the Johnsons moved to Somerset County, Maryland, and rented a 300-acre farm"
  sources:
    - {title: "Maryland Public Television, Maryland Roots: Anthony Johnson", url: "https://mdroots.thinkport.org/library/anthonyjohnson.asp", quote: "the Johnsons moved to Somerset County, Maryland around 1665 ... renting a 300 acre plot of land called \"Tonies Vinyard\""}
    - {title: "Encyclopedia.com: Anthony Johnson", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/johnson-anthony", quote: "the entire Johnson family moved to Somerset County, Maryland ... leased a 300-acre plantation"}
    - {title: "Virtual Jamestown: Anthony Johnson", url: "https://www.virtualjamestown.org/ajohnsonRP.html", quote: "In the 1660s, the Johnson clan, searching for more productive land, moved to Somerset County, Maryland."}
- card: anthony-johnson
  fact: "Anthony Johnson died in 1670"
  sources:
    - {title: "Maryland Public Television, Maryland Roots", url: "https://mdroots.thinkport.org/library/anthonyjohnson.asp", quote: "When Anthony Johnson died in 1670, the lease passed to his wife Mary"}
    - {title: "Virtual Jamestown", url: "https://www.virtualjamestown.org/ajohnsonRP.html", quote: "Anthony Johnson died in 1670."}
- card: aro-and-dahomey
  fact: "Ouidah was Dahomey's second town and a major outlet of the trade, where captives were sold in the market square and forced onto ships at the beach"
  sources:
    - {title: "Robin Law: Ouidah, Ohio University Press", url: "https://www.ohioswallow.com/9780821415726/ouidah/", quote: "the second-most-important town of the Dahomey kingdom ... served as a major outlet for the transatlantic slave trade"}
    - {title: "Slavery Monuments: La Porte du Non Retour, Ouidah", url: "https://www.slaverymonuments.org/items/show/1147", quote: "marks the point where African captives were forced onto transatlantic slave ships ... the market square, where enslaved people were once sold"}
- card: aro-and-dahomey
  fact: "In 2024 Benin passed a law offering nationality to people who can trace descent to a sub-Saharan African deported in the slave trade"
  sources:
    - {title: "Republic of Benin: Benin, a land of opportunity for Afro-descendants", url: "https://benin.bj/en/news/benin-a-land-of-opportunity-for-afro-descendants", quote: "July 30, 2024 marks a historic turning point ... anyone whose genealogy reveals a sub-Saharan African ancestor deported during the slave trade"}
    - {title: "Africanews (16 December 2024)", url: "https://www.africanews.com/2024/12/16/benin-grants-citizenship-to-slave-descendants/", quote: "grants citizenship to those who can trace their lineage to the slave trade"}
- card: ashleys-sack
  fact: "Ashley was sold in the 1850s"
  sources:
    - {title: "National Book Foundation: All That She Carried", url: "https://www.nationalbook.org/books/all-that-she-carried-the-journey-of-ashleys-sack-a-black-family-keepsake/", quote: "Rose, an enslaved woman in 1850s South Carolina (paraphrase of the book description)"}
    - {title: "Mark Auslander, Southern Spaces (2016)", url: "https://southernspaces.org/2016/slaverys-traces-search-ashleys-sack/", quote: "There is no specific record of an \"Ashley\" after the 1853 inventory."}
- card: ashleys-sack
  fact: "Rose and Ashley never saw each other again"
  sources:
    - {title: "Central Washington University news (2017)", url: "https://www.cwu.edu/about/media-resources/news/slavery-era-embroidery-excites-historians-evokes-heartbreak-of-its-time", quote: "never saw Ashley again"}
    - {title: "Mark Auslander, Southern Spaces (2016)", url: "https://southernspaces.org/2016/slaverys-traces-search-ashleys-sack/", quote: "the embroidery states that Rose and Ashley never saw each other again (paraphrase)"}
- card: ashleys-sack
  fact: "Ruth Middleton lived in Philadelphia"
  sources:
    - {title: "Mark Auslander, Southern Spaces (2016)", url: "https://southernspaces.org/2016/slaverys-traces-search-ashleys-sack/", quote: "evidently resided for the rest of her life (in Philadelphia)"}
    - {title: "Central Washington University news (2017)", url: "https://www.cwu.edu/about/media-resources/news/slavery-era-embroidery-excites-historians-evokes-heartbreak-of-its-time", quote: "a member of black society in Philadelphia"}
- card: ashleys-sack
  fact: "A shopper at a Tennessee flea market found the sack in a bin of rags and bought the bin for $20"
  sources:
    - {title: "NPR via KENW (2021)", url: "https://www.kenw.org/post/how-cotton-sack-passed-down-over-generations-tells-larger-story-about-slavery", quote: "She found it in Tennessee ... purchased the whole bin of old discarded cloth of rags for $20"}
    - {title: "Mark Auslander, Southern Spaces (2016)", url: "https://southernspaces.org/2016/slaverys-traces-search-ashleys-sack/", quote: "surfaced at a flea market in Springfield, Tennessee in 2007 ... purchased Ashley's Sack for twenty dollars"}
- card: ashleys-sack
  fact: "The sack now belongs to Middleton Place"
  sources:
    - {title: "NPR via KENW (2021)", url: "https://www.kenw.org/post/how-cotton-sack-passed-down-over-generations-tells-larger-story-about-slavery", quote: "the Middleton Place Foundation owns the sack (paraphrase); staff view it as their most important artifact"}
    - {title: "Mark Auslander, Southern Spaces (2016)", url: "https://southernspaces.org/2016/slaverys-traces-search-ashleys-sack/", quote: "decided to transfer it to the Middleton Place historic house museum near Charleston"}
- card: ashleys-sack
  fact: "In 2021 Tiya Miles won the National Book Award for nonfiction with All That She Carried"
  sources:
    - {title: "National Book Foundation", url: "https://www.nationalbook.org/books/all-that-she-carried-the-journey-of-ashleys-sack-a-black-family-keepsake/", quote: "Winner, 2021 National Book Award for Nonfiction"}
    - {title: "American Historical Association (2021)", url: "https://www.historians.org/news/aha-member-wins-2021-national-book-award/", quote: "AHA member Tiya Miles (Harvard Univ.) has been awarded the 2021 National Book Award for Nonfiction"}
- card: bamum
  fact: "The French deported Njoya to Yaoundé, where he died in exile on 30 May 1933"
  sources:
    - {title: "Kenneth J. Orosz, Njoya's Alphabet, Cahiers d'études africaines 217 (2015)", url: "https://journals.openedition.org/etudesafricaines/18002", quote: "Marchand had him arrested and sent into exile in Yaoundé where he died two years later on May 30, 1933."}
    - {title: "African Studies Centre Leiden: Ibrahim Njoya", url: "https://www.ascleiden.nl/content/library-weekly/ibrahim-njoya", quote: "terminated his reign by deporting him to Yaoundé ... On 30 May 1933, Sultan Ibrahim Njoya ... died in exile in Yaoundé at the age of 66"}
- card: bamum
  fact: "Documents in the script are kept in the palace archives in Foumban and have been digitised (British Library Endangered Archives Programme)"
  sources:
    - {title: "British Library, EAP051/1/2/1008", url: "https://searcharchives.bl.uk/catalog/040-002762330", quote: "The original materials are held at the Archives du Palais des Rois Bamum ... Digital copies can be viewed online"}
    - {title: "Kenneth J. Orosz (2015)", url: "https://journals.openedition.org/etudesafricaines/18002", quote: "to preserve and eventually digitize records kept in the palace archive and private hands"}
- card: chicago-defender
  fact: "The Defender was a weekly; its founder Robert S. Abbott was a Georgia-born lawyer"
  sources:
    - {title: "New Georgia Encyclopedia: Robert Sengstacke Abbott", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/robert-sengstacke-abbott-1868-1940/", quote: "In 1905 he founded the Chicago Defender, a weekly newspaper that soon dominated Chicago's already crowded Black press."}
    - {title: "Joshua Botkin, Encyclopedia of African-American Culture and History via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chicago-defender", quote: "The Chicago Defender was founded in 1905 by Robert Sengstacke Abbott, a journalist and lawyer from Georgia."}
- card: chicago-defender
  fact: "Circulation reached 125,000 by 1918"
  sources:
    - {title: "New Georgia Encyclopedia: Robert Sengstacke Abbott", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/robert-sengstacke-abbott-1868-1940/", quote: "circulation reached 50,000 by 1916; 125,000 by 1918; and more than 200,000 by the early 1920s"}
    - {title: "Encyclopedia.com: Chicago Defender", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chicago-defender", quote: "climbing from 33,000 in 1916 to 125,000 in 1918"}
- card: chicago-defender
  fact: "Abbott died in 1940 and left the paper to his nephew John Sengstacke"
  sources:
    - {title: "New Georgia Encyclopedia: Robert Sengstacke Abbott", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/robert-sengstacke-abbott-1868-1940/", quote: "Abbott died in Chicago on February 29, 1940, of Bright's disease ... designated his Savannah-born nephew John H. Sengstacke his successor"}
    - {title: "Encyclopedia.com: Chicago Defender", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chicago-defender", quote: "In 1939, the year before he died, Abbott passed control of the paper to his nephew John Sengstacke."}
- card: chicago-defender
  fact: "The last print edition came out on 10 July 2019; the Defender continued online only"
  sources:
    - {title: "NPR via WFAE (10 July 2019): Chicago Defender ends print edition to continue as an online-only newspaper", url: "https://www.wfae.org/2019-07-10/chicago-defender-ends-print-edition-to-continue-as-an-online-only-newspaper", quote: "after today, the paper is online only"}
    - {title: "ABC7 Chicago (2019): Chicago Defender goes digital after 114 years in print", url: "https://abc7chicago.com/post/chicago-defender-goes-digital-after-114-years-in-print/5388018/", quote: "Wednesday's edition of the Chicago Defender is the last one available in print."}
- card: chicago-defender
  fact: "Historians count the Defender among the forces behind the Great Migration"
  sources:
    - {title: "New Georgia Encyclopedia: Robert Sengstacke Abbott", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/robert-sengstacke-abbott-1868-1940/", quote: "The Defender considerably influenced the Great Migration."}
    - {title: "NPR via WFAE (2019)", url: "https://www.wfae.org/2019-07-10/chicago-defender-ends-print-edition-to-continue-as-an-online-only-newspaper", quote: "Black Southerners by the tens of thousands harkened to Abbott's call to go north."}
    - {title: "ABC7 Chicago (2019)", url: "https://abc7chicago.com/post/chicago-defender-goes-digital-after-114-years-in-print/5388018/", quote: "The Chicago Defender was an instrumental part of the black migration."}

- card: chicago-house
  fact: "At Disco Demolition the crowd stormed the field and the second game of the doubleheader was never played"
  sources:
    - {title: "SABR Games Project: July 12, 1979, Disco Demolition Night doubleheader results in loss and forfeit", url: "https://sabr.org/gamesproj/game/july-12-1979-chicagos-disco-demolition-night-doubleheader-results-in-loss-and-forfeit/", quote: "spectators already in Comiskey Park stormed the field with little resistance ... The only option for the White Sox was to forfeit the second game of the doubleheader."}
    - {title: "Aeon: The night when straight white males tried to kill disco", url: "https://aeon.co/ideas/the-night-when-straight-white-males-tried-to-kill-disco", quote: "A little more than an hour after it was scheduled to begin, the second game was postponed due to unsafe conditions."}
    - {title: "Chicagoist (2016): Disco Demolition", url: "https://www.chicagoist.com/2016/07/12/disco_demolition.php", quote: "a massive rush onto the field by a large portion of the estimated 50,000 attendees"}
- card: chicago-house
  fact: "Frankie Knuckles died in 2014"
  sources:
    - {title: "DNAinfo Chicago (1 April 2014): Frankie Knuckles dead", url: "https://www.dnainfo.com/chicago/20140401/downtown/frankie-knuckles-dead-godfather-of-house-music-dies-at-59-reports-say", quote: "died unexpectedly at his home Monday afternoon at the age of 59"}
    - {title: "NBC Chicago (2023): The Warehouse designated a Chicago Landmark", url: "https://www.nbcchicago.com/news/local/the-warehouse-birthplace-of-house-music-designated-a-chicago-landmark/3166059/", quote: "He passed away in 2014."}
- card: chicago-house
  fact: "In 2023 Chicago made the Warehouse building a city landmark"
  sources:
    - {title: "Windy City Times (22 June 2023)", url: "https://windycitytimes.com/2023/06/22/chicago-city-council-approves-landmark-status-for-the-warehouse-building/", quote: "On June 21, the Chicago City Council, among other things, approved landmark status for The Warehouse building."}
    - {title: "NBC Chicago (21 June 2023): The Warehouse, birthplace of 'House' music, designated a Chicago Landmark", url: "https://www.nbcchicago.com/news/local/the-warehouse-birthplace-of-house-music-designated-a-chicago-landmark/3166059/", quote: "The Warehouse, birthplace of 'House' music, designated a Chicago Landmark (headline; published June 21, 2023)"}

- card: cindy-campbell
  fact: "The room was packed"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "While the large turnout of their peers ensured Cindy would start the school year donning the latest fashions"}
    - {title: "Kristen Gallerneaux, The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "The two siblings gave out hand-drawn index cards as invitations and packed the room."}
- card: cindy-campbell
  fact: "Herc saw dancers waiting for drum breaks, played two copies of the same record to stretch the break, and called it the merry-go-round"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "I had two copies of the same record ... He called his distinctive approach the merry-go-round"}
    - {title: "HISTORY: Hip-hop is born at a party in the Bronx", url: "https://www.history.com/this-day-in-history/hip-hop-is-born-at-a-birthday-party-in-the-bronx", quote: "used to wait for particular parts of the record to dance ... He called his trick the Merry-Go-Round."}
- card: cindy-campbell
  fact: "Within months the parties outgrew the room and moved outdoors to Bronx parks such as Cedar Park"
  sources:
    - {title: "GRAMMY.com: DJ Kool Herc and Cindy Campbell interview", url: "https://www.grammy.com/news/dj-kool-herc-cindy-campbell-50th-anniversary-of-hip-hop-interview-jamaican-roots", quote: "By the end of 1973, the recreation room couldn't accommodate the size of the crowds attending Herc's parties, so he and Coke La Rock moved their sessions to parks and clubs throughout the Bronx."}
    - {title: "KEXP, 50 Years of Hip-Hop: 1974, the Cedar Park jams", url: "https://kexp.org/podcasts/50-years-of-hip-hop/2023/12/20/1974-the-cedar-park-jams/", quote: "DJ Kool Herc's parties became so popular that they outgrew his apartment on Sedgwick Avenue. So, Herc decided to relocate the parties down the street to Cedar Park."}
- card: cindy-campbell
  fact: "Herc's stretched breaks, later called breakbeats, became one of the foundations of the music"
  sources:
    - {title: "The Henry Ford: From a DJ's Closet", url: "https://www.thehenryford.org/collections/explore/articles/from-a-djs-closet", quote: "Herc cued and repeated percussion \"breaks\" in soul and funk music to extend the high-energy moments dancers craved (leading to the \"breakbeat\")"}
    - {title: "HISTORY: Hip-hop is born at a party in the Bronx", url: "https://www.history.com/this-day-in-history/hip-hop-is-born-at-a-birthday-party-in-the-bronx", quote: "would begin a grassroots musical revolution, fully six years before the term 'hip-hop' even entered the popular vocabulary"}

- card: claudia-jones
  fact: "Convicted under the Smith Act in the McCarthy years"
  sources:
    - {title: "Verso Books Encyclopedia: Jones, Claudia", url: "https://www.versobooks.com/pages/encyclopedia/jones-claudia", quote: "On June 20, 1951, Jones was arrested a third time, along with sixteen other Party members, and charged under the Smith Act."}
    - {title: "Harvard Magazine (2020): Claudia Jones", url: "https://www.harvardmagazine.com/index%2ephp/2020/08/features-vita-claudia-jones", quote: "In the second major Smith Act trial, in 1953"}
- card: claudia-jones
  fact: "She served a sentence of a year and a day in the women's prison at Alderson, West Virginia"
  sources:
    - {title: "Donald Hinds, Claudia Jones and the 'West Indian Gazette', Race & Class (2008)", url: "https://www.marxists.org/history/erol/uk.secondwave/jones-gazette.pdf", quote: "Claudia began her sentence of a year and a day at the Federal Reformatory for Women at Alderson, West Virginia."}
    - {title: "Verso Books Encyclopedia: Jones, Claudia", url: "https://www.versobooks.com/pages/encyclopedia/jones-claudia", quote: "She was sentenced to one year and one day in prison and a $2000 fine. ... Jones was remanded to a segregated women's prison in Alderson, West Virginia."}
- card: claudia-jones
  fact: "The BBC televised part of the January 1959 carnival"
  sources:
    - {title: "Hinds, Race & Class (2008)", url: "https://www.marxists.org/history/erol/uk.secondwave/jones-gazette.pdf", quote: "it was held in St Pancras town hall in January 1959. The BBC televised it."}
    - {title: "Vauxhall History: Claudia Jones", url: "https://vauxhallhistory.org/claudia-jones/", quote: "The first carnival was held in January 1959 at St Pancras Town Hall (televised by the BBC under the slogan 'A people's art is the genesis of their freedom')"}
- card: claudia-jones
  fact: "The indoor carnivals ran every year until her death"
  sources:
    - {title: "English Heritage: Claudia Jones blue plaque", url: "https://www.english-heritage.org.uk/visit/blue-plaques/claudia-jones/", quote: "The indoor carnivals became an annual occurrence for the rest of her life."}
    - {title: "Hinds, Race & Class (2008)", url: "https://www.marxists.org/history/erol/uk.secondwave/jones-gazette.pdf", quote: "Five more carnivals followed annually, up to 1964."}
- card: claudia-jones
  fact: "She died in December 1964, at 49"
  sources:
    - {title: "English Heritage: Claudia Jones", url: "https://www.english-heritage.org.uk/visit/blue-plaques/claudia-jones/", quote: "She died of a heart attack at home in Belsize Park in December 1964."}
    - {title: "Vauxhall History: Claudia Jones", url: "https://vauxhallhistory.org/claudia-jones/", quote: "Jones died of her chronic illnesses in north London in December 1964 at the age of 49."}
    - {title: "Verso Books Encyclopedia", url: "https://www.versobooks.com/pages/encyclopedia/jones-claudia", quote: "She died on Christmas Eve 1964, two months before her fiftieth birthday."}
- card: claudia-jones
  fact: "The West Indian Gazette folded eight months after her death"
  sources:
    - {title: "Hinds, Race & Class (2008)", url: "https://www.marxists.org/history/erol/uk.secondwave/jones-gazette.pdf", quote: "The paper finally folded eight months and four editions after Claudia's own death, in December 1964."}
    - {title: "Vauxhall History: Claudia Jones", url: "https://vauxhallhistory.org/claudia-jones/", quote: "The Gazette closed in 1965, eight months after Jones's death."}
- card: claudia-jones
  fact: "The Notting Hill Carnival became a London institution and still runs today"
  sources:
    - {title: "Vauxhall History: Claudia Jones", url: "https://vauxhallhistory.org/claudia-jones/", quote: "is now held yearly over the August bank holiday weekend in the streets of Notting Hill and Kensington ... it developed into a London cultural institution"}
    - {title: "Harvard Magazine (2020): Claudia Jones", url: "https://www.harvardmagazine.com/index%2ephp/2020/08/features-vita-claudia-jones", quote: "A 1959 fundraiser for the paper became London's first Caribbean Carnival, now known as the Notting Hill Carnival (paraphrase of the article)"}

- card: clotilda
  fact: "Timothy Meaher had wagered that he could smuggle a cargo of captives into Mobile Bay"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "Timothy Meaher ... wagered that he could smuggle a ship carrying enslaved people into Mobile Bay."}
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Meaher made a bold wager: He would bring a cargo of African captives into Mobile"}
- card: clotilda
  fact: "The authorities learned of the voyage, but Meaher was never punished; only Foster paid a fine"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "Timothy Meaher, William Foster, and John Dabney later faced legal action, but the only punishment meted out was a $1,000 fine levied against Foster"}
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Timothy Meaher was arrested, released on bail, tried, and cleared of all charges."}
    - {title: "Equal Justice Initiative: The Clotilda", url: "https://eji.org/?p=17839", quote: "found conclusive evidence of the men's illegal trafficking ... a pro-slavery judge refused to indict them"}
- card: clotilda
  fact: "After emancipation the survivors saved to return to Africa but could not raise enough"
  sources:
    - {title: "Encyclopedia of Alabama: Cudjo Lewis", url: "https://encyclopediaofalabama.org/?p=15143", quote: "when they failed to raise enough money for the trip, they decided to stay in Alabama"}
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "they saved all they could, longing to return home, but it was not enough"}
    - {title: "Alabama Historical Commission: Clotilda", url: "https://ahc.alabama.gov/clotilda.aspx", quote: "with the hopes of returning to Africa"}
- card: clotilda
  fact: "Kossola asked Meaher for land to build an African Town; Meaher refused, and they bought land from him and others"
  sources:
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Why don't you give us a piece of this land and let us build for ourselves an African Town?"}
    - {title: "Encyclopedia of Alabama: Cudjo Lewis", url: "https://encyclopediaofalabama.org/?p=15143", quote: "Meaher refused their demand, and they purchased land from him and others."}
- card: clotilda
  fact: "Kossola (Cudjo Lewis) died in 1935"
  sources:
    - {title: "Encyclopedia of Alabama: Cudjo Lewis", url: "https://encyclopediaofalabama.org/?p=15143", quote: "Cudjo Lewis died of age-related illness on July 26, 1935, at about 94."}
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Kossola died in 1935, Redoshi the following year."}
- card: clotilda
  fact: "Many descendants still live in Africatown"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "many descendants—some into the fifth generation—still live in the community, now known as Africatown"}
    - {title: "National Geographic: Clotilda", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Many of their descendants still live there today."}

- card: combahee-raid
  fact: "Tubman had escaped slavery in Maryland and become a well-known Underground Railroad conductor"
  sources:
    - {title: "NPS: We Called Ourselves Combee", url: "https://www.nps.gov/articles/000/we-called-ourselves-combee.htm", quote: "She was born enslaved in Maryland and liberated herself through escape ... became a well-known conductor on the Underground Railroad before the Civil War."}
    - {title: "National Archives: Harriet Tubman", url: "https://www.archives.gov/research/african-americans/individuals/harriet-tubman", quote: "would return to Maryland many times to recover her family and reunite them in freedom"}
- card: combahee-raid
  fact: "In 1863 she worked as a spy and scout for the army at Beaufort and learned from escapees where the river was mined; she guided the boats past the mines"
  sources:
    - {title: "American Battlefield Trust: Civil War Irregular Operations", url: "https://www.battlefields.org/learn/articles/civil-war-irregular-operations", quote: "Tubman gained important information about the location of mines ... Tubman guided them past treacherous mines"}
    - {title: "Carnegie Mellon University News (2024)", url: "https://www.cmu.edu/news/stories/archives/2024/March/harriet-tubman-legacy", quote: "The Combahee River Raid was based on intelligence Tubman gathered as a spy for the U.S. Army Department of the South."}
    - {title: "NPS: We Called Ourselves Combee", url: "https://www.nps.gov/articles/000/we-called-ourselves-combee.htm", quote: "she volunteered to move to Beaufort ... soon pursued intelligence and scouting roles (paraphrase)"}
- card: combahee-raid
  fact: "Soldiers burned plantation houses and rice mills; the gunboats' cannon drove off a Confederate attack"
  sources:
    - {title: "NPS: We Called Ourselves Combee", url: "https://www.nps.gov/articles/000/we-called-ourselves-combee.htm", quote: "the soldiers under Montgomery's command destroyed the plantation owners' homes, rice mills, cotton gin, and a sawmill ... Confederates attacked, but the Harriet A. Weed opened cannon fire on them, scattering the soldiers."}
    - {title: "American Battlefield Trust", url: "https://www.battlefields.org/learn/articles/civil-war-irregular-operations", quote: "plantations, mills and outbuildings were in flames ... Union gunboats quickly repelled a later Confederate artillery attack (paraphrase)"}
- card: combahee-raid
  fact: "Many of the freed men enlisted in the 2nd South Carolina Volunteers"
  sources:
    - {title: "NPS: We Called Ourselves Combee", url: "https://www.nps.gov/articles/000/we-called-ourselves-combee.htm", quote: "Tubman helped recruit more than 150 Combahee River freedom seekers to join the 2nd South Carolina Volunteers (34th USCT)."}
    - {title: "Carnegie Mellon University News (2024)", url: "https://www.cmu.edu/news/stories/archives/2024/March/harriet-tubman-legacy", quote: "the Combahee men who enlisted in the Second South Carolina Volunteers after the raid"}
- card: combahee-raid
  fact: "Tubman sought pay for decades; in 1899 Congress raised her pension to $20 a month, without recognizing her scouting or the raid"
  sources:
    - {title: "National Archives, Center for Legislative Archives: The Claim of Harriet Tubman", url: "https://www.archives.gov/legislative/features/claim-of-harriet-tubman", quote: "In 1899 Congress passed, and the President signed, H.R. 4982 ... authorized an increase of Tubman's pension to twenty dollars per month for her service as a nurse."}
    - {title: "Government Executive (2021): Harriet Tubman's three-decade battle for a federal pension", url: "https://www.govexec.com/pay-benefits/2021/06/harriet-tubmans-three-decade-battle-federal-pension/174812/", quote: "was granted an increase in her widow's pension to $20 a month ... with no recognition of her own service and accomplishments"}
- card: combahee-raid
  fact: "The Combahee River Collective's 1977 statement introduced the phrase 'identity politics'"
  sources:
    - {title: "Massachusetts Women's History: Combahee River Collective", url: "https://www.mawomenshistory.org/resources/articles/combahee-river-collective-pioneers-intersectional-feminism", quote: "the most profound and potentially most radical politics come directly out of our own identity (the statement that introduced the term)"}
    - {title: "WBUR (2019)", url: "https://www.wbur.org/news/2019/06/10/boston-combahee-river-collective-intersectional-black-feminism", quote: "In 1977, the collective released the Combahee River Collective Statement ... their use of the term \"identity politics.\""}

- card: cowries
  fact: "Ships carried cowries to West Africa by the million"
  sources:
    - {title: "François-Xavier Fauvelle, Shell Money (Cambridge Elements)", url: "https://www.cambridge.org/core/elements/shell-money/59F5D361C6CA7C596A8C168C84A960D0", quote: "Importing millions of cowries by sea in the hulls of European ships caused the rapid devaluation of the cowrie in West Africa."}
    - {title: "Justine Wintjes, The Conversation via Daily Maverick (2021)", url: "https://www.dailymaverick.co.za/article/2021-09-28-small-seashells-tell-a-big-story-of-slavery-and-transoceanic-trade-500-years-ago/", quote: "billions of money cowries from the Indian Ocean were shipped to the Bight of Benin"}
- card: cowries
  fact: "So many shells arrived that the cowrie lost much of its value"
  sources:
    - {title: "Fauvelle, Shell Money", url: "https://www.cambridge.org/core/elements/shell-money/59F5D361C6CA7C596A8C168C84A960D0", quote: "Over the course of the eighteenth century, the cowrie depreciated in value by some 75 percent"}
    - {title: "Bank of England Museum: Slavery and the Bank, large-print guide, p. 47", url: "https://www.bankofengland.co.uk/-/media/boe/files/museum/slavery-and-the-bank-large-print-guide", quote: "With cowrie shells flooding the local economy and the mass export of gold and silver from the country, the West African economy was de-valued"}
- card: cowries
  fact: "Colonial governments tried to ban cowries as money, yet they were still used for small purchases into the twentieth century"
  sources:
    - {title: "Fauvelle, Shell Money", url: "https://www.cambridge.org/core/elements/shell-money/59F5D361C6CA7C596A8C168C84A960D0", quote: "Several colonial governments attempted to prohibit the use of cowries as money in favor of national currencies, but results were mixed, with cowries still being used for small transactions into the middle of the twentieth century."}
    - {title: "Citéco: Cowries", url: "https://citeco.fr/en/cowries-", quote: "The cowry continued to play its monetary role until the 20th century."}
    - {title: "Conchological Society: Shell money", url: "http://www.conchsoc.org/interests/shell-money.php", quote: "During the 19th century the increasing use of metals coins led to the relatively rapid decline in the cowry trade."}

- card: crazy-blues
  fact: "Crazy Blues was the first blues record by an African American singer"
  sources:
    - {title: "Ballad of America: Blues queens and race records", url: "https://balladofamerica.org/blues-queens-and-race-records-in-the-1920s/", quote: "It was the first blues record released by an African American singer."}
    - {title: "Ed Komara, Library of Congress National Recording Registry essay", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/CrazyBlues.pdf", quote: "The breakthrough record by an African American performer came in November 1920, with the release of Mamie Smith's performance of \"Crazy Blues\" on OKeh Records."}
- card: crazy-blues
  fact: "Bradford pestered record companies until OKeh agreed; her first session, in February 1920, did well enough for a follow-up"
  sources:
    - {title: "LoC essay (Komara)", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/CrazyBlues.pdf", quote: "encouraged Bradford to pester recording firms to record her ... He scheduled a recording session in February 1920 ... The resulting release on OKeh 4113 were encouraging enough for Hager to record Smith in a blues for the follow-up session."}
    - {title: "Ballad of America", url: "https://balladofamerica.org/blues-queens-and-race-records-in-the-1920s/", quote: "Okeh issued them, and sales numbers showed promise."}
    - {title: "David Jansen, Perry Bradford Story, Smithsonian Folkways liner notes FJ 2863", url: "https://folkways-media.si.edu/docs/folkways/artwork/FW02863.pdf", quote: "For almost two years, Perry waged a one-man campaign to get the major record companies ... record female Blues singers"}
- card: crazy-blues
  fact: "The Jazz Hounds were a band of Black musicians"
  sources:
    - {title: "LoC essay (Komara)", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/CrazyBlues.pdf", quote: "on August 10, 1920, Mamie Smith with a group of African American musicians recorded \"Crazy Blues\""}
    - {title: "Smithsonian Folkways liner notes FJ 2863", url: "https://folkways-media.si.edu/docs/folkways/artwork/FW02863.pdf", quote: "to record Mamie with more of his songs, backed by a five-piece black jazz band"}
- card: crazy-blues
  fact: "For the rest of the 1920s companies hurried to record Black women singing the blues"
  sources:
    - {title: "LoC essay (Komara)", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/CrazyBlues.pdf", quote: "igniting the women blues singers trend across the recording industry through the end of the 1920s"}
    - {title: "Ballad of America", url: "https://balladofamerica.org/blues-queens-and-race-records-in-the-1920s/", quote: "Bradford's experiment was an overwhelming success, awakening the entertainment industry to a vast potential market."}
- card: crazy-blues
  fact: "Mamie Smith died poor on Staten Island in 1946 and was buried in an unmarked grave"
  sources:
    - {title: "LoC essay (Komara)", url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/CrazyBlues.pdf", quote: "She died on August 16, 1946, poor enough to have been buried in a communal grave."}
    - {title: "CBS New York: Effort under way to honor NYC blues singer Mamie Smith", url: "https://www.cbsnews.com/newyork/news/effort-underway-to-honor-nyc-blues-singer-mamie-smith/", quote: "When she died on Staten Island at the age of 63, Smith was poor, and she ended up being buried in an unmarked mass grave at Frederick Douglass Memorial Park."}

- card: dave-the-potter
  fact: "Dave wrote at a time when the law forbade enslaved people to read and write"
  sources:
    - {title: "Smithsonian American Art Museum: David Drake", url: "https://americanart.si.edu/node/66211", quote: "South Carolina outlawed literacy among its enslaved population"}
    - {title: "University of Michigan LSA Magazine: A History Carved in Stoneware", url: "https://prod.lsa.umich.edu/lsa/news-events/lsa-magazine/lsa-magazine-archive/Fall-2023/a-history-carved-in-stoneware.html", quote: "at a time when it was forbidden for enslaved people to read and write"}
- card: dave-the-potter
  fact: "In December 1834 South Carolina passed harsher anti-literacy codes"
  sources:
    - {title: "Antiques and the Arts Weekly: Hear Me Now", url: "https://www.antiquesandthearts.com/hear-me-now-the-black-potters-of-old-edgefield-south-carolina/", quote: "South Carolina's passing of more punitive antiliteracy codes in December 1834"}
    - {title: "Smithsonian American Art Museum: David Drake", url: "https://americanart.si.edu/node/66211", quote: "in 1834, South Carolina outlawed literacy among its enslaved population, in response to possible organized uprisings (paraphrase with quoted core)"}
- card: dave-the-potter
  fact: "His own family had been sold away from him"
  sources:
    - {title: "University of Michigan LSA Magazine", url: "https://prod.lsa.umich.edu/lsa/news-events/lsa-magazine/lsa-magazine-archive/Fall-2023/a-history-carved-in-stoneware.html", quote: "his wife and children were sold and sent to Louisiana"}
    - {title: "Antiques and the Arts Weekly", url: "https://www.antiquesandthearts.com/hear-me-now-the-black-potters-of-old-edgefield-south-carolina/", quote: "a reference, perhaps, to the sale of Dave's family to a planter 500 miles distant"}
- card: dave-the-potter
  fact: "He took the surname of a former enslaver, Drake"
  sources:
    - {title: "Antiques and the Arts Weekly", url: "https://www.antiquesandthearts.com/hear-me-now-the-black-potters-of-old-edgefield-south-carolina/", quote: "upon emancipation took the surname of one of his former enslavers, Drake"}
    - {title: "University of Michigan LSA Magazine", url: "https://prod.lsa.umich.edu/lsa/news-events/lsa-magazine/lsa-magazine-archive/Fall-2023/a-history-carved-in-stoneware.html", quote: "was owned by the Drake family, from which his surname derives"}
- card: dave-the-potter
  fact: "He was still alive in 1870 and died in the 1870s"
  sources:
    - {title: "Smithsonian American Art Museum: David Drake", url: "https://americanart.si.edu/node/66211", quote: "ca. 1800–after 1870"}
    - {title: "Associated Press via News Tribune (2025)", url: "https://www.newstribune.com/news/2025/nov/21/descendants-obtain-works-of-enslaved-potter-in/", quote: "He appears in the 1870 census but not the 1880 census; researchers believe he died in the 1870s (paraphrase)"}
    - {title: "SCIWAY: Dave the slave potter", url: "https://www.sciway.net/afam/dave-slave-potter.html", quote: "remained in Edgefield District, where he lived among a family-colony until his death sometime during the 1870s"}
- card: dave-the-potter
  fact: "The family sold one of the two returned jars back to the MFA and lent it the other"
  sources:
    - {title: "WBUR (2025): MFA resolves ownership for vessels by enslaved potter David Drake", url: "https://www.wbur.org/news/2025/10/29/mfa-resolves-ownership-for-vessels-by-enslaved-potter-david-drake", quote: "has returned two monumental stoneware vessels to the descendants ... repurchased \"Poem Jar\" ... lent \"Signed Jar\" to the museum under a long-term agreement (paraphrase)"}
    - {title: "Associated Press via News Tribune (2025)", url: "https://www.newstribune.com/news/2025/nov/21/descendants-obtain-works-of-enslaved-potter-in/", quote: "they sold one back so people can continue to learn from Dave's legacy ... The other is on lease to the museum, at least temporarily."}

- card: detroit-techno
  fact: "Since 2000 Detroit has held an annual electronic music festival, now called Movement, on Memorial Day weekend"
  sources:
    - {title: "Detroit Historical Society: Flashback 2002, Detroit Electronic Music Festival", url: "https://www.detroithistorical.org/learn/online-research/blog/flashback-2002-detroit-electronic-music-festival", quote: "In 2000, the city held the first annual Detroit Electronic Music Festival ... later re-structured and re-branded as Movement"}
    - {title: "Michigan Public (2026): Juan Atkins obituary", url: "https://www.michiganpublic.org/news/2026-11-02/juan-atkins-obituary-detroit-techno", quote: "is celebrated each Memorial Day weekend at Movement Electronic Music Festival"}
- card: detroit-techno
  fact: "Atkins died in 2026 aged 64"
  sources:
    - {title: "Michigan Public (2 November 2026)", url: "https://www.michiganpublic.org/news/2026-11-02/juan-atkins-obituary-detroit-techno", quote: "Detroit techno godfather Juan Atkins died over the weekend. He was 64."}
    - {title: "NPR Illinois (2 November 2026): Remembering Juan Atkins", url: "https://www.nprillinois.org/2026-11-02/remembering-juan-atkins-known-as-the-originator-of-techno", quote: "Juan Atkins died in Mexico City on Saturday. He was 64 years old."}
