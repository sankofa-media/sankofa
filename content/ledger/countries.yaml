# Sources for the country headers in content/countries.yaml (about.en / about.ru).
# Every fact in a header has two independent authoritative sources that were
# opened, each with a short verbatim quote. Researched 2026-11-14; every quote
# was then re-downloaded and matched against the page text (PDF text for PDFs;
# journals.openedition.org via web.archive.org). Britannica and UNESCO World
# Heritage pages refused automated access, so they are not cited here.
# Wikipedia is not cited. "dropped" lists facts left out for want of a second source.
entries:
- country: mali
  fact: The Mali Empire was founded by Sundiata Keita in the 13th century.
  sources:
  - title: 'National Geographic Education: The Mali Empire'
    url: https://education.nationalgeographic.org/resource/mali-empire/
    quote: From the 13th to 17th century, West Africa was home to the great Mali Empire.
  - title: 'OpenStax (Rice University), World History Vol. 1: 15.2 Medieval Sub-Saharan
      Africa'
    url: https://openstax.org/books/world-history-volume-1/pages/15-2-medieval-sub-saharan-africa
    quote: Sosso Kingdom was short-lived; it was defeated by Sundiata Keita in 1235.
- country: mali
  fact: Under the Mali Empire, Timbuktu became a centre of Islamic learning.
  sources:
  - title: 'National Geographic Education: The Mali Empire'
    url: https://education.nationalgeographic.org/resource/mali-empire/
    quote: Mali included the city of Timbuktu, which became known as an important
      center of knowledge.
  - title: 'OpenStax (Rice University), World History Vol. 1: 15.1 Culture and Society
      in Medieval Africa'
    url: https://openstax.org/books/world-history-volume-1/pages/15-1-culture-and-society-in-medieval-africa
    quote: Fourteenth-century Timbuktu was a great center of learning specializing
      in Islamic law, philosophy, and science.
- country: mali
