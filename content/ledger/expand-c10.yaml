    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "se refugiaron en la ciénaga de La Matuna, al sur de Tolú, defendieron su poblado con una empalizada"}
    - {title: "Banco de la República, Enciclopedia: Benkos Biohó (archived)", url: "https://web.archive.org/web/2023/https://enciclopedia.banrepcultural.org/index.php?title=Benkos_Bioh%C3%B3", quote: "un palenque muy grande en las márgenes de la ciénaga la Matuna"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "eventually formed the palenque La Matuna"}
- card: benkos-bioho
  fact: "They raided estates and cattle herds"
  sources:
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "atrajeron a nuevos fugitivos y atacaron haciendas desde Turbaco hasta Mompox"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "From their fortified camps, they sallied forth to rustle cattle"}
    - {title: "Banco de la República, Enciclopedia: Benkos Biohó (archived)", url: "https://web.archive.org/web/2023/https://enciclopedia.banrepcultural.org/index.php?title=Benkos_Bioh%C3%B3", quote: "sus actos vandálicos contra los hacendados infundían terror en la provincia"}
- card: benkos-bioho
