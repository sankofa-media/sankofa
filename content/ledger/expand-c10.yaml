    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "The former slaves promised to return any new escapees"}
