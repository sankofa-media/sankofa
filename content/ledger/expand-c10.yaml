- card: benkos-bioho
  fact: "He came from the Bijagós Islands, today Guinea-Bissau"
  sources:
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "procedente de las islas Bijagós, hoy parte de la República de Guinea-Bisáu"}
    - {title: "Omar H. Ali, African and Afro-Indian Rebel Leaders in Latin America, ReVista, Harvard DRCLAS (2018)", url: "https://revista.drclas.harvard.edu/african-and-afro-indian-rebel-leaders-in-latin-america", quote: "Captured in Guinea-Bissau, West Africa, in 1596"}
