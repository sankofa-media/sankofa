    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "the French expedition to recapture Saint-Domingue"}
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "Louverture had been apprehended by French colonial authorities and transported to the remote confines of Fort de Joux in the French Alps"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "resulted in the French abduction of the Haitian revoluionary leader, Toussaint Louverture"}
