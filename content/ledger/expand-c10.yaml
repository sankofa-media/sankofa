  sources:
    - {title: "Omar H. Ali, African and Afro-Indian Rebel Leaders in Latin America, ReVista, Harvard DRCLAS (2018)", url: "https://revista.drclas.harvard.edu/african-and-afro-indian-rebel-leaders-in-latin-america", quote: "Over the next two hundred years, successive waves of maroons in New Grenada included many who took Biohó‘s name, or variations thereof, as a title. The name ‘Biohó’ had effectively become synonymous with African resistance"}
