    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "the historical documentation suggests only that San Basilio was created by fugitive slaves"}
- card: san-basilio-de-palenque
  fact: "UNESCO inscribed its cultural space in 2008"
