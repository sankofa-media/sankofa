  sources:
    - {title: "Banco de la República, Enciclopedia: Benkos Biohó (archived)", url: "https://web.archive.org/web/2023/https://enciclopedia.banrepcultural.org/index.php?title=Benkos_Bioh%C3%B3", quote: "tal como en 1605, cuando hubo un ataque infructuoso al Palenque de la Matuna por parte de las autoridades españolas quienes, al no derrotar a los negros sublevados, reconocieron el liderazgo de Biohó"}
    - {title: "Encyclopaedia Britannica: San Basilio de Palenque", url: "https://www.britannica.com/place/San-Basilio-de-Palenque", quote: "In 1605 the governor of Cartagena offered a peace agreement recognizing a degree of autonomy for the community"}
