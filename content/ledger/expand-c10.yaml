- card: san-basilio-de-palenque
  fact: "It has its own funeral rites"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "The complex funeral rituals and medical practices"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "rituals such as weddings and deaths are enacted"}
- card: san-basilio-de-palenque
  fact: "The village claims Benkos Biohó as founder though documents do not prove the link"
  sources:
