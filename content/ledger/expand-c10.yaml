    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "The first documentary references to San Basilio date from 1713"}
- card: benkos-bioho
  fact: "Cartagena was the chief port of entry for enslaved Africans into Spanish South America"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "Cartagena de Indias, the most important port of entry for enslaved Africans arriving into Hispanic South America"}
