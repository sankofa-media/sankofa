- card: san-basilio-de-palenque
  fact: "Life is organised in ma kuagro age groups that share work and duties"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "age groups called ma kuagro. The kuagro membership comes with a set of rights and duties"}
