    - {title: "Omar H. Ali, African and Afro-Indian Rebel Leaders in Latin America, ReVista, Harvard DRCLAS (2018)", url: "https://revista.drclas.harvard.edu/african-and-afro-indian-rebel-leaders-in-latin-america", quote: "dressed in Spanish gentleman’s attire with sword and dagger at his side"}
