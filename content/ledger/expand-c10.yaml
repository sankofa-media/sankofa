  sources:
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "en 1599 Benkós Biohó huyó con su esposa y sus hijos de la casa de Juan Gómez, su captor, llevándose a otros treinta esclavos"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "in 1599, together with his wife and several other enslaved companions, escaped his Spanish owner, Juan G ó mez"}
    - {title: "Omar H. Ali, African and Afro-Indian Rebel Leaders in Latin America, ReVista, Harvard DRCLAS (2018)", url: "https://revista.drclas.harvard.edu/african-and-afro-indian-rebel-leaders-in-latin-america", quote: "The rebellion included his wife, Wiwa, and a grown daughter, Orika, among thir- ty others"}
- card: benkos-bioho
