    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "a negotiated settlement was achieved through which the fugitive slaves were recognized as free"}
    - {title: "Banco de la República, Enciclopedia: Benkos Biohó (archived)", url: "https://web.archive.org/web/2023/https://enciclopedia.banrepcultural.org/index.php?title=Benkos_Bioh%C3%B3", quote: "al no derrotar a los negros sublevados, reconocieron el liderazgo de Biohó respetándoles sus pueblos y dejándolos entrar en Cartagena sin ningún impedimento"}
