- card: benkos-bioho
  fact: "San Basilio de Palenque honours him as founder"
  sources:
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "reivindicó a Benkos Biohó como su fundador: San Basilio de Palenque"}
    - {title: "Omar H. Ali, African and Afro-Indian Rebel Leaders in Latin America, ReVista, Harvard DRCLAS (2018)", url: "https://revista.drclas.harvard.edu/african-and-afro-indian-rebel-leaders-in-latin-america", quote: "known as San Basilio de Palenque"}
- card: benkos-bioho
