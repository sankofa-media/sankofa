# Batch c10 (2026-11-13): facts in card bodies, wow lines and disputes, each with two or more independent sources and a verbatim quote.
# Dropped: none. Single-sourced details were left out of the cards (e.g. the 1577 date and the title 'don' for Illescas, the 1586 letter, the 1988 overpainting of the Fleischbein portrait).

- card: alonso-de-illescas
  fact: "Esmeraldas' Indigenous peoples had not been subjugated by Spain"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "no sometidos por los españoles ni por los incas"}
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "siete expediciones militares de sometimiento"}
- card: alonso-de-illescas
  fact: "In 1553 a ship ran aground on the Esmeraldas coast and enslaved Africans escaped ashore"
  sources:
    - {title: "Karen M. Greiner, Esmeraldas, Encyclopedia of Latin American History and Culture, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esmeraldas", quote: "in 1553, when a slave ship ran aground along the southern coast of the province"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "un barco procedente de Panamá encalló en Portete - Esmeraldas en octubre de 1553"}
- card: alonso-de-illescas
  fact: "The ship had sailed from Panama"
  sources:
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "un barco procedente de Panamá encalló"}
    - {title: "Universidad Politécnica Salesiana: El África ancestral y su legado", url: "https://dspace.ups.edu.ec/bitstream/123456789/31353/6/El%20A%cc%81frica%20ancestral%20y%20su%20legado.pdf", quote: "un grupo de esclavos que zarpó de Panamá en octubre de 1553"}
- card: alonso-de-illescas
  fact: "By later accounts seventeen men and six women went into the forest"
  sources:
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "17 negros y seis mujeres decidieron penetrar en la selva"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "17 hombres y 6 mujeres esclavizados huyeron a la selva"}
- card: alonso-de-illescas
  fact: "Illescas was born in Cape Verde"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "había sido esclavo originario de Cabo Verde"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "Nacido hacia 1528 en Cabo Verde"}
- card: alonso-de-illescas
  fact: "As a boy he was taken to Seville, took his master's name and learned Spanish language, faith and laws"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "a los ocho años pasó a Sevilla a servir en la casa de su amo, Alonso Illescas, donde aprendió la lengua española, la religión y las leyes"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "fue comprado a los 10 años en Sevilla, donde recibió el nombre de su amo"}
- card: alonso-de-illescas
  fact: "He married the daughter of an Indigenous chief and kinship ties made him leader of Africans and Indigenous people"
  sources:
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "Illescas, casado con la hija de un cacique nigua"}
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "reconocimiento de su liderazgo entre negros e indios, posición que se fortaleció mediante el establecimiento de relaciones de parentesco con las familias de caciques"}
    - {title: "Universidad Politécnica Salesiana: El África ancestral y su legado", url: "https://dspace.ups.edu.ec/bitstream/123456789/31353/6/El%20A%cc%81frica%20ancestral%20y%20su%20legado.pdf", quote: "Al contraer matrimonio Alonso con la hija del cacique, pudo liderar no solo a los africanos sino también a los indígenas"}
- card: alonso-de-illescas
  fact: "Their mixed Afro-Indigenous descendants were called zambos"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "la formación de grupos de zambos, producto del mestizaje afro-indígena"}
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "territorio zambo (mestizo del negro con el indio)"}
    - {title: "Karen M. Greiner, Esmeraldas, Encyclopedia of Latin American History and Culture, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esmeraldas", quote: "Many of the shipwrecked blacks intermarried with natives"}
- card: alonso-de-illescas
  fact: "The province is remembered as the Kingdom of the Zambos"
  sources:
    - {title: "El Telégrafo: Imagen de Alonso de Illescas lucirá en edificios públicos", url: "https://eltelegrafo.com.ec/noticias/politica/3/imagen-de-alonso-de-illescas-lucira-en-edificios-publicos", quote: "presidió el ‘Reino de los Zambos de Esmeraldas’"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "originando el “Reino Zambo de Esmeraldas”"}
- card: alonso-de-illescas
  fact: "Spanish military expeditions failed"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "Después de la derrota de las primeras misiones militares"}
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "siete expediciones militares de sometimiento, acompañadas de curas para adoctrinar; todas derivaron en fracaso"}
- card: alonso-de-illescas
  fact: "The Audiencia of Quito negotiated; a royal provision pardoned him and his family and named him governor"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "se le remite y perdona no solo a vos, más a toda vuestra casa y familia"}
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "os nombra y cría Gobernador de estas Provincias"}
    - {title: "Universidad Politécnica Salesiana: El África ancestral y su legado", url: "https://dspace.ups.edu.ec/bitstream/123456789/31353/6/El%20A%cc%81frica%20ancestral%20y%20su%20legado.pdf", quote: "lograron el perdón y la absolución del delito de fuga y conspiración contra las leyes de la colonia"}
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "Obtuvo el reconocimiento como gobernador de Esmeraldas"}
- card: alonso-de-illescas
  fact: "This in effect recognised a community founded by people who had freed themselves (fugitives from slavery)"
  sources:
    - {title: "Federica Morelli, En los confines de la soberanía, Claves. Revista de Historia 1 (2015)", url: "https://iris.unito.it/retrieve/e27ce429-2f4a-2581-e053-d805fe0acbaa/Claves.pdf", quote: "el Estado español reconocía la existencia de sociedades conformadas por esclavos prófugos"}
    - {title: "El Comercio (Quito): Los tres mulatos de Esmeraldas", url: "https://www.elcomercio.com/tendencias/esclavitud-manumision-tierras-ecuatorianas-ideas/", quote: "la admisión de un territorio zambo (mestizo del negro con el indio) autónomo , de hombres libres"}
- card: alonso-de-illescas
  fact: "Spain's expeditions could not take the province; it stayed outside Spanish control for decades (wow)"
  sources:
    - {title: "Karen M. Greiner, Esmeraldas, Encyclopedia of Latin American History and Culture, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/esmeraldas", quote: "the province was almost completely outside of Spanish domination for about sixty years"}
    - {title: "El Telégrafo: Imagen de Alonso de Illescas lucirá en edificios públicos", url: "https://eltelegrafo.com.ec/noticias/politica/3/imagen-de-alonso-de-illescas-lucira-en-edificios-publicos", quote: "luchando por mantener la autonomía de la región con independencia de la injerencia española"}
- card: alonso-de-illescas
  fact: "Illescas died before the final peace; around 1600 his son Sebastián went to Quito and made peace with the Crown"
  sources:
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "falleció sin ver la paz final con Quito; acuerdo concretado por su hijo en 1600"}
    - {title: "Universidad Politécnica Salesiana: El África ancestral y su legado", url: "https://dspace.ups.edu.ec/bitstream/123456789/31353/6/El%20A%cc%81frica%20ancestral%20y%20su%20legado.pdf", quote: "don Francisco de Arobe y don Sebastián de Illescas, para que fueran a Quito y reconocieran oficialmente la soberanía española"}
- card: alonso-de-illescas
  fact: "In 1997 Ecuador's Congress declared him a national hero and created a national day of the Afro-Ecuadorian people"
  sources:
    - {title: "El Comercio (Quito): El pueblo afroecuatoriano está de fiestas en la Sierra norte", url: "https://www.elcomercio.com/actualidad/ecuador/pueblo-afroecuatoriano-fiestas-sierra-ibarra/", quote: "a través de un decreto emitido el 2 de octubre de 1997, designó al primer domingo de octubre como Día Nacional del Pueblo Afroecuatoriano y a Alonso de Illescas , como héroe nacional"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "En 1997, el Congreso Nacional declaró el 2 de octubre Día Nacional de los Afroecuatorianos y nombró a Alonso de Illescas Héroe Nacional del Ecuador"}
- card: alonso-de-illescas
  fact: "Dispute: his death is dated 1585 by one account and between 1585 and 1597 by another"
  sources:
    - {title: "Universidad Politécnica Salesiana: El África ancestral y su legado", url: "https://dspace.ups.edu.ec/bitstream/123456789/31353/6/El%20A%cc%81frica%20ancestral%20y%20su%20legado.pdf", quote: "falleció en 1585"}
    - {title: "Antonio Ayoví Nazareno, Paralelismo de la diáspora, El Universo (2026)", url: "https://www.eluniverso.com/opinion/columnistas/paralelismo-de-la-diaspora-nota/", quote: "Mueren entre 1585 y 1597"}
- card: yanga
  fact: "Veracruz was the port through which enslaved Africans reached New Spain"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "around the port of Veracruz (where most of the slaves landed)"}
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "tant harbor for African enslavement in Mexico"}
- card: yanga
  fact: "Many enslaved Africans worked on sugar estates around Veracruz; Yanga was one of them"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "Yanga was an enslaved worker in the sugarcane plantations of Veracruz"}
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "Yanga was enslaved on the Nuestra Señora de la Concepción sugarcane plantation"}
- card: yanga
  fact: "Yanga was said to be of royal African descent"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "Rumored to be of royal lineage from West Africa"}
    - {title: "El Universal: Afro-descendants, Mexico's forgotten third root", url: "https://www.eluniversal.com.mx/english/afro-descendants-mexicos-forgotten-third-root/", quote: "a member of the royal family of Gabon captured and sold into slavery"}
- card: yanga
  fact: "Around 1570 he escaped with followers into the mountains near Córdoba and founded a palenque"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "In 1570 he, along with a group of followers, escaped, fled to the mountainous regions near Córdoba, and established a settlement of former slaves or palenque"}
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "In 1570 or so, Yanga escaped from his enslavement near Veracruz and formed a “palenque”"}
- card: yanga
  fact: "For almost forty years the palenque held out beyond Spanish reach"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "They remained there virtually unmolested by Spanish authorities for nearly 40 years"}
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "Yanga’s palenque survived illegally for almost 40 years"}
- card: yanga
  fact: "Its fighters raided Spanish convoys on the royal road between Veracruz and Mexico City"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "raiding Spanish convoys along the Camino Real [Royal Road] to Ciudad Mexico"}
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "the disruption and looting of trade goods along the Camino Real (Royal Road) between Veracruz and Mexico City"}
- card: yanga
  fact: "In 1609 the viceroy Luis de Velasco sent troops to destroy it"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "The Viceroy, Luis de Velasco II, mounted a major assault on the settlement"}
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "the Spanish Crown’s Viceroy Luis de Velasco sent a battalion of a few hundred troops to subdue them"}
- card: yanga
  fact: "The maroons could not be beaten"
  sources:
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "Yanga and his compatriots could not be defeated"}
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "In 1609, Spanish authorities sent a well-armed militia to defeat Yanga and his palenque but were defeated"}
- card: yanga
  fact: "Yanga offered peace on eleven conditions: freedom for those there before 1608, self-government by Yanga and heirs, no Spaniards"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "Yanga offered to make peace but with eleven conditions, the most important being recognition of the freedom of all of the palenque ’s residents prior to 1608"}
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "cluded 11 conditions, Landers tells us, among these: freedom for all of the runaway slaves who had lived in the settlement before 1608; official recognition of the town’s sovereignty, including the right of Yanga and his heirs to become governors; exclusion of the Spanish, except on market days"}
- card: yanga
  fact: "In return he promised tribute and military service to the king and to take in no new runaways"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "Yanga agreed to pay tribute to the Spanish and to serve the king militarily when asked. They also agreed to return future fugitive slaves"}
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "Yanga, in turn, promised to serve and pay tribute to the Spanish crown"}
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "granted the Yanguícos freedom as long as they did not allow other fugitives from slavery to join their ranks"}
- card: yanga
  fact: "In 1618 the Spanish recognised the town as San Lorenzo de los Negros"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "in 1618, the town of San Lorenzo de Los Negros was officially recognized by Spanish authorities"}
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "it was formally recognized by the Spanish in 1618"}
    - {title: "Karen Juanita Carrillo, Mexico's First Liberated City Commemorates Its Founding, JSTOR Daily (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "the Spanish Crown consented to a treaty that in 1618 allowed the Yanguícos to establish their own government"}
- card: yanga
  fact: "It was later also called San Lorenzo de Cerralvo"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "(also called San Lorenzo de Cerralvo)"}
    - {title: "Arturo Jiménez, Yanga, símbolo de negritud y libertad, La Jornada (2 August 2004)", url: "https://estatico.jornada.com.mx/2004/08/02/04080202.pdf", quote: "Llamado primero San Lorenzo de los Negros, y luego De Cerralvo"}
- card: yanga
  fact: "Since 1932 the town has borne the name Yanga"
  sources:
    - {title: "El Universal: Afro-descendants, Mexico's forgotten third root", url: "https://www.eluniversal.com.mx/english/afro-descendants-mexicos-forgotten-third-root/", quote: "in 1932 the settlement he formed was renamed as Yanga in his honor"}
    - {title: "Arturo Jiménez, Yanga, símbolo de negritud y libertad, La Jornada (2 August 2004)", url: "https://estatico.jornada.com.mx/2004/08/02/04080202.pdf", quote: "desde 1932 lleva el nombre del libertador"}
- card: yanga
  fact: "His statue stands in the town square"
  sources:
    - {title: "Henry Louis Gates Jr., North America's 1st Black Town?, The Root (2012)", url: "https://www.theroot.com/north-americas-1st-black-town", quote: "a large statue of its founder graces the town square today"}
    - {title: "Arturo Jiménez, Yanga, símbolo de negritud y libertad, La Jornada (2 August 2004)", url: "https://estatico.jornada.com.mx/2004/08/02/04080202.pdf", quote: "Escultura de Gaspar Yanga en la explanada de la población veracruzaba que lleva su nombre"}
- card: yanga
  fact: "He is remembered in Mexico as the first liberator of the Americas"
  sources:
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "Known as the Primer Libertador de America or “first liberator of the Americas,”"}
    - {title: "El Universal: Afro-descendants, Mexico's forgotten third root", url: "https://www.eluniversal.com.mx/english/afro-descendants-mexicos-forgotten-third-root/", quote: "“ the first liberator of the Americas ;”"}
- card: yanga
  fact: "Dispute: recognition in 1618 vs autonomous town founded between 1624 and 1635 (La Jornada)"
  sources:
    - {title: "Arturo Jiménez, Yanga, símbolo de negritud y libertad, La Jornada (2 August 2004)", url: "https://estatico.jornada.com.mx/2004/08/02/04080202.pdf", quote: "para fundar, entre 1624 y 1635, una especie de territorio autónomo"}
    - {title: "Luis Escamilla, Gaspar Yanga (c. 1545– ?), BlackPast.org (2009)", url: "https://www.blackpast.org/global-african-history/yanga-gaspar-c-1545/", quote: "in 1618, the town of San Lorenzo de Los Negros was officially recognized"}
- card: luiz-gama
  fact: "An 1831 law banned the Atlantic trade/declared incoming Africans free; people were enslaved in violation of it"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "people who had been enslaved in violation of an 1831 law that had declared all incoming Africans to be free"}
    - {title: "Lei de 7 de novembro de 1831, Presidência da República (Planalto), archived", url: "https://web.archive.org/web/2024/https://www.planalto.gov.br/ccivil_03/leis/lim/lim-7-11-1831.htm", quote: "Todos os escravos, que entrarem no territorio ou portos do Brazil, vindos de fóra, ficam livres"}
    - {title: "Brasil de Fato: Vendido como escravizado, Luiz Gama estudou direito por conta própria (2022)", url: "https://www.brasildefato.com.br/2022/11/26/vendido-como-escravizado-luiz-gama-estudou-direito-por-conta-propria-e-lutou-pela-abolicao", quote: "em 1831, entrou em vigor a proibição do tráfico de pessoas escravizadas no Atlântico"}
- card: luiz-gama
  fact: "Gama was born free in Salvador, Bahia, in 1830"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "He was born in 1830, a free mulatto in Salvador, the capital of Brazil’s Bahia province"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "Nascido em 21 de junho 1830, em Salvador/BA"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Luiz Gama nasceu liberto"}
- card: luiz-gama
  fact: "His mother was an African woman, Luiza Mahin; his father a Portuguese nobleman"
  sources:
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "filho da africana Luiza Mahin"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "o fidalgo português branco Antônio Agostinho Carlos Pinto da Gama"}
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "His mother, Luisa Mahin, was a black woman from Ghana"}
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "Luis Gama’s father was a Portuguese aristocrat"}
- card: luiz-gama
  fact: "At ten his father sold him into slavery to pay a gambling debt"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "Gama was sold into slavery at age ten by his father, who was trying to pay off gambling debts"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "foi vendido como escravo pelo pai aos 10 anos para pagamento de dívida de jogo"}
- card: luiz-gama
  fact: "He was taken to São Paulo as a household slave"
  sources:
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "O menino foi levado para São Paulo, onde vivenciou a escravidão"}
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "Gama lived and worked as a house slave for eight years in Sao Paulo"}
- card: luiz-gama
  fact: "He learned to read and write at seventeen"
  sources:
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Gama aprendeu a ler e escrever aos 17 anos"}
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "In 1847 the seventeen-year-old befriended Antonio Rodrigues do Prado, a law student who taught Gama to read and write"}
- card: luiz-gama
  fact: "At about eighteen he proved he was born free and left captivity"
  sources:
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Só aos 18 anos, Gama conseguiu provar que tinha direito à liberdade e saiu do cativeiro"}
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "gather documentation proving the illegality of his sale into slavery. Once Gama had gathered these documents, he ran away"}
- card: luiz-gama
  fact: "The São Paulo law school shut him out as a Black man"
  sources:
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Por ser negro, Gama foi impedido de frequentar o curso da Faculdade de Direito do Largo do São Francisco"}
    - {title: "Brasil de Fato: Vendido como escravizado, Luiz Gama estudou direito por conta própria (2022)", url: "https://www.brasildefato.com.br/2022/11/26/vendido-como-escravizado-luiz-gama-estudou-direito-por-conta-propria-e-lutou-pela-abolicao", quote: "tentou ingressar na faculdade de direito do Largo do São Francisco, em São Paulo. Encontrou as portas fechadas"}
- card: luiz-gama
  fact: "He studied law on his own and became a rábula, allowed to plead without a degree"
  sources:
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "Ele atuava como rábula, exercendo a advocacia sem ter o título, o que era permitido naquela época"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "se tornou rábula, pessoa com direito de atuar nos tribunais"}
    - {title: "Brasil de Fato: Vendido como escravizado, Luiz Gama estudou direito por conta própria (2022)", url: "https://www.brasildefato.com.br/2022/11/26/vendido-como-escravizado-luiz-gama-estudou-direito-por-conta-propria-e-lutou-pela-abolicao", quote: "o advogado autodidata"}
- card: luiz-gama
  fact: "He used the 1831 law in court to argue people were enslaved illegally"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "he argued successfully in court for the freedom of people who had been enslaved in violation of an 1831 law"}
    - {title: "Brasil de Fato: Vendido como escravizado, Luiz Gama estudou direito por conta própria (2022)", url: "https://www.brasildefato.com.br/2022/11/26/vendido-como-escravizado-luiz-gama-estudou-direito-por-conta-propria-e-lutou-pela-abolicao", quote: "Gama dedicou a sua carreira como advogado a fazer cumprir essas leis"}
- card: luiz-gama
  fact: "He won freedom for more than 500 people"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "allowed him to help free over five hundred slaves"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "libertou mais de 500 escravos no Brasil pela via judicial"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Luiz Gama libertou mais de 500 pessoas escravizadas"}
- card: luiz-gama
  fact: "He died in 1882, before abolition in 1888"
  sources:
    - {title: "Hannah Foster, Luis Gama (1830–1882), BlackPast.org (2014)", url: "https://www.blackpast.org/global-african-history/gama-luis-1830-1882/", quote: "He died of diabetes complications in 1882. Six years later, in 1888, Princess Isabel"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "Morreu em 24 de agosto de 1882, antes de a abolição ser concretizada"}
- card: luiz-gama
  fact: "In 2015, 133 years after his death, the Brazilian Bar Association (OAB) made him a lawyer"
  sources:
    - {title: "Consultor Jurídico: Após 133 anos de sua morte, Luiz Gama recebe título de advogado (2015)", url: "https://www.conjur.com.br/2015-nov-04/133-anos-morte-luiz-gama-recebe-titulo-advogado/", quote: "foi reconhecido como advogado, 133 anos após sua morte, pela Ordem dos Advogados do Brasil"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "foi homenageado, em 2015, pela Ordem dos Advogados do Brasil (OAB), com um título póstumo de advogado"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "Em 2015, 133 anos após sua morte, ele foi reconhecido como advogado pela OAB"}
- card: luiz-gama
  fact: "In 2018 a federal law entered his name in the Book of Heroes of the Fatherland"
  sources:
    - {title: "Lei nº 13.628, de 16 de janeiro de 2018, Presidência da República (Planalto), archived", url: "https://web.archive.org/web/2024/https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/L13628.htm", quote: "Fica inscrito o nome de Luís Gonzaga Pinto da Gama - Luiz Gama no Livro dos Heróis da Pátria"}
    - {title: "Migalhas: Lei declara advogado Luiz Gama patrono da abolição da escravidão no Brasil (2018)", url: "https://www.migalhas.com.br/quentes/272598/lei-declara-advogado-luiz-gama-patrono-da-abolicao-da-escravidao-no-brasil", quote: "a lei 13.628, a qual inscreve o nome de Luiz Gama no Livro dos Heróis da Pátria"}
    - {title: "Agência Brasil: Luta abolicionista de Luiz Gama pode virar Patrimônio da Humanidade (2026)", url: "https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-06/luta-abolicionista-de-luiz-gama-pode-virar-patrimonio-da-humanidade", quote: "Figura histórica inscrita no Livro de Heróis e Heroínas da Pátria"}
- card: jerk
  fact: "Jerk is a way of seasoning, smoking and grilling meat"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "refers to the way in which meat is seasoned, smoked and grilled"}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "The slow smoking and the combination of seasoning gave the pork"}
- card: jerk
  fact: "In 1655 the English attacked Spanish Jamaica; the Spanish fled and those they had enslaved fled to the mountains, becoming the first Maroons"
  sources:
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "the first Maroons were actually the former slaves of Spanish settlers who were freed when their masters escaped the island while it was under British attack in 1655. These freed slaves fled to the hills"}
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "Those who had been enslaved fled to the island’s mountains and became known as the Maroons"}
- card: jerk
  fact: "The Maroons met the surviving Taíno and shared culinary traditions"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "Maroons who disdained enslavement and claimed freedom in the island’s mountainous interior settled among the Indigenous people who survived the trauma of ‘discovery.’ They shared culinary traditions."}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "joined mountain communities of Tainos forming the first Maroon settlements"}
- card: jerk
  fact: "Maroon cooks hunted wild hog, seasoned it with pimento, salt and peppers, wrapped it in leaves and slow-cooked it in an underground pit"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "escapees traditionally hunted wild boar; seasoned the meat with pimento (allspice berries), salt and bird peppers"}
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "wrapped it in pepper elder leaves; and finally cooked it in “an underground smokeless pit"}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "Wild hog would be hunted, seasoned with jerk to preserve it, wrapped in banana leaves and slow-cooked underground"}
- card: jerk
  fact: "Cooking underground hid the smoke that could reveal their location to the British"
  sources:
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "they utilised the technique of cooking underground as a way of hiding the smoke and thus evidence of their location"}
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "If they cooked over an open fire, the smoke would betray them"}
- card: jerk
  fact: "Spice and smoke preserved the meat for people always on the move"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "the Maroons had to hunt, prepare, preserve, transport, nourish and sustain while always on the move"}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "seasoned with jerk to preserve it"}
- card: jerk
  fact: "Modern jerk adds thyme, garlic, scallions etc.; pimento and Scotch bonnet remain essential"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "modern recipes may include Scotch bonnet peppers, scallions, garlic, ginger, pimento, thyme and cinnamon"}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "Jerk seasoning typically contains pimento and Scotch bonnet but has been known to contain cinnamon, escallion, nutmeg, thyme, salt and garlic"}
- card: jerk
  fact: "Jerk travelled with Jamaicans and is on menus from the US to Canada and Britain"
  sources:
    - {title: "Vaughn Stafford Gray, A Brief History of Jamaican Jerk, Smithsonian Magazine (2020)", url: "https://www.smithsonianmag.com/arts-culture/brief-history-jamaican-jerk-180976597/", quote: "Wherever Jamaicans settle, they bring jerk with them"}
    - {title: "Michelle and Suzanne Rousseau, Jerk, Charqui and the Wonders of Walkerswood, Jamaica Observer (2015)", url: "https://www.jamaicaobserver.com/2015/02/10/jerk-charqui-and-the-wonders-of-walkerswood/", quote: "Pop into any modern mainstream restaurant today (from the USA to Canada to the UK and all points in between) and you will more than likely find jerk"}
- card: san-basilio-de-palenque
  fact: "Cartagena was the main port of entry for enslaved Africans into Spanish South America"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "Cartagena de Indias, the most important port of entry for enslaved Africans arriving into Hispanic South America"}
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "convirtió a Cartagena en el principal puerto esclavista del mundo"}
- card: san-basilio-de-palenque
  fact: "Escapees from estates, mines and towns built fortified villages"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "These runaways escaped from mines, from haciendas, and from towns, and regrouped to form defensive communities"}
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "walled communities called palenques, which were founded by escaped slaves as a refuge in the seventeenth century"}
- card: san-basilio-de-palenque
  fact: "The name palenque comes from the wooden palisades around them"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "The word palenque is derived from the wooden palisades they built"}
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "defendieron su poblado con una empalizada (un “palenque”)"}
- card: san-basilio-de-palenque
  fact: "San Basilio lies in the foothills of the Montes de María, south-east of Cartagena"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "is located in the foothills of the Montes de María, southeast of the regional capital, Cartagena"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "Situated in the mountains of the Sierra del Mar í a"}
- card: san-basilio-de-palenque
  fact: "It is the only palenque that has survived"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "Of the many palenques that existed in former times, only San Basilio has survived until the present day"}
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "Esta historia emblemática sobrevivió de forma excepcional en una comunidad"}
- card: san-basilio-de-palenque
  fact: "It grew from the palenques of the Sierra de María that outlasted the Spanish campaigns of the end of the 1600s"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "Palenque San Basilio was created by fugitives who regrouped after escaping from the destruction of other palenques, such as Tabacal, Matudere, and Arenal, at the end of the seventeenth century"}
    - {title: "María Cristina Navarrete, Las memorias de San Basilio de Palenque, ICANH (2007)", url: "https://www.icanh.gov.co/wp-content/uploads/2024/11/INFO_FINALNavarrete2007.pdf", quote: "En la segunda mitad del siglo XVII, en la banda izquierda del río Magdalena ya estaba establecido el palenque San Miguel Arcángel, el más extenso e importante de la sierra"}
- card: san-basilio-de-palenque
  fact: "In December 1713 bishop Antonio María Cassiani of Cartagena met its people"
  sources:
