- card: san-basilio-de-palenque
  fact: "Under the 1713 agreement they were pardoned"
  sources:
    - {title: "María Cristina Navarrete, Las memorias de San Basilio de Palenque, ICANH (2007)", url: "https://www.icanh.gov.co/wp-content/uploads/2024/11/INFO_FINALNavarrete2007.pdf", quote: "se admitía a indulto, concedía el perdón y permitía el comercio con los españoles a todos los cimarrones que habitaban en el palenque San Miguel Arcángel"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "granted San Basilio's residents a general pardon"}
- card: san-basilio-de-palenque
  fact: "The settlement, until then San Miguel Arcángel, became San Basilio"
  sources:
    - {title: "María Cristina Navarrete, Las memorias de San Basilio de Palenque, ICANH (2007)", url: "https://www.icanh.gov.co/wp-content/uploads/2024/11/INFO_FINALNavarrete2007.pdf", quote: "el resurgimiento y legitimación del palenque de San Miguel Arcángel, que se tornará en el poblado de San Basilio de Palenque, en 1713"}
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "christened the town San Basilio Magno"}
- card: san-basilio-de-palenque
  fact: "Isolation let a distinct culture develop"
  sources:
    - {title: "Renée Soulodre-La France, Palenque San Basilio, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/palenque-san-basilio", quote: "The isolation of Palenque San Basilio allowed particular cultural forms to develop"}
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "It developed into a unique cultural space"}
- card: san-basilio-de-palenque
  fact: "Palenquero is the only creole in Latin America with a Spanish lexical base and Bantu grammar"
  sources:
