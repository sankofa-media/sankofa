  fact: "In May 1803 the leading generals met in congress at Arcahaie, united around Dessalines for independence"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "the Congress of Arcahaïe (which saw the leading revolutionary generals converge under a single, unified aim of independence on 18 May 1803)"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "a three-day meeting of the diverse revolutionary groups in May 1803, which was held at Archaye"}
- card: catherine-flon
  fact: "Tradition: Dessalines tore the white band out of the tricolour and his goddaughter Flon sewed the blue and red together"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "Catherine Flon was the goddaughter Jean-Jacques Dessalines"}
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "to stitch back together the red and blue panels of the French tricolore after he had torn out its white central panel"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "all artistic renditions of Catherine Flon have portrayed her stitching the blue and red bands of the French tricolor after the white was cut out by her godfather"}
    - {title: "Nekita Lamour, Rally 'Round the Flag: Myth, Mystery Surrounds History of Haiti's First Banner, Boston Haitian Reporter (2004)", url: "https://potomitan.info/ayiti/lamour/flag.php", quote: "Catherine was said to have sewn two pieces of red and blue cloth in the May 18 Congress"}
- card: catherine-flon
  fact: "She is described as a seamstress who also nursed the wounded"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "A nurse and a seamstress, Flon was purportedly commissioned by Dessalines"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "Flon was not only a seamstress but an enthusiastic supporter of the Haitian Revolution (1791–1804), during which time she served as a nurse"}
- card: catherine-flon
  fact: "The archive is almost silent about her"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "Catherine Flon, like so many other women that contributed to the revolutionary saga, occupies the silent, interstitial and secretive spaces of the textual archive"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "there is little archival evidence of her role"}
    - {title: "Nekita Lamour, Rally 'Round the Flag: Myth, Mystery Surrounds History of Haiti's First Banner, Boston Haitian Reporter (2004)", url: "https://potomitan.info/ayiti/lamour/flag.php", quote: "The stories about Catherine Flon, the Betsy Ross of Haiti, are largely speculative"}
- card: catherine-flon
  fact: "Philippe Girard finds archival sources support few details and doubts she existed"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "Philippe Girard discredits her very existence"}
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "‘[a]rchival sources support few of the details found in the popular version of the flag’s creation’"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "some scholars, like Philipe Girard, deny her existence"}
- card: catherine-flon
  fact: "Nicole Willson argues at least one woman must have made the flag and the story keeps women's revolutionary work in view"
  sources:
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "As the historian Nicole Willson notes, “even if there was no real personality named Catherine Flon, it might safely be assumed that there was at least one"}
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "it renders visible and tangible the revolutionary stories of women of colour"}
- card: catherine-flon
  fact: "Haiti became independent in 1804"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "the formation in 1804 of the first Black republic"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "the Haitian Revolution (1791–1804)"}
- card: catherine-flon
  fact: "18 May is celebrated as Flag Day"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "Haitian Flag Day (which is commemorated each year on May 18 on the alleged date of the Arcahaie Congress)"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "Flag Day, celebrated on 18 May"}
- card: catherine-flon
  fact: "Her likeness is on the ten-gourde note"
  sources:
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "the figure of Catherine Flon has been used on the dix gourdes banknote"}
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "a version of her likeness has adorned Haiti’s ten-gourde banknote"}
- card: catherine-flon
  fact: "Haitian artists keep portraying her sewing the flag"
  sources:
    - {title: "Curtis Jacobs, Catherine Flon, Enslaved: Peoples of the Historical Slave Trade", url: "https://enslaved.org/fullStory/16-23-126810/", quote: "She has been interpreted by many of Haiti’s nationalist artists, all of whom paint her with the red and blue flag"}
    - {title: "Nicole Willson, Unmaking the Tricolore, Slavery & Abolition 41:1 (2019), author's manuscript", url: "https://clok.uclan.ac.uk/id/eprint/30592/1/30592%203.1%2520Willson%2520Article.pdf", quote: "how artists and community groups in Haiti and across the Haitian dyaspora aim to preserve such figures for posterity"}
- card: fireburn-queens
  fact: "Slavery abolished 1848; the 1849 labour law fixed a day wage and allowed job change only once a year on 1 October"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "After the abolition of slavery in 1848 a new labour bill [Arbejdsregulativet] was passed in 1849"}
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "The law stipulated a day wage and ruled that workers could only change jobs once a year, on October 1st"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "en rigid arbejdsanordning fra 1849"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "den 1. oktober 1878, som var skiftedag for de årlige arbejdskontrakter"}
- card: fireburn-queens
  fact: "On 1 October 1878 workers gathered in Frederiksted"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "On October 1st 1878 – job-change day – many of the workers on St. Croix’ were gathered in Frederiksted"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "Oprøret udbrød i byen Frederiksted"}
- card: fireburn-queens
  fact: "Police beat labourer Henry Trotman; a rumour spread that he died; the crowd attacked the fort"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "sending a farm labourer called Henry Trotman to hospital. The unrest continued, and rumours spread that Henry Trotman had died"}
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "The workers starting to charge the fort"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "en afrocaribisk arbejder, Henry Trotman, blev mishandlet af politiet"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "angreb oprørerne byens fort"}
- card: fireburn-queens
  fact: "By night the town was burning"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "Late that night buildings in Frederiksted were set on fire"}
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "Natten mellem 1. og 2. oktober: Frederiksted brænder"}
- card: fireburn-queens
  fact: "Around fifty plantations and most of Frederiksted burned, giving the name Fireburn"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "Around 50 plantations and most of Frederiksted were destroyed by fire, which is what gave the revolt its name: Fireburn"}
    - {title: "Anne Branigin, I Am Queen Mary, Denmark's 1st Public Monument Honoring a Black Woman, The Root (2018)", url: "https://www.theroot.com/in-queen-mary-denmarks-first-public-monument-honoring-1824263350", quote: "50 plantations and most of Frederiksted, St. Croix, had been destroyed by fire"}
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "The uprising led to the burning of over 50 plantations"}
- card: fireburn-queens
  fact: "Among its leaders were the 'queens' Mary Thomas (Queen Mary), Axeline Salomon (Queen Agnes) and Mathilda McBean (Queen Mathilda)"
  sources:
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "både mænd og kvinder spillede aktive roller som ledere af forskellige oprørsgrupper. Blandt de mest kendte skikkelser er Mary Thomas (Queen Mary)"}
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "The women are known as Queen Mary, Queen Agnes and Queen Mathilda"}
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "led by Mary Thomas, Axeline Elizabeth Salomon, and Mathilda McBean — each known as “Queen.”"}
- card: fireburn-queens
  fact: "Soldiers and militia crushed the revolt"
  sources:
    - {title: "Rikke Lie Halberg, Fireburn-oprøret 1878, Lex (Den Store Danske)", url: "https://lex.dk/Fireburn-opr%C3%B8ret_1878", quote: "som blev slået ned af militær og væbnede militser"}
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "The next morning soldiers from Christiansted came to rescue the fort"}
- card: fireburn-queens
  fact: "The three, with a fourth woman Susanna Abrahamson, were convicted and served part of their sentences in a women's prison in Copenhagen"
  sources:
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "All three of them were arrested together with a fourth woman called Susanna Abrahamson"}
    - {title: "National Museum of Denmark: Fireburn, the uprising of 1878", url: "https://en.natmus.dk/historical-knowledge/historical-themes/danish-colonies/the-danish-west-indies/fireburn/", quote: "served part of their sentence in the Christianhavn women’s prison in Copenhagen in the 1880s"}
    - {title: "Anne Branigin, I Am Queen Mary, Denmark's 1st Public Monument Honoring a Black Woman, The Root (2018)", url: "https://www.theroot.com/in-queen-mary-denmarks-first-public-monument-honoring-1824263350", quote: "were tried for their part in the Fireburn rebellion and sent to Copenhagen to complete their sentences"}
- card: fireburn-queens
  fact: "In March 2018 Jeannette Ehlers and La Vaughn Belle unveiled I Am Queen Mary outside the old West India Warehouse"
  sources:
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "Date   March 31, 2018"}
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "Vestindisk Pakhus, Toldbodgade 40, 1253 Copenhagen"}
    - {title: "Anne Branigin, I Am Queen Mary, Denmark's 1st Public Monument Honoring a Black Woman, The Root (2018)", url: "https://www.theroot.com/in-queen-mary-denmarks-first-public-monument-honoring-1824263350", quote: "Jeannette Ehlers of Denmark and La Vaughn Belle of the Virgin Islands"}
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "outside the former  Vestindisk Pakhus , or West India Warehouse"}
- card: fireburn-queens
  fact: "It is about seven metres tall: a figure on a wicker throne holding a torch and a cane knife"
  sources:
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "276 in. (701.04 cm)"}
    - {title: "Anne Branigin, I Am Queen Mary, Denmark's 1st Public Monument Honoring a Black Woman, The Root (2018)", url: "https://www.theroot.com/in-queen-mary-denmarks-first-public-monument-honoring-1824263350", quote: "a 23-foot statue inspired by Mary Thomas"}
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "rising nearly 23 feet on a hefty pedestal"}
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "Mary is shown seated in a wicker throne; she holds a cane knife in one hand and a torch in the other"}
    - {title: "Anne Branigin, I Am Queen Mary, Denmark's 1st Public Monument Honoring a Black Woman, The Root (2018)", url: "https://www.theroot.com/in-queen-mary-denmarks-first-public-monument-honoring-1824263350", quote: "Seated on a wicker throne"}
- card: fireburn-queens
  fact: "Its plinth is coral stone cut by enslaved Africans on St Croix"
  sources:
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "pieces of coral, originally cut from the ocean by enslaved Africans, that Belle gathered from the ruins of historic buildings on St. Croix"}
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "Mary sits atop a plinth made of coral stones cut out of the sea at Saint Croix by enslaved Africans"}
- card: fireburn-queens
  fact: "It was the first public monument to a Black woman in Denmark"
  sources:
    - {title: "Hyperallergic: Denmark's First Public Monument to a Black Woman Celebrates a 19th-Century Freedom Fighter (2018)", url: "https://hyperallergic.com/jeannette-ehlers-la-vaughn-belle-i-am-queen-mary/", quote: "Denmark received its first-ever public monument to a black woman"}
    - {title: "Kamma Overgaard Hansen, Jeanette Ehlers, Lex (Den Store Danske)", url: "https://lex.dk/Jeanette_Ehlers", quote: "Statuen var den første statue af en person med afrikanske rødder, der blev opstillet i det offentlige rum i Danmark"}
- card: fireburn-queens
  fact: "In December 2020 a winter storm wrecked the figure and it was removed"
  sources:
    - {title: "Kamma Overgaard Hansen, Jeanette Ehlers, Lex (Den Store Danske)", url: "https://lex.dk/Jeanette_Ehlers", quote: "statuen holdt indtil vinteren 2020, hvor en storm rev hovedet af figuren. Derfor er statuen nu fjernet"}
    - {title: "Renée Ater, Contemporary Monuments to the Slave Past: I Am Queen Mary (Copenhagen, Denmark)", url: "https://slaverymonuments.org/items/show/1157", quote: "In December 2020 a winter storm severely damaged the monument. The figure was removed"}
- card: congo-culture-panama
  fact: "Portobelo, founded in 1597, was one of the empire's principal ports, a nexus of trade between the Americas and Spain"
  sources:
    - {title: "Project MUSE: Renée Alexander Craft, When the Devil Knocks (2015)", url: "https://muse.jhu.edu/book/36973", quote: "the town of Portobelo, Panama—the nexus of trade in the Spanish colonial world"}
    - {title: "UNESCO World Heritage Centre: Fortifications on the Caribbean Side of Panama: Portobelo-San Lorenzo", url: "https://whc.unesco.org/en/list/135/", quote: "Portobelo, where the famous fairs were held, was one of the principal Caribbean ports and played a leading role controlling the imperial trade in the Americas"}
    - {title: "UNESCO World Heritage Centre: Fortifications on the Caribbean Side of Panama: Portobelo-San Lorenzo", url: "https://whc.unesco.org/en/list/135/", quote: "The town of San Felipe de Portobelo was founded in March 20th, 1597"}
- card: congo-culture-panama
  fact: "Escaped Africans, cimarrones, fled to forests and mountains, built fortified palenques and fought for freedom"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "cimarr ó nes — Africans who liberated themselves by fleeing to the mountains and rainforests"}
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "the cimarr ó nes established palenques , or fortified villages"}
    - {title: "Project MUSE: Renée Alexander Craft, When the Devil Knocks (2015)", url: "https://muse.jhu.edu/book/36973", quote: "charting self-liberated Africans’ triumph over enslavement"}
- card: congo-culture-panama
  fact: "Their descendants and heirs, the Congos, tell this history in Carnival"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "While some present-day Congos are actual descendants of cimarr ó nes"}
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "most are inheritors of the cultural traditions"}
    - {title: "Susan Hudson, The devils in the details, University Gazette, UNC Chapel Hill (2015)", url: "https://unc.edu/?p=38734", quote: "They call their version of Carnival season, “Congo Season.”"}
    - {title: "UNESCO Intangible Cultural Heritage: Ritual and festive expressions of the Congo culture", url: "https://ich.unesco.org/en/RL/ritual-and-festive-expressions-of-the-congo-culture-01383", quote: "a collective celebration of the black rebel descendants enslaved during the colonial period"}
- card: congo-culture-panama
  fact: "During the Congo season the community gathers around a queen and her court"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Ritual and festive expressions of the Congo culture", url: "https://ich.unesco.org/en/RL/ritual-and-festive-expressions-of-the-congo-culture-01383", quote: "a matriarchal society ruled by a queen and her court"}
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "the queen, known as Mar í a Merced"}
- card: congo-culture-panama
  fact: "The diablos represent the Spanish enslavers and carry whips"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "the Diablo Mayor (the major devil) who represents the Spaniards"}
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "the diablos (the devils) assume the right to whip anyone in the village they wish"}
    - {title: "Susan Hudson, The devils in the details, University Gazette, UNC Chapel Hill (2015)", url: "https://unc.edu/?p=38734", quote: "the devils, the enslavers"}
- card: congo-culture-panama
  fact: "In 2018 UNESCO inscribed the tradition on the Representative List of the Intangible Cultural Heritage of Humanity"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Ritual and festive expressions of the Congo culture", url: "https://ich.unesco.org/en/RL/ritual-and-festive-expressions-of-the-congo-culture-01383", quote: "Inscribed in 2018 ( 13.COM ) on the Representative List"}
    - {title: "EFE via La Estrella de Panamá: Rituales de cultura congo de Panamá, declarados Patrimonio Inmaterial por la Unesco (2018)", url: "https://www.laestrella.com.pa/cafe-estrella/cultura/181129/congo-panama-cultura-rituales-declarados", quote: "fue declarada hoy Patrimonio Cultural Inmaterial de la Humanidad por la Unesco"}
- card: congo-culture-panama
  fact: "On Ash Wednesday the devils whip people; Congos capture and baptise them"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "on Ash Wednesday , when the diablos (the devils) assume the right to whip anyone in the village they wish"}
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "chase after the diablos , capture them, and then deliver them to the \"priest\" to be baptized"}
    - {title: "UNESCO Intangible Cultural Heritage: Ritual and festive expressions of the Congo culture", url: "https://ich.unesco.org/en/RL/ritual-and-festive-expressions-of-the-congo-culture-01383", quote: "baptize the devils in a symbolic ritual"}
- card: congo-culture-panama
  fact: "The chief devil is captured, baptised and symbolically sold, turning the tables on the enslaver"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "the Diablo Major is captured, forced to renounce evil, and is baptized. He is then tied up and taken throughout the community to be \"sold.\""}
    - {title: "Susan Hudson, The devils in the details, University Gazette, UNC Chapel Hill (2015)", url: "https://unc.edu/?p=38734", quote: "the tables are turned on the Major Devil, who has his mask and whip taken away, is baptized and symbolically sold"}
- card: congo-culture-panama
  fact: "Then Carnival ends and Lent begins"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "ends the Carnival season. The Congo flag is lowered and the village settles down to forty days of self-denial during Lent"}
    - {title: "UNESCO Intangible Cultural Heritage: Ritual and festive expressions of the Congo culture", url: "https://ich.unesco.org/en/RL/ritual-and-festive-expressions-of-the-congo-culture-01383", quote: "On Ash Wednesday, the season concludes"}
- card: congo-culture-panama
  fact: "Scholars read it as living history of self-liberation, with parody, music and dance"
  sources:
    - {title: "Arturo Lindsay, Congos of Panama, Encyclopedia of African-American Culture and History (2005), via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/congos-panama", quote: "Congo customs today comprise a \"living art tradition\" that serves as an innovative way to tell the stories and oral history of the cimarr ó nes"}
    - {title: "Project MUSE: Renée Alexander Craft, When the Devil Knocks (2015)", url: "https://muse.jhu.edu/book/36973", quote: "Congo traditions tell the story of cimarronaje, charting self-liberated Africans’ triumph over enslavement, their parody of the Spanish Crown and Catholic Church"}
    - {title: "Susan Hudson, The devils in the details, University Gazette, UNC Chapel Hill (2015)", url: "https://unc.edu/?p=38734", quote: "“It is the history of enslavement and self-liberation,”"}
- card: tignon-law
  fact: "Spanish Louisiana had a sizeable community of free people of colour"
  sources:
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "By the time the Spanish took over the Louisiana colony in 1763 there was an established community of free Black people"}
    - {title: "National Park Service, African American Heritage and Ethnography: French Americans of African descent", url: "https://web.archive.org/web/20100215212802/http://www.nps.gov/ethnography/aah/aaheritage/FrenchAmA.htm", quote: "Gens de color , or people of color"}
- card: tignon-law
  fact: "Free and enslaved women of African descent across Louisiana and the Caribbean wore the tignon; enslaved women used it to protect hair at work"
  sources:
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "Tignons were common among free and enslaved women in colonial Louisiana and the Caribbean"}
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "to protect hair, preserve hairstyles, and keep clean while doing dirty work"}
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "Tignon were headscarves typically worn by enslaved women to keep their hair up while they worked"}
- card: tignon-law
  fact: "In 1786 the Spanish governor ordered women of colour, free or not, to cover their hair in public"
  sources:
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "The Spanish governor of Louisiana issued a law in 1786 that required all women of African descent to cover their hair in public"}
    - {title: "National Park Service, African American Heritage and Ethnography: French Americans of African descent", url: "https://web.archive.org/web/20100215212802/http://www.nps.gov/ethnography/aah/aaheritage/FrenchAmA.htm", quote: "women of color had to wear a scarf or handkerchief over their hair as a visible sign of belonging to the slave class, whether they were enslaved or not"}
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "in 1786 the governor of Louisiana proclaimed that all free Black women must wear tignon"}
- card: tignon-law
  fact: "The aim was to tie free women of colour visibly to the enslaved rather than to white women"
  sources:
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "the governor was associating free Black women with enslaved women rather than white women"}
    - {title: "National Park Service, African American Heritage and Ethnography: French Americans of African descent", url: "https://web.archive.org/web/20100215212802/http://www.nps.gov/ethnography/aah/aaheritage/FrenchAmA.htm", quote: "as a visible sign of belonging to the slave class"}
- card: tignon-law
  fact: "The women obeyed the letter of the law and defeated its purpose"
  sources:
    - {title: "National Park Service, African American Heritage and Ethnography: French Americans of African descent", url: "https://web.archive.org/web/20100215212802/http://www.nps.gov/ethnography/aah/aaheritage/FrenchAmA.htm", quote: "an action which technically meant the letter of the law but also allowed them to maintain their standards of fashion and beauty"}
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "these tignon laws had the opposite effect"}
- card: tignon-law
  fact: "They used costly bright fabrics, intricate knots, feathers and jewels"
  sources:
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "women used colorful, expensive fabrics and tied them with ornate knots. They also decorated them with feathers and jewels"}
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "Many used the finest silk fabrics and adorned their tignons with jewels and feathers"}
    - {title: "National Park Service, African American Heritage and Ethnography: French Americans of African descent", url: "https://web.archive.org/web/20100215212802/http://www.nps.gov/ethnography/aah/aaheritage/FrenchAmA.htm", quote: "they did it with elaborate fabrics and jewels"}
- card: tignon-law
  fact: "The headwrap became a sign of beauty, wealth and creativity instead of inferiority"
  sources:
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "Instead of being a symbol of the inferiority of free Black women, it became a mark of their beauty, wealth, and creativity"}
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "Creole women of color used their elaborately tied headwraps to accentuate their status and beauty"}
- card: tignon-law
  fact: "The fashion outlived Spanish rule"
  sources:
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "the style long outlived Spanish colonial rule in Louisiana"}
    - {title: "Historic New Orleans Collection, First Draft: Creole Chic", url: "https://hnoc.org/publishing/first-draft/creole-chic", quote: "Creole in a Red Headdress , 1829–1849"}
- card: tignon-law
  fact: "An 1837 portrait by François Fleischbein in the Historic New Orleans Collection shows a woman of colour in a tignon"
  sources:
    - {title: "Molly Reid Cleaver, Identity Theft, First Draft, Historic New Orleans Collection (2022)", url: "https://hnoc.org/publishing/first-draft/identity-theft-rare-painting-damaged-story-half-told-and-reckoning-about", quote: "an 1837 oil painting by the New Orleans artist François Fleischbein. It depicts a woman of color with a modest smile. She wears a golden tignon"}
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "François (Franz) Fleischbein, Portrait of Betsy , 1837. The Historic New Orleans Collection"}
- card: tignon-law
  fact: "It was long said to depict the artist's housekeeper Betsy, but her identity is uncertain (dispute)"
  sources:
    - {title: "Molly Reid Cleaver, Identity Theft, First Draft, Historic New Orleans Collection (2022)", url: "https://hnoc.org/publishing/first-draft/identity-theft-rare-painting-damaged-story-half-told-and-reckoning-about", quote: "HNOC adopted a theory about the identity of the sitter—that she was the artist’s housekeeper, Betsy—even though that identification had not been directly substantiated"}
    - {title: "New-York Historical Society, Women & the American Story: Fashionable Rebellion", url: "https://wams.nyhistory.org/colonies-and-revolution/spanish-and-french-colonies/fashionable-rebellion/", quote: "The subject of the painting is Betsy, the free Black housekeeper of artist François Fleischben"}
