    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of Palenque de San Basilio", url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102", quote: "Inscribed in 2008 ( 3.COM ) on the Representative List"}
    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "en 2008 sus tradiciones fueron declaradas Patrimonio Inmaterial de la Humanidad por la Unesco"}
- card: san-basilio-de-palenque
