    - {title: "Felipe Arias Escobar, La muerte de Benkos Biohó, 400 años de resistencia afrodescendiente, Radio Nacional de Colombia (2021)", url: "https://www.radionacional.co/cultura/historia-colombiana/la-muerte-de-benkos-bioho-400-anos-de-resistencia-afrodescendiente", quote: "el 16 de marzo de 1621, fue ahorcado"}
    - {title: "Banco de la República, Enciclopedia: Benkos Biohó (archived)", url: "https://web.archive.org/web/2023/https://enciclopedia.banrepcultural.org/index.php?title=Benkos_Bioh%C3%B3", quote: "el 16 de marzo de 1621 fue ahorcado en una plaza de la ciudad"}
- card: benkos-bioho
