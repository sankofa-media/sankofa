      - {title: "UNESCO World Heritage Centre", url: "https://whc.unesco.org/en/list/1548/", quote: "Its earthen cover for the past 168 years has enabled this sensitive site to be preserved"}
    note: "'Landfill' is not in the sources (UNESCO says the wharf was built not on a landfill); Getty dates the final covering to 1911 urban works, UNESCO speaks of an earthen cover. Wording changed."
