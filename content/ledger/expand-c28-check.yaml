    verdict: corrected
    note: "No opened source places Hankey in the Gamtoos valley. Title changed to 'Sara Baartman, from Piccadilly to Hankey', place to 'Hankey, Eastern Cape', body to 'near the place where she was born' (Britannica: near her birthplace)."
