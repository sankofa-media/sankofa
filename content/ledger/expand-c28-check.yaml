    verdict: confirmed
    note: "UH News (the university about its own campus): 'next to Bachman Hall in the shade of a Chaulmoogra tree planted in Ball’s honor, where a bronze plaque is displayed'; NWHM confirms the plaque and tree without naming the building."
  - card: anna-julia-cooper
    claim: "Front matter: M Street High School coordinates"
    verdict: corrected
    note: "The school stood at 128 M Street NW; point moved from 38.9087, -77.0184 (about 6th Street NW) to 38.9057, -77.0128."
  - card: anna-julia-cooper
    claim: "Emancipation brought new schools for freed people; she entered Saint Augustine's as a child"
    verdict: confirmed
    note: "Britannica: 'newly established ... a school for freed slaves' (1868); NWHM: 'a school built specifically to educate formerly enslaved children' (1867)."
  - card: baartman-return
