        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "Walatta Petros was revered as a heroine for her resistance... She set up her communities at Dämboza, Afär Färäs, Zäge, and Zäbol."
    note: "Both quotes checked on the pages."
