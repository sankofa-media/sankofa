      - {title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography", url: "https://dacb.org/stories/ethiopia/walatta-petros2/", quote: "defending the Ethiopian Orthodox Täwaḥədo Church"}
