        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "Ǝḫətä Krəstos, the woman who became her constant companion in life and work and the abbess of her community after Walatta Petros's death"
    note: "Both quotes checked on the pages."
  - card: walatta-petros
    fact: "Allowed back to the Lake Tana region, she founded more communities there."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "Walata Petros was allowed to return to the Lake Tana area where she founded the two communities of Chenqwa and Mesela"
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "she went with her followers to live in the region of Dambəya, on the northern side of Lake Ṭana, setting up her second community, Č̣anqʷa"
    note: "Both quotes checked on the pages."
  - card: walatta-petros
    fact: "In 1632 Susenyos gave up the struggle and abdicated; Fasiladas restored Orthodoxy and the Jesuits were expelled."
    verdict: corrected
    sources:
      - title: "Library of Congress Country Studies: Ethiopia (1991), Contact with European Christendom"
        url: "https://countrystudies.us/ethiopia/12.htm"
        quote: "abdicated in 1632 in favor of his son, Fasiladas (reigned 1632-67), to spare the country further bloodshed. The expulsion of the Jesuits and all Roman Catholic missionaries followed."
      - title: "Encyclopaedia Britannica: Fasilides"
        url: "https://www.britannica.com/biography/Fasilides"
        quote: "Fasilides succeeded to the throne on the abdication of Susenyos (1632)... expelled Catholic missionaries"
    note: "Supported, but the ledger's LoC link pointed to the wrong page (10.htm instead of 12.htm). Britannica (Fasilides) added as the independent second source for abdication and expulsion; Belcher says Susenyos rescinded the edict and died months later, consistent."
  - card: walatta-petros
