    note: "Both quotes checked on the pages."
  - card: kebra-nagast
    fact: "The dynasty claimed descent from Solomon and Sheba through Aksum and presented its accession as a restoration."
    verdict: confirmed
    sources:
      - title: "Library of Congress Country Studies: Ethiopia (1991), The Restoration of the Solomonic Line"
        url: "http://countrystudies.us/ethiopia/8.htm"
        quote: "its scions claimed descent not only from Aksum but also from King Solomon of ancient Israel... Yekuno Amlak's accession thus came to be seen as the legitimate \"restoration\" of the Solomonic line"
      - title: "Encyclopaedia Britannica: Solomonid dynasty"
        url: "https://www.britannica.com/topic/Solomonid-dynasty"
        quote: "line of Ethiopian emperors who, according to tradition, were descended from Menilek I, the son of Solomon and the Queen of Sheba (Makeda). Until Haile Selassie I was deposed in 1974, their rule was supposed to have been continuous but for two periods, the reign of the Zagwe dynasty (12th–13th century)"
    note: "Restoration framing: LoC explicit; Britannica (Solomonid dynasty) describes Solomonid rule as continuous except for the Zagwe interruption."
