      - {title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB", url: "https://dacb.org/stories/ethiopia/walata-petros/", quote: "Shortly afterwards he died, and was succeeded by his son Fasilidas (reigned 1632-67)."}
  - card: walatta-petros
    claim: "Even in exile people gathered round her."
