      - {title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography", url: "https://dacb.org/stories/ethiopia/walatta-petros2/", quote: "There she endured many hardships, but many monks and nuns who did not want to convert found her and became members of her community."}
  - card: walatta-petros
