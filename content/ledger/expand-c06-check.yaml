    fact: "The Dutch kept the English-based vernacular as the language for communicating with the enslaved."
    verdict: confirmed
    sources:
      - title: "Encyclopaedia Britannica: Sranan"
        url: "https://www.britannica.com/topic/Sranan"
        quote: "they decided to keep the local colonial English vernacular , rather than their own national language, as the lingua franca for communication with the slaves"
      - title: "APiCS Online: Saramaccan"
        url: "https://apics-online.info/surveys/3"
        quote: "In previous work the retention of a form of English (if Sranan is regarded as such) after 1675 has sometimes been regarded as problematic."
    note: "Both quotes checked on the pages."
  - card: sranan-tongo
    fact: "Maroon languages such as Saramaccan grew out of early Sranan carried into the interior."
    verdict: corrected
    sources:
      - title: "APiCS Online: Sranan (Winford and Plag)"
        url: "https://apics-online.info/surveys/2"
        quote: "the maroon creoles split off from it after their founders escaped from the Surinamese plantations"
      - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
        url: "https://www.britannica.com/topic/Saramaccan"
        quote: "escapees from among the enslaved must have taken the plantation varieties into the Maroon colonies"
    note: "The two APiCS chapters count as one publisher; Britannica (Mufwene) added."
  - card: sranan-tongo
    fact: "Sranan long had less prestige than Dutch but has become a symbol of Surinamese identity and national language."
    verdict: confirmed
    sources:
      - title: "Encyclopaedia Britannica: Sranan"
        url: "https://www.britannica.com/topic/Sranan"
        quote: "It functions as a lingua franca and as a national language of Suriname, although it has less prestige than Dutch, the country's official language."
      - title: "APiCS Online: Sranan (Winford and Plag)"
        url: "https://apics-online.info/surveys/2"
        quote: "Despite the hegemony of Dutch, Sranan enjoys status as a language of wider everyday communication, and as a symbol of Surinamese identity."
    note: "Both quotes checked on the pages."
unledgered:
