      - {title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography", url: "https://dacb.org/stories/ethiopia/walatta-petros2/", quote: "when the Jesuits persuaded King Susənyos (1572-1632) to proclaim Roman Catholicism the faith of the land"}
    note: "Nationality not supported by two sources (Britannica says Spanish influence). EN now 'Jesuit missionaries', RU 'миссионеров-иезуитов'."
