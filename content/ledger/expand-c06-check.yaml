front_matter:
  note: "Years, places, coordinates, era and kind checked for all ten cards; no changes needed. Coordinates fall at the named places (Lake Tana, Aksum, Kilwa Kisiwani, Wessel Islands, Kasubi Hill, Dangriga, Saint Vincent, upper Suriname River, San Basilio de Palenque, Cartagena, Richmond, Buchanan, Syracuse, Paramaribo). black-dispatches keeps kind: object as written; it could equally be work (the CIA study), left to the batch author."
