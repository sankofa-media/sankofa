# Second, independent fact-check of batch c06 (cards and ledger content/ledger/expand-c06.yaml).
# Every source below was opened by the checker; Britannica, UNESCO WHC list pages and the Inter-American Court PDF via archive.org snapshots.
entries:
  - card: walatta-petros
    fact: "Emperor Susenyos, persuaded by the Jesuits, embraced Roman Catholicism and pressed it on his court in the early 17th century."
    verdict: corrected
    sources:
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "the Jesuits persuaded King Susənyos (1572-1632) to proclaim Roman Catholicism the faith of the land"
      - title: "Library of Congress Country Studies: Ethiopia (1991), Contact with European Christendom"
        url: "https://countrystudies.us/ethiopia/12.htm"
        quote: "Susenyos (reigned 1607- 32), after a particularly fierce battle between adherents of the two faiths, abdicated in 1632"
    note: "Supported. The ledger's Library of Congress link (10.htm) is the wrong page: the Susenyos passage is on 12.htm, 'Contact with European Christendom'. Body also said 'Portuguese Jesuits'; Britannica (Fasilides) speaks of 'Spanish and Roman Catholic influence', so the body now says 'Jesuit missionaries'."
  - card: walatta-petros
    fact: "Walatta Petros was a noblewoman born in the 1590s."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "Her anonymous biographer relates that she was born in 1594, the daughter of a lady named Krestos Ebaya and of a nobleman"
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "She was born in 1592 into a noble family"
    note: "Two independent biographies (Belaynesh Michael 1977; Belcher) give 1594 and 1592; both in the 1590s; the difference is in dispute."
  - card: walatta-petros
    fact: "She was the wife of one of the emperor's leading counsellors."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "Walata Petros became the wife of one of the leading personalities of the reign of Susneyos, Malkea Krestos."
      - title: "Wendy Laura Belcher: The Life and Struggles of Our Mother Walatta Petros"
        url: "https://wendybelcher.com/african-literature/walatta-petros/"
        quote: "a noblewoman and the wife of one of the emperor's counselors"
    note: "Both quotes checked on the pages."
  - card: walatta-petros
    fact: "She left her husband to become a nun and joined the resistance to Catholicism."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "at the age of 24, Walata Petros resolved to end her marriage"
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "she again determined to leave her husband, starving herself until he let her go. She immediately went to a monastery on Lake Ṭana and became a nun"
    note: "Both quotes checked on the pages."
  - card: walatta-petros
    fact: "She was summoned before the court and resisted Jesuit efforts to convert her."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "The anti-Catholic activities of Walata Petros and her followers led Susneyos to summon them to court to answer charges brought against them... refused all efforts by the Catholic Patriarch, Bishop Affonso Mendez, and others to convert them to Catholicism"
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "The angry king again called her before the court, and this time she was sentenced to spending Saturdays with the Jesuits, as the head of the mission, Afonso Mendes, worked to convert her."
    note: "Ledger quotes did not show the summons; replaced with passages that do."
  - card: walatta-petros
    fact: "She was banished to the western borderlands, where she founded the first of seven religious communities."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
        quote: "Susneyos then ordered Walata Petros to be exiled to Jabal on the western frontier of Ethiopia... Thus she established at Jabal the first of the seven religious communities that she was to found"
      - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
        url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
        quote: "the king banished her, alone, to the Ethio-Sudan borderlands, Žabay... Thus, Žäbäy was the first of the seven communities prophesized."
    note: "Both quotes checked on the pages."
  - card: walatta-petros
    fact: "Ehete Kristos was her constant companion and became her successor."
    verdict: confirmed
    sources:
      - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
        url: "https://dacb.org/stories/ethiopia/walata-petros/"
