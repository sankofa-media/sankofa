# Expansion batch x01 (2026-11-13): every fact in the bodies and wow lines of the x01 cards,
# with at least two independent sources and a verbatim quote from each (checked against the fetched page text).
# Notes: King Institute pages count as one source per fact; NARA milestone and DOJ voting pages share wording, so a third source is given where they are used.
- card: montgomery-bus-boycott
  fact: "In 1955 Montgomery's city buses were segregated by law and Black passengers could be ordered to give up seats to white riders"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "She was arrested for violating the segregated seating ordinances"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "ordered her to give up her seat for a white man"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Mary Louise Smith was arrested for refusing to yield her seat to a white passenger"}
- card: montgomery-bus-boycott
  fact: "The Women's Political Council, Black professional women led by Jo Ann Robinson, a college teacher, warned the mayor in 1954 of a possible boycott"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In May 1954, WPC president Jo Ann Robinson , an English professor at Alabama State College , warned the mayor in a letter that a bus boycott might be imminent"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "WPC president Jo Ann Robinson reiterated the council’s requests in a 21 May letter to Mayor Gayle, telling him, “There has been talk from twenty-five or more local organizations of planning a city-wide boycott of buses”"}
- card: montgomery-bus-boycott
  fact: "Earlier in 1955 police arrested 15-year-old Claudette Colvin and 18-year-old Mary Louise Smith for not giving up their seats"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "a 15-year-old named Claudette Colvin was arrested for challenging segregation on a Montgomery bus. Seven months later, 18-year-old Mary Louise Smith was arrested for refusing to yield her seat to a white passenger"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In March 1955, Claudette Colvin , a 15-year-old high school junior, refused to give up her bus seat to a white person. She was arrested"}
- card: montgomery-bus-boycott
  fact: "On 1 December 1955 Rosa Parks refused to give up her seat and was arrested"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Sparked by the arrest of Rosa Parks on 1 December 1955"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In the early evening of December 1, 1955, Rosa L. Parks"}
- card: montgomery-bus-boycott
  fact: "That night Robinson and two students mimeographed tens of thousands of leaflets at Alabama State College calling for a one-day boycott on 5 December"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "Robinson and two students stayed up all night at the college mimeographing 50,000 flyers that called for a one-day bus boycott on Monday, December 5"}
    - {title: "Stanford King Institute: Robinson, Jo Ann Gibson", url: "https://kinginstitute.stanford.edu/robinson-jo-ann-gibson", quote: "Late that night, she, two students, and John Cannon, chairman of the Business Department at Alabama State, mimeographed and distributed approximately 52,500 leaflets calling for a boycott of the buses"}
- card: montgomery-bus-boycott
  fact: "On 5 December almost no Black passengers rode the buses"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "On 5 December, 90 percent of Montgomery’s black citizens stayed off the buses"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "On Monday morning, December 5, 1955, few African Americans rode buses"}
- card: montgomery-bus-boycott
  fact: "That afternoon leaders formed the Montgomery Improvement Association and elected King, new to Montgomery, as president"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "In 1954, Martin Luther King became pastor of the Dexter Avenue Baptist Church in Montgomery, Alabama"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "During this meeting the MIA was formed, and King was elected president"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "That afternoon, black leaders created the Montgomery Improvement Association (MIA) to run the bus protest and unexpectedly elected King as MIA president"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "he was so new to Montgomery and to civil rights work"}
- card: montgomery-bus-boycott
  fact: "King was 26 at the time (born 15 January 1929)"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "(January 15, 1929-April 4, 1968)"}
    - {title: "National Park Service: Birth Home, Martin Luther King, Jr. National Historical Park", url: "https://www.nps.gov/malu/planyourvisit/birth-home.htm", quote: "was born here on Tuesday January 15th, 1929"}
- card: montgomery-bus-boycott
  fact: "Boycotters walked or shared rides in an organised carpool, and women did much of the work that kept the boycott going"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The MIA created a highly efficient carpool system managed by women leaders"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "the MIA organized a carpool"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "women played crucial roles in the success of the boycott"}
- card: montgomery-bus-boycott
  fact: "King's house was bombed"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "In early 1956, the homes of King and E. D. Nixon were bombed"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "His house was bombed while his wife, Coretta , and infant daughter were at home"}
- card: montgomery-bus-boycott
  fact: "Dozens of leaders were indicted under an old conspiracy law"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "indicted over 80 boycott leaders under a 1921 law prohibiting conspiracies that interfered with lawful business"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "city leaders indicted nearly 100 boycott leaders on conspiracy charges under an old anti-union law"}
- card: montgomery-bus-boycott
  fact: "Four women, among them Colvin and Smith, sued in federal court (Browder v. Gayle)"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "attorney Fred Gray filed a federal lawsuit on behalf of four female plaintiffs: Claudette Colvin, Mary Louise Smith, Aurelia Browder, and Susan McDonald"}
    - {title: "Stanford King Institute: Browder v. Gayle", url: "https://kinginstitute.stanford.edu/browder-v-gayle-352-us-903", quote: "The original plaintiffs in the case were Aurelia S. Browder, Susie McDonald, Claudette Colvin, Mary Louise Smith, and Jeanatta Reese, but outside pressure convinced Reese to withdraw from the case in February"}
- card: montgomery-bus-boycott
  fact: "In November 1956 the Supreme Court upheld the ruling that bus segregation was unconstitutional"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "in November 1956 the U.S. Supreme Court affirmed Browder v. Gayle and struck down laws requiring segregated seating on public buses"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The U.S. Supreme Court upheld that decision in November"}
- card: montgomery-bus-boycott
  fact: "On 21 December 1956 Black Montgomery boarded desegregated buses"
  sources:
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "black citizens desegregated Montgomery's buses on December 21, 1956"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "On December 21, 1956, after the Supreme Court of the United States had declared unconstitutional the laws requiring segregation on buses, Negroes and whites rode the buses as equals"}
- card: montgomery-bus-boycott
  fact: "The boycott lasted more than a year"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "the Montgomery bus boycott was a 13-month mass protest"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "The boycott lasted 382 days"}
- card: montgomery-bus-boycott
  fact: "The boycott made King a national figure and became a model for nonviolent campaigns across the South"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "The bus boycott demonstrated the potential for nonviolent mass protest to successfully challenge racial segregation and served as an example for other southern campaigns that followed"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The Montgomery experience showed the power of mass nonviolent direct action"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "he emerged as a Negro leader of the first rank"}
- card: march-on-washington
  fact: "On 28 August 1963 the March on Washington for Jobs and Freedom gathered at the Lincoln Memorial"
  sources:
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "On 28 August 1963, more than 200,000 demonstrators took part in the March on Washington for Jobs and Freedom"}
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "the words spoken that day at the Lincoln Memorial"}
- card: march-on-washington
  fact: "The idea came from A. Philip Randolph, founder of the Brotherhood of Sleeping Car Porters, whose 1941 march threat pushed Roosevelt to bar discrimination in the defence industry; he then cancelled it"
  sources:
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "The threat of 100,000 marchers in Washington, D.C., pushed President Franklin D. Roosevelt to issue Executive Order 8802"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "In response, Randolph cancelled plans for the march"}
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "the original idea came from A. Philip Randolph , a labor organizer and founder of the Brotherhood of Sleeping Car Porters"}
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "President Roosevelt signed Executive Order 8802 (Prohibition of Discrimination in the Defense Industry, 1941)"}
- card: march-on-washington
  fact: "Bayard Rustin, Randolph's long-time partner, organised the march"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "Randolph handed the day-to-day planning to his partner in the March on Washington Movement, Bayard Rustin"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "march organizer Bayard Rustin"}
    - {title: "Stanford King Institute: Rustin, Bayard", url: "https://kinginstitute.stanford.edu/rustin-bayard", quote: "Rustin was appointed youth organizer of the proposed 1941 March on Washington, by trade union leader A. Philip Randolph"}
- card: march-on-washington
  fact: "Demands included a strong civil rights bill, jobs and fair employment, and desegregated schools"
  sources:
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "“desegregation of all public schools in 1963”; a massive federal works program “to train and place unemployed workers”; and “a Federal Fair Employment Practices Act barring discrimination in all employment”"}
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "There was a list of \"Ten Demands\" from the sponsors, insisting on a fair living wage, fair employment policies, and desegregation of school districts"}
- card: march-on-washington
  fact: "Some 250,000 people came"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "An estimated 250,000 people attended the March on Washington for Jobs and Freedom on August 28, 1963"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "the peaceful march on Washington, D.C., of 250,000 people"}
- card: march-on-washington
  fact: "John Lewis agreed to cut the sharpest lines of his draft at the request of allies, but the speech he gave was still a sharp one"
  sources:
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "Lewis agreed to eliminate those and other phrases, but believed that in its final form his address “was still a strong speech, very strong”"}
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "Although the SNCC chairman had toned down his remarks at the request of white liberals and moderate black allies, he still managed to criticize both political parties"}
- card: march-on-washington
  fact: "Near the end King delivered the 'I Have a Dream' speech"
  sources:
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "The day’s high point came when King took the podium toward the end of the event"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "to whom he delivered his address, “l Have a Dream”"}
- card: march-on-washington
  fact: "The bill the marchers demanded became the Civil Rights Act of 1964 the following summer"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "support for the Civil Rights Act that the Kennedy Administration was attempting to pass through Congress"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "the provisions of the Civil Rights Act of 1964 and Voting Rights Act of 1965 reflect the demands of the march"}
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "This act, signed into law by President Lyndon Johnson on July 2, 1964"}
- card: march-on-washington
  fact: "The march passed off peacefully"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "In the end, the crowds were calm and there were no incidents reported by police"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "the peaceful march on Washington"}
- card: march-on-washington
  fact: "Wow: the idea was 22 years old (1941 to 1963)"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "the culmination of an idea born more than 20 years before"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "In the summer of 1941 A. Philip Randolph"}
- card: martin-luther-king
  fact: "King was born in Atlanta on 15 January 1929 as Michael; the name was later changed to Martin"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "was born Michael Luther King, Jr., but later had his name changed to Martin"}
    - {title: "National Park Service: Birth Home, Martin Luther King, Jr. National Historical Park", url: "https://www.nps.gov/malu/planyourvisit/birth-home.htm", quote: "Michael Luther King Junior was born here on Tuesday January 15th, 1929, at 12 noon he would later be renamed Martin Luther King Junior"}
    - {title: "National Park Service: Birth Home, Martin Luther King, Jr. National Historical Park", url: "https://www.nps.gov/malu/planyourvisit/birth-home.htm", quote: "located at 501 Auburn Ave. Northeast in Atlanta Georgia"}
- card: martin-luther-king
  fact: "His maternal grandfather and then his father were pastors of Ebenezer Baptist Church"
  sources:
    - {title: "New Georgia Encyclopedia: Martin Luther King Jr. (1929-1968)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/martin-luther-king-jr-1929-1968/", quote: "His maternal grandfather, A. D. Williams, was pastor at Ebenezer from 1894 until 1931. After Williams’s death, the elder King succeeded his father-in-law at the pulpit."}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "His grandfather began the family’s long tenure as pastors of the Ebenezer Baptist Church in Atlanta, serving from 1914 to 1931; his father has served from then until the present"}
    - {title: "Stanford King Institute: Ebenezer Baptist Church", url: "https://kinginstitute.stanford.edu/ebenezer-baptist-church-atlanta-georgia", quote: "In 1894 Adam Daniel Williams , King, Jr.’s maternal grandfather, became Ebenezer’"}
- card: martin-luther-king
  fact: "He studied theology in Pennsylvania (Crozer) and Boston"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "After three years of theological study at Crozer Theological Seminary in Pennsylvania"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "he enrolled in graduate studies at Boston University"}
    - {title: "Stanford King Institute: Ebenezer Baptist Church", url: "https://kinginstitute.stanford.edu/ebenezer-baptist-church-atlanta-georgia", quote: "during his breaks from Crozer Theological Seminary and from his doctoral studies at Boston University"}
- card: martin-luther-king
  fact: "In 1954 he became pastor of Dexter Avenue Baptist Church in Montgomery"
  sources:
    - {title: "New Georgia Encyclopedia: Martin Luther King Jr. (1929-1968)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/martin-luther-king-jr-1929-1968/", quote: "King was offered the position, and in 1954 he moved to Montgomery with Coretta"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "In 1954, Martin Luther King became pastor of the Dexter Avenue Baptist Church in Montgomery, Alabama"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "who had been selected pastor of Montgomery's middle-class Dexter Avenue Baptist Church the previous year"}
- card: martin-luther-king
  fact: "At 26 he was elected to lead the Montgomery bus boycott"
  sources:
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "its president, Martin Luther King, Jr., became a prominent civil rights leader"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "unexpectedly elected King as MIA president"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "January 15, 1929"}
- card: martin-luther-king
  fact: "He was arrested, and his house was bombed with his family at home; no one was hurt"
  sources:
    - {title: "New Georgia Encyclopedia: Martin Luther King Jr. (1929-1968)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/martin-luther-king-jr-1929-1968/", quote: "King and other MIA members were arrested. Segregationists even bombed King’s home."}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "During these days of boycott, King was arrested, his home was bombed"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "His house was bombed while his wife, Coretta , and infant daughter were at home, but they were unharmed"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Be calm as I and my family are. We are not hurt"}
- card: martin-luther-king
  fact: "From 1957 he headed the SCLC, preaching a nonviolence drawn from Christianity and from Gandhi"
  sources:
    - {title: "New Georgia Encyclopedia: Martin Luther King Jr. (1929-1968)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/martin-luther-king-jr-1929-1968/", quote: "In August 1957 the Southern Christian Leadership Conference (SCLC), an organization comprising religious, civic, and political affiliate groups, was launched with King as president"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "In 1957 he was elected president of the Southern Christian Leadership Conference"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "The ideals for this organization he took from Christianity; its operational techniques from Gandhi"}
    - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Christ showed us the way, and Gandhi in India showed it could work"}
    - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "to create the Southern Christian Leadership Conference (SCLC)"}
- card: martin-luther-king
  fact: "Jailed in Birmingham in 1963, he wrote the Letter from Birmingham Jail"
  sources:
    - {title: "New Georgia Encyclopedia: Martin Luther King Jr. (1929-1968)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/martin-luther-king-jr-1929-1968/", quote: "Arrested and jailed for eight days during the Birmingham campaign, King composed his well-known “Letter from Birmingham Jail”"}
    - {title: "Stanford King Institute: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "King’s 12 April 1963 arrest for violating Alabama’s law against mass public demonstrations"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "inspiring his “Letter from a Birmingham Jail”"}
- card: martin-luther-king
  fact: "That August he spoke at the March on Washington"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "he directed the peaceful march on Washington, D.C., of 250,000 people to whom he delivered his address"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "During this event, Martin Luther King delivered his memorable “ I Have a Dream ” speech"}
- card: martin-luther-king
  fact: "In 1964, at 35, he became the youngest Nobel Peace Prize recipient up to then"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "At the age of thirty-five, Martin Luther King, Jr., was the youngest man to have received the Nobel Peace Prize"}
    - {title: "National Park Service: Frequently Asked Questions about Dr. Martin Luther King, Jr.", url: "https://home.nps.gov/malu/faq_dr_martin_luther_king_jr.htm", quote: "Dr. King received the Nobel Peace prize in 1964 at the age of 35 years old, making him the youngest recipient to that time"}
    - {title: "National Archives: House Select Committee on Assassinations, Findings on MLK Assassination", url: "https://www.archives.gov/research/jfk/select-committee-report/part-2-king-findings.html", quote: "At age 35, he was the youngest recipient of the award in history"}
- card: martin-luther-king
  fact: "He gave the prize money to the movement, sharing it among civil rights organisations"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "he announced that he would turn over the prize money of $54,123 to the furtherance of the civil rights movement"}
    - {title: "Stanford King Institute: Nobel Peace Prize", url: "https://kinginstitute.stanford.edu/nobel-peace-prize", quote: "King shared the $54,000 monetary prize with leading civil rights groups"}
- card: martin-luther-king
  fact: "The Selma campaign he joined pushed Congress to pass the Voting Rights Act in 1965"
  sources:
    - {title: "Stanford King Institute: Voting Rights Act of 1965", url: "https://kinginstitute.stanford.edu/voting-rights-act-1965", quote: "The law came seven months after Martin Luther King launched a Southern Christian Leadership Conference (SCLC) campaign based in Selma, Alabama, with the aim of pressuring Congress to pass such legislation"}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "Finally, the unprovoked attack on March 7, 1965, by state troopers on peaceful marchers crossing the Edmund Pettus Bridge in Selma, Alabama, en route to the state capitol in Montgomery, persuaded the President and Congress"}
- card: martin-luther-king
  fact: "In April 1968 he went to Memphis to support striking Black sanitation workers"
  sources:
    - {title: "Stanford King Institute: Memphis Sanitation Workers' Strike", url: "https://kinginstitute.stanford.edu/memphis-sanitation-workers-strike", quote: "He arrived on 3 April and was persuaded to speak by a crowd of dedicated sanitation workers"}
    - {title: "Stanford King Institute: Memphis Sanitation Workers' Strike", url: "https://kinginstitute.stanford.edu/memphis-sanitation-workers-strike", quote: "1,300 black men from the Memphis Department of Public Works went on strike"}
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "where he was to lead a protest march in sympathy with striking garbage workers of that city"}
- card: martin-luther-king
  fact: "On 4 April 1968 he was shot dead on the balcony of the Lorraine Motel, aged 39"
  sources:
    - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "On the evening of April 4, 1968, while standing on the balcony of his motel room in Memphis, Tennessee"}
    - {title: "Stanford King Institute: Memphis Sanitation Workers' Strike", url: "https://kinginstitute.stanford.edu/memphis-sanitation-workers-strike", quote: "he was shot and killed on the balcony of the Lorraine Motel"}
    - {title: "National Park Service: Frequently Asked Questions about Dr. Martin Luther King, Jr.", url: "https://home.nps.gov/malu/faq_dr_martin_luther_king_jr.htm", quote: "Dr. King was assassinated on Thursday, April 4, 1968 at 39 years of age"}
- card: fannie-lou-hamer
  fact: "Born in Mississippi in 1917, the youngest of twenty children of sharecroppers"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "was born in 1917 in Montgomery County, Mississippi, the youngest of the twenty children of sharecroppers"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "Born to sharecroppers in Montgomery County, Mississippi, in 1917, Fannie Lou was the youngest of 20 children"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "She was born in 1917, the youngest of twenty children"}
- card: fannie-lou-hamer
  fact: "She grew up on a cotton plantation in Sunflower County"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "Townsend grew up on the E. W. Brandon Plantation in Sunflower County"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "She began picking cotton on the plantation at age six"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "She grew up on a Sunflower County plantation"}
- card: fannie-lou-hamer
  fact: "She left school after the sixth grade"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "after sixth grade left school entirely"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "After reaching the sixth grade at the age of 12, she dropped out of school"}
- card: fannie-lou-hamer
  fact: "For nearly two decades she and her husband Perry worked on a plantation outside Ruleville, where she was timekeeper"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "In 1944 she married Perry “Pap” Hamer, also a sharecropper, and the two moved to the W. D. Marlow Plantation outside Ruleville"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "served as timekeeper for the plantation"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "For the next 18 years, she worked as a sharecropper and a timekeeper for the plantation owner"}
- card: fannie-lou-hamer
  fact: "In 1962 SNCC organisers came to the county to register Black voters and Hamer tried to register"
  sources:
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "In 1962 Robert Moses and other members of the Student Nonviolent Coordinating Committee (SNCC) came to Sunflower County to register black voters"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "Hamer attempted to register to vote"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "In 1962, after Hamer attempted to register to vote"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "In August of 1962, eighteen local people from Sunflower County, Mississippi, including Mrs. Hamer"}
- card: fannie-lou-hamer
  fact: "The owner fired her and forced her off the land"
  sources:
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "he fired Hamer and forced her to leave her home"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "W. D. Marlow evicted the Hamers"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "Mrs. Hamer refused and was immediately kicked off his land"}
- card: fannie-lou-hamer
  fact: "In 1963 she was arrested with other activists and beaten in the Winona jail, with lifelong injuries"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "in 1963 she and several other SNCC workers returning from a voter registration conference in South Carolina were arrested and taken to the Winona jail and severely beaten. Hamer never completely recovered from injuries sustained in the attack"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "Hamer was so severely beaten in the Winona, Mississippi, jail that she suffered kidney damage and was made partially blind"}
- card: fannie-lou-hamer
  fact: "She joined the SNCC staff"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "in 1963 she and several other SNCC workers returning from a voter registration conference in South Carolina were arrested"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "became the oldest SNCC employee and worked as a field secretary for the organization"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "Home » People » SNCC Staff » Fannie Lou Hamer"}
- card: fannie-lou-hamer
  fact: "In 1964 she cast her first vote; she twice ran for Congress herself"
  sources:
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "“I cast my first vote for myself, because I was running for Congress,”"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "the following year she cast her first vote in a Mississippi election"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "She twice ran unsuccessfully for the US Congress"}
- card: fannie-lou-hamer
  fact: "That summer she helped found the MFDP to challenge the all-white delegation at the Democratic convention in Atlantic City"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "Later in 1964 Hamer became one of the founding members of the Mississippi Freedom Democratic Party, which challenged the seating of the state’s all-white delegation to the Democratic National Convention in Atlantic City"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "When the MFDP challenged the all-white Mississippi delegation at the 1964 Democratic National Convention in Atlantic City, New Jersey"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "In 1964, Mrs. Hamer helped found the Mississippi Freedom Democratic Party (MFDP)"}
- card: fannie-lou-hamer
  fact: "She testified to the credentials committee about her beating and ended 'I question America'"
  sources:
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "Hamer closed her testimony, which was later broadcast in full on the evening news, by stating: “If the Freedom Democratic Party is not seated now, I question America”"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "Hamer’s “I Question America” speech at the convention"}
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "Describing her brutal treatment at the hands of the Mississippi state police"}
- card: fannie-lou-hamer
  fact: "(wow) President Johnson called a press conference to draw the cameras away from her testimony"
  sources:
    - {title: "SNCC Digital Gateway: Fannie Lou Hamer", url: "https://snccdigital.org/people/fannie-lou-hamer/", quote: "President Johnson staged an impromptu press conference for fear of the power of her story"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "President Lyndon B. Johnson scheduled a live address at the same time, forcing networks to break away from her speech"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "despite President Lyndon Johnson’s attempts to prevent the nation from seeing and hearing her"}
- card: fannie-lou-hamer
  fact: "Offered two seats, she said: 'We didn't come all this way for no two seats'"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "When the Democratic Party offered to give two convention seats to the Mississippi Freedom Democrats, she replied, “We didn’t come all this way for no two seats.”"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "“We didn’t come all this way for no two seats!”"}
- card: fannie-lou-hamer
  fact: "She was a delegate in 1968, founded Freedom Farm in 1969 and died in 1977"
  sources:
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "she served as a delegate to the 1968 and 1972 Democratic National Conventions"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "the Freedom Farm Cooperative, founded in 1969"}
    - {title: "Lisa K. Speer, Mississippi Encyclopedia: Fannie Lou Hamer", url: "https://mississippiencyclopedia.org/entries/fannie-lou-hamer/", quote: "she died on 14 March 1977"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "as a delegate to the 1968 Democratic National Convention"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "In 1969, Hamer helped found the Freedom Farms Corporation, a nonprofit farming cooperative organized to alleviate hunger"}
    - {title: "Stanford King Institute: Hamer, Fannie Lou", url: "https://kinginstitute.stanford.edu/hamer-fannie-lou", quote: "October 6, 1917 to March 14, 1977"}
- card: selma-1965
  fact: "In 1965 only about 2 per cent of Black residents of Dallas County were registered"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "only two percent were on the voting rolls"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "only 2% percent in Dallas County"}
- card: selma-1965
  fact: "Local activists (Dallas County Voters League), SNCC and SCLC ran a voting-rights campaign in Selma from January 1965, met by mass arrests under Sheriff Jim Clark"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "On 2 January 1965 King and SCLC joined SNCC, the Dallas County Voters League, and other local African American activists in a voting rights campaign in Selma"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "The demonstrations, which began on January 18, 1965, produced rapidly escalating tensions in Selma, culminating in mass arrests by authorities under the direction of Sheriff James G. Clark, Jr."}
- card: selma-1965
  fact: "On 18 February a state trooper shot Jimmie Lee Jackson at a night march in Marion; he died eight days later"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "On the night of 18 February, Alabama state troopers joined local police breaking up an evening march in Marion. In the ensuing melee, a state trooper shot Jimmie Lee Jackson"}
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "Jackson died eight days later in a Selma hospital"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "Trooper J. Bonard Fowler shot black laborer Jimmie Lee Jackson in the stomach"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "Jackson died in a Selma hospital on February 26"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On the evening of February 18 th , 1965, a night protest took place"}
- card: selma-1965
  fact: "In response about 600 people set out on Sunday 7 March to walk 54 miles to Montgomery, led by Hosea Williams and John Lewis"
  sources:
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On March 7 th , approximately 600 non-violent protestors, the vast majority being African-American, departed from Brown Chapel African Methodist Episcopal Church in Selma intent on marching 54 miles to Montgomery"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On Sunday, March 7, some 600 black protesters, led by SCLC's Hosea Williams and SNCC's John Lewis , undertook the march"}
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "In response to Jackson’s death, activists in Selma and Marion set out on 7 March to march from Selma to the state capitol in Montgomery"}
- card: selma-1965
  fact: "On the Edmund Pettus Bridge troopers and mounted possemen attacked with clubs and tear gas; more than fifty needed hospital treatment"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "the troopers attacked the crowd with clubs and tear gas. Mounted police chased retreating marchers"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "15 mounted members of the sheriff's deputized posse"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "Fifty-six black marchers were hospitalized"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "at least 50 protestors required hospital treatment"}
- card: selma-1965
  fact: "Television carried 'Bloody Sunday' nationwide"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "Television coverage of “Bloody Sunday,” as the event became known, triggered national outrage"}
    - {title: "National Archives, Center for Legislative Archives: Congress and the Voting Rights Act of 1965", url: "https://www.archives.gov/legislative/features/voting-rights-1965", quote: "News cameras filmed the violence in what became known as “Bloody Sunday.”"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "receiving large scale media coverage"}
- card: selma-1965
  fact: "Two days later King led some 2,000 back to the bridge, knelt to pray and turned around"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "He led more than 2,000 marchers"}
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "then stopped and asked them to kneel and pray. After prayers they rose and turned the march back to Selma"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "Dr. King led a second march of approximately 2,000 protestors to the site of the Bloody Sunday attack"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "Dr. King and other clergy led the group in prayer, turned them around"}
- card: selma-1965
  fact: "That night white men beat the Unitarian minister James Reeb, who died"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "several local whites attacked James Reeb , a white Unitarian minister who had come from Massachusetts to join the protest. His death two days later"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "three Unitarian ministers who had traveled to Selma in order to join the protest were attacked by a group of white men. On March 11 th Rev. James Reeb died from his injuries"}
- card: selma-1965
  fact: "Federal judge Frank M. Johnson Jr. authorised the march"
  sources:
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On March 17, after five days of testimony, Judge Johnson granted an order authorizing the march"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On March 17th, Federal Judge Frank M. Johnson, Jr. ruled that the march could go on to Montgomery"}
- card: selma-1965
  fact: "About 8,000 left Selma on 21 March; 25,000 gathered at the capitol on 25 March"
  sources:
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On March 21, King led a diverse group of 8,000 demonstrators out of Selma"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On the final day, March 25, King addressed a throng of 25,000 from the front of the capitol"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On March 21 st , the final Selma to Montgomery March began, with more than 8,000 protestors"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "the crowd making their way to the state capital building had grown to nearly 25,000 protestors"}
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "the number of demonstrators swelled on the last day to 25,000"}
- card: selma-1965
  fact: "That night Klansmen murdered Viola Liuzzo, a volunteer driving marchers home"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "while ferrying Selma demonstrators back home from Montgomery, Viola Liuzzo, a housewife from Michigan who had come to Alabama to volunteer, was shot and killed by four members of the Ku Klux Klan"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "a car containing four Birmingham Ku Klux Klansmen overtook one driven by Viola Gregg Liuzzo of Detroit, who had been ferrying demonstrators back to Selma from Montgomery"}
- card: selma-1965
  fact: "The march pushed Congress to act; on 6 August Johnson signed the Voting Rights Act"
  sources:
    - {title: "Stanford King Institute: Selma to Montgomery March", url: "https://kinginstitute.stanford.edu/selma-montgomery-march", quote: "On 6 August, in the presence of King and other civil rights leaders, President Johnson signed the Voting Rights Act of 1965"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On August 6th, five months after the marches, President Johnson signed the Voting Rights Act of 1965 into law"}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "persuaded the President and Congress to overcome Southern legislators' resistance to effective voting rights legislation"}
- card: selma-1965
  fact: "(wow) Eighteen days separated Bloody Sunday (7 March) from the 25,000-strong rally at the capitol (25 March)"
  sources:
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On Sunday, March 7"}
    - {title: "Encyclopedia of Alabama: Selma to Montgomery March", url: "https://encyclopediaofalabama.org/article/selma-to-montgomery-march/", quote: "On the final day, March 25"}
    - {title: "National Park Service: Selma to Montgomery National Historic Trail, History & Culture", url: "https://www.nps.gov/semo/learn/historyculture/index.htm", quote: "On Thursday, March 25th, the last day of the march"}
- card: civil-rights-act-1964
  fact: "In June 1963 President Kennedy sent Congress a broad civil rights bill"
  sources:
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "The civil rights legislation that Kennedy introduced to Congress on 19 June 1963"}
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "Soon after, Kennedy proposed that Congress consider civil rights legislation that would address voting rights, public accommodations, school desegregation"}
- card: civil-rights-act-1964
  fact: "The March on Washington rallied behind the bill"
  sources:
    - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "support for the Civil Rights Act that the Kennedy Administration was attempting to pass through Congress"}
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "In an article published after the 1963 March on Washington for Jobs and Freedom"}
    - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "The march was successful in pressuring the administration of John F. Kennedy to initiate a strong federal civil rights bill in Congress"}
- card: civil-rights-act-1964
  fact: "After Kennedy's assassination Johnson pressed the bill"
  sources:
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "Following Kennedy’s assassination in November 1963, King continued to press for the bill as did newly inaugurated President Lyndon B. Johnson"}
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "Despite Kennedy’s assassination in November of 1963, his proposal culminated in the Civil Rights Act of 1964"}
- card: civil-rights-act-1964
  fact: "Southern senators filibustered until Dirksen gathered Republican votes to cut off debate"
  sources:
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "In the Senate, Southern Democratic opponents attempted to talk the bill to death in a filibuster"}
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "the efforts of Senate Minority Leader Everett Dirksen of Illinois, who convinced enough Republicans to support the bill"}
    - {title: "U.S. Senate: Civil Rights Filibuster Ended", url: "https://www.senate.gov/about/powers-procedures/filibusters-cloture/civil-rights-filibuster-ended.htm", quote: "Minority Leader Everett Dirksen , who had enlisted the Republican votes that made cloture a realistic option"}
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "a filibuster by southern senators that lasted 75 days"}
- card: civil-rights-act-1964
  fact: "On 2 July 1964 Johnson signed the Act with King among those present"
  sources:
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "On 2 July 1964, Johnson signed the new Civil Rights Act of 1964 into law with King and other civil rights leaders present"}
    - {title: "US House of Representatives, History, Art & Archives: The Civil Rights Act of 1964", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Civil-Rights-Act-of-1964/", quote: "Those gathered behind President Johnson at the bill signing included civil rights leader Martin Luther King, Jr."}
- card: civil-rights-act-1964
  fact: "The Act outlawed segregation in public places (hotels, restaurants, theatres), banned employment discrimination including by sex, and created the EEOC"
  sources:
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "The act outlawed segregation in businesses such as theaters, restaurants, and hotels. It banned discriminatory practices in employment"}
    - {title: "National Archives: Civil Rights Act (1964)", url: "https://www.archives.gov/milestone-documents/civil-rights-act", quote: "Title VII of the act created the Equal Employment Opportunity Commission (EEOC)"}
    - {title: "Stanford King Institute: Civil Rights Act of 1964", url: "https://kinginstitute.stanford.edu/civil-rights-act-1964", quote: "created the Equal Employment Opportunity Commission to address race and sex discrimination in employment"}
    - {title: "US House of Representatives, History, Art & Archives: The Civil Rights Act of 1964", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Civil-Rights-Act-of-1964/", quote: "prohibited discrimination in public accommodations"}
- card: civil-rights-act-1964
  fact: "After the Selma attack in March 1965 Johnson sent Congress a voting rights bill and signed it on 6 August"
  sources:
    - {title: "Stanford King Institute: Voting Rights Act of 1965", url: "https://kinginstitute.stanford.edu/voting-rights-act-1965", quote: "Johnson introduced the Voting Rights Act that same month, “with the outrage of Selma still fresh”"}
    - {title: "Stanford King Institute: Voting Rights Act of 1965", url: "https://kinginstitute.stanford.edu/voting-rights-act-1965", quote: "On 6 August 1965 President Lyndon B. Johnson signed the Voting Rights Act into law"}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "President Johnson signed the resulting legislation into law on August 6, 1965"}
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "This act was signed into law on August 6, 1965, by President Lyndon Johnson"}
- card: civil-rights-act-1964
  fact: "The VRA banned literacy tests, sent federal examiners to register voters, and required preclearance of election-rule changes"
  sources:
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "outlawed literacy tests and provided for the appointment of federal examiners (with the power to register qualified citizens to vote)"}
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "Section 5 of the act required covered jurisdictions to obtain \"preclearance\""}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "the Attorney General could designate a county covered by these special provisions for the appointment of a federal examiner to review the qualifications of persons who wanted to register to vote"}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "could not implement any change affecting voting until the Attorney General or the United States District Court for the District of Columbia determined"}
    - {title: "Stanford King Institute: Voting Rights Act of 1965", url: "https://kinginstitute.stanford.edu/voting-rights-act-1965", quote: "abolished literacy tests and poll taxes designed to disenfranchise African American voters and gave the federal government the authority to take over voter registration in counties with a pattern of persistent discrimination"}
    - {title: "Oyez: Shelby County v. Holder (2013)", url: "https://www.oyez.org/cases/2012/12-96", quote: "the formula for determining whether changes to a state's voting procedure should be federally reviewed"}
- card: civil-rights-act-1964
  fact: "(wow) This came nearly a century after the Fifteenth Amendment promised the vote"
  sources:
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "was signed into law 95 years after the amendment was ratified"}
    - {title: "U.S. Department of Justice: History of Federal Voting Rights Laws", url: "https://www.justice.gov/crt/history-federal-voting-rights-laws", quote: "After enduring nearly a century of systematic resistance to the Fifteenth Amendment"}
- card: civil-rights-act-1964
  fact: "In 1966 the Supreme Court struck down Virginia's poll tax"
  sources:
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "In Harper v. Virginia State Board of Elections , 383 U.S. 663 (1966), the Supreme Court held Virginia's poll tax to be unconstitutional"}
    - {title: "Oyez: Harper v. Virginia Board of Elections (1966)", url: "https://www.oyez.org/cases/1965/48", quote: "the Court held the poll tax violated the Equal Protection Clause"}
- card: civil-rights-act-1964
  fact: "In 2013 Shelby County v. Holder voided the coverage formula"
  sources:
    - {title: "National Archives: Voting Rights Act (1965)", url: "https://www.archives.gov/milestone-documents/voting-rights-act", quote: "In 2013, the Court struck down a key provision of the act involving federal oversight of voting rules in nine states"}
    - {title: "Oyez: Shelby County v. Holder (2013)", url: "https://www.oyez.org/cases/2012/12-96", quote: "The Court also held that the formula for determining whether changes to a state's voting procedure should be federally reviewed is now outdated"}
- card: ghana-1957
  fact: "On 6 March 1957 the British colony of the Gold Coast became independent Ghana"
  sources:
    - {title: "Kenneth W. Heger, Prologue (National Archives), Winter 1999: Race Relations in the United States and American Cultural and Informational Programs in Ghana, 1957–1966", url: "https://www.archives.gov/publications/prologue/1999/winter/us-and-ghana-1957-1966", quote: "On March 6, 1957, American relations with Africa entered a new era when Ghana, the former British colony of Gold Coast, gained its independence"}
    - {title: "Office of the Historian, U.S. Department of State: Ghana", url: "https://history.state.gov/countries/ghana", quote: "Ghana, formerly known as the Gold Coast, was proclaimed independent from the British Empire"}
    - {title: "BBC On This Day: 1957, Ghana celebrates independence", url: "http://news.bbc.co.uk/onthisday/hi/dates/stories/march/6/newsid_2515000/2515459.stm", quote: "The people of Ghana have been celebrating the end of colonial rule and the dawn of their independence"}
- card: ghana-1957
  fact: "Ghana was hailed as the first colony south of the Sahara to win independence (contested: Sudan, recognised 1 January 1956)"
  sources:
    - {title: "Kenneth W. Heger, Prologue (National Archives), Winter 1999: Race Relations in the United States and American Cultural and Informational Programs in Ghana, 1957–1966", url: "https://www.archives.gov/publications/prologue/1999/winter/us-and-ghana-1957-1966", quote: "As the first sub-Saharan colony to gain independence"}
    - {title: "NPR, News & Notes: 'Our Ghana' at 50 (2007)", url: "https://www.npr.org/2007/03/06/7728721/our-ghana-at-50", quote: "Ghana was the first sub-Saharan African country to gain independence from colonial rule"}
    - {title: "Office of the Historian, U.S. Department of State: Sudan", url: "https://history.state.gov/countries/sudan", quote: "The United States recognized the Republic of Sudan on January 1, 1956"}
- card: ghana-1957
  fact: "Nkrumah studied at Lincoln University and the University of Pennsylvania"
  sources:
    - {title: "Encyclopaedia Britannica: Kwame Nkrumah (archived copy)", url: "https://www.britannica.com/biography/Kwame-Nkrumah", quote: "He entered Lincoln University in Pennsylvania in 1935 and, after graduating in 1939, obtained master’s degrees from Lincoln and from the University of Pennsylvania"}
    - {title: "NPR, News & Notes: 'Our Ghana' at 50 (2007)", url: "https://www.npr.org/2007/03/06/7728721/our-ghana-at-50", quote: "Nkrumah got his undergraduate degree at Lincoln University in Philly and went to the University of Pennsylvania for grad school"}
- card: ghana-1957
  fact: "In 1949 Nkrumah founded the Convention People's Party to demand self-government"
  sources:
    - {title: "Encyclopaedia Britannica: Kwame Nkrumah (archived copy)", url: "https://www.britannica.com/biography/Kwame-Nkrumah", quote: "he formed in June 1949 the new Convention Peoples’ Party (CPP), a mass-based party that was committed to a program of immediate self-government"}
    - {title: "Ryan Hurst, BlackPast: Kwame Nkrumah (1909-1972)", url: "https://www.blackpast.org/global-african-history/nkrumah-kwame-1909-1972/", quote: "in 1949 Nkrumah split with the organization over its political objectives and formed the Convention People’s Party (CPP)"}
- card: ghana-1957
  fact: "Imprisoned in 1950, he was released in 1951 after his party won the election in a landslide, and became prime minister in 1952"
  sources:
    - {title: "Ryan Hurst, BlackPast: Kwame Nkrumah (1909-1972)", url: "https://www.blackpast.org/global-african-history/nkrumah-kwame-1909-1972/", quote: "Imprisoned by the British in 1950 for his political activities, Nkrumah was released in 1951 when his party won the general election in a landslide victory. He subsequently was elected prime minister in 1952"}
    - {title: "Encyclopaedia Britannica: Kwame Nkrumah (archived copy)", url: "https://www.britannica.com/biography/Kwame-Nkrumah", quote: "Elected to Parliament, Nkrumah was released from prison to become leader of gover"}
    - {title: "Encyclopaedia Britannica: Kwame Nkrumah (archived copy)", url: "https://www.britannica.com/biography/Kwame-Nkrumah", quote: "and, in 1952, prime minister of the Gold Coast"}
- card: ghana-1957
  fact: "At the stroke of midnight Nkrumah proclaimed independence in Accra"
  sources:
    - {title: "Kenneth W. Heger, Prologue (National Archives), Winter 1999: Race Relations in the United States and American Cultural and Informational Programs in Ghana, 1957–1966", url: "https://www.archives.gov/publications/prologue/1999/winter/us-and-ghana-1957-1966", quote: "At the stroke of midnight, March 6, 1957, Kwame Nkrumah proclaims Ghana's independence"}
    - {title: "Stanford King Institute: Ghana Trip", url: "https://kinginstitute.stanford.edu/ghana-trip", quote: "At midnight on 6 March, King attended the official ceremony in which the British Union Jack was lowered and the new flag of Ghana was raised"}
- card: ghana-1957
  fact: "Vice-President Richard Nixon led the US delegation"
  sources:
    - {title: "Kenneth W. Heger, Prologue (National Archives), Winter 1999: Race Relations in the United States and American Cultural and Informational Programs in Ghana, 1957–1966", url: "https://www.archives.gov/publications/prologue/1999/winter/us-and-ghana-1957-1966", quote: "the Eisenhower administration chose Vice President Richard Nixon to lead the American delegation to Ghana's independence celebrations"}
    - {title: "Stanford King Institute: Ghana Trip", url: "https://kinginstitute.stanford.edu/ghana-trip", quote: "attended a reception where he met then Vice President Richard Nixon"}
- card: ghana-1957
  fact: "Martin Luther King Jr. attended, soon after the Montgomery bus boycott"
  sources:
    - {title: "Stanford King Institute: Ghana Trip", url: "https://kinginstitute.stanford.edu/ghana-trip", quote: "In March 1957, Martin Luther King, Jr., and his wife Coretta Scott King traveled to West Africa to attend Ghana’s independence ceremony"}
    - {title: "Stanford King Institute: Ghana Trip", url: "https://kinginstitute.stanford.edu/ghana-trip", quote: "on the heels of the successful Montgomery bus boycott"}
    - {title: "NPR, News & Notes: 'Our Ghana' at 50 (2007)", url: "https://www.npr.org/2007/03/06/7728721/our-ghana-at-50", quote: "Dr. Martin Luther King, Jr. was there at the moment freedom was announced"}
- card: ghana-1957
  fact: "(wow) King reportedly invited Nixon to Alabama, where Black people sought the same freedom"
  sources:
    - {title: "Stanford King Institute: Ghana Trip", url: "https://kinginstitute.stanford.edu/ghana-trip", quote: "King told Nixon, “I want you to come visit us down in Alabama where we are seeking the same kind of freedom the Gold Coast is celebrating”"}
    - {title: "NPR, News & Notes: 'Our Ghana' at 50 (2007)", url: "https://www.npr.org/2007/03/06/7728721/our-ghana-at-50", quote: "It is reported that Doctor King told Richard Nixon on that day, I want you to come and visit us in Alabama where we are seeking the same kind of freedom Ghana is celebrating"}
- card: ghana-1957
  fact: "Free Ghana drew Black American leaders and icons; Malcolm X was among them"
  sources:
    - {title: "NPR, News & Notes: 'Our Ghana' at 50 (2007)", url: "https://www.npr.org/2007/03/06/7728721/our-ghana-at-50", quote: "A whole lot of American leaders and icons flocked to Ghana in the years just before and just after its independence. People like Malcolm X"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "was received like a visiting head of state in many countries including Egypt, Nigeria, Tanzania, Kenya, and Ghana"}
- card: ghana-1957
  fact: "Nkrumah banned other parties; overthrown in a 1966 coup while abroad; died in exile in 1972"
  sources:
    - {title: "BBC On This Day: 1957, Ghana celebrates independence", url: "http://news.bbc.co.uk/onthisday/hi/dates/stories/march/6/newsid_2515000/2515459.stm", quote: "He banned all opposition parties. He was deposed in 1966 by a military coup while on a trip to Peking. He later died in exile in Romania in 1972"}
    - {title: "Ryan Hurst, BlackPast: Kwame Nkrumah (1909-1972)", url: "https://www.blackpast.org/global-african-history/nkrumah-kwame-1909-1972/", quote: "Nkrumah subsequently outlawed all other political parties. In 1966, Nkrumah’s government was overthrown by a coup d’état while he was on a trip to Beijing, China"}
    - {title: "Ryan Hurst, BlackPast: Kwame Nkrumah (1909-1972)", url: "https://www.blackpast.org/global-african-history/nkrumah-kwame-1909-1972/", quote: "He died in Bucharest, Romania on April 27, 1972"}
- card: ghana-1957
  fact: "In 1960 seventeen more African colonies became independent"
  sources:
    - {title: "African Studies Centre Leiden: Infosheets on the 17 African countries that gained independence in 1960", url: "https://ascleiden.nl/news/infosheets-17-african-countries-gained-independence-1960", quote: "1960 was the ‘Year of Africa’: seventeen colonies in Africa became politically independent"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "with 17 new countries created that year"}
- card: year-of-africa-1960
  fact: "In 1960 seventeen African colonies became independent, and the year is known as the Year of Africa"
  sources:
    - {title: "African Studies Centre Leiden: Infosheets on the 17 African countries that gained independence in 1960", url: "https://ascleiden.nl/news/infosheets-17-african-countries-gained-independence-1960", quote: "1960 was the ‘Year of Africa’: seventeen colonies in Africa became politically independent"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "1960, often known as the Year of Africa, marked a turning point of African independence with 17 new countries created that year"}
- card: year-of-africa-1960
  fact: "Among them was the Belgian Congo, independent on 30 June 1960"
  sources:
    - {title: "African Studies Centre Leiden: Infosheets on the 17 African countries that gained independence in 1960", url: "https://ascleiden.nl/news/infosheets-17-african-countries-gained-independence-1960", quote: "ASCL Infosheet 'DRC at 60' (independent 30 June 1960)"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "The conference set Congo’s independence for June 30, 1960"}
- card: year-of-africa-1960
  fact: "In January and February 1960 Congolese politicians and Belgian officials met at a Round Table in the Palais des Congrès, Brussels, which set independence for 30 June"
  sources:
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "Palais des Congrès, Brussels, 20 January to 20 February 1960 The first Round Table leads rapidly to agreement in principle on Congo's immedia"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "Congolese politicians and Belgian administrators met in January 1960 to negotiate the colony’s fate"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "The conference set Congo’s independence for June 30, 1960"}
- card: year-of-africa-1960
  fact: "The Kanza brothers brought Joseph Kabasele (Le Grand Kallé) and musicians from African Jazz and OK Jazz to Brussels"
  sources:
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "Thomas Kanza had the great idea of sending a telegram to his brother Philippe Kanza, asking him to form a band comprised of musicians from OK Jazz and African Jazz"}
    - {title: "Alan Brain, PAM (Pan African Music): The other heroes of the Round Table (2021)", url: "https://pan-african-music.com/en/round-table-independence-cha-cha/", quote: "The brothers Thomas and Philippe Kanza, who were the owners of the Congo newspaper, took over the organization of the whole trip"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "Grand Kallé and African Jazz, along with two members of rival musical group OK Jazz, accompanied the Congolese delegation to Brussels"}
- card: year-of-africa-1960
  fact: "In Brussels the band introduced 'Indépendance Cha Cha', a Congolese rumba in cha-cha time in Lingala and French"
  sources:
    - {title: "Alan Brain, PAM (Pan African Music): The other heroes of the Round Table (2021)", url: "https://pan-african-music.com/en/round-table-independence-cha-cha/", quote: "Immediately after the battle cry of Kanza, Grand Kallé and African Jazz launched into their new song “Indépendance Cha Cha”"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "in their original Lingala and French, these lyrics set to an Afro-Cuban beat"}
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "In the songs 'Indépendance Cha Cha' and 'Table Ronde', the musicians tell the story as it's happening"}
- card: year-of-africa-1960
  fact: "The song named the parties and leaders, including Kasavubu, Lumumba and Tshombe"
  sources:
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "'Indépendance Cha Cha' cites the names of the mo"}
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "Bolikango, Kasavubu Mpe Lumumba na Kalonji Bolya, Tshombe, Kamitatu"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "was one of many politicians named in Independence Cha Cha"}
- card: year-of-africa-1960
  fact: "It became a hit beyond Congo and an independence anthem of other African countries"
  sources:
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "It soon becomes the independence anthem of other African countries"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "is widely considered to be the first pan-African hit"}
- card: year-of-africa-1960
  fact: "Soon after independence Katanga under Tshombe seceded"
  sources:
    - {title: "UN Dag Hammarskjöld Library: Dag Hammarskjöld, the UN years, 1960", url: "https://static.un.org/depts/dhl/dag/time1960.htm", quote: "On 11 July, Mr. Tshombé, who had requested the Belgian paratroops, proclaimed the independence of Katanga"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "secessionist movements in the southern regions of Katanga and South Kasai"}
- card: year-of-africa-1960
  fact: "Lumumba was ousted, imprisoned and killed in Katanga early in 1961"
  sources:
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "Lumumba, a radical nationalist, was soon ousted by Kasavubu"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "to assassinate Lumumba in January 1961"}
    - {title: "UN Dag Hammarskjöld Library: Dag Hammarskjöld, the UN years, 1961", url: "https://static.un.org/depts/dhl/dag/time1961.htm", quote: "Since his capture in December 1960, Patrice Lumumba had been kept prisoner at Thysville. On 17 January, he was transferred to Katanga"}
- card: year-of-africa-1960
  fact: "It is perhaps the most famous Congolese song"
  sources:
    - {title: "Royal Museum for Central Africa: Round Table / Indépendance Cha Cha", url: "https://independance.africamuseum.be/en/node/220", quote: "'Indépendance Cha Cha' is probably the most famous Congolese song"}
    - {title: "Katherine Everett, Emily Hardick, Damarius Johnson, Origins (Ohio State University): The Year of Africa", url: "https://origins.osu.edu/article/year-of-africa-1960-rumba-pan-africanism-Kariba", quote: "the most famous song of 1960"}
