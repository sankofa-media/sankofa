- card: malcolm-x
  fact: "On 21 February 1965 he was shot dead at the Audubon Ballroom in upper Manhattan"
  sources:
    - {title: "National Registry of Exonerations: Khalil Islam", url: "https://exonerationregistry.org/cases/13121", quote: "The murder happened just after 3 p.m. on February 21, 1965. Malcolm was starting to give a speech at the Audubon Ballroom on 165th Street and Broadway in upper Manhattan"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "on February 21, 1965, Malcolm X was assassinated at the Audubon Ballroom in the Washington Heights section of Manhattan"}
    - {title: "Innocence Project: Khalil Islam", url: "https://innocenceproject.org/cases/khalil-islam/", quote: "Just after 3 p.m. on Feb. 21, 1965, Malcolm was starting to give a speech at the Audubon Ballroom on 165th Street and Broadway in upper Manhattan, New York"}
- card: malcolm-x
  fact: "In November 2021 a Manhattan judge vacated the convictions of Muhammad Aziz and Khalil Islam"
  sources:
    - {title: "National Registry of Exonerations: Khalil Islam", url: "https://exonerationregistry.org/cases/13121", quote: "On November 18, 2021, the murder convictions against Khalil Islam and Muhammad Aziz in the 1965 assassination of Malcolm X were vacated in a Manhattan, New York courtroom"}
    - {title: "Ryland West, New York Law Journal: Two Men Convicted of Killing Malcolm X Are Cleared After 55 Years (2021)", url: "https://law.com/newyorklawjournal/2021/11/18/two-men-convicted-of-killing-malcolm-x-are-cleared-after-55-years", quote: "Manhattan Supreme Court Justice Ellen Biben cleared Muhammad Aziz and Khalil Islam in the Feb. 21, 1965, slaying of Malcolm X"}
- card: malcolm-x
  fact: "(wow) 56 years passed between the murder (Feb 1965) and the exoneration (Nov 2021); he had joined the Nation of Islam in prison and became its most famous voice"
  sources:
    - {title: "National Registry of Exonerations: Khalil Islam", url: "https://exonerationregistry.org/cases/13121", quote: "On November 18, 2021"}
    - {title: "Ryland West, New York Law Journal: Two Men Convicted of Killing Malcolm X Are Cleared After 55 Years (2021)", url: "https://law.com/newyorklawjournal/2021/11/18/two-men-convicted-of-killing-malcolm-x-are-cleared-after-55-years", quote: "in the Feb. 21, 1965, slaying of Malcolm X"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "There, he joined the Nation of Islam (NOI)"}
