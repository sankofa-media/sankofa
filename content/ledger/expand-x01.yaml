  fact: "Malcolm X was born Malcolm Little in Omaha, Nebraska, on 19 May 1925"
  sources:
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "Malcolm Little was born to Louise and Earl Little in Omaha, Nebraska, on 19 May 1925"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "was born Malcolm Little in Omaha, Nebraska, on May 19, 1925"}
- card: malcolm-x
  fact: "His father died when he was six; the family believed white supremacists killed him"
  sources:
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "His father died when he was six years old—the victim, he believed, of a white racist group"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "Little was killed by a streetcar in 1931. Authorities ruled it a suicide, but the family believed he was killed by white supremacists"}
- card: malcolm-x
  fact: "In 1946 he was imprisoned in Massachusetts for burglary and joined the Nation of Islam there"
  sources:
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "Malcolm was arrested for burglary in Boston in 1946 and received a ten-year prison sentence. There, he joined the Nation of Islam (NOI)"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "Malcolm joined the Nation of Islam (NOI) while serving a prison term in Massachusetts on burglary charges"}
- card: malcolm-x
  fact: "Released in 1952, he dropped his 'slave name' for X"
  sources:
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "Shortly after his release in 1952, he moved to Chicago and became a minister under Elijah Muhammad, abandoning his “slave name,” and becoming Malcolm X"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "Upon his parole in 1952"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "he changed his surname to “X,” symbolizing, he said, the rejection of “slave names”"}
- card: malcolm-x
  fact: "By the late 1950s he was the NOI's leading spokesman, and his views stood in sharp contrast to King's nonviolence"
  sources:
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "showed those views to be in sharp contrast to those of most well-known African American leaders of the time"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "By the late 1950s, Malcolm had become the NOI’s leading spokesman"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "Although Malcolm rejected King’s message of nonviolence"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "the nation’s most visible proponent of Black Nationalism"}
- card: malcolm-x
  fact: "On 26 March 1964 Malcolm X and King met in the US Capitol after King's press conference on the Senate debate over the Civil Rights Act; a news photographer photographed them"
  sources:
    - {title: "Library of Congress: Martin Luther King and Malcolm X after King's press conference at the U.S. Capitol (1964)", url: "https://www.loc.gov/pictures/item/92522562/", quote: "[Martin Luther King and Malcolm X after King's press conference at the U.S. Capitol about the Senate debate on the Civil Rights Act of 1964] [1964 March 26]"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "during the Senate debate on the Civil Rights Act of 1964 , King and Malcolm met for the first and only time. After holding a press conference in the Capitol on the proceedings, King encountered Malcolm in the hallway"}
- card: malcolm-x
  fact: "Earlier in March 1964 (8 March) he had broken with the Nation of Islam"
  sources:
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "Malcolm used the suspension to announce on March 8, 1964, his break with the NOI"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "In the spring of 1964, Malcolm broke away from the NOI and made a pilgrimage to Mecca"}
- card: malcolm-x
  fact: "He made the pilgrimage to Mecca, travelled through Africa and founded the Organization of Afro-American Unity"
  sources:
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "Malcolm traveled to Africa and the Middle East in late Spring 1964"}
    - {title: "Malik Simba, BlackPast: Malcolm X (1925-1965)", url: "https://www.blackpast.org/african-american-history/x-malcolm-1925-1965/", quote: "he formed a strictly political group (an action expressly banned by the NOI), called the Organization of Afro-American Unity (OAAU)"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "made a pilgrimage to Mecca"}
    - {title: "Stanford King Institute: Malcolm X", url: "https://kinginstitute.stanford.edu/malcolm-x", quote: "his newly created Organization of African American Unity (OAAU)"}
- card: malcolm-x
  fact: "The OAAU placed Black America's struggle in a worldwide one"
