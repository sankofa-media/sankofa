# Second, independent fact-check of batch x03 (2026-11-13).
# Every source below was re-opened (curl + text extraction, or WebFetch where noted) and the quote searched for verbatim.
# Independence rule applied strictly: same publisher or same underlying text = one source.
# Notes on independence: AAIHS and bpb pieces are both by Tiffany Florvil (counted as one); Stabroek News articles
# (McAlmont 2013, "Glimpses" 2010, 2009 feature) count as one publisher; Village Voice News 2023 copies McAlmont verbatim
# and is not counted; Britannica (Lockley) and Samurai Museum Berlin both lean on Lockley, so BlackPast is kept as the
# independent leg wherever possible; Americas Quarterly is an interview with one activist (Moreno Figueroa).

entries:
  # --- zanj-rebellion ---
  - card: zanj-rebellion
    fact: "Zanj worked the salt marshes around Basra, removing salty topsoil"
    verdict: confirmed
    sources:
      - {title: "EBSCO Research Starters, Thomas Sizgorich", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "thousands of black African slaves were employed removing unusable topsoil from extensive tracts of southern Iraqi marshland"}
      - {title: "BlackPast, Omar H. Ali", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "removing salt from the crust of the land surrounding Basra"}
    note: "'by hand' (unsourced) removed from body."
  - card: zanj-rebellion
    fact: "Revolt began in about 869 under Ali ibn Muhammad"
    verdict: confirmed
    sources:
      - {title: "JSTOR Daily, Mohammed Elnaiem", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "in about 869 CE, Ali bin Muhammad, a slave-descended Arab, journeyed into the slave quarters"}
      - {title: "EBSCO Research Starters, Thomas Sizgorich", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "the so-called Zanj revolt, which began in 869"}
    note: "Dispute line (Persian vs Arab; JSTOR's 868-883 span) verified on both pages."
  - card: zanj-rebellion
    fact: "Rebel state with army, capital and coins"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Omar H. Ali", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "the black rebels organized their own state, with its own standing army, buildings, and even minted coins"}
      - {title: "JSTOR Daily, Mohammed Elnaiem", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "build its own city (Al-Mukhtara, Al-Mani’ah), print its own currency"}
  - card: zanj-rebellion
    fact: "Held out fourteen years, 869-883"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Omar H. Ali", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "The rebellion-turned-state lasted fourteen years"}
      - {title: "EBSCO Research Starters, Thomas Sizgorich", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "occurring from 869 to 883"}
  - card: zanj-rebellion
    fact: "Al-Muwaffaq besieged the capital; Ali killed in battle 883; revolt collapsed"
    verdict: confirmed
    sources:
      - {title: "JSTOR Daily, Mohammed Elnaiem", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "He was decapitated in battle in 883, after general Al-Muwaffaq laid siege to the rebellion’s capital city."}
      - {title: "EBSCO Research Starters, Thomas Sizgorich", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "ՙAlī ibn Muḥammad was killed in battle on August 11, 883, and the Zanj revolt collapsed."}
  - card: zanj-rebellion
    fact: "Zanj fighters taken into the Abbasid army"
    verdict: confirmed
    sources:
      - {title: "JSTOR Daily, Mohammed Elnaiem", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "refused to return the Sudan (Blacks) that fought alongside him to their masters. They joined his army instead."}
      - {title: "EBSCO Research Starters, Thomas Sizgorich", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "the last former Zanj guerrilla was mustered into the ՙAbbāsid army"}
  - card: zanj-rebellion
    fact: "Detested by chroniclers; remembered as a stain"
    verdict: confirmed
    sources:
      - {title: "JSTOR Daily, Mohammed Elnaiem", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "the Zanj were detested by contemporary historians like Al-Tabari and Al-Mas’udi"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "their rebellion was deemed a stain in Islamic history books"}
  - card: zanj-rebellion
    fact: "Black Iraqis in Basra tell the revolt as their ancestors' history"
    verdict: confirmed
    sources:
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "stories of abduction and enslavement of Jalal’s ancestors ... and their rebellion"}
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "until there was a slave uprising in the mid-800s"}

  # --- afro-iraqis-basra ---
  - card: afro-iraqis-basra
    fact: "Descend from East Africans who came as sailors or enslaved people"
    verdict: confirmed
    sources:
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "descendants of the people who came here from East Africa as sailors or slaves over the course of centuries"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "their transport from Africa to Iraq"}
  - card: afro-iraqis-basra
    fact: "No official count; 400,000 to two million"
    verdict: confirmed
    sources:
      - {title: "The New Arab, Ibrahim Al-Marashi (2022) [WebFetch; site blocks curl]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "they range from 400,000 to approximately two million, primarily located in the Basra province"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "It is estimated that there are roughly 400,000 Afro-Iraqis across the country"}
  - card: afro-iraqis-basra
    fact: "Most in Basra province, many in Zubair"
    verdict: confirmed
    sources:
      - {title: "The New Arab, Ibrahim Al-Marashi (2022) [WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "particularly the inland district of Zubayr where most Afro-Iraqis live"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "predominately concentrated demographically in the city of Basra"}
    note: "'old district' (unsourced) removed."
  - card: afro-iraqis-basra
    fact: "Wedding drummers often Black men from Zubair; many work as musicians"
    verdict: confirmed
    sources:
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "When there's a big wedding, Basrawis call in drummers from the district of Zubair."}
      - {title: "The New Arab, Ibrahim Al-Marashi (2022) [WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "Most are constrained to lower income jobs, working as cleaners or musicians and dancers."}
  - card: afro-iraqis-basra
    fact: "Rituals of African origin in Zubair calling spirits"
    verdict: confirmed
    sources:
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "prepare an altar for a ceremony they say will summon a spirit from Africa"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "folk rituals they practised for centuries in special places called \"Makayed\", and in specific areas of Basra Governorate, including the Zubair"}
  - card: afro-iraqis-basra
    fact: "Menial jobs, musicians and dancers; discrimination by skin colour"
    verdict: confirmed
    sources:
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Long relegated to menial jobs or work as musicians and dancers"}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "continue to suffer from racial discrimination and marginalization"}
  - card: afro-iraqis-basra
    fact: "After Obama's 2008 win, Jalal Dhiab of the Free Iraqi Movement sought minority recognition"
    verdict: confirmed
    sources:
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Jalal Diyaab is the leader of the Free Iraqi Movement, which is seeking to have Iraq's roughly 2 million black people recognized as a minority"}
      - {title: "The New Arab, Ibrahim Al-Marashi (2022) [WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "Jalal Diab Thijeel founded the Free Iraqi Movement in 2007 to represent the Afro-Iraqi community"}
  - card: afro-iraqis-basra
    fact: "Dhiab revived memory of the Zanj revolt"
    verdict: confirmed
    sources:
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "is the man behind the revival of all of this hidden history"}
      - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "talking about a history of slavery and oppression that he says dates back to at least the ninth century"}
  - card: afro-iraqis-basra
    fact: "Dhiab assassinated in Basra, April 2013"
    verdict: confirmed
    sources:
      - {title: "The New Arab, Ibrahim Al-Marashi (2022) [WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "On April 26, 2013, Thijeel was assassinated."}
      - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "the civil activist Jalal Dhiab, who was assassinated in Basra in 2013"}

  # --- siddi-of-karnataka ---
  - card: siddi-of-karnataka
    fact: "Called Habshi (Abyssinian)"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "African-Indians were long known as Habshi, Arabic for Abyssinian (Ethiopian)."}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "‘Habshis’ or people of Habush (Abyssinia)"}
  - card: siddi-of-karnataka
    fact: "Today mostly Karnataka, Gujarat, Andhra Pradesh"
    verdict: confirmed
    sources:
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Living primarily in Karnataka, Gujarat, and in some parts of Andhra Pradesh"}
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "the Indian states of Gujarat, Andhra Pradesh, and Karnataka"}
  - card: siddi-of-karnataka
    fact: "Many came enslaved; some rose to generals, administrators, kingmakers"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "Many were enslaved and were brought to India between the fifteenth and nineteenth centuries by Muslim and Portuguese slave traders."}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "were frequently elevated to the rank of generals, administrators and king-makers"}
  - card: siddi-of-karnataka
    fact: "Jamal ud-Din Yaqut at Raziya's court"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "an Ethiopian named Jamal ad-Din Yaqut was a noble at the court of Queen Raziyya of Delhi"}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Raziya, ascended the throne after her father’s death in 1236"}
  - card: siddi-of-karnataka
    fact: "Lovers story doubted"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "this story appears only to have emerged in modern times"}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "historians since then have debated whether the relationship had the makings of an epic love story"}
  - card: siddi-of-karnataka
    fact: "Some 8,000 Abyssinians in Bengal; Habshi dynasty to 1493"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "recruited some 8000 enslaved Ethiopians to serve in his army and his administration ... In 1487, Ethiopian nobles overthrew the reigning king"}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "There were some 8,000 of them; by the time Barbak died, that number had swelled to 20,000 Abyssinian soldiers in the Bengal army."}
    note: "JSTOR text uses a non-breaking space in '8,000'; quote present."
  - card: siddi-of-karnataka
    fact: "Sachin from 1791 to 1948"
    verdict: confirmed
    sources:
      - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "In 1791 when Balu Miyan renounced his claims to Janjira ... His family ruled until 1948"}
      - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Sachin, a small “African-ruled” princely state , took root in 1791, only to be signed over to India in 1948"}

  # --- black-japan-yasuke ---
  - card: black-japan-yasuke
    fact: "Japan ending a century of civil war; Nobunaga near unification"
    verdict: confirmed
    sources:
      - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "was on the verge of unifying Japan after more than a hundred years of civil war"}
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "best remembered for his efforts to unify and bring political stability to Japan"}
  - card: black-japan-yasuke
    fact: "Came to Japan 1579 with Valignano as bodyguard or servant"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Yasuke accompanied the Italian Jesuit missionary Alessandro Vaglignano to Japan in 1579."}
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke [archived copy]", url: "https://www.britannica.com/biography/Yasuke", quote: "arriving in Japan at the port of Kuchinotsu, in modern-day Nagasaki prefecture, in May 1579"}
  - card: black-japan-yasuke
    fact: "Birth name unknown"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Even the derivation of his name and place of birth can only be conjectured."}
      - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "the name was probably a Japanisation of a Portuguese or African name"}
  - card: black-japan-yasuke
    fact: "Crowds in Kyoto"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Fróis recounted the frenzy on the city streets of then capital of Japan, Kyoto"}
      - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "Hundreds flocked together to see the stranger"}
  - card: black-japan-yasuke
    fact: "Stripped and scrubbed"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Nobunaga demanded that black man strip to his waist and scrub his skin to prove that his dark color was real."}
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Nobunaga could not trust the color of his skin and had his retainers scrub him"}
  - card: black-japan-yasuke
    fact: "Over six feet; house and sword; bodyguard"
    verdict: corrected
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "towering 6 foot 2 inches. Nobunaga orders Yasuke to be his retainer and bodyguard."}
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Ōta states that Nobunaga made Yasuke a vassal, giving him a house, servants, a sword, and a stipend."}
    note: "BlackPast does not mention the house or sword; first ledger leaned on one source. Britannica added to card sources. Wow 'within months' replaced by 'in 1581 ... soon' (Samurai Museum: arrival March 1581, service spring/summer 1581)."
  - card: black-japan-yasuke
    fact: "Honnō-ji, Nobunaga's suicide, Yasuke to Nobutada at Nijō"
    verdict: corrected
    sources:
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Yasuke rushed to the Oda clan’s new lord, Nobunaga’s eldest son, Nobutada, who was barricaded inside the nearby Nijō-goshō imperial villa."}
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "When Nobunaga’s former general, Akechi Mitsuhide, attempted a coup in June 1582, the daimyo was obliged to perform seppuku"}
    note: "Nobutada was in the Nijō palace, not 'Nijō Castle' (today's castle is later); card now says 'at nearby Nijō'. Honnō-ji: Britannica + Samurai Museum."
  - card: black-japan-yasuke
    fact: "Spared by Akechi, handed to Jesuits, vanishes"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "took pity and spared his life. Sent to rejoin the European Jesuit missionaries"}
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Yasuke was accompanied by Mitsuhide’s vassals to the Jesuit church ... This is the last confirmed record of Yasuke."}
  - card: black-japan-yasuke
    fact: "Best-known African in pre-modern Japan, attested by Japanese and Jesuit sources"
    verdict: corrected
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "The few Portuguese and Japanese sources that mention his brief presence in Japan"}
      - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Portuguese-language Jesuit reports from the late 16th century ... and works of the Japanese chroniclers Ōta Gyūichi and Matsudaira Ietada"}
    note: "Superlative 'best-known' rested on BlackPast alone; replaced with 'a rare documented life'."
  - card: black-japan-yasuke
    fact: "(dispute) samurai status"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Eventually Yasuke rose to the rank of Samurai"}
      - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "But the contemporary sources never explicitly call him one. They use terms such as “servant” (kerai) or “sword bearer” (kosho)."}

  # --- bahamas-junkanoo ---
  - card: bahamas-junkanoo
    fact: "Boxing Day and New Year's Day; crepe paper and cardboard; goatskin drums, cowbells, whistles, brass"
    verdict: confirmed
    sources:
      - {title: "TIME, Sasha C. Wells", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "music played on goat-skin drums, cowbells, whistles, and brass instruments"}
      - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "Junkanoo costumes are traditionally made from strips of crêpe paper and cardboard"}
    note: "Goatskin (unledgered) also in HistoryMiami: 'covered in goat or sheep skin'."
  - card: bahamas-junkanoo
    fact: "Old name John Canoe"
    verdict: confirmed
    sources:
      - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "Junkanoo (originally spelled “John Canoe”)"}
      - {title: "TIME, Sasha C. Wells", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "it was referred to as “John Canoe,” a reference to an Akan warrior"}
  - card: bahamas-junkanoo
    fact: "Began on the enslaved people's Christmas holiday"
    verdict: confirmed
    sources:
      - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "one of the very few times of the year when masters gave slaves a reprieve from work"}
      - {title: "TIME, Sasha C. Wells", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "the tradition dates back to when enslavers gave their slaves a day off during the holidays as reprieve"}
  - card: bahamas-junkanoo
    fact: "Rush into white-owned Bay Street broke segregation; officials feared it"
    verdict: confirmed
    sources:
      - {title: "TIME, Sasha C. Wells", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "Junkanooers broke the practice of racial segregation by rushing into town at night, which disturbed government officials"}
      - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "transgressed the island’s unspoken racial boundaries"}
  - card: bahamas-junkanoo
    fact: "1942 riot of airport labourers; parades banned; back on Bay Street 1948"
    verdict: corrected
