# Expansion batch c27 (2026-11-13): every fact in the bodies and wow lines of the c27 cards,
# with at least two independent sources and a verbatim quote from each (checked against the fetched pages).
# Note: the National Park Service Susie King Taylor page reuses wording from the New Georgia Encyclopedia entry, so the two are never paired for the same fact.
# Note: Theophilus Thompson's early life is known chiefly from Brownson's 1873 sketch; Brennen and BlackPast are independent secondary treatments that also draw on it.
- card: amistad-case
  fact: "By 1839 Spain had outlawed the import of enslaved Africans into Cuba, yet captives were still landed in Havana"
  sources:
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "Although Spain had made the importation of slaves illegal since 1820, the two men loaded their slaves onto the schooner Amistad"}
    - {title: "United States v. The Amistad, 40 U.S. 518 (1841), Legal Information Institute", url: "https://www.law.cornell.edu/supremecourt/text/40/518", quote: "were unlawfully transported to Cuba, in violation of the laws and treaties of Spain"}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "Portuguese slave hunters illegally seized 53 Africans in Sierra Leone"}
- card: amistad-case
  fact: "The captives were Mende people seized in Sierra Leone and shipped to Havana"
  sources:
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "purchased 53 of the captives (members of the Mende people) in Havana"}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Portuguese slave hunters abducted a large group of Africans from Sierra Leone and shipped them to Havana, Cuba"}
- card: amistad-case
  fact: "José Ruiz and Pedro Montes bought 53 of them and put them aboard the schooner Amistad"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Two Spanish plantation owners, Pedro Montes and Jose Ruiz, purchased 53 Africans and put them aboard the Cuban schooner Amistad"}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Two Spaniards, Don Pedro Montez and Don Jose Ruiz, purchased 53 of the captives"}
- card: amistad-case
  fact: "A few days out, in early July 1839, Sengbe Pieh (Joseph Cinqué) freed himself and then the others"
  sources:
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "four days into the voyage on July 2, 1839, one of them, Joseph Cinqué (also known as Sengbe Pieh), freed himself"}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "25-year-old Sengbe Pieh (known as Cinque) escaped from his shackles and set about releasing the other captives"}
- card: amistad-case
  fact: "They killed the captain and the cook and ordered Ruiz and Montes to sail for Africa"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "On July 1, 1839, the Africans seized the ship, killed the captain and the cook, and ordered Montes and Ruiz to sail to Africa."}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "they killed the ship’s cook, Celestino. They then killed the ship’s captain, Ramon Ferrer"}
- card: amistad-case
  fact: "By day the ship ran east, by night the Spaniards turned it north"
  sources:
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "The ship sailed east during the day, using the sun’s position to determine its direction, but at night, the slave traders quietly redirected their course away from Africa."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Montes and Ruiz actually steered the ship north"}
- card: amistad-case
  fact: "After about two months the US brig Washington seized the Amistad off Long Island (Culloden Point)"
  sources:
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "This process continued for over two months until, on August 24, 1839, the Amistad reached Long Island, New York. There the federal brig Washington seized the ship and its cargo."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "on August 24, 1839, the Amistad was seized off Long Island, NY, by the U.S. brig Washington"}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "the Amistad landed off the eastern end of Long Island, New York at Culloden Point where a U.S. Navy ship took it into custody"}
- card: amistad-case
  fact: "The Africans were jailed in Connecticut on a murder charge"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "The plantation owners were freed and the Africans were imprisoned on charges of murder."}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "American authorities charged the Mende with murder, imprisoned them in New Haven , Connecticut"}
- card: amistad-case
  fact: "Spain demanded the Africans back and President Martin Van Buren favoured returning them"
  sources:
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Spain’s foreign minister argued that the holding of the ship and its cargo constituted a violation of a 1795 treaty between the United States and Spain, and he demanded their return."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "President Van Buren was in favor of extraditing the Africans to Cuba."}
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "was in favor of handing the captives over to the Spanish authorities"}
- card: amistad-case
  fact: "Abolitionists raised money and hired lawyers for the Africans"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "abolitionists in the North opposed extradition and raised money to defend the Africans"}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "American abolitionists rallied to the defense of the Mende, raising money to hire future Connecticut governor Roger Sherman Baldwin and former US president John Quincy Adams"}
- card: amistad-case
  fact: "The Connecticut courts found the Africans had been kidnapped / were free, and the government appealed to the Supreme Court"
  sources:
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "as the prisoners had been kidnapped into slavery, they were legally free"}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "A district court judge then ruled that, as former free men living in Africa, the Spanish had no right to enslave the Mende."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "The U.S. District Attorney filed an appeal to the Supreme Court."}
- card: amistad-case
  fact: "In March 1841 the Supreme Court, after a plea by former president John Quincy Adams, declared them free"
  sources:
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Adams and Baldwin convinced the court to set the Mende free. The decision came in March of 1841"}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "On March 9, 1841, the Supreme Court upheld the lower court ruling in The United States v. The Amistad with a 7-1 decision declaring that the captives were illegally kidnapped and thus were free."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "For 8 ½ hours, the 73-year-old Adams passionately and eloquently defended the Africans' right to freedom"}
- card: amistad-case
  fact: "35 survivors returned to Sierra Leone; the others had died at sea or in prison"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Thirty five of the survivors were returned to their homeland (the others died at sea or in prison while awaiting trial)."}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "the 35 remaining Mende (18 having died at different stages of their voyage or while in prison) sailed for Sierra Leone"}
- card: amistad-case
  fact: "They sailed on the Gentleman (late 1841) and reached Freetown in January 1842"
  sources:
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "On November 25, 1841, the surviving Amistad captives departed from New York harbor for Sierra Leone."}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "when they arrived in Freetown , in January 1842"}
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "the Gentleman was chartered to take the 35 Africans to the colony of Sierra Leone"}
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "The ship arrived in Freetown in mid-January 1842."}
- card: amistad-case
  fact: "The ruling did not touch slavery itself; it held that kidnapped Africans were free, not property"
  sources:
    - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "The decision of the court was not in itself an attack on slavery"}
    - {title: "United States v. The Amistad, 40 U.S. 518 (1841), Legal Information Institute", url: "https://www.law.cornell.edu/supremecourt/text/40/518", quote: "It is plain, beyond controversy, if we examine the evidence, that these negroes never were the lawful slaves of Ruiz or Montez, or of any other Spanish subjects."}
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Kidnapped and transported illegally, they had never been slaves."}
- card: amistad-case
  fact: "Dispute: the revolt is dated 1 or 2 July 1839, the seizure 24 or 26 August"
  sources:
    - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "On July 1, 1839, the Africans seized the ship"}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "The Amistad Mutiny occurred on the Spanish schooner La Amistad on July 2, 1839."}
    - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "On August 26, 1839, the Amistad landed off the eastern end of Long Island"}
    - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "on August 24, 1839, the Amistad reached Long Island"}
- card: somerset-case
  fact: "English law was unsettled on whether slavery could exist in England"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "The tapestry of legal rulings and opinions on both sides of the Atlantic on the status of enslaved people in England, and whether baptism conferred freedom, had resulted in legal ambiguity."}
    - {title: "J. A. Cannon, The Oxford Companion to British History, via Encyclopedia.com: Somerset case", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/somerset-case", quote: "Blackstone , in his Oxford lectures, had already denied that English law recognized slavery."}
- card: somerset-case
  fact: "Somerset was born in Africa and in 1749 sold in Virginia to the merchant Charles Steuart (Stewart)"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "On 1 August 1749 he was sold in Norfolk, Virginia, to the Scottish merchant Charles Steuart (or Stewart)."}
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "James Somerset was born in Africa, captured as a slave in 1749 and shipped to Virginia. There he was sold to a man called Charles Stewart"}
- card: somerset-case
  fact: "In 1769 Steuart brought him to England / London"
  sources:
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "who brought him to England with him in 1769"}
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "Five years later Steuart relocated to England, and took Somerset with him"}
- card: somerset-case
  fact: "Somerset was baptised in London"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "became his godparents when he was baptised in August 1771 in the church of St Andrew, Holborn"}
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "Whilst in England, James Somerset had been baptised"}
- card: somerset-case
  fact: "On 1 October 1771 he left his master"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "On 1 October 1771 Somerset left Steuart and refused to return to a state of servitude."}
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "On 1st October 1771, however, Somerset escaped"}
- card: somerset-case
  fact: "He was seized and held aboard the Ann and Mary on the Thames to be taken out of England and sold"
  sources:
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "was recaptured and imprisoned on a ship, the Ann and Mary, docked in the river Thames"}
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "He was gaoled on board awaiting transportation to Jamaica, where Steuart directed that he should be sold to a plantation for labour."}
    - {title: "J. A. Cannon, The Oxford Companion to British History, via Encyclopedia.com: Somerset case", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/somerset-case", quote: "In 1771 the American master of James Somerset, a negro slave, attempted to send him out of England to be sold."}
- card: somerset-case
  fact: "His three godparents applied to the Court of King's Bench for habeas corpus"
  sources:
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "his three godparents applied for a writ of habeas corpus"}
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "Somerset’s godparents applied before the Court of King's Bench for a writ of habeas corpus"}
- card: somerset-case
  fact: "Granville Sharp took up his cause"
  sources:
    - {title: "Lincoln's Inn Library: James Somerset, Black History Month 2022", url: "https://www.lincolnsinn.org.uk/news/james-somerset-black-history-month-2022/", quote: "Granville Sharp, the great campaigner for the abolition of slavery, heard of Somerset’s predicament and began a campaign to free him."}
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "Somerset enlisted Granville Sharp, an inveterate opponent of the institution of slavery, to support his cause."}
- card: somerset-case
  fact: "On 22 June 1772 Lord Mansfield ruled Somerset could not be forcibly removed, and he was freed (wow and body)"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "On 22 June 1772, William Murray, Lord Mansfield of Kenwood and Chief Justice of the Court of King’s Bench, ruled in the case of Somerset v Stewart that it was unlawful for Charles Steuart (or Stewart) to transport James Somerset"}
    - {title: "J. A. Cannon, The Oxford Companion to British History, via Encyclopedia.com: Somerset case", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/somerset-case", quote: "In a famous judgment on 22 June 1772, which he made with some reluctance, Mansfield declared that slavery was odious and unknown to common law . Somerset was given his freedom."}
- card: somerset-case
  fact: "The judgment was narrow but widely taken to mean slavery could not be enforced in England"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "Although the decision was technically a narrow one, it was popularly taken to mean that slavery was illegal in England"}
    - {title: "J. A. Cannon, The Oxford Companion to British History, via Encyclopedia.com: Somerset case", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/somerset-case", quote: "Though the implications of the judgment have been much discussed, it seems clear that slavery was not recognized in England subsequently."}
- card: somerset-case
  fact: "A London paper reported nearly 200 Black Londoners celebrating at a Westminster public house, toasting Mansfield and ending with a ball"
  sources:
    - {title: "English Heritage: The Somerset v Stewart case (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history-stories-kenwood/somerset-case", quote: "On 27 June 1772, the Public Advertiser reported that near 200 Blacks … had an Entertainment at a Public-house in Westminster"}
    - {title: "Boston News-Letter, 10 September 1772 (Performing Arts in Colonial American Newspapers, BNL.772.040)", url: "https://cdss.org/elibrary/PacanNew/CITATION/C0024/C0024718.htm", quote: "On Monday near 200 Blacks, with their ladies, had an entertainment at a public house in Westminster, to celebrate the triumph which their brother Somerset had obtained over Mr. Stewart his master. Lord Mansfield's health was echoed round the room, and the evening was concluded with a ball."}
- card: somerset-case
  fact: "By September 1772 the report had been reprinted in Massachusetts newspapers"
  sources:
    - {title: "Boston News-Letter, 10 September 1772 (Performing Arts in Colonial American Newspapers, BNL.772.040)", url: "https://cdss.org/elibrary/PacanNew/CITATION/C0024/C0024718.htm", quote: "Boston News Letter: 1772.09.10"}
    - {title: "Essex Gazette, 8 September 1772 (Performing Arts in Colonial American Newspapers, EG.772.041)", url: "https://cdss.org/elibrary/PacanNew/CITATION/C0040/C0040832.htm", quote: "Essex Gazette: 1772.09.08"}
    - {title: "Essex Gazette, 8 September 1772 (Performing Arts in Colonial American Newspapers, EG.772.041)", url: "https://cdss.org/elibrary/PacanNew/CITATION/C0040/C0040832.htm", quote: "On Monday near 200 blacks, with their ladies, had an entertainment at a public house in Westminster"}
- card: theophilus-thompson
  fact: "Thompson was born in Frederick, Maryland, on 21 April 1855"
  sources:
    - {title: "Theophilus A. Thompson, Chess Problems (Dubuque, 1873), biographical sketch by O. A. Brownson Jr.; Internet Archive B-001-002-850", url: "https://archive.org/details/B-001-002-850", quote: "Frederick City, Maryland, on the 21st. day of April, 1855."}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Thompson was born into slavery in Frederick, Maryland on April 21, 1855."}
    - {title: "The Chess Drum: Theophilus Thompson, Master Profile", url: "http://www.thechessdrum.net/drummajors/T_Thompson.html", quote: "Born April 21, 1855 in Frederick, Maryland"}
- card: theophilus-thompson
  fact: "He was born to enslaved parents and freed as a boy when slavery ended"
  sources:
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "We can add that Thompson's parents were slaves; fortunately for Thompson, he saw the end of slavery as a young man"}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Freed after the Civil War"}
- card: theophilus-thompson
  fact: "At thirteen he became a house servant in Carroll County, returning to Frederick in 1870"
  sources:
    - {title: "Theophilus A. Thompson, Chess Problems (Dubuque, 1873), biographical sketch by O. A. Brownson Jr.; Internet Archive B-001-002-850", url: "https://archive.org/details/B-001-002-850", quote: "At 13 years of age he left his native city and went to live with a family in Carroll County, in the capacity of house servant. In 1870., he returned to Frederick"}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "he worked as a house servant in Carroll County, Maryland from 1868 to 1870. Returning to Frederick"}
- card: theophilus-thompson
  fact: "In April 1872, at about seventeen, he watched his first chess game, not understanding it and not daring to ask questions"
  sources:
    - {title: "Theophilus A. Thompson, Chess Problems (Dubuque, 1873), biographical sketch by O. A. Brownson Jr.; Internet Archive B-001-002-850", url: "https://archive.org/details/B-001-002-850", quote: "He saw a chess board and men used for the first time in April 1872"}
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "Although he could not understand the game and dared not ask questions for fear of annoying the players, he watched every move with the closest attention."}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "He watched his first chess game in April 1872."}
    - {title: "The Chess Drum: Theophilus Thompson, Master Profile", url: "http://www.thechessdrum.net/drummajors/T_Thompson.html", quote: "Mr. Hanshew loaned the 17-year old a chessboard"}
- card: theophilus-thompson
  fact: "John K. Hanshew, publisher of the Maryland Chess Review, lent him a board and men and left him problems"
  sources:
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "One of the players in the game was John K. Hanshew, publisher of The Maryland Chess Review. Hanshew loaned the interested Thompson a chess board and gave him selected chess problems to solve."}
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "loaned him a chessboard and a set of chess men, gave him some instructions, and left him a few two-move problems to solve"}
- card: theophilus-thompson
  fact: "He soon composed his own problems and sent them to a chess journal in Dubuque, Iowa"
  sources:
    - {title: "The Chess Drum: Theophilus Thompson, Master Profile", url: "http://www.thechessdrum.net/drummajors/T_Thompson.html", quote: "began composing his own which he later contributed to The Dubuque Chess Journal"}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Before long, Thompson was publishing his own chess problems in The Dubuque Chess Review ."}
- card: theophilus-thompson
  fact: "In 1873 Orestes Brownson Jr., the Dubuque editor, printed them as the book Chess Problems with a short account of the author's life (within two years of his first game)"
  sources:
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "his book of chess problems printed in 1873 by Orestes Brownson Jr. , the editor of the Dubuque Chess Journal"}
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Thompson’s most famous legacy was his book, Chess Problems: Either to Play and Mate, or Compel Self-mate in Four Moves . Published in 1873"}
    - {title: "Theophilus A. Thompson, Chess Problems (Dubuque, 1873), biographical sketch by O. A. Brownson Jr.; Internet Archive B-001-002-850", url: "https://archive.org/details/B-001-002-850", quote: "PRINTED BY JOHN J. BROWNSON, DUBUQUE IOWA."}
- card: theophilus-thompson
  fact: "A London chess magazine praised the book in 1874"
  sources:
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Thompson’s book was reviewed favorably in The City of London Chess Magazine in July 1874."}
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "As the July 1874 issue of City of London Chess Magazine wrote of his book, \"We have been very much pleased indeed"}
- card: theophilus-thompson
  fact: "Little else is recorded and his death date is uncertain (dispute: no date in BlackPast/Brennen; Chess Drum profile says 1881, tuberculosis, age 26)"
  sources:
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Details about Thompson’s later life and his date of death are unknown."}
    - {title: "Neil R. Brennen, The Chess Drum: The Caged Bird: The Story of T. A. Thompson (2006)", url: "https://thechessdrum.net/historicmoments/HM_Thompson/index.html", quote: "only provides a single entry for Thompson's birth, and nothing for his death"}
    - {title: "The Chess Drum: Theophilus Thompson, Master Profile", url: "http://www.thechessdrum.net/drummajors/T_Thompson.html", quote: "In reality, he died in 1881 from the effects of tuberculosis at age 26 ."}
- card: theophilus-thompson
  fact: "He is counted among the first notable Black American chess players"
  sources:
    - {title: "Zach Schrempp, BlackPast: Theophilus Thompson (1855-?)", url: "https://www.blackpast.org/african-american-history/thompson-theophilus-1855/", quote: "Theophilus Augustus Thompson was one of the first notable African American chess players."}
    - {title: "The Chess Drum: Theophilus Thompson, Master Profile", url: "http://www.thechessdrum.net/drummajors/T_Thompson.html", quote: "Theophilus Thompson is identified in various sources as being the first Black chess player of note."}
- card: paul-cuffe
  fact: "Black men in Massachusetts could be taxed without a vote; in 1780 Cuffe and a brother petitioned against it"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "In 1780, he, his brother and five black men filed a petition protesting their “having No vote on Influence in the Election with those that tax us,”"}
    - {title: "Dictionary of African Christian Biography: Cuffee, Paul", url: "https://dacb.org/stories/sierra-leone/cuffee-paul/", quote: "He and a brother, John, sent a petition to the General Court of Massachusetts Bay, on 10 February 1780, asking for the extension of franchise rights to blacks"}
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "In 1780, against the backdrop of the American Revolution, Cuffe led a group of free blacks to petition the Massachusetts government"}
- card: paul-cuffe
  fact: "Born on Cuttyhunk Island in 1759, one of ten children"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "Cuffee was born on Cuttyhunk Island, off Southern Massachusetts, on Jan. 17, 1759"}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "Cuffe was born on January 17, 1759, on Cuttyhunk Island, off the coast of Massachusetts."}
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "He was one of 10 children of a freed slave"}
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "He was the youngest of ten children."}
- card: paul-cuffe
  fact: "His father Kofi was an Asante (Ashanti) man who gained his freedom; his mother Ruth Moses was Wampanoag"
  sources:
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "He was the son of Ruth Moses, a Wampanoag woman, and Kofi Slocum, a formerly enslaved man of Ashanti (modern-day Ghanaian) origin."}
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "Paul’s mother was Ruth Moses, a Wampanoag Native American."}
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "His father, Kofi (also known as Cuffe Slocum), was from the Ashanti Empire in West Africa."}
- card: paul-cuffe
  fact: "He took his father's first name as his surname"
  sources:
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "Cuffe refused to use the name Slocum, which his father had been given by his owner, and instead took his father’s first name."}
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "Paul changed his surname from Slocum to Cuffee"}
- card: paul-cuffe
  fact: "He went to sea as a teenager on whaling ships"
  sources:
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "In 1773, at the age of fourteen, Cuffe began his career as a crew member onboard a whaling ship bound for the West Indies."}
    - {title: "Dictionary of African Christian Biography: Cuffee, Paul", url: "https://dacb.org/stories/sierra-leone/cuffee-paul/", quote: "At sixteen, he entered the whaling trade"}
- card: paul-cuffe
  fact: "He bought and built ships and traded along the coast and abroad"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "bought and built ships, developing his own maritime enterprise that involved trading the length of the U.S. Atlantic coast, with trips to the Caribbean and Europe"}
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "eventually became a ship owner, operating a number of vessels"}
- card: paul-cuffe
  fact: "He was a Quaker and an opponent of slavery who dreamed of a Black settlement in Africa based on emigration and trade"
  sources:
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "Cuffe was also known as a faithful Quaker, Federalist, and committed anti-slavery advocate"}
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "was a devout and evangelical Quaker"}
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "Cuffee’s dream was that free African Americans and freed slaves “could establish a prosperous colony in Africa,” one based on emigration and trade."}
- card: paul-cuffe
  fact: "In 1811 he sailed the Traveller with an all-Black crew to Freetown and on to England"
  sources:
    - {title: "Donald Grinde Jr., BlackPast: Paul Cuffe Sr. (1759-1817)", url: "https://www.blackpast.org/african-american-history/cuffe-paul-sr-1759-1817/", quote: "On January 2, 1811, he launched his first expedition to Sierra Leone, sailing with an all-African American crew to Freetown."}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "Cuffe and his all-African-American crew aboard the Traveller made two voyages to Freetown"}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "Cuffe sailed to England where he was granted an audience before the African Institution"}
    - {title: "Dictionary of African Christian Biography: Cuffee, Paul", url: "https://dacb.org/stories/sierra-leone/cuffee-paul/", quote: "The whole of his crew is black also."}
- card: paul-cuffe
  fact: "Returning in April 1812 he lost ship and cargo to customs enforcing the ban on British goods"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "On April 19, 1812, U.S. Customs in Westport, Mass., seized Cuffee’s ship and its cargo upon its return from Sierra Leone and Great Britain as being in violation of the embargo."}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "On April 19, 1812, the Traveller was seized by customs officers in Newport, Rhode Island on its return from Sierra Leone."}
- card: paul-cuffe
  fact: "On 2 May 1812 he went to the White House and Madison had his property returned"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "On May 2, 1812, he went to the White House, where he met with Secretary of the Treasury Albert Gallatin and with Madison himself, who greeted him warmly and ordered that his goods be returned."}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "Cuffe was granted an audience with President Madison at the White House on May 2, 1812"}
    - {title: "Dictionary of African Christian Biography: Cuffee, Paul", url: "https://dacb.org/stories/sierra-leone/cuffee-paul/", quote: "Cuffee negotiated on the matter, meeting President Madison in Washington for the purpose.[19] He was made an exception."}
- card: paul-cuffe
  fact: "After the War of 1812 he carried 38 Black American settlers to Freetown, landing 3 February 1816"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "When they arrived on Feb. 3, 1816, Cuffee’s passengers became the first African Americans who willingly returned to Africa"}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "and thirty-eight African Americans set sail for Sierra Leone on December 10, 1815."}
    - {title: "Dictionary of African Christian Biography: Cuffee, Paul", url: "https://dacb.org/stories/sierra-leone/cuffee-paul/", quote: "The party dropped anchor in Freetown on 3 February 1816"}
- card: paul-cuffe
  fact: "In January 1817 a mass meeting of free Black men at Bethel Church in Philadelphia rejected emigration"
  sources:
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "In January 1817, a massive gathering of free African American men met at Bethel Church in Philadelphia"}
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "“Three thousand at least attended, and there was not one soul that was in favor of going to Africa."}
- card: paul-cuffe
  fact: "Cuffe died in September 1817"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "When Paul Cuffee died just a month later, on Sept. 7, 1817"}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "he became seriously ill and died on September 7, 1817."}
- card: paul-cuffe
  fact: "Henry Highland Garnet and Martin Delany later took up the cause"
  sources:
    - {title: "Henry Louis Gates Jr., PBS, The African Americans: Many Rivers to Cross: Who Led the First Back-to-Africa Effort?", url: "https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/who-led-the-1st-back-to-africa-effort/", quote: "the cause of black emigration would be taken up by a succession of black leaders, including Henry Highland Garnet, Bishop James T. Holly, Martin R. Delany"}
    - {title: "Tianna Mobley, White House Historical Association: Paul Cuffe & President James Madison", url: "https://whitehousehistory.org/paul-cuffe-president-james-madison-the-transatlantic-emigration-project-the-white-house", quote: "influenced other nineteenth century African Americans—such as Henry Highland Garnet, Martin R. Delany, and Bishop Henry McNeal Turner"}
- card: jarena-lee
  fact: "Richard Allen founded the AME Church around Bethel in Philadelphia"
  sources:
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "the founder of the AME, Richard Allen"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "Bethel Church where Bishop Richard Allen , founder of the A.M.E. Church, was scheduled to preach"}
- card: jarena-lee
  fact: "Jarena Lee was born free in Cape May, New Jersey, on 11 February 1783"
  sources:
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "Place of Birth: Cape May, New Jersey Date of Birth: February 11, 1783"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "was born to a poor but free black family on February 11, 1783, in Cape May, New Jersey"}
- card: jarena-lee
  fact: "At seven she was sent to live as a servant with a white family"
  sources:
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "In 1790 at the age of seven, Lee was sent to work as a live-in servant for a white family named Sharp."}
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "At the age of seven years I was parted from my parents, and went to live as a servant maid, with a Mr. Sharp"}
- card: jarena-lee
  fact: "In Philadelphia she heard Allen preach at Bethel and was converted"
  sources:
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "After hearing the powerful sermon delivered by Allen, Lee became filled with the Holy Spirit and converted to Christianity."}
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "The man who was to speak in the afternoon of that day, was the Rev. Richard Allen, since bishop of the African Episcopal Methodists in America. During the labors of this man that afternoon, I had come to the conclusion, that this is the people to which my heart unites"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "Lee moved to Philadelphia, Pennsylvania as a teenager"}
- card: jarena-lee
  fact: "Allen told her the church's rules did not provide for women preachers"
  sources:
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "But as to women preaching, he said that our Discipline knew nothing at all about it—that it did not call for women preachers."}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "Allen told Lee that he could not grant her permission to preach because he was required to uphold the A.M.E. Church’s ban against female ministers."}
- card: jarena-lee
  fact: "In 1811 she married Joseph Lee, a pastor, who died some years later"
  sources:
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "In the year 1811, I changed my situation in life, having married Mr. Joseph Lee, pastor of a Society at Snow Hill"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "In 1811 Lee married Pastor Joseph Lee, and the couple had two children. After seven years of marriage, Lee’s husband died."}
- card: jarena-lee
  fact: "Years after her first request, when a visiting preacher faltered at Bethel, she sprang up and preached on his text"
  sources:
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "In 1819 during a worship service at Bethel Church, a guest preacher began struggling with his message and abruptly stopped preaching. As he stared into the congregation at a loss for words, Lee sprang to her feet and began preaching, picking up where the minister had left off."}
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "I sprang, as by altogether supernatural impulse, to my feet, when I was aided from above to give an exhortation on the very text which my brother Williams had taken."}
- card: jarena-lee
  fact: "She sat down afraid of being expelled/punished"
  sources:
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "I now sat down, scarcely knowing what I had done, being frightened. I imagined, that for this indecorum, as I feared it might be called, I should be expelled from the church."}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "she was afraid that Bishop Allen would punish her for preaching without permission"}
- card: jarena-lee
  fact: "Allen rose and told the congregation she had asked him before and that he believed she was called to preach"
  sources:
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "the Bishop rose up in the assembly, and related that I had called upon him eight years before, asking to be permitted to preach, and that he had put me off; but that he now as much believed that I was called to that work"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "Allen asserted that God had called Lee to proclaim the Gospel of Jesus Christ."}
- card: jarena-lee
  fact: "She became the first woman preacher of the AME Church"
  sources:
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "was the first female preacher in the African Methodist Episcopal (AME) Church"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "Minister Jarena Lee was the first female preacher in the African Methodist Episcopal (A.M.E.) Church."}
- card: jarena-lee
  fact: "In one year she travelled 2,325 miles and preached 178 sermons, by her own count"
  sources:
    - {title: "Jarena Lee, Religious Experience and Journal of Mrs. Jarena Lee (Philadelphia, 1849), Project Gutenberg ebook 66953", url: "https://www.gutenberg.org/ebooks/66953", quote: "That year I travelled two thousand three hundred and twenty-five miles, and preached one hundred and seventy-eight sermons."}
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "According to her calculations, in one year, she “…travelled two thousand three hundred and twenty-five miles and preached one hundred and seventy-eight sermons.”"}
- card: jarena-lee
  fact: "She published her life story in 1836 and an expanded journal in 1849"
  sources:
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "Her book \"The Life and Religious Experience of Jarena Lee\" was published in 1836. It was updated several years later and titled \"Religious Experience and Journal of Mrs. Jarena Lee.\""}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "She completed her autobiography in expanded form in 1849."}
- card: jarena-lee
  fact: "She joined the American Anti-Slavery Society"
  sources:
    - {title: "National Park Service: Jarena Lee", url: "https://www.nps.gov/people/jarena-lee.htm", quote: "was a member of the American Antislavery Society"}
    - {title: "Teisha Wilson, BlackPast: Jarena Lee (1783–185?)", url: "https://www.blackpast.org/african-american-history/lee-jarena-1783/", quote: "joined the American Antislavery Society in 1839"}
- card: susie-king-taylor
  fact: "Georgia law barred educating Black people; she learned to read in secret schools kept by Black women in Savannah"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "Despite Georgia’s harsh laws against the formal education of African Americans, she attended two secret schools taught by Black women."}
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "She was a free woman and lived on Bay Lane, between Habersham and Price streets, about half a mile from my house. We went every day about nine o’clock, with our books wrapped in paper to prevent the police or wh"}
- card: susie-king-taylor
  fact: "Susie Baker was born into slavery in Georgia in 1848 and grew up with her grandmother in Savannah"
  sources:
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "I was born under the slave law in Georgia, in 1848, and was brought up by my grandmother in Savannah."}
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "When she was about seven years old, her owner allowed her to go to Savannah to live with her grandmother."}
- card: susie-king-taylor
  fact: "In April 1862, as Union guns took Fort Pulaski, her uncle led the family to the Union fleet; she was fourteen"
  sources:
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "On April 1, 1862, about the time the Union soldiers were firing on Fort Pulaski"}
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "Two days after the taking of Fort Pulaski, my uncle took his family of seven and myself"}
    - {title: "National Park Service: Susie King Taylor", url: "https://www.nps.gov/people/susie-king-taylor.htm", quote: "She became free at the age of 14 when her uncle led her out to a federal gunboat plying the waters near Confederate-held Fort Pulaski."}
- card: susie-king-taylor
  fact: "On St. Simons Island officers asked her to open a school; she taught about forty children by day and adults at night"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "Within days her educational advantages came to the attention of army officers, who offered to obtain books for her if she would organize a school."}
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "I had about forty children to teach, beside a number of adults who came to me nights"}
- card: susie-king-taylor
  fact: "There she married Edward King, a Black sergeant of the 1st South Carolina Volunteers, later the 33rd USCT"
  sources:
    - {title: "Duke University Libraries, Rubenstein Library exhibit: I Recall the Experience Sweet and Sad: Susie King Taylor", url: "https://exhibits.library.duke.edu/exhibits/show/civilwar/taylor", quote: "There she married Edward King, a sergeant in the 1st South Carolina Infantry Volunteers, later named the 33rd Regiment, United States Colored Troops."}
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "While at the school on St. Simons Island, Baker married Edward King, a Black noncommissioned officer in the Union forces."}
- card: susie-king-taylor
  fact: "For the rest of the war she moved with the regiment as laundress and nurse and taught soldiers to read and write off duty"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "For three years she moved with her husband’s and brothers’ regiment, serving as nurse and laundress, and teaching many of the Black soldiers to read and write during their off-duty hours."}
    - {title: "Duke University Libraries, Rubenstein Library exhibit: I Recall the Experience Sweet and Sad: Susie King Taylor", url: "https://exhibits.library.duke.edu/exhibits/show/civilwar/taylor", quote: "For approximately three years, Taylor served as cook, nurse, laundress, and teacher for the regiment."}
- card: susie-king-taylor
  fact: "The regiment was made up of formerly enslaved men"
  sources:
    - {title: "National Park Service: Susie King Taylor", url: "https://www.nps.gov/people/susie-king-taylor.htm", quote: "enabled her to serve as the reading instructor for the regiment of former slaves"}
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "No such description has ever been given, I am sure, by one thus connected with a colored regiment"}
    - {title: "Duke University Libraries, Rubenstein Library exhibit: I Recall the Experience Sweet and Sad: Susie King Taylor", url: "https://exhibits.library.duke.edu/exhibits/show/civilwar/taylor", quote: "The majority of firsthand accounts of life in the colored regiments were written and published by the white officers who led them."}
- card: susie-king-taylor
  fact: "After the war she opened a school for freed children in Savannah; Edward died in 1866"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "In 1866 she and Edward returned to Savannah, where she established a school for the freed children. Edward King died in September 1866"}
    - {title: "National Park Service: Susie King Taylor", url: "https://www.nps.gov/people/susie-king-taylor.htm", quote: "opened a private school for the children of freedmen. Unfortunately, her husband died the same year"}
- card: susie-king-taylor
  fact: "In time she had to work as a domestic servant"
  sources:
    - {title: "National Park Service: Susie King Taylor", url: "https://www.nps.gov/people/susie-king-taylor.htm", quote: "By 1868, Taylor was forced to find work as a domestic servant."}
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "In the 1870s King traveled to Boston as a domestic servant of a wealthy white family."}
- card: susie-king-taylor
  fact: "In the 1870s she settled in Boston, where she married Russell Taylor"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "While there she met and married Russell Taylor. She remained in Boston for the rest of her life"}
    - {title: "Susie King Taylor, Reminiscences of My Life in Camp (Boston, 1902), Project Gutenberg ebook 73499", url: "https://www.gutenberg.org/ebooks/73499", quote: "where I remained until I was married, in 1879, to Russell L. Taylor."}
- card: susie-king-taylor
  fact: "In 1902 she published Reminiscences, the only Civil War memoir by an African American woman"
  sources:
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "she was the only African American woman to publish a memoir of her wartime experiences"}
    - {title: "Duke University Libraries, Rubenstein Library exhibit: I Recall the Experience Sweet and Sad: Susie King Taylor", url: "https://exhibits.library.duke.edu/exhibits/show/civilwar/taylor", quote: "This volume is the only Civil War memoir published by an African American woman."}
- card: susie-king-taylor
  fact: "She died in 1912"
  sources:
    - {title: "National Park Service: Susie King Taylor", url: "https://www.nps.gov/people/susie-king-taylor.htm", quote: "Date of Death: October 6, 1912"}
    - {title: "Ronald E. Butchart, New Georgia Encyclopedia: Susie King Taylor (1848-1912)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/susie-king-taylor-1848-1912/", quote: "which were privately published in 1902. She died ten years later."}
- card: cathay-williams
  fact: "After the war the Army raised new all-Black regiments for the West, later called Buffalo Soldiers"
  sources:
    - {title: "National Park Service, Fort Union National Monument: The Strange Case of Private William Cathay", url: "https://www.nps.gov/foun/learn/historyculture/william-cathay.htm", quote: "The 38th was one of the new regiments made up entirely of African-American soldiers. They would later become known as Buffalo Soldiers."}
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "serving in Company A of the 38th Infantry, a newly-formed all-black U.S. Army Regiment"}
- card: cathay-williams
  fact: "Women were not allowed to serve"
  sources:
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Despite the prohibition against women serving in the military"}
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Williams disguised her gender and enlisted"}
- card: cathay-williams
  fact: "She was born enslaved in Jackson County / Independence, Missouri, in 1844 or about 1850 (dispute includes NPS summary Sept 1842)"
  sources:
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Cathay Williams was born to an enslaved mother and a free father in Independence, Missouri in 1844."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Date of Birth: September 1842"}
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Cathay was born a slave around 1850 in Jackson County, Missouri."}
- card: cathay-williams
  fact: "In 1861 Union troops took her to cook and wash for officers"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "In September 1861 Union troops impressed Cathay into the Army to work as a cook and washerwoman for Union Army officers."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Williams served as an Army cook and a washerwoman."}
- card: cathay-williams
  fact: "She followed the army through the war, for a time with General Philip Sheridan's staff"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "In 1864 she briefly served as cook and washerwoman for General Phil Sheridan and his staff"}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Williams served under the service of General Philip Sheridan"}
- card: cathay-williams
  fact: "On 15 November 1866 she enlisted as William Cathay and was assigned to the 38th Infantry"
  sources:
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "enlisted in the U.S. Regular Army under the false name of \"William Cathay\" on November 15, 1866"}
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "On November 15, 1866 Williams disguised her gender and enlisted as William Cathey, serving in Company A of the 38th Infantry"}
- card: cathay-williams
  fact: "She served at Fort Cummings and Fort Bayard in New Mexico Territory"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "was later posted at Fort Cummings and Fort Bayard in New Mexico Territory"}
    - {title: "National Park Service, Fort Union National Monument: The Strange Case of Private William Cathay", url: "https://www.nps.gov/foun/learn/historyculture/william-cathay.htm", quote: "Company A marched another 350 miles to Fort Cummings in southwest New Mexico."}
    - {title: "National Park Service, Fort Union National Monument: The Strange Case of Private William Cathay", url: "https://www.nps.gov/foun/learn/historyculture/william-cathay.htm", quote: "In June 1868, Company A transferred to Fort Bayard"}
- card: cathay-williams
  fact: "She kept her secret through repeated hospital stays until the post surgeon discovered she was a woman (almost two years)"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Cathay concealed her femininity for two years despite numerous Army hospital visits before her true gender was discovered by the Fort Bayard post surgeon."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Due to her frequent hospialization, the post surgeon finally discovered she was a woman"}
- card: cathay-williams
  fact: "On 14 October 1868 she was discharged on a surgeon's certificate of disability"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Cathay was discharged at Fort Bayard on October 14, 1868 on a surgeon’s certificate of disability."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "honorably discharged by her commanding officer, Captain Charles E. Clarke on October 14, 1868"}
- card: cathay-williams
  fact: "She resumed her own name and lived in Pueblo and then Trinidad, Colorado"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Cathay resumed her identity as Cathay Williams and lived in Pueblo, Las Animas, and Trinidad, Colorado"}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "later moved to Pueblo, Colorado"}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "moved to Trinidad, Colorado, where she worked as a seamtress"}
- card: cathay-williams
  fact: "In 1876 a St. Louis newspaper published her story"
  sources:
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Her life and military service narrative was published in the St. Louis Daily Times on January 2, 1876."}
    - {title: "National Park Service, Fort Union National Monument: The Strange Case of Private William Cathay", url: "https://www.nps.gov/foun/learn/historyculture/william-cathay.htm", quote: "In an 1876 interview with a St. Louis newspaper"}
- card: cathay-williams
  fact: "Around 1890, ill, she applied for a disability pension and was refused"
  sources:
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Around 1889 or 1890, Williams entered a local hospital and applied for a disability pension based on her military service."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Williams request was denied"}
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "The Army rejected her pension claim on February 8, 1892"}
- card: cathay-williams
  fact: "When she died is uncertain (dispute: NPS people page c. 1893; BlackPast and Fort Union page unknown)"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "The date of Cathay Williams’ death is unknown."}
    - {title: "National Park Service, Fort Union National Monument: The Strange Case of Private William Cathay", url: "https://www.nps.gov/foun/learn/historyculture/william-cathay.htm", quote: "Her date of death and burial location are unknown."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Date of Death: ca. 1893"}
- card: cathay-williams
  fact: "She is the only African American woman documented as a soldier in the Regular Army in the nineteenth century / the only woman Buffalo Soldier"
  sources:
    - {title: "Ramona Rand-Caplan, BlackPast: Cathay Williams (1850- )", url: "https://www.blackpast.org/african-american-history/williams-cathay-1850/", quote: "Cathay Williams is the only documented African American woman who served as a soldier in the Regular U.S. Army in the nineteenth century."}
    - {title: "National Park Service: Cathay Williams", url: "https://www.nps.gov/people/cwilliams.htm", quote: "Cathay Williams was the only woman to serve in the US Army as a Buffalo Soldier"}
- card: lewis-latimer
  fact: "Early carbon filaments were delicate and many broke or warped in the furnace during carbonising"
  sources:
    - {title: "Google Patents: US252386A, L. H. Latimer, Process of Manufacturing Carbons (1882)", url: "https://patents.google.com/patent/US252386A/en", quote: "so that many ofthem are broken and distortedin consequence of their extremely-delicate structure"}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Latimer's design produced a carbon filament that was more durable and longer lasting than earlier filaments."}
- card: lewis-latimer
  fact: "Latimer was born in Chelsea, Massachusetts, on 4 September 1848"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Born Sept. 4, 1848"}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Latimer was born in Chelsea, Massachusetts, the son of former slaves."}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "Lewis Howard Latimer was born on September 4th, 1848 in Chelsea, Massachusetts."}
- card: lewis-latimer
  fact: "His parents had escaped slavery (son of formerly enslaved parents)"
  sources:
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "His parents were self-emancipated enslaved Virginians."}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "the son of former slaves"}
- card: lewis-latimer
  fact: "At sixteen he joined the Union Navy"
  sources:
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "He enlisted in the Union Navy in 1864 at the age of 16"}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "He enlisted in the Union Navy during the Civil War"}
- card: lewis-latimer
  fact: "After the war he worked at a Boston patent law firm and, without formal schooling, taught himself drafting"
  sources:
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "leveraged his self-taught drafting skills to land a job at a patent law firm in Boston as a draftsman"}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "with no access to formal education– taught himself mechanical drawing"}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Working as a self-taught draftsman after the war"}
- card: lewis-latimer
  fact: "He made the drawings for Bell's telephone patent application"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Latimer made the drawings for Alexander Graham Bell's first patent application for the telephone"}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "his drawings were crucial for securing the telephone patent"}
- card: lewis-latimer
  fact: "He worked for the United States Electric Lighting Company"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "while working for the United States Electric Lighting Co. in the 1880s"}
    - {title: "Google Patents: US252386A, L. H. Latimer, Process of Manufacturing Carbons (1882)", url: "https://patents.google.com/patent/US252386A/en", quote: "LEWIS H. LATIMER, OF NEW YORK, N. Y., ASSIGNOR TO THE UNITED STATES ELECTRIC LIGHTING COMPANY, OF SAME PLACE."}
- card: lewis-latimer
  fact: "On 17 January 1882 he received a patent (No. 252,386) for a process of manufacturing carbons, assigned to that company"
  sources:
    - {title: "Google Patents: US252386A, L. H. Latimer, Process of Manufacturing Carbons (1882)", url: "https://patents.google.com/patent/US252386A/en", quote: "Letters Patent No. 252,386, dated January 17, 1882."}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Durable Carbon Filament for Electric Light Bulbs U.S. Patent No. 252,386"}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "His invention of a method to manufacture carbon filament to make lightbulbs mass-producible was patented in 1882."}
- card: lewis-latimer
  fact: "His method prevented the breaking and warping of the filaments in the furnace"
  sources:
    - {title: "Google Patents: US252386A, L. H. Latimer, Process of Manufacturing Carbons (1882)", url: "https://patents.google.com/patent/US252386A/en", quote: "This I avoid by the method I propose"}
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Lewis Latimer invented a method for producing a more durable carbon filament"}
- card: lewis-latimer
  fact: "The result was a longer-lasting filament and bulbs more people could afford"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "As a result, incandescent light bulbs became affordable to more consumers."}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "to make lightbulbs mass-producible"}
- card: lewis-latimer
  fact: "He later worked for Edison's company as a patent expert"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Latimer worked for Thomas Edison and became a patent investigator and expert witness for the Edison Electric Light Co."}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "Eventually, he became a chief draftsman, patent expert, and inventor."}
- card: lewis-latimer
  fact: "He died on 11 December 1928"
  sources:
    - {title: "National Inventors Hall of Fame: Lewis Latimer", url: "https://www.invent.org/inductees/lewis-latimer", quote: "Died Dec. 11, 1928"}
    - {title: "Lewis H. Latimer House Museum: About Lewis Latimer", url: "https://www.lewislatimerhouse.org/about", quote: "Lewis Latimer died on December 11, 1928 at the age of 80 in Flushing, Queens, New York."}
- card: thomas-fuller-calculator
  fact: "A common pro-slavery claim held Africans mentally inferior; antislavery campaigners used Fuller to refute it"
  sources:
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "late in his life was discovered by antislavery campaigners who used him as a demonstration that blacks are not mentally inferior to whites"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "the antislavery movement used him and others as examples of how enslaved African Americans were capable of learning"}
- card: thomas-fuller-calculator
  fact: "Fuller was born in West Africa around 1710 and was taken at about fourteen and sold into slavery in Virginia"
  sources:
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "Born in West Africa and sold into slavery in Virginia"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "“was brought to this country at the age of fourteen and was sold as a slave with many of his unfortunate countrymen.”"}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "was stolen from his native Africa at the age of fourteen and sold to a planter"}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "Born 1710 West Africa"}
- card: thomas-fuller-calculator
  fact: "He ended up on the Cox farm near Alexandria and stayed there the rest of his life"
  sources:
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "At some point Fuller was purchased by Presley and Elizabeth Cox, who farmed 232 acres of land four miles west of Alexandria. He remained there the rest of his life"}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "Certainly late in his life he was the property of Elixabeth Coxe of Alexandria."}
- card: thomas-fuller-calculator
  fact: "He never learned to read or write"
  sources:
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "He never learned to read or write in English"}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "having never learned to read or write"}
- card: thomas-fuller-calculator
  fact: "When he was about seventy two visitors from Pennsylvania tested him"
  sources:
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "When he was about seventy years old, two gentlemen, natives of Pennsylvania"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "Two white men, both Quakers from Pennsylvania, traveled to the Cox farm and posed several problems for him to solve"}
- card: thomas-fuller-calculator
  fact: "Seconds in a year and a half: 47,304,000"
  sources:
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "how many seconds there were in a year and a half, he answered in about two minutes, 47 304 000"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "how many seconds are in a year and half (47,304,000)"}
- card: thomas-fuller-calculator
  fact: "Seconds lived by a man of 70 years, 17 days, 12 hours: 2,210,500,800, answered within a minute and a half / within a minute or two, without paper"
  sources:
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "how many seconds a man has lived who is 70 years, 17 days and 12 hours old, he answered in a minute and a half 2 210 500 800"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "how many seconds are in seventy years, seventeen days, and twelve hours (2,210,500,800)"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "within a minute or two, and without the aid of paper or pencil"}
- card: thomas-fuller-calculator
  fact: "A visitor calculating in writing said it was too large; Fuller reminded him of leap years and the answer agreed"
  sources:
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "stop, master, you forget the leap year. On adding the amount of the seconds of the leap years the amount of the whole in both their sums agreed exactly."}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "One of the men argued that the second solution was too large, but Fuller reminded him of leap years."}
- card: thomas-fuller-calculator
  fact: "Fuller died in 1790 at about eighty"
  sources:
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "The latter lists his age at the time of his death as eighty, making his birth year about 1710."}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "In 1790 he died at the age of 80 years"}
- card: thomas-fuller-calculator
  fact: "Dispute: Rush has him teaching himself; Fauvel and Gerdes argue for an African tradition of mental calculation"
  sources:
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "According to Rush, Fuller told two men who came to interview him late in his life that he taught himself"}
    - {title: "Brendan Wolfe, Encyclopedia Virginia: Thomas Fuller (ca. 1710–1790)", url: "https://encyclopediavirginia.org/entries/fuller-thomas-ca-1710-1790/", quote: "they point to “a rich tradition of mental calculations among illiterate people” in Africa"}
    - {title: "J. J. O'Connor and E. F. Robertson, MacTutor History of Mathematics, University of St Andrews: Thomas Fuller", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Fuller_Thomas/", quote: "Present day thinking is that Fuller learnt to calculate in Africa before he was brought to the United States as a slave."}
- card: rebecca-lee-crumpler
  fact: "Most medical schools refused Black students, men and women"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "most medical schools barred all African Americans—both men and women—from attending"}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "most medical schools at that time it did not admit African Americans"}
- card: rebecca-lee-crumpler
  fact: "In 1864 the US had some 54,000 physicians and no Black women among them"
  sources:
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "there were no black female doctors among the 54,000 physicians in the U.S."}
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "there were 54,543 physicians in the country; 270 of them were women—all white—and 180 were African American men"}
- card: rebecca-lee-crumpler
  fact: "Rebecca Davis was born in Delaware in 1831 and raised by an aunt in Pennsylvania who nursed sick neighbours"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "Crumpler was born in 1831 in Delaware, to Absolum Davis and Matilda Webber. An aunt in Pennsylvania, who spent much of her time caring for sick neighbors"}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "She was raised by an aunt in Pennsylvania who was noted to have provided health care to her neighbors."}
- card: rebecca-lee-crumpler
  fact: "She wrote that she early wished to relieve the sufferings of others"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "I early conceived a liking for, and sought every opportunity to relieve the sufferings of others"}
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "I early conceived a liking for, and sought every opportunity to be in a position to relieve the sufferings of others."}
- card: rebecca-lee-crumpler
  fact: "1852-1860 she nursed for doctors in Charlestown without formal training; first nursing school opened 1873"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "By 1852 she had moved to Charlestown, Massachusetts, where she worked as a nurse for the next eight years (because the first formal school for nursing only opened in 1873, she was able to perform such work without any formal training)."}
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "there was no formal school where one could become licensed as a nurse (the first one opened in 1873), so she performed her medical duties without any formal education"}
- card: rebecca-lee-crumpler
  fact: "In 1860 she was admitted to the New England Female Medical College in Boston"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "In 1860, she was admitted to the New England Female Medical College."}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "She enrolled in the New England Female Medical College in 1860."}
- card: rebecca-lee-crumpler
  fact: "Her first husband Wyatt Lee died of tuberculosis in 1863"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "After Wyatt died of tuberculosis in April 1863"}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "Lee died of tuberculosis on April 18, 1863."}
- card: rebecca-lee-crumpler
  fact: "On 1 March 1864 she graduated a doctress of medicine, the first African American woman in the US to earn an MD"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "On March 1, 1864, Crumpler received a “Doctress of Medicine” from the New England Female Medical College."}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "graduated on March 1, 1864"}
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "When she graduated in 1864, Crumpler was the first African American woman in the United States to earn an M.D. degree"}
- card: rebecca-lee-crumpler
  fact: "After the war she went to Richmond and worked with the Freedmen's Bureau and missionary groups treating formerly enslaved people with no other care"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "The Crumplers went to Richmond where she worked with the Freedmen’s Bureau and other charity and missionary groups to care for formerly enslaved men, women, and children."}
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "She joined other black physicians caring for freed slaves who would otherwise have had no access to medical care, working with the Freedmen's Bureau, and missionary and community groups"}
- card: rebecca-lee-crumpler
  fact: "Back in Boston she practised from her home on Joy Street, Beacon Hill, regardless of patients' ability to pay"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "Dr. Crumpler saw patients in and around her house on Joy Street. She treated her patients regardless of their ability to pay."}
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "She lived on Joy Street on Beacon Hill"}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "Crumpler returned to Boston in 1869, where she practiced from her home on Beacon Hill"}
- card: rebecca-lee-crumpler
  fact: "In 1883 she published A Book of Medical Discourses on the health of women and children, one of the first medical books by an African American"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "Rebecca Crumpler's 'Book of Medical Discourses' is one of the very first medical publications by an African American."}
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "A Book of Medical Discourses is believed to be the first medical text written by an African American author."}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "In 1883, she published a medical guide book, A Book of Medical Discourses , which primarily gave advice for women on the health care of their families."}
- card: rebecca-lee-crumpler
  fact: "She died in 1895"
  sources:
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "Dr. Rebecca Lee Crumpler died of fibroid tumors on March 9, 1895"}
    - {title: "Sara Diaz, BlackPast: Rebecca Davis Lee Crumpler (1831-1895)", url: "https://www.blackpast.org/african-american-history/crumpler-rebecca-davis-lee-1831-1895/", quote: "Dr. Rebecca Davis Lee Crumpler died on March 9, 1895"}
- card: rebecca-lee-crumpler
  fact: "No portrait of her survives"
  sources:
    - {title: "National Library of Medicine, Changing the Face of Medicine: Dr. Rebecca Lee Crumpler", url: "https://cfmedicine.nlm.nih.gov/physicians/biography_73.html", quote: "No photos or other images survive of Dr. Crumpler."}
    - {title: "National Women's History Museum: Rebecca Lee Crumpler", url: "https://www.womenshistory.org/education-resources/biographies/rebecca-lee-crumpler", quote: "There are no surviving pictures of Dr. Rebecca Lee Crumpler."}
