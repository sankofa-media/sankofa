      - {title: "Carnegie Hall Timeline: Rap & Hip-Hop", url: "https://timeline.carnegiehall.org/genres/rap-hip-hop", quote: "Hip-hop music culture is a product of African American, Afro-Caribbean and Latino inner-city communities."}
    note: "PBS also lists rapping, DJ'ing, breaking and graffiti; early 1970s per HISTORY/GRAMMY (1973)."
