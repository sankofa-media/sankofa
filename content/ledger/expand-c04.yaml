  fact: "They fell out of use when the colonial Gold Coast moved to British money around 1900"
  sources:
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "until paper currency based on the British pound was introduced in 1899"
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "the Akan adopted a currency of gold-dust which was used up to the end of the nineteenth century."
- card: akan-goldweights
  fact: "Huge numbers survive, many in museums"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "it has been estimated that not less than three million genuine Akan brass weights still survive today."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "It is their kingdom that the Penn Museum's gold weight collection represents."
