  sources:
    - title: "Tonio Sebastian Richter, Coptic, UCLA Encyclopedia of Egyptology (2023)"
      url: "https://escholarship.org/uc/item/22r6s881"
      quote: "at the time Coptic emerged, all central institutions exercising authority in Egypt officiated in Greek. This holds for governmental as well as religious institutions, notably the central authority of the evolving Christian church of Egypt"
    - title: "The Unicode Standard 17.0, chapter 7: Coptic"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-7/"
      quote: "Coptic was subject to strong Greek influences because Greek was more identified with the Christian tradition, and the written demotic Egyptian no longer matched the spoken language."
