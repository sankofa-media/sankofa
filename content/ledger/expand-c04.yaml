      url: "https://artsandculture.google.com/asset/ivory-mask/YwEcUb_gRSUFrw"
      quote: "It commemorated her support in military campaigns that resulted in the expansion of the Benin Kingdom. She is remembered as ‘the only woman who went to war’."
