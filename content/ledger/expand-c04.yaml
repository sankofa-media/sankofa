      quote: "It is their kingdom that the Penn Museum's gold weight collection represents."
- card: senegambian-stone-circles
  fact: "More than 1,000 megalithic monuments (stone circles with burial mounds) line some 350 km of the Gambia River (also wow)"
  sources:
    - title: "ICOMOS, Advisory Body Evaluation: The Stone Circles of Senegambia, No. 1226 (2006)"
      url: "https://whc.unesco.org/archive/advisory_body_evaluation/1226.pdf"
      quote: "Four large groups of stone circles represent an extraordinary concentration of over 1,000 stone circles and aligned monuments encompassing in a band 100km across spread out along some 350km of the River Gambia."
    - title: "Governments of The Gambia and Senegal, Nomination file: Stone Circles of Senegambia (2005)"
      url: "https://whc.unesco.org/uploads/nominations/1226.pdf"
      quote: "Ces quatre grands groupes de cercles mégalithiques constituent une concentration extraordinaire - plus de 1 000 monuments - sur une bande de 100 km de large qui longe sur 350 km le fleuve Gambie."
    - title: "ICOMOS, Advisory Body Evaluation: The Stone Circles of Senegambia, No. 1226 (2006)"
      url: "https://whc.unesco.org/archive/advisory_body_evaluation/1226.pdf"
      quote: "The nominated property consists of four separate groups of stone circles and associated burial mounds"
- card: senegambian-stone-circles
  fact: "They date from the 3rd century BCE to the 16th century CE, over more than 1,500 years (also wow)"
  sources:
    - title: "ICOMOS, Advisory Body Evaluation: The Stone Circles of Senegambia, No. 1226 (2006)"
      url: "https://whc.unesco.org/archive/advisory_body_evaluation/1226.pdf"
      quote: "some of which have been excavated to reveal material that suggest dates between 3rd century BC and 16th century AD. Together the stone circles of carefully worked laterite pillars and their associated burial mounds present a vast sacred landscape accumulated over more than a 1,500 years"
    - title: "Governments of The Gambia and Senegal, Nomination file: Stone Circles of Senegambia (2005)"
      url: "https://whc.unesco.org/uploads/nominations/1226.pdf"
      quote: "All these sites form a large necropolis complex which could have been set in place between the 3rd Century BC and the 16th Century AD."
- card: senegambian-stone-circles
  fact: "Pillars were cut with iron tools from nearby laterite quarries, each a single block (monolith)"
  sources:
    - title: "ICOMOS, Advisory Body Evaluation: The Stone Circles of Senegambia, No. 1226 (2006)"
      url: "https://whc.unesco.org/archive/advisory_body_evaluation/1226.pdf"
      quote: "The stones forming the circles have been quarried with iron tools from nearby laterite quarries and skilfully shaped into almost identical pillars, either cylindrical or polygonal in section"
    - title: "Governments of The Gambia and Senegal, Nomination file: Stone Circles of Senegambia (2005)"
      url: "https://whc.unesco.org/uploads/nominations/1226.pdf"
      quote: "Without this expertise it would have been almost impossible to exploit the quarries which gave birth to more than 28,931 monoliths already surveyed in the area."
    - title: "Governments of The Gambia and Senegal, Nomination file: Stone Circles of Senegambia (2005)"
      url: "https://whc.unesco.org/uploads/nominations/1226.pdf"
      quote: "Les pierres formant les cercles ont été extraites à l’aide d’outils de fer et savamment taillées en colonnes presque identiques, de section soit cylindrique soit polygonale"
- card: senegambian-stone-circles
  fact: "Most pillars are cylindrical or polygonal in regular rings; a few are V-shaped lyre stones"
  sources:
    - title: "ICOMOS, Advisory Body Evaluation: The Stone Circles of Senegambia, No. 1226 (2006)"
      url: "https://whc.unesco.org/archive/advisory_body_evaluation/1226.pdf"
