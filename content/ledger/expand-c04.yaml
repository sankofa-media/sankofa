- card: queen-idia
  fact: "Idia lived in the kingdom of Benin (southern Nigeria) in the early 16th century; her son was Oba Esigie (years 1504–1550 = Esigie's reign)"
  sources:
    - title: "British Museum: Ivory mask, Af1910,0513.1, via Google Arts & Culture"
      url: "https://artsandculture.google.com/asset/ivory-mask/YwEcUb_gRSUFrw"
      quote: "This ivory mask is popularly associated with Idia, the mother of Oba (King) Esigie. He ruled the Benin Kingdom, in modern Nigeria c.1504-1550."
    - title: "Isabel Eiser, Ikone einer Debatte: Eine Rezeptionsgeschichte der Benin-Bronzen, bpb Aus Politik und Zeitgeschichte (2021)"
      url: "https://www.bpb.de/apuz/nigeria-2021/337818/eine-rezeptionsgeschichte-der-benin-bronzen"
      quote: "Königinmutter (Iy’Oba) Idia identifiziert, deren Sohn Oba Esigie das Königreich Benin von 1504 bis 1550 regiert hatte."
    - title: "Dominique Malaquais and Cédric Vincent, Festac: Idia Tales – Three Takes and a Mask, Chimurenga Chronic (2024)"
      url: "https://chimurengachronic.co.za/?p=18676"
      quote: "Consider Idia:  iy’oba , queen mother to oba Esigie, ruler of the Benin kingdom in the first half of the 1500s."
- card: queen-idia
  fact: "Esigie fought wars that expanded the kingdom; Idia is remembered as the force behind his campaigns and a woman who went to war (also wow)"
  sources:
