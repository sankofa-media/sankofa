# Fact ledger for expansion batch c04: each fact in the bodies and wow lines
# of the cards below, with two or more independent sources and a verbatim quote.
# [...] marks an elision inside a quote.
- card: swahili
  fact: "Swahili is a Bantu language of the East African coast"
  sources:
    - title: "Encyclopaedia Britannica: Swahili language"
      url: "https://www.britannica.com/topic/Swahili-language"
      quote: "Swahili language , Bantu language spoken either as a mother tongue or as a fluent second language on the east coast of Africa"
    - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
      url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
      quote: "Kiswahili, an African language of the Bantu-family"
    - title: "UN Africa Renewal (UNESCO): Kiswahili is a language that speaks to both past and present (2022)"
      url: "https://africarenewal.un.org/en/magazine/kiswahili-language-speaks-both-past-and-present"
      quote: "Over the centuries, this Bantu language has emerged as a common form of communication in many parts of sub-Saharan Africa"
- card: swahili
  fact: "Its vocabulary carries traces of Indian Ocean trade, above all many Arabic loanwords"
  sources:
    - title: "Encyclopaedia Britannica: Swahili language"
      url: "https://www.britannica.com/topic/Swahili-language"
      quote: "there are an enormous number of Arabic loanwords in the language"
    - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
      url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
      quote: "Its changing vocabulary echoes the long-term impacts and effects of a transregional history of human connectivity, also across the Indian Ocean, with the Red Sea, the Gulf"
- card: swahili
  fact: "For most of its history Swahili was written in Arabic script; the oldest firmly dated Swahili writing on paper is from the early eighteenth century"
  sources:
    - title: "Encyclopaedia Britannica: Swahili language"
      url: "https://www.britannica.com/topic/Swahili-language"
      quote: "The oldest preserved Swahili literature , which dates from the early 18th century, is written in the Arabic script"
    - title: "Ann Biersteker, Manuscript Cultures 17 (2021), University of Hamburg CSMC"
      url: "https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc17-biersteker.pdf"
      quote: "The oldest confirmed Swahili writing on paper is correspondence written in the early eighteenth century (1711–1724)"
    - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
      url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
      quote: "PRE-20TH CENTURY SOURCES: SWAHILI MANUSCRIPTS IN ARABIC SCRIPT"
- card: swahili
  fact: "In 1711 Fatima bint Muhammad, sultana of Kilwa, wrote a letter in Swahili in Arabic letters (also wow)"
  sources:
    - title: "Abdelhakim Belhacel and Fu'ad Al-Qaisi, Un projet d'alliance entre Kilwa et la France, Afriques (2025)"
      url: "https://journals.openedition.org/afriques/5159"
      quote: "d'une lettre de 1711 d'une sultane de Kilwa, Fāṭima bint Muḥammad. [...] la lettre de Fāṭima bint Muḥammad est écrite en swahili ʿajamī."
    - title: "Ann Biersteker, Manuscript Cultures 17 (2021), University of Hamburg CSMC"
      url: "https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc17-biersteker.pdf"
      quote: "correspondence written in the early eighteenth century (1711–1724) [...] see Alpers, 1975; Sultan Fatima binti Muhammad Mkubwa 2007"
- card: swahili
  fact: "These letters were seized by the Portuguese and survive in the archives in Goa"
  sources:
    - title: "Ann Biersteker, Manuscript Cultures 17 (2021), University of Hamburg CSMC"
      url: "https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc17-biersteker.pdf"
      quote: "letters that were confiscated by the Portuguese and taken to the Portuguese archives in Goa"
    - title: "Abdelhakim Belhacel and Fu'ad Al-Qaisi, Un projet d'alliance entre Kilwa et la France, Afriques (2025)"
      url: "https://journals.openedition.org/afriques/5159"
      quote: "Elles sont conservées aux Historical Archives of Goa et ont été signalées par Edward A. Alpers."
- card: swahili
  fact: "Swahili travelled inland along caravan routes carrying ivory and captives into Central Africa and became a lingua franca"
  sources:
    - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
      url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
      quote: "Trade routes, created by caravans (largely concerned with acquiring slaves and ivory and bringing brass and cloth) reached far into Central Africa, and Swahili was long used as mediating lingua franca between people of different origin and unequal status."
    - title: "Encyclopaedia Britannica: Swahili language"
      url: "https://www.britannica.com/topic/Swahili-language"
      quote: "the spread of Swahili inland received a great impetus from its being the language of the Arab ivory and slave caravans"
- card: swahili
  fact: "Colonial rulers used Swahili to govern, including the Germans in Tanganyika"
  sources:
    - title: "Encyclopaedia Britannica: Swahili language"
      url: "https://www.britannica.com/topic/Swahili-language"
      quote: "Swahili was later adopted by European colonialists, especially the Germans, who used it extensively as the language of administration in Tanganyika"
    - title: "Kai Kresse and Clarissa Vierke, Swahili language and literature as resources for Indian Ocean studies, History Compass (2022)"
      url: "https://epub.uni-bayreuth.de/6697/1/History%20Compass%20-%202022%20-%20Kresse%20-%20Swahili%20language%20and%20literature%20as%20resources%20for%20Indian%20Ocean%20studies.pdf"
      quote: "Swahili was used strategically as lingua franca also by the British, German, Belgian and Portuguese colonial powers."
- card: swahili
  fact: "More than 200 million people speak Swahili, across East, Central and Southern Africa (also wow)"
  sources:
    - title: "UNESCO: World Kiswahili Language Day"
      url: "https://www.unesco.org/en/days/kiswahili-language"
      quote: "more than 200 million speakers across East, Central and Southern Africa"
    - title: "UN Information Service Nairobi: UN General Assembly recognizes Kiswahili Language Day (2024)"
      url: "https://www.un.org/en/unis-nairobi/un-general-assembly-recognizes-kiswahili-language-day"
      quote: "with over 200 million speakers spread across the world"
- card: swahili
  fact: "In 2021 UNESCO proclaimed 7 July World Kiswahili Language Day (also wow)"
  sources:
    - title: "UNESCO: World Kiswahili Language Day"
      url: "https://www.unesco.org/en/days/kiswahili-language"
      quote: "proclaimed 7 July as World Kiswahili Language Day in 2021"
    - title: "UN Information Service Nairobi: UN General Assembly recognizes Kiswahili Language Day (2024)"
      url: "https://www.un.org/en/unis-nairobi/un-general-assembly-recognizes-kiswahili-language-day"
      quote: "Three years ago in 2021, UNESCO, the UN agency that promotes education, scientific and cultural issues, proclaimed 7th July as the World Kiswahili Day"
- card: ajami
  fact: "Ajami is African languages written in a modified Arabic script adapted to their sounds"
  sources:
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "he wrote daily information in his native tongue using a modified form of Arabic script known as Ajami"
    - title: "Lara Ehrlich, Digitizing Ajami, a Centuries-Old African Script, The Brink, Boston University (2020)"
      url: "https://www.bu.edu/articles/2020/digitizing-ajami-african-written-language"
      quote: "people throughout Africa use it to write phonetic renderings of about a dozen languages"
- card: ajami
  fact: "It has been used across West and East Africa for about a dozen languages, among them Wolof, Hausa, Mandinka and Swahili"
  sources:
    - title: "Lara Ehrlich, Digitizing Ajami, a Centuries-Old African Script, The Brink, Boston University (2020)"
      url: "https://www.bu.edu/articles/2020/digitizing-ajami-african-written-language"
      quote: "people throughout Africa use it to write phonetic renderings of about a dozen languages, including Swahili, Wolof, and Hausa"
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "Ajami script had been widely used across Africa for day-to-day writing in a dozen languages"
    - title: "British Library, EAP1042 Mandinka Ajami Materials of Casamance, Senegal (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460176"
      quote: "The majority of them are written in Mandinka Ajami."
- card: ajami
  fact: "Poets wrote verse in Ajami and shopkeepers kept accounts in it"
  sources:
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "Shopkeepers kept records with it and poets wrote sprawling verses in it."
    - title: "British Library, EAP1042/4, Abdou Karim Thiam collection (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460089"
      quote: "The first is a poem recounting the feats of Muḥammad [...] as well as records of local customers who sought the divination services of Imam Nimbaly Thiam."
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "On one of them, a sheet several years old, his late father had recorded a debt."
- card: ajami
  fact: "The 1711 Kilwa letters, the oldest firmly dated Swahili writing on paper, are in Ajami"
  sources:
    - title: "Abdelhakim Belhacel and Fu'ad Al-Qaisi, Un projet d'alliance entre Kilwa et la France, Afriques (2025)"
      url: "https://journals.openedition.org/afriques/5159"
      quote: "la lettre de Fāṭima bint Muḥammad est écrite en swahili ʿajamī."
    - title: "Ann Biersteker, Manuscript Cultures 17 (2021), University of Hamburg CSMC"
      url: "https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc17-biersteker.pdf"
      quote: "The oldest confirmed Swahili writing on paper is correspondence written in the early eighteenth century (1711–1724)"
- card: ajami
  fact: "Fallou Ngom grew up in Senegal and was teaching (French) linguistics at Western Washington University"
  sources:
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "Fallou Ngom returned to Senegal from where he was teaching French and linguistics at Western Washington University in Bellingham, Wash."
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "Ngom shifted his research from French linguistics, his specialty at Western Washington University"
- card: ajami
  fact: "Years after his father's death Ngom found among his father's papers a note recording a debt (also wow)"
  sources:
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "In 2004, when he dusted off the box and sat down to sift through these tokens of his father's life, Ngom found something confounding: a note, scribbled in his father's hand, about a debt he owed a local trader."
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "On one of them, a sheet several years old, his late father had recorded a debt."
- card: ajami
  fact: "His father was considered illiterate because he could not read French, Senegal's official language, but wrote his own language in Arabic letters (also wow)"
  sources:
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "Ngom's father was considered illiterate because he couldn't read and write in the country's official language, French. But like many Senegalese had for centuries, he wrote daily information in his native tongue using a modified form of Arabic script known as Ajami."
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "Ngom had thought his father was illiterate—he didn't read French, the official language of Senegal. But the note wasn't in French, it was in a script that looked like Arabic, but sounded like Wolof"
- card: ajami
  fact: "Ngom turned his research to Ajami"
  sources:
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "Within a year, Ngom shifted his research from French linguistics, his specialty at Western Washington University, to the handwritten script of his father."
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "waiting for Ngom inside this box was a scrap of paper that would alter the course of his life"
- card: ajami
  fact: "At Boston University he built the African Ajami Library"
  sources:
    - title: "Lara Ehrlich, Digitizing Ajami, a Centuries-Old African Script, The Brink, Boston University (2020)"
      url: "https://www.bu.edu/articles/2020/digitizing-ajami-african-written-language"
      quote: "Ngom collaborated with Eleni Castro [...] These are available in the African Ajami Library , an open access archive hosted at BU."
    - title: "British Library, EAP1042 Mandinka Ajami Materials of Casamance, Senegal (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460176"
      quote: "Material in this collection was created as part of the EAP1042 Digital Preservation of Mandinka Ajami Materials of Casamance, Senegal project."
- card: ajami
  fact: "With the British Library's Endangered Archives Programme his team digitised thousands of manuscripts kept by families in Casamance"
  sources:
    - title: "Lara Ehrlich, Digitizing Ajami, a Centuries-Old African Script, The Brink, Boston University (2020)"
      url: "https://www.bu.edu/articles/2020/digitizing-ajami-african-written-language"
      quote: "He is digitizing more than 18,000 of these indigenous texts [...] on a 15-month project funded by the British Library's Endangered Archives Programme . Ngom gained access to the documents through an elder in the Casamance region of Senegal"
    - title: "British Library, EAP1042 Mandinka Ajami Materials of Casamance, Senegal (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460176"
      quote: "Material in this collection was created as part of the EAP1042 Digital Preservation of Mandinka Ajami Materials of Casamance, Senegal project."
- card: ajami
  fact: "The manuscripts include religious poems, prayers, divination manuals and personal letters"
  sources:
    - title: "British Library, EAP1042/4, Abdou Karim Thiam collection (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460089"
      quote: "The first is a poem recounting the feats of Muḥammad [...] The second manuscript consists of prayers in Arabic [...] The fourth manuscript teaches divination techniques."
    - title: "British Library, EAP1042 Mandinka Ajami Materials of Casamance, Senegal (catalogue record)"
      url: "https://searcharchives.bl.uk/catalog/032-003460176"
      quote: "personal correspondences of the current owner"
    - title: "Lara Ehrlich, Digitizing Ajami, a Centuries-Old African Script, The Brink, Boston University (2020)"
      url: "https://www.bu.edu/articles/2020/digitizing-ajami-african-written-language"
      quote: "These documents range from religious texts to medical diagnoses, advertisements, love letters, business records, contracts, and writings on astrology"
- card: ajami
  fact: "By official standards such writers counted as illiterate"
  sources:
    - title: "Molly Callahan, Unearthing a Long-Ignored African Writing System, BU Today (2022), via America's Black Holocaust Museum"
      url: "https://www.abhmuseum.org/ajami/"
      quote: "all from people who were considered illiterate by the official governmental standards of their countries"
    - title: "Kenneth J. Cooper, The Boston Globe (2010), excerpted by 3 Quarks Daily: The lost script"
      url: "https://3quarksdaily.com/?p=30752"
      quote: "Ngom's father was considered illiterate because he couldn't read and write in the country's official language, French."
- card: tifinagh
  fact: "Tifinagh is the alphabet of the Amazigh/Berber languages of North Africa and the Sahara"
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "The Tifinagh script is used by approximately 20 million people who speak varieties of languages commonly called Berber or Amazigh."
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "The Tifinagh alphabet is used to write the Berber languages of North Africa. [...] It is also widely used by the Tuareg, the principal inhabitants of the Saharan interior"
- card: tifinagh
  fact: "Its oldest relative is the ancient Libyan script, known from inscriptions in North Africa (also wow)"
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "The earliest variety of the Berber alphabet is Libyan. Two forms exist: a Western form and an Eastern form. The Western variety was used along the Mediterranean coast from Kabylia to Morocco"
    - title: "Encyclopaedia Britannica: tifinagh"
      url: "https://www.britannica.com/topic/Tifinagh"
      quote: "An old consonantal alphabet ( tifinagh ) has survived among the Tuareg. It relates to the early Libyan inscriptions"
- card: tifinagh
  fact: "The script is related to the Phoenician alphabet"
  sources:
    - title: "Encyclopaedia Britannica: tifinagh"
      url: "https://www.britannica.com/topic/Tifinagh"
      quote: "It relates to the early Libyan inscriptions and the Phoenician quasi-alphabet."
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "The word tifinagh is a feminine plural noun whose singular would be tafniqt ; it means “the Phoenician (letters).”"
- card: tifinagh
  fact: "Early inscriptions had no fixed direction, sometimes running vertically from bottom to top"
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "Historically, Berber texts did not have a fixed direction. Early inscriptions were written horizontally from left to right, from right to left, vertically (bottom to top, top to bottom)"
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "ancient Tifinagh symbols were sometimes written vertically, running from bottom to top"
- card: tifinagh
  fact: "The script survived among the Tuareg of the Sahara, who still use it (also wow)"
  sources:
    - title: "Encyclopaedia Britannica: tifinagh"
      url: "https://www.britannica.com/topic/Tifinagh"
      quote: "An old consonantal alphabet ( tifinagh ) has survived among the Tuareg."
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "It is also widely used by the Tuareg, the principal inhabitants of the Saharan interior"
- card: tifinagh
  fact: "Tuareg Tifinagh is largely consonantal (an abjad)"
  sources:
    - title: "Encyclopaedia Britannica: tifinagh"
      url: "https://www.britannica.com/topic/Tifinagh"
      quote: "An old consonantal alphabet ( tifinagh ) has survived among the Tuareg."
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "The Tuareg use Tifinagh also, but as an abjad."
- card: tifinagh
  fact: "In the 20th century Neo-Tifinagh was developed for the Berber languages of Morocco and Algeria"
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "Neo-Tifinagh refers to the writing systems that were developed to represent the Maghreb Berber dialects. A number of variants of Neo-Tifinagh exist, the first of which was proposed in the 1960s by the Académie Berbère. That variant has spread in Morocco and Algeria"
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "A modern alphabetical derivative of the traditional script, known as Neo-Tifinagh [...] was introduced in the 20th century"
- card: tifinagh
  fact: "Neo-Tifinagh is a full alphabet that writes all vowels and runs left to right"
  sources:
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "The Neo-tifinagh orthography is an alphabet , ie. all vowels are written explicitly [...] The Neo-Tifinagh writing system is written horizontally, and left-to-right."
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "Tifinagh is an alphabetic writing system. [...] Modern-day Berber script is most frequently written in horizontal lines from left to right"
- card: tifinagh
  fact: "Morocco adopted a standard version to unify spelling, and Tifinagh is taught in Moroccan schools (also wow)"
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Tifinagh"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "The first subset represents the set of characters chosen by IRCAM to unify the orthography of the different Moroccan modern-day Berber dialects [...] The Berber language, written in the Tifinagh script, is currently taught to approximately 300,000 pupils in 10,000 schools"
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "It use has been promoted with royal support in Morocco, where it is taught in elementary schools"
    - title: "Unicode Consortium: Unicode 4.1.0"
      url: "https://www.unicode.org/versions/Unicode4.1.0/"
      quote: "The teaching of Berber, written in Tifinagh, will be generalized and compulsory in Morocco."
- card: tifinagh
  fact: "Tifinagh has its own block in the Unicode standard"
  sources:
    - title: "Unicode Consortium: Unicode 4.1.0"
      url: "https://www.unicode.org/versions/Unicode4.1.0/"
      quote: "The following complete scripts have been added in Unicode 4.1.0: [...] Tifinagh (U+2D30..U+2D7F)"
    - title: "Richard Ishida, Tamazight (Tifinagh) orthography notes (2026)"
      url: "https://r12a.github.io/scripts/tfng/zgh"
      quote: "Unicode 17 has 1 dedicated Tifinagh block, comprising 59 characters."
- card: coptic
  fact: "Coptic is the final stage of the ancient Egyptian language, spoken from about the 2nd century CE"
  sources:
    - title: "Encyclopaedia Britannica: Coptic language"
      url: "https://www.britannica.com/topic/Coptic-language"
      quote: "Coptic language , an Afro-Asiatic language that was spoken in Egypt from about the 2nd century ce and that represents the final stage of the ancient Egyptian language"
    - title: "The Unicode Standard 17.0, chapter 7: Coptic"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-7/"
      quote: "The Coptic script is the final stage in the development of the Egyptian writing system."
- card: coptic
  fact: "Earlier Egyptian was written in hieroglyphs, hieratic and Demotic"
  sources:
    - title: "Encyclopaedia Britannica: Coptic language"
      url: "https://www.britannica.com/topic/Coptic-language"
      quote: "In contrast to earlier stages of Egyptian, which used hieroglyphic writing , hieratic script , or demotic script"
    - title: "The Unicode Standard 17.0, chapter 7: Coptic"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-7/"
      quote: "the written demotic Egyptian no longer matched the spoken language"
- card: coptic
  fact: "Written Demotic no longer matched speech and Christians, for whom Greek was tied to their faith, wrote Egyptian in the Greek alphabet"
  sources:
    - title: "The Unicode Standard 17.0, chapter 7: Coptic"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-7/"
      quote: "Coptic was subject to strong Greek influences because Greek was more identified with the Christian tradition, and the written demotic Egyptian no longer matched the spoken language. The Coptic script was based on the Greek uncial alphabets"
