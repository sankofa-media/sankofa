- card: akan-goldweights
  fact: "The Akan of Ghana and Côte d'Ivoire paid in gold dust until the end of the 19th century"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "Unlike their neighbours to the east and west the Akan adopted a currency of gold-dust which was used up to the end of the nineteenth century."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "Gold dust was the primary currency of the region by the middle of the 18th century until paper currency based on the British pound was introduced in 1899."
- card: akan-goldweights
  fact: "Gold dust was weighed on scales against brass weights (also wow)"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "Amounts required for purchases in the market-place were weighed out with infinite care, and for this purpose huge numbers of brass weights were made"
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "While they are used to measure gold dust and nuggets, they are actually cast from brass."
- card: akan-goldweights
  fact: "Weight units came from the Islamic world through gold trade with Muslim merchants from the north"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "through the emerging gold trade with Mali, the Akan would have acquired their first knowledge of scales and weights of Islamic standard."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "The Dyula, Sudanese people whose merchants began trading with the Akan in the late 14th century, are credited with introducing Islamic designs and a weight system based on Islamic units."
- card: akan-goldweights
  fact: "Weights were made for some five centuries from around 1400"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "The gold-weights of the Akan, together with other brassware such as the ritual vessels known as kuduo, were made probably over a period of five centuries, from about 1400 to 1900."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "By the 14th century, goldsmiths in the region were manufacturing their own weights, scoops, scales, and boxes for storing gold dust"
- card: akan-goldweights
  fact: "They were cast by the lost-wax method: wax model, clay coat, wax melted out, brass poured in"
  sources:
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "casters employed the “lost wax” method. For this, a mold is made by first sculpting an original [...] piece out of wax [...] Placed in a furnace, the wax is drained away and the mold is now ready to be filled with molten brass."
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "The casting technique most commonly used (whether for brass or gold) was the lost-wax method"
- card: akan-goldweights
  fact: "The earliest weights were geometric, close copies of Islamic types"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "The earliest Akan brass weights took simple geometric forms, being fairly close copies of types from the Islamic world."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "It is generally believed that the abstract and geometric designs are the earliest weights, influenced by Islamic culture brought by the first trans-Saharan traders."
- card: akan-goldweights
  fact: "Later figurative weights, the great majority, evoke Akan proverbs (also wow)"
  sources:
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "the vast majority of later figurative weights were plainly intended to represent, or to be associated with, Akan proverbs and folklore."
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "The figures include references to proverbs, myths, and histories of the Asante people."
- card: akan-goldweights
  fact: "One weight shows the Sankofa bird looking back (also wow)"
  sources:
    - title: "Christina Griffith, The Asante Gold Weights, Expedition Magazine 61:2, Penn Museum (2019)"
      url: "https://www.penn.museum/sites/expedition/the-asante-gold-weights/"
      quote: "The Sankofa Bird, meaning a bird which has its head turned to look backwards."
    - title: "T. F. Garrard, introduction to Christine Fox, Asante Brass Casting (Cambridge African Studies Centre, 1988)"
      url: "https://www.african.cam.ac.uk/system/files/documents/asante.pdf"
      quote: "Frontispiece. Sankofa bird, 3.5 cm. Proverb: •It is not forbidden to look back and take it. '"
