# Perspective rewrite of wedgwood-medallion (2026-11-15): shared frame (1787 seal, Wedgwood jasperware;
# 1807/1834 outcome), {male} Wedgwood, Clarkson and Franklin, {female} Lucy Townsend's 1825 society,
# Elizabeth Heyrick and the "Am I Not a Woman and a Sister?" figure in Britain and in Garrison's Liberator.
# Shared facts kept from the earlier text (Granville Sharp, 1807, 1834) keep their sourcing in
# context-b.yaml; they are repeated here for completeness. Quotes marked [...] are condensed.
- card: wedgwood-medallion
  copy: both
  fact: "In 1787 the abolition committee adopted the kneeling-man image as its seal"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "Wedgwood's design was based on a seal commissioned by the Committee for the Abolition of the Slave Trade on 5 July 1787"}
    - {title: "Oberlin College Library: The Kneeling Slave", url: "https://oberlincollegelibrary.org/speccoll/exhibits/show/subjectsoffreedom/kneeling", quote: "The figure consciously echoed the design of a kneeling male slave, adopted in 1787 as the official seal"}
- card: wedgwood-medallion
  copy: both
  fact: "Granville Sharp was among the founders of the 1787 committee"
  sources:
    - {title: "Brycchan Carey: Granville Sharp (1735–1813)", url: "https://brycchancarey.com/abolition/sharp.htm", quote: "In 1787, he was one of the committee of people, mostly Quakers, who set up the Society for Effecting the Abolition of the African Slave Trade"}
    - {title: "The Clapham Society: Granville Sharp", url: "https://claphamsociety.com/article/24-granville-sharp/", quote: "In 1787 he was one of the twelve founding signatories to The Society for the Abolition of the Slave Trade"}
- card: wedgwood-medallion
  copy: both
  fact: "That same year Wedgwood had it made in jasperware, probably modelled by William Hackwood"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "probably by William Hackwood, Wedgwood's best modeller"}
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion (2020)", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "modeled by William Hackwood (1757-1839) for Josiah Wedgwood in 1787"}
    - {title: "American Philosophical Society: Anti-Slavery Medallion", url: "https://www.amphilsoc.org/item-detail/anti-slavery-medallion", quote: "[William Hackwood and Josiah Wedgwood, c. 1787, ceramic jasperware]"}
- card: wedgwood-medallion
  copy: male
  fact: "Wedgwood, a committed abolitionist, gave the cameos away"
  sources:
    - {title: "Tristram Hunt, The Radical Potter (2021), excerpt in Literary Hub", url: "https://lithub.com/how-the-potter-josiah-wedgwood-created-an-iconic-abolitionist-medallion/", quote: "Together with his political hero Major John Cartwright, Wedgwood was elected on to the Committee."}
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "distributed for free at abolitionist society meetings"}
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "Mr. Wedgwood made a liberal donation of these, when finished, among his friends."}
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion (2020)", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "these firms chose to retail rather than distribute them freely as did Wedgwood"}
- card: wedgwood-medallion
  copy: male
  fact: "Thomas Clarkson received a whole consignment of the cameos from Wedgwood"
  sources:
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "I received from him no less than five hundred of them myself."}
    - {title: "Victoria and Albert Museum, object record 414:1304-1885 (Emancipation Badge)", url: "https://collections.vam.ac.uk/item/O79580", quote: "Certainly, Wedgwood is known to have sent consignments to both the American statesman Benjamin Franklin [...] and Thomas Clarkson"}
- card: wedgwood-medallion
  copy: male
  fact: "In 1788 a batch reached Benjamin Franklin in Philadelphia"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "sent a batch to future Founding Father Benjamin Franklin (1706 – 90) in America"}
    - {title: "Oberlin College Library: The Kneeling Slave", url: "https://oberlincollegelibrary.org/speccoll/exhibits/show/subjectsoffreedom/kneeling", quote: "In 1788, a consignment of the cameos was shipped to Benjamin Franklin in Philadelphia."}
- card: wedgwood-medallion
  copy: male
  fact: "Franklin wrote back that the figure 'may have an Effect equal to that of the best written Pamphlet'"
  sources:
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion (2020), quoting Franklin's letter", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "I am persuaded it may have an Effect equal to That of the best written Pamphlet"}
    - {title: "American Philosophical Society: Anti-Slavery Medallion", url: "https://www.amphilsoc.org/item-detail/anti-slavery-medallion", quote: "may have an Effect equal to that of the best written Pamphlet, in procuring Favour to those oppressed People."}
- card: wedgwood-medallion
  copy: male
  fact: "Some set the cameos into the lids of their snuffboxes"
  sources:
    - {title: "Thomas Clarkson, History of the Abolition (1808), vol. II, Project Gutenberg", url: "https://www.gutenberg.org/ebooks/12507", quote: "Some had them inlaid in gold on the lid of their snuff-boxes."}
    - {title: "Historic Deerfield: Wedgwood's anti-slavery medallion (2020)", url: "https://www.historic-deerfield.org/2020-9-21-wedgwoods-anti-slavery-medallion/", quote: "and used them to decorate snuff boxes"}
- card: wedgwood-medallion
  copy: female
  fact: "On 8 April 1825 women met at Lucy Townsend's home in West Bromwich and founded Britain's first women's anti-slavery society"
  sources:
    - {title: "Anna Wood, The Writings of Ladies' Abolitionist Societies in Britain, 1825–1833, Fairmount Folio (Wichita State University)", url: "https://journals.wichita.edu/index.php/ff/article/view/149", quote: "On April 8, 1825, in the home of Lucy Townsend, [...] forty four women gathered to establish the first women's anti-slavery society in Britain."}
    - {title: "West Bromwich Local History Society: Lucy Townsend, abolitionist", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "On April 8th, 1825 Lucy Townsend held a meeting at her home in West Bromwich."}
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "the first anti-slavery society for women in 1825"}
- card: wedgwood-medallion
  copy: female
  fact: "Lucy Townsend was a clergyman's wife"
  sources:
    - {title: "West Bromwich Local History Society: Lucy Townsend, abolitionist", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "She married Rev. Charles Townsend, curate of West Bromwich in 1807."}
    - {title: "Anna Wood, The Writings of Ladies' Abolitionist Societies in Britain, 1825–1833, Fairmount Folio (Wichita State University)", url: "https://journals.wichita.edu/index.php/ff/article/view/149", quote: "Lucy Townsend, the wife of an Anglican clergyman"}
- card: wedgwood-medallion
  copy: female
  fact: "Elizabeth Heyrick was a founder of the society"
  sources:
    - {title: "Mimi Sheller, Bleeding Humanity and Gendered Embodiments, Humanity Journal (2014), note 36", url: "https://humanityjournal.org/issue2-2/bleeding-humanity-and-gendered-embodiments-from-antislavery-sugar-boycotts-to-ethical-consumers/", quote: "including Lucy Townsend, Elizabeth Heyrick, Mary Lloyd, Sarah Wedgwood, and Sophia Sturge"}
    - {title: "West Bromwich Local History Society: Lucy Townsend, abolitionist", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "A committee was formed with Elizabeth Heyrick as treasurer for the organisation."}
    - {title: "Story of Leicester (Leicester City Council): Elizabeth Heyrick and Susannah Watts", url: "https://storyofleicester.info/city-stories/elizabeth-heyrick-susannah-watts", quote: "appointed Treasurer at the inaugural meeting of the Birmingham Female Society"}
- card: wedgwood-medallion
  copy: female
  fact: "Heyrick demanded immediate abolition, not the gradualism most male campaigners favoured"
  sources:
    - {title: "Story of Leicester (Leicester City Council): Elizabeth Heyrick and Susannah Watts", url: "https://storyofleicester.info/city-stories/elizabeth-heyrick-susannah-watts", quote: "[a relentless campaign for the immediate abolition of slavery, rejecting the slower, step-by-step approach] favoured by most male abolitionists"}
    - {title: "Ira V. Brown, \"Am I Not a Woman and a Sister?\", Pennsylvania History (1978)", url: "https://journals.psu.edu/phj/article/view/24363", quote: "Elizabeth Heyrick, had suggested as early as 1824 that the reformers' goal should be \"immediate, not gradual abolition\""}
    - {title: "Anna Wood, The Writings of Ladies' Abolitionist Societies in Britain, 1825–1833, Fairmount Folio (Wichita State University)", url: "https://journals.wichita.edu/index.php/ff/article/view/149", quote: "The women's societies of Great Britain declared that this was not good enough."}
- card: wedgwood-medallion
  copy: female
  fact: "The society urged a boycott of slave-grown sugar"
  sources:
    - {title: "West Bromwich Local History Society: Lucy Townsend, abolitionist", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "They began a systematic promotion to boycott slave-grown sugar."}
    - {title: "Mimi Sheller, Bleeding Humanity and Gendered Embodiments, Humanity Journal (2014)", url: "https://humanityjournal.org/issue2-2/bleeding-humanity-and-gendered-embodiments-from-antislavery-sugar-boycotts-to-ethical-consumers/", quote: "abstinence from the use of slave cultivated sugar"}
- card: wedgwood-medallion
  copy: female
  fact: "In 1826 the society's first report showed the kneeling figure as a woman: 'Am I Not a Woman and a Sister?'"
  sources:
    - {title: "Yale Center for British Art: Fob seal, with motto \"Am I not a woman and a sister?\"", url: "https://collections.britishart.yale.edu/catalog/alma:99127018103408651", quote: "Its first known usage dates to 1826, when it appeared on the cover of the First report of the Ladies' Society"}
    - {title: "Mimi Sheller, Bleeding Humanity and Gendered Embodiments, Humanity Journal (2014)", url: "https://humanityjournal.org/issue2-2/bleeding-humanity-and-gendered-embodiments-from-antislavery-sugar-boycotts-to-ethical-consumers/", quote: "created a parallel version with a kneeling black woman in chains [...] Am I Not a Woman and a Sister"}
- card: wedgwood-medallion
  copy: female
  fact: "By 1833 there were over seventy women's anti-slavery societies in Britain"
  sources:
    - {title: "Anna Wood, The Writings of Ladies' Abolitionist Societies in Britain, 1825–1833, Fairmount Folio (Wichita State University)", url: "https://journals.wichita.edu/index.php/ff/article/view/149", quote: "Between 1825 and 1833, seventythree women's organizations were formed throughout the British Isles."}
    - {title: "West Bromwich Local History Society: Lucy Townsend, abolitionist", url: "https://www.westbromwichhistory.com/people-places/lucy-townsend-abolitionist/", quote: "Very soon there was a network of over seventy anti-slavery women's groups throughout the country."}
- card: wedgwood-medallion
  copy: both
  fact: "Parliament abolished the British slave trade in 1807"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "In 1807, the abolition of the slave trade finally took place, prohibiting the trade of enslaved people in the British Empire."}
    - {title: "The National Archives (UK): The 1833 Abolition of Slavery Act and compensation claims", url: "https://www.nationalarchives.gov.uk/explore-the-collection/explore-by-time-period/georgians/1833-abolition-of-slavery-act-and-compensation-claims/", quote: "1807 Abolition of the Slave Trade Act"}
- card: wedgwood-medallion
  copy: both
  fact: "An act freeing enslaved people in British colonies took effect in 1834"
  sources:
    - {title: "Victoria and Albert Museum: The Wedgwood anti-slavery medallion", url: "https://www.vam.ac.uk/articles/the-wedgwood-anti-slavery-medallion", quote: "It was not until 1834 that the emancipation of enslaved people occurred in British colonies"}
    - {title: "The National Archives (UK): The 1833 Abolition of Slavery Act and compensation claims", url: "https://www.nationalarchives.gov.uk/explore-the-collection/explore-by-time-period/georgians/1833-abolition-of-slavery-act-and-compensation-claims/", quote: "When the Act came into effect on 1 August 1834"}
- card: wedgwood-medallion
  copy: female
  fact: "The kneeling woman crossed the Atlantic and from the early 1830s headed the 'Ladies Department' of the Boston Liberator"
  sources:
    - {title: "Virginia Tech, Digital History Reader, Module 04", url: "https://dhr.history.vt.edu/modules/us/mod04_women/index.html", quote: "In the early 1830s, The Liberator, a radical abolitionist journal published in Boston [...] initiated a column called \"Ladies Department\""}
    - {title: "Ira V. Brown, \"Am I Not a Woman and a Sister?\", Pennsylvania History (1978)", url: "https://journals.psu.edu/phj/article/view/24363", quote: "began to include a \"Ladies' Department\" in the Liberator early in 1832. It was headed by a woodcut of the famous Wedgwood medallion depicting a female slave in chains"}
    - {title: "Mimi Sheller, Bleeding Humanity and Gendered Embodiments, Humanity Journal (2014)", url: "https://humanityjournal.org/issue2-2/bleeding-humanity-and-gendered-embodiments-from-antislavery-sugar-boycotts-to-ethical-consumers/", quote: "an image that was soon being reproduced in America"}
- card: wedgwood-medallion
  copy: female
  fact: "The image was drawn by white campaigners for white readers, and the kneeling figure threatened no one"
  sources:
    - {title: "Virginia Tech, Digital History Reader, Module 04", url: "https://dhr.history.vt.edu/modules/us/mod04_women/index.html", quote: "The black woman's kneeling, supplicant position perhaps aided her ability to gain the sympathy of white viewers: she did not threaten their status"}
    - {title: "Winterthur Museum: Re-presenting Black Womanhood, abolition", url: "https://stories.winterthur.org/re-presentingblackwomanhood-abolition", quote: "an image of a Black woman created by white activists primarily for white audiences"}
- card: wedgwood-medallion
  copy: female
  fact: "Calling an enslaved woman a sister was radical for white American women and led many to claim rights of their own"
  sources:
    - {title: "Virginia Tech, Digital History Reader, Module 04", url: "https://dhr.history.vt.edu/modules/us/mod04_women/index.html", quote: "viewing enslaved black women as \"sisters\" and \"women\" would have been unconventional, if not radical, for white women in the 1830s"}
    - {title: "Ira V. Brown, \"Am I Not a Woman and a Sister?\", Pennsylvania History (1978)", url: "https://journals.psu.edu/phj/article/view/24363", quote: "The political experience women gained through participation in this crusade [...] served as important roots of American feminism."}
- card: wedgwood-medallion
  copy: male
  fact: "The Brookes print, a plan of captives packed into a slave ship's hull, was a partner of the medallion in the campaign"
  sources:
    - {title: "Royal Museums Greenwich: Plan and Sections of a Slave Ship [the 'Brooks' sometimes 'Brookes']", url: "https://www.rmg.co.uk/collections/objects/rmgc-object-254967", quote: "It just shows a single plan image of slaves packed into a hull"}
    - {title: "Understanding Slavery Initiative: Description of a slave ship, about 1788", url: "https://understandingslavery.com/artefact/description-of-a-slave-ship-about-1788/", quote: "Over 7000 posters of the plan were printed and distributed to promote the abolition campaign."}
