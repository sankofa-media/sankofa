# Ledger for expansion batch c07: one entry per fact used in card bodies and wow lines,
# each with two independent sources and a verbatim quote.
- card: kriolu
  fact: "Kriolu is the creole of Cape Verde, forged from Portuguese and African languages"
  sources:
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "Le créole est une langue véhiculaire forgée à partir du portugais et de différentes langues d'Afrique."}
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "almost all speak as their first language a Portuguese-based creole, which varies from island to island"}
- card: kriolu
  fact: "It is one of the oldest creole languages still spoken (also wow)"
  sources:
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "C'est l'un des plus vieux créoles parlés dans le monde."}
    - {title: "Britannica: Cabo Verde (archived November 2026)", url: "http://web.archive.org/web/20261101220245/https://www.britannica.com/place/Cabo-Verde", quote: "Crioulo, one of the oldest of the Portuguese creole languages, is by far the most widely spoken language in the country"}
- card: kriolu
  fact: "Almost every Cape Verdean speaks it as a first language (also wow); it varies from island to island"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "the local inhabitants – nearly half a million people – almost all speak as their first language a Portuguese-based creole, which varies from island to island"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "La proportion de la population qui utilise le créole capverdien comme langue maternelle s'élève à plus de 99 %"}
- card: kriolu
  fact: "Portuguese remains the only official language; everyday life is lived in Kriolu"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "Although Portuguese is still the only official language of Cape Verde"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "toutes les situations informelles de la communications, tant dans la classe instruite que dans la population en général, ne se déroulent qu'en créole capverdien"}
- card: kriolu
  fact: "Archipelago in the Atlantic off the coast of Senegal"
  sources:
    - {title: "Britannica: Cabo Verde (archived November 2026)", url: "http://web.archive.org/web/20261101220245/https://www.britannica.com/place/Cabo-Verde", quote: "The small island country is located about 385 miles (620 km) off the coast of Senegal in western Africa"}
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "The archipelago of Cape Verde is situated approximately 500 km to the west of Dakar (Senegal) in the Atlantic Ocean"}
- card: kriolu
  fact: "Santiago is the largest island; the first Portuguese settlers arrived there in the 1460s (also wow)"
  sources:
    - {title: "Britannica: Cabo Verde (archived November 2026)", url: "http://web.archive.org/web/20261101220245/https://www.britannica.com/place/Cabo-Verde", quote: "with the first settlers from Portugal arriving on the largest island, Santiago , in the 1460s"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "C'est en 1460 que le navigateur Diogo Gomes prit possession de l'archipel au nom du Portugal"}
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "Santiago in the Leeward group (Sotavento) is the most important by surface (991 sq km), population (some 250,000 people), and history (from the discovery around the year 1460 onwards)"}
- card: kriolu
  fact: "Ribeira Grande, now Cidade Velha, on Santiago became the capital"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "Both the old capital (Cidade Velha, previously known as Ribeira Grande) and the new capital (Praia) are located on Santiago"}
    - {title: "UNESCO World Heritage Centre: Cidade Velha, Historic Centre of Ribeira Grande (archived 2026)", url: "http://web.archive.org/web/20261109073934/https://whc.unesco.org/en/list/1310/", quote: "The town of Ribeira Grande, renamed Cidade Velha in the late 18th century, was the first European colonial outpost in the tropics. Located in the south of the island of Santiago"}
- card: kriolu
  fact: "Colonists traded on the African coast for captives; most enslaved Africans brought to Santiago were sold on to Europe and the Americas"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "the colonists traded along the coast, exchanging the cloth and the horses for African goods and slaves. Only a minority of the slaves brought to Santiago and Fogo remained there, as the majority were resold to Portuguese, Spanish, and Italian merchants who dispatched them to the European and American markets"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "Puis il devint un important centre de la traite des Noirs vers l'Amérique, car le commerce des esclaves dAfrique occidentale vers le Nouveau Monde transitait surtout par le Cap-Vert"}
- card: kriolu
  fact: "The creole grew from the meeting of Portuguese settlers and enslaved Africans in the early colony"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "Santiago Creole certainly arose during this first period of the island's history"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "les descendants des anciens esclaves africains et des colonisateurs européens"}
- card: kriolu
  fact: "ALUPEC adopted on a trial basis in 1998 and confirmed as the official alphabet in 2009"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "In 1998, an official orthography ( Alfabeto unificado para a escrita do Cabo-Verdiano, ALUPEC ) was adopted, on experimental terms, for a period of five years. It has recently been confirmed as the only officially recognized writing system"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "Dix ans plus tard, le Décret-loi no 8/ 2009 instituant l'ALUPEC comme alphabet capverdien rendait cet alphabet officiel"}
- card: kriolu
  fact: "More Cape Verdeans live abroad than at home, many in New England, and carry the language with them"
  sources:
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "Those who have emigrated and their descendants (at least half of the Cape Verdeans)"}
    - {title: "Jacques Leclerc, Cap-Vert, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/Cap-Vert.htm", quote: "plus de 700 000 Capverdiens vivent aujourd'hui à l'étranger, surtout aux États-Unis (250 000)"}
    - {title: "Jürgen Lang, Cape Verdean Creole of Santiago, APiCS Online, survey 30", url: "https://apics-online.info/surveys/30", quote: "diaspora communities in São Tomé and Príncipe, the USA (New England Coast, Boston)"}
- card: papiamento
  fact: "Papiamento is the creole of Aruba, Bonaire and Curaçao"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "Location: Aruba, Bonaire, Curaçao (former leeward islands of the Netherlands Antilles"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "le papiamento demeure la principale langue parlée dans trois îles différentes, avec deux écritures différentes"}
- card: papiamento
  fact: "Its words come mostly from Portuguese and Spanish, with a later Dutch layer"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "Major lexifiers: (Afro)Portuguese, Spanish, Dutch"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "Puis des missionnaires portugais et espagnols, des marchands hollandais, des commerçants sud-américains et des Amérindiens ajoutèrent de nombreux mots complémentaires au papiamento"}
- card: papiamento
  fact: "The Dutch took the islands in the 1630s"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "The Dutch seized the ABC islands in 1634 (Curaçao) and 1636 (Aruba and Bonaire)"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "En 1636, après une guerre de quatre-vingts ans avec l'Espagne, la Hollande s'empara d'Aruba"}
- card: papiamento
  fact: "Curaçao became a depot for enslaved Africans, mostly sold on to nearby Spanish colonies; the language formed among the enslaved"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "from 1648 onwards, Curaçao became an important depot for African slaves which were predominantly sold to the nearby Spanish colonies"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "des esclaves furent amenés sur Curaçao et ceux-ci développèrent le créole papiamento afin de pouvoir communiquer entre eux et avec leurs propriétaires"}
- card: papiamento
  fact: "Its origin is disputed: Portuguese creoles of West Africa versus a Spanish base"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "The origin of Papiamentu is a highly controversial issue... the main issue being whether the Ibero-Romance part is of European or African origin"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "Des chercheurs de Curaçao ont prétendu que le papiamento provenait d'un créole portugais d'Afrique ( papiamento ), mais ceux d'Aruba ont plutôt cru qu'il venait d'un créole à base d'espagnol"}
- card: papiamento
  fact: "Aruba spells by origin (cinco), Curaçao and Bonaire by sound (sinku) (also wow)"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "The Aruban spelling system, etymologically based... ( sin 'without' vs. cinco 'five'; in Curaçaoan Papiamentu , both are written <s>: sin , sinku )"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "Aruba impose une orthographe étymologique, alors que Curaçao et Bonaire ont choisi une orthographe phonétique"}
- card: papiamento
  fact: "The name is Papiamento on Aruba, Papiamentu on Curaçao and Bonaire"
  sources:
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "Autoglossonym: Papiamentu (Curaçao and Bonaire), Papiamento (Aruba)"}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "Aruba parle le papiamento , mais Curaçao et Bonaire parlent le papiamentu"}
- card: papiamento
  fact: "In 2003 Aruba made Papiamento official beside Dutch (also wow)"
  sources:
    - {title: "Aruba, Landsverordening officiële talen (2003), text reproduced by CEFAN, Université Laval", url: "https://axl.cefan.ulaval.ca/amsudant/aruba-loi-off-2003.htm", quote: "De officiële talen van Aruba zijn het Papiamento en het Nederlands."}
    - {title: "Jacques Leclerc, Aruba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/aruba.htm", quote: "Depuis le 19 mars 2003, le papiamento a aussi été déclaré une langue officielle avec le néerlandais."}
- card: papiamento
  fact: "In 2007 the Netherlands Antilles made Papiamentu official with Dutch and English (also wow)"
  sources:
    - {title: "Netherlands Antilles, Landsverordening officiële talen of 28 March 2007, Overheid.nl", url: "https://lokaleregelgeving.overheid.nl/CVDR10499", quote: "LANDSVERORDENING van de 28ste maart 2007 ... Artikel 2 De officiële talen zijn het Engels, het Nederlands en het Papiamentu."}
    - {title: "Philippe Maurer, Papiamentu, APiCS Online, survey 47", url: "https://apics-online.info/surveys/47", quote: "In 2007, Papiamentu was declared an official language of the Netherlands Antilles."}
- card: haitian-creole
  fact: "Every Haitian speaks Kreyòl; only a small minority speaks French"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "Whereas all Haitians can speak Creole, only a minority of the population (about 7% according to the most careful estimates) actually speak French."}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "Aujourd'hui, on estime que presque 400 000 personnes (environ 5 %) parlent le français"}
- card: haitian-creole
  fact: "Most of its words come from French"
  sources:
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "sa base lexicale provient en grande partie du vocabulaire français, bien que sa grammaire soit restée globalement d'origine africaine"}
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "Major lexifier: French"}
- card: haitian-creole
  fact: "It grew in Saint-Domingue, the French plantation colony, among enslaved Africans"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "It has been calculated that a total of 800,000 African slaves were brought into Saint-Domingue during the 18th century"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "La quasi-totalité des Haïtiens, soit 95 %, descendent des esclaves noirs"}
- card: haitian-creole
  fact: "Revolutionary proclamations announcing abolition are among its earliest important texts; the 1793 decree was translated into Kreyòl (also wow)"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "The earliest known documents of importance for Haitian Creole are, on the one hand, the “revolutionary proclamations” (texts that announce the abolition of slavery)"}
    - {title: "Nick Nesbitt, Sonthonax's Proclamation, Island Luminous, Florida International University", url: "https://islandluminous.fiu.edu/part02-slide03.html", quote: "The declaration was itself translated in Kreyòl and posted across the island."}
- card: haitian-creole
  fact: "On 29 August 1793 Sonthonax freed the enslaved of the North"
  sources:
    - {title: "Nick Nesbitt, Sonthonax's Proclamation, Island Luminous, Florida International University", url: "https://islandluminous.fiu.edu/part02-slide03.html", quote: "Finally, on August 29, 1793, Sonthonax decided that nothing short of an immediate, general ... emancipation would rally the blacks to the French republican cause"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "le commissaire Santhonax, proclama la liberté des esclaves le 29 août 1793 dans la Province du Nord"}
- card: haitian-creole
  fact: "Independence on 1 January 1804"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "two years before Haiti's independence (January 1st, 1804)"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "L'indépendance de la colonie de Saint-Domingue fut proclamée le 1 er janvier 1804"}
- card: haitian-creole
  fact: "The 1918 constitution made French the official language"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "French, the historical official language (since 1918)"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "en 1918, les Haïtiens adoptèrent une nouvelle constitution précisant formellement pour la première fois que le français était la langue officielle du pays"}
- card: haitian-creole
  fact: "Kreyòl entered schools in 1979 by law"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "Education, which had for a long time been confined to French, opened up to Creole in 1979"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "Loi autorisant l'usage du créole dans les écoles comme langue d'enseignement et objet d'enseignement (1979)"}
- card: haitian-creole
  fact: "The 1987 constitution: all Haitians united by Creole; Creole and French official (also wow)"
  sources:
    - {title: "Constitution of Haiti 1987 (rev. 2012), Constitute Project", url: "https://www.constituteproject.org/constitution/Haiti_2012", quote: "Article 5 All Haitians are united by a common language: Creole. Creole and French are the official languages of the Republic."}
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "The Haitian Constitution from 1987 stipulates in Article 5 that “All Haitians are unified by a common language: Creole”. It designates Creole as the official language next to French"}
- card: haitian-creole
  fact: "The 1987 constitution called for an academy for Creole"
  sources:
    - {title: "Constitution of Haiti 1987 (rev. 2012), Constitute Project", url: "https://www.constituteproject.org/constitution/Haiti_2012", quote: "Article 213 A Haitian Academy shall be established to standardize the Creole language"}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "L'article 213 de la Constitution haïtienne de 1987 a prévu une Académie haïtienne afin de normaliser la langue créole"}
- card: haitian-creole
  fact: "Most official texts are still in French"
  sources:
    - {title: "Dominique Fattier, Haitian Creole, APiCS Online, survey 49", url: "https://apics-online.info/surveys/49", quote: "However, the majority of official administrative texts are in French, with only a few bilingual exceptions."}
    - {title: "Jacques Leclerc, Haïti, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/haiti.htm", quote: "Les textes de lois sont presque tous rédigés et promulgués exclusivement en français"}
- card: arabic-afrikaans
  fact: "Arabic Afrikaans is Afrikaans written in Arabic script, used by Cape Muslims for religious teaching in the 19th century"
  sources:
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "Arabic Afrikaans, which represents the written form of Cape Muslim Afrikaans as used in the relevant period"}
    - {title: "Suleman Essop Dangor, Arabic-Afrikaans Literature at the Cape, Tydskrif vir Letterkunde 45:1 (2008), abstract", url: "https://letterkunde.africa/article/view/4483", quote: "This article traces the development of this genre of literature which came to be known as Arabic-Afrikaans ... highlights the daunting challenge of transcribing Afrikaans phonetically in the Arabic script"}
- card: arabic-afrikaans
  fact: "Writers adapted Arabic letters and vowel marks to Afrikaans sounds absent from Arabic"
  sources:
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "so as to make provision for those sounds (especially vowels) not found in Arabic. This was then the system adopted (and further modified) by the first writers of Arabic Afrikaans at the Cape"}
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "Davids discusses the widespread combination of two vowel diacritics in the texts: the fatha (indicating [æ] in Arabic) and the kasra (indicating [i])"}
- card: arabic-afrikaans
  fact: "The Cape Muslim community grew largely from enslaved people and exiles from Southeast Asia"
  sources:
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "the literacy of the slaves from various regions in the Southeast Asian archipelago (many of these spoke or were proficient in Malayu"}
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "How was it shaped by successive generations of slaves and exiles from Indonesia"}
- card: arabic-afrikaans
  fact: "Tuan Guru, banished to the Cape in 1780, opened a madrasah at the end of the 18th century and taught in Malay"
  sources:
    - {title: "Suleman Essop Dangor, Arabic-Afrikaans Literature at the Cape, Tydskrif vir Letterkunde 45:1 (2008), abstract", url: "https://letterkunde.africa/article/view/4483", quote: "Tuan Guru – the first official imam at the Cape – used Malayu as the medium of instruction in the Dorp Street madrasah (Muslim religious school) which he established at the end of the 18th century."}
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "Tuan Guru, who was banished to the Cape in 1780"}
- card: arabic-afrikaans
  fact: "By the mid-19th century Cape Dutch (early Afrikaans) replaced Malay as the language of instruction"
  sources:
    - {title: "Suleman Essop Dangor, Arabic-Afrikaans Literature at the Cape, Tydskrif vir Letterkunde 45:1 (2008), abstract", url: "https://letterkunde.africa/article/view/4483", quote: "This changed in the middle of the 19th century when Cape Dutch was adopted as the language of instruction."}
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "By the 1840s, Cape Dutch, the precursor of Afrikaans ... took over as the language of Cape Town mosques"}
- card: arabic-afrikaans
  fact: "Pupils copied lessons into notebooks in Afrikaans in Arabic script"
  sources:
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "around the mid-1840s, learners in religious schools started writing their lessons in Afrikaans using Arabic script in their madrasah note books or “koplesboeke”"}
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "a Jawi ‘koplesboek’ (notebooks into which students copied lessons, which had to be memorised, in rote-learning fashion)"}
- card: arabic-afrikaans
  fact: "Abu Bakr Effendi, an Ottoman scholar, arrived in 1862, learned Afrikaans and wrote Bayan al-Din"
  sources:
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "the arrival in the Cape in 1862 of the Muslim scholar from the Ottoman Empire, Shaykh Abu Bakr Effendi al Amjadi. He learned Afrikaans and by 1869 had produced the first manuscript of Bayan ud-Din"}
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "Abubakr Effendi, who learned both Afrikaans and English at the Cape"}
- card: arabic-afrikaans
  fact: "Its pages first circulated by hand; it was printed in Constantinople in 1877 (also wow)"
  sources:
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "The content of the book was firstly distributed as loose handwritten pages and subsequently printed in Constantinople in 1877."}
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "It was then printed in Constantinople, what is now Istanbul, Türkiye."}
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "Bayān al-Dīn (“Exposition of the Faith”, 1877)"}
- card: arabic-afrikaans
  fact: "It is the earliest surviving Arabic Afrikaans book; one of the earliest Afrikaans books (also wow)"
  sources:
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "the Bayaan al-Diin, the earliest extant Arabic Afrikaans text (published in 1877)"}
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "“That became the first published Afrikaans text,” Willemse tells me."}
- card: arabic-afrikaans
  fact: "From 1898 religious texts appeared in Latin (Roman) script"
  sources:
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "From the late 1890s onwards: publication of religious texts in Roman script. This period began in 1898"}
    - {title: "Ernst Kotzé, Arabic Afrikaans: early standardisation of Afrikaans orthography, Southern African Linguistics and Applied Language Studies 30:3 (2012)", url: "https://sahistory.org.za/sites/default/files/archive_files/Arabic%20Afrikaans%20%E2%80%93%20early%20standardisation%20of%20Afrikaans%20orthography%20by%20AchmatDavids.pdf", quote: "the romanisation of the religious texts, which started in 1898"}
- card: arabic-afrikaans
  fact: "The tradition undoes the apartheid-era myth that Afrikaans was a white language only"
  sources:
    - {title: "Charles Leonard, The Islamic roots of Afrikaans, Mail & Guardian (27 March 2024)", url: "https://mg.co.za/friday/2024-03-27-the-islamic-roots-of-afrikaans", quote: "This path-breaking work put lie to the myth created under apartheid by Afrikaner nationalists that Afrikaans was a white language only."}
    - {title: "Ana Deumert, Pioneering study of the multilingual ecology of the Cape (review), Historia 57:2", url: "https://upjournals.up.ac.za/index.php/historia/article/download/1140/1036/4367", quote: "That the history of Afrikaans is “essentially the story of communication between black and white in the early history of the country” (p 259), is no longer doubted by any serious linguist"}
- card: krio
  fact: "Krio is the English-based creole of Sierra Leone"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "Krio is an English-lexifier creole that is used as a lingua franca in Sierra Leone"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "À base lexicale anglaise, le krio sierra-léonais"}
- card: krio
  fact: "About one in ten speak it as a mother tongue; most of the country uses it as a lingua franca"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "the native language of a small percentage of the population of Sierra Leone, estimated at somewhere between 5–10% ... over 4 million people probably use it, non-natively, as lingua franca"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "Parlé par au moins 10 % de la population en tant que langue maternelle, le krio est également utilisé comme langue véhiculaire par une majorité des habitants du pays"}
- card: krio
  fact: "English is the official language and the language of prestige"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "English, as the official language and medium of instruction in academic institutions, continues to hold the status of the language of prestige"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "L' anglais est la langue officielle de facto"}
- card: krio
  fact: "In 1787 the British founded a settlement on the Freetown peninsula for Black people from the Americas, the first arriving from England (also wow)"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "The original settlers (The Black Poor) arrived in the Sierra Leone peninsula from England in 1787."}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "En 1787, les Britanniques s'emparèrent du site de Freetown et établirent une colonie destinée à accueillir des esclaves qu'ils avaient recrutés dans leurs colonies américaines"}
- card: krio
  fact: "They were joined by formerly enslaved people from Nova Scotia and by settlers from Jamaica (also wow)"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "the Nova Scotians (freed slaves relocated in Nova Scotia, Canada) ... and the Jamaican Maroon settlers"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "l'apport, en 1792, des anciens esclaves réfugiés en Nouvelle-Écosse (Canada)"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "une ancienne colonie britannique fondée en 1787 pour y accueillir d'anciens esclaves venus des États-Unis et des Antilles"}
- card: krio
  fact: "Then came Africans freed from slave ships after Britain outlawed the trade, many from Yoruba- and Igbo-speaking lands (also wow)"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "the Liberated Africans (or Recaptives) – were mainly recaptured would-be slaves from slave ships intercepted by the British fleet ... most of them originated from regions where Yoruba, Igbo, Akan, and Gbe were the predominant languages"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "ou sauvés de la traite négrière après son interdiction"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "les Noirs venaient en 1848 du Bénin dans une proportion de 63,7% (ethnies fon et yoruba) et du Biafra dans une proportion de 20,2% (ethnies ibo et haoussa)"}
- card: krio
  fact: "Most words are English, Yoruba left a deep mark, and Jamaican creole influenced it"
  sources:
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "Lexical items of English origin account for about 80% of the vocabulary of Krio ... particularly Yoruba, which is second only to English as the largest contributor to Krio vocabulary"}
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "le krio sierra-léonais a été influencé à l'origine par le yorouba et le wolof, puis par le créole de la Jamaïque"}
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "Creole languages from the West Indies, particularly the variety brought by the Jamaican Maroon settlers, are proposed ( Huber 1999 ) to have had significant input"}
- card: krio
  fact: "In 1980 Fyle and Jones published a Krio–English dictionary, the standard for Krio spelling"
  sources:
    - {title: "Jacques Leclerc, Sierra Leone, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/afrique/sierra_leone.htm", quote: "Il existe un dictionnaire du krio (1980, Fyle et Jones) qui est reconnu comme la norme de l'orthographe krio."}
    - {title: "Malcolm Awadajin Finney, Krio, APiCS Online, survey 15", url: "https://apics-online.info/surveys/15", quote: "Fyle, Clifford & Eldred Jones. 1980. A Krio-English dictionary . Oxford University Press."}
- card: jamaican-patois
