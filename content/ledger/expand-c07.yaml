  sources:
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "Le lucumi n'est pas une langue maternelle, mais uniquement une langue rituelle"}
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "“superimposed bilingualism, because it is learned in the context of religious instruction and is not the native language of any of the speakers”"}
- card: lucumi
  fact: "It lives in prayers to the orishas and songs accompanying music and dance"
  sources:
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "Each priest is dedicated to a particular oricha and learns all of the rituals, prayers, songs and practices associated with that Oricha."}
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "Ce sont des rituels liturgiques accompagnés de chants, de musique et de danses."}
- card: lucumi
  fact: "Orishas are Yoruba deities"
  sources:
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "An oricha is a traditional Yoruba deity"}
    - {title: "Britannica: Lydia Cabrera (archived September 2025)", url: "http://web.archive.org/web/20250930135909/https://www.britannica.com/biography/Lydia-Cabrera", quote: "Santería's merging of Yoruban deities with Roman Catholic saints"}
- card: lucumi
  fact: "It came to Cuba with enslaved Yoruba speakers"
  sources:
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "after the introduction of large numbers of Yoruba speakers into Cuba during the trans-Atlantic slave trade"}
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "les cultes introduits par les esclaves africains"}
- card: lucumi
  fact: "In Cuba the faith absorbed Catholic elements"
  sources:
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "les cultes introduits par les esclaves africains et imprégnés de religion catholique, à l'image de la religion santería"}
    - {title: "Britannica: Lydia Cabrera (archived September 2025)", url: "http://web.archive.org/web/20250930135909/https://www.britannica.com/biography/Lydia-Cabrera", quote: "Santería's merging of Yoruban deities with Roman Catholic saints"}
- card: lucumi
  fact: "In 1957 Lydia Cabrera published in Havana Anagó: vocabulario lucumí, 'the Yoruba spoken in Cuba'"
  sources:
    - {title: "Glottolog reference record: Cabrera, Lydia. 1957. Anagó: vocabulario lucumi, el Yoruba que se habla en Cuba", url: "https://glottolog.org/resource/reference/id/149317", quote: "Cabrera, Lydia. 1957. Anagó: vocabulario lucumi, el Yoruba que se habla en Cuba. (Colección del Chiherekú.) La Habana (Cuba)"}
    - {title: "Britannica: Lydia Cabrera (archived September 2025)", url: "http://web.archive.org/web/20250930135909/https://www.britannica.com/biography/Lydia-Cabrera", quote: "Cabrera's Anagó: vocabulario lucumí (1957; “Anagó: Lucumí Vocabulary”) studies the Lucumí language"}
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "Cabrera's Anagó Vocabulario Lucumí: El Yoruba que se habla en Cuba ... published its first and only dictionary"}
- card: lucumi
  fact: "The same Yoruba tradition is practised in Brazil, where Candomblé likewise keeps a ritual language"
  sources:
    - {title: "Maria Concordia, The Anagó language of Cuba (MA thesis, Florida International University, 2012)", url: "https://digitalcommons.fiu.edu/record/14450/files/Concordia_Maria.docx", quote: "Its main centers of worship are Cuba, Venezuela, Brazil, United States"}
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "Ce genre de phénomène s'est également déroulé en Haïti avec le vaudou et au Brésil avec le candomblé."}
- card: osmanya
  fact: "Somali knowledge, poetry and history were long passed on orally; Somali was not officially written before the 1970s"
  sources:
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "In the absence of a transcription system, knowledge, literature, history, etc. were transmitted orally from generation to generation"}
    - {title: "Britannica: Somali language (archived November 2026)", url: "http://web.archive.org/web/20261106044503/https://www.britannica.com/topic/Somali-language", quote: "1973 and 1974, which made Somali a written language (in Latin characters) for the first time"}
- card: osmanya
  fact: "Religious scholars wrote Somali in Arabic letters, others tried Latin"
  sources:
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "D'abord, ce sont les oulémas qui ont commencé à écrire le somali en caractères arabes. Ensuite, les lettrés ayant fréquenté les bancs des écoles de l'administration coloniale l'ont transcrit en caractères latins."}
    - {title: "The Unicode Standard 17.0, chapter 19: Africa", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "It replaced an attempt by Sheikh Uweys of the Confraternity Qadiriyyah (died 1909) to devise an Arabic-based orthography for Somali. It has, in turn, been replaced by the Latin orthography"}
- card: osmanya
  fact: "Osmanya is an original script made for Somali"
  sources:
    - {title: "The Unicode Standard 17.0, chapter 19: Africa", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "They are all original creative contributions intended specifically to serve the linguistic communities that use them. Osmanya is an alphabetic script developed in the early 20th century to write the Somali language."}
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "fût le premier à inventer un système d'écriture proprement somali avec un alphabet original"}
- card: osmanya
  fact: "Cismaan Yuusuf Keenadiid, a Somali man of letters, devised it around 1920 (also wow)"
  sources:
    - {title: "The Unicode Standard 17.0, chapter 19: Africa", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "was devised in 1920–1922 by ... (Cismaan Yuusuf Keenadiid) to represent the Somali language"}
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "autour des années 1920 ... Un homme de Lettres au nom de Cismaan Yuusuf Keenadiid"}
    - {title: "Michael Everson, interview with SomaliNet on encoding Osmanya (c. 2002)", url: "https://www.evertype.com/misc/osmanya-interview.html", quote: "Osmanya and its inventor Osman Yusuf Kenadid"}
- card: osmanya
  fact: "After independence the script choice deadlocked among Latin, Arabic and Osmanya supporters; commissions studied it for years without decision (also wow)"
  sources:
    - {title: "B. W. Andrzejewski (communicated), Somalia Introduces a National Orthography, Africa 43:1 (1973), Notes and News", url: "https://doi.org/10.1017/S0001972000073265", quote: "The delay in taking the decision as to the choice of a script (Latin, Arabic, or the invented Somali script called Osmania) was caused by the intransigent attitudes of the supporters of each of the competing systems of writing"}
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "l'absence d'une écriture pour le somali est dû en grande partie au fait des vues inconciliables des différentes visions mais en aucun cas à cause d'un manque d'efforts (Rapport de la commission de 1965"}
- card: osmanya
  fact: "After the 1969 coup the military government made resolving the script question a priority"
  sources:
    - {title: "The Unicode Standard 17.0, chapter 19: Africa", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "in 1969 there was a coup, with one of its stated aims being the resolution of the debate over the country's writing system"}
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "C'est dans cette impasse ... que le pays connaîtra en 1969 un tournant dans son histoire. Le 21 octobre de cette même année, des officiers de l'armée dirigé par Siad Barre s'emparent du pouvoir"}
- card: osmanya
  fact: "On 21 October 1972 the government announced a Latin-script national orthography and made Somali the official language (also wow)"
  sources:
    - {title: "B. W. Andrzejewski (communicated), Somalia Introduces a National Orthography, Africa 43:1 (1973), Notes and News", url: "https://doi.org/10.1017/S0001972000073265", quote: "ON 21 October 1972, the third anniversary of the Revolution, Somalia introduced a national orthography in Latin script and made Somali the official language of the state."}
    - {title: "Moubarak Ahmed Mohamoud, Le parcours du somali (Science et Environnement 38, Djibouti)", url: "https://scienceetenvironnement.dj/documents/revue38/Revue%20SE%2038%20-%20le%20parcours%20du%20somali.pdf", quote: "La décision finale a été rendu publique par le gouvernement révolutionnaire le 21 octobre 1972. Il a simultanément hissé le somali au rang de langue officielle et adopté une orthographe basée sur le latin"}
- card: osmanya
  fact: "A mass literacy campaign followed in 1973"
  sources:
    - {title: "B. W. Andrzejewski (communicated), Somalia Introduces a National Orthography, Africa 43:1 (1973), Notes and News", url: "https://doi.org/10.1017/S0001972000073265", quote: "A mass literacy campaign was begun in April 1973"}
    - {title: "Britannica: Somali language (archived November 2026)", url: "http://web.archive.org/web/20261106044503/https://www.britannica.com/topic/Somali-language", quote: "1973 and 1974, which made Somali a written language (in Latin characters) for the first time"}
- card: osmanya
  fact: "Osmanya was encoded in Unicode 4.0 in 2003"
  sources:
    - {title: "Unicode 4.0.0 (2003): new scripts", url: "https://www.unicode.org/versions/Unicode4.0.0/", quote: "more minority scripts, including Limbu, Tai Le, Osmanya, and Philippine scripts ... The Unicode Standard, Version 4.0 (Boston, MA, Addison-Wesley, 2003"}
    - {title: "Michael Everson, interview with SomaliNet on encoding Osmanya (c. 2002)", url: "https://www.evertype.com/misc/osmanya-interview.html", quote: "Osmanya has been accepted for encoding in Plane 1 of the Unicode Standard, and is out for ballot in JTC1/SC2. That ballot will close in November 2002, and the amendment will be published some time the following year."}
- card: medefaidrin
  fact: "Medefaidrin is a language with its own script used by the Oberi Okaime, an independent Ibibio church near Itu on the Cross River (also wow)"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "an artificial language Medefaidrin used by members of an indigenous Christian church Oberi Okaime ... active in the Nigerian province of Calabar in the 1930s near Itu on the Western bank of Cross-River"}
    - {title: "Monday B. Abasiattai, The Oberi Okaime Christian Mission, Africa 59:4 (1989), extract", url: "https://www.cambridge.org/core/journals/africa/article/oberi-okaime-christian-mission-towards-a-history-of-an-ibibio-independent-church/3A8A4C95C1A8C596F371882BB8335EAB", quote: "The Oberi Okaime Christian Mission has for long attracted the attention of scholars because of the way it developed a special script and even a language of its own."}
- card: medefaidrin
  fact: "Members speak Ibibio in daily life"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "A natural language for them is Ibibio-Efik"}
    - {title: "Atlas of Endangered Alphabets: Medefaidrin (archived June 2026)", url: "http://web.archive.org/web/20260607012610/https://www.endangeredalphabets.net/alphabets/medefaidrin/", quote: "Ibibio – the native language of the Ibibio people of the state"}
- card: medefaidrin
  fact: "Its numbers run in twenties, following Ibibio counting (also wow)"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "In Medefaidrin, a vigesimal (base-20) number system is used, so it requires 20 digits"}
    - {title: "Udok, Umoren and Ubon, The appeal of ethnocentric Christianity: the Oberi Okaime Christian Mission in Ibibioland (2025)", url: "https://zenodo.org/records/16879495", quote: "The OberiOkaime numerical system was based largely on the Ibibio counting system. Following the Ibibio numerical system, which was “a vigesimal system of counting” (in the twenties). 40 was two 20's ... 100 was five 20's."}
- card: medefaidrin
  fact: "The church grew out of the Spirit Movement of 1927, when the Holy Spirit was said to descend on people in their homes"
  sources:
    - {title: "Udok, Umoren and Ubon, The appeal of ethnocentric Christianity: the Oberi Okaime Christian Mission in Ibibioland (2025)", url: "https://zenodo.org/records/16879495", quote: "It was in the year 1927 that we received the Holy Spirit. It descended to us in our homes"}
    - {title: "Monday B. Abasiattai, The Oberi Okaime Christian Mission, Africa 59:4 (1989), extract", url: "https://www.cambridge.org/core/journals/africa/article/oberi-okaime-christian-mission-towards-a-history-of-an-ibibio-independent-church/3A8A4C95C1A8C596F371882BB8335EAB", quote: "En 1927, un mouvement charismatique a balayé l'ensemble de la région ibibio du nord-est"}
- card: medefaidrin
  fact: "By community tradition the language was revealed to Michael Ukpong and written down by the secretary Akpan Udofia (also wow)"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "revealed to one of the founders of the community in 1927 by divine inspiration: \"[...] Bishop Aikeld Ukpong (alias Michael Ukpong) ... it fell on the Secretary of the group, Prophet Jakeld Udofia to transcribe the spiritual writings"}
    - {title: "Udok, Umoren and Ubon, The appeal of ethnocentric Christianity: the Oberi Okaime Christian Mission in Ibibioland (2025)", url: "https://zenodo.org/records/16879495", quote: "Michael Ukpong (S. M. Aikeld Abony) and Akpan Akpan Udofia (T. M. Jakeld Abony) ... Ukpong received the language from Seminant while Udofia wrote it down."}
- card: medefaidrin
  fact: "Other accounts date the revelation to the 1930s, when the two men spent years in seclusion perfecting the language and script"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "the actual date the Holy Spirit descended was 1927, but the language was revealed or impacted in 1932"}
    - {title: "Udok, Umoren and Ubon, The appeal of ethnocentric Christianity: the Oberi Okaime Christian Mission in Ibibioland (2025)", url: "https://zenodo.org/records/16879495", quote: "went into seclusion at Ikpa, Ibiono Ibom for four years and four months – Starting probably from 1933, in order to perfect the “spirit language” and writing"}
- card: medefaidrin
  fact: "Oberi Okaime means 'the church freely given'"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "Oberi Okaime (Obɛri Ɔkaimɛ, ‘Church freely given’)"}
    - {title: "Udok, Umoren and Ubon, The appeal of ethnocentric Christianity: the Oberi Okaime Christian Mission in Ibibioland (2025)", url: "https://zenodo.org/records/16879495", quote: "OberiOkaime (Ono Ke Mfon) ... meaning “Freely given Church”"}
- card: medefaidrin
  fact: "The language fell out of use but by 1986 was taught again and interest revived"
  sources:
    - {title: "Atlas of Endangered Alphabets: Medefaidrin (archived June 2026)", url: "http://web.archive.org/web/20260607012610/https://www.endangeredalphabets.net/alphabets/medefaidrin/", quote: "The language faded from use, but in 1986, Udofia began teaching it again in the church's Sunday school in Ididep."}
    - {title: "Monday B. Abasiattai, The Oberi Okaime Christian Mission, Africa 59:4 (1989), extract", url: "https://www.cambridge.org/core/journals/africa/article/oberi-okaime-christian-mission-towards-a-history-of-an-ibibio-independent-church/3A8A4C95C1A8C596F371882BB8335EAB", quote: "Today there is again a revival of interest in both the script and the language, and specimens of both as used in 1986 are included below"}
- card: medefaidrin
  fact: "Today it is used for Sunday school lessons and prayers, with very few fluent speakers"
  sources:
    - {title: "Rovenchak, Gibbon, Ekpenyong and Urua, Proposal for encoding the Medefaidrin (Oberi Okaime) script, Unicode L2/15-298 (2015)", url: "https://www.unicode.org/L2/L2015/15298-medefaidrin.pdf", quote: "The Medefaidrin language is used in teaching the Sunday School lessons, it is critically threatened and mainly used for saying prayers or meditation of the scriptures. Currently there are less than 20 adult speakers"}
    - {title: "Atlas of Endangered Alphabets: Medefaidrin (archived June 2026)", url: "http://web.archive.org/web/20260607012610/https://www.endangeredalphabets.net/alphabets/medefaidrin/", quote: "“These days,” writes Professor Eno-Abasi Urua of the University of Uyo, “Medefaidrin is used exclusively in a religious context, with very few fluent speakers.”"}
- card: hepsters-dictionary
  fact: "Jive was the slang of 1930s Harlem musicians and entertainers, the talk of its jazz scene"
  sources:
    - {title: "RIPM Jazz: Cab Calloway's Hepster's Dictionary (text of the 1944 edition with Calloway's foreword)", url: "https://ripmjazz.org/cab-calloways-hepsters-dictionary/", quote: "the general patois employed by musicians and entertainers in New York's teeming Harlem"}
    - {title: "BBC Radio 4 Extra: Dr Hepcat and the Hepster's Dictionary (Brook Lapping, 2014)", url: "https://www.bbc.co.uk/programmes/b04mcmnl", quote: "How hep cat Cab Calloway wrote a dictionary of the inventive jive talk of New York's jazz scene."}
- card: hepsters-dictionary
  fact: "In jive Harlem was 'the Apple', the big town, the main stem"
  sources:
    - {title: "RIPM Jazz: Cab Calloway's Hepster's Dictionary (text of the 1944 edition with Calloway's foreword)", url: "https://ripmjazz.org/cab-calloways-hepsters-dictionary/", quote: "Apple (n.) the big town, the main stem, Harlem."}
    - {title: "Barry Popik, Cab Calloway's \"Hepster's Dictionary\" (1938, 1944)", url: "https://barrypopik.com/blog/cab_calloway", quote: "The dictionary contained much Harlem slang, including this entry: “Apple (n.): the big town, the main stem, Harlem.”"}
- card: hepsters-dictionary
  fact: "Cab Calloway was born in 1907; bandleader and singer"
  sources:
    - {title: "Britannica: Cab Calloway (archived September 2026)", url: "http://web.archive.org/web/20260909185351/https://www.britannica.com/biography/Cab-Calloway", quote: "Cab Calloway (born December 25, 1907, Rochester , New York , U.S.—died November 18, 1994, Hockessin, Delaware) was an American bandleader, singer"}
    - {title: "Princeton University Library, Graphic Arts Collection: A Hepster's Dictionary (2021)", url: "https://graphicarts.princeton.edu/2021/03/04/a-hepsters-dictionary", quote: "Cab Calloway (1907-1994)"}
- card: hepsters-dictionary
  fact: "His 1931 'Minnie the Moocher' sold more than a million copies"
  sources:
    - {title: "Britannica: Cab Calloway (archived September 2026)", url: "http://web.archive.org/web/20260909185351/https://www.britannica.com/biography/Cab-Calloway", quote: "Calloway recorded the song in 1931. It went on to sell more than a million copies."}
    - {title: "Princeton University Library, Graphic Arts Collection: A Hepster's Dictionary (2021)", url: "https://graphicarts.princeton.edu/2021/03/04/a-hepsters-dictionary", quote: "The first Black American musician to sell a million records from a single song"}
- card: hepsters-dictionary
  fact: "In 1938 he published Cab Calloway's Cat-ologue: A Hepster's Dictionary for a wider public (also wow)"
  sources:
    - {title: "Princeton University Library, Graphic Arts Collection: A Hepster's Dictionary (2021)", url: "https://graphicarts.princeton.edu/2021/03/04/a-hepsters-dictionary", quote: "published it in June 1938 as Cab Calloway's Cat-ologue: a Hepster's Dictionary"}
    - {title: "BBC Radio 4 Extra: Dr Hepcat and the Hepster's Dictionary (Brook Lapping, 2014)", url: "https://www.bbc.co.uk/programmes/b04mcmnl", quote: "His book of jive talk, Cab Calloway's Hepster's Dictionary, translated some of the ... for a new audience of jazz fans who weren't yet 'hep to the jive'"}
- card: hepsters-dictionary
  fact: "He became the first known African American to publish a book called a dictionary (also wow)"
  sources:
    - {title: "BBC Radio 4 Extra: Dr Hepcat and the Hepster's Dictionary (Brook Lapping, 2014)", url: "https://www.bbc.co.uk/programmes/b04mcmnl", quote: "In 1938, the singer and band leader Cab Calloway became the first known African American to publish a book and call it a dictionary."}
    - {title: "Princeton University Library, Graphic Arts Collection: A Hepster's Dictionary (2021)", url: "https://graphicarts.princeton.edu/2021/03/04/a-hepsters-dictionary", quote: "Cab Calloway (1907-1994) was also the first to write a dictionary"}
- card: hepsters-dictionary
  fact: "It went through several editions by 1944; the 1944 edition was the sixth since 1938"
  sources:
    - {title: "RIPM Jazz: Cab Calloway's Hepster's Dictionary (text of the 1944 edition with Calloway's foreword)", url: "https://ripmjazz.org/cab-calloways-hepsters-dictionary/", quote: "the present issue is the sixth edition since 1938"}
    - {title: "Princeton University Library, Graphic Arts Collection: A Hepster's Dictionary (2021)", url: "https://graphicarts.princeton.edu/2021/03/04/a-hepsters-dictionary", quote: "It was so successful a second revised edition was published the following year ... Seven more editions followed through 1944."}
- card: hepsters-dictionary
  fact: "The New York Public Library made it its official jive reference book, as Calloway noted in the 1944 foreword (also wow)"
  sources:
    - {title: "RIPM Jazz: Cab Calloway's Hepster's Dictionary (text of the 1944 edition with Calloway's foreword)", url: "https://ripmjazz.org/cab-calloways-hepsters-dictionary/", quote: "is the official jive language reference book of the New York Public Library"}
    - {title: "BBC Radio 4 Extra: Dr Hepcat and the Hepster's Dictionary (Brook Lapping, 2014)", url: "https://www.bbc.co.uk/programmes/b04mcmnl", quote: "how it became the official reference book of jive in the New York Public Library"}
