# Perspective rewrite of emmett-till (2026-11-15): shared, {male} (Moses Wright) and
# {female} (Mamie Till-Mobley) paragraphs. Every fact of the new body with two
# independent sources and a verbatim quote from each. The Jackson Free Press (2015)
# article republished by Mississippi Free Press counts as one source.
- card: emmett-till
  copy: both
  fact: "Emmett Till, fourteen, left Chicago in August 1955 to visit family in the Mississippi Delta"
  sources:
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "Emmett Louis Till, a 14-year-old from Chicago, was kidnapped and lynched while visiting family on summer vacation in Mississippi in August 1955."}
    - {title: "SNCC Digital Gateway: Emmett Till murdered, August 1955", url: "https://snccdigital.org/?p=106", quote: "In the summer of 1955, Emmett “Bobo” Till had taken a train from his home in Chicago, Illinois to visit his great uncle, Moses Wright, in Mississippi."}
- card: emmett-till
  copy: both
  fact: "On 24 August 1955 he stopped at Bryant's store in Money"
  sources:
    - {title: "SNCC Digital Gateway: Emmett Till murdered, August 1955", url: "https://snccdigital.org/?p=106", quote: "On the evening of August 24, 1955, after spending most of the morning and afternoon picking cotton, Till and a carload of boys drove to Bryant’s Grocery and Meat Market in nearby Money"}
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "Three days after arriving in Money, Mississippi — on August 24, 1955 — Till and a group of teenagers entered"}
- card: emmett-till
  copy: both
  fact: "Four nights later (28 August) Roy Bryant and J. W. Milam took him from his great-uncle's house"
  sources:
    - {title: "HISTORY: Emmett Till murderers make magazine confession", url: "https://www.history.com/this-day-in-history/january-24/emmett-till-murderers-make-magazine-confession", quote: "In the early hours of August 28, Roy Bryant and his half-brother, J.W. Milam, abducted Emmett Till from his great-uncle’s home."}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "Roy Bryant and his half-brother J.W. Milam drove to the home of Mose Wright to find Emmett on Sunday, August 28 around 2:00 am."}
- card: emmett-till
  copy: both
  fact: "His body was found in the Tallahatchie River"
  sources:
    - {title: "HISTORY: Emmett Till murderers make magazine confession", url: "https://www.history.com/this-day-in-history/january-24/emmett-till-murderers-make-magazine-confession", quote: "On August 31, Till’s decomposed body was found in the Tallahatchie River."}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "on August 31, a body was observed floating in the Tallahatchie River near Graball Landing"}
- card: emmett-till
  copy: male
  fact: "The great-uncle, Moses Wright, was a 64-year-old sharecropper and preacher"
  sources:
    - {title: "PBS American Experience: Moses and Elizabeth Wright", url: "https://www.pbs.org/wgbh/americanexperience/features/emmett-biography-moses-and-elizabeth-wright", quote: "Wright said that he was 64. ... Wright, called \"Preacher,\" was a minister as well as a sharecropper."}
    - {title: "SNCC Digital Gateway: Emmett Till murdered, August 1955", url: "https://snccdigital.org/?p=106", quote: "The 64-year-old sharecropper begged the two white men to “just take [Emmett] out in the yard and whip him,”"}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "After waking the “Preacher,” as Mose Wright was called"}
- card: emmett-till
  copy: male
  fact: "Milam threatened to kill Wright if he talked; Wright went to the sheriff the same day"
  sources:
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "Milam threatened to kill Wright if he were to tell on him and Bryant. ... Despite the death threat that Mose Wright had received, he alerted the Leflore County sheriff later that day after Emmett failed to return."}
    - {title: "Mississippi Free Press (Jackson Free Press, 2015): Remembering Emmett Till", url: "https://www.mississippifreepress.org/remembering-emmett-till-a-boy-who-changed-america/", quote: "Mose Wright reported the abduction to the sheriff’s department on Sunday morning"}
    - {title: "Jerry Mitchell, Mississippi Center for Investigative Reporting (2021)", url: "https://www.mississippicir.org/perspective/carolyn-bryant-lied-about-emmett-till-did-author-tim-tyson-lie-too", quote: "The men warned Wright’s father, Moses, that if he talked, he would be killed. But Moses Wright did talk."}
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "Moses Wright reported Till's disappearance to the local authorities"}
- card: emmett-till
  copy: both
  fact: "The trial in Sumner opened on 19 September 1955"
  sources:
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "The trial against Till's killers began on September 19, 1955."}
    - {title: "NMAAHC Searchable Museum: Emmett Till", url: "https://www.searchablemuseum.com/emmett-till/", quote: "The trial of Roy Bryant and J. W. Milam began on September 19, 1955, in front of an all-white jury."}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "was held in Sumner, Mississippi, at the Tallahatchie County Courthouse"}
- card: emmett-till
  copy: male
  fact: "At the trial Wright stood up and pointed at Milam, then at Bryant"
  sources:
    - {title: "SNCC Digital Gateway: Emmett Till murdered, August 1955", url: "https://snccdigital.org/?p=106", quote: "When asked if he could identify the men who abducted his nephew, Wright told the jury, “Thar he,” pointing first at Milam and then to Bryant."}
    - {title: "PBS American Experience: J. W. Milam and Roy Bryant", url: "https://www.pbs.org/wgbh/americanexperience/features/emmett-trial-jw-milam-and-roy-bryant", quote: "He stood up in court and pointed out Milam and Bryant as the men who came to his home and took Emmett at gunpoint."}
    - {title: "DeNeen L. Brown, The Washington Post (2022)", url: "https://www.adn.com/nation-world/2022/10/15/how-emmett-tills-mother-defied-threats-to-her-life-and-fought-for-justice/", quote: "“There he is,” he testified, pointing at Milam. “That’s the man.” He also identified Bryant."}
- card: emmett-till
  copy: male
  fact: "In Mississippi a Black man almost never accused white men in court"
  sources:
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "At the time, it was almost unheard of for Black people to openly accuse white people in court."}
    - {title: "Mississippi Free Press (Jackson Free Press, 2015): Remembering Emmett Till", url: "https://www.mississippifreepress.org/remembering-emmett-till-a-boy-who-changed-america/", quote: "extending his arm fully pointing at Milam across the courtroom, a black-to-white gesture that was unheard of in the Jim Crow South."}
- card: emmett-till
  copy: male
  fact: "Soon after the verdict Wright moved his family north, to Chicago"
  sources:
    - {title: "Mississippi Free Press (Jackson Free Press, 2015): Remembering Emmett Till", url: "https://www.mississippifreepress.org/remembering-emmett-till-a-boy-who-changed-america/", quote: "The jury of 12 white men came back with a “not guilty” verdict a little over an hour after deliberation started. Mose Wright took his family and moved north almost immediately."}
    - {title: "PBS American Experience: Moses and Elizabeth Wright", url: "https://www.pbs.org/wgbh/americanexperience/features/emmett-biography-moses-and-elizabeth-wright", quote: "After the trial, Moses fled to join his wife in Chicago, leaving behind his 1941 Ford and his cotton blooming in the fields."}
    - {title: "DeNeen L. Brown, The Washington Post (2022)", url: "https://www.adn.com/nation-world/2022/10/15/how-emmett-tills-mother-defied-threats-to-her-life-and-fought-for-justice/", quote: "Wright fled Mississippi that night."}
- card: emmett-till
  copy: both
  fact: "Six decades earlier Ida B. Wells gathered the figures on lynching (Southern Horrors 1892, A Red Record 1895)"
  sources:
    - {title: "National Women's History Museum: Ida B. Wells-Barnett", url: "https://www.womenshistory.org/education-resources/biographies/ida-b-wells-barnett", quote: "Wells-Barnett authored A Red Record, a book that provided the history and statistical data on the lynching of African Americans in the United States during the late nineteenth century."}
    - {title: "Library of Congress: Ida B. Wells and the activism of investigative journalism", url: "https://blogs.loc.gov/headlinesandheroes/2020/02/ida-b-wells-and-the-activism-of-investigative-journalism/", quote: "In early 1895 she published her book, A Red Record. Again using her investigative reporting, A Red Record was longer than Southern Horrors and included updated statistics"}
- card: emmett-till
  copy: female
  fact: "His mother, Mamie Till-Mobley, wanted the world to see"
  sources:
    - {title: "Monument Lab: Looking for Emmett and Mamie in Chicago", url: "https://monumentlab.com/bulletin/looking-for-emmett-and-mamie-in-chicago", quote: "She wanted the world beyond the thousands who would attend Emmett’s funeral and viewing to know how white men in Mississippi had brutally assaulted and mutilated her fourteen-year-old son."}
    - {title: "TIME: The photograph of Emmett Till (100 Photos)", url: "https://time.com/4399793/emmett-till-civil-rights-photography", quote: "Let the people see what I've seen."}
    - {title: "Jerry Mitchell, Mississippi Center for Investigative Reporting (2021)", url: "https://www.mississippicir.org/perspective/carolyn-bryant-lied-about-emmett-till-did-author-tim-tyson-lie-too", quote: "She told me that she left her son’s casket open because “I wanted the world to see what I had seen.”"}
- card: emmett-till
  copy: female
  fact: "The sheriff hurried to bury the body; she had it brought home to Chicago"
  sources:
    - {title: "NMAAHC Searchable Museum: Emmett Till", url: "https://www.searchablemuseum.com/emmett-till/", quote: "the local sheriff hurried to bury Emmett Till. But Till relatives intervened to stop him, and at Mamie Till’s behest her son’s body was brought back to Chicago."}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "The sheriff ordered that Emmett’s body be promptly buried, but before it could be, Mamie Till-Mobley was alerted and insisted that his body be returned to Chicago."}
- card: emmett-till
  copy: female
  fact: "She held an open-casket funeral at Roberts Temple"
  sources:
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "She then held a public viewing and open-casket funeral for Emmett at Roberts Temple Church of God in Christ from September 3-6."}
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "Till's body was shipped to Chicago, where his mother opted to have an open-casket funeral with Till's body on display for five days. Thousands of people came to the Roberts Temple Church of God"}
- card: emmett-till
  copy: female
  fact: "She let Jet photographer David Jackson take pictures, printed in September"
  sources:
    - {title: "Monument Lab: Looking for Emmett and Mamie in Chicago", url: "https://monumentlab.com/bulletin/looking-for-emmett-and-mamie-in-chicago", quote: "She chose a Black photographer, David Jackson, to take pictures of Emmett's body and allowed those images to be printed on the cover of Jet magazine on September 15, 1955"}
    - {title: "PBS American Experience: The Murder of Emmett Till, timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/till-timeline/", quote: "September 15, 1955 Jet magazine, the nationwide black magazine owned by Chicago-based Johnson Publications, publishes photographs of Till's mutilated corpse"}
    - {title: "AP via theGrio: Emmett Till images have multigenerational impact on artists (2022)", url: "https://thegrio.com/2022/10/31/emmett-till-images-have-multigenerational-impact-on-artists/", quote: "Till-Mobley handpicked Jet photographer David Jackson, a Black man who had spent much of his career documenting the horrors of Jim Crow segregation in the South, to take the controversial images of her son’s body"}
    - {title: "HISTORY: Emmett Till murderers make magazine confession", url: "https://www.history.com/this-day-in-history/january-24/emmett-till-murderers-make-magazine-confession", quote: "On September 3, Till’s mother held an open-casket funeral for her son ... Afterward, Jet magazine published graphic photos of Till’s corpse."}
- card: emmett-till
  copy: female
  fact: "At the trial in Sumner she testified that the body was her son's, against claims that it was not"
  sources:
    - {title: "DeNeen L. Brown, The Washington Post (2022)", url: "https://www.adn.com/nation-world/2022/10/15/how-emmett-tills-mother-defied-threats-to-her-life-and-fought-for-justice/", quote: "One of the most powerful moments in the trial belonged to Till-Mobley, when she identified her son by the ring he was wearing, which had belonged to his father."}
    - {title: "Mississippi Free Press (Jackson Free Press, 2015): Remembering Emmett Till", url: "https://www.mississippifreepress.org/remembering-emmett-till-a-boy-who-changed-america/", quote: "The state prosecuted the two men, calling Mamie down from Chicago as a key witness in the trial to counter a false rumor out that the body wasn’t Till’s."}
    - {title: "Black Enterprise (2025)", url: "https://www.blackenterprise.com/70-years-acquittal-white-men-lynched-emmett-till", quote: "The defense argued that the mutilated body found in the Tallahatchie River was not Till’s"}
- card: emmett-till
  copy: female
  fact: "She spoke against injustice across the country until she died in 2003"
  sources:
    - {title: "DeNeen L. Brown, The Washington Post (2022)", url: "https://www.adn.com/nation-world/2022/10/15/how-emmett-tills-mother-defied-threats-to-her-life-and-fought-for-justice/", quote: "She spoke across the country against injustice. ... Before she died on Jan. 6, 2003"}
    - {title: "PBS American Experience: Mamie Till Mobley", url: "https://www.pbs.org/wgbh/americanexperience/features/emmett-biography-mamie-till-mobley/", quote: "Mamie took her fight to the people and gave speeches to overflowing crowds across the country."}
    - {title: "NPS: Emmett Till (biography)", url: "https://www.nps.gov/people/emmett-till.htm", quote: "She was an advocate against racist violence and injustice until her death in 2003."}
- card: emmett-till
  copy: both
  fact: "An all-white jury acquitted both men in about an hour"
  sources:
    - {title: "DeNeen L. Brown, The Washington Post (2022)", url: "https://www.adn.com/nation-world/2022/10/15/how-emmett-tills-mother-defied-threats-to-her-life-and-fought-for-justice/", quote: "the all-White jury deliberated just 67 minutes before returning a verdict of not guilty."}
    - {title: "SNCC Digital Gateway: Emmett Till murdered, August 1955", url: "https://snccdigital.org/?p=106", quote: "The all-white jury’s verdict came after 68 minutes of deliberation"}
- card: emmett-till
  copy: both
  fact: "In January 1956, safe from retrial, they sold their confession to Look"
  sources:
    - {title: "HISTORY: Emmett Till murderers make magazine confession", url: "https://www.history.com/this-day-in-history/january-24/emmett-till-murderers-make-magazine-confession", quote: "On January 24, 1956, Look magazine publishes the confessions of J.W. Milam and Roy Bryant"}
    - {title: "Biography.com: Emmett Till", url: "https://www.biography.com/crime/emmett-till", quote: "Protected by double jeopardy laws, they told the whole story of how they kidnapped and killed Till to Look magazine for $4,000."}
- card: emmett-till
  copy: both
  fact: "In December 1955 Rosa Parks refused to give up her bus seat; she later said she had thought of Emmett Till"
  sources:
    - {title: "NMAAHC Searchable Museum: Emmett Till", url: "https://www.searchablemuseum.com/emmett-till/", quote: "Within three months, Rosa Parks refused to give up her bus seat in Montgomery, Alabama. ... I thought about Emmett Till, and I could not go back. Rosa Parks"}
    - {title: "NPS: Rosa Parks", url: "https://www.nps.gov/people/rosa-parks.htm", quote: "Parks' arrest on December 1, 1955 launched the Montgomery Bus Boycott"}
    - {title: "HISTORY: New book sheds light on the murder of Emmett Till", url: "https://www.history.com/articles/new-book-sheds-light-on-the-murder-of-emmett-till-the-civil-rights-movement", quote: "Rosa Parks refused to give up her seat on a bus in Montgomery, Alabama. As Parks later said of her actions that day, “I thought of Emmett Till, and when the bus driver ordered me to move to the back, I just couldn’t move.”"}
- card: emmett-till
  copy: both
  fact: "In 2022 a law in his name made lynching a federal hate crime"
  sources:
    - {title: "Public Law 117-107", url: "https://www.congress.gov/117/plaws/publ107/PLAW-117publ107.htm", quote: "An Act To amend section 249 of title 18, United States Code, to specify lynching as a hate crime act. ... Approved March 29, 2022."}
    - {title: "PBS NewsHour: Biden will establish a national monument for Emmett Till (2023)", url: "https://www.pbs.org/newshour/politics/biden-will-establish-a-national-monument-for-emmett-till-black-teen-lynched-in-1955", quote: "In March 2022, Biden signed the Emmett Till Anti-Lynching Act into law."}
- card: emmett-till
  copy: both
  fact: "In 2023 the church, the courthouse and the river landing became a national monument to Emmett and his mother"
  sources:
    - {title: "NPS: Emmett Till and Mamie Till-Mobley monument proclamation", url: "https://www.nps.gov/till/learn/management/presidential-proclamation.htm", quote: "A Proclamation on Establishment of the Emmett Till and Mamie Till-Mobley National Monument July 25, 2023 ... The Roberts Temple Church of God in Christ, the Tallahatchie County Second District Courthouse, Graball Landing"}
    - {title: "PBS NewsHour: Biden will establish a national monument for Emmett Till (2023)", url: "https://www.pbs.org/newshour/politics/biden-will-establish-a-national-monument-for-emmett-till-black-teen-lynched-in-1955", quote: "The monument to Till and his mother will include three sites in the two states. The Illinois site is Roberts Temple Church of God in Christ ... The Mississippi locations are Graball Landing ... and the Tallahatchie County Second District Courthouse in Sumner, Mississippi"}
