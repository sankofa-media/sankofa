# Batch c22 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a quote.
# Dropped: king-kong-musical (core facts only found on South African History Online pages; no second independent source reachable, web search quota exhausted).

- card: sambizanga
  fact: "In 1961 Angola was a Portuguese colony on the brink of its war of independence (1961–1974)"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "Made during the Angolan War of Independence from Portuguese colonial rule (1961–1974)"}
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "It’s 1961 and Domingos works on the docks in an Angolan port town"}
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "Set in Angola in 1961"}
- card: sambizanga
  fact: "Sambizanga, a Luanda district, was home to many anti-colonial activists; the film is named after it"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "Named for the Sambizanga neighborhood in Luanda where many anti-colonial resistance and MPLA activists lived"}
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "named after the Luanda neighbourhood where the uprising against Portuguese rule began"}
- card: sambizanga
  fact: "The film follows Domingos Xavier and his wife Maria; the colonial police take Domingos away"
  sources:
    - {title: "Galerias Municipais de Lisboa: Sambizanga, 1972", url: "https://galeriasmunicipais.pt/en/programa-publico/sambizanga-1972/", quote: "Domingos Xavier is taken away by colonial authorities, imprisoned and tortured. His wife Maria goes in search of him."}
    - {title: "BFI: Sambizanga (1972)", url: "https://www.bfi.org.uk/film/0542d05a-7eba-5f82-b444-52b21c2d3db0/sambizanga", quote: "is arrested, interrogated, brutally beaten and sent to the dreaded Luanda prison by Portuguese authorities"}
- card: sambizanga
  fact: "In prison he is beaten repeatedly and refuses to name his comrades"
  sources:
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "he refuses to name other dissidents and is repeatedly tortured by the police"}
    - {title: "Buala: To what extent was Sarah Maldoror's Sambizanga shaped by the ideology of MPLA?", url: "https://buala.org/en/afroscreen/to-what-extent-was-sarah-maldoror-s-sambizanga-shaped-by-the-ideology-of-mpla", quote: "He will eventually be tortured to death for persistently refusing to the name the other members of his resistance movement"}
    - {title: "Cinemateca Portuguesa, Luís Miguel Oliveira: Sambizanga programme note (2024)", url: "https://www.cinemateca.pt/CinematecaSite/media/Documentos/2024-11-13_SAMBIZANGA.pdf", quote: "activista torturado e morto pela PIDE sem denunciar os seus companheiros"}
- card: sambizanga
  fact: "Maria, her baby on her back, walks from prison to prison looking for him"
  sources:
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "Carrying her baby on her back, she sets off on a seemingly endless journey on foot in search of her husband"}
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "Maria undertakes an arduous journey on foot, travelling from one prison to another in pursuit of the truth"}
- card: sambizanga
  fact: "She learns that he has been beaten to death"
  sources:
    - {title: "Buala: To what extent was Sarah Maldoror's Sambizanga shaped by the ideology of MPLA?", url: "https://buala.org/en/afroscreen/to-what-extent-was-sarah-maldoror-s-sambizanga-shaped-by-the-ideology-of-mpla", quote: "Finally arriving at the Luanda prison, she is informed of his death."}
    - {title: "Tom Mulcaire, Cabinet Magazine 2 (2001): The revolutionary potential of Sarah Maldoror's Sambizanga", url: "https://cabinetmagazine.org/issues/2/mulcaire.php", quote: "Domingos refuses to cooperate with the authorities and is beaten to death as an example"}
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "as she learns of her husband’s fate, surrounded and supported by the strong arms of many women"}
- card: sambizanga
  fact: "Sarah Maldoror, the daughter of a Guadeloupean father, grew up in France"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "Maldoror, daughter of a Guadeloupean father and French mother, grew up in France."}
    - {title: "CNC: Sarah Maldoror, pionnière du cinéma panafricain (2020)", url: "https://www.cnc.fr/cinema/actualites/deces-de-sarah-maldoror-pionniere-du-cinema-panafricain_1154672", quote: "Née en 1929 d'une mère originaire du Gers et d'un père guadeloupéen ... elle monte à la fin des années 50, après des études à Paris, une compagnie de théâtre"}
    - {title: "Otis Alexander, BlackPast: Sarah Maldoror (1929-2020)", url: "https://blackpast.org/global-african-history/sarah-maldoror-1929-2020", quote: "was born Sarah Ducados on July 19, 1929, in Condom, France, of emigrant parents from the Francophone Caribbean Island of Guadeloupe"}
- card: sambizanga
  fact: "She co-founded Les Griots, the first theatre company in France made up of Black actors"
  sources:
    - {title: "Centre Pompidou: Sarah Maldoror, cinema as a form of combat", url: "https://www.centrepompidou.fr/en/pompidou-plus/magazine/article/sarah-maldoror-cinema-as-a-form-of-combat", quote: "a co-founder, in 1956, of the theatre company Les Griots ... the first theatrical troupe in France composed entirely of Black actors"}
    - {title: "CNC: Sarah Maldoror, pionnière du cinéma panafricain (2020)", url: "https://www.cnc.fr/cinema/actualites/deces-de-sarah-maldoror-pionniere-du-cinema-panafricain_1154672", quote: "La troupe (première compagnie de théâtre noire de France)"}
    - {title: "Otis Alexander, BlackPast: Sarah Maldoror (1929-2020)", url: "https://blackpast.org/global-african-history/sarah-maldoror-1929-2020", quote: "co-founded the theatre group Compagnie d’Art Dramatique des Griots in Paris, the first Black theater company in the city"}
- card: sambizanga
  fact: "The film adapts a book by José Luandino Vieira"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "this film is an adaptation of The Real Life of Domingos Xavier by Portuguese-Angolan author and activist Jose Luandino Vieira"}
    - {title: "BFI: Sambizanga (1972)", url: "https://www.bfi.org.uk/film/0542d05a-7eba-5f82-b444-52b21c2d3db0/sambizanga", quote: "based on a book by Portuguese-Angolan author and activist José Luandino Vieira"}
- card: sambizanga
  fact: "She wrote it with her partner Mário Pinto de Andrade, a leader of the MPLA"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "Mário Pinto de Andrade, Angolan activist, poet, leader of the Popular Movement for the Liberation of Angola (MPLA), and Maldoror’s companion"}
    - {title: "Cinemateca Portuguesa, Luís Miguel Oliveira: Sambizanga programme note (2024)", url: "https://www.cinemateca.pt/CinematecaSite/media/Documentos/2024-11-13_SAMBIZANGA.pdf", quote: "um dos argumentistas é Mário Pinto de Andrade, poeta e um dos mais importantes dirigentes daquele movimento"}
- card: sambizanga
  fact: "Angola was closed to her, so she shot in neighbouring Congo-Brazzaville"
  sources:
    - {title: "Cinemateca Portuguesa, Luís Miguel Oliveira: Sambizanga programme note (2024)", url: "https://www.cinemateca.pt/CinematecaSite/media/Documentos/2024-11-13_SAMBIZANGA.pdf", quote: "rodada neste último país porque obviamente o território angolano estava indisponível"}
    - {title: "Tom Mulcaire, Cabinet Magazine 2 (2001): The revolutionary potential of Sarah Maldoror's Sambizanga", url: "https://cabinetmagazine.org/issues/2/mulcaire.php", quote: "Sambizanga could not be made in Angola, and Maldoror decided to film it in the Congo"}
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "was shot in neighbouring Congo-Brazzaville while Angola’s war of independence was still ongoing"}
- card: sambizanga
  fact: "The cast was largely non-professional and included exiled Angolan activists"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "using both professional and nonprofessional actors, including many exiled MPLA activists"}
    - {title: "Tom Mulcaire, Cabinet Magazine 2 (2001): The revolutionary potential of Sarah Maldoror's Sambizanga", url: "https://cabinetmagazine.org/issues/2/mulcaire.php", quote: "with a French crew and a cast of exiled Angolan guerrillas"}
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "shot in Congo with a non-professional cast"}
- card: sambizanga
  fact: "It was made while Angola's war of independence was still being fought (wow)"
  sources:
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "shot in neighbouring Congo-Brazzaville while Angola’s war of independence was still ongoing"}
    - {title: "Cinemateca Portuguesa, Luís Miguel Oliveira: Sambizanga programme note (2024)", url: "https://www.cinemateca.pt/CinematecaSite/media/Documentos/2024-11-13_SAMBIZANGA.pdf", quote: "Em 1972, a independência angolana, embora iminente, ainda não se concretizara, a guerra colonial ainda sacudia o território"}
- card: sambizanga
  fact: "It won the Tanit d'Or, the top prize of the Carthage Film Festival, in 1972 (shared according to one source; see dispute)"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "It was awarded the Tanit d’Or, the highest prize at the prestigious Carthage Film Festival in Tunisia, in 1972."}
    - {title: "Otis Alexander, BlackPast: Sarah Maldoror (1929-2020)", url: "https://blackpast.org/global-african-history/sarah-maldoror-1929-2020", quote: "It also won the Tanit d’Or at the 1972 Carthage Film Festival hosted in Tunisia."}
    - {title: "African Film Festival New York: Sarah Maldoror", url: "https://africanfilmny.org/directors/sarah-maldoror/", quote: "The film shared the prestigious Tanit d’Or prize at the Carthage Film Festival that same year."}
- card: sambizanga
  fact: "The Portuguese authorities kept it off screens in Angola"
  sources:
    - {title: "Tom Mulcaire, Cabinet Magazine 2 (2001): The revolutionary potential of Sarah Maldoror's Sambizanga", url: "https://cabinetmagazine.org/issues/2/mulcaire.php", quote: "the Portuguese colonial authorities banned it from being screened in their then province of Angola"}
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "Banned in Angola until its independence from Portugal in 1975"}
- card: sambizanga
  fact: "It has been restored (Cineteca di Bologna and The Film Foundation's World Cinema Project)"
  sources:
    - {title: "Galerias Municipais de Lisboa: Sambizanga, 1972", url: "https://galeriasmunicipais.pt/en/programa-publico/sambizanga-1972/", quote: "Sambizanga has been restored in 2021 by The Film Foundation’s World Cinema Project and Cineteca di Bologna"}
    - {title: "Internationales Frauen Film Fest: Sambizanga (2025)", url: "https://frauenfilmfest.com/en/movie/sambizanga/", quote: "Restored by Cineteca di Bologna and The Film Foundation’s World Cinema Project at L’Image Retrouvée (Paris)"}
- card: sambizanga
  fact: "It is regarded as one of the first feature films directed by a woman in Africa"
  sources:
    - {title: "Carina Yervasi, African Studies Review: Sambizanga, film review (2022)", url: "https://doi.org/10.1017/asr.2022.160", quote: "one of the first full-length features directed by a woman on the African continent"}
    - {title: "ACMI / MIFF: Sambizanga (2022)", url: "https://www.acmi.net.au/whats-on/melbourne-international-film-festival-miff-2022/sambizanga/", quote: "The first feature film to have been directed by a woman from Africa"}
- card: julia-tv
  fact: "Julia was a half-hour series that NBC launched in September 1968"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "Julia , a half-hour comedy premiering on NBC in September 1968"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "Julia originally aired on NBC from 1968 to 1971"}
- card: julia-tv
  fact: "Earlier Black-led shows of the early 1950s such as Beulah and Amos 'n' Andy had left the air and dealt in stereotypes"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "the first to star a black performer in the leading role since Beulah, Amos 'n' Andy , and The Nat \"King\" Cole Show all left the air in the early and mid-1950s"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "Amos and Andy , and other series, such as ABC's The Beulah Show (1950–53) ... had presented negative African-American stereotypes"}
- card: julia-tv
  fact: "Black women on screen were mostly cast as maids and nannies; Julia was among the first series to star a Black woman in a non-stereotyped role"
  sources:
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "Up until then, the majority of Black females on screen were maids and nannies"}
    - {title: "Margalit Fox, The New York Times: Diahann Carroll obituary (2019)", url: "https://www.nytimes.com/2019/10/04/arts/television/diahann-carroll-dead.html", quote: "Black women, when they were seen at all in series television, had long been relegated to marginal roles. The few larger parts that came their way were invariably those of domestics."}
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "Julia represented a completely assimilated--and thoroughly non-stereotyped--African-American image to prime-time viewers"}
    - {title: "Television Academy: Diahann Carroll, Emmy Awards and Nominations", url: "https://www.televisionacademy.com/bios/diahann-carroll", quote: "Julia (1968), on which Carroll starred, was one of the first series on American television to star a black woman in a nonstereotypical role"}
- card: julia-tv
  fact: "Diahann Carroll played Julia Baker, a nurse whose husband was killed in Vietnam, with a young son Corey"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "Julia Baker, (Diahann Carroll) a widowed black nurse and her young son, Corey (Marc Copage). Julia's husband had been killed in a helicopter crash in Vietnam"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "starred Diahann Carroll as nurse Julia Baker. She was widowed and the single parent of a six-year-old son named Corey"}
- card: julia-tv
  fact: "They move into an integrated apartment building in Los Angeles and she works in a medical office in the aerospace industry"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "moving into an integrated apartment building in Los Angeles while Julia secured employment at the medical offices of Astrospace Industries"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "Julia was hired to work in a high-end medical office in the aerospace industry"}
- card: julia-tv
  fact: "Creator Hal Kanter had written for Beulah"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "Hal Kanter, a Hollywood liberal and broadcasting veteran whose credits included writing for the Beulah radio show in the 1940s"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "ABC's The Beulah Show (1950–53), with which Kanter was also involved"}
- card: julia-tv
  fact: "Kanter heard NAACP leaders deplore the lack of positive Black images and took the idea to NBC"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "Kanter had attended a luncheon organized by the National Association for the Advancement of Colored People (NAACP) and been inspired enough to propose the project to NBC"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "NAACP group leader Roy Wilkins voiced his concerns over the lack of positive Black role models on and behind the scenes of both film and television"}
- card: julia-tv
  fact: "The show was heavily debated and criticised, among other things for having no male head of the family"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "The show was also criticized for presenting no male head of the family"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "there was no then-traditionally masculine or father-image ... \"That was a very loud criticism,\" recalled Carroll"}
- card: julia-tv
  fact: "Julia ran three seasons, until 1971"
  sources:
    - {title: "Aniko Bodroghkozy, Museum of Broadcast Communications, Encyclopedia of Television: Julia", url: "https://web.archive.org/web/2010/http://www.museum.tv/eotv/julia.htm", quote: "continuing to be moderately successful during its remaining two seasons on the air ... January 1971-May 1971"}
    - {title: "Herbie J. Pilato, Television Academy: Julia Set the Standard (2021)", url: "https://www.televisionacademy.com/features/news/online-originals/julia-set-standard", quote: "Julia originally aired on NBC from 1968 to 1971"}
    - {title: "Margalit Fox, The New York Times: Diahann Carroll obituary (2019)", url: "https://www.nytimes.com/2019/10/04/arts/television/diahann-carroll-dead.html", quote: "the highest position it attained in its three seasons on the air"}
- card: troubled-island
  fact: "William Grant Still was born in Woodville, Mississippi, in 1895"
  sources:
    - {title: "Chris Goertzen, Mississippi Encyclopedia: William Grant Still", url: "https://mississippiencyclopedia.org/entries/william-grant-still/", quote: "was born in Woodville on 1 May 1895 and died in Los Angeles on 3 December 1978"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Still was born in Woodville, Mississippi, on May 11, 1895"}
- card: troubled-island
  fact: "He was raised in Little Rock, Arkansas"
  sources:
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "grew up surrounded by spirituals, gospel music and Red Seal classical 78s in Little Rock, Arkansas"}
    - {title: "William Grant Still Music (Still family): Biographical Notes", url: "http://www.williamgrantstill.com/BiographicalNotes.htm", quote: "his father died and his mother took him to Little Rock, Arkansas, where she taught English in the high school"}
- card: troubled-island
  fact: "His Afro-American Symphony was the first symphony by an African American performed by a major orchestra"
  sources:
    - {title: "David Salazar, OperaWire: Composer Profile, William Grant Still", url: "https://operawire.com/?p=46556", quote: "his Symphony No. 1 “Afro-American” came in 1931 and would become the first score by an African American performed by a major orchestra"}
    - {title: "William Grant Still Music (Still family): Biographical Notes", url: "http://www.williamgrantstill.com/BiographicalNotes.htm", quote: "Still was the first Afro-American in the United States to have a symphony performed by a major symphony orchestra"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "the first to have a symphony of his own performed by a leading orchestra"}
- card: troubled-island
  fact: "In 1936, leading the Los Angeles Philharmonic, he became the first African American to conduct a major American orchestra"
  sources:
    - {title: "David Salazar, OperaWire: Composer Profile, William Grant Still", url: "https://operawire.com/?p=46556", quote: "In 1936, he became the first African American to conduct a major American Orchestra; he led the Los Angeles Philharmonic"}
    - {title: "William Grant Still Music (Still family): Biographical Notes", url: "http://www.williamgrantstill.com/BiographicalNotes.htm", quote: "He was the first to conduct a major symphony orchestra in the United States, when in 1936, he directed the Los Angeles Philharmonic Orchestra"}
    - {title: "Encyclopaedia Britannica: William Grant Still", url: "https://www.britannica.com/biography/William-Grant-Still", quote: "the first African American to conduct a professional symphony orchestra in the United States ... he conducted (1936) the Los Angeles Philharmonic"}
- card: troubled-island
  fact: "He wrote an opera set in Haiti about Jean-Jacques Dessalines"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "The opera is set in Haiti in 1791 ... The slaves are led by Dessalines"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Troubled Island takes place in Haiti"}
    - {title: "David Salazar, OperaWire: Composer Profile, William Grant Still", url: "https://operawire.com/?p=46556", quote: "“Troubled Island” emphasizes the corruption of Jean Jacques Dessalines’ leadership in the Haitian Revolution"}
- card: troubled-island
  fact: "The libretto was by Langston Hughes, with Verna Arvey"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "The work, which includes a libretto by Langston Hughes and Verna Arvey"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Still's wife, Verna Arvey, for everything that followed Blue Steel, including some last-minute work on Troubled Island after Langston Hughes walked away from the project"}
- card: troubled-island
  fact: "The score was finished by the end of the 1930s and Still spent about ten years seeking a company to stage it"
  sources:
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "It took Still almost ten years to persuade any opera company to mount Troubled Island, once he completed the piano score in 1939."}
    - {title: "YourClassical, Composers Datebook: W. G. Still's all-star lineup (31 March 2009)", url: "https://www.yourclassical.org/episode/2009/03/31/w-g-stills-all-star-lineup", quote: "was written in 1938 but had to wait 11 years for its first performance"}
- card: troubled-island
  fact: "New York City Opera opened it at City Center on 31 March 1949"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "had its world premiere on March 31, 1949, at the New York City Opera"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Troubled Island was at last mounted by New York City Opera on March 31, 1949"}
    - {title: "YourClassical, Composers Datebook: W. G. Still's all-star lineup (31 March 2009)", url: "https://www.yourclassical.org/episode/2009/03/31/w-g-stills-all-star-lineup", quote: "took place on today’s date in 1949. That 1949 production was by the New York City Opera"}
- card: troubled-island
  fact: "It was the first opera by an African American composer produced by a major US company"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "making it the first opera composed by a Black composer to be produced by a major opera company in the United States"}
    - {title: "William Grant Still Music (Still family): Troubled Island", url: "http://www.williamgrantstill.com/TroubledIsland/Troubled%20Island.htm", quote: "was the first grand opera composed by an African-American to be produced by a major opera company for the American stage"}
- card: troubled-island
  fact: "The first-night audience called the cast back for many curtain calls"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "the opera was greeted with 22 curtain calls at its premiere performance"}
    - {title: "William Grant Still Music (Still family): Troubled Island", url: "http://www.williamgrantstill.com/TroubledIsland/Troubled%20Island.htm", quote: "Opening night was received with 22 curtain calls from a packed house."}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Effusively received by audiences during its three-performance run"}
- card: troubled-island
  fact: "Most critics dismissed it"
  sources:
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "Troubled Island was nevertheless widely dismissed, if not patronized, by the critics"}
    - {title: "YourClassical, Composers Datebook: W. G. Still's all-star lineup (31 March 2009)", url: "https://www.yourclassical.org/episode/2009/03/31/w-g-stills-all-star-lineup", quote: "The critical reception to “Troubled Island” in 1949 was negative."}
- card: troubled-island
  fact: "The production closed after three performances"
  sources:
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "during its three-performance run"}
    - {title: "William Grant Still Music (Still family): Troubled Island", url: "http://www.williamgrantstill.com/TroubledIsland/Troubled%20Island.htm", quote: "the opera's production was shut-down after its first three performances"}
- card: troubled-island
  fact: "Still died in Los Angeles in 1978"
  sources:
    - {title: "Chris Goertzen, Mississippi Encyclopedia: William Grant Still", url: "https://mississippiencyclopedia.org/entries/william-grant-still/", quote: "died in Los Angeles on 3 December 1978"}
    - {title: "YourClassical, Composers Datebook: W. G. Still's all-star lineup (31 March 2009)", url: "https://www.yourclassical.org/episode/2009/03/31/w-g-stills-all-star-lineup", quote: "William Grant Still (1895-1978)"}
- card: troubled-island
  fact: "The opera has almost never been heard since"
  sources:
    - {title: "David Salazar, OperaWire: Opera Profile, William Grant Still's Historic 'Troubled Island' (2020)", url: "https://operawire.com/opera-profile-william-grant-stills-historic-troubled-island", quote: "It was subsequently lost from the repertory with very few performances since."}
    - {title: "William Grant Still Music (Still family): Troubled Island", url: "http://www.williamgrantstill.com/TroubledIsland/Troubled%20Island.htm", quote: "the opera has never been staged again"}
    - {title: "Barry Singer, Opera News: In and Out of the Mainstream (February 2010)", url: "https://www.chartwellbooksellers.com/author/operanews/18.%20In%20and%20Out%20of%20the%20Mainstream.pdf", quote: "For Still's Troubled Island, though, resurrection has never really come."}
- card: ballets-africains
  fact: "Les Ballets Africains began in Paris in the early 1950s, when Paris was the colonial capital and independence movements were growing"
  sources:
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "It all started in the early 1950s in Paris, capital of Guinea's then colonial power, when three friends joined forces in the heady days of growing African independence movements."}
    - {title: "The Ford / LA Phil: Les Ballets Africains", url: "https://www.theford.com/musicdb/artists/478/les-ballets-africains", quote: "LES BALLETS AFRICAINS was formed in Paris in 1952 by distinguished Guinean choreographer Keita Fodeba"}
- card: ballets-africains
  fact: "Fodéba Keïta was a Guinean poet (and dancer)"
  sources:
    - {title: "Joshua Cohen, Routledge Encyclopedia of Modernism: Keita, Fodéba (1921–1969) (2016)", url: "https://www.rem.routledge.com/articles/keita-fodeba-1921-1969-1", quote: "Fodéba Keita was a poet, playwright, musician, choreographer, impresario, anti-colonial activist, and statesman."}
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "Guineans Fodeba Keita, a poet and dancer, and Facelli Kante, a guitarist"}
- card: ballets-africains
  fact: "He founded the company with the guitarist Facély Kanté"
  sources:
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "Fodeba Keita, a poet and dancer, and Facelli Kante, a guitarist"}
    - {title: "Camp Boiro Memorial (webGuinée): Keita Fodeba, 1921–1969", url: "https://web.archive.org/web/20190530184336/http://www.campboiro.org:80/victimes/keita_fodeba.html", quote: "Co-fondateur, avec Facély Kanté , des Ballets Africains"}
- card: ballets-africains
  fact: "The company brought African music, dance and storytelling onto the stage"
  sources:
    - {title: "Joshua Cohen, Routledge Encyclopedia of Modernism: Keita, Fodéba (1921–1969) (2016)", url: "https://www.rem.routledge.com/articles/keita-fodeba-1921-1969-1", quote: "best known for having brought African music, dance, masquerade, and oral narratives to the stage, particularly with Les Ballets Africains"}
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "telling stories through dance, song, percussion and gymnastic displays"}
- card: ballets-africains
  fact: "It toured abroad through the 1950s"
  sources:
    - {title: "Joshua Cohen, Routledge Encyclopedia of Modernism: Keita, Fodéba (1921–1969) (2016)", url: "https://www.rem.routledge.com/articles/keita-fodeba-1921-1969-1", quote: "Les Ballets Africains, which toured internationally during the 1950s"}
    - {title: "The Ford / LA Phil: Les Ballets Africains", url: "https://www.theford.com/musicdb/artists/478/les-ballets-africains", quote: "Les Ballets Africains toured the world successfully until Guinea's independence in 1958"}
- card: ballets-africains
  fact: "After independence in 1958 Sékou Touré's government made its members state employees and it became the national ensemble (dated 1958 or 1960; see dispute)"
  sources:
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "In 1958, a proud yet impoverished Guinea, newly independent from France, began investing heavily in culture under its charismatic first president, Ahmed Sekou Toure ... Les Ballets Africains members were made state employees"}
    - {title: "The Ford / LA Phil: Les Ballets Africains", url: "https://www.theford.com/musicdb/artists/478/les-ballets-africains", quote: "until Guinea's independence in 1958, when they were invited to become the country's national ensemble"}
    - {title: "Joshua Cohen, Routledge Encyclopedia of Modernism: Keita, Fodéba (1921–1969) (2016)", url: "https://www.rem.routledge.com/articles/keita-fodeba-1921-1969-1", quote: "before becoming Guinea’s national dance company in 1960"}
- card: ballets-africains
  fact: "Its drummers, dancers and acrobats toured the world, from New York to Moscow"
  sources:
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "electrifying spectators in the grandest theatres of Paris, Moscow, New York and elsewhere"}
    - {title: "The Ford / LA Phil: Les Ballets Africains", url: "https://www.theford.com/musicdb/artists/478/les-ballets-africains", quote: "Whether in Sydney, Rio, Berlin, Tokyo, Moscow, or Los Angeles, their performance has always received a tumultuous acclaim"}
- card: ballets-africains
  fact: "Keïta became one of Touré's ministers"
  sources:
    - {title: "Camp Boiro Memorial (webGuinée): Keita Fodeba, 1921–1969", url: "https://web.archive.org/web/20190530184336/http://www.campboiro.org:80/victimes/keita_fodeba.html", quote: "Ministre de l'Intérieur en 1957. Ministre de la Défense nationale et de la Sécurité en 1960."}
    - {title: "Library of Congress Country Studies via GlobalSecurity: Guinea, Internal Insecurity", url: "https://www.globalsecurity.org/military/world/africa/gn-history-43.htm", quote: "among them were three former cabinet ministers, including one of the key members of the partys left wing, Fodeba Keita"}
- card: ballets-africains
  fact: "In 1969 the regime claimed a plot, arrested more than a thousand people, and Keïta was among them"
  sources:
    - {title: "Library of Congress Country Studies via GlobalSecurity: Guinea, Internal Insecurity", url: "https://www.globalsecurity.org/military/world/africa/gn-history-43.htm", quote: "More than 1,000 Guineans were arrested throughout the country in this so-called Labe plot ... including one of the key members of the partys left wing, Fodeba Keita"}
    - {title: "Camp Boiro Memorial (webGuinée): Keita Fodeba, 1921–1969", url: "https://web.archive.org/web/20190530184336/http://www.campboiro.org:80/victimes/keita_fodeba.html", quote: "Keita Fodeba. 1921-1969 ... Camp Boiro Memorial Victimes"}
- card: ballets-africains
  fact: "He died in detention in 1969"
  sources:
    - {title: "Camp Boiro Memorial (webGuinée): Keita Fodeba, 1921–1969", url: "https://web.archive.org/web/20190530184336/http://www.campboiro.org:80/victimes/keita_fodeba.html", quote: "exécuté sans procès le 27 mai 1969"}
    - {title: "Library of Congress Country Studies via GlobalSecurity: Guinea, Internal Insecurity", url: "https://www.globalsecurity.org/military/world/africa/gn-history-43.htm", quote: "Thirteen of those arrested were executed, and twenty-seven wore imprisoned; among them were three former cabinet ministers, including ... Fodeba Keita"}
    - {title: "Joshua Cohen, Routledge Encyclopedia of Modernism: Keita, Fodéba (1921–1969) (2016)", url: "https://www.rem.routledge.com/articles/keita-fodeba-1921-1969-1", quote: "Keita, Fodéba (1921–1969)"}
- card: ballets-africains
  fact: "The company kept touring the world for decades"
  sources:
    - {title: "Abdoulaye Bah, AFP via The Goan: Guinea's world-famous dance troupe fades into uncertain future (2016)", url: "https://www.thegoan.net/goa-news/guineas-worldfamous-dance-troupe-fades-into-uncertain-future/22525.html", quote: "\"We did the five continents,\" ... the last time they left Guinea to perform abroad was in 2010, to China"}
    - {title: "The Ford / LA Phil: Les Ballets Africains", url: "https://www.theford.com/musicdb/artists/478/les-ballets-africains", quote: "Between 1958 and the present day, Les Ballets Africains have visited the four corners of the earth"}
- card: trouble-in-mind
  fact: "In the 1950s roles open to Black actresses were mostly maids, nannies and mammies"
  sources:
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "\"Very subjugated maids, nannies; always those types of roles,\" LaChanze confirms."}
    - {title: "Playbill: Trouble in Mind, American Airlines Theatre (2021–2022)", url: "https://playbill.com/production/trouble-in-mindamerican-airlines-theatre-2021-2022", quote: "has spent her career playing stereotypes, trapped on a merry-go-round of mammies, maids, and other menials"}
- card: trouble-in-mind
  fact: "Alice Childress was born in Charleston, South Carolina, in 1916"
  sources:
    - {title: "Encyclopaedia Britannica: Alice Childress", url: "https://web.archive.org/web/2024/https://www.britannica.com/biography/Alice-Childress", quote: "Alice Childress (born October 12, 1916, Charleston , South Carolina , U.S."}
    - {title: "BlackPast: Alice Childress (1916-1994)", url: "https://www.blackpast.org/african-american-history/childress-alice-1916-1994/", quote: "was born Alice Herndon in Charleston, South Carolina"}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "Alice Childress was born in South Carolina in 1916"}
- card: trouble-in-mind
  fact: "She was raised in Harlem"
  sources:
    - {title: "Encyclopaedia Britannica: Alice Childress", url: "https://web.archive.org/web/2024/https://www.britannica.com/biography/Alice-Childress", quote: "Childress grew up in Harlem , New York City"}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "raised in Harlem and fell in love with the theater"}
- card: trouble-in-mind
  fact: "She began as an actor and then wrote plays"
  sources:
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "She started as an actor"}
    - {title: "Encyclopaedia Britannica: Alice Childress", url: "https://web.archive.org/web/2024/https://www.britannica.com/biography/Alice-Childress", quote: "acted with the American Negro The[atre] ... starred in her first play, Florence (produced 1949)"}
- card: trouble-in-mind
  fact: "Trouble in Mind opened off-Broadway in 1955"
  sources:
    - {title: "Douglas Reside, New York Public Library: Alice Childress's Trouble in Mind in the Archives (2021)", url: "https://web.archive.org/web/2023/https://www.nypl.org/blog/2021/11/18/alice-childress-trouble-mind-archive", quote: "The play originally opened in 1955 off-Broadway at the Greenwich Mews Theatre"}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "Trouble in Mind, a 1955 play by Alice Childress"}
    - {title: "Encyclopaedia Britannica: Alice Childress", url: "https://web.archive.org/web/2024/https://www.britannica.com/biography/Alice-Childress", quote: "Trouble in Mind (produced 1955; revised and published 1971)"}
- card: trouble-in-mind
  fact: "It is set in rehearsals of a Broadway-bound anti-lynching play by white creators"
  sources:
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "looks at a company of mostly Black actors putting on an anti-lynching play by white creators"}
    - {title: "Playbill: Trouble in Mind, American Airlines Theatre (2021–2022)", url: "https://playbill.com/production/trouble-in-mindamerican-airlines-theatre-2021-2022", quote: "The curtain rises on the first day of rehearsal for Chaos in Belleville, a Broadway-bound play that tackles the harsh truths of racism in America."}
- card: trouble-in-mind
  fact: "Wiletta Mayer at first defers, then confronts the white director over what the play makes Black actors be"
  sources:
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "At first, Wiletta is deferential. But as rehearsals go on and her frustration builds, she final[ly] ... \"this is who you are making us be.\""}
    - {title: "Douglas Reside, New York Public Library: Alice Childress's Trouble in Mind in the Archives (2021)", url: "https://web.archive.org/web/2023/https://www.nypl.org/blog/2021/11/18/alice-childress-trouble-mind-archive", quote: "the protagonist, Wiletta Mayer, delivers a cutting monologue about the treatment of Black actors on Broadway"}
- card: trouble-in-mind
  fact: "Reviews were good; in 1957 producers proposed a Broadway transfer but asked her to change the ending; she refused and it never transferred"
  sources:
    - {title: "Douglas Reside, New York Public Library: Alice Childress's Trouble in Mind in the Archives (2021)", url: "https://web.archive.org/web/2023/https://www.nypl.org/blog/2021/11/18/alice-childress-trouble-mind-archive", quote: "The reviews were positive, and, in 1957, producers ... proposed to move the show to Broadway. However, they reportedly asked Childress to change the ending ... Childress ultimately refused, and the production never moved forward."}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "It was supposed to transfer to Broadway. But in a case of life imitating art, white producers insisted that the Black playwright provide a more upbeat ending. Childress refused."}
- card: trouble-in-mind
  fact: "She would have been the first Black woman playwright on Broadway; that went to Hansberry's A Raisin in the Sun in 1959"
  sources:
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "\"She would have been the first black female playwright on Broadway,\" Randolph-Wright says. (Lorraine Hansberry's A Raisin in the Sun had its Broadway premiere four years later.)"}
    - {title: "Andrew Gans and Marc J. Franklin, Playbill: On March 11, 1959, A Raisin in the Sun Opened on Broadway (2025)", url: "https://playbill.com/article/on-march-11-1959-a-raisin-in-the-sun-opened-on-broadway", quote: "the first by an African-American woman to be produced on Broadway"}
- card: trouble-in-mind
  fact: "Childress died in 1994"
  sources:
    - {title: "Encyclopaedia Britannica: Alice Childress", url: "https://web.archive.org/web/2024/https://www.britannica.com/biography/Alice-Childress", quote: "died August 14, 1994, New York"}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "Now, 27 years after its author's death, Trouble in Mind has finally gotten its Broadway debut"}
- card: trouble-in-mind
  fact: "In November 2021 the Roundabout Theatre Company opened it on Broadway with LaChanze as Wiletta (66 years after 1955)"
  sources:
    - {title: "Playbill: Trouble in Mind, American Airlines Theatre (2021–2022)", url: "https://playbill.com/production/trouble-in-mindamerican-airlines-theatre-2021-2022", quote: "Opening Date Nov 18 2021 ... LaChanze Wiletta Mayer (Original)"}
    - {title: "Jeff Lunden, NPR (via KPBS): A prescient play about race in America has its long-overdue Broadway premiere (2021)", url: "https://www.kpbs.org/news/national/2021/12/06/a-prescient-play-about-race-in-america-has-its-long-overdue-broadway-premiere", quote: "Trouble in Mind has finally gotten its Broadway debut , mounted by the Roundabout Theatre Company"}
    - {title: "Douglas Reside, New York Public Library: Alice Childress's Trouble in Mind in the Archives (2021)", url: "https://web.archive.org/web/2023/https://www.nypl.org/blog/2021/11/18/alice-childress-trouble-mind-archive", quote: "has its long-delayed Broadway premiere at the Roundabout’s American Airlines Theatre"}
- card: raisin-in-the-sun
  fact: "Restrictive covenants in Chicago barred Black families from buying or renting homes"
  sources:
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "there had been a restrictive covenant in place barring blacks from purchasing or renting homes in the neighborhood"}
    - {title: "National Women's History Museum: Lorraine Hansberry", url: "https://www.womenshistory.org/education-resources/biographies/lorraine-hansberry", quote: "Hansberry’s parents challenged Chicago’s restrictive housing covenants by moving into an all-white neighborhood"}
- card: raisin-in-the-sun
  fact: "Carl and Nannie Hansberry moved into a white area"
  sources:
    - {title: "National Women's History Museum: Lorraine Hansberry", url: "https://www.womenshistory.org/education-resources/biographies/lorraine-hansberry", quote: "the youngest of three children born to Nannie Perry Hansberry and Carl Augustus Hansberry ... moving into an all-white neighborhood"}
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "her parents bought a house in an all-white subdivision called Washington Park"}
- card: raisin-in-the-sun
  fact: "The Illinois courts upheld the covenant; the family won in the US Supreme Court in Hansberry v. Lee, 1940"
  sources:
    - {title: "Hansberry v. Lee, 311 U.S. 32 (1940), Legal Information Institute", url: "https://www.law.cornell.edu/supremecourt/text/311/32", quote: "The Supreme Court of Illinois affirmed ... Decided Nov. 12, 1940"}
    - {title: "National Women's History Museum: Lorraine Hansberry", url: "https://www.womenshistory.org/education-resources/biographies/lorraine-hansberry", quote: "When the Supreme Court of Illinois upheld the legality of the neighborhood’s restrictive covenant ... They took their case all the way to the Su[preme Court]"}
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "The confrontation reached the Supreme Court in the form of Hainsberry v. Lee (1940) where the justices ruled"}
- card: raisin-in-the-sun
  fact: "Lorraine Hansberry was born in Chicago in 1930 (aged 28 in March 1959)"
  sources:
    - {title: "National Women's History Museum: Lorraine Hansberry", url: "https://www.womenshistory.org/education-resources/biographies/lorraine-hansberry", quote: "Lorraine Hansberry was born on May 19, 1930 at Provident Hospital on the South Side of Chicago."}
    - {title: "J. Robert Parks, Gale: A Raisin in the Sun Premieres on Broadway (2024)", url: "https://blog.gale.com/a-raisin-in-the-sun-premieres-on-broadway/", quote: "Hansberry was born in Chicago in 1930 and grew up on the South Side."}
- card: raisin-in-the-sun
  fact: "The title comes from Langston Hughes's poem \"Harlem\" about a dream deferred"
  sources:
    - {title: "Andrew Gans and Marc J. Franklin, Playbill: On March 11, 1959, A Raisin in the Sun Opened on Broadway (2025)", url: "https://playbill.com/article/on-march-11-1959-a-raisin-in-the-sun-opened-on-broadway", quote: "The title of the play comes from the Langston Hughes poem \"Harlem,\" which asks, \"What happens to a dream deferred?"}
    - {title: "HISTORY.com Editors: \"A Raisin in the Sun\" debuts on Broadway", url: "https://www.history.com/this-day-in-history/march-11/a-raisin-in-the-sun-debuts-broadway", quote: "Taking its title from the Langston Hughes poem “Harlem,”"}
- card: raisin-in-the-sun
  fact: "The Younger family live in a small South Side apartment and await a life-insurance cheque after the father's death; Mama wants a house in a white area, Walter Lee a business"
  sources:
    - {title: "Andrew Gans and Marc J. Franklin, Playbill: On March 11, 1959, A Raisin in the Sun Opened on Broadway (2025)", url: "https://playbill.com/article/on-march-11-1959-a-raisin-in-the-sun-opened-on-broadway", quote: "When Lena's late husband's insurance check arrives, Lena hopes to use it to buy a house in a white neighborhood—while Walter hopes to invest it in a liquor business."}
    - {title: "J. Robert Parks, Gale: A Raisin in the Sun Premieres on Broadway (2024)", url: "https://blog.gale.com/a-raisin-in-the-sun-premieres-on-broadway/", quote: "The story focuses on the Younger family, who all live in a small apartment."}
- card: raisin-in-the-sun
  fact: "Her parents' housing fight is the same circumstance that arises in the play"
  sources:
    - {title: "J. Robert Parks, Gale: A Raisin in the Sun Premieres on Broadway (2024)", url: "https://blog.gale.com/a-raisin-in-the-sun-premieres-on-broadway/", quote: "her parents were part of an important Supreme Court case, Hansberry v. Lee ... The same circumstance arises in the latter sce[nes]"}
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "drawn from her own experiences as it features a black family moving into the all-white Washington Park Subdivision in Chicago"}
- card: raisin-in-the-sun
  fact: "It opened at the Ethel Barrymore Theatre on 11 March 1959 with Sidney Poitier as Walter Lee"
  sources:
    - {title: "Andrew Gans and Marc J. Franklin, Playbill: On March 11, 1959, A Raisin in the Sun Opened on Broadway (2025)", url: "https://playbill.com/article/on-march-11-1959-a-raisin-in-the-sun-opened-on-broadway", quote: "opened at the Ethel Barrymore Theatre March 11, 1959 ... The original cast featured Sidney Poitier as Walter Lee Younger"}
    - {title: "HISTORY.com Editors: \"A Raisin in the Sun\" debuts on Broadway", url: "https://www.history.com/this-day-in-history/march-11/a-raisin-in-the-sun-debuts-broadway", quote: "opens at the Ethel Barrymore Theatre in New York on March 11, 1959"}
    - {title: "J. Robert Parks, Gale: A Raisin in the Sun Premieres on Broadway (2024)", url: "https://blog.gale.com/a-raisin-in-the-sun-premieres-on-broadway/", quote: "Sidney Poitier played Walter Lee"}
- card: raisin-in-the-sun
  fact: "First play by a Black woman produced on Broadway and first with a Black director, Lloyd Richards"
  sources:
    - {title: "Andrew Gans and Marc J. Franklin, Playbill: On March 11, 1959, A Raisin in the Sun Opened on Broadway (2025)", url: "https://playbill.com/article/on-march-11-1959-a-raisin-in-the-sun-opened-on-broadway", quote: "not only the first by an African-American woman to be produced on Broadway but also the first with an African-American director, Lloyd Richards"}
    - {title: "HISTORY.com Editors: \"A Raisin in the Sun\" debuts on Broadway", url: "https://www.history.com/this-day-in-history/march-11/a-raisin-in-the-sun-debuts-broadway", quote: "the first Broadway play written by a Black woman ... It was also the first Broadway show to feature a Black director, Lloyd Richards"}
- card: raisin-in-the-sun
  fact: "Hansberry died in 1965 aged 34"
  sources:
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "She died on that play’s closing night, January 12, 1965 at 34 years old."}
    - {title: "J. Robert Parks, Gale: A Raisin in the Sun Premieres on Broadway (2024)", url: "https://blog.gale.com/a-raisin-in-the-sun-premieres-on-broadway/", quote: "she died at the tragically young age of 34 from pancreatic cancer"}
- card: raisin-in-the-sun
  fact: "It became a film in 1961 and returned to Broadway in 2004 and 2014"
  sources:
    - {title: "HISTORY.com Editors: \"A Raisin in the Sun\" debuts on Broadway", url: "https://www.history.com/this-day-in-history/march-11/a-raisin-in-the-sun-debuts-broadway", quote: "was adapted for the big screen in 1961, with Hansberry writing the script. Broadway revivals took place in 2004 and 20[14]"}
    - {title: "Arthur Ashe Legacy at UCLA: Celebrating the Legacy of Lorraine Hansberry (2016)", url: "https://arthurashe.ucla.edu/2016/05/19/celebrating-the-legacy-of-lorraine-hansberry", quote: "including two Broadway revivals that won multiple Tony Awards, in addition to a movie"}
- card: sizwe-banzi
  fact: "Under apartheid's pass laws a wrong stamp in the passbook could bar a man from living and working in an area"
  sources:
    - {title: "Michael Coveney, The Guardian: Athol Fugard obituary (2025)", url: "https://www.theguardian.com/stage/2025/mar/09/athol-fugard-obituary", quote: "the story of a man who, unable to work because of the wrong stamp in his passbook, steals a dead man’s identity"}
    - {title: "Adam Hetrick, Playbill: Tony Winners Kani and Ntshona Return to BAM in Sizwe Banzi Is Dead (2008)", url: "https://playbill.com/article/tony-winners-kani-and-ntshona-return-to-bam-in-sizwe-banzi-is-dead-com-148131", quote: "tells the story of a man ordered to leave a district because he lacks the proper permit"}
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "Sizwe Banzi is Dead addresses the apartheid regime’s restrictive pass laws"}
- card: sizwe-banzi
  fact: "Kani and Ntshona were actors of the Serpent Players in Port Elizabeth working with Fugard"
  sources:
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "In 1967, Ntshona joined the Serpent Players drama group where he continued working with Kani and also collaborated with Athol Fugard"}
    - {title: "Michael Coveney, The Guardian: Athol Fugard obituary (2025)", url: "https://www.theguardian.com/stage/2025/mar/09/athol-fugard-obituary", quote: "The plays were initially produced by the Serpent Players in Port Elizabeth"}
- card: sizwe-banzi
  fact: "In 1972 the three devised Sizwe Banzi Is Dead"
  sources:
    - {title: "Alexis Soloski, The Village Voice: Sizwe Banzi Is Dead Remains Alive (2008)", url: "https://web.archive.org/web/20110524124835/http://www.villagevoice.com/2008-04-15/theater/the-line-worker/", quote: "Kani, fellow actor Winston Ntshona , and playwright Athol Fugard devised Sizwe Banzi Is Dead ... in 1972"}
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "One of the plays that emerged in 1972 was Sizwe Bansi is Dead, acollaboration between Kani, Fugard and Winston Ntshona"}
- card: sizwe-banzi
  fact: "The hero takes a dead man's identity and lives under his name in order to work"
  sources:
    - {title: "Michael Coveney, The Guardian: Athol Fugard obituary (2025)", url: "https://www.theguardian.com/stage/2025/mar/09/athol-fugard-obituary", quote: "steals a dead man’s identity; the new ID allows him to earn a"}
    - {title: "Alexis Soloski, The Village Voice: Sizwe Banzi Is Dead Remains Alive (2008)", url: "https://web.archive.org/web/20110524124835/http://www.villagevoice.com/2008-04-15/theater/the-line-worker/", quote: "a man who trades identity cards with a corpse in order to gain employment"}
    - {title: "Adam Hetrick, Playbill: Tony Winners Kani and Ntshona Return to BAM in Sizwe Banzi Is Dead (2008)", url: "https://playbill.com/article/tony-winners-kani-and-ntshona-return-to-bam-in-sizwe-banzi-is-dead-com-148131", quote: "He trades his name for a number and begins life as a dead man"}
- card: sizwe-banzi
  fact: "In 1974 the play reached Broadway at the Edison Theatre"
  sources:
    - {title: "Playbill Vault: Sizwe Banzi Is Dead, Edison Theatre (1974)", url: "https://playbill.com/production/sizwe-banzi-is-dead-edison-theatre-vault-0000013406", quote: "Sizwe Banzi Is Dead (Broadway, Edison Theatre, 1974) ... Opening Date Nov 13 1974"}
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "In New York the two plays ran for 52 performances at the Edison Theatre on Broadway"}
- card: sizwe-banzi
  fact: "Kani and Ntshona both won Tony Awards"
  sources:
    - {title: "Adam Hetrick, Playbill: Tony Winners Kani and Ntshona Return to BAM in Sizwe Banzi Is Dead (2008)", url: "https://playbill.com/article/tony-winners-kani-and-ntshona-return-to-bam-in-sizwe-banzi-is-dead-com-148131", quote: "Kani and Ntshona, who earned Tony Awards for their work in the 1974 production of Sizwe Banzi Is Dead"}
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "he and Kani were awarded a Tony for best actor for both plays"}
    - {title: "Alexis Soloski, The Village Voice: Sizwe Banzi Is Dead Remains Alive (2008)", url: "https://web.archive.org/web/20110524124835/http://www.villagevoice.com/2008-04-15/theater/the-line-worker/", quote: "In 1974, the show opened on Broadway and earned a pair of Tony Awards"}
- card: sizwe-banzi
  fact: "Touring South Africa on their return in 1976, they were arrested and detained, then released after protests"
  sources:
    - {title: "South African History Online: Winston Ntshona biography", url: "https://www.sahistory.org.za/people/winston-ntshona", quote: "On their return to South African in 1976 Kani and Ntshona began to tour ... Ntshona and Kani were arrested and detained. They were released after mass demonstrations"}
    - {title: "Alexis Soloski, The Village Voice: Sizwe Banzi Is Dead Remains Alive (2008)", url: "https://web.archive.org/web/20110524124835/http://www.villagevoice.com/2008-04-15/theater/the-line-worker/", quote: "in 1976, the South African government arrested the performers for treason ... A series of protests earned their release after several weeks."}
- card: sizwe-banzi
  fact: "They were still performing the roles together at the Brooklyn Academy of Music in 2008, more than three decades on"
  sources:
    - {title: "Adam Hetrick, Playbill: Tony Winners Kani and Ntshona Return to BAM in Sizwe Banzi Is Dead (2008)", url: "https://playbill.com/article/tony-winners-kani-and-ntshona-return-to-bam-in-sizwe-banzi-is-dead-com-148131", quote: "Tony Award winners John Kani and Winston Ntshona in the Brooklyn Academy of Music's mounting of Sizwe Banzi Is Dead , which is scheduled to begin performances April 8 [2008]"}
    - {title: "Alexis Soloski, The Village Voice: Sizwe Banzi Is Dead Remains Alive (2008)", url: "https://web.archive.org/web/20110524124835/http://www.villagevoice.com/2008-04-15/theater/the-line-worker/", quote: "Thirty-six years after that debut performance, Kani and Ntshona still stand tall on the stage."}
- card: death-and-the-kings-horseman
  fact: "In Oyo, Yoruba custom required the king's horseman (Elesin) to commit ritual suicide and follow the dead king"
  sources:
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "based on events which took place in the ancient Yoruba city of Oyo in 1946 ... Elesin, the hero of the title, is obliged by Yoruba custom to commit ritual suicide 30 days after his master’s death, to accompany him into the next world"}
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "With the death of the Yoruba king, the Commander of the King’s Stables (known as Elesin or Horseman) is expected to commit ritual suicide"}
    - {title: "Chiamaka Ozulumba, ThisDay: Unpacking the themes of colonialism and duty in Death and the King's Horseman (2021)", url: "https://web.archive.org/web/20210604100323/https://www.thisdaylive.com/index.php/2021/06/04/unpacking-the-themes-of-colonialism-and-duty-in-death-and-the-kings-horseman/", quote: "set in WWII, in Oyo State ... to commit ritual suicide after the death of the king he serves and follow him to the realm of the dead"}
- card: death-and-the-kings-horseman
  fact: "Oyo lies in what is now western Nigeria (Yoruba heartland under British rule)"
  sources:
    - {title: "Andrew Gumbel, The Guardian: Wole Soyinka on how he came to write Death and the King's Horseman (2009)", url: "https://www.theguardian.com/stage/2009/apr/08/wole-soyinka-death-kings-horseman", quote: "a vivid episode from western Nigeria's colonial period"}
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "at a time when Britain retained colonial control of the Yoruba cultural heartland that had become part of Nigeria in 1914"}
- card: death-and-the-kings-horseman
  fact: "In the 1940s a British district officer intervened to stop a horseman's ritual suicide; the play is based on this real event (year disputed)"
  sources:
    - {title: "Andrew Gumbel, The Guardian: Wole Soyinka on how he came to write Death and the King's Horseman (2009)", url: "https://www.theguardian.com/stage/2009/apr/08/wole-soyinka-death-kings-horseman", quote: "a vivid episode from western Nigeria's colonial period, in which a British district officer intervened to stop the horseman of a dead Yoruba chief committing ritual suicide"}
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "It is based on a real-life incident that occurred in the 1940s"}
    - {title: "Chiamaka Ozulumba, ThisDay: Unpacking the themes of colonialism and duty in Death and the King's Horseman (2021)", url: "https://web.archive.org/web/20210604100323/https://www.thisdaylive.com/index.php/2021/06/04/unpacking-the-themes-of-colonialism-and-duty-in-death-and-the-kings-horseman/", quote: "based on true events that occurred in 1941"}
- card: death-and-the-kings-horseman
  fact: "Soyinka wrote it in 1975 as a fellow at Churchill College, Cambridge"
  sources:
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "Published in 1975 while Soyinka was a professorial fellow at Churchill College, Cambridge"}
    - {title: "Andrew Gumbel, The Guardian: Wole Soyinka on how he came to write Death and the King's Horseman (2009)", url: "https://www.theguardian.com/stage/2009/apr/08/wole-soyinka-death-kings-horseman", quote: "what moved him, in the mid-1970s, to write his play ... At the time, he was a fellow at Churchill College, Cambridge"}
    - {title: "NobelPrize.org: Wole Soyinka, Biographical", url: "https://www.nobelprize.org/prizes/literature/1986/soyinka/biographical/", quote: "Death and the King’s Horseman (performed 1976, publ. 1975)"}
- card: death-and-the-kings-horseman
  fact: "Elesin delays his passage to marry a young bride"
  sources:
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "Elesin’s transition is delayed initially by his encounter with a beautiful young woman in the marketplace"}
    - {title: "Chiamaka Ozulumba, ThisDay: Unpacking the themes of colonialism and duty in Death and the King's Horseman (2021)", url: "https://web.archive.org/web/20210604100323/https://www.thisdaylive.com/index.php/2021/06/04/unpacking-the-themes-of-colonialism-and-duty-in-death-and-the-kings-horseman/", quote: "He also delays in carrying out his duty by going to marry a young bride"}
- card: death-and-the-kings-horseman
  fact: "District officer Simon Pilkings, seeing the custom as barbaric, prevents his death"
  sources:
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "Thinking this a ‘barbaric’ act, Simon Pilkings, the British colonial ruler, intervenes and prevents Elesin from taking his own life."}
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "the determination of the British district officer, Pilkings, to stamp out what he sees as a barbaric custom"}
- card: death-and-the-kings-horseman
  fact: "Pilkings and his wife wear Yoruba masks of the dead (Egungun) for a fancy-dress ball"
  sources:
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "Pilkings and his wife are first seen wearing death masks in readiness for a fancy dress ball"}
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "they host a masquerade ball of their own and appropriate Yoruba Egungun masks into their own outfits"}
- card: death-and-the-kings-horseman
  fact: "The Elesin's eldest son, a medical student in London, returns and the play ends in tragedy"
  sources:
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "When Elesin’s westernised eldest son, studying medicine in London, unexpectedly returns you have all the ingredients for a tragic denouement."}
    - {title: "Chiamaka Ozulumba, ThisDay: Unpacking the themes of colonialism and duty in Death and the King's Horseman (2021)", url: "https://web.archive.org/web/20210604100323/https://www.thisdaylive.com/index.php/2021/06/04/unpacking-the-themes-of-colonialism-and-duty-in-death-and-the-kings-horseman/", quote: "The events take a tragic turn when Olunde convinced it was his duty ... committed suicide in his place."}
- card: death-and-the-kings-horseman
  fact: "It was first staged in Nigeria in 1976"
  sources:
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "had its world debut performance in Nigeria in 1976"}
    - {title: "NobelPrize.org: Wole Soyinka, Biographical", url: "https://www.nobelprize.org/prizes/literature/1986/soyinka/biographical/", quote: "Death and the King’s Horseman (performed 1976, publ. 1975)"}
- card: death-and-the-kings-horseman
  fact: "Productions followed in the United States and Britain"
  sources:
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "followed by subsequent productions in the UK, the United States and other places around the world"}
    - {title: "Andrew Gumbel, The Guardian: Wole Soyinka on how he came to write Death and the King's Horseman (2009)", url: "https://www.theguardian.com/stage/2009/apr/08/wole-soyinka-death-kings-horseman", quote: "Soyinka has directed two productions of Horseman himself: in Chicago in 1976, and at New York's Lincoln Centre in 1987."}
    - {title: "Royal Exchange Theatre, Manchester: Death and the King's Horseman, British premiere (1990)", url: "https://web.archive.org/web/20030119152230/http://www.royalexchange.co.uk/history/1990/DEATH%20AND%20THE%20KINGS%20HORSEMAN.htm", quote: "British Premiere by Wole Soyinka"}
- card: death-and-the-kings-horseman
  fact: "It is often read as a 'clash of cultures', a reading Soyinka rejects"
  sources:
    - {title: "Michael Billington, The Guardian: Death and the King's Horseman, the return of Wole Soyinka's enduring mystery (2025)", url: "https://www.theguardian.com/stage/2025/jan/07/wole-soyinka-death-and-the-kings-horseman-crucible-sheffield", quote: "many western critics described the play as being about “a clash of cultures”. Soyinka himself, however, has summarily dismissed both ideas"}
    - {title: "Biodun Jeyifo, BBC Culture: This Wole Soyinka play showed the future of English (2018)", url: "https://www.bbc.com/culture/article/20180509-this-wole-soyinka-play-showed-the-future-of-english", quote: "the play is fundamentally not about a clash of cultures ... as Soyinka vigorously insists in his own foreword to the play"}
- card: death-and-the-kings-horseman
  fact: "Soyinka won the Nobel Prize in Literature in 1986"
  sources:
    - {title: "NobelPrize.org: Wole Soyinka, Biographical", url: "https://www.nobelprize.org/prizes/literature/1986/soyinka/biographical/", quote: "Wole Soyinka - Biographical Nobel Prize in Literature 1986"}
    - {title: "Andrew Gumbel, The Guardian: Wole Soyinka on how he came to write Death and the King's Horseman (2009)", url: "https://www.theguardian.com/stage/2009/apr/08/wole-soyinka-death-kings-horseman", quote: "the Nobel laureate talks to Andrew Gumbel"}
- card: revelations-ailey
  fact: "Alvin Ailey was born in Rogers, Texas, in 1931"
  sources:
    - {title: "Kharen Monsho, Handbook of Texas (TSHA): Ailey, Alvin", url: "https://www.tshaonline.org/handbook/entries/ailey-alvin", quote: "was born in Rogers, Bell County, Texas, on January 5, 1931"}
    - {title: "Marion Goldman, BlackPast: Alvin Ailey (1931-1989)", url: "https://www.blackpast.org/african-american-history/ailey-alvin-1931-1989/", quote: "Alvin Ailey was born in Rogers, Texas during the Great Depression."}
- card: revelations-ailey
  fact: "His mother was a single teenager"
  sources:
    - {title: "Marion Goldman, BlackPast: Alvin Ailey (1931-1989)", url: "https://www.blackpast.org/african-american-history/ailey-alvin-1931-1989/", quote: "His single teenage mother Lula Ailey"}
    - {title: "Kharen Monsho, Handbook of Texas (TSHA): Ailey, Alvin", url: "https://www.tshaonline.org/handbook/entries/ailey-alvin", quote: "His mother, Lula, was seventeen when he was born; six months later, her husband abandoned them."}
- card: revelations-ailey
  fact: "They lived by picking cotton, laundry and domestic work, moving between Texas towns"
  sources:
    - {title: "Kharen Monsho, Handbook of Texas (TSHA): Ailey, Alvin", url: "https://www.tshaonline.org/handbook/entries/ailey-alvin", quote: "They earned a living by picking cotton and doing laundry and domestic work after they moved to Navasota and then Los Angeles"}
