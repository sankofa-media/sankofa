    fact: "He sold the traffic signal rights to General Electric for $40,000"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Morgan sold his traffic light to General Electric Co. for $40,000 in 1923"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "sold the rights to the device to the General Electric Corporation for $40,000"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "He founded the weekly Cleveland Call in 1920"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Morgan in 1920 founded the Cleveland Call, a weekly newspaper"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "In 1920 Morgan started the weekly newspaper the Cleveland Call"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "He died in Cleveland in 1963"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Garrett A. Morgan died in Cleveland"}
