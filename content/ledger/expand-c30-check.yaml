# Second independent fact-check of batch c30 (2026-11-14). Every source re-opened; quotes below were found verbatim on the pages
# (Britannica and Olympics.com via web.archive.org snapshots; Pérez 1986 via the Crossref API; Lei 11.756 via an archive.org snapshot of planalto.gov.br).
entries:
  - card: garrett-morgan
    fact: "Born in Paris, Kentucky, in 1877 to formerly enslaved parents"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Born in Paris, Ky., to Sydney and Eliza Reed, both former enslaved people"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "Garrett Morgan’s parents had been enslaved, but they were freed before his birth"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "At 14 he left the family farm for Cincinnati and hired a tutor"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "leaving home at age 14 for Cincinnati where he worked and hired a tutor to continue his education"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "at age 14 he left his family’s farm and moved to Cincinnati, Ohio . There he took a job as a handyman and hired a tutor"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "In 1895 he moved to Cleveland and repaired sewing machines, then ran a clothing business"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "He came to Cleveland on 17 June 1895. After various positions as a sewing-machine adjuster"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "In 1895 he moved to Cleveland, where he began repairing sewing machines"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "He sold a hair-straightening product discovered while working on a solution for sewing needles"
    verdict: confirmed
    sources:
      - {url: "https://www.invent.org/inductees/garrett-morgan", quote: "He also began experimenting with a liquid for polishing sewing machine needles"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "He later discovered that it was safe to use for straightening hair and patented the formula"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "The Triangle shirtwaist fire of 1911 reportedly inspired the breathing hood"
    verdict: confirmed
    sources:
      - {url: "https://www.invent.org/inductees/garrett-morgan", quote: "when he learned about the devastating Triangle Shirtwaist Co. fire"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "His interest reportedly arose from the devastating Triangle shirtwaist factory fire (1911)"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "The hood's tube drew cleaner air from near the floor; patented in 1914"
    verdict: confirmed
    sources:
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "The tube reached the ground, where the air is usually cleaner"}
      - {url: "https://www.invent.org/inductees/garrett-morgan", quote: "supply himself at will with fresh air from near the floor"}
      - {url: "https://patents.google.com/patent/US1113675A/en", quote: "Patented Oct. 13, 1914"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "Racism hurt sales and he hired white actors to front the sales of the hood"
    verdict: corrected
    sources:
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "racism hindered its sales, so Morgan hired white actors to sell the hood"}
      - {url: "https://www.invent.org/inductees/garrett-morgan", quote: "He also hired white actors to promote the product at conventions"}
    note: "Body said the actors 'demonstrated' the hood; the USPTO says Morgan did the demonstrations himself while a hired white man acted as salesman, and Britannica says the actors sold it. Body now says the actors fronted the sales."
  - card: garrett-morgan
    fact: "On 25 July 1916 Cleveland police called him to a gas-filled tunnel under Lake Erie after an explosion"
    verdict: confirmed
    sources:
      - {url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "In the early morning hours of July 25, 1916, Garrett Morgan awoke to the incessant ringing of the telephone. On the line was Cleveland’s police department."}
      - {url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "entered the gas-filled tunnel at the request of the Cleveland police"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "Earlier would-be rescuers had died in the gas"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "killing 11 men and 10 would-be rescuers who were overcome by gas"}
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "the gas and smoke killed some 10 would-be rescuers"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
  - card: garrett-morgan
    fact: "Morgan and his brother Frank went down wearing his hoods and brought men out alive (numbers disputed)"
    verdict: confirmed
    sources:
      - {url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "who with his brother Frank and 2 others entered the gas-filled tunnel"}
      - {url: "https://carnegiehero.org/behind-the-scenes-shedding-light-on-the-complicated-case-of-black-inventor-garrett-morgan", quote: "they all donned Morgan’s smoke hoods"}
      - {url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "Morgan and the other rescuers were able to find eight survivors"}
    note: "Numbers disputed as the card's dispute says: ECH 'retrieve bodies', Carnegie Hero Fund describes bringing out Van Duzen alive; USPTO and Britannica give eight saved."
  - card: garrett-morgan
    fact: "Four white rescuers received Carnegie Medals; Morgan did not"
    verdict: confirmed
    sources:
      - {url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "Four white men who participated in the tunnel rescue were awarded medals by the Carnegie Hero Fund Commission"}
      - {url: "https://carnegiehero.org/behind-the-scenes-shedding-light-on-the-complicated-case-of-black-inventor-garrett-morgan", quote: "in 1917 only four were awarded the Carnegie Medal — Dolan, Clancy, McGrath, and Keating. None of Johnston’s, Van Duzen’s nor Morgan’s rescue parties were awarded."}
    note: "Carnegie Hero Fund names the four medallists and states that Garrett and Frank Morgan were the only two Black men of the 22 nominees, which corroborates USPTO's 'four white men'."
  - card: garrett-morgan
    fact: "In 1923 he patented a T-shaped signal with a position stopping traffic in all directions, forerunner of the amber light"
    verdict: confirmed
    sources:
      - {url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "a forerunner of today’s yellow, or amber, light"}
      - {url: "https://www.invent.org/inductees/garrett-morgan", quote: "stopped traffic “in all directions before the signal to proceed in any one direction is given.”"}
      - {url: "https://patents.google.com/patent/US1475024A/en", quote: "Patented Nov. 2G, i923"}
    note: "Both quotes found on the pages; sources independent (different institutions and authors)."
