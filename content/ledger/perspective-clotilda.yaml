# Perspective rewrite of the clotilda card (2026-11-15): shared frame and closing,
# {male} paragraph on Oluale Kossola (Cudjo Lewis), {female} paragraph on Redoshi (Sally Smith).
# Every page below was opened for this ledger. National Geographic (2019) and the Encyclopedia
# of Alabama are separate texts by Sylviane Diouf; Enslaved.org and the Newcastle University page
# both rest on Hannah Durkin's research but are separate texts, and each Redoshi fact is also
# confirmed by HISTORY or WBUR. Redoshi's death year is deliberately not stated: Enslaved.org and
# Newcastle give December 1936, HISTORY and the Encyclopedia of Alabama give 1937.
- card: clotilda
  copy: both
  fact: "In 1860, more than fifty years after the US outlawed the international slave trade, Timothy Meaher wagered he could smuggle in a cargo of captives"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "more than 50 years after the U.S. Congress outlawed the international slave trade. Timothy Meaher, a Mobile businessman and ship builder had enlisted the help of Capt. William Foster and wagered that he could smuggle a ship carrying enslaved people into Mobile Bay."}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Meaher made a bold wager: He would bring a cargo of African captives into Mobile, right under the noses of federal authorities."}
    - {title: "National Geographic (2018): Archaeologists search for the Clotilda", url: "https://www.nationalgeographic.com/science/2018/07/clotilda-slave-ships-mobile-alabama-africatown-archaeology/", quote: "The mastermind was Captain Timothy Meaher, a wealthy Mobile shipbuilder ... Meaher allegedly wagered several Northern businessmen $1,000 that he could smuggle a cargo of Africans into Mobile Bay under the nose of federal officials"}
- card: clotilda
  copy: both
  fact: "Captain William Foster took about 110 men, women and children aboard at Ouidah in Dahomey"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "110 enslaved men, women, and children were purchased at the slave markets in the port city of Ouidah in the kingdom of Dahomey (present-day Benin)"}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi was one of about 110 West African children and adults who were human cargo of the schooner Clotilda"}
    - {title: "Alabama Historical Commission: Clotilda", url: "https://ahc.alabama.gov/clotilda.aspx", quote: "The storied ship illegally transported 110 people from Benin, Africa to Mobile, Alabama in 1860"}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "The 110 young men, women, and children who boarded the Clotilda in May 1860 came from Bantè, Dahomey, Kebbi, Atakora, and other regions of Benin and Nigeria."}
    - {title: "National Geographic (2018): Archaeologists search for the Clotilda", url: "https://www.nationalgeographic.com/science/2018/07/clotilda-slave-ships-mobile-alabama-africatown-archaeology/", quote: "He returned in July 1860 with 110 humans on board"}
- card: clotilda
  copy: both
  fact: "Foster burned the schooner Clotilda to hide the evidence"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "Foster refitted a Gulf Coast schooner, the Clotilda ... Soon after it arrived in Mobile Bay, its captain burned the ship to hide the evidence"}
    - {title: "Alabama Historical Commission: Clotilda", url: "https://ahc.alabama.gov/clotilda.aspx", quote: "made an effort to evade authorities and destroy evidence of their criminal voyage by sinking, burning, and abandoning the vessel"}
    - {title: "National Geographic (2018): Archaeologists search for the Clotilda", url: "https://www.nationalgeographic.com/science/2018/07/clotilda-slave-ships-mobile-alabama-africatown-archaeology/", quote: "Foster then burned his ship to the waterline to hide the evidence of his crime."}
    - {title: "Equal Justice Initiative: The Clotilda", url: "https://eji.org/?p=17839", quote: "When the Clotilda reached Mobile, Alabama, Foster and Meaher hid the Africans in a swamp and burned the ship to conceal their crime."}
- card: clotilda
  copy: both
  fact: "Only Foster was fined"
  sources:
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "the only punishment meted out was a $1,000 fine levied against Foster"}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Timothy Meaher was arrested, released on bail, tried, and cleared of all charges. Federal cases against Burns Meaher and Dabney were dismissed because “said negroes” were never found. Foster was fined $1,000"}
- card: clotilda
  copy: both
  fact: "The captives stayed enslaved until 1865"
  sources:
    - {title: "Alabama Historical Commission: Clotilda", url: "https://ahc.alabama.gov/clotilda.aspx", quote: "dividing the kidnapped Africans among their captors, where they remained in slavery until the end of the Civil War"}
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "They arrived illegally in the US in 1860, where they were enslaved until the end of the Civil War in 1865."}
- card: clotilda
  copy: male
  fact: "Oluale Kossola was nineteen when Dahomey's army raided his Yoruba town of Bantè"
  sources:
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "He was a member of the Yoruba people, more specifically the Isha (a Yoruba sub-group), whose traditional home is in the Banté region of eastern Benin. ... At age 19, Kossola fell in love ... In April 1860, in the midst of Kossola's training, Ghezo, the King of Dahomey, and his army attacked the town"}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Like 19-year-old Kossola (later known as Cudjo Lewis), several were victims of a raid by the slave-trading kingdom of Dahomey."}
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "He then details the raid by Dahomey on his town, Bantè, that led to his capture"}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "At the time of his enslavement at the age of 19 ... Kossola was captured in February 1860, alongside 109 others in a raid by the Kingdom of Dahomey."}
- card: clotilda
  copy: male
  fact: "Once free, he married his shipmate Abile"
  sources:
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "In 1865, with general emancipation, Cujdo regained his freedom and took the name Lewis. He married Abile, a young woman who also had been on the Clotilda ."}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "After gaining his freedom, Lewis married Abile, a woman who had been on the slave ship Clotilda with him."}
- card: clotilda
  copy: male
  fact: "The Africans could not raise the fare home"
  sources:
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "the couple's objective was to return home, but when they failed to raise enough money for the trip, they decided to stay in Alabama"}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "they saved all they could, longing to return home, but it was not enough."}
    - {title: "Equal Justice Initiative: The Clotilda", url: "https://eji.org/?p=17839", quote: "After slavery was abolished five years later, official indifference and economic barriers prevented the men and women of the Clotilda from returning home."}
- card: clotilda
  copy: male
  fact: "Kossola asked Timothy Meaher for land for an African Town, since he had taken them from their land and home; Meaher refused"
  sources:
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "“Captain Tim,” he said, “you brought us from our country where we had land and home. You made us slaves. Now we are free, without country, land, or home. Why don’t you give us a piece of this land and let us build for ourselves an African Town?” They were asking for reparations. Meaher was incensed."}
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "they decided to ask him for reparations in the form of free land. Cudjo was chosen as the spokesman. Meaher refused their demand"}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "Lewis asked Timothy Meaher for land to build the community, and he refused."}
- card: clotilda
  copy: male
  fact: "In 1927 Zora Neale Hurston came to interview him and returned for further interviews"
  sources:
    - {title: "NPR via MPR News (2018): review of Barracoon", url: "https://www.mprnews.org/story/2018/05/08/npr-books-barracoon", quote: "came about in 1927, when the then-unknown Hurston was assigned a task by famed anthropologist Franz Boas: interviewing an 86-year-old former slave living in the tiny town of Plateau, Ala."}
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "Hurston began working as an investigator for Dr. Carter G. Woodson and the Association for the Study of Negro Life and History (ASNLH) in 1927. ... Also during this expedition, Hurston first interviewed Kossola in Mobile, Alabama."}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "was interviewed repeatedly by Zora Neale Hurston over the end of 1927 and the first few months of 1928"}
    - {title: "NPR via MPR News (2018): review of Barracoon", url: "https://www.mprnews.org/story/2018/05/08/npr-books-barracoon", quote: "Hurston returned to interview Kossula numerous times over a series of months."}
- card: clotilda
  copy: male
  fact: "He told her about his town, the raid and the slave pen at Ouidah"
  sources:
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "He then details the raid by Dahomey on his town, Bantè, that led to his capture and the journey to the barracoon in Ouidah"}
    - {title: "NPR via MPR News (2018): review of Barracoon", url: "https://www.mprnews.org/story/2018/05/08/npr-books-barracoon", quote: "Kossula recounts his capture by Dahomey warriors, with female warriors playing a large role."}
- card: clotilda
  copy: male
  fact: "By then he had outlived his wife and all six of their children"
  sources:
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "Kossola would get married and have six children. ... Kossola survived his wife and children"}
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "He and his wife had five sons and one daughter. ... Sadly, all of the children died young ... Abile passed away in 1908, just one month before Aleck died."}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "Together they had six children: Aleck, James, Pollee Dahoo, David, Cudjo, and Celia Es-bew-O-see). ... In November 1908, his beloved Abile died after forty years of marriage."}
- card: clotilda
  copy: male
  fact: "He died in 1935"
  sources:
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "Cudjo Lewis died of age-related illness on July 26, 1935, at about 94."}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "Kossola died in 1935"}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "Lewis survived until 1935 when he died well into his nineties."}
- card: clotilda
  copy: male
  fact: "Hurston's book Barracoon waited until 2018"
  sources:
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "Hurston made many attempts to publish Barracoon but was unsuccessful until 2018."}
    - {title: "NPR via MPR News (2018): review of Barracoon", url: "https://www.mprnews.org/story/2018/05/08/npr-books-barracoon", quote: "Barracoon: The Story of the Last \"Black Cargo,\" a posthumous, previously unpublished nonfiction work by Zora Neale Hurston"}
- card: clotilda
  copy: female
  fact: "Redoshi was twelve when she was taken"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "Born in 1848 and Kidnapped at age 12 in what is now Benin, she became a prisoner on the Clotilda"}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "Redoshi, later given the slave name Sally Smith, was kidnapped at the age of 12 from Benin in West Africa, in 1860."}
- card: clotilda
  copy: female
  fact: "Traders made her the 'wife' of a grown man from another people and sold the pair to Washington Smith of Dallas County"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "Slave traders forced the 12-year-old Redoshi to be the “wife” of an adult enslaved man who spoke a different language. The traders then sold Redoshi and the man as a couple to Washington Smith, founder of Alabama’s Bank of Selma."}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi was a twelve-year-old girl when she was sold and married to Yawith, a much older man from a different ethnic group."}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi, her husband, Yawith, and at least two other Africans were sent to Bank of Selma founder Washington Smith’s plantation in Bogue Chitto, Dallas County."}
- card: clotilda
  copy: female
  fact: "Smith renamed her Sally Smith"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "Smith also forced her to take a new name, “Sally Smith.”"}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "When Redoshi arrived at the Smith plantation, they renamed her Sally or Sallie"}
- card: clotilda
  copy: female
  fact: "She worked five years in house and fields before freedom"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "For nearly five years, Redoshi worked in the house and the fields of Smith’s Bogue Chitto plantation in Dallas County."}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "She was forced to work in both the fields and in the house, the slave owner's house, and she was basically enslaved for about five years."}
- card: clotilda
  copy: female
  fact: "In freedom she sharecropped Smith's land with her husband, Yawith"
  sources:
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "After the Civil War formally granted them their freedom, Redoshi and Yawith continued to labor as sharecroppers on the Smith plantation."}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "She still had to work as a sharecropper, her husband had to work as a sharecropper on the land in which they were enslaved."}
- card: clotilda
  copy: female
  fact: "She kept her language and her West African faith"
  sources:
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Records evidence that Redoshi remained committed to her West African spiritual beliefs and language throughout her life."}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "he worked so hard to retain her language and to pass it on to her daughter and some of her grandchildren. She worked to hold on to her West African religious belief"}
- card: clotilda
  copy: female
  fact: "She told her story to Amelia Boynton Robinson, later a leader of the voting-rights struggle in Selma"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "Later, Redoshi described this forced child marriage to the civil rights activist Amelia Boynton Robinson."}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi/Sally Smith is befriended by Amelia Boynton Robinson, a civil rights activist who leads African American voting rights efforts in Dallas County from the 1930s to the climactic protests at Selma in the mid 1960s."}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "Amelia Boynton Robinson, who of course went on to play a leading role in the fight for voting rights."}
- card: clotilda
  copy: female
  fact: "She outlived all but one known Clotilda shipmate"
  sources:
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi outlived all other known Clotilda survivors with the exception of Matilda McCrear, who died in January 1940."}
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "Two women, Sally \"Redoshi\" Smith and Matilda McCrear, were the last surviving members of the group, living until 1937 and 1940, respectively."}
- card: clotilda
  copy: female
  fact: "A 1938 (Department of Agriculture) film shows her lips moving without sound"
  sources:
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "Redoshi appeared in the U.S. Department of Agriculture film The Negro Farmer: Extension Work for Better Farming and Better Living (1938). ... Although she is shown talking on film, tragically her voice is silenced in the brief clip"}
    - {title: "WBUR Here & Now (2019)", url: "https://www.wbur.org/hereandnow/2019/04/08/trans-atlantic-slave-trade-last-survivor", quote: "In fact, you can see her mouth move in the film footage, but there's no audio track, so you can't hear directly from her."}
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "in an instructional film released by the Department of Agriculture in 1938 called \"The Negro Farmer: Extension Work for Better Farming and Better Living.\""}
- card: clotilda
  copy: female
  fact: "It is the only known footage of a woman survivor of the transatlantic slave trade"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "That film containing footage of Redoshi is the only known footage of a female survivor of the transatlantic slave trade."}
    - {title: "Enslaved.org: Redoshi", url: "https://enslaved.org/fullStory/16-23-126816/", quote: "This recording of Redoshi is the only known footage of a female African born transatlantic slave trade survivor."}
- card: clotilda
  copy: female
  fact: "The scholar Hannah Durkin reconstructed her life in 2019"
  sources:
    - {title: "HISTORY: The Life of America's Last Slave Ship Survivor", url: "https://www.history.com/articles/last-slave-ship-survivor-redoshi-clotilda", quote: "Durkin found evidence of Redoshi’s life in an incredible variety of sources—Boynton Robinson’s memoir, Zora Neale Hurston’s unpublished writings and even a film. ... Durkin published her research on Redoshi in the 2019 volume of Slavery & Abolition ."}
    - {title: "National Park Service: Zora Neale Hurston and Cudjo's Own Story", url: "https://www.nps.gov/articles/000/zora-neale-hurston-and-cudjo-s-own-story.htm", quote: "Hannah Durkin published two articles in 2019 and 2020 about two other survivors of the Clotilda , Sally “Redoshi” Smith and Matilda McCrear, both of whom lived longer than Kossola."}
- card: clotilda
  copy: both
  fact: "The shipmates near Mobile bought land, partly from Meaher, and built their own African Town"
  sources:
    - {title: "Encyclopedia of Alabama: Oluale Kossola (Cudjo Lewis)", url: "https://encyclopediaofalabama.org/?p=15143", quote: "Meaher refused their demand, and they purchased land from him and others and established African Town on a hill north of Mobile."}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "the community intensified its efforts and succeeded in buying land, including from the Meahers."}
    - {title: "Enslaved.org: Cudjo Lewis (Timothy M. Broughton)", url: "https://enslaved.org/fullStory/16-23-106156/", quote: "For several years they rented the land, and in 1872 Lewis purchased two acres from Meaher for $100."}
- card: clotilda
  copy: both
  fact: "Many descendants still live in today's Africatown"
  sources:
    - {title: "Equal Justice Initiative: The Clotilda", url: "https://eji.org/?p=17839", quote: "In 1866, many of them founded Africatown, an independent community near Mobile where many of their descendants live today."}
    - {title: "National Geographic: Clotilda, America's last slave ship", url: "https://www.nationalgeographic.com/magazine/article/clotilda-americas-last-slave-ship-stole-them-from-home-it-couldnt-steal-their-identities-feature", quote: "a tight-knit, self-reliant community that came to be known as Africatown. Many of their descendants still live there today."}
- card: clotilda
  copy: both
  fact: "In May 2019 the Alabama Historical Commission identified the wreck"
  sources:
    - {title: "Alabama Historical Commission: Clotilda", url: "https://ahc.alabama.gov/clotilda.aspx", quote: "In May 2019, after a comprehensive assessment and months of research, the Alabama Historical Commission announced experts and archaeological evidence determined the identity of the Clotilda"}
    - {title: "Encyclopedia of Alabama: Clotilda", url: "https://encyclopediaofalabama.org/article/emclotilda-em/", quote: "in May 2019, the Alabama Historical Commission (AHC) announced that the Clotilda had been identified conclusively."}
