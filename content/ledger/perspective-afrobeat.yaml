# Perspective rewrite of afrobeat (2026-11-15): shared frame, {male} Tony Allen, {female} Funmilayo Ransome-Kuti.
# One entry per fact in the new or rewritten paragraphs. The opening explainer paragraph is the
# existing text, only condensed, and keeps its earlier sourcing. Quotes marked [...] are condensed.
- card: afrobeat
  copy: both
  fact: "In 1969 Fela's band ended up broke in Los Angeles"
  sources:
    - {title: "Fela Kuti official site: story, 1969", url: "https://felakuti.com/story/1969", quote: "The group perform in Washington DC, Chicago and San Francisco before ending up broke in Los Angeles."}
    - {title: "NME: Tony Allen, 1940-2020 (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "[introduction to the music of James Brown, Max Roach, Art Blakey and Frank Butler came during] a 1969 visit to Los Angeles, which also sparked a political awakening"}
- card: afrobeat
  copy: both
  fact: "There the activist Sandra Izsadore gave him The Autobiography of Malcolm X and told him about the Black Panthers"
  sources:
    - {title: "Fela Kuti official site: story, 1969", url: "https://felakuti.com/story/1969", quote: "Sandra Izsadore, a black-rights activist in Los Angeles who introduces him to the writings of Malcolm X, Angela Davis, H. Rap Brown"}
    - {title: "Los Angeles Magazine: Fela Kuti's muse, a Q&A with Sandra Izsadore", url: "https://lamag.com/news/fela-kutis-muse-a-qa-with-sandra-izsadore/", quote: "The Autobiography of Malcolm X and writings by Angela Davis and Huey Newton. ... I told him about the Black Panthers and the activities that I had been involved with."}
- card: afrobeat
  copy: male
  fact: "Tony Allen was a self-taught Lagos drummer who had worked as a radio engineer"
  sources:
    - {title: "Mixmag: RIP Tony Allen (2020)", url: "https://mixmag.net/feature/tony-allen-drummer-afrobeat-obituary", quote: "self-teaching himself and working as an engineer for Lagos radio station in the Fifties"}
    - {title: "NME: Tony Allen, 1940-2020 (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "Allen was self-taught on the drums, having started playing while working as a radio engineer in Nigeria at the age of 18."}
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "He was self-taught and pointed to jazz drummers like Art Blakey and Max Roach as his inspirations"}
- card: afrobeat
  copy: male
  fact: "Fela heard Allen in 1964"
  sources:
    - {title: "NME: Tony Allen, 1940-2020 (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "caught the ear of fellow Lagos highlife circuit player Fela Kuti in 1964"}
    - {title: "uDiscover Music: Tony Allen dead at 79 (2020)", url: "https://udiscovermusic.com/news/tony-allen-afrobeat-dead-79", quote: "Allen first met Fela Kuti in 1964"}
    - {title: "Mixmag: RIP Tony Allen (2020)", url: "https://mixmag.net/feature/tony-allen-drummer-afrobeat-obituary", quote: "They first began playing together in 1964"}
- card: afrobeat
  copy: male
  fact: "They recorded more than thirty albums together"
  sources:
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "recorded over 30 albums with him and the Africa '70 band"}
    - {title: "Al Jazeera: Nigerian Afrobeat pioneer Tony Allen dies aged 79 (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "recorded more than 30 albums with Kuti and his group, Africa '70"}
- card: afrobeat
  copy: male
  fact: "Fela said that without Tony Allen there would be no afrobeat"
  sources:
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "\"Without Tony Allen, there would be no afrobeat,\" Fela once said."}
    - {title: "Al Jazeera: Nigerian Afrobeat pioneer Tony Allen dies aged 79 (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "once said that 'without Tony Allen, there would be no Afrobeat'"}
- card: afrobeat
  copy: both
  fact: "After the album Zombie mocked the army, the government's forces attacked Fela's commune"
  sources:
    - {title: "Scroll.in: The art of resistance, Zombie by Fela Kuti", url: "https://scroll.in/article/948202/the-art-of-resistance-zombie-by-fela-kuti-questions-repressive-governments", quote: "As a result, the government forces attacked Kuti's commune leaving him and his followers severely injured."}
    - {title: "Classic Album Sundays: Fela Kuti, Gentleman and Zombie", url: "https://classicalbumsundays.com/album-of-the-month-fela-kuti-gentleman-zombie/", quote: "a searing attack on the Nigerian army, whom he likened to mindless zombies ... lit the fuse on the most vicious period of attacks against Fela and his family"}
- card: afrobeat
  copy: both
  fact: "In February 1977 about a thousand soldiers stormed and razed the Kalakuta Republic commune and threw Fela's mother from a window"
  sources:
    - {title: "Fela Kuti official site: story, 1977", url: "https://felakuti.com/story/1977", quote: "On 18 February, in an unprecedently brutal assault, 1,000 soldiers batter their way into Kalakuta and raze it to the ground. ... throw his 77-year old mother out of a second floor window."}
    - {title: "Encyclopedia.com (Women in World History): Ransome-Kuti, Funmilayo", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "Ransome-Kuti was staying at her son's house in February 1977 when some 1,000 soldiers arrived to confront him. ... soldiers threw Ransome-Kuti from a second-story window."}
    - {title: "Treble: Fela Kuti's Coffin for Head of State", url: "https://www.treblezine.com/fela-kutis-coffin-for-head-of-state-was-genuine-life-and-death-protest-music/", quote: "On February 18, the military raided the Kalakuta Republic ... burned the compound and threw Kuti's mother out of a window."}
- card: afrobeat
  copy: both
  fact: "She died of her injuries in 1978"
  sources:
    - {title: "Fela Kuti official site: story, 1978", url: "https://felakuti.com/story/1978", quote: "On 13 April, Fela's mother dies from injuries she suffered during the attack."}
    - {title: "Al Jazeera: The Lioness of Lisabi (2020)", url: "https://www.aljazeera.com/features/2020/10/1/the-lioness-of-lisabi-who-ended-unfair-taxes-for-nigerian-women", quote: "She sustained injuries from which she never recovered and died at the General Hospital in Lagos on April 13, 1978."}
- card: afrobeat
  copy: male
  fact: "Allen left at the end of the 1970s after rows over royalties"
  sources:
    - {title: "uDiscover Music: Tony Allen dead at 79 (2020)", url: "https://udiscovermusic.com/news/tony-allen-afrobeat-dead-79", quote: "Allen left the band in 1979, after reported rifts with the band leader over royalties."}
    - {title: "NME: Tony Allen, 1940-2020 (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "[the group] fell apart [at the 1978 Berlin Jazz Festival over] royalty payments"}
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "The musician parted ways with Fela in 1979 and formed his own group."}
  note: "Sources date the break 1978, 1979 or (Mixmag) a parting that ran to 1980; the body says 'the end of the 1970s' instead of a single year."
- card: afrobeat
  copy: male
  fact: "Allen settled in Paris and played on worldwide"
  sources:
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "He later moved to Paris and collaborated with a number of renowned African artists"}
    - {title: "Mixmag: RIP Tony Allen (2020)", url: "https://mixmag.net/feature/tony-allen-drummer-afrobeat-obituary", quote: "That decision would spur on his move to Europe, eventually settling in Paris via London. ... collaborate with Damon Albarn, Flea from Red Hot Chilli Peppers, Paul Simonon and Simon Tong"}
- card: afrobeat
  copy: male
  fact: "Brian Eno called him perhaps the greatest drummer who has ever lived"
  sources:
    - {title: "uDiscover Music: Tony Allen dead at 79 (2020)", url: "https://udiscovermusic.com/news/tony-allen-afrobeat-dead-79", quote: "perhaps the greatest drummer who has ever lived"}
    - {title: "Al Jazeera: Nigerian Afrobeat pioneer Tony Allen dies aged 79 (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "Eno called Allen \"perhaps the greatest drummer who has ever lived.\""}
- card: afrobeat
  copy: male
  fact: "Allen died in Paris in 2020"
  sources:
    - {title: "OkayAfrica: Tony Allen has died (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "passed away on Thursday night in Paris. He was 79."}
    - {title: "Al Jazeera: Nigerian Afrobeat pioneer Tony Allen dies aged 79 (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "died on Wednesday evening in Paris of a heart attack"}
  note: "The day differs between outlets (manager's statement); the place and year agree."
- card: afrobeat
  copy: female
  fact: "In 1946 Funmilayo Ransome-Kuti turned a ladies' club in Abeokuta into the Abeokuta Women's Union"
  sources:
    - {title: "Encyclopedia.com (Women in World History): Ransome-Kuti, Funmilayo", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "In 1946, Ransome-Kuti renamed her group the Abeokuta Women's Union (AWU) ... she had founded the Abeokuta Ladies' Club in 1942"}
    - {title: "New Lines Magazine: How Funmilayo Ransome-Kuti championed women's rights", url: "https://newlinesmag.com/essays/how-funmilayo-ransome-kuti-championed-womens-rights/", quote: "The formal renaming of the club to the Abeokuta Women's Union in 1946 reflected that change in ideology."}
    - {title: "Al Jazeera: The Lioness of Lisabi (2020)", url: "https://www.aljazeera.com/features/2020/10/1/the-lioness-of-lisabi-who-ended-unfair-taxes-for-nigerian-women", quote: "Ransome-Kuti formed the AWU in 1946"}
- card: afrobeat
  copy: female
  fact: "She led the town's market women against a flat tax on women imposed by the British"
  sources:
    - {title: "Encyclopedia.com (Women in World History): Ransome-Kuti, Funmilayo", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "a special flat tax on women imposed by the British"}
    - {title: "New Lines Magazine: How Funmilayo Ransome-Kuti championed women's rights", url: "https://newlinesmag.com/essays/how-funmilayo-ransome-kuti-championed-womens-rights/", quote: "the suspension of the flat tax on women ... Market women were subjected to police seizures of their produce"}
- card: afrobeat
  copy: female
  fact: "Thousands of women marched on the palace of the Alake, the town's king"
  sources:
    - {title: "Encyclopedia.com (Women in World History): Ransome-Kuti, Funmilayo", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "On November 29, 1947, thousands of women marched on the palace of the alake."}
    - {title: "Al Jazeera: The Lioness of Lisabi (2020)", url: "https://www.aljazeera.com/features/2020/10/1/the-lioness-of-lisabi-who-ended-unfair-taxes-for-nigerian-women", quote: "laid siege to the palace of Oba Ademola II, where they chanted war songs day and night"}
- card: afrobeat
  copy: female
  fact: "The tax was suspended, and in 1949 the Alake abdicated"
  note: "Reordered by the second check: the suspension came first (1948, Encyclopedia.com), the abdication in January 1949."
  sources:
    - {title: "New Lines Magazine: How Funmilayo Ransome-Kuti championed women's rights", url: "https://newlinesmag.com/essays/how-funmilayo-ransome-kuti-championed-womens-rights/", quote: "The Women's Revolt ended in 1949, with Ademola abdicating, the suspension of the flat tax on women and the admittance of women to the local council."}
    - {title: "Encyclopedia.com (Women in World History): Ransome-Kuti, Funmilayo", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "Shaken by this demonstration, the alake suspended taxation. ... The following January, Alake Ademola abdicated."}
    - {title: "Al Jazeera: The Lioness of Lisabi (2020)", url: "https://www.aljazeera.com/features/2020/10/1/the-lioness-of-lisabi-who-ended-unfair-taxes-for-nigerian-women", quote: "He suspended the taxation of women ... the tax protests which led to his abdication"}
- card: afrobeat
  copy: female
  fact: "Fela laid a coffin for her at the military government's headquarters"
  sources:
    - {title: "Fela Kuti official site: story, 1979", url: "https://felakuti.com/story/1979", quote: "deposit a symbolic coffin outside Nigerian head of state General Obasanjo's headquarters at Dodan Army Barracks"}
    - {title: "Treble: Fela Kuti's Coffin for Head of State", url: "https://www.treblezine.com/fela-kutis-coffin-for-head-of-state-was-genuine-life-and-death-protest-music/", quote: "Kuti brought a coffin representing her to the Dodan barracks, where Obasanjo"}
    - {title: "PAM: Fela's stories, Coffin for Head of State", url: "https://pan-african-music.com/en/felas-stories-coffin-for-head-of-state/", quote: "Symbolically, in memory of his mother, the \"Black President\" and his own family deposited a coffin ... in front of the headquarters of the military government"}
- card: afrobeat
  copy: female
  fact: "He made the protest an album, Coffin for Head of State"
  sources:
    - {title: "PAM: Fela's stories, Coffin for Head of State", url: "https://pan-african-music.com/en/felas-stories-coffin-for-head-of-state/", quote: "\"Coffin for Head of State\" was released in 1981, three years after the defenestration."}
    - {title: "Treble: Fela Kuti's Coffin for Head of State", url: "https://www.treblezine.com/fela-kutis-coffin-for-head-of-state-was-genuine-life-and-death-protest-music/", quote: "[title] Fela Kuti's \"Coffin for Head of State\" was genuine life-and-death protest music ... Kuti brought a coffin representing her to the Dodan barracks"}
  note: "Release year differs (1980 on felakuti.com, 1981 on PAM), so the body gives none."
- card: afrobeat
  copy: both
  fact: "Fela died in 1997, and hundreds of thousands of people came out in Lagos for his funeral"
  sources:
    - {title: "Fela Kuti official site: story, 1997", url: "https://felakuti.com/story/1997", quote: "On 2 August, Fela dies. ... An estimated hundred and fifty thousand people gather in Tafawa Balewa Square ... over a million others line the route"}
    - {title: "IFRA-Nigeria, OpenEdition Books: chapter 6, The Afrobeat Continuum", url: "https://books.openedition.org/ifra/527", quote: "Fela died on August 2, 1997. ... over half a million people paid their last respects [at Tafawa Balewa Square]"}
