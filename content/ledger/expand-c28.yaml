    - {title: "BlackPast, Erica Anderson: Katherine Dunham (1909–2006) (2007)", url: "https://blackpast.org/african-american-history/dunham-katherine-1909-2006/", quote: "Dunham graduated from the University of Chicago in 1936 with a bachelor’s degree in social anthropology"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "Dunham era antropóloga e ativista social nos Estados Unidos"}
- card: dunham-esplanada-1950
  fact: "Her art grew out of fieldwork on the dances of the Caribbean"
  sources:
    - {title: "Encyclopaedia Britannica: Katherine Dunham", url: "https://www.britannica.com/biography/Katherine-Dunham", quote: "On graduating with a bachelor’s degree in anthropology she undertook field studies in the Caribbean and in Brazil"}
    - {title: "BlackPast, Erica Anderson: Katherine Dunham (1909–2006) (2007)", url: "https://blackpast.org/african-american-history/dunham-katherine-1909-2006/", quote: "Dunham was granted a Rosenwald Travel Fellowship to do field research in the West Indies on dance and anthropology"}
- card: dunham-esplanada-1950
  fact: "In July 1950 she came to São Paulo to perform at the Municipal Theatre"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "em 11 julho de 1950, a turnê que a célebre dançarina e coreógrafa americana Katherine Dunham fazia pelo Brasil"}
    - {title: "American Historical Association, 131st Annual Meeting (2017), Jerry Dávila: Defining and Denouncing Racial Discrimination in Brazil: The Debate Surrounding the Katherine Dunham Case", url: "https://aha.confex.com/aha/2017/webprogram/Paper20947.html", quote: "In 1950, African-American dancer Katherine Dunham was denied a room at the Hotel Esplanada adjoining the São Paulo Municipal Theater where she was to perform."}
- card: dunham-esplanada-1950
  fact: "The Esplanada, the luxury hotel next to the theatre, refused her a room because she was Black (also wow)"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "o gerente do Esplanada, o luxuoso hotel vizinho do teatro , se recusara a hospedá-la ao descobrir que era uma \"mulher de cor\""}
    - {title: "American Historical Association, 131st Annual Meeting (2017), Jerry Dávila: Defining and Denouncing Racial Discrimination in Brazil: The Debate Surrounding the Katherine Dunham Case", url: "https://aha.confex.com/aha/2017/webprogram/Paper20947.html", quote: "Katherine Dunham was denied a room at the Hotel Esplanada adjoining the São Paulo Municipal Theater"}
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "She had a reservation at the very fancy hotel in Sao Paulo, the Esplanada Hotel. And when she arrived, she was told that there was no place there for her."}
- card: dunham-esplanada-1950
  fact: "She told reporters / took it to the press (also wow)"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "fazer uma denúncia aos repórteres que cobriam o espetáculo"}
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "Dunham and the director who had invited her took what happened at the hotel to the press."}
- card: dunham-esplanada-1950
  fact: "The story caused a storm in the press"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "A denúncia de racismo caiu no Brasil como uma bomba."}
    - {title: "American Historical Association, 131st Annual Meeting (2017), Jerry Dávila: Defining and Denouncing Racial Discrimination in Brazil: The Debate Surrounding the Katherine Dunham Case", url: "https://aha.confex.com/aha/2017/webprogram/Paper20947.html", quote: "The incident received unusually intense interest from the press and from politicians"}
- card: dunham-esplanada-1950
  fact: "Gilberto Freyre, champion of Brazil's image of racial harmony, joined the protest"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "O ensaio Casa Grande e Senzala , publicado em 1933, ajudou a dar força ao mito da democracia racial."}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "o fato não deve ficar sem uma palavra de protesto nacional nesta Casa"}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "public figures like Afonso Arinos and Gilberto Freyre discussed the need for the law"}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "a supposed antiracist tradition which many, especially Freyre, attributed to Portuguese culture"}
- card: dunham-esplanada-1950
  fact: "Congressman Afonso Arinos drafted a bill against racial discrimination"
  sources:
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "named after the legislator who drafted it in the aftermath of a 1950 case of racial discrimination at the Esplanada Hotel in São Paulo against African American dancer Katherine Dunham"}
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "it got the attention of Afonso Arinos, a famous intellectual and legislator. He sponsored a bill that made racism into a crime"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "ele apresentou à Câmara dos Deputados um projeto de lei"}
- card: dunham-esplanada-1950
  fact: "In July 1951 President Getúlio Vargas signed it as Law 1.390 (also wow: a year later)"
  sources:
    - {title: "Fundação Cultural Palmares: Lei Afonso Arinos completa 61 anos (9 July 2012), via archive.org", url: "https://web.archive.org/web/20130629113518/http://www.palmares.gov.br/2012/07/lei-afonso-arinos-completa-61-anos/", quote: "Sancionada pelo então presidente Getúlio Vargas, em julho de 1951, a Lei 1.390"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "Em 3 de julho de 1951, um ano depois do \"revoltante incidente\" no Hotel Esplanada, o texto aprovado ganhou a assinatura do presidente Getúlio Vargas"}
- card: dunham-esplanada-1950
  fact: "Refusing service in a shop or hotel because of race or colour became a punishable offence"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "quem recusasse hospedagem em hotel, entrada em estabelecimento comercial, matrícula em escola ou contratação em empresa pública ou privada, desde que \"por preconceito de raça ou de cor\", poderia ser condenado"}
    - {title: "Fundação Cultural Palmares: Lei Afonso Arinos completa 61 anos (9 July 2012), via archive.org", url: "https://web.archive.org/web/20130629113518/http://www.palmares.gov.br/2012/07/lei-afonso-arinos-completa-61-anos/", quote: "nenhum estabelecimento comercial pode deixar de atender um cliente ou maltratá-lo pelo preconceito de cor"}
    - {title: "American Historical Association, 131st Annual Meeting (2017), Jerry Dávila: Defining and Denouncing Racial Discrimination in Brazil: The Debate Surrounding the Katherine Dunham Case", url: "https://aha.confex.com/aha/2017/webprogram/Paper20947.html", quote: "the Afonso Arinos law barring racial discrimination in public sector employment and public accommodations"}
- card: dunham-esplanada-1950
  fact: "It was Brazil's first law against racial discrimination (also wow)"
  sources:
    - {title: "Fundação Cultural Palmares: Lei Afonso Arinos completa 61 anos (9 July 2012), via archive.org", url: "https://web.archive.org/web/20130629113518/http://www.palmares.gov.br/2012/07/lei-afonso-arinos-completa-61-anos/", quote: "foi o primeiro código brasileiro a incluir entre as contravenções penais a prática de atos resultantes de preconceitos de raça ou de cor"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "A Lei Afonso Arinos surgiu como a primeira norma destinada a punir e inibir atos racistas."}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "the first law barring racial discrimination was in effect"}
- card: dunham-esplanada-1950
  fact: "It was seldom enforced and few cases came to trial"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "meras 23 pessoas acusadas de transgredir a Lei Afonso Arinos se sentaram no banco dos réus entre 1951 e 1989"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "delegados de polícia e juízes não fizeram a lei valer"}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "nearly two dozen cases against discrimination were taken to trial between 1951 and 1988"}
- card: dunham-esplanada-1950
  fact: "It stayed in force until it was replaced in 1989"
  sources:
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "Até ser revogada, em 1989, a Lei Afonso Arinos não saiu do papel."}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "in the decades between 1951 and 1989 during which the first law barring racial discrimination was in effect"}
- card: dunham-esplanada-1950
  fact: "The 1988 constitution made racism a crime without bail or statute of limitations"
  sources:
    - {title: "Fundação Cultural Palmares: Lei Afonso Arinos completa 61 anos (9 July 2012), via archive.org", url: "https://web.archive.org/web/20130629113518/http://www.palmares.gov.br/2012/07/lei-afonso-arinos-completa-61-anos/", quote: "a prática do racismo constitui crime inafiançável e imprescritível"}
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "Racism is a criminal offense in Brazil. Discrimination on the basis of skin color is even defined in the country's constitution."}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "the 1988 law made discrimination a criminal act"}
