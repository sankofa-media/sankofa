# Batch c28 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a verbatim quote.
# Dropped: none.

- card: haiti-indemnity-1825
  fact: "In 1804 the formerly enslaved people of Saint-Domingue declared independence as Haiti"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "In 1804 Haiti is declared independent by its formerly enslaved people of African origin"}
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "Haiti gained independence from France in 1804"}
- card: haiti-indemnity-1825
  fact: "France did not recognise the new state; it later demanded payment as the price of recognition"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "France under Napoleon and then the Restoration continued, however, to regard the new black s tate as a rebel colony"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "The treaty introduced a new payment schedule and recognized Haiti’s independence, even before Haiti settled its debt."}
- card: haiti-indemnity-1825
  fact: "In April 1825 France demanded 150 million francs for recognition, to compensate the former colonists (also wow)"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "in his Decree of 17 April, 1825 for recognition of the independence of the ‘French part of Saint-Domingue’"}
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The total indemnity to be settled amounted to 150 million francs"}
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "On April 17, 1825, besieged by French warships, Haiti agreed to pay an indemnity of 150 million gold francs to the European power. Officially, the payment was meant to compensate French plantation owners"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "the indemnity that France demanded from Haiti to compensate former colonists"}
- card: haiti-indemnity-1825
  fact: "Haiti accepted in July 1825 as a French squadron approached, threatening a blockade of its ports (also wow: warships)"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "On 8 July of the same year, as a squadron approached, armed with 500 cannons and threatening to blockade Haiti’s ports should these demands not be met, President Boyer accepted the conditions"}
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "besieged by French warships, Haiti agreed to pay an indemnity of 150 million gold francs"}
- card: haiti-indemnity-1825
  fact: "To pay the first instalment Haiti borrowed 30 million francs in Paris and received only 24 million after commissions"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "it had to take out a loan in November, 1825 of 30 million francs on the French market"}
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "Haiti only received 24 million of it once bank commissions had been deducted"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "To pay the indemnity, Haiti borrowed 30 million francs from a consortium of banks, including the Rothschilds, in 1825. The bankers kept six million francs as a commission, leaving Haiti with only 24 million francs"}
- card: haiti-indemnity-1825
  fact: "The indemnity and the loan together became the 'double debt'"
  sources:
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "Haiti’s “double debt.” This debt, which began in 1825, includes the indemnity that France demanded from Haiti to compensate former colonists and the loan"}
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "France pushed its banks to lend it money, what we call a “double debt,”"}
- card: haiti-indemnity-1825
  fact: "In 1838 a new treaty cut the indemnity to 90 million francs and recognised Haitian independence"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "Finally, in 1838, France recognised Haiti’s independence, unconditionally this time. The total indemnity was renegotiated downwards (to 90 million francs)"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "Payments made on the 150-million-franc indemnity, which was later reduced to 90 million francs"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "In 1838, after years of negotiations, France and Haiti signed a new treaty that reduced the unpaid remainder of the indemnity debt to 60 million francs"}
- card: haiti-indemnity-1825
  fact: "Payments dragged on through defaults and new schedules"
  sources:
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "In 1843, Haiti defaulted on the indemnity payment and the principal and interest of the 1825 loan after its president was ousted"}
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "From that very moment and for a whole decade, Haiti – insolvable – was doubly in default on payments due"}
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "New payment schedules were also adopted both for the indemnity"}
- card: haiti-indemnity-1825
  fact: "The last indemnity payment was made in 1878 and the 1825 loan was paid off in 1887–88 (also wow: more than half a century)"
  sources:
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The independence debt is finally paid off by Haiti in 1878 by way of a loan raised on the French market in 1875. The external loans of 1825 and 1875 are, respectively, paid off in 1887-88"}
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "In 1878, Haiti’s government made the last payment on the indemnity. Then in 1887, it said that it had paid off the loan — though a final, small amount of interest and late fees was paid the next year."}
- card: haiti-indemnity-1825
  fact: "Former slaves paid their former masters for independence"
  sources:
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "“France forced the winners of Haiti’s independence – the former slaves – to compensate the losers, their former masters,”"}
    - {title: "BnF, France-Amériques: Gusti-Klara Gaillard-Pourchet, Haiti's independence debt and the slave unit of account (1794–1922)", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The first is carried out to benefit both the ex-colonists (or their heirs) who had owned land and slaves, and their creditors"}
- card: haiti-indemnity-1825
  fact: "In 2022 the New York Times reconstructed the payment record from French archives"
  sources:
    - {title: "The New York Times, Historical data on Haiti's double debt (GitHub, nytimes/haiti-debt)", url: "https://github.com/nytimes/haiti-debt", quote: "Relying on archival sources, we tabulated how much money Haitians paid to the families of their former colonial overlords"}
    - {title: "PBS NewsHour: Hundreds of years after Haiti paid to be free from slavery, the costs are still being felt (2022)", url: "https://www.pbs.org/newshour/show/hundreds-of-years-after-haiti-paid-to-be-free-from-slavery-the-costs-are-still-being-felt", quote: "The New York Times recently conducted an unprecedented investigation into those root causes"}
    - {title: "UN News: calls for restitution two centuries after France imposed Haiti's independence debt (17 April 2025)", url: "https://news.un.org/en/story/2025/04/1162406", quote: "An in-depth 2022 investigation by The New York Times found that Haiti’s payments to France"}
- card: andrew-watson
  fact: "In the 1870s football's rules were still being settled"
  sources:
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "It was a time before professionalism, when the sport was still evolving and a single set of rules was yet to be universally adopted."}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "he began playing football in Glasgow in 1874"}
- card: andrew-watson
  fact: "Born in Georgetown, Demerara, British Guiana, in 1856 or 1857, to Scottish planter Peter Miller and local woman Rose Watson (also wow)"
  sources:
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "Born in Demerara, British Guiana (now Guyana) on 18 May 1857, Andrew was the son of Scottish sugar plantation manager and former slave owner Peter Miller and local girl Rose Watson."}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "his parents were Peter Miller, a Glasgow sugar merchant, and Rose Watson"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "Watson was born in 1856, in Georgetown, Demerara"}
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "Born in British Guiana, Andrew was brought to the UK by his Scottish father"}
- card: andrew-watson
  fact: "He was schooled in Halifax and London and in 1875 began studying natural philosophy, mathematics and engineering at Glasgow University"
  sources:
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "Andrew left Wimbledon in 1875 to study natural philosophy, mathematics, civil engineering and mechanics at Glasgow University"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "Watson attended Heath Grammar School in Halifax, West Yorkshire, and went on to study at King's College, London, as well as Glasgow University"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "educated at King's College, London and Glasgow University where he studied Natural Philosophy, Mathematics and Civil Engineering and Mechanics"}
- card: andrew-watson
  fact: "A full back, he joined Queen's Park, the leading club, and won three Scottish Cups"
  sources:
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "A strong and composed full back, Watson won three Scottish Cups and four Glasgow Charity Cups with Queen’s Park"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "before he was picked up by the then dominant Queen's Park ... He won three Scottish Cups with the Spiders"}
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "He joined Queen’s Park – the country’s premier side"}
- card: andrew-watson
  fact: "On 12 March 1881 he captained Scotland to a 6–1 win over England at the Kennington Oval (also wow)"
  sources:
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "captained Scotland to a 6-1 victory over England at the Oval in 1881"}
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "his international debut for Scotland in a 6-1 victory over England on 12 March 1881 at the Kennington Oval"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "the fact he captained the side to a 6-1 away win over England"}
- card: andrew-watson
  fact: "He played twice more for Scotland and won both times"
  sources:
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "Watson played twice more for Scotland (a 5-1 win against Wales in 1881 and a 5-1 win against England in 1882)"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "Watson also played in a 5-1 win in Wales and again helped thrash the English by the same scoreline at Hampden one year after his debut"}
- card: andrew-watson
  fact: "He was invited into the Corinthians, an exclusive amateur club set up to raise the standard of English football"
  sources:
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "Watson was invited to tour with Corinthians, who were as much an exclusive gentlemen's club, with just 50 members, as football team"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "a team set up with the sole aim of improving English football"}
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "to be invited in to join the exclusive Corinthians club"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "They turned to Watson to show them the way as a new elite amateur team was formed"}
- card: andrew-watson
  fact: "He trained as a marine engineer and went to sea"
  sources:
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "where he worked as a maritime engineer and played for Bootle FC"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "retired from football and trained as a maritime engineer. He went to sea"}
- card: andrew-watson
  fact: "He died in 1921"
  sources:
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "1856 — 1921"}
    - {title: "Black History Month UK: Andrew Watson, first black international footballer", url: "https://www.blackhistorymonth.org.uk/article/section/sporting-heroes/andrew-watson-first-black-international-footballer/", quote: "died of pneumonia at 88 Forest Road on 8 March 1921, aged 64"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "His death was announced in 1921 in The Richmond and Twickenham Times"}
- card: andrew-watson
  fact: "For more than a century his achievement went unrecognised, until researchers restored him to history"
  sources:
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "but for more than a century the significance of his achievements went unrecognised. Research conducted over the past three decades has left us with some biographical details"}
    - {title: "BBC Sport: Scotland's first black player (2004)", url: "https://news.bbc.co.uk/sport2/hi/football/internationals/scotland/3751759.stm", quote: "Watson's colour was not recognised until last year when a director of the Scottish Football Association museum, Ged O'Brien, spotted him in a picture"}
- card: andrew-watson
  fact: "He was the world's first Black international footballer (also wow)"
  sources:
    - {title: "Scottish Football Museum, Hall of Fame: Andrew Watson", url: "https://scottishfootballmuseum.org.uk/exhibitions/hall-of-fame/andrew-watson", quote: "The world’s first black international footballer"}
    - {title: "BBC Sport, Andrew Aloia: Andrew Watson, the 'most influential' black footballer for decades lost to history (2021)", url: "https://www.bbc.co.uk/sport/football/58841184", quote: "He was a pioneer, the world's first black international"}
- card: josephine-bakhita
  fact: "In the 1870s people were bought and sold in the markets of El Obeid and Khartoum; she was sold again and again (also wow: slave markets of Sudan)"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "Sold and resold in the markets of El Obeid and of Khartoum, she experienced the humiliations and sufferings of slavery"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "She became human merchandise passed from hand to hand in the markets of El Obeid and Khartoum"}
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "sold five times in the slave-markets of Sudan"}
- card: josephine-bakhita
  fact: "Born around 1869 in a village in Darfur, she was kidnapped at about nine (also wow)"
  sources:
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "She was born around 1869—she herself did not know the precise date—in Darfur in Sudan. At the age of nine, she was kidnapped by slave-traders"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "that terrified 9-year-old girl forgot everything, even her name ... the child born in 1869 in a village of Darfur"}
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "Mother Josephine Bakhita was born in Sudan in 1869"}
- card: josephine-bakhita
  fact: "She forgot her own name; her captors called her Bakhita, 'fortunate'"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "The fright and the terrible experiences she went through made her forget the name she was given by her parents ... Bakhita, which means fortunate, was the name given to her by her kidnappers."}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "“Bakhita,” they called her, Arabic for “fortunate one,”"}
- card: josephine-bakhita
  fact: "In 1882 in Khartoum the Italian consul Callisto Legnani bought her"
  sources:
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "Finally, in 1882, she was bought by an Italian merchant for the Italian consul Callisto Legnani"}
    - {title: "L'Osservatore Romano, 14 February 2020, via EWTN: Saint Josephine Bakhita", url: "https://www.ewtn.com/catholicism/library/saint-josephine-bakhita-14256", quote: "in 1882, she was bought by Callisto Legnani, an Italian consular agent in Sudan"}
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "In the Capital of Sudan, Bakhita was bought by an Italian Consul, Callisto Legnani"}
- card: josephine-bakhita
  fact: "When the Mahdist advance forced him home, she asked to go with him to Italy"
  sources:
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "who returned to Italy as the Mahdists advanced"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "was obliged to return to Italy because of the Mahdist wars in Sudan. Bakhita remembered the moment: “I dared to ask him to take me with him to Italy.”"}
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "Political situations forced the Consul to leave for Italy. Bakhita asked and obtained permission to go with him"}
- card: josephine-bakhita
  fact: "She became nanny to the Michieli family's daughter near Venice"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "She followed the new family, which settled in Zianigo (near Mirano Veneto) ... When their daughter Mimmina was born, Bakhita became her babysitter and friend."}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "She became the nanny of Alice, the daughter of the Michieli family, who were friends of the Legnamis and lived in Zianigo, near Mirano"}
- card: josephine-bakhita
  fact: "While the family went to Africa she was left with the Canossian Sisters in Venice"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "Mimmina and Bakhita were entrusted to the Canossian Sisters of the Institute of the Catechumens in Venice"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "In 1888, the couple she worked for had to leave for Africa, and for nine months, Bakhita and Alice were left in the care of the Canossian Sisters of Venice"}
- card: josephine-bakhita
  fact: "When Signora Michieli came back for her, Bakhita refused to leave (also wow)"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "When Mrs. Michieli returned from Africa to take back her daughter and Bakhita, the latter, with unusual firmness and courage, expressed her desire to remain with the Canossian Sisters"}
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "Hence, when she was about to be taken back to Sudan, Bakhita refused"}
- card: josephine-bakhita
  fact: "She was baptised Josephine on 9 January 1890 and joined the order"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "was given the new name, Josephine. It was January 9, 1890"}
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "On 9 January 1890, she was baptized and confirmed"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "In 1893 she entered the novitiate of the Canossian Sisters. Three years later she professed her vows"}
- card: josephine-bakhita
  fact: "For more than four decades she lived at the Schio convent as cook, seamstress and doorkeeper, greeting children"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "lived in the community in Schio, engaged in various services: cooking, sewing, embroidery and attending to the door. When she was on duty at the door, she would gently lay her hands on the heads of the children"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "spent the following 45 years as the cook, sacristan, and especially, the doorkeeper of the convent at Schio"}
- card: josephine-bakhita
  fact: "Schio knew her as Madre Moretta"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "In Schio (Vicenza), where she spent many years of her life, everyone still calls her our Black Mother."}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "the goodness and faith of the moretta, the “little brown sister,”"}
- card: josephine-bakhita
  fact: "She died at Schio on 8 February 1947"
  sources:
    - {title: "Holy See, canonisation biography: Josephine Bakhita (1869–1947)", url: "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_giuseppina-bakhita_en.html", quote: "Mother Bakhita breathed her last on February 8, 1947 at the Canossian Convent"}
    - {title: "Vatican News, Saint of the day: St. Josephine Bakhita", url: "https://www.vaticannews.va/en/saints/02/08/st--josephine-bakhita--virgin.html", quote: "All Schio was in mourning when Sr. Josephine Bakhita died of pneumonia on February 8, 1947."}
- card: josephine-bakhita
  fact: "Pope John Paul II canonised her on 1 October 2000 (also wow)"
  sources:
    - {title: "L'Osservatore Romano, 14 February 2020, via EWTN: Saint Josephine Bakhita", url: "https://www.ewtn.com/catholicism/library/saint-josephine-bakhita-14256", quote: "on 1 October of the Great Ju­bilee of the Year 2000 she was made a saint by John Paul II"}
    - {title: "Benedict XVI, encyclical Spe salvi, §3 (2007)", url: "https://www.vatican.va/content/benedict-xvi/en/encyclicals/documents/hf_ben-xvi_enc_20071130_spe-salvi.html", quote: "the African Josephine Bakhita, canonized by Pope John Paul II"}
- card: malik-ambar
  fact: "Deccan sultanates bought enslaved Africans from the Ethiopian highlands (Habshis) as soldiers; Ambar was one of them"
  sources:
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Eaton notes that the Deccan sultanates were systematically recruiting the Habshis as slaves in the 16th century. They were highly valued for their physical strength and loyalty, and were frequently put to military service."}
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "Malik Ambar was among the tens of thousands of men, women, and children captured in Africa and sold into slavery in the Middle East and India"}
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "ten thousand Habshi (fellow Africans)"}
- card: malik-ambar
  fact: "Born Chapu in Ethiopia in 1548"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "Born Chapu in 1548 in Harar Province, Ethiopia"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Born in 1548 in southern Ethiopia’s Khambata region ... He was known by the name of ‘Chapu’"}
- card: malik-ambar
  fact: "Sold at Mocha, taken to Baghdad, educated by a merchant, made a Muslim and named Ambar (also wow)"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "taken across the Red Sea to the port of Mocha in southern Arabia (Yemen). He was re-sold and sent to Baghdad, where he was educated"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Chapu was sold in the Red Sea port of Mocha (in Yemen) ... From there, he was taken to Baghdad and “sold to a prominent merchant who, recognising Chapu’s superior intellectual qualities, raised and educated the youth, converted him to Islam, and gave him the name ‘Ambar’.”"}
- card: malik-ambar
  fact: "In the Deccan he was bought by Chengiz Khan, a former Ethiopian slave and chief minister of Ahmadnagar"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "sent to India to serve Chengiz Khan, the Regent Minister of the Sultan of Nizam Shahi in Ahmadnagar ... Khan, an Ethiopian like himself who converted to Islam, but—unlike Ambar—was no longer enslaved"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Here he was purchased by a certain Chengiz Khan. Khan himself was a former slave who had risen to hold the office of Peshwa, or chief minister of the Nizam Shahi sultanate of Ahmadnagar"}
- card: malik-ambar
  fact: "Freed after his master's death, he raised his own troops"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "Upon Khan’s death in approximately 1594, Ambar was manumitted ... by 1595, he commanded a cavalry force of 150 men"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Ambar’s master and patron Chenghiz Khan died, and Ambar was set free ... he was given charge of a small troop"}
- card: malik-ambar
  fact: "Around 1600 he led the resistance to the Mughal push south, with Marathas fighting beside Africans"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "By 1600 the African, now a full-fledged mercenary general, emerged as the leading figure in the resistance movement against the spread of the Mughal Empire into the Deccan"}
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "By 1620, Ambar’s army numbered fifty thousand men; forty thousand Marathas (Hindu warriors); and ten thousand Habshi"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "by 1600, this number rose to almost 7,000, now including Marathas and other Dakhnis"}
- card: malik-ambar
  fact: "Ruling through sultans he installed, he was the real power in Ahmadnagar (also wow)"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "he had already installed two young princes to the Nizam’s throne in succession, each time making himself Regent Minister, and, unlike his former master, functioning as de facto ruler"}
    - {title: "Victoria and Albert Museum: Jahangir shooting at the head of Malik Ambar, IM.284-1914", url: "https://collections.vam.ac.uk/item/O405533/", quote: "This former slave of African origin had risen to be the effective ruler of the Deccan sultanate of Ahmadnagar"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Ambar emerged as the principal force in what used to be the Ahmednagar state"}
- card: malik-ambar
  fact: "He beat Mughal armies again and again (also wow)"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "Defeating in battle the armies of two Mughal emperors, Akbar and Jahangir"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "‘general after general’ were dispatched from Delhi towards the south to beat the Ethiopian, but failed. “The more times he defeated superior Mughal armies, the more men rallied to his side"}
    - {title: "Victoria and Albert Museum: Jahangir shooting at the head of Malik Ambar, IM.284-1914", url: "https://collections.vam.ac.uk/item/O405533/", quote: "Jahangir was enraged by Malik Ambar's ability to repel the Mughal army"}
- card: malik-ambar
  fact: "He built a new capital, Khadki, with waterworks; it later became Aurangabad"
  sources:
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "Ambar founded the city of Khadki (the future site of Aurangabad), where he built several palaces, developed an irrigation system"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Ambar established a new capital, a city named Khirki (present-day Aurangabad in Maharashtra) ... “Waterworks and an underground canal were among the early developments he brought about"}
- card: malik-ambar
  fact: "Jahangir called him 'the black-fated'"
  sources:
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "the one he lambasts as “the ill-starred” and “the black fated”"}
    - {title: "BlackPast, Omar H. Ali: Malik Ambar (1548–1627)", url: "https://blackpast.org/global-african-history/ambar-malik-1548-1626/", quote: "who referred to their indomitable foe as the “rebel of black fortune.”"}
- card: malik-ambar
  fact: "Around 1616–20 a court painter, probably Abu'l Hasan, showed Jahangir shooting arrows at Ambar's severed head; the painting is in the Chester Beatty, Dublin (also wow)"
  sources:
    - {title: "Victoria and Albert Museum: Jahangir shooting at the head of Malik Ambar, IM.284-1914", url: "https://collections.vam.ac.uk/item/O405533/", quote: "adapted from a painting done for the Mughal emperor Jahangir (r. 1605-1627) between about 1616 and 1620. The original, now in the Chester Beatty Library in Dublin ... It represents the emperor shooting an arrow at the head of his major enemy, Malik Ambar"}
    - {title: "LACMA: Emperor Jahangir Triumphing Over Poverty, M.75.4.28 (curatorial notes)", url: "https://collections.lacma.org/object/34094", quote: "(for example, see Jahangir Shoots the Head of Malik Ambar , c. 1616-1620, Chester Beatty Library, Dublin, In 07A.15)"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "Among several allegorical paintings created by Abu’l Hasan, a chief painter at Emperor Jahangir’s court, is one depicting the Mughal sovereign shooting arrows at the severed head of an Abyssinian slave. Created somewhere in 1620"}
    - {title: "Google Arts & Culture (Freer Gallery of Art): Jahangir Shooting the Head of Malik Ambar", url: "https://artsandculture.google.com/asset/jahangir-shooting-the-head-of-malik-ambar-artist-inscribed-later-to-abu-l-hasan/MgEbl8sQcIMS5g", quote: "Jahangir Shooting the Head of Malik Ambar Artist: Inscribed (later) to Abu'l-Hasan"}
- card: malik-ambar
  fact: "The painting was a symbolic victory over a foe the Mughal armies kept failing to crush"
  sources:
    - {title: "Victoria and Albert Museum: Jahangir shooting at the head of Malik Ambar, IM.284-1914", url: "https://collections.vam.ac.uk/item/O405533/", quote: "One of Jahangir's leading artists created a painting in which the emperor symbolically puts an end to his foe"}
    - {title: "The Indian Express, Research: Malik Ambar (2020)", url: "https://indianexpress.com/article/research/malik-ambar-aurangabad-mughals-jahangir-akbar-shivaji-6397143/", quote: "the painting is a perfect depiction of Jahangir’s furore towards a man considered his arch-nemesis"}
- card: baartman-return
  fact: "A Khoekhoe woman born around 1789 near the Gamtoos River in the Eastern Cape"
  sources:
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "A Khoikhoi woman Sara ‘Saartjie’ Baartman was born in 1789* at the Gamtoos river in what is now known as the Eastern Cape"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Sarah Baartman (born 1789, near the Gamtoos River, Xhosa kingdom [now in Eastern Cape, South Africa]"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "It is thought she was born in South Africa's Eastern Cape in 1789"}
- card: baartman-return
  fact: "Orphaned young, she was a servant in Cape Town"
  sources:
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Both of Baartman’s parents died while she was still young"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "her mother died when she was two and her father, a cattle driver, died when she was an adolescent. She entered domestic service in Cape Town"}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "took her to Cape Town where she became a domestic servant to his brother"}
- card: baartman-return
  fact: "In 1810 ship's surgeon William Dunlop and Hendrik Cezar took her to London on a contract she could not read"
  sources:
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "On 29 October 1810, Sara allegedly ‘signed’ a contract with an English ship surgeon named William Dunlop ... she was illiterate"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "In October 1810, although illiterate, Baartman allegedly signed a contract with English ship surgeon William Dunlop and mixed-race entrepreneur Hendrik Cesars, in whose household she worked"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Though she could not read, she signed a contract written by the doctor"}
- card: baartman-return
  fact: "At Piccadilly paying crowds came to stare at her; she was billed as the 'Hottentot Venus' (also wow)"
  sources:
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "She was taken to London where she was displayed in a building in Piccadilly"}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "Englishmen and women paid to see Sara’s half naked body displayed in a cage"}
    - {title: "The Guardian, Chris McGreal: Coming home (21 February 2002)", url: "https://www.theguardian.com/education/2002/feb/21/internationaleducationnews.highereducation", quote: "Saartjie Baartman was dragged out to squat before the mob at 225 Piccadilly ... the unfortunate woman made famous across Europe as the \"Hottentot Venus\""}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "she was exhibited at a venue in London's Piccadilly Circus after her arrival"}
- card: baartman-return
  fact: "Anti-slavery campaigners took her keepers to court; the case failed after the contract was shown and she testified she was not mistreated (also wow)"
  sources:
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "campaigners were appalled at Baartman's treatment in London. Her employers were prosecuted for holding Baartman against her will, but not convicted, with Baartman herself testifying in their favour"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Some English people who were sympathetic to Baartman’s plight filed a lawsuit to stop the exhibitions, but they lost their case when shown the contract that Baartman had signed. Baartman also testified that she was not being mistreated."}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "the campaign against slavery in Britain was in full swing and as a result, the treatment of Baartman was called into question. Her “employers” were brought to trial"}
- card: baartman-return
  fact: "In 1814 she was taken to Paris and sold to an animal showman, Réaux"
  sources:
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "in September 1814, she was transported from England to France, and upon arrival Hendrik Cezar sold her to Reaux, a man who showcased animals"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "In 1814 Baartman was sold to S. Réaux, an exhibitor in Paris"}
    - {title: "The Guardian, David Hearst: African woman going home after 200 years (30 April 2002)", url: "https://www.theguardian.com/world/2002/apr/30/education.arts", quote: "In Paris she was sold to an animal trainer"}
- card: baartman-return
  fact: "Scientists, among them Georges Cuvier, studied her as a specimen"
  sources:
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "Her constant display attracted the attention of George Cuvier, a naturalist. He asked Reaux if he would allow Sara to be studied as a science specimen"}
    - {title: "The Guardian, Chris McGreal: Coming home (21 February 2002)", url: "https://www.theguardian.com/education/2002/feb/21/internationaleducationnews.highereducation", quote: "Napoleon's surgeon general, George Cuvier, spotted her and claimed a scientific interest. Over the following year she was repeatedly studied by doctors and anthropologists"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "She also was examined by scientists."}
- card: baartman-return
  fact: "She died in Paris at about 26"
  sources:
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Baartman died in Paris in 1815 at about the age of 26"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "Sarah Baartman died on 29 December 1815 ... Baartman died aged 26"}
- card: baartman-return
  fact: "Cuvier made a plaster cast and kept her skeleton, brain and genitals, displayed in a Paris museum into the 1970s (also wow)"
  sources:
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "Georges Cuvier ... made a plaster cast of her body before dissecting it. He preserved her skeleton and pickled her brain and genitals, placing them in jars displayed at Paris's Museum of Man"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "Her brain, skeleton and sexual organs remained on display in a Paris museum until 1974"}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "He made a plaster cast of her body, pickled her brain and genitals and placed them into jars which were placed on display at the Musée de l' Homme (Museum of Man) until 1974"}
    - {title: "The Guardian, David Hearst: African woman going home after 200 years (30 April 2002)", url: "https://www.theguardian.com/world/2002/apr/30/education.arts", quote: "The painted plaster cast of Baartman's body was displayed in Paris' main ethnographic museum, Musée de l'Homme, until the mid 1970s"}
- card: baartman-return
  fact: "In 1994 Nelson Mandela asked France to return her"
  sources:
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "In 1994 Nelson Mandela , the new president of South Africa , asked France to return Baartman’s remains"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "After his election in 1994 as President of South Africa, Nelson Mandela requested the repatriation of Baartman's remains"}
- card: baartman-return
  fact: "In 2002 the French parliament voted to return her remains"
  sources:
    - {title: "The Guardian, David Hearst: African woman going home after 200 years (30 April 2002)", url: "https://www.theguardian.com/world/2002/apr/30/education.arts", quote: "it was only this year that the French parliament overcame objections about the precedent it would set for countries seeking the return of artefacts, by voting to return Baartman's remains"}
    - {title: "The Guardian, Chris McGreal: Coming home (21 February 2002)", url: "https://www.theguardian.com/education/2002/feb/21/internationaleducationnews.highereducation", quote: "The French senate has voted to release Baartman's remains from the Musé de L'Homme"}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "the French had to draft a carefully worded bill"}
- card: baartman-return
  fact: "In August 2002 she was buried at Hankey, near her birthplace (also wow)"
  sources:
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "In August of that year, her remains were buried in Hankey, in Eastern Cape province"}
    - {title: "South African History Online: Sara 'Saartjie' Baartman", url: "https://www.sahistory.org.za/people/sara-saartjie-baartman", quote: "On 9 August 2002, Women’s Day, a public holiday in South Africa, Sara was buried at Hankey in the Eastern Cape Province"}
    - {title: "Encyclopaedia Britannica: Sarah Baartman", url: "https://www.britannica.com/biography/Sarah-Baartman", quote: "Baartman’s remains were buried near her birthplace in Eastern Cape province"}
- card: baartman-return
  fact: "She became a symbol of colonial exploitation for South Africans"
  sources:
    - {title: "The Guardian, Chris McGreal: Coming home (21 February 2002)", url: "https://www.theguardian.com/education/2002/feb/21/internationaleducationnews.highereducation", quote: "\"Saartjie Baartman became a symbol of our suffering, and all the misery she went through was a manifestation of how the Khoisan people were treated"}
    - {title: "BBC News, Justin Parkinson: The significance of Sarah Baartman (2016)", url: "https://www.bbc.com/news/magazine-35240987", quote: "Today she is seen by many as the epitome of colonial exploitation and racism"}
    - {title: "The Guardian, David Hearst: African woman going home after 200 years (30 April 2002)", url: "https://www.theguardian.com/world/2002/apr/30/education.arts", quote: "Baartman had become \"the symbol of a nation's need to confront and acknowledge its past"}
- card: anna-julia-cooper
  fact: "Born enslaved in Raleigh in 1858; her father was probably her mother's enslaver (also wow)"
  sources:
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "Anna Julia Cooper was born into enslavement in 1858 in Raleigh, North Carolina. Her mother was Hannah Stanley Haywood, and her enslaver, Fabius J. Haywood, was said to be her father."}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "Cooper was the daughter of a slave woman and her white slaveholder (or his brother)"}
- card: anna-julia-cooper
  fact: "As a child she entered Saint Augustine's in Raleigh, a new school for freed people"
  sources:
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "In 1867, she became a student at the Saint Augustine Normal and Collegiate Institute in Raleigh, North Carolina, a school built specifically to educate formerly enslaved children"}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "In 1868 she enrolled in the newly established Saint Augustine’s Normal School and Collegiate Institute (now Saint Augustine’s University), a school for freed slaves"}
- card: anna-julia-cooper
  fact: "She noticed boys were steered into harder courses and spent her life fighting for Black women's education"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "she had a feminist awakening when she realized that her male classmates were encouraged to study a more rigorous curriculum than were the female students. After that early realization, she spent the rest of her life advocating for the education of black women"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "Her protests granted her entry into St. Augustine’s Normal School’s Greek and Latin course, which were previously male-designated courses ... placed her on the lifelong path of advocating for gender equality"}
- card: anna-julia-cooper
  fact: "Married in 1877, widowed two years later"
  sources:
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "In 1877, Cooper married George A.C. Cooper at the age of 19 ... He passed away two years following their union"}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "In 1877 Anna married her classmate George Cooper, who died two years later"}
- card: anna-julia-cooper
  fact: "Oberlin mathematics degree 1884, later a master's"
  sources:
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "She graduated with her bachelor's degree in 1884 and received her master's in 1887 – both in Mathematics"}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "graduating in 1884 with a B.S. in mathematics and receiving a master’s degree in mathematics in 1888"}
- card: anna-julia-cooper
  fact: "She taught at M Street High School in Washington"
  sources:
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "took on a position as a math and science teacher at Washington High School (later M Street High School, and presently Dunbar High School) in Washington, DC"}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "In 1887 she became a faculty member at the M Street High School"}
- card: anna-julia-cooper
  fact: "A Voice from the South (1892), a founding text of Black feminist thought (also wow)"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "whose book A Voice From the South by a Black Woman of the South (1892) became a classic African American feminist text"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "this text is also said to be the first “book length articulation of Black feminist theory,”"}
- card: anna-julia-cooper
  fact: "In 1900 she addressed the first Pan-African Conference in London"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "the first Pan-African Conference in 1900"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "the Pan-African Conference in London in 1900"}
- card: anna-julia-cooper
  fact: "As principal she sent graduates to Ivy League colleges; her stand for college preparation over vocational training cost her the post"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "under her tenure several M Street graduates were admitted to Ivy League schools. Cooper’s controversial emphasis on college preparatory courses irked critics (such as Booker T. Washington ) who favoured vocational education for blacks. Using trumped-up charges, the District of Columbia Board of Education refused to renew her contract"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "some students ultimately attending Yale, Mount Holyoke, Brown and Harvard"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "school administrators instructed her to return to Booker T. Washington’s ideologies and forgo her emphasis on college. She refused and promptly resigned"}
- card: anna-julia-cooper
  fact: "She raised five children of her late brother's family"
  sources:
    - {title: "BlackPast, Tyina Steptoe: Anna Julia Haywood Cooper (1858–1964)", url: "https://www.blackpast.org/african-american-history/cooper-anna-julia-haywood-1858-1964/", quote: "After the death of her brother in 1915, however, she postponed pursuing her doctorate in order to raise his five grandchildren"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "after her brother’s passing, she adopted his five children"}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "Cooper reared two foster children and five adoptive children on a teacher’s salary"}
- card: anna-julia-cooper
  fact: "In 1925, in her sixties, she received a doctorate from the University of Paris (Sorbonne) for a thesis in French on slavery and the French Revolution (also wow)"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "In 1925, at age 67, she received a doctorate from the Sorbonne in Paris , having written her dissertation on slavery . Written in French, it was published in English as Slavery and the French Revolutionists, 1788–1805"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "Her dissertation was written in French and explored attitudes about enslavement post-Haitian rebellion (Bates 2015). Cooper received her doctorate at 65"}
    - {title: "BlackPast, Tyina Steptoe: Anna Julia Haywood Cooper (1858–1964)", url: "https://www.blackpast.org/african-american-history/cooper-anna-julia-haywood-1858-1964/", quote: "She returned to school in 1924 when she enrolled at the University of Paris in France. In 1925, at the age of 67"}
- card: anna-julia-cooper
  fact: "She was the fourth African American woman to earn a PhD"
  sources:
    - {title: "BlackPast, Tyina Steptoe: Anna Julia Haywood Cooper (1858–1964)", url: "https://www.blackpast.org/african-american-history/cooper-anna-julia-haywood-1858-1964/", quote: "Cooper became the fourth African American woman to obtain a Doctorate of Philosophy"}
    - {title: "National Women's History Museum: Anna Julia Cooper", url: "https://www.womenshistory.org/education-resources/biographies/anna-julia-cooper", quote: "This made her the fourth African American woman in the United States to earn a PhD"}
- card: anna-julia-cooper
  fact: "She later led Frelinghuysen University, a Washington school for working Black adults"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "From 1930 to 1941 she served as president of the Frelinghuysen University for working adults in Washington, D.C."}
    - {title: "BlackPast, Tyina Steptoe: Anna Julia Haywood Cooper (1858–1964)", url: "https://www.blackpast.org/african-american-history/cooper-anna-julia-haywood-1858-1964/", quote: "In 1930, Cooper retired from teaching to assume the presidency of Frelinghuysen University, a school for black adults"}
- card: anna-julia-cooper
  fact: "She died in 1964 aged 105 (also wow)"
  sources:
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "died February 27, 1964, Washington, D.C."}
    - {title: "Encyclopaedia Britannica: Anna Julia Cooper", url: "https://www.britannica.com/biography/Anna-Julia-Cooper", quote: "She died in her sleep at age 105."}
    - {title: "BlackPast, Tyina Steptoe: Anna Julia Haywood Cooper (1858–1964)", url: "https://www.blackpast.org/african-american-history/cooper-anna-julia-haywood-1858-1964/", quote: "Anna Julia Cooper died in 1964 in Washington, D.C. at the age of 105."}
- card: parsley-massacre
  fact: "In the 1930s the border existed mostly on paper; people crossed for school, ranches spanned it, Dominicans and Haitians traded and intermarried"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "the border, which existed mostly on paper, was a notably seamless site: Children crossed back and forth freely to go to school on one side and home on the other. Sprawling cattle ranches spanned the divide, and Dominicans and Haitians mingled and intermarried frequently"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "Communities in these regions had long been interconnected through trade, labor migration, and family ties"}
- card: parsley-massacre
  fact: "Trujillo wanted the border under Dominican control and Haitians removed from it"
  sources:
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "Throughout the early 1930s Trujillo implemented repressive policies aimed at ending immigration and reestablishing Dominican control over the border areas"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "In early October 1937 Trujillo ordered a brutal campaign to eliminate Haitian migrants and Dominicans of Haitian descent"}
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Part of Trujillo's \"Dominicanization\" process after the massacre involved bringing new Dominican settlers and infrastructure to towns on the border"}
- card: parsley-massacre
  fact: "On 2 October 1937 in Dajabón Trujillo claimed Haitians were stealing cattle and crops and said he had already begun to remedy the situation"
  sources:
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "Trujillo delivered a speech in the northwestern border town of Dajabón on October 2, in which he addressed Dominican residents and falsely claimed that Haitians were attacking local farmers and stealing “cattle, provisions, fruits.” ... declaring, “I will fix this. And we have already begun to remedy the situation.”"}
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Trujillo, on a tour of the border area, is said to have told supporters about the massacre on Oct. 2, 1937 ... we have already begun to remedy the situation"}
- card: parsley-massacre
  fact: "Over five to eight days soldiers killed Haitian men, women and children and Dominicans of Haitian descent (also wow)"
  sources:
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "Between October 3 and October 8, 1937, the Dominican Army carried out a brutal massacre of Haitians along the border region"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "The massacre spanned five to eight days."}
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "the Dominican military, under Trujillo's orders, began to execute Haitian families as well as Dominicans of Haitian descent ... The killing lasted between five and eight days."}
- card: parsley-massacre
  fact: "Mostly with machetes, so it could pass for a farmers' uprising"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "The killings, many of which took place in the border region, were mostly carried out by machete to help sell the regime's official account that the massacre was a spontaneous uprising of patriotic Dominican farmers"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "the perpetrators used weapons such as machetes to create the illusion that the killings were carried out by civilians"}
- card: parsley-massacre
  fact: "Survivors fled across the Massacre River into Haiti"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Many Haitians fleeing Trujillo's army crossed this river to reach safety in 1937"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "The river forms part of the northern boundary between the two countries and was also a crossing point for those fleeing the 1937 Parsley Massacre"}
- card: parsley-massacre
  fact: "Estimates of the dead vary widely, up to 30,000"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Estimates of the number of dead still vary widely — from less than 1,000 to 30,000."}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "The massacre resulted in an estimated 9,000 to 30,000 deaths"}
- card: parsley-massacre
  fact: "The name comes from the story that soldiers made people say perejil and killed those who said it like Haitian Creole speakers; the extent of the test is debated (also wow)"
  sources:
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "a name rooted in reports that Dominican soldiers used the word perejil —Spanish for “ parsley ”—as a way to identify those who the Dominican soldiers suspected were Haitians. Those who struggled to pronounce the word with a Spanish accent, particularly speakers of Haitian Creole , were singled out and often killed. Although the extent of this practice remains debated among scholars"}
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Haitians and Dominicans pronounce the Spanish word perejil differently and, according to a popular though unconfirmed story, this was used as a litmus test of their origins"}
- card: parsley-massacre
  fact: "Trujillo denied his government's role and newspapers were silenced"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "Afterward, there was a moratorium on newspapers covering the massacre, and Trujillo refused to publicly admit his government's role or accept responsibility."}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "newspapers were prohibited from reporting on the events, and Trujillo denied any involvement or responsibility by his government"}
- card: parsley-massacre
  fact: "Only after Trujillo's assassination in 1961 could researchers gather survivors' testimony"
  sources:
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "After the dictator was assassinated in 1961, researchers began to investigate what had been an off-limits subject, conducting interviews"}
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "It was only after Trujillo’s assassination in 1961 that researchers were able to begin investigating the massacre ... Through survivor accounts and archival research"}
- card: parsley-massacre
  fact: "The yearly Border of Lights commemoration in Dajabón brings Dominicans and Haitians together"
  sources:
    - {title: "Encyclopaedia Britannica: Parsley Massacre", url: "https://www.britannica.com/event/Parsley-Massacre", quote: "the annual Border of Lights commemoration held in Dajabón, organized by international scholars, human rights activists, and community members from both the Dominican Republic and Haiti"}
    - {title: "NPR, Marlon Bishop and Tatiana Fernandez: 80 years on, Dominicans and Haitians revisit painful memories of Parsley Massacre (2017), via MPR News", url: "https://www.mprnews.org/story/2017/10/08/80-years-on-dominicans-and-haitians-revisit-painful-memories-of-parsley-massacre", quote: "an annual commemoration of the massacre in Dajabon called Border of Lights , organized by a group of international scholars and activists, including many Dominicans and Haitian-Americans"}
- card: alice-ball
  fact: "Hawaii sent people with Hansen's disease to Kalaupapa on Molokai"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "the Kalaupapa settlement on the Hawaiian island of Molokai. Starting in 1866, the Kingdom's authorities forcibly removed more than 8,000 leprosy patients to this remote settlement"}
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "Kalaupapa, a special hospital for Hansen disease patients"}
- card: alice-ball
  fact: "Chaulmoogra oil, the main remedy, was hard to give as a drug; the task was to make it injectable"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "At the time, the standard treatment for Hansen’s disease involved chaulmoogra oil. However, the oil was largely ineffective as it could not be properly absorbed by the human body when consumed orally and was too thick and painful when injected"}
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "She worked under extreme pressure to produce injectable chaulmooga oil"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "so it could be effectively administered to patients by injection"}
- card: alice-ball
  fact: "Born in Seattle in 1892; grandfather the photographer J. P. Ball"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "Born on July 24, 1892, in Seattle, Washington ... He, James Presley Ball Sr., was one of the first African Americans to learn the daguerreotype process"}
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "Alice Augusta Ball, a pharmaceutical chemist, was born in Seattle, Washington in 1892 to Laura and James P. Ball Jr. Her grandfather was J.P. Ball , the well known daguerreotype photographer"}
- card: alice-ball
  fact: "Degrees in pharmaceutical chemistry and pharmacy at the University of Washington, then graduate study at the College of Hawaii"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "Ball would later enroll at the University of Washington and earn two degrees, one in pharmaceutical chemistry (1912) and one in pharmacy (1914)"}
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "graduated with two degrees in pharmaceutical chemistry in 1912 and pharmacy in 1914. In the fall of 1914, she entered the College of Hawaii (later the University of Hawaii) as a graduate student in chemistry"}
- card: alice-ball
  fact: "In 1915 she was the first woman and first African American to earn a master's in chemistry there"
  sources:
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "On June 1, 1915, she was the first African American and the first woman to graduate with a Master of Science degree in chemistry from the University of Hawaii"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "UH ’s first African-American graduate and first woman to earn her master’s degree in chemistry in 1915"}
- card: alice-ball
  fact: "At 23 she isolated the ethyl esters of the oil's fatty acids, which could be injected and absorbed (also wow)"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "This technique, known as the “Ball Method”, isolated the ethyl esters of the fatty acids in the oil, allowing the treatment to be easily injected and absorbed by the body"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "at the age of 23 discovered an effective treatment for Hansen’s disease (leprosy) using oil from the Chaulmoogra tree"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "applying a new method of isolating ethyl esterification from fatty acids of the chaulmoogra oil"}
- card: alice-ball
  fact: "She fell ill, possibly from chlorine inhalation, returned to Seattle and died on 31 December 1916 aged 24 (also wow)"
  sources:
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "Ball returned to Seattle and died at the age of 24 on December 31, 1916. According to her obituary, she suffered injuries from inhaling chlorine gas during a class demonstration in Honolulu"}
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "some accounts suggest she may have been exposed to chlorine gas during her laboratory work ... She was 24 years old"}
- card: alice-ball
  fact: "Arthur Dean, chemistry head and later university president, continued the work, which became the 'Dean method' (also wow)"
  sources:
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "Arthur Lyman Dean, the chairman of the Chemistry Department at the University of Hawaii, who later became the second president of the University, continued refining the research work of Ball ... The “Dean Method”"}
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "He continued where she left off, refined her methods ... calling it the “Dean Method.” At the time, he was the dean of the college and would later become the president of the university"}
- card: alice-ball
  fact: "Her technique remained the leading treatment until new drugs in the 1940s (also wow: quarter-century)"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "The Ball Method remained the primary leprosy treatment until antibiotics were developed in the 1940s"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "was the first successful treatment for Hansen’s disease that was used on thousands of patients around the world until the introduction of sulfone drugs in the mid-1940s"}
- card: alice-ball
  fact: "Researchers later restored her name"
  sources:
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "Ball’s rightful place in scientific history was restored when Hawaiian historian, Kathyrn Takara, stumbled upon Ball’s original thesis"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "Much of what is known about Ball is the result of extensive research by Paul Wermager"}
    - {title: "BlackPast, Miles Jackson: Alice Augusta Ball (1892–1916)", url: "https://www.blackpast.org/african-american-history/ball-alice-augusta-1892-1916/", quote: "Over time, however, researchers began to learn of Ball’s crucial contribution"}
- card: alice-ball
  fact: "A chaulmoogra tree on the Mānoa campus bears her plaque; Hawaii marks 28 February as Alice Augusta Ball Day"
  sources:
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "Gov. David Ige signed a proclamation that declared February 28 “Alice Augusta Ball Day” in Hawaiʻi"}
    - {title: "University of Hawaiʻi News: UH celebrates Alice Augusta Ball Day in Hawaiʻi, February 28 (2022)", url: "https://www.hawaii.edu/news/2022/02/28/alice-ball-day-february-28/", quote: "in the shade of a Chaulmoogra tree planted in Ball’s honor, where a bronze plaque is displayed in her memory"}
    - {title: "National Women's History Museum: Alice Ball", url: "https://www.womenshistory.org/education-resources/biographies/alice-ball", quote: "The University of Hawai’i installed a plaque in her honor, established the Alice Ball Scholarship for those pursuing graduate degrees in chemistry, designated February 28th as Alice Augusta Ball Day , and dedicated a chaulmoogra tree to Ball’s honor"}
- card: madam-cj-walker
  fact: "Around 1900 scalp disease, poor diet and poor hygiene left many Black women with hair loss"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "she started to lose her hair and noticed a lot of other black women had the same problem. Poor hygiene, diet and scalp diseases like dandruff led to brittle hair and hair loss"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "About 1905 Walker perfected an ointment that healed dandruff and other hygiene -related ailments that were common"}
- card: madam-cj-walker
  fact: "Born Sarah Breedlove on 23 December 1867 near Delta, Louisiana, on the plantation where her parents had been enslaved (also wow)"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "Sarah Breedlove was born in Delta, La., on Dec. 23, 1867. She was the daughter of Owen and Minerva Anderson Breedlove. Both had formerly been enslaved."}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "born: December 23, 1867, near Delta, Louisiana"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "Walker was born Sarah Breedlove on the same cotton plantation where her parents, Owen and Minerva Anderson Breedlove, had been enslaved before the American Civil War"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "Born Sarah Breedlove on December 23, 1867, on a plantation in Delta, Louisiana"}
- card: madam-cj-walker
  fact: "Orphaned at seven, married at fourteen, widowed in 1887 with her daughter Lelia (also wow: orphaned)"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "She was an orphan by the age of 7 and moved in with her older sister. At the age of 14, Sarah married Moses McWilliams ... In 1885, they had a daughter named Lelia ... Sarah’s husband died in 1887"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "Orphaned at age seven ... at age 14 Walker married Moses McWilliams. When her husband died in 1887, Walker became a single parent of two-year old daughter Lelia"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "Having been orphaned at age 7, she married at 14"}
- card: madam-cj-walker
  fact: "In St Louis her brothers were barbers and she worked as a laundress (also wow)"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "Sarah then moved to St. Louis where three of her brothers lived and worked as barbers. She worked as a laundress"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "Walker moved to St. Louis, Missouri, where her four brothers were barbers. There, she worked as a laundress and cook"}
- card: madam-cj-walker
  fact: "Losing her own hair, she began selling hair preparations"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "she started to lose her hair ... Sarah started selling her products door-to-door in black neighborhoods in St. Louis"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "facing hair loss ... she not only began using African American businesswoman Annie Turbo Malone’s \"The Great Wonderful Hair Grower,” but she also joined Malone’s team of black women sales agents"}
- card: madam-cj-walker
  fact: "In 1905 in Denver she married Charles J. Walker, renamed herself Madam C. J. Walker and sold her own Wonderful Hair Grower"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "Then she moved to Denver in 1905 and married Charles J. Walker. With her business becoming more successful, Sarah decided to adopt a new name – Madam C.J. Walker."}
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "These included Wonderful Hair Grower"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "A year later, Walker moved to Denver, Colorado, where she married ad-man Charles Joseph Walker, renamed herself “Madam C.J. Walker,” and with $1.25, launched her own line of hair products and straighteners for African American women, “Madam Walker’s Wonderful Hair Grower.”"}
- card: madam-cj-walker
  fact: "In 1910 she set up a laboratory and beauty school in Indianapolis"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "In 1910, Madam C.J. Walker set up a laboratory and beauty school in Indianapolis."}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "After the pair divorced in 1910, she relocated to Indianapolis and built a factory for her Walker Manufacturing Company"}
- card: madam-cj-walker
  fact: "Her products were sold by thousands of Black women agents (also wow)"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "She had several thousand agents around the country to sell her full line of products"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "She built an international beauty business that had 25,000 active sales agents by 1919"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "she opened training programs in the “Walker System” for her national network of licensed sales agents"}
- card: madam-cj-walker
  fact: "She gave to Black institutions and the NAACP and campaigned against lynching"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "contributing to African-American organizations in Indianapolis ... also gave money to the Tuskegee Institute and the National Association for the Advancement of Colored People"}
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "In 1917, she urged the group to decry lynchings in the South."}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "became active in the anti-lynching movement, donating $5,000 to the NAACP’s efforts"}
- card: madam-cj-walker
  fact: "She died on 25 May 1919 at Villa Lewaro, Irvington-on-Hudson"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "died on May 25, 1919, at her Irvington-on-Hudson, New York estate, Villa Lewaro"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "died: May 25, 1919, Irvington, New York (aged 51)"}
    - {title: "National Women's History Museum, Debra Michals: Madam C. J. Walker (2015)", url: "https://www.womenshistory.org/education-resources/biographies/madam-cj-walker", quote: "a mansion in Irvington, New York dubbed “Villa Lewaro;”"}
- card: madam-cj-walker
  fact: "Her daughter A'Lelia Walker became a central figure of the Harlem Renaissance"
  sources:
    - {title: "Indiana Historical Society, Famous Hoosiers: Madam C. J. Walker", url: "https://indianahistory.org/education/educator-resources/famous-hoosiers/madam-c-j-walker/", quote: "a daughter named Lelia, who later changed her name to A’Lelia and became a central figure of the Harlem Renaissance"}
    - {title: "Encyclopaedia Britannica, A'Lelia Bundles: Madam C. J. Walker", url: "https://www.britannica.com/money/Madam-C-J-Walker", quote: "The Joy Goddess of Harlem: A’Lelia Walker and the Harlem Renaissance , a biography of her great-grandmother, whose parties and arts patronage helped define that era"}
- card: dunham-esplanada-1950
  fact: "Brazil had no legal segregation"
  sources:
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "But unlike the U.S. with its Jim Crow laws, Brazil never put in place any legal segregation."}
    - {title: "Jerry Dávila: Challenging Racism in Brazil. Legal Suits in the Context of the 1951 Anti-Discrimination Law, Varia Historia (SciELO)", url: "https://www.scielo.br/j/vh/a/6BvVFHGbpvTGKJypxM4W6VQ/?lang=en", quote: "In the United States, legal challenges served to challenge the legal codification of white supremacy and dismantle structures of segregation. Since neither of these existed in Brazil"}
- card: dunham-esplanada-1950
  fact: "Many Brazilians considered racism an American problem; the country saw itself as a racial democracy"
  sources:
    - {title: "American Historical Association, 131st Annual Meeting (2017), Jerry Dávila: Defining and Denouncing Racial Discrimination in Brazil: The Debate Surrounding the Katherine Dunham Case", url: "https://aha.confex.com/aha/2017/webprogram/Paper20947.html", quote: "Dunham and many Brazilians considered racism a U.S. problem rather than one shared in Brazil."}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "o país se julgava o mais perfeito exemplar de democracia racial"}
- card: dunham-esplanada-1950
  fact: "Slavery in Brazil ended only in 1888"
  sources:
    - {title: "NPR, Lulu Garcia-Navarro: Since established in the 1950s, Brazilians say anti-racism laws aren't enough (18 December 2016), transcript", url: "https://www.npr.org/transcripts/506045513", quote: "slavery only ended in Brazil in 1888"}
    - {title: "Agência Senado, Arquivo S, Ricardo Westin: Brasil criou 1ª lei antirracismo após hotel em SP negar hospedagem a dançarina negra americana (6 July 2020)", url: "https://www12.senado.leg.br/noticias/especiais/arquivo-s/brasil-criou-1a-lei-antirracismo-apos-hotel-em-sp-negar-hospedagem-a-dancarina-negra-americana", quote: "A escravidão havia sido abolida seis décadas antes, em 1888"}
