# Expansion batch c20 (2026-11-13): every fact in the bodies and wow lines of the c20 cards,
# with at least two independent sources and a supporting quote from each.
- card: st-louis-blues
  fact: "W. C. Handy wrote/published \"St. Louis Blues\" in 1914"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "in 1914 Handy penned his masterpiece, \"St. Louis Blues.\""}
    - {title: "NPR, Margaret Howze: The NPR 100: 'St. Louis Blues' (2000)", url: "https://www.npr.org/2000/01/16/1069234/st-louis-blues", quote: "In 1914, W.C. Handy, a middle-class African American, wrote \"St. Louis Blues.\""}
- card: st-louis-blues
  fact: "Handy was born in Florence, Alabama"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "William Christopher Handy was born in Florence, Lauderdale County, on November 16, 1873"}
    - {title: "University of Pittsburgh, Voices Across Time: St. Louis Blues", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "William Christopher Handy (1873–1958), known as the \"father of the blues,\" was born in Florence, Alabama."}
- card: st-louis-blues
  fact: "Handy and Pace's firm was in Memphis, where he worked (he wrote the song in the Beale Street district)"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "they teamed up in 1913 to found the Pace & Handy Music Company in Memphis"}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "Handy found solitude in a rented a room in the Beale Street district and began to write “St. Louis Blues.”"}
- card: st-louis-blues
  fact: "In 1892 Handy's vocal quartet ran out of money and was stranded in St. Louis; the song draws on those days, the first line about the evening sun and his memory of sleeping on the cobbles by the river"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "Handy took to the road with a vocal quartet, which ran low on funds and became stranded in St. Louis in 1892. There, he first heard snatches of folk material that would later go into his most famous composition"}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "And then he wrote down, “I hate to see de evenin’ sun go down,” commenting, “And if you ever had to sleep on the cobbles down by the river in St. Louis, you’ll understand the complaint.”"}
- card: st-louis-blues
  fact: "The tango was in vogue, and Handy put a tango (habanera) section into the blues to win over dancers"
  sources:
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "“When ‘St. Louis Blues’ was written the tango was in vogue. I tricked the dancers by arranging a tango introduction, breaking abruptly into a low-down blues."}
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "The rhythm for this section is a habanera, or tango, with a sultry air."}
- card: st-louis-blues
  fact: "Publishers would not take it; Handy and Harry Pace published it through their own firm, Pace & Handy"
  sources:
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "Failing to find a music publisher who would accept his song, Handy and sometime collaborator Harry H. Pace published “St. Louis Blues” under the recently formed Pace and Handy Music Company."}
    - {title: "University of Pittsburgh, Voices Across Time: St. Louis Blues", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "wn publishing company with Harry Pace"}
- card: st-louis-blues
  fact: "Sales were modest at first; from around 1921 it became an immense hit"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "although it was only a minor hit during the first few years after its release. Beginning around 1921, it grew in popularity and became an immense hit"}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "Sheet music sales were moderate but it would take years for the song to come into its own."}
- card: st-louis-blues
  fact: "Bessie Smith recorded it in 1925 with Louis Armstrong on cornet; this slow version set the standard"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "The 1925 version, featuring Bessie Smith and Louis Armstrong, set the standard for slower, bluesier versions."}
    - {title: "NPR, Margaret Howze: The NPR 100: 'St. Louis Blues' (2000)", url: "https://www.npr.org/2000/01/16/1069234/st-louis-blues", quote: "its definitive 1925 recording by Bessie Smith, with cornet accompaniment by Louis Armstrong"}
    - {title: "University of Pittsburgh, Voices Across Time: St. Louis Blues", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "the most famous recording, featuring Bessie Smith singing and Louis Armstrong accompanying, was made in 1925"}
- card: st-louis-blues
  fact: "It is one of the most recorded compositions in history"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "one of the most frequently recorded compositions in history"}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "the song was the most-recorded of all time from the 1930’s until “ Star Dust ” took the title over twenty years later"}
- card: st-louis-blues
  fact: "Handy became known as the \"Father of the Blues\""
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "became known as the \"Father of the Blue"}
    - {title: "University of Pittsburgh, Voices Across Time: St. Louis Blues", url: "https://voices.pitt.edu/TeachersGuide/Unit%206/StLouisBlues.htm", quote: "W. C. Handy, known as the \"father of the blues,\""}
- card: st-louis-blues
  fact: "The song carried the blues into dance bands and jazz (popular in dance era; second-most recorded jazz piece)"
  sources:
    - {title: "Encyclopedia of Alabama: William \"W. C.\" Handy", url: "https://encyclopediaofalabama.org/article/william-w-c-handy/", quote: "Early recordings of \"St. Louis Blues\" tend to be brisk, in keeping with the mania for danci"}
    - {title: "JazzStandards.com: St. Louis Blues (1914)", url: "https://www.jazzstandards.com/compositions-0/stlouisblues.htm", quote: "none has enjoyed more recordings by jazz artists than W.C. Handy’s classic, “St. Louis Blues.”"}
- card: we-shall-overcome
  fact: "\"We Shall Overcome\" became the anthem of the civil rights movement"
  sources:
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "Its simple words and music would go on to become the anthem of the civil-rights movement"}
    - {title: "BlackPast: The Charleston Cigar Factory Strike (1945-1946)", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "The modern version of the gospel hymn and civil rights anthem that would become popular in the 1960s, We Shall Overcome , was first performed by striking worker Lucille Simmons, during the strike."}
- card: we-shall-overcome
  fact: "On 22 October 1945 more than a thousand workers at the American Tobacco Company cigar factory in Charleston struck over pay and racial discrimination; Black and white workers picketed"
  sources:
    - {title: "BlackPast: The Charleston Cigar Factory Strike (1945-1946)", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "By October 22, 1945, over 1,000 Cigar Factory workers had left their jobs, demanding back pay and a pay increase of twenty-five cents per hour."}
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "In October 1945, a thousand black and white workers at the American Tobacco Company in Charlestown, South Carolina, struck for higher pay and better working conditions."}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "The biracial group of strikers began picketing outside the"}
- card: we-shall-overcome
  fact: "The strikers demanded higher pay"
  sources:
    - {title: "BlackPast: The Charleston Cigar Factory Strike (1945-1946)", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "The strike resulted from the company refusing to institute raises and racial discrimination."}
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "struck for higher pay and better working conditions"}
- card: we-shall-overcome
  fact: "Lucille Simmons, a Black striker, turned an old hymn into \"We Will Overcome\""
  sources:
    - {title: "Lowcountry Digital History Initiative: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "In her rich and powerful voice, she changed the spiritual, “I Will Overcome One Day,\" into “We Will Overcome.”"}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "singing a well-known hymn, “I’ll Be All Right,” and altering it to give voice to the striking workers’ own aspirations: “We Will Overcome.”"}
- card: we-shall-overcome
  fact: "The song came to close each day of picketing"
  sources:
    - {title: "Lowcountry Digital History Initiative: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "The song came to signal the end of the day for picketing strikers."}
    - {title: "BlackPast: The Charleston Cigar Factory Strike (1945-1946)", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "Lucille Simmons, sang a gospel song, We Shall Overcome , to signal the end of the day for picketing strikers."}
- card: we-shall-overcome
  fact: "Strikers added verses such as \"We will win our rights\""
  sources:
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "they added new verses, such as “We will win our rights,” and “We will win this fight.”"}
    - {title: "Lowcountry Digital History Initiative: The Charleston Strike", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/the_charleston_strike", quote: "“we will win our rights someday.”"}
- card: we-shall-overcome
  fact: "The strike ended in April 1946"
  sources:
    - {title: "BlackPast: The Charleston Cigar Factory Strike (1945-1946)", url: "https://www.blackpast.org/african-american-history/the-charleston-cigar-factory-strike-1945-1946/", quote: "from October 22, 1945, to April 1, 1946"}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "The strike ended without success in April 1946"}
- card: we-shall-overcome
  fact: "Anna Lee Bonneau and Evelyn Risher took the song to the Highlander Folk School in Monteagle, Tennessee, and taught it to Zilphia Horton"
  sources:
    - {title: "Lowcountry Digital History Initiative: Aftermath", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/aftermath", quote: "Two members of Charleston’s Local 15, Anna Lee Bonneau and Evelyn Risher, taught Highlander co-founder Zilphia Horton the song"}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "two participants, Anna Lee Bonneau and Evelyn Risher, traveled"}
    - {title: "Lowcountry Digital History Initiative: Aftermath", url: "https://ldhi.library.cofc.edu/exhibits/show/cigar_factory/aftermath", quote: "attended a workshop at the Highlander Folk School in Monteagle, Tennessee"}
- card: we-shall-overcome
  fact: "Horton passed the song to Pete Seeger"
  sources:
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "One of those who learned the song from Zilphia was Pete Seeger."}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "Horton had shared “We Will Overcome” with folk singer Pete Seeger"}
- card: we-shall-overcome
  fact: "By 1952 New York singers had recorded it as \"We Shall Overcome\""
  sources:
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "in 1952, a recording used the phrase “We Shall Overcome” rather than “We Will Overcome.”"}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "By no later than early 1952, New York musical friends of Seeger, most significantly Robert DeCormier, in conducting the Jewish Young Folksingers, had recorded Horton’s song under a new title: “We Shall Overcome,”"}
- card: we-shall-overcome
  fact: "In April 1960 Guy Carawan of Highlander led the founding meeting of SNCC in Raleigh in singing it"
  sources:
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "In April 1960, 126 young civil rights activists joined together in song in Raleigh, N.C., as they gathered for the founding of the Student Non-Violent Coordinating Committee"}
    - {title: "David J. Garrow: expert report on the history of \"We Shall Overcome\" (2014)", url: "https://www.davidgarrow.com/wp-content/uploads/2018/04/DJGWSOReport140417.pdf", quote: "On Saturday night April 16 Highlander’s Guy Carawan led the entire group in singing “We Shall Overcome,”"}
- card: we-shall-overcome
  fact: "On 15 March 1965 President Johnson, asking Congress for a voting rights law, said \"And we shall overcome\""
  sources:
    - {title: "The American Presidency Project: LBJ, Special Message to the Congress: The American Promise (1965)", url: "https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-american-promise", quote: "who must overcome the crippling legacy of bigotry and injustice. And we shall overcome."}
    - {title: "Miller Center: March 15, 1965: Speech Before Congress on Voting Rights", url: "https://millercenter.org/the-presidency/presidential-speeches/march-15-1965-speech-congress-voting-rights", quote: "March 15, 1965: Speech Before Congress on Voting Rights"}
    - {title: "American Heritage, Allan M. Winkler: We Shall Overcome (2017)", url: "https://www.americanheritage.com/we-shall-overcome", quote: "said President Lyndon Johnson in a dramatic speech to Congress in 1965 urging passage of the Voting Rights Law"}
- card: nkosi-sikelel-iafrika
  fact: "Composed in 1897 by Enoch Sontonga, a Methodist mission school teacher, as a hymn in Xhosa"
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Nkosi Sikelel' iAfrika was composed in 1897 by Enoch Sontonga, a Methodist mission school teacher. The words of the first stanza were originally written in Xhosa as a hymn."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "As a choirmaster in his school, Enoch Sontonga composed the first two stanzas of democratic South Africa’s anthem in 1897."}
- card: nkosi-sikelel-iafrika
  fact: "Sontonga was choirmaster at a Methodist mission school near Johannesburg and wrote the hymn for his school choir"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "he was sent to a Methodist mission school in Nancefield, near Johannesburg in 1896. He taught here for nearly eight years. Sontonga was the choirmaster at his school"}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "Although initially intended for his school choir"}
    - {title: "The Heritage Portal, Daluxolo Moloantoa: The Missionary Beginnings of Nkosi Sikelel' iAfrika (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "Sontonga was the choirmaster at his school, as well as an amateur photographer. Nkosi Sikelel' iAfrika was composed by him in 1897."}
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "composed in 1897 by Enoch Sontonga, a Methodist mission school teacher"}
- card: nkosi-sikelel-iafrika
  fact: "The title means \"God bless Africa\""
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Nkosi Sikelel' iAfrika (God Bless Africa)"}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "called on God to bless Africa"}
- card: nkosi-sikelel-iafrika
  fact: "Sontonga died in 1905"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "Died 18 April 1905"}
    - {title: "The Heritage Portal, Daluxolo Moloantoa: The Missionary Beginnings of Nkosi Sikelel' iAfrika (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "after his death in 1905, choirs used to borrow them from his wife"}
- card: nkosi-sikelel-iafrika
  fact: "Samuel Mqhayi added seven more stanzas in Xhosa"
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "Seven additional stanzas in Xhoza were later added by the poet, Samuel Mqhayi."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "Samuel Mqhayi, wrote seven additional stanzas for the song"}
- card: nkosi-sikelel-iafrika
  fact: "The choir of John Dube's Ohlange Institute in Natal popularised it"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In 1901, John Langalibalele Dube founded the Ohlange Institute. The choir at this institute popularised the anthem."}
    - {title: "The Heritage Portal, Daluxolo Moloantoa: The Missionary Beginnings of Nkosi Sikelel' iAfrika (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "In 1905 the black mission-founded Ohlange High School in Kwa-Zulu Natal also adopted the song for its school choir song repertoire."}
- card: nkosi-sikelel-iafrika
  fact: "In 1912 it closed the founding meeting of the South African Native National Congress (later the ANC)"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "The Ohlange Institute’s choir offered a rendition of the song after a closing prayer at the South African Native National Congress’ (later African National Congress) meeting in January 1912."}
    - {title: "The Heritage Portal, Daluxolo Moloantoa: The Missionary Beginnings of Nkosi Sikelel' iAfrika (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "picked as the song to close the founding meeting of the South African Native National Council in 1912"}
- card: nkosi-sikelel-iafrika
  fact: "It was recorded in London in 1923"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "“Nkosi sikelel’ iAfrika” was first recorded on 16 October 1923, in London"}
    - {title: "Nkwazi Magazine, Mutale Chisulo: Sound Familiar? The Story Behind Zambia's National Anthem (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "was the first to have the song recorded in London in 1923"}
- card: nkosi-sikelel-iafrika
  fact: "By 1925 it was the ANC's official closing anthem"
  sources:
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "By 1925 \"Nkosi Sikelel ‘iAfrika\" had become the official song of the African National Congress (ANC)"}
    - {title: "The Heritage Portal, Daluxolo Moloantoa: The Missionary Beginnings of Nkosi Sikelel' iAfrika (2017)", url: "https://www.theheritageportal.co.za/article/missionary-beginnings-nkosi-sikelel-iafrika", quote: "By 1925 it had become the official closing anthem of the organization, now known as the African National Congress."}
    - {title: "Nkwazi Magazine, Mutale Chisulo: Sound Familiar? The Story Behind Zambia's National Anthem (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "was adopted by the African National Congress (ANC) as its official closing anthem in 1925"}
- card: nkosi-sikelel-iafrika
  fact: "At independence in 1964 Zambia set its new anthem's words to the melody; Tanzania's anthem uses the same tune"
  sources:
    - {title: "Nkwazi Magazine, Mutale Chisulo: Sound Familiar? The Story Behind Zambia's National Anthem (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "When Zambia adopted this liberation song as its national anthem in 1964, officials decided to commission new lyrics for the familiar melody."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In the 1960s, Zambia adopted the song as its national anthem."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "Tanzania (then Tanganyika) translated it into Swahili, “Mungu ibariki Afrika”, also adopting it as its national anthem."}
    - {title: "Nkwazi Magazine, Mutale Chisulo: Sound Familiar? The Story Behind Zambia's National Anthem (2025)", url: "https://stg.nkwazimagazine.com/p-data-block-keygg1c0sound-familiar-the-story-behind-zambias-national-anthemp/", quote: "When you hear the national anthems of Zambia, Tanzania, and South Africa, have you ever noticed that they sound similar?"}
- card: nkosi-sikelel-iafrika
  fact: "In 1994, after the first democratic elections, South Africa had two national anthems: Nkosi Sikelel' iAfrika and Die Stem"
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "stated that the Republic of South Africa would have two national anthems. They were Nkosi Sikelel' iAfrika and The Call of South Africa ( Die Stem van Suid-Afrika )."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "In 1994 \"Nkosi Sikelel ‘iAfrika\" and “Die Stem van Suid Afrika”, the old South African anthem, became our official national song."}
    - {title: "South African History Online: Enoch Mankayi Sontonga", url: "https://sahistory.org.za/people/enoch-mankayi-sontonga", quote: "the anthem South Africa adopted after its first democratic elections in 1994"}
- card: nkosi-sikelel-iafrika
  fact: "Die Stem had been the official anthem since 1957"
  sources:
    - {title: "South African Government: National anthem", url: "https://www.gov.za/about-sa/national-symbols/national-anthem", quote: "it was not until 2 May 1957 that government made the announcement that Die Stem had been accepted as the official national anthem of South Africa"}
