  fact: "In 1972 Dibango was commissioned to record a song for Cameroon's team at the Africa Cup of Nations; \"Soul Makossa\" was its B-side"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "A commission to provide a song for the Cameroonian football team when they played in the African Cup of Nations tournament in 1972 lead to Dibango's single \"Hymne de la Coupe d'Afrique des Nations\"."}
    - {title: "The Guardian, Graeme Ewens: Manu Dibango obituary (2020)", url: "https://www.theguardian.com/music/2020/mar/24/manu-dibango-obituary", quote: "as the B-side of a tribute to the Cameroon football team"}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "Originally recorded as a B-side to ‘Hymne de la 8e Coupe d'Afrique des Nations’"}
- card: soul-makossa
  fact: "At first the single drew little interest"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "The single aroused little interest in France"}
    - {title: "AFP Relaxnews via Free Malaysia Today: How 'Soul Makossa' became Manu Dibango's biggest hit (2020)", url: "https://www.freemalaysiatoday.com/category/leisure/2020/03/25/how-soul-makossa-became-manu-dibangos-biggest-hit", quote: "no one mentioned the record’s B-side, “Soul Makossa.”"}
- card: soul-makossa
  fact: "In New York David Mancuso found it in a Brooklyn import shop and played it at the Loft"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "in New York, DJ David Mancuso found a copy in a Brooklyn record store that sold imports. Immediately impressed by the B-side, Mancuso began playing it at his invitation-only club, The Loft."}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "The ‘friend’ was David Mancuso , host and DJ at the Loft in SoHo in Manhattan. Mancuso had discovered the 45 in a small Jamaican store across the East River."}
- card: soul-makossa
  fact: "Frankie Crocker played it on WBLS and demand exploded"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "Frankie Crocker, began playing it on his hugely popular WBLS radio show. Listener response was staggering"}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "Frankie ‘The Chief Rocker’ Crocker brought it from the clubs to radio and demand skyrocketed."}
- card: soul-makossa
  fact: "Without US distribution, local bands released covers until Atlantic released the original"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "as the record had no US distribution, local bands began recording covers of it and issuing these"}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "It was eventually licensed to Ahmet Ertugun’s Atlantic Records for US release, but the gap between its discovery and domestic release allowed several record companies to capitalise and release cover versions of the song"}
    - {title: "The Guardian, Graeme Ewens: Manu Dibango obituary (2020)", url: "https://www.theguardian.com/music/2020/mar/24/manu-dibango-obituary", quote: "there were at least five different cover versions in the American charts"}
- card: soul-makossa
  fact: "In 1973 it reached number 35 on the Billboard Hot 100, driven by the clubs"
  sources:
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "The US release made the Billboard Hot 100, eventually peaking at 35 , with scarcely any radio play."}
    - {title: "Billboard: Manu Dibango chart history, Hot 100", url: "https://www.billboard.com/artist/manu-dibango/chart-history/hsi/", quote: "Soul Makossa Manu Dibango 6/23/73 35"}
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "Dancers loved \"Soul Makossa\""}
- card: soul-makossa
  fact: "Michael Jackson used its chant in \"Wanna Be Startin' Somethin'\" on Thriller (1982); the case was settled out of court"
  sources:
    - {title: "The Guardian, Graeme Ewens: Manu Dibango obituary (2020)", url: "https://www.theguardian.com/music/2020/mar/24/manu-dibango-obituary", quote: "The use of the refrain “mama-say, mama-sa, mama-kossa”, on Michael Jackson’s Wanna Be Starting Something , from his 1982 album Thriller, earned Dibango substantial compensation two decades later."}
    - {title: "The Irish Times: Rihanna, Jacko sued (2009)", url: "https://www.irishtimes.com/culture/rihanna-jacko-sued-1.694292", quote: "Dibango had previously settled out of court with Jackson for using the phrase \"mama-say mama-sa ma-ma-cu-sa\" on his single Wanna Be Startin' Somethin."}
    - {title: "AFP Relaxnews via Free Malaysia Today: How 'Soul Makossa' became Manu Dibango's biggest hit (2020)", url: "https://www.freemalaysiatoday.com/category/leisure/2020/03/25/how-soul-makossa-became-manu-dibangos-biggest-hit", quote: "a case that was settled out of court for an undisclosed sum"}
- card: soul-makossa
  fact: "Rihanna used Jackson's version in \"Don't Stop the Music\"; Dibango sued in 2009 and the Paris court ruled he had waived his claims by accepting a credit"
  sources:
    - {title: "Garth Cartwright: Manu Dibango obituary (The Independent, via Yahoo News, 2020)", url: "https://news.yahoo.com/manu-dibango-cameroon-music-star-122354175.html", quote: "Dibango later attempted to sue Rihanna for sampling Jackson's chant (incorporating \"Soul Makossa\") on her hit \"Don't Stop the Music\" but, as he had earlier accepted a publishing credit on her version, the Paris court ruled he had waived his rights."}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "In 2009 Dibango filed a lawsuit against the two pop giants."}
    - {title: "Mixmag, Bill Brewster: How 'Soul Makossa' made Manu Dibango a club and pop legend (2020)", url: "https://mixmag.net/feature/soul-makossa-manu-dibango-david-mancuso-rihanna-michael-jackson-obituary", quote: "The court case failed in light of Dibango already successfully applying for a writers’ credit on Rihanna’s hit in 2008"}
    - {title: "The Irish Times: Rihanna, Jacko sued (2009)", url: "https://www.irishtimes.com/culture/rihanna-jacko-sued-1.694292", quote: "Rihanna also used the hook on Don't Stop the Music, but failed to get clearance."}
- card: etudiant-noir
  fact: "L'Étudiant noir was a student paper published in Paris in 1935 by students from France's colonies"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Published in 1935 in Paris, the student journal was dedicated to writing about the black colonial diaspora of the French empire."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "the creation, in 1934–1935, of the journal L’Etudiant noir (The Black Student)"}
- card: etudiant-noir
  fact: "It grew out of L'Étudiant martiniquais, the bulletin of the Association of Martinican Students"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Originally, the publication assumed the title L’Étudiant martiniquais , it served as the bulletin for the Association of Martinican Students in France"}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "to take the place of another periodical, L’Etudiant martiniquais (The Martiniquan Student)"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Ce journal, organe corporatif de l’Association des étudiants martiniquais, voit paraître son premier numéro en mars 1935."}
- card: etudiant-noir
  fact: "Under Césaire, president of the association from 1934, it was renamed and spoke for Caribbean and African students together"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "it changed under the editorship of Aimé Césaire, who also assumed the presidency of the association in 1934, and its focus shifted towards a collective exploration and vision of black Francophonie"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Le groupe à l’origine de L’Étudiant Noir rassemblait à la fois des étudiants antillais et africains"}
- card: etudiant-noir
  fact: "Césaire and Damas had been schoolmates at the Lycée Schoelcher in Martinique"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Césaire and Damas were childhood friends, having met at their Martinique high school, the Lycée Schoelcher."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "They were classmates in Fort-de-France, Martinique, where they both graduated from Victor Schoelcher High School."}
- card: etudiant-noir
  fact: "Césaire met Senghor in Paris in 1931 at the Lycée Louis-le-Grand"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Césaire and Senghor, they met in Paris in 1931 at the Lycée Louis-le-Grand"}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "Aimé Césaire and Léon Damas were already friends before they came to Paris in 1931."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "Césaire had been accepted at Lycée Louis Le Grand"}
- card: etudiant-noir
  fact: "Its writers included Césaire, Senghor, Damas, Birago Diop and Ousmane Socé"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Alongside Césaire L’Étudiant noir ’s editors included Léopold Sédar Senghor , Birago Diop , Léon-Gontran Damas , and Ousmane Diop Socé"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "parmi lesquels Aimé Césaire, Léopold Sédar Senghor, Léon-Gontran Damas, Birago Diop et Ousmane Socé"}
- card: etudiant-noir
  fact: "The first issue appeared in March 1935"
  sources:
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "voit paraître son premier numéro en mars 1935"}
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "no. 1 from March 1935"}
- card: etudiant-noir
  fact: "In the third issue (May-June 1935) Césaire's article \"Racial consciousness and social revolution\" used the word négritude"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "in the third issue, republished by Filostrat, Césaire in his article titled \"Racial conscience and social revolution,” deploys négritude once"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "« Nègreries. Conscience raciale et révolution sociale ». L’Étudiant Noir, 3 (mai-juin) : 1-2."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "That is when Aimé Césaire coined for that conscience of a global blackness the concept of “negritude”."}
- card: etudiant-noir
  fact: "Négritude grew into a movement, building on Jane Nardal's earlier call and on Légitime Défense"
  sources:
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "an article by Jane Nardal, entitled “Internationalisme noir”, published in 1928"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Les contradictions qui traversaient les prises de position de Légitime Défense trouvent une résolution progressive dans une série d’articles qu’Aimé Césaire publie par la suite dans L’Étudiant Noir."}
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "it set the stage for the emergence of Negritude"}
- card: etudiant-noir
  fact: "In 1946-48 Césaire, Senghor and Damas all sat in the French parliament; Césaire was mayor of Fort-de-France"
  sources:
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "The three “fathers” of Négritude found themselves members of the same French Parliament: Senghor who had been elected a deputy from Senegal in 1946 was sitting with the Socialists and so was Léon Damas who got elected to represent Guiana in 1948."}
    - {title: "Stanford Encyclopedia of Philosophy, Souleymane Bachir Diagne: Négritude", url: "https://plato.stanford.edu/entries/negritude/", quote: "had been elected in 1946 as a communist mayor of Fort-de-France then as a Representative of France in the French Assembly"}
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Aimé Césaire, Negritude Poet and Mayor of Fort-de-France"}
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Léon-Gontran Damas, Negritude Poet and French Deputy for Guiana"}
- card: legitime-defense
  fact: "Légitime Défense was published in Paris in 1932 by students from Martinique"
  sources:
    - {title: "Verso Books: The Great Camouflage (intro from Refusal of the Shadow, ed. Michael Richardson)", url: "https://versobooks.com/blogs/3936-the-great-camouflage", quote: "In 1932, at the peak of French colonialism, a group of Martiniquan students at the Sorbonne established a Caribbean Surrealist Group, and published a single issue of a journal called Légitime défen"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Ces derniers sont principalement des étudiants et des étudiantes originaires de la Martinique"}
- card: legitime-defense
  fact: "Among them were Étienne Léro, René Ménil and Jules-Marcel Monnerot"
  sources:
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "René Ménil, Étienne Léro, JulesMarcel Monnerot"}
    - {title: "Princeton University Library, Surrealism at One Hundred: La Revue du monde noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/la-revue-du-monde-noir", quote: "Several signatories of Légitime Défense, including Etienne Léro, René Ménil , and Jules-Marcel Monnerot"}
- card: legitime-defense
  fact: "Several had already written for La Revue du monde noir"
  sources:
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Certains d'entre eux avaient déjà collaboré en 1931 à La Revue du Monde Noir"}
    - {title: "Princeton University Library, Surrealism at One Hundred: La Revue du monde noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/la-revue-du-monde-noir", quote: "were contributing authors of La Revue"}
- card: legitime-defense
  fact: "The journal used surrealism and Marxism to address Martinique (anticolonial critique)"
  sources:
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "ce groupe d’étudiants s’approprie la rhétorique surréaliste et communiste afin de créer une conscience littéraire et politique antillaise"}
    - {title: "Magdalena Sophia Toledo: Légitime Défense: surrealismo negro, anticolonialismo..., Aisthesis 64 (abstract)", url: "https://revistaschilenas.uchile.cl/handle/2250/20127", quote: "a partir de su afectación por los debates surrealistas y marxistas, en tanto potencializadores de la crítica anticolonial"}
- card: legitime-defense
  fact: "Only one issue appeared"
  sources:
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Le seul numéro de Légitime Défense est publié en 1932."}
    - {title: "Verso Books: The Great Camouflage (intro from Refusal of the Shadow, ed. Michael Richardson)", url: "https://versobooks.com/blogs/3936-the-great-camouflage", quote: "the first and only issue of Légitime défense"}
- card: legitime-defense
  fact: "The French authorities quickly banned it"
  sources:
    - {title: "Verso Books: The Great Camouflage (intro from Refusal of the Shadow, ed. Michael Richardson)", url: "https://versobooks.com/blogs/3936-the-great-camouflage", quote: "which was quickly banned by French authorities"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "la revue subit une censure immédiate"}
- card: legitime-defense
  fact: "Aimé and Suzanne Césaire and René Ménil returned to Martinique and in 1941, under Vichy, founded Tropiques"
  sources:
    - {title: "Verso Books: The Great Camouflage (intro from Refusal of the Shadow, ed. Michael Richardson)", url: "https://versobooks.com/blogs/3936-the-great-camouflage", quote: "Among the readers of Légitime défense , which was quickly banned by French authorities, were Aimé and Suzanne Césaire and philosopher René Ménil. All three would return to their native Martinique, where in 1941 they established Tropiques"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "Tropiques, qui voit le jour en 1941 en Martinique. Au moment de sa création, l’île se trouve sous le contrôle de l’administration vichyste"}
    - {title: "Princeton University Library, Surrealism at One Hundred: La Revue du monde noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/la-revue-du-monde-noir", quote: "Tropiques , published in Martinique and co-founded by Césaire and his wife Suzanne Césaire"}
- card: legitime-defense
  fact: "Scholars count it as the beginning of Black Caribbean surrealism and of the first debates on Martinican identity"
  sources:
    - {title: "Magdalena Sophia Toledo: Légitime Défense: surrealismo negro, anticolonialismo..., Aisthesis 64 (abstract)", url: "https://revistaschilenas.uchile.cl/handle/2250/20127", quote: "Légitime Défense inaugura a la vez el surrealismo negro y antillano, produciendo un discurso anticolonialista a partir del caso martinicano que está en el origen de los primeros debates identitarios en esta isla caribeña"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "afin de créer une conscience littéraire et politique antillaise"}
- card: legitime-defense
  fact: "Three years later Césaire and his friends started L'Étudiant noir (1935)"
  sources:
    - {title: "Princeton University Library, Surrealism at One Hundred, Paul-Louis Biondi: L'Étudiant noir", url: "https://dpul.princeton.edu/surrealism-at-one-hundred/feature/l-etudiant-noir", quote: "Published in 1935 in Paris"}
    - {title: "Valeria Marino: « Black flowers » : surréalisme(s), révolte(s) et revues francophones, CoSMo 27 (2025)", url: "https://ojs.unito.it/index.php/COSMO/article/view/13092/10598", quote: "voit paraître son premier numéro en mars 1935"}
