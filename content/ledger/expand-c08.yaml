- card: "nigerian-pidgin"
  fact: "No official status; long called Broken English"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "no overt prestige ... no more status in the consciousness of most Nigerians beyond that of \"Broken English\""}
    - {"title": "Eriata Oribhabor, Lingua Franca: From Nigerian Pidgin to Naija Languej, Jalada (2016)", "url": "https://jaladaafrica.org/2016/05/30/lingua-franca-from-nigerian-pidgin-to-naija-languej-by-eriata-oribhabor/", "quote": "preceded by different nomenclatures such as \"Broken English\" ... still being regarded as an unofficial means of communication"}
- card: "nigerian-pidgin"
  fact: "Portuguese arrived in the 15th century, then English"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "from the arrival of the Portuguese in the 15th century ... 15th and 16th-century Portuguese mercenaries serving under African commanders in the armies of Benin City"}
    - {"title": "WBUR Here & Now: Nigerian Pidgin Among New Languages Reaching BBC World Service Listeners (2018)", "url": "https://www.wbur.org/hereandnow/2018/03/13/nigerian-pidgin-bbc-world-service", "quote": "Portuguese, the first European language to reach Nigeria's shores, English, the enduring colonial-era language"}
- card: "nigerian-pidgin"
  fact: "Freed people returning from the Americas contributed"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "influences from Afro-Caribbean pidgins and creoles spoken by slaves repatriated to the West Coast of Africa from the end of the 18th century onward"}
    - {"title": "WBUR Here & Now: Nigerian Pidgin Among New Languages Reaching BBC World Service Listeners (2018)", "url": "https://www.wbur.org/hereandnow/2018/03/13/nigerian-pidgin-bbc-world-service", "quote": "Jamaican patois imported by former slaves returning to the continent"}
- card: "nigerian-pidgin"
  fact: "Krio of Sierra Leone influenced it in the 19th century"
  sources:
    - {"title": "Malcolm Awadajin Finney, Krio, APiCS Online survey 15", "url": "https://apics-online.info/surveys/15", "quote": "later exported to other regions in West Africa during the era of colonization in the 19th century, where it influenced varieties such as ... Nigerian Pidgin"}
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "descendants of these repatriated slaves who became the \"shock troops\" ... closely related dialects ... (Sierra Leone Krio"}
- card: "nigerian-pidgin"
  fact: "First language for generations in Warri and Sapele"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "For several generations, Nigerian Pidgin has been the first language ... in and around the south-central Nigerian cities of Warri and Sapele"}
    - {"title": "The Guardian (Nigeria): Shey Nigerian Pidgin Fit Be Official Language? (archived)", "url": "http://web.archive.org/web/20250722162736/https://guardian.ng/life/shey-nigerian-pidgin-fit-be-official-language/", "quote": "widely spoken in Warri where she was born, and it serves as the first language in some communities in the Niger Delta"}
    - {"title": "Eriata Oribhabor, Lingua Franca: From Nigerian Pidgin to Naija Languej, Jalada (2016)", "url": "https://jaladaafrica.org/2016/05/30/lingua-franca-from-nigerian-pidgin-to-naija-languej-by-eriata-oribhabor/", "quote": "Its origins lie in the Niger Delta areas (Warri, Sapele, Port-Harcourt etc) where it has effectively creolized"}
