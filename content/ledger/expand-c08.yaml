- card: "alessandro-de-medici"
  fact: "Florence was nominally a republic; the Medici avoided princely titles"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "Tired of pretending not to be princes in their pseudo-republic"}
    - {"title": "Mario de Valdes y Cocom, The Medici, PBS Frontline", "url": "https://www.pbs.org/wgbh/pages/frontline/shows/secret/famous/mediciupdate.html", "quote": "the family had assiduously avoided such honorifics so as not to appear insensitive to the republican aspirations of the population"}
- card: "alessandro-de-medici"
  fact: "Born around 1511, illegitimate son of a Medici household servant identified as Simonetta da Collevecchio"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "born about 1511 or 1512, the illegitimate offspring of Lorenzo de' Medici and a servant apparently working in the Medici household, tentatively identified as a certain Simonetta from Collevecchio"}
    - {"title": "Saint Louis Art Museum: Alessandro de' Medici (127:2024)", "url": "https://www.slam.org/collection/objects/73003/", "quote": "His mother, Simonetta da Collevecchio, was a servant of the Medici family"}
    - {"title": "EUIdeas: Who was Giulia de Medici?", "url": "https://euideas.eui.eu/who-was-giulia-de-medici-finding-a-black-presence-in-renaissance-florence", "quote": "Alessandro de Medici (1511–1537)"}
- card: "alessandro-de-medici"
  fact: "Father officially Lorenzo, Duke of Urbino; many thought Giulio de' Medici (Clement VII)"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "rumored to be the illegitimate son of Giulio de' Medici ... elected as Pope Clement VII"}
    - {"title": "Mario de Valdes y Cocom, The Medici, PBS Frontline", "url": "https://www.pbs.org/wgbh/pages/frontline/shows/secret/famous/mediciupdate.html", "quote": "reported to be the son of the late Lorenzo dei Medici, Duke of Urbino, but the affection shown him by Clement VII, gave strength to the general opinion that the Pope was his father"}
- card: "alessandro-de-medici"
  fact: "Some contemporaries called his mother a slave; he was nicknamed il Moro"
  sources:
    - {"title": "Mario de Valdes y Cocom, The Medici, PBS Frontline", "url": "https://www.pbs.org/wgbh/pages/frontline/shows/secret/famous/mediciupdate.html", "quote": "specifically identified as a \"slave\" by the historians Bernardo Segni and Giovanni Cambi, both contemporaries"}
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "Whisperings that the illegitimate Alessandro was the son of a \"Moorish slave\" ... Alessandro himself, was sometimes referred to as a \"Moor.\""}
    - {"title": "Saint Louis Art Museum: Alessandro de' Medici (127:2024)", "url": "https://www.slam.org/collection/objects/73003/", "quote": "He was nicknamed \"Il Moro,\" meaning \"The Moor,\""}
- card: "alessandro-de-medici"
  fact: "\"Moor\" was ambiguous; some see his mother as a peasant from Lazio"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "\"Moor\" might refer to someone we would recognize as \"black,\" but it also would be used for an Arab or Berber ... a person of dark complexion"}
    - {"title": "Mario de Valdes y Cocom, The Medici, PBS Frontline", "url": "https://www.pbs.org/wgbh/pages/frontline/shows/secret/famous/mediciupdate.html", "quote": "\"the text of a letter that she wrote to her son in 1529 suggests that she was an Italian peasant from Lazio.\""}
    - {"title": "EUIdeas: Who was Giulia de Medici?", "url": "https://euideas.eui.eu/who-was-giulia-de-medici-finding-a-black-presence-in-renaissance-florence", "quote": "his mother, Simonetta da Collevecchio, who is understood to be freed from enslavement, was, after all, still a peasant"}
- card: "alessandro-de-medici"
  fact: "A pope-emperor bargain made him first hereditary Duke of Florence in the early 1530s"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "a deal between the pope and the emperor the following year made Alessandro the first hereditary duke of Florence"}
    - {"title": "Mario de Valdes y Cocom, The Medici, PBS Frontline", "url": "https://www.pbs.org/wgbh/pages/frontline/shows/secret/famous/mediciupdate.html", "quote": "the bargain Clement struck with the Emperor Charles V in 1529 to have Alessandro created Duke of Florence"}
    - {"title": "Saint Louis Art Museum: Alessandro de' Medici (127:2024)", "url": "https://www.slam.org/collection/objects/73003/", "quote": "Alessandro was named the first duke of Florence in 1530"}
- card: "alessandro-de-medici"
  fact: "Murdered by his cousin Lorenzino on 6 January 1537"
  sources:
    - {"title": "John T. Scott, Was the Black Prince Black?, Los Angeles Review of Books", "url": "https://lareviewofbooks.org/article/was-the-black-prince-black-and-other-historical-questions", "quote": "Alessandro was assassinated on January 6, 1537 ... lured by his perfidious cousin Lorenzino de' Medici"}
    - {"title": "Saint Louis Art Museum: Alessandro de' Medici (127:2024)", "url": "https://www.slam.org/collection/objects/73003/", "quote": "assassinated by his cousin in 1537"}
- card: "alessandro-de-medici"
  fact: "His daughter Giulia was taken in by Maria Salviati, mother of Cosimo I; Pontormo painted them together"
  sources:
    - {"title": "Walters Art Museum: Pontormo, Portrait of Maria Salviati de' Medici and Giulia de' Medici (archived)", "url": "http://web.archive.org/web/20260713025250/https://art.thewalters.org/object/37.596/", "quote": "The little girl holding her hand here is surely Giulia, a Medici relative who was left in Maria's care after the murder of the child's father, Duke Alessandro de' Medici ... mother of Cosimo I"}
    - {"title": "EUIdeas: Who was Giulia de Medici?", "url": "https://euideas.eui.eu/who-was-giulia-de-medici-finding-a-black-presence-in-renaissance-florence", "quote": "The child, Giulia de Medici (circa 1535–1600), was left under the custody of Alessandro's cousin, Maria Salviati, whose own child Cosimo I de Medici"}
