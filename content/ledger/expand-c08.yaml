# Expansion batch c08: one entry per fact in card bodies and wow lines, each with >=2 independent sources and a verbatim quote.
- card: "kikakui"
  fact: "Kikakui is a syllabary for Mende, written right to left"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "Mende is a syllabary, written from right to left."}
    - {"title": "Omniglot: Mende syllabary (Kikakui)", "url": "https://www.omniglot.com/writing/kikakui.htm", "quote": "Writing direction : right to left in horizontal lines."}
- card: "kikakui"
  fact: "Mende is spoken in Sierra Leone and Liberia"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "The Mende and the Vai speak related Mande languages and are neighbors in Sierra Leone and Liberia."}
    - {"title": "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", "quote": "for writing the Sierra Leonean language, Mende, spoken by almost 1.5 million people"}
- card: "kikakui"
  fact: "Right-to-left direction linked to Arabic script known to its makers"
  sources:
    - {"title": "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", "quote": "attributed to Kamara's Islamic heritage and familiarity with the Arabic script, also written from right to left"}
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "Mohamed Turay, an Islamic scholar in the Sierra Leonean town of Maka"}
- card: "kikakui"
  fact: "Named after the sounds of its first three signs ki, ka, ku"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "also called \"Kikakui\" for the first three characters in the system"}
    - {"title": "The Unicode Standard 17.0, chapter 19", "url": "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", "quote": "It is named Kikakui after the sound of its first three characters."}
- card: "kikakui"
  fact: "First signs by Mohamed Turay (c. 1917); student Kisimi Kamara reworked and enlarged it in the early 1920s to nearly two hundred signs"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "devised around 1917 by Mohamed Turay ... further developed by his son-in-law and student, Kisimi Kamara ... an additional 150 syllabic characters to Turay's original 42"}
    - {"title": "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", "quote": "It was modified by one of Turay's students, Kisimi Kamara, in 1921 to produce the form currently used. ... each of the 195 symbols"}
- card: "kikakui"
  fact: "Many signs close in form to the Vai script of Liberia"
  sources:
    - {"title": "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", "quote": "some knowledge of the Vai script of Liberia, as the two scripts share significant similarities both in form and in origin"}
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "the syllabic blueprint for the script was unquestionably influenced from the neighboring Vai"}
- card: "kikakui"
  fact: "From the 1920s Kamara spread it beyond his chiefdom; for two decades used for letters and records"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "efforts to promote the script outside of the Barri chiefdom ... beginning in the 1920s ... The script was used for record-keeping and correspondence"}
    - {"title": "Omniglot: Mende syllabary (Kikakui)", "url": "https://www.omniglot.com/writing/kikakui.htm", "quote": "During the 1920s and 1930s he ran a school in Potoru to teach Ki-ka-ku. The syllabary became a popular method of keeping records and writing letters."}
- card: "kikakui"
  fact: "In the 1940s the British Protectorate Literacy Bureau in Bo taught Mende in Latin letters and Kikakui fell out of use"
  sources:
    - {"title": "Everson and Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", "url": "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", "quote": "In the 1940s, however, the British established the Protectorate Literacy Bureau in Bo, and a Latin orthography for Mende was taught. This contributed to the gradual disuse"}
    - {"title": "Omniglot: Mende syllabary (Kikakui)", "url": "https://www.omniglot.com/writing/kikakui.htm", "quote": "During the 1940s the British set up the Protectorate Literacy Bureau in Bo ... usage of Kisimi's syllabary gradually diminished"}
- card: "kikakui"
  fact: "Encoded in Unicode 7.0 in 2014"
  sources:
    - {"title": "Unicode Consortium: Unicode 7.0.0", "url": "https://www.unicode.org/versions/Unicode7.0.0/", "quote": "Mende Kikakui ... 1E800..1E8DF Mende Kikakui"}
    - {"title": "Script Encoding Initiative, UC Berkeley: Scripts encoded in Unicode", "url": "https://linguistics.berkeley.edu/sei/scripts-encoded.html", "quote": "Mende Kikakui 7.0 L2/12-023 Michael Everson"}
    - {"title": "Unicode Consortium: Unicode release dates", "url": "https://www.unicode.org/history/publicationdates.html", "quote": "7.0.0 2014 June 16"}
- card: "garay"
  fact: "Garay is an alphabet for Wolof of Senegal, right to left, on the Arabic model"
  sources:
    - {"title": "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", "url": "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", "quote": "The script is based upon the Arabic model and is written linearly from right-to-left."}
    - {"title": "Omniglot: Wolof", "url": "https://www.omniglot.com/writing/wolof.htm", "quote": "This alphabet is written from right to left and is modelled loosely on the Arabic script."}
- card: "garay"
  fact: "Wolof officially written in Latin letters and also in Wolofal (Arabic script)"
  sources:
    - {"title": "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", "url": "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", "quote": "The official script in Senegal for Wolof is Latin, although the Wolofal script (an Arabic-based script written in the 'Ajami' style) is also used."}
    - {"title": "Omniglot: Wolof", "url": "https://www.omniglot.com/writing/wolof.htm", "quote": "Wolof was first written with a version of the Arabic script known as Wolofal"}
- card: "garay"
  fact: "Designed to be familiar to anyone who knows Arabic script"
  sources:
    - {"title": "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", "url": "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", "quote": "Faye designed Garay to be easy to learn, familiar to anyone who had lea[rned the Arabic script]"}
    - {"title": "The Unicode Standard 17.0, chapter 19", "url": "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", "quote": "The script is designed to be easy to learn and use by people familiar with the Arabic script."}
- card: "garay"
  fact: "Created by Assane Faye and published in January 1961"
  sources:
    - {"title": "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", "url": "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", "quote": "The Wolof alphabet was created by Assane Faye. Its official date of origin is January 1961."}
    - {"title": "SIL Writing Systems (formerly ScriptSource): Garay", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", "quote": "created by Assane Faye in 1961 for writing the Wolof language"}
- card: "garay"
  fact: "Consonants have capital and small forms; capitals set apart by a swash"
  sources:
    - {"title": "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", "url": "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", "quote": "is a casing script, where capital letters are generally distinguished by a swash distinguishing them from the small letters"}
    - {"title": "The Unicode Standard 17.0, chapter 19", "url": "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", "quote": "The consonant letters are bicameral. ... They are generally distinguished from lowercase letters by a swash."}
    - {"title": "Rovenchak, Faye and Riley, Consideration of the encoding of Garay, L2/22-048 (2022)", "url": "https://www.unicode.org/L2/L2022/22048-garay-script.pdf", "quote": "U+10D54 GARAY CAPITAL LETTER BA ... U+10D74 GARAY SMALL LETTER BA"}
- card: "garay"
  fact: "Faye taught it informally for decades to a few hundred people"
  sources:
    - {"title": "SIL Writing Systems (formerly ScriptSource): Garay", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", "quote": "Assane Faye had been offering lessons in the script to hundreds of people over the years"}
    - {"title": "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", "url": "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", "quote": "The user community for Garay is small at present, some 200 people ... taught informally for more than fifty years"}
- card: "garay"
  fact: "A Quran with interlinear Wolof translation in Garay exists"
  sources:
    - {"title": "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", "url": "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", "quote": "there exists also a Qur'ān with interlinear text giving the translation into Wolof using Garay script"}
    - {"title": "SIL Writing Systems (formerly ScriptSource): Garay", "url": "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", "quote": "translated the Koran using it"}
- card: "garay"
  fact: "Encoded in Unicode 16.0 in 2024"
  sources:
    - {"title": "Script Encoding Initiative, UC Berkeley: Scripts encoded in Unicode", "url": "https://linguistics.berkeley.edu/sei/scripts-encoded.html", "quote": "Garay 16.0 L2/16-069 Michael Everson"}
    - {"title": "Unicode Consortium: Unicode release dates", "url": "https://www.unicode.org/history/publicationdates.html", "quote": "16.0.0 2024 September 10"}
- card: "bouabre-bete-script"
  fact: "Pictograms matched to Bété syllables, meant for any language"
  sources:
    - {"title": "MoMA, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", "url": "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", "quote": "matched spoken syllables in the Bété language with pictograms ... could be applied not only to Bété but to other languages as well"}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "an inventory of sounds that could be used to transcribe all of the world's languages"}
    - {"title": "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", "url": "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", "quote": "The resulting syllabary can be used in all languages"}
- card: "bouabre-bete-script"
  fact: "Sign counts differ between sources (448, 440, 401, 449 drawings)"
  sources:
    - {"title": "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", "url": "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", "quote": "an alphabet consisting of 448 monosyllabic pictograms"}
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "Soit 440 pictogrammes monosyllabiques"}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "composed of 401 monosyllabic pictograms"}
    - {"title": "MoMA, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", "url": "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", "quote": "The series consists of 449 drawings"}
- card: "bouabre-bete-script"
  fact: "Born 1923 in Zéprégühé into the Bété people"
  sources:
    - {"title": "Contemporary And: Frédéric Bruly Bouabré (1923–2014)", "url": "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", "quote": "born in 1923 in Zéprégühé"}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "Born in Zéprégüé, Côte d'Ivoire, Frédéric Bruly Bouabré (1923–2014) belonged to the Bété people"}
- card: "bouabre-bete-script"
  fact: "Sailor in the French navy in WWII, then clerk in the colonial administration in Senegal"
  sources:
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "called up as a sailor in the French West African Navy and landed in Dakar in 1941. At the end of the Second World War he stayed on in Senegal, where he worked as a clerk"}
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "Enrôlé dans la marine pendant la Seconde Guerre mondiale, il devient ensuite fonctionnaire de l'administration coloniale."}
- card: "bouabre-bete-script"
  fact: "On 11 March 1948, on his way to work, he saw seven coloured suns circling in the sky"
  sources:
    - {"title": "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", "url": "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", "quote": "In Dakar, on March 11th of the year 1948 ... on his way to work one day, he suddenly saw seven differently coloured suns orbiting in the sky"}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "On his way to work on 11 March 1948 Bouabré had a vision"}
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "un jour de mars 1948, il avait vu le ciel s'ouvrir et sept soleils colorés décrire «un cercle de beauté»"}
- card: "bouabre-bete-script"
  fact: "He took the name Cheik Nadro and set out to record and pass on all his knowledge, starting with a script for his people"
  sources:
    - {"title": "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", "url": "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", "quote": "Adopting the name Cheik Nadro-le-Révélateur ... To that end, he invented a 'Bété alphabet'"}
    - {"title": "The Digital Orientalist: An Ivorian innovation, the Bété script (2019)", "url": "https://digitalorientalist.com/2019/01/08/an-ivorian-innovation-the-bete-script/", "quote": "who called himself \"Cheikh Nadro\""}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "henceforth his encyclopaedic mission was to note down and pass on all the knowledge granted him"}
- card: "bouabre-bete-script"
  fact: "Thousands of small cards in ballpoint and coloured pencil, each framed by a handwritten caption, gathered as Knowledge of the World"
  sources:
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "des milliers de petits dessins ... avec des stylos bille et des crayons de couleur ... Chacun d'eux est encadré d'une sorte de légende écrite à la main. Réunis sous le titre Connaissance du monde"}
    - {"title": "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", "url": "https://artbrut.ch/en/artists/bruly-bouabre-frederic", "quote": "drawing shapes with a black or blue ballpoint, then colouring them in with pencil. Each drawing is framed with a caption"}
    - {"title": "MoMA, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", "url": "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", "quote": "Bouabré termed these surveys \"connaissance du monde,\" or \"knowledge of the world,\""}
- card: "bouabre-bete-script"
  fact: "After Magiciens de la terre (Paris, 1989) museums worldwide invited him"
  sources:
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "présenté dans l'exposition de Jean-Hubert Martin Magiciens de la terre, à Paris en 1989, l'artiste est invité dans les musées internationaux"}
    - {"title": "Contemporary And: Frédéric Bruly Bouabré (1923–2014)", "url": "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", "quote": "participating in major shows such as Les Magiciens de la Terre (1989), Documenta XI (2002)"}
- card: "bouabre-bete-script"
  fact: "Died in Abidjan on 28 January 2014, aged about 91"
  sources:
    - {"title": "Contemporary And: Frédéric Bruly Bouabré (1923–2014)", "url": "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", "quote": "Bouabré died aged 91 on January 28, 2014."}
    - {"title": "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé (2014)", "url": "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", "quote": "Frédéric Bruly Bouabré est décédé chez lui à Abidjan, ce mardi, à 91 ans. Ou à peu près."}
- card: "mandombe"
  fact: "Script from the DRC for Kikongo, Lingala, Swahili; name means \"for the Blacks\""
  sources:
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "Mandombe, which means \"for the Blacks\" ... first designed to write Kikongo and Lingala"}
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "Mandombe—it means \"for the Blacks\"—is used to write Lingala, Kikongo ya leta, and Swahili"}
- card: "mandombe"
  fact: "Written left to right in syllable blocks; signs built from mirrored 5 and 2 shapes; orientation distinguishes consonants"
  sources:
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "Mandombe is written left to right. ... A sign orientation is used as a distinguishing feature."}
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "each block represents a syllable ... Each symbol contains either the \"5\" or \"2\" shape (mirror images of each other)"}
    - {"title": "Omniglot: Mandombe", "url": "https://omniglot.com/writing/mandombe.htm", "quote": "The orientation of consonants indicates the sounds they represent"}
- card: "mandombe"
  fact: "In 1978 Wabeladio Payi (about 20) dreamed of Simon Kimbangu, then saw the 5 and 2 in his brick wall"
  sources:
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "In 1978, the 21-year-old ... looked at the brick wall of his home, saw the shapes of a \"5\" and a \"2\" ... Payi had a dream in which the prophet Simon Kimbangu came to him"}
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "invented in 1978 by David Wabeladio Payi (*15.07.1957 – †04.04.2013) ... based on the observation of the uncoated portion of the brick wall of the inventor's room"}
- card: "mandombe"
  fact: "He became a Kimbanguist and taught the script as professor at the Kimbanguist university in Kinshasa"
  sources:
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "a member of the Kimbanguist church. He was given a professorship at the Kimbanguist University in Kinshasa, where he taught the script"}
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "became a Kimbanguist after his revelatory dream ... became a professor at Simon Kimbangu University, where he taught classes in his invention"}
- card: "mandombe"
  fact: "Honorary doctorate from the University of Kinshasa in 2011; died 2013"
  sources:
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "On December 22, 2011 he was granted the title Doctor honoris causa at the University of Kinshasa."}
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "In 2011 he was given the title honoris causa at the University of Kinshasa. He died in 2013."}
- card: "mandombe"
  fact: "Taught in Kimbanguist writing centres and schools in both Congos and Angola; thousands of users"
  sources:
    - {"title": "Alex Bellos, Puzzle Monday: A Divine Script From the Congo, Atlas Obscura (archived)", "url": "http://web.archive.org/web/20251225101142/https://www.atlasobscura.com/articles/puzzles-mandombe-congo-language", "quote": "taught at Kimbanguist primary and secondary schools in the DRC, the Republic of the Congo and Angola ... understood by up to 10,000 people"}
    - {"title": "Rovenchak, Pasch, Riley and Wazi, Proposal for encoding the Mandombe script, L2/16-077 (2016)", "url": "https://www.unicode.org/L2/L2016/16077-mandombe.pdf", "quote": "The number of active Mandombe users is five to six thousand in Africa"}
    - {"title": "Omniglot: Mandombe", "url": "https://omniglot.com/writing/mandombe.htm", "quote": "Mandombe is taught is schools run by the Kimbanguist church in Angola, the Republic of the Congo, and the DRC."}
- card: "bilal"
  fact: "Bilal's parents were from Abyssinia; he was enslaved"
  sources:
    - {"title": "Encyclopaedia Britannica: adhan (archived)", "url": "http://web.archive.org/web/20261101115118/https://www.britannica.com/topic/adhan", "quote": "A formerly enslaved man whose parents were from Abyssinia (modern Ethiopia)"}
    - {"title": "Ibn Ishaq, The Life of Muhammad, tr. A. Guillaume (Internet Archive)", "url": "https://archive.org/details/GuillaumeATheLifeOfMuhammad", "quote": "His father's name was Ribah and his mother was Hamama ... being slave born"}
    - {"title": "Barry Hoberman, The First Muezzin, Saudi Aramco World (1983)", "url": "https://archive.aramcoworld.com/issue/198304/the.first.muezzin.htm", "quote": "Bilal ibn Rabah, an Ethiopian"}
- card: "bilal"
  fact: "One of the first in Mecca to follow Muhammad"
  sources:
    - {"title": "Barry Hoberman, The First Muezzin, Saudi Aramco World (1983)", "url": "https://archive.aramcoworld.com/issue/198304/the.first.muezzin.htm", "quote": "one of the first inhabitants of Makkah to accept the religion that a local merchant named Muhammad ... began to preach"}
    - {"title": "Encyclopaedia Britannica: adhan (archived)", "url": "http://web.archive.org/web/20261101115118/https://www.britannica.com/topic/adhan", "quote": "he was the second person after Abū Bakr to become a follower"}
- card: "bilal"
  fact: "His master Umayya ibn Khalaf laid him in the valley under a great rock to make him deny Muhammad; he refused; Abu Bakr freed him"
  sources:
    - {"title": "Ibn Ishaq, The Life of Muhammad, tr. A. Guillaume (Internet Archive)", "url": "https://archive.org/details/GuillaumeATheLifeOfMuhammad", "quote": "Umayya b. Khalaf ... used to bring him out at the hottest part of the day and throw him on his back in the open valley and have a great rock put on his chest"}
    - {"title": "Barry Hoberman, The First Muezzin, Saudi Aramco World (1983)", "url": "https://archive.aramcoworld.com/issue/198304/the.first.muezzin.htm", "quote": "Bilal, however, would not renounce Islam and eventually Abu Bakr ... rescued him"}
- card: "bilal"
  fact: "After a follower's dream about calling to prayer, Muhammad chose Bilal for his more penetrating voice; first muezzin"
  sources:
    - {"title": "Ibn Ishaq, The Life of Muhammad, tr. A. Guillaume (Internet Archive)", "url": "https://archive.org/details/GuillaumeATheLifeOfMuhammad", "quote": "he should go with Bilal and communicate it to him so that he might call to prayer thus, for he had a more penetrating voice"}
    - {"title": "Encyclopaedia Britannica: adhan (archived)", "url": "http://web.archive.org/web/20261101115118/https://www.britannica.com/topic/adhan", "quote": "Abd Allāh ibn Zayd dreamed ... The first person to utter the adhān, and therefore the first muezzin, was Bilāl ibn Rabāḥ"}
- card: "bilal"
  fact: "At the conquest of Mecca in 630 he gave the call at the Kaaba"
  sources:
    - {"title": "Encyclopaedia Britannica: adhan (archived)", "url": "http://web.archive.org/web/20261101115118/https://www.britannica.com/topic/adhan", "quote": "After the conquest of Mecca in 630, Bilāl is said to have called the adhān from atop the Kaaba"}
    - {"title": "Ibn Ishaq, The Life of Muhammad, tr. A. Guillaume (Internet Archive)", "url": "https://archive.org/details/GuillaumeATheLifeOfMuhammad", "quote": "when the apostle entered the Ka'ba in the year of the conquest in company with Bilal he ordered him to call the people to prayer"}
    - {"title": "Barry Hoberman, The First Muezzin, Saudi Aramco World (1983)", "url": "https://archive.aramcoworld.com/issue/198304/the.first.muezzin.htm", "quote": "January, 630 ... ascended to the top of the Ka'ba to call the believers to prayer"}
- card: "bilal"
  fact: "He went to Syria with the Muslim armies and stayed there"
  sources:
    - {"title": "Barry Hoberman, The First Muezzin, Saudi Aramco World (1983)", "url": "https://archive.aramcoworld.com/issue/198304/the.first.muezzin.htm", "quote": "at some point Bilal accompanied the Muslim armies to Syria and that he died there"}
    - {"title": "Ibn Ishaq, The Life of Muhammad, tr. A. Guillaume (Internet Archive)", "url": "https://archive.org/details/GuillaumeATheLifeOfMuhammad", "quote": "Bilal had gone there and remained as a combatant"}
- card: "tsotsitaal"
  fact: "Tsotsitaal is a style or register rather than a separate language, used mostly by young urban men"
  sources:
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "should not be described as a language, but instead as a style or register ... expressing male youth culture"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "The speakers (for the most part male within the thesis data) define themselves in the sense of a particular masculinity, which involves being 'streetwise'"}
- card: "tsotsitaal"
  fact: "Emerged in the 1940s in Johannesburg's mixed townships, above all Sophiatown, on an Afrikaans base"
  sources:
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "it first emerged in the mixed townships of Johannesburg, such as Sophiatown, in the 1940s ... the earliest instantiation of tsotsitaal from Sophiatown did indeed have an Afrikaans syntactic base"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "Tsotsitaal was first observed in Sophiatown in the 1940S (Glaser 2000: 50)"}
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "he grew up speaking Tsotsitaal outside the corner shops of Sophiatown"}
- card: "tsotsitaal"
  fact: "Vocabulary largely from Afrikaans, the bosses' language, with meanings and word order twisted"
  sources:
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "Much of it was borrowed from Afrikaans, but on the streets of \"Sof'Town,\" they played around with the meaning and order of the words until they had broken up the baas-taal"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "the Afrikaans base of Tsotsitaal in Sophiatown held symbolic power for its speakers due to the dominant position of white Afrikaners"}
- card: "tsotsitaal"
  fact: "Words taken from American gangster films"
  sources:
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "lines from films like Street with No Name and Scarface"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "the heavy influence of American gangster movies in Sophiatown"}
- card: "tsotsitaal"
  fact: "Meant to exclude outsiders; in the 1940s hardly any white person understood it"
  sources:
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "In the 1940S, very few white people spoke or understood Tsotsitaal (Molamu 1995)"}
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "\"It was a secret language meant to exclude the state apparatus,\" says Molamu"}
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "lexical variation with anti-language intentions"}
- card: "tsotsitaal"
  fact: "In the 1950s Sophiatown was cleared under the Group Areas Act and its people moved to townships such as Soweto"
  sources:
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "the Group Areas Act (No. 41 of 1950) ... As a result of forced removals, generations of people who were born in ... Sophiatown (before they were relocated to black townships, such as Soweto)"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "townships which were populated by the forced removals of Sophiatown in the 1950S"}
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "his family was moved under the Group Areas Act from Die Kas to Moroka, in Soweto"}
- card: "tsotsitaal"
  fact: "Their children built tsotsitaal on urban Zulu or Sotho; versions such as iscamtho spread across South Africa"
  sources:
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "their offspring ... spoke either an urban isiZulu-based tsotsitaal ... or an urban Sesotho-based tsotsitaal ... alternative names include flaaitaal, iscamtho"}
    - {"title": "Ellen Hurst, PhD thesis on Cape Town Tsotsitaal, University of Cape Town (2008)", "url": "https://open.uct.ac.za/bitstream/handle/11427/10934/thesis_hum_2008_hurst_e.pdf?sequence=1", "quote": "the Zulu-based variety may have later evolved into Iscamtho (Glaser 2000: 108)"}
- card: "tsotsitaal"
  fact: "Louis Molamu published a dictionary of the language of Sophiatown in 2003"
  sources:
    - {"title": "Ditsele and Hurst, Travelling terms and local innovations, Literator 37:2 (2016)", "url": "https://literator.org.za/index.php/literator/article/view/1274/2133", "quote": "Molamu, L., 2003, Tsotsi-Taal: A dictionary of the language of Sophiatown, University of South Africa, Pretoria."}
    - {"title": "Mail & Guardian: Memories of majietas (2003)", "url": "https://mg.co.za/article/2003-06-26-memories-of-majietas", "quote": "Molamu has finally published Tsotsitaal: A Dictionary of the Language of Sophiatown (Unisa Press)"}
- card: "sheng"
  fact: "Sheng is an age-marked urban form of Kenyan Swahili with words from English and other languages"
  sources:
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "Sheng is an age-marked, urban dialect of Kenyan Swahili whose outer form is pidgin-like ... English is also an important source of many loan words in Sheng"}
    - {"title": "Peter Githinji, Strategies for Identifying Sheng, Multilingual Margins 9:1 (2022)", "url": "https://epubs.ac.za/index.php/mm/article/download/1398/993/3093", "quote": "Sheng as a social dialect of Swahili"}
    - {"title": "Mary Spyropoulos, Sheng: Some Preliminary Investigations, JASO 18:1 (1987)", "url": "https://ora.ox.ac.uk/objects/uuid:8ebb5fa1-62e7-4d86-9d85-238b54938499/files/rq524jp937", "quote": "a hybrid language comprised of components from all these levels emerged in Nairobi's Eastlands"}
- card: "sheng"
  fact: "\"msee\" means man/person"
  sources:
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "msee n mwanamme man"}
    - {"title": "Peter Githinji, Strategies for Identifying Sheng, Multilingual Margins 9:1 (2022)", "url": "https://epubs.ac.za/index.php/mm/article/download/1398/993/3093", "quote": "msee [msε:] person"}
- card: "sheng"
  fact: "Words constantly shift meaning; code excludes outsiders"
  sources:
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "rapid lexical innovations are constantly taking place ... semantic games aimed at excluding 'outsiders'"}
    - {"title": "Peter Githinji, Strategies for Identifying Sheng, Multilingual Margins 9:1 (2022)", "url": "https://epubs.ac.za/index.php/mm/article/download/1398/993/3093", "quote": "a lexeme ... already in existent in donor languages is assigned new meanings"}
- card: "sheng"
  fact: "The name is read as Swahili plus English"
  sources:
    - {"title": "Mary Spyropoulos, Sheng: Some Preliminary Investigations, JASO 18:1 (1987)", "url": "https://ora.ox.ac.uk/objects/uuid:8ebb5fa1-62e7-4d86-9d85-238b54938499/files/rq524jp937", "quote": "the term 'Sheng' has been coined from a combination of the letters 'S' and 'h' in Swahili, and the 'eng' of English"}
    - {"title": "Peter Githinji, Strategies for Identifying Sheng, Multilingual Margins 9:1 (2022)", "url": "https://epubs.ac.za/index.php/mm/article/download/1398/993/3093", "quote": "its name is coined from Swahili English Slang"}
- card: "sheng"
  fact: "Grew up in Eastlands, colonial-era estates for African workers, among children of mixed-language families"
  sources:
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "a section of the city that emerged during the colonial period as a reserved area for African workers ... there is a high consensus that this is where Sheng emerged"}
    - {"title": "Mary Spyropoulos, Sheng: Some Preliminary Investigations, JASO 18:1 (1987)", "url": "https://ora.ox.ac.uk/objects/uuid:8ebb5fa1-62e7-4d86-9d85-238b54938499/files/rq524jp937", "quote": "It is possible that the children of these workers first started to create Sheng ... the 'mother' or ethnic tongue ... Kiswahili ... English, taught in schools"}
- card: "sheng"
  fact: "Date of origin disputed (Spyropoulos 1987: thirty or forty years; post-1963 migrants)"
  sources:
    - {"title": "Mary Spyropoulos, Sheng: Some Preliminary Investigations, JASO 18:1 (1987)", "url": "https://ora.ox.ac.uk/objects/uuid:8ebb5fa1-62e7-4d86-9d85-238b54938499/files/rq524jp937", "quote": "Over the last thirty or forty years, a street language has been developing in Nairobi"}
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "it was probably the early immigrants in Nairobi after national independence in 1963 ... our research revealed competing claims about Sheng's specific origins"}
- card: "sheng"
  fact: "Spread via shoeshine boys, hawkers, parking boys (who watch cars for tips), then to wealthier youth and private-school pupils"
  sources:
    - {"title": "Mary Spyropoulos, Sheng: Some Preliminary Investigations, JASO 18:1 (1987)", "url": "https://ora.ox.ac.uk/objects/uuid:8ebb5fa1-62e7-4d86-9d85-238b54938499/files/rq524jp937", "quote": "shoe-shine boys, curio-sellers, hawkers and parking boys ... spoken by many children attending some of the private and most prestigious schools in Nairobi"}
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "Its spread away from Eastlands to become a street language was through the informal sector, e.g. shoeshine boys, curio sellers, hawkers and parking boys ... some upper class adolescents we interviewed claimed to speak the code"}
- card: "sheng"
  fact: "By the early 2000s heard in markets, homes, radio, TV, advertising, and spreading to other towns and rural areas"
  sources:
    - {"title": "Chege Githiora, Sheng: Peer Language, Swahili Dialect or Emerging Creole?, JACS 15:2 (2002)", "url": "https://lists.kictanet.or.ke/pipermail/kictanet/attachments/20120227/4bc26f31/attachment.pdf", "quote": "speaking Sheng in the marketplace, in the streets and even at home. The code has also found plenty of space in local television and radio ... advertisements ... its influence can be felt in other towns and rural areas of Kenya"}
    - {"title": "Peter Githinji, Strategies for Identifying Sheng, Multilingual Margins 9:1 (2022)", "url": "https://epubs.ac.za/index.php/mm/article/download/1398/993/3093", "quote": "the proliferation of enabling communication media has increased its reach to every corner of the country"}
- card: "ebonics-oakland"
  fact: "AAE / AAVE / Ebonics is the dialect spoken by many African Americans"
  sources:
    - {"title": "Salikoko Mufwene, Encyclopaedia Britannica: Ebonics (archived)", "url": "http://web.archive.org/web/20250327162147/https://www.britannica.com/topic/Ebonics", "quote": "Ebonics, dialect of American English spoken by a large proportion of African Americans ... Also called: African American Vernacular English (AAVE)"}
    - {"title": "Linguistic Society of America: Resolution on the Oakland Ebonics Issue (archived)", "url": "http://web.archive.org/web/20240225224101/https://www.linguisticsociety.org/resource/lsa-resolution-oakland-ebonics-issue", "quote": "The variety known as \"Ebonics,\" \"African American Vernacular English\" (AAVE), and \"Vernacular Black English\""}
- card: "ebonics-oakland"
  fact: "\"Ebonics\" combines ebony and phonics"
  sources:
    - {"title": "Education Week: Oakland Board Revises Ebonics Resolution (1997)", "url": "https://www.edweek.org/education/oakland-board-revises-ebonics-resolution/1997/01", "quote": "ebonics--a combination of the words \"ebony\" and \"phonics\""}
    - {"title": "Oakland Board of Education resolution of 18 December 1996, full text (LINGUIST List)", "url": "https://listserv.linguistlist.org/pipermail/linguist/1997-January/003675.html", "quote": "\"Ebonics\" (literally Black sounds)"}
- card: "ebonics-oakland"
  fact: "It is systematic and rule-governed, not broken English"
  sources:
    - {"title": "Linguistic Society of America: Resolution on the Oakland Ebonics Issue (archived)", "url": "http://web.archive.org/web/20240225224101/https://www.linguisticsociety.org/resource/lsa-resolution-oakland-ebonics-issue", "quote": "is systematic and rule-governed like all natural speech varieties ... Characterizations of Ebonics as \"slang,\" ... or \"broken English\" are incorrect and demeaning"}
    - {"title": "Oakland Board of Education resolution of 18 December 1996, full text (LINGUIST List)", "url": "https://listserv.linguistlist.org/pipermail/linguist/1997-January/003675.html", "quote": "systematic, rule governed and predictable patterns exist in the grammar of African-American"}
    - {"title": "John R. Rickford, Ebonics Notes and Discussion (1996)", "url": "https://web.stanford.edu/~rickford/ebonics/EbonicsExamples.html", "quote": "As with all spoken languages, AAVE is extremely regular, rule-governed, and systematic."}
- card: "ebonics-oakland"
  fact: "Invariant be marks repeated events (\"Billy don't be telling lies\")"
  sources:
    - {"title": "Salikoko Mufwene, Encyclopaedia Britannica: Ebonics (archived)", "url": "http://web.archive.org/web/20250327162147/https://www.britannica.com/topic/Ebonics", "quote": "consuetudinal or invariant be, such as \"Billy don't be telling lies\" (different in meaning from \"Billy don't tell lies,\" because it refers to repeated processes"}
    - {"title": "John R. Rickford, Ebonics Notes and Discussion (1996)", "url": "https://web.stanford.edu/~rickford/ebonics/EbonicsExamples.html", "quote": "invariant habitual \"be\""}
- card: "ebonics-oakland"
  fact: "On 18 December 1996 Oakland's board unanimously adopted the African American Task Force's resolution"
  sources:
    - {"title": "Oakland Board of Education resolution of 18 December 1996, full text (LINGUIST List)", "url": "https://listserv.linguistlist.org/pipermail/linguist/1997-January/003675.html", "quote": "adopted unanimously by the Oakland School Board on December 18, 1996 ... ADOPTING THE REPORT AND RECOMMENDATIONS OF THE AFRICAN-AMERICAN TASK FORCE"}
    - {"title": "Education Week: Oakland Board Revises Ebonics Resolution (1997)", "url": "https://www.edweek.org/education/oakland-board-revises-ebonics-resolution/1997/01", "quote": "a district task force ... wrote the original resolution that the board adopted unanimously on Dec. 18"}
- card: "ebonics-oakland"
  fact: "It recognised Ebonics as primary language, called it genetically based and not English, promised teaching in it and in English"
  sources:
    - {"title": "Oakland Board of Education resolution of 18 December 1996, full text (LINGUIST List)", "url": "https://listserv.linguistlist.org/pipermail/linguist/1997-January/003675.html", "quote": "genetically-based and not a dialect of English ... the predominantly primary language of African American students ... instruction ... in their primary language and in English"}
    - {"title": "Education Week: Oakland Board Revises Ebonics Resolution (1997)", "url": "https://www.edweek.org/education/oakland-board-revises-ebonics-resolution/1997/01", "quote": "it no longer suggests that ebonics is \"genetically based\" ... It no longer calls for students to be taught in their \"primary language\" of ebonics"}
- card: "ebonics-oakland"
  fact: "A national debate followed"
  sources:
    - {"title": "Education Week: Oakland Board Revises Ebonics Resolution (1997)", "url": "https://www.edweek.org/education/oakland-board-revises-ebonics-resolution/1997/01", "quote": "sparked a national debate on black English and black student achievement"}
    - {"title": "John R. Rickford, The Ebonics controversy in my backyard", "url": "https://web.stanford.edu/~rickford/papers/EbonicsInMyBackyard.html", "quote": "The controversy which erupted from the Oakland School Board's December 18 resolution"}
- card: "ebonics-oakland"
  fact: "On 3 January 1997 the LSA resolved it is systematic and rule-governed and Oakland's decision linguistically and pedagogically sound"
  sources:
    - {"title": "Linguistic Society of America: Resolution on the Oakland Ebonics Issue (archived)", "url": "http://web.archive.org/web/20240225224101/https://www.linguisticsociety.org/resource/lsa-resolution-oakland-ebonics-issue", "quote": "3 January 1997: Approved by members attending the 71st Annual Business Meeting ... linguistically and pedagogically sound"}
    - {"title": "John R. Rickford, The Ebonics controversy in my backyard", "url": "https://web.stanford.edu/~rickford/papers/EbonicsInMyBackyard.html", "quote": "unanimously approved ... the \"systematic and rule governed and systematic nature of Ebonics,\" and pronounced the Oakland school board's decision ... \"linguistically and pedagogically"}
- card: "ebonics-oakland"
  fact: "On 15 January 1997 the board unanimously revised it, dropping \"genetically based\" and teaching in Ebonics but keeping the standard English goal"
  sources:
    - {"title": "Education Week: Oakland Board Revises Ebonics Resolution (1997)", "url": "https://www.edweek.org/education/oakland-board-revises-ebonics-resolution/1997/01", "quote": "voted unanimously to adopt the revised wording at a special board meeting on Jan. 15"}
    - {"title": "Diverse / Black Issues in Higher Education: Oakland amends Ebonics resolution (1997, archived)", "url": "http://web.archive.org/web/20250709101656/https://www.diverseeducation.com/home/article/15083590/oakland-amends-ebonics-resolution-oakland-school-board", "quote": "voted unanimously on January 15 to support an amended version ... Excised from the resolution are: statements referring to African Language Systems being \"genetically based;\" ... upholds the district's intent to ... master standard English"}
- card: "ebonics-oakland"
  fact: "Later in January 1997 Oakland's superintendent and linguists testified at a Senate subcommittee hearing"
  sources:
    - {"title": "John R. Rickford, The Ebonics controversy in my backyard", "url": "https://web.stanford.edu/~rickford/papers/EbonicsInMyBackyard.html", "quote": "joined educators from Oakland (including Superintendent Carolyn Getridge) in providing pro-Ebonics testimony at the US Senate Hearing on Ebonics on January 23, 1997"}
    - {"title": "Diverse / Black Issues in Higher Education: Oakland amends Ebonics resolution (1997, archived)", "url": "http://web.archive.org/web/20250709101656/https://www.diverseeducation.com/home/article/15083590/oakland-amends-ebonics-resolution-oakland-school-board", "quote": "At the hearing, chaired by Sen. Arlen Specter (R-Pa.), Carolyn Getridge, superintendent of the Oakland school system, said"}
- card: "nigerian-pidgin"
  fact: "Called Naija by researchers"
  sources:
    - {"title": "IFRA-Nigeria: NaijaSynCor (archived)", "url": "http://web.archive.org/web/20251212162302/https://ifra-nigeria.org/former-research-programs/naijasyncor", "quote": "NaijaSynCor (A Corpus-based Macro-Syntactic Study of Naija, aka Nigerian Pidgin)"}
    - {"title": "Eriata Oribhabor, Lingua Franca: From Nigerian Pidgin to Naija Languej, Jalada (2016)", "url": "https://jaladaafrica.org/2016/05/30/lingua-franca-from-nigerian-pidgin-to-naija-languej-by-eriata-oribhabor/", "quote": "a new name should be given to the language ... thus NAIJA LANGUEJ"}
- card: "nigerian-pidgin"
  fact: "Vocabulary mostly English"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online structure dataset 17", "url": "https://apics-online.info/contributions/17", "quote": "Major lexifier: English"}
    - {"title": "WBUR Here & Now: Nigerian Pidgin Among New Languages Reaching BBC World Service Listeners (2018)", "url": "https://www.wbur.org/hereandnow/2018/03/13/nigerian-pidgin-bbc-world-service", "quote": "Pidgin takes inspiration from Portuguese ... English, the enduring colonial-era language"}
- card: "nigerian-pidgin"
  fact: "Learned to talk across ethnic lines"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online survey 17", "url": "https://apics-online.info/surveys/17", "quote": "it is learned informally as a second language in one or a number of venues for interethnic contact"}
    - {"title": "Eriata Oribhabor, Lingua Franca: From Nigerian Pidgin to Naija Languej, Jalada (2016)", "url": "https://jaladaafrica.org/2016/05/30/lingua-franca-from-nigerian-pidgin-to-naija-languej-by-eriata-oribhabor/", "quote": "in use in Nigeria by Nigerians irrespective of tribal or religious affiliation"}
- card: "nigerian-pidgin"
  fact: "About 75 million speakers; most widely spoken language in Nigeria"
  sources:
    - {"title": "Nicholas Faraclas, Nigerian Pidgin, APiCS Online structure dataset 17", "url": "https://apics-online.info/contributions/17", "quote": "With over 75 million speakers, Nigerian Pidgin has become by far the most widely spoken and fastest growing language in Nigeria today."}
    - {"title": "BBC Media Centre: BBC World Service launches first of 12 new language services (2017), via SWLing Post", "url": "https://swling.com/blog/2017/08/bbc-world-service-launches-first-of-12-new-language-services/", "quote": "Pidgin is spoken by an estimated 75m people in Nigeria alone"}
