# Expansion batch x03 (2026-11-13): every fact in the bodies and wow lines of the x03 cards,
# with at least two independent sources and a supporting quote from each.
# Quotes marked [via WebFetch] were returned by a page-reading tool, not copied from a saved file; re-open before reuse.
# Dropped: afro-abkhazians-adzyubzha (no two independent authoritative sources reachable).

# --- zanj-rebellion ---
- card: zanj-rebellion
  fact: "Enslaved Africans (the Zanj) worked the salt marshes around Basra, digging away the salty surface soil"
  sources:
    - {title: "JSTOR Daily, Mohammed Elnaiem: What Was the Zanj Rebellion? [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "dig away at the nitrous surface soil, reclaiming the land beneath it for future sugarcane cultivation"}
    - {title: "EBSCO Research Starters, Thomas Sizgorich: Zanj Revolt of African Slaves [via WebFetch]", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "thousands of black African slaves were employed removing unusable topsoil from extensive tracts"}
    - {title: "BlackPast, Omar H. Ali: Islam and the African Diaspora in the Indian Ocean World", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "working under some of the most brutal conditions removing salt from the crust of the land surrounding Bas"}
- card: zanj-rebellion
  fact: "In about 869 Ali ibn Muhammad came to the slave camps and the revolt began"
  sources:
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "in about 869 CE, Ali bin Muhammad, a slave-descended Arab, journeyed into the slave quarters"}
    - {title: "EBSCO Research Starters, Thomas Sizgorich [via WebFetch]", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "the so-called Zanj revolt, which began in 869, should be understood"}
- card: zanj-rebellion
  fact: "The rebels built their own state with an army, a capital and their own coins/currency"
  sources:
    - {title: "BlackPast, Omar H. Ali", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "the black rebels organized their own state, with its own standing army, buildings, and even minted coins"}
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "with a capital in Mukhtara (south from Basrah)"}
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "print its own currency"}
- card: zanj-rebellion
  fact: "The rebel state held out for fourteen years (869-883)"
  sources:
    - {title: "BlackPast, Omar H. Ali", url: "https://blackpast.org/global-african-history/islam-and-african-diaspora-indian-ocean-world/", quote: "The rebellion-turned-state lasted fourteen years, that is, until the Zanj forces were overwhelmed by Abbasid military force."}
    - {title: "EBSCO Research Starters, Thomas Sizgorich [via WebFetch]", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "occurring from 869 to 883"}
- card: zanj-rebellion
  fact: "Al-Muwaffaq took command, besieged the rebel capital; Ali ibn Muhammad was killed in battle in 883 and the revolt collapsed"
  sources:
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "after general Al-Muwaffaq laid siege to the rebellion’s capital city ... He was decapitated in battle in 883"}
    - {title: "EBSCO Research Starters, Thomas Sizgorich [via WebFetch]", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "ՙAlī ibn Muḥammad was killed in battle on August 11, 883, and the Zanj revolt collapsed."}
- card: zanj-rebellion
  fact: "Many Zanj fighters were taken into the Abbasid army rather than returned to their masters"
  sources:
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "They joined his army instead."}
    - {title: "EBSCO Research Starters, Thomas Sizgorich [via WebFetch]", url: "https://www.ebsco.com/research-starters/history/zanj-revolt-african-slaves", quote: "the last former Zanj guerrilla was mustered into the ՙAbbāsid army"}
- card: zanj-rebellion
  fact: "Contemporary chroniclers detested the rebels; the revolt was long treated as a stain in history books"
  sources:
    - {title: "JSTOR Daily, Mohammed Elnaiem [via WebFetch]", url: "https://daily.jstor.org/what-was-the-zanj-rebellion/", quote: "This also explains why the Zanj were detested by contemporary historians like Al-Tabari and Al-Mas’udi."}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "their rebellion was deemed a stain in Islamic history books"}
- card: zanj-rebellion
  fact: "Black Iraqis in Basra today tell the Zanj revolt as their ancestors' history"
  sources:
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "stories of abduction and enslavement of Jalal’s ancestors by the Arab slave traders, their transport from Africa to Iraq, and their rebellion"}
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Black people worked on the plantations around Basra, doing the hard labor, until there was a slave uprising in the mid-800s"}

# --- afro-iraqis-basra ---
- card: afro-iraqis-basra
  fact: "Afro-Iraqis descend from East Africans who came over centuries as sailors or enslaved people"
  sources:
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "descendants of the people who came here from East Africa as sailors or slaves over the course of centuries"}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "stories of abduction and enslavement of Jalal’s ancestors by the Arab slave traders, their transport from Africa to Iraq"}
- card: afro-iraqis-basra
  fact: "No official count; estimates range from about 400,000 to two million"
  sources:
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "they range from 400,000 to approximately two million, primarily located in the Basra province"}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "It is estimated that there are roughly 400,000 Afro-Iraqis across the country"}
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Diyaab says there are more than 2 million black people in Iraq."}
- card: afro-iraqis-basra
  fact: "Most live in Basra province, many in Zubair"
  sources:
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "particularly the inland district of Zubayr where most Afro-Iraqis live"}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "they are predominately concentrated demographically in the city of Basra, southern Iraq"}
- card: afro-iraqis-basra
  fact: "Basra wedding drummers are often Black men from Zubair"
  sources:
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "When there's a big wedding, Basrawis call in drummers from the district of Zubair."}
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "working as cleaners or musicians and dancers"}
- card: afro-iraqis-basra
  fact: "They keep rituals of African origin in Zubair that call on spirits from Africa"
  sources:
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "On a bright Saturday in Zubair, young men hang bright flags and prepare an altar for a ceremony they say will summon a spirit from Africa."}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "inferred their African origins by the folk rituals they practised for centuries in special places called \"Makayed\", and in specific areas of Basra Governorate, including the Zubair"}
- card: afro-iraqis-basra
  fact: "Many confined to menial jobs or work as musicians and dancers; they speak of discrimination by skin colour"
  sources:
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Long relegated to menial jobs or work as musicians and dancers"}
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "working as cleaners or musicians and dancers"}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "continue to suffer from racial discrimination and marginalization"}
- card: afro-iraqis-basra
  fact: "After Obama's 2008 election Jalal Dhiab, founder of the Free Iraqi Movement, sought recognition of Black Iraqis as a protected minority"
  sources:
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "Jalal Diyaab is the leader of the Free Iraqi Movement, which is seeking to have Iraq's roughly 2 million black people recognized as a minority whose rights should be protected."}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "When I first met Jalal in 2009 following President Barack Obama’s victory in the presidential election, he was hanging up a picture of Obama"}
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "Jalal Diab Thijeel founded the Free Iraqi Movement in 2007 to represent the Afro-Iraqi community"}
- card: afro-iraqis-basra
  fact: "Dhiab revived the memory of the Zanj revolt as his people's history"
  sources:
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "is the man behind the revival of all of this hidden history"}
    - {title: "NPR, Corey Flintoff (2008)", url: "https://www.npr.org/2008/12/03/96977550/black-iraqis-in-basra-face-racism", quote: "talking about a history of slavery and oppression that he says dates back to at least the ninth century"}
- card: afro-iraqis-basra
  fact: "Dhiab was assassinated in Basra in April 2013"
  sources:
    - {title: "The New Arab, Ibrahim Al-Marashi (2022) [via WebFetch]", url: "https://www.newarab.com/analysis/story-afro-iraqis", quote: "On April 26, 2013, Thijeel was assassinated"}
    - {title: "Arab Reform Initiative, Saad Salloum (2020)", url: "https://www.arab-reform.net/publication/in-the-footsteps-of-martin-luther-king-will-we-witness-a-revolution-against-racial-discrimination-in-the-middle-east/", quote: "the civil activist Jalal Dhiab, who was assassinated in Basra in 2013"}

# --- siddi-of-karnataka ---
- card: siddi-of-karnataka
  fact: "Siddi are Indians of African descent, long called Habshi (Abyssinian)"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "African-Indians were long known as Habshi, Arabic for Abyssinian (Ethiopian)."}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "These Muslim Africans came to be known in India as “‘Habshis’ or people of Habush (Abyssinia)"}
- card: siddi-of-karnataka
  fact: "Today most live in Karnataka and Gujarat, with groups in Andhra Pradesh"
  sources:
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Living primarily in Karnataka, Gujarat, and in some parts of Andhra Pradesh"}
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "the Indian states of Gujarat, Andhra Pradesh, and Karnataka"}
- card: siddi-of-karnataka
  fact: "Many ancestors came enslaved, brought by traders; some rose to generals, ministers and kingmakers"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "Many were enslaved and were brought to India between the fifteenth and nineteenth centuries by Muslim and Portuguese slave traders."}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "military slaves “were frequently elevated to the rank of generals, administrators and king-makers.”"}
- card: siddi-of-karnataka
  fact: "Jamal ud-Din Yaqut, an Abyssinian, rose high at the court of Raziya of Delhi in the 1230s"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "an Ethiopian named Jamal ad-Din Yaqut was a noble at the court of Queen Raziyya of Delhi"}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Iltutmish’s elder daughter, Raziya, ascended the throne after her father’s death in 1236, and it was during her tenure as the only Muslim woman to rule Delhi that Yaqut gained prominence."}
- card: siddi-of-karnataka
  fact: "The story that Yaqut and Raziya were lovers is doubted by historians"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "It is sometimes said that Yaqut and Raziyya were lovers, but this story appears only to have emerged in modern times."}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "historians since then have debated whether the relationship had the makings of an epic love story"}
- card: siddi-of-karnataka
  fact: "A king of Bengal recruited some 8,000 Abyssinian soldiers; Abyssinians seized the throne in the late 1480s and ruled until 1493"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "the Muslim king of Bengal (now divided between India and Bangladesh) recruited some 8000 enslaved Ethiopians to serve in his army and his administration. ... In 1487, Ethiopian nobles overthrew the reigning king and seized power, and for the next six years, Bengal was ruled by African kings known as the Habshi (“Abyssinian”) dynasty."}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "There were some 8,000 of them ... the Afro-Indian Habshi dynasty, which spanned four rulers between 1486 and 1493"}
- card: siddi-of-karnataka
  fact: "In 1791 a Siddi prince received Sachin; his family ruled until 1948, when it joined India"
  sources:
    - {title: "BlackPast, John McLeod (2024)", url: "https://blackpast.org/global-african-history/who-are-the-sidis-a-brief-introduction-to-the-800-year-african-experience-in-india/", quote: "In 1791 when Balu Miyan renounced his claims to Janjira, in return, he received twenty scattered villages 250 miles to the north, which became the kingdom of Sachin. His family ruled until 1948"}
    - {title: "JSTOR Daily, Akanksha Singh (2023)", url: "https://daily.jstor.org/the-habshis-dynasty-of-india/", quote: "Sachin, a small “African-ruled” princely state , took root in 1791, only to be signed over to India in 1948"}

# --- black-japan-yasuke ---
- card: black-japan-yasuke
  fact: "Japan was ending a century of civil war; Nobunaga was close to unifying it"
  sources:
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "was on the verge of unifying Japan after more than a hundred years of civil war"}
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "best remembered for his efforts to unify and bring political stability to Japan"}
- card: black-japan-yasuke
  fact: "He came to Japan in 1579 with the Jesuit Visitor Valignano as bodyguard or servant"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Yasuke accompanied the Italian Jesuit missionary Alessandro Vaglignano to Japan in 1579."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "He accompanied Alessandro Valignano, the Italian Visitor of the Jesuit mission in Asia, as his bodyguard or servant. Valignano was on a tour of inspection of the Jesuit missions and reached Japan in 1579"}
- card: black-japan-yasuke
  fact: "His birth name is unknown; Yasuke is a Japanised name"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Even the derivation of his name and place of birth can only be conjectured."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "the name was probably a Japanisation of a Portuguese or African name"}
- card: black-japan-yasuke
  fact: "Crowds thronged Kyoto to see him"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Fróis recounted the frenzy on the city streets of then capital of Japan, Kyoto"}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "Hundreds flocked together to see the stranger"}
- card: black-japan-yasuke
  fact: "Nobunaga had him stripped to the waist and scrubbed to test his colour"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Nobunaga demanded that black man strip to his waist and scrub his skin to prove that his dark color was real."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "He ordered the man stripped to the waist and scrubbed. But the scrubbing only made his skin shine more blackly."}
- card: black-japan-yasuke
  fact: "Over six feet tall; given a house and a sword; served as Nobunaga's bodyguard (BlackPast does not mention house or sword; Britannica added)"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "towering 6 foot 2 inches. Nobunaga orders Yasuke to be his retainer and bodyguard."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "He was given a house, a stipend, and a katana."}
    - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Ōta states that Nobunaga made Yasuke a vassal, giving him a house, servants, a sword, and a stipend."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "contemporary sources speak of “over six feet” (about 188 cm)"}
- card: black-japan-yasuke
  fact: "June 1582: Akechi Mitsuhide attacked Nobunaga at Honnō-ji; Nobunaga committed seppuku; Yasuke went to Nobutada at Nijō (a palace, not a castle, per Britannica), who also committed seppuku"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "When Nobunaga’s former general, Akechi Mitsuhide, attempted a coup in June 1582, the daimyo was obliged to perform seppuku"}
    - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "Yasuke rushed to the Oda clan’s new lord, Nobunaga’s eldest son, Nobutada, who was barricaded inside the nearby Nijō-goshō imperial villa."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "he fled with some survivors to Nobunaga’s son and heir, Oda Nobutada, who was staying in the nearby Nijō Castle. ... Nobutada, like his father, committed seppuku."}
- card: black-japan-yasuke
  fact: "Yasuke was taken, spared by Akechi and handed to the Jesuits; then vanishes from the record"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Sent to rejoin the European Jesuit missionaries (then called “barbarians” by the Japanese), Yasuke soon returned to that obscurity"}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "He was handed over to the Jesuits – and disappeared from the history books."}
- card: black-japan-yasuke
  fact: "His rise is recorded in Japanese chronicles and Jesuit letters (superlative dropped from card)"
  sources:
    - {title: "Encyclopaedia Britannica, Thomas Lockley: Yasuke", url: "https://www.britannica.com/biography/Yasuke", quote: "The primary source documents pertaining to Yasuke’s life are Portuguese-language Jesuit reports from the late 16th century (originally published in 1598) and works of the Japanese chroniclers Ōta Gyūichi and Matsudaira Ietada."}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "The contemporary sources – the Jesuit letters, Japanese chronicles, war diaries – never mention Yasuke again."}
- card: black-japan-yasuke
  fact: "(dispute) Samurai status contested"
  sources:
    - {title: "BlackPast, Robert Fikes (2016)", url: "https://blackpast.org/global-african-history/yasuke-1555/", quote: "Eventually Yasuke rose to the rank of Samurai"}
    - {title: "Samurai Museum Berlin", url: "https://samuraimuseum.de/en/?p=52665", quote: "Whether he formally belonged to the samurai class remains unclear, as the sources never use the term for him."}

# --- bahamas-junkanoo ---
- card: bahamas-junkanoo
  fact: "Parades on Boxing Day and New Year's Day; costumes of crepe paper and cardboard; goatskin drums, cowbells, whistles, brass"
  sources:
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "Participants dress in masks and costumes, often made from crepe paper and cardboard."}
    - {title: "TIME / Made by History, Sasha C. Wells", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "music played on goat-skin drums, cowbells, whistles, and brass instruments"}
    - {title: "HistoryMiami Museum", url: "https://historymiami.org/?p=3006", quote: "drums made from open-ended, wooden or metal barrels covered in goat or sheep skin"}
    - {title: "HistoryMiami Museum", url: "https://historymiami.org/?p=3006", quote: "a Bahamian parade tradition that occurs on Boxing Day (December 26) and New Year’s Day. The group’s year-round performances feature handmade costumes, dancing, and music made by drums, cowbells, whistles, and brass instrument"}
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "Junkanoo costumes are traditionally made from strips of crêpe paper and cardboard"}
- card: bahamas-junkanoo
  fact: "Formerly called John Canoe"
  sources:
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "No one knows exactly when Junkanoo (originally spelled “John Canoe”) began"}
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "was referred to as \"John Canoe,\" a reference to an Akan warrior"}
- card: bahamas-junkanoo
  fact: "It began among the enslaved on their Christmas-season holiday from work"
  sources:
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "John Canoe historically occurred during the Christmas season (on Boxing Day), one of the very few times of the year when masters gave slaves a reprieve from work on the plantation."}
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "In the Bahamas, the tradition dates back to when enslavers gave their slaves a day off during the holidays as reprieve."}
- card: bahamas-junkanoo
  fact: "Masqueraders from Black neighbourhoods filled Bay Street, the white-run business district, crossing segregation lines; officials feared them"
  sources:
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "the main — and predominantly white Bahamian-owned — business district of downtown Nassau. Every Boxing Day, in the dead of night following Christmas, masqueraders from the surrounding black communities ... transgressed the island’s unspoken racial boundaries"}
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "The colonial government's fear of ungovernable Black people still lingered, however."}
- card: bahamas-junkanoo
  fact: "In 1942, after Black labourers building wartime airfields on New Providence rioted over pay, street parades including Junkanoo were banned; it returned to Bay Street in 1948 (corrected: TIME says British military air bases, Caribbean Beat an American company; card no longer names either)"
  sources:
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "in 1942, at the time of the Burma Road Riots — unrest following labour disputes with an American company hired to construct the airport — the authorities quickly cancelled the parade for several years. ... In 1948, in part at the urging of tourism promoters, Junkanoo ... returned to Bay Street."}
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "the colonial government banned all street parading, including Junkanoo, from 1942 to 1947"}
- card: bahamas-junkanoo
  fact: "Groups with hand-made costumes compete for prizes"
  sources:
    - {title: "TIME / Made by History, Sasha C. Wells [via WebFetch]", url: "https://time.com/7202192/junkanoo-holiday-history/", quote: "Junkanoo groups compete for the coveted \"overall winner\" spot every parade."}
    - {title: "Caribbean Beat, Krista Thompson (2006)", url: "https://www.caribbean-beat.com/issue-82/junkanoo-rush", quote: "competing groups who battled for prizes"}

# --- bermuda-gombeys ---
- card: bermuda-gombeys
  fact: "Gombeys are masked costumed dancers with drummers; masks conceal identity"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "Perhaps this mockery is the reason the dancers’ identities are totally obscured by their costumes."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "Gombey troupes—members of which donned masks and full-coverage costumes to conceal their identities"}
- card: bermuda-gombeys
  fact: "Costumes set with mirrors"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "a black velvet cape decorated with embroidery, ribbons, mirrors, and sequins"}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "often include pieces of mirror to deflect evil spirits"}
- card: bermuda-gombeys
  fact: "Gombey is a Bantu word for rhythm"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "Gombey means rhythm, specifically drum rhythm, in an African Bantu language."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "gombey means “rhythm” in Bantu"}
- card: bermuda-gombeys
  fact: "Mixes West African, British, Caribbean and Native American elements"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "Bermuda’s gombey costumes and rhythms combine references to North America, Africa, and the Caribbean. ... The use of a bass drum, snare drums, fife, and triangle reflect a British military influence."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "reflects the tiny island’s wide-ranging roots—namely West African, British, Caribbean, and Native American"}
- card: bermuda-gombeys
  fact: "Grew among the enslaved; dances let them act out and comment on their condition"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "The dances provided a way for them to dramatise and comment on their experiences."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "Gombey was developed several centuries ago by Bermuda’s slave population to give artistic expression to the indignities they suffered at the hands of their owners"}
- card: bermuda-gombeys
  fact: "Long allowed out only at year-end holidays; rulers viewed them with suspicion"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "Originally they only danced on Boxing Day and New Year’s Day, the two holidays bondpeople were not forced to work."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "Gombey was disparaged by the island’s ruling class, who viewed the high-energy performances as a threat to the social order"}
- card: bermuda-gombeys
  fact: "Troupes passed from father to son within families; now a symbol of Bermuda (corrected from parents to children)"
  sources:
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "The gombey dances and rhythms were passed on from father to son."}
    - {title: "National Geographic, Bob Krist (2015)", url: "https://www.nationalgeographic.com/travel/article/gombeys-behind-the-mask-in-bermuda", quote: "each with its own unique style, passed down through generations within families"}
    - {title: "Smithsonian, Bermuda Connections", url: "https://folklife-media.si.edu/docs/folklife/education_exhibits/resources/Bermuda_Connections_125_146.pdf", quote: "crowds, have come to symbolise Bermuda"}

# --- guyana-emancipation-villages --- (rewritten after second check, see expand-x03-check.yaml)
- card: guyana-emancipation-villages
  fact: "Apprenticeship from 1834; full freedom on 1 August 1838"
  sources:
    - {title: "DPI Guyana (2020)", url: "https://dpi.gov.gy/from-northbrook-to-victoria-holding-steadfast-to-her-african-heritage-amid-transformation", quote: "during the apprenticeship period (1834-1838)"}
    - {title: "Stabroek News, Cecilia McAlmont (2013)", url: "https://stabroeknews.com/2013/08/01/news/guyana/the-african-village-movement-2", quote: "when apprenticeship ended the ex-apprentices would abandon the sugar estates"}
- card: guyana-emancipation-villages
  fact: "November 1839: 83 freed people from Dochfour, Ann's Grove, Hope, Paradise and Enmore bought Northbrook"
  sources:
    - {title: "Stabroek News, Cecilia McAlmont (2013)", url: "https://stabroeknews.com/2013/08/01/news/guyana/the-african-village-movement-2", quote: "83 labourers from five estates – Dochfour, Ann’s Grove, Hope, Paradise and Enmore together purchased plantation Northbrook for $10,000"}
    - {title: "DPI Guyana (2020)", url: "https://dpi.gov.gy/from-northbrook-to-victoria-holding-steadfast-to-her-african-heritage-amid-transformation", quote: "was bought on November 7th, 1839 one year after emancipation on August 1st, 1838 by eighty-three ex-slaves from estates: Douchfour, Ann’s Grove, Hope, Paradise and Enmore"}
- card: guyana-emancipation-villages
  fact: "Price 30,000 guilders, about $10,000"
  sources:
    - {title: "Stabroek News: Victoria and the village movement (2009)", url: "https://stabroeknews.com/2009/11/15/features/victoria-and-the-village-movement", quote: "paid the price of 30,000 guilders (about $10,284) for Northbrook"}
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "The plantation then was bought for 30,000 guilders or $10,283.63."}
    - {title: "DPI Guyana (2017)", url: "https://dpi.gov.gy/victoria-village-celebrates-178th-anniversary", quote: "bought Plantation Northbrook for 30,000 Guilders"}
- card: guyana-emancipation-villages
  fact: "Village tradition says the money was brought in a wheelbarrow"
  sources:
    - {title: "Stabroek News: Victoria and the village movement (2009)", url: "https://stabroeknews.com/2009/11/15/features/victoria-and-the-village-movement", quote: "It is a matter of legend that two-thirds of the money was paid right away in coins, delivered in a wheelbarrow"}
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "According to historical folklore, the 83 persons pooled their money in a wheelbarrow"}
- card: guyana-emancipation-villages
  fact: "Renamed Victoria in honour of the queen"
  sources:
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "bought Plantation Northbrook and renamed it Victoria, in honour of then monarch of British Guiana, Queen Victoria"}
    - {title: "Stabroek News, Cecilia McAlmont (2013)", url: "https://stabroeknews.com/2013/08/01/news/guyana/the-african-village-movement-2", quote: "The new proprietors submitted a petition to Queen Victoria requesting the royal name of Victoria be given to the new plantation village."}
- card: guyana-emancipation-villages
  fact: "Wilberforce Congregational Church built 1845, named after the abolitionist"
  sources:
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "the venerable Wilberforce Congregational Church, which had been first built in 1845 ... named after William Wilberforce, who has been noted as an abolitionist"}
    - {title: "DPI Guyana (2020)", url: "https://dpi.gov.gy/from-northbrook-to-victoria-holding-steadfast-to-her-african-heritage-amid-transformation", quote: "The Wilberforce Congregational Church, established in 1845"}
- card: guyana-emancipation-villages
  fact: "Victoria was the first village bought by the freed Africans and set off the Village Movement"
  sources:
    - {title: "DPI Guyana (2020)", url: "https://dpi.gov.gy/from-northbrook-to-victoria-holding-steadfast-to-her-african-heritage-amid-transformation", quote: "it was the first community to be established in then British Guiana and signalled a widespread effort called the village movement"}
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "revered as the first village that the Africans purchased after becoming free"}
    - {title: "Stabroek News, Cecilia McAlmont (2013)", url: "https://stabroeknews.com/2013/08/01/news/guyana/the-african-village-movement-2", quote: "The establishment of Victoria saw the beginning of the establishment of a series of what came to be called Communal Villages."}
- card: guyana-emancipation-villages
  fact: "The Emancipation Hut, a wooden structure from that time, still stands in Victoria"
  sources:
    - {title: "DPI Guyana (2020)", url: "https://dpi.gov.gy/from-northbrook-to-victoria-holding-steadfast-to-her-african-heritage-amid-transformation", quote: "a historic wooden structure called the Emancipation Hut, still standing today"}
    - {title: "Guyana Times International: Victoria Village", url: "https://guyanatimesinternational.com/victoria-village/", quote: "now known as the Emancipation Hut ... has retained its original design from since the village purchase was made"}

# --- belize-kriol ---
- card: belize-kriol
  fact: "Kriol takes most words from English, grammar from African patterns (not specifically West African; corrected)"
  sources:
    - {title: "University of Groningen, Ken Decker, thesis abstract", url: "https://research.rug.nl/en/publications/orthography-development-for-creole-languages", quote: "the Kriol language of Belize, an English-lexicon Creole language"}
    - {title: "BlackPast, Maria-Elena Velasquez (2009)", url: "https://blackpast.org/gah/belizean-kriols", quote: "a patois language that is similar to English but is influenced by African grammar and syntax"}
    - {title: "News 5 Belize (2007)", url: "https://archive.channel5belize.com/?p=6103", quote: "Kriol has the African gramatic system, right, and we use words from English"}
- card: belize-kriol
  fact: "Spoken across ethnic lines in Belize"
  sources:
    - {title: "Countries and Their Cultures: Culture of Belize", url: "https://www.everyculture.com/A-Bo/Belize.html", quote: "the language spoken across ethnic lines is a form of pidgin English called Creole"}
    - {title: "BlackPast, Maria-Elena Velasquez (2009)", url: "https://blackpast.org/gah/belizean-kriols", quote: "about 75% of Belizeans, regardless of their racial background, speak some form of Kriol"}
- card: belize-kriol
  fact: "Nearest relatives include Jamaican creole"
  sources:
    - {title: "BlackPast, Maria-Elena Velasquez (2009)", url: "https://blackpast.org/gah/belizean-kriols", quote: "Belizean Kriol patois is similar to the Jamaican patois"}
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon: Creoles of Nicaragua", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "closely related to other creoles spoken in the Anglophone Caribbean, particularly in Belize and Jamaica"}
- card: belize-kriol
  fact: "British woodcutters (Baymen) cut logwood, later mahogany; by the 1720s enslaved Africans brought from Jamaica did the cutting, in forest camps"
  sources:
    - {title: "Library of Congress, Belize: A Country Study, Slavery in the Settlement", url: "http://countrystudies.us/belize/7.htm", quote: "The earliest reference to African slaves in the British settlement appeared in a 1724 Spanish missionary's account, which stated that the British recently had been importing them from Jamaica and Bermuda."}
    - {title: "Library of Congress, Belize: A Country Study, The Emergence of the British Settlement", url: "http://countrystudies.us/belize/5.htm", quote: "By that time, however, the logwood trade had declined and mahogany had become the chief export"}
    - {title: "BlackPast, Maria-Elena Velasquez (2009)", url: "https://blackpast.org/gah/belizean-kriols", quote: "By 1724 the British were transporting slaves from Jamaica to Belize to cut logwood"}
    - {title: "Library of Congress, Belize: A Country Study, Slavery in the Settlement", url: "http://countrystudies.us/belize/7.htm", quote: "Cutting wood was seasonal work that required workers to spend several months isolated in temporary makeshift camps in the forest"}
- card: belize-kriol
  fact: "Creoles descend from British settlers and their enslaved Africans"
  sources:
    - {title: "Countries and Their Cultures: Culture of Belize", url: "https://www.everyculture.com/A-Bo/Belize.html", quote: "the Creoles, formed by the intermarriage of the British and their African slaves"}
    - {title: "Library of Congress, Belize: A Country Study, Slavery in the Settlement", url: "http://countrystudies.us/belize/7.htm", quote: "Gradually, however, the process of assimilation was creating a new, synthetic Creole culture."}
    - {title: "BlackPast, Maria-Elena Velasquez (2009)", url: "https://blackpast.org/gah/belizean-kriols", quote: "Their descendants became the Belizean Kriol group."}
- card: belize-kriol
  fact: "From the 1990s speakers worked to write Kriol; Ken Decker and the Belize Kriol Project developed an orthography"
  sources:
    - {title: "University of Groningen, Ken Decker, thesis abstract", url: "https://research.rug.nl/en/publications/orthography-development-for-creole-languages", quote: "This research, begun in 1993, is based on the development of an orthography for the Kriol language of Belize"}
    - {title: "News 5 Belize (2000)", url: "https://archive.channel5belize.com/?p=21614", quote: "A member group, the Bileez Kriol Projek, has produced an English/Kriol glossary and read along cassette"}
    - {title: "News 5 Belize (2006)", url: "https://archive.channel5belize.com/?p=9958", quote: "Compiled through the collaborative efforts of Belizeans and international linguist, Ken Decker"}
- card: belize-kriol
  fact: "In the 2000s a grammar (The Song of Kriol) and a Kriol-English dictionary were published"
  sources:
    - {title: "News 5 Belize (2006)", url: "https://archive.channel5belize.com/?p=9958", quote: "It’s called “The Song of Kriol: A Grammar of the Kriol Language of Belize” and this latest effort from the Bileez Kriol Projek"}
    - {title: "Glottolog: Decker 2006", url: "https://glottolog.org/resource/reference/id/308160", quote: "Decker, Kendall D. 2006. The song of Kriol: a grammar of the Kriol language of Belize. Belize City: The Angelus Press. 138pp."}
    - {title: "News 5 Belize (2007)", url: "https://archive.channel5belize.com/?p=6103", quote: "the National Kriol Council’s official introduction of the Kriol – English Dictionary"}
    - {title: "Cubola", url: "https://www.cubola.com/books/p/kriol-inglish-dikshineri-kriol-english-dictionary", quote: "The Kriol–Inglish Dikshineri (Kriol-English Dictionary) is an essential reference"}

# --- nicaragua-miskitu-creoles ---
- card: nicaragua-miskitu-creoles
  fact: "Largest Black community of Nicaragua's Caribbean coast is in and around Bluefields; Creoles speak an English-based creole as first language"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "The bulk of the Creole population is concentrated in the market/port town of Bluefields ... Most Creoles speak, as their first language, Miskito Coast Creole (MC Creole), an English-based creole"}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "approximately two-thirds of that group resides in and around Bluefields"}
- card: nicaragua-miskitu-creoles
  fact: "Ancestors brought as slaves by the British for forestry and plantations"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "They were brought there by the British to labor in forestry, plantation agriculture, and the transisthmus trade"}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "bringing with them a population of enslaved Africans to work on plantations"}
- card: nicaragua-miskitu-creoles
  fact: "In the 18th century people escaping slavery, some from Jamaica, built free communities at Bluefields and Pearl Lagoon"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "Many slaves who revolted against, ran away from, or were abandoned by their masters stayed on the Coast, where they created African American communities at Bluefields and at Pearl Lagoon."}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "Enslaved Africans from Jamaica later sought freedom in and around Bluefields in the 1700s"}
- card: nicaragua-miskitu-creoles
  fact: "After British emancipation in the 1830s, freed people from the British Caribbean came"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "after Emancipation (1833), freed slaves from the Anglophone Caribbean augmented this population"}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "after British emancipation in 1834, the area became a destination for free blacks from across the British-controlled Caribbean"}
- card: nicaragua-miskitu-creoles
  fact: "Coast under British protection, outside Nicaraguan control; Creoles rose to control trade and politics"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "In the absence of direct colonial control during the first three-quarters of the nineteenth century, this African American community flourished. ... the community began to consolidate economic, political, and social control over the Mosquito Coast."}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "It was originally part of the British Protectorate of Mosquitia ... A number of blacks in the area rose to prominence as merchants and influential advisers to the King."}
- card: nicaragua-miskitu-creoles
  fact: "From the 1880s US banana and lumber interests made Bluefields a boomtown"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "In the 1880s North American capitalist interests became active in lumber, mining, and bananas"}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "In the late 19th century, multilingual Bluefields became a commercial boomtown due to trade with the United States. The area produced bananas"}
- card: nicaragua-miskitu-creoles
  fact: "In 1894 Nicaragua took the coast; mestizos replaced Creoles in top posts"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "In 1894 the Nicaraguan national government militarily seized and \"Reincorporated\" the Mosquito Coast. Mestizos from the Pacific replaced Creoles in the top political positions in the region."}
    - {title: "BlackPast, Kayomi Wada (2010)", url: "https://blackpast.org/global-african-history/bluefields-nicaragua/", quote: "In 1894, Nicaragua incorporated Mosquitia and Spanish replaced English as the official language in the region. Mestizos also began to replace Creoles in positions of prominence and power."}
- card: nicaragua-miskitu-creoles
  fact: "Creoles live alongside Miskitu and Garifuna in lagoon villages; Garifuna live in Nicaragua"
  sources:
    - {title: "Encyclopedia of World Cultures, Edmund T. Gordon", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/creoles-nicaragua", quote: "settlements are either predominantly Creole or Creole mixed with either Miskito or Garifuna"}
    - {title: "UNESCO Intangible Cultural Heritage [via WebFetch]", url: "https://ich.unesco.org/en/RL/language-dance-and-music-of-the-garifuna-00001", quote: "Today, Garifuna communities mainly live in Honduras, Guatemala, Nicaragua and Belize."}

# --- afro-germans ---
- card: afro-germans
  fact: "Black Germans grew up isolated in white settings; others' labels were colonial terms and insults"
  sources:
    - {title: "AAIHS, Tiffany N. Florvil", url: "https://www.aaihs.org/from-adefra-to-black-lives-matter-black-womens-activism-in-germany/", quote: "after years of isolation in predominantly white settings"}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "man” in place of terms like “half-breed,” “mulatto,” or “colored.”"}
- card: afro-germans
  fact: "In 1984 Audre Lorde taught at the Free University of Berlin and urged Black German women to write their stories"
  sources:
    - {title: "AAIHS, Tiffany N. Florvil", url: "https://www.aaihs.org/from-adefra-to-black-lives-matter-black-womens-activism-in-germany/", quote: "Lorde was a visiting professor teaching courses at the Free University of Berlin (FUB) in 1984 ... Lorde emboldened Black German women to write their stories"}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "In 1984, Audre Lorde ... spent three months in Berlin teaching a poetry workshop and course in Black American women poets in English for German students at the Free University in West Berlin."}
- card: afro-germans
  fact: "Oguntoye, Ayim (Opitz) and Schultz produced Farbe bekennen in 1986"
  sources:
    - {title: "AAIHS, Tiffany N. Florvil", url: "https://www.aaihs.org/from-adefra-to-black-lives-matter-black-womens-activism-in-germany/", quote: "Inspired, Oguntoye, Ayim, and Dagmar Schultz, a white German feminist, produced the volume Farbe bekennen: Afro-deutsche Frauen auf den Spuren ihrer Geschichte in 1986"}
    - {title: "taz, interview with Katharina Oguntoye", url: "https://taz.de/!5373455/", quote: "„Farbe bekennen“, das Oguntoye 1986 mit May Ayim und Dagmar Schultz herausgab"}
- card: afro-germans
  fact: "The first book of its kind in Germany, on Afro-Germans' everyday racism"
  sources:
    - {title: "taz, interview with Katharina Oguntoye", url: "https://taz.de/!5373455/", quote: "war das erste Buch, das rassistische Alltagserfahrungen Afrodeutscher in diesem Land beschrieb"}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "It was the first book published in Germany that treated Afro-Germans as a national identity."}
- card: afro-germans
  fact: "They coined self-names Afro-German and Black German"
  sources:
    - {title: "bpb, Tiffany N. Florvil, Black Germany reading sample", url: "https://www.bpb.de/system/files/dokument_pdf/9176_Florvil_BlackGermany_BpB_Leseprobe.pdf", quote: "indem sie einen neuen Wortschatz schufen, der die Bezeichnungen »Afrodeutsche« und »Schwarze Deutsche« enthielt"}
    - {title: "taz, interview with Katharina Oguntoye", url: "https://taz.de/!5373455/", quote: "sondern unsere Selbstbezeichnungen: Afrodeutsche oder schwarze Deutsche"}
- card: afro-germans
  fact: "The book set a movement going and brought together Black Germans who had never met"
  sources:
    - {title: "taz, interview with Katharina Oguntoye", url: "https://taz.de/!5373455/", quote: "Das Buch hat eine ganze Bewegung in Gang gesetzt. ... So kamen zum ersten Mal schwarze Menschen in Deutschland miteinander in Kontakt, die sich vorher nie getroffen hätten."}
    - {title: "AAIHS, Tiffany N. Florvil", url: "https://www.aaihs.org/from-adefra-to-black-lives-matter-black-womens-activism-in-germany/", quote: "The volume helped Black German women and men connect and socialize with one another"}
    - {title: "ISD: Über uns", url: "https://isdonline.de/ueber-uns/", quote: "Mit der Veröffentlichung des bahnbrechenden Buches „Farbe bekennen“ wurde die jüngere Schwarze Bewegung in Deutschland ins Leben gerufen."}
- card: afro-germans
  fact: "ISD founded 1985; ADEFRA 1986"
  sources:
    - {title: "bpb, Tiffany N. Florvil, Black Germany reading sample", url: "https://www.bpb.de/system/files/dokument_pdf/9176_Florvil_BlackGermany_BpB_Leseprobe.pdf", quote: "die 1985 ins Leben gerufene ISD und die 1986 mit feministischem Schwerpunkt gegründete ADEFRA"}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "Founded in 1985 by May Ayim, Katharina Oguntoye, and other Afro-Germans, the Initiative Schwarze Deutsche (ISD)"}
- card: afro-germans
  fact: "English edition: Showing Our Colors"
  sources:
    - {title: "AAIHS, Tiffany N. Florvil", url: "https://www.aaihs.org/from-adefra-to-black-lives-matter-black-womens-activism-in-germany/", quote: "later published in 1992 as Showing our Colors: Afro-German Women Speak Out"}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "in English, Showing Our Colors: Afro-German Women Speak Out"}
- card: afro-germans
  fact: "ISD, renamed Initiative of Black People in Germany, still active, one of the oldest Black organisations"
  sources:
    - {title: "ISD: Über uns", url: "https://isdonline.de/ueber-uns/", quote: "Die Initiative Schwarze Menschen in Deutschland (ISD) wurde 1985 ins Leben gerufen und ist inzwischen eine der ältesten Selbstorganisation von und für Schwarze Menschen in Deutschland."}
    - {title: "Literary Hub, Gabrielle Hickmon (2019)", url: "https://lithub.com/what-audre-lorde-learned-in-berlin-about-afro-german-identity", quote: "now known as the Initiative of Black People in Germany, was the first national organization of Black Germans still functioning"}

# --- black-russia-soviet ---
- card: black-russia-soviet
  fact: "USSR courted the Third World from the late 1950s"
  sources:
    - {title: "Constantin Katsakioris, Prague Papers on the History of International Relations (2021)", url: "https://praguepapers.ff.cuni.cz/wp-content/uploads/sites/16/2022/12/Constantin_Katsakioris_19-31.pdf", quote: "As part of its new international policy toward the Third World since the second half of the 1950s"}
    - {title: "Maxim Matusevich (2008)", url: "https://www2.warwick.ac.uk/fac/arts/history/students/modules/hi277/programme/t1w10/hi277_matusevich.pdf", quote: "catering to the needs of third world students (as well as to the needs of Soviet foreign policy)"}
- card: black-russia-soviet
  fact: "5 February 1960 decision founding the university for Asia, Africa and Latin America"
  sources:
    - {title: "Maxim Matusevich (2008)", url: "https://www2.warwick.ac.uk/fac/arts/history/students/modules/hi277/programme/t1w10/hi277_matusevich.pdf", quote: "another party resolution of 5 February 1960 stipulated the founding of a new university to train ‘the national cadres for the countries of Asia, Africa, and Latin America.’"}
    - {title: "RUDN: История", url: "https://www.rudn.ru/about/history", quote: "Университет дружбы народов был основан 5 февраля 1960 года решением Правительства СССР."}
- card: black-russia-soviet
  fact: "Named after Patrice Lumumba in February 1961 after his murder"
  sources:
    - {title: "RUDN: История", url: "https://www.rudn.ru/about/history", quote: "22 февраля 1961 года Университету было присвоено имя Патриса Лумумбы"}
    - {title: "Constantin Katsakioris (2021)", url: "https://oap.unige.ch/journals/rhca/article/view/variakatsakioris", quote: "rebaptisée « Patrice Lumumba » après l’assassinat du Premier Ministre congolais en janvier 1961"}
- card: black-russia-soviet
  fact: "African students complained of racist incidents, travel limits, restrictions on associations and on dating"
  sources:
    - {title: "Maxim Matusevich (2008)", url: "https://www2.warwick.ac.uk/fac/arts/history/students/modules/hi277/programme/t1w10/hi277_matusevich.pdf", quote: "racist incidents, restrictions on travel within the USSR, restrictions on dating Russian girls, restrictions on forming independent national and ethnic student associations"}
    - {title: "Julie Hessler (2006)", url: "https://journals.openedition.org/monderusse/9591", quote: "Many conflicts centered on what was believed by the students to be the crux of the Assare-Addo affair: romantic relations between black African men and Russian women."}
- card: black-russia-soviet
  fact: "December 1963: a Ghanaian student died; students suspected murder; they marched on the Kremlin/Red Square, the first unauthorised protest since the late 1920s"
  sources:
    - {title: "Julie Hessler (2006)", url: "https://journals.openedition.org/monderusse/9591", quote: "this was the first recorded political protest in Moscow's Red Square since the late 1920s ... the protest was triggered by the death of a Ghanaian medical student, Edmund Assare-Addo"}
    - {title: "Maxim Matusevich (2008)", url: "https://www2.warwick.ac.uk/fac/arts/history/students/modules/hi277/programme/t1w10/hi277_matusevich.pdf", quote: "The death of a Ghanaian student in Moscow, in December 1963, which other African students suspected was a homicide ... They staged a protest march on the Kremlin ... (the first unauthorized demonstration in the Soviet Union since the fall of Trotsky in 1927 (!))"}
- card: black-russia-soviet
  fact: "African students kept coming"
  sources:
    - {title: "Julie Hessler (2006)", url: "https://journals.openedition.org/monderusse/9591", quote: "African students continued to come to the Soviet Union to study"}
    - {title: "Maxim Matusevich (2008)", url: "https://www2.warwick.ac.uk/fac/arts/history/students/modules/hi277/programme/t1w10/hi277_matusevich.pdf", quote: "the number of African students in the USSR increased almost ten-fold, from 72 to over 500, eventually reaching some 5,000 by the end of the decade"}
- card: black-russia-soviet
  fact: "Renamed Peoples' Friendship University of Russia in 1992"
  sources:
    - {title: "RUDN: История", url: "https://www.rudn.ru/about/history", quote: "5 февраля 1992 года решением Правительства России Университет переименован в Российский университет дружбы народов."}
    - {title: "Constantin Katsakioris (2021)", url: "https://oap.unige.ch/journals/rhca/article/view/variakatsakioris", quote: "Le 5 février 1992, elle fut rebaptisée Université russe de l’Amitié des Peuples."}

# --- afro-mexicans-recognition ---
- card: afro-mexicans-recognition
  fact: "Afro-Mexicans descend from Africans brought in colonial times for forced labour"
  sources:
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "a person who descends from the Africans who arrived in Mexico during the colonial period to perform forced labor on farms, mills, mines"}
    - {title: "JSTOR Daily, Karen Juanita Carrillo (2021)", url: "https://daily.jstor.org/mexicos-yanga-commenorates-founding/", quote: "Yanga was enslaved on the Nuestra Señora de la Concepción sugarcane plantation ... Veracruz very quickly became an important harbor for African enslavement in Mexico."}
- card: afro-mexicans-recognition
  fact: "Until 2015 no nationwide official count; Afro-Mexicans barely acknowledged as part of the nation"
  sources:
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "Before that, there were no nation-wide official counts of the Afro-Mexican population."}
    - {title: "Americas Quarterly, Leonie Rauls (2020)", url: "https://americasquarterly.org/?p=16304", quote: "Black identity in Mexico lacks recognition. ... There is confusion and even sometimes denial of the existence of Afro-Mexicans"}
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "this ethno-racial category refers to an invisible population that until now has been excluded from the notion of what is “Mexican,”"}
- card: afro-mexicans-recognition
  fact: "A long bottom-up campaign by Afro-Mexican organisations led to the question"
  sources:
    - {title: "Americas Quarterly, Leonie Rauls (2020)", url: "https://americasquarterly.org/?p=16304", quote: "It’s the result of a 20-year, bottom-up movement of different organizations campaigning to make the Afro-Mexican community visible."}
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "The Intercensal Survey question on Afro-descent is the result of an arduous process"}
- card: afro-mexicans-recognition
  fact: "2015 Intercensal Survey first asked; 1,381,853 (about 1.4 million, 1.2%) identified"
  sources:
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "the number of people who identified as Afro-descendants in Mexico is 1’381,853"}
    - {title: "Americas Quarterly, Leonie Rauls (2020)", url: "https://americasquarterly.org/?p=16304", quote: "In an intercensal survey in 2015, 1.4 million people self-identified as Afro-Mexican, Afro-descendent, or black, representing 1.2% of the total population."}
- card: afro-mexicans-recognition
  fact: "9 August 2019 decree added section C to Article 2 recognising Afro-Mexican peoples"
  sources:
    - {title: "Diario Oficial de la Federación, 9 August 2019 [via WebFetch]", url: "https://dof.gob.mx/nota_detalle.php?codigo=5567623&fecha=09/08/2019", quote: "Esta Constitución reconoce a los pueblos y comunidades afromexicanas, cualquiera que sea su autodenominación, ... como parte de la composición pluricultural de la Nación."}
    - {title: "Americas Quarterly, Leonie Rauls (2020)", url: "https://americasquarterly.org/?p=16304", quote: "the formal recognition of the term “Afro-Mexican,” which was added to the constitution in 2019"}
- card: afro-mexicans-recognition
  fact: "Being counted brings visibility and a basis for policy"
  sources:
    - {title: "Papeles de Población (2019)", url: "https://www.redalyc.org/journal/112/11260966010/html/", quote: "Being able to estimate the size of the Mexican population of African origin will bring increased visibility of this population"}
    - {title: "Americas Quarterly, Leonie Rauls (2020)", url: "https://americasquarterly.org/?p=16304", quote: "It also has enormous policy implications."}

# --- afro-colombian-law-70 ---
- card: afro-colombian-law-70
  fact: "Black rural communities lived on riverside land legally counted as vacant state land (baldíos)"
  sources:
    - {title: "Ley 70 de 1993, art. 1", url: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html", quote: "reconocer a las comunidades negras que han venido ocupando tierras baldías en las zonas rurales ribereñas de los ríos de la Cuenca del Pacífico"}
    - {title: "Universidad de los Andes, Notas de Política 26 (2016)", url: "https://gobierno.uniandes.edu.co/wp-content/uploads/NP-26.pdf", quote: "pasaron de habitar unos territorios considerados baldíos a ser dueños de sus territorios"}
- card: afro-colombian-law-70
  fact: "Slavery abolished in 1851"
  sources:
    - {title: "Universidad de los Andes, Notas de Política 26 (2016)", url: "https://gobierno.uniandes.edu.co/wp-content/uploads/NP-26.pdf", quote: "después de la abolición de la esclavitud en 1851"}
    - {title: "Foro Nacional Ambiental (2024)", url: "https://foronacionalambiental.org.co/wp-content/uploads/2024/06/Policy-Pacifico-Territorios-Colectivos.pdf", quote: "debieron transcurrir ciento cuarenta y dos años después de las leyes de manumisión de los esclavizados para que se expidiera la ley 70 de 1993"}
- card: afro-colombian-law-70
  fact: "Transitional article 55 of the 1991 Constitution, after mobilisation of Black and peasant organisations"
  sources:
    - {title: "Universidad de los Andes, Notas de Política 26 (2016)", url: "https://gobierno.uniandes.edu.co/wp-content/uploads/NP-26.pdf", quote: "Inspirados en los resguardos indígenas y en el movimiento campesino de la década del ochenta en Chocó, a partir del artículo 55 transitorio de la Constitución, el Congreso expidió en 1993 la Ley 70"}
    - {title: "Foro Nacional Ambiental (2024)", url: "https://foronacionalambiental.org.co/wp-content/uploads/2024/06/Policy-Pacifico-Territorios-Colectivos.pdf", quote: "Esta ley surgió de un largo proceso reivindicativo de las comunidades afrodescendientes, palenqueras y raizales en el marco de las movilizaciones sociales y los debates que dieron lugar la Constitución política de 1991"}
- card: afro-colombian-law-70
  fact: "Law 70 of 27 August 1993 recognised collective property, cultural identity and development as an ethnic group"
  sources:
    - {title: "Ley 70 de 1993", url: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html", quote: "LEY 70 DE 1993 (agosto 27)"}
    - {title: "Foro Nacional Ambiental (2024)", url: "https://foronacionalambiental.org.co/wp-content/uploads/2024/06/Policy-Pacifico-Territorios-Colectivos.pdf", quote: "La ley 70 del 27 de agosto de 1993 tiene como objetivos reconocer a las comunidades negras el derecho a la propiedad colectiva, a establecer mecanismos para la protección de la identidad cultural y de los derechos de las comunidades como grupo étnico"}
- card: afro-colombian-law-70
  fact: "Each community forms a Consejo Comunitario to receive and govern the land"
  sources:
    - {title: "Ley 70 de 1993, art. 5", url: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html", quote: "Para recibir en propiedad colectiva las tierras adjudicables, cada comunidad formará un Consejo Comunitario como forma de administración interna"}
    - {title: "Universidad de los Andes, Notas de Política 26 (2016)", url: "https://gobierno.uniandes.edu.co/wp-content/uploads/NP-26.pdf", quote: "se ha logrado entregar títulos colectivos a más de 168 Consejos Comunitarios como nueva organización social y autoridad en el territorio"}
- card: afro-colombian-law-70
  fact: "Councils now hold nearly six million hectares, mostly on the Pacific coast"
  sources:
    - {title: "Universidad de los Andes, Notas de Política 26 (2016)", url: "https://gobierno.uniandes.edu.co/wp-content/uploads/NP-26.pdf", quote: "Estos títulos suman algo menos de 6 millones de hectáreas, principalmente en el litoral pacífico"}
    - {title: "Foro Nacional Ambiental (2024)", url: "https://foronacionalambiental.org.co/wp-content/uploads/2024/06/Policy-Pacifico-Territorios-Colectivos.pdf", quote: "Hasta 2023 se habían expedido doscientos treinta y seis títulos colectivos sobre un área de 5,7 millones de hectáreas, en beneficio de 87.541 familias afrocolombianas, en su mayoría en la región del Pacífico"}
- card: afro-colombian-law-70
  fact: "Before 1991 the state barely recognised Afro-Colombians; Law 70 recognised them as an ethnic group"
  sources:
    - {title: "Foro Nacional Ambiental (2024)", url: "https://foronacionalambiental.org.co/wp-content/uploads/2024/06/Policy-Pacifico-Territorios-Colectivos.pdf", quote: "Antes de la Constitución de 1991 y de la ley 70, el Estado colombiano no reconocía ampliamente la existencia de los pueblos afrocolombianos"}
    - {title: "Ley 70 de 1993, art. 1", url: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html", quote: "s comunidades negras de Colombia como grupo étnico, y el fomento de su desarrollo económico y social"}

# --- black-australians-pacific ---
- card: black-australians-pacific
  fact: "At least ten (eleven by Pybus, twelve by SBS) convicts of African descent on the First Fleet, 1788"
  sources:
    - {title: "UWA, Jane Lydon (2024)", url: "https://www.uwa.edu.au/news/article/2024/november/casting-a-spotlight-on-the-black-convicts-of-african-descent-who-helped-shape-australia", quote: "“I have been able to conclusively identify at least ten people of African descent” who were convicts on the First Fleet"}
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "They were eleven black convicts on the First Fleet, most of them from America"}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "among 12 people of African descent on the First Fleet when it arrived in Botany Bay"}
- card: black-australians-pacific
  fact: "John Caesar, called Australia's first bushranger, was among them"
  sources:
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "Black Caesar, who was Australia's first bushranger"}
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "he was an African American who arrived as a convict aboard the First Fleet transport ship Alexander"}
- card: black-australians-pacific
  fact: "Most came from America, runaways who joined the British in the Revolution, then ended up in England"
  sources:
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "part of a large diaspora of runaway slaves who attached themselves to the British during the American Revolution"}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "Randall and Martin, like many of the Africans on the First Fleet, defected to the British forces during the American revolution."}
- card: black-australians-pacific
  fact: "John Randall, from the American colonies, convicted of theft in England in 1785"
  sources:
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "John Randall, originally from Connecticut, convicted in Manchester for stealing a watch"}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "he ended up getting transported for picking a pocket in 1785"}
- card: black-australians-pacific
  fact: "Randall was one of three convicts licensed to shoot game"
  sources:
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "the third convict licensed to shoot game was George Johnson’s black convict servant John Randall"}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "Randall's military background helped him access a privileged position as one of the NSW Governors' gamekeepers"}
- card: black-australians-pacific
  fact: "He joined the NSW Corps band, playing flute/pipe and drum"
  sources:
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "But Randall had more to offer: he played the flute and drum."}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "In the early 1800s, he joined the New South Wales Corps as a drummer."}
- card: black-australians-pacific
  fact: "26 January 1808: 400 soldiers marched behind the band to arrest Governor Bligh"
  sources:
    - {title: "Cassandra Pybus (2018)", url: "https://australienstudien.org/ZfA/2018%2032/ZfA_32-2018_17-27_Pybus.pdf", quote: "On 26 January 1808 400 soldiers with bayonets fixed marched to Government House led by the regimental band where they put the Governor under arrest."}
    - {title: "SBS, Ahmed Yussuf (2020)", url: "https://www.sbs.com.au/news/the-feed/did-you-know-there-were-12-africans-on-the-first-fleet", quote: "He led the band that marched along Bridge Street on 26th January 1808 to Government House at the front of the NSW Corps, in a rowdy procession to arrest governor William Bligh."}
- card: black-australians-pacific
  fact: "Historians Gillen (1989) and Pybus (2006) recovered their names"
