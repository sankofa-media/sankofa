# Perspective rewrite of the gospel card (2026-11-15): {male} paragraph (Thomas A. Dorsey),
# {female} paragraph (Sallie Martin) and the new wow line. The shared paragraphs are unchanged.
# Every fact has two independent sources, each with a verbatim quote ("..." marks an omission).
- card: gospel
  copy: both
  fact: "wow: gospel's father was the blues pianist \"Georgia Tom\"; its mother, Sallie Martin, could not read music and turned his songs into a business"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Sallie Martin, often called the “Mother of Gospel Music,” ... he first refused to feature her as soloist because she could not read music ... Martin was much more effective than Dorsey at marketing Dorsey's compositions"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "she couldn't even read music. But Dorsey hired her. ... She took over his music store and, within a few months, was turning a neat profit."}
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "Dorsey first gained recognition as a blues pianist in the 1920s and later became known as the father of gospel music"}
- card: gospel
  copy: male
  fact: "Thomas A. Dorsey, called the father of gospel music, first made his name in the blues"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "Dorsey first gained recognition as a blues pianist in the 1920s and later became known as the father of gospel music"}
    - {title: "Hymnology Archive: Thomas A. Dorsey (Atlanta Constitution obituary, 24 January 1993)", url: "https://hymnologyarchive.com/thomas-a-dorsey", quote: "known as the father of gospel music for his merging of religious music with the blues"}
- card: gospel
  copy: male
  fact: "He came to Chicago from Georgia in 1916"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "In 1916 Dorsey moved to Chicago, Illinois"}
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "In 1916, at the age of 17, Dorsey moved north to Chicago to pursue a musical career."}
- card: gospel
  copy: male
  fact: "As \"Georgia Tom\" he led Ma Rainey's band"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "in 1924 Ma Rainey chose him to organize and lead her Wild Cats Jazz Band"}
    - {title: "Encyclopedia.com (Gale, Contemporary Musicians): Rainey, Ma", url: "https://encyclopedia.com/education/news-wires-white-papers-and-books/rainey-ma", quote: "In 1924 pianist and arranger Thomas A. Dorsey ... recruited members ... Serving as both director and manager, Dorsey assembled able musicians who could read arrangements"}
    - {title: "Hymnology Archive: Thomas A. Dorsey (Atlanta Constitution obituary, 24 January 1993)", url: "https://hymnologyarchive.com/thomas-a-dorsey", quote: "He adopted the stage name “Georgia Tom” and toured with legendary blues singer Ma Rainey."}
- card: gospel
  copy: male
  fact: "He set sacred words to blues patterns and published the songs himself"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "his role in developing, publishing, and promoting the gospel blues ... his foresight in deciding to publish all of his material"}
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "Dorsey dubbed his music “gospel blues” due to the similarity of his gospel rhythms and vocals to those heard in blues and jazz clubs. ... Thomas Dorsey published and performed his own music for decades."}
- card: gospel
  copy: male
  fact: "In 1932 his wife Nettie died in childbirth and their son died the next day"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "In 1932 Dorsey’s wife, Nettie Harper, died during childbirth, and their son died the following day."}
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "Dorsey’s wife, Nettie, whom he married in 1925 ... his wife had just died in childbirth. His infant son died the next day."}
- card: gospel
  copy: male
  fact: "In his grief he wrote \"Take My Hand, Precious Lord\""
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "This tragedy caused Dorsey to renounce blues music and inspired him to write his famous piece “Take My Hand, Precious Lord,”"}
    - {title: "Hymnology Archive: Thomas A. Dorsey (Atlanta Constitution obituary, 24 January 1993)", url: "https://hymnologyarchive.com/thomas-a-dorsey", quote: "The song was prompted by a tragedy early in Mr. Dorsey’s life. In [1932], his first wife died during childbirth, and the infant died a day later."}
- card: gospel
  copy: male
  fact: "In 1933 he co-founded a national convention of gospel choirs"
  sources:
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "That original choir expanded into the National Convention of Gospel Choirs and Choruses (NCGCC), organized at Pilgrim Baptist Church in 1933."}
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "With him, in 1933, Martin co-founded the National Convention of Gospel Choirs and Choruses."}
- card: gospel
  copy: male
  fact: "He later teamed with Mahalia Jackson, who came from New Orleans"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "During the late 1930s and early 1940s, Dorsey worked extensively with Mahalia Jackson"}
    - {title: "Hymnology Archive: Thomas A. Dorsey (Atlanta Constitution obituary, 24 January 1993)", url: "https://hymnologyarchive.com/thomas-a-dorsey", quote: "The song was made famous by the late Mahalia Jackson, who once toured with Mr. Dorsey."}
    - {title: "64 Parishes: Ben Sandmel, Mahalia Jackson (via archive.org)", url: "https://64parishes.org/entry/mahalia-jackson", quote: "At age sixteen, she moved to Chicago, Illinois ... In the early 1940s she worked with the gospel music pioneer Thomas A. Dorsey"}
    - {title: "Rock & Roll Hall of Fame: Mahalia Jackson", url: "https://www.rockhall.com/inductees/mahalia-jackson", quote: "Born in New Orleans, she inherited the city’s legacy of musical excellence"}
    - {title: "Biography.com: Mahalia Jackson's influential moments", url: "https://www.biography.com/musicians/mahalia-jackson-influential-moments", quote: "Born into poverty in New Orleans, she became a wealthy, beloved recording artist"}
- card: gospel
  copy: male
  fact: "In 1968 Mahalia Jackson sang \"Precious Lord\" at the funeral of Martin Luther King Jr."
  sources:
    - {title: "The World (PRI): Laying an American saint to rest (2018)", url: "https://theworld.org/stories/2018/04/02/laying-american-saint-rest", quote: "At the open-air service at the college, per King's request, his good friend Mahalia Jackson sang his favorite hymn, \"Take My Hand, Precious Lord.”"}
    - {title: "Biography.com: Mahalia Jackson's influential moments", url: "https://www.biography.com/musicians/mahalia-jackson-influential-moments", quote: "April 1968: Martin Luther King Jr.'s funeral ... the shaken singer honored her old friend's last request with an emotional performance of the standard \"Take My Hand, Precious Lord.\""}
- card: gospel
  copy: male
  fact: "Dorsey died in Chicago in 1993, having written hundreds of songs"
  sources:
    - {title: "New Georgia Encyclopedia: Ian Hill, Georgia Tom Dorsey", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-tom-dorsey-1899-1993/", quote: "Dorsey died in Chicago on January 23, 1993, of complications from Alzheimer’s disease."}
    - {title: "Chicago Tribune: Thomas A. Dorsey, gospel pioneer (25 January 1993)", url: "https://www.chicagotribune.com/1993/01/25/thomas-a-dorsey-gospel-pioneer/", quote: "Thomas A. Dorsey, widely acknowledged as the father of gospel music, died Saturday night in his Chicago home. He was 93."}
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "penning hundreds of songs ... Dorsey died in 1993"}
    - {title: "Hymnology Archive: Thomas A. Dorsey (Atlanta Constitution obituary, 24 January 1993)", url: "https://hymnologyarchive.com/thomas-a-dorsey", quote: "In addition to hundreds of blues songs, Mr. Dorsey wrote more than 1,000 gospel songs."}
- card: gospel
  copy: female
  fact: "Sallie Martin is called the mother of gospel music"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Sallie Martin, often called the “Mother of Gospel Music,”"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "Known as \"The Mother of Gospel\" by the National Convention of Gospel Choirs and Choruses"}
    - {title: "University of Illinois Press: Kay Norton, Sallie Martin, Mother of Gospel Music", url: "https://www.press.uillinois.edu/books/?id=c046964", quote: "Sallie Martin, Mother of Gospel Music tells the story of one woman’s role in shaping the music and business of Black gospel."}
- card: gospel
  copy: female
  fact: "She could not read music"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "she could not read music and showed no interest in learning"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "she couldn't even read music"}
- card: gospel
  copy: female
  fact: "She had cleaned houses and washed clothes in Atlanta"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "she commenced work as a babysitter, domestic worker, and laundry laborer in Atlanta"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "she moved to Atlanta, where she began a series of jobs, including babysitting, cleaning houses, and washing clothes"}
- card: gospel
  copy: female
  fact: "She came to Chicago in the 1920s"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "she settled in Chicago around 1927"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "During the 1920s, Martin, her husband, and their son relocated to Chicago."}
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "by 1929, had moved to Chicago and joined a chorus directed by Thomas Dorsey"}
- card: gospel
  copy: female
  fact: "She auditioned for Dorsey, who disliked her rough, shouting style but took her on"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Hearing her audition, Dorsey was moved by Martin's evangelistic fervor but disliked her rough, untrained vocal style with its shouting, stepping “sanctified” accompaniments."}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "She arranged an audition. There were serious misgivings about her unrefined style —whooping, groaning, and a great deal of physical movement— ... But Dorsey hired her."}
- card: gospel
  copy: female
  fact: "She sang his songs in churches, sold the sheet music and kept his books"
  sources:
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "she served as Dorsey’s song demonstrator and bookkeeper, singing and selling his compositions at churches and conventions"}
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "selling new Dorsey songs ... She also understood the importance of bookkeeping and inventory control"}
- card: gospel
  copy: female
  fact: "Within months his business turned a profit"
  sources:
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "She took over his music store and, within a few months, was turning a neat profit."}
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "and quickly both made and saved Dorsey money"}
- card: gospel
  copy: female
  fact: "She helped found the National Convention of Gospel Choirs and Choruses"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "A co-founder in 1933 of the National Convention of Gospel Choirs and Choruses"}
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "With him, in 1933, Martin co-founded the National Convention of Gospel Choirs and Choruses."}
    - {title: "University of Illinois Press: Kay Norton, Sallie Martin, Mother of Gospel Music", url: "https://www.press.uillinois.edu/books/?id=c046964", quote: "Cofounder of the National Convention of Gospel Choirs and Choruses"}
- card: gospel
  copy: female
  fact: "She travelled the country setting up choirs"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Sallie Martin commenced traveling around the country, establishing dozens, possibly hundreds, of new gospel choirs"}
    - {title: "Christianity Today: Kathryn Kemp, The father of gospel music wanted to be a secular star (2018)", url: "https://www.christianitytoday.com/2018/05/father-gospel-music-thomas-dorsey/", quote: "Sallie Martin, one of Dorsey’s singers, became the first organizer of the convention, traveling around the country and adding choral unions and chapters to the organization."}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "Martin traveled to Cleveland in 1933 to organize a chorus there. She also helped set up similar groups throughout the South and Midwest."}
- card: gospel
  copy: female
  fact: "In 1940 she and the composer Kenneth Morris opened Martin and Morris Music"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "In 1940 the Martin and Morris Music Company, Inc., opened its doors"}
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "In 1940, she left Dorsey to help start the Martin and Morris Publishing Company"}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "That same year, Martin and gospel composer Kenneth Morris joined forces with financial backer Rev. Clarence H. Cobb to found Martin and Morris, Inc."}
- card: gospel
  copy: female
  fact: "Martin and Morris grew into one of the largest Black gospel publishers"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Morris with Sallie Martin co-founded one of the largest U.S. gospel publishing houses, Martin and Morris Music, Inc. of Chicago."}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "This publishing company became the biggest of its kind in America."}
- card: gospel
  copy: female
  fact: "The Sallie Martin Singers were among the first all-female gospel groups"
  sources:
    - {title: "BlackPast: Janet Hauck, Sallie Martin (1895–1988)", url: "https://www.blackpast.org/african-american-history/martin-sallie-1895-1988/", quote: "the Sallie Martin Singers, one of the first all-female gospel groups"}
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "she formed the Colored Ladies Quartet, America's first all-female gospel singing group (soon renamed the Sallie Martin Singers)"}
- card: gospel
  copy: female
  fact: "She died in Chicago in 1988"
  sources:
    - {title: "Chicago Public Library, Martin and Morris Music Company Papers: biographical note", url: "https://www.chipublib.org/fa-martin-and-morris-music-company-papers", quote: "Sallie Martin died on June 18, 1988 in Chicago."}
    - {title: "African American Registry: Sallie Martin, gospel singer and businesswoman", url: "https://aaregistry.org/story/sallie-martin-was-great-for-the-business-of-gospel/", quote: "she died in Chicago on June 18, 1988"}
