    - {title: "Oregon Theater Project: Prize-Fight Film Censorship", url: "https://oregontheaterproject.uoregon.edu/node/604", quote: "the Sims Act was not repealed until the 1940s"}
- card: sims-act-1912
  fact: "It was one of the earliest US battles over film censorship"
  verdict: confirmed
  sources:
    - {title: "Reason, Jesse Walker (2018)", url: "https://reason.com/2018/05/25/jack-johnson-fight-films/", quote: "The boxer also became a central figure in one of the earliest battles over movie censorship."}
    - {title: "Oregon Theater Project: Prize-Fight Film Censorship", url: "https://oregontheaterproject.uoregon.edu/node/604", quote: "the first instance of legislative film censorship in the United States was in 1897 ... Subsequently, in 1910, numerous states and cities banned the screening of the Johnson-Jeffries fight"}
  note: "Closing line changed from 'it began with a Black man winning' (censorship of fight films predates 1910) to 'a Black man's victory set off the federal ban' (MPH: the ban was enacted 'because of Johnson's mauling of white fighters')."

