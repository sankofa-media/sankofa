    - {title: "Oregon Theater Project: Prize-Fight Film Censorship", url: "https://oregontheaterproject.uoregon.edu/node/604", quote: "people across the United States continued to illegally distribute these prize-fight films across state lines"}
- card: sims-act-1912
  fact: "The ban was repealed only in 1940, after 28 years"
  verdict: confirmed
  sources:
