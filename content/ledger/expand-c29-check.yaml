# Independent second check of batch c29 (2026-11-14). Every source below was opened by the checker; quotes are from the fetched page text
# (Encyclopedia Virginia and Theodore Roosevelt Center through WebFetch, as they refuse plain curl).
# Kritische Justiz (doi 10.5771/0023-4834-2010-3-338) could not be opened (paywalled PDF viewer); none of its quotes was relied on and it was removed from the card sources.

entries:
- card: maggie-lena-walker
  fact: "Maggie Lena Mitchell was born in Richmond, Virginia, on 15 July 1864"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "Maggie Lena Mitchell was born in Richmond, Virginia July 15, 1864."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "Maggie Lena Mitchell was born on July 15, 1864 in Richmond, Virginia."}
- card: maggie-lena-walker
  fact: "Her mother had been enslaved"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "Her mother, Elizabeth Draper, was a former slave"}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "was a former enslaved woman who worked as an assistant cook for"}
- card: maggie-lena-walker
  fact: "After the family lost its breadwinner her mother took in laundry and the girl delivered the clean clothes"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "After the untimely death of William Mitchell in 1876, Maggie's mother supported the family by working as a laundress and young Maggie helped by delivering the clean clothes."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "William Mitchell's death plunged his widow and her two children into poverty. ... Walker assisted by returning clean laundry to white patrons,"}
  note: "The first ledger's EV quote is not on the page; replaced. 'White customers' rests on EV alone, so the card now says only 'the customers'."
- card: maggie-lena-walker
  fact: "She would found a bank in the segregated South"
  verdict: confirmed
  sources:
    - {title: "National Women's History Museum, Arlisha R. Norwood: Maggie Lena Walker", url: "https://www.womenshistory.org/education-resources/biographies/maggie-lena-walker", quote: "The bank was a powerful representation of black self-help in the segregated South."}
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "In spite of humble beginnings in post-Civil War Richmond, Virginia, ... She was the first African American woman in the United States to found a bank."}
  note: "Richmond's place in the Jim Crow South is general knowledge; NWHM states it directly."
- card: maggie-lena-walker
  fact: "As a teenager she joined the Independent Order of St. Luke, a Black benevolent society that helped the sick and elderly"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "When she was a teenager, Maggie Mitchell joined the local council of the Independent Order of St. Luke. This fraternal burial society ... administered to the sick and aged"}
    - {title: "National Women's History Museum, Arlisha R. Norwood: Maggie Lena Walker", url: "https://www.womenshistory.org/education-resources/biographies/maggie-lena-walker", quote: "When Walker was 14, she joined the Independent Order of St. Luke's, an African American benevolent organization that helped the sick and elderly in Richmond."}
- card: maggie-lena-walker
  fact: "She taught school for a few years before devoting herself to the order"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "After graduation she taught grade school for three years."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "After graduating in 1883, she taught for three years at the Valley School."}
- card: maggie-lena-walker
  fact: "In 1902 she started the order's newspaper, the St. Luke Herald"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "In 1902 Mrs. Walker established a newspaper, The St. Luke Herald"}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "The St. Luke Herald began operation in 1902"}
- card: maggie-lena-walker
  fact: "In 1903 she founded the St. Luke Penny Savings Bank, became its president and was the first African American woman in the US to charter a bank"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "In 1903 she founded the St. Luke Penny Savings Bank. Mrs. Walker served as the bank's first president, which earned her the recognition of being the first African American woman to charter a bank in the United States."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "first Black woman to establish and become president of a bank in the United States"}
  note: "NWHM says 'first woman of any race'; recorded in the card's dispute."
- card: maggie-lena-walker
  fact: "The next year (1904) the family bought a house in Jackson Ward, a district that exemplifies African American entrepreneurship"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "The Walkers purchased the house in 1904 ... in the heart of Jackson Ward, the center of Richmond's African American business and social life"}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "In 1904 the Walkers purchased their family home at 110 1/2 East Leigh Street, located in Richmond's Jackson Ward neighborhood, which was dubbed—as the hub of Richmond's African American business and cultural life—the 'Harlem of the South.'"}
  note: "First ledger's EV quote paraphrased; replaced with the page text."
- card: maggie-lena-walker
  fact: "By 1928 she was in a wheelchair but remained head of the bank and the order"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "by 1928 she was using a wheelchair. Despite her physical limitations she remained actively committed to her life's work including chairman of the bank and leader of the Independent Order of St. Luke until her death"}
    - {title: "National Women's History Museum, Arlisha R. Norwood: Maggie Lena Walker", url: "https://www.womenshistory.org/education-resources/biographies/maggie-lena-walker", quote: "After an illness in 1928, Walker was forced to use a wheelchair. Although limited in movement, Walker remained a leader"}
- card: maggie-lena-walker
  fact: "In 1930, in the Depression, she merged the bank with two other Richmond banks into the Consolidated Bank and Trust Company"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "to create the Consolidated Bank and Trust Company in 1930."}
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "when the bank merged with two other Richmond banks to become The Consolidated Bank and Trust Company."}
  note: "NWHM places the consolidation in the Great Depression."
- card: maggie-lena-walker
  fact: "She died on 15 December 1934"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "until her death on December 15,1934."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "Walker died on December 15, 1934, of diabetic gangrene."}
- card: maggie-lena-walker
  fact: "Her Jackson Ward house is now kept by the National Park Service"
  verdict: confirmed
  sources:
    - {title: "National Park Service, Maggie L. Walker NHS: Maggie Lena Walker", url: "https://www.nps.gov/mawa/learn/historyculture/maggie-lena-walker.htm", quote: "The Walker family owned the home until 1979, when it was purchased by the National Park Service."}
    - {title: "Encyclopedia Virginia, Muriel Miller Branch: Maggie Lena Walker", url: "https://encyclopediavirginia.org/entries/walker-maggie-lena-1864-1934/", quote: "Her home at East Leigh Street was purchased by the National Park Service in 1979 and converted into a National Historic Site."}
- card: ernest-everett-just
  fact: "In 1909 he began research at the Marine Biological Laboratory at Woods Hole and returned summer after summer"
  verdict: corrected
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "Lillie directed Just to begin research in 1909 at Woods Hole ... After obtaining his PhD, Just returned annually to Woods Hole as an independent researcher."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "In 1909 he started studying at the Marine Biological Laboratory (MBL) in Woods Hole, Massachusetts ... an activity he looked forward to doing each summer at the MBL"}
  note: "The generalisation 'much American biology was done at summer stations' had no source; the opening sentence was removed and replaced by the dated Woods Hole fact."
- card: ernest-everett-just
  fact: "He was born in Charleston, South Carolina, on 14 August 1883"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "Just was born in Charleston, South Carolina, on 14 August 1883"}
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "Born on August 14, 1883, in Charleston, South Carolina"}
- card: ernest-everett-just
  fact: "He graduated from Dartmouth in 1907 magna cum laude"
  verdict: corrected
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "He graduated from Dartmouth in 1907, the only “magna cum laude” in his class"}
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "he graduated magna cum laude in biology with a minor in history in 1907."}
  note: "'The only one in his class' is in ASU alone (BlackPast and Encyclopedia.com say only magna cum laude); dropped."
- card: ernest-everett-just
  fact: "That autumn he began teaching English at Howard University, and soon moved to biology"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "joined the English faculty at Howard University, Washington, DC in the fall of that same year."}
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "Just accepted a position at Howard University as an instructor of rhetoric and English. ... In 1910, he joined the Department of Biology"}
- card: ernest-everett-just
  fact: "He studied the fertilisation and development of the eggs of marine animals"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "Just's many experiments with marine invertebrates showed that the egg surface, or ectoplasm, plays an important role in the fertilization and development of eggs."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "Science was for Just a deeply felt avocation, an activity he looked forward to doing each summer at the MBL"}
  note: "ENCJ also lists his 1939 Basic Methods for Experiments on Eggs of Marine Animals."
- card: ernest-everett-just
  fact: "In 1915 the NAACP made him the first recipient of the Spingarn Medal"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "In 1915 Just was the first to receive the Spingarn Medal"}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "In 1915 Just was awarded the NAACP's first Spingarn Medal"}
- card: ernest-everett-just
  fact: "In 1916 the University of Chicago gave him a doctorate"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "the University of Chicago awarding Just his PhD degree in experimental embryology in 1916."}
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "He earned a doctorate in zoology in 1916."}
- card: ernest-everett-just
  fact: "No white American university would hire him; he could hope to teach only at a Black college"
  verdict: confirmed
  sources:
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "Despite his Ph.D., he could not find work at any White universities in America, so Just moved to Europe"}
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "Howard University, one of the few institutions at the time that would hire a black scientist."}
- card: ernest-everett-just
  fact: "From 1929 he worked in Europe, first at the Stazione Zoologica in Naples"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "In 1929 Just made his first trip to Europe and worked at Anton Dohrn’s Stazione Zoologica in Naples."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "His first excursion, in 1929, took him to Italy, where he worked for seven months at the Stazione Zoologica in Naples."}
- card: ernest-everett-just
  fact: "He worked at the Kaiser Wilhelm Institute for Biology in Berlin"
  verdict: confirmed
  sources:
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "In 1930 Just was invited to the Kaiser Wilhelm Institute in Berlin"}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "He worked primarily at the Stazione Zoologica; the Kaiser-Wilhelm Institut für Biologie in Berlin; and the Station Biologique in Roscoff, France."}
- card: ernest-everett-just
  fact: "He worked at the marine station at Roscoff in Brittany"
  verdict: confirmed
  sources:
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "was working at the Station Biologique in Roscoff, France, when the Germans invaded the country."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "and the Station Biologique in Roscoff, France."}
- card: ernest-everett-just
  fact: "In 1939 he published The Biology of the Cell Surface, arguing that the cell surface plays a fundamental role in development"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "The book was published under the title Biology of the Cell Surface in 1939. Its thesis, that the ectoplasm or cell surface has a fundamental role in development"}
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "In 1939 he published two books: Basic Methods for Experiments on Eggs of Marine Animals and The Biology of the Cell Surface."}
- card: ernest-everett-just
  fact: "When Germany invaded France in 1940 he was briefly interned, then released and returned to the United States"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Just, Ernest", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/just-ernest", quote: "In 1940 Just was interned briefly in France following the German invasion and then released to return to America"}
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "Ernest Just was captured and held briefly in a prisoner-of-war camp until rescued by the U.S."}
- card: ernest-everett-just
  fact: "He died in Washington on 27 October 1941"
  verdict: confirmed
  sources:
    - {title: "BlackPast, W. Gabriel Selassie I: Ernest Everett Just", url: "https://www.blackpast.org/african-american-history/just-ernest-everett-1883-1941/", quote: "Ernest Everett Just died in Washington, D.C., on October 27, 1941."}
    - {title: "Embryo Project Encyclopedia, Karen Wellner: Ernest Everett Just", url: "https://embryo.asu.edu/pages/ernest-everett-just-1883-1941", quote: "forced Just to return to the US and Howard University ... Just died of pancreatic cancer on 27 October 1941."}
  note: "Place 'Washington' explicit only in BlackPast; ASU puts him back at Howard (Washington) before his death."
- card: matthew-henson
  fact: "Peary spent nearly two decades (18 years) trying to reach the Pole, with Henson as his companion"
  verdict: confirmed
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "Henson and Peary had been attempting to reach the Pole for the past 18 years."}
    - {title: "National Geographic, James Edward Mills (2014)", url: "https://www.nationalgeographic.com/adventure/article/the-legacy-of-arctic-explorer-matthew-henson", quote: "In 1891 the two companions began an 18-year partnership of Arctic exploration"}
  note: "Card's 'US Navy officer' (was 'naval engineer', single-sourced to Mills): ANC 'Commander Robert E. Peary', NGM 'a naval officer'."
- card: matthew-henson
  fact: "Henson was born in 1866 in Charles County, Maryland"
  verdict: confirmed
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "Matthew Henson was born in Charles County, Maryland in 1866."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Henson, Matthew", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/henson-matthew", quote: "Matthew Alexander Henson was born in rural Charles County, Maryland"}
- card: matthew-henson
  fact: "He was orphaned young"
  verdict: confirmed
  sources:
    - {title: "National Geographic, Anna Brendle (2003)", url: "https://www.nationalgeographic.com/culture/article/profile-african-american-north-pole-explorer-matthew-henson", quote: "Matthew Henson became an orphan when he was only 11 years old."}
    - {title: "National Geographic, James Edward Mills (2014)", url: "https://www.nationalgeographic.com/adventure/article/the-legacy-of-arctic-explorer-matthew-henson", quote: "Orphaned at a very young age, Henson made his own way in life"}
- card: matthew-henson
  fact: "At twelve he went to sea as a cabin boy and on board learned to read and write"
  verdict: corrected
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "At the age of 12, he went to work as a cabin boy on a merchant ship ... he learned how to read, write and navigate."}
    - {title: "National Geographic, Anna Brendle (2003)", url: "https://www.nationalgeographic.com/culture/article/profile-african-american-north-pole-explorer-matthew-henson", quote: "The ship's skipper taught Henson to read and write."}
  note: "'Navigate' only in ANC; dropped. Bowdoin, ENCH and NGM also give age twelve."
- card: matthew-henson
  fact: "Peary met him in a hat shop where Henson worked as a clerk and hired him as valet for a survey in Nicaragua"
  verdict: corrected
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "while working as a clerk in a Washington, D.C. hat shop, he met Commander Robert E. Peary, who was planning a surveying expedition to Nicaragua. ... Peary hired him as a valet."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Henson, Matthew", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/henson-matthew", quote: "while working as a clerk in a Baltimore hat store, Henson was hired by U.S. Navy Lt. Robert E. Peary to be Peary's personal servant on a survey expedition"}
  note: "Sources disagree on the city (Washington vs Baltimore); the card now names neither."
- card: matthew-henson
  fact: "He joined Peary on seven Arctic expeditions"
  verdict: confirmed
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "accompanied him on seven Arctic expeditions between 1891 and 1909."}
    - {title: "Bowdoin College, Peary-MacMillan Arctic Museum: Matthew Henson", url: "https://www.bowdoin.edu/arctic-museum/educational-resources/arctic-biographies/henson.html", quote: "After Nicaragua he accompanied Peary on seven Arctic expeditions"}
- card: matthew-henson
  fact: "In Greenland he learned the Inuit language and became the expedition's best dog-sledge driver, driving like the Inuit"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Henson, Matthew", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/henson-matthew", quote: "While surveying Greenland Henson grew close to the native Inuits, learned the Inuit language, became the expedition's most able dogsled driver"}
    - {title: "Bowdoin College, Peary-MacMillan Arctic Museum: Matthew Henson", url: "https://www.bowdoin.edu/arctic-museum/educational-resources/arctic-biographies/henson.html", quote: "could drive a sledge with native prowess."}
- card: matthew-henson
  fact: "He spoke Inuktitut fluently"
  verdict: corrected
  sources:
    - {title: "Bowdoin College, Peary-MacMillan Arctic Museum: Matthew Henson", url: "https://www.bowdoin.edu/arctic-museum/educational-resources/arctic-biographies/henson.html", quote: "Of Peary's crew, only Henson was fluent in Inuktitut"}
    - {title: "National Geographic, James Edward Mills (2014)", url: "https://www.nationalgeographic.com/adventure/article/the-legacy-of-arctic-explorer-matthew-henson", quote: "He was fluent in the Inuit language"}
  note: "'He alone' rests on Bowdoin only; card now says he was fluent."
- card: matthew-henson
  fact: "On 6 April 1909 Peary, Henson and four Inuit men reached what they took to be the Pole"
  verdict: confirmed
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "Henson and Robert Edwin Peary, and four Inuit assistants, became the first human beings to set foot on the North Pole."}
    - {title: "Encyclopedia of African-American Culture and History via Encyclopedia.com: Henson, Matthew", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/henson-matthew", quote: "On April 6, 1909, Peary, Henson, and four Eskimos became the first people to reach the North Pole."}
  note: "Contested; see dispute."
- card: matthew-henson
  fact: "Henson said he reached the camp at the Pole first, ahead of Peary"
  verdict: confirmed
  sources:
    - {title: "Arlington National Cemetery: Matthew Henson", url: "https://www.arlingtoncemetery.mil/explore/notable-graves/explorers/matthew-henson", quote: "According to Henson, he was the first of the group to reach the North Pole."}
