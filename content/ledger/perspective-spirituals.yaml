# Perspective rewrite of spirituals (2026-11-15): shared frame plus the male copy (Frederick Douglass)
# and the female copy (Ella Sheppard). Every fact in the new paragraphs and the wow line, with two
# independent sources and a verbatim quote from each; '...' marks an omission inside a quote.
# The old dispute (first-tour takings) was dropped with the figure it qualified.
- card: spirituals
  copy: both
  fact: "Spirituals are religious folk songs made by enslaved African Americans in the American South"
  sources:
    - {title: "Library of Congress, African American Spirituals: Introduction", url: "https://guides.loc.gov/spirituals-folklife", quote: "The term \"Negro spiritual\" refers to a genre of religious folksongs created and sung by enslaved peoples of African descent in the American South."}
    - {title: "Digital History, University of Houston: Spirituals", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm", quote: "In the decades before the Civil War, enslaved African Americans created diverse forms of music, including work songs, field hollers, and spirituals"}
- card: spirituals
  copy: both
  fact: "They most likely arose from the late eighteenth century"
  sources:
    - {title: "Angela M. S. Nelson, What Did Slave Songs Sound Like?, Christian History 31 (1991)", url: "https://christianhistoryinstitute.org/magazine/article/golden-age-of-hymns-spirituals", quote: "Many scholars believe, however, that the spiritual originated in the late eighteenth century."}
    - {title: "Carnegie Hall Timeline: Folk Spiritual", url: "https://timeline.carnegiehall.org/genres/folk-spiritual", quote: "The spiritual began emerging in conjunction with camp meetings associated with the Second Awakening. This revival movement dominated religious life in the American frontier from the 1780s to the 1830s"}
- card: spirituals
  copy: both
  fact: "They were made from Bible stories, hymns and African ways of singing"
  sources:
    - {title: "Angela M. S. Nelson, What Did Slave Songs Sound Like?, Christian History 31 (1991)", url: "https://christianhistoryinstitute.org/magazine/article/golden-age-of-hymns-spirituals", quote: "The spirituals sung in these meetings drew from hymns, the Bible, and African styles of singing."}
    - {title: "Carnegie Hall Timeline: Folk Spiritual", url: "https://timeline.carnegiehall.org/genres/folk-spiritual", quote: "The spiritual draws from African music and European psalms and hymns"}
    - {title: "Digital History, University of Houston: Spirituals", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm", quote: "Drawing on stories from the Old and New Testament, the spirituals dealt with religious themes"}
- card: spirituals
  copy: both
  fact: "A leader improvised a line and the others answered with a refrain (call and response)"
  sources:
    - {title: "Carnegie Hall Timeline: Folk Spiritual", url: "https://timeline.carnegiehall.org/genres/folk-spiritual", quote: "The soloist improvises a line to which the other singers respond"}
    - {title: "Library of Congress, African American Spirituals: Introduction", url: "https://guides.loc.gov/spirituals-folklife", quote: "spirituals are structured in a way that allows for repetition and call-and-response delivery between a leader's statement and a chorus's refrain"}
- card: spirituals
  copy: both
  fact: "Work songs used the same call and response"
  sources:
    - {title: "Carnegie Hall Timeline: Work Songs, Field/Street Calls, Satirical and Protest Songs", url: "https://timeline.carnegiehall.org/genres/work-songs-field-street-calls-satirical-protest-songs", quote: "Many work crews had song leaders who improvised a line, to which the others responded with a refrain."}
    - {title: "National Humanities Center, The Making of African American Identity: Work songs", url: "https://nationalhumanitiescenter.org/pds/maai/community/text2/text2read.htm", quote: "Here we listen to three African American work songs derivative of antebellum field songs, each audio clip accompanied by a separate webpage of lyrics. Two are call-and-response songs"}
- card: spirituals
  copy: both
  fact: "In the ring shout worshippers shuffled round in a circle"
  sources:
    - {title: "Yolanda Y. Smith, He Still Wid Us, Jesus, Christian History 62 (1999)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus", quote: "they became the basis of the ring shout: \"When the ‘sperichil’ is struck up, [all present] begin first walking and by-and-by shuffling round, one after the other, in a ring."}
    - {title: "Allen, Ware and Garrison, Slave Songs of the United States (1867), introduction, Documenting the American South, UNC", url: "https://docsouth.unc.edu/church/allen/allen.html", quote: "all stand up in the middle of the floor, and when the 'sperichil' is struck up, begin first walking and by-and-by shuffling round, one after the other, in a ring."}
    - {title: "College of Charleston, Lowcountry Digital History Initiative, Hidden Voices: Spiritual practices", url: "https://ldhi.library.cofc.edu/exhibits/show/hidden-voices/enslaved-womens-cultural-lives/enslaved-women-and-religion/spiritual-practices", quote: "Ring shout was a communal practice among enslaved women and men which involved dancing in a counterclockwise circle and singing."}
- card: spirituals
  copy: both
  fact: "Songs of the Hebrews in Egypt and of Canaan spoke of the singers' own bondage and hope of freedom"
  sources:
    - {title: "Carnegie Hall Timeline: Folk Spiritual", url: "https://timeline.carnegiehall.org/genres/folk-spiritual", quote: "In their songs, the enslaved recreated stories about the oppressed Hebrew people, the cruel Egyptians, the Red Sea, and the land of Canaan to reflect their oppression, their treatment by whites, and their desire for freedom respectively."}
    - {title: "Yolanda Y. Smith, He Still Wid Us, Jesus, Christian History 62 (1999)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus", quote: "Inspired by God’s actions on behalf of the children of Israel in Egypt, slaves firmly believed that God would deliver them from their bondage."}
- card: spirituals
  copy: male
  fact: "Frederick Douglass was born enslaved in Maryland"
  sources:
    - {title: "Frederick Douglass Papers Project: Douglass timeline", url: "https://frederickdouglasspapersproject.com/page/douglass-timeline", quote: "Frederick Augustus Washington Bailey was born sometime in February at Holme Hill Farm plantation at Tuckahoe, near the town of Easton, Talbot County, on the eastern shore of Maryland."}
    - {title: "National Park Service, Frederick Douglass NHS: Frederick Douglass", url: "https://www.nps.gov/frdo/learn/historyculture/frederickdouglass.htm", quote: "born into slavery on the Eastern Shore of Maryland in February 1818."}
- card: spirituals
  copy: male
  fact: "As a boy he lived on the Lloyd plantation, where people going to the Great House Farm sang on the way"
  sources:
    - {title: "Frederick Douglass, Narrative of the Life of Frederick Douglass (1845), Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "The slaves selected to go to the Great House Farm, for the monthly allowance for themselves and their fellow-slaves, were peculiarly enthusiastic. While on their way, they would make the dense old woods, for miles around, reverberate with their wild songs"}
    - {title: "Frederick Douglass Papers Project: Douglass timeline", url: "https://frederickdouglasspapersproject.com/page/douglass-timeline", quote: "1824 Sent to live in the home of his master Aaron Anthony, overseer of the Wye Plantation of the powerful Lloyd family."}
    - {title: "George Mason University Libraries, Music of Black Virginia: Douglass on the songs of the enslaved", url: "https://masonlibraries.gmu.edu/blackmusic/s/music-black-va/item/14", quote: "The slaves selected to go to the Great House Farm, for the monthly allowance for themselves and their fellow-slaves, were peculiarly enthusiastic."}
- card: spirituals
  copy: male
  fact: "He did not understand the songs then: \"I was myself within the circle\""
  sources:
    - {title: "Frederick Douglass, Narrative of the Life of Frederick Douglass (1845), Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "I did not, when a slave, understand the deep meaning of those rude and apparently incoherent songs. I was myself within the circle; so that I neither saw nor heard as those without might see and hear."}
    - {title: "Digital History, University of Houston: Spirituals", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm", quote: "I did not, when a slave, understand the deep meaning of those songs. They told a tale of woe which was then altogether beyond my feeble comprehension"}
- card: spirituals
  copy: male
  fact: "In 1836 he and his friends plotted to escape, and the plot failed"
  sources:
    - {title: "Frederick Douglass Papers Project: Douglass timeline", url: "https://frederickdouglasspapersproject.com/page/douglass-timeline", quote: "1836 Led a failed escape plan from the farm of William Freeland."}
    - {title: "House Divided, Dickinson College: Frederick Douglass", url: "https://hd.housedivided.dickinson.edu/node/15954", quote: "Before long, he and his pupils had plotted to escape to the free state of Pennsylvania, but this too was discovered."}
    - {title: "Frederick Douglass, My Bondage and My Freedom (1855), ch. XIX, Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass55/douglass55.html", quote: "Accordingly, at the beginning of this year 1836, I took upon me a solemn vow, that the year which had now dawned upon me should not close, without witnessing an earnest attempt, on my part, to gain my liberty."}
- card: spirituals
  copy: male
  fact: "They sang \"O Canaan, sweet Canaan\": \"We meant to reach the north, and the north was our Canaan\""
  sources:
    - {title: "Frederick Douglass, My Bondage and My Freedom (1855), ch. XIX, Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass55/douglass55.html", quote: "A keen observer might have detected in our repeated singing of \"O Canaan, sweet Canaan, I am bound for the land of Canaan,\" something more than a hope of reaching heaven. We meant to reach the north --and the north was our Canaan"}
    - {title: "Tufts University Libraries, Slave Songs of the United States, Douglass exhibition", url: "https://omeka.library.tufts.edu/exhibits/show/douglass-olafsson/musical-inspirations/slave-songs-of-the-united-stat", quote: "Douglass spoke of singing spirituals in My Bondage and My Freedom (1855): “A keen observer might have detected in our repeated singing of 'O Canaan, sweet Canaan, I am bound for the land of Canaan,' something more than a hope of reaching heaven. We meant to reach the North, and the North was our Canaan.\""}
    - {title: "Yolanda Y. Smith, He Still Wid Us, Jesus, Christian History 62 (1999)", url: "https://christianhistoryinstitute.org/magazine/article/he-still-wid-us-jesus", quote: "“We meant to reach the North , and the North was our Canaan.”"}
- card: spirituals
  copy: male
  fact: "He escaped in 1838"
  sources:
    - {title: "National Park Service, Frederick Douglass NHS: Frederick Douglass", url: "https://www.nps.gov/frdo/learn/historyculture/frederickdouglass.htm", quote: "On September 3, 1838, with the ticket in hand, he boarded a northbound train dressed as a sailor."}
    - {title: "House Divided, Dickinson College: Frederick Douglass", url: "https://hd.housedivided.dickinson.edu/node/15954", quote: "Frederick escaped from slavery in September 1838."}
    - {title: "Frederick Douglass Papers Project: Douglass timeline", url: "https://frederickdouglasspapersproject.com/page/douglass-timeline", quote: "Escaped from Maryland into Massachusetts by borrowing papers from a free black sailor to take a train from Baltimore to New York City."}
- card: spirituals
  copy: male
  fact: "In the North he was astonished that the singing was taken as contentment; the Narrative (1845): \"Slaves sing most when they are most unhappy\""
  sources:
    - {title: "Frederick Douglass, Narrative of the Life of Frederick Douglass (1845), Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "I have often been utterly astonished, since I came to the north, to find persons who could speak of the singing, among slaves, as evidence of their contentment and happiness. It is impossible to conceive of a greater mistake. Slaves sing most when they are most unhappy."}
    - {title: "Digital History, University of Houston: Spirituals", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm", quote: "I have often been utterly astonished, since I came to the north, to find persons who could speak of the singing, among slaves, as evidence of their contentment and happiness. It is impossible to conceive of a greater mistake. Slaves sing most when they are most unhappy."}
    - {title: "Frederick Douglass Papers Project: Douglass timeline", url: "https://frederickdouglasspapersproject.com/page/douglass-timeline", quote: "1845 Published his first autobiography, Narrative of the Life of Frederick Douglass, an American Slave, Written by Himself"}
- card: spirituals
  copy: male
  fact: "Every tone was \"a testimony against slavery\""
  sources:
    - {title: "Frederick Douglass, Narrative of the Life of Frederick Douglass (1845), Documenting the American South, UNC", url: "https://docsouth.unc.edu/neh/douglass/douglass.html", quote: "Every tone was a testimony against slavery, and a prayer to God for deliverance from chains."}
    - {title: "Digital History, University of Houston: Spirituals", url: "https://www.digitalhistory.uh.edu/active_learning/explorations/spirituals/spirituals_menu.cfm", quote: "Every tone was a testimony against slavery and a prayer to God for deliverance from chains"}
- card: spirituals
  copy: male
  fact: "\"Follow the Drinking Gourd\", told as a sung escape map, was first printed in 1928"
  sources:
    - {title: "Joel Bresler, Follow the Drinking Gourd: A Cultural History", url: "http://www.followthedrinkinggourd.org/", quote: "The American folksong Follow the Drinking Gourd was first published in 1928. The Drinking Gourd song was supposedly used by an Underground Railroad operative to encode escape instructions and a map."}
    - {title: "Internet Archive: Follow de Drinkin' Gou'd, Publications of the Texas Folk-Lore Society VII (1928)", url: "https://archive.org/details/followdedrinking0000unse", quote: "FOLLOW DE DRINKIN' GOU'D. Publications of the Texas Folk-Lore Society. Number VII. by J. Frank Dobie Publication date 1928 Publisher Texas Folk-Lore Society Austin, Texas"}
- card: spirituals
  copy: female
  fact: "Ella Sheppard was born enslaved in 1851"
  sources:
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "ELLA SHEPPARD (MOORE) (1851-1914) Ella Sheppard was born on February 4, 1851, in Nashville, Tennessee."}
    - {title: "A. Kori Hill, Composer Feature: Ella Sheppard, Cincinnati Public Radio (2024)", url: "https://www.classicsforkids.com/composer-feature-ella-sheppard/", quote: "Ella Sheppard (1851-1914), used to live in Cincinnati? She moved there around 1860, several years after her father, Simon, purchased her freedom."}
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "When Ella was a little girl, her slave mother discovered that their mistress had trained Ella to spy on her."}
- card: spirituals
  copy: female
  fact: "In despair her mother ran with her to the river to drown them both; an old woman stopped her"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collection/first-recording-of-swing-low-sweet-chariot-1909", quote: "she resolutely set out for the Cumberland River, intent on drowning both herself and her daughter. She was stopped by an “old mammy” who cautioned Sarah to “let de chariot of de Lord swing low.”"}
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "\"In agony of soul and despair,\" her mother ran to the river with her, intending to drown little Ella and herself."}
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "Determined that Ella would not remain a slave, Sarah made a threat to \"take Ella and jump into the river than see her a slave.\""}
- card: spirituals
  copy: female
  fact: "Her father bought Ella for $350; her mother stayed enslaved in Mississippi"
  sources:
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "Soon after this incident, Ella's father was permitted to purchase the three-year-old girl for $350 and take her to Nashville. Her mother, however, was forced to remain a slave in Mississippi."}
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "the slave mistress sold Ella to Simon Sheppard for $350. Ella remained in Nashville with her father when the mother was taken to Mississippi."}
- card: spirituals
  copy: female
  fact: "Only years later did Ella find her mother"
  sources:
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "She continued to take care of her mother -- with whom she'd been reunited when she was fifteen and had supported ever since"}
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "Eventually, she located her mother and a sister in Mississippi and brought them to Nashville."}
- card: spirituals
  copy: female
  fact: "She was a pianist trained in Cincinnati"
  sources:
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "In Cincinnati, Ella started school, studied piano, and took voice lessons"}
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "Ella demonstrated such exceptional musical talent that her father bought a piano and paid for private music lessons."}
    - {title: "A. Kori Hill, Composer Feature: Ella Sheppard, Cincinnati Public Radio (2024)", url: "https://www.classicsforkids.com/composer-feature-ella-sheppard/", quote: "He bought her a piano, as she had always shown musical aptitude"}
- card: spirituals
  copy: female
  fact: "She became Fisk's first Black teacher"
  sources:
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "When he invited her to be an assistant music teacher a year later, \"Miss Sheppard\" became Fisk's first black instructor."}
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "Ella became the music teacher at Fisk University--the only black staff member at the school before 1875."}
- card: spirituals
  copy: female
  fact: "On 6 October 1871 she set out with the student singers who were to raise money for the indebted school"
  sources:
    - {title: "Tennessee State University Library: Ella Sheppard (Moore)", url: "https://ww2.tnstate.edu/library/digital/sheppard.htm", quote: "Ella Sheppard became one of nine singers selected by White to form the group of singers. She served as pianist and assistant trainer. ... On October 6, 1871, the group went on tour."}
    - {title: "Fisk University: History", url: "https://www.fisk.edu/about/history/", quote: "Fisk's world-famous Jubilee Singers® originated as a group of traveling students who set out from Nashville on October 6, 1871, taking the entire contents of the University treasury with them for travel expenses, praying that through their music they could somehow raise enough money to keep the doors of their debt-ridden school open."}
    - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee", quote: "Mr. White started, in God’s strength, October 6, 1871, with his little band of singers to sing the money out of the hearts and pockets of the people."}
- card: spirituals
  copy: female
  fact: "Sheppard: \"We did not dream of ever using them in public\"; they \"were associated with slavery and the dark past\""
  sources:
    - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee", quote: "“We did not dream of ever using them in public,” explained White’s African-American assistant Ella Sheppard. “They were associated with slavery and the dark past, and represented the things to be forgotten.”"}
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "Sheppard later noted that, not long before this time, they did not dream of ever singing the spirituals in public due to their sacred content and their association with dark memories of slavery."}
- card: spirituals
  copy: female
  fact: "Audiences responded most to the spirituals, and Sheppard added more to the repertoire"
  sources:
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "The singers immediately discovered that the white evangelical Christians attending their concerts were more enthusiastic for the few slave spirituals included in their repertoire than for the popular and classical tunes that made up the bulk of their program. ... made Sheppard suddenly responsible for learning as many spirituals as she could and incorporating them into the singers’ repertoire as they traveled."}
    - {title: "Tennessee Encyclopedia: Jubilee Singers of Fisk University", url: "https://tennesseeencyclopedia.net/entries/jubilee-singers-of-fisk-university/", quote: "As a result of the enthusiastic response to the spirituals–or slave songs, as they were often called–a larger portion of each performance began to be devoted to spirituals"}
- card: spirituals
  copy: female
  fact: "Among them was \"Swing Low, Sweet Chariot\", whose chorus one account traces to the old woman who stopped her mother at the river"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collection/first-recording-of-swing-low-sweet-chariot-1909", quote: "Another, more dramatic, origin story is also told: John W. Work claimed that the spiritual “burst forth” from the anguished soul of Sarah Hannah Sheppard, the mother of Ella Sheppard of Fisk Jubilee Singer fame."}
    - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee", quote: "Sheppard brought him “O Freedom” and “Swing Low, Sweet Chariot,” songs her mother had taught her."}
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "The chorus of \"Swing Low, Sweet Chariot\" -- a song Ella would later teach the Jubilee Singers -- has been attributed to the words of an elder that came to her rescue."}
- card: spirituals
  copy: both
  fact: "In 1873 the Fisk Jubilee Singers sang for Queen Victoria"
  sources:
    - {title: "National Geographic: The Fisk Jubilee Singers", url: "https://www.nationalgeographic.com/history/article/the-fisk-jubilee-singers-amazing-story-from-slavery-to-stardom", quote: "A painting in Jubilee Hall depicts the Singers performing in front of Queen Victoria in May 1873."}
    - {title: "Tennessee Encyclopedia: Jubilee Singers of Fisk University", url: "https://tennesseeencyclopedia.net/entries/jubilee-singers-of-fisk-university/", quote: "In 1873 the Jubilee Singers and George White boarded a ship for England for a successful British tour. Their numerous performances created a storm of approval and culminated in a performance for Queen Victoria."}
    - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee", quote: "In March 1873 they set sail with White and his wife and children. ... they were astonished to perform for none other than Queen Victoria herself."}
- card: spirituals
  copy: both
  fact: "Their tours paid for Jubilee Hall, which still stands on the Fisk campus"
  sources:
    - {title: "Fisk University: History", url: "https://www.fisk.edu/about/history/", quote: "raised funds that preserved their University and permitted construction of Jubilee Hall, the South's first permanent structure built for the education of black students. As a designated National Historical Landmark, today, Jubilee Hall remains the dramatic focal point of Fisk's campus."}
    - {title: "Andrew Ward, They Brought the Jubilee, American Heritage 51:4 (2000)", url: "https://www.americanheritage.com/they-brought-jubilee", quote: "by the time of their return to Nashville in 1874 they had raised another fifty thousand dollars for the construction of Jubilee Hall, the first permanent building on Fisk’s new campus."}
    - {title: "National Geographic: The Fisk Jubilee Singers", url: "https://www.nationalgeographic.com/history/article/the-fisk-jubilee-singers-amazing-story-from-slavery-to-stardom", quote: "we were in the Fisk Jubilee Singers’ rehearsal room in Jubilee Hall, a towered Victorian-era edifice at one end of the Fisk University campus in Nashville."}
- card: spirituals
  copy: both
  fact: "Harry T. Burleigh carried spirituals into the concert hall as art songs"
  sources:
    - {title: "Carnegie Hall Timeline: Spiritual as Art Song", url: "https://timeline.carnegiehall.org/genres/spiritual-as-art-song", quote: "in 1916, when composer-arranger-and concert artist Harry T. Burleigh (1866–1949) published his arrangements of folk spirituals for solo voice and piano accompaniment"}
    - {title: "Hymnology Archive: Harry T. Burleigh", url: "https://hymnologyarchive.com/harry-t-burleigh", quote: "HARRY T. BURLEIGH, 82, Negro singer who wrote the music for more than 50 spirituals and composed more than 200 songs, died today at a private hospital here. He was best known for his arrangement of “Deep River.”"}
- card: spirituals
  copy: both
  fact: "Spirituals fed the blues"
  sources:
    - {title: "Carnegie Hall Timeline: Rural/Folk Blues", url: "https://timeline.carnegiehall.org/genres/rural-folk-blues", quote: "The three-line rural blues form emerged out of African American work songs, field calls and protest songs, game songs and social songs, spirituals, and folk ballads."}
    - {title: "South Carolina Encyclopedia: Spirituals", url: "https://www.scencyclopedia.org/sce/?p=14978", quote: "Gospel and blues draw significantly from early African American spirituals."}
- card: spirituals
  copy: both
  fact: "Spirituals fed gospel"
  sources:
    - {title: "Carnegie Hall Timeline: Rural Gospel", url: "https://timeline.carnegiehall.org/genres/rural-gospel", quote: "These forms retain many characteristics of the folk spiritual but blend elements from blues, ragtime and jazz traditions."}
    - {title: "South Carolina Encyclopedia: Spirituals", url: "https://www.scencyclopedia.org/sce/?p=14978", quote: "Gospel and blues draw significantly from early African American spirituals."}
    - {title: "Carnegie Hall Timeline: Folk Spiritual", url: "https://timeline.carnegiehall.org/genres/folk-spiritual", quote: "The folk spiritual later evolved into Concert Spirituals, Rural Gospel, Spiritual as Art Song, and Freedom Songs."}
