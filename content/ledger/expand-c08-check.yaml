  - card: ebonics-oakland
    fact: "Invariant be marks repeated events (\"Billy don't be telling lies\")"
    verdict: corrected
    sources:
      - {title: "Salikoko S. Mufwene, Encyclopaedia Britannica: Ebonics (archived)", url: "http://web.archive.org/web/20250327162147/https://www.britannica.com/topic/Ebonics", quote: "consuetudinal or invariant be , such as “Billy don’t be telling lies” (different in meaning from “Billy don’t tell lies,” because it refers to repeated processes rather than to a repeated activity)"}
      - {title: "John R. Rickford, Ebonics Notes and Discussion (December 1996)", url: "https://web.stanford.edu/~rickford/ebonics/EbonicsExamples.html", quote: "and invariant habitual \"be\" (a form which has clear parallels with and possible derivations from creole \"does be\""}
    note: "The card said the plain sentence does not express repetition; Mufwene says both refer to repetition, of processes versus of an activity. Body reworded to 'a different meaning ... because it describes a repeated process'."
