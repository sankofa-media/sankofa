# Second, independent check of batch c08 (2026-11-14). Every source reopened (curl, archive.org id_ snapshots); quotes searched in the fetched text.
# Independence: Everson N4261 replaces and copies Pandey N4044 (one source); the Unicode Standard chapter text derives from the encoding proposals;
# Ditsele & Hurst (2016) and Hurst's thesis share an author (one source); the LSA resolution was drafted by Rickford.
entries:
  - card: kikakui
    fact: "Kikakui is a syllabary for Mende, written right to left"
    verdict: confirmed
    sources:
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "Mende is a syllabary, written from right to left."}
      - {title: "Simon Ager, Omniglot: Mende syllabary (Kikakui)", url: "https://www.omniglot.com/writing/kikakui.htm", quote: "Writing direction : right to left in horizontal lines."}
    note: "Both quotes found in the fetched texts; independent authors."
  - card: kikakui
    fact: "Mende is spoken in Sierra Leone and Liberia"
    verdict: corrected
    sources:
      - {title: "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", quote: "for writing the Sierra Leonean language, Mende"}
      - {title: "The Unicode Standard 17.0, chapter 19.8: Mende Kikakui", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "The Mende Kikakui script is used for the Mende language of Sierra Leone."}
    note: "Liberia rests only on the Everson/Tuchscherer proposal (citing Ethnologue); 'southern and eastern Sierra Leone' in the proposal describes the area where the script was promoted, not the language area. Body now says only 'a language of Sierra Leone'."
  - card: kikakui
    fact: "Right-to-left direction linked to Arabic script known to its makers"
    verdict: corrected
    sources:
      - {title: "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", quote: "It is the only West African syllabary to be written from right to left, which is attributed to Kamara's Islamic heritage and familiarity with the Arabic script, also written from right to left."}
      - {title: "Arthur Abraham, Kisimi Kamara, Encyclopaedia Africana", url: "https://encyclopaediaafricana.com/?p=13540", quote: "it is written from right to left, another sign of Arabic influence"}
    note: "The proposal quote in the original ledger only says Turay was an Islamic scholar and does not make the link; replaced by Arthur Abraham (Encyclopaedia Africana)."
  - card: kikakui
    fact: "Named after the sounds of its first three signs ki, ka, ku"
    verdict: unconfirmed
    sources:
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "also called “Kikakui” for the first three characters in the system"}
      - {title: "The Unicode Standard 17.0, chapter 19.8: Mende Kikakui", url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/", quote: "It is named Kikakui after the sound of its first three characters."}
    note: "The Unicode Standard chapter is drawn from the encoding proposal, and the Endangered Alphabets page copies the proposal: one source. Explanation removed; the body now only gives the name as Kikakui or Ki-ka-ku (see unledgered)."
  - card: kikakui
    fact: "First signs by Mohamed Turay (c. 1917); student Kisimi Kamara reworked and enlarged it in the early 1920s to nearly two hundred signs"
    verdict: corrected
    sources:
      - {title: "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", quote: "The Mende (also called Kikakui) script was devised by Mohammed Turay ... It was modified by one of Turay's students, Kisimi Kamara, in 1921 to produce the form currently used. It is an abugida; each of the 195 symbols represents a consonant with an inherent vowel."}
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "devised around 1917 by Mohamed Turay ... and further developed by his son-in-law and student, Kisimi Kamara"}
      - {title: "Arthur Abraham, Kisimi Kamara, Encyclopaedia Africana", url: "https://encyclopaediaafricana.com/?p=13540", quote: "is famous for having invented the Mende script of syllabary, the KiKaKu, in about 1921 ... In all, there are 195 semantics ... Some traditions, however, cast doubt on the validity of ascribing the invention to Kisimi Kamara."}
      - {title: "Simon Ager, Omniglot: Mende syllabary (Kikakui)", url: "https://www.omniglot.com/writing/kikakui.htm", quote: "The Mende syllabary was invented in 1921 by Kisimi Kamara (ca. 1890-1962) of Sierra Leone. ... Number of symbols: 195"}
    note: "Number made exact (195, three sources); date 'around 1921'; the body now flags the attribution dispute, which the front-matter dispute field already described; dispute updated with Abraham."
  - card: kikakui
    fact: "Many signs close in form to the Vai script of Liberia"
    verdict: corrected
    sources:
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "the syllabic blueprint for the script was unquestionably influenced from the neighboring Vai, who possessed a similarly organized script by 1832 or 1833"}
      - {title: "SIL Writing Systems (formerly ScriptSource): Mende Kikakui", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Mend", quote: "It is generally believed that the inventors also had some knowledge of the Vai script of Liberia, as the two scripts share significant similarities both in form and in origin."}
    note: "Only SIL speaks of similar form; the proposal says the character shapes came from Mende symbols and the syllabic plan from Vai. Body now says the plan owes much to Vai."
  - card: kikakui
    fact: "From the 1920s Kamara spread it beyond his chiefdom; for two decades used for letters and records"
    verdict: corrected
    sources:
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "efforts to promote the script outside of the Barri chiefdom, in southern and eastern Sierra Leone, beginning in the 1920s ... The script was used for record-keeping and correspondence"}
      - {title: "Simon Ager, Omniglot: Mende syllabary (Kikakui)", url: "https://www.omniglot.com/writing/kikakui.htm", quote: "During the 1920s and 1930s he ran a school in Potoru to teach Ki-ka-ku . The syllabary became a popular method of keeping records and writing letters."}
      - {title: "Arthur Abraham, Kisimi Kamara, Encyclopaedia Africana", url: "https://encyclopaediaafricana.com/?p=13540", quote: "it became a fashionable way of communicating with friends on all kinds of subjects. Schools were opened to teach only the KiKaKu."}
    note: "Rephrased with the school detail (Omniglot and Abraham)."
  - card: kikakui
    fact: "In the 1940s the British Protectorate Literacy Bureau in Bo taught Mende in Latin letters and Kikakui fell out of use"
    verdict: confirmed
    sources:
      - {title: "Michael Everson and Konrad Tuchscherer, Revised proposal for encoding the Mende script, N4167 (2012)", url: "https://www.unicode.org/L2/L2012/12023-n4167-mende.pdf", quote: "In the 1940s, however, the British established the Protectorate Literacy Bureau in Bo, and a Latin orthography for Mende was taught. This contributed to the gradual disuse of the Mende script."}
      - {title: "Simon Ager, Omniglot: Mende syllabary (Kikakui)", url: "https://www.omniglot.com/writing/kikakui.htm", quote: "During the 1940s the British set up the Protectorate Literacy Bureau in Bo with the aim of teaching the Mende people to read and write with a version of the Latin alphabet. As a result, usage of Kisimi's syllabary gradually diminished"}
    note: "Confirmed; Abraham ('the script began to lose ground in the 1940s') agrees."
  - card: kikakui
    fact: "Encoded in Unicode 7.0 in 2014"
    verdict: confirmed
    sources:
      - {title: "Script Encoding Initiative, UC Berkeley: Scripts encoded in Unicode", url: "https://linguistics.berkeley.edu/sei/scripts-encoded.html", quote: "Mende Kikakui 7.0 L2/12-023 Michael Everson"}
      - {title: "Unicode Consortium: Unicode release dates", url: "https://www.unicode.org/history/publicationdates.html", quote: "7.0.0 2014 June 16"}
    note: "Confirmed."
  - card: garay
    fact: "Garay is an alphabet for Wolof of Senegal, right to left, on the Arabic model"
    verdict: confirmed
    sources:
      - {title: "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", url: "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", quote: "The script is based upon the Arabic model and is written linearly from right-to-left."}
      - {title: "Simon Ager, Omniglot: Wolof", url: "https://www.omniglot.com/writing/wolof.htm", quote: "This alphabet is written from right to left and is modelled loosely on the Arabic script."}
    note: "Everson N4261 replaces Pandey N4044 and reuses its text; counted with it as one source. Omniglot is independent."
  - card: garay
    fact: "Wolof officially written in Latin letters and also in Wolofal (Arabic script)"
    verdict: confirmed
    sources:
      - {title: "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", url: "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", quote: "The official script in Senegal for Wolof is Latin, although the Wolofal script (an Arabic-based script written in the ‘Ajami’ style) is also used."}
      - {title: "Simon Ager, Omniglot: Wolof", url: "https://www.omniglot.com/writing/wolof.htm", quote: "Wolof was first written with a version of the Arabic script known as Wolofal ... The Wolof orthography using the Latin alphabet was standardised in 1974 and is the official script for Wolof in Senegal."}
    note: "Body now also says Wolofal came first (Omniglot; Pandey/Everson confirm it is used)."
  - card: garay
    fact: "Designed to be familiar to anyone who knows Arabic script"
    verdict: unconfirmed
    sources:
      - {title: "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", url: "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", quote: "Faye designed Garay to be easy to learn, familiar to anyone who had learned some of the Arabic script"}
    note: "The Unicode Standard sentence derives from Everson's proposal: one source. Removed."
  - card: garay
    fact: "Created by Assane Faye and published in January 1961"
    verdict: corrected
    sources:
      - {title: "SIL Writing Systems (formerly ScriptSource): Garay", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", quote: "The Garay (also called Wolof) alphabet was created by Assane Faye in 1961 for writing the Wolof language"}
      - {title: "Simon Ager, Omniglot: Wolof", url: "https://www.omniglot.com/writing/wolof.htm", quote: "Wolof is also sometimes written with the Garay alphabet which was devised by Assane Faye, a Senegalese artist, in 1961."}
      - {title: "Anshuman Pandey, Introducing the Wolof Alphabet of Assane Faye, N4044 (2011)", url: "https://www.unicode.org/L2/L2011/11181-faye-wolof.pdf", quote: "The Wolof alphabet was created by Assane Faye. Its official date of origin is January 1961."}
    note: "The month appears only in Pandey and in Everson, who copies him; body now says 1961."
  - card: garay
    fact: "Consonants have capital and small forms; capitals set apart by a swash"
    verdict: corrected
    sources:
      - {title: "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", url: "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", quote: "is a casing script, where capital letters are generally distinguished by a swash distinguishing them from the small letters"}
      - {title: "Andrij Rovenchak, Abdou Souleye Faye and Charles L. Riley, Consideration of the encoding of Garay, L2/22-048 (2022)", url: "https://www.unicode.org/L2/L2022/22048-garay-script.pdf", quote: "10D50;GARAY CAPITAL LETTER A;Lu;0;R;;;;;N;;;;10D70;"}
      - {title: "Simon Ager, Omniglot: Wolof", url: "https://www.omniglot.com/writing/wolof.htm", quote: "Each consonant has two forms"}
    note: "Case confirmed by Everson and by Rovenchak, Faye and Riley (independent authors). The swash is described only by Everson (the Unicode Standard follows him); removed from body and wow."
  - card: garay
    fact: "Faye taught it informally for decades to a few hundred people"
    verdict: corrected
    sources:
      - {title: "SIL Writing Systems (formerly ScriptSource): Garay", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", quote: "He reported that Assane Faye had been offering lessons in the script to hundreds of people over the years"}
      - {title: "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", url: "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", quote: "The user community for Garay is small at present, some 200 people ... The script has been taught informally for more than fifty years since its invention."}
    note: "'A few hundred' changed to 'hundreds' (Riley's report). SIL reports Charles Riley's 2009 visit; Everson may draw on the same fieldwork, but the two are separate publications by different authors. The sentence 'its readers are still counted in hundreds' was removed: only Everson gives a user count, and SIL says it is unknown whether the script is in use."
  - card: garay
    fact: "A Quran with interlinear Wolof translation in Garay exists"
    verdict: corrected
    sources:
      - {title: "Michael Everson, Preliminary proposal for encoding the Garay script, N4261 (2012)", url: "https://www.unicode.org/L2/L2012/12139-n4261-garay.pdf", quote: "there exists also a Qur‘ān with interlinear text giving the translation into Wolof using Garay script"}
      - {title: "SIL Writing Systems (formerly ScriptSource): Garay", url: "https://scriptsource.org/cms/scripts/page.php?item_id=script_detail&key=Gara", quote: "translated the Koran using it"}
    note: "'Between the lines' (interlinear) is only in Everson; dropped."
  - card: garay
    fact: "Encoded in Unicode 16.0 in 2024"
    verdict: confirmed
    sources:
      - {title: "Script Encoding Initiative, UC Berkeley: Scripts encoded in Unicode", url: "https://linguistics.berkeley.edu/sei/scripts-encoded.html", quote: "Garay 16.0 L2/16-069 Michael Everson"}
      - {title: "Unicode Consortium: Unicode release dates", url: "https://www.unicode.org/history/publicationdates.html", quote: "16.0.0 2024 September 10"}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "Pictograms matched to Bété syllables, meant for any language"
    verdict: confirmed
    sources:
      - {title: "Museum of Modern Art, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", url: "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", quote: "He developed a writing system in which he matched spoken syllables in the Bété language with pictograms—glyph-like renderings of things from real life. The artist believed that this system could be applied not only to Bété but to other languages as well."}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "This unique, \"universal\" alphabet made up an inventory of sounds that could be used to transcribe all of the world's languages."}
      - {title: "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", url: "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", quote: "The resulting syllabary can be used in all languages"}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "Sign counts differ between sources (448, 440, 401, 449 drawings)"
    verdict: confirmed
    sources:
      - {title: "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", url: "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", quote: "creating an alphabet consisting of 448 monosyllabic pictograms"}
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "Soit 440 pictogrammes monosyllabiques pour représenter les phonèmes."}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "composed of 401 monosyllabic pictograms"}
      - {title: "Museum of Modern Art, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", url: "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", quote: "The series consists of 449 drawings"}
    note: "Confirmed; the dispute field reports it."
  - card: bouabre-bete-script
    fact: "Born 1923 in Zéprégühé into the Bété people"
    verdict: confirmed
    sources:
      - {title: "Contemporary And (C&): Frédéric Bruly Bouabré (1923–2014)", url: "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", quote: "Ivorian Frédéric Bruly Bouabré was born in 1923 in Zéprégühé."}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "Born in Zéprégüé, Côte d'Ivoire, Frédéric Bruly Bouabré (1923–2014) belonged to the Bété people"}
    note: "Confirmed. Le Temps gives 'vers 1923 dans la région de Daloa'; coordinates near Daloa are consistent."
  - card: bouabre-bete-script
    fact: "Sailor in the French navy in WWII, then clerk in the colonial administration in Senegal"
    verdict: confirmed
    sources:
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "he was called up as a sailor in the French West African Navy and landed in Dakar in 1941. At the end of the Second World War he stayed on in Senegal, where he worked as a clerk until 1957."}
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "Enrôlé dans la marine pendant la Seconde Guerre mondiale, il devient ensuite fonctionnaire de l'administration coloniale."}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "On 11 March 1948, on his way to work, he saw seven coloured suns circling in the sky"
    verdict: confirmed
    sources:
      - {title: "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", url: "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", quote: "In Dakar, on March 11th of the year 1948 ... on his way to work one day, he suddenly saw seven differently coloured suns orbiting in the sky."}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "On his way to work on 11 March 1948 Bouabré had a vision"}
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "un jour de mars 1948, il avait vu le ciel s’ouvrir et sept soleils colorés décrire «un cercle de beauté autour de leur Mère-Soleil»"}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "He took the name Cheik Nadro and set out to record and pass on all his knowledge, starting with a script for his people"
    verdict: corrected
    sources:
      - {title: "Raw Vision: Frédéric Bruly Bouabré, Self-Taught Encyclopaedist (2010)", url: "https://rawvision.com/blogs/articles/articles-frederic-bruly-bouabre-self-taught-encyclopaedist", quote: "Adopting the name Cheik Nadro-le-Révélateur (the Revealer) ... Begun in 1956, and completed during the first three months of 1958, his alphabet was published that same year"}
      - {title: "Charles Riley, An Ivorian innovation: the Bété script, The Digital Orientalist (2019)", url: "https://digitalorientalist.com/2019/01/08/an-ivorian-innovation-the-bete-script/", quote: "who called himself “Cheikh Nadro” ... the script Bouabré was inspired to invent in 1956 for Bété and other languages"}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "henceforth his encyclopaedic mission was to note down and pass on all the knowledge granted him"}
    note: "'Beginning with' implied the script came straight after 1948; Raw Vision and Riley both date its start to 1956 (MoMA: 'in the 1950s'). Body corrected."
  - card: bouabre-bete-script
    fact: "Thousands of small cards in ballpoint and coloured pencil, each framed by a handwritten caption, gathered as Knowledge of the World"
    verdict: confirmed
    sources:
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "des milliers de petits dessins nés de ces observations, il les réalisait dans sa modeste cour, avec des stylos bille et des crayons de couleur sur des cartons de 10 x 15 cm. Chacun d’eux est encadré d’une sorte de légende écrite à la main. Réunis sous le titre Connaissance du monde"}
      - {title: "Collection de l'Art Brut, Lausanne: Bruly Bouabré, Frédéric", url: "https://artbrut.ch/en/artists/bruly-bouabre-frederic", quote: "drawing shapes with a black or blue ballpoint, then colouring them in with pencil. Each drawing is framed with a caption"}
      - {title: "Museum of Modern Art, Frédéric Bruly Bouabré: World Unbound, gallery texts (2022)", url: "https://press.moma.org/wp-content/uploads/2022/03/5-Bouabre_SectionTexts.pdf", quote: "Bouabré termed these surveys “connaissance du monde,” or “knowledge of the world,”"}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "After Magiciens de la terre (Paris, 1989) museums worldwide invited him"
    verdict: confirmed
    sources:
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "présenté dans l’exposition de Jean-Hubert Mar­tin Magiciens de la terre, à Paris en 1989, l’artiste est invité dans les musées internationaux"}
      - {title: "Contemporary And (C&): Frédéric Bruly Bouabré (1923–2014)", url: "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", quote: "participating in major shows such as Les Magiciens de la Terre (1989), Documenta XI (2002) and in the core exhibition of the Venice Biennale in 2013"}
    note: "Confirmed."
  - card: bouabre-bete-script
    fact: "Died in Abidjan on 28 January 2014, aged about 91"
    verdict: confirmed
    sources:
      - {title: "Contemporary And (C&): Frédéric Bruly Bouabré (1923–2014)", url: "https://contemporaryand.com/en/c-and-magazine/texts/frederic-bruly-bouabre-1923-2014", quote: "Bouabré died aged 91 on January 28, 2014."}
      - {title: "Le Temps: L'artiste encyclopédiste Frédéric Bruly Bouabré est décédé chez lui, à Abidjan, à 91 ans (29 January 2014)", url: "https://www.letemps.ch/culture/lartiste-encyclopediste-frederic-bruly-bouabre-decede-chez-lui-abidjan-91-ans", quote: "Frédéric Bruly Bouabré est décédé chez lui à Abidjan, ce mardi, à 91 ans. Ou à peu près."}
    note: "Le Temps is dated Wednesday 29 January 2014, so 'ce mardi' is 28 January. Confirmed."
  - card: mandombe
    fact: "Script from the DRC for Kikongo, Lingala, Swahili; name means \"for the Blacks\""
    verdict: confirmed
    sources:
