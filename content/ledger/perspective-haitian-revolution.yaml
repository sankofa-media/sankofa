# Perspective rewrite of the haitian-revolution card (2026-11-15): shared frame and outcome,
# {male} paragraph on Toussaint Louverture, {female} paragraph on Sanité Bélair.
# Every page below was opened for this ledger. Madiou (1847) and Ardouin (1854) are quoted from
# the Internet Archive OCR text, with OCR misreadings corrected. The Fondation pour la mémoire de
# l'esclavage page quotes Madiou on the execution, so for the trial and execution it is not counted
# as a second source; Ardouin, who worked from the published judgment, is the second source there.
# C. L. R. James says Dessalines lured the couple to an interview; Ardouin and the FME say Sanité was
# captured by Faustin Répussard and Charles gave himself up. The card says only "they were taken".
# The Black Money (Omeka) page copies the banknotes.com description and is not counted.
# The Hegel paragraph and its dispute were removed from the body.
- card: haitian-revolution
  copy: both
  fact: "Saint-Domingue, France's colony, was in 1789 the richest in the Americas"
  sources:
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "Haiti, known as Saint-Domingue before the revolution, was the richest colony in the Americas in 1789."}
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "Under French rule, Saint-Domingue grew to be the wealthiest colony in the French empire"}
- card: haitian-revolution
  copy: both
  fact: "Its sugar and coffee were grown by hundreds of thousands of enslaved Africans"
  sources:
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "Almost half a million slaves toiled on its sugar, coffee, indigo, and cotton plantations."}
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "To supply the plantation system, French owners imported almost 800,000 Africans to the colony"}
- card: haitian-revolution
  copy: both
  fact: "In August 1791, after a ceremony at Bois Caïman, the enslaved rose"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "After a ceremony at Bois Caïman, the rebellion began in August 1791."}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "The slaves rose up the fourth week of August 1791, burning hundreds of plantations and killing or driving out the masters."}
- card: haitian-revolution
  copy: both
  fact: "Under Toussaint Louverture they fought off Spanish and British armies"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "the rebels fought off British and Spanish attacks and even liberated enslaved people on the Spanish side of the island."}
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "Louverture and his troops played a crucial role in the struggle against the Spanish and British."}
- card: haitian-revolution
  copy: both
  fact: "In 1802 Napoleon's army under Charles Leclerc tried to restore slavery"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "Napoleon’s forces regained control of the colony in 1802 and attempted to restore slavery."}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "sent an army under his brother-in-law Charles Leclerc (1772–1802) in 1801"}
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "A French military expedition commanded by Napoleon's brother-in-law Charles Victoire Leclerc landed in Saint-Domingue"}
- card: haitian-revolution
  copy: male
  fact: "Toussaint was born into slavery"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "Born into slavery in the French colony of Saint-Domingue around 1740"}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "As a slave he was called Toussaint Bréda."}
- card: haitian-revolution
  copy: male
  fact: "He had become the colony's governor"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "he was the lawfully appointed governor of Saint-Domingue"}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "He confirmed Toussaint in his post as Commander-in-Chief and Governor"}
- card: haitian-revolution
  copy: male
  fact: "He gave the colony a constitution of his own"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "issuing a constitution of his own"}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "d'après le principe de l'ancienneté militaire établi par T. Louverture lui-même, dans sa constitution de 1801"}
- card: haitian-revolution
  copy: male
  fact: "In June 1802 Leclerc's men seized him and put him on a ship for France"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "was taken prisoner in June 1802 and deported to France"}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "On June 7th General Brunet wrote to Toussaint asking for a meeting at his headquarters. ... They rushed the family on board a frigate which was waiting in the harbour of Le Cap and embarked them for France."}
- card: haitian-revolution
  copy: male
  fact: "On board he said they had cut down only the trunk of the tree of liberty, which would grow again from the roots, for they were numerous and deep"
  sources:
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "As Toussaint stepped on board the boat he spoke to Savary the captain ... “In overthrowing me, you have cut down in San Domingo only the trunk of the tree of liberty. It will spring up again by the roots for they are numerous and deep.”"}
    - {title: "John R. Beard, The Life of Toussaint L'Ouverture (1853), Internet Archive", url: "https://archive.org/details/lifeoftoussaintl00bear", quote: "They have only felled the trunk of the tree (of the freedom of the blacks); branches will sprout, for the roots are numerous and deep."}
- card: haitian-revolution
  copy: male
  fact: "He was held without trial in the Fort de Joux in the Jura mountains and died there in April 1803"
  sources:
    - {title: "BnF France-Amériques: Toussaint Louverture, Destiny and Contradictions", url: "https://heritage.bnf.fr/france-ameriques/en/toussaint-louverture-destiny-and-contradictions", quote: "Denied a trial, he was confined in the Fort de Joux in the Jura mountains, where he died in April 1803."}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "Toussaint was imprisoned in the Fort-de-Joux, situated in the Jura mountains ... Toussaint died on April 7th, 1803"}
- card: haitian-revolution
  copy: female
  fact: "Sanité Bélair was married to Toussaint's nephew Charles Bélair"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage: Sanite Bélair", url: "https://memoire-esclavage.org/tcpdf/747", quote: "Sanite (ou Sanité), surnom de Suzanne, était une jeune affranchie originaire des Verrettes qui épousa en 1796 Charles Bélair, neveu, aide de camp et lieutenant de Toussaint Louverture."}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "Toussaint’s favourite was his nephew, Charles Belair ... He did not like the whites, and Sanite, his wife, hated them"}
- card: haitian-revolution
  copy: female
  fact: "Charles Bélair rose against the French in August 1802"
  sources:
    - {title: "Thomas Madiou, Histoire d'Haïti, vol. 2, Internet Archive", url: "https://archive.org/details/histoiredhaiti02madi", quote: "Charles Bélair prit les armes dans les mornes des Verrettes et de l’Arcahaie au mois d’Août 1802."}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "In August Charles Belair, heart-broken since Toussaint had been arrested ... joined the insurrection"}
- card: haitian-revolution
  copy: female
  fact: "Sanité fought at his side"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage: Sanite Bélair", url: "https://memoire-esclavage.org/tcpdf/747", quote: "elle participe aux côtés de son époux aux combats de 1802, dans les retranchements escarpés des Matheux, contre l’expédition napoléonienne"}
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "Belair and Sanite came, for the women were now fighting side by side with the men."}
- card: haitian-revolution
  copy: female
  fact: "In September 1802 the couple were taken"
  sources:
    - {title: "Thomas Madiou, Histoire d'Haïti, vol. 2, Internet Archive", url: "https://archive.org/details/histoiredhaiti02madi", quote: "Il fut arrêté en Septembre. Le 10 Septembre 1802 (23 Fructidor, an 10), Dessalines annonça à Leclerc son arrestation."}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "Heureux de cette capture, Dessalines adressa la lettre suivante au capitaine-général : Au quartier-général de l'Artibonite, le 23 fructidor, an X (10 septembre)."}
- card: haitian-revolution
  copy: female
  fact: "Jean-Jacques Dessalines, then a general in Leclerc's service, sent them to Le Cap"
  sources:
    - {title: "C. L. R. James, The Black Jacobins, Internet Archive", url: "https://archive.org/details/clr-james-the-black-jacobins", quote: "But still these black and Mulatto generals continued to fight for Leclerc against the “brigands,” ... Dessalines arrested them both and sent them to Leclerc."}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "Ils furent envoyés à la Petite-Rivière, auprès de Dessalines qui s'y était rendu, et qui les fit escorter aux Gonaïves, d'où ils furent envoyés au Cap"}
    - {title: "Fondation pour la mémoire de l'esclavage: Sanite Bélair", url: "https://memoire-esclavage.org/tcpdf/747", quote: "Le couple Bélair fut expédié à Leclerc, sur ordre de Dessalines"}
- card: haitian-revolution
  copy: female
  fact: "She was also accused of having a sick young white man killed"
  sources:
    - {title: "Fondation pour la mémoire de l'esclavage: Sanite Bélair", url: "https://memoire-esclavage.org/tcpdf/747", quote: "Un des chefs d’accusation retenu contre Sanite concernait l’exécution d’un jeune blanc capturé par les troupes de Bélair ... la citoyenne Sanite (...) déclara hautement qu’elle ne voulait pas donner des soins plus longtemps"}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "Ce secrétaire de Charles Bélair était un jeune blanc qui tomba malade. Sous prétexte qu'elle ne pouvait continuer à en prendre soin, Sannite, femme de ce général, le fit sacrifier par des soldats de la 8e"}
- card: haitian-revolution
  copy: female
  fact: "She was sentenced, as a woman, to be beheaded, and Charles, as a soldier, to be shot"
  sources:
    - {title: "Thomas Madiou, Histoire d'Haïti, vol. 2, Internet Archive", url: "https://archive.org/details/histoiredhaiti02madi", quote: "« La commission considérant le grade militaire de Charles et le sexe de Sannitte, son épouse, condamna le dit Bélair à être fusillé, et la dite Sannitte, sa femme, à être décapitée. »"}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "Charles Bélair, comme auteur principal de la révolte, à être fusillé en sa qualité de militaire, et Sannite, son épouse, comme complice et vu son sexe, à être décapitée."}
- card: haitian-revolution
  copy: female
  fact: "On 5 October 1802 she urged him to die bravely"
  sources:
    - {title: "Thomas Madiou, Histoire d'Haïti, vol. 2, Internet Archive", url: "https://archive.org/details/histoiredhaiti02madi", quote: "Dans l'après midi du 13 Vendémiaire (5 Octobre) Charles Bélair, ainsi que son épouse, fut conduit entre deux pelotons de soldats blancs ... il entendit, avec calme, la voix de son épouse qui l'exhortait à mourir en brave."}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "ou 5 octobre 1802. Dans la journée même, il reçut son exécution derrière le cimetière du Cap ... Son épouse, présente à ce moment suprême, l'exhorta à mourir en brave."}
- card: haitian-revolution
  copy: female
  fact: "She refused the blindfold and would not bow to the block, and she was shot"
  sources:
    - {title: "Thomas Madiou, Histoire d'Haïti, vol. 2, Internet Archive", url: "https://archive.org/details/histoiredhaiti02madi", quote: "Sannitte refusa de se laisser bander les yeux. Le bourreau, malgré ses efforts, ne put la courber contre le billot. L'officier qui commandait le détachement fut obligé de la faire fusiller."}
    - {title: "Beaubrun Ardouin, Études sur l'histoire d'Haïti, vol. 5, Internet Archive", url: "https://archive.org/details/tudessurlhisto05ardo", quote: "Lorsqu'on voulut lui bander les yeux, elle s'y refusa : on ne put davantage la contraindre à subir le supplice de la décapitation ; il fallut la fusiller comme son mari."}
- card: haitian-revolution
  copy: female
  fact: "Haiti's ten-gourde note of 2004 bears her portrait"
  sources:
    - {title: "Haitian American Museum of Chicago, collection: Haitian Banknotes", url: "https://hamoc.libraryhost.com/items/show/1180", quote: "(10 gourdes, 2004, Sanite Belair in mint condition)"}
    - {title: "Banknotes.com: Haiti 10 Gourdes 2004-2012", url: "https://www.banknotes.com/ht272.htm", quote: "Obverse: Lieutenant Mme Suzanne Sanite Belair (1781 - 1802). Battle scene."}
- card: haitian-revolution
  copy: both
  fact: "Late in 1803 the rebels under Jean-Jacques Dessalines beat the French"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "Under the new leadership of Jean-Jacques Dessalines, the rebellion finally defeated French forces in late 1803."}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "resulted in the final defeat of the French forces at Vertières on November 18, 1803."}
- card: haitian-revolution
  copy: both
  fact: "On 1 January 1804 Dessalines proclaimed Haiti, and the enslaved who had risen kept the whole colony"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Haiti", url: "https://slaveryandremembrance.org/articles/article/?id=A0111", quote: "On January 1, 1804, Dessalines announced the new nation of Haiti"}
    - {title: "Stewart R. King, Haitian Revolution, IESS via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/haitian-revolution", quote: "declared Haitian independence on January 1, 1804"}
- card: haitian-revolution
  copy: both
  fact: "In 1825 France demanded 150 million francs for the former colonists"
  sources:
    - {title: "BnF: Gusti-Klara Gaillard-Pourchet, Haiti’s independence debt", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The total indemnity to be settled amounted to 150 million francs, to be paid in five annual instalments."}
    - {title: "New York Times: Historical data on Haiti’s debt", url: "https://github.com/nytimes/haiti-debt", quote: "This debt, which began in 1825, includes the indemnity that France demanded from Haiti to compensate former colonists and the loan that Haiti took out to start paying it."}
- card: haitian-revolution
  copy: both
  fact: "The indemnity was later cut to 90 million francs"
  sources:
    - {title: "BnF: Gusti-Klara Gaillard-Pourchet, Haiti’s independence debt", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The total indemnity was renegotiated downwards (to 90 million francs), and its payment spread over 30 annual instalments."}
    - {title: "New York Times: Historical data on Haiti’s debt", url: "https://github.com/nytimes/haiti-debt", quote: "Payments made on the 150-million-franc indemnity, which was later reduced to 90 million francs."}
- card: haitian-revolution
  copy: both
  fact: "Haiti borrowed in France to pay"
  sources:
    - {title: "BnF: Gusti-Klara Gaillard-Pourchet, Haiti’s independence debt", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "it had to take out a loan in November, 1825 of 30 million francs on the French market"}
    - {title: "New York Times: Historical data on Haiti’s debt", url: "https://github.com/nytimes/haiti-debt", quote: "To pay the indemnity, Haiti borrowed 30 million francs from a consortium of banks, including the Rothschilds, in 1825."}
- card: haitian-revolution
  copy: both
  fact: "Haiti repaid that loan only in 1888"
  sources:
    - {title: "BnF: Gusti-Klara Gaillard-Pourchet, Haiti’s independence debt", url: "https://heritage.bnf.fr/france-ameriques/en/haitis-independence-debt-slave-unit-account-1794-1922", quote: "The external loans of 1825 and 1875 are, respectively, paid off in 1887-88 and in 1921-22."}
    - {title: "New York Times: Historical data on Haiti’s debt", url: "https://github.com/nytimes/haiti-debt", quote: "Then in 1887, it said that it had paid off the loan — though a final, small amount of interest and late fees was paid the next year."}
- card: haitian-revolution
  copy: both
  fact: "Maroons had held out in the hills of Brazil (Palmares)"
  sources:
    - {title: "Flávio Gomes, Palmares, Encyclopedia of African-American Culture and History, via Encyclopedia.com", url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/palmares", quote: "The mountains of the area were considered an ideal location for captives to take refuge."}
    - {title: "Reis and Gomes, Quilombo: Brazilian Maroons during Slavery, Cultural Survival Quarterly", url: "https://www.culturalsurvival.org/publications/cultural-survival-quarterly/quilombo-brazilian-maroons-during-slavery", quote: "its several constituent settlements were located on the Serra da Barriga, a mountain chain"}
- card: haitian-revolution
  copy: both
  fact: "Maroons had held out in the hills of Jamaica"
  sources:
    - {title: "Colonial Williamsburg, Slavery and Remembrance: Nanny", url: "https://slaveryandremembrance.org/people/person/?id=PP023", quote: "sought refuge from a brutal slave society in the mountains of Jamaica"}
    - {title: "Jamaica Information Service: Nanny of the Maroons", url: "https://jis.gov.jm/information/heroes/nanny-of-the-maroons/", quote: "the British troops who attempted to penetrate the mountains to overpower them."}
