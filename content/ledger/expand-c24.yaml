    - {title: "Basic Books / Hachette: Freedomways Reader", url: "https://www.hachettebookgroup.com/titles/esther-cooper-jackson/freedomways-reader/9780813364520/", quote: "Figures of towering historical stature wrote for the journal, among them Paul Robeson, W.E.B. Du Bois, President Kwame Nkrumah and Julius Nyerere."}
