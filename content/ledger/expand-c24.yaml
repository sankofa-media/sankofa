# Expansion batch c24 (2026-11-13): every fact in the bodies and wow lines of the c24 cards,
# with at least two independent sources and a supporting quote from each.
- card: radio-freedom
  fact: "Radio Freedom was the ANC's station and began broadcasting in 1963 from a hideout near Johannesburg as the banned ANC's leaders went underground"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "Radio Freedom started its regular broadcasts inside South Africa from an ANC hideout in Johannesburg in 1963. With his organisation recently banned"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "In June 1963, the station's first transmission went out from the armed wing's hideout on a farm north of Johannesburg."}
- card: radio-freedom
  fact: "Walter Sisulu opened it with 'I speak to you from somewhere in South Africa... Our house is on fire'"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "I speak to you from somewhere in South Africa. I have not left the country."}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "\"I speak to you from somewhere in South Africa,\" Walter Sisulu , a party leader and Mandela's mentor, announced. \"Never has the country, and our people, needed leadership as they do now, in this hour of crisis. Our house is on fire.\""}
- card: radio-freedom
  fact: "Police soon raided the hideout and the station went silent"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "shortly afterwards police raided the hideout and seized the transmitter"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "The authorities raided the farm a couple of weeks later"}
- card: radio-freedom
  fact: "It returned in exile, first on Radio Tanzania"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "When it reopened it was as a piggy-back station on Radio Tanzania's external service."}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "The station reappeared in the late 1960s, broadcasting from black-run countries like Tanzania, Ethiopia, and Madagascar."}
- card: radio-freedom
  fact: "National broadcasters of Zambia, Ethiopia and Madagascar later gave it airtime"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "the station was given time on Radio Zambia (1972), Radio Luanda (1977), Radio Madagascar (1979), Radio Ethiopia and Radio Zimbabwe (1981)."}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "broadcasting from black-run countries like Tanzania, Ethiopia, and Madagascar."}
- card: radio-freedom
  fact: "Lusaka, the ANC's headquarters in exile, became the station's home"
  sources:
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "Zambia ... became the ANC-in-exile's headquarters. It became home to Radio Freedom, too."}
    - {title: "Sekibakiba Peter Lekgoathi and Kasonde Thomas Mukonde: Zambia's Support for the ANC's Radio Freedom in Lusaka, 1967-1992, Journal of African Cultural Studies 36:1 (2024)", url: "https://wiredspace.wits.ac.za/bitstreams/74f5d33b-e563-4fc5-a6d4-5c3a5f6fb6c0/download", quote: "it served as the headquarters of the ANC in exile. Most importantly, Zambia supported the ANC's radio broadcasting venture."}
- card: radio-freedom
  fact: "Its announcers came from the movement's camps and some trained in Eastern Europe"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "its broadcasters were selected from the camps of the ANC ... some of these recruits were sent to Eastern Europe for training"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "The station's DJs trained all over the world, from the Netherlands to the Soviet Union and East Germany."}
- card: radio-freedom
  fact: "Every programme opened with a burst of gunfire, then news, political commentary and songs"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "Radio Freedom broadcasts always started with a call-sign of automatic gunfire ... and generally consisted of a mix of news, political commentary and music"}
    - {title: "Abraham Mohale, DITSONG National Museum of Military History: ANC intelligence communication from London to Lusaka: Radio Freedom (2022)", url: "https://ditsong.org.za/en/anc-intelligence-communication-from-london-to-lusaka-radio-freedom/", quote: "The Station identification featured the sound of machine-gun fire"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "It began with the clack of machine-gun fire"}
- card: radio-freedom
  fact: "People at home listened on shortwave"
  sources:
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "They hunched over shortwave radios, straining to hear through clouds of static."}
    - {title: "Sekibakiba Peter Lekgoathi and Kasonde Thomas Mukonde: Zambia's Support for the ANC's Radio Freedom in Lusaka, 1967-1992, Journal of African Cultural Studies 36:1 (2024)", url: "https://wiredspace.wits.ac.za/bitstreams/74f5d33b-e563-4fc5-a6d4-5c3a5f6fb6c0/download", quote: "Radio Freedom programmes were aired on Radio Lusaka shortwave 41 metre- band 7.3 megahertz."}
- card: radio-freedom
  fact: "The station broadcast for almost thirty years"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "ended almost 30 years of radio broadcasting in Africa by political groups seeking an end to apartheid"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "For roughly three decades, Radio Freedom was the voice in exile of Nelson Mandela's African National Congress"}
- card: radio-freedom
  fact: "Listening could cost a South African up to eight years in prison"
  sources:
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "Just hearing this stuff could get you eight years in prison."}
    - {title: "Abraham Mohale, DITSONG National Museum of Military History: ANC intelligence communication from London to Lusaka: Radio Freedom (2022)", url: "https://ditsong.org.za/en/anc-intelligence-communication-from-london-to-lusaka-radio-freedom/", quote: "Listening to Radio Freedom in apartheid era South Africa, was a crime carrying a penalty of up to eight years in prison."}
- card: radio-freedom
  fact: "As exiles went home the station signed off in August 1991"
  sources:
    - {title: "Lebona Mosia, Charles Riddle and Jim Zaffiro: From Revolutionary to Regime Radio, Africa Media Review 8:1 (1994)", url: "http://archive.lib.msu.edu/DMC/African%20Journals/pdfs/africa%20media%20review/vol8no1/jamr008001002.pdf", quote: "slipped off the air that year as its broadcasters joined the queues of exiles on the road back home ... Jabulani Media Conference in Holland in August 1991"}
    - {title: "Chris A. Smith, The Appendix: Radio Freedom: A History of South African Underground Radio (2013)", url: "http://theappendix.net/posts/2013/12/radio-freedom-underground-radio-in-south-africa", quote: "The ANC renounced guerrilla war, and the exiles finally returned home. In August 1991, Radio Freedom went off the air."}
    - {title: "Abraham Mohale, DITSONG National Museum of Military History: ANC intelligence communication from London to Lusaka: Radio Freedom (2022)", url: "https://ditsong.org.za/en/anc-intelligence-communication-from-london-to-lusaka-radio-freedom/", quote: "Radio Freedom finally broadcasted in August 1991"}
- card: west-african-pilot
  fact: "Azikiwe founded the West African Pilot in Lagos in 1937"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "After returning to Nigeria in 1937 Azikiwe founded the West African Pilot"}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "West African Pilot , which he personally edited from 1937 to 1947"}
    - {title: "Nigerian Observer: Centenary anniversary, life and times of Chief Anthony Enahoro (2023)", url: "https://nigerianobservernews.com/2023/07/centenary-anniversary-life-and-times-of-a-national-hero-chief-anthony-enahoro/", quote: "associate editor of West African Pilot, Lagos"}
    - {title: "BBC World Service, The Story of Africa: Chapter 7", url: "https://www.bbc.co.uk/worldservice/africa/features/storyofafrica/13chapter7.shtml", quote: "Azikwe established the West African Pilot in Lagos"}
- card: west-african-pilot
  fact: "Azikiwe had studied in the United States"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "graduating from Lincoln University in 1930 with his Bachelor's Degree in Political Science"}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "he was an instructor in political science at Lincoln University before returning to Africa"}
- card: west-african-pilot
  fact: "He spent three years in Accra, Gold Coast, editing the new African Morning Post"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "In late 1934 Azikiwe returned to Africa, settling in Accra , Ghana where he became the editor of the newly founded African Morning Post ."}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "returned to Nigeria in 1937 after a three–year sojourn in the Gold Coast (Ghana), where he had begun his journalistic career, by founding and editing the highly-influential newspaper, African Morning Post"}
- card: west-african-pilot
  fact: "Around the Pilot he built a string of papers, among them the Southern Nigerian Defender in Ibadan"
  sources:
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "Southern Nigerian Defender , published in Warri and Ibadan"}
    - {title: "Nigerian Observer: Centenary anniversary, life and times of Chief Anthony Enahoro (2023)", url: "https://nigerianobservernews.com/2023/07/centenary-anniversary-life-and-times-of-a-national-hero-chief-anthony-enahoro/", quote: "Chief Nnamdi Azikiwe's newspaper, the Southern Nigerian Defender, Ibadan"}
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "instrumental in founding a string of newspapers across Nigeria"}
- card: west-african-pilot
  fact: "His papers argued for independence"
  sources:
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "he set up a string of newspapers — all aimed at achieving political independence"}
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "he promoted African nationalism and later African independence"}
- card: west-african-pilot
  fact: "In the 1950s Azikiwe headed the government of Eastern Nigeria"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "By 1954 he was the Premier of Eastern Nigeria"}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "As President of Eastern Nigeria in the 1950s"}
- card: west-african-pilot
  fact: "At independence in 1960 he became the first African governor-general"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "On October 1, 1960 Nigeria became independent of the British government and Nnamdi Azikiwe became its first indigenous Governor General."}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "the first and only indigenous Governor–General of Nigeria (1960–1963)"}
- card: west-african-pilot
  fact: "In 1963, when Nigeria became a republic, he became its first president (26 years after founding the Pilot)"
  sources:
    - {title: "Courtney Faal, BlackPast: Benjamin Nnamdi \"Zik\" Azikiwe (1904-1996)", url: "https://blackpast.org/global-african-history/azikiwe-benjamin-nnamdi-zik-1904-1996/", quote: "Three years later, on October 1, 1963 Nigeria was declared a republic"}
    - {title: "C. C. Aguolu and L. E. Aguolu: Nnamdi Azikiwe, World Libraries 7:2 (1997)", url: "http://web.archive.org/web/2010/http://www.worlib.org/vol07no2/aguolu_v07n2.shtml", quote: "the first President of the Federal Republic of Nigeria (1963–1966)"}
    - {title: "BBC World Service, The Story of Africa: Chapter 7", url: "https://www.bbc.co.uk/worldservice/africa/features/storyofafrica/13chapter7.shtml", quote: "the nationalist Nnamdi Azikwe, later to be first President of Nigeria"}
- card: presence-africaine
  fact: "Alioune Diop was born in Saint-Louis, Senegal, in 1910"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "Diop was born in 1910, in Saint-Louis, Senegal"}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "Alioune DIOP est né le 10 janvier 1910 à Saint-Louis (Sénégal)."}
- card: presence-africaine
  fact: "He studied classics in Algiers and then at the Sorbonne"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "enrolled in the University of Algiers, Algeria, in October 1933 to study classics. In 1937 he moved to Paris, France, and enrolled in the Sorbonne University"}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "il entama en Algérie (1936-1937) des études de Lettres classiques qu'il termina à la Sorbonne à Paris"}
- card: presence-africaine
  fact: "From 1943 he taught in French schools"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "Diop completed his studies in 1943 and then taught in secondary schools in France"}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "1943, il fut Professeur de Lettres à Paris et dans plusieurs villes françaises"}
- card: presence-africaine
  fact: "After the war he spent a short time in politics in Senegal and France"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "embracing a brief political career as chief of staff of the governor of Francophone West Africa and as a French senator in 1946"}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "entra brièvement dans la vie politique au Sénégal et en France entre 1946 et 1948"}
- card: presence-africaine
  fact: "In 1947, just after the war, he left politics and launched the review Présence Africaine in Paris"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "He left politics in 1947 and founded Présence Africaine , a journal for the Black World."}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "En 1947, au lendemain de la Seconde Guerre Mondiale ... il crée la revue Présence Africaine"}
- card: presence-africaine
  fact: "He meant it as a platform for Africans to set out their history and culture and enter modern world debates"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "Diop envisioned Présence Africaine as a literary vehicle providing Africans with a proper knowledge of their history and heritage ... He saw the journal as a way for Africans to enter modern world debates"}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "susceptibles d'aider à définir l'originalité africaine et de hâter son insertion dans le monde moderne"}
- card: presence-africaine
  fact: "In 1949 he added a publishing house of the same name for authors from Africa and the diaspora"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "In 1949 he expanded the journal to Présence Africaine Editions , a leading publishing house for African and Diaspora authors."}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "En 1949, deux ans après avoir créé la revue Présence Africaine , Alioune Diop fonde la maison d'édition du même nom. L'objectif est de fournir aux penseurs, écrivains et chercheurs d'Afrique et de la diaspora"}
- card: presence-africaine
  fact: "In 1956 Présence Africaine organised the First Congress of Black Writers and Artists at the Sorbonne, gathering people from Africa and the diaspora"
  sources:
    - {title: "Université Paris 1 Panthéon-Sorbonne: Colloque « Dans le sillage de Présence Africaine » (2026)", url: "https://www.pantheonsorbonne.fr/evenements/dans-le-sillage-de-presence-africaine", quote: "En 1956, des étudiantes et étudiants et artistes africain(e)s et noir(e)s se sont réuni(e)s dans l'amphithéâtre Descartes à la Sorbonne, à Paris pour le Premier congrès des écrivains et artistes noirs, initié et porté par la revue et maison d'édition Présence Africaine"}
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "In 1956 Diop organized the First Congress of Negro Writers and Artists. The conference, which took place in Paris, brought together leading artists and intellectuals from the African continent and from the African Diaspora."}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "« 1 er Congrès international des écrivains et artistes Noirs » qu'il organisa à la Sorbonne, en 1956"}
- card: presence-africaine
  fact: "Diop died in Paris on 2 May 1980 and the house outlived him"
  sources:
    - {title: "Etienne Lock, BlackPast: Alioune Diop (1910-1980)", url: "https://blackpast.org/global-african-history/alioune-diop-1910-1980/", quote: "He died five years later, on May 2, 1980, in Paris."}
    - {title: "Présence Africaine Éditions: La Maison d'édition", url: "http://www.presenceafricaine.com/info/8-maison-d-edition", quote: "Alioune Diop meurt à Paris le 2 mai 1980. ... C'est en 1980, après la mort d'Alioune, que Christiane Yandé Diop ... reprend la direction de la maison Présence africaine"}
- card: drum-magazine
  fact: "Drum took off in Johannesburg in 1951 under owner Jim Bailey"
  sources:
    - {title: "South African History Online: Drum Magazine", url: "https://www.sahistory.org.za/article/drum-magazine", quote: "It was only when Jim Bailey – a former RAF pilot and the son of a South African mining baron – took over the magazine in 1951 that the publication grew. Bailey soon moved the magazine's headquarters to Johannesburg"}
    - {title: "Lesley Cowling, University of the Witwatersrand: Journalism of Drum's heyday remains cause for celebration, 70 years later (2020)", url: "https://www.wits.ac.za/news/latest-news/opinion/2020/2020-07/journalism-of-drums-heyday-remains-cause-for-celebration--70-years-later.html", quote: "The African Drum was launched in 1951. After a lacklustre three months, the owner, Jim Bailey"}
- card: drum-magazine
  fact: "Anthony Sampson was its editor"
  sources:
    - {title: "Lesley Cowling, University of the Witwatersrand: Journalism of Drum's heyday remains cause for celebration, 70 years later (2020)", url: "https://www.wits.ac.za/news/latest-news/opinion/2020/2020-07/journalism-of-drums-heyday-remains-cause-for-celebration--70-years-later.html", quote: "brought a friend out from England, Anthony Sampson, to edit the magazine"}
    - {title: "South African History Online: Henry 'Mr Drum' Nxumalo", url: "https://www.sahistory.org.za/people/henry-mr-drum-nxumalo", quote: "Jim Bailey established Drum Magazine under the editorship of Anthony Sampson"}
    - {title: "Don Pinnock, Daily Maverick: Remembering the extraordinary life of SA's original media maverick (2019)", url: "https://www.dailymaverick.co.za/article/2019-12-04-remembering-the-extraordinary-life-of-sas-original-media-maverick/", quote: "Jim appointed his Oxford pal Anthony Sampson as edit"}
- card: drum-magazine
  fact: "It was filled with jazz and sport"
  sources:
    - {title: "Lesley Cowling, University of the Witwatersrand: Journalism of Drum's heyday remains cause for celebration, 70 years later (2020)", url: "https://www.wits.ac.za/news/latest-news/opinion/2020/2020-07/journalism-of-drums-heyday-remains-cause-for-celebration--70-years-later.html", quote: "black readers wanted sport, jazz, celebrities"}
    - {title: "South African History Online: Drum Magazine", url: "https://www.sahistory.org.za/article/drum-magazine", quote: "Drum's picture features – bright covers, jazz, girls and crime sto"}
- card: drum-magazine
