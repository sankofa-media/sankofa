    - {title: "Eckhard Breitinger, Leeds African Studies Bulletin 73 (2011): In memory of Ulli Beier", url: "http://lucas.leeds.ac.uk/tribute/in-memory-of-ulli-beier/", quote: "This is best shown by the Oshogbo artists"}
