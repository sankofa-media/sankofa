  sources:
    - {title: "Geoffrey Jacques, JSTOR Daily: A New Civil Rights Movement, a New Journal (2021)", url: "https://daily.jstor.org/a-new-civil-rights-movement-a-new-journal/", quote: "By the end of its run, Freedomways had become something close to a journal of record of the mid-to-late 20th Century African American freedom movement."}
    - {title: "Basic Books / Hachette: Freedomways Reader", url: "https://www.hachettebookgroup.com/titles/esther-cooper-jackson/freedomways-reader/9780813364520/", quote: "these documents, which show the depth and breadth of the struggle for democracy"}
- card: letter-from-birmingham-jail
  fact: "In April 1963 local activists and King's SCLC began sit-ins and marches against Birmingham's segregation laws"
  sources:
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "commenced a series of sit-ins and pickets, known as the Birmingham Campaign , aimed at bringing an end to municipal segregation ordinances in Birmingham"}
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "As the events of the Birmingham Campaign intensified on the city's streets"}
- card: letter-from-birmingham-jail
  fact: "A court injunction banned protests; on Good Friday, 12 April, King marched and was arrested"
  sources:
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "On Good Friday, April 12, King violated a court injunction prohibiting public civil rights demonstrations in the city."}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "gets a court injunction banning \"parading, demonstrating, boycotting, trespassing and picketing.\""}
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "King's 12 April 1963 arrest for violating Alabama's law against mass public demonstrations"}
- card: letter-from-birmingham-jail
  fact: "He was handed a newspaper with a statement by eight white clergymen calling the demonstrations 'unwise and untimely'"
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "published in the Birmingham News , calling its direct action strategy \"unwise and untimely\""}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "That afternoon, a lawyer enters his cell and leaves some newspapers."}
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "addressed to the eight white ministers"}
- card: letter-from-birmingham-jail
  fact: "He began in the newspaper's margins, went on on scraps of paper and finished on pads left by his lawyers"
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "It was begun on pieces of newspaper, continued on bits of paper supplied by a black trustee, and finished on paper pads left by King's attorneys."}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "scribbling in the margins of a newspaper"}
    - {title: "Leonard Greene, The Dominion Post: MLK's 'Letter From Birmingham Jail' resonates 60 years later (2023)", url: "https://www.dominionpost.com/?p=286645", quote: "wrote the original manuscript in the margins of a newspaper, on pieces of toilet paper on small scraps of paper smuggled from the jail by King's lawyers"}
- card: letter-from-birmingham-jail
  fact: "His lawyers carried the pages out"
  sources:
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "He gave bits and pieces of the letter to his lawyers to take back to movement headquarters"}
    - {title: "Leonard Greene, The Dominion Post: MLK's 'Letter From Birmingham Jail' resonates 60 years later (2023)", url: "https://www.dominionpost.com/?p=286645", quote: "smuggled from the jail by King's lawyers"}
- card: letter-from-birmingham-jail
  fact: "The letter is dated 16 April 1963"
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "April 16, 1963"}
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "The men settled on a final version on April 16, 1963."}
- card: letter-from-birmingham-jail
  fact: "It contains the line \"This 'Wait' has almost always meant 'Never.'\""
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "This 'Wait' has almost always meant 'Ne"}
    - {title: "Leonard Greene, The Dominion Post: MLK's 'Letter From Birmingham Jail' resonates 60 years later (2023)", url: "https://www.dominionpost.com/?p=286645", quote: "s meant 'Never.'"}
- card: letter-from-birmingham-jail
  fact: "King was released after eight days"
  sources:
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "Early in his eight-day imprisonment"}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "After eight days behind bars, King is released."}
- card: letter-from-birmingham-jail
  fact: "Within weeks it circulated as a pamphlet and in newspapers and magazines"
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "it was published in a variety of formats: as a pamphlet distributed by the American Friends Service Committee and as an article in periodicals such as Christian Century , Christianity and Crisis , the New York Post , and Ebony magazine"}
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "first appeared in the national press on May 19, 1963, and was soon printed and reprinted throughout the United States"}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "Excerpts appear in religious journals, in magazines"}
- card: letter-from-birmingham-jail
  fact: "In 1964 it went into Why We Can't Wait"
  sources:
    - {title: "Martin Luther King, Jr. Research and Education Institute, Stanford: Letter from Birmingham Jail", url: "https://kinginstitute.stanford.edu/letter-birmingham-jail", quote: "One year later, King revised the letter and presented it as a chapter in his 1964 memoir of the Birmingham Campaign, Why We Can't Wait"}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "finally in King's book Why We Can't Wait"}
- card: letter-from-birmingham-jail
  fact: "It is counted as the most important written document of the movement, widely anthologised"
  sources:
    - {title: "S. Jonathan Bass, Encyclopedia of Alabama: Letter from Birmingham Jail", url: "https://encyclopediaofalabama.org/article/letter-from-birmingham-jail/", quote: "is the most important written document of the civil rights era ... It now appears in hundreds of anthologies"}
    - {title: "Leonard Greene, The Dominion Post: MLK's 'Letter From Birmingham Jail' resonates 60 years later (2023)", url: "https://www.dominionpost.com/?p=286645", quote: "penned the most important written statement of the civil rights movement"}
    - {title: "American Heritage 67:1: I Am in Birmingham Because Injustice is Here", url: "https://americanheritage.com/node/133442", quote: "the letter has been anthologized, studied, enshrined"}
- card: rtlm
  fact: "RTLM went on air in Kigali in August 1993"
  sources:
    - {title: "Alison Des Forges, Human Rights Watch: Leave None to Tell the Story (1999)", url: "https://www.hrw.org/reports/1999/rwanda/Geno1-3-10.htm", quote: "incorporated it as Radio Télévision Libre des Mille Collines (RTLM) in April 1993, and began broadcasting in August 1993"}
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "t was established in 1993"}
- card: rtlm
  fact: "Rwanda was at war with the Tutsi-led RPF; RTLM was set up by Hutu hard-liners opposed to Habyarimana's peace talks"
  sources:
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "opposed peace talks between the government of President Juvenal Habyarimana and the Tutsi-led rebels of the Rwandan Patriotic Front"}
    - {title: "Alison Des Forges, Human Rights Watch: Leave None to Tell the Story (1999)", url: "https://www.hrw.org/reports/1999/rwanda/Geno1-3-10.htm", quote: "Hutu hard-liners decided to create their own station"}
- card: rtlm
  fact: "It won listeners quickly with popular music and an informal, joking style"
  sources:
    - {title: "Alison Des Forges, Human Rights Watch: Leave None to Tell the Story (1999)", url: "https://www.hrw.org/reports/1999/rwanda/Geno1-3-10.htm", quote: "the station won an audience rapidly because of its lively music and informal style"}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "By combining popular music, talk shows, and news broadcasts, RTLM effectively disseminated hate speech to a broad audience"}
    - {title: "Allan Thompson (ed.), The Media and the Rwanda Genocide (IDRC, 2007)", url: "https://media-diversity.org/additional-files/documents/c-books/The%20Media%20and%20the%20Rwanda%20Genocide%20%5BEN%5D.doc", quote: "It aired the latest music, especially popular Congolese songs, while Radio Rwanda was still broadcasting old standard tunes."}
- card: rtlm
  fact: "It called Tutsi by the name of an insect"
  sources:
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "exterminate the cockroaches"}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "portraying them as \"cockroaches\" and enemies of the state"}
- card: rtlm
  fact: "After Habyarimana's plane was shot down in April 1994 RTLM became an instrument of genocide, reading lists of people to kill and telling killers where victims hid"
  sources:
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "During the genocide that followed it broadcast lists of people to be killed and instructed killers on where to find them."}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "This included broadcasting names, addresses, and even vehicle registration numbers of Tutsis, effectively providing hit lists for the perpetrators."}
- card: rtlm
  fact: "About 800,000 people, mostly Tutsi, were killed in about 100 days"
  sources:
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "About 800,000 people died in Rwanda's 100-day genocide in 1994"}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "Within a span of approximately 100 days, approximately 800,000 people, prominently the Tutsi, were systematically murdered."}
- card: rtlm
  fact: "On 3 December 2003 the ICTR in Arusha convicted Nahimana and Barayagwiza, with Kangura's Hassan Ngeze, of genocide and incitement"
  sources:
    - {title: "Allan Thompson (ed.), The Media and the Rwanda Genocide (IDRC, 2007)", url: "https://media-diversity.org/additional-files/documents/c-books/The%20Media%20and%20the%20Rwanda%20Genocide%20%5BEN%5D.doc", quote: "Part Three explores the 3 December 2003 guilty verdict in the so-called 'Media Trial' before the ICTR. The tribunal convicted Ferdinand Nahimana, Jean-Bosco Barayagwiza and Hassan Ngeze of genocide, direct and public incitement to commit g"}
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "during the trial of the radio's top executives Jean-Bosco Barayagwiza and Ferdinand Nahimana"}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "Prosecutor v Ferdinand Nahimana, Jean-Bosco Barayagwisa and Hassan Ngeze (Judgment) ICTR-99-52-T (3 December 2003)"}
    - {title: "UN IRMCT: Nahimana et al. (Media case), ICTR-99-52", url: "https://unictr.irmct.org/en/cases/ictr-99-52", quote: "Nahimana et al. (Media case) (ICTR-99-52)"}
- card: rtlm
  fact: "Ngeze ran the extremist paper Kangura"
  sources:
    - {title: "BBC News: Rwanda's 'hate media' (2003)", url: "http://news.bbc.co.uk/2/hi/africa/3257748.stm", quote: "Hassan Ngeze, who ran an extremist magazine called Kangura"}
    - {title: "Allan Thompson (ed.), The Media and the Rwanda Genocide (IDRC, 2007)", url: "https://media-diversity.org/additional-files/documents/c-books/The%20Media%20and%20the%20Rwanda%20Genocide%20%5BEN%5D.doc", quote: "the virulent writings of Kangura"}
- card: rtlm
  fact: "The judges said no international court had addressed the media's role since Nuremberg; the first media case since Nuremberg"
  sources:
    - {title: "Allan Thompson (ed.), The Media and the Rwanda Genocide (IDRC, 2007)", url: "https://media-diversity.org/additional-files/documents/c-books/The%20Media%20and%20the%20Rwanda%20Genocide%20%5BEN%5D.doc", quote: "This case raises important principles concerning the role of the media, which have not been addressed at the level of international criminal justice since Nuremberg."}
    - {title: "Allan Thompson (ed.), The Media and the Rwanda Genocide (IDRC, 2007)", url: "https://media-diversity.org/additional-files/documents/c-books/The%20Media%20and%20the%20Rwanda%20Genocide%20%5BEN%5D.doc", quote: "The Media Trial marked the first time since Nuremberg that hate speech had been prosecuted internationally as a war crime."}
    - {title: "Rawnak Miraj Ul Azam, Contemporary Challenges 6 (2025): The Role of Hate Speech in Inciting Genocide: RTLM", url: "https://journals.ed.ac.uk/ccj/article/download/10257/14565/42323", quote: "ICTR judgments, notably the \"Media Case,\" established legal precedent"}
- card: killer-of-sheep
  fact: "Charles Burnett made it while a student at UCLA film school"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "which was his masters thesis project while matriculating at"}
    - {title: "Howie Movshovitz, NPR: Long-Lost Classic 'Killer of Sheep' Hits Theaters (2007)", url: "https://www.npr.org/transcripts/9213673", quote: "When Burnett began work on \"Killer of Sheep,\" he was a student at the UCLA film school"}
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "the Film & Television Archive at UCLA, where Burnett went to film school in the 1960s"}
- card: killer-of-sheep
  fact: "Shot in black and white on 16mm over spare weekends from the early 1970s, finished 1977"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "Starting in the early 1970s and completing the picture in 1977, Burnett shot the bulk of the film over several weekends"}
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "Its extended 16mm production (completed piecemeal on spare weekends beginning in 1972)"}
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "Burnett made Killer of Sheep in 16mm"}
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "Sound Black and White"}
- card: killer-of-sheep
  fact: "Set in Watts, South Los Angeles"
  sources:
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "Set in the Watts section of Los Angeles"}
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "captivating vision of Watts in post-manufacturing decline"}
- card: killer-of-sheep
  fact: "Stan works in a slaughterhouse that wears him down"
  sources:
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "Every day he goes to work in the slaughterhouse where he's employed, slogging through a depressing daily routine"}
    - {title: "Milestone Films: Killer of Sheep", url: "https://milestonefilms.com/products/killer-of-sheep", quote: "Stan, employed at a slaughterhouse, is suffering from the emotional side effects of his bloody occupation"}
- card: killer-of-sheep
  fact: "Stan and his wife slow-dance to Dinah Washington's This Bitter Earth"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "playing over the scene in which Stan and his wife dance ... Burnett used Dinah Washington's rendition of \"This Bitter Earth\" instead"}
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "Stan and his wife slow-dancing in their living room"}
- card: killer-of-sheep
  fact: "Its soundtrack of Black music had uncleared rights because Burnett never intended a theatrical release"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "since Burnett had never intended his student film to be released theatrically, he had not secured the necessary music rights"}
    - {title: "Howie Movshovitz, NPR: Long-Lost Classic 'Killer of Sheep' Hits Theaters (2007)", url: "https://www.npr.org/transcripts/9213673", quote: "It's that music that kept \"Killer of Sheep\" off movie screens for 30 years."}
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "a highly evocative soundtrack of African American music"}
- card: killer-of-sheep
  fact: "Critics' prize at Berlin, 1981"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "Killer of Sheep won the 1981 Critics' Award at the Berlin International Film Festival"}
    - {title: "Milestone Films: Killer of Sheep", url: "https://milestonefilms.com/products/killer-of-sheep", quote: "Winner of the Critic's Prize, Berlin International Film Festival, 1981"}
- card: killer-of-sheep
  fact: "Entered the National Film Registry in 1990"
  sources:
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "In 1990, the Library of Congress selected it as one of the first fifty culturally significant films to be preserved by the National Film Registry"}
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "acceptance into the National Film Registry in 1990"}
    - {title: "Milestone Films: Killer of Sheep", url: "https://milestonefilms.com/products/killer-of-sheep", quote: "Chosen for the National Film Registry of the Library of Congress, 1990"}
- card: killer-of-sheep
  fact: "UCLA restored it in 2000"
  sources:
    - {title: "Doug Cummings, UCLA Film & Television Archive: Killer of Sheep", url: "https://www.cinema.ucla.edu/la-rebellion/films/killer-sheep", quote: "it was restored in 35mm in 2000 by the UCLA Film & Television Archive"}
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "In 2000, the UCLA Film & Television Archive received a grant from the Sundance Institute to restore eight films, including Killer of Sheep."}
- card: killer-of-sheep
  fact: "Milestone Films spent years clearing the music, with a gift from Steven Soderbergh"
  sources:
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "Milestone Films waged a six-year battle to clear those pesky music rights"}
    - {title: "Howie Movshovitz, NPR: Long-Lost Classic 'Killer of Sheep' Hits Theaters (2007)", url: "https://www.npr.org/transcripts/9213673", quote: "Enter filmmaker Steven Soderbergh. ... offered a substantial gift towards paying for the music rights."}
    - {title: "AFI Catalog: Killer of Sheep (1978)", url: "https://catalog.afi.com/Catalog/moviedetails/67305", quote: "until director Steven Soderbergh donated $75,000 to complete the project"}
- card: killer-of-sheep
  fact: "It reached cinemas in 2007, three decades late"
  sources:
    - {title: "David Sterritt, Turner Classic Movies: Killer of Sheep", url: "https://www.tcm.com/articles/184975/killer-of-sheep", quote: "The movie reached theaters in 2007, three decades after it was made"}
    - {title: "Howie Movshovitz, NPR: Long-Lost Classic 'Killer of Sheep' Hits Theaters (2007)", url: "https://www.npr.org/transcripts/9213673", quote: "Long-Lost Classic 'Killer of Sheep' Hits Theaters March 29, 2007"}
- card: roots-1977
  fact: "Roots was a miniseries based on Alex Haley's 1976 book about his family"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "Based on Alex Haley's best-selling novel about his African ancestors"}
    - {title: "Jessie Kratz, National Archives: The \"Roots\" of Genealogy at the National Archives (2019)", url: "https://prologue.blogs.archives.gov/2019/02/22/the-roots-of-genealogy-at-the-national-archives/", quote: "he published the book Roots: The Saga of an American Family in 1976"}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "Released in the fall of 1976"}
- card: roots-1977
  fact: "Haley spent years in archives tracing his ancestry to Kunta Kinte, captured in Gambia"
  sources:
    - {title: "Jessie Kratz, National Archives: The \"Roots\" of Genealogy at the National Archives (2019)", url: "https://prologue.blogs.archives.gov/2019/02/22/the-roots-of-genealogy-at-the-national-archives/", quote: "In 1964, writer and historian Alex Haley visited the National Archives to research his family history."}
    - {title: "Jessie Kratz, National Archives: The \"Roots\" of Genealogy at the National Archives (2019)", url: "https://prologue.blogs.archives.gov/2019/02/22/the-roots-of-genealogy-at-the-national-archives/", quote: "Kunta Kinte, who was captured in Gambia and brought to America to be sold into slavery"}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "Haley pieced together historical records to connect his lineage"}
- card: roots-1977
  fact: "The story followed his descendants to emancipation"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "In the final episode, Kunta Kinte's great-grandson Tom (Georg Stanford Brown) joined the Union Army and gained emancipation."}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "the post-emancipation hostilities"}
- card: roots-1977
  fact: "LeVar Burton played the young Kunta"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "Kunta Kinte (as a boy)............................... LeVar Burton"}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "newcomer LeVar Burton, still a teenager when he was cast as young Kunta Kinte"}
- card: roots-1977
  fact: "ABC feared a ratings disaster and ran it on consecutive nights to limit losses"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "ABC executives initially feared that the historical saga about slavery would be a ratings disaster."}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "the network also scheduled the miniseries to air on consecutive nights instead of in weekly installments, hoping to minimize its financial risk"}
- card: roots-1977
  fact: "Eight consecutive nights, 23-30 January 1977"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "The twelve-hour mini-series aired on ABC from 23-30 January 1977. For eight consecutive nights it riveted the country."}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "When the series premiered on Sunday, January 23, 1977"}
- card: roots-1977
  fact: "The audience grew; about 100 million watched the finale, one of the most-watched broadcasts ever"
  sources:
    - {title: "J. B. Bird, Museum of Broadcast Communications, Encyclopedia of Television: Roots", url: "https://web.archive.org/web/2016/http://www.museum.tv/eotv/roots.htm", quote: "100 million viewers, almost half the country, saw the final episode, which still claims one of the highest Nielsen ratings ever recorded"}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "The January 30 finale captivated more than 100 million Americans ... It remains the third-most-watched single episode of all time"}
