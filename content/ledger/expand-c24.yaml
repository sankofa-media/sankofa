    - {title: "Geoffrey Jacques, JSTOR Daily: A New Civil Rights Movement, a New Journal (2021)", url: "https://daily.jstor.org/a-new-civil-rights-movement-a-new-journal/", quote: "She was its main organizer"}
- card: freedomways
  fact: "Contributors included Baldwin, Hansberry, Walker, Robeson, Du Bois and Elizabeth Catlett"
  sources:
    - {title: "Tamiment Library, NYU: Guide to the James and Esther Cooper Jackson Papers (TAM.347)", url: "https://findingaids.library.nyu.edu/tamwag/tam_347/", quote: "including writers James Baldwin, Alice Walker, Paul Robeson, Nikki Giovanni, Lorraine Hansberry, and visual artists Jacob Lawrence, Romare Bearden, and Elizabeth Catlett"}
    - {title: "Herb Boyd, IBW21: Esther Cooper Jackson, a phenomenal editor and freedom fighter (2022)", url: "https://ibw21.org/?p=75878", quote: "James Baldwin, Paul Robeson, Alice Walker, W.E.B. Du Bois, Lorraine Hansberry"}
    - {title: "Geoffrey Jacques, JSTOR Daily: A New Civil Rights Movement, a New Journal (2021)", url: "https://daily.jstor.org/a-new-civil-rights-movement-a-new-journal/", quote: "Alice Walker published some of her earliest poems and stories in the journal"}
