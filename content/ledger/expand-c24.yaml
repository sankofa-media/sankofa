  fact: "Several founders had been jailed, indicted or harassed in the early Cold War"
  sources:
    - {title: "Geoffrey Jacques, JSTOR Daily: A New Civil Rights Movement, a New Journal (2021)", url: "https://daily.jstor.org/a-new-civil-rights-movement-a-new-journal/", quote: "Among the top Communists tried and jailed by the federal government"}
    - {title: "Tamiment Library, NYU: Guide to the James and Esther Cooper Jackson Papers (TAM.347)", url: "https://findingaids.library.nyu.edu/tamwag/tam_347/", quote: "Documents related to the Smith Act indictments of James and other communists"}
