- card: roots-1977
  fact: "Americans of every background went looking for ancestors; demand at the National Archives soared"
  sources:
    - {title: "Jessie Kratz, National Archives: The \"Roots\" of Genealogy at the National Archives (2019)", url: "https://prologue.blogs.archives.gov/2019/02/22/the-roots-of-genealogy-at-the-national-archives/", quote: "The increased interest resulted in an unprecedented demand for our resources."}
    - {title: "Barbara Maranzani, History.com: Remembering Roots", url: "https://www.history.com/articles/remembering-roots", quote: "Libraries across the country noted a significant uptick in visitors from all racial and ethnic backgrounds, and inquiries about genealogical records at the National Archives increased by a staggering 300 percent."}
