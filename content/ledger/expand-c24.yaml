    - {title: "Basic Books / Hachette: Freedomways Reader", url: "https://www.hachettebookgroup.com/titles/esther-cooper-jackson/freedomways-reader/9780813364520/", quote: "As managing editor, Esther Cooper Jackson shepherded the magazine for twenty-five years"}
    - {title: "Tamiment Library, NYU: Guide to the James and Esther Cooper Jackson Papers (TAM.347)", url: "https://findingaids.library.nyu.edu/tamwag/tam_347/", quote: "served as its editor from 1961 to 1985"}
