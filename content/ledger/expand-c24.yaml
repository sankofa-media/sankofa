    - {title: "Geoffrey Jacques, JSTOR Daily: A New Civil Rights Movement, a New Journal (2021)", url: "https://daily.jstor.org/a-new-civil-rights-movement-a-new-journal/", quote: "who had been a leader of the SNYC"}
    - {title: "Tamiment Library, NYU: Guide to the James and Esther Cooper Jackson Papers (TAM.347)", url: "https://findingaids.library.nyu.edu/tamwag/tam_347/", quote: "Esther served as Executive Secretary of the Southern Negro Congress"}
