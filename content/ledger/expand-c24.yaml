    - {title: "Tamiment Library, NYU: Guide to the James and Esther Cooper Jackson Papers (TAM.347)", url: "https://findingaids.library.nyu.edu/tamwag/tam_347/", quote: "Documents related to the Smith Act indictments of James and other communists"}
