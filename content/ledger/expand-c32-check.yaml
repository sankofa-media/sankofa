- card: mexico-1968-salute
  fact: "Smith ran 19.83, a world record"
  verdict: corrected
  sources:
    - {title: "Encyclopaedia Britannica: Tommie Smith", url: "https://www.britannica.com/biography/Tommie-Smith", quote: "he won the 200-meter dash in 19.83 seconds—the first time that the distance was run in less than 20 seconds"}
    - {title: "Athletics Australia Hall of Fame: Peter Norman (Paul Jenes)", url: "https://www.athletics.com.au/hall-of-fame/peter-norman/", quote: "behind Smith’s world record of 19.83"}
  note: "Athletics Australia: \"world record of 19.83\"; Britannica: first 200 m under 20 s, which entails a world best. The clause \"first 200 m under 20 seconds\" rested on Britannica alone and was removed from the card."
