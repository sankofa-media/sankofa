- card: mexico-1968-salute
  fact: "Norman's 20.06 stood as the Australian national record for 56 years, until 2024"
  verdict: corrected
  sources:
    - {title: "Athletics Australia: Brisbane teen Gout Gout breaks Australia's longest standing athletics record (2024)", url: "https://www.athletics.com.au/news/brisbane-teen-gout-gout-breaks-australias-longest-record-/", quote: "eclipsing the time of 20.06 set by Norman at the 1968 Mexico City Olympics – a record that has stood unchallenged for 56 years"}
    - {title: "World Athletics: Gout breaks Australian 200m record (7 December 2024)", url: "https://worldathletics.org/news/report/gout-australia-oceania-200m-record-bolt-world-age-16-best", quote: "Not only did he break Peter Norman's Oceanian record (20.06) that had stood since 1968"}
  note: "Refuted as written: the card said Norman's 20.06 \"still stands\"; Gout Gout ran 20.04 (+1.5) at the Australian All Schools in Brisbane on 7 December 2024. Card now says the record stood 56 years, until 2024. The old AOC/AA Hall of Fame pages are out of date."
