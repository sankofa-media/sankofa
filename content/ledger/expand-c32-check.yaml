# Second, independent fact-check of batch c32 (2026-11-14). Every ledger URL was downloaded (Britannica, NYT and JusticeInfo
# via web.archive.org snapshots) and every quote searched for in the page text: all occur verbatim except the
# Hobson v. Hansen quote (replaced) and one NYT spacing variant. Verdicts judge whether the page supports the fact
# exactly and whether the two sources are independent. Two pages by one author (Taylor, UMSL) count as one source.
entries:
- card: sharpeville-1960
  fact: "Sharpeville is a Black township in South Africa"
  verdict: confirmed
  sources:
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "incident in the Black township of Sharpeville"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "a protest in the Black township of Sharpeville"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "Pass laws forced Black South Africans to carry identity documents at all times, which police could check"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Pass laws and the Sharpeville massacre", url: "https://www.sahistory.org.za/article/pass-laws-and-sharpeville-massacre", quote: "Pass laws required that Africans had to carry identity documents with them at all times."}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "These laws forced Black South Africans to carry special identification that police and other authorities could check at any time."}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "The Pan Africanist Congress was a recent breakaway from the ANC"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "a breakaway group from the ANC, the Pan Africanist Congress (PAC) held its first conference"}
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "The Pan-Africanist Congress (PAC), a splinter group of the African National Congress (ANC) created in 1959"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "The PAC called on people to leave passes at home on 21 March and offer themselves for arrest at police stations"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "The PAC called on its supporters to leave their passes at home on the appointed date and gather at police stations around the country, making themselves available for arrest."}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "The plan was for protestors to march to the local police station without their passes and ask to be arrested"}
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "organized a countrywide demonstration for March 21, 1960, for the abolition of South Africa’s pass laws"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "Thousands marched to the Sharpeville police station singing freedom songs and calling 'Down with passes'"
  verdict: confirmed
  sources:
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "On March 21, thousands of South Africans marched to the Sharpeville police station."}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "They chanted freedom songs and shouted, \"Down with passes!\""}
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "chanting freedom songs and calling out the campaign slogans \" Izwe lethu \" (Our land); \" Awaphele amapasti \" (Down with passes)"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "Armoured cars stood outside the police station"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "a heavy contingent of policemen were lined up outside, many on top of British-made Saracen armored cars"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "more and more police began to appear, along with increasing numbers of armoured vehicles"}
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "began stoning police officers and their armoured cars"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "The police opened fire without warning"
  verdict: confirmed
  sources:
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "Then, without warning, the police opened fire on the unarmed crowd."}
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "Eyewitness accounts attest to the fact that the people were given no warning to disperse."}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "69 people were killed and more than 180 wounded"
  verdict: confirmed
  sources:
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "About 69 Blacks were killed and more than 180 wounded"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "In total, 69 people were killed and more than 180 people were injured"}
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "leaving 69 people dead and, according to the official inquest, 180 people seriously wounded"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "Most were shot in the back as they fled"
  verdict: confirmed
  sources:
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "mostly shot in the back as they fled the violence"}
    - {title: "South African History Online: Sharpeville Massacre, 21 March 1960", url: "https://www.sahistory.org.za/article/sharpeville-massacre-21-march-1960", quote: "large number of people were shot in the back as they were fleeing the scene"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "The government declared a state of emergency"
  verdict: confirmed
  sources:
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "A state of emergency was declared in South Africa"}
    - {title: "South African History Online: Aftermath, Sharpeville Massacre 1960", url: "https://www.sahistory.org.za/article/aftermath-sharpeville-massacre-1960", quote: "the government responded by declaring a state of emergency and banning all public meetings"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "First, the government declared a state of emergency"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "On 8 April 1960 the ANC and the PAC were banned"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Aftermath, Sharpeville Massacre 1960", url: "https://www.sahistory.org.za/article/aftermath-sharpeville-massacre-1960", quote: "the ANC and the PAC were banned under the Unlawful Organisations Act of 8 April 1960"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "Then, on April 8, 1960, both the ANC and PAC were banned"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "Both went underground and formed armed wings"
  verdict: confirmed
  sources:
    - {title: "South African History Online: Aftermath, Sharpeville Massacre 1960", url: "https://www.sahistory.org.za/article/aftermath-sharpeville-massacre-1960", quote: "The ANC and PAC were forced underground, and both parties launched military wings of their organisations in 1961."}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "Both the PAC and the ANC formed armed wings and began a military struggle against the government."}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "On 1 April 1960 the UN Security Council condemned the killings"
  verdict: confirmed
  sources:
    - {title: "UN Security Council resolution 134 (1960), resolution of 1 April 1960 (S/4300)", url: "https://documents.un.org/api/symbol/access?s=S/RES/134(1960)&l=en&t=pdf", quote: "134 (1960). Resolution of 1 April 1960 ... Deplores that the recent disturbances in the Union of South Africa should have led to the loss of life of so many Africans"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "On April 1, the United Nations (UN) Security Council passed a resolution condemning the killings"}
    - {title: "South African History Online: Aftermath, Sharpeville Massacre 1960", url: "https://www.sahistory.org.za/article/aftermath-sharpeville-massacre-1960", quote: "The United Nations Security Council and governments worldwide condemned the police action"}
  note: "Date confirmed in the primary record: UNSC resolution 134 (1960), resolution of 1 April 1960, which \"deplores\" the loss of life and calls on South Africa to abandon apartheid; CMHR gives the same date. SAHO gives no date."
- card: sharpeville-1960
  fact: "The UN made 21 March the International Day for the Elimination of Racial Discrimination, commemorating Sharpeville"
  verdict: confirmed
  sources:
    - {title: "United Nations: International Day for the Elimination of Racial Discrimination", url: "https://www.un.org/en/observances/end-racism-day", quote: "The International Day for the Elimination of Racial Discrimination, observed annually on 21 March, commemorates the Sharpeville Massacre in 1960"}
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "the UN declared March 21 to be the International Day for the Elimination of Racial Discrimination"}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "In 1996 Nelson Mandela signed South Africa's new constitution into law at Sharpeville"
  verdict: confirmed
  sources:
    - {title: "Encyclopaedia Britannica: Sharpeville massacre", url: "https://www.britannica.com/event/Sharpeville-massacre", quote: "Nelson Mandela chose Sharpeville as the site at which, on December 10, 1996, he signed into law the country’s new constitution"}
    - {title: "UN Press SG/SM/6127: Signing of South Africa's new constitution (10 December 1996)", url: "https://press.un.org/en/1996/19961210.sgsm6127.html", quote: "It is fitting that such an important document was signed at a location where, in March 1960, 69 unarmed demonstrators were killed by the police of the apartheid regime."}
  note: "Quotes found verbatim on the opened pages; sources independent."
- card: sharpeville-1960
  fact: "21 March is now Human Rights Day in South Africa"
  verdict: confirmed
  sources:
    - {title: "Canadian Museum for Human Rights: The Sharpeville Massacre", url: "https://humanrights.ca/story/sharpeville-massacre", quote: "In South Africa, March 21 is now known as Human Rights Day."}
    - {title: "Government of South Africa: Public holidays", url: "https://www.gov.za/about-sa/public-holidays", quote: "21 March: Human Rights Day"}
  note: "Quotes found verbatim on the opened pages; sources independent."
