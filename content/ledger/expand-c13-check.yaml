# Second, independent fact-check of batch c13 (2026-11-14). Every source below was re-opened by the checker;
# quotes are verbatim from the fetched pages ('...' marks an elision, [..] an editorial insertion).
# Världskulturmuseerna's Badin page states it was sourced from Swedish Wikipedia and is not counted as an independent source.
entries:
  - card: dido-belle
    fact: "Born in 1761"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "Dido Elizabeth Belle (1761–1804) was raised as part of an aristocratic family"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "was born around the month of June in 1761"}
  - card: dido-belle
    fact: "Father John Lindsay, naval officer, Mansfield nephew"
    verdict: confirmed
    sources:
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "Lindsay was the nephew of the First Earl of Mansfield"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "Her father, John Lindsay, was a young British naval officer and nephew of Lord Mansfield"}
  - card: dido-belle
    fact: "Mother Maria Belle, enslaved"
    verdict: confirmed
    sources:
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "her mother, whose name is believed to be Maria Bell, was a slave in the West Indies"}
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "paid by Maria Belle a Negro Woman Slave about twenty eight years of age"}
  - card: dido-belle
    fact: "Mansfield, Lord Chief Justice, at Kenwood; \"then just outside London\""
    verdict: corrected
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "Dido spent much of her life at Kenwood House on Hampstead Heath in north London. She lived there with her great-uncle William Murray, 1st Earl of Mansfield, the Lord Chief Justice"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "Lord Mansfield, was at the time the Lord Chief Justice of England and Wales"}
    note: "'then just outside London' rested on History Hit alone; body now says 'on Hampstead Heath in north London'."
  - card: dido-belle
    fact: "From about 1766 grew up at Kenwood with Lady Elizabeth Murray"
    verdict: corrected
    sources:
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "John Lindsay in 1766 requested that Belle be entrusted to his uncle, Lord Mansfield, who was already raising his young great-niece, Elizabeth Murray"}
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "Elizabeth was also brought up in the care of Lord Mansfield at Kenwood after her mother’s death in 1766"}
    note: "Fact stands; the writer's EH quote ('agreed to accommodate ... great-nieces') does not occur on the page and was replaced."
  - card: dido-belle
    fact: "Educated as a gentlewoman"
    verdict: confirmed
    sources:
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "Dido was well educated and treated as one of the family"}
      - {title: "Sarah Roller, History Hit: 10 Facts About Dido Belle (2021)", url: "https://www.historyhit.com/facts-about-dido-belle/", quote: "Elizabeth seems to have been raised as a gentlewoman, learning to read, write and entertain"}
  - card: dido-belle
    fact: "Ran Kenwood dairy and poultry yard"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "Dido also supervised Kenwood’s dairy and poultry yard"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "As an adult she managed the estate’s dairy and poultry yards"}
  - card: dido-belle
    fact: "Helped great-uncle with letters"
    verdict: confirmed
    sources:
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "helped Lord Mansfield with his correspondence"}
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "she also sometimes acted as secretary to her great-uncle, the Earl"}
  - card: dido-belle
    fact: "Somerset case 1772 ruling"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "In the most significant of these, the case of James Somerset (1772), Lord Mansfield ruled that slavers could not forcibly send any slaves in England out of the country"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "the Sommersett Case in 1772 where he ruled that English law did not sanction slavery in Great Britain"}
  - card: dido-belle
    fact: "1783 Mansfield presided over Zong case"
    verdict: corrected
    sources:
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "the Zong Massacre Case (1783) where he ruled in favor of insurers"}
      - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "on 22 May 1783, Lord Mansfield and Justices Wills and Buller agreed with the underwriters and decided that there should be a new trial"}
    note: "History Hit replaced by Understanding Slavery Initiative (History Hit wrongly says he ruled for the enslaved in both cases)."
  - card: dido-belle
    fact: "Late-1770s double portrait (c.1776 / 1778 / 1779)"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "at Kenwood in about 1776"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "the 1779 painting of her alongside her cousin, Lady Elizabeth Murray"}
    note: "Dating disagreement kept in dispute."
  - card: dido-belle
    fact: "Mansfield died 1793"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "When he died in 1793, Lord Mansfield left her an annuity"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "upon the death of Lord Mansfield in 1793"}
  - card: dido-belle
    fact: "Will confirmed her freedom"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "in his will of 1782 he made sure to protect his niece’s rights, stating that Dido was a free woman"}
      - {title: "Sarah Roller, History Hit: 10 Facts About Dido Belle (2021)", url: "https://www.historyhit.com/facts-about-dido-belle/", quote: "Lord Mansfield made a specific provision to ‘free’ Dido in his will"}
  - card: dido-belle
    fact: "£500 and £100 annuity"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "left her an annuity of £100 and a lump sum of £500"}
      - {title: "Sarah Roller, History Hit: 10 Facts About Dido Belle (2021)", url: "https://www.historyhit.com/facts-about-dido-belle/", quote: "He also bequeathed her a lump sum of £500, as well as an annuity of £100"}
  - card: dido-belle
    fact: "Married John Davinier, Frenchman, 1793"
    verdict: confirmed
    sources:
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "On December 5, 1793 she married John Davinier, a French gentleman’s steward"}
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "Later that year Dido married a steward (a senior servant) named John Davinier, originally from France"}
  - card: dido-belle
    fact: "Three sons"
    verdict: corrected
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "the couple went on to have three sons – twin boys, Charles and John, baptised in 1795, and then another son, William Thomas, baptised in 1800"}
      - {title: "Ayodale Braimah, BlackPast: Dido Elizabeth Belle (1761-1804)", url: "https://www.blackpast.org/global-african-history/belle-dido-elizabeth-1761-1804/", quote: "The couple had three children, twins Charles and John, baptized in 1795, and William Thomas"}
    note: "Fact stands; writer's EH quote was a paraphrase, replaced with the verbatim text."
  - card: dido-belle
    fact: "Died 1804 aged 43"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "until Dido’s death in 1804 at the age of 43"}
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "She died aged only 43 in 1804"}
  - card: dido-belle
    fact: "Long credited to Zoffany, now attributed to David Martin"
    verdict: corrected
    sources:
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "it was discovered to be by the young Scot, David Martin"}
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "The artist, David Martin, seems to portray a moment caught"}
    note: "Zoffany attribution found only on Scone Palace; removed. Body now: 'now attributed to the Scottish painter David Martin'."
  - card: dido-belle
    fact: "Original at Scone Palace"
    verdict: confirmed
    sources:
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "the original can be seen at Scone Palace"}
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "Now father and daughter are re-united on the walls of the Ambassador’s Room"}
  - card: dido-belle
    fact: "One of first paintings showing a Black woman as equal of a white one"
    verdict: confirmed
    sources:
      - {title: "Scone Palace: Dido Elizabeth Belle", url: "https://www.scone-palace.co.uk/dido-belle", quote: "one of the first ever to represent a black woman as the social equal of a white one"}
      - {title: "English Heritage: Dido Belle (Kenwood)", url: "https://www.english-heritage.org.uk/visit/places/kenwood/history/dido-belle/", quote: "highly unusual in 18th-century British art for showing a mixed-race woman as the equal of her white companion"}
  - card: gustav-badin
    fact: "Born probably on Saint Croix c.1747-1750"
    verdict: corrected
    sources:
      - {title: "C. Forsstrand, Svenskt biografiskt lexikon vol. 2 (1920): Badin", url: "https://sok.riksarkivet.se/sbl/artikel/18973", quote: "f., antagligen 1747, på ön S:t Croix i Västindien"}
      - {title: "Nationalmuseum press release: Badin exhibition opening at Nationalmuseum on 19 February (2026)", url: "https://www.mynewsdesk.com/nationalmuseum/pressreleases/badin-exhibition-opening-at-nationalmuseum-on-19-february-3430407", quote: "Badin was probably born enslaved in 1747, seven years after Sergel, in what was then the Danish colony of St Croix"}
    note: "Body changed from 'about 1750' to 'around 1747' (SBL, SBH, Nationalmuseum, Kungahuset all give 1747). Världskulturmuseerna page says its information 'was sourced from Swedish Wikipedia', so it is not counted; replaced by independent sources."
