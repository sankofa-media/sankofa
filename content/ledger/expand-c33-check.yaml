  # --- phiona-mutesi
  - card: phiona-mutesi
    fact: "Katwe is the largest slum in Kampala"
    verdict: confirmed
    sources:
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "in Katwe, the largest of eight slums in Kampala, Uganda, and one of the worst places on earth"}
      - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Katwe, the biggest and possibly toughest slum in Uganda's capital city"}
  - card: phiona-mutesi
    fact: "Coach Robert Katende ran a children's chess programme where children got porridge"
    verdict: confirmed
    sources:
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "he began drawing kids from the slum with the promise of soccer and postgame porridge"}
      - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "he could go to the chess program to get a cup of porridge ... Mutesi's coach and mentor, Robert Katende"}
    note: "NPR is an interview with Mutesi and Katende, independent of Crothers's ESPN text, though it was occasioned by his book."
  - card: phiona-mutesi
    fact: "Her family had no food; she followed her brother, who went for porridge"
    verdict: corrected
    sources:
      - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "We didn't have food at home ... My brother knew about chess, and he could go to the chess program to get a cup of porridge."}
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "she secretly followed Brian out of their shack in hopes he might lead to the first meal of the day"}
    note: "Fact holds; the ledger's ESPN quote (curry powder) did not support it, replaced with the quote above."
  - card: phiona-mutesi
    fact: "She had never heard of chess; there is no word for it in Luganda"
    verdict: confirmed
    sources:
      - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Mutesi herself had never seen or heard of chess. There isn't even a word for it in her native language."}
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "a game so foreign that there's no word for it in Luganda, their native language. Chess."}
  - card: phiona-mutesi
    fact: "She was a natural and aggressive player"
    verdict: confirmed
    sources:
      - {title: "NPR: A Child of the Slums Becomes a Queen of Chess (31 Dec 2012)", url: "https://news.stlpublicradio.org/post/child-slums-becomes-queen-chess", quote: "Katende says she was a natural talent ... I notice that she's very aggressive"}
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "dominating them with her aggressive style"}
  - card: phiona-mutesi
    fact: "In 2010, as a teenager, she played for Uganda's women's team at the Olympiad in Khanty-Mansiysk, Siberia"
    verdict: confirmed
    sources:
      - {title: "Tim Crothers, ESPN The Magazine (10 Jan 2011; archived)", url: "http://web.archive.org/web/20261004045502/https://www.espn.com/espn/news/story?id=5965666", quote: "Phiona is 14, and her stone face gives no sign that the next day she will travel to Siberia ... the city of Khanty-Mansiysk"}
      - {title: "OlimpBase: Khanty-Mansiysk 2010 (women), Uganda", url: "https://olimpbase.org/2010w/2010uga.html", quote: "39th Chess Olympiad (women): Khanty-Mansiysk 2010 >> Uganda ... 2 Mutesi, Phiona"}
  - card: phiona-mutesi
    fact: "At Istanbul 2012 she scored 4.5/9"
    verdict: corrected
    sources:
      - {title: "OlimpBase: Istanbul 2012 (women), Uganda", url: "https://olimpbase.org/2012w/2012uga.html", quote: "4 Mutesi, Phiona 0 ½ 1 0 ½ 0 ½ 1 1 4½ 9 3 3 3 50.0"}
      - {title: "Phillip Corry, Kawowo Sports: Uganda gets first titled lady players (9 Sep 2012)", url: "https://kawowo.com/?p=21344", quote: "Mutesi and Amoko have each got 4.5 points out of 9 games played, which is a 50% score, the mandatory requirement"}
