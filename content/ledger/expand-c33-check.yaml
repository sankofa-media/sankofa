  # --- windrush-scandal
  - card: windrush-scandal
    fact: "Between 1948 and 1973 many Commonwealth citizens, mostly Caribbean, came to the UK: the Windrush generation"
    verdict: confirmed
    sources:
      - {title: "National Audit Office (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "Between 1948 and 1973 many Commonwealth citizens came to the UK ... particularly those from Caribbean nations, have recently become known as the Windrush generation"}
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "who came to the UK between 1948 and 1973, mostly from Caribbean countries. This group came to be known collectively as the Windrush generation"}
  - card: windrush-scandal
