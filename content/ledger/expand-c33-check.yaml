# Second, independent fact-check of batch c33 (2026-11-14). Every page below was fetched again by the checker; quotes are as found on the page.
# Verdicts: confirmed | corrected (card or ledger changed) | refuted | unconfirmed.

checks:
  # --- patricia-bath
  - card: patricia-bath
    fact: "Born in Harlem, New York, in 1942"
    verdict: confirmed
    sources:
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "Patricia Era Bath was born on November 4, 1942, in Harlem, New York City, to Rupert and Gladys Bath."}
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "Bath was born on November 4, 1942 in Harlem, New York"}
  - card: patricia-bath
    fact: "Her father, a Trinidad immigrant, was the first Black motorman on the New York subway"
    verdict: confirmed
    sources:
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "Her father, an immigrant from Trinidad, worked as the first Black motorman for the New York City subway system"}
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "Rupert Bath, a Trinidadian immigrant and the first black motorman in the New York City subway system"}
  - card: patricia-bath
    fact: "At Harlem Hospital about half the eye-clinic patients were visually impaired or blind, few at Columbia"
    verdict: corrected
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "At Harlem Hospital, where there were many African American patients, nearly half were blind or visually impaired. But at Columbia Eye Clinic, the blindness rate was markedly lower."}
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "the eye clinic of Harlem where half of the patients were visually impaired or blind and Columbia, where only a few patients suffered from blindness"}
    note: "Body was right; the wow line said 'nearly or fully blind', which overstates 'visually impaired or blind'. Wow changed in EN and RU to 'visually impaired or blind'."
  - card: patricia-bath
    fact: "Her study found blindness among Black Americans double the white rate, largely from lack of access to eye care"
    verdict: corrected
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "blindness among African Americans was nearly double the rate of blindness among whites. She concluded that this was largely due to many African Americans’ lack of access to ophthalmic care."}
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "blindness among blacks was double that among whites due to the lack of access of proper eye care in black communities"}
    note: "The card said 'among Black patients'; the sources speak of the population, not patients. Changed to 'Black Americans'."
  - card: patricia-bath
    fact: "She founded community ophthalmology, with trained volunteers screening at senior centres and day-care programmes"
    verdict: corrected
    sources:
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "community ophthalmology in which trained eye care volunteers visit senior centers and day care programs to test the vision"}
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "Bath coined the term “community ophthalmology,” ... These volunteers worked with both senior centers and daycare programs"}
    note: "EN confirmed. RU rendered senior centres as «дома престарелых» (nursing homes); changed to «центры для пожилых»."
  - card: patricia-bath
    fact: "Moved to Los Angeles in 1974; first woman faculty member at UCLA's Jules Stein Eye Institute in 1975"
    verdict: confirmed
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "Bath moved to Los Angeles that year ... In 1975, Bath became the first African American woman surgeon at the UCLA Medical Center and the first woman faculty member at the UCLA Jules Stein Eye Institute."}
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "In 1974, Bath moved to Los Angeles ... In 1975, she became the first woman faculty member at UCLA’s Jules Stein Eye Institute"}
  - card: patricia-bath
    fact: "In 1983 she became the first woman in the US to chair an ophthalmology residency programme"
    verdict: confirmed
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "In 1983, Bath was named chair of the Ophthalmology Residency Training Program ... Bath was the first woman in the country to hold such a position."}
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "In 1983, Bath became the first woman to chair an ophthalmology residency program in the United States"}
  - card: patricia-bath
    fact: "In 1981 she went to Berlin to study laser technology and began work on the probe"
    verdict: confirmed
    sources:
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "In 1981, Bath traveled to Berlin University to learn more about laser technology ... Over the next five years, she began developing a model for a laser instrument"}
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "In 1981, Bath studied laser technologies at the Laser Medical Center in West Berlin"}
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "In 1981, Bath conceived of the invention for which she has become famous – the Laserphaco Probe"}
  - card: patricia-bath
    fact: "The Laserphaco Probe enters through a tiny incision and uses a laser to break up the cataract, which is then removed"
    verdict: confirmed
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "uses a laser to vaporize cataracts via a tiny, 1-millimeter insertion into a patient’s eye"}
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "aser to break apart cataracts through a small incision. An ultrasonic tip further disintegrated the cataract fragments, which were then removed using suction."}
  - card: patricia-bath
    fact: "Patent granted 17 May 1988, the first to a Black woman physician for a medical invention"
    verdict: confirmed
    sources:
      - {title: "National Women's History Museum: Patricia Bath", url: "https://www.womenshistory.org/education-resources/biographies/patricia-bath", quote: "On May 17, 1988, Bath received U.S. Patent No. 4,744,360 for her invention of the Laserphaco Probe, becoming the first Black woman physician to receive a U.S. medical patent"}
      - {title: "BlackPast, Quin'Nita F. Cobbins-Modica: Patricia Bath (1942-2019)", url: "https://www.blackpast.org/african-american-history/bath-patricia-1942/", quote: "was the first African American woman physician to receive a patent for a medical invention ... On May 17, 1988, Bath received a patent for her invention, the Laserphaco Probe"}
      - {title: "Google Patents: US4744360A", url: "https://patents.google.com/patent/US4744360A/en", quote: "1988-05-17 Application granted ... Inventor Patricia E. Bath"}
  - card: patricia-bath
    fact: "She died in 2019"
    verdict: confirmed
    sources:
      - {title: "Lemelson-MIT Program: Patricia Bath", url: "https://lemelson.mit.edu/resources/patricia-bath", quote: "until she passed away on May 30, 2019, due to complications from cancer. She was 76 years old."}
      - {title: "UCLA Health: In memoriam, Dr. Patricia Bath, 76 (6 June 2019)", url: "https://www.uclahealth.org/news/release/in-memoriam-dr-patricia-bath-76-physician-and-inventor-who-helped-restore-or-improve-vision-for-millions", quote: "Dr. Patricia Bath, the first female faculty member in ophthalmology at the David Geffen School of Medicine at UCLA, has died of complications from cancer. She was 76."}

  # --- tamayo-mendez
  - card: tamayo-mendez
    fact: "Born in Guantánamo, Cuba, in 1942"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica: Arnaldo Tamayo Méndez (archived 2026-05-19)", url: "http://web.archive.org/web/20260519151659/https://www.britannica.com/biography/Arnaldo-Tamayo-Mendez", quote: "Arnaldo Tamayo Méndez (born Jan. 29, 1942, Guantánamo , Cuba) is a Cuban pilot and cosmonaut"}
      - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "Nació en la calle 5 Oeste # 1370, de la ciudad de Guantánamo"}
    note: "History Hit gives Baracoa, Guantánamo province; Britannica and EcuRed (street address in the city) agree on Guantánamo."
  - card: tamayo-mendez
    fact: "Orphaned as a small child and adopted"
    verdict: confirmed
    sources:
      - {title: "EcuRed: Arnaldo Tamayo Méndez (archived 2026-06-23)", url: "http://web.archive.org/web/20260623104644/http://www.ecured.cu/Arnaldo_Tamayo_M%C3%A9ndez", quote: "En edad muy temprana quedó huérfano de madre y padre"}
      - {title: "Gloria Maritza Gómez Revuelta, Black in space, BJHS 58 (2025)", url: "https://doi.org/10.1017/S000708742510109X", quote: "a heartfelt article about Tamayo’s adoptive parents, Rafael Tamayo and Esperanza Méndez"}
      - {title: "Spacefacts: Arnaldo Tamayo Méndez", url: "https://www.spacefacts.de/bios/international/english/tamayo-mendez_arnaldo.htm", quote: "Was adopted when he was 1 year old"}
