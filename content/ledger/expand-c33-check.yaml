    verdict: confirmed
    sources:
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "confirmed that the Windrush generation had, and have, the right of abode in the UK. But they were not given any documents to demonstrate this status. Nor were records kept."}
      - {title: "National Audit Office (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "the Immigration Act 1971, which came into force in 1973. At this time, Commonwealth immigrants already settled in the UK were given indefinite leave to remain, but many were not issued with any documentation, and the Home Office (th"}
  - card: windrush-scandal
    fact: "Many children travelled on their parents' passports"
    verdict: confirmed
    sources:
      - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "many who arrived in the 1950s and 1960s had travelled on their parents’ passports"}
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "Some couldn’t establish their right to live in the UK because they’d arrived on their parents’ passports, which were lost or discarded later."}
  - card: windrush-scandal
    fact: "In 2012 Theresa May introduced a 'hostile environment' requiring employers, landlords and health services to check status"
    verdict: confirmed
    sources:
      - {title: "CNN, Smith-Spark and Polglase (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "The measures, introduced in 2012, require employers, landlords and health service providers to demand evidence of legal immigration status. At the time, May said they were designed to create a “hostile environment”"}
      - {title: "Channel 4 News FactCheck, Georgina Lee (24 Apr 2018)", url: "https://www.channel4.com/news/factcheck/factcheck-who-destroyed-the-windrush-landing-cards", quote: "In May 2012, Theresa May declared : “the aim is to create here in Britain a really hostile environment for illegal migration.”"}
  - card: windrush-scandal
    fact: "People lost jobs, were refused healthcare and benefits, detained, removed or refused re-entry"
    verdict: confirmed
    sources:
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "They were essentially denied their rights: the right to live and work in the UK, to receive healthcare, to have a pension, claim state benefits and to re-enter the UK. At its most extreme, they were deprived of their liberty"}
      - {title: "National Audit Office (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "being denied access to public services, being detained in the UK or at the border, or removed from, or refused re-entry to, the UK"}
      - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "British citizens were wrongly deported, dismissed from their jobs and deprived of vital services"}
  - card: windrush-scandal
    fact: "Landing-card slips with arrival dates were destroyed in 2010"
    verdict: confirmed
    sources:
      - {title: "CNN (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "The landing card slips were “securely disposed” of in 2010, the Home Office said."}
      - {title: "Channel 4 News FactCheck (24 Apr 2018)", url: "https://www.channel4.com/news/factcheck/factcheck-who-destroyed-the-windrush-landing-cards", quote: "it wasn’t until October 2010 ... that the registry slips were actually disposed of"}
      - {title: "Civil Service World, Emilio Casalicchio (18 Apr 2018)", url: "https://www.civilserviceworld.com/professions/article/fury-over-revelation-that-home-office-destroyed-thousands-of-windrush-landing-cards", quote: "a horde of landing card slips recording the arrival dates of immigrants were culled in an office move"}
  - card: windrush-scandal
    fact: "The Home Office said the slips were not reliable evidence of residence or status"
    verdict: corrected
    sources:
      - {title: "CNN (18 Apr 2018)", url: "https://amp.cnn.com/cnn/2018/04/18/europe/uk-windrush-documents-destroyed-intl", quote: "they did not provide any reliable evidence relating to ongoing residence in the UK or their immigration status,” a Home Office spokesperson said"}
      - {title: "Civil Service World (18 Apr 2018)", url: "https://www.civilserviceworld.com/professions/article/fury-over-revelation-that-home-office-destroyed-thousands-of-windrush-landing-cards", quote: "Registration slips provided details of an individual's date of entry, they did not provide any reliable evidence relating to ongoing residence in the UK or their immigration status"}
    note: "Both quote the same Home Office statement, which is what the card attributes. Card said 'had never been reliable evidence'; changed to 'were not reliable evidence' to match the statement."
  - card: windrush-scandal
    fact: "In April 2018 the government acknowledged unfair treatment and set up a taskforce; compensation followed"
    verdict: confirmed
    sources:
      - {title: "National Audit Office (2018)", url: "https://www.nao.org.uk/reports/handling-of-the-windrush-situation/", quote: "In April 2018, the government acknowledged that the Windrush generation had been treated unfairly and set up a taskforce ... The Department is now moving to identify affected individuals, and to compensate them."}
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "the Windrush Scheme and Taskforce to help them secure documents to confirm their status, and the Windrush Compensation Scheme"}
  - card: windrush-scandal
    fact: "In March 2020 Williams found it 'foreseeable and avoidable'; without a definitive finding of institutional racism she saw 'an institutional ignorance and thoughtlessness towards the issue of race'"
    verdict: corrected
    sources:
      - {title: "Wendy Williams, Windrush Lessons Learned Review (March 2020)", url: "https://assets.publishing.service.gov.uk/media/5e7dd650e90e0706f7d69cc1/6.5577_HO_Windrush_Lessons_Learned_Review_LoResFinal.pdf", quote: "what happened to those affected by the Windrush scandal was foreseeable and avoidable ... While I am unable to make a definitive finding of institutional racism within the department, I have serious concerns that these failings demonstrate an institutional ignorance and thoughtlessness towards the issue of race"}
      - {title: "Electronic Immigration Network (20 Mar 2020)", url: "https://www.ein.org.uk/news/lessons-learned-review-windrush-scandal-profound-institutional-failure-immigration-hostile", quote: "Williams found that the Home Office showed \"ignorance and thoughtlessness\" on the issue of race, if not outright institutional racism."}
    note: "The card said the review found the Home Office 'guilty of'. That overstated a finding Williams framed as 'serious concerns' and explicitly stopped short of institutional racism. Reworded in EN and RU with the exact quotation."
  - card: windrush-scandal
    fact: "Priti Patel told the Commons she was 'truly sorry'"
    verdict: confirmed
    sources:
      - {title: "The National (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "apologised in the House of Commons. “There is nothing I can say today that will undo the suffering ... On behalf of this and successive governments I am truly sorry,” she said."}
      - {title: "Electronic Immigration Network (20 Mar 2020)", url: "https://www.ein.org.uk/news/lessons-learned-review-windrush-scandal-profound-institutional-failure-immigration-hostile", quote: "on behalf of this and successive governments. I am truly sorry. For the actions that spanned decades."}

  # --- stephen-lawrence
  - card: stephen-lawrence
