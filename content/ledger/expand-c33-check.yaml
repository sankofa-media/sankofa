    verdict: confirmed
    sources:
      - {title: "Court of Appeal, R v Dobson (18 May 2011)", url: "https://caselaw.nationalarchives.gov.uk/ewca/crim/2011/1255", quote: "On 22 nd April 1993, just after 10.35 in the evening, a young man, Stephen Lawrence, then 18 years old, was waiting at a bus stop at Eltham with a close friend of the same age, Duwayne Brooks."}
      - {title: "Macpherson, The Stephen Lawrence Inquiry, Cm 4262-I (1999)", url: "https://assets.publishing.service.gov.uk/media/5a7c2af540f0b645ba3c7202/4262.pdf", quote: "They were on their way home when they came at around 22:30 to the bus stop in Well Hall Road"}
