      - {title: "The National, Nicky Harley (19 Mar 2020)", url: "https://www.thenationalnews.com/world/government-issues-apology-after-report-finds-windrush-scandal-was-foreseeable-and-avoidable-1.994891", quote: "Newly arrived Jamaican immigrants on board the 'Empire Windrush' at Tilbury, on 22 June 1948."}
    note: "Body shortened to 'in 1948' to meet the word limit; the date stays confirmed."
  - card: windrush-scandal
