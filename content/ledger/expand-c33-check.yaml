  # --- gladys-west
  - card: gladys-west
    fact: "Born 1930 in Sutherland, Dinwiddie County, Virginia; parents had a small farm; she harvested crops"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "Born: October 27, 1930, Sutherland, Virginia ... Her parents owned a small farm"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "Born on October 27, 1930, Gladys Mae Brown resided in Sutherland, Virginia in rural Dinwiddie County. Her parents owned their small farm and West picked corn, cotton, and tobacco"}
  - card: gladys-west
    fact: "Valedictorian; full scholarship to Virginia State College, a historically Black college; maths degrees"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "As valedictorian of her high-school graduating class, Brown received a full scholarship to Virginia State College (now Virginia State University ), a historically Black college . She earned a bachelor of"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "As valedictorian of her high school class, she earned a full scholarship to Virginia State College ... In 1955, she received a master’s in mathematics from her alma mater."}
  - card: gladys-west
    fact: "Hired 1956 at the Dahlgren naval weapons lab, its fourth Black employee"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "In 1956 Brown was hired as a mathematician by the U.S. Naval Proving Ground (later the Naval Surface Warfare Center), a weapons laboratory in Dahlgren, Virginia, as only their fourth Black employee."}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "At Dahlgren, West was the second Black woman hired and the fourth Black employee."}
  - card: gladys-west
    fact: "She married Ira West, another Black mathematician on the base"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "There she met Ira V. West, another Black mathematician on the base; the couple married in 1957"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "Another Black mathematician on base, Ira V. West, became Gladys Brown’s husband in 1957"}
  - card: gladys-west
    fact: "She moved from hand calculation to programming; NORC project on Pluto's motion relative to Neptune"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "She eventually transitioned from solving those equations herself to programming computers to do it for her. One of her first major projects was work on the Naval Ordinance Research Calculator (NORC) ... to determine the movements of Pluto in relation to Neptune"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "In 1962 she helped program NORC for Project 29V, which established the motion of the planet Pluto relative to Neptune"}
  - card: gladys-west
    fact: "In 1978 she became project manager of Seasat, an ocean-observing satellite"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "In 1978 West was named project manager of Seasat , an experimental U.S. ocean surveillance satellite"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "In 1978, West was project manager for SEASAT, the first earth-orbiting satellite designed for remote sensing of the Earth’s oceans"}
  - card: gladys-west
    fact: "From Seasat came GEOSAT and programs modelling gravity, tides etc. to compute orbits and the geoid"
    verdict: confirmed
    sources:
      - {title: "Encyclopaedia Britannica, Meg Matthias: Gladys West (archived 2026-10-02)", url: "http://web.archive.org/web/20261002031039/https://www.britannica.com/biography/Gladys-West", quote: "Out of West’s work on Seasat came GEOSAT ... By teaching a computer to account for gravity, tides, and other forces ... could precisely calculate the orbits of satellites. These calculations made it possible to determine a model for the exact shape of Earth, called a geoid"}
      - {title: "BlackPast, Bethany Johnson: Gladys Mae West (1930- )", url: "https://www.blackpast.org/african-american-history/gladys-mae-west-1930/", quote: "This project led to the GEOSAT satellite ... In 1986, she published a guide outlining the use of GEOSAT data for calculating geoid heights."}
  - card: gladys-west
    fact: "That model and its updates let GPS calculate positions accurately"
    verdict: confirmed
    sources:
