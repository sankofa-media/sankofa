# Second, independent check (2026-11-13) of content/ledger/expand-x01.yaml.
# Every cited URL was reopened (curl; Britannica via an archived copy; Oyez via its API); every
# quote in the ledger was found verbatim (ignoring spacing/punctuation) in the fetched text.
# verdict: confirmed | corrected (card wording or sources changed) | refuted | unconfirmed (removed from the card).
# King Institute pages count as one source together; SNCC Digital pages as one; NARA milestone pages as one.
entries:
  - card: montgomery-bus-boycott
    fact: "In 1955 Montgomery's city buses were segregated by law and Black passengers could be ordered to give up seats to white riders"
    verdict: confirmed
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "She was arrested for violating the segregated seating ordinances"}
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Mary Louise Smith was arrested for refusing to yield her seat to a white passenger"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "The Women's Political Council, Black professional women led by Jo Ann Robinson, a college teacher, warned the mayor in 1954 of a possible boycott"
    verdict: confirmed
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In May 1954, WPC president Jo Ann Robinson , an English professor at Alabama State College , warned the mayor in a letter that a bus boycott might be imminent"}
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "WPC president Jo Ann Robinson reiterated the council’s requests in a 21 May letter to Mayor Gayle, telling him, “There has been talk from twenty-five or more local organizations of planning a city-wide boycott of buses”"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "Earlier in 1955 police arrested 15-year-old Claudette Colvin and 18-year-old Mary Louise Smith for not giving up their seats"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "a 15-year-old named Claudette Colvin was arrested for challenging segregation on a Montgomery bus. Seven months later, 18-year-old Mary Louise Smith was arrested for refusing to yield her seat to a white passenger"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In March 1955, Claudette Colvin , a 15-year-old high school junior, refused to give up her bus seat to a white person. She was arrested"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "On 1 December 1955 Rosa Parks refused to give up her seat and was arrested"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "Sparked by the arrest of Rosa Parks on 1 December 1955"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "In the early evening of December 1, 1955, Rosa L. Parks"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "That night Robinson and two students mimeographed tens of thousands of leaflets at Alabama State College calling for a one-day boycott on 5 December"
    verdict: confirmed
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "Robinson and two students stayed up all night at the college mimeographing 50,000 flyers that called for a one-day bus boycott on Monday, December 5"}
      - {title: "Stanford King Institute: Robinson, Jo Ann Gibson", url: "https://kinginstitute.stanford.edu/robinson-jo-ann-gibson", quote: "Late that night, she, two students, and John Cannon, chairman of the Business Department at Alabama State, mimeographed and distributed approximately 52,500 leaflets calling for a boycott of the buses"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "On 5 December almost no Black passengers rode the buses"
    verdict: corrected
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "On 5 December, 90 percent of Montgomery’s black citizens stayed off the buses"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "On Monday morning, December 5, 1955, few African Americans rode buses"}
    note: "Body said 'Almost no one rode'; narrowed to Black passengers, as both sources say."
  - card: montgomery-bus-boycott
    fact: "That afternoon leaders formed the Montgomery Improvement Association and elected King, new to Montgomery, as president"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "During this meeting the MIA was formed, and King was elected president. Parks recalled: “The advantage of having Dr. King as president was that he was so new to Montgomery"}
      - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "In 1954, Martin Luther King became pastor of the Dexter Avenue Baptist Church in Montgomery, Alabama"}
    note: "'New to town' rested on the King Institute alone; NobelPrize.org's 1954 arrival date added as the second source. EoA confirms 'that afternoon'."
  - card: montgomery-bus-boycott
    fact: "King was 26 at the time (born 15 January 1929)"
    verdict: confirmed
    sources:
      - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "(January 15, 1929-April 4, 1968)"}
      - {title: "National Park Service: Birth Home, Martin Luther King, Jr. National Historical Park", url: "https://www.nps.gov/malu/planyourvisit/birth-home.htm", quote: "was born here on Tuesday January 15th, 1929"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "Boycotters walked or shared rides in an organised carpool, and women did much of the work that kept the boycott going"
    verdict: corrected
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The MIA created a highly efficient carpool system managed by women leaders, one of many vital roles that women performed"}
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "the MIA developed an intricate carpool system of about 300 cars"}
    note: "'Carpool run largely by women' had only EoA; King Institute says only that 'women played crucial roles'. Card reworded to what both support."
  - card: montgomery-bus-boycott
    fact: "King's house was bombed"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "In early 1956, the homes of King and E. D. Nixon were bombed"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "His house was bombed while his wife, Coretta , and infant daughter were at home"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "Dozens of leaders were indicted under an old conspiracy law"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "indicted over 80 boycott leaders under a 1921 law prohibiting conspiracies that interfered with lawful business"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "city leaders indicted nearly 100 boycott leaders on conspiracy charges under an old anti-union law"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "Four women, among them Colvin and Smith, sued in federal court (Browder v. Gayle)"
    verdict: confirmed
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "attorney Fred Gray filed a federal lawsuit on behalf of four female plaintiffs: Claudette Colvin, Mary Louise Smith, Aurelia Browder, and Susan McDonald"}
      - {title: "Stanford King Institute: Browder v. Gayle", url: "https://kinginstitute.stanford.edu/browder-v-gayle-352-us-903", quote: "The original plaintiffs in the case were Aurelia S. Browder, Susie McDonald, Claudette Colvin, Mary Louise Smith, and Jeanatta Reese, but outside pressure convinced Reese to withdraw from the case in February"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "In November 1956 the Supreme Court upheld the ruling that bus segregation was unconstitutional"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "in November 1956 the U.S. Supreme Court affirmed Browder v. Gayle and struck down laws requiring segregated seating on public buses"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The U.S. Supreme Court upheld that decision in November"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "On 21 December 1956 Black Montgomery boarded desegregated buses"
    verdict: confirmed
    sources:
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "black citizens desegregated Montgomery's buses on December 21, 1956"}
      - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "On December 21, 1956, after the Supreme Court of the United States had declared unconstitutional the laws requiring segregation on buses, Negroes and whites rode the buses as equals"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "The boycott lasted more than a year"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "the Montgomery bus boycott was a 13-month mass protest"}
      - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "The boycott lasted 382 days"}
    note: ""
  - card: montgomery-bus-boycott
    fact: "The boycott made King a national figure and became a model for nonviolent campaigns across the South"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: Montgomery Bus Boycott", url: "https://kinginstitute.stanford.edu/montgomery-bus-boycott", quote: "The bus boycott demonstrated the potential for nonviolent mass protest to successfully challenge racial segregation and served as an example for other southern campaigns that followed"}
      - {title: "Stewart Burns, Encyclopedia of Alabama: Montgomery Bus Boycott", url: "https://encyclopediaofalabama.org/article/montgomery-bus-boycott/", quote: "The Montgomery experience showed the power of mass nonviolent direct action"}
    note: ""
  - card: march-on-washington
    fact: "On 28 August 1963 the March on Washington for Jobs and Freedom gathered at the Lincoln Memorial"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "On 28 August 1963, more than 200,000 demonstrators took part in the March on Washington for Jobs and Freedom"}
      - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "the words spoken that day at the Lincoln Memorial"}
    note: ""
  - card: march-on-washington
    fact: "The idea came from A. Philip Randolph, founder of the Brotherhood of Sleeping Car Porters, whose 1941 march threat pushed Roosevelt to bar discrimination in the defence industry; he then cancelled it"
    verdict: confirmed
    sources:
      - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "The threat of 100,000 marchers in Washington, D.C., pushed President Franklin D. Roosevelt to issue Executive Order 8802"}
      - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "the original idea came from A. Philip Randolph , a labor organizer and founder of the Brotherhood of Sleeping Car Porters"}
    note: ""
  - card: march-on-washington
    fact: "Bayard Rustin, Randolph's long-time partner, organised the march"
    verdict: confirmed
    sources:
      - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "Randolph handed the day-to-day planning to his partner in the March on Washington Movement, Bayard Rustin"}
      - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "march organizer Bayard Rustin"}
    note: ""
  - card: march-on-washington
    fact: "Demands included a strong civil rights bill, jobs and fair employment, and desegregated schools"
