    sources:
      - {title: "Stanford King Institute: March on Washington for Jobs and Freedom", url: "https://kinginstitute.stanford.edu/march-washington-jobs-and-freedom", quote: "“desegregation of all public schools in 1963”; a massive federal works program “to train and place unemployed workers”; and “a Federal Fair Employment Practices Act barring discrimination in all employment”"}
      - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "There was a list of \"Ten Demands\" from the sponsors, insisting on a fair living wage, fair employment policies, and desegregation of school districts"}
    note: ""
  - card: march-on-washington
    fact: "Some 250,000 people came"
    verdict: confirmed
    sources:
      - {title: "National Park Service: March on Washington for Jobs and Freedom", url: "https://www.nps.gov/articles/march-on-washington.htm", quote: "An estimated 250,000 people attended the March on Washington for Jobs and Freedom on August 28, 1963"}
      - {title: "NobelPrize.org: Martin Luther King Jr. – Biographical", url: "https://www.nobelprize.org/prizes/peace/1964/king/biographical/", quote: "the peaceful march on Washington, D.C., of 250,000 people"}
    note: ""
  - card: march-on-washington
