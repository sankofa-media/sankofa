# Batch c12 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a verbatim quote.
# Dropped: none. Single-sourced details removed from existing cards on re-verification (Seacole's Spring Hill site, Vodou's 1835/1864 penal codes and 1987 repeal, joumou 'bowl of freedom', Samaná's Wesleyan church and Isaac Miller, Loíza's 1830 date kept only as a dispute).

- card: remedios-del-valle
  fact: "María Remedios del Valle was a Black woman born in Buenos Aires (1766 per the Ministry of Culture; 1766–67 per other accounts)"
  sources:
    - {title: "Argentina.gob.ar, Presidencia de la Nación: Un monumento para María Remedios del Valle (7 November 2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "Nació en Buenos Aires en 1766. De origen afrodescendiente"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "nació en la ciudad de Buenos Aires entre 1766 y 1767"}
- card: remedios-del-valle
  fact: "In 1810 she followed the Army of the North with her husband and two sons, one of them adopted"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "poró al ejército auxiliar para las provincias del norte el 6 de julio de 1810, con su marido y dos hijos, uno adoptado"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "en el que estaban enrolados su marido y sus dos hijos, uno de ellos adoptado, se les unió"}
- card: remedios-del-valle
  fact: "She tended the wounded and fought at Tucumán and Salta and in the 1813 defeats at Vilcapugio and Ayohuma"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Participó en las acciones de Desaguadero, Tucumán, Salta, Vilcapugio y Ayohuma como combatiente"}
    - {title: "Argentina.gob.ar, Presidencia de la Nación: Un monumento para María Remedios del Valle (7 November 2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "en las victorias de Tucumán y Salta (1812 y 1813), y en las derrotas de Vilcapugio y Ayohuma (1813)"}
- card: remedios-del-valle
  fact: "Manuel Belgrano gave her the rank of captain"
  sources:
    - {title: "Argentina.gob.ar, Presidencia de la Nación: Un monumento para María Remedios del Valle (7 November 2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "Belgrano le confirió el grado de capitana del Ejército"}
    - {title: "Argentina.gob.ar: Heroínas y héroes de nuestra historia vuelven a ilustrar los billetes (24 May 2022)", url: "https://www.argentina.gob.ar/noticias/heroinas-y-heroes-de-nuestra-historia-vuelven-ilustrar-los-billetes-de-pesos-argentinos", quote: "Por su valentía, Belgrano la designó con el grado de capitana"}
- card: remedios-del-valle
  fact: "Taken prisoner after Ayohuma, she helped patriot prisoners escape and was flogged in public for nine days"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "fue tomada prisionera. Aprovechó para ayudar a huir a varios jefes patriotas y fue condenada a la pena de azotes. Durante nueve días fue flagelada pública- mente"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Asistió a los maltrechos prisioneros patriotas, y a algunos los ayudó a escaparse. Fue castigada por orden de los jefes Joaquín de la Pezuela, Juan Ramírez Orozco y Miguel Tacón a ser azotada durante nueve días"}
- card: remedios-del-valle
  fact: "She escaped and returned to the army"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "logró huir y volvió al ejército para pelear"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Cuando logró fugarse, estuvo en las filas de Martín Miguel de Güemes"}
- card: remedios-del-valle
  fact: "The war took her husband and both sons"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Había perdido marido e hijos en la guerra"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Su esposo y sus dos hijos murieron en combate"}
- card: remedios-del-valle
  fact: "Back in Buenos Aires she lived by begging, until General Juan José Viamonte, who had known her on campaign, spoke for her"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "tras ésta tuvo que recurrir a la mendicidad"}
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "El general Juan José Viamonte, que la conoció durante las campañas de la independencia, informó favorablemente"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Juan José Viamonte, fue quien la descubrió en la ciudad de Buenos Aires mendigando"}
- card: remedios-del-valle
  fact: "She was granted a captain's pay, then the rank of sergeant major of cavalry"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "con el sueldo de capitán de infantería. En 1829 fue ascen- dida a “sargenta mayor de caballería”"}
    - {title: "Argentina.gob.ar, Presidencia de la Nación: Un monumento para María Remedios del Valle (7 November 2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "le concedió el cargo de sargento mayor de caballería en 1829"}
- card: remedios-del-valle
  fact: "She took the name Remedios Rosas in gratitude to the governor Juan Manuel de Rosas"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "Rosas la destinó a la plana mayor activa, por lo cual ella, en agradecimiento, tomó el nombre de Remedios Rosas"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "En agradecimiento, ella le pidió permiso y se cambió el apellido, incorporando el de Rosas"}
- card: remedios-del-valle
  fact: "An army register of 8 November 1847 notes her death"
  sources:
    - {title: "Ministerio de Defensa de la Nación, Las mujeres y sus luchas en la historia argentina (2006)", url: "https://web.archive.org/web/20101218061651/http://mindef.gov.ar/image/Libros%2520index/libro%2520mujeres.pdf", quote: "En la del 8 de noviembre de 1847 una nota reza: “Baja. El mayor de caballería Da. Remedios Rosas falleció.”"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "Su necrológica se resumió en un registro del ejército, fechado el 8 de noviembre de 1847"}
- card: remedios-del-valle
  fact: "By Law 26,852 Argentina keeps 8 November as the National Day of Afro-Argentines in her honour"
  sources:
    - {title: "Argentina.gob.ar, Presidencia de la Nación: Un monumento para María Remedios del Valle (7 November 2022)", url: "https://www.argentina.gob.ar/noticias/un-monumento-para-maria-remedios-del-valle", quote: "Cada 8 de noviembre, gracias a la Ley 26.852, se conmemora en Argentina el Día Nacional de las y los Afroargentinos/as y de la Cultura Afro en homenaje a María Remedios del Valle"}
    - {title: "Argentina.gob.ar: Heroínas y héroes de nuestra historia vuelven a ilustrar los billetes (24 May 2022)", url: "https://www.argentina.gob.ar/noticias/heroinas-y-heroes-de-nuestra-historia-vuelven-ilustrar-los-billetes-de-pesos-argentinos", quote: "En su honor, la Ley 26.852 establece el 8 de noviembre como el Día Nacional"}
    - {title: "Adrián Pignatelli, La dura historia de Remedios del Valle, Infobae (8 November 2020)", url: "https://www.infobae.com/sociedad/2020/11/08/la-dura-historia-de-remedios-del-valle-lucho-por-la-independencia-fue-herida-tomada-prisionera-y-termino-pidiendo-limosna/", quote: "En su homenaje, desde 2013, el 8 de noviembre es el día del afroargentino y de la cultura afro"}
- card: remedios-del-valle
  fact: "Her portrait appears on banknotes beside Belgrano's"
  sources:
    - {title: "Argentina.gob.ar: Heroínas y héroes de nuestra historia vuelven a ilustrar los billetes (24 May 2022)", url: "https://www.argentina.gob.ar/noticias/heroinas-y-heroes-de-nuestra-historia-vuelven-ilustrar-los-billetes-de-pesos-argentinos", quote: "María Remedios del Valle y Manuel Belgrano ($500)"}
    - {title: "Banco Central de la República Argentina: nuevos billetes de 10.000 y 20.000 pesos", url: "https://web.archive.org/web/20250611160705/https://www.bcra.gob.ar/Noticias/nuevos-billetes-10-y-20mil.asp", quote: "El billete de $10.000 tendrá las imágenes de Manuel Belgrano y de María Remedios del Valle"}
- card: mary-seacole
  fact: "Mary Seacole was born in Kingston, Jamaica, in 1805 to a Scottish soldier and a free Black Jamaican 'doctress' who cared for invalids at her boarding house"
  sources:
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "Mary Seacole (born 1805, Kingston, Jamaica—died May 14, 1881, London , England)"}
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "Her father was a Scottish soldier, and her mother was a free black Jamaican woman and “doctress” skilled in traditional medicine who provided care for invalids at her boardinghouse"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Mary Seacole was born Mary Jane Grant in Jamaica in 1805 to a Scottish army father and a Creole mother"}
- card: mary-seacole
  fact: "She learned Creole herbal healing from her mother and called herself a 'doctress'"
  sources:
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "“doctress”, a word she used to describe the traditional Creole herbal healing work she learned from her mother in Jamaica"}
    - {title: "Mary Seacole, Wonderful Adventures of Mrs. Seacole in Many Lands (1857), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/23031", quote: "the ambition to become a doctress early took firm root in my mind"}
- card: mary-seacole
  fact: "She nursed yellow fever patients in Jamaica and cholera victims in Panama"
  sources:
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "she gained further nursing experience during a cholera epidemic in Panama , and, after returning to Jamaica , she cared for yellow fever victims"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "dispensed medicines and treatment to sick people during a cholera outbreak"}
- card: mary-seacole
  fact: "In 1854, amid reports of soldiers left without care in the Crimean War, she offered to serve as an army nurse and was refused, which she attributed to prejudice"
  sources:
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "Despite her experience, her offers to serve as an army nurse were refused, and she attributed her rejection to racial prejudice"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "her attempt to apply in-person at the War Office to serve as a war nurse was unsuccessful"}
- card: mary-seacole
  fact: "She resolved to go 'upon my own responsibility and at my own cost'"
  sources:
    - {title: "Mary Seacole, Wonderful Adventures of Mrs. Seacole in Many Lands (1857), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/23031", quote: "then would I upon my own responsibility and at my own cost"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Undeterred, Seacole funded her own trip to the Crimea in 1855"}
- card: mary-seacole
  fact: "In 1855, with Thomas Day, a relative of her late husband, she set up the British Hotel near Balaclava, selling food, supplies and medicines to the army"
  sources:
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "She and Thomas Day, a relative of her late husband, set up the so-called British Hotel near where fighting had been in Balaclava"}
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "In 1855, with the help of a relative of her husband, she went to Crimea as a sutler, setting up the British Hotel to sell food, supplies, and medicines to the troops"}
- card: mary-seacole
  fact: "She went to the front to tend the wounded, who called her 'Mother Seacole'"
  sources:
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "she also visited the battlefront to care for wounded soldiers"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "appreciate[d] ‘Mother’ Seacole, as she is affectionately called"}
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "She assisted the wounded at the military hospitals and was a familiar figure at the transfer points for casualties from the front"}
    - {title: "Mary Seacole, Wonderful Adventures of Mrs. Seacole in Many Lands (1857), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/23031", quote: "There were few officers of the 97th to whom Mother Seacole was not well known"}
- card: mary-seacole
  fact: "Peace left her with unsold stock and debts, and she was declared bankrupt"
  sources:
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Seacole and Day were left with leftover stocks of food and equipment – and outstanding debts. Soon after Seacole returned to England, she was declared bankrupt"}
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "At the war’s end she returned to England destitute and was declared bankrupt"}
- card: mary-seacole
  fact: "Her memoir Wonderful Adventures of Mrs Seacole in Many Lands came out in 1857 and became a bestseller"
  sources:
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "In 1857 her autobiography, Wonderful Adventures of Mrs. Seacole in Many Lands , was published and became a best seller"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Still, her Wonderful Adventures was a bestseller"}
- card: mary-seacole
  fact: "She died in London in 1881, was forgotten, and is now widely recognised again; a statue stands at St Thomas' Hospital"
  sources:
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Seacole died in London in 1881"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "Though well-loved in her time, Seacole was lost to history after her death"}
    - {title: "London Museum: Mary Seacole, Doctress of the Crimean War", url: "https://www.londonmuseum.org.uk/collections/london-stories/mary-seacole-doctress-crimean-war/", quote: "A statue commemorating her stands outside St Thomas’ Hospital in Lambeth"}
    - {title: "Britannica: Mary Seacole", url: "https://www.britannica.com/biography/Mary-Seacole", quote: "After her death she fell into obscurity but in 2004 took first place in the 100 Great Black Britons poll"}
- card: haitian-vodou
  fact: "Vodou grew up in colonial Saint-Domingue among enslaved people from Dahomey and other African lands, under Catholic pressure"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "by the descendants of the Dahomean , Kongo , Yoruba , and other ethnic groups who had been enslaved and transported to colonial Saint-Domingue (as Haiti was known then) and partly Christianized by Roman Catholic missionaries"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "The dominant group came from Dahomey, and the Dahomean religion became the most important element in the emergence of Voudou"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "The plantation owners in Haiti attempted to impose Catholicism on the slave population"}
- card: haitian-vodou
  fact: "Its name comes from a Fon/Dahomean word for spirit or god"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "The word Vodou means “spirit” or “deity” in the Fon language of the African kingdom of Dahomey"}
    - {title: "Leslie G. Desmangles, The Faces of the Gods (1992), pp. xi–xii, excerpt", url: "https://web.archive.org/web/20210301160256/http://www.hartford-hwp.com/archives/43a/123.html", quote: "a distortion of the Dahomean (or Beninois) word vodu (meaning god or spirit )"}
- card: haitian-vodou
  fact: "Believers hold that God rules the world with the help of the lwa, served with prayers, songs and offerings"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "the spirits were made by God to help him govern humanity and the natural world"}
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "to offer prayers and perform various devotional rites directed at God and particular spirits"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "including a belief in a supreme deity or divine power. In Haiti that deity came to be known as le Bon Diei (the Good God)"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "under him were a number of greater and lesser deities"}
- card: haitian-vodou
  fact: "Priests are oungan (men) and manbo (women); branches include Rada and Petwo"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "local hierarchies of priestesses or priests ( manbo and oungan )"}
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "branches of the religion include Rada, Daome, Ibo, Nago, Dereal, Manding, Petwo, and Kongo"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "Voudou worship and practice is conducted by male ( oungan ) and female ( manbo ) priests"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "those of African origin (the Rada) and those of Haitian origin (P é tro)"}
- card: haitian-vodou
  fact: "At ceremonies danced to drums a spirit may take possession of a devotee"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "these acts exhibit the incarnate presence of the lwa within the entranced devotee"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "lively dancing with drum accompaniment, and the possession of priests or others in attendance by loas"}
- card: haitian-vodou
  fact: "The spirits took on the faces of Catholic saints; Danbala is honoured on St Patrick's Day, 17 March"
  sources:
    - {title: "Elizabeth A. McAlister, Britannica: Vodou", url: "https://www.britannica.com/topic/Vodou", quote: "Danbala on St. Patrick’s Day , March 17"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "One of the means by which Voudou survived was in the identification of the loas with various Catholic saints"}
    - {title: "Encyclopedia of Occultism and Parapsychology (Gale), Voudou, via Encyclopedia.com", url: "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/voudou", quote: "Damballah with Saint Patrick"}
- card: haitian-vodou
  fact: "For generations Haitian law punished Vodou rites, and a 1935 decree against superstitious practices tightened the ban"
  sources:
    - {title: "Kate Ramsey, Prohibition, persecution, performance, Gradhiva 1 (2005)", url: "https://journals.openedition.org/gradhiva/352", quote: "The 1835 and 1864 Haitian penal codes banned «le vaudoux» as a type of «sortilège» or spell-making, and this regime was reformulated and tightened a year after the end of the nineteen-year United States occupation of Haiti by President Sténio Vincent’s 1935 décret-loi against «les pratiques superstitieuses»"}
    - {title: "International Center for Law and Religion Studies (BYU): Republic of Haiti, Law and Religion Overview", url: "https://www.iclrs.org/?p=8808", quote: "historically its practices have faced persecution within Haitian society"}
    - {title: "International Center for Law and Religion Studies (BYU): Republic of Haiti, Law and Religion Overview", url: "https://www.iclrs.org/?p=8808", quote: "The decree law of September 5, 1935 on superstitious beliefs"}
- card: haitian-vodou
  fact: "The Catholic Church joined the campaigns against Vodou"
  sources:
    - {title: "Kate Ramsey, Prohibition, persecution, performance, Gradhiva 1 (2005)", url: "https://journals.openedition.org/gradhiva/352", quote: "subject to US Marine, Protestant missionary, Catholic Church, and Haitian state offensives"}
    - {title: "International Center for Law and Religion Studies (BYU): Republic of Haiti, Law and Religion Overview", url: "https://www.iclrs.org/?p=8808", quote: "Institutional Catholicism and the Haitian elite were known to degrade its traditional beliefs and practices"}
- card: haitian-vodou
  fact: "In April 2003 President Aristide recognised Vodou as a religion on a par with others, letting its priests perform legally binding ceremonies such as marriages"
  sources:
    - {title: "BBC News: Haiti makes voodoo official (30 April 2003)", url: "http://news.bbc.co.uk/2/hi/americas/2985627.stm", quote: "only now has it been recognised as a religion on a par with others worshipped in the country. Haiti's Catholic President, Jean-Bertrand Aristide, took the decision earlier in April which means that voodoo ceremonies such as marriages now have equal standing with Catholic ones"}
    - {title: "International Center for Law and Religion Studies (BYU): Republic of Haiti, Law and Religion Overview", url: "https://www.iclrs.org/?p=8808", quote: "In 2003, President Jean-Bertrand Aristide granted Vodou official recognition, authorizing Vodou priests to perform civil ceremonies such as marriages"}
- card: soup-joumou
  fact: "Soup joumou is made from joumou (turban squash, giraumon) with meat, vegetables and hot peppers"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "Joumou or giraumon soup is a traditional Haitian pumpkin soup made with vegetables, plantains, meat, pasta and spices"}
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "Joumou soup, made from turban squash (joumou), meat, potatoes, malanga, yams, turnips and chilli"}
    - {title: "NPR Weekend Edition: Haitian soup joumou awarded protected cultural heritage status by UNESCO (18 December 2021)", url: "https://www.npr.org/2021/12/18/1065477169/haitian-soup-joumou-awarded-protected-cultural-heritage-status-by-unesco", quote: "Joumou soup is a hearty blend of pumpkin, potatoes, squash, beef, chili peppers and other things"}
- card: soup-joumou
  fact: "In colonial Saint-Domingue the enslaved cooked it for their owners, and it was reserved for the owners"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "Originally reserved for slave owners"}
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "originally cooked by enslaved African people for their owners in Haiti"}
    - {title: "NPR Weekend Edition: Haitian soup joumou awarded protected cultural heritage status by UNESCO (18 December 2021)", url: "https://www.npr.org/2021/12/18/1065477169/haitian-soup-joumou-awarded-protected-cultural-heritage-status-by-unesco", quote: "During the colony, the soup was prepared by slaves for hundreds of years. And they could never taste it"}
- card: soup-joumou
  fact: "Since independence on 1 January 1804 Haitians eat it every 1 January, Independence Day, as a symbol of freedom"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "turning it into a symbol of their newly acquired freedom"}
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "is prepared and consumed specifically on the first of January – Haiti’s Independence Day"}
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "Since Haiti’s independence in 1804, joumou soup has become the national symbol of liberation from slavery, and is traditionally eaten on 1 January, the Caribbean country’s independence day"}
- card: soup-joumou
  fact: "In December 2021 UNESCO inscribed it on the Representative List; Haiti's first entry"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "Inscribed in 2021 ( 16.COM ) on the Representative List of the Intangible Cultural Heritage of Humanity"}
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "It is Haiti’s first inclusion on the list"}
    - {title: "NPR Weekend Edition: Haitian soup joumou awarded protected cultural heritage status by UNESCO (18 December 2021)", url: "https://www.npr.org/2021/12/18/1065477169/haitian-soup-joumou-awarded-protected-cultural-heritage-status-by-unesco", quote: "this is the first time that any cultural item from Haiti has received the designation"}
- card: soup-joumou
  fact: "Haiti's ambassador to UNESCO, Dominique Dupuy, wept as the decision was announced"
  sources:
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "the country’s Unesco ambassador, Dominique Dupuy, cried as the announcement was made"}
    - {title: "NPR Weekend Edition: Haitian soup joumou awarded protected cultural heritage status by UNESCO (18 December 2021)", url: "https://www.npr.org/2021/12/18/1065477169/haitian-soup-joumou-awarded-protected-cultural-heritage-status-by-unesco", quote: "You were visibly emotional when you accepted this award for Haiti"}
- card: soup-joumou
  fact: "It became a national symbol of liberation and dignity"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Joumou soup", url: "https://ich.unesco.org/en/RL/joumou-soup-01853", quote: "an expression of their dignity and resilience"}
    - {title: "Saeed Kamali Dehghan, Culture in a bowl, The Guardian (17 December 2021)", url: "https://www.theguardian.com/global-development/2021/dec/17/culture-in-a-bowl-haitis-joumou-soup-awarded-protected-status-by-unesco", quote: "a symbol of hope and dignity for the world’s first black-led republic"}
- card: regla-de-ocha
  fact: "Santería took shape in Cuba in the nineteenth century when hundreds of thousands of Yoruba were enslaved and shipped there"
  sources:
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "Santería was brought to Cuba by the people of the Yoruban nations of West Africa , who were enslaved in great numbers in the first decades of the 19th century"}
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "This case involves practices of the Santeria religion, which originated in the nineteenth century. When hundreds of thousands of members of the Yoruba people were brought as slaves"}
- card: regla-de-ocha
  fact: "In Cuba it absorbed Catholic elements; devotees expressed devotion to the orishas through images of Catholic saints, hence 'the way of the saints'"
  sources:
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "The name “Santería” derives from the correspondences made by some devotees between the Yoruba deities called orisha s and the saints ( santos ) of Roman Catholic piety"}
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "their traditional African religion absorbed significant elements of Roman Catholicism. The resulting syncretion, or fusion, is Santeria, \"the way of the saints.\""}
- card: regla-de-ocha
  fact: "It is also known as the Yoruba or Lukumí religion, after the name of the Yoruba in Cuba"
  sources:
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "the “Lukumi religion,” after the name by which the Yoruba were known in Cuba"}
    - {title: "Jacques Leclerc, Cuba, L'aménagement linguistique dans le monde, CEFAN, Université Laval", url: "https://www.axl.cefan.ulaval.ca/amsudant/cuba.htm", quote: "La religion yorouba, plus connue à Cuba sous le nom de Santería"}
- card: regla-de-ocha
  fact: "Its heart is a personal bond with the orishas kept through offerings, sometimes animal sacrifice, and initiation"
  sources:
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "Santería is based upon the development of personal relationships through divination , sacrifice , initiation, and mediumship"}
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "which employs animal sacrifice as one of its principal forms of devotion"}
- card: regla-de-ocha
  fact: "In Cuba the faith was persecuted and practised in secret"
  sources:
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "Santeria adherents faced widespread persecution in Cuba, so the religion and its rituals were practiced in secret"}
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "Santeria: a religion of resistance, secrets, and solidarity"}
- card: regla-de-ocha
  fact: "After the revolution of 1959 Cuban exiles carried it to the United States"
  sources:
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "From the Cuban Revolution of 1959 to the early 21st century, nearly one million Cubans left the island, bringing Orisha religion to cities throughout the Americas, particularly Miami and New York"}
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "The religion was brought to this Nation most often by exiles from the Cuban revolution"}
- card: regla-de-ocha
  fact: "Hialeah passed ordinances targeting the sacrifices of the Church of the Lukumi Babalu Aye; in 1993 the Supreme Court unanimously struck them down"
  sources:
    - {title: "US Supreme Court, Church of the Lukumi Babalu Aye v. City of Hialeah, 508 U.S. 520 (1993), LII", url: "https://www.law.cornell.edu/supremecourt/text/508/520", quote: "The ordinances' texts and operation demonstrate that they are not neutral, but have as their object the suppression of Santeria's central element, animal sacrifice"}
    - {title: "Joseph M. Murphy, Britannica: Santería", url: "https://www.britannica.com/topic/Santeria", quote: "In 1993 the U.S. Supreme Court unanimously upheld the right of devotees to practice the controversial rite of animal sacrifice in the case Church of the Lukumi Babalu Aye v. Hialeah"}
    - {title: "Oyez: Church of Lukumi Babalu Aye v. City of Hialeah (1993)", url: "https://www.oyez.org/cases/1992/91-948", quote: "The ordinances singled out the activities of the Santeria faith and suppressed more religious conduct than was necessary to achieve their stated ends. [decision record: majority_vote 9, minority_vote 0]"}
- card: congos-villa-mella
  fact: "The Brotherhood of the Holy Spirit of the Congos of Villa Mella was founded (UNESCO: sixteenth century) by enslaved Africans and people of mixed descent; Holy Spirit brotherhoods go back to colonial times"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "was founded in the sixteenth century by African slaves and people of mixed orig"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "se remonta desde los tiempos coloniales hasta la actualidad. Cofradías como las del Espíritu Santo existen desde el 1503"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "Al mismo tiempo es una manifestación de resistencia cultural de los esclavos africanos"}
- card: congos-villa-mella
  fact: "It joins Catholic and African traditions and is open to all regardless of sex or origin"
  sources:
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "La Cofradía es un hecho cultural histórico que integra sincréticamente expresiones católicas y africanas"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "sin discriminación racial, de sexo, social y edad"}
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "which is nowadays open to all without distinction of sex or origin"}
- card: congos-villa-mella
  fact: "Its musicians play hand drums called congos, attributed to the Holy Spirit, who appeared with them in Villa Mella"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "The Brotherhood musicians play instruments called congos. These congos, the origin of which is attributed to the Holy Spirit, are hand-drums"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "el mismo Espíritu Santo se apareció con los instrumentos en Villa Mella cerca de la Iglesia Parroquial"}
- card: congos-villa-mella
  fact: "It celebrates the feast of the Holy Spirit and plays at members' funeral rites: the ninth day and the later Banco ceremony"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "The Festival of the Holy Spirit, celebrated at Pentecost, features prayers, dances and singing"}
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "on the ninth day of mourning"}
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "At the Banko ceremony, three years after the death"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "celebrar las fiestas del Espíritu Santo y de la Virgen del Rosario y, 2) realizar las ceremonias funerarias (Noveno Día, Cabo de Año y Banco)"}
- card: congos-villa-mella
  fact: "UNESCO proclaimed it a Masterpiece of the Oral and Intangible Heritage of Humanity in 2001"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "Inscribed in 2008 ( 3.COM ) on the Representative List of the Intangible Cultural Heritage of Humanity (originally proclaimed in 2001)"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "El 18 de mayo del 2001, la UNESCO proclamó La Cofradía de los Congos del Espíritu Santo de Villa Mella PATRIMONIO ORAL E INTANGIBLE DE LA HUMANIDAD"}
- card: congos-villa-mella
  fact: "Urban growth, migration, unemployment and prejudice threaten it"
  sources:
    - {title: "UNESCO Intangible Cultural Heritage: Cultural space of the Brotherhood of the Holy Spirit of the Congos of Villa Mella", url: "https://ich.unesco.org/en/RL/cultural-space-of-the-brotherhood-of-the-holy-spirit-of-the-congos-of-villa-mella-00006", quote: "Today, the acceleration of urban growth, migration, unemployment and the standardization of values is reinforcing prejudices"}
    - {title: "Museo del Hombre Dominicano: La Cofradía de los Congos del Espíritu Santo de Villa Mella (archived 2010)", url: "https://web.archive.org/web/20101002000603/http://www8.svsu.edu/~kerman/MHD/Patrimonio/congos.htm", quote: "el crecimiento urbano acelerado, migraciones, desempleo, alto costo de la vida, transculturación, cambios de valores entre una generación y otra, ausencia de un sistema jurídico de protección, prejuicio e incomprensión"}
- card: samana-americans
  fact: "In the 1820s Haiti ruled the whole island of Hispaniola"
  sources:
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "the Haitian government made it known that it would welcome all people of African descent willing to come to their nation, which then occupied the entire Caribbean island of Hispaniola"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "sobre la inmigración de afro- americanos a la isla Española en 1824-25, entonces Haití"}
- card: samana-americans
  fact: "In 1824–25 free Black Americans from the mid-Atlantic coast of the US emigrated to Haiti"
  sources:
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "In August 1824, African-Americans from Philadelphia and other U.S. coastal cities, filled with hope and encouragement, accepted the offer"}
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "some reunion with branches of their families still residing in the U.S. Mid-Atlantic states"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "la región atlántica central de Estados Unidos (1824- 25)"}
- card: samana-americans
  fact: "They brought the African Methodist Episcopal Church with them"
  sources:
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "de la iglesia que coordinó la emigración"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "La obra protestante fue iniciada en Samaná con la llegada del reverendo Isaac Miller, de la iglesia Africana Metodista Episcopal, quien llegó como inmigrante afro-norteamericano en 1824"}
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "Several denominations are represented, including Evangelical, Pentecostal, Church of God, African Methodist Episcopal"}
- card: samana-americans
  fact: "The Samaná settlement held, its families together around Protestant churches"
  sources:
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "held together culturally by religious beliefs, a common language, and other cultural factors determined by a common origin and struc­turally by their church organization"}
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "Most are Protestants"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "Posteriormente, la obra pastoral y misionera de la iglesia Africana Metodista Episcopal (refundada en Samaná en 1899) y la Metodista Wesleyana"}
- card: samana-americans
  fact: "English remained the language of home for generations"
  sources:
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "American English has always been the preferred language in the home"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "la historia oral heredada de sus padres en su lengua materna, el inglés"}
- card: samana-americans
  fact: "Descendants still carry North American surnames such as Willmore"
  sources:
    - {title: "John M. Weeks and Virginia Ramirez Zabala, The Samana Americans, Expedition 47:1 (Penn Museum, 2005)", url: "https://www.penn.museum/sites/expedition/the-samana-americans/", quote: "North American surnames, including uncommon ones such as Willmore and Vanderhorst"}
    - {title: "Martha Ellen Davis, La historia de los inmigrantes afro-americanos y sus iglesias en Samaná, Boletín del Archivo General de la Nación 129 (2011)", url: "https://web.archive.org/web/20151225030905/http://www.bagn.academiahistoria.org.do/boletines/boletin129/BAGN_2011_No_129-09.pdf", quote: "conocí al Reverendo Nehemiah, Nehemías, Willmore (1909- 1987) en el Barrio Willmore en la parte oc- cidental del pueblo de Samaná"}
- card: merikins
  fact: "When the British fleet entered Chesapeake Bay in the War of 1812, enslaved people from Maryland and Virginia, later Georgia, escaped to its ships"
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "Recruited by the British first in Maryland and Virginia and later in Georgia"}
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "men, women and children rowed out perilously into the Chesapeake Bay by canoe to reach the squadron"}
    - {title: "NALIS, National Library of Trinidad and Tobago: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "They were recruited mainly from Chesapeake Bay, shores of Virginia and Maryland, as well as from the coast of Georgia"}
- card: merikins
  fact: "Many men enlisted in the Corps of Colonial Marines, six companies who fought against their former masters"
  sources:
    - {title: "NALIS, National Library of Trinidad and Tobago: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "recruited into a total of six (6) military companies"}
    - {title: "Lovell Francis, The story of the Merikens in Trinidad, National Archives of Trinidad and Tobago (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "six companies of African American soldiers, accompanied by their wives and children"}
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "This body of young African Americans threw off their slavery, took up arms against their ex-masters as a disciplined mi"}
- card: merikins
  fact: "After the war they were garrisoned in Bermuda and refused transfer to the West India Regiments, holding Britain to the promise of free settlement"
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "When transfer to the West India Regiments was proposed and the men again rejected the idea"}
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "garrisoned after the war at the new Royal Naval Dockyard at Bermuda for fourteen months"}
    - {title: "National Archives of Trinidad and Tobago: Our African Legacy, Roots and Routes", url: "https://h.natt.gov.tt/sites/default/files/Our_African_Legacy_Roots_and_Routes.pdf", quote: "At the end of the War of 1812, the soldiers were temporarily settled in the garrison at Bermuda where they were offered a choice of either serving in the West India Regiment or being settled as free men in a British colony. Vehemently refusing the former"}
- card: merikins
  fact: "In 1815 and 1816 more than seven hundred men, women and children were landed in Trinidad"
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "In 1815 and 1816 Trinidad welcomed over seven hundred free Black American settlers"}
    - {title: "Lovell Francis, The story of the Merikens in Trinidad, National Archives of Trinidad and Tobago (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "in the years 1815-1816, 544 men, 83 women and 85 children of African origin arrived as freed people"}
    - {title: "National Archives of Trinidad and Tobago: Our African Legacy, Roots and Routes", url: "https://h.natt.gov.tt/sites/default/files/Our_African_Legacy_Roots_and_Routes.pdf", quote: "From 1815 to the 1820s, Trinidad became the home to over 700 formerly enslaved African-Americans"}
- card: merikins
  fact: "Most people of African descent in Trinidad stayed enslaved until 1838"
  sources:
    - {title: "Lovell Francis, The story of the Merikens in Trinidad, National Archives of Trinidad and Tobago (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "the vast majority of persons of their hue and ethnicity were still uncomfortably ensconced in chattel servitude until 1838"}
    - {title: "National Archives of Trinidad and Tobago: Our African Legacy, Roots and Routes", url: "https://h.natt.gov.tt/sites/default/files/Our_African_Legacy_Roots_and_Routes.pdf", quote: "Emancipation finally came in 1838"}
- card: merikins
  fact: "They were settled around the mission of Savanna Grande, now Princes Town, each company in its own village; the area is still called the Company Villages"
  sources:
    - {title: "John McNish Weiss, The Corps of Colonial Marines: Black freedom fighters of the War of 1812 (archived 2018)", url: "https://web.archive.org/web/20180208143724/http://www.mcnishandweiss.co.uk/history/colonialmarines.html", quote: "The majority found their new homes in the south of the island around the Mission of Savanna Grande , now Princes Town , mostly within the area known since then as The Company Villages"}
    - {title: "NALIS, National Library of Trinidad and Tobago: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "They were settled in the South of Trinidad, in the Naparima District/Savanna Grande (now Princes Town)"}
    - {title: "National Archives of Trinidad and Tobago: Our African Legacy, Roots and Routes", url: "https://h.natt.gov.tt/sites/default/files/Our_African_Legacy_Roots_and_Routes.pdf", quote: "The village names were based on the naval companies in which they served as Colonial Marines"}
- card: merikins
  fact: "The land was forested"
  sources:
    - {title: "Lovell Francis, The story of the Merikens in Trinidad, National Archives of Trinidad and Tobago (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "carving thriving communities out of heavily forested land"}
    - {title: "NALIS, National Library of Trinidad and Tobago: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "It is famous for its mixed farming and large virgin forest areas such as Cata Hill"}
- card: merikins
  fact: "They were called Merikins, a Creole rendering of 'American'"
  sources:
    - {title: "Lovell Francis, The story of the Merikens in Trinidad, National Archives of Trinidad and Tobago (2015)", url: "https://nationalarchivestt.wordpress.com/2015/08/14/the-story-of-the-merikens-in-trinidad/", quote: "These nineteenth century émigrés were eventually dubbed Merikens, a Creole rendering of the word American"}
    - {title: "NALIS, National Library of Trinidad and Tobago: The Merikins, Free Black Settlers 1815–1816 (archived)", url: "https://web.archive.org/web/2016id_/http://www.nalis.gov.tt/Research/SubjectGuide/TheMerikinsFreeBlackSettlers18151816/tabid/563/Default.aspx?PageContentMode=1", quote: "they meant to say that I am American but instead they said I am “Merikin”"}
- card: loiza-vejigantes
  fact: "Loíza, on Puerto Rico's north-east coast, is the island's centre of African heritage"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "the Vejigante of the Fiestas of Santiago Apóstol (St. James) in Loíza, on the northeast coast"}
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "make that locality the seat of African cultural influence in Puerto Rico"}
    - {title: "Discover Puerto Rico: The Vejigante Mask, a Symbol of Puerto Rican Heritage", url: "https://www.discoverpuertorico.com/article/vejigante-mask-symbol-puerto-rican-heritage", quote: "a religiously significant event held in July that highlights the fusion of Spanish and African cultures"}
- card: loiza-vejigantes
  fact: "Every July Loíza keeps the Fiestas of Santiago Apóstol, St James, warrior saint of Spain said to have driven out the Moors"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "celebrated annually from July 25 to 28"}
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "The warrior St. James is the patron saint of Spain, credited with appearing miraculously to help drive the Moors from the Iberian peninsula"}
    - {title: "Cesiach López Maldonado, Se monta la fiesta en Loíza, Primera Hora", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Se dice que Santiago, durante la conquista medieval europea, decapitaba a los moros, por eso su apodo de “Santiago Mata Moros”"}
    - {title: "Discover Puerto Rico: Loíza", url: "https://www.discoverpuertorico.com/regions/east/loiza", quote: "For a week in July, the town celebrates with multiple processions and parades"}
- card: loiza-vejigantes
  fact: "Legend: a small carved image of the saint was found among the roots of a cork tree at Las Carreras outside the town"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "the legend says, that fishermen found the carved wooden image of Santiago Apóstol (now Santiago of the Children) under a cork tree"}
    - {title: "Cesiach López Maldonado, Se monta la fiesta en Loíza, Primera Hora", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "en el sector Las Carreras apareció entre un hueco en las raíces de un centenario árbol de corcho, una talla religiosa de un santo montado a caballo"}
    - {title: "Discover Puerto Rico: The Vejigante Mask, a Symbol of Puerto Rican Heritage", url: "https://www.discoverpuertorico.com/article/vejigante-mask-symbol-puerto-rican-heritage", quote: "Its roots trace back to the legend of the discovery of the statue of Saint James outside of the town"}
- card: loiza-vejigantes
  fact: "The legend's date is disputed: around 1830 (Fiet) or 1600 (Primera Hora)"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "The date usually cited for the discovery is around 1830"}
    - {title: "Cesiach López Maldonado, Se monta la fiesta en Loíza, Primera Hora", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Según la historia, que data de 1600"}
- card: loiza-vejigantes
  fact: "Three images, St James of the Men, of the Women and of the Children, are carried in procession on 26, 27 and 28 July"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "Santiago of the Men (July 26), Santiago of the Women (July 27) and “Santiaguito” or Santiago of the Children (July 28)"}
    - {title: "Cesiach López Maldonado, Se monta la fiesta en Loíza, Primera Hora", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "Los días siguiente (26, 27 y 28 de julio) le tocaba el turno a la procesión de los santos, Santiago el de los Hombres, Santiago el de las Mujeres y Santiago el de los Niños, respectivamente"}
    - {title: "Comboni Missionaries: Puerto Rico, Dancing People (2021)", url: "https://www.combonimissionaries.co.uk/?p=6823", quote: "The statues will be carried in procession through town from the church"}
- card: loiza-vejigantes
  fact: "Masked characters: Caballeros, Locas (men dressed as women), ragged Viejos and devilish vejigantes"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "devilish Vejigantes , fancy-dressed Spaniards or Caballeros , cross-dressed Locas with padded bosoms and buttocks and faces blackened with shoe polish, and tattered Viejos or Old Men"}
    - {title: "Discover Puerto Rico: Loíza", url: "https://www.discoverpuertorico.com/regions/east/loiza", quote: "along with other characters like the Spanish Caballeros (knights), the Viejos dressed in rags, and the Locas , men dressed as crazy women"}
    - {title: "Comboni Missionaries: Puerto Rico, Dancing People (2021)", url: "https://www.combonimissionaries.co.uk/?p=6823", quote: "it represents evil, the devil that S. James must fight"}
- card: loiza-vejigantes
  fact: "Ponce's vejigante masks are papier-mâché; Loíza's are carved from coconut and crowned with horns"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "the Vejigante of pre-Lenten Carnival in Ponce, on the south coast, with its paper-maché mask, and the Vejigante of the Fiestas of Santiago Apóstol (St. James) in Loíza, on the northeast coast, with its mask carved from coconut husks"}
    - {title: "Discover Puerto Rico: The Vejigante Mask, a Symbol of Puerto Rican Heritage", url: "https://www.discoverpuertorico.com/article/vejigante-mask-symbol-puerto-rican-heritage", quote: "The town's vejigante mask is easily recognizable by its round shape, made from coconuts, with long, thin wooden horns arranged like a crown around the head"}
    - {title: "Cesiach López Maldonado, Se monta la fiesta en Loíza, Primera Hora", url: "https://www.primerahora.com/entretenimiento/ph-mas-coge-calle/notas/se-monta-la-fiesta-en-loiza/", quote: "la máscara era de coco"}
- card: loiza-vejigantes
  fact: "The masks are said to bring the ancestors back from the other world"
  sources:
    - {title: "Discover Puerto Rico: The Vejigante Mask, a Symbol of Puerto Rican Heritage", url: "https://www.discoverpuertorico.com/article/vejigante-mask-symbol-puerto-rican-heritage", quote: "These masks are said to symbolize ancestors returning from the other world"}
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "it evokes the egungun quality of calling forth the ancestors and allowing them to return"}
- card: loiza-vejigantes
  fact: "Local carvers make them, among them Castor Ayala and his family"
  sources:
    - {title: "Lowell Fiet, Masked Enigmas, ReVista, Harvard Review of Latin America (2014)", url: "https://revista.drclas.harvard.edu/masked-enigmas", quote: "The artist Castor Ayala solidified the classical mask style in the 1950s, 60s, and 70s. His son Raúl (the most prominent artist of masks"}
    - {title: "Museo de las Américas: La cultura loiceña en tiempos de las fiestas en honor a Santiago Apóstol", url: "https://museolasamericas.org/en/la-cultura-loicena-en-tiempos-de-las-fiestas-en-honor-a-santiago-apostol", quote: "exhibe una extraordinaria colección de máscaras de vejigantes realizadas por una variedad de excelentes artesanos loiceños"}
    - {title: "Museo de las Américas: La cultura loiceña en tiempos de las fiestas en honor a Santiago Apóstol", url: "https://museolasamericas.org/en/la-cultura-loicena-en-tiempos-de-las-fiestas-en-honor-a-santiago-apostol", quote: "Castor y Carlos Ayala"}
- card: fete-des-cuisinieres
  fact: "The Fête des Cuisinières takes place each August in Pointe-à-Pitre, Guadeloupe"
  sources:
    - {title: "RCI Guadeloupe: Fête des Cuisinières en Guadeloupe, l'incontournable événement culturel gratuit de l'été (2026)", url: "https://rci.fm/guadeloupe/infos/Informations-pratiques/Fete-des-Cuisinieres-en-Guadeloupe-lincontournable-evenement-culturel", quote: "Chaque mois d'août, Pointe-à-Pitre se pare de madras et de couleurs pour célébrer la Fête des Cuisinières"}
    - {title: "Outremers360: Fête des Cuisinières de Guadeloupe 2026, 110 ans", url: "https://outremers360.com/bassin-atlantique-appli/fete-des-cuisinieres-de-guadeloupe-2026-110-ans-au-service-de-la-promotion-de-la-gastronomie-creole-et-de-sa-transmission", quote: "défilé en costumes traditionnels dans les rues de Pointe-à-Pitre en musique"}
- card: fete-des-cuisinieres
  fact: "It goes back to 1916, when cooks founded a mutual society to pay for decent funerals; their association has organised it since"
  sources:
    - {title: "RCI Guadeloupe: Fête des Cuisinières en Guadeloupe, l'incontournable événement culturel gratuit de l'été (2026)", url: "https://rci.fm/guadeloupe/infos/Informations-pratiques/Fete-des-Cuisinieres-en-Guadeloupe-lincontournable-evenement-culturel", quote: "La Fête des Cuisinières est organisée depuis 1916 par l'Association des cuisinières de Guadeloupe. À l'origine, il ne s'agissait pas d'un simple événement folklorique mais d'une véritable mutuelle"}
    - {title: "RCI Guadeloupe: Fête des Cuisinières en Guadeloupe, l'incontournable événement culturel gratuit de l'été (2026)", url: "https://rci.fm/guadeloupe/infos/Informations-pratiques/Fete-des-Cuisinieres-en-Guadeloupe-lincontournable-evenement-culturel", quote: "afin de garantir des obsèques dignes à leurs membres"}
    - {title: "Le Routard: Fête des cuisinières à Pointe-à-Pitre", url: "https://www.routard.com/fr/agenda/a/fete-des-cuisinieres-a-pointe-a-pitre", quote: "cette fête commémore surtout la création en 1916 de la 1e mutuelle des cuisinières"}
    - {title: "Outremers360: La ronde des cuisinières, 108e édition", url: "https://outremers360.com/bassin-atlantique-appli/la-ronde-des-cuisinieres-dans-les-rues-de-pointe-a-pitre-le-10-aout-prochain-pour-la-108eme-edition-de-la-fete-des-cuisinieres", quote: "Une mutuelle destinée au départ à financer des obsèques décentes aux cuisinières les plus démunies"}
- card: fete-des-cuisinieres
  fact: "It falls on the Saturday nearest 10 August, St Lawrence's day"
  sources:
    - {title: "RCI Guadeloupe: Fête des Cuisinières en Guadeloupe, l'incontournable événement culturel gratuit de l'été (2026)", url: "https://rci.fm/guadeloupe/infos/Informations-pratiques/Fete-des-Cuisinieres-en-Guadeloupe-lincontournable-evenement-culturel", quote: "elle se tient le samedi le plus proche du 10 août, jour de la Saint-Laurent, saint patron des cuisiniers et des rôtisseurs"}
    - {title: "Outremers360: La ronde des cuisinières, 108e édition", url: "https://outremers360.com/bassin-atlantique-appli/la-ronde-des-cuisinieres-dans-les-rues-de-pointe-a-pitre-le-10-aout-prochain-pour-la-108eme-edition-de-la-fete-des-cuisinieres", quote: "Elle se tient toujours aux environs du 10 août"}
- card: fete-des-cuisinieres
  fact: "St Lawrence, patron of cooks, was burned on a gridiron for refusing to hand over church money"
  sources:
    - {title: "Outremers360: Fête des Cuisinières de Guadeloupe 2026, 110 ans", url: "https://outremers360.com/bassin-atlantique-appli/fete-des-cuisinieres-de-guadeloupe-2026-110-ans-au-service-de-la-promotion-de-la-gastronomie-creole-et-de-sa-transmission", quote: "Saint-Laurent était un prêtre qui a fût brûlé sur un grill parce qu’il refusait de céder les biens de l’église à l’Etat"}
    - {title: "Outremers360: La ronde des cuisinières, 108e édition", url: "https://outremers360.com/bassin-atlantique-appli/la-ronde-des-cuisinieres-dans-les-rues-de-pointe-a-pitre-le-10-aout-prochain-pour-la-108eme-edition-de-la-fete-des-cuisinieres", quote: "Saint-Laurent de Rome, supplicié (brûlé à petit feu sur un gril) pour avoir refusé de céder les deniers de l’église réservés aux pauvres à l’empereur Valérien"}
    - {title: "Le Routard: Fête des cuisinières à Pointe-à-Pitre", url: "https://www.routard.com/fr/agenda/a/fete-des-cuisinieres-a-pointe-a-pitre", quote: "Saint Laurent était un prêtre qui fut brûlé sur un grill parce qu’il refusait de céder les bien de l’église à l’État"}
- card: fete-des-cuisinieres
  fact: "Mass at the cathedral of St Peter and St Paul, where cooks have dishes and utensils blessed in flowered baskets"
