# Batch c31 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a quote.
# Dropped (second check, 2026-11-14): Coachman "only American woman to win gold in athletics at the 1948 Games" (one valid source; see expand-c31-check.yaml).

- card: lumumba-tooth
  fact: "Lumumba led Congo to independence from Belgium in June 1960 and became its first prime minister"
  sources:
    - {title: "BBC News: DR Congo Covid spike delays return of Patrice Lumumba's tooth (13 June 2021)", url: "https://www.bbc.com/news/world-africa-57459055", quote: "He led Congo to independence from Belgium in June 1960 and became the country's first prime minister."}
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "On June 30, 1960, Lumumba delivered an explosive acceptance speech as prime minister"}
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "Lumumba became the newly independent Congo's first prime minister in 1960"}
- card: lumumba-tooth
  fact: "At the independence handover, before King Baudouin, he spoke bluntly of the contempt and violence suffered under Belgian rule"
  sources:
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "He reminded the king of the “contempt, insults, hangings and shootings” that Congolese were subjected to under Belgian rule."}
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "the prime minister spoke about the violence and degradation that the Congolese had suffered"}
- card: lumumba-tooth
  fact: "Within months he was deposed and jailed"
  sources:
    - {title: "BBC On This Day: 1961, Ex-Congo PM declared dead", url: "https://news.bbc.co.uk/onthisday/hi/dates/stories/february/13/newsid_2541000/2541053.stm", quote: "He was arrested in December by army leader Colonel Joseph Mobutu - who went on to take power - after being deposed in September by President Kasavubu."}
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "and jailed them in Thysville prison"}
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "Western powers did little to intervene as Lumumba was arrested and jailed"}
- card: lumumba-tooth
  fact: "In January 1961 he was flown to Katanga and shot by a firing squad"
  sources:
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "Lumumba and his companions were secretly beaten, removed from the prison, and flown to Katanga."}
    - {title: "BBC News: DR Congo Covid spike delays return of Patrice Lumumba's tooth (13 June 2021)", url: "https://www.bbc.com/news/world-africa-57459055", quote: "he was overthrown and jailed before being killed by firing squad in January 1961"}
    - {title: "BBC On This Day: 1961, Ex-Congo PM declared dead", url: "https://news.bbc.co.uk/onthisday/hi/dates/stories/february/13/newsid_2541000/2541053.stm", quote: "Patrice Lumumba and his ministers had been killed on 18 January, the day they were moved to Katanga"}
- card: lumumba-tooth
  fact: "His body was dug up, cut apart and dissolved in acid, leaving no grave"
  sources:
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "his body was then buried in a shallow grave, dug up, transported 200km (125 miles), interred again, exhumed and then hacked to pieces and finally dissolved in acid"}
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "Lumumba's body was dismembered and dissolved with acid in an apparent effort to keep any grave from becoming a pilgrimage site"}
    - {title: "BBC Correspondent: Who Killed Lumumba? (transcript, 2000)", url: "https://news.bbc.co.uk/hi/english/static/audio_video/programmes/correspondent/transcripts/974745.txt", quote: "We hacked them in pieces and put them into the acid."}
- card: lumumba-tooth
  fact: "Belgian police commissioner Gerard Soete, who oversaw the destruction, kept a gold-capped tooth and later admitted it"
  sources:
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "The Belgian police commissioner, Gerard Soete, who oversaw and participated in the destruction of the remains took the tooth, he later admitted."}
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "The Belgian policeman, Gerard Soete, who oversaw the disposal of Lumumba's body, took the gold-crowned tooth back to Brussels as a trophy."}
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "the Belgian police commissioner who said he took it after overseeing the destruction of Lumumba's body"}
- card: lumumba-tooth
  fact: "The tooth (a gold-capped tooth) is all that remains of Lumumba"
  sources:
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "A gold-crowned tooth is all that remains of assassinated Congolese independence hero Patrice Lumumba."}
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "All that remained of Lumumba’s body was a gold-crowned tooth."}
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "Belgian authorities on Monday returned a gold-capped tooth belonging to the slain Congolese independence hero Patrice Lumumba"}
- card: lumumba-tooth
  fact: "In 2016 the tooth was still with Soete's daughter"
  sources:
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "The tooth was seized by Belgian officials in 2016 from the daughter of the Belgian police commissioner"}
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "Gerard Soete's daughter showed the tooth, in a padded box, to a photographer in 2016"}
- card: lumumba-tooth
  fact: "No DNA test was made, so it cannot be proved the tooth is Lumumba's"
  sources:
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "there is no absolute certainty that the tooth being returned is Lumumba's since no DNA test could be conducted"}
    - {title: "BBC News: DR Congo Covid spike delays return of Patrice Lumumba's tooth (13 June 2021)", url: "https://www.bbc.com/news/world-africa-57459055", quote: "even though no DNA tests had been carried out to confirm it was Lumumba's"}
- card: lumumba-tooth
  fact: "A Belgian parliamentary inquiry in 2001 found members of the government of the day morally responsible for the circumstances that led to the killing"
  sources:
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "A Belgian parliamentary probe later determined that the government was \"morally responsible\" for Lumumba's death."}
    - {title: "BBC On This Day: 1961, Ex-Congo PM declared dead", url: "https://news.bbc.co.uk/onthisday/hi/dates/stories/february/13/newsid_2541000/2541053.stm", quote: "A Belgian Government inquiry into the murders reported in November 2001 that they would not have taken place without the complicity of Belgian and American intelligence services."}
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "the inquiry found that certain members of the government \"were morally responsible for circumstances leading to the death\""}
- card: lumumba-tooth
  fact: "Belgium apologised in 2002"
  sources:
    - {title: "BBC On This Day: 1961, Ex-Congo PM declared dead", url: "https://news.bbc.co.uk/onthisday/hi/dates/stories/february/13/newsid_2541000/2541053.stm", quote: "In February 2002 the Belgian Government made its first official apology for its part in the assassinations"}
    - {title: "BBC News: DR Congo Covid spike delays return of Patrice Lumumba's tooth (13 June 2021)", url: "https://www.bbc.com/news/world-africa-57459055", quote: "In 2002, Belgium admitted responsibility for its part in the killing"}
    - {title: "NPR Morning Edition: Belgian Apology (15 February 2002)", url: "https://www.npr.org/2002/02/15/1138123/belgian-apology", quote: "Commentator Kenneth Wiwa talks about Belgium's public apology for its part in the 1961 assassination of Congolese leader Patrice Lumumba."}
- card: lumumba-tooth
  fact: "On 20 June 2022 the tooth was handed to Lumumba's family in a coffin in Brussels"
  sources:
    - {title: "AP via CBS News: Belgium returns Lumumba's gold-capped tooth to his family (20 June 2022)", url: "https://www.cbsnews.com/news/patrice-lumumba-assassination-1961-tooth-returned-by-belgium-congo-hero-family", quote: "his only remains, a tooth, are handed over to the family, in Brussels, Belgium June 20, 2022"}
    - {title: "Damian Zane, BBC News: Why Belgium is returning a Congolese hero's golden tooth (20 June 2022)", url: "https://www.bbc.com/news/world-africa-61838781", quote: "A coffin containing Patrice Lumumba's gold tooth was passed to his family members at a ceremony in Brussels"}
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "On June 20, 2022, more than 60 years after his assassination, Belgium finally returned Lumumba's tooth to his family at a ceremony held in Brussels."}
- card: lumumba-tooth
  fact: "On 30 June 2022 it was buried in a mausoleum in Kinshasa, with the president present"
  sources:
    - {title: "New York Public Library research guide: Patrice Lumumba, biography", url: "https://libguides.nypl.org/lumumba/biography", quote: "On June 30, 2022, a funeral was held for Lumumba in Kinshasa, where President Félix Tshisekedi of Congo gave the following prayer"}
    - {title: "Damian Zane, BBC News: DR Congo buries tooth of independence hero (30 June 2022)", url: "https://www.bbc.com/news/world-africa-61993601", quote: "President Félix Tshisekedi, Lumumba's family and other dignitaries were at the private service which took place before the coffin was transferred to a specially built mausoleum."}
- card: recy-taylor
  fact: "Recy Taylor was a 24-year-old mother in Abbeville, Alabama, in 1944"
  sources:
    - {title: "NPR, Tell Me More: Hidden Pattern Of Rape Helped Stir Civil Rights Movement (28 February 2011)", url: "https://www.npr.org/templates/story/story.php?storyId=134131369", quote: "Recy Taylor was a 24-year-old mother when she was abducted at gunpoint and gang raped by a group of white men in Alabama in 1944."}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "Recy Taylor, a 24-year-old Black, married mother, was walking with neighbors, headed home from a revival service at Rock Hill Holiness Church in Abbeville, Alabama."}
- card: recy-taylor
  fact: "On the night of 3 September 1944 she was walking home from a service at Rock Hill Holiness Church"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "It was nearly midnight on September 3, 1944, when Mrs. Recy Taylor left the Rock Hill Holiness Church in Abbeville, Alabama to walk home"}
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "On September 3, 1944 however, Taylor decided to attend a special evening service at Rock Hill Holiness Church"}
- card: recy-taylor
  fact: "Armed white men in a car forced her in at gunpoint"
  sources:
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "the man pointed a shotgun at them and forced Taylor to get into the car at gunpoint"}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "Seven white men exited the car with guns and knives."}
    - {title: "NPR, Tell Me More: Hidden Pattern Of Rape Helped Stir Civil Rights Movement (28 February 2011)", url: "https://www.npr.org/templates/story/story.php?storyId=134131369", quote: "abducted at gunpoint"}
- card: recy-taylor
  fact: "Six of them raped her in the woods and left her on the highway"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "Lovett was the first of six men who raped Taylor that night. After they were finished, they blindfolded her and dropped her off on the highway."}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "After six of the men took turns raping her, they blindfolded her, drove her back to the road, and left her to walk home."}
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "She was then dumped out of the car on the side of the highway."}
- card: recy-taylor
  fact: "She reported the attack, and the car's owner gave the sheriff the others' names"
  sources:
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "He gave up the names of his accomplices"}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "Wilson gave up the names of his accomplices"}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "Hugo Wilson, the owner of the car, identified the six white men who raped Mrs. Taylor"}
- card: recy-taylor
  fact: "None of the six men was arrested"
  sources:
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "Yet none of the men were arrested."}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "The other men were not brought in or ever arrested."}
- card: recy-taylor
  fact: "Her house was firebombed"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "The day after it was reported her home was firebombed as the family slept."}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "her home was firebombed by white supremacists"}
- card: recy-taylor
  fact: "The NAACP in Montgomery sent its investigator Rosa Parks"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "They responded by sending their best investigator and antirape activist—Rosa Parks."}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "the chapter president sent NAACP Secretary Rosa Parks to investigate"}
    - {title: "Wynne Davis, NPR: How Recy Taylor Spoke Out Against Her Rape, Decades Before #MeToo (8 January 2018)", url: "https://www.npr.org/2018/01/08/576566358/how-recy-taylor-spoke-out-against-her-rape-decades-before-metoo", quote: "when people at the NAACP heard about it they sent out an activist, Rosa Parks, to investigate"}
- card: recy-taylor
  fact: "Parks organised a Committee for Equal Justice for Mrs. Recy Taylor that drew national support"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "she formed the Alabama Committee for Equal Justice for Mrs. Recy Taylor"}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "Mrs. Parks established the Committee for Equal Justice to demand prosecution of Mrs. Taylor’s attackers."}
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "The NAACP and African Americans around the country continued to advocate for justice for Recy Taylor."}
- card: recy-taylor
  fact: "An all-white, all-male grand jury refused to indict in October 1944"
  sources:
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "On October 3 and 4, 1944, the all-white, all-male Henry County Grand Jury took up Taylor’s case."}
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "On October 3-4, 1944 an all-white, all-male grand jury heard Taylor’s case. After five minutes of deliberation, the jury dismissed the case."}
- card: recy-taylor
  fact: "A second all-white, all-male grand jury refused to indict on 14 February 1945"
  sources:
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "on February 14, 1945, an all-white, all-male grand jury failed to return an indictment against any of the men accused of raping Mrs. Taylor"}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "The case was heard by an all-white, all-male jury on February 14, 1945. They refused to issue an indictment."}
- card: recy-taylor
  fact: "After Danielle McGuire's book At the Dark End of the Street, the Alabama Legislature apologised in 2011"
  sources:
    - {title: "Wynne Davis, NPR: How Recy Taylor Spoke Out Against Her Rape, Decades Before #MeToo (8 January 2018)", url: "https://www.npr.org/2018/01/08/576566358/how-recy-taylor-spoke-out-against-her-rape-decades-before-metoo", quote: "Taylor received a formal apology from the state of Alabama nearly 60 years later, in 2011, after historian Danielle McGuire published a book, At the Dark End of the Street"}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "In 2011, the Alabama Legislature apologized to Mrs. Taylor for the state’s failure to prosecute her attackers."}
    - {title: "Kerri Lee Alexander, National Women's History Museum: Recy Taylor", url: "https://www.womenshistory.org/education-resources/biographies/recy-taylor", quote: "As a result, the Alabama Legislature issued a formal apology to Taylor"}
- card: recy-taylor
  fact: "She died in Abbeville in 2017, at 97"
  sources:
    - {title: "Wynne Davis, NPR: How Recy Taylor Spoke Out Against Her Rape, Decades Before #MeToo (8 January 2018)", url: "https://www.npr.org/2018/01/08/576566358/how-recy-taylor-spoke-out-against-her-rape-decades-before-metoo", quote: "Taylor died on Dec. 28, 2017, at 97 in Abbeville, three days before her 98th birthday."}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "Place of Death: Abbeville, Alabama Date of Death: December 28, 2017"}
- card: recy-taylor
  fact: "Parks's own arrest eleven years later (1955) set off the Montgomery bus boycott"
  sources:
    - {title: "AP via NPR: She refused to move bus seats months before Rosa Parks. At 82, her arrest is expunged (16 December 2021)", url: "https://www.npr.org/2021/12/16/1064890661/claudette-colvin-rosa-parks-arrest-record-expunged", quote: "Parks, a 42-year-old seamstress and activist with the NAACP, gained worldwide notice after refusing to give up her bus seat to a white man on Dec. 1, 1955. Her treatment led to the yearlong Montgomery Bus Boycott"}
    - {title: "National Park Service: Mrs. Recy Taylor (1919-2017)", url: "https://home.nps.gov/people/mrsrecytaylor1919-2017.htm", quote: "Leaders of the CEJRT, like Rosa Parks and E.D. Dixon, would later form the Montgomery Improvement Association, which was responsible for the 1955 bus boycotts."}
- card: recy-taylor
  fact: "In Alabama a white accuser could send Black youths to death row (Scottsboro), while a Black woman's testimony could not bring white men to trial"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "all-white juries delivered guilty verdicts that initially carried the death penalty"}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "The boys were convicted by all-white juries. Eight were sentenced to death"}
    - {title: "Equal Justice Initiative, A History of Racial Injustice: 14 February 1945", url: "https://calendar.eji.org/racial-injustice/feb/14", quote: "an all-white, all-male grand jury failed to return an indictment against any of the men accused of raping Mrs. Taylor"}
- card: viola-desmond
  fact: "Black Nova Scotians routinely met racism, including segregated schools and cinemas"
  sources:
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "she confronted the anti-Black racism that African Nova Scotians routinely faced"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "she worked as a teacher in segregated schools for African-Canadian students"}
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "After a short period teaching in two racially-segregated schools for Black students"}
- card: viola-desmond
  fact: "Viola Desmond was born in Halifax in 1914"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "born 6 July 1914 in Halifax"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "Viola Desmond was born in 1914, the daughter of a middle-class family in Halifax."}
- card: viola-desmond
  fact: "She trained in Montreal and New York because few Canadian schools accepted Black students"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "she began a program of study at the Field Beauty Culture School in Montreal , one of the few such institutions in Canada at the time that accepted Black applicants. She continued her training in Atlantic City and in New York."}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "she attended the Field Beauty Culture School in Montréal, one of the few schools accepting African-Canadian students at the time. After completing her training in New York"}
- card: viola-desmond
  fact: "She ran her own beauty studio and school in Halifax and sold products for Black women"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "She opened a beauty school, the Desmond School of Beauty Culture, to train women and expanded her business across the province. (Desmond created a line of beauty products"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "she opened ‘Vi’s Studio of Beauty Culture’ in Halifax. An entrepreneur, she sold beauty products for African-Canadian women"}
- card: viola-desmond
  fact: "On 8 November 1946 her car broke down in New Glasgow on a business trip to Sydney and she went to the Roseland Theatre"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "On the evening of 8 November 1946, Viola Desmond made an unplanned stop in the small community of New Glasgow after her car broke down on her way to a business meeting in Sydney"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "In November 1946, while travelling on business from Halifax to Sydney, Nova Scotia, car trouble forced Desmond to stop overnight in New Glasgow, where she decided to go to the Roseland Theatre to see a film."}
- card: viola-desmond
  fact: "She asked for a main-floor seat, was sold a balcony ticket (seating for Black patrons), and sat downstairs anyway"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "The ticket seller handed Desmond a ticket to the balcony instead, the seating generally reserved for non-White customers."}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "When informed that the theatre would only sell her a balcony ticket, she took a seat on the floor anyway."}
- card: viola-desmond
  fact: "She was dragged out and held in a cell overnight"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "Desmond was dragged out of the theatre, injuring her hip and knee in the process, and taken to jail."}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "she was forcibly removed, arrested, held in jail overnight, and then charged, tried, and convicted"}
- card: viola-desmond
  fact: "She was convicted the next morning of evading one cent of tax, the difference between the two seats"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "charged with attempting to defraud the provincial government based on her alleged refusal to pay a one cent amusement tax"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "That charge, based on the one cent difference in tax between floor and balcony seats"}
- card: viola-desmond
  fact: "The Nova Scotia Association for the Advancement of Coloured People backed her appeal, which the Supreme Court of Nova Scotia rejected in 1947"
  sources:
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "the newly established Nova Scotia Association for the Advancement of Coloured People (NSAACP), which unsuccessfully contested her conviction"}
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "on 20 January 1947, ruled against Desmond"}
- card: viola-desmond
  fact: "Desmond died in New York in 1965"
  sources:
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "died 7 February 1965 in New York, NY"}
    - {title: "Province of Nova Scotia: Late Viola Desmond Granted Apology, Free Pardon (15 April 2010)", url: "https://novascotia.ca/news/smr/2010-04-15-pardon.asp", quote: "Mrs. Desmond passed away in 1965."}
- card: viola-desmond
  fact: "In 2010 Nova Scotia granted her a free pardon and apologised"
  sources:
    - {title: "Province of Nova Scotia: Late Viola Desmond Granted Apology, Free Pardon (15 April 2010)", url: "https://novascotia.ca/news/smr/2010-04-15-pardon.asp", quote: "The province has granted an official apology and free pardon to the late Viola Desmond."}
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "On 15 April 2010, Viola Desmond was granted a free pardon by Nova Scotia Lieutenant-Governor Mayann Francis"}
    - {title: "Parks Canada: Viola Desmond (1914-1965), National Historic Person", url: "https://parks.canada.ca/culture/designation/personnage-person/viola-desmond", quote: "In 2010, the Government of Nova Scotia issued an apology and a posthumous pardon"}
- card: viola-desmond
  fact: "On 19 November 2018 the Bank of Canada issued a $10 note with her portrait, the first Canadian woman to appear on her own on a Canadian banknote"
  sources:
    - {title: "Bank of Canada: New vertical $10 bank note featuring iconic Canadian Viola Desmond now in circulation (19 November 2018)", url: "https://www.bankofcanada.ca/2018/11/new-vertical-10-bank-note-featuring-iconic-canadian-viola-desmond/", quote: "The Bank of Canada today issued the new vertical $10 bank note featuring the portrait of social justice icon Viola Desmond"}
    - {title: "Bank of Canada: New vertical $10 bank note featuring iconic Canadian Viola Desmond now in circulation (19 November 2018)", url: "https://www.bankofcanada.ca/2018/11/new-vertical-10-bank-note-featuring-iconic-canadian-viola-desmond/", quote: "we honour her as the first Canadian woman to appear on a bank note"}
    - {title: "The Canadian Encyclopedia: Viola Desmond", url: "https://www.thecanadianencyclopedia.ca/en/article/viola-desmond", quote: "Viola Desmond would be the first Canadian woman to be featured by herself on the face of a banknote — the $10 note released on 19 November 2018"}
- card: alice-coachman
  fact: "In the segregated South (Georgia) she was barred from public sports facilities"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "Barred from public sports facilities because of her race"}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "she was barred from public sports facilities because of her colour"}
- card: alice-coachman
  fact: "Born in Albany, Georgia, in 1923, the fifth of ten children"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "Born on November 9, 1923, in Albany , the fifth of Fred and Evelyn Coachman’s ten children"}
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "Alice Coachman was born on November 9, 1923 in Albany, Georgia. She was the fifth of ten children"}
- card: alice-coachman
  fact: "She trained barefoot, jumping over ropes and sticks"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "She ran barefoot on dusty roads to improve her stamina and used sticks and rope to practice the high jump."}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "often running and jumping barefoot, sometimes using ropes or tied-up rags for crossbars as she practiced her jumps"}
- card: alice-coachman
  fact: "Her father wanted her to sit on the porch and be ladylike"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "preferring that she sit on the front porch and look “dainty.”"}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "Her father believed that girls should be dainty and sit on the porch"}
- card: alice-coachman
  fact: "A teacher and an aunt encouraged her"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "Coachman received encouragement from her fifth-grade teacher, Cora Bailey, at Monroe Street Elementary School and from her aunt, Carrie Spry"}
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "It was her fifth-grade teacher at Monroe Street Elementary School, Cora Bailey, and her aunt, Carrie Spry, who encouraged her to continue running."}
- card: alice-coachman
  fact: "Tuskegee Institute took her in"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "She quickly attracted the attention of the Tuskegee Institute, in Tuskegee, Alabama, where she enrolled in the high school program in 1939."}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "Coachman was discovered, though, at a meet at Tuskegee Institute."}
- card: alice-coachman
  fact: "From 1939 she won the national high-jump title year after year"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "High jump was her event, and from 1939 to 1948 she won the American national title annually."}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "She went on to win the national championships in the high jump 10 years in a row"}
- card: alice-coachman
  fact: "The Olympics of 1940 and 1944 were cancelled by the war, in her prime"
  sources:
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "The games were canceled in 1940 and 1944 due to World War II, cheating her of her turn to compete in her prime."}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "the Games were not held in 1940 or 1944 because of World War Two"}
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "In 1940 and 1944, the games were canceled due to World War II."}
- card: alice-coachman
  fact: "In 1948 she made the team despite a back injury"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "she qualified easily despite a back injury"}
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "She eventually attended the trials and, while competing with a back injury, destroyed the existing US high jump record."}
- card: alice-coachman
  fact: "At Wembley in August 1948 she cleared 5 ft 6 1/8 in on her first attempt, an Olympic record"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "On a rainy afternoon at Wembley Stadium in London in August 1948, Coachman competed for her Olympic gold in the high jump. She became the Gold Medalist when she cleared the 5 feet 6 1/8-inch bar on her first attempt. It was a new Olympic record."}
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "She defeated her closest competitor, the British high jumper Dorothy Tyler, on the first jump of the finals, setting a record of 5 feet 6 1/8 inches."}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "she set a new Olympic record, winning gold in the high jump at the 1948 London Games"}
- card: alice-coachman
  fact: "King George VI put the gold medal around her neck"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "King George VI of Great Britain put the medal around her neck."}
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "King George VI personally presented the gold medal to her."}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "Coachman was awarded her gold medal in London by King George VI."}
- card: alice-coachman
  fact: "She was the first Black woman from any country to win Olympic gold"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "Alice Coachman was the first Black woman from any country to win an Olympic gold medal."}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "The first black woman to win an Olympic gold medal, Alice Coachman Davis, has died"}
- card: alice-coachman
  fact: "Albany gave her a motorcade"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "was honored with a motorcade traveling from Atlanta to Albany"}
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "She also got a 175-mile motorcade from Atlanta to Albany"}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "she was honoured with a long motorcade"}
- card: alice-coachman
  fact: "The hall where she was honoured was segregated and the mayor would not shake her hand"
  sources:
    - {title: "National Women's History Museum: Alice Coachman", url: "https://www.womenshistory.org/education-resources/biographies/alice-coachman", quote: "The white mayor of Albany sat on the stage with Coachman but refused to shake her hand."}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "her hero's welcome back home in Albany, Ga. — a segregated event where the mayor refused to share her hand"}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "the black and white audiences were segregated at her official ceremony in Albany"}
- card: alice-coachman
  fact: "She retired at 25"
  sources:
    - {title: "Lisa A. Ennis, New Georgia Encyclopedia: Alice Coachman (1923-2014)", url: "https://www.georgiaencyclopedia.org/articles/sports-outdoor-recreation/alice-coachman-1923-2014/", quote: "After her Olympic victory she retired from athletics, even though she was only twenty-five"}
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "before retiring, aged 25, after winning the Olympic gold medal"}
- card: alice-coachman
  fact: "She died in 2014, aged 90"
  sources:
    - {title: "BBC News: US black female gold Olympian Alice Coachman Davis dies (15 July 2014)", url: "https://www.bbc.com/news/world-us-canada-28309527", quote: "has died in the US at the age of 90"}
    - {title: "Alan Greenblatt, NPR Code Switch: Why An African-American Sports Pioneer Remains Obscure (19 July 2014)", url: "https://www.npr.org/blogs/codeswitch/2014/07/19/332665921/why-an-african-american-sports-pioneer-remains-obscure", quote: "Davis died on Monday at age 90 from cardiac arrest."}
- card: althea-gibson
  fact: "Black players were shut out of major American tennis and played in the American Tennis Association"
  sources:
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "in a country segregated by race, she was denied opportunities outside of the ATA that were afforded to white tennis players"}
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Initially, Gibson played in the American Tennis Association (ATA), the oldest African-American sports organization in the United States, established in 1916 as the black equivalent to the United States Lawn Tennis Association."}
- card: althea-gibson
  fact: "Born in 1927 to sharecroppers in Silver, South Carolina; grew up in Harlem"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "Althea Gibson was born on August 25, 1927, to Daniel and Annie Bell Gibson, sharecroppers on a cotton farm near Silver, South Carolina. In 1930, the family moved to Harlem"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "Althea Gibson was born on August 25th, 1927, to sharecroppers Daniel and Annie Bell Gibson. The family lived in Silver, South Carolina"}
- card: althea-gibson
  fact: "At twelve she won the New York City women's paddle-tennis championship"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "by 1939, at the age of twelve, she won the New York City, New York women’s paddle tennis championship"}
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "said to have won the New York City women’s paddle championship at the precocious age of 12"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "the New York City women’s paddle championship, where Gibson won at 12 years old"}
- card: althea-gibson
  fact: "Neighbours and members of the Cosmopolitan Tennis Club paid for her junior membership"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "a group of Gibson’s neighbors took up a collection to finance her junior membership at the Cosmopolitan Tennis Club in Harlem"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "those at the Cosmopolitan “chipped in to provide her a junior membership and lessons by the club professional,”"}
- card: althea-gibson
  fact: "From 1947 she won ten straight ATA national titles"
  sources:
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "in 1947 won the first of ten straight ATA national women’s titles"}
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "she won the first of ten straight titles beginning in 1947"}
- card: althea-gibson
  fact: "Alice Marble argued in print for her inclusion"
  sources:
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Writing in the July 1950 issue of American Lawn Tennis magazine, Marble said, “If Althea Gibson represents a challenge to the present crop of players, then it’s only fair that they meet this challenge on the courts.”"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "Marble wrote in support of Gibson in American Lawn Tennis"}
- card: althea-gibson
  fact: "In 1950 she became the first Black player at the US National Championships"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "In 1950, Gibson became the first black player to compete in the United States National Championships"}
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Althea Gibson became the first African-American to compete at the U.S. National Championships"}
- card: althea-gibson
  fact: "She won the French Championships in 1956"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "In 1956, Gibson became the first African American to win the French Open."}
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Five were in singles: the French in 1956"}
- card: althea-gibson
  fact: "In July 1957 she became the first Black woman to win Wimbledon"
  sources:
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "the first Black woman to win the U.S. Nationals, French Championship, and Wimbledon"}
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "In July 1957, she won Wimbledon"}
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Gibson held the distinction of being the only woman of color to win a major championship for 15 years"}
- card: althea-gibson
  fact: "She received the Wimbledon trophy from Queen Elizabeth II"
  sources:
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "After her Wimbledon win, she received the Venus Rosewater Dish from Queen Elizabeth II."}
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "received the trophy personally from Queen Elizabeth"}
- card: althea-gibson
  fact: "New York welcomed her home with a parade"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "when she returned to New York City, she became only the second athlete, after Jesse Owens , to receive a ticker tape parade"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "New York City welcomed her with a parade"}
- card: althea-gibson
  fact: "In 1958 she won Wimbledon and the US title again"
  sources:
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "Wimbledon in 1957 and 1958, and the U.S. Nationals in 1957 and 1958"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "Gibson would go on to repeat each of these wins in 1958"}
- card: althea-gibson
  fact: "She left amateur tennis to earn a living, but women's professional tennis paid little"
  sources:
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "The No. 1 ranked player in the world then retired and turned professional. However, there wasn’t much money to be made in professional women’s tennis"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "In 1958, she decided to no longer engage in amateur matches and sought out professional opportunities to make ends meet."}
    - {title: "Encyclopaedia Britannica: Althea Gibson", url: "https://www.britannica.com/biography/Althea-Gibson", quote: "she turned professional following her 1958 Forest Hills win. However, there being few tournaments and prizes for women at that time, she took up professional golf in 1964"}
- card: althea-gibson
  fact: "She tried a singing career"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "after unsuccessful attempts to start acting and singing careers"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "she recorded a jazz album"}
- card: althea-gibson
  fact: "In 1964, at 37, she became the first African American woman on the LPGA tour"
  sources:
    - {title: "International Tennis Hall of Fame: Althea Gibson", url: "https://www.tennisfame.com/hall-of-famers/inductees/althea-gibson", quote: "in 1964, at age 37, became the first African-American woman to join the Ladies Professional Golf Association (LPGA)"}
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "In 1964 after unsuccessful attempts to start acting and singing careers, Gibson at the age of thirty-seven became the first black woman to join the Ladies Professional Golf Association (LPGA) tour."}
- card: althea-gibson
  fact: "She died in 2003 at 76"
  sources:
    - {title: "Zanice Bond, BlackPast: Althea Gibson (1927-2003)", url: "https://www.blackpast.org/african-american-history/gibson-althea-1927-2003/", quote: "On September 28, 2003 Althea Gibson died at the age of seventy-six"}
    - {title: "Shay Dawson, National Women's History Museum: Althea Gibson", url: "https://www.womenshistory.org/education-resources/biographies/althea-gibson", quote: "She passed away in 2003 at the age of 76"}
- card: katherine-johnson
  fact: "Born in White Sulphur Springs, West Virginia, in 1918"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "Born in White Sulphur Springs, West Virginia, in 1918"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "Born in White Sulfur Springs, West Virginia, in 1918"}
- card: katherine-johnson
  fact: "She was a teacher before joining Langley"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "She returned to teaching when her three daughters got older"}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "she worked as a substitute mathematics school teacher and applied for a position at NACA"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "After time as a teacher and stay-at-home mom, she went to work for the NACA"}
- card: katherine-johnson
  fact: "She joined the all-Black West Area Computing section at NACA Langley in 1953"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "open positions at the all-black West Area Computing section at the National Advisory Committee for Aeronautics’ (NACA’s) Langley laboratory"}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "When she began working at NACA Katherine was assigned to the office which housed the black \"computers\""}
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "Katherine began work at Langley in the summer of 1953"}
- card: katherine-johnson
  fact: "When NACA became NASA she did trajectory analysis, including for Alan Shepard's May 1961 flight, the first American in space"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "She did trajectory analysis for Alan Shepard’s May 1961 mission Freedom 7 , America’s first human spaceflight."}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "was used for the famous space flight by Alan Shepard in May 1961"}
- card: katherine-johnson
  fact: "In February 1962 Glenn's Friendship 7 orbit was computed by electronic computers"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "The computers had been programmed with the orbital equations that would control the trajectory of the capsule in Glenn’s Friendship 7 mission"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "Even when NASA turned to electronic computers to tabulate trajectories"}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "the flight of John Glenn in February 1962"}
- card: katherine-johnson
  fact: "Glenn asked that Johnson personally check the computer's numbers by hand before climbing aboard; she did and he flew"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "Glenn asked engineers to “get the girl”—Johnson—to run the same numbers through the same equations that had been programmed into the computer, but by hand"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "John Glenn now-famously asked that Katherine personally recheck the calculations on his flight before climbing aboard Friendship 7"}
- card: katherine-johnson
  fact: "She later worked on Apollo"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "the calculations that helped synch Project Apollo’s Lunar Module with the lunar-orbiting Command and Service Module"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "the same year Johnson calculated the trajectories for the first Moon landing"}
- card: katherine-johnson
  fact: "She retired in 1986 after 33 years"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "She retired in 1986, after 33 years at Langley."}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "Johnson worked at the agency until 1986 , when she retired after 33 years of service."}
- card: katherine-johnson
  fact: "In 2015, at 97, she received the Presidential Medal of Freedom"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "In 2015, at age 97, Johnson added another extraordinary achievement to her long list: President Barack Obama awarded her the Presidential Medal of Freedom"}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "On 16 November 2015 , she received the Presidential Medal of Freedom from President Barack Obama."}
- card: katherine-johnson
  fact: "The book and film Hidden Figures made her widely known"
  sources:
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "in 2016 with the release of the book by Margot Lee Shetterly and the film Hidden Figures , which became a cultural touchstone"}
    - {title: "MacTutor History of Mathematics, University of St Andrews: Katherine Johnson", url: "https://mathshistory.st-andrews.ac.uk/Biographies/Johnson_Katherine/", quote: "She was featured in the 2017 film Hidden figures"}
- card: katherine-johnson
  fact: "She died in 2020, at 101"
  sources:
    - {title: "Margot Lee Shetterly, NASA: Katherine Johnson Biography", url: "https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/", quote: "Katherine Johnson passed away this morning at 101 years old"}
    - {title: "Ellen R. Stofan, National Air and Space Museum: Katherine Johnson Calculated Flight Paths for NASA and Continues To Inspire (25 February 2020)", url: "https://airandspace.si.edu/stories/editorial/katherine-johnson", quote: "When Katherine Johnson passed away at the age of 101 in February 2020"}
- card: scottsboro
  fact: "On 25 March 1931 a fight broke out between Black and white youths on a freight train in Jackson County, Alabama, during the Depression"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "The saga began on March 25, 1931, when a fight broke out between groups of young black and white passengers riding a freight train through Jackson County ."}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "In March 1931, during the Great Depression, the boys were travelling by train through northern Alabama among a group of hobos, both black and white. A fight broke out"}
- card: scottsboro
  fact: "The train was stopped at Paint Rock and nine Black youths, the youngest 13, were arrested"
  sources:
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "in Paint Rock, Alabama, and nine black youths are arrested for assault"}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "When the train stopped just outside the town of Paint Rock, local police and a mob apprehended nine African Americans ranging in age from 13 to 20."}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "Nine black teenagers ranging in age from 13-19 were arrested."}
- card: scottsboro
  fact: "Two white women, Victoria Price and Ruby Bates, fearing charges themselves, falsely accused them of rape"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "In the hope of avoiding vagrancy and morality charges, the women falsely accused the nine young black men"}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "The young women worried they might be accused of prostitution, so they accused the black boys of having raped them."}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "Rape charges are added, following accusations from two white women who have also come off the train, Victoria Price and Ruby Bates."}
- card: scottsboro
  fact: "The National Guard was called in to protect the Scottsboro jail"
  sources:
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "Governor Miller in turn calls in the National Guard to protect the jail and its prisoners."}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "Gov. Benjamin Meek Miller sent the Alabama National Guard to Scottsboro to prevent a lynching."}
- card: scottsboro
  fact: "Within days all-white juries convicted eight and sentenced them to death; the trial of the youngest, 13-year-old Roy Wright, ended in a hung jury"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "The first set of trials took place in four groups over the course of just four days in early April 1931."}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "Eight defendants were sentenced to death"}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "The boys were convicted by all-white juries. Eight were sentenced to death but none was ever executed."}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "the jury split over whether to sentence the youngest defendant, 13-year-old Roy Wright, to death or life imprisonment, and a mistrial was declared"}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "The case against Roy Wright, aged 13, ends in a hung jury"}
- card: scottsboro
  fact: "The International Labor Defense took over their defence and won a stay of execution"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "ILD lawyers quickly won the trust of the defendants and their parents, as well as a stay of execution until the case could be reviewed by the Alabama Supreme Court ."}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "The National Association for the Advancement of Colored People (NAACP) and the International Labor Defense (I.L.D.) court the defendants, their parents, and public opinion for the right to represent the young men in an appeal"}
- card: scottsboro
  fact: "The Supreme Court overturned the convictions in 1932 for denial of counsel"
  sources:
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "overturned convictions for some of them in 1932 on the grounds that the teenagers were denied competent legal counsel"}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "In Powell v. Alabama, the U.S. Supreme Court rules that the defendants were denied the right to counsel"}
- card: scottsboro
  fact: "In 1935 the Supreme Court overturned them again because Black people were excluded from juries"
  sources:
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "and again in 1935 because African Americans were not allowed to serve as jurors during the trials"}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "ruling in Patterson v. Alabama and Norris v. Alabama that the defendants were denied a fair trial because African Americans had been systematically excluded from Jackson County jury rolls"}
- card: scottsboro
  fact: "In 1933 Ruby Bates recanted in court"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "Bates recanted her story and agreed to testify for the defense"}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "Ruby Bates appears as a surprise witness for the defense, denying that any rape occurred"}
- card: scottsboro
  fact: "None was executed"
  sources:
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "Eight were sentenced to death but none was ever executed."}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "Ozie Powell was paroled in 1946; Haywood Patterson escaped from prison in 1948. Norris, the last surviving defendant, was finally pardoned in 1976."}
- card: scottsboro
  fact: "In 1937 charges against four of them were dropped; the others spent years in prison"
  sources:
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "Rape charges against the last four defendants, Olen Montgomery, Willie Roberson, Eugene Williams, and Roy Wright, are dropped."}
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "all charges against the other four defendants—Roy Wright, Olen Montgomery, Willie Roberson, and Eugene Williams—were dropped"}
- card: scottsboro
  fact: "Clarence Norris, the last survivor, was pardoned in 1976"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "Norris, the last surviving defendant, was finally pardoned in 1976."}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "Clarence Norris received a pardon from Alabama Governor George Wallace in 1976. Norris, the last surviving Scottsboro Boy, died in 1989."}
    - {title: "PBS American Experience, Scottsboro: An American Tragedy: timeline", url: "https://www.pbs.org/wgbh/americanexperience/features/scottsboronine-black-youth-arrested-for-assault/", quote: "Clarence Norris is pardoned by Alabama Governor George Wallace"}
- card: scottsboro
  fact: "In 2013 Alabama passed a law to clear them, and in November the parole board pardoned the last three"
  sources:
    - {title: "Encyclopedia of Alabama: Scottsboro Trials", url: "https://encyclopediaofalabama.org/article/scottsboro-trials/", quote: "On November 21, 2013, the Alabama Board of Pardons and Paroles voted unanimously to pardon Haywood Patterson, Charlie Weems, and Andy Wright"}
    - {title: "BBC News: Alabama posthumously pardons three Scottsboro Boys (21 November 2013)", url: "https://www.bbc.co.uk/news/world-us-canada-25046096", quote: "The Alabama state legislature passed a law earlier this year allowing the parole board to grant the Scottsboro Boys posthumous pardons."}
- card: marian-anderson-1939
  fact: "In 1939 the colour line ran through Washington's concert halls (Constitution Hall barred Black performers)"
  sources:
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "in 1939, Washington, DC was still a racially segregated city"}
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "the venue banned black performers"}
- card: marian-anderson-1939
  fact: "Anderson was a contralto acclaimed in Europe who had sung at the White House"
  sources:
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "Eleanor Roosevelt first met African American contralto opera singer Marian Anderson in 1935 when the singer was invited to perform at the White House. Ms. Anderson had performed throughout Europe to great praise"}
    - {title: "US House of Representatives, History, Art & Archives: The Congressional Gold Medal for Singer Marian Anderson", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Congressional-Gold-Medal-for-singer-Marian-Anderson/", quote: "She was the first African American to perform at the White House during the Franklin D. Roosevelt administration"}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "Anderson spent the early 1930s touring Europe"}
- card: marian-anderson-1939
  fact: "Constitution Hall, the largest hall in Washington, belonged to the all-white DAR"
  sources:
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "It seated 4,000 people, and was the largest auditorium in the capital."}
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "Constitution Hall was the only local venue large enough to accommodate Anderson’s typical audience"}
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "the Daughters of the American Revolution (DAR), an all-white organization of descendants of Revolutionary War soldiers"}
- card: marian-anderson-1939
  fact: "The hall barred Black performers and the DAR refused an exception"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "the venue banned black performers. The organization would not make an exception for Anderson"}
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "major donors had insisted that only whites could perform on stage"}
- card: marian-anderson-1939
  fact: "The refusal set off a national controversy"
  sources:
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "despite pressure from the press, other great artists, politicians, and a new organization called the Marian Anderson Citizens Committee (MACC), the DAR held fast"}
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "the singer’s outdoor concert became a symbol for Civil Rights activism nation-wide"}
- card: marian-anderson-1939
  fact: "Eleanor Roosevelt resigned from the DAR in protest"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "In support of Anderson and equal rights, First Lady Eleanor Roosevelt resigned her membership in the DAR."}
    - {title: "US House of Representatives, History, Art & Archives: The Congressional Gold Medal for Singer Marian Anderson", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Congressional-Gold-Medal-for-singer-Marian-Anderson/", quote: "First Lady Eleanor Roosevelt resigned her D.A.R. membership"}
    - {title: "Franklin D. Roosevelt Presidential Library: Eleanor Roosevelt and Marian Anderson", url: "https://www.fdrlibrary.org/anderson", quote: "Mrs. Roosevelt submitted her letter of resignation to the DAR president"}
- card: marian-anderson-1939
  fact: "The NAACP and allies moved the concert to the Lincoln Memorial steps"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "The National Association for the Advancement of Colored People (NAACP) and Anderson’s manager, Sol Hurok, arranged for her to sing instead on the steps of the Lincoln Memorial ."}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "along with Walter White of the National Association for the Advancement of Colored People (NAACP) began a campaign to have Anderson perform on the steps of the Lincoln Memorial"}
- card: marian-anderson-1939
  fact: "On Easter Sunday, 9 April 1939, she sang to an integrated crowd of more than 75,000"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "Secretary of the Interior Harold Ickes helped organize the Easter Sunday event on April 9, 1939. Accompanied by a piano, Anderson first serenaded an integrated crowd of 75,000 people"}
    - {title: "US House of Representatives, History, Art & Archives: The Congressional Gold Medal for Singer Marian Anderson", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Congressional-Gold-Medal-for-singer-Marian-Anderson/", quote: "Anderson sang on the Lincoln Memorial steps before more than 75,000 people who lined the Reflecting Pool on Easter Sunday 1939"}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "That concert took place on April 9, 1939"}
- card: marian-anderson-1939
  fact: "She opened with My Country, 'Tis of Thee"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "with the patriotic ballad, “My Country, ‘Tis of Thee.”"}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "with Anderson opening the program with “My Country ‘Tis of Thee.”"}
- card: marian-anderson-1939
  fact: "In 1943 the DAR made an exception and invited her to Constitution Hall and she sang to an integrated audience"
  sources:
    - {title: "National Park Service: Marian Anderson and Constitution Hall", url: "https://www.nps.gov/articles/000/marian-anderson-and-constitution-hall.htm", quote: "In 1943, making an exception to its racial ban, which did not end until 1952, the DAR invited Anderson to perform at Constitution Hall for a war-benefit concert. Anderson agreed under the condition that the audience be integrated."}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "In 1943, she finally sang before an integrated audience at Constitution Hall at the invitation of the DAR."}
- card: marian-anderson-1939
  fact: "In 1955 she became the first African American to sing with the Metropolitan Opera"
  sources:
    - {title: "US House of Representatives, History, Art & Archives: The Congressional Gold Medal for Singer Marian Anderson", url: "https://history.house.gov/Historical-Highlights/1951-2000/The-Congressional-Gold-Medal-for-singer-Marian-Anderson/", quote: "starting in 1955, the first to sing with the Metropolitan Opera Company"}
    - {title: "Zanice Bond, BlackPast: Marian Anderson (1897-1993)", url: "https://www.blackpast.org/african-american-history/anderson-marian-1897-1993/", quote: "On January 7, 1955 she became the first African American to perform with the Metropolitan Opera in New York City."}
- card: thiaroye-1944
  fact: "The tirailleurs senegalais were France's colonial infantry recruited across French West Africa"
  sources:
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "The West Africans were members of the unit called Tirailleurs Senegalais, a corps of colonial infantry in the French Army."}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "Those who joined the Tirailleurs Senegalais not only came from Senegal but also from across France’s African empire"}
- card: thiaroye-1944
  fact: "They fought for France in 1940 and many were taken prisoner by Germany and held in camps in France"
  sources:
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "West African soldiers who fought for the French Army in the Battle of France in 1940"}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "They were sent to France and many were captured by Germany during its successful invasion of the country."}
    - {title: "Armelle Mabon, La tragédie de Thiaroye, symbole du déni d'égalité, Hommes et Migrations 1235 (2002)", url: "https://www.persee.fr/doc/homig_1142-852x_2002_num_1235_1_3780", quote: "dans les Frontstalags en France"}
- card: thiaroye-1944
  fact: "Freed in 1944 they were shipped to Senegal and held at Thiaroye camp, on the outskirts of Dakar"
  sources:
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "Liberated in 1944, the soldiers were taken back to Senegal and housed in the Thiaroye military camp, 15km (nine miles) from the capital, Dakar."}
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "Thiaroye — a fishing village on the outskirts of the Senegalese capital of Dakar"}
- card: thiaroye-1944
  fact: "Even before leaving France they complained about their pay, the wages and rights owed to them as former prisoners"
  sources:
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "Even before leaving France, many had been complaining about the pay they were set to receive"}
    - {title: "Armelle Mabon, La tragédie de Thiaroye, symbole du déni d'égalité, Hommes et Migrations 1235 (2002)", url: "https://www.persee.fr/doc/homig_1142-852x_2002_num_1235_1_3780", quote: "le refus des autorités françaises de leur accorder les droits auxquels ils pouvaient prétendre en qualité d'anciens prisonniers de guerre"}
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "there were disputes over unpaid wages in the days before the massacre"}
- card: thiaroye-1944
  fact: "The colonial authorities treated it as a mutiny"
  sources:
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "Anger over the money grew once at Thiaroye, which the colonial authority viewed as a mutiny."}
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "after what the French described as a mutiny over unpaid wages"}
- card: thiaroye-1944
  fact: "On 1 December 1944 French troops turned on the West African soldiers"
  sources:
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "on Dec. 1, French troops turned on the West African soldiers, mostly unarmed, and shot and killed them"}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "On 1 December, the French violently brought an end to the protests."}
    - {title: "Armelle Mabon, La tragédie de Thiaroye, symbole du déni d'égalité, Hommes et Migrations 1235 (2002)", url: "https://www.persee.fr/doc/homig_1142-852x_2002_num_1235_1_3780", quote: "Leurs légitimes revendications furent réprimées dans le sang."}
- card: thiaroye-1944
  fact: "The official toll was 35; other estimates run as high as 400"
  sources:
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "At the time it was said that 35 of the tirailleurs were killed, but some have put the death toll as high as 400."}
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "Between 35 and 400 West African soldiers"}
- card: thiaroye-1944
  fact: "In November 2024 Macron wrote to Senegal's president Faye recognising for the first time that it was a massacre, set off by the soldiers' demand for their pay"
  sources:
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "French President Emmanuel Macron on Thursday for the first time recognized the killing of West African soldiers by the French Army in 1944 as a massacre in a letter addressed to the Senegalese authorities."}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "France has for the first time acknowledged that its soldiers carried out a \"massacre\" in Senegal"}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "On returning to Senegal in 1944 many protested about their pay, historians say, which led to a brutal response."}
- card: thiaroye-1944
  fact: "Senegal marked the 80th anniversary days later"
  sources:
    - {title: "AP via Stars and Stripes: France's Macron acknowledges 1944 killings of West African troops was a massacre (29 November 2024)", url: "https://www.stripes.com/theaters/europe/2024-11-29/france-macron-west-african-troops-massacre-16004214.html", quote: "on the eve of the 80th anniversary of the World War II killings in Thiaroye"}
    - {title: "Damian Zane, BBC News: France admits colonial 'massacre', says Senegal's leader (29 November 2024)", url: "https://www.bbc.com/news/articles/cvg725vk174o", quote: "Senegal is due to mark the 80th anniversary of the shootings on Sunday."}
- card: claudette-colvin
  fact: "Montgomery buses were segregated; Black riders could be ordered to the back"
  sources:
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "the driver could order black passengers to move to the back"}
    - {title: "AP via NPR: She refused to move bus seats months before Rosa Parks. At 82, her arrest is expunged (16 December 2021)", url: "https://www.npr.org/2021/12/16/1064890661/claudette-colvin-rosa-parks-arrest-record-expunged", quote: "arrested for refusing to move to the back of a segregated Alabama bus in 1955"}
- card: claudette-colvin
  fact: "On 2 March 1955 Colvin, 15, refused to give up her seat to a white woman"
  sources:
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "On 2 March 1955 Colvin, aged 15, was riding a bus home from school in Montgomery"}
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "When she refused to give up her seat to a white woman, the driver called the police"}
    - {title: "Phillip Hoose, Publishers Weekly: Remembering Claudette Colvin (26 February 2026)", url: "https://www.publishersweekly.com/pw/by-topic/childrens/childrens-industry-news/article/99785-remembering-claudette-colvin.html", quote: "she refused a bus driver’s order to surrender her seat to a white woman"}
    - {title: "Margot Adler, NPR: Before Rosa Parks, There Was Claudette Colvin (15 March 2009)", url: "https://www.npr.org/2009/03/15/101719889/before-rosa-parks-there-was-claudette-colvin", quote: "She remembers taking the bus home from high school on March 2, 1955"}
- card: claudette-colvin
  fact: "She said she had paid her fare and it was her constitutional right"
  sources:
    - {title: "Margot Adler, NPR: Before Rosa Parks, There Was Claudette Colvin (15 March 2009)", url: "https://www.npr.org/2009/03/15/101719889/before-rosa-parks-there-was-claudette-colvin", quote: "she refused, saying she'd paid her fare and it was her constitutional right"}
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "‘It’s my constitutional right!’"}
- card: claudette-colvin
  fact: "Two police officers hauled her off, her schoolbooks flying, and handcuffed her"
  sources:
    - {title: "Margot Adler, NPR: Before Rosa Parks, There Was Claudette Colvin (15 March 2009)", url: "https://www.npr.org/2009/03/15/101719889/before-rosa-parks-there-was-claudette-colvin", quote: "Two police officers put her in handcuffs and arrested her. Her school books went flying off her lap."}
    - {title: "Phillip Hoose, Publishers Weekly: Remembering Claudette Colvin (26 February 2026)", url: "https://www.publishersweekly.com/pw/by-topic/childrens/childrens-industry-news/article/99785-remembering-claudette-colvin.html", quote: "Two white cops came charging down the aisle, grabbed her backwards by the armpits, and hoisted her off the bus, sending her schoolbooks flying. After handcuffing her"}
- card: claudette-colvin
  fact: "She felt Harriet Tubman and Sojourner Truth pressing down on her"
  sources:
    - {title: "Margot Adler, NPR: Before Rosa Parks, There Was Claudette Colvin (15 March 2009)", url: "https://www.npr.org/2009/03/15/101719889/before-rosa-parks-there-was-claudette-colvin", quote: "It felt like Sojourner Truth was on one side pushing me down, and Harriet Tubman was on the other side of me pushing me down."}
    - {title: "Phillip Hoose, Publishers Weekly: Remembering Claudette Colvin (26 February 2026)", url: "https://www.publishersweekly.com/pw/by-topic/childrens/childrens-industry-news/article/99785-remembering-claudette-colvin.html", quote: "She said she felt the weight of Harriet Tubman pressing down on one shoulder and Sojourner Truth on the other."}
- card: claudette-colvin
  fact: "A juvenile court convicted her; on appeal segregation charges fell but an assault conviction stood"
  sources:
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "She was convicted on all counts in juvenile court, and the segregation convictions were overturned on appeal."}
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "Charges of violating segregation laws and disturbing the peace were eventually dropped on appeal, but her conviction for assaulting a police officer was upheld."}
- card: claudette-colvin
  fact: "She was never told her probation had ended"
  sources:
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "Colvin was never informed her probation had ended, her legal team said."}
    - {title: "AP via NPR: She refused to move bus seats months before Rosa Parks. At 82, her arrest is expunged (16 December 2021)", url: "https://www.npr.org/2021/12/16/1064890661/claudette-colvin-rosa-parks-arrest-record-expunged", quote: "Colvin never got official word that she had completed probation through the ensuing decades"}
- card: claudette-colvin
  fact: "Nine months later Rosa Parks was arrested and the boycott began"
  sources:
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "The incident came nine months before Rosa Parks’ far more famous arrest"}
    - {title: "AP via NPR: She refused to move bus seats months before Rosa Parks. At 82, her arrest is expunged (16 December 2021)", url: "https://www.npr.org/2021/12/16/1064890661/claudette-colvin-rosa-parks-arrest-record-expunged", quote: "Her treatment led to the yearlong Montgomery Bus Boycott"}
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "Nine months later, on 1 December, Rosa Parks"}
- card: claudette-colvin
  fact: "In 1956 she was a plaintiff in Browder v. Gayle; the federal court struck down bus segregation and the Supreme Court upheld it"
  sources:
    - {title: "Stanford King Institute: Browder v. Gayle", url: "https://kinginstitute.stanford.edu/browder-v-gayle-352-us-903", quote: "The original plaintiffs in the case were Aurelia S. Browder, Susie McDonald, Claudette Colvin, Mary Louise Smith, and Jeanatta Reese"}
    - {title: "Stanford King Institute: Browder v. Gayle", url: "https://kinginstitute.stanford.edu/browder-v-gayle-352-us-903", quote: "the U.S. Supreme Court had just affirmed the District Court’s decision on Browder v. Gayle"}
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "The district court ruled 2-1 that Montgomery’s segregation on public transport violated the equal protection clause of the 14th amendment, and the supreme court upheld the ruling."}
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "Colvin went on to join the plaintiffs in Browder v. Gayle , a 1956 case that made its way to the Supreme Court"}
- card: claudette-colvin
  fact: "She moved to New York and lived there for decades"
  sources:
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "Two years later she moved to New York"}
    - {title: "Margot Adler, NPR: Before Rosa Parks, There Was Claudette Colvin (15 March 2009)", url: "https://www.npr.org/2009/03/15/101719889/before-rosa-parks-there-was-claudette-colvin", quote: "Now a 69-year-old retiree, Colvin lives in the Bronx."}
- card: claudette-colvin
  fact: "In December 2021, at her request, a judge expunged her juvenile record; she was 82"
  sources:
    - {title: "AP via NPR: She refused to move bus seats months before Rosa Parks. At 82, her arrest is expunged (16 December 2021)", url: "https://www.npr.org/2021/12/16/1064890661/claudette-colvin-rosa-parks-arrest-record-expunged", quote: "A judge granted the request by Claudette Colvin, now 82, in a brief court order made public Thursday by a family representative."}
    - {title: "Pamela Kirkland and Dakin Andone, CNN: Claudette Colvin's juvenile record has been expunged (16 December 2021)", url: "https://www.cnn.com/2021/12/16/us/claudette-colvin-juvenile-record-expunged/index.html", quote: "The juvenile court records of Claudette Colvin , a civil rights pioneer who refused in 1955 to give up her seat to a White person on an Alabama bus, have been sealed, destroyed and expunged following a judge’s ruling. Colvin, now 82"}
- card: claudette-colvin
  fact: "She died on 13 January 2026"
  sources:
    - {title: "Michael Carlson, The Guardian: Claudette Colvin obituary (21 January 2026)", url: "https://www.theguardian.com/us-news/2026/jan/21/claudette-colvin-obituary", quote: "died 13 January 2026"}
    - {title: "Phillip Hoose, Publishers Weekly: Remembering Claudette Colvin (26 February 2026)", url: "https://www.publishersweekly.com/pw/by-topic/childrens/childrens-industry-news/article/99785-remembering-claudette-colvin.html", quote: "who died on January 13"}
