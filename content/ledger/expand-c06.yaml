    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "Saramaccan also preserves an African system of pitches or tones , with a high pitch (marked by an acute accent) distinguished from a low pitch"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "Saramaccan has been demonstrated by Good (2004 ) to have a split tone/accent system."
