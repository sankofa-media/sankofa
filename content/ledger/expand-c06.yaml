- card: saramaccan
  fact: "In 2007 the Inter-American Court of Human Rights found that Suriname had violated Saramaka rights and ordered collective title to their territory."
  sources:
    - title: "Inter-American Court of Human Rights: Saramaka People v. Suriname, judgment of 28 November 2007"
      url: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf"
      quote: "The State violated, to the detriment of the members of the Saramaka people, the right to property... The State shall delimit, demarcate, and grant collective title over the territory of the members of the Saramaka people"
    - title: "Northeastern University School of Law, CGLJ (2016)"
      url: "https://cgljresourcehub.law.northeastern.edu/2016/02/12/iacthr-confirms-indigenous-peoples-land-and-access-to-information-rights/"
