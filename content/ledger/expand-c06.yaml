      quote: "\"author_name\":[\"P. K. Rose\"]... \"first_publish_year\":1999... \"title\":\"Black dispatches\""
- card: black-dispatches
  fact: "Elizabeth Van Lew ran a Union spy ring in Richmond in which free and enslaved Black people were vital members."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "her aunt, Elizabeth Van Lew, did operate an espionage ring in the Confederate capital... Free and enslaved African Americans, including Mary Jane Richards, were vital members of the espionage network"
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "Elizabeth Van Lew had 12, black and white, informants in her spy ring."
- card: black-dispatches
  fact: "Mary Jane Richards was born enslaved in the Van Lew household around 1840."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "Mary Jane Richards was most likely born in Virginia around 1840... \"a colored child belonging to Mrs. [Eliza] Van Lew.\""
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "Mary Jane was born circa 1840 in Richmond, Virginia, as a slave to the Van Lew family."
- card: black-dispatches
  fact: "She was sent north to school, went to Liberia in 1855 and returned to Richmond in 1860."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "The Van Lew family sent Mary Jane Richards to school in Princeton, New Jersey, in the 1850s, and Richards appears in the records of the American Colonization Society among a group of Black Virginians bound for Liberia in 1855... On March 5, 1860, Mary Jane Richards arrived by ship in Baltimore, and from there she traveled to Richmond"
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "she was sent to either Philadelphia, PA, or Princeton, NJ, to attend school. On December 24, 1855, Mary joined 55 black emigrants... on a voyage to Liberia... She was in Liberia for five years."
- card: black-dispatches
  fact: "In April 1861 she married Wilson Bowser."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "On April 16, 1861, St. John's Church recorded the marriage of Wilson Bowser and someone named Mary."
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "On April 16, 1861, Mary Jane married Wilson Bowser at St. John's Church."
- card: black-dispatches
  fact: "Van Lew's network helped Union prisoners and later passed military intelligence to the Union army, with Richards taking part."
  sources:
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "From 1861-1863, her informants helped secure food and medicine for Union soldiers imprisoned in Libby Prison... In 1864-1865, the informants started gathering military and political intelligence and smuggling them to the Union army. Mary helped through both phases."
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "the Van Lews and Mary Jane Richards offered care and comfort to United States Army prisoners in the city. By 1864, Elizabeth Van Lew had established contact with the U.S. government and was supplying military intelligence to army leaders"
- card: black-dispatches
  fact: "In 1911 Van Lew's niece told Harper's Magazine of a spy 'Mary Elizabeth Bowser' who worked in Jefferson Davis's residence."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "In 1911... Annie Van Lew Hall was interviewed for a story in Harper's Magazine. She told the publication that as a child, she had known an African American woman named \"Mary Elizabeth Bowser\" who was a spy during the war, working in the home of Confederate President Jefferson Davis"
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "In 1911, Annie R. Van Lew Hall, niece of Elizabeth Van Lew , claimed in a Harper's Magazine article that \"Mary Elizabeth Bowser\" worked as a spy for her aunt."
- card: black-dispatches
  fact: "Historians showed the name and most details wrong and identified the real woman as Mary Jane Richards."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "The other details of Hall's story, though, are mostly incorrect. Evidence unearthed by historians... indicated that the woman Annie Van Lew Hall remembered those fifty years later was actually named Mary Jane Richards"
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "This account is false, but the base facts are correct: Mary Jane was a spy for the Union"
- card: black-dispatches
  fact: "After the war she spoke in New York as 'Richmonia Richards' and taught freed people in Freedmen's Bureau schools."
  sources:
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "In September of 1865, Mary Jane Richards gave two public speeches at churches in Harlem and Brooklyn... calling herself first \"Richmonia Richards\"... By 1867, Richards appears in the records of the Freedmen's Bureau, operating a school in St. Marys, Georgia."
    - title: "American Battlefield Trust: Mary Jane Richards"
      url: "https://www.battlefields.org/node/499"
      quote: "After the war, Mary became a teacher for the Freedman's Bureau... For these speaking engagements, Mary went by the name \"Richmonia Richards\""
- card: black-dispatches
  fact: "The contributions of Black agents long stayed obscure; her identity was recovered through church and school records."
  sources:
    - title: "P. K. Rose, Black Dispatches, CIA Center for the Study of Intelligence"
      url: "https://www.cia.gov/resources/csi/static/Black-Dispatches.pdf"
      quote: "After the war, however, the intelligence contributions of black Americans became obscure."
    - title: "National Park Service, Richmond NBP: Mary Jane Richards"
      url: "https://home.nps.gov/rich/learn/historyculture/mary-jane-richards.htm"
      quote: "St. John's Church recorded the marriage of Wilson Bowser... By 1867, Richards appears in the records of the Freedmen's Bureau"
- card: bassa-vah
  fact: "Bassa Vah is an alphabet for Bassa, a tonal language of Liberia, written left to right with 23 consonants, 7 vowels and 5 tone marks."
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Bassa Vah"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "The Bassa Vah script is used for the tonal Bassa language of Liberia... Modern Bassa Vah is a simple alphabetic script, written from left to right, consisting of 23 consonants, 7 vowels, and 5 tone marks."
    - title: "SIL International, Writing Systems Information (formerly ScriptSource): Bassa Vah"
      url: "https://writingsystems.info/scrlang/scripts/bass/"
      quote: "the script consists of 23 consonants and 7 vowels... This is done by means of 5 tone marks, which are written inside the vowel characters."
- card: bassa-vah
  fact: "The tone marks are written inside the vowel letters."
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Bassa Vah"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "the vowel letters are always written with tone marks; these marks are placed in a central open area of each vowel glyph"
    - title: "SIL International, Writing Systems Information (formerly ScriptSource): Bassa Vah"
      url: "https://writingsystems.info/scrlang/scripts/bass/"
      quote: "This is done by means of 5 tone marks, which are written inside the vowel characters."
- card: bassa-vah
  fact: "Its modern form is owed to Thomas Flo Lewis, a Bassa from Liberia who studied in Syracuse, New York, in the early 20th century."
  sources:
    - title: "Michael Everson and Charles Riley: Final proposal for encoding the Bassa Vah script (2010)"
      url: "https://www.unicode.org/L2/L2010/10382r-n3941r-bassavah.pdf"
      quote: "The Vah script of the Bassa owes most of its development and current form to Thomas Flo Lewis... Dr Lewis, a Bassa from Liberia, studied in Syracuse for several years."
    - title: "Melvin Barrolle, SYLFF final report (2012)"
      url: "https://www.sylff.org/pdf/fellows/2011_mb_34.pdf"
      quote: "Based on archival records, this was done during his time at Syracuse University."
- card: bassa-vah
  fact: "While in Syracuse he had texts in the script printed, and he is credited with bringing it into print and spreading it."
  sources:
    - title: "Michael Everson and Charles Riley: Final proposal for encoding the Bassa Vah script (2010)"
      url: "https://www.unicode.org/L2/L2010/10382r-n3941r-bassavah.pdf"
      quote: "who worked with the typesetting of it beginning as early as 1907, producing various texts in the script through at least the 1930's"
    - title: "Melvin Barrolle, SYLFF final report (2012)"
      url: "https://www.sylff.org/pdf/fellows/2011_mb_34.pdf"
      quote: "Lewis began working on rendering the script as a syllabary with the assistance of a printing press. Based on archival records, this was done during his time at Syracuse University."
- card: bassa-vah
  fact: "Tradition holds that an older sign system survived among Bassa enslaved in the Americas and that Lewis met their descendants; documentary proof is lacking."
  sources:
    - title: "The Unicode Standard 17.0, chapter 19: Bassa Vah"
      url: "https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-19/"
      quote: "According to Bassa tradition, an earlier ideographic script... remained in use primarily among Bassa brought to the Americas as slaves... Lewis learned a version of that script from Dirah's son Jenni and possibly others of Bassa origin in the Americas"
    - title: "Melvin Barrolle, SYLFF final report (2012)"
      url: "https://www.sylff.org/pdf/fellows/2011_mb_34.pdf"
      quote: "Allegedly, Lewis serendipitously encountered descendants of the Bassa peoples (whose ancestors were captured and taken to that region for forced labor) in the region who had managed to preserve the script in its rudimentary form."
- card: bassa-vah
  fact: "Lewis died in 1935."
  sources:
    - title: "Melvin Barrolle, SYLFF final report (2012)"
      url: "https://www.sylff.org/pdf/fellows/2011_mb_34.pdf"
      quote: "Lewis was born in Liberia around 1870 and died in 1935"
    - title: "Charles Riley, Encoding the Bassa Vah script of Liberia, The Digital Orientalist (2018)"
      url: "https://digitalorientalist.com/2018/11/12/encoding-the-bassa-vah-script-of-liberia/"
      quote: "it may have originated with Lewis, who died in 1935"
- card: bassa-vah
  fact: "Bassa Vah entered the Unicode Standard in version 7.0 in June 2014."
  sources:
    - title: "Unicode Consortium: Unicode 7.0.0"
      url: "https://www.unicode.org/versions/Unicode7.0.0/"
      quote: "Released: 2014 June 16... Twenty-three new scripts were added with accompanying new block descriptions: Bassa Vah ... Mende Kikakui"
    - title: "Charles Riley, Encoding the Bassa Vah script of Liberia, The Digital Orientalist (2018)"
      url: "https://digitalorientalist.com/2018/11/12/encoding-the-bassa-vah-script-of-liberia/"
      quote: "The final version of the standardized Bassa Vah character repertoire was voted on and added to the 7.0 release of the Unicode Standard in June of 2014."
- card: sranan-tongo
  fact: "Sranan Tongo is the common language of Suriname, spoken by almost everyone as a first or second language."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "Sranan is spoken by almost the entire population of Suriname as either a first or a second language"
    - title: "APiCS Online: Sranan (Winford and Plag)"
      url: "https://apics-online.info/surveys/2"
      quote: "Sranan is spoken both as a first language and a lingua franca for inter-group communication throughout the country"
- card: sranan-tongo
  fact: "It is also spoken in the large Surinamese community in the Netherlands."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "as well as by a large emigrant population in the Netherlands"
    - title: "APiCS Online: Sranan (Winford and Plag)"
      url: "https://apics-online.info/surveys/2"
      quote: "Those used by speakers in the Netherlands as well as by Dutch-dominant Surinamese have been influenced to varying degrees by Dutch."
- card: sranan-tongo
  fact: "It is an English-based creole made by enslaved Africans, with Dutch influence."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "the ultimate origins of Sranan lie in the nonstandard varieties of English spoken by colonists... although at all times under heavy Dutch influence... both were equally influenced by the African languages spoken by slaves"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "1660–1665 Sranan creolized from Caribbean Plantation Pidgin English"
- card: sranan-tongo
  fact: "It began on the plantations and in Paramaribo in the late 17th century."
  sources:
    - title: "APiCS Online: Early Sranan"
      url: "https://apics-online.info/surveys/1"
      quote: "those 18th-century creole varieties that emerged on the Surinamese plantations and in the city of Paramaribo from the late 17th century onwards"
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "Sranan evolved on the coast. There, near the capital city of Paramaribo"
- card: sranan-tongo
  fact: "English colonists settled Suriname in 1651."
  sources:
    - title: "APiCS Online: Early Sranan"
      url: "https://apics-online.info/surveys/1"
      quote: "the settlement by a hundred English settlers, sent from Barbados by Francis Willoughby, along the Suriname River in 1651"
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "during the period of English control (1651–67)"
- card: sranan-tongo
  fact: "In 1667 the Dutch seized the colony."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "When the Dutch took over Suriname in 1667"
    - title: "APiCS Online: Early Sranan"
      url: "https://apics-online.info/surveys/1"
      quote: "In February 1667, Abraham Crijnsen seized control of the colony on behalf of Zealand... mass departure of the English and Irish planters"
- card: sranan-tongo
  fact: "The Dutch kept the English-based vernacular as the language for communicating with the enslaved."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "they decided to keep the local colonial English vernacular , rather than their own national language, as the lingua franca for communication with the slaves"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "In previous work the retention of a form of English (if Sranan is regarded as such) after 1675 has sometimes been regarded as problematic."
- card: sranan-tongo
  fact: "Maroon languages such as Saramaccan grew out of early Sranan carried into the interior."
  sources:
    - title: "APiCS Online: Sranan (Winford and Plag)"
      url: "https://apics-online.info/surveys/2"
      quote: "the maroon creoles split off from it after their founders escaped from the Surinamese plantations"
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "escapees from among the enslaved must have taken the plantation varieties into the Maroon colonies"
- card: sranan-tongo
  fact: "Sranan long had less prestige than Dutch but has become a symbol of Surinamese identity and national language."
  sources:
    - title: "Encyclopaedia Britannica: Sranan"
      url: "https://www.britannica.com/topic/Sranan"
      quote: "It functions as a lingua franca and as a national language of Suriname, although it has less prestige than Dutch, the country's official language."
    - title: "APiCS Online: Sranan (Winford and Plag)"
      url: "https://apics-online.info/surveys/2"
      quote: "Despite the hegemony of Dutch, Sranan enjoys status as a language of wider everyday communication, and as a symbol of Surinamese identity."
