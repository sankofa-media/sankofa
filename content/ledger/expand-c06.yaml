# Ledger for expansion batch c06: one entry per fact in card bodies and wow lines, each with two or more independent sources (revised after the second fact-check, see expand-c06-check.yaml).
- card: walatta-petros
  fact: "Emperor Susenyos, persuaded by the Jesuits, embraced Roman Catholicism and pressed it on his court in the early 17th century."
  sources:
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "the Jesuits persuaded King Susənyos (1572-1632) to proclaim Roman Catholicism the faith of the land"
    - title: "Library of Congress Country Studies: Ethiopia (1991), Contact with European Christendom"
      url: "https://countrystudies.us/ethiopia/12.htm"
      quote: "Susenyos (reigned 1607- 32), after a particularly fierce battle between adherents of the two faiths, abdicated in 1632"
- card: walatta-petros
  fact: "Walatta Petros was a noblewoman born in the 1590s."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "Her anonymous biographer relates that she was born in 1594, the daughter of a lady named Krestos Ebaya and of a nobleman"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "She was born in 1592 into a noble family"
- card: walatta-petros
  fact: "She was the wife of one of the emperor's leading counsellors."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "Walata Petros became the wife of one of the leading personalities of the reign of Susneyos, Malkea Krestos."
    - title: "Wendy Laura Belcher: The Life and Struggles of Our Mother Walatta Petros"
      url: "https://wendybelcher.com/african-literature/walatta-petros/"
      quote: "a noblewoman and the wife of one of the emperor's counselors"
- card: walatta-petros
  fact: "She left her husband to become a nun and joined the resistance to Catholicism."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "at the age of 24, Walata Petros resolved to end her marriage"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "she again determined to leave her husband, starving herself until he let her go. She immediately went to a monastery on Lake Ṭana and became a nun"
- card: walatta-petros
  fact: "She was summoned before the court and resisted Jesuit efforts to convert her."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "The anti-Catholic activities of Walata Petros and her followers led Susneyos to summon them to court to answer charges brought against them... refused all efforts by the Catholic Patriarch, Bishop Affonso Mendez, and others to convert them to Catholicism"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "The angry king again called her before the court, and this time she was sentenced to spending Saturdays with the Jesuits, as the head of the mission, Afonso Mendes, worked to convert her."
- card: walatta-petros
  fact: "She was banished to the western borderlands, where she founded the first of seven religious communities."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "Susneyos then ordered Walata Petros to be exiled to Jabal on the western frontier of Ethiopia... Thus she established at Jabal the first of the seven religious communities that she was to found"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "the king banished her, alone, to the Ethio-Sudan borderlands, Žabay... Thus, Žäbäy was the first of the seven communities prophesized."
- card: walatta-petros
  fact: "Ehete Kristos was her constant companion and became her successor."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "after naming her constant companion, Eheta Krestos, as her successor"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "Ǝḫətä Krəstos, the woman who became her constant companion in life and work and the abbess of her community after Walatta Petros's death"
- card: walatta-petros
  fact: "Allowed back to the Lake Tana region, she founded more communities there."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "Walata Petros was allowed to return to the Lake Tana area where she founded the two communities of Chenqwa and Mesela"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "she went with her followers to live in the region of Dambəya, on the northern side of Lake Ṭana, setting up her second community, Č̣anqʷa"
- card: walatta-petros
  fact: "In 1632 Susenyos gave up the struggle and abdicated; Fasiladas restored Orthodoxy and the Jesuits were expelled."
  sources:
    - title: "Library of Congress Country Studies: Ethiopia (1991), Contact with European Christendom"
      url: "https://countrystudies.us/ethiopia/12.htm"
      quote: "abdicated in 1632 in favor of his son, Fasiladas (reigned 1632-67), to spare the country further bloodshed. The expulsion of the Jesuits and all Roman Catholic missionaries followed."
    - title: "Encyclopaedia Britannica: Fasilides"
      url: "https://www.britannica.com/biography/Fasilides"
      quote: "Fasilides succeeded to the throne on the abdication of Susenyos (1632)... expelled Catholic missionaries"
- card: walatta-petros
  fact: "Honoured as a heroine, she went on teaching and founding communities after 1632."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "Walata Petros was honored and revered as a popular heroine... she travelled the country, teaching with renewed zeal, gathering new disciples, and founding new religious communities"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "Walatta Petros was revered as a heroine for her resistance... She set up her communities at Dämboza, Afär Färäs, Zäge, and Zäbol."
- card: walatta-petros
  fact: "She was buried on the island of Rema in Lake Tana."
  sources:
    - title: "Belaynesh Michael, Walata Petros, Encyclopaedia Africana Dictionary of African Biography (1977), via DACB"
      url: "https://dacb.org/stories/ethiopia/walata-petros/"
      quote: "was buried on the holy island of Rema near the southeast shore of Lake Tana"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "was buried at the monastery or Rema on Lake Ṭana"
- card: walatta-petros
  fact: "Her community wrote down her Life in 1672, about thirty years after her death."
  sources:
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "Her followers wrote down the story of her life about thirty years after she died, in 1672"
    - title: "Princeton Alumni Weekly: A saint's life, in old manuscripts (2013)"
      url: "https://paw.princeton.edu/article/saints-life-old-manuscripts"
      quote: "they are among the 12 copies of the original 1672 biography (now lost)"
- card: walatta-petros
  fact: "About a dozen manuscript copies survive and the Life has been translated into English."
  sources:
    - title: "Princeton Alumni Weekly: A saint's life, in old manuscripts (2013)"
      url: "https://paw.princeton.edu/article/saints-life-old-manuscripts"
      quote: "they are among the 12 copies of the original 1672 biography (now lost) that she has now uncovered"
    - title: "Wendy Laura Belcher, Walatta Petros (B), Dictionary of African Christian Biography"
      url: "https://dacb.org/stories/ethiopia/walatta-petros2/"
      quote: "the recent English translation and edition, based on twelve manuscripts of the hagiography"
- card: kebra-nagast
  fact: "The Kebra Nagast is a Ge'ez book written down in the early 14th century."
  sources:
    - title: "Encyclopaedia Britannica: Kebra Negast"
      url: "https://www.britannica.com/topic/Kebra-Negast"
      quote: "The Kebra nagast ( Glory of Kings ), written from 1314 to 1322"
    - title: "Wendy Laura Belcher: The Kebra Nagast"
      url: "https://wendybelcher.com/african-literature/kebra-nagast/"
      quote: "written down in Ethiopia in 1321... The Kəbrä Nägäśt is in Gəʿəz (Ethiopic)."
- card: kebra-nagast
  fact: "It retells the story of the Queen of Sheba and Solomon; their son Menelik becomes king of Ethiopia and brings the Ark of the Covenant to Aksum."
  sources:
    - title: "Encyclopaedia Britannica: Kebra Negast"
      url: "https://www.britannica.com/topic/Kebra-Negast"
      quote: "relates the tradition of the transference of the Ark of the Covenant from Jerusalem to Aksum by King Menilek I, legendary son of Solomon and the Queen of Sheba"
    - title: "Wendy Laura Belcher: The Kebra Nagast"
      url: "https://wendybelcher.com/african-literature/kebra-nagast/"
      quote: "The Kebra Nagast : The Ancient Book about the African Queen of Sheba, King Solomon, Their Son, and the Ark of the Covenant... a retelling of the story of the Queen of Sheba and King Solomon"
- card: kebra-nagast
  fact: "Around 1270 Yekuno Amlak overthrew the last Zagwe ruler and founded the Solomonic dynasty."
  sources:
    - title: "Library of Congress Country Studies: Ethiopia (1991), The Restoration of the Solomonic Line"
      url: "http://countrystudies.us/ethiopia/8.htm"
      quote: "About 1270, an Amhara noble, Yekuno Amlak, drove out the last Zagwe ruler and proclaimed himself king."
    - title: "Encyclopaedia Britannica: Solomonid dynasty"
      url: "https://www.britannica.com/topic/Solomonid-dynasty"
      quote: "Many scholars, however, trace the line back only as far as Yekuno Amlak, who acceded to the throne in 1270."
- card: kebra-nagast
  fact: "The dynasty claimed descent from Solomon and Sheba through Aksum and presented its accession as a restoration."
  sources:
    - title: "Library of Congress Country Studies: Ethiopia (1991), The Restoration of the Solomonic Line"
      url: "http://countrystudies.us/ethiopia/8.htm"
      quote: "its scions claimed descent not only from Aksum but also from King Solomon of ancient Israel... Yekuno Amlak's accession thus came to be seen as the legitimate \"restoration\" of the Solomonic line"
    - title: "Encyclopaedia Britannica: Solomonid dynasty"
      url: "https://www.britannica.com/topic/Solomonid-dynasty"
      quote: "line of Ethiopian emperors who, according to tradition, were descended from Menilek I, the son of Solomon and the Queen of Sheba (Makeda). Until Haile Selassie I was deposed in 1974, their rule was supposed to have been continuous but for two periods, the reign of the Zagwe dynasty (12th–13th century)"
- card: kebra-nagast
  fact: "The Kebra Nagast gave the Solomonic genealogy its classic written form and turned the legend into a national epic."
  sources:
    - title: "Encyclopaedia Britannica: Solomonid dynasty"
      url: "https://www.britannica.com/topic/Solomonid-dynasty"
      quote: "The genealogy of the Solomonids was first depicted in the 14th-century work Kebra Negast (\"Glory of the Kings\")."
    - title: "Library of Congress Country Studies: Ethiopia (1991), The Restoration of the Solomonic Line"
      url: "http://countrystudies.us/ethiopia/8.htm"
      quote: "According to traditions that were eventually molded into a national epic, the lineage of Aksumite kings originated with the offspring of an alleged union between Solomon and the Queen of Sheba"
- card: kebra-nagast
  fact: "For seven centuries almost every Ethiopian king traced his legitimacy to Yekuno Amlak and through him to Solomon and Sheba."
  sources:
    - title: "Library of Congress Country Studies: Ethiopia (1991), The Restoration of the Solomonic Line"
      url: "http://countrystudies.us/ethiopia/8.htm"
      quote: "all subsequent Ethiopian kings traced their legitimacy to him and, thereby, to Solomon and Sheba"
    - title: "Encyclopaedia Britannica: Solomonid dynasty"
      url: "https://www.britannica.com/topic/Solomonid-dynasty"
      quote: "continuous but for two periods, the reign of the Zagwe dynasty (12th–13th century) and the reign of Tewodros II (1855–68)"
- card: kebra-nagast
  fact: "The last emperor, Haile Selassie, was deposed by the military in 1974."
  sources:
    - title: "Library of Congress Country Studies: Ethiopia (1991), The Establishment of the Derg"
      url: "http://countrystudies.us/ethiopia/28.htm"
      quote: "the Derg formally deposed Haile Selassie on September 12 and imprisoned him"
    - title: "Encyclopaedia Britannica: Haile Selassie I"
      url: "https://www.britannica.com/biography/Haile-Selassie-I"
      quote: "segments of the army to mutiny. They deposed Haile Selassie and established a provisional military government , the Derg"
- card: kilwa-kisiwani
  fact: "Kilwa Kisiwani is an island off the coast of southern Tanzania where a Swahili trading city grew from around the 10th century."
  sources:
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "The larger, Kilwa Kisiwani, was occupied from the 9th to the 19th century... Kilwa Kisiwani and Songo Mnara were Swahili trading cities"
    - title: "Encyclopaedia Britannica: Kilwa"
      url: "https://www.britannica.com/place/Kilwa"
      quote: "former Islamic city-state on an island off the coast of what is now southern Tanzania . Founded in the late 10th century"
- card: kilwa-kisiwani
  fact: "By the 13th and 14th centuries it was one of the great ports of the East African coast in the Indian Ocean trade."
  sources:
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "reached its peak of prosperity in the13th and 14th centuries... their prosperity was based on control of Indian Ocean trade with Arabia, India and China"
    - title: "Encyclopaedia Britannica: Kilwa"
      url: "https://www.britannica.com/place/Kilwa"
      quote: "it became one of the most active commercial centers on the east coast of Africa"
- card: kilwa-kisiwani
  fact: "Ibn Battuta visited Kilwa in the early 1330s and praised it as a fine, well-built town."
  sources:
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "In 1331-1332, the great traveler, Ibn Battouta made a stop here and described Kilwa as one of the most beautiful cities of the world."
    - title: "Ibn Battuta, Travels in Asia and Africa, trans. H. A. R. Gibb, Internet Medieval Sourcebook"
      url: "https://sourcebooks.fordham.edu/source/1354-ibnbattuta.asp"
      quote: "Kulwa is a very fine and substantially built town"
- card: kilwa-kisiwani
  fact: "The ruins of the Great Mosque, once roofed entirely with domes and vaults, still stand, as do those of the 14th-century palace Husuni Kubwa."
  sources:
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "the Great Mosque constructed in the 11th century and considerably enlarged in the 13th century, and roofed entirely with domes and vaults... the palace Husuni Kubwa built between c1310 and 1333"
    - title: "Encyclopaedia Britannica: Kilwa"
      url: "https://www.britannica.com/place/Kilwa"
      quote: "Extensive ruins remain, including mosques, a Portuguese fort, and the great Husuni Kubwa palace (13th–14th century)."
- card: kilwa-kisiwani
  fact: "Kilwa struck its own copper coins."
  sources:
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "Kilwa Kisiwani minted its own currency in the 11th to 14th centuries."
    - title: "Archaeology (AIA): African Coins Could Rewrite Australia's Past (2013), courtesy IUPUI"
      url: "https://archaeology.org/news/2013/05/21/130521-australia-coins-kilwa/"
      quote: "five 1,000-year-old copper coins thought to have been minted in the former Kilwa sultanate"
- card: kilwa-kisiwani
  fact: "In 1944 Australian serviceman Maurie Isenberg found five Kilwa copper coins and four Dutch coins on the Wessel Islands off Arnhem Land."
  sources:
    - title: "Australian Geographic: Ancient coins could redraft Australian history (2013)"
      url: "https://australiangeographic.com.au/?p=12992"
      quote: "five ancient African coins discovered on a beach in Arnhem Land in 1944... The Kilwa coins were discovered alongside four Dutch coins"
    - title: "Medievalists.net: Indiana University release on Kilwa coins in Australia"
      url: "https://www.medievalists.net/?p=41395"
      quote: "Four of the coins were identified as Dutch East India Company coins... The other five coins... were African coins from the once flourishing Kilwa Sultanate"
- card: kilwa-kisiwani
  fact: "They turned out to be coins of the Kilwa sultanate."
  sources:
    - title: "Australian Geographic: Ancient coins could redraft Australian history (2013)"
      url: "https://australiangeographic.com.au/?p=12992"
      quote: "The five coins, found by RAAF serviceman Morry Isenberg on the Northern Territory's Wessel Islands, hail from the medieval sultanate of Kilwa"
    - title: "Medievalists.net: Indiana University release on Kilwa coins in Australia"
      url: "https://www.medievalists.net/?p=41395"
      quote: "Four of the coins were identified as Dutch East India Company coins... The other five coins... were African coins from the once flourishing Kilwa Sultanate"
- card: kilwa-kisiwani
  fact: "How the coins reached Australia is unknown: a shipwreck or an old trade route are possibilities."
  sources:
    - title: "Archaeology (AIA): African Coins Could Rewrite Australia's Past (2013), courtesy IUPUI"
      url: "https://archaeology.org/news/2013/05/21/130521-australia-coins-kilwa/"
      quote: "The coins may have washed ashore from a shipwreck, or there may have been maritime trading routes linking east Africa, Arabia, India, and the Spice Islands to Australia"
    - title: "Australian Geographic: Ancient coins could redraft Australian history (2013)"
      url: "https://australiangeographic.com.au/?p=12992"
      quote: "An upcoming expedition will attempt to uncover the truth behind five ancient African coins"
- card: kilwa-kisiwani
  fact: "The Portuguese seized Kilwa in 1505 and it gradually declined; its ruins are a World Heritage site."
  sources:
    - title: "Encyclopaedia Britannica: Kilwa"
      url: "https://www.britannica.com/place/Kilwa"
      quote: "Held briefly by the Portuguese (1505–12), it thereafter gradually declined in importance and was finally abandoned."
    - title: "UNESCO World Heritage Centre: Ruins of Kilwa Kisiwani and Ruins of Songo Mnara"
      url: "https://whc.unesco.org/en/list/144/"
      quote: "In the 16th century, the Portuguese established a fort on Kilwa Kisiwani and the decline of the two islands began."
- card: kasubi-tombs
  fact: "In 1882 Kabaka Mutesa I built a palace on Kasubi Hill, in today's Kampala."
  sources:
    - title: "UNESCO World Heritage Centre: Tombs of Buganda Kings at Kasubi"
      url: "https://whc.unesco.org/en/list/1022/"
      quote: "The latest building was the former palace of the Kabakas of Baganda, built in 1882 and converted into the royal burial ground in 1884."
    - title: "The Observer (Kampala): A tour of the refurbished Kasubi tombs (2024)"
      url: "https://observer.ug/lifestyle-entertainment/a-tour-of-the-refurbished-kasubi-tombs-ahead-of-their-official-reopening/"
      quote: "The palace was established in 1882 by Kabaka Mutesa I who was the 30th king of Buganda."
- card: kasubi-tombs
  fact: "When he died in 1884 Mutesa I was buried in his palace, which became the royal burial ground."
  sources:
    - title: "UNESCO World Heritage Centre: Tombs of Buganda Kings at Kasubi"
      url: "https://whc.unesco.org/en/list/1022/"
      quote: "the former palace of the Kabakas of Buganda, built in 1882 and converted into the royal burial ground in 1884"
    - title: "Daily Monitor: Uganda loses key heritage site (2010)"
      url: "https://www.monitor.co.ug/uganda/news/national/uganda-loses-key-heritage-site-1470842"
      quote: "Kasubi was initially the palace for Kabaka Mutesa I (1835-1884), who was buried at his palace"
- card: kasubi-tombs
  fact: "Three successors were buried there too: Mwanga II, Daudi Chwa II and Mutesa II."
  sources:
    - title: "Daily Monitor: Uganda loses key heritage site (2010)"
      url: "https://www.monitor.co.ug/uganda/news/national/uganda-loses-key-heritage-site-1470842"
      quote: "His son Mwanga II (1867-1903) was buried in the same palace... leading to the burial of two other Kabakas; Daudi Chwa II (1896-1939) and Muteesa II (1924-1969)"
    - title: "The Observer (Kampala): A tour of the refurbished Kasubi tombs (2024)"
      url: "https://observer.ug/lifestyle-entertainment/a-tour-of-the-refurbished-kasubi-tombs-ahead-of-their-official-reopening/"
      quote: "which houses tombs of Ssekabaka Muteesa I, Ssekabaka Muteesa II, Ssekabaka Daudi Chwa and Ssekabaka Mwanga"
- card: kasubi-tombs
  fact: "The main tomb, Muzibu Azaala Mpanga, is a round domed building of plant materials: poles, grass, reeds and wattle."
  sources:
    - title: "UNESCO World Heritage Centre: Tombs of Buganda Kings at Kasubi"
      url: "https://whc.unesco.org/en/list/1022/"
      quote: "The main tomb building, which is circular and surmounted by a dome, is a major example of an architectural achievement that was raised with use of vegetal materials comprised of wooden poles, spear grass, reeds and wattle."
    - title: "Daily Monitor: Uganda loses key heritage site (2010)"
      url: "https://www.monitor.co.ug/uganda/news/national/uganda-loses-key-heritage-site-1470842"
      quote: "four previous Kabakas (kings) of Buganda Kingdom were buried in the dome-shaped main building named Muzibu Azaala Mpanga"
- card: kasubi-tombs
  fact: "A bark-cloth curtain screens the 'forest' where the kings lie; only a few, the widows of the kabakas among them, may pass."
  sources:
    - title: "Daily Monitor: Uganda loses key heritage site (2010)"
      url: "https://www.monitor.co.ug/uganda/news/national/uganda-loses-key-heritage-site-1470842"
      quote: "The inside of the tomb that burnt was partitioned with a huge bark cloth that separated the \"sacred forest\" where the four royal graves lie. The entrance to the sacred forest was limited to the widows of the Kabakas, the royal family, the Nalinya..."
    - title: "The Observer (Kampala): A tour of the refurbished Kasubi tombs (2024)"
      url: "https://observer.ug/lifestyle-entertainment/a-tour-of-the-refurbished-kasubi-tombs-ahead-of-their-official-reopening/"
      quote: "There is a long wooden beam in front of the four tombs, where only a sitting king and the widows of fallen kings can cross. Behind the tombs hangs a bark cloth curtain to the 'kings' forest'."
- card: kasubi-tombs
  fact: "Kasubi became a World Heritage site in 2001."
  sources:
    - title: "UNESCO World Heritage Centre: Tombs of Buganda Kings at Kasubi"
      url: "https://whc.unesco.org/en/list/1022/"
      quote: "Date of Inscription: 2001"
    - title: "Daily Monitor / AFP: UNESCO removes Uganda tombs from endangered heritage list (2023)"
      url: "https://www.monitor.co.ug/uganda/news/national/unesco-removes-uganda-tombs-from-endangered-heritage-list-4367036"
      quote: "the tombs were declared a UNESCO World Heritage Site in 2001"
- card: kasubi-tombs
  fact: "Fire destroyed the main house on 16 March 2010."
  sources:
    - title: "The Observer (Kampala): A tour of the refurbished Kasubi tombs (2024)"
      url: "https://observer.ug/lifestyle-entertainment/a-tour-of-the-refurbished-kasubi-tombs-ahead-of-their-official-reopening/"
      quote: "The tombs were obliterated by fire on March, 16, 2010 at around 8:30 pm"
    - title: "Daily Monitor: Uganda loses key heritage site (2010)"
      url: "https://www.monitor.co.ug/uganda/news/national/uganda-loses-key-heritage-site-1470842"
      quote: "The Kasubi tombs, which were torched Tuesday by a mysterious fire"
- card: kasubi-tombs
