  fact: "A large share of its vocabulary is Portuguese."
  sources:
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "Portuguese words make up almost 40 percent of its vocabulary"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "The nature of the deep lexical influence of Portuguese on Saramaccan"
- card: saramaccan
  fact: "Much of its grammar is African."
  sources:
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "having a greater proportion of syntactic patterns that reflect the influence of the African substrate languages"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "This pattern corresponds to the one found in the Gbe languages as well"
