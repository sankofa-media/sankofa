      url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102"
      quote: "the palenquero language, the only creole language in Latin America with a lexical Spanish basis and grammatical characteristics of Bantu languages"
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "the core of its population consisted of Kikongo speakers... Its daily lexicon is almost entirely Spanish-based"
- card: palenquero
  fact: "It is the only Spanish-based creole on the South American mainland."
  sources:
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "Palenquero is the only Spanish-based creole on the South American mainland."
    - title: "UNESCO ICH: Cultural space of Palenque de San Basilio"
      url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102"
      quote: "the only creole language in Latin America with a lexical Spanish basis and grammatical characteristics of Bantu languages"
- card: palenquero
  fact: "In the 17th century people who escaped slavery near Cartagena built fortified refuges called palenques; San Basilio grew out of one."
  sources:
    - title: "UNESCO ICH: Cultural space of Palenque de San Basilio"
      url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102"
      quote: "Palenque de San Basilio was one of the walled communities called palenques, which were founded by escaped slaves as a refuge in the seventeenth century."
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "during the 17th century small groups of escaped slaves managed to establish their first palenques (fortifications) in Cartagena's hinterland"
- card: palenquero
  fact: "In the 20th century Palenqueros faced ridicule and discrimination and young people increasingly spoke Spanish."
  sources:
    - title: "John M. Lipski, The 'new' Palenquero (2012)"
      url: "https://johnlipski.github.io/newpal.pdf"
      quote: "Palenquero speakers were the object of ridicule and discrimination in the village schools and in neighboring communities... younger people tended to speak to one another increasingly only in Spanish"
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "Throughout much of the 20th century, its creole was heavily stigmatized... Between 1970 and 2000 this led younger generations to abandon Palenquero in favour of Spanish."
- card: palenquero
  fact: "Linguists predicted the language's death, but young Palenqueros took it up again as a sign of pride."
  sources:
    - title: "John M. Lipski, The 'new' Palenquero (2012)"
      url: "https://johnlipski.github.io/newpal.pdf"
      quote: "the end of the historical cycle of the Palenquero language is not far off... an endangered language shunned by many Palenqueros has been revitalized and adopted as a proud symbol of ethnicity"
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "Many adolescents now take great pleasure in learning the creole, and gone are the days when Palenquero (and with it local culture) was shunned."
- card: palenquero
  fact: "In 2005 UNESCO proclaimed the cultural space of Palenque, with its music, healing, funeral rites and language, a masterpiece of oral and intangible heritage."
  sources:
    - title: "UNESCO ICH: Cultural space of Palenque de San Basilio"
      url: "https://ich.unesco.org/en/RL/cultural-space-of-palenque-de-san-basilio-00102"
      quote: "originally proclaimed in 2005... encompasses social, medical and religious practices as well as musical and oral traditions... The complex funeral rituals and medical practices... Central to the cultural space of Palenque de San Basilio is the palenquero language"
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "In 2005, UNESCO proclaimed Palenque as a \" Masterpiece of the Oral and Intangible Heritage of Humanity \"."
- card: palenquero
  fact: "The village has been bilingual in Spanish and Palenquero for some three hundred years."
  sources:
    - title: "APiCS Online, Armin Schwegler: Palenquero"
      url: "https://apics-online.info/surveys/48"
      quote: "Palenque has been a bilingual (Spanish/ Palenquero ) community for about three hundred years."
    - title: "John M. Lipski, The 'new' Palenquero (2012)"
      url: "https://johnlipski.github.io/newpal.pdf"
      quote: "Ever since that time the community has been bilingual, with the Palenquero language deliberately maintained and taught to succeeding generations... preserved for more than three hundred years"
- card: black-dispatches
  fact: "Black people, enslaved and free, were among the Union's best sources of intelligence on the Confederacy."
  sources:
    - title: "P. K. Rose, Black Dispatches, CIA Center for the Study of Intelligence"
      url: "https://www.cia.gov/resources/csi/static/Black-Dispatches.pdf"
