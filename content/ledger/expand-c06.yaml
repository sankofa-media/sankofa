    - title: "Nancie L. Gonzalez, Garifuna, Encyclopedia of World Cultures"
      url: "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/garifuna"
      quote: "In 1797 those with the darkest skin color, (termed \"Black Carib\") mostly resident on Saint Vincent, were forcibly removed from that island and sent to Spanish Honduras."
