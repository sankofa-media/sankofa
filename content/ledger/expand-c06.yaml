- card: saramaccan
  fact: "Like Papiamento, Saramaccan is a creole that uses tone."
  sources:
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "Like Papiamentu , Saramaccan also preserves an African system of pitches or tones"
    - title: "APiCS Online: Papiamentu"
      url: "https://apics-online.info/surveys/47"
      quote: "Both stress and tone play a role in the phonology of Papiamentu ."
- card: palenquero
