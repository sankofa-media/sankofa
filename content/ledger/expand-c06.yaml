  fact: "UNESCO warned that migration, discrimination and the language's near absence from schools threatened it."
  sources:
    - title: "UNESCO ICH: Language, dance and music of the Garifuna"
      url: "https://ich.unesco.org/en/RL/language-dance-and-music-of-the-garifuna-00001"
      quote: "economic migration, discrimination and the complete absence of the Garifuna language from the school system are endangering its survival. Although the language is still widely spoken, it is now taught in only one village."
    - title: "The Art Newspaper: Masterpieces of Oral and Intangible Heritage of Humanity (2001)"
      url: "https://www.theartnewspaper.com/2001/12/01/masterpieces-of-oral-and-intangible-heritage-of-humanity-a-new-list-by-unesco"
