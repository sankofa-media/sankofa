- card: saramaccan
  fact: "Saramaccan is a creole spoken in the rainforest interior of Suriname by two maroon peoples, the Saramaka and the Matawai."
  sources:
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
