      url: "https://ich.unesco.org/en/RL/language-dance-and-music-of-the-garifuna-00001"
      quote: "Inscribed in 2008 ( 3.COM ) on the Representative List of the Intangible Cultural Heritage of Humanity (originally proclaimed in 2001)"
