    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "Saramaccan dialects are spoken by the Saramaccan and Matawai tribes."
- card: saramaccan
  fact: "Its foundation is the English of the colonists who held Suriname from 1651 to 1667."
  sources:
    - title: "Encyclopaedia Britannica, Salikoko S. Mufwene: Saramaccan"
      url: "https://www.britannica.com/topic/Saramaccan"
      quote: "its foundations lie in the nonstandard varieties of English spoken by British colonists who controlled Suriname from 1651 to 1667"
    - title: "APiCS Online: Saramaccan"
      url: "https://apics-online.info/surveys/3"
      quote: "Surinam was first successfully colonized in 1651 by the English. In 1667 it was assigned to the Dutch"
