# Second, independent check of content/cards/samba.md / samba.ru.md and
# content/ledger/perspective-samba.yaml (2026-11-15). Every source quoted below was opened
# by the checker (IMS QR 10/13/18/19, Cravo Albin Tia Ciata and Donga, Jornal da USP,
# Agência Brasil, Rolling Stone Brasil, Monteiro, Gomes, Menezes Bastos, Conde & Shaw,
# Chazkel, Brasil de Fato, UNESCO, York, AAIHS, Riotur, Paranhos, Cambridge, Ari Lima/UFRB).
# The Jornal do Comércio 2016 piece is a copy of the Agência Brasil text and counts once.
