- card: samba
  copy: both
  fact: "Samba de roda gathers people in a circle in the Recôncavo; participants sing, play, clap and take turns dancing in the middle"
  verdict: confirmed
  sources:
    - {title: "UNESCO ICH: Samba de Roda of the Recôncavo of Bahia", url: "https://ich.unesco.org/en/RL/samba-de-roda-of-the-reconcavo-of-bahia-00101", quote: "the gathering of participants in a circle, referred to as roda. It is generally performed only by women, each one taking her turn in the center of the ring surrounded by others dancing in the circle while clapping their hands and singing"}
    - {title: "York University, Danielle Robinson’s field research on samba de roda (2010)", url: "https://www.yorku.ca/yfile/2010/07/16/york-dance-professor-researches-the-samba-de-roda/", quote: "People switch between dancing, playing, singing and clapping as the spirit moves them. No one can just watch, everyone eventually ends up in the circle"}
  note: ""
