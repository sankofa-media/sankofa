  sources:
    - {title: "UNESCO ICH: Samba de Roda of the Recôncavo of Bahia", url: "https://ich.unesco.org/en/RL/samba-de-roda-of-the-reconcavo-of-bahia-00101", quote: "The Samba de Roda, which involves music, dance and poetry, is a popular festive event"}
    - {title: "Cambridge International, IGCSE Music teachers guide (2024)", url: "https://www.cambridgeinternational.org/Images/664649-2024-teacher-s-guide.pdf", quote: "Samba is an Afro-Brazilian form of clamorous dance music"}
