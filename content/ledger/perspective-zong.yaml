- card: zong
  copy: female
  fact: "Philip used only the words of the two-page case report Gregson v. Gilbert, broken apart across the page"
  sources:
    - {title: "CBC Radio IDEAS: M. NourbeSe Philip's epic poem Zong! (2021)", url: "https://www.cbc.ca/lite/story/1.6266570", quote: "\"The two page document contains some 500-plus different words. I decided that I would lock myself in that text and only use the words that appear in that case report,\" ... The resulting poem shows the words, syllables, and letters of the case report cast across pages."}
    - {title: "M. NourbeSe Philip: Set Speaks, backstory", url: "https://www.setspeaks.com/backstory/", quote: "relies entirely on a two-page court report, Gregson vs. Gilbert ... uses only the words and their components of the case report Gregson vs. Gilbert to compose the poetry"}
    - {title: "McGill Faculty of Law: reading of Zong! with M. NourbeSe Philip", url: "https://mcgill.ca/law/node/8889", quote: "Zong! is a book length poem composed entirely from the words of the infamous case report, Gregson v. Gilbert (1783)."}
- card: zong
  copy: female
  fact: "The poem remakes the report's language so that it remembers those who died"
  sources:
    - {title: "CBC Radio IDEAS: M. NourbeSe Philip's epic poem Zong! (2021)", url: "https://www.cbc.ca/lite/story/1.6266570", quote: "ripping apart and reconfiguring the language in a way that remembers those who died"}
    - {title: "Wesleyan University Press: M. NourbeSe Philip author site", url: "https://nourbesephilip.site.wesleyan.edu/", quote: "It excavates the legal text to reveal the irrational at the heart of 'reason.'"}
    - {title: "AALBC: M. NourbeSe Philip", url: "https://aalbc.com/authors/M.-NourbeSe-Philip", quote: "Zong! is both a memorial and a radical commentary on the ways in which the law and language have been complicit in the horrors of slavery."}
