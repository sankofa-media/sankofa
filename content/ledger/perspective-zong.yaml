    - {title: "HISTORY UK: Olaudah Equiano and the Zong massacre", url: "https://www.history.co.uk/article/olaudah-equiano-and-the-zong-massacre", quote: "His autobiography, published in 1789, became a bestseller"}
- card: zong
  copy: male
  fact: "Equiano toured Britain and Ireland with the book"
  sources:
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "vigorously promoted it by going on lecture tours around England, Scotland, Wales, and Ireland"}
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "travelled across the country to present the case for abolishing slavery"}
    - {title: "Dublin Inquirer: Olaudah Equiano's Irish Friends", url: "https://www.dublininquirer.com/donal-olaudah-equiano-s-irish-friends/", quote: "Equiano himself recalled that \"in May 1791 I sailed from Liverpool to Dublin where I was very kindly received, and from thence to Cork, and then travelled over many counties in Ireland.\""}
