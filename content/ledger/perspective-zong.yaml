# Perspective rewrite of zong (2026-11-15): shared frame, {male} Olaudah Equiano (with Granville Sharp), {female} M. NourbeSe Philip.
# One entry per fact in the new or rewritten paragraphs. The opening paragraph and the 1787/Brookes sentence keep
# their earlier sourcing (context-b.yaml); they are repeated here where they were reworded.
- card: zong
  copy: both
  fact: "Some of the Africans were thrown overboard after rain had replenished the water the crew later claimed was running out"
  sources:
    - {title: "Jeremy Krikler, A Chain of Murder in the Slave Trade, International Review of Social History (2012)", url: "https://www.cambridge.org/core/journals/international-review-of-social-history/article/chain-of-murder-in-the-slave-trade-a-wider-context-of-the-zong-massacre/B94B605F1EDD131DD125DB6CB73DFA89", quote: "some of the murders had taken place after rain had restocked the ship with water"}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "rain had fallen before the third and final jettison of enslaved people"}
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "The ship's crew later claimed that their drinking water was running out"}
- card: zong
  copy: both
  fact: "In March 1783 a jury at London's Guildhall found for the owners"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "A trial was held in March 1783 at the Guildhall in central London to settle the dispute. ... The ship owners won the first case, but the verdict was appealed."}
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "The jury decided that the underwriters were obliged, under law, to pay."}
- card: zong
  copy: both
  fact: "On the insurers' appeal Lord Mansfield said the case of slaves was the same as if horses had been thrown overboard"
  sources:
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "...the Case of Slaves was the same as if Horses had been thrown overboard."}
    - {title: "Trevor Burnard, A New Look at the Zong Case of 1783, XVII-XVIII 76 (2019)", url: "https://journals.openedition.org/1718/1808?lang=en", quote: "[Mansfield stated that] the Case of Slaves was the same as if Horses had been thrown over board"}
    - {title: "CBC Radio IDEAS: M. NourbeSe Philip's epic poem Zong! (2021)", url: "https://www.cbc.ca/lite/story/1.6266570", quote: "\"[Mansfield] said, 'As much as it shocks one, it is the same as horses being thrown overboard',\" historian James Walvin told CBC Radio's IDEAS"}
- card: zong
  copy: both
  fact: "The May 1783 hearing granted a new trial, and there is no evidence it was held"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "That hearing, which took place on 21–22 May 1783 ... Lord Mansfield and Justices Wills and Buller agreed with the underwriters and decided that there should be a new trial."}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "In light of this new evidence, Lord Mansfield ordered a new trial. ... There is no record of this ever taking place."}
- card: zong
  copy: both
  fact: "No one was ever charged with murder"
  sources:
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "But nobody was ever prosecuted for the murders."}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "Sharp attempted to bring criminal charges against the captain, crew, and the owners but was unsuccessful."}
    - {title: "Jamaica Observer: The Zong massacre (2017)", url: "https://jamaicaobserver.com/2017/08/05/the-zong-massacre", quote: "efforts by Sharp and others, including legendary freed slave and freedom activist Olaudah Equiano, to bring criminal charges failed"}
- card: zong
  copy: male
  fact: "Equiano had bought his own freedom in 1766"
  sources:
    - {title: "London Museum: Olaudah Equiano, writer and abolitionist", url: "https://www.londonmuseum.org.uk/collections/london-stories/olaudah-equiano-writer-abolitionist/", quote: "which he purchased from one of his enslavers Robert King in 1766 for £40"}
    - {title: "Brycchan Carey: Equiano biography", url: "https://brycchancarey.com/equiano/biog.htm", quote: "he saved up £40, the price of his own freedom"}
- card: zong
  copy: male
  fact: "Equiano carried news of the verdict to Granville Sharp"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "On 19 March 1783, the African Olaudah Equiano called on anti-slavery campaigner Granville Sharp [three days after the London case was heard]"}
    - {title: "HISTORY UK: Olaudah Equiano and the Zong massacre", url: "https://www.history.co.uk/article/olaudah-equiano-and-the-zong-massacre", quote: "On hearing of the Zong trial, Equiano brought it to the attention of Granville Sharp"}
    - {title: "HISTORY.com: Zong slave ship trial", url: "https://history.com/this-day-in-history/zong-slave-ship-trial", quote: "Olaudah Equiano told the abolitionist Granville Sharp of the Zong affair"}
- card: zong
  copy: male
  fact: "Sharp had the May hearing taken down"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "That hearing, which took place on 21–22 May 1783, was recorded at Granville Sharp's request."}
    - {title: "Royal Museums Greenwich, REC/19: Documents relating to the ship Zong, 1783", url: "https://www.rmg.co.uk/collections/archive/rmgc-object-500960", quote: "The volume includes a copy of Granville Sharp's letter to the Lords Commissioners of the Admiralty dated 2 July 1783, an Account of the Murder of the Enslaved on board the Zong, a transcript of court proceedings"}
    - {title: "Andrew Lyall, Granville Sharp's Cases on Slavery (Hart, 2017), publisher's description", url: "https://www.barnesandnoble.com/w/granville-sharps-cases-on-slavery-andrew-lyall/1124893061", quote: "The unpublished materials are mostly verbatim transcripts made by shorthand writers commissioned by Granville Sharp"}
- card: zong
  copy: male
  fact: "Sharp then asked the Admiralty to try the crew for murder (the July date was dropped from the card: only the RMG catalogue gives it)"
  sources:
    - {title: "Royal Museums Greenwich, REC/19: Documents relating to the ship Zong, 1783", url: "https://www.rmg.co.uk/collections/archive/rmgc-object-500960", quote: "a copy of Granville Sharp's letter to the Lords Commissioners of the Admiralty dated 2 July 1783"}
    - {title: "Palgrave Macmillan description of Michelle Faubert, Granville Sharp's Uncovered Letter and the Zong Massacre (2018)", url: "https://esclh.blogspot.com/2018/10/book-michelle-faubert-granville-sharps.html", quote: "Sharp demands that the Admiralty bring murder charges against the crew of the Zong"}
    - {title: "Jamaica Observer: The Zong massacre (2017)", url: "https://jamaicaobserver.com/2017/08/05/the-zong-massacre", quote: "a draft of a letter intended for the British Admiralty demanding criminal action ... for the murder of 132 Africans"}
- card: zong
  copy: male
  fact: "Nothing came of Sharp's efforts"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "He embarked on yet another personal campaign, this time to bring to justice the guilty men from the Zong (he failed)."}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "Sharp attempted to bring criminal charges against the captain, crew, and the owners but was unsuccessful."}
- card: zong
  copy: both
  fact: "Outrage over the killings fed the abolition society founded in 1787"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "a direct line of descent from outrage at the Zong affair in 1783 to the founding of the Abolition Society in 1787"}
    - {title: "London Museum: The Zong massacre trial", url: "https://londonmuseum.org.uk/collections/london-stories/zong-massacre-trial/", quote: "the obvious brutality of the massacre did help anti-slavery campaigners"}
    - {title: "HISTORY.com: Zong slave ship trial", url: "https://history.com/this-day-in-history/zong-slave-ship-trial", quote: "A few months after the Zong trial, the Society of Friends began to campaign against slavery, and the Society for the Abolition of the Slave Trade was founded four years later."}
- card: zong
  copy: both
  fact: "Abolitionists went on to make the slave ship an image in the Brookes print"
  sources:
    - {title: "Royal Museums Greenwich: The slave ship 'Brooks'", url: "https://www.rmg.co.uk/collections/objects/rmgc-object-254938", quote: "In 1788, abolitionists in Britain commissioned a drawing of how people were squeezed on board the 'Brooks' to raise awareness of the inhumanity of the slave trade."}
    - {title: "Understanding Slavery Initiative: Description of a slave ship", url: "https://understandingslavery.com/?p=547", quote: "It was commissioned by Thomas Clarkson from the abolitionist publisher James Phillips in 1788, and the Committee of the Abolition of Slavery used it to inform and shock the public."}
- card: zong
  copy: both
  fact: "The Zong was Liverpool-owned and overshot Jamaica in late 1781"
  sources:
    - {title: "Understanding Slavery Initiative: The Zong", url: "https://understandingslavery.com/casestudy/the-zong/", quote: "the Liverpool owners of the ship ... mistaking Jamaica for the French colony of St Domingue (later Haiti) and overshot Jamaica. Between 29 November and 1 December, three groups, totalling 132 people, were thrown to their deaths"}
    - {title: "Insurance Museum: John Lane, The Zong Massacre", url: "https://insurance.museum/history-article-the-zong-massacre-1781-an-insurers-perspective", quote: "owned by a consortium of wealthy merchants and slave owners from Liverpool ... They had made navigational errors by mistaking Jamaica for the French colony of Saint-Dominique"}
    - {title: "Jeremy Krikler, A Chain of Murder in the Slave Trade (2012)", url: "https://www.cambridge.org/core/journals/international-review-of-social-history/article/chain-of-murder-in-the-slave-trade-a-wider-context-of-the-zong-massacre/B94B605F1EDD131DD125DB6CB73DFA89", quote: "By the time the ship missed Jamaica owing to the Captain's navigational error"}
- card: zong
  copy: male
  fact: "In 1789 Equiano published The Interesting Narrative, and it became a best-seller"
  sources:
