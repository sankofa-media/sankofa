# Batch c30 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a verbatim quote.
# Dropped: red-square-protest-1963 (duplicate: black-russia-soviet already tells the December 1963 African students' march on Red Square as its moment).

- card: garrett-morgan
  fact: "Born in Paris, Kentucky, in 1877 to formerly enslaved parents"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Born in Paris, Ky., to Sydney and Eliza Reed, both former enslaved people"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "Garrett Morgan’s parents had been enslaved, but they were freed before his birth"}
- card: garrett-morgan
  fact: "At 14 he left the family farm for Cincinnati and hired a tutor"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "leaving home at age 14 for Cincinnati where he worked and hired a tutor to continue his education"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "at age 14 he left his family’s farm and moved to Cincinnati, Ohio . There he took a job as a handyman and hired a tutor"}
- card: garrett-morgan
  fact: "In 1895 he moved to Cleveland and repaired sewing machines, then ran a clothing business"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "He came to Cleveland on 17 June 1895. After various positions as a sewing-machine adjuster"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "In 1895 he moved to Cleveland, where he began repairing sewing machines"}
- card: garrett-morgan
  fact: "He sold a hair-straightening product discovered while working on a solution for sewing needles"
  sources:
    - {title: "National Inventors Hall of Fame: Garrett Morgan", url: "https://www.invent.org/inductees/garrett-morgan", quote: "He also began experimenting with a liquid for polishing sewing machine needles"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "He later discovered that it was safe to use for straightening hair and patented the formula"}
- card: garrett-morgan
  fact: "The Triangle shirtwaist fire of 1911 reportedly inspired the breathing hood"
  sources:
    - {title: "National Inventors Hall of Fame: Garrett Morgan", url: "https://www.invent.org/inductees/garrett-morgan", quote: "when he learned about the devastating Triangle Shirtwaist Co. fire"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "His interest reportedly arose from the devastating Triangle shirtwaist factory fire (1911)"}
- card: garrett-morgan
  fact: "The hood's tube drew cleaner air from near the floor; patented in 1914"
  sources:
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "The tube reached the ground, where the air is usually cleaner"}
    - {title: "National Inventors Hall of Fame: Garrett Morgan", url: "https://www.invent.org/inductees/garrett-morgan", quote: "supply himself at will with fresh air from near the floor"}
    - {title: "Google Patents: US1113675A, Breathing device", url: "https://patents.google.com/patent/US1113675A/en", quote: "Patented Oct. 13, 1914"}
- card: garrett-morgan
  fact: "Racism hurt sales and he hired white actors to demonstrate the hood"
  sources:
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "racism hindered its sales, so Morgan hired white actors to sell the hood"}
    - {title: "National Inventors Hall of Fame: Garrett Morgan", url: "https://www.invent.org/inductees/garrett-morgan", quote: "He also hired white actors to promote the product at conventions"}
- card: garrett-morgan
  fact: "On 25 July 1916 Cleveland police called him to a gas-filled tunnel under Lake Erie after an explosion"
  sources:
    - {title: "USPTO, Journeys of Innovation: Of courage and caution", url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "In the early morning hours of July 25, 1916, Garrett Morgan awoke to the incessant ringing of the telephone. On the line was Cleveland’s police department."}
    - {title: "Encyclopedia of Cleveland History: Waterworks Tunnel Disasters", url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "entered the gas-filled tunnel at the request of the Cleveland police"}
- card: garrett-morgan
  fact: "Earlier would-be rescuers had died in the gas"
  sources:
    - {title: "Encyclopedia of Cleveland History: Waterworks Tunnel Disasters", url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "killing 11 men and 10 would-be rescuers who were overcome by gas"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "the gas and smoke killed some 10 would-be rescuers"}
- card: garrett-morgan
  fact: "Morgan and his brother Frank went down wearing his hoods and brought men out alive (numbers disputed)"
  sources:
    - {title: "Encyclopedia of Cleveland History: Waterworks Tunnel Disasters", url: "https://case.edu/ech/articles/w/waterworks-tunnel-disasters", quote: "who with his brother Frank and 2 others entered the gas-filled tunnel"}
    - {title: "Carnegie Hero Fund Commission: Shedding light on the complicated case of Black inventor Garrett Morgan", url: "https://carnegiehero.org/behind-the-scenes-shedding-light-on-the-complicated-case-of-black-inventor-garrett-morgan", quote: "they all donned Morgan’s smoke hoods"}
    - {title: "USPTO, Journeys of Innovation: Of courage and caution", url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "Morgan and the other rescuers were able to find eight survivors"}
- card: garrett-morgan
  fact: "Four white rescuers received Carnegie Medals; Morgan did not"
  sources:
    - {title: "USPTO, Journeys of Innovation: Of courage and caution", url: "https://www.uspto.gov/learning-and-resources/journeys-innovation/historical-stories/courage-and-caution", quote: "Four white men who participated in the tunnel rescue were awarded medals by the Carnegie Hero Fund Commission"}
    - {title: "Carnegie Hero Fund Commission: Shedding light on the complicated case of Black inventor Garrett Morgan", url: "https://carnegiehero.org/behind-the-scenes-shedding-light-on-the-complicated-case-of-black-inventor-garrett-morgan", quote: "in 1917 only four were awarded the Carnegie Medal — Dolan, Clancy, McGrath, and Keating. None of Johnston’s, Van Duzen’s nor Morgan’s rescue parties were awarded."}
- card: garrett-morgan
  fact: "In 1923 he patented a T-shaped signal with a position stopping traffic in all directions, forerunner of the amber light"
  sources:
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "a forerunner of today’s yellow, or amber, light"}
    - {title: "National Inventors Hall of Fame: Garrett Morgan", url: "https://www.invent.org/inductees/garrett-morgan", quote: "stopped traffic “in all directions before the signal to proceed in any one direction is given.”"}
    - {title: "Google Patents: US1475024A, Traffic signal", url: "https://patents.google.com/patent/US1475024A/en", quote: "Patented Nov. 2G, i923"}
- card: garrett-morgan
  fact: "He sold the traffic signal rights to General Electric for $40,000"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Morgan sold his traffic light to General Electric Co. for $40,000 in 1923"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "sold the rights to the device to the General Electric Corporation for $40,000"}
- card: garrett-morgan
  fact: "He founded the weekly Cleveland Call in 1920"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Morgan in 1920 founded the Cleveland Call, a weekly newspaper"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "In 1920 Morgan started the weekly newspaper the Cleveland Call"}
- card: garrett-morgan
  fact: "He died in Cleveland in 1963"
  sources:
    - {title: "Encyclopedia of Cleveland History: Morgan, Garrett A.", url: "https://case.edu/ech/articles/m/morgan-garrett-a", quote: "Garrett A. Morgan died in Cleveland"}
    - {title: "Encyclopaedia Britannica: Garrett Morgan", url: "https://www.britannica.com/biography/Garrett-Morgan", quote: "died July 27, 1963, Cleveland , Ohio"}
- card: bessie-coleman
  fact: "Born 1892, one of thirteen children"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "She was born in Texas in 1892 and was one of 13 children"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "One of 13 children"}
- card: bessie-coleman
  fact: "She worked as a manicurist in Chicago"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "left her job as a manicurist in Chicago"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "moving to Chicago , where she worked as a manicurist"}
- card: bessie-coleman
  fact: "American flying schools turned her down because of race (and sex)"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "She trained in France because no American flight school would accept her as a student."}
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "was rejected because of her race and gender"}
- card: bessie-coleman
  fact: "With Robert Abbott's help she learned French and went to France in 1920"
  sources:
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "On his advice, Coleman learned French"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "she learned French and in 1920 was accepted at the Caudron Brothers School of Aviation in Le Crotoy, France. Black philanthropists Robert Abbott , founder of the Chicago Defender"}
- card: bessie-coleman
  fact: "She trained at the Caudron brothers' school at Le Crotoy"
  sources:
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "the Ecole d’Aviation des Frères Caudron at Le Crotoy in the Somme"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "Caudron Brothers School of Aviation in Le Crotoy, France"}
- card: bessie-coleman
  fact: "On 15 June 1921 the FAI granted her a pilot's licence"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "Coleman received her flying license on June 15, 1921"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "On June 15, 1921, she became the first American woman to obtain an international pilot’s license from the Fédération Aéronautique Internationale"}
- card: bessie-coleman
  fact: "She was the first African American woman to hold a pilot's licence"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "her legacy as the first African American woman to earn a pilot’s license"}
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "Bessie Coleman, the first African American licensed pilot"}
- card: bessie-coleman
  fact: "Bias kept her out of commercial flying; she became a barnstormer"
  sources:
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "racial and gender biases precluded her becoming a commercial pilot. Stunt flying, or barnstorming, was her only career option"}
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "got a job as a barnstorming pilot, performing stunts at aviation shows"}
- card: bessie-coleman
  fact: "She refused to perform for segregated crowds"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "Coleman would only perform in exhibition shows if the crowds were desegregated"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "she refused to perform before segregated audiences in the South"}
- card: bessie-coleman
  fact: "She saved for a school to train Black aviators but never opened it"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "Before she could open her flight school"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "She also raised money to found a school to train black aviators. Before she could found her school"}
- card: bessie-coleman
  fact: "On 30 April 1926, rehearsing for a show in Jacksonville, she was thrown from the plane and killed"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "Coleman died in an airplane crash on April 30, 1926. During practice for a May Day celebration"}
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "In April of 1926, Bessie Coleman prepared for a show at Jacksonville’s Field Day"}
    - {title: "Encyclopaedia Britannica: Bessie Coleman", url: "https://www.britannica.com/biography/Bessie-Coleman", quote: "during a rehearsal for an aerial show, the plane carrying Coleman spun out of control, catapulting her 2,000 feet to her death"}
- card: bessie-coleman
  fact: "A US postage stamp honoured her in 1995"
  sources:
    - {title: "National Air and Space Museum: How Bessie Coleman broke barriers to make history", url: "https://airandspace.si.edu/stories/editorial/how-bessie-coleman-broke-barriers-make-history", quote: "A U.S. postage stamp was issued in 1995 in Coleman’s honor"}
    - {title: "National Women's History Museum: Bessie Coleman", url: "https://www.womenshistory.org/education-resources/biographies/bessie-coleman", quote: "The Bessie Coleman stamp was issued on April 27, 1995"}
- card: eugene-bullard
  fact: "Born in Columbus, Georgia, in 1895"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "Born in a three-room house in Columbus"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "Bullard was born in Columbus, Georgia, on October 9, 1895"}
- card: eugene-bullard
  fact: "After his father's near-lynching he ran away from home in 1906"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "Shaken by the near lynching of his father in 1903 and seeking adventure in the world beyond Columbus, he ran away from home in 1906"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "After witnessing the near-lynching of his own father and other racial violence, Bullard ran away from home in 1906"}
- card: eugene-bullard
  fact: "In 1912 he stowed away on a German merchant ship to Aberdeen"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "as a stowaway on a German merchant ship, the Marta Russ , which departed Norfolk, Virginia, on March 4, 1912, bound for Aberdeen, Scotland"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "In 1912, as a teen, Bullard stowed away on a German merchant ship bound for Aberdeen, Scotland"}
- card: eugene-bullard
  fact: "He boxed and performed in a variety troupe; first fought in Paris in November 1913"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "Bullard performed in a vaudeville troupe and earned money as a prizefighter in Great Britain and elsewhere in Western Europe. He appeared in Paris for the first time at a boxing match in November 1913"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "He first appeared in Paris, his long-time destination, at a boxing match in November 1913"}
- card: eugene-bullard
  fact: "He joined the French Foreign Legion in WWI"
  sources:
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "He joined the French Foreign Legion"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "At age 19 he enlisted in the French Foreign Legion"}
- card: eugene-bullard
  fact: "Twice wounded, Croix de Guerre for Verdun"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "The French government awarded him the Croix de Guerre for his bravery at the Battle of Verdun. Twice wounded"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "He was seriously wounded twice and pulled out of action. France awarded him the Croix de Guerre"}
- card: eugene-bullard
  fact: "Unfit for infantry, he went to flight training"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "declared unfit for infantry service, he requested assignment to flight training"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "since he could no longer serve with the infantry, he should try to become a gunner. Bullard talked to the commanders and they transferred him to pilot training"}
- card: eugene-bullard
  fact: "He flew about twenty combat missions in 1917"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "flying twenty missions"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "Bullard flew around 20 missions"}
- card: eugene-bullard
  fact: "He flew with a pet monkey"
  sources:
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "his pet Capuchin monkey named Jimmy"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "often with a pet monkey"}
- card: eugene-bullard
  fact: "First African American combat pilot"
  sources:
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "the first African American combat aviator"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "There were around five black military pilots in World War I, and Bullard was the only American"}
- card: eugene-bullard
  fact: "The US air service refused him; he was taken off flying (reason disputed)"
  sources:
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "his application was denied, and the United States military pressured France to ground Bullard permanently"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "Gros used the excuse of Bullard’s lower rank to refuse his entry into the American Army Air Service"}
- card: eugene-bullard
  fact: "Between the wars he ran Montmartre nightclubs including L'Escadrille; knew Josephine Baker"
  sources:
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "eventually owned two nightclubs, including “L’Escadrille,” in the Montmartre section of Paris"}
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "eventually opened his own, L’Escadrille"}
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "he owned and managed nightclubs in the Montmartre section of Paris, where he emerged as a leading personality among such African American entertainers as Josephine Baker"}
- card: eugene-bullard
  fact: "In the late 1930s he spied on Germans for French counter-intelligence"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "In the late 1930s Bullard joined a French government counterintelligence network spying on Germans in Paris"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "His nightclubs were popular with German officers, who had no clue that Bullard, fluent in German, was indeed a spy"}
- card: eugene-bullard
  fact: "He reached New York and worked odd jobs including elevator operator at Rockefeller Center"
  sources:
    - {title: "Museum of Flight: Eugene Bullard, the first African American fighter pilot", url: "https://blog.museumofflight.org/eugene-bullard-the-first-african-american-fighter-pilot-and-veteran-of-two-world-wars", quote: "He picked up a series of odd jobs in New York City until he finally settled as an elevator operator at Rockefeller Center"}
    - {title: "BlackPast: Eugene James \"Jacques\" Bullard (Carla Garner)", url: "https://blackpast.org/african-american-history/bullard-eugene-jacques-1894-1961/", quote: "working odd jobs selling perfume and operating the elevator of the RCA building"}
- card: eugene-bullard
  fact: "In 1959 France made him a knight of the Legion of Honour"
  sources:
    - {title: "New Georgia Encyclopedia: Eugene Bullard (Craig Lloyd)", url: "https://www.georgiaencyclopedia.org/articles/history-archaeology/eugene-bullard-1895-1961/", quote: "In 1959 French president Charles de Gaulle made Bullard a knight of the French Legion of Honor"}
