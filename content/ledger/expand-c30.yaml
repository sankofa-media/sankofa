    - {title: "AAIHS: Fears of Black Political Activism in Cuba and Beyond (Devyn Spence Benson)", url: "https://www.aaihs.org/fears-of-black-political-activism-in-cuba-and-beyond-1912-2017/", quote: "to protest black exclusion from national office"}
