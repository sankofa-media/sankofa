    - {title: "Hugh Thomas, The Slave Trade (1997), chapter 1", url: "https://erenow.org/modern/atlanticslavetrade1440-1870/2.php", quote: "This cargo consisted of 235 slaves."}
    - {title: "Neves, Almeida, Ferreira, História de um arrabalde: o Poço dos Negros em Lagos (NOVA FCSH)", url: "https://projetos.dhlab.fcsh.unl.pt/files/original/0fcf68824db1df475c30240358f7423aea322e70.pdf", quote: "empresa saldada no aprisionamento de 235 peças, segundo os relatos de Gomes Eanes de Zurara"}
- card: lagos-1444
