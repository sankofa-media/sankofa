    - {title: "Hugh Thomas, The Slave Trade (1997), chapter 1", url: "https://erenow.org/modern/atlanticslavetrade1440-1870/2.php", quote: "For some kept their heads low, and their faces bathed in tears, looking one upon another. Others stood groaning very dolorously, looking up to the height of heaven ... others made lamentations in the manner of a dirge, after the custom of their country"}
- card: lagos-1444
  fact: "The division parted fathers from sons, husbands from wives, brothers from brothers"
  sources:
    - {title: "Gomes Eanes de Zurara, The Chronicle of the Discovery and Conquest of Guinea, vol. 1 (Hakluyt Society, 1896), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/35738/pg35738.txt", quote: "then was it needful to part fathers from sons, husbands from wives, brothers from brothers"}
    - {title: "Hugh Thomas, The Slave Trade (1997), chapter 1", url: "https://erenow.org/modern/atlanticslavetrade1440-1870/2.php", quote: "then was it needful to part fathers from sons, husbands from wives, brothers from brothers"}
- card: lagos-1444
  fact: "Townspeople and villagers left their work to watch"
  sources:
    - {title: "Gomes Eanes de Zurara, The Chronicle of the Discovery and Conquest of Guinea, vol. 1 (Hakluyt Society, 1896), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/35738/pg35738.txt", quote: "the field was quite full of people, both from the town and from the surrounding villages and districts, who for that day gave rest to their hands"}
