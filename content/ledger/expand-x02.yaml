    - {title: "Tamar Herzog, How Did Early-Modern Slaves in Spain Disappear?, Republics of Letters 3:1 (2012)", url: "https://shc.stanford.edu/arcade/publications/rofl/issues/volume-3-issue-1/how-did-early-modern-slaves-spain-disappear", quote: "in mid-sixteenth-century Seville 7.4 percent of censused inhabitants were slaves"}
