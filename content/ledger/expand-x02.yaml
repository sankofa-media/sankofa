    - {title: "Trinity College Dublin: Skeletons in mass Portuguese burial site belonged to African slaves", url: "https://www.tcd.ie/news_events/articles/skeletons-in-mass-portuguese-burial-site-belonged-to-african-slaves", quote: "the 158 skeletons"}
