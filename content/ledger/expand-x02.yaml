  sources:
    - {title: "Gomes Eanes de Zurara, The Chronicle of the Discovery and Conquest of Guinea, vol. 1 (Hakluyt Society, 1896), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/35738/pg35738.txt", quote: "On the next day, which was the 8th of the month of August, very early in the morning, by reason of the heat, the seamen began to make ready their boats, and to take out those captives"}
