- card: enslaved-in-renaissance-italy
  fact: "Venice was a great Mediterranean trading city and the Rialto its commercial heart"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "Rialto was the heart of the commercial and financial life of Venice. People from all over the world came to the prominent markets"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "merchant travelers from Armenia, Turkey, and Arabia mingling with the Venetians under the famed bridge at the heart of the city"}
- card: enslaved-in-renaissance-italy
  fact: "In the mid-1490s Carpaccio painted the Miracle of the Relic of the Cross at the Rialto Bridge, now in the Gallerie dell'Accademia (also wow)"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "The Miracle of the Relic of the Cross at the Rialto Bridge by Vittore Carpaccio, painted around 1495–96 ... Gallerie dell’Accademia di Venezia"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "Vittore Carpaccio, “Miracle of the Relic of the True Cross at the Rialto Bridge,” 1494-1496 ... Gallerie dell’Accademia, Venice"}
- card: enslaved-in-renaissance-italy
  fact: "The canvas shows daily life, Venetians, merchants from many lands, gondolas; among the gondoliers are Black Africans (also wow)"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "a view of the Grand Canal fills most of the canvas, and scenes from everyday life play out ... The Black gondolier depicted in the foreground on the left"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "Carpaccio presents a multicultural environment ... Among these figures are two Black Africans ... working as gondoliers"}
- card: enslaved-in-renaissance-italy
  fact: "Many Black Africans in Venice arrived enslaved, via a trade that grew after the Portuguese began seizing people in West Africa in the mid-fifteenth century"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "From the 1450s, people from the western coast of Africa were enslaved by the Portuguese and brought to Europe"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "many Black Africans in Italy at the time were slaves transported to Europe under the burgeoning African slave trade"}
- card: enslaved-in-renaissance-italy
  fact: "Enslaved men served patrician households, often as boatmen"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "Black men and women were usually employed as servants in patrician households ... The men frequently worked as gondoliers"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "numerous scholars have identified these figures either as enslaved individuals, probably in domestic service"}
- card: enslaved-in-renaissance-italy
  fact: "Slavery in Venice was not fixed to skin colour as in the American South; many Black Venetians were free"
  sources:
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "slavery was not racialized in the sense that Black skin automatically made one a slave, as in the American South. There were many free Black residents of Venice."}
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "it was common in Venice for slaves to be freed at the death of an owner, or after a number of years of service"}
- card: enslaved-in-renaissance-italy
  fact: "Kate Lowe found Black Africans in ferrymen's guild records, men who moved from slavery to a trade of their own (also wow)"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "While studying the charters of several guilds of ferryman ... Lowe discovered that several Black Africans were included ... in Venice several slaves, after they were freed, worked as gondoliers"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "gondoliers in Venice operated under a guild-like system; many guilds at the time permitted slaves and ex-slaves to join their ranks"}
- card: enslaved-in-renaissance-italy
  fact: "Whether Carpaccio's gondoliers were enslaved or freed cannot be known"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "it’s not possible to know the precise social status of the Black gondoliers depicted by Carpaccio"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "it is always difficult to ascertain if a depicted individual ... is a slave ... or as former slaves who continued their work as gondoliers after their manumission"}
- card: enslaved-in-renaissance-italy
  fact: "Scholars read such paintings together with archival records"
  sources:
    - {title: "Getty News: The Black Gondoliers of Renaissance Venice", url: "https://www.getty.edu/news/the-black-gondoliers-of-renaissance-venice", quote: "as scholars work to connect archival and visual records"}
    - {title: "Frances Hisgen, Teaching Medieval Slavery and Captivity: Miracle of the Relic of the True Cross on the Rialto Bridge", url: "https://medievalslavery.org/?p=3691", quote: "Many scholars have analyzed this painting and others as part of a quest to “unearth” images of Black people"}
- card: free-soil-france
  fact: "Maxim: no one is a slave in France; an enslaved person touching French soil becomes free (also wow)"
  sources:
    - {title: "Jean-Paul Jean, La Cour de cassation et l'esclavage (AHJUCAF, 2020)", url: "https://www.ahjucaf.org/sites/default/files/inline-files/La%20Rochelle%20JP%20Jean%20esclavage%20.pdf", quote: "« Nul n'est esclave en France » ... « Le sol de la France affranchit l'esclave qui le touche »"}
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "according to the \"Freedom Principle,\" a colonial slave became a free individual once s/he touched French soil"}
- card: free-soil-france
  fact: "Lawyers traced the maxim to an edict of Louis X in 1315"
  sources:
    - {title: "Jean-Paul Jean, La Cour de cassation et l'esclavage (AHJUCAF, 2020)", url: "https://www.ahjucaf.org/sites/default/files/inline-files/La%20Rochelle%20JP%20Jean%20esclavage%20.pdf", quote: "Par l'édit du 3 juillet 1315, le roi de France Louis le Hutin affirme que « selon le droit de nature, chacun doit naître franc » ... D'où la maxime « nul n'est esclave en France »"}
    - {title: "BnF France-Amériques: Slave and slaveries", url: "https://heritage.bnf.fr/france-ameriques/en/slave-and-slaveries-0", quote: "In 1315, King Louis X prohibited the institution of slavery in the royal kingdom."}
- card: free-soil-france
  fact: "France's Caribbean colonies ran on slave labour and planters brought enslaved servants to France"
  sources:
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "slave masters could bring their slaves to France without fear of the latter claiming their freedom provided the slave owner fulfilled certain procedural requirements"}
    - {title: "Déclaration du Roi, pour la police des Noirs, 9 août 1777 (Internet Archive)", url: "https://archive.org/details/dclaration00fran", quote: "le nombre des Noirs s'y est tellement multiplié, par la facilité de la communication de l'Amérique avec la France ... du secours d'un domestique noir pour les servir pendant la traversée"}
- card: free-soil-france
  fact: "An edict of 1716 let masters keep slaves in France if they completed formalities"
  sources:
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "According to the terms of the Edict of 1716, slave masters could bring their slaves to France ... provided the slave owner fulfilled certain procedural requirements"}
    - {title: "Jean-Paul Jean, La Cour de cassation et l'esclavage (AHJUCAF, 2020)", url: "https://www.ahjucaf.org/sites/default/files/inline-files/La%20Rochelle%20JP%20Jean%20esclavage%20.pdf", quote: "l'édit de 1716 déclarait l'esclave libre lorsque son maître avait négligé de remplir les formalités qui lui étaient imposées par son introduction"}
- card: free-soil-france
  fact: "The 1738 declaration ordered slaves of non-compliant masters confiscated for the king rather than freed"
  sources:
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "the royal Declaration of 1738 (which provided that slaves whose masters did not follow procedure were no longer to be granted their freedom in France, but to be confiscated au profit du roi"}
    - {title: "Jean-Paul Jean, La Cour de cassation et l'esclavage (AHJUCAF, 2020)", url: "https://www.ahjucaf.org/sites/default/files/inline-files/La%20Rochelle%20JP%20Jean%20esclavage%20.pdf", quote: "l'édit de 1738, en exigeant les mêmes formalités, substituait à la concession de la liberté la confiscation de l'esclave au profit du Roi"}
- card: free-soil-france
  fact: "People held in Paris sued for freedom in the Admiralty Court of France on the maxim, and many won (also wow)"
  sources:
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "The vast majority of cases that came within the jurisdiction of the Parlement of Paris resulted in the petitioning slaves being granted their freedom"}
    - {title: "Sasha Turner, H-France Forum 21 (2026): review of Miranda Spieler, Slaves in Paris", url: "https://h-france.net/h-france-forum/volume-21-2026/issue-1-review-2-turner/", quote: "Like countless others, Julien had sued for his freedom through the Paris Court of Admiralty on the maxim, “there are no slaves in France.” ... many other people of color in Paris who were freed by appeals to the Court of Admiralty"}
- card: free-soil-france
  fact: "In 1777 the Declaration for the police des Noirs barred 'Blacks, mulattoes and other people of colour' from entering the kingdom (also wow)"
  sources:
    - {title: "Déclaration du Roi, pour la police des Noirs, 9 août 1777 (Internet Archive)", url: "https://archive.org/details/dclaration00fran", quote: "Défendons pareillement ... à tous Noirs, Mulâtres ou autres Gens de Couleur ... d'entrer à l'avenir dans notre Royaume"}
    - {title: "Ville de Paris: « Police des Noirs » : surveiller, enfermer, exclure", url: "https://www.paris.fr/pages/police-des-noirs-surveiller-enfermer-exclure-recherche-36656", quote: "À partir de 1777, la « Déclaration pour la police des Noirs » interdit notamment l'entrée dans le royaume aux personnes désignées comme « Noirs, Mulâtres ou autres Gens de couleur »"}
- card: free-soil-france
  fact: "The 1777 law shifted the question from slavery to colour"
  sources:
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "As the focus shifted from the status of slaves to the identity of nonwhites, Louis XVI produced, in 1777 ... the Déclaration pour la police des Noirs. This law prohibited the entry of all nonwhites into France"}
    - {title: "Ville de Paris: « Police des Noirs » : surveiller, enfermer, exclure", url: "https://www.paris.fr/pages/police-des-noirs-surveiller-enfermer-exclure-recherche-36656", quote: "comment des catégories fondées sur la couleur et l'origine coloniale ont été utilisées par les pouvoirs publics pour distinguer, surveiller et administrer des populations"}
- card: free-soil-france
  fact: "A colonist could bring one Black servant for the voyage, held in a port depot until shipped back"
  sources:
    - {title: "Déclaration du Roi, pour la police des Noirs, 9 août 1777 (Internet Archive)", url: "https://archive.org/details/dclaration00fran", quote: "d'embarquer avec lui un seul Noir ou Mulâtre ... à la charge de le remettre, à son arrivée dans le Port, au Dépôt qui sera à ce destiné par nos ordres, & y demeurer jusqu'à ce qu'il puisse être rembarqué"}
    - {title: "Ville de Paris: « Police des Noirs » : surveiller, enfermer, exclure", url: "https://www.paris.fr/pages/police-des-noirs-surveiller-enfermer-exclure-recherche-36656", quote: "des dossiers de prisonniers et des dizaines d'ordres royaux permettant de retracer les parcours de personnes de couleur détenues à Paris puis conduites vers des ports pour être rembarquées"}
- card: free-soil-france
  fact: "Dispute: Spieler (2025) corrects Peabody on how secure the liberations were"
  sources:
    - {title: "Sasha Turner, H-France Forum 21 (2026): review of Miranda Spieler, Slaves in Paris", url: "https://h-france.net/h-france-forum/volume-21-2026/issue-1-review-2-turner/", quote: "She issues a direct corrective to the classic work of Sue Peabody ... “many tales of liberation in Peabody’s book were not the judicial triumph she suggests”"}
    - {title: "EBRO (CSULB): review of Sue Peabody, There Are No Slaves in France (2009)", url: "https://www.csulb.edu/node/642156", quote: "the Admiralty court judges continued to free slaves who brought suit for their freedom"}
- card: runaway-adverts-britain
  fact: "Planters, merchants and ships' officers came home from the colonies with enslaved servants"
  sources:
    - {title: "Runaway Slaves in Eighteenth-Century Britain (University of Glasgow)", url: "https://www.runaways.gla.ac.uk/", quote: "many masters came home with some of the men, women, and children they held in bondage"}
    - {title: "Nancy Tappan, HistoryNet: Braveheart-ed Bid for His Freedom (2020)", url: "https://historynet.com/bravehearted-bid-for-his-freedom/", quote: "Many planters, merchants, ships’ officers, doctors, and even clergymen returned from the Americas with slaves"}
- card: runaway-adverts-britain
  fact: "Owners placed newspaper adverts offering rewards and describing looks, clothes, skills and scars"
  sources:
    - {title: "Runaway Slaves in Eighteenth-Century Britain (University of Glasgow)", url: "https://www.runaways.gla.ac.uk/", quote: "masters placed advertisements in newspapers offering rewards for the capture and return of the escapee. In these newspaper advertisements they described the physical characteristics, mannerisms, habits, skills"}
    - {title: "University of Glasgow, Reach: Runaway Slaves in Britain", url: "https://www.gla.ac.uk/colleges/arts/knowledge-exchange/newsletter/reach08/slaves/", quote: "The advertisements include details about the slaves’ physical appearance (including occupational injuries, West African ritual scarification, and whip scars), clothing"}
- card: runaway-adverts-britain
  fact: "The adverts are often the only record of these people"
  sources:
    - {title: "University of Glasgow, Reach: Runaway Slaves in Britain", url: "https://www.gla.ac.uk/colleges/arts/knowledge-exchange/newsletter/reach08/slaves/", quote: "In many cases these short advertisements constitute the only surviving documentation about enslaved people who were brought to Britain"}
    - {title: "Runaway Slaves in Eighteenth-Century Britain (University of Glasgow)", url: "https://www.runaways.gla.ac.uk/", quote: "people who are otherwise all but completely absent from historical records"}
- card: runaway-adverts-britain
  fact: "In 1750 Robert Shedden, a Scottish merchant in Virginia, bought a boy named Jamie; the bill of sale survives"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "In Fredricksburg in 1750 he purchased James Montgomery from Joseph Hawkins ... The bill of sale ... was submitted to court by Sheddan"}
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "In 1750 a Scottish merchant in Virginia named Robert Shedden purchased an enslaved boy named Jamie for £56"}
- card: runaway-adverts-britain
  fact: "He was sent to Beith to learn joinery, to be sold back in Virginia as a skilled carpenter"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "Sheddan wanted Montgomery apprenticed to a joiner so that he could learn a skill, and then be sold for a large profit in Virginia"}
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "apprenticed to Shedden’s brother-in-law, a carpenter named Robert Morrice who lived in ... Beith, Ayrshire ... sold as a valuable carpenter"}
- card: runaway-adverts-britain
  fact: "In Beith Jamie was baptised and took the surname Montgomery"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "Montgomery was baptised by Reverend John Witherspoon in Beith"}
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "he was baptised by Rev. John Witherspoon ... Furthermore, Jamie took on the surname Montgomery"}
- card: runaway-adverts-britain
  fact: "In 1756 Shedden had him taken to Port Glasgow to be shipped to Virginia; Jamie escaped (also wow)"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "Sheddan had Montgomery forcibly removed to Port Glasgow and placed him on a ship bound for Virginia, but on 21 April 1756 Montgomery escaped"}
    - {title: "Nancy Tappan, HistoryNet: Braveheart-ed Bid for His Freedom (2020)", url: "https://historynet.com/bravehearted-bid-for-his-freedom/", quote: "dragged him behind a horse the 15 miles from Beith to Port Glasgow ... the young man bolted"}
- card: runaway-adverts-britain
  fact: "Jamie reached Edinburgh and found work as a carpenter"
  sources:
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "Jamie made his way to Edinburgh and secured employment as a carpenter in Edinburgh"}
    - {title: "University of Glasgow, Reach: Runaway Slaves in Britain", url: "https://www.gla.ac.uk/colleges/arts/knowledge-exchange/newsletter/reach08/slaves/", quote: "the young man escaped to Edinburgh where he found work as a journeyman carpenter"}
- card: runaway-adverts-britain
  fact: "Shedden's adverts in the Glasgow and Edinburgh papers led to his arrest (also wow)"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "He was apprehended following newspaper advertisements about his escape, and was incarcerated in the Edinburgh Tolbooth"}
    - {title: "Nancy Tappan, HistoryNet: Braveheart-ed Bid for His Freedom (2020)", url: "https://historynet.com/bravehearted-bid-for-his-freedom/", quote: "Robert Shedden immediately posted advertisements seeking Jamie’s recapture and return in the Glasgow and Edinburgh papers"}
- card: runaway-adverts-britain
  fact: "Jamie went to law for his freedom in the Court of Session"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "three cases reached the Court of Session in Edinburgh whereby fugitives from slavery attempted to obtain their freedom. The three cases were Montgomery v Sheddan (1756)"}
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "A court case followed"}
- card: runaway-adverts-britain
  fact: "He died in the Edinburgh Tolbooth before the case was heard"
  sources:
    - {title: "National Records of Scotland: The James Montgomery Slavery Case, 1756", url: "https://nrscotland.gov.uk/learning-and-events/slavery-and-scotland/the-james-montgomery-slavery-case-1756", quote: "By the time the Court of Session declared that the case would be heard on 4 January 1757, Montgomery had died in prison"}
    - {title: "Simon P. Newman, Glasgow Life: Jamie Montgomery, Runaway Slave", url: "https://www.glasgowlife.org.uk/museums/glasgow-life-museums-blogs/legacies-of-slavery-and-empire/jamie-montgomery-runaway-slave", quote: "Unfortunately Jamie perished in the Tolbooth before the case was resolved"}
- card: runaway-adverts-britain
  fact: "From 2015 a Glasgow team gathered more than 800 adverts from English and Scottish papers of 1700-1780 (also wow)"
  sources:
    - {title: "Runaway Slaves in Eighteenth-Century Britain (University of Glasgow)", url: "https://www.runaways.gla.ac.uk/", quote: "a searchable database of well over eight hundred newspaper advertisements ... English and Scottish newspapers published between 1700 and 1780"}
    - {title: "Keisha N. Blain, interview with Nelson Mundell, Black Perspectives (2018)", url: "https://www.aaihs.org/enslaved-people-in-eighteenth-century-britain-an-interview-with-nelson-mundell/", quote: "led by Professor Simon Newman from the University of Glasgow since January 2015 ... we have 831 “runaway” advertisements—sixty-seven in Scotland, 764 in England"}
    - {title: "Al-Amoudi, Birch, Newman, Runaways London, Transactions of the Royal Historical Society 32 (2022)", url: "https://www.cambridge.org/core/product/06491169257C57287F2F0619A9EAAAA9/core-reader", quote: "836 advertisements from England and Scotland published between 1700 and 1779"}
- card: pombal-1761
  fact: "For three centuries Portugal brought enslaved Africans into the kingdom, first through Lagos then Lisbon"
  sources:
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal..., MANIFEST (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "first arrived in considerable numbers at the Algarvian ports, namely at Lagos in 1444. But, from the 1480s onward ... Lisbon became the main port ... the import of slaves to Portugal continued until 1761"}
    - {title: "Yesenia Barragan, Uncovering Lisbon's Forgotten History of Slavery, Black Perspectives (2017)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "While Lagos saw the creation of the first slave market in Portugal ... Lisbon soon became the administrative and later physical center of the human traffic"}
- card: pombal-1761
  fact: "On 19 September 1761 an alvará under José I and Carvalho e Melo (Pombal) forbade landing any Black man or woman in Portugal from Africa, America and Asia"
  sources:
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "o alvará de 19 de setembro de 1761, cujo teor determinava que, a partir dos portos “da África, América e Ásia”, não se pudesse “carregar, nem descarregar nestes Reinos de Portugal, e dos Algarves, Preto ou Preta alguma” ... o futuro marquês de Pombal e o próprio monarca, D. José I"}
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal..., MANIFEST (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "until 1761, when Sebastião José de Carvalho e Mello, then Secretary of State ... of King D. José I, prohibited the entrance of new captives into the country"}
    - {title: "Luiz Geraldo Silva, Esperança de liberdade, Revista de História 144 (2001)", url: "https://periodicos.usp.br/revhistoria/article/download/18912/20975/22443", quote: "Pombal estabelecera, mediante Alvará em forma de lei de 19 de Setembro de 1761, a proibição de transportar “pretos” e “pretas” ... para o Reino"}
    - {title: "The Free Womb Project: Portugal, 1773 (law text, Portuguese original from L. A. de Oliveira Ramos 1971)", url: "https://thefreewombproject.com/portugal-2/", quote: "Que depois de ter obviado pelo outro Alvará de dezanove de Setembro de mil setecentos sessenta e hum aos grandes inconvenientes, que a estes Reinos se seguiam de se perpetuar nelles a Escravidão dos Homens pretos"}
- card: pombal-1761
  fact: "Anyone brought in six months after publication was freed without a further letter of manumission (also wow)"
  sources:
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "a partir de seis meses após a publicação da lei, os escravos que fossem introduzidos em Portugal ficassem “pelo benefício dela libertos, e forros, sem necessitarem de outra alguma Carta de manumissão, ou alforria, nem de nenhum outro despacho”"}
    - {title: "Luiz Geraldo Silva, Esperança de liberdade, Revista de História 144 (2001)", url: "https://periodicos.usp.br/revhistoria/article/download/18912/20975/22443", quote: "os cativos ou cativas ficariam “libertos, e forros, sem necessitarem de outra alguma carta de manumissão, ou alforria, nem de nenhum outro despacho” no prazo de 6 meses"}
- card: pombal-1761
  fact: "Those already enslaved in Portugal stayed enslaved"
  sources:
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "ao sublinhar que tais determinações não se referiam aos escravos “que já se acham nestes Reinos”"}
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal..., MANIFEST (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "these decisions did not end the existence of captives"}
- card: pombal-1761
  fact: "The law did not apply to Brazil or Africa and warned against colonial slaves fleeing to Portugal (also wow)"
  sources:
    - {title: "Luiz Geraldo Silva, Esperança de liberdade, Revista de História 144 (2001)", url: "https://periodicos.usp.br/revhistoria/article/download/18912/20975/22443", quote: "os textos legais de 1761 e, depois, de 1773, referiam-se apenas ao Reino – e não à África ou à América portuguesa ... não era sua intenção que os escravos dos domínios ultramarinos ... desertassem de suas terras e fossem a Portugal"}
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "seu conteúdo não deveria fornecer pretexto para que “desertem dos Meus Domínios Ultramarinos os Escravos que neles se acham”"}
- card: pombal-1761
  fact: "Slaveholders kept mixed-race people enslaved, claiming the law covered only Black people, until decrees of 1767"
  sources:
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "o aviso de 2 de janeiro de 1767 ... muitos senhores de escravos tinham interpretado erroneamente que o alvará de 1761 aplicava-se apenas aos “pretos e pretas”, razão pela qual mantinham em cativeiro os “mulatos e mulatas”"}
    - {title: "Luiz Geraldo Silva, Esperança de liberdade, Revista de História 144 (2001)", url: "https://periodicos.usp.br/revhistoria/article/download/18912/20975/22443", quote: "Em 1767 ... muitos burlaram a lei ... e mantiveram em cativeiro mestiços, mulatos e mulatas. Dois avisos daquele ano informaram que a lei dizia respeito a todo e qualquer cativo"}
- card: pombal-1761
  fact: "The 1773 alvará made all children born thereafter free and freed those whose slavery came from great-grandmothers"
  sources:
    - {title: "The Free Womb Project: Portugal, 1773", url: "https://thefreewombproject.com/portugal-2/", quote: "whose slavery comes from the great grandparents, be free ... all who are born from the day from the publication of this Law on, may be born ... entirely free"}
    - {title: "Luiz Geraldo Silva and Priscila de Lima Souza, Escravos marinheiros, senhores e locadores, Afro-Ásia 60 (2019)", url: "https://www.redalyc.org/journal/770/77066580002/77066580002.pdf", quote: "os escravos “cuja escravidão vier das bisavós, fiquem livres e desembargados”. Por sua vez, todos os escravos nascidos após a promulgação da lei estariam “inteiramente livres”"}
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal..., MANIFEST (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "in 1773 he ruled that the children of slaves were free, virtually abolishing slavery in Portugal"}
    - {title: "The Free Womb Project: Introductory essay", url: "https://thefreewombproject.com/introductory-essay/", quote: "this 1773 law was adopted in Portugal (but not its overseas territories) ... the law ruled that all children of slaves born after the publication of the law would be freed (likewise, the law also legislated that all fourth-generation slaves in Portugal, that is, slaves whose great-grandmothers were enslaved, were freed as well)"}
- card: pombal-1761
  fact: "The two laws set slavery in the kingdom on the road to its end"
  sources:
    - {title: "Luiz Geraldo Silva, Esperança de liberdade, Revista de História 144 (2001)", url: "https://periodicos.usp.br/revhistoria/article/download/18912/20975/22443", quote: "alguns dispositivos legais que encaminharam a extinção da escravidão em Portugal e Algarve"}
