- card: lagos-1444
  fact: "Rescue excavations for an underground car park outside the medieval walls uncovered more than 150 skeletons of the 15th-17th centuries, many with signs of African ancestry"
  sources:
    - {title: "Trinity College Dublin: Skeletons in mass Portuguese burial site belonged to African slaves", url: "https://www.tcd.ie/news_events/articles/skeletons-in-mass-portuguese-burial-site-belonged-to-african-slaves", quote: "many of the 158 skeletons found in a Portuguese burial site were those of African slaves from the 15th – 17th Century ... rescue excavations ... at an underground car park in Valle da Gafaria ... outside the medieval walls of the city"}
    - {title: "Neves, Almeida, Ferreira, História de um arrabalde: o Poço dos Negros em Lagos (NOVA FCSH)", url: "https://projetos.dhlab.fcsh.unl.pt/files/original/0fcf68824db1df475c30240358f7423aea322e70.pdf", quote: "Em 2009, a construção de um parque de estacionamento subterrâneo no Valle da Gafaria, junto a uma das portas da cidade ... esqueletos humanos (N=155) ... recorrência das características negróides dos indivíduos inumados"}
- card: lagos-1444
  fact: "These are early records of a trade that later carried millions across the Atlantic"
  sources:
    - {title: "Trinity College Dublin: Skeletons in mass Portuguese burial site belonged to African slaves", url: "https://www.tcd.ie/news_events/articles/skeletons-in-mass-portuguese-burial-site-belonged-to-african-slaves", quote: "which formed a precursor to the transatlantic transfer of millions"}
    - {title: "Yesenia Barragan, Uncovering Lisbon's Forgotten History of Slavery, Black Perspectives (2017)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "the first black captives from West Africa landed on the Portuguese beach of Lagos. Many, many more kidnapped captives would follow"}
- card: lagos-1444
  fact: "Soon the centre of the Portuguese traffic moved to Lisbon"
  sources:
    - {title: "Aurora Almada e Santos, Presence of African people in Portugal..., MANIFEST (2023)", url: "https://www.projectmanifest.eu/wp-content/uploads/2023/06/Presence-of-African-people-in-Portugal-at-the-time-of-the-trade-of-enslaved-people.pdf", quote: "from the 1480s onward and until the 16th century, Lisbon became the main port of entrance of slaves in Portugal"}
    - {title: "Yesenia Barragan, Uncovering Lisbon's Forgotten History of Slavery, Black Perspectives (2017)", url: "https://www.aaihs.org/uncovering-lisbons-forgotten-history-of-slavery/", quote: "While Lagos saw the creation of the first slave market in Portugal (and Europe as a whole), Lisbon soon became the administrative and later physical center of the human traffic"}
