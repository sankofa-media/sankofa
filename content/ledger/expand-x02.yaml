  sources:
    - {title: "Gomes Eanes de Zurara, The Chronicle of the Discovery and Conquest of Guinea, vol. 1 (Hakluyt Society, 1896), Project Gutenberg", url: "https://www.gutenberg.org/cache/epub/35738/pg35738.txt", quote: "placed in that field which lies outside the city gate, and there to be divided into five parts, according to custom"}
    - {title: "Hugh Thomas, The Slave Trade (1997), chapter 1", url: "https://erenow.org/modern/atlanticslavetrade1440-1870/2.php", quote: "On arriving on the mainland, these people were placed in a field ... himself received forty-six of those slaves present, the “royal fifth.”"}
- card: lagos-1444
  fact: "Zurara wrote with pity: faces bathed in tears, cries to heaven, a dirge after the custom of their country"
