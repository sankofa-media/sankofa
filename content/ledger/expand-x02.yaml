- card: black-seville
  fact: "In the sixteenth century Seville was one of Spain's largest centres of slavery and a busy slave market"
  sources:
    - {title: "AFP via The Local Spain: In Spain, brotherhood set up by slaves marches at Easter (2023)", url: "https://www.thelocal.es/20230407/in-spain-brotherhood-set-up-by-slaves-marches-at-easter", quote: "So great was the influx that Seville became one of Spain's biggest slavery centres"}
