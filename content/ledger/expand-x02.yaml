    - {title: "Hugh Thomas, The Slave Trade (1997), chapter 1", url: "https://erenow.org/modern/atlanticslavetrade1440-1870/2.php", quote: "He watched, impassive, from his horse, and himself received forty-six of those slaves present, the “royal fifth.”"}
- card: lagos-1444
  fact: "Lagos became a hub of this early trade"
  sources:
