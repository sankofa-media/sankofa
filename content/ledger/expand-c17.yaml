    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "Pressure (1975) Restoration by BFI National Archive/The Film Foundation"}
    - {title: "Peter Bradshaw, The Guardian: Pressure review (2023)", url: "https://www.theguardian.com/film/2023/nov/02/pressure-review-horace-ove-rerelease", quote: "Restored by the BFI National Archive and The Film Foundation with support from the Hobson/Lucas Family Foundation"}
- card: pressure-1976
  fact: "Viewers saw Black London from the inside"
  sources:
    - {title: "The Guardian: Horace Ové, pioneer of black British cinema (2023)", url: "https://www.theguardian.com/film/2023/oct/24/horace-ove-black-british-cinema-bfi-radical-vision", quote: "For the first time we saw ourselves on screen."}
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "it felt like I was watching a raw articulation of truths that my father was never likely to volunteer himself."}
- card: caribbean-voices
  fact: "In WWII West Indians came to Britain to serve in the forces and work in factories"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "Others would be needed to replace factory-workers, and a recruitment campaign began in Jamaica and elsewhere."}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "Una recording at a reception for Jamaican technicians working in factories in Britain"}
    - {title: "Philip Nanton, Caribbean Beat 63 (2003): London calling", url: "https://www.caribbean-beat.com/issue-63/london-calling", quote: "a letter-request show for lonely West Indians in the armed forces, far from home."}
- card: caribbean-voices
  fact: "The BBC broadcast to the Empire and gave them a way to talk to home"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "it was only natural for it now to provide a forum in which serving men and women from the islands could send messages to their friends and families back home."}
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "through which West Indian servicemen, based in London, could keep in touch with home."}
- card: caribbean-voices
  fact: "Calling the West Indies carried personal messages, music and war-work stories"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "The programme’s characteristic mixture of personal messages, warming music, and uplifting tales of dedicated war-work"}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "The show incorporated personal messages, war-time tales, interviews and music."}
- card: caribbean-voices
  fact: "Its producer was Una Marson"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "It is a rare glimpse of one of the BBC’s true pioneers, the first black producer on its payroll, Una Marson."}
    - {title: "Philip Nanton, Caribbean Beat 63 (2003): London calling", url: "https://www.caribbean-beat.com/issue-63/london-calling", quote: "the Jamaican poet Una Marson, stationed in London and working for the BBC, had been producing what was, in effect, a letter-request show"}
- card: caribbean-voices
  fact: "Marson was born in 1905 in St Elizabeth parish, Jamaica"
  sources:
    - {title: "National Library of Jamaica: Una Maud Marson (1905-1965)", url: "https://nlj.gov.jm/project/una-maud-marson-1905-1965/", quote: "she was born on the 6th day of February, 1905 in Santa Cruz, St."}
    - {title: "Women's History Network: Una Marson 1905-65", url: "https://womenshistorynetwork.org/una-marson-1905-65/", quote: "Born in 1905 in the county parish of St Elizabeth"}
- card: caribbean-voices
  fact: "She was the daughter of a Baptist minister"
  sources:
    - {title: "Women's History Network: Una Marson 1905-65", url: "https://womenshistorynetwork.org/una-marson-1905-65/", quote: "the headstrong daughter of a Baptist parson"}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "Una was the daughter of a Baptist preacher."}
- card: caribbean-voices
  fact: "She already had two books of verse and a play staged in Jamaica"
  sources:
    - {title: "National Library of Jamaica: Una Maud Marson (1905-1965)", url: "https://nlj.gov.jm/project/una-maud-marson-1905-1965/", quote: "two volumes of poems Heights and Depths, 1931 and Tropic Reveries, 1930, and also wrote and staged a play, At What Price, which was the first to be written and staged in Jamaica by a female."}
    - {title: "Women's History Network: Una Marson 1905-65", url: "https://womenshistorynetwork.org/una-marson-1905-65/", quote: "having published two volumes of poetry, Tropic Reveries (1930), and Heights and Depths (1931), and she staged her first play, At What A Price (1932), to popular acclaim."}
- card: caribbean-voices
  fact: "She joined the BBC in 1941, the first Black woman on its staff"
  sources:
    - {title: "Women's History Network: Una Marson 1905-65", url: "https://womenshistorynetwork.org/una-marson-1905-65/", quote: "three years later she became the first black woman to be employed by the BBC."}
    - {title: "National Library of Jamaica: Una Maud Marson (1905-1965)", url: "https://nlj.gov.jm/project/una-maud-marson-1905-1965/", quote: "Miss Marson began working at the British Broadcasting Corporation (BBC) and was the first black female broadcaster to work there."}
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "Marson joined the BBC full-time in March 1941"}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "Her big turning point was being hired by the BBC Empire Service in 1941"}
- card: caribbean-voices
  fact: "She started Caribbean Voices, a weekly feature for Caribbean writing"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "Her interest in poetry soon led her to develop Caribbean Voices, a weekly feature within the Calling the West Indies series"}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "she also gave a platform to unknown writers in her weekly radio feature, Caribbean Voices."}
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "Its initiator and first producer, Una Marson"}
- card: caribbean-voices
  fact: "In 1946, ill, she returned to Jamaica and Irishman Henry Swanzy took over"
  sources:
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "By May 1946 she had been certified as suffering from schizophrenia and detained. ... Responsibility for running Caribbean Voices henceforth fell to a young Irishman, Henry Swanzy."}
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "by 1946, when she returned to Jamaica and Swanzy took over as producer."}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "the BBC assisted her passage back to Jamaica."}
- card: caribbean-voices
  fact: "Swanzy ran it as a workshop with criticism; writers were paid to read on air"
  sources:
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "Under his editorship, Caribbean Voices took the form of a creative workshop around the craft of writing, in which writers were offered encouragement and informed criticism."}
    - {title: "David Hendy, BBC History, 100 Voices: Caribbean Voices", url: "https://www.bbc.co.uk/historyofthebbc/100-voices/people-nation-empire/caribbean-voices/", quote: "Swanzy, acutely aware of their financial struggles, would also supplement their earnings by booking them as on-air readers for the series."}
- card: caribbean-voices
  fact: "Walcott, Naipaul, Lamming, Selvon and Brathwaite were heard there before they became famous"
  sources:
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "Derek Walcott and VS Naipaul, both Nobel prize-winners, were among those whose work was first broadcast ... So, too, were Wilson Harris, George Lamming, Edward Kamau Brathwaite and Andrew Salkey."}
    - {title: "Philip Nanton, Caribbean Beat 63 (2003): London calling", url: "https://www.caribbean-beat.com/issue-63/london-calling", quote: "notably the Nobel Prize-winners Derek Walcott of St Lucia and Trinidad-born V.S. Naipaul; but also George Lamming and Kamau Brathwaite from Barbados; Sam Selvon, again from Trinidad"}
- card: caribbean-voices
  fact: "Marson died in 1965"
  sources:
    - {title: "National Library of Jamaica: Una Maud Marson (1905-1965)", url: "https://nlj.gov.jm/project/una-maud-marson-1905-1965/", quote: "Died: May 5, 1965"}
    - {title: "BBC News: Sir Lenny Henry on Una Marson's forgotten legacy (2022)", url: "https://www.bbc.co.uk/news/entertainment-arts-63215113", quote: "after her death in 1965, her legacy faded"}
- card: caribbean-voices
  fact: "Walcott and Naipaul won the Nobel Prize"
  sources:
    - {title: "The Guardian: Henry Swanzy obituary (2004)", url: "https://www.theguardian.com/news/2004/mar/20/guardianobituaries", quote: "Derek Walcott and VS Naipaul, both Nobel prize-winners"}
    - {title: "Philip Nanton, Caribbean Beat 63 (2003): London calling", url: "https://www.caribbean-beat.com/issue-63/london-calling", quote: "notably the Nobel Prize-winners Derek Walcott of St Lucia and Trinidad-born V.S. Naipaul"}
- card: xica-da-silva-film
  fact: "João Fernandes de Oliveira held the diamond monopoly around Tejuco, today's Diamantina, Minas Gerais"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "the diamond contractor João Fernandes de Oliveira, who had the monopoly on extraction of ore in the region of the hamlet of Tejuco, today the city of Diamantina, in Minas Gerais."}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "João Fernandes de Oliveira, contratador de diamantes de um dos períodos de maior opulência do Arraial do Tejuco"}
- card: xica-da-silva-film
  fact: "Chica da Silva, born enslaved, was freed by him and lived with him as his partner"
  sources:
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, contexto histórico", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/contexto-historico.htm", quote: "Do contratador, com quem ela viveu em concubinato por cerca de 17 anos, a escravizada ganhou a alforria e 13 filhos"}
    - {title: "Júnia Ferreira Furtado: Chica da Silva, via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "In 1753 she was bought by the judge João Fernandes de Oliveira"}
- card: xica-da-silva-film
  fact: "Her story became a legend"
  sources:
    - {title: "Júnia Ferreira Furtado: Chica da Silva, via Encyclopedia.com", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/chica-da-silva", quote: "This slave woman became legendary for her relationship with the diamond contractor"}
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "o mito se ancora de alguma forma no passado, mas não corresponde ao que Francisca da Silva foi."}
- card: xica-da-silva-film
  fact: "In 1976 Cacá Diegues made the film from João Felício dos Santos's novel"
  sources:
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "o romance de João Felício dos Santos inspirou a filme homônimo dirigido por Cacá Diegues, filmado e lançado no mesmo ano de publicação livro, em 1976."}
    - {title: "Festival de Cannes: Xica da Silva", url: "https://www.festival-cannes.com/en/films/xica-da-silva", quote: "Directed by : Carlos DIEGUES Year of production: 1976 ... Joao Felício DOS SANTOS Screenplay"}
- card: xica-da-silva-film
  fact: "Zezé Motta played Xica"
  sources:
    - {title: "Festival de Cannes: Xica da Silva", url: "https://www.festival-cannes.com/en/films/xica-da-silva", quote: "Zézé MOTTA Xica da Silva"}
    - {title: "Papo de Cinema: Xica da Silva restaurado em 4K (2026)", url: "https://www.papodecinema.com.br/noticias/xica-da-silva/", quote: "O clássico dirigido por Cacá Diegues e protagonizado por Zezé Motta"}
- card: xica-da-silva-film
  fact: "In the film the contractor falls for the enslaved Xica and makes her Diamond Queen until the king sends an emissary"
  sources:
    - {title: "Festival de Cannes: Xica da Silva", url: "https://www.festival-cannes.com/en/films/xica-da-silva", quote: "He made her the Diamond Queen and honors her every wish ... But the Portuguese king will send an emissary to the colony to put an end to Xica’s power."}
    - {title: "Papo de Cinema: Xica da Silva restaurado em 4K (2026)", url: "https://www.papodecinema.com.br/noticias/xica-da-silva/", quote: "João Fernandes, representante da Coroa Portuguesa, apaixona-se por Xica e a transforma na Rainha do Diamante"}
- card: xica-da-silva-film
  fact: "Jorge Ben wrote the title song"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "“Xica da Silva”, essa última composta para a trilha sonora do filme homônimo, de Cacá Diégues."}
    - {title: "Festival de Cannes: Xica da Silva", url: "https://www.festival-cannes.com/en/films/xica-da-silva", quote: "Music Jorge BEN"}
- card: xica-da-silva-film
  fact: "It was the biggest box-office success of Diegues's career"
  sources:
    - {title: "Papo de Cinema: Xica da Silva restaurado em 4K (2026)", url: "https://www.papodecinema.com.br/noticias/xica-da-silva/", quote: "tornou-se o maior sucesso comercial da carreira de Cacá Diegues"}
    - {title: "O Liberal: 'Xica da Silva' volta aos cinemas em versão restaurada (2026)", url: "https://www.oliberal.com/cultura/xica-da-silva-volta-aos-cinemas-em-versao-restaurada-e-tem-destaque-na-cineop-1.1139103", quote: "O longa se tornou o maior sucesso de bilheteria da carreira de Cacá Diegues"}
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "Sucesso de bilheteria, Xica da Silva apostou na faceta subversiva da personagem"}
- card: xica-da-silva-film
  fact: "It made Motta a star"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Zezé Motta", url: "https://dicionariompb.com.br/artista/zeze-motta/", quote: "“Xica da Silva”, filme que a consagrou internacionalmente e pelo qual recebeu vários prêmios"}
    - {title: "Papo de Cinema: Xica da Silva restaurado em 4K (2026)", url: "https://www.papodecinema.com.br/noticias/xica-da-silva/", quote: "protagonizado por Zezé Motta"}
- card: xica-da-silva-film
  fact: "In October 1976 Opinião devoted four pages to the film"
  sources:
    - {title: "ANPUH: Reações na (à) cultura visual, racialização e humilhação no Brasil dos anos 1970", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856594_1d4c00fc67c9734ba04006b5dc07ab0b.pdf", quote: "No dia 15 de outubro de 1976, no jornal Opinião, Carlos Hansenbalg, Beatrix Nascimento e Carlos Frederico publicaram críticas severas à fita entre as quatro páginas que o periódico dedicou ao assunto."}
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "o jornal Opinião convidou, 15 em outubro de 1976, cinco personalidades"}
- card: xica-da-silva-film
  fact: "Beatriz Nascimento said it repeated stereotypes of Black people and belonged on an index of forbidden works"
  sources:
    - {title: "Margarida Maria Adamatti, Crítica de cinema e patrulha ideológica: o caso Xica da Silva, Revista Famecos 23:3 (2016)", url: "https://www.redalyc.org/pdf/4955/495553928008.pdf", quote: "“Quanto a sua penetração enquanto discurso e comunicação o condenaríamos ao ‘índex’ das obras proibidas”."}
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "A historiadora Beatriz Nascimento trouxe a crítica mais contundente: Xica da Silva vem reforçar o estereótipo do negro passivo"}
    - {title: "ANPUH: Reações na (à) cultura visual, racialização e humilhação no Brasil dos anos 1970", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856594_1d4c00fc67c9734ba04006b5dc07ab0b.pdf", quote: "desrespeito por manter os estereótipos em relação a um povo"}
- card: xica-da-silva-film
  fact: "Other critics said it presented the Black woman as a sexual object"
  sources:
    - {title: "Margarida Maria Adamatti, Crítica de cinema e patrulha ideológica: o caso Xica da Silva, Revista Famecos 23:3 (2016)", url: "https://www.redalyc.org/pdf/4955/495553928008.pdf", quote: "três articulistas de Opinião acusaram o diretor de usar o apelo da comédia erótica para conquistar o público, trazendo uma visão da mulher negra como objeto sexual."}
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "Os comentários de Carlos Hasenbalg giraram em torno do uso de estereótipos sobre a população negra e a desaprovação aos excessos na sensualidade"}
- card: xica-da-silva-film
  fact: "Historians showed the film's seductress was far from the real woman"
  sources:
    - {title: "Tribunal de Justiça de Minas Gerais: Chica da Silva, a construção do mito", url: "https://www.tjmg.jus.br/portal-tjmg/noticias/chica-da-silva/construcao-do-mito.htm", quote: "Esta obra retoma o roteiro que inspirou o filme “Xica da Silva”, de 1976, do cineasta Cacá Diegues, que popularizou Chica da Silva e solidificou uma imagem distorcida da personagem real."}
    - {title: "Projeto História (PUC-SP): Xica da Silva in film and television", url: "https://revistas.pucsp.br/index.php/revph/article/download/66066/45613/222091", quote: "O filme Xica da Silva (1976) e a novela Xica da Silva (1996–1997) a representam como uma mulata sedutora"}
- card: xica-da-silva-film
  fact: "In 2026 a 4K restoration from the original negative returned the film to Brazilian cinemas"
  sources:
    - {title: "O Liberal: 'Xica da Silva' volta aos cinemas em versão restaurada (2026)", url: "https://www.oliberal.com/cultura/xica-da-silva-volta-aos-cinemas-em-versao-restaurada-e-tem-destaque-na-cineop-1.1139103", quote: "A obra foi restaurada a partir do negativo original e retorna ao circuito comercial brasileiro no dia 16 de julho"}
    - {title: "Papo de Cinema: Xica da Silva restaurado em 4K (2026)", url: "https://www.papodecinema.com.br/noticias/xica-da-silva/", quote: "acaba de ganhar um trailer inédito de sua versão restaurada em 4K , antecipando o relançamento nacional"}
