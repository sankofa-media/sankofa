    - {title: "Vanessa McMahon, filmfestivals.com: Looking back, Black Orpheus (2012)", url: "https://mail.filmfestivals.com/blog/vanessa_mcmahon/looking_back_cinemas_greatest_moments_black_orpheus_orfeu_negro_1959", quote: "At home in Brazil, however, it received much criticism due to its cliché portrayal of Rio favela life"}
- card: black-orpheus
  fact: "Breno Mello died in his home town Porto Alegre in 2008"
  sources:
