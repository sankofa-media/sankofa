  sources:
    - {title: "Global Voices: Horace Ové, Trinidad-born trailblazer of Black British cinema (2023)", url: "https://globalvoices.org/2023/09/18/horace-ove-trinidad-born-trailblazer-of-black-british-cinema-leaves-behind-a-rich-legacy-of-films-and-photographs/", quote: "Ové was raised in the Port of Spain neighbourhood of Belmont ."}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "Horace Ové was born in Belmont, Port of Spain, in Trinidad"}
