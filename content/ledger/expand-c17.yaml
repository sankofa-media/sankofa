# Batch c17 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a quote.
# Dropped: aleijadinho-prophets (duplicate of existing card aleijadinho, which already covers the twelve prophets of Congonhas).

- card: death-of-cleopatra-lewis
  fact: "The 1876 Centennial Exhibition in Philadelphia marked the US centenary and Lewis's Cleopatra was shown there, sent from Rome"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "A highlight of Lewis' career came in 1876 when she, along with other expatriates in Rome, sent works to the Centennial Exposition."}
    - {title: "National Women's History Museum: Edmonia Lewis", url: "https://www.womenshistory.org/education-resources/biographies/edmonia-lewis", quote: "In 1876, she shipped the sculpture across the Atlantic to Philadelphia so it could be considered for display in the Centennial Exhibition."}
- card: death-of-cleopatra-lewis
  fact: "Lewis was the daughter of a Black father and an Ojibwe (Chippewa) mother"
  sources:
    - {title: "Smithsonian American Art Museum: Edmonia Lewis", url: "https://americanart.si.edu/artist/edmonia-lewis-2914", quote: "Her father was Black, and her mother was Chippewa (Ojibwa) Indian."}
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "the daughter of a black father and a part-Ojibwa mother"}
- card: death-of-cleopatra-lewis
  fact: "At Oberlin she was accused of poisoning two white classmates and beaten by a white mob"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "she was accused of poisoning two white classmates; awaiting the arraignment, she was abducted by a white mob and brutally beaten."}
    - {title: "National Women's History Museum: Edmonia Lewis", url: "https://www.womenshistory.org/education-resources/biographies/edmonia-lewis", quote: "A mob of white men kidnapped, beat, and left her to die in a field in the winter of 1862 because of the poisoning charge."}
- card: death-of-cleopatra-lewis
  fact: "In 1865 she moved to Rome and began to work in marble"
  sources:
    - {title: "Smithsonian American Art Museum: Edmonia Lewis", url: "https://americanart.si.edu/artist/edmonia-lewis-2914", quote: "Moving to Rome in 1865, she became involved with a group of American women sculptors and began to work in marble."}
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "The following year, with proceeds from sales of plaster copies of the Shaw bust, Lewis sailed for Rome to pursue her career."}
- card: death-of-cleopatra-lewis
  fact: "The statue shows Cleopatra just after death, enthroned, still crowned, the asp in her hand"
  sources:
    - {title: "Smithsonian American Art Museum: The Death of Cleopatra (1994.17)", url: "https://americanart.si.edu/artwork/death-cleopatra-33878", quote: "Here, Edmonia Lewis portrayed Cleopatra in the moment after her death, wearing her royal attire, in majestic repose on a throne."}
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "Lewis portrayed Cleopatra seated on her throne, still crowned, her head and left arm hanging with the weight that comes when breathing stops."}
- card: death-of-cleopatra-lewis
  fact: "In Philadelphia the statue drew crowds and caused a stir"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "\" The Death of Cleopatra excites more admiration and gathers larger crowds around it than any other work of art in the vast collection of Memorial Hall.\""}
    - {title: "National Women's History Museum: Edmonia Lewis", url: "https://www.womenshistory.org/education-resources/biographies/edmonia-lewis", quote: "the sculpture created a stir for its realism"}
- card: death-of-cleopatra-lewis
  fact: "Gambler 'Blind John' Condon set it over the grave of his racehorse named Cleopatra"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "the sculpture was acquired by a notorious gambler and racehorse owner, \"Blind John\" Condon, who installed it atop the grave of his favorite horse, Cleopatra."}
    - {title: "ArtsATL: Said in Stone at Georgia Museum reclaims the remarkable career of sculptor Edmonia Lewis", url: "https://www.artsatl.org/said-in-stone-at-georgia-museum-reclaims-the-remarkable-career-of-sculptor-edmonia-lewis/", quote: "It eventually resurfaced in Chicago, where it had been painted and repurposed as a grave marker for a racehorse named Cleopatra"}
- card: death-of-cleopatra-lewis
  fact: "The grave was at his race track in Forest Park, Illinois, near Chicago"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "The grave was in front of the grandstand of his Harlem Race Track in the Chicago suburb of Forest Park."}
    - {title: "National Women's History Museum: Edmonia Lewis", url: "https://www.womenshistory.org/education-resources/biographies/edmonia-lewis", quote: "Death of Cleopatra  was found covered in graffiti and paint in Forest Park, a Chicago suburb."}
- card: death-of-cleopatra-lewis
  fact: "It outlasted the track, a wartime Navy plant and a post office, and a Cicero fire inspector took charge of it"
  sources:
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "The statue remained on the spot after the racetrack became a golf course and then a World War II torpedo plant, but when a U.S. Postal Service facility was built on the site in the early 1970s, Cleopatra was hauled off to a contractor's storage yard in nearby Cicero. As it lay there deteriorating, it was spotted by Harold Adams, a local fire inspector."}
    - {title: "Ron Grossman, Chicago Tribune, 20 June 1988 (reprinted by Marilyn Richardson)", url: "https://marilynrichardson.art/category/cleopatra/", quote: "the latest in a string of caretakers dating to the turn of the century, including a racetrack owner, the Navy, the post office and a Cicero firefighter."}
- card: death-of-cleopatra-lewis
  fact: "In 1988 Marilyn Richardson found it in a mall storeroom, painted, among Christmas decorations"
  sources:
    - {title: "Ron Grossman, Chicago Tribune, 20 June 1988 (reprinted by Marilyn Richardson)", url: "https://marilynrichardson.art/category/cleopatra/", quote: "In a storeroom of the Forest Park Mall, she found a long-lost work of Edmonia Lewis"}
    - {title: "Hyperallergic: The Decades-Long Quest to Find and Honor Edmonia Lewis's Grave", url: "https://hyperallergic.com/434881/edmonia-lewis-grave/", quote: "In 1988, Richardson discovered a sculpture by Lewis, the breathtaking “Death of Cleopatra,” the sculptor’s two-ton contribution to the 1876 Centennial in Pennsylvania, in a mall storage room in suburban Chicago. When Richardson first saw it, it was clumsily painted and “jammed in between Christmas trees.”"}
- card: death-of-cleopatra-lewis
  fact: "In 1994 the Historical Society of Forest Park gave it to the Smithsonian American Art Museum, where it is on view"
  sources:
    - {title: "Smithsonian American Art Museum: The Death of Cleopatra (1994.17)", url: "https://americanart.si.edu/artwork/death-cleopatra-33878", quote: "Gift of the Historical Society of Forest Park, Illinois, 1994.17"}
    - {title: "National Women's History Museum: Edmonia Lewis", url: "https://www.womenshistory.org/education-resources/biographies/edmonia-lewis", quote: "It was donated to the Smithsonian in the early 1990s and now welcomes visitors to the museum’s third floor galleries."}
- card: death-of-cleopatra-lewis
  fact: "It is the most famous work of Lewis"
  sources:
    - {title: "ArtsATL: Said in Stone at Georgia Museum reclaims the remarkable career of sculptor Edmonia Lewis", url: "https://www.artsatl.org/said-in-stone-at-georgia-museum-reclaims-the-remarkable-career-of-sculptor-edmonia-lewis/", quote: "Her most famous work, The Death of Cleopatra , suffered one of the most bizarre fates in art history."}
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "her most important piece, The Death of Cleopatra , which caused such a stir in Philadelphia"}
- card: death-of-cleopatra-lewis
  fact: "Lewis was the first sculptor of African American and Native American descent to win international recognition"
  sources:
    - {title: "Smithsonian American Art Museum: Edmonia Lewis", url: "https://americanart.si.edu/artist/edmonia-lewis-2914", quote: "Edmonia Lewis was the first sculptor of African American and Native American (Mississauga) descent to achieve international recognition."}
    - {title: "Hyperallergic: The Decades-Long Quest to Find and Honor Edmonia Lewis's Grave", url: "https://hyperallergic.com/434881/edmonia-lewis-grave/", quote: "The first black sculptress to gain fame on both sides of the Atlantic"}
- card: death-of-cleopatra-lewis
  fact: "Dispute: birth year 1844 vs about 1840"
  sources:
    - {title: "Smithsonian American Art Museum: Edmonia Lewis", url: "https://americanart.si.edu/artist/edmonia-lewis-2914", quote: "born Greenbush (now Rensselaer), NY 1844-died London, England 1907"}
    - {title: "Smithsonian Magazine: The Object at Hand (September 1996)", url: "https://web.archive.org/web/20210120191919/https://www.smithsonianmag.com/arts-culture/the-object-at-hand-4-121205387/", quote: "Born about 1840, the daughter of a black father and a part-Ojibwa mother"}
- card: sodade
  fact: "Morna is the song genre of Cape Verde; its themes include love, departure, separation, longing and the sea"
  sources:
    - {title: "UNESCO: Morna, musical practice of Cabo Verde", url: "https://ich.unesco.org/en/RL/morna-musical-practice-of-cabo-verde-01469", quote: "The lyric poetry can be improvised, with topics including love, departure, separation, reunion, longing, the ocean and the motherland."}
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "While morna covers a variety of themes, it is distinct for the way in which it depicts the experience of migration, speaking of love, the yearning for the homeland and for those who leave."}
- card: sodade
  fact: "UNESCO inscribed morna as intangible heritage of humanity in 2019"
  sources:
    - {title: "UNESCO: Morna, musical practice of Cabo Verde", url: "https://ich.unesco.org/en/RL/morna-musical-practice-of-cabo-verde-01469", quote: "Inscribed in 2019 ( 14.COM ) on the Representative List of the Intangible Cultural Heritage of Humanity"}
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "And in December 2019, it was recognised by UNESCO as an intangible cultural heritage of humanity."}
- card: sodade
  fact: "Morna today is sung mostly in Kriolu, Cape Verdean Creole"
  sources:
    - {title: "UNESCO: Morna, musical practice of Cabo Verde", url: "https://ich.unesco.org/en/RL/morna-musical-practice-of-cabo-verde-01469", quote: "While in the past the lyrics were also composed in Portuguese, nowadays it is mainly composed in Cape Verdean Creole."}
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "morna is often sung in Kriolu, Portuguese-based Creole, though it can be instrumental, too."}
- card: sodade
  fact: "Sodade is a morna from the island of São Nicolau"
  sources:
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "’Sodade’ is a song composed on the island of San Nicolau"}
    - {title: "A Semana (Praia), 4 April 2007: Morreu Armando Zeferino Soares, pai da morna Sodade", url: "https://web.archive.org/web/20071031040759/http://www.asemana.cv/article.php3?id_article=23465", quote: "Morreu ontem, na sua ilha natal de S. Nicolau, Armando Zeferino Soares, autor da célebre morna “Sodade”"}
- card: sodade
  fact: "In the 1950s islanders left on labour contracts for the cocoa and coffee plantations of São Tomé"
  sources:
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "It was 1954, and she had been given a contract to work picking coffee, coconut and cocoa at a plantation."}
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "which evokes the departure of Cape Verdeans to the island of Sao Tomè to cultivate cocoa."}
    - {title: "A Semana (Praia), 4 April 2007: Morreu Armando Zeferino Soares, pai da morna Sodade", url: "https://web.archive.org/web/20071031040759/http://www.asemana.cv/article.php3?id_article=23465", quote: "um grupo de conterrâneos que iriam emigrar para S. Tomé e Príncipe, nos anos cinquenta."}
- card: sodade
  fact: "Emigrants were seen off at the boats with songs, return being uncertain"
  sources:
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "When people were embarking to São Tomé, we would take them to the boats, serenading them."}
    - {title: "A Semana (Praia), 4 April 2007: Morreu Armando Zeferino Soares, pai da morna Sodade", url: "https://web.archive.org/web/20071031040759/http://www.asemana.cv/article.php3?id_article=23465", quote: "pois, se a partida era uma certeza o regresso era uma incerteza."}
- card: sodade
  fact: "Armando Zeferino Soares, a São Nicolau trader/salesman, is credited with the song"
  sources:
    - {title: "A Semana (Praia), 4 April 2007: Morreu Armando Zeferino Soares, pai da morna Sodade", url: "https://web.archive.org/web/20071031040759/http://www.asemana.cv/article.php3?id_article=23465", quote: "comerciante na localidade de Praia Branca"}
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "The song, Sodade, was written down with some modifications by a local salesman, Armando Zeferino Soares."}
- card: sodade
  fact: "The song asks who showed you the long road to São Tomé"
  sources:
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "“Who showed you / That far away path? / The path / to São Tomé."}
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "Who showed you the way, the long way to Sao Tome?"}
- card: sodade
  fact: "Cesária Évora was born in Mindelo in 1941"
  sources:
    - {title: "Encyclopaedia Britannica: Cesaria Evora", url: "https://web.archive.org/web/20230921142323/https://www.britannica.com/biography/Cesaria-Evora", quote: "Cesaria Evora , (born August 27, 1941, Mindelo , Cape Verde"}
    - {title: "Garth Cartwright, The Guardian: Cesária Évora obituary (17 December 2011)", url: "https://www.theguardian.com/music/2011/dec/17/cesaria-evora", quote: "She was born in Mindelo, a port city on the island of São Vicente."}
- card: sodade
  fact: "She sang in Mindelo's bars from her youth"
  sources:
    - {title: "Garth Cartwright, The Guardian: Cesária Évora obituary (17 December 2011)", url: "https://www.theguardian.com/music/2011/dec/17/cesaria-evora", quote: "After becoming an orphan, Évora made a living from the age of 15 by singing in bars."}
    - {title: "Encyclopaedia Britannica: Cesaria Evora", url: "https://web.archive.org/web/20230921142323/https://www.britannica.com/biography/Cesaria-Evora", quote: "by the time she was a young adult, she routinely performed in the bars of her hometown of Mindelo."}
- card: sodade
  fact: "She performed barefoot and her first album was called The Barefoot Diva"
  sources:
    - {title: "Encyclopaedia Britannica: Cesaria Evora", url: "https://web.archive.org/web/20230921142323/https://www.britannica.com/biography/Cesaria-Evora", quote: "La Diva aux pieds nus (“The Barefoot Diva,” the nickname based on her fondness for going without shoes)"}
    - {title: "Garth Cartwright, The Guardian: Cesária Évora obituary (17 December 2011)", url: "https://www.theguardian.com/music/2011/dec/17/cesaria-evora", quote: "Her 1988 debut album, La Diva aux Pieds Nus (The Barefoot Diva)"}
- card: sodade
  fact: "Miss Perfumado (1992) made her famous in Europe"
  sources:
    - {title: "Encyclopaedia Britannica: Cesaria Evora", url: "https://web.archive.org/web/20230921142323/https://www.britannica.com/biography/Cesaria-Evora", quote: "The positive response generated by the 1992 release of Miss perfumado earned her widespread popularity in Europe"}
    - {title: "Garth Cartwright, The Guardian: Cesária Évora obituary (17 December 2011)", url: "https://www.theguardian.com/music/2011/dec/17/cesaria-evora", quote: "Miss Perfumado (1992) was backed by a BMG campaign that helped it sell more than 300,000 copies in France."}
- card: sodade
  fact: "Sodade became the album's best-known song"
  sources:
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "Sodade became one of the most recognised tracks in the 1992 Grammy-nominated album, “Miss Perfumado”"}
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "the song “Sodade”, present on the album Miss Perfumado (1992), exploded"}
- card: sodade
  fact: "Évora died in Mindelo in 2011"
  sources:
    - {title: "Encyclopaedia Britannica: Cesaria Evora", url: "https://web.archive.org/web/20230921142323/https://www.britannica.com/biography/Cesaria-Evora", quote: "died December 17, 2011, Mindelo"}
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "On 17 December 2011, Cesária passed away of respiratory failure in Mindelo."}
- card: sodade
  fact: "The song became known far beyond the islands"
  sources:
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "became a universal anthem for Cape Verdeans throughout the world."}
    - {title: "PAM (Pan African Music): Cesária Évora, memories of a journey", url: "https://pan-african-music.com/en/?p=95099", quote: "she toured the world several times"}
- card: sodade
  fact: "Dispute: composed at a farewell by Soares vs written down with modifications"
  sources:
    - {title: "A Semana (Praia), 4 April 2007: Morreu Armando Zeferino Soares, pai da morna Sodade", url: "https://web.archive.org/web/20071031040759/http://www.asemana.cv/article.php3?id_article=23465", quote: "descreveu em que circunstância concebeu “Sodade”, morna surgida num dia em que se foi despedir de um grupo de conterrâneos"}
    - {title: "Beatriz Ramalho da Silva, Al Jazeera: The story of morna (2021)", url: "https://www.aljazeera.com/features/2021/5/23/morna-the-music-of-displacement-and-return", quote: "was written down with some modifications by a local salesman, Armando Zeferino Soares."}
- card: mas-que-nada
  fact: "Jorge Ben was a singer and guitarist from Rio de Janeiro"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "Local de nascimento Rio de Janeiro, RJ"}
    - {title: "Rolling Stone: Eartha Kitt introduces Sergio Mendes and Brasil '66, Mas Que Nada", url: "https://www.rollingstone.com/music/music-latin/sergio-mendes-brasil-66-mas-que-nada-eartha-kitt-1967-731124/", quote: "originally penned and performed by singer-guitarist Jorge Ben"}
- card: mas-que-nada
  fact: "Early in his career he sang his own songs at the Bottles club in the Beco das Garrafas, Copacabana"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "Em seguida, apresentou-se no Bottles, também no Beco das Garrafas, cantando e tocando músicas de sua autoria."}
    - {title: "The Guardian (2019): will.i.am and Sérgio Mendes, how we made Mas Que Nada", url: "https://www.theguardian.com/music/2019/apr/22/william-sergio-mendes-on-how-we-made-mas-que-nada-black-eyed-peas", quote: "I first heard it when I was working in Bottles Bar in Copacabana . This guy called Jorge Ben came in and played this song he’d written ."}
- card: mas-que-nada
  fact: "In 1958 José Prates recorded 'Nanã Imborô' on Tam...Tam...Tam...!, later reshaped by Jorge Ben into Mas que nada"
  sources:
    - {title: "Sounds and Colours: José Prates' rare Brazilian classic Tam…Tam…Tam…! reissued", url: "https://soundsandcolours.com/articles/brazil/jose-prates-incredibly-rare-brazilian-classic-tamtamtam-reissued-26911/", quote: "by José Prates and Miecio Askanasy, an LP that came out all the way back in 1958 and which, in “Nana Imborô” contains the track that would be later shaped by Jorge Ben into “Mas Que Nada”."}
    - {title: "Matthew Wright, The Arts Desk: CD: Sonzeira, Tam Tam Tam Reimagined (2016)", url: "https://theartsdesk.com/new-music/cd-sonzeira-tam-tam-tam-reimagined", quote: "“Nana Imboro” is the place to start, a song that Jorge Ben transformed into “Mas Que Nada”"}
- card: mas-que-nada
  fact: "The album was music for Brasiliana, a touring dance show produced by Miecio Askanasy"
  sources:
    - {title: "Matthew Wright, The Arts Desk: CD: Sonzeira, Tam Tam Tam Reimagined (2016)", url: "https://theartsdesk.com/new-music/cd-sonzeira-tam-tam-tam-reimagined", quote: "Little-known Brazilian arranger José Prates created the music recorded on Tam...Tam...Tam...! in the early 1950s to accompany a touring dance show."}
    - {title: "Trunk Records: Tam...Tam...Tam...! (reissue notes)", url: "https://trunkrecords.com/releases/tamtamtam_14/tamtamtam.php", quote: "It was part of a global touring show called “Brasiliana” put together by Polish producer Miecio Askanasy."}
- card: mas-que-nada
  fact: "In 1963 he sang Mas que nada as guest vocalist on organist Zé Maria's album"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "realizou sua primeira participação em estúdio, atuando como “crooner” nas faixas “Mas que nada” e “Por causa de você, menina”, ambas de sua autoria, incluídas no LP “Tudo azul”, de Zé Maria."}
    - {title: "Marcos Henrique do Amaral, O Samba Esquema Novo no interlúdio entre bossa nova e MPB, Revista SEDA 7:15 (2023)", url: "https://revistaseda.org/index.php/seda/article/download/134/131/414", quote: "Continental no disco de Zé Maria."}
- card: mas-que-nada
  fact: "In 1963 it appeared on his first LP Samba Esquema Novo on Philips"
  sources:
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "Nesse mesmo ano, gravou seu primeiro LP, “Samba esquema novo”, contendo essas duas canções"}
    - {title: "Marcos Henrique do Amaral, O Samba Esquema Novo no interlúdio entre bossa nova e MPB, Revista SEDA 7:15 (2023)", url: "https://revistaseda.org/index.php/seda/article/download/134/131/414", quote: "1963 marca o debute fonográfico de Jorge Duílio Lima de Menezes, Jorge Ben a partir daquele ano: o disco Samba Esquema Novo."}
- card: mas-que-nada
  fact: "Sérgio Mendes first heard Ben play it in Copacabana"
  sources:
    - {title: "The Guardian (2019): will.i.am and Sérgio Mendes, how we made Mas Que Nada", url: "https://www.theguardian.com/music/2019/apr/22/william-sergio-mendes-on-how-we-made-mas-que-nada-black-eyed-peas", quote: "I first heard it when I was working in Bottles Bar in Copacabana ."}
    - {title: "Rolling Stone: Eartha Kitt introduces Sergio Mendes and Brasil '66, Mas Que Nada", url: "https://www.rollingstone.com/music/music-latin/sergio-mendes-brasil-66-mas-que-nada-eartha-kitt-1967-731124/", quote: "His most popular recording, “Mas Que Nada,” was originally penned and performed by singer-guitarist Jorge Ben, a former member of Mendes’ band."}
- card: mas-que-nada
  fact: "Mendes moved to the US and recorded it in 1966 with Brasil '66 on their debut for Herb Alpert's A&M"
  sources:
    - {title: "Rolling Stone: Eartha Kitt introduces Sergio Mendes and Brasil '66, Mas Que Nada", url: "https://www.rollingstone.com/music/music-latin/sergio-mendes-brasil-66-mas-que-nada-eartha-kitt-1967-731124/", quote: "Mendes made a home in the United States where, with the help of Herb Alpert and his home label A&M Records, Mendes would assemble a band of Americans and Brazilian exiles called Brasil ’66."}
    - {title: "The Guardian (2019): will.i.am and Sérgio Mendes, how we made Mas Que Nada", url: "https://www.theguardian.com/music/2019/apr/22/william-sergio-mendes-on-how-we-made-mas-que-nada-black-eyed-peas", quote: "I put a band together called Brasil ’66."}
- card: mas-que-nada
  fact: "The song became a US hit after radio play"
  sources:
    - {title: "The Guardian (2019): will.i.am and Sérgio Mendes, how we made Mas Que Nada", url: "https://www.theguardian.com/music/2019/apr/22/william-sergio-mendes-on-how-we-made-mas-que-nada-black-eyed-peas", quote: "Once it was played on the radio, it became a huge hit in the US, and the rest of the world followed."}
    - {title: "Dicionário Cravo Albin da MPB: Jorge Ben Jor", url: "https://dicionariompb.com.br/artista/jorge-ben-jor/", quote: "“Mas que nada” e “Chove chuva”, por Sergio Mendes, que chegaram às paradas de sucesso norte-americanas"}
- card: mas-que-nada
  fact: "Forty years later (2006) Mendes recorded it with the Black Eyed Peas and it became a worldwide success again"
  sources:
    - {title: "The Guardian (2019): will.i.am and Sérgio Mendes, how we made Mas Que Nada", url: "https://www.theguardian.com/music/2019/apr/22/william-sergio-mendes-on-how-we-made-mas-que-nada-black-eyed-peas", quote: "Then, 40 years later, Mas Que Nada became a worldwide success all over again with the Black Eyed Peas’ version ."}
    - {title: "Rolling Stone: Eartha Kitt introduces Sergio Mendes and Brasil '66, Mas Que Nada", url: "https://www.rollingstone.com/music/music-latin/sergio-mendes-brasil-66-mas-que-nada-eartha-kitt-1967-731124/", quote: "Mendes later re-recorded his hit in  2006 with the Black Eyed Peas"}
- card: clarim-dalvorada
  fact: "After abolition (1888) São Paulo subsidised mass European immigration, leaving freed people at the margins"
  sources:
    - {title: "Ana Martins, BlackPast: O Clarim da Alvorada (1924-1932)", url: "https://blackpast.org/global-african-history/o-clarim-da-alvorada-1924-1932", quote: "Following the abolition of slavery in 1888, subsidized European immigration proceeded in large numbers, leaving the freed slaves with few economic options."}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "Particularmente no Estado de São Paulo, outro fator que contribuiu para a marginalização dos negros foi a execução de um projeto de imigração estrangeira em massa, sobretudo entre as décadas de 1890 a 1920."}
- card: clarim-dalvorada
  fact: "São Paulo's Black social clubs produced their own papers"
  sources:
    - {title: "Encyclopedia of Latin American History and Culture, via Encyclopedia.com: Frente Negra Brasileira", url: "https://encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/frente-negra-brasileira", quote: "Afro-Brazilians came to constitute a community of their own, with social clubs sponsoring activities such as dances, athletics, excursions, and newsletters."}
    - {title: "Ana Martins, BlackPast: O Clarim da Alvorada (1924-1932)", url: "https://blackpast.org/global-african-history/o-clarim-da-alvorada-1924-1932", quote: "Part of a larger black press movement in the city of São Paulo, from about 1915"}
- card: clarim-dalvorada
  fact: "First issue 6 January 1924, originally titled O Clarim"
  sources:
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "Sua primeira edição foi em 06 de janeiro de 1924, e originalmente chamavase O Clarim"}
    - {title: "Maria Cláudia Cardoso Ferreira: O jornal O Clarim d'Alvorada no pós-abolição, ANPUH (2011)", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856711_44f3cef198b92a091287a9f49a561cc6.pdf", quote: "O Clarim d‘ Alvorada foi fundado pelos jovens militantes Jayme de Aguiar e José Correia Leite, em 06 de janeiro de 1924 com o nome de O Clarim."}
- card: clarim-dalvorada
  fact: "Founded by two young Black men, Jayme de Aguiar and José Correia Leite"
  sources:
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "O idealizador d’O Clarim da Alvorada foi Jayme de Aguiar, um jovem negro"}
    - {title: "Ana Martins, BlackPast: O Clarim da Alvorada (1924-1932)", url: "https://blackpast.org/global-african-history/o-clarim-da-alvorada-1924-1932", quote: "Co-founded by Jaime de Aguiar (young aspiring poet) and José Correia Leite, both in their early twenties"}
- card: clarim-dalvorada
  fact: "At first it was a literary paper with poems and society news"
  sources:
    - {title: "Flávio Thales Ribeiro Francisco: Um novo abolicionismo para a ascensão na nação da Mãe Preta, Antíteses 10:19 (2017)", url: "https://www.uel.br/revistas/uel/index.php/antiteses/article/download/23554/21270", quote: "de criar uma folha para a publicação de textos literários de escritores que circulavam entre os espaços da “elite negra”"}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "o jornal tinha como subtítulo “órgão literário, noticióso e humorístico”"}
- card: clarim-dalvorada
  fact: "In 1928, under Correia Leite, the masthead became 'For the interest of Black men: news, literature and combat'"
  sources:
    - {title: "Maria Cláudia Cardoso Ferreira: O jornal O Clarim d'Alvorada no pós-abolição, ANPUH (2011)", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856711_44f3cef198b92a091287a9f49a561cc6.pdf", quote: "o subtítulo do ‘Clarim (...)’ passa a ser, ‘Pelo interesse dos Homens Pretos – Noticióso, Literário e de Combate’."}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "a segunda fase, entre 1928 e 1932 trata-se de um período no qual o jornal adota abertamente uma postura mais combativa"}
- card: clarim-dalvorada
  fact: "It read the US Black press, including the Chicago Defender and Garvey's Negro World"
  sources:
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "através dos jornais Negro World, do panafricanista Marcus Garvey e do Chicago Defender"}
    - {title: "Maria Cláudia Cardoso Ferreira: O jornal O Clarim d'Alvorada no pós-abolição, ANPUH (2011)", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856711_44f3cef198b92a091287a9f49a561cc6.pdf", quote: "Entre elles destacam-se em primeiro plano o The Chicago Defender, Philadelphia Tribune, The Afro American, The Negro Wold e The Washington Eagle."}
- card: clarim-dalvorada
  fact: "It campaigned to honour the Mãe Preta, the Black nursemaid"
  sources:
    - {title: "Flávio Thales Ribeiro Francisco: Um novo abolicionismo para a ascensão na nação da Mãe Preta, Antíteses 10:19 (2017)", url: "https://www.uel.br/revistas/uel/index.php/antiteses/article/download/23554/21270", quote: "A Mãe Preta surgiu então como a personagem ideal, pois representaria todas as mulheres que haviam trabalhado como escravas, amamentado os filhos dos senhores."}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "comemoração ao “Dia da Mãe Preta”."}
- card: clarim-dalvorada
  fact: "It argued Black Brazilians helped build the nation and deserved recognition as citizens"
  sources:
    - {title: "Flávio Thales Ribeiro Francisco: Um novo abolicionismo para a ascensão na nação da Mãe Preta, Antíteses 10:19 (2017)", url: "https://www.uel.br/revistas/uel/index.php/antiteses/article/download/23554/21270", quote: "elaborando narrativas históricas que legitimassem o papel do negro enquanto cidadão brasileiro na edificação da “pátria brasileira”."}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "o negro teria sido um dos agentes produtores das riquezas da nação brasileira e do próprio povo brasileiro"}
- card: clarim-dalvorada
  fact: "Its campaigns helped prepare the Frente Negra Brasileira, founded 1931"
  sources:
    - {title: "Ana Martins, BlackPast: O Clarim da Alvorada (1924-1932)", url: "https://blackpast.org/global-african-history/o-clarim-da-alvorada-1924-1932", quote: "the foundations planted by Clarim enabled the formation, in 1931, of Frente Negra Brasileira"}
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "as experiências acumuladas pelos militantes que produziam O Clarim da Alvorada contribuíram para a articulação da Frente Negra Brasileira em 1931"}
- card: clarim-dalvorada
  fact: "Correia Leite took part in founding the Frente"
  sources:
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "também participou das articulações que resultaram na criação da Frente Negra Brasileira, em 1931, sendo considerado um dos fundadores da organização."}
    - {title: "Ana Martins, BlackPast: O Clarim da Alvorada (1924-1932)", url: "https://blackpast.org/global-african-history/o-clarim-da-alvorada-1924-1932", quote: "Clarim co-founder Leite in particular, always mindful of the importance of political mobilization, organized a Congress of Black Youth"}
- card: clarim-dalvorada
  fact: "The Clarim group soon broke with the Frente's authoritarian leaders"
  sources:
    - {title: "Fundação Perseu Abramo: Frente Negra Brasileira, gestando um projeto político para o Brasil", url: "https://fpabramo.org.br/frente-negra-brasileira-gestando-um-projeto-politico-para-o-brasil-2/", quote: "Logo no seu início, o grupo do jornal Clarim da Alvorada, de José Correia Leite, rompeu com a Frente Negra."}
    - {title: "Flávio Thales Ribeiro Francisco: Um novo abolicionismo para a ascensão na nação da Mãe Preta, Antíteses 10:19 (2017)", url: "https://www.uel.br/revistas/uel/index.php/antiteses/article/download/23554/21270", quote: "quando começou a questionar o autoritarismo das lideranças da Frente Negra Brasileira (1931-1937)"}
- card: clarim-dalvorada
  fact: "The quarrel ended the paper in the early 1930s (1932/1933)"
  sources:
    - {title: "Flávio Thales Ribeiro Francisco: Um novo abolicionismo para a ascensão na nação da Mãe Preta, Antíteses 10:19 (2017)", url: "https://www.uel.br/revistas/uel/index.php/antiteses/article/download/23554/21270", quote: "O Clarim da Alvorada somente encerrou suas atividades em 1932, quando começou a questionar o autoritarismo das lideranças da Frente Negra Brasileira (1931-1937) e teve a redação empastelada pela milícia da organização negra recém-formada."}
    - {title: "Maria Cláudia Cardoso Ferreira: O jornal O Clarim d'Alvorada no pós-abolição, ANPUH (2011)", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856711_44f3cef198b92a091287a9f49a561cc6.pdf", quote: "Em 1933, após desavença com militantes da Frente Negra O Clarim d' Alvorada é extinto, só voltando a existir em 1940"}
- card: clarim-dalvorada
  fact: "A 1940 revival produced a single issue"
  sources:
    - {title: "Renan Rosa dos Santos: Pela integração negra, a trajetória do jornal O Clarim da Alvorada (1924-1932), ANPUH-SP (2020)", url: "https://www.encontro2020.sp.anpuh.org/resources/anais/14/anpuh-sp-erh2020/1600109480_ARQUIVO_7e61e4fa3599d43c5e37b820d8f97c53.pdf", quote: "com a publicação em 1940, após oito anos de hiato, mas esse acabou sendo o único número publicado."}
    - {title: "Maria Cláudia Cardoso Ferreira: O jornal O Clarim d'Alvorada no pós-abolição, ANPUH (2011)", url: "https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856711_44f3cef198b92a091287a9f49a561cc6.pdf", quote: "Na Biblioteca consta apenas o exemplar que a inaugura, com a data de 28/09/1940,ano I n.º 1."}
- card: black-orpheus
  fact: "The film transposes the Orpheus and Eurydice myth to Rio de Janeiro at Carnival"
  sources:
    - {title: "Festival de Cannes: Interview with Amir Labaki about Black Orpheus (2021)", url: "https://www.festival-cannes.com/en/2021/interview-with-amir-labaki-about-black-orpheus-orfeu-negro-the-1959-palme-d-or/", quote: "the myth of Orpheus and Eurydice, transposed to Rio de Janeiro by the French director"}
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "Take the mythical love story of Orpheus and Eurydice, transpose it to Carnaval in Rio de Janeiro"}
- card: black-orpheus
  fact: "It was based on Vinicius de Moraes's play Orfeu da Conceição and directed by Frenchman Marcel Camus"
  sources:
    - {title: "Brown University Library, Brazil: Five Centuries of Change: Black Orpheus", url: "https://library.brown.edu/create/fivecenturiesofchange/chapters/chapter-6/black-orpheus/", quote: "It is based on a play, Orfeu da Conceição , by the Brazilian writer Vinicius de Moraes"}
    - {title: "Festival de Cannes: Interview with Amir Labaki about Black Orpheus (2021)", url: "https://www.festival-cannes.com/en/2021/interview-with-amir-labaki-about-black-orpheus-orfeu-negro-the-1959-palme-d-or/", quote: "Camus transposes the Greek myth of Vinicius de Moraes' play to a contemporary Rio de Janeiro"}
- card: black-orpheus
  fact: "Orfeu is a tram driver"
  sources:
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "A trolley-car motorman and gifted guitarist"}
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "Orfeo (Mello) is a trolley car driver in downtown Rio"}
- card: black-orpheus
  fact: "The story is set in a favela"
  sources:
    - {title: "Brown University Library, Brazil: Five Centuries of Change: Black Orpheus", url: "https://library.brown.edu/create/fivecenturiesofchange/chapters/chapter-6/black-orpheus/", quote: "It was the first internationally acclaimed film to take place entirely in a favela"}
    - {title: "Festival de Cannes: Interview with Amir Labaki about Black Orpheus (2021)", url: "https://www.festival-cannes.com/en/2021/interview-with-amir-labaki-about-black-orpheus-orfeu-negro-the-1959-palme-d-or/", quote: "the poor, sensual and colourful favelas"}
- card: black-orpheus
  fact: "Eurydice is played by Marpessa Dawn and is doomed; Orfeu follows her to the dead (morgue/underworld)"
  sources:
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "he becomes enthralled with the beautiful, doomed Eurydice, played by Marpessa Dawn. ... Eventually, Orfeu finds her in the morgue."}
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "In the Greek myth, Eurydice is killed from the bite of a viper and Orpheus goes to the underworld to retrieve her soul and bring her back to life. This is well-paralleled in Black Orpheus ."}
- card: black-orpheus
  fact: "Almost the whole cast was Black"
  sources:
    - {title: "Brown University Library, Brazil: Five Centuries of Change: Black Orpheus", url: "https://library.brown.edu/create/fivecenturiesofchange/chapters/chapter-6/black-orpheus/", quote: "with an all-black Brazilian cast (one of the leads was of mixed race, and from Pittsburgh, though this was rarely remarked upon)"}
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "while making it realistic to time and setting by starring only black actors"}
- card: black-orpheus
  fact: "Orfeu was played by Breno Mello, a footballer from Porto Alegre"
  sources:
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "died on July 14 in Porto Alegre, Brazil, his hometown. ... returned to soccer because, he said, the Brazilian film industry was not rich enough to support him."}
    - {title: "Marcello Campos, Jornal do Comércio (Porto Alegre), 29 October 2026: Breno Mello", url: "https://www.jornaldocomercio.com/especiais/reportagem-cultural/2026/10/1268526-breno-mello-do-futebol-porto-alegrense-a-fama-internacional-no-cinema.html", quote: "Breno Mello: do futebol porto-alegrense à fama internacional no cinema"}
- card: black-orpheus
  fact: "Songs by Jobim and Bonfá, incl. Manhã de Carnaval and A Felicidade, carried bossa nova worldwide"
  sources:
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "“Black Orpheus” became renowned for its soundtrack by the bossa nova legends Antonio Carlos Jobim and Luiz Bonfá, with songs like “Manhã de Carnaval” and “A Felicidade.”"}
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "Soundtrack composers Antonio Carlos Jobim and Luis Bonfa introduced the style of bossa nova to popular culture"}
- card: black-orpheus
  fact: "It won the 1959 Palme d'Or"
  sources:
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "It won the Palme d’Or at the 1959 Cannes Film Festival"}
    - {title: "Brown University Library, Brazil: Five Centuries of Change: Black Orpheus", url: "https://library.brown.edu/create/fivecenturiesofchange/chapters/chapter-6/black-orpheus/", quote: "as well as the Palme d’Or, the highest recognition at the 1959 Cannes Film Festival."}
- card: black-orpheus
  fact: "It won the Oscar for best foreign-language film, credited to France"
  sources:
    - {title: "Academy of Motion Picture Arts and Sciences: The 32nd Academy Awards (1960)", url: "https://www.oscars.org/oscars/ceremonies/1960", quote: "Foreign Language Film Winner Black Orpheus France"}
    - {title: "Brown University Library, Brazil: Five Centuries of Change: Black Orpheus", url: "https://library.brown.edu/create/fivecenturiesofchange/chapters/chapter-6/black-orpheus/", quote: "winning an Academy Award for Best Foreign Language Film and a Golden Globe for Best Foreign Film—where, in both cases, it was credited as a French production"}
- card: black-orpheus
  fact: "Audiences loved it"
  sources:
    - {title: "Festival de Cannes: Interview with Amir Labaki about Black Orpheus (2021)", url: "https://www.festival-cannes.com/en/2021/interview-with-amir-labaki-about-black-orpheus-orfeu-negro-the-1959-palme-d-or/", quote: "The public adored it but the critics, including Jean-Luc Godard, were scathing"}
    - {title: "Vanessa McMahon, filmfestivals.com: Looking back, Black Orpheus (2012)", url: "https://mail.filmfestivals.com/blog/vanessa_mcmahon/looking_back_cinemas_greatest_moments_black_orpheus_orfeu_negro_1959", quote: "the film received worldwide critical acclaim"}
- card: black-orpheus
  fact: "Many Brazilian critics rejected it as a clichéd, exotic postcard of Brazil and favela poverty"
  sources:
