    - {title: "Marcello Campos, Jornal do Comércio (Porto Alegre), 29 October 2026: Breno Mello", url: "https://www.jornaldocomercio.com/especiais/reportagem-cultural/2026/10/1268526-breno-mello-do-futebol-porto-alegrense-a-fama-internacional-no-cinema.html", quote: "a biografia do porto-alegrense Breno Mello (1931-2008)"}
- card: black-orpheus
  fact: "The film is remembered above all for its music, which introduced bossa nova abroad"
  sources:
    - {title: "Eli Kooris, The Austin Chronicle: Black Orpheus (2002)", url: "https://www.austinchronicle.com/screens/video-reviews-11713359/", quote: "Camus’ picture is known more for what it changed in the world of music than for what it changed in the world of celluloid"}
    - {title: "Dennis Hevesi, The New York Times: Breno Mello, 76, Star of 'Orpheus,' Dies (2008)", url: "https://www.nytimes.com/2008/09/06/movies/06mello.html", quote: "“Black Orpheus” became renowned for its soundtrack by the bossa nova legends"}
- card: the-jungle-lam
  fact: "Lam was born in 1902 in Sagua la Grande, Cuba"
  sources:
    - {title: "Encyclopaedia Britannica: Wifredo Lam", url: "https://web.archive.org/web/20230129072504/https://www.britannica.com/biography/Wifredo-Lam", quote: "Born: December 8, 1902 Sagua la Grande Cuba"}
    - {title: "Solomon R. Guggenheim Museum: Wifredo Lam, biography", url: "https://web.archive.org/web/20060106103849/http://www.guggenheimcollection.org/site/artist_bio_83.html", quote: "Wifredo Oscar de la Concepción Lam y Castilla was born December 8, 1902, in Sagua la Grande, Cuba."}
- card: the-jungle-lam
  fact: "His father was a Chinese immigrant; his mother of African and Spanish descent"
  sources:
    - {title: "Encyclopaedia Britannica: Wifredo Lam", url: "https://web.archive.org/web/20230129072504/https://www.britannica.com/biography/Wifredo-Lam", quote: "Lam was born to a Chinese immigrant father and a mother of African and Spanish descent."}
    - {title: "Tate Modern: Wifredo Lam (2016–2017)", url: "https://www.tate.org.uk/whats-on/tate-modern/wifredo-lam", quote: "Lam’s mother was of Spanish and African heritage, and his father was Cantonese Chinese."}
- card: the-jungle-lam
  fact: "In 1938 he went to Paris and met Picasso"
  sources:
    - {title: "Encyclopaedia Britannica: Wifredo Lam", url: "https://web.archive.org/web/20230129072504/https://www.britannica.com/biography/Wifredo-Lam", quote: "fleeing Barcelona for Paris in 1938 with a letter of introduction to Pablo Picasso ."}
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "He moved to Paris in 1938, where he met Pablo Picasso."}
- card: the-jungle-lam
  fact: "He joined Breton's Surrealists"
  sources:
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "In 1939, Lam met poet and founder of Surrealism André Breton and became associated with the Surrealist movement"}
    - {title: "Encyclopaedia Britannica: Wifredo Lam", url: "https://web.archive.org/web/20230129072504/https://www.britannica.com/biography/Wifredo-Lam", quote: "After meeting André Breton , Lam became an active member of the Surrealist movement ."}
- card: the-jungle-lam
  fact: "War drove him out; he sailed from Marseille in 1941 and returned to Havana"
  sources:
    - {title: "Encyclopaedia Britannica: Wifredo Lam", url: "https://web.archive.org/web/20230129072504/https://www.britannica.com/biography/Wifredo-Lam", quote: "In 1940 Lam went to Marseilles , where he joined a large number of intellectuals attempting to flee France and World War II . He sailed in 1941, eventually returning to Havana."}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "having fled war-torn France for Cuba in 1941."}
- card: the-jungle-lam
  fact: "Back home he studied Afro-Cuban life and Santería, which he had known since childhood"
  sources:
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "In 1943, Wifredo Lam was in the midst of re-acquainting himself with his native Cuba, especially its population of African descent."}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "Having been raised in Cuba, where his godmother was a Lucumí priestess"}
    - {title: "Solomon R. Guggenheim Museum: Wifredo Lam, biography", url: "https://web.archive.org/web/20060106103849/http://www.guggenheimcollection.org/site/artist_bio_83.html", quote: "his involvement with Santería, a religion rooted in African culture, would soon become integral to his work."}
- card: the-jungle-lam
  fact: "He began The Jungle at the end of 1942 and finished it in 1943"
  sources:
    - {title: "Solomon R. Guggenheim Museum: Wifredo Lam, biography", url: "https://web.archive.org/web/20060106103849/http://www.guggenheimcollection.org/site/artist_bio_83.html", quote: "by the end of 1942 he had begun his powerful painting Jungle."}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "his iconic 1942–43 painting La jungla (The Jungle)"}
- card: the-jungle-lam
  fact: "Gouache on paper, about 2.4 m high"
  sources:
    - {title: "Museum of Modern Art collection: The Jungle (140.1945)", url: "https://web.archive.org/web/2023/https://www.moma.org/collection/works/34666", quote: "Medium Gouache on paper on canvas Dimensions 94 1/4 x 90 1/2\" (239.4 x 229.9 cm)"}
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "Gouache on paper mounted on canvas, 94 1/4 x 90 1/2\" (239.4 x 229.9 cm)"}
- card: the-jungle-lam
  fact: "Hybrid part-human, part-animal figures stand among stalks of sugar cane"
  sources:
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "Four part-human, part-animal figures ... seem to simultaneously emerge from and merge with a dense wall of vegetation composed of thick, banded stalks suggestive of the sugarcane that grew in the fields the slaves worked."}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "Lam situated his buxom beings within a thicket of sugarcane—an explicit allusion to the commodity’s central role in the enslavement of Black people in the Caribbean."}
- card: the-jungle-lam
  fact: "Sugar cane was the crop enslaved Africans were brought to Cuba to work"
  sources:
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "Originally enslaved by Spanish and Portuguese traders and brought to the island to work its sugarcane fields"}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "an explicit allusion to the commodity’s central role in the enslavement of Black people in the Caribbean."}
- card: the-jungle-lam
  fact: "The jungle is a Caribbean (Antillean) one"
  sources:
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "La jungla does not depict just any jungle but one in the Antilles"}
    - {title: "MoMA Learning: Wifredo Lam, The Jungle, 1943", url: "https://web.archive.org/web/20230128123805/https://www.moma.org/learn/moma_learning/wifredo-lam-the-jungle-1943/", quote: "Lam painted The Jungle during a flowering of interest in Afro-Cuban traditions"}
- card: the-jungle-lam
  fact: "It was first seen in New York at the Pierre Matisse Gallery"
  sources:
    - {title: "Arte al Día: Wifredo Lam retrospective at MoMA (2026)", url: "https://www.artealdia.com/Reviews/WIFREDO-LAM-WHEN-I-DON-T-SLEEP-I-DREAM-RETROSPECTIVE-AT-MoMA", quote: "his second at the Pierre Matisse Gallery where his now famous paintings La jungla ( The Jungle ), La mañana verde (The Green Morning ), and La silla ( The Chair ) (all 1943) were first seen in New York."}
    - {title: "Solomon R. Guggenheim Museum: Wifredo Lam, biography", url: "https://web.archive.org/web/20060106103849/http://www.guggenheimcollection.org/site/artist_bio_83.html", quote: "Between 1942 and 1950, the artist exhibited regularly at the Pierre Matisse Gallery in New York."}
- card: the-jungle-lam
  fact: "MoMA acquired it in 1945 and has owned it since"
  sources:
    - {title: "Museum of Modern Art collection: The Jungle (140.1945)", url: "https://web.archive.org/web/2023/https://www.moma.org/collection/works/34666", quote: "Credit Inter-American Fund Object number 140.1945"}
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "a prized possession of MoMA’s since 1945."}
- card: the-jungle-lam
  fact: "It is a landmark of Surrealism"
  sources:
    - {title: "ARTnews: Wifredo Lam at MoMA, a great show for a misunderstood Surrealist", url: "https://www.artnews.com/art-news/reviews/wifredo-lam-moma-retrospective-surrealism-review-1234761241/", quote: "a landmark of the Surrealist movement"}
    - {title: "Arte al Día: Wifredo Lam retrospective at MoMA (2026)", url: "https://www.artealdia.com/Reviews/WIFREDO-LAM-WHEN-I-DON-T-SLEEP-I-DREAM-RETROSPECTIVE-AT-MoMA", quote: "his now famous paintings La jungla ( The Jungle )"}
- card: pressure-1976
  fact: "Pressure portrays a generation of Black Britons born to Caribbean families, coming of age in 1970s London"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "Ové and Selvon crafted a human prism through which to illuminate the plight of an emerging generational cohort that included my own father, who was born in London to parents who’d emigrated from Jamaica in the 1950s"}
    - {title: "The Guardian: Horace Ové, pioneer of black British cinema (2023)", url: "https://www.theguardian.com/film/2023/oct/24/horace-ove-black-british-cinema-bfi-radical-vision", quote: "Pressure depicted a black English teenager in 1970s London, the son of a family from Trinidad, unsettled between two cultures"}
- card: pressure-1976
