  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "in 1960, Ové moved to cold, grey England to study painting, photography and interior design"}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "In 1960 he moved to the UK to study painting, photography and design"}
- card: pressure-1976
  fact: "He photographed leaders of the Black Power movement"
  sources:
    - {title: "Barbican: ScreenTalks Archive, Horace Ové on Pressure", url: "https://www.barbican.org.uk/read-watch-listen/screentalks-archive-horace-ove-on-pressure", quote: "He began his career as a photographer, documenting leaders of the Black Power movement such as Michael X"}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "he covered racism, the Windrush generation, the Black Power movement"}
- card: pressure-1976
  fact: "He filmed James Baldwin talking to students at the West Indian Students' Centre"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "His gripping vérité-style documentary Baldwin’s Nigger (1968) was filmed at London’s West Indian Students’ Centre, and featured the intensely charismatic writer James Baldwin"}
    - {title: "Global Voices: Horace Ové, Trinidad-born trailblazer of Black British cinema (2023)", url: "https://globalvoices.org/2023/09/18/horace-ove-trinidad-born-trailblazer-of-black-british-cinema-leaves-behind-a-rich-legacy-of-films-and-photographs/", quote: "Ové chronicled the Black American writer's discussion of the civil rights struggle with comedian and activist Dick Gregory at the West Indian Students’ Centre in London"}
- card: pressure-1976
  fact: "He co-wrote Pressure with Trinidad-born novelist Samuel Selvon"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "Co-written by Ové and fellow Trinidad-born novelist Samuel Selvon"}
    - {title: "Global Voices: Horace Ové, Trinidad-born trailblazer of Black British cinema (2023)", url: "https://globalvoices.org/2023/09/18/horace-ove-trinidad-born-trailblazer-of-black-british-cinema-leaves-behind-a-rich-legacy-of-films-and-photographs/", quote: "from a screenplay co-written with renowned Trinidadian writer Sam Selvon ."}
- card: pressure-1976
  fact: "Funded by the BFI Production Board"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "Pressure’s financiers, the British Film Institute Production Board"}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "its backers, the British Film Institute"}
- card: pressure-1976
  fact: "Shot on the streets of Ladbroke Grove, west London"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "filmed in vivid, neorealism-inspired style on the streets of west London’s Ladbroke Grove"}
    - {title: "Peter Bradshaw, The Guardian: Pressure review (2023)", url: "https://www.theguardian.com/film/2023/nov/02/pressure-review-horace-ove-rerelease", quote: "the grimness of west London’s pre-gentrified Ladbroke Grove is revealed in dreamlike, deep-focus, pinsharp detail."}
- card: pressure-1976
  fact: "It follows Tony, British-born, 16, played by Herbert Norville"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "16-year-old Tony (Herbert Norville)"}
    - {title: "Barbican: ScreenTalks Archive, Horace Ové on Pressure", url: "https://www.barbican.org.uk/read-watch-listen/screentalks-archive-horace-ove-on-pressure", quote: "Herbert Norville stars as the family's youngest son, British-born Tony"}
- card: pressure-1976
  fact: "Tony is at odds with his conservative Trinidad-born parents and hopes to be accepted in white Britain"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "at odds with his religious conservative Trinidad-born parents"}
    - {title: "Peter Bradshaw, The Guardian: Pressure review (2023)", url: "https://www.theguardian.com/film/2023/nov/02/pressure-review-horace-ove-rerelease", quote: "the shy and sweet-natured Tony (Herbert Norville), who is still earnestly applying for jobs and hoping to be accepted in the white mainstream."}
- card: pressure-1976
  fact: "He looks for work and meets polite rejection"
  sources:
    - {title: "Peter Bradshaw, The Guardian: Pressure review (2023)", url: "https://www.theguardian.com/film/2023/nov/02/pressure-review-horace-ove-rerelease", quote: "His very presence causes pressure, a weird miasma of smiling unease among the entire staff as he is ushered into the manager’s office for the interview"}
    - {title: "Barbican: ScreenTalks Archive, Horace Ové on Pressure", url: "https://www.barbican.org.uk/read-watch-listen/screentalks-archive-horace-ove-on-pressure", quote: "who grows more and more disillusioned as he faces unemployment."}
- card: pressure-1976
  fact: "He follows his older brother Colin into Black Power"
  sources:
    - {title: "Barbican: ScreenTalks Archive, Horace Ové on Pressure", url: "https://www.barbican.org.uk/read-watch-listen/screentalks-archive-horace-ove-on-pressure", quote: "Alienated from his white friends, he follows his older brother into the Black Power movement."}
    - {title: "Peter Bradshaw, The Guardian: Pressure review (2023)", url: "https://www.theguardian.com/film/2023/nov/02/pressure-review-horace-ove-rerelease", quote: "he gets caught up in crime as well as Colin’s political world"}
- card: pressure-1976
  fact: "The film shows police violence"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "which features unvarnished depictions of police brutality"}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "Because it contained scenes of police brutality"}
- card: pressure-1976
  fact: "Premiered at the London Film Festival in 1975"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "following its premiere at the 1975 London Film Festival."}
    - {title: "The Guardian: Horace Ové, pioneer of black British cinema (2023)", url: "https://www.theguardian.com/film/2023/oct/24/horace-ove-black-british-cinema-bfi-radical-vision", quote: "The summer after its London film festival screening, black youths battled with police at the Notting Hill Carnival."}
- card: pressure-1976
  fact: "The first feature film by a Black director in Britain"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "making history by becoming the first Black director of a feature film in Britain with the remarkable drama Pressure (1975)"}
    - {title: "Barbican: ScreenTalks Archive, Horace Ové on Pressure", url: "https://www.barbican.org.uk/read-watch-listen/screentalks-archive-horace-ove-on-pressure", quote: "In 1975, Ove became the first black British filmmaker to direct a feature film with Pressure ."}
- card: pressure-1976
  fact: "It was held back for about two years"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "held back its release for more than two years following its premiere at the 1975 London Film Festival."}
    - {title: "Film Review Daily: In memoriam, Horace Ové", url: "https://www.filmreviewdaily.com/in-memoriam/horace-ove", quote: "its backers, the British Film Institute, banned it for two years."}
    - {title: "Global Voices: Horace Ové, Trinidad-born trailblazer of Black British cinema (2023)", url: "https://globalvoices.org/2023/09/18/horace-ove-trinidad-born-trailblazer-of-black-british-cinema-leaves-behind-a-rich-legacy-of-films-and-photographs/", quote: "caused it to be banned for two years"}
- card: pressure-1976
  fact: "Dispute: reasons for delay (rumour of incendiary content; police brutality; Notting Hill 1976; distribution wrangles per Time Out 1978)"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "a 1978 article in Time Out reported a more prosaic story of byzantine, bureaucratic distribution wrangles"}
    - {title: "The Guardian: Horace Ové, pioneer of black British cinema (2023)", url: "https://www.theguardian.com/film/2023/oct/24/horace-ove-black-british-cinema-bfi-radical-vision", quote: "The film was shelved by the BFI – effectively banned – Margaret Busby remembers, because “the riots frightened the life out of the establishment”"}
- card: pressure-1976
  fact: "Ové died in 2023"
  sources:
    - {title: "Ashley Clark, BFI: Horace Ové obituary (2023)", url: "https://www.bfi.org.uk/news/horace-ove-obituary-director-who-opened-door-black-british-filmmaking", quote: "Sir Horace Ové, who has died at the age of 86 following a battle with Alzheimer’s disease"}
    - {title: "Global Voices: Horace Ové, Trinidad-born trailblazer of Black British cinema (2023)", url: "https://globalvoices.org/2023/09/18/horace-ove-trinidad-born-trailblazer-of-black-british-cinema-leaves-behind-a-rich-legacy-of-films-and-photographs/", quote: "On Saturday, September 16, Trinidad-born, UK-based Horace Ové ... died in London at the age of 86."}
