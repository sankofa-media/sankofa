# Batch c16 (2026-11-13): facts in card bodies and wow lines, each with two or more independent sources and a verbatim quote.
# Quotes from PDFs (Cunin, Will South) and from archived pages are given as extracted; OCR spacing normalised.
# Dropped as single-sourced during research: Pareja's 'more than two decades' as assistant, the Met's 'only known Afro-Hispanic self-portrait' claim; Tanner's typhoid and the Harper's Young People story; Powers asking ten dollars and arriving by ox-cart; the 1909 Fisk recording; Sankara lending the army and Sarraounia's small French release; the acting mayor's 2019 statement to the palenqueras (one outlet only); Moreno Fraginals's 'single paragraph'.
# Second check 2026-11-14: verdicts in expand-c16-check.yaml. CubaNet was unreachable and is no longer cited; single-sourced details found then were removed from the cards and are noted on their entries.

- card: pareja-calling-of-matthew
  fact: "Painters' guilds did not admit enslaved people; enslaved and formerly enslaved people were barred from becoming professional painters"
  sources:
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "guilds did not permit enslaved members"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "where Afro-Hispanic enslaved people and formerly enslaved people were forbidden from becoming professional painters"}
- card: pareja-calling-of-matthew
  fact: "Pareja was born in Antequera near Málaga to a mother of African descent"
  sources:
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "Pareja was born around 1608 in Antequera, in the province of Malaga ... his mother was most likely an African-descended, enslaved woman living in Antequera"}
    - {title: "Robert Fikes, BlackPast: Juan de Pareja (ca. 1606-1670)", url: "https://www.Blackpast.org/gah/pareja-juan-de-1606-1670", quote: "born in the region of Andalusia, Spain, either in Seville or the much smaller city of Antequera 82 miles southeast, reputedly to a female of African descent"}
- card: pareja-calling-of-matthew
  fact: "Pareja was for years an enslaved assistant in Velázquez's household and workshop"
  sources:
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "a man of African descent born in southern Spain who was enslaved in Velázquez’s studio and household for at least two decades"}
    - {title: "Apollo: Juan de Pareja, Afro-Hispanic Painter (2023)", url: "https://apollo-magazine.com/juan-de-pareja-met-museum-new-york/", quote: "Pareja was an enslaved assistant in Velázquez’s household and workshop for more than two decades"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "Juan de Pareja, was enslaved, and his enslaver was Diego Velázquez"}
- card: pareja-calling-of-matthew
  fact: "Velázquez was painter to King Philip IV"
  sources:
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "where he portrays himself within the court of King Philip IV of Spain"}
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "The main purpose of the trip was to buy paintings and sculptures for King Philip IV of Spain"}
- card: pareja-calling-of-matthew
  fact: "Pareja travelled with Velázquez to Italy (the year 1649 dropped from the card: only the Met gives it)"
  sources:
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "in 1649, Pareja accompanied Velázquez to Italy"}
    - {title: "Robert Fikes, BlackPast: Juan de Pareja (ca. 1606-1670)", url: "https://www.Blackpast.org/gah/pareja-juan-de-1606-1670", quote: "Pareja traveled with Velázquez to Italy"}
- card: pareja-calling-of-matthew
  fact: "In Rome in 1650 Velázquez painted Pareja's portrait, acclaimed when shown at the Pantheon"
  sources:
    - {title: "Apollo: Juan de Pareja, Afro-Hispanic Painter (2023)", url: "https://apollo-magazine.com/juan-de-pareja-met-museum-new-york/", quote: "not long after painting his portrait, which met with acclaim when it was exhibited in the Pantheon in Rome in March that year"}
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "since it first left the artist’s makeshift studio in Rome in 1650. When it made its public debut, in the Pantheon"}
- card: pareja-calling-of-matthew
  fact: "In 1650 Velázquez signed the act freeing Pareja; it took full effect in 1654"
  sources:
    - {title: "Metropolitan Museum of Art: Velázquez, Juan de Pareja, catalogue entry", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/437869", quote: "Montagu published the 1650 document in which Velázquez granted freedom to Juan de Pareja, which was to go into effect in 1654"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "eleven years after Diego Velázquez freed him from enslavement in Rome in November of 1650"}
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "After obtaining full freedom in 1654, Pareja created a style distinct from Velázquez"}
- card: pareja-calling-of-matthew
  fact: "As a free man Pareja built his own career as a painter in Madrid"
  sources:
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "After attaining his freedom from enslavement, Pareja forged an independent career, painting religious works and portraits"}
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "He then worked as a painter until he died in Madrid in 1670"}
- card: pareja-calling-of-matthew
  fact: "In 1661 he finished The Calling of Saint Matthew, 225 x 325 cm, in the Prado"
  sources:
    - {title: "Metropolitan Museum of Art: The Calling of Saint Matthew (loan record)", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/846784", quote: "Date: 1661 Medium: Oil on canvas Dimensions: 88 9/16 in. × 10 ft. 7 15/16 in. (225 × 325 cm) ... Credit Line: Museo Nacional del Prado, Madrid"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "Juan de Pareja, The Calling of Saint Matthew , 1661, oil on canvas, 225 x 325 cm (Museo Nacional del Prado, Madrid)"}
- card: pareja-calling-of-matthew
  fact: "Pareja painted himself at the far left, looking at the viewer"
  sources:
    - {title: "Metropolitan Museum of Art: press release, Juan de Pareja (2023)", url: "https://web.archive.org/web/2023/https://www.metmuseum.org/press/exhibitions/2023/juan-de-pareja", quote: "which includes a self-portrait on the far left"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "He is the only one who connects directly with the viewer ... The man who connects directly with the viewer is a self-portrait of the artist, Juan de Pareja"}
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "Juan de Pareja represented himself (far left) in his own large painting of Calling of Saint Matthew (1661)"}
- card: pareja-calling-of-matthew
  fact: "His self-portrait repeats the pose and attire of Velázquez's portrait of him"
  sources:
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "his full-length self portrait 11 years later in The Calling of Saint Matthew (1661), in a similar pose and attire"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "it is clear that Pareja follows Velázquez’s template of depicting the Afro-Hispanic man as a Spanish gentleman"}
- card: pareja-calling-of-matthew
  fact: "He holds a slip of paper with his name and the year 1661"
  sources:
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "In his hand, he holds a piece of paper which contains his signature, “Juan de Pareja made this,” and the date of the painting"}
    - {title: "Robert Fikes, BlackPast: Juan de Pareja (ca. 1606-1670)", url: "https://www.Blackpast.org/gah/pareja-juan-de-1606-1670", quote: "holding a slip of paper that reads “Juan de Pareja in the year 1661.”"}
- card: pareja-calling-of-matthew
  fact: "His face in the self-portrait is lighter than in Velázquez's portrait"
  sources:
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "Pareja’s skin appears much lighter in his own work"}
    - {title: "Borja Franco Llopis, Archivo Español de Arte 96 (2023)", url: "https://doi.org/10.3989/aearte.2023.46", quote: "con el rostro más blanquecino con el que el propio Pareja se autorretrata en la Vocación de San Mateo (1661"}
- card: pareja-calling-of-matthew
  fact: "Pareja died in Madrid in 1670"
  sources:
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "He then worked as a painter until he died in Madrid in 1670"}
    - {title: "Metropolitan Museum of Art: The Calling of Saint Matthew (loan record)", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/art/collection/search/846784", quote: "Juan de Pareja (Spanish, Antequera 1606–1670 Madrid)"}
    - {title: "Robert Fikes, BlackPast: Juan de Pareja (ca. 1606-1670)", url: "https://www.Blackpast.org/gah/pareja-juan-de-1606-1670", quote: "Juan de Pareja died in Madrid in 1670"}
- card: pareja-calling-of-matthew
  fact: "He was long known mostly as the subject of Velázquez's portrait"
  sources:
    - {title: "Metropolitan Museum of Art: Juan de Pareja, Afro-Hispanic Painter (exhibition)", url: "https://web.archive.org/web/2024/https://www.metmuseum.org/exhibitions/juan-de-pareja", quote: "Largely known today as the subject of The Met’s iconic portrait by Diego"}
    - {title: "Smarthistory: Juan de Pareja, The Calling of Saint Matthew", url: "https://web.archive.org/web/2024/https://smarthistory.org/juan-de-pareja-the-calling-of-st-matthew/", quote: "Ironically, this artist is known mostly through a portrait of him by the great Spanish painter, Diego Velázquez"}
- card: pareja-calling-of-matthew
  fact: "In 2023 the Met held his first exhibition, with the Saint Matthew lent from the Prado"
  sources:
    - {title: "Karen Chernick, The Art Newspaper (2023)", url: "https://www.theartnewspaper.com/2023/03/29/juan-de-pareja-from-slave-to-old-master", quote: "The first institutional exhibition devoted to him, Juan de Pareja: Afro-Hispanic Painter ... At an impressive 11ft-wide, this ambitious multi-figure painting loaned from Madrid’s Museo Nacional del Prado"}
    - {title: "Metropolitan Museum of Art: press release, Juan de Pareja (2023)", url: "https://web.archive.org/web/2023/https://www.metmuseum.org/press/exhibitions/2023/juan-de-pareja", quote: "First Major Exhibition on Afro-Hispanic Painter Juan de Pareja ... On display are The Calling of Saint Matthew (Museo Nacional del Prado)"}
    - {title: "Borja Franco Llopis, Archivo Español de Arte 96 (2023)", url: "https://doi.org/10.3989/aearte.2023.46", quote: "Nueva York: Metropolitan Museum of New York, 3-IV-2023 a 16-VII-2023"}
- card: banjo-lesson
  fact: "Tanner was born in Pittsburgh in 1859"
  sources:
    - {title: "Smithsonian American Art Museum: Henry Ossawa Tanner", url: "https://americanart.si.edu/artist/henry-ossawa-tanner-4742", quote: "Tanner was born on June 21, 1859, in Pittsburgh, Pennsylvania"}
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "born in Pittsburgh, Pennsylvania on June 21, 1859"}
- card: banjo-lesson
  fact: "He was the son of a prominent churchman"
  sources:
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "was the son of a prominent cleric"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "Surely the example of the artist's own father, Bishop Tanner, an effective leader for the cause of social justice"}
- card: banjo-lesson
  fact: "He grew up in Philadelphia and studied under Thomas Eakins there"
  sources:
    - {title: "Britannica: Henry Ossawa Tanner", url: "https://www.britannica.com/biography/Henry-Ossawa-Tanner", quote: "After a childhood spent largely in Philadelphia ... In 1880 Tanner began two years of formal study under Thomas Eakins at Philadelphia’s prestigious Pennsylvania Academy of the Fine Arts"}
    - {title: "Smithsonian American Art Museum: Henry Ossawa Tanner", url: "https://americanart.si.edu/artist/henry-ossawa-tanner-4742", quote: "There he studied with a group of master professors including Thomas Eakins"}
- card: banjo-lesson
  fact: "In 1891 he went to Paris and enrolled at the Académie Julian"
  sources:
    - {title: "Britannica: Henry Ossawa Tanner", url: "https://www.britannica.com/biography/Henry-Ossawa-Tanner", quote: "Tanner traveled to Paris in 1891 to enroll at the Académie Julian"}
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "in 1891 when, with the assistance of two benefactors, he set off for Paris, France and enrolled in the Académie Julian"}
- card: banjo-lesson
  fact: "In 1893, in poor health, he returned to Philadelphia"
  sources:
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "Tanner left Paris in 1893, once again suffering from ill health ... The artist's turn to African-American subject matter upon his return to Philadelphia"}
    - {title: "Britannica: Henry Ossawa Tanner", url: "https://www.britannica.com/biography/Henry-Ossawa-Tanner", quote: "He returned to the United States in 1893"}
- card: banjo-lesson
  fact: "Popular images of the Black banjo player showed a carefree, comic stereotype ('mostly drawn by white artists' dropped: the NHC statement is about its own sample of seven images)"
  sources:
    - {title: "National Humanities Center: The \"Negro banjo player\", images from the 19th century", url: "https://nationalhumanitiescenter.org/pds/maai2/identity/text4/text4read.htm", quote: "seven images of the \"Negro banjo player,\" most depicting the common stereotype of a benign carefree black man engaged in trivial leisure. The first six images were created by white men"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "being back in a country where stereotypical images of African-Americans went unanswered"}
- card: banjo-lesson
  fact: "The Banjo Lesson (1893) shows an elderly man teaching a boy to play the banjo"
  sources:
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "The Banjo Lesson , one of his best known works, which featured an elderly black man instructing a boy to play the banjo"}
    - {title: "Smithsonian American Art Museum: Henry Ossawa Tanner", url: "https://americanart.si.edu/artist/henry-ossawa-tanner-4742", quote: "two of his most important works depicting African-American subjects, The Banjo Lesson of 1893"}
- card: banjo-lesson
  fact: "The painting treats its subject with dignity rather than as a joke"
  sources:
    - {title: "National Humanities Center: The \"Negro banjo player\", images from the 19th century", url: "https://nationalhumanitiescenter.org/pds/maai2/identity/text4/text4read.htm", quote: "How does Henry Ossawa Tanner return dignity and identity to this image in his 1893 painting The Banjo Lesson ?"}
    - {title: "Hampton University Museum: collections", url: "https://web.archive.org/web/2023id_/https://home.hamptonu.edu/msm/", quote: "It reflects Tanner’s conscious commitment to depicting African American in a compassionate manner"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "Tanner's dignified and sympathetic treatment of the teaching and tradition depicted in the Banjo Lesson"}
- card: banjo-lesson
  fact: "In 1894 it was accepted at the Paris Salon, the most prestigious juried exhibition"
  sources:
    - {title: "Hampton University Museum: collections", url: "https://web.archive.org/web/2023id_/https://home.hamptonu.edu/msm/", quote: "In 1894, The Banjo Lesson was admitted into the Paris Salon, the most prestigious annual juried exhibition in the city"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "the French Salon, to which The Banjo Lesson was accepted in 1894"}
- card: banjo-lesson
  fact: "In 1894 it went to the Hampton Institute, whose museum still owns it"
  sources:
    - {title: "Hampton University Museum: collections", url: "https://web.archive.org/web/2023id_/https://home.hamptonu.edu/msm/", quote: "bought the painting and donated it to Hampton in November of 1894"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "A plan is now afoot to present the “Bagpipe Lesson” to Hampton Institute"}
- card: banjo-lesson
  fact: "Tanner returned to France, won international fame with religious paintings and never returned to American subjects"
  sources:
    - {title: "Smithsonian American Art Museum: Henry Ossawa Tanner", url: "https://americanart.si.edu/artist/henry-ossawa-tanner-4742", quote: "Working in France after 1891, Henry Ossawa Tanner achieved an international reputation largely through his religious paintings"}
    - {title: "Will South, Henry Ossawa Tanner: Painter of the Spirit (Weatherspoon Art Museum, 2006)", url: "https://web.archive.org/web/20070126135743/http://weatherspoon.uncg.edu/uploads/TannerArticle.pdf", quote: "Though Tanner never returned to American subject matter"}
- card: banjo-lesson
  fact: "He died in Paris in 1937"
  sources:
    - {title: "Smithsonian American Art Museum: Henry Ossawa Tanner", url: "https://americanart.si.edu/artist/henry-ossawa-tanner-4742", quote: "born Pittsburgh, PA 1859-died Paris, France 1937"}
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "Henry Ossawa Tanner died in Paris on May 25, 1937"}
- card: banjo-lesson
  fact: "The Banjo Lesson is his best-known painting"
  sources:
    - {title: "Hampton University Museum: collections", url: "https://web.archive.org/web/2023id_/https://home.hamptonu.edu/msm/", quote: "The Banjo Lesson is Tanner’s most famous painting"}
    - {title: "Robert Fikes, BlackPast: Henry Ossawa Tanner (1859-1937)", url: "https://www.blackpast.org/african-american-history/tanner-henry-ossawa-1859-1937/", quote: "The Banjo Lesson , one of his best known works"}
- card: powers-bible-quilt
  fact: "Harriet Powers was born into slavery near Athens, Georgia, on 29 October 1837"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "Harriet Powers was born a slave near Athens, Georgia, on October 29, 1837"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "Powers was born into slavery near Athens on October 29, 1837"}
- card: powers-bible-quilt
  fact: "After the Civil War she and her husband owned a small farm in Clarke County"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "Some time after the Civil War, they became landowners ... a negro woman, who lives in the country on a little farm whereon she and husband make a respectable living"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "lived more than half her life in Clarke County , mainly in Sandy Creek and Buck Branch"}
- card: powers-bible-quilt
  fact: "Her quilts were pictorial, made with appliqué"
  sources:
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "Powers’s quilts are remarkable for their bold use of applique for storytelling"}
    - {title: "Museum of Fine Arts, Boston: Harriet Powers, Pictorial quilt (64.619)", url: "https://collections.mfa.org/objects/116166", quote: "Cotton plain weave, pieced, appliqued, embroidered, and quilted"}
- card: powers-bible-quilt
  fact: "Around 1886 she finished a quilt of Bible scenes from Adam and Eve to the Crucifixion"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "Briefly, the subjects are Adam and Eve in the Garden of Eden ... the crucifixion"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "Harriet Powers finished her Bible Quilt around 1886 in Athens"}
- card: powers-bible-quilt
  fact: "She showed it at a cotton fair in Athens in 1886, where the artist Jennie Smith saw it"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "She exhibited it at the Athens Cotton Fair of 1886 where it captured the imagination of Jennie Smith, a young internationally-trained local artist"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "The first of the Powers quilts was displayed in 1886 at a cotton fair in Athens, where Jennie Smith, an artist and art teacher at the Lucy Cobb Institute"}
- card: powers-bible-quilt
  fact: "Powers at first refused to sell"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "I offered to buy it, but it was not for sale at any price."}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "Smith remained in touch with Powers, however, and five years later Powers, having financial difficulties, agreed to sell"}
- card: powers-bible-quilt
  fact: "In hard times she sold it for five dollars"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "Mrs. Powers, at the urging of her husband because of hard times, offered to sell the quilt ... She offered it for ten dollars--but--I only had five to give"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "Powers, having financial difficulties, agreed to sell the quilt for five dollars"}
- card: powers-bible-quilt
  fact: "Before parting with it she explained every scene and Smith recorded her words"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "but only after explaining each of the eleven panels of the design, which Jennie Smith recorded"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "At the time of the sale Powers explained the imagery in the squares, and Smith recorded the descriptions"}
- card: powers-bible-quilt
  fact: "Her second quilt, of the 1890s, sets Bible stories beside remembered events, among them the falling of the stars on 13 November 1833, when people thought the end had come (the 1780 dark day and the 1895 frost dropped: only the MFA record gives them)"
  sources:
    - {title: "Museum of Fine Arts, Boston: Harriet Powers, Pictorial quilt (64.619)", url: "https://collections.mfa.org/objects/116166", quote: "8. The falling of the stars on Nov. 13, 1833. The people were frightened and thought that the end had come"}
    - {title: "National Geographic: This Black artist's vibrant quilts inspired generations of U.S. artisans", url: "https://www.nationalgeographic.com/history/history-magazine/article/black-artist-woman-art-quilts-harriet-powers", quote: "The square, Powers wrote, shows “[t]he falling of the stars on November 13, 1833. The people were fright and thought that the end had come"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "The cotton quilts consist of numerous pictorial squares depicting biblical scenes and celestial phenomena"}
- card: powers-bible-quilt
  fact: "In 1898 the wives of Atlanta University faculty gave it to Charles Cuthbert Hall, chairman of the university's trustees"
  sources:
    - {title: "Museum of Fine Arts, Boston: Harriet Powers, Pictorial quilt (64.619)", url: "https://collections.mfa.org/objects/116166", quote: "Reverend Charles Cuthbert Hall received this quilt as a gift from a group of “faculty ladies” at Atlanta University in 1898"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "the faculty wives presented the quilt to the Reverend Charles Cuthbert Hall of New York in 1898, while he was serving as the chairman of the board of trustees at Atlanta University"}
- card: powers-bible-quilt
  fact: "Powers died on 1 January 1910; the date was found recently on her gravestone in Athens"
  sources:
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "The date of Harriet's death, Jan. 1, 1910, was recently discovered on her gravestone in Athen's Gospel Pilgrim Cemetery"}
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "The headstone, which was uncovered at the historic Gospel Pilgrim Cemetery in Athens, reveals that Powers died on January 1, 1910"}
- card: powers-bible-quilt
  fact: "The first quilt is in the Smithsonian's National Museum of American History, the second in the Museum of Fine Arts, Boston"
  sources:
    - {title: "Ashley Callahan, New Georgia Encyclopedia: Harriet Powers (1837-1910)", url: "https://www.georgiaencyclopedia.org/articles/arts-culture/harriet-powers-1837-1910/", quote: "One is part of the National Museum of American History collection at the Smithsonian Institution ... The second quilt is in the Museum of Fine Arts in Boston"}
    - {title: "Museum of Fine Arts, Boston: Harriet Powers, Pictorial quilt (64.619)", url: "https://collections.mfa.org/objects/116166", quote: "Bequest of Maxim Karolik Accession Number 64.619"}
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "Harriet Powers's Bible Quilt | National Museum of American History"}
- card: powers-bible-quilt
  fact: "For both quilts Powers's own explanations of the scenes survive"
  sources:
    - {title: "Museum of Fine Arts, Boston: Harriet Powers, Pictorial quilt (64.619)", url: "https://collections.mfa.org/objects/116166", quote: "This quilt (together with Powers's descriptions and small portrait photograph) was presented ... The following are Powers' descriptions of all fifteen blocks"}
    - {title: "National Museum of American History: Harriet Powers's Bible Quilt", url: "https://americanhistory.si.edu/collections/nmah_556462", quote: "explaining each of the eleven panels of the design, which Jennie Smith recorded"}
- card: swing-low
  fact: "Swing Low, Sweet Chariot is an African American spiritual"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "the popular African American spiritual “Swing Low, Sweet Chariot”"}
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "Composers of spirituals, “Uncle Wallace” and “Aunt Minerva” Willis were enslaved"}
- card: swing-low
  fact: "The most cited account traces it to Wallace Willis in Indian Territory (Oklahoma) in the mid-nineteenth century"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "One often cited source is Wallis Willis (known as “Uncle Wallace”), a Choctaw freedman in the old Indian Territory in what is now Choctaw County, in Oklahoma"}
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "were enslaved in the old Choctaw Nation area of Oklahoma during the mid-nineteenth century"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "thought up the words and music of Sweet Chariot in the mid-1800s while working at a school for Native American boys in Oklahoma's Indian Territory"}
- card: swing-low
  fact: "Wallace and Minerva Willis were enslaved by Britt Willis, a Choctaw, who hired them out to Spencer Academy, a Choctaw boys' school"
  sources:
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "A Choctaw named Britt Willis owned them ... Willis hired them periodically to Spencer Academy, a Choctaw boys’ school"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "Brit Willis rented the couple out to Spencer Academy for Choctaw boys near Doaksville"}
- card: swing-low
  fact: "In the evenings they sang their own songs to the students"
  sources:
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "Minerva would sing along with him when they were asked to perform the songs for the students in the evenings"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "where the Willises entertained students by singing Sweet Chariot and other original Willis spirituals"}
- card: swing-low
  fact: "Superintendent Alexander Reid passed the songs to the Fisk Jubilee Singers"
  sources:
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "Alexander Reid came to the academy as the superintendent ... Reid gave six songs to the group, including “Swing Low, Sweet Chariot,”"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "The song so moved the headmaster that he sent it to the Fisk Jubilee Singers in Nashville"}
- card: swing-low
  fact: "In 1871 the Fisk Jubilee Singers began a fund-raising tour for their university"
  sources:
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "In 1871 the Jubilee Singers of Fisk University began a fund-raising tour for education work among the freedmen"}
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "the original Fisk Jubilee Singers, who toured in the interest of the university from 1871-1878"}
- card: swing-low
  fact: "Reid heard the Jubilee Singers at a concert in New Jersey, wrote down the Willis songs and passed them on ('no musical training' dropped: one source only)"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "he noted it down and shared it, along with several other spirituals, with the Jubilee Singers when he heard them at a concert in New Jersey"}
    - {title: "Encyclopedia of Oklahoma History and Culture: Willis, Uncle Wallace and Aunt Minerva", url: "https://www.okhistory.org/publications/enc/entry?entry=WI018", quote: "Reid had no musical education and therefore resorted to writing down the words and singing the songs over and over to the eleven members of the group until the music was firmly fixed in memory"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "The song so moved the headmaster that he sent it to the Fisk Jubilee Singers in Nashville"}
- card: swing-low
  fact: "The Jubilee Singers made the song famous"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "it came to popular attention by finding itself part of the repertoire of The Fisk Jubilee Singers in the 1870s"}
    - {title: "History News Network: Historian discovers he is descended from the slave couple that wrote Swing Low", url: "https://www.historynewsnetwork.org/article/29245", quote: "When the Fisk singers took Sweet Chariot on tour, Queen Victoria was visibly impressed, Burge says, which fueled the song's popularity"}
- card: swing-low
  fact: "It became the song of English rugby; on 19 March 1988 Twickenham sang it after Chris Oti's hat-trick against Ireland"
  sources:
    - {title: "World Rugby Museum: Swing Low Uncovered (2020)", url: "https://worldrugbymuseum.com/from-the-vaults/twickenham-stadium/swing-low-uncovered", quote: "England had lost five out of six games at Twickenham prior to Oti suddenly helping them to victory against Ireland on 19th March 1988 ... The story goes that, inspired by a hat-trick of tries from wing Chris Oti, the Twickenham crowd spontaneously broke into song"}
    - {title: "Johnny Watterson, The Irish Times (2015)", url: "https://www.irishtimes.com/sport/other-sports/never-dull-between-england-and-ireland-1.2120265", quote: "He scored the first hat-trick in the championship at Twickenham since 1924, his performance prompting an unlikely chorus of 'Swing Low, Sweet Chariot' from a section of fans"}
    - {title: "RTÉ Sport (2020)", url: "https://rte.ie/sport/rugby/2020/0618/1148305-england-fans-singing-of-swing-low-under-review-by-rfu", quote: "It became popular with England fans the following year when Chris Oti, another black player, scored a hat-trick against Ireland at Twickenham"}
- card: swing-low
  fact: "In June 2020, amid Black Lives Matter protests, the RFU began a review of the song, saying many fans were unaware of its origins"
  sources:
    - {title: "Gerard Meagher, The Irish Times (2020)", url: "https://www.irishtimes.com/sport/rugby/international/england-fans-may-be-urged-to-stop-singing-swing-low-due-to-slavery-link-1.4282495", quote: "The English Rugby Football Union is conducting a review into the use of Swing Low, Sweet Chariot by England supporters, admitting that many of them are unaware of its origins as a song about slavery"}
    - {title: "RTÉ Sport (2020)", url: "https://rte.ie/sport/rugby/2020/0618/1148305-england-fans-singing-of-swing-low-under-review-by-rfu", quote: "The Swing Low, Sweet Chariot song has long been part of the culture of rugby and is sung by many who have no awareness of its origins or sensitivities ... the recent Black Lives Matter protests"}
- card: swing-low
  fact: "(dispute) Some date the song's Twickenham debut to the 1987 Middlesex Sevens"
  sources:
    - {title: "World Rugby Museum: Swing Low Uncovered (2020)", url: "https://worldrugbymuseum.com/from-the-vaults/twickenham-stadium/swing-low-uncovered", quote: "'Swing Low, Sweet Chariot' debuted at Twickenham, not in March 1988 after all, but in the previous summer of 1987 at the Middlesex Sevens tournament"}
    - {title: "RTÉ Sport (2020)", url: "https://rte.ie/sport/rugby/2020/0618/1148305-england-fans-singing-of-swing-low-under-review-by-rfu", quote: "'Swing Low' is first believed to have been sung at Twickenham when Martin 'Chariots' Offiah ... was playing in the 1987 Middlesex Sevens tournament"}
- card: swing-low
  fact: "(dispute) Another tradition ties the chorus to the rescue of Ella Sheppard and her enslaved mother (John Wesley Work's name dropped: one source only)"
  sources:
    - {title: "Public Domain Review: First recording of Swing Low, Sweet Chariot (1909)", url: "https://publicdomainreview.org/collections/first-recording-of-swing-low-sweet-chariot-1909/", quote: "John W. Work claimed that the spiritual “burst forth” from the anguished soul of Sarah Hannah Sheppard, the mother of Ella Sheppard of Fisk Jubilee Singer fame"}
    - {title: "PBS American Experience: Ella Sheppard", url: "https://www.pbs.org/wgbh/americanexperience/features/singers-sheppard", quote: "The chorus of \"Swing Low, Sweet Chariot\" -- a song Ella would later teach the Jubilee Singers -- has been attributed to the words of an elder that came to her rescue"}
- card: lift-every-voice
  fact: "In 1900 James Weldon Johnson was principal of the segregated Stanton School in Jacksonville ('which he had attended himself' dropped: one source only)"
  sources:
    - {title: "Composers Datebook (YourClassical): The Brothers Johnson write an anthem", url: "https://www.yourclassical.org/episode/2011/02/12/the-brothers-johnson-write-an-anthem", quote: "Stanton was a segregated school for African-American children, and was the school that its principal, James Weldon Johnson, had himself attended"}
    - {title: "NAACP: Lift Every Voice and Sing", url: "https://www.naacp.org/naacp-history-lift-evry-voice-and-sing/", quote: "A choir of 500 schoolchildren at the segregated Stanton School, where James Weldon Johnson was principal"}
- card: lift-every-voice
  fact: "He was asked to contribute to the school's celebration of Lincoln's birthday, 12 February"
  sources:
    - {title: "Composers Datebook (YourClassical): The Brothers Johnson write an anthem", url: "https://www.yourclassical.org/episode/2011/02/12/the-brothers-johnson-write-an-anthem", quote: "the principal of Stanton Elementary in Jacksonville, Florida was asked to give a Lincoln's Day speech to his students"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing' (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing/", quote: "Johnson had been approached by a group of young men organizing a celebration for Abraham Lincoln’s birthday ... to be held on February 12, 1900 at Stanton"}
- card: lift-every-voice
  fact: "James Weldon Johnson wrote the poem and his brother John Rosamond Johnson, composer and pianist, set it to music"
  sources:
    - {title: "NAACP: Lift Every Voice and Sing", url: "https://www.naacp.org/naacp-history-lift-evry-voice-and-sing/", quote: "a hymn written as a poem by NAACP leader James Weldon Johnson in 1900. His brother, John Rosamond Johnson (1873-1954), composed the music for the lyrics"}
    - {title: "Composers Datebook (YourClassical): The Brothers Johnson write an anthem", url: "https://www.yourclassical.org/episode/2011/02/12/the-brothers-johnson-write-an-anthem", quote: "enlisted the aid of his brother, John Rosamond Johnson, who was a composer"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing' (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing/", quote: "his brother, pianist John Rosamond Johnson"}
- card: lift-every-voice
  fact: "On 12 February 1900 a chorus of 500 schoolchildren sang it for the first time"
  sources:
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing' (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing/", quote: "On February 12, 1900, James Weldon Johnson's song 'Lift Ev'ry Voice and Sing' was sung for the first time by a choir of Jacksonville children"}
    - {title: "NPR: Lift Every Voice and Sing, the story behind the Black national anthem (2018)", url: "https://www.npr.org/2018/08/16/638324920/lift-every-voice-and-sing-the-story-behind-the-black-national-anthem", quote: "was first performed in 1900, at a segregated school in Jacksonville, Fla. , by a group of 500 children celebrating the anniversary of the birth of President Lincoln"}
    - {title: "NAACP: Lift Every Voice and Sing", url: "https://www.naacp.org/naacp-history-lift-evry-voice-and-sing/", quote: "A choir of 500 schoolchildren"}
- card: lift-every-voice
  fact: "The verses move from rejoicing in liberty to the memory of suffering ('Stony the road we trod') and on to the road ahead"
  sources:
    - {title: "NAACP: Lift Every Voice and Sing", url: "https://www.naacp.org/naacp-history-lift-evry-voice-and-sing/", quote: "Ring with the harmonies of Liberty ... Stony the road we trod, Bitter the chastening rod"}
    - {title: "NPR: Lift Every Voice and Sing, the story behind the Black national anthem (2018)", url: "https://www.npr.org/2018/08/16/638324920/lift-every-voice-and-sing-the-story-behind-the-black-national-anthem", quote: "The second verse reminds us to never forget the suffering and obstacles of the past: Stony the road we trod ... The third and final stanza is about the challenges of the future"}
- card: lift-every-voice
  fact: "Johnson more or less forgot the song, but the children kept singing it"
  sources:
    - {title: "Composers Datebook (YourClassical): The Brothers Johnson write an anthem", url: "https://www.yourclassical.org/episode/2011/02/12/the-brothers-johnson-write-an-anthem", quote: "The song was a great success on February 12th, 1900, and then was pretty much forgotten by Johnson—but not by the children who sang it"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing' (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing/", quote: "But as Johnson was later pleasantly surprised to learn, for the children of the choir, the song proved unforgettable"}
- card: lift-every-voice
  fact: "It spread through Black churches and schools across the South and beyond"
  sources:
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing', page 2 (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing-page-2", quote: "“Lift Ev’ry Voice and Sing” became popular in black churches, schools, and celebrations across the South and beyond"}
    - {title: "Composers Datebook (YourClassical): The Brothers Johnson write an anthem", url: "https://www.yourclassical.org/episode/2011/02/12/the-brothers-johnson-write-an-anthem", quote: "The song spread across the country, and soon became the unofficial National Anthem of Black America"}
- card: lift-every-voice
  fact: "In 1905 Booker T. Washington endorsed it and in 1919 the NAACP adopted it as its official song"
  sources:
    - {title: "NPR: Lift Every Voice and Sing, the story behind the Black national anthem (2018)", url: "https://www.npr.org/2018/08/16/638324920/lift-every-voice-and-sing-the-story-behind-the-black-national-anthem", quote: "In 1905, Booker T. Washington endorsed it, and in 1919, it became the official song of the NAACP"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing', page 2 (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing-page-2", quote: "Washington endorsed the song, and in 1919, the NAACP adopted it as the organization’s official song"}
- card: lift-every-voice
  fact: "It came to be called the Negro National Anthem"
  sources:
    - {title: "NPR: Lift Every Voice and Sing, the story behind the Black national anthem (2018)", url: "https://www.npr.org/2018/08/16/638324920/lift-every-voice-and-sing-the-story-behind-the-black-national-anthem", quote: "Two key events led to its being named the Negro National Anthem"}
    - {title: "Encyclopedia of Black Studies (SAGE): Lift Every Voice and Sing", url: "https://sk.sagepub.com/ency/edvol/embed/blackstudies/chpt/lift-every-voice-sing", quote: "This song became known as the “Negro National Anthem.”"}
- card: lift-every-voice
  fact: "It was a rallying song of the civil rights movement of the 1950s and 1960s"
  sources:
    - {title: "NAACP: Lift Every Voice and Sing", url: "https://www.naacp.org/naacp-history-lift-evry-voice-and-sing/", quote: "prominently used as a rallying cry during the Civil Rights Movement of the 1950s and 1960s"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing', page 2 (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing-page-2", quote: "The song found renewed popularity during the Civil Rights Movement of the 1950s and ’60s"}
- card: lift-every-voice
  fact: "In 2009 Joseph Lowery quoted it in his benediction at Barack Obama's inauguration"
  sources:
    - {title: "NPR: Lift Every Voice and Sing, the story behind the Black national anthem (2018)", url: "https://www.npr.org/2018/08/16/638324920/lift-every-voice-and-sing-the-story-behind-the-black-national-anthem", quote: "Joseph Lowery gave the benediction at President Barack Obama's first inauguration, and began by quoting the song's third verse nearly verbatim"}
    - {title: "Bill Delaney, The Jaxson: The history of 'Lift Ev'ry Voice and Sing', page 2 (2024)", url: "https://www.thejaxsonmag.com/article/the-history-of-lift-evry-voice-and-sing-page-2", quote: "in 2008, Reverend Joseph Lowery recited some of the lines in his benediction at President Barack Obama’s inauguration"}
- card: afro-turks
  fact: "In the nineteenth century enslaved Africans were brought to the Ottoman Empire"
  sources:
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "The Afro-Turks, whose ancestors came to the Ottoman Empire as slaves in the nineteenth century"}
    - {title: "Ayla Jean Yackley, Al-Monitor (2020)", url: "https://web.archive.org/web/20210801135824/https://www.al-monitor.com/originals/2020/06/turkey-united-states-afro-turks-join-outcry-george-floyd.html", quote: "many of them descendants of slaves brought to the Ottoman Empire"}
- card: afro-turks
  fact: "Many worked on cotton and tobacco farms around İzmir"
  sources:
    - {title: "Ayla Jean Yackley, Al-Monitor (2020)", url: "https://web.archive.org/web/20210801135824/https://www.al-monitor.com/originals/2020/06/turkey-united-states-afro-turks-join-outcry-george-floyd.html", quote: "forebears who labored in Aegean cotton and tobacco fields in the 1800s"}
    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "where many slave families were sent to work on the cotton fields near the port of old Smyrna (modern day Izmir)"}
- card: afro-turks
  fact: "Freed people were settled in villages near İzmir and in Aydın province, a few of which are still largely Black"
  sources:
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "As a result, for many years there were homogenous \"African\" villages in Aydin"}
    - {title: "Ayla Jean Yackley, Al-Monitor (2020)", url: "https://web.archive.org/web/20210801135824/https://www.al-monitor.com/originals/2020/06/turkey-united-states-afro-turks-join-outcry-george-floyd.html", quote: "the authorities intercepted captives at Izmir’s ports and settled them as immigrants in villages, a handful of which remain majority-Black"}
- card: afro-turks
