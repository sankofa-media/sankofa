    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "Afro Turks are referred to in apparently friendly social circles as “Arab”, a term which has been traditionally used in Turkey for anyone dark enough to be either Arab or African"}
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "her family suddenly announced, \"The Arab isn't going to get any o"}
- card: afro-turks
  fact: "Each spring they held the Calf Festival (Dana Bayramı), kept since the nineteenth century in and around İzmir"
  sources:
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "The Sixth Spring Festival is really the Sixth Festival of the Calf, the traditional celebration of the Afro-Turks, which they've been celebrating since the nineteenth century in and around Izmir"}
    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "the Calf Festival (Dana Bayramı), an Afro Turk festival ... Originally this was an annual tradition ... among the African slave community during the days of the Ottoman Empire"}
- card: afro-turks
  fact: "The festival stopped: banned in 1924 by one account, died out in the 1960s by another"
  sources:
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "In 1924, the Turkish republic banned the celebration"}
    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "In the 1960s the practice died out"}
- card: afro-turks
  fact: "Mustafa Olpak's family came from Kenya by way of Crete"
  sources:
    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "Mustafa Olpak, a 61-year-old local Afro-Turk who managed to trace his heritage to Kenya, via Crete"}
    - {title: "Ayla Jean Yackley, Al-Monitor (2020)", url: "https://web.archive.org/web/20210801135824/https://www.al-monitor.com/originals/2020/06/turkey-united-states-afro-turks-join-outcry-george-floyd.html", quote: "writing a 2005 memoir that explored his family’s passage from Kenya to Greece and on to Turkey"}
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "His family came to Turkey from Crete in 1924 as part of an exchange of populations"}
- card: afro-turks
  fact: "He wrote a memoir in 2005 that opens: 'The first generation lives it, the second denies it, the third researches it'"
  sources:
    - {title: "renk. Magazin: Afrotürken – Im toten Winkel der Geschichte", url: "https://renk-magazin.de/afrotuerken-im-toten-winkel-der-geschichte/", quote: "Olpak veröffentliche 2005 mit „Kenya-Girit-İstanbul: Köle Kıyısından İnsan Biyografileri“ ... Olpaks Buch beginnt mit den Worten: „Birinci kuşak yaşar, İkinci kuşak reddeder, Üçüncü kuşak araştırır… Ben Mustafa Olpak.“"}
    - {title: "Ekrem Eddy Güzeldere, Qantara.de: The fate of the Afro-Turks, nothing left but the colour", url: "https://web.archive.org/web/2016/http://en.qantara.de/Nothing-Left-But-the-Colour/19701c20987i0p9/index.html", quote: "In Olpak's autobiography, he wrote, \"The first generation has the experiences, the second generation denies them, and the third generation researches into them.\""}
    - {title: "Ayla Jean Yackley, Al-Monitor (2020)", url: "https://web.archive.org/web/20210801135824/https://www.al-monitor.com/originals/2020/06/turkey-united-states-afro-turks-join-outcry-george-floyd.html", quote: "writing a 2005 memoir"}
- card: afro-turks
