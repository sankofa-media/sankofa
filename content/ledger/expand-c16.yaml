    - {title: "Dom Phillips, The Guardian (18 March 2018)", url: "https://www.theguardian.com/world/2018/mar/18/marielle-franco-brazil-favelas-mourn-death-champion", quote: "the murder of black, gay Rio councillor Marielle Franco"}
    - {title: "The Intercept (2018)", url: "https://theintercept.com/2018/03/19/just-as-u-s-media-does-with-mlk-brazils-media-now-trying-to-whitewash-and-exploit-marielle-francos-political-radicalism/", quote: "A black, leftist lesbian from the sprawling Maré favela"}
    - {title: "Vogue (2018), archived", url: "https://web.archive.org/web/20180408095951/https://www.vogue.com/article/marielle-franco-protested-police-violence-assassination", quote: "who reportedly identified as part of the LGBT community"}
- card: marielle-franco
  fact: "She spoke for women, single mothers, LGBT people and favela residents"
  sources:
    - {title: "Dom Phillips, The Guardian (18 March 2018)", url: "https://www.theguardian.com/world/2018/mar/18/marielle-franco-brazil-favelas-mourn-death-champion", quote: "Franco fought for the rights of women, single mothers like herself, gay people and favela residents"}
    - {title: "Los Angeles Times (2018)", url: "https://www.latimes.com/world/la-fg-brazil-marielle-franco-20180315-story.html", quote: "she defended the city’s marginalized communities, stood up for human rights"}
- card: marielle-franco
  fact: "In February 2018 she became rapporteur of a commission monitoring the federal intervention in Rio's public security"
  sources:
    - {title: "Amnesty International (2018)", url: "https://www.amnesty.org/en/latest/news/2018/03/brazil-authorities-must-investigate-the-killing-of-human-rights-defender-marielle-franco/", quote: "Two weeks ago, she was appointed rapporteur for a special commission that the city council created to monitor the ongoing federal intervention in Rio de Janeiro and the militarization of public security"}
    - {title: "Los Angeles Times (2018)", url: "https://www.latimes.com/world/la-fg-brazil-marielle-franco-20180315-story.html", quote: "Last month, Franco was named rapporteur of a special commission that was to serve as a watchdog over a controversial federal intervention in Rio’s public security"}
- card: marielle-franco
  fact: "On the night of 14 March 2018 she and her driver Anderson Gomes were shot dead in their car"
  sources:
    - {title: "Julia Carneiro, BBC News (2018)", url: "https://www.bbc.com/news/world-latin-america-43484449", quote: "On 14 March, Ms Franco was being driven home from an event promoting black empowerment when a car pulled alongside hers and shots were fired ... her driver, Anderson Gomes, was also killed"}
    - {title: "Al Jazeera (Reuters/AP, 2026)", url: "https://www.aljazeera.com/news/2026/2/26/brazils-supreme-court-imposes-steep-sentences-for-marielle-franco-murder", quote: "On March 14, 2018, after an evening debate in Rio de Janeiro, a car pulled alongside the vehicle carrying Franco and Gomes"}
- card: marielle-franco
  fact: "Tens of thousands marched across Brazil chanting 'Marielle presente!'"
  sources:
    - {title: "Dom Phillips, The Guardian (18 March 2018)", url: "https://www.theguardian.com/world/2018/mar/18/marielle-franco-brazil-favelas-mourn-death-champion", quote: "tens of thousands of people thronged streets across Brazil to express their anger"}
    - {title: "Julia Carneiro, BBC News (2018)", url: "https://www.bbc.com/news/world-latin-america-43484449", quote: "crowds took to the streets in the city centre shouting \"Marielle presente!\" (Marielle is here!)"}
    - {title: "Los Angeles Times (2018)", url: "https://www.latimes.com/world/la-fg-brazil-marielle-franco-20180315-story.html", quote: "hashtags such as #MarielleFranco, #MariellePresente"}
- card: marielle-franco
  fact: "In 2024 former police officers Ronnie Lessa and Élcio de Queiroz were sentenced to 78 and 59 years"
  sources:
    - {title: "Tiago Rogero, The Guardian (2024)", url: "https://www.theguardian.com/world/2024/oct/31/marielle-franco-brazil-murder-former-police-officers-sentenced", quote: "Ronnie Lessa and Élcio de Queiroz sentenced to 78 and 59 years over 2018 murder"}
    - {title: "Al Jazeera (Reuters/AP, 2026)", url: "https://www.aljazeera.com/news/2026/2/26/brazils-supreme-court-imposes-steep-sentences-for-marielle-franco-murder", quote: "Lessa and Queiroz were sentenced to 78 and 59 years in prison in October 2024"}
- card: marielle-franco
  fact: "In February 2026 the Supreme Federal Court convicted the Brazão brothers of ordering the murder, over militia land interests, and sentenced each to 76 years"
  sources:
    - {title: "MercoPress (2026)", url: "https://en.mercopress.com/2026/02/26/brazil-braz-o-brothers-sentenced-to-76-years-for-ordering-marielle-franco-killing", quote: "Brazil’s Supreme Federal Court (STF) on Wednesday convicted brothers Domingos Inácio Brazão and João Francisco Inácio Brazão — known as Chiquinho — of ordering the 2018 assassination ... The court imposed 76 years and three months in prison on each brother"}
    - {title: "Buenos Aires Times (2026)", url: "https://www.batimes.com.ar/news/latin-america/76-years-in-prison-for-the-people-who-conceived-marielle-francos-murder.phtml", quote: "ruling that the crime was ordered to protect militia-linked land interests ... sentenced brothers Domingos Brazão and Chiquinho Brazão to 76 years in prison"}
    - {title: "Al Jazeera (Reuters/AP, 2026)", url: "https://www.aljazeera.com/news/2026/2/26/brazils-supreme-court-imposes-steep-sentences-for-marielle-franco-murder", quote: "conspired to have Franco murdered in response to her efforts to end illegal land grabs"}
- card: marielle-franco
  fact: "Her sister Anielle Franco is Brazil's minister for racial equality"
  sources:
    - {title: "MercoPress (2026)", url: "https://en.mercopress.com/2026/02/26/brazil-braz-o-brothers-sentenced-to-76-years-for-ordering-marielle-franco-killing", quote: "Marielle’s sister, Anielle Franco — Brazil’s minister for racial equality"}
    - {title: "Buenos Aires Times (2026)", url: "https://www.batimes.com.ar/news/latin-america/76-years-in-prison-for-the-people-who-conceived-marielle-francos-murder.phtml", quote: "Her sister, Anielle Franco, now Brazil’s racial equality minister"}
- card: sarraounia-film
  fact: "In 1899 a French column under captains Voulet and Chanoine marched east across present-day Niger towards Lake Chad, killing as it went"
  sources:
    - {title: "Eromo Egbejule, The Guardian (2025)", url: "https://www.theguardian.com/world/2025/jul/15/france-willingness-discuss-reparations-niger", quote: "In 1899, French officers led by the captains Paul Voulet and Julien Chanoine marched tirailleurs – as the African soldiers under their command were known – through communities in present-day Niger"}
    - {title: "Jacques Morel, Calendrier des crimes de la France outre-mer: 2 mai 1899", url: "https://web.archive.org/web/20120324034536/http://jacques.morel67.pagesperso-orange.fr/ccfo/crimcol/node49.html", quote: "La mission Voulet-Chanoine en route vers le Tchad sème la mort sur son passage"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "Headed for Lake Chad in Central Africa, the infamous and bloodthirsty Voulet-Chanoine French military expedition"}
- card: sarraounia-film
  fact: "At Birni-N'Konni the column carried out a massacre"
  sources:
    - {title: "Eromo Egbejule, The Guardian (2025)", url: "https://www.theguardian.com/world/2025/jul/15/france-willingness-discuss-reparations-niger", quote: "In Birni-N’Konni alone, an estimated 400 people were massacred in a day"}
    - {title: "Jacques Morel, Calendrier des crimes de la France outre-mer: 2 mai 1899", url: "https://web.archive.org/web/20120324034536/http://jacques.morel67.pagesperso-orange.fr/ccfo/crimcol/node49.html", quote: "2 mai 1899: Massacre de Birni-N'Konni (Soudan - Niger)"}
- card: sarraounia-film
  fact: "When Paris sent Colonel Klobb to take command, Voulet had him shot"
  sources:
    - {title: "Eromo Egbejule, The Guardian (2025)", url: "https://www.theguardian.com/world/2025/jul/15/france-willingness-discuss-reparations-niger", quote: "When Paris dispatched Col Jean-François Klobb to replace Voulet in July that year and end the bloodletting, the superior officer was shot to death by soldiers acting on the latter’s instructions"}
    - {title: "Jacques Morel, Calendrier des crimes de la France outre-mer: 2 mai 1899", url: "https://web.archive.org/web/20120324034536/http://jacques.morel67.pagesperso-orange.fr/ccfo/crimcol/node49.html", quote: "Le 14 juillet 1899 à Dankori, Voulet fait tuer le colonel Klobb envoyé pour prendre le commandement de la colonne"}
- card: sarraounia-film
  fact: "Sarraounia, queen of the Azna, fought the French column ('when most neighbours made deals' dropped: Criterion only)"
  sources:
    - {title: "Criterion Channel: Sarraounia", url: "https://www.criterionchannel.com/sarraounia", quote: "the titular Azna queen (Aï Keïta), a revered leader who inspires her people to fight the French army when most of the surrounding tribes have made deals with the invaders or joined their forces"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "meets on its path the indomitable and incomparable strategist Queen Sarraounia of the Azna, who bravely resists their incursion"}
    - {title: "IndieWire (2019)", url: "https://www.indiewire.com/2019/03/med-hondo-dead-african-cinema-1202048352/", quote: "It tells the true story of Queen Sarraounia of the Azna people in what is present-day Niger; during the “Scramble for Africa,” they fought French colonial troops in 1899"}
- card: sarraounia-film
  fact: "Med Hondo, Mauritanian-born and working in France, adapted Abdoulaye Mamani's novel"
  sources:
    - {title: "IndieWire (2019)", url: "https://www.indiewire.com/2019/03/med-hondo-dead-african-cinema-1202048352/", quote: "Born in Mauritania in 1936, Hondo moved to France in the late 1950s ... based on Nigerien writer Abdoulaye Mamani’s novel of the same name"}
    - {title: "Criterion Channel: Sarraounia", url: "https://www.criterionchannel.com/sarraounia", quote: "Mauritanian French director Med Hondo shifted to a more realistic, epic style to adapt Abdoulaye Mamani’s SARRAOUNIA"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "By adapting Abdoulaye Mamani’s eponymous book"}
- card: sarraounia-film
  fact: "Shooting in Niger was blocked"
  sources:
    - {title: "Internationales Forum des Jungen Films, Berlin 1987: Sarraounia, catalogue sheet (interview with Med Hondo)", url: "https://www.arsenal-berlin.de/assets/Legacy/katalog_blaetter/19_1987_Sarraounia.pdf", quote: "Tatsache jedenfalls ist, daß der Niger einen Rückzieher gemacht hat"}
    - {title: "Jacques Morel, Calendrier des crimes de la France outre-mer: 2 mai 1899", url: "https://web.archive.org/web/20120324034536/http://jacques.morel67.pagesperso-orange.fr/ccfo/crimcol/node49.html", quote: "Med Hondo , Sarraounia , film France/Burkina Faso, 1986, interdit de tournage au Niger"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "upon learning of Hondo’s difficulties in Niger, offered to let him shoot the film in the Western region of Burkina Faso"}
    - {title: "Aboubakar Sanogo, Film Comment (2020)", url: "https://www.filmcomment.com/article/by-any-means-necessary-med-hondo/", quote: "Sarraounia , Hondo’s classic anti-colonial epic, also encountered preventive censorship"}
- card: sarraounia-film
  fact: "Thomas Sankara, Burkina Faso's revolutionary president and a cinephile, stepped in and the film was shot in Burkina Faso"
  sources:
    - {title: "Internationales Forum des Jungen Films, Berlin 1987: Sarraounia, catalogue sheet (interview with Med Hondo)", url: "https://www.arsenal-berlin.de/assets/Legacy/katalog_blaetter/19_1987_Sarraounia.pdf", quote: "ich habe Hauptmann Sankara aufgesucht und ihm sowie den Mitgliedern seiner Regierung die Sachlage geschildert ... Hier, in Burkina Faso, dem früheren Obervolta, wo der größte Teil der Dreharbeiten vonstatten geht"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "The film owes much of its existence to the late Captain Thomas Sankara, former Head of State of Burkina Faso and a committed cinephile"}
    - {title: "Aboubakar Sanogo, Film Comment (2020)", url: "https://www.filmcomment.com/article/by-any-means-necessary-med-hondo/", quote: "It took the intervention of the late Burkinabe revolutionary president (and noted cinephile) Captain Thomas Sankara for the film to be shot in Burkina Faso"}
- card: sarraounia-film
  fact: "Aï Keïta played the queen; Jean-Roger Milo and Féodor Atkine played Voulet and Chanoine"
  sources:
    - {title: "Criterion Channel: Sarraounia", url: "https://www.criterionchannel.com/sarraounia", quote: "French commanders Captain Paul Voulet (Jean-Roger Milo) and Lieutenant Julien Chanoine (Féodor Atkine) ... Starring Aï Keïta"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "With Aï Keïta, Jean-Roger Milo, Féodor Atkine"}
    - {title: "AllAfrica: interview with Aï Keïta Yara (2001)", url: "https://allafrica.com/stories/200102260050.html", quote: "Ai Keita Yara played Sarraounia, the queen"}
- card: sarraounia-film
  fact: "The film shows the horrors of colonial conquest without flinching"
  sources:
    - {title: "Criterion Channel: Sarraounia", url: "https://www.criterionchannel.com/sarraounia", quote: "a historical novel about the Battle of Lougou that unflinchingly depicts the horrors of colonial occupation and conflict"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "to chronicle the unspeakably gory violence of colonial conquest"}
- card: sarraounia-film
  fact: "In 1987 it won the Golden Stallion of Yennenga at FESPACO in Ouagadougou"
  sources:
    - {title: "AllAfrica: interview with Aï Keïta Yara (2001)", url: "https://allafrica.com/stories/200102260050.html", quote: "won the coveted Yennenga Stallion award for best film in 1987 at FESPACO, the prestigious pan African festival of film and television held every two years in Ouagadougou"}
    - {title: "Aboubakar Sanogo, Film Comment (2020)", url: "https://www.filmcomment.com/article/by-any-means-necessary-med-hondo/", quote: "the Golden Yennenga Stallion in Ouagadougou for Sarraounia (1986)"}
- card: sarraounia-film
  fact: "Hondo died in Paris in 2019"
  sources:
    - {title: "IndieWire (2019)", url: "https://www.indiewire.com/2019/03/med-hondo-dead-african-cinema-1202048352/", quote: "Med Hondo ... a founding father of African cinema, died Saturday morning in Paris"}
    - {title: "Aboubakar Sanogo, Harvard Film Archive: Med Hondo and the Indocile Image", url: "https://harvardfilmarchive.org/programs/med-hondo-and-the-indocile-image", quote: "On March 2, 2019, on the closing day of the 50th anniversary of FESPACO ... Med Hondo passed away in a hospital in Paris"}
- card: sarraounia-film
  fact: "The Harvard Film Archive and Ciné-Archives restored the film"
  sources:
    - {title: "Aboubakar Sanogo, Harvard Film Archive: Med Hondo and the Indocile Image", url: "https://harvardfilmarchive.org/programs/med-hondo-and-the-indocile-image", quote: "In collaboration with Ciné-Archives in Paris, the Harvard Film Archive ... oversaw the digital restoration of West Indies and Sarraounia"}
    - {title: "RFI, La marche du monde: L'Histoire africaine selon Med Hondo (2023)", url: "https://www.rfi.fr/fr/podcasts/la-marche-du-monde/20230702-l-histoire-africaine-selon-med-hondo", quote: "le coffret DVD des trois films restaurés de Med Hondo « Soleil O, West Indies et Sarraounia »"}
    - {title: "Harvard Film Archive: Sarraounia (2023)", url: "https://harvardfilmarchive.org/calendar/sarraounia-2023-04", quote: "Sarraounia Recently Restored"}
- card: la-ultima-cena
  fact: "The Last Supper was made in Cuba in 1976 by Tomás Gutiérrez Alea"
  sources:
    - {title: "La Biennale di Venezia: La última cena (2021)", url: "https://labiennale.org/en/node/8552", quote: "LA ÚLTIMA CENA by Tomás Gutiérrez Alea ... Cuba, 1976, 113’"}
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "THE LAST SUPPER (LA ULTIMA CENA) Tomás Gutiérrez Alea, Cuba, 1976"}
- card: la-ultima-cena
  fact: "It is set during Holy Week on a sugar plantation near Havana at the end of the eighteenth century"
  sources:
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "In the 18th century, the wealthy owner of a sprawling Havana sugar plantation gives in to a misguided whim. As Holy Week approaches"}
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "los hechos que aquí se relatan tuvieron lugar en un ingenio de la Habana durante una Semana Santa a finales del siglo XVIII"}
- card: la-ultima-cena
  fact: "The island's sugar boom then ran on the labour of enslaved Africans"
  sources:
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "finales del siglo XVIII, en el que se produce la “revolución plantadora cubana” (Moreno Fraginals 1995: 166), a saber, el poderoso impulso a la producción azucarera"}
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "todo proyecto colonizador que con la religión católica legitimó la explotación de la mano de obra esclava en América"}
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "a dozen downtrodden slaves"}
- card: la-ultima-cena
  fact: "The historian Manuel Moreno Fraginals advised on the film, and its story starts from a real event"
  sources:
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "Asesores: Manuel Moreno Fraginals, Rogelio Martínez Furé, Nitza Villapol"}
    - {title: "La Biennale di Venezia: La última cena (2021)", url: "https://labiennale.org/en/node/8552", quote: "The film’s initial idea was inspired by a single paragraph by historian Manuel Moreno Fraginal’s voluminous economic essay El ingenio (1964)"}
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "an intricate and uncompromising fable that alarmingly boasts an authentic historical model"}
- card: la-ultima-cena
  fact: "One Holy Thursday a Count of Casa Bayona washed the feet of twelve of his slaves and sat down to eat with them"
  sources:
    - {title: "La Biennale di Venezia: La última cena (2021)", url: "https://labiennale.org/en/node/8552", quote: "the Count of Casa Bayona, who to ease his conscience, washed the feet of twelve of his slaves on Holy Thursday and invited them to dine with him"}
    - {title: "Luis Bay Sevilla, La Semana Santa habanera en el siglo XIX, Diario de la Marina (1947)", url: "https://www.cubangenclub.org/wp-content/uploads/2021/04/La-Semana-Santa-Habanera-en-el-Siglo-XIX.pdf", quote: "en un día de Jueves Santo uno de los Condes de Casa Bayona se prestó a realizar en señal de humildad esta ceremonia, lavándole, al efecto, los pies a doce de sus esclavos"}
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "El Jueves Santo de 1789 el Conde de Casa Bayona efectivamente lavó los pies a doce esclavos de su ingenio azucarero (Zemon Davis 2007: 66), y se reunió con ellos emulando la Ultima Cena de Cristo"}
- card: la-ultima-cena
  fact: "In the film the count casts himself as Christ and twelve bewildered men as his apostles"
  sources:
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "appointing himself as Christ and a dozen downtrodden slaves as the apostles ... the bemused slaves"}
    - {title: "Lia Gomez-Lang, Sounds and Colours (2022)", url: "https://soundsandcolours.com/articles/cuba/cinema-restored-the-last-supper-at-the-barbican-68442/", quote: "its Count recreates the Biblical Last Supper with twelve of the plantations slaves and naturally himself in the position of Jesus Christ"}
- card: la-ultima-cena
  fact: "At the table he holds forth for almost an hour, mixing Christian teaching with justifications for owning slaves"
  sources:
    - {title: "La Biennale di Venezia: La última cena (2021)", url: "https://labiennale.org/en/node/8552", quote: "The remarkable dinner sequence is the structural core of the film: almost an hour"}
    - {title: "Lia Gomez-Lang, Sounds and Colours (2022)", url: "https://soundsandcolours.com/articles/cuba/cinema-restored-the-last-supper-at-the-barbican-68442/", quote: "the Count’s theatrical speech and conversations dart between Christian teachings, mythology and justifications for owning slaves. Lasting almost an hour"}
- card: la-ultima-cena
  fact: "The men take his words seriously; on Good Friday they rise up"
  sources:
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "the impact of the meal reverberates on Good Friday when the slaves rebel"}
    - {title: "Lia Gomez-Lang, Sounds and Colours (2022)", url: "https://soundsandcolours.com/articles/cuba/cinema-restored-the-last-supper-at-the-barbican-68442/", quote: "a deranged, pious speech with the hopes of enlightening his slaves, but in fact spurring an epic rebellion"}
- card: la-ultima-cena
  fact: "The count crushes the revolt and has his 'apostles' beheaded"
  sources:
    - {title: "BBC Four Cinema: The Last Supper (2002), archived", url: "https://web.archive.org/web/20021001142816/http://www.bbc.co.uk/bbcfour/cinema/features/the-last-supper.shtml", quote: "The revolt incurs the wrath of their master, who unleashes the dogs and orders his 'apostles' beheaded"}
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "cuando la revuelta ha sido aplastada y las cabezas de los insurgentes clavadas en once postes"}
- card: la-ultima-cena
  fact: "The film is an allegory of the religious hypocrisy of slave society"
  sources:
    - {title: "La Biennale di Venezia: La última cena (2021)", url: "https://labiennale.org/en/node/8552", quote: "La ùltima cena, an ironic allegory of the religious hypocrisy of eighteenth-century colonial society"}
    - {title: "Flavio Fiorani, Sentarse a la mesa del Señor: La última cena de Tomás Gutiérrez Alea, Saggi/Ensayos 6 (2011)", url: "https://dialnet.unirioja.es/descarga/articulo/4944033.pdf", quote: "Puesta en escena de la experiencia de la esclavitud por medio de una alegoría política"}
- card: la-ultima-cena
  fact: "Restored, it is again shown at festivals and in cinemas in Europe, from Venice to the Barbican"
