    - {title: "renk. Magazin: Afrotürken – Im toten Winkel der Geschichte", url: "https://renk-magazin.de/afrotuerken-im-toten-winkel-der-geschichte/", quote: "war 2006 ... Afrikalılar Kültür ve Dayanışma Derneği von Mustafa Olpak gegründet worden, zunächst mit Sitz in Ayvalık"}
