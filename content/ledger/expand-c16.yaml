    - {title: "BBC: Turkey's little-known African community (2016), via MyJoyOnline", url: "https://web.archive.org/web/20161113105609/http://www.myjoyonline.com/world/2016/September-7th/turkeys-little-known-african-community.php", quote: "Although some estimates put the number of Afro Turks as high as 100,000"}
- card: afro-turks
