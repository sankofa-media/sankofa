- id: artifact:george-w-johnson-phonoscope-1898
  claim: In 1899 Johnson was tried for murder; people from the record business stood by him and the
    district attorney recommended his acquittal.
  sources:
    - title: "Tim Brooks: George W. Johnson, the First Black Recording Star"
      url: https://timbrooks.net/?page_id=19
      quote: They stood by him in his time of need, coming to his aid when he was accused of murder in
        1899.
      opened: 2026-11-18
    - title: Jas Obrecht, George W. Johnson (gracyk.com)
      url: https://gracyk.com/johnson1.shtml
      quote: A day into the trial, the district attorney recommended Johnson's acquittal.
      opened: 2026-11-18
- id: artifact:george-w-johnson-phonoscope-1898
  claim: Once companies could press copies from a single master they no longer needed Johnson, and he
    died forgotten in 1914.
  sources:
    - title: "Tim Brooks: George W. Johnson, the First Black Recording Star"
      url: https://timbrooks.net/?page_id=19
      quote: As soon as each of them had secured a suitable master recording from him they didn’t need him
        any more, and his income dropped precipitously.
      opened: 2026-11-18
    - title: Jas Obrecht, George W. Johnson (gracyk.com)
      url: https://gracyk.com/johnson1.shtml
      quote: Johnson passed away in 1914, followed a few months later by Len Spencer.
      opened: 2026-11-18
    - title: Tim Brooks (died forgotten)
      url: https://timbrooks.net/?page_id=19
      quote: he moved to a small tenement room in Harlem where he died forgotten and alone on January 23,
        1914, at the age of 67.
      opened: 2026-11-18
