      url: https://www.lva.virginia.gov/collections/educator-resources/changemakers/items/show/5
      quote: On March 23, 1849, his co-conspirators sealed Brown into a wooden crate and placed it on a
        train bound for Philadelphia.
      opened: 2026-11-14
    - title: "Encyclopedia of Greater Philadelphia (Rutgers-Camden): Underground Railroad"
      url: https://philadelphiaencyclopedia.org/essays/underground-railroad/
      quote: Smith shipped him in a box, 3 feet long by 2 feet wide, from Richmond to Philadelphia by rail
      opened: 2026-11-14
