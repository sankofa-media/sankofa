# Facts behind the Cabinet of Curiosities (content/cabinet): every claim in a
# cache's story, an artifact's note or caption and a drawer's intro, with two
# independent sources opened on the date given and the passage it rests on.
- id: cache:sea-chest
  claim: Seamen's protection certificates were valuable identity papers verifying a sailor's identity
    and citizenship.
  sources:
    - title: "National Archives, Prologue (Ruth Priest Dixon, 1992): Genealogical Fallout from the War of
        1812 / seaman's protection"
      url: https://www.archives.gov/publications/prologue/1992/spring/seamans-protection.html
      quote: Sometimes these valuable identity papers were borrowed by a landlubber from a bona fide
        seaman.
      opened: 2026-11-14
    - title: "National Archives, Rediscovering Black History (Damani Davis): African American Seamen of
        the Antebellum Era"
      url: https://rediscovering-black-history.blogs.archives.gov/2021/11/10/african-american-seamen-of-the-antebellum-era
      quote: The Seamen’s Protection Certificates were required to verify the identity and citizenship of
        American seamen.
      opened: 2026-11-14
- id: cache:sea-chest
  claim: In 1796 Congress created seamen's protection certificates to protect American sailors from
    impressment by the British Royal Navy.
  sources:
    - title: "National Archives, Rediscovering Black History: African American Seamen of the Antebellum
        Era"
      url: https://rediscovering-black-history.blogs.archives.gov/2021/11/10/african-american-seamen-of-the-antebellum-era
      quote: as a means to protect American seamen from impressment by the British Royal Navy
      opened: 2026-11-14
    - title: "National Archives, Prologue 1992: seaman's protection certificates"
      url: https://www.archives.gov/publications/prologue/1992/spring/seamans-protection.html
      quote: were authorized by the Fourth Congress on May 28, 1796
      opened: 2026-11-14
    - title: "University of Nebraska-Lincoln, Teaching Legal History: Seamen's Protection Certificate for
        James Forten Dunbar (1810)"
      url: https://teachinglegalhistory.unl.edu/s/oer/item/2160
      quote: Seamen's Protection Certificates were documents authorized by an act of Congress in 1796
      opened: 2026-11-14
- id: cache:sea-chest
  claim: For a man of color the certificate also served as proof of free status.
  sources:
    - title: "University of Nebraska-Lincoln, Teaching Legal History: Seamen's Protection Certificate for
