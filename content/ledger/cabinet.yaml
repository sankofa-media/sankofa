- id: cache:box-brown-box
  claim: On 23 March 1849 Henry Brown was sealed into a wooden box in Richmond and sent by rail to
    Philadelphia.
  sources:
    - title: "Encyclopedia Virginia (Virginia Humanities): Henry Box Brown (1815 or 1816–1897)"
      url: https://encyclopediavirginia.org/entries/brown-henry-box-1815-or-1816-1897/
      quote: On March 23, 1849, the Smiths sealed Brown into a wooden box
      opened: 2026-11-14
