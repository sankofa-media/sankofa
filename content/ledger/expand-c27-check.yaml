# Second, independent fact-check of batch c27 (2026-11-14). Every page below was fetched again by the checker; quotes are as found.
# Verdicts: confirmed | corrected (card or ledger changed) | refuted | unconfirmed.
# Independence: the two National Park Service Cathay Williams pages are one agency and are never paired; the two Chess Drum pages are paired only with the 1873 book or BlackPast.
# Encyclopedia Virginia refused direct fetches; its quotes were checked through a page reader and all twelve were found.

checks:
  - card: amistad-case
    fact: "By 1839 Spain had outlawed the import of enslaved Africans into Cuba, yet captives were still landed in Havana"
    verdict: confirmed
    sources:
      - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "Although Spain had made the importation of slaves illegal since 1820, the two men loaded their slaves onto the schooner Amistad"}
      - {title: "United States v. The Amistad, 40 U.S. 518 (1841), Legal Information Institute", url: "https://www.law.cornell.edu/supremecourt/text/40/518", quote: "were unlawfully transported to Cuba, in violation of the laws and treaties of Spain"}
    note: "DACB gives the 1820 ban; the Supreme Court opinion says the Africans were brought to Cuba unlawfully."
  - card: amistad-case
    fact: "The captives were Mende people seized in Sierra Leone and shipped to Havana"
    verdict: confirmed
    sources:
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "purchased 53 of the captives (members of the Mende people) in Havana"}
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Portuguese slave hunters abducted a large group of Africans from Sierra Leone and shipped them to Havana, Cuba"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "José Ruiz and Pedro Montes bought 53 of them and put them aboard the schooner Amistad"
    verdict: confirmed
    sources:
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Two Spanish plantation owners, Pedro Montes and Jose Ruiz, purchased 53 Africans and put them aboard the Cuban schooner Amistad"}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Two Spaniards, Don Pedro Montez and Don Jose Ruiz, purchased 53 of the captives"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "A few days out, in early July 1839, Sengbe Pieh (Joseph Cinqué) freed himself and then the others"
    verdict: confirmed
    sources:
      - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "four days into the voyage on July 2, 1839, one of them, Joseph Cinqué (also known as Sengbe Pieh), freed himself"}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "25-year-old Sengbe Pieh (known as Cinque) escaped from his shackles and set about releasing the other captives"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "They killed the captain and the cook and ordered Ruiz and Montes to sail for Africa"
    verdict: confirmed
    sources:
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "On July 1, 1839, the Africans seized the ship, killed the captain and the cook, and ordered Montes and Ruiz to sail to Africa."}
      - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "they killed the ship’s cook, Celestino. They then killed the ship’s captain, Ramon Ferrer"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "By day the ship ran east, by night the Spaniards turned it north"
    verdict: confirmed
    sources:
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "The ship sailed east during the day, using the sun’s position to determine its direction, but at night, the slave traders quietly redirected their course away from Africa."}
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Montes and Ruiz actually steered the ship north"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "After about two months the US brig Washington seized the Amistad off Long Island (Culloden Point)"
    verdict: confirmed
    sources:
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "This process continued for over two months until, on August 24, 1839, the Amistad reached Long Island, New York. There the federal brig Washington seized the ship and its cargo."}
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "on August 24, 1839, the Amistad was seized off Long Island, NY, by the U.S. brig Washington"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
