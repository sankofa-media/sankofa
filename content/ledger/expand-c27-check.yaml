    sources:
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "The plantation owners were freed and the Africans were imprisoned on charges of murder."}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "American authorities charged the Mende with murder, imprisoned them in New Haven , Connecticut"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "Spain demanded the Africans back and President Martin Van Buren favoured returning them"
    verdict: confirmed
    sources:
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Spain’s foreign minister argued that the holding of the ship and its cargo constituted a violation of a 1795 treaty between the United States and Spain, and he demanded their return."}
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "President Van Buren was in favor of extraditing the Africans to Cuba."}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "Abolitionists raised money and hired lawyers for the Africans"
    verdict: confirmed
    sources:
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "abolitionists in the North opposed extradition and raised money to defend the Africans"}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "American abolitionists rallied to the defense of the Mende, raising money to hire future Connecticut governor Roger Sherman Baldwin and former US president John Quincy Adams"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "The federal courts in Connecticut found the Africans had been kidnapped / were free, and the government appealed to the Supreme Court"
    verdict: corrected
    sources:
      - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "as the prisoners had been kidnapped into slavery, they were legally free"}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "A district court judge then ruled that, as former free men living in Africa, the Spanish had no right to enslave the Mende."}
    note: "Card said 'the Connecticut courts'; the trials were in the federal district (and circuit) court sitting in Connecticut (NARA; ConnecticutHistory.org). Card and ledger now say 'the federal courts in Connecticut'."
  - card: amistad-case
    fact: "In March 1841 the Supreme Court, after a plea by former president John Quincy Adams, declared them free"
    verdict: confirmed
    sources:
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "Adams and Baldwin convinced the court to set the Mende free. The decision came in March of 1841"}
      - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "On March 9, 1841, the Supreme Court upheld the lower court ruling in The United States v. The Amistad with a 7-1 decision declaring that the captives were illegally kidnapped and thus were free."}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "35 survivors returned to Sierra Leone; the others had died at sea or in prison"
    verdict: confirmed
    sources:
      - {title: "US National Archives, Teaching with Documents: The Amistad Case", url: "https://www.archives.gov/education/lessons/amistad", quote: "Thirty five of the survivors were returned to their homeland (the others died at sea or in prison while awaiting trial)."}
      - {title: "Connecticut Humanities, ConnecticutHistory.org: The Amistad case", url: "https://connecticuthistory.org/?p=42730", quote: "the 35 remaining Mende (18 having died at different stages of their voyage or while in prison) sailed for Sierra Leone"}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
  - card: amistad-case
    fact: "Late in 1841 the 35 survivors sailed on the Gentleman and reached Freetown in January 1842"
    verdict: corrected
    sources:
      - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "Towards the end of the year, enough funds had been raised, and the Gentleman was chartered to take the 35 Africans to the colony of Sierra Leone"}
      - {title: "Samuel Momodu, BlackPast: The Amistad Mutiny, 1839", url: "https://www.blackpast.org/african-american-history/amistad-mutiny-1839/", quote: "On November 25, 1841, the surviving Amistad captives departed from New York harbor for Sierra Leone."}
    note: "Card said 'That winter'; the Gentleman left New York on 25 November 1841 (BlackPast) and was chartered 'towards the end of the year' (DACB). Card now says 'Late in 1841'; arrival January 1842 confirmed by BlackPast and DACB."
  - card: amistad-case
    fact: "The ruling did not touch slavery itself; it held that kidnapped Africans were free, not property"
    verdict: confirmed
    sources:
      - {title: "Dictionary of African Christian Biography: Pieh, Sengbe (from Encyclopaedia Africana Dictionary of African Biography, vol. 2, 1979)", url: "https://dacb.org/stories/sierra-leone/pieh-sengbe/", quote: "The decision of the court was not in itself an attack on slavery"}
      - {title: "United States v. The Amistad, 40 U.S. 518 (1841), Legal Information Institute", url: "https://www.law.cornell.edu/supremecourt/text/40/518", quote: "It is plain, beyond controversy, if we examine the evidence, that these negroes never were the lawful slaves of Ruiz or Montez, or of any other Spanish subjects."}
    note: "Quotes found verbatim on the pages as fetched on 2026-11-14."
