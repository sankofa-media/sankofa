- card: rhythm-and-blues
  fact: "\"So Long\" in 1949 and \"Teardrops from My Eyes\" in 1950; Atlantic became \"The House that Ruth Built\""
  verdict: confirmed
  sources:
    - {title: "NPR Forebears (2017)", url: "https://text.npr.org/559070707", quote: "In 1949 she recorded \"So Long\" for Atlantic [...] Her second hit, 1950's \"Teardrops From My Eyes,\" went to No. 1. [...] Atlantic soon became known as \"The House that Ruth Built.\""}
    - {title: "Rock & Roll Hall of Fame: Ruth Brown", url: "https://www.rockhall.com/inductees/ruth-brown", quote: "They called Atlantic \"the house that Ruth built\" for good reason—her two dozen hits put the budding company on the map."}
  note: "Dates also Sun-Times (So Long, 25 May 1949) and BlackPast (Teardrops, 1950)."
- card: rhythm-and-blues
  fact: "She saw no royalties; after leaving Atlantic in the early 1960s she drove a bus and cleaned houses"
  verdict: confirmed
  sources:
    - {title: "BlackPast", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Brown left Atlantic Records in the early 1960s [...] She held a series of low-paying jobs as a floor scrubber and bus driver."}
    - {title: "Contemporary Musicians via Encyclopedia.com", url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ruth-brown", quote: "she worked as a bus driver, a teacher for the mentally retarded, and a house cleaner"}
  note: "Royalties: Western News ('would not see a dime in royalties from the label until the 1980s') and Sun-Times ('had not received a royalty check since the early 1960s'). NPR: 'When Atlantic ended their professional relationship in the early 1960s'."
- card: rhythm-and-blues
  fact: "The label said she owed it money; she fought back; Atlantic wrote off her and her contemporaries' debts and paid back royalties"
  verdict: confirmed
  sources:
    - {title: "BlackPast", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Because she spoke out, Atlantic waived unrecouped debts held by Brown and thirty-five other musicians of her era and agreed to pay twenty years' worth of retroactive royalties."}
    - {title: "Chicago Sun-Times (2006)", url: "https://chicago.suntimes.com/news/2006/11/24/18584697/ruth-brown-s-rainbow", quote: "Atlantic pledged to erase all negative balances claimed against older artists and recalcuate royalties from 1970 to the present."}
  note: "Claimed debt: Contemporary Black Biography ('claimed she owed them $30,000 in studio fees')."
- card: rhythm-and-blues
  fact: "Atlantic helped found the Rhythm and Blues Foundation"
  verdict: confirmed
  sources:
    - {title: "BlackPast", url: "https://www.blackpast.org/african-american-history/brown-ruth-1928-2006/", quote: "Atlantic also contributed almost $2 million to start the Rhythm and Blues Foundation"}
    - {title: "Western News (2015)", url: "https://news.westernu.ca/2015/11/professor-explores-label-exploitation-of-a-generation-of-rb-artists/", quote: "the company paid more than $2 million to form the Rhythm and Blues Foundation"}
  note: "Amounts differ ($1.5m CBB vs ~$2m), so the card rightly gives none. NPR says Brown herself helped found it in 1988; consistent with 'helped'."
