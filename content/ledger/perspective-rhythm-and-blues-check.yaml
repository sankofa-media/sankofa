# Second, independent check (2026-11-15) of content/ledger/perspective-rhythm-and-blues.yaml
# and content/cards/rhythm-and-blues.md / rhythm-and-blues.ru.md. Every cited URL was reopened
# (Rock Hall, NPR x2, Encyclopedia.com x4, Carnegie Hall x3, Smithsonian PDF, BlackPast,
# Encyclopedia of Arkansas, Blues Foundation, Western News, Chicago Sun-Times, Case Western ECH,
# AP via Taipei Times); quotes are copied from the fetched page text.
# verdict: confirmed | corrected (card wording or sources changed) | refuted | unconfirmed (removed).
# "(unledgered)" marks body/wow claims the first ledger did not record.
# Word count per copy after fixes (limit 235, genre card): EN male 226, female 234; RU male 202, female 214.
# Both copies read as complete stories: shared frame (sound, the Billboard renaming), then Jordan
# (rise, eclipse, legacy) or Brown (rise, exploitation, fight, restitution), then shared outcome.
# .ru.md marks the same paragraphs ({male} 3rd, {female} 4th).
- card: rhythm-and-blues
  fact: "Rhythm and blues was the dance music of Black urban America after the Second World War"
  verdict: corrected
  sources:
    - {title: "Carnegie Hall Timeline: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "Rhythm and blues is a form of Black dance music that has its origins in the post-World War II era"}
    - {title: "Encyclopedia of African-American Culture and History: Rhythm and Blues", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "R&B reflected the confluence of jazz, blues, gospel, and vocal-harmony group music that took place in cities such as New York, Detroit, Chicago, Memphis, Philadelphia, and New Orleans after World War II."}
  note: "The card said R&B was the dance music only 'into the early 1950s', which contradicts its own years (to 1960), Ruth Brown's 1950s hits and the mid-1960s soul line. 'Early 1950s' belongs to the jump-combo style (Carnegie) and was moved to the next sentence."
- card: rhythm-and-blues
  fact: "Swing orchestras shrank to small jump bands"
  verdict: confirmed
  sources:
    - {title: "Carnegie Hall Timeline: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "Former swing band members reduced the 12–16-member ensemble to a seven- or eight-piece group"}
    - {title: "Mark Puryear, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "One important stylistic prototype in the development of R&B was jump blues [...] Jordan was a former member of Chick Webb's swing band [...] Jordan's group, a combo ranging in number from six to seven musicians"}
  note: "Smithsonian quote in the first ledger is genuine but weak; the combo-size passage is stronger."
- card: rhythm-and-blues
  fact: "Jump bands kept the twelve-bar blues"
  verdict: unconfirmed
  sources:
    - {title: "Carnegie Hall Timeline: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "The up-tempo style known as \"jump blues\" is characterized by a 12-bar blues structure"}
  note: "The first ledger attributed this exact sentence to the Smithsonian PDF; it is not there (it is Carnegie Hall's text), so only one source remained. Encyclopedia of African-American Culture and the Smithsonian PDF do not say it of jump bands; Britannica blocked. 'the twelve-bar blues' removed from EN and RU."
- card: rhythm-and-blues
  fact: "Boogie-woogie bass, shuffle beat, saxophone out front"
  verdict: corrected
  sources:
    - {title: "Carnegie Hall Timeline: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "retained the boogie-woogie foundation, the shuffle beat, and the riffing horn patterns from swing. [...] boogie-woogie bass line, shuffle rhythms [...] solo alto saxophone"}
    - {title: "Mark Puryear, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "incorporating the shuffle rhythm, boogie-woogie bass lines, and short horn patterns or riffs. [...] The saxophone was one of the first instruments to take prominence as a lead instrumental voice in R&B ensembles"}
  note: "Ledger sources fixed (misattributed quote replaced with real Smithsonian text)."
- card: rhythm-and-blues
  fact: "Drums hit hard on the backbeat, two and four"
  verdict: corrected
  sources:
    - {title: "Carnegie Hall Timeline: Rhythm & Blues", url: "https://timeline.carnegiehall.org/genres/rhythm-blues", quote: "substituted for swing rhythms and heavy backbeats on 2 and 4"}
    - {title: "Mark Puryear, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "from blues shuffles with a back beat to boogie-woogie"}
  note: "Heavy backbeat confirmed (also NPR: 'backbeat-heavy sound'); 'two and four' only in Carnegie Hall, removed ('вторую и четвёртую доли' removed in RU)."
- card: rhythm-and-blues
  fact: "Vocal groups brought close harmony from church"
  verdict: confirmed
  sources:
    - {title: "Encyclopedia of African-American Culture and History", url: "https://www.encyclopedia.com/history/encyclopedias-almanacs-transcripts-and-maps/rhythm-and-blues", quote: "dozens of important vocal groups, starting with the \"bird groups,\" drew heavily from the gospel tradition"}
    - {title: "Mark Puryear, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "Rhythm and blues singers, often strongly influenced by gospel singing traditions, typically perform [...] in groups where four to five members sing in harmony with a lead vocalist."}
  note: "Carnegie (jubilee quartets) also supports."
- card: rhythm-and-blues
  fact: "Billboard filed these records as \"Race\" until Wexler proposed \"rhythm and blues\"; in 1949 the chart took the new name"
  verdict: confirmed
  sources:
    - {title: "NPR Forebears: Ruth Brown (2017)", url: "https://text.npr.org/559070707", quote: "It was 1949 when Billboard changed the name of its \"Race Music\" category to \"Rhythm and Blues\""}
    - {title: "Mark Puryear, Smithsonian Folklife Festival (2011)", url: "https://folkways-media.si.edu/docs/festival/2011/festival-program-book-rnb.pdf", quote: "The term R&B was first used as a music category label in 1949 in the entertainment magazine Billboard. Coined by then-music journalist and later Atlantic Records executive Jerry Wexler"}
  note: "Carnegie and Encyclopedia of African-American Culture also give 1949. Contemporary Authors says '1949 or 1950' and an AP obituary 'late 1940s' — imprecision, not contradiction; no dispute field."
- card: rhythm-and-blues
  fact: "Wexler was a young writer on Billboard's charts (wow: 'a young writer editing its charts')"
  verdict: corrected
  sources:
    - {title: "AP obituary via Taipei Times (2008)", url: "https://www.taipeitimes.com/News/world/archives/2008/08/17/2003420595", quote: "Wexler landed a job writing for Billboard magazine in the late 1940s [...] There he coined the term \"rhythm and blues\" for the magazine's black music charts; previously, they were listed under \"race records.\""}
    - {title: "Contemporary Authors via Encyclopedia.com", url: "https://www.encyclopedia.com/arts/educational-magazines/wexler-jerry-1917-2008-gerald-wexler", quote: "Wexler was working as a writer for the trade magazine Billboard at the time"}
  note: "'Writer at Billboard' and 'for its Black music chart' confirmed (also Carnegie). 'Young' (he was 32) and 'editing its charts' found in no source opened: removed from body and wow in EN and RU."
