# Second, independent check (2026-11-15) of content/ledger/perspective-afrobeat.yaml
# and content/cards/afrobeat.md / afrobeat.ru.md. Every cited URL was reopened;
# quotes are copied from the fetched page text.
# verdict: confirmed | corrected (card wording or sources changed) |
#          refuted | unconfirmed (removed from the card).
# Entries whose fact starts with "(unledgered)" check claims in the body that the
# first ledger did not record. Word count per copy (limit 235, genre card):
# EN male 233, female 234; RU male 224, female 224.
- card: afrobeat
  fact: "In 1969 Fela's band ended up broke in Los Angeles"
  verdict: confirmed
  sources:
    - {title: "Fela Kuti official site: story, 1969", url: "https://felakuti.com/story/1969", quote: "The group perform in Washington DC, Chicago and San Francisco before ending up broke in Los Angeles."}
    - {title: "NME: Tony Allen, 1940-2020 (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "a 10-month visit to Los Angeles in 1969"}
  note: "NME confirms the 1969 Los Angeles stay; only felakuti.com states 'broke' explicitly, which is the estate's own chronology and uncontested."
- card: afrobeat
  fact: "There the activist Sandra Izsadore gave him The Autobiography of Malcolm X and told him about the Black Panthers"
  verdict: confirmed
  sources:
    - {title: "Fela Kuti official site: story, 1969", url: "https://felakuti.com/story/1969", quote: "Sandra Izsadore, a black-rights activist in Los Angeles ... introduces him to the writings of Malcolm X, Angela Davis, H. Rap Brown"}
    - {title: "Los Angeles Magazine: Q&A with Sandra Izsadore", url: "https://lamag.com/news/fela-kutis-muse-a-qa-with-sandra-izsadore/", quote: "The Autobiography of Malcolm X and writings by Angela Davis and Huey Newton. ... I told him about the Black Panthers and the activities that I had been involved with."}
  note: "Also supports the wow line (activist, Malcolm X, Black Power thinkers)."
- card: afrobeat
  fact: "Tony Allen was a self-taught Lagos drummer who had worked as a radio engineer"
  verdict: confirmed
  sources:
    - {title: "NME (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "self-taught on the drums ... working as a radio engineer in Nigeria at the age of 18"}
    - {title: "Mixmag (2020)", url: "https://mixmag.net/feature/tony-allen-drummer-afrobeat-obituary", quote: "working as an engineer for Lagos radio station in the Fifties"}
  note: "uDiscover also: 'taught himself how to play drums when he was 18'."
- card: afrobeat
  fact: "Fela heard Allen in 1964"
  verdict: confirmed
  sources:
    - {title: "NME (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "caught the ear of fellow Lagos highlife circuit player Fela Kuti in 1964"}
    - {title: "uDiscover Music (2020)", url: "https://udiscovermusic.com/news/tony-allen-afrobeat-dead-79", quote: "Allen first met Fela Kuti in 1964"}
  note: "Mixmag: 'They first began playing together in 1964'."
