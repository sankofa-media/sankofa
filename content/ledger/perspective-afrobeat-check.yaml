- card: afrobeat
  fact: "Fela died in 1997; hundreds of thousands filled the streets of Lagos for his funeral"
  verdict: confirmed
  sources:
    - {title: "Fela Kuti official site: story, 1997", url: "https://felakuti.com/story/1997", quote: "An estimated hundred and fifty thousand people gather in Tafawa Balewa Square to pay their final respects, and over a million others line the route"}
    - {title: "IFRA-Nigeria, OpenEdition Books: The Afrobeat Continuum", url: "https://books.openedition.org/ifra/527", quote: "Fela died on August 2, 1997. ... over half a million people paid their last respects."}
  note: "Estimates range from 150,000 to over a million; 'hundreds of thousands' is the safe common floor."
- card: afrobeat
  fact: "(unledgered) Afrobeat: long tracks, trance-like groove, horns, Pidgin English, call-and-response chorus; highlife and jazz joined to James Brown's funk"
  verdict: confirmed
  sources:
    - {title: "Songlines: Fela Kuti, a beginner's guide", url: "https://songlines.co.uk/features/a-beginner-s-guide/fela-kuti-a-beginner-s-guide", quote: "mostly containing just one or two uncompromisingly long numbers each ... all underpinned by a mighty and endless, trance-like groove ... lyrics in pidgin English ... call-and-response vocals ... an appealing mix of highlife and jazz"}
    - {title: "Alexander Stewart, Make It Funky, American Studies 52:4 (2013)", url: "https://journals.ku.edu/amsj/article/download/4463/4304/", quote: "The next section compares elements of James Brown's and Fela's music in order to understand how funk informed Fela's new Afrobeat style."}
  note: "RBMA Daily independently: 'James Brown-styled funk rock', 'everything becomes hypnotic', 'rousing horn fanfares'."
