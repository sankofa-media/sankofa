  verdict: confirmed
  sources:
    - {title: "OkayAfrica (2020)", url: "https://www.okayafrica.com/trailblazing-afrobeat-drummer-pioneer-tony-allen-has-died/117647", quote: "Without Tony Allen, there would be no Afrobeat"}
    - {title: "Al Jazeera (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "without Tony Allen, there would be no Afrobeat"}
  note: ""
- card: afrobeat
  fact: "After the album Zombie mocked the army, government forces attacked Fela's commune"
  verdict: confirmed
  sources:
    - {title: "Scroll.in: Zombie by Fela Kuti", url: "https://scroll.in/article/948202/the-art-of-resistance-zombie-by-fela-kuti-questions-repressive-governments", quote: "As a result, the government forces attacked Kuti's commune leaving him and his followers severely injured."}
    - {title: "Classic Album Sundays", url: "https://classicalbumsundays.com/album-of-the-month-fela-kuti-gentleman-zombie/", quote: "a searing attack on the Nigerian army, whom he likened to mindless zombies ... lit the fuse on the most vicious period of attacks against Fela and his family"}
  note: ""
- card: afrobeat
  fact: "In 1977 about a thousand soldiers stormed and razed the Kalakuta Republic, where his mother was staying, and threw her from a window"
  verdict: confirmed
  sources:
    - {title: "Fela Kuti official site: story, 1977", url: "https://felakuti.com/story/1977", quote: "On 18 February, in an unprecedently brutal assault, 1,000 soldiers batter their way into Kalakuta and raze it to the ground."}
    - {title: "Encyclopedia.com (Women in World History)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "Ransome-Kuti was staying at her son's house in February 1977 when some 1,000 soldiers arrived to confront him. ... soldiers threw Ransome-Kuti from a second-story window."}
  note: "Classic Album Sundays misdates the raid to early 1978; the two sources above and Treble give February 1977. Window floor differs (first/second) - the card names none."
- card: afrobeat
  fact: "She died of her injuries in 1978"
  verdict: confirmed
  sources:
    - {title: "Fela Kuti official site: story, 1978", url: "https://felakuti.com/story/1978", quote: "On 13 April, Fela's mother dies from injuries she suffered during the attack."}
    - {title: "Al Jazeera: The Lioness of Lisabi (2020)", url: "https://www.aljazeera.com/features/2020/10/1/the-lioness-of-lisabi-who-ended-unfair-taxes-for-nigerian-women", quote: "died at the General Hospital in Lagos on April 13, 1978"}
  note: "Encyclopedia.com gives 12 April in Abeokuta; the card gives only the year, which all agree on."
- card: afrobeat
  fact: "Allen left at the end of the 1970s after rows over royalties"
