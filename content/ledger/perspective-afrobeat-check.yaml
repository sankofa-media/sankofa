  sources:
    - {title: "uDiscover Music (2020)", url: "https://udiscovermusic.com/news/tony-allen-afrobeat-dead-79", quote: "Allen left the band in 1979, after reported rifts with the band leader over royalties."}
    - {title: "NME (2020)", url: "https://www.nme.com/features/tony-allen-obituary-tribute-2657971", quote: "fell apart over royalty payments"}
  note: "felakuti.com 1978 page: 'many of the musicians, including bandleader Tony Allen, quit the band'. Year varies 1978-1980; 'end of the 1970s' is correct."
