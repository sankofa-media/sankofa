  verdict: confirmed
  sources:
    - {title: "Encyclopedia.com (Women in World History)", url: "https://encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/ransome-kuti-funmilayo-1900-1978", quote: "special flat tax on women imposed by the British"}
    - {title: "New Lines Magazine", url: "https://newlinesmag.com/essays/how-funmilayo-ransome-kuti-championed-womens-rights/", quote: "women who were involved in the local markets and in the selling of foodstuffs were particularly hard hit"}
