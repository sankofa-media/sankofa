    - {title: "New Lines Magazine", url: "https://newlinesmag.com/essays/how-funmilayo-ransome-kuti-championed-womens-rights/", quote: "The Women's Revolt ended in 1949, with Ademola abdicating, the suspension of the flat tax on women and the admittance of women to the local council."}
  note: "Card read 'in 1949 he abdicated, and the tax was suspended', dating the suspension to 1949; Encyclopedia.com puts it in 1948, before the January 1949 abdication. Reordered in EN and RU."
