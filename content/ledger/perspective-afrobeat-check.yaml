    - {title: "Al Jazeera (2020)", url: "https://www.aljazeera.com/news/2020/5/1/nigerian-afrobeat-pioneer-tony-allen-dies-aged-79", quote: "Allen recorded more than 30 albums with Kuti and his group, Africa '70."}
  note: ""
