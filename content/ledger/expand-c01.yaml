# Expansion batch c01 (2026-11-13): every fact in the bodies and wow lines of the c01 cards,
# with at least two independent sources and a supporting quote from each.
# Quotes with [brackets] or marked paraphrase are condensed; re-open those pages before reuse.
- card: blombos-cave
  fact: "Blombos Cave is on the southern coast of South Africa, about 300 km east of Cape Town"
  sources:
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "Located on the southern tip of South Africa, about 300km east of Cape Town"}
    - {title: "Cape Argus: Earliest human drawing found on Western Cape's doorstep (2018)", url: "https://capeargus.co.za/news/2018-09-13-earliest-human-drawing-found-on-western-capes-doorstep", quote: "Situated just 300 km east of Cape Town"}
- card: blombos-cave
  fact: "Its layers, about 100,000-70,000 years old, yielded shell beads, spear points and ochre engraved with cross-hatching"
  sources:
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "treasure trove of ancient human artefacts from 70,000 to 100,000 years old. Excavations have uncovered painted shell beads, double-sided spear points, and pieces of ochre engraved with the same cross-hatched design"}
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "previously yielded shell beads, cross-hatched engravings on ochre pieces and a variety of innovative technologies"}
- card: blombos-cave
  fact: "The team led by Christopher Henshilwood studied thousands of flakes; Luca Pollarolo spotted the marked piece"
  sources:
    - {title: "Cape Argus: Earliest human drawing found on Western Cape's doorstep (2018)", url: "https://capeargus.co.za/news/2018-09-13-earliest-human-drawing-found-on-western-capes-doorstep", quote: "The discovery was made by archaeologist Dr Luca Pollarolo ... He, along with fellow archaeologist and Wits professor Christopher Henshilwood, studied thousands of similar flakes"}
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "L.P. recovered L13 during lithic analysis and recognized its importance"}
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "Christopher Henshilwood, leader of the research team"}
- card: blombos-cave
  fact: "The silcrete flake had broken off a grindstone used to grind ochre"
  sources:
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "a flake the size of two thumbnails which appears to have broken off a grindstone cobble used to turn lumps of ochre into paint powder"}
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "supports the theory that the silcrete flake was part of an ochre grindstone before the drawing was made"}
- card: blombos-cave
  fact: "Analyses showed the lines were drawn with an ochre crayon about 73,000 years ago"
  sources:
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "a cross-hatched pattern drawn with an ochre crayon on a ground silcrete flake recovered from approximately 73,000-year-old Middle Stone Age levels"}
    - {title: "NPR via KPBS: Researchers discover ancient hashtag (2018)", url: "https://www.kpbs.org/news/2018/sep/12/researchers-discover-ancient-hashtag", quote: "What's remarkable is that it was apparently made about 73,000 years ago"}
    - {title: "Cape Argus: Earliest human drawing found on Western Cape's doorstep (2018)", url: "https://capeargus.co.za/news/2018-09-13-earliest-human-drawing-found-on-western-capes-doorstep", quote: "etched with an \"ochre crayon\", was drawn on a smooth silcrete flake some 73 000 years ago"}
- card: blombos-cave
  fact: "The drawing is six lines crossed by three"
  sources:
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "six thin lines crossed by three others"}
    - {title: "Cape Argus: Earliest human drawing found on Western Cape's doorstep (2018)", url: "https://capeargus.co.za/news/2018-09-13-earliest-human-drawing-found-on-western-capes-doorstep", quote: "Consisting of three red lines cross-hatched with six separate lines"}
- card: blombos-cave
  fact: "Published in Nature in 2018 as L13; it looks like a hashtag"
  sources:
    - {title: "Cape Argus: Earliest human drawing found on Western Cape's doorstep (2018)", url: "https://capeargus.co.za/news/2018-09-13-earliest-human-drawing-found-on-western-capes-doorstep", quote: "researchers have now given the stone a more modern and befitting name: '#L13', due to its hashtag appearance"}
    - {title: "AP, Malcolm Ritter: 'Hashtag' called world's oldest known drawing (The Columbian, 2018)", url: "https://columbian.com/news/2018/sep/20/hashtag-called-worlds-oldest-known-drawing", quote: "It looks a bit like a hashtag, but it's 73,000 years old"}
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "Fig. 2: Image of the Blombos Cave silcrete flake L13"}
- card: blombos-cave
  fact: "It predates earlier known drawings by at least 30,000 years; it is the oldest known drawing"
  sources:
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "pre-dates the earliest previously known abstract and figurative drawings by at least 30,000 years"}
    - {title: "AP, Malcolm Ritter: 'Hashtag' called world's oldest known drawing (The Columbian, 2018)", url: "https://columbian.com/news/2018/sep/20/hashtag-called-worlds-oldest-known-drawing", quote: "scientists say this tiny sketch found in a South African cave is the oldest known drawing"}
    - {title: "The Guardian, Ian Sample: Earliest known drawing found on rock in South African cave (2018)", url: "https://www.theguardian.com/science/2018/sep/12/earliest-known-drawing-found-on-rock-in-south-african-cave", quote: "made more recently, 40,000 years ago at most"}
- card: blombos-cave
  fact: "It shows people in southern Africa produced designs on various surfaces with different techniques"
  sources:
    - {title: "Henshilwood et al., An abstract drawing from the 73,000-year-old levels at Blombos Cave, Nature 562 (2018)", url: "https://www.nature.com/articles/s41586-018-0514-3", quote: "demonstrates the ability of early Homo sapiens in southern Africa to produce graphic designs on various media using different techniques"}
    - {title: "AP, Malcolm Ritter: 'Hashtag' called world's oldest known drawing (The Columbian, 2018)", url: "https://columbian.com/news/2018/sep/20/hashtag-called-worlds-oldest-known-drawing", quote: "the drawing shows early humans in southern Africa could produce designs on various surfaces with different techniques"}

- card: san-rock-art
  fact: "Direct dating of soot/carbon-black paint gave the oldest dated paintings, in Botswana, about 5,700-4,400 years"
  sources:
    - {title: "Archaeology magazine (AIA): Rock art in southern Africa dated (2017)", url: "https://archaeology.org/news/2017/04/06/170406-rock-art-dated/", quote: "The oldest of the paintings in the study came from Botswana and was dated to between 5,723 and 4,420 years ago"}
    - {title: "Sarah Wild, Nature 545 (2017), via BioEd Online reprint of Nature News", url: "https://www.bioedonline.org/news/nature-news-archive/dreams-of-the-stone-age-dated-for-first-time-in-southern-africa/", quote: "early hunter-gatherer peoples created art at three sites in the region, some 5,700 years ago"}
- card: san-rock-art
  fact: "Tsodilo Hills hold over 4,500 paintings in about 10 square km"
  sources:
    - {title: "ICOMOS evaluation No 1021: Tsodilo (2001)", url: "https://whc.unesco.org/archive/advisory_body_evaluation/1021.pdf", quote: "It consists of over 4500 paintings and numerous carvings ... the rock art contained in an area of only 10km2"}
    - {title: "Your Botswana: Tsodilo Hills celebrates 20 years as World Heritage Site", url: "https://yourbotswana.com/tsodilo-hills-celebrates-20-years-as-world-heritage-site/", quote: "Tsodilo Hills boast some of the most pristine rock paintings of over 4 500 images"}
- card: san-rock-art
  fact: "Tsodilo became a World Heritage Site in 2001"
  sources:
    - {title: "Your Botswana: Tsodilo Hills celebrates 20 years as World Heritage Site", url: "https://yourbotswana.com/tsodilo-hills-celebrates-20-years-as-world-heritage-site/", quote: "The World Heritage Committee inscribed Tsodilo Hills on the World Heritage list during its 25th Session in Helsinki on 13 December 2001"}
    - {title: "ICOMOS evaluation No 1021: Tsodilo (2001)", url: "https://whc.unesco.org/archive/advisory_body_evaluation/1021.pdf", quote: "Tsodilo (Botswana) No 1021 ... Date 19 June 2000 [nomination evaluated for the 2001 session]"}
- card: san-rock-art
  fact: "The eland is central in San (Drakensberg) rock art and religion"
  sources:
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "From the Drakensberg to the Kalahari the San (Bushmen) regarded the eland as a particularly powerful symbolic influence in their religion"}
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "Such studies have revealed that the Eland is a central symbol"}
- card: san-rock-art
  fact: "Older readings saw art for art's sake/hunting; Lewis-Williams, using 19th-20th c. ethnography, argued it came from trance"
  sources:
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "previous research on the hunter-gatherer rock art has always taken an ethnocentric point of view by imposing an 'art for art's sake' interpretation. Rock art, he argues has to do with the trance dancing"}
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "Lewis-Williams demonstrated that hunter-gatherer rock art was inspired by shamanistic experiences and visions ... drew on 19th and 20th century ethnographic records"}
- card: san-rock-art
  fact: "Healers called on eland potency to enter trance, in which they healed and made rain"
  sources:
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "Eland medicine-men called upon a magic force possessed by eland to enable them to go into trance ... During trance they perform various mystical tasks such as healing, the purging of evil and rain-making"}
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "especially for rituals such as rainmaking and healing/cleansing"}
- card: san-rock-art
  fact: "In trance a healer 'died' as an eland dies and saw himself take its form"
  sources:
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "During the trance dance, the shaman \"dies\" in the same way that an eland dies, with legs crossed"}
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "And when in trance they saw themselves as taking on the form of an eland"}
- card: san-rock-art
  fact: "The eland was invoked at a girl's coming of age (eland bull dance)"
  sources:
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "a girl's puberty when the eland bull dance is performed"}
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "he postulates implicational meaning, such as that of the eland metaphor in girls' puberty"}
- card: san-rock-art
  fact: "Lewis-Williams's work drove the main advances in interpretation (1970s-80s)"
  sources:
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "The 1960s to 1980s witnessed significant advances ... The interpretative advances revolved primarily around the work of Pat Vinnicombe and David Lewis-Williams ... Lewis-Williams (1972, 1981)"}
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "(Lewis-Williams, D. 1981)"}
- card: san-rock-art
  fact: "Painted sites were storehouses of potency for contact with the spirit world"
  sources:
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "Painted sites were thus storehouses of the potency that made contact with the spiritual world possible"}
    - {title: "Tim Maggs and Aron Mazel, rock art of the Natal Drakensberg (Bradshaw Foundation)", url: "https://bradshawfoundation.com/rockartnetwork/maggs_mazel.php", quote: "To the Stone Age artists, therefore, the eland meant far more than just an animal to be hunted"}
- card: san-rock-art
  fact: "Dispute: Garlake proposed many interpretations rather than Lewis-Williams's single reading"
  sources:
    - {title: "Innocent Pikirayi, Peter Garlake (1934-2011), Great Zimbabwe and the politics of the past, Azania (2012)", url: "https://repository.up.ac.za/bitstreams/6a0d52dd-76f9-4855-a2b2-7f24e8d8592e/download", quote: "Although he built on the ethnographically informed works of Professor David Lewis-Williams, he took a more heterogeneous approach, proposing numerous likely interpretations"}
    - {title: "South African History Online: Rock art in South Africa", url: "https://sahistory.org.za/node/16832", quote: "Lewis-William suggests in 'Believing and Seeing' (1981), that in \"Bushman\" art one finds intentional meaning where eland, trance figures, trance buck, etc. are juxtaposed"}

- card: haya-steel
  fact: "The Haya live on the western shore of Lake Victoria in north-western Tanzania (Buhaya)"
  sources:
    - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "the Haya of northwestern Tanzania"}
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "the Haya people of Tanzania on the western shore of Lake Victoria"}
    - {title: "University of Florida Anthropology: Peter Schmidt, PhD", url: "https://anthro.ufl.edu/2019/07/31/peterschmidtarchaeology/", quote: "long-term fieldwork programs in Buhaya, Tanzania"}
- card: haya-steel
  fact: "Haya smelting ended in the early 20th century when cheap European tools arrived; only very old people remembered it"
  sources:
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Because the Haya can now buy inexpensive, European-made steel tools ... they stopped producing their own steel some 50 years ago. Thus the only Haya who could recall details of the steelmaking process were very old"}
    - {title: "Nicholas David, Lost in the third hermeneutic?, Mediterranean Archaeology 14 (2001), table 1", url: "https://ucalgary.ca/sukur/Lib/NDavid%20Lostin3HermMeditArch2001.pdf", quote: "Table 1 ... Haya ... Date smelting abandoned ... ~1925"}
- card: haya-steel
  fact: "Peter Schmidt came to study Haya oral history"
  sources:
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "his goal was to study their complex heritage, which is passed orally from one generation to the next"}
    - {title: "University of Florida Anthropology: Peter Schmidt, PhD", url: "https://anthro.ufl.edu/2019/07/31/peterschmidtarchaeology/", quote: "His research used oral traditions, ethnoarchaeology ... with long-term fieldwork programs in Buhaya, Tanzania"}
- card: haya-steel
  fact: "With metallurgist Donald Avery; in 1976 elders built a traditional furnace from memory and smelted"
  sources:
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Two years ago, at the request of the scientists and working entirely from memory, the Haya constructed a traditional furnace ... Metallurgy Professor Donald Avery"}
    - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "Ethnographic and technological observations of iron smelting among the Raya [Haya] people of NW Tanzania during 1976 and 1979"}
- card: haya-steel
  fact: "Blowpipes carried a preheated air blast into the furnace; the smelt produced steel"
  sources:
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Using these pipes to force preheated air into the furnace ... high enough to produce their carbon steel"}
    - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "employed preheating of the air blast ... and formed a massive steel"}
- card: haya-steel
  fact: "From 1977 excavations near Kemondo Bay found furnaces of the same kind from the first centuries AD"
  sources:
    - {title: "Schmidt and Avery, More Evidence for an Advanced Prehistoric Iron Technology in Africa, Journal of Field Archaeology 10 (1983), abstract", url: "https://doi.org/10.1179/009346983791504228", quote: "Excavations in 1977 at the KM2 site near Kemondo Bay ... dating to the first six centuries A.C., that shared many similarities to the living iron-smelting technology"}
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "they discovered the remnants of 13 furnaces nearly identical in design ... between 1,500 and 2,000 years old"}
- card: haya-steel
  fact: "In Science (1978) Schmidt and Avery argued Haya forebears 1,500-2,000 years ago used preheating and made carbon steel"
  sources:
    - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "these people and their forebears 1500 to 2000 years ago practiced a highly advanced iron smelting technology based on preheating principles and, as a result, produced carbon steel"}
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "Writing in the current issue of Science, Schmidt and ... Avery ... report that as long as 2,000 years ago, the Haya people were producing medium-carbon steel in preheated, forced-draft furnaces"}
- card: haya-steel
  fact: "The claim went against a history of iron-making written from European evidence"
  sources:
    - {title: "Schmidt and Avery, Complex Iron Smelting and Prehistoric Culture in Tanzania, Science 201 (1978), abstract (Crossref)", url: "https://doi.org/10.1126/science.201.4361.1085", quote: "Western scientists and students of history have long explained the iron bloomery process by evidence available from European archeology"}
    - {title: "Time: Science: Africa's Ancient Steelmakers (25 September 1978)", url: "https://content.time.com/time/subscriber/article/0,33009,912179,00.html", quote: "will help to change scholarly and popular ideas that technological sophistication developed in Europe but not in Africa"}

- card: great-zimbabwe
  fact: "Great Zimbabwe is near Masvingo and is the largest of the Shona stone-walled sites; name from Shona for stone buildings"
  sources:
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "It is a Shona word derived from dzimba dzamabwe meaning \"stone buildings\" ... The best known of these, and the largest, after which the modern state of Zimbabwe is named, is usually referred to as Great Zimbabwe ... near present-day Masvingo"}
    - {title: "South African History Online: Kingdoms of southern Africa: Great Zimbabwe", url: "https://sahistory.org.za/article/kingdoms-southern-africa-great-zimbabwe", quote: "The name \"Zimbabwe\" comes from the Shona term \"dzimba dzamabwe\", which means \"stone buildings\""}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "Shona, whose term for houses built of stone is dzimbahwe"}
- card: great-zimbabwe
  fact: "It lies on the plateau between the Zambezi and Limpopo"
  sources:
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "a powerful Shona kingdom which controlled a vast area between the Zambezi and Limpopo Rivers"}
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "places between the Limpopo and Zambezi rivers"}
- card: great-zimbabwe
  fact: "Built by ancestors of the Shona"
  sources:
    - {title: "South African History Online: Kingdoms of southern Africa: Great Zimbabwe", url: "https://sahistory.org.za/article/kingdoms-southern-africa-great-zimbabwe", quote: "The first people to live at Great Zimbabwe were Bantu-speaking. and the ancestors of the Shona people"}
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "they established beyond doubt that Great Zimbabwe was the work of the ancestors of the Shona people"}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "leading him to conclude that the monument itself had been built by the Shona people's ancestors"}
- card: great-zimbabwe
  fact: "Stone walling built mainly c.1250-1450"
  sources:
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "the stone walling ... was built over a comparatively short period of time - about 200 years from 1250 to 1450"}
    - {title: "South African History Online: Zimbabwe", url: "https://sahistory.org.za/place/zimbabwe", quote: "The first low stone walls of Great Zimbabwe was built in the 1200's ... after 1450 the City and the Kingdom, had been reduced to a minor settlement"}
- card: great-zimbabwe
  fact: "It was the capital of a powerful kingdom with more than ten thousand inhabitants"
  sources:
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "At its peak it appears to have had a population of between 12 000 and 15 000 people ... The ruined structures are the remains of an ancient capital"}
    - {title: "South African History Online: Zimbabwe", url: "https://sahistory.org.za/place/zimbabwe", quote: "At its largest the City of Great Zimbabwe housed an estimated 18.000 people"}
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "Great Zimbabwe was probably the most important capital of a powerful Shona kingdom"}
- card: great-zimbabwe
  fact: "Gold and ivory traded to the coast; Chinese ceramics, a Persian bowl and a Kilwa coin found"
  sources:
    - {title: "South African History Online: Kingdoms of southern Africa: Great Zimbabwe", url: "https://sahistory.org.za/article/kingdoms-southern-africa-great-zimbabwe", quote: "exported gold along the Limpopo River ... Chinese pottery and stoneware and a Persian bowl have been found at the ruins. An Arabic inscribed coin from Kilwa"}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "A piece of ceramic, of Persian origin ... Other imported ceramics made of sea-green celadon and decorated with Chinese designs"}
    - {title: "South African History Online: Zimbabwe", url: "https://sahistory.org.za/place/zimbabwe", quote: "Zimbabwe traded in gold, ivory and leopard skins"}
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "the coin shows that there was contact between Great Zimbabwe and Kilwa"}
- card: great-zimbabwe
  fact: "Colonial settlers credited Phoenicians or Solomon's Ophir"
  sources:
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "Rhodes was convinced that the site of Great Zimbabwe had been constructed by Phoenicians ... King Solomon's gold"}
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "the more exotic biblical-city-of-Ophir interpretation"}
    - {title: "The Zimbabwean: Dr Peter Garlake, archaeologist who ended the myth (2012)", url: "https://www.thezimbabwean.co/2012/01/dr-peter-garlake-archaeologist-who/", quote: "ended the colonial myth that Europeans, or the Phoenicians, built Great Zimbabwe"}
- card: great-zimbabwe
  fact: "Early 20th-century archaeologists incl. Randall-MacIver and Caton-Thompson showed African origin"
  sources:
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "David Randall-MacIver ... conclude that the monument itself had been built by the Shona people's ancestors ... as did Gertrude Caton-Thompson"}
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "Between 1905 and 1930, however, two archaeologists ... independently demonstrated that indigenous people built Great Zimbabwe ... Gertrude Caton-Thompson argued"}
- card: great-zimbabwe
  fact: "After UDI (1965) Smith's government kept the exotic-origin story alive and restricted publication"
  sources:
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "the Rhodesian government under Ian Smith purposely kept the \"exotic origin\" interpretation of Great Zimbabwe alive"}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "The dissemination of such findings was accordingly restricted ... Following the 1965 Unilateral Declaration of Independence and the rigorous control of information"}
    - {title: "The Zimbabwean: Dr Peter Garlake, archaeologist who ended the myth (2012)", url: "https://www.thezimbabwean.co/2012/01/dr-peter-garlake-archaeologist-who/", quote: "had to contain an equal number of words explaining that they might, on the other hand, have been build by the Portuguese"}
- card: great-zimbabwe
  fact: "Inspector of Monuments Peter Garlake, who attributed the site to local ancestors, was forced out in 1970"
  sources:
    - {title: "Innocent Pikirayi, Peter Garlake (1934-2011), Great Zimbabwe and the politics of the past, Azania (2012)", url: "https://repository.up.ac.za/bitstreams/6a0d52dd-76f9-4855-a2b2-7f24e8d8592e/download", quote: "employed as Inspector of Monuments ... Garlake's research ... led him to attribute their authorship to ancestors of the Karanga ... The repressive Ian Smith government forced Garlake into exile in 1970"}
    - {title: "The Zimbabwean: Dr Peter Garlake, archaeologist who ended the myth (2012)", url: "https://www.thezimbabwean.co/2012/01/dr-peter-garlake-archaeologist-who/", quote: "Unable to conform to such ridiculous requirements, he and Margaret left for first a new life lecturing at Ife in Nigeria"}
- card: great-zimbabwe
  fact: "In 1980 the independent state took its name from the ruins"
  sources:
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "after which the modern state of Zimbabwe is named"}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "After independence in 1980 ... After all, the nation had been named after this type of monumental archaeology"}

- card: mapungubwe-rhino
  fact: "Mapungubwe Hill is near the Shashe-Limpopo confluence where South Africa, Botswana and Zimbabwe meet"
  sources:
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "where the Shashe River enters the Limpopo, near the place where the modern borders of South Africa, Botswana and Zimbabwe meet"}
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "on the border between South Africa , Zimbabwe and Botswana ... close to the point where the Limpopo and Shashe Rivers meet"}
- card: mapungubwe-rhino
  fact: "In the 13th century it was a capital trading gold and ivory"
  sources:
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "The civilization thrived as a sophisticated trading center from around 1200 to 1300 AD, trading gold and ivory"}
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "Mapungubwe was occupied between 1200 and 1300"}
    - {title: "The Presidency of South Africa: The Order of Mapungubwe", url: "https://thepresidency.gov.za/node/5274", quote: "served as the capital of the ancient Mapungubwe Kingdom"}
- card: mapungubwe-rhino
  fact: "Rulers lived on the hilltop set apart from commoners and were buried with gold"
  sources:
    - {title: "Jeff Guy, The Beginnings of Globalisation (SAHO, Ancient Civilizations and Global Trade, ch. 2)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-2-beginnings-globalisation-jeff-guy", quote: "Mapungubwe hill is an elite settlement ... protected and set apart by stone walls and passages. When its occupiers died, they were buried with rich gold ornaments"}
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "A large amount of artifacts from the royal family were discovered at Mapungubwe"}
- card: mapungubwe-rhino
  fact: "On 31 December 1932 a local man led van Graan, his son and three others up the hill; they found gold, dug into a grave, found gold rhinoceroses"
  sources:
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "The site was 'discovered' on 31 December 1932 , when a local informant, Mowena, led E.S.J. van Graan (farmer and prospector), his son and three others"}
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "Van Graan's son found some gold ... gold beads, bangles ... gold-plated rhinoceroses and, with further digging, a human skeleton. They were digging into a grave"}
- card: mapungubwe-rhino
  fact: "The party divided the gold; van Graan's son, a former UP student, alerted the university, which recovered the pieces and took over excavation"
  sources:
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "the group of five decided to divide the wealth ... Van Graan's son had been a student of archaeology at the University of Pretoria ... It tracked down the members of the party, retrieved the various gold pieces and secured permission to excavate"}
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "Van Graan's son recognized the academic value of the site and contacted the head History department at the University of Pretoria ... excavation rights were granted to the University of Pretoria"}
- card: mapungubwe-rhino
  fact: "The rhino is thin gold foil over a carved wooden core, fixed with tiny gold nails; the wood decayed"
  sources:
    - {title: "University of Pretoria Museums: Gold rhinoceros figure (Google Arts and Culture)", url: "https://artsandculture.google.com/asset/gold-rhinoceros-figure/owFMZ5MvsbYhOA", quote: "made of several pieces of thin gold foil, which was originally nailed onto a wooden carving ... holding it in place with tiny gold nails. The wooden core has since decayed"}
    - {title: "The Presidency of South Africa: The Order of Mapungubwe", url: "https://thepresidency.gov.za/node/5274", quote: "a figurine made of high-quality gold foil formed around a soft core (probably sculpted wood)"}
- card: mapungubwe-rhino
  fact: "The find was presented as a mystery and the digs were kept quiet until after 1994"
  sources:
    - {title: "Amanda Esterhuysen, It's a Mystery. Or is it? (SAHO, Ancient Civilizations and Global Trade, ch. 3)", url: "https://sahistory.org.za/archive/book-1-ancient-civilizations-and-global-trade-chapter-3-its-mystery-or-it-amanda", quote: "the discovery of the golden rhino at Mapungubwe in 1933 was presented as a \"mystery\" when it was announced in the press"}
    - {title: "South African History Online: Mapungubwe", url: "https://www.sahistory.org.za/place/mapungubwe", quote: "the archaeological digs and discoveries made by the University were kept fairly secret and were only made public after 1994"}
- card: mapungubwe-rhino
  fact: "The rhino is kept at the University of Pretoria"
  sources:
    - {title: "The Presidency of South Africa: The Order of Mapungubwe", url: "https://thepresidency.gov.za/node/5274", quote: "which was found on the hill and is treasured at the University of Pretoria"}
    - {title: "University of Pretoria Museums: Gold rhinoceros figure (Google Arts and Culture)", url: "https://artsandculture.google.com/asset/gold-rhinoceros-figure/owFMZ5MvsbYhOA", quote: "University of Pretoria Museums Pretoria, South Africa"}
- card: mapungubwe-rhino
  fact: "The rhino is central to the badge of the Order of Mapungubwe, a national order"
  sources:
    - {title: "The Presidency of South Africa: The Order of Mapungubwe", url: "https://thepresidency.gov.za/node/5274", quote: "Foregrounded on Mapungubwe Hill is the famous Mapungubwe rhino"}
    - {title: "South African History Online: Order of Mapungubwe", url: "https://sahistory.org.za/article/order-mapungubwe", quote: "Mapungubwe rhino - the now most well-known artifact found in a grave at the excavation site"}

- card: moshoeshoe
  fact: "The 1820s Lifaqane/Mfecane wars and migrations"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "known in SeSotho as the Difaqane/Lifaqane (Zulu: Mfecane)"}
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "a period known as the 'mfecane' or difaqane (1813-1830)"}
- card: moshoeshoe
  fact: "Born Lepoqo about 1786 at Menkhoaneng"
  sources:
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "Born c.1786 in Menkhoaneng, Northern part of present-day Lesotho ... His name was allegedly changed from Lepoqo"}
    - {title: "Sebinane Lekoekoe, The day in memory and honour of King Moshoeshoe I (UCT Archive and Public Culture)", url: "https://humanities.uct.ac.za/node/338409", quote: "Born in about 1786 in Menkhoaneng, he was raised and known as Lepoqo"}
- card: moshoeshoe
  fact: "He then led a small band"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "by Moshoeshoe and his then small band of followers"}
    - {title: "South African History Online: Basotho", url: "https://sahistory.org.za/article/basotho", quote: "became a minor chief leading a group of young men of the same age"}
- card: moshoeshoe
  fact: "Name Moshoeshoe after a raid, imitating the sound of a razor"
  sources:
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "after a successful raid in which he had sheared the beards of his victims – the word 'Moshoeshoe' represented the sound of the shearing"}
    - {title: "Sebinane Lekoekoe, The day in memory and honour of King Moshoeshoe I (UCT Archive and Public Culture)", url: "https://humanities.uct.ac.za/node/338409", quote: "named after the victory verse lyrics he composed after raiding 500 cattle ... imitating the scarping sound of the razor, 'shoe-shoe-shoe'"}
- card: moshoeshoe
  fact: "Butha-Buthe was attacked, among others by Sekonyela and the Batlokwa"
  sources:
    - {title: "South African History Online: Basotho", url: "https://sahistory.org.za/article/basotho", quote: "the tribe was still attacked by various other groups, like Sekonyela and the Tlokwa"}
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "Moshoeshoe and his people sought refuge in the mountain fortress of Butha Buthe, but found themselves besieged by Manthatisi, who had now been joined by her son Sekonyela"}
- card: moshoeshoe
  fact: "In 1824 he moved to Thaba Bosiu, a flat-topped hill ringed by cliffs"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "its occupation in the early months of 1824 by Moshoeshoe ... a steepsided, flat-topped plateau ... ringed by steep vertical cliffs"}
    - {title: "Sebinane Lekoekoe, The day in memory and honour of King Moshoeshoe I (UCT Archive and Public Culture)", url: "https://humanities.uct.ac.za/node/338409", quote: "Moshoeshoe and his people embarked on the great trek from Menkhoaneng to Thaba-Bosiu in 1824"}
- card: moshoeshoe
  fact: "Name 'mountain at night'; tradition that it grew more formidable after dark"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "'Mountain at Night'. This is explained by the legend that the feature ... assumes a far more formidable and impressive aspect when approached at night"}
    - {title: "Sebinane Lekoekoe, The day in memory and honour of King Moshoeshoe I (UCT Archive and Public Culture)", url: "https://humanities.uct.ac.za/node/338409", quote: "Thaba-Bosiu (translated mountain at night), according to the local popular belief was that this high mountain plateau elevated during night and took the shape of a high fortress"}
- card: moshoeshoe
  fact: "Mzilikazi's Ndebele failed to storm it; Moshoeshoe sent the retreating army cattle"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "posed by Mzilikazi's Ndebele ... were repulsed ... Tradition has it that Moshoeshoe sent a gift of oxen to the retreating enemy"}
    - {title: "South African History Online: Basotho", url: "https://sahistory.org.za/article/basotho", quote: "Thaba Bosiu was attacked by the Ndebele, who were defeated, and as they retreated Moshoeshoe sent them a diplomatic gift of cattle"}
- card: moshoeshoe
  fact: "Refugees joined and became the Basotho"
  sources:
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "Thaba Bosiu became a sanctuary ... for a steady stream of refugees ... they were beginning to refer to themselves as the Basotho"}
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "He united various groups of refugees during the Shaka wars ... into the Basotho nation"}
- card: moshoeshoe
  fact: "1868, after defeats by the Free State, he asked British protection; Basutoland became British"
  sources:
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "After a Basotho defeat in 1868, Moshoeshoe asked the British for protection. Basotholand became British territory"}
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "In 1868, following Moshoeshoe's urgent appeal for British intervention, Basutoland became a British protectorate"}
- card: moshoeshoe
  fact: "He died on 11 March 1870"
  sources:
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "Died 11 March 1870"}
    - {title: "Sebinane Lekoekoe, The day in memory and honour of King Moshoeshoe I (UCT Archive and Public Culture)", url: "https://humanities.uct.ac.za/node/338409", quote: "11th March marks the day on which Moshoeshoe died"}
- card: moshoeshoe
  fact: "His kingdom survived under British rule"
  sources:
    - {title: "South African History Online: King Moshoeshoe I", url: "https://www.sahistory.org.za/people/king-moshoeshoe-i", quote: "Moshoeshoe still managed to preserve his kingdom and his people's existence"}
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "It brought to an end over four decades of Sotho independence, but it was bet[ter than the alternative]"}
- card: moshoeshoe
  fact: "Wow: founder of Lesotho"
  sources:
    - {title: "South African History Online: Basotho", url: "https://sahistory.org.za/article/basotho", quote: "Moshoeshoe is seen as the father of the Basotho people ... and for creating Lesotho, the Basotho Kingdom"}
    - {title: "Military History Journal vol. 16 no. 3: Thaba Bosiu (South African Military History Society)", url: "https://www.samilitaryhistory.org/vol163ds.html", quote: "birthplace of the Sotho people and legendary bastion of their great founding Chief, Moshoeshoe"}

- card: mmanthatisi
  fact: "The Batlokwa lived near present-day Harrismith in the (Orange) Free State"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "Mokotjo, ruler of the Batlokwa of Tsotetsi, who also lived in what is now the Orange Free State, near present-day Harrismith"}
    - {title: "Grant Eldridge, Mmanthatisi, Women in World History (Encyclopedia.com)", url: "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/mmanthatisi-c-1780-c-1836", quote: "Born around 1780 in the present Orange Free State"}
- card: mmanthatisi
  fact: "Daughter of a Basia chief; married Mokotjo"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "The daughter of Mothaba of the Basia ... she married her cousin, Mokotjo, ruler of the Batlokwa"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "born in 1784 to Mothaha, chief of the Basia ethnic group ... sent to marry her cousin, Mokotjo"}
- card: mmanthatisi
  fact: "When he died, son Sekonyela was a boy; she became regent with full authority"
  sources:
    - {title: "Grant Eldridge, Mmanthatisi, Women in World History (Encyclopedia.com)", url: "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/mmanthatisi-c-1780-c-1836", quote: "their eldest son was only 13 years old, so Mmanthatisi became tribal regent with complete responsibility"}
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "ruled over the Batlokwa for her minor son, Sekonyela"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "she became regent for Sekonyela because he was too young to rule"}
- card: mmanthatisi
  fact: "The Hlubi, themselves displaced, drove the Batlokwa from their homeland"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "One branch of the lubi, led by Mpangazitha, reached the high veldt and drove the Tlokwa from their traditional homeland"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "the AmaHlubi broke their alliance, and they and the AmaNgwane attacked Mmanthatisi and the Batlokwa homeland"}
- card: mmanthatisi
  fact: "She led a long migration of raids and battles"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "the Tokwa, under Manthatist's leadership, moved westward to begin a predatory migration of their own"}
    - {title: "Grant Eldridge, Mmanthatisi, Women in World History (Encyclopedia.com)", url: "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/mmanthatisi-c-1780-c-1836", quote: "after much fighting, the Tlokwa migrated"}
- card: mmanthatisi
  fact: "She planned campaigns rather than fighting in them"
  sources:
    - {title: "Grant Eldridge, Mmanthatisi, Women in World History (Encyclopedia.com)", url: "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/mmanthatisi-c-1780-c-1836", quote: "Mmanthatisi planned military operations for the Tlokwa, although she did not personally participate"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "Mmanthatisi never again physically led troops in battle, but she is credited with planning the strategies"}
- card: mmanthatisi
  fact: "Her people became known as 'Mantatees' after her"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "she was responsible for the Batlokwa being given the name \"Mantatees.\""}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "her troops began calling themselves Manthatisis"}
- card: mmanthatisi
  fact: "In 1824, with Sekonyela, she besieged Moshoeshoe at Butha-Buthe and he moved to Thaba Bosiu"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "besieged by Manthatisi, who had now been joined by her son Sekonyela, obliging him and his followers to establish themselves on a more impregnable mountain fortress known as Thaba Bosiu"}
    - {title: "South African History Online: Basotho", url: "https://sahistory.org.za/article/basotho", quote: "attacked by various other groups, like Sekonyela and the Tlokwa. Moshoeshoe didn't feel safe at Butha Buthe any longer"}
- card: mmanthatisi
  fact: "In 1824 she handed power to her son"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "from 1813 until about 1824, when her son assumed power"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "In 1824, Mmanthatisi turned her authority over to her son, Sekonyela"}
- card: mmanthatisi
  fact: "The Batlokwa settled in the Caledon valley in today's Lesotho; she lived on a hilltop stronghold"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "the Tlokwa themselves began to settle down in the Caledon Valley in what is now Lesotho, Manthatisi herself occupying a mountain stronghold named Marabeng"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "She spent the last 23 years of her life in semi-exile in neighboring Lesotho, residing in an isolated hilltop fortress"}
- card: mmanthatisi
  fact: "Dispute: dates of regency and death differ"
  sources:
    - {title: "Molapatene Ramusi, Manthatisi, Encyclopaedia Africana Dictionary of African Biography", url: "https://encyclopaediaafricana.com/?p=16544", quote: "Manthatisi (circa 1781-circa 1836) ... her husband's death in about 1817"}
    - {title: "Samuel Momodu, Mmanthatisi (1784-1847), BlackPast.org", url: "https://blackpast.org/global-african-history/mmanthatisi-1784-1847", quote: "Mokotjo, died in 1813 ... Mmanthatisi died in 1847"}
    - {title: "Grant Eldridge, Mmanthatisi, Women in World History (Encyclopedia.com)", url: "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/mmanthatisi-c-1780-c-1836", quote: "died around 1836"}

- card: rain-queen
  fact: "The Balobedu (Lobedu) live near Modjadjiskloof, Limpopo; their hereditary ruler, the Modjadji, is known as a rain-maker"
  sources:
    - {title: "Patricia Davison and George Mahashe, Visualizing the Realm of a Rain-Queen (SAHO archive PDF)", url: "https://sahistory.org.za/sites/default/files/archive_files/Visualizing_the_Realm_of_a_Rain_Queen_Th.pdf", quote: "the Lobedu people of the north-eastern Transvaal of South Africa (now in the province of Limpopo), whose ruler, Modjadji, was widely known as a rain-maker"}
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "with claims of mystical rainmaking powers, is the hereditary ruler ofthe Balobedu ... situated at Khetlhakone Village outside Modjadjiskloof in Limpopo"}
- card: rain-queen
  fact: "The Kriges did fieldwork in the 1930s; their book The Realm of a Rain-Queen appeared in 1943 and is still in circulation"
  sources:
    - {title: "Patricia Davison and George Mahashe, Visualizing the Realm of a Rain-Queen (SAHO archive PDF)", url: "https://sahistory.org.za/sites/default/files/archive_files/Visualizing_the_Realm_of_a_Rain_Queen_Th.pdf", quote: "In 1943 their ethnographic monograph, 'The Realm of a Rain-Queen ...', was published and has remained in circulation ever since"}
    - {title: "Mail & Guardian, Kalay Vani Nair: New Rain Queen to be crowned (2003)", url: "https://mg.co.za/article/2003-04-04-new-rain-queen-to-be-crowned", quote: "\"The Realm of the Rain Queen\", written by the late JD Krige and E Jensen Krige after they conducted a study of the people during the 1920s and 1930s"}
- card: rain-queen
  fact: "Women ruled the Balobedu for about two centuries"
  sources:
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "threatened the end of 200 years of rule by women in the Balobedu nation"}
    - {title: "Letaba Herald (The Citizen), Anwen Mojela: Battle for Modjadji 'rain' throne continues (2023)", url: "https://www.citizen.co.za/letaba-herald/news-headlines/local-news/2023/02/20/battle-for-modjadji-rain-throne-continues/", quote: "\"For 200 years, the Bolobedu nation was ruled by women.\""}
- card: rain-queen
  fact: "Queen Makobo Modjadji VI died in 2005; her daughter Masalanabo was the heir"
  sources:
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "Queen Masalanabo Modjadji VII takes over from her late mother, Queen Makobo Modjadji VI, who died in 2005"}
    - {title: "SABC News, Pimani Baloyi: No legal basis to deny Queen Masalanabo her recognition (2026)", url: "https://www.sabcnews.com/sabcnews/no-legal-basis-to-deny-queen-masalanabo-her-recognition-as-monarch/", quote: "the Modjadji Royal family repeatedly identified Masalanabo as the rightful heir between 2005 and 2025"}
- card: rain-queen
  fact: "She was a minor; her uncle Prince Mpapatla acted as regent"
  sources:
    - {title: "SAnews: Queen Masalanabo Modjadji legally recognised (13 December 2024)", url: "https://www.sanews.gov.za/south-africa/queen-masalanabo-modjadji-legally-recognised", quote: "His Royal Highness, Prince Mpapatla Modjadji – the now Queen's maternal uncle – has held the fort for her as a Regent until she turned 18"}
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "Queen Masalanabo was a minor, and her uncle, Prince Mpapatla Modjadji, acted as her regent"}
- card: rain-queen
  fact: "In October 2022 a faction of the royal council crowned her elder brother Prince Lekukela"
  sources:
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "In October 2022, the Modjadji Royal Council hosted a traditional ceremony inaugurating Prince Lekukela as the next king"}
    - {title: "Letaba Herald (The Citizen), Anwen Mojela: Battle for Modjadji 'rain' throne continues (2023)", url: "https://www.citizen.co.za/letaba-herald/news-headlines/local-news/2023/02/20/battle-for-modjadji-rain-throne-continues/", quote: "her elder brother, Prince Lekukela Modjadji was crowned in October last year during a traditional coronation in Khetlhakoni village"}
- card: rain-queen
  fact: "Masalanabo came of age in January 2023"
  sources:
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "with her coming of age on January 20, 2023, her uncle's regency came to an end"}
    - {title: "Letaba Herald (The Citizen), Anwen Mojela: Battle for Modjadji 'rain' throne continues (2023)", url: "https://www.citizen.co.za/letaba-herald/news-headlines/local-news/2023/02/20/battle-for-modjadji-rain-throne-continues/", quote: "Princess Masalanabo came of age in January this year when she turned eighteen"}
- card: rain-queen
  fact: "On 13 December 2024 Ramaphosa recognised her as Queen Modjadji VII"
  sources:
    - {title: "SAnews: Queen Masalanabo Modjadji legally recognised (13 December 2024)", url: "https://www.sanews.gov.za/south-africa/queen-masalanabo-modjadji-legally-recognised", quote: "Friday, December 13, 2024 President Cyril Ramaphosa has legally recognised Princess Masalanabo Modjadji as the Queen of the Balobedu Queenship"}
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "President Cyril Ramaphosa has officially recognised Princess Masalanabo Modjadji VII as the Queen of the Balobedu Royal nation"}
- card: rain-queen
  fact: "It is the only legally recognised queenship in South Africa"
  sources:
    - {title: "SAnews: Queen Masalanabo Modjadji legally recognised (13 December 2024)", url: "https://www.sanews.gov.za/south-africa/queen-masalanabo-modjadji-legally-recognised", quote: "the only legally recognised Queenship in South Africa"}
    - {title: "Pretoria News / The Star, Mashudu Sadike: New era for the Balobedu Royal Nation (2024)", url: "https://pretorianews.co.za/the-star/news/2024-12-17-new-era-for-the-balobedu-royal-nation-as-queen-masalanabo-modjadji-vii-officially-recognised", quote: "Masalanabo Modjadji, South Africa's only female traditional ruler"}
- card: rain-queen
  fact: "Her brother and uncle challenged the decision in court"
  sources:
    - {title: "SABC News, Pimani Baloyi: No legal basis to deny Queen Masalanabo her recognition (2026)", url: "https://www.sabcnews.com/sabcnews/no-legal-basis-to-deny-queen-masalanabo-her-recognition-as-monarch/", quote: "Some members of the Modjadji Royal family including the Queen's uncle and brother are challenging her ascension to the throne"}
    - {title: "Scrolla.Africa: Queen Modjadji's court win (3 June 2026)", url: "https://scrolla.africa/queen-modjadjis-court-win-means-no-balobedu-child-enters-adulthood-without-her-say/", quote: "The court dismissed Prince Lekukela Modjadji's bid to remove his sister"}
- card: rain-queen
  fact: "In 2026 the High Court in Pretoria dismissed the brother's urgent bid; the recognition challenge was still being argued"
  sources:
    - {title: "Scrolla.Africa: Queen Modjadji's court win (3 June 2026)", url: "https://scrolla.africa/queen-modjadjis-court-win-means-no-balobedu-child-enters-adulthood-without-her-say/", quote: "The court dismissed an urgent application by Prince Lekukela Modjadji to remove his sister ... That recognition remains before the High Court"}
    - {title: "SABC News, Pimani Baloyi: No legal basis to deny Queen Masalanabo her recognition (2026)", url: "https://www.sabcnews.com/sabcnews/no-legal-basis-to-deny-queen-masalanabo-her-recognition-as-monarch/", quote: "3 September 2026 ... the argument the President's legal team presented to the High Court in Pretoria, defending his December 2024 decision"}

- card: nehanda
  fact: "In the 1890s Rhodes's British South Africa Company occupied the plateau, taking land and cattle, imposing taxes"
  sources:
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "The causes of the revolt included a complex web of grievances, including dispossession, repression, land, cattle and taxes ... the British South Africa Company (BSAC)"}
    - {title: "Webber Ndoro, The Preservation of Great Zimbabwe, ICCROM Conservation Studies 4 (2005)", url: "https://www.iccrom.org/sites/default/files/publications/2019-11/iccrom_ics04_zimbabwe_en.pdf", quote: "the pioneer column that entered Zimbabwe in 1890 ... the British South Africa Company (BSAC)"}
- card: nehanda
  fact: "Shona ancestral spirits spoke through mediums"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "After her death, she became a mhondoro spirit, and this spirit possessed a number of mediums"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "These figures were not royal or military leaders, but spirit mediums"}
- card: nehanda
  fact: "Charwe of the Mazowe valley was the medium of the Nehanda mhondoro spirit"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "the medium of the Nehanda spirit of the Mazowe valley ... one medium, Charwe"}
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "Nehanda Charwe Nyakasikana ... She was an influential spirit medium"}
- card: nehanda
  fact: "The central Shona rose in June 1896; she helped organise resistance"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "Charwe, was responsible for the organization of resistance to the government of the British South Africa Company ... This resistance began in June 1896"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "When the revolt spread to Mashonaland starting 14 June 1896, Nehanda ... she bravely mobilised people in Mashonaland to revolt"}
- card: nehanda
  fact: "Native Commissioner Henry Pollard was killed"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "the killing of H.H. Pollard, Kunyaira , the extremely oppressive Native Commissioner of the area"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "for allegedly murdering Native Commissioner Henry Hawkins Pollard"}
- card: nehanda
  fact: "She was captured in 1897"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "until her capture in late 1897"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "Nehanda was arrested with Kaguvi in 1897"}
- card: nehanda
  fact: "Tried in March 1898 in Salisbury/Harare, convicted of Pollard's murder, sentenced to death"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "Tried and sentenced to death in March 1898"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "brought to trial on 2 March 1898 ... Watermeyer was based in Harare ... where he sentenced Nehanda to death ... Nehanda and three others were charged with the murder of Pollard"}
- card: nehanda
  fact: "She refused to convert to Christianity and was hanged in 1898"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "she refused to convert to Christianity and struggled right up to the moment when she was hanged"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "Fr Richartz ... tried to convert both Nehanda and Kaguvi ... Nehanda was defiant to the end ... hanged ... 27 April 1898"}
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "was hanged in 1898 for leading an anti-colonial rebellion"}
- card: nehanda
  fact: "She inspired the 1970s war that ended Rhodesia"
  sources:
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "Nehanda became a symbol of resistance and inspiration for the 1970s bush war that brought an end to the white-minority ruled country of Rhodesia"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "Nehanda's legacy continued to be linked to the theme of resistance, particularly during the liberation struggle mainly on the part of Zanu and Zanla"}
- card: nehanda
  fact: "After 1980 a major road and a hospital maternity wing in Harare were named after her"
  sources:
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "a major road and the maternity wing of one of the southern African country's biggest hospitals in the capital, Harare, are named after her"}
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "She has been commemorated since 1980 in statues, street names, a hospital"}
- card: nehanda
  fact: "In May 2021 a bronze statue was unveiled near where she was hanged"
  sources:
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "May 25, 2021 ... unveiled a towering bronze statue ... close to the place where Nehanda was hanged"}
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "Mnangagwa this week officially unveiled the statue ... coincided with the Africa Day commemorations"}
- card: nehanda
  fact: "She is the best-known symbol of resistance in modern Zimbabwe"
  sources:
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "the figure of \"Mbuya Nehanda\" has become the best-known popular symbol of resistance to colonial rule in modern Zimbabwe"}
    - {title: "AP, Farai Mutsaka: Zimbabwe unveils statue honoring anti-colonialist heroine (2021)", url: "https://www.clickorlando.com/news/world/2021/05/25/zimbabwe-unveils-statue-honoring-anti-colonialist-heroine/", quote: "Nehanda became a symbol of resistance"}
- card: nehanda
  fact: "Dispute: Beach doubted her guilt and the fairness of the trial"
  sources:
    - {title: "The NewsHawks: Justice John Philip Watermeyer and the trial of Mbuya Nehanda (2021)", url: "https://thenewshawks.com/long-read-justice-john-philip-watermeyer-and-the-trial-of-mbuya-nehanda", quote: "Historian David N Beach raises serious doubts about the fairness of Nehanda's trial. He believes that she may have been wrongly convicted"}
    - {title: "D. N. Beach, An Innocent Woman, Unjustly Accused?, History in Africa 25 (1998), extract (Cambridge Core)", url: "https://doi.org/10.2307/3172179", quote: "An Innocent Woman, Unjustly Accused? Charwe, Medium of the Nehanda Mhondoro Spirit"}

- card: mekatilili
  fact: "The Giriama live in the hinterland of the Kenya coast; farmers and traders"
  sources:
    - {title: "UC Press: Cynthia Brantley, The Giriama and Colonial Resistance in Kenya, 1800-1920 (description)", url: "https://www.ucpress.edu/books/the-giriama-and-colonial-resistance-in-kenya-1800-1920/pdf", quote: "The Giriama of Kenya's coastal hinterland ... The Giriama, prosperous producers and traders"}
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "Life for the Giriama at that time revolved around cultivating maize and millet for subsistence. Cashew nuts, mangoes and coconuts ... were for trading"}
- card: mekatilili
  fact: "The British wanted them as labour for coastal European plantations and demanded hut tax"
  sources:
    - {title: "UC Press: Cynthia Brantley, The Giriama and Colonial Resistance in Kenya, 1800-1920 (description)", url: "https://www.ucpress.edu/books/the-giriama-and-colonial-resistance-in-kenya-1800-1920/pdf", quote: "In 1912 the British colonial authorities earmarked the Giriama as a key source of labor for the plantations Europeans were trying to develop along the coast"}
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "opposed everything – hut tax, forced labour on their rubber and sisal plantations"}
    - {title: "Zarina Patel, Mekatilili: local heroine (Open University, Ferguson Centre)", url: "https://university.open.ac.uk/arts/research/ferguson-centre/node/254", quote: "to demand both hut and personal taxes ... to compel our countrymen to work for them"}
- card: mekatilili
  fact: "Mekatilili travelled with elder Wanje wa Mwadorikola urging resistance"
  sources:
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "Her key supporter was Wanje wa Mwadorikola ... Mekatilili traversed the Kaya Giriama area, mobilising the community"}
    - {title: "Zarina Patel, Mekatilili: local heroine (Open University, Ferguson Centre)", url: "https://university.open.ac.uk/arts/research/ferguson-centre/node/254", quote: "the Patriot Wanje wa Mwadorikola, [who worked with her] to warn the Giriama"}
- card: mekatilili
  fact: "Late 1913 both were arrested and sent to Kisii in western Kenya for five years"
  sources:
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "Mekatilili and Wanje were found and arrested in Sabaki and sentenced to five years' exile in Kisii, western Kenya"}
    - {title: "Zarina Patel, Mekatilili: local heroine (Open University, Ferguson Centre)", url: "https://university.open.ac.uk/arts/research/ferguson-centre/node/254", quote: "17th October 1913 ... arrested Mekatilili and Wanje wa Mwadorikola ... [taken to] Kisii, where she was imprisoned for 5 years"}
- card: mekatilili
  fact: "In 1914 they escaped and returned to the coast"
  sources:
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "Mekatilili and Wanje escaped from exile and walked back home"}
    - {title: "Zarina Patel, Mekatilili: local heroine (Open University, Ferguson Centre)", url: "https://university.open.ac.uk/arts/research/ferguson-centre/node/254", quote: "20th April 1914 ... disappeared from jail and travelled to the Coast"}
- card: mekatilili
  fact: "In August 1914 the Giriama rose; British troops burned homesteads and a sacred kaya"
  sources:
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "On 4 August 1914, tensions between the Giriama and the British exploded into full-blown war ... burning villages and granaries ... Kaya Fungo, a sacred shrine, was bombed"}
    - {title: "Zarina Patel, Mekatilili: local heroine (Open University, Ferguson Centre)", url: "https://university.open.ac.uk/arts/research/ferguson-centre/node/254", quote: "the holy site of Kaya Kaloleni [was burned in August 1914]"}
- card: mekatilili
  fact: "Military force broke the resistance"
  sources:
    - {title: "UC Press: Cynthia Brantley, The Giriama and Colonial Resistance in Kenya, 1800-1920 (description)", url: "https://www.ucpress.edu/books/the-giriama-and-colonial-resistance-in-kenya-1800-1920/pdf", quote: "Finally, military action brought defeat to the Giriama"}
    - {title: "Kenya Yearbook Editorial Board: Mekatilili wa Menza, matriarch of Kenya's liberation war (2022)", url: "https://sectors.kenyayearbook.go.ke/?p=2240", quote: "The resistance was finally subdued in October 1915"}
- card: mekatilili
