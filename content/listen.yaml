  hurston:
    - audio_url: "https://tile.loc.gov/storage-services/media/ingested/api/loc.afc.afcflwpa.3136b1.mp3"
      kind: field
      title: "Mule on the Mount"
      channel: "Library of Congress"
      note: "Hurston sings a track-lining work song she learned in Eatonville from George Thomas, keeping the rhythm railroad crews used; the LOC note calls it the most widely distributed work song in the United States."
      noteRu: "Хёрстон поёт рабочую песню путейцев, которую переняла в Итонвилле у Джорджа Томаса, и держит тот самый ритм, под который бригады выравнивали рельсы. В примечании Библиотеки Конгресса она названа самой распространённой рабочей песней в США."
  jazz:
    youtube: "BTxhgmk_ofk"
