# Recordings to listen to, by card or roots artist: the official upload first,
# then field recordings (kind: field) from the archives listed in
# content/listen-folk.yaml, which keeps their sources and rights.
# Every YouTube id was checked against YouTube oEmbed (HTTP 200) on 2026-11-13;
# title and channel are the oEmbed title and author_name as returned.
cards:
  afrobeat:
    youtube: "Qj5x6pbJMyU"
    title: "Fela Kuti - Zombie"
    channel: "Fela Kuti"
    note: "Fela Kuti and Africa 70, \"Zombie\" (1976), the album that attacked the military"
  amen-break:
    youtube: "HrrWhCbZAyY"
    title: "Amen Brother"
    channel: "The Winstons - Topic"
    note: "The Winstons, \"Amen, Brother\" (1969); the drum break comes at about 1:26"
    start: 85
  banjo:
    - youtube: "aQkcPSpWWCo"
      title: "“Cripple Creek” performed by Rhiannon Giddens, Banjo l Met Music"
      channel: "The Met"
      note: "Rhiannon Giddens plays \"Cripple Creek\" on the banjo, filmed in the Met's musical-instrument galleries (2018)"
    - youtube: "MuDbKpv90Ys"
      kind: field
      title: "Sid Hemphill: The Carrier Line (1942)"
      channel: "Lomax Film Collection"
      note: "Hemphill's Black string band from the Mississippi Hill Country, fiddle and banjo over a bass drum, plays \"The Carrier Line\", one of Hemphill's own blues ballads; Lomax's 1942 discs were the first recordings of the region's local music."
      noteRu: "Чёрный струнный оркестр Сида Хемпхилла из холмов Миссисипи, скрипка и банджо поверх большого барабана, играет «The Carrier Line», одну из блюзовых баллад самого Хемпхилла. Записи Ломакса 1942 года стали первыми записями здешней музыки."
    - youtube: "TTZToDDPF1E"
      kind: field
      title: "The Coo Coo (Coo Coo Bird)"
      channel: "Release - Topic"
      note: "An instrumental \"Coo Coo\" on a fretless banjo, its gapped scale and near-neutral seventh pointing, in the annotators' view, back toward Africa."
      noteRu: "Инструментальная «Кукушка» на безладовом банджо; её звукоряд с пропусками и почти нейтральной септимой, по мнению составителей, отсылает к Африке."
  big-mama-thornton:
    youtube: "aKicGqIMpqk"
    title: "Hound Dog"
    channel: "Big Mama Thornton - Topic"
    note: "\"Hound Dog\", Big Mama Thornton's Peacock recording (1953)"
  blues:
    - youtube: "cSuTTSOctGw"
      title: "W.C. Handy \"St. Louis Blues\" On The Ed Sullivan Show"
      channel: "The Ed Sullivan Show"
      note: "W. C. Handy, \"St. Louis Blues\", on The Ed Sullivan Show"
    - youtube: "sRAXrVt3Ass"
      kind: field
      title: "Country Blues (No. 1) (Plantation Recording)"
      channel: "Muddy Waters - Topic"
      note: "Muddy Waters's first recording, made at home on Stovall's plantation for the Library of Congress, a bottleneck blues and an early version of a song he later recorded commercially in Chicago."
      noteRu: "Первая запись Мадди Уотерса, сделанная для Библиотеки Конгресса у него дома на плантации Стовалла: блюз с бутылочным горлышком, ранний вариант песни, которую он потом запишет в Чикаго для пластинки."
    - youtube: "9pdMzkb1HeE"
      kind: field
      title: "Black Woman"
      channel: "Rich Amerson - Topic"
      note: "An unaccompanied \"field blues\" with moans, falsetto and a preacher's \"ah-hmm\"; Courlander heard in it the link between plantation field calls and city blues."
      noteRu: "«Полевой блюз» без аккомпанемента, со стонами, фальцетом и проповедническим «а-хм». Курлендер слышал в нём связующее звено между плантационными кличами и городским блюзом."
  bridgetower:
    youtube: "s2BYvSzZ_i4"
