      title: "Swing Low, Sweet Chariot"
      channel: "The Fisk Jubilee Singers - Topic"
      note: "Fisk Jubilee Singers, \"Swing Low, Sweet Chariot\" (recorded 1909–1911)"
    - audio_url: "https://tile.loc.gov/storage-services/media/afc/lomax/afc1939001_02684a1.mp3"
      kind: field
      title: "Amazing Grace"
      channel: "Library of Congress"
      note: "Three Alabama singers draw out the hymn in the slow, ornamented lined-hymn style of Black congregations, each syllable stretched over many notes."
      noteRu: "Трое певцов из Алабамы протяжно ведут гимн в медленной, богато украшенной манере «линованного» пения чёрных общин, растягивая каждый слог на множество нот."
    - youtube: "NupAm6QnpCA"
      kind: field
      title: "Bessie Jones and the Georgia Sea Island Singers: Yonder Come Day (1959)"
      channel: "Lomax Film Collection"
      note: "The singers talk about Watch Night, the New Year's Eve vigil, and then sing the song that greeted the dawn of the new year."
      noteRu: "Певцы рассказывают о Ночи бдения, новогодней службе до рассвета, и поют песню, которой встречали первую зарю нового года."
  steelpan:
    - youtube: "-XTiD9_gsLU"
      title: "Hold 'Em Joe"
      channel: "Brute Force Steel Band - Topic"
      note: "Brute Force Steel Band of Antigua, \"Hold 'Em Joe\" (Cook Records, 1955)"
    - youtube: "5C7UswyIIW8"
      kind: field
      title: "Yankees Gone"
      channel: "Release - Topic"
      note: "A steel band plays down the street at Carnival 1956 while the crowd sings along to 'Jean and Dinah', the Mighty Sparrow calypso that won that year's crown."
      noteRu: "Стил-бэнд идёт по улице на карнавале 1956 года, и толпа подпевает «Джин и Дайне» — калипсо Майти Спэрроу, взявшему в тот год корону."
  sun-ra:
