    channel: "QueenLatifahVEVO"
    note: "Queen Latifah, \"U.N.I.T.Y.\" (1993)"
  nanny-of-the-maroons:
    - youtube: "FTkajdyFS0Q"
      kind: field
      title: "Grandy Nanny"
      channel: "Release - Topic"
      note: "Kromanti drumming in speech mode on gumbe, grandy and kwat under a song that calls on Grandy Nanny; in Scott's Hall it traditionally opened every Kromanti Play."
      noteRu: "Барабаны кроманти — гумбе, гранди и кват — «говорят», а песня призывает Бабушку Нэнни; в Скоттс-Холле ею по традиции открывали каждое действо кроманти."
    - youtube: "l7s3lP7D4l0"
      kind: field
      title: "Abeng (Signaling Horn)"
      channel: "Release - Topic"
      note: "The cow-horn abeng, the Windward Maroons' signalling instrument, blown to usher in Christmas, the only time of year it may be sounded freely."
      noteRu: "Абенг, коровий рог — сигнальный инструмент наветренных маронов; здесь он возвещает Рождество, единственную пору года, когда в него можно трубить свободно."
  palmares:
    - youtube: "5u_qO9llq30"
      kind: field
      title: "Ladainha: Rei Zumbi dos Palmares"
      channel: "Grupo de Capoeira Angola Pelourinho - Topic"
      note: "A capoeira ladainha by Mestre Moraes in homage to Zumbi of Palmares, recorded for the 300th anniversary of Zumbi's death; berimbaus, pandeiros and atabaque behind the solo voice."
      noteRu: "Ладаинья местре Мораиса в честь Зумби из Палмариса, записанная к трёхсотлетию его гибели: за сольным голосом — беримбау, пандейру и атабаке."
