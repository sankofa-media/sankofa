    note: "Mahalia Jackson, \"Take My Hand, Precious Lord\" (Thomas A. Dorsey)"
  gullah:
    - youtube: "HocmOCVoVOE"
      kind: field
      title: "Mende Song"
      channel: "Release - Topic"
      note: "Mende women in a small Sierra Leone village sing in antiphony, soloists answered by a chorus of eleven: the language of the funeral song that survived among the Gullah, though this is a different song."
      noteRu: "Женщины менде из маленькой деревни в Сьерра-Леоне поют антифонно: солисткам отвечает хор из одиннадцати голосов. Это язык той погребальной песни, что сохранилась у гулла, хотя песня здесь другая."
    - youtube: "actgC4ZsMoA"
      kind: field
      title: "Join the Band (Live)"
      channel: "Georgia Sea Island Singers - Topic"
      note: "A secular work song of the St. Simons Island stevedores, led by John Davis with scat syllables and bluesy Sea Island harmonies."
      noteRu: "Светская рабочая песня грузчиков с острова Сент-Саймонс: ведёт Джон Дэвис, с распевом на слогах и блюзовой гармонией Морских островов."
    - youtube: "uxPU5517u8c"
      kind: field
      title: "McIntosh County Shouters: Gullah-Geechee Ring Shout from Georgia"
      channel: "Library of Congress"
      note: "A full ring shout: dancers move counterclockwise, a leader calls and the group answers, and a stick beaten on the wooden floor keeps the beat; the tradition, first described in detail during the Civil War, was thought extinct until its rediscovery in McIntosh County in 1980."
      noteRu: "Настоящий «ринг-шаут»: участники движутся по кругу против часовой стрелки, ведущий запевает, остальные отвечают, а палка, которой бьют по деревянному полу, держит ритм. Обычай, подробно описанный ещё в годы Гражданской войны, считали исчезнувшим, пока в 1980 году его не нашли в округе Макинтош."
  highlife:
    youtube: "OVB8isxRngs"
