  liberia:
    - youtube: "rYOwD0r5wDo"
      kind: field
      title: "Loma (Buzi) Song with Fanga Drums"
      channel: "Release - Topic"
      note: "Two Loma drummers tap the wooden shells of their fanga drums, then move to the heads and bend the pitch by squeezing the lacing with an elbow: music of the interior peoples whom the Americo-Liberian state governed."
      noteRu: "Двое барабанщиков лома сначала постукивают по деревянным корпусам барабанов фанга, потом переходят на мембраны и меняют высоту звука, зажимая шнуровку локтем. Это музыка народов внутренних районов, которыми управляло государство американо-либерийцев."
  misogyny-in-hip-hop:
    youtube: "f8cHxydDb7o"
