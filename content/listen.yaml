  candomble:
    - youtube: "TmwHfoL_iqU"
      kind: field
      title: "Agolonã"
      channel: "Release - Topic"
      note: "The stately processional rhythm of Ketu candomblé that greets the orixás when the possessed initiates return in their gods' clothing; one of the earliest recordings of candomblé, made by the Herskovitses for the Library of Congress."
      noteRu: "Торжественный шествующий ритм кандомбле кету, которым встречают ориша, когда одержимые посвящённые возвращаются в одеждах своих богов; одна из самых ранних записей кандомбле, сделанная Херсковицами для Библиотеки Конгресса."
  capoeira:
    - youtube: "_Ut0NCthq8c"
      title: "Banguela"
      channel: "Mestre Bimba - Topic"
      note: "Mestre Bimba, \"Banguela\", from Curso de Capoeira Regional (capoeira regional berimbau toque)"
    - youtube: "9QQMsl9UQXg"
      kind: field
      title: "Toques Tradicionais: Cavalaria (Aviso)"
      channel: "Grupo de Capoeira Angola Pelourinho - Topic"
      note: "Cavalaria, the berimbau rhythm that imitates horses' hooves and was traditionally played to warn players of a raid by mounted police."
      noteRu: "Кавалария — ритм беримбау, подражающий стуку копыт: по традиции им предупреждали игроков о налёте конной полиции."
  chicago-house:
