  sunjata:
    - youtube: "nuA0hDluS04"
      title: "The Sunjata epic"
      channel: "British Library"
      note: "Extract from a performance of the Sunjata epic: Hawa Kassé Made Diabaté (voice), Fode Lassana Diabaté (balafon), Chérif Keita (narrator)"
    - youtube: "xXuVykFNCaY"
      kind: field
      title: "Sunjata (Sauta Tuning)"
      channel: "Foday Musa Suso - Topic"
      note: "The standard kora piece in honour of Sunjata Keita: the Gambian jali Foday Musa Suso sings only a few lines and spends the rest on variations over the kumbengo accompaniment."
      noteRu: "Каноническая пьеса для коры в честь Сунджаты Кейты. Гамбийский джали Фоде Муса Сусо поёт всего несколько строк, а остальное время отдаёт вариациям поверх аккомпанемента кумбенго."
    - youtube: "27Bo2_e_bVk"
      kind: field
      title: "The Cultural Space of Sosso-Bala"
      channel: "UNESCO"
      note: "The balafon said to have belonged to Sumaoro Kanté, Sunjata's enemy, kept in a hut at Nyagassola by the Kouyaté griots, who still play it on great occasions."
      noteRu: "Балафон, который, по преданию, принадлежал Сумаоро Канте, противнику Сунджаты. Его хранят в хижине в Ньягассоле гриоты Куяте и до сих пор играют на нём по большим праздникам."
  talking-drums:
    - youtube: "QDm6V_MvMVg"
      title: "Dundun Drums and Shekere Rattles (3)"
      channel: "Release - Topic"
      note: "Yoruba dùndún drummers with shekere, from Drums of the Yoruba of Nigeria (Folkways, 1953)"
    - youtube: "0abB33q-J68"
      kind: field
      title: "Talking Drum"
      channel: "Release - Topic"
      note: "A praise text is spoken and then drummed on a pair of atumpan, so you can hear the tones of spoken Twi turn into drumbeats; the Akan counterpart to the Yoruba dùndún."
      noteRu: "Хвалебный текст сначала произносят, а потом выбивают на паре барабанов атумпан, и слышно, как тоны разговорного языка тви превращаются в удары. Это аканская параллель йорубскому дундуну."
    - youtube: "65zuMHAQo7Y"
      kind: field
      title: "Ashanti: Atumpan"
      channel: "Release - Topic"
      note: "A pair of Asante atumpan, the royal drums played with hooked sticks, calls a village to a dance; the booklet calls it drum signalling rather than a drummed text."
      noteRu: "Пара атумпан, царских барабанов асанте, на которых играют изогнутыми палочками, созывает деревню на танец. Буклет называет это скорее барабанным сигналом, чем отбитым текстом."
  vai-script:
    - youtube: "6oNYOsnsXh0"
      kind: field
      title: "Historical Song"
      channel: "Release - Topic"
      note: "A 52-second chorus, \"Koli munda\" (\"I am a young leopard, take me to the chief\"), which, according to the notes, commemorates Duala Bukele's invention of the Vai script and is sung when Vai unity matters."
      noteRu: "Хор длиной в пятьдесят две секунды, «Коли мунда» («Я молодой леопард, отведите меня к вождю»). По словам составителя, песня посвящена тому, как Дуала Букеле изобрёл письмо ваи, и звучит, когда народу ваи важно ощутить единство."
  work-songs:
    - youtube: "tLGeDY-w3p4"
      title: "Old Alabama"
      channel: "B.B And Six Others - Topic"
      note: "\"Old Alabama\", work song recorded by Alan Lomax at Parchman Farm, Mississippi (1947)"
    - audio_url: "https://tile.loc.gov/storage-services/media/afc/lomax/afc1939001_02663a3.mp3"
      kind: field
      title: "Cornfield holler"
      channel: "Library of Congress"
      note: "A solo field holler sung by a prisoner on an Arkansas prison farm; the Lomaxes noted the singer's own word for it, \"a sorrow song to make yo' heart feel sorry\"."
      noteRu: "Одинокий полевой клич заключённого с арканзасской тюремной фермы. Ломаксы записали, как назвал его сам певец: «печальная песня, чтоб сердцу стало жалко»."
    - youtube: "xpoLxDPV6aE"
      kind: field
      title: "Ain't No More Cane on the Brazos"
      channel: "Ernest \"Mexico\" Williams - Topic"
      note: "A sugar-cane gang song from the Texas convict-lease farms; in this take Lomax prompts Williams to add the verse \"you should have been here in 1910, they was driving the women just like the men\"."
      noteRu: "Песня каторжной бригады с тексасских сахарных плантаций. В этом дубле Ломакс просит Уильямса спеть куплет «был бы ты здесь в 1910-м: женщин гоняли наравне с мужчинами»."
    - youtube: "sv9qL6PaA-g"
      kind: field
      title: "Levee Camp Holler"
      channel: "B.A.M.A. - Topic"
      note: "A long, bending solo holler of the levee camps, sung by a Parchman prisoner and recorded on Alan Lomax's paper tapes."
      noteRu: "Протяжный, переливчатый одиночный клич из лагерей строителей дамб; его спел заключённый Парчмена, а Алан Ломакс записал на бумажную магнитную ленту."
    - youtube: "YFugnaMnJEI"
      kind: field
      title: "Bright Light Quartet: Menhaden fishermen's chantey medley (1960)"
      channel: "Lomax Film Collection"
      note: "Four Chesapeake menhaden fishermen sing the chanteys that timed the hauling of heavy purse nets, in close quartet harmony."
      noteRu: "Четверо чесапикских рыбаков, ловивших менхэдена, поют шанти, под которые вытягивали тяжёлые кошельковые сети, плотной квартетной гармонией."
