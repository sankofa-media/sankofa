# The Cabinet of Curiosities: the cabinet itself, its drawers and its keys.
# Caches (the containers hidden across the museum) are in caches.yaml, the
# things they hold in artifacts.yaml. Facts behind every story and note:
# content/ledger/cabinet.yaml; image rights: content/ledger/media-cabinet.yaml.
# The build (web/scripts/build-mechanics.ts) refuses a cabinet with dangling
# references, missing translations, facts without two sources or images
# without a rights record.
intro:
  en: >-
    In Milorad Pavić’s novel The Writing Box every drawer of a small box
    holds a story together with the things that belong to it, and the princes
    of old Europe kept kunstkammers, rooms of rarities. This cabinet is yours.
    Things are hidden across the museum: on a picture, in a word, in a drawer
    of the Workshop. Each lies in a chest, a box or a suitcase with a history
    of its own; open it, and what was inside comes here. Some drawers are locked, and their
    keys lie elsewhere.
  ru: >-
    В романе Милорада Павича «Ящик для письменных принадлежностей» каждое
    отделение маленького ящика хранит историю вместе с вещами, которые ей
    принадлежат, а государи старой Европы заводили у себя кунсткамеры —
    палаты редкостей. Этот кабинет — ваш. Вещи спрятаны по всему музею: на
    картинке, в слове, в ящике Мастерской. Каждая лежит в сундучке, коробке
    или чемодане, и у каждого из них своя история; откройте его, и то, что
    было внутри, перейдёт сюда. Некоторые ящики заперты, а ключи от них
    лежат в другом месте.

drawers:
  - id: letters
    label: {en: Letters, ru: Письма}
  - id: seas
    label: {en: Seas, ru: Моря}
  - id: seals
    label: {en: Seals and patents, ru: Печати и патенты}
  - id: voices
    label: {en: Voices, ru: Голоса}
  - id: underground
    label: {en: Underground, ru: Подполье}
    lock: brass-key
    intro:
      en: This drawer is hidden because its papers were once dangerous. William Still,
        who chaired the Vigilance Committee of the Pennsylvania Anti-Slavery
        Society, wrote down the name of each person who escaped through
        Philadelphia, and at times hid his journal in a nearby cemetery for fear of
        being charged under the Fugitive Slave Act of 1850. After slavery ended, he
        published his records.
      ru: Этот ящик потайной, потому что его бумаги когда-то были опасны. Уильям
        Стилл, возглавлявший Комитет бдительности Пенсильванского
        антирабовладельческого общества, записывал имя каждого, кто бежал через
        Филадельфию, и порой прятал свой журнал на соседнем кладбище — боялся, что
        его обвинят по Закону о беглых рабах 1850 года. А когда рабство отменили,
        он опубликовал свои записи.
    contents:
      - still-underground-rail-road
      - still-twenty-eight-fugitives
  - id: honest
    label: {en: Where these things came from, ru: Откуда эти вещи}
    intro:
      en: "European cabinets of curiosities, and the museums that grew out of them,
        gathered the world into rooms, and some of what came from Africa was taken
        by force. In February 1897 British troops took Benin City and seized the
        brass plaques and statues of the royal palace; many were shared out among
        officers as booty and later sold to museums. Now some of them are going
        back: in December 2022 the city of Cologne signed over to Nigeria all 92
        Benin works in its museum. This drawer keeps such things in the open, out of
        respect for the people who made them."
      ru: "Европейские кабинеты редкостей и выросшие из них музеи собирали весь мир
        под одной крышей, и кое-что из того, что попало в них из Африки, было взято силой. В
        феврале 1897 года британские войска захватили Бенин-Сити и забрали латунные
        пластины и статуи из королевского дворца; многие из них разделили между
        офицерами как трофеи, а потом продали музеям. Теперь часть этих вещей
        возвращается: в декабре 2022 года Кёльн передал Нигерии право собственности
        на все 92 бенинские работы из своего музея. Этот ящик ничего не прячет — из
        уважения к тем, кто эти вещи создал."
    contents:
      - museum-wormianum
      - benin-warrior-plaque
      - cologne-benin-transfer
  - id: returned
    label: {en: Returned home, ru: Вернувшееся домой}
    lock: returned-key
    # The honest drawer's inner drawer: the end of the chain from Benin City.
    within: honest
    intro:
      en: "This drawer keeps what has gone home. On 27 October 2021 Jesus College, Cambridge, handed the
        bronze cockerel Okukor to Nigeria's National Commission for Museums and Monuments, the first
        institution in the world to return a Benin Bronze. In October 2022 the Smithsonian transferred to
        Nigeria the ownership of 29 Benin works, and on 28 November the Horniman Museum in London, having
        given up ownership of its 72 Benin objects, handed back the first six. On 20 December 2022 the
        German foreign minister, Annalena Baerbock, handed over the first Benin works from German museums
        in Abuja."
      ru: "В этом ящике лежит то, что вернулось домой. 27 октября 2021 года Колледж Иисуса в Кембридже
        передал Национальной комиссии Нигерии по музеям и памятникам бронзового петуха Окукора и стал
        первым учреждением в мире, вернувшим бенинскую бронзу. В октябре 2022 года Смитсоновский институт
        передал Нигерии право собственности на 29 бенинских работ, а 28 ноября лондонский Музей Хорнимана,
        уступив Нигерии все свои 72 бенинских предмета, отдал первые шесть из них. 20 декабря 2022 года
        министр иностранных дел Германии Анналена Бербок привезла в Абуджу первые бенинские вещи из
        немецких музеев."
    contents:
      - horniman-orhogbua-plaque
      - linden-idia-mask
  - id: sky
    label: {en: Sky, ru: Небо}
  - id: heap
    label: {en: Unsorted, ru: Неразобранное}
    intro:
      en: >-
        Everything you find lands here first, unsorted. Pick through the heap, look at each
        thing closely and put it away in its drawer. A few things belong in
        no drawer at all; they stay in the heap.
      ru: >-
        Всё найденное сначала попадает сюда, ещё не разобранным. Переберите
        кучу, рассмотрите каждую вещь поближе и уберите её в положенный ящик.
        Кое-что не подходит ни к одному ящику — такие вещи так и остаются в
        куче.

keys:
  - id: brass-key
    name: {en: A small brass key, ru: Маленький латунный ключ}
    note:
      en: It is too small for a door. Somewhere there is a drawer with no label.
      ru: Для двери он слишком мал. Где-то есть ящик без надписи.
  - id: iron-key
    name: {en: A heavy iron key, ru: Тяжёлый железный ключ}
    note:
      en: A key for a strongbox, with a paper tag that has lost its writing.
      ru: Ключ от несгораемого ящика, с бумажной биркой, надпись на которой стёрлась.
  - id: bronze-key
    name: {en: A small cast-brass key, ru: Маленький литой латунный ключ}
    note:
      en: It was cast in a mould, not cut, the way the guild in Benin City still casts brass.
      ru: Его не выпилили, а отлили в форме — так, как до сих пор льют латунь мастера гильдии в Бенин-Сити.
  - id: leopard-key
    name: {en: A key with a leopard's head, ru: Ключ с головой леопарда}
    note:
      en: The leopard was the oba's animal; somewhere a queen mother's face is waiting for this key.
      ru: Леопард был зверем оба; где-то этого ключа ждёт лицо царицы-матери.
  - id: returned-key
    name: {en: A key on a luggage label, ru: Ключ на багажной бирке}
    note:
      en: The label has a single word on it, in a careful hand — Home.
      ru: На бирке аккуратным почерком выведено одно слово — «Домой».
  - id: ships-key
    name:
      en: A ship’s key with a black star
      ru: Корабельный ключ с чёрной звездой
    note:
      en: A brass key with a five-pointed star on its bow; it smells of salt and of something sewn from
        grass.
      ru: Латунный ключ с пятиконечной звездой на головке; от него пахнет солью и чем-то сшитым из травы.
  - id: lighthouse-key
    name:
      en: A lighthouse keeper’s key
      ru: Ключ смотрителя маяка
    note:
      en: A heavy key from the lamp room. Somewhere in the museum’s long list of names one name keeps a
        light burning.
      ru: Тяжёлый ключ от фонарного помещения. Где-то в длинном списке имён этого музея одно имя держит
        огонь зажжённым.
  - id: reel-key
    name:
      en: The reel key
      ru: Ключ-бобина
    note:
      en: A small key with a bow shaped like a reel of magnetic tape; it opens a box from a Hollywood recording session.
      ru: Маленький ключ, головка которого похожа на бобину с магнитной плёнкой; он открывает коробку с голливудской сессии звукозаписи.
  - id: needle-key
    name:
      en: The needle key
      ru: Ключ-игла
    note:
      en: A key as thin as a phonograph needle; it fits a road trunk that once travelled with a spaceship.
      ru: Ключ тонкий, как игла фонографа; он подходит к гастрольному сундуку, который когда-то ездил вместе с космическим кораблём.
  - id: storeroom-key
    name:
      en: The steward's storeroom key
      ru: Ключ стюарда от кладовой
    note:
      en: One of the keys entrusted to Baquaqua on the Lembrança; it opens the last shelf of the storeroom.
      ru: Один из ключей, доверенных Бакуакуа на «Лембрансе»; он отпирает последнюю полку кладовой.
