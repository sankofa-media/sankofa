  - id: inventors-strongbox
    kind: strongbox
    name:
      en: The Patent Office strongbox
      ru: Несгораемый ящик Патентного ведомства
    place:
      en: United States Patent Office, Washington, D.C.
      ru: Патентное ведомство США, Вашингтон
    time:
      en: 1877–1913
      ru: 1877–1913 годы
    story:
      en: "The records of the United States Patent Office noted an inventor's nationality but never his or
        her race, so no one could simply count the patents granted to Black inventors. Henry E.
        Baker, who joined the office in Washington as a copyist in 1877 and rose to assistant
        examiner, set out to do it by hand: he sent letter after letter to patent attorneys, company
        owners, newspaper editors and Black community leaders asking for names. In 1913 he reported
        some 800 patents verified as belonging to Black inventors. This box keeps three such
        patents, from the electric lamp to the front door."
      ru: "В записях Патентного ведомства США отмечали, из какой страны изобретатель, но никогда не
        отмечали его расу, поэтому сосчитать патенты чернокожих изобретателей было попросту нельзя.
        Генри Э. Бейкер, пришедший в вашингтонское ведомство переписчиком в 1877 году и
        дослужившийся до помощника эксперта, взялся сделать это вручную: письмо за письмом он
        рассылал патентным поверенным, владельцам компаний, редакторам газет и лидерам чернокожих
        общин и просил назвать имена. В 1913 году он сообщил примерно о 800 проверенных патентах
        чернокожих изобретателей. В этом ящике хранятся три таких патента — от электрической лампы
        до входной двери."
    # On a card of both copies: Lewis Latimer's card is in the male copy only.
    hidden:
      at: card-text
      card: garrett-morgan
      anchor:
        en: patented it in 1914
        ru: в 1914 году запатентовал его
    lock: iron-key
    contents:
