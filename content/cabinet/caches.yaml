# The caches: containers hidden across the museum, each with its own history.
# hidden: card-image (x/y in % of the picture), card-text or chapter-step
# (the words it hides in, per language), workshop (the drawer under an object).
# lock/gives: keys (cabinet.yaml). contents: per copy of the museum (both, m, f).
caches:
  - id: sea-chest
    kind: chest
    name:
      en: A Black sailor's sea chest
      ru: Сундучок чернокожего моряка
    place:
      en: Philadelphia and the Atlantic
      ru: Филадельфия и Атлантика
    time:
      en: "1810"
      ru: 1810 год
    story:
      en: "Among a Black sailor's things, few were worth as much as a single sheet of paper. In 1796
        Congress created the seaman's protection certificate to keep American sailors from being
        seized into the British navy; for a man of color it was also proof that he was free. Sailors
        kept the certificates themselves, while the sworn proofs filed to obtain them stayed in
        customs records now held by the National Archives. A borrowed certificate could open a road
        too: in 1838 Frederick Douglass walked to freedom with one."
      ru: "Среди вещей чернокожего моряка мало что стоило дороже одного листа бумаги. В 1796 году Конгресс
        ввёл охранное свидетельство моряка, чтобы американских матросов не забирали силой в
        британский флот; чернокожему оно к тому же доказывало, что он свободен. Сами свидетельства
        моряки держали при себе, а показания под присягой, поданные ради их получения, оставались в
        таможенных делах, которые теперь хранит Национальный архив США. Открыть дорогу могло и
        свидетельство, взятое взаймы: в 1838 году именно с таким ушёл на свободу Фредерик Дуглас."
    hidden:
      at: card-image
      card: equiano
      x: 60
      y: 49
    contents:
      both:
        - seamens-protection-dunbar
      m:
        - equiano-bahama-banks
      f:
        - seacole-british-hotel
    cards:
      - equiano
      - mary-seacole
      - paul-cuffe
      - douglass-covey
  - id: box-brown-box
    kind: box
    name:
      en: Henry Box Brown's box
      ru: Ящик Генри «Бокса» Брауна
    place:
      en: Richmond, Virginia, to Philadelphia
      ru: Из Ричмонда (Виргиния) в Филадельфию
    time:
      en: March 1849
      ru: март 1849 года
    story:
      en: On 23 March 1849 friends in Richmond, Virginia, sealed Henry Brown into a wooden box and sent it
        by rail to Philadelphia. About twenty-six hours later the box was opened at the office of
        the Pennsylvania Anti-Slavery Society, and Brown rose out of it alive and free. William
        Still was among the witnesses.
      ru: 23 марта 1849 года друзья в Ричмонде (Виргиния) запечатали Генри Брауна в деревянный ящик и
        отправили поездом в Филадельфию. Примерно через двадцать шесть часов ящик вскрыли в конторе
        Пенсильванского антирабовладельческого общества, и Браун поднялся из него живым и свободным.
        Среди свидетелей был Уильям Стилл.
    hidden:
      at: chapter-step
      chapter: v2
      anchor:
        en: logged hundreds of fugitives
        ru: вносил в свой журнал сотни беглецов
    gives:
      - brass-key
    contents:
      both:
        - box-brown-resurrection
        - box-brown-narrative-1849
    cards:
