  - id: record-crate
    kind: crate
    name:
      en: A Bronx DJ's record crate
      ru: Ящик с пластинками диджея из Бронкса
    place:
      en: 1520 Sedgwick Avenue, the Bronx
      ru: Седжвик-авеню, 1520, Бронкс
    time:
      en: 11 August 1973
      ru: 11 августа 1973 года
    story:
      en: A crate of records like the one Clive Campbell, DJ Kool Herc, brought to the recreation room of
        1520 Sedgwick Avenue on 11 August 1973. His sister Cindy was throwing a party to pay for
        back-to-school clothes and handed out invitations on index cards. He played mostly funk and
        soul, and stretched the drum breaks with a trick he called the merry-go-round.
      ru: С таким ящиком пластинок Клайв Кэмпбелл, он же диджей Кул Херк, спустился 11 августа 1973 года в
        комнату отдыха дома 1520 по Седжвик-авеню. Его сестра Синди устраивала вечеринку, чтобы
        заработать на одежду к школе, и раздавала приглашения на учётных карточках. Херк ставил в
        основном фанк и соул и растягивал барабанные брейки приёмом, который называл «каруселью».
    hidden:
