  - id: franklin-caravan-bag
    kind: bag
    name:
      en: A garment bag like those of the C. L. Franklin Gospel Caravan
      ru: Портплед вроде тех, что возил с собой «Госпельный караван К. Л. Франклина»
    place:
      en: Detroit and the road
      ru: Детройт и дорога
    time:
      en: The mid-1950s to 1972
      ru: Середина 1950-х — 1972 год
    story:
      en: A garment bag like those packed for the road by the C. L. Franklin Gospel Caravan. In the
        mid-1950s Aretha's father, the Detroit preacher C. L. Franklin, took his sermons on the road
        and toured the country for weeks at a time with his own revival show. Aretha travelled with
        him as a girl, singing and playing the piano. In 1972 she went back to church to record a
        gospel album, Amazing Grace, with her father and Clara Ward among the congregation; it has
        sold two million copies, more than any other gospel record.
      ru: Портплед вроде тех, что укладывали в дорогу артисты «Госпельного каравана К. Л. Франклина». В
        середине 1950-х отец Ареты, детройтский проповедник К. Л. Франклин, повёз свои проповеди по
        стране и неделями гастролировал с собственным шоу. Арета ездила с ним ещё девочкой, пела и
        играла на фортепиано. А в 1972 году она вернулась в церковь, чтобы записать госпел-альбом
        Amazing Grace, и среди прихожан сидели её отец и Клара Уорд. Пластинка разошлась тиражом в два
        миллиона экземпляров — больше, чем любая другая госпел-запись.
