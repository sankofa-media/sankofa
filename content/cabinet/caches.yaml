      en: In August and September 1977 NASA launched the two Voyager probes, and each carried a phonograph
        record etched in copper and plated with gold, sealed in an aluminium case together with a
        cartridge and a needle; instructions on the cover explain how to play it. A committee chaired
        by the astronomer Carl Sagan chose its greetings, its sounds of the Earth and its music. Among
        the music are Chuck Berry's "Johnny B. Goode" and "Dark Was the Night" by Blind Willie
        Johnson, a gospel singer who had played for coins on the streets of Texas towns.
      ru: В августе и сентябре 1977 года НАСА отправило в полёт два зонда «Вояджер», и каждый унёс с собой
        граммофонную пластинку — медную, с золотым покрытием, запечатанную в алюминиевый футляр вместе
        с головкой звукоснимателя и иглой; на крышке выгравировано, как эту пластинку проиграть.
        Приветствия, звуки Земли и музыку для неё отбирала комиссия во главе с астрономом Карлом
        Саганом. Среди музыки есть «Johnny B. Goode» Чака Берри и «Dark Was the Night» Слепого Уилли
