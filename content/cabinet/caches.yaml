      en: A car trunk like the one in which John A. Lomax drove a huge recording machine across the South.
        In 1933 he and his teenage son Alan set out to record folk music for the Library of Congress,
        and they went looking for it in prisons, where, Lomax believed, the inmates had 'not yet been
        influenced by jazz and the radio'. Radio and records scarcely reached the prison farms, and
        the work crews there still sang their group songs as they had before sharecropping. In July
        1933, at the Angola penitentiary in Louisiana, father and son first heard Huddie Ledbetter,
        the singer the world would know as Lead Belly.
      ru: "С таким багажником, в который едва втиснули огромный звукозаписывающий аппарат, Джон Ломакс
        колесил по американскому Югу. В 1933 году он вместе с сыном-подростком Аланом отправился
        записывать народную музыку для Библиотеки Конгресса, и искали они её в тюрьмах: заключённые,
        полагал Ломакс, «ещё не испытали влияния джаза и радио». Радио и пластинки до тюремных ферм и
        правда почти не доходили, и рабочие бригады пели там свои общие песни так же, как пели их ещё
