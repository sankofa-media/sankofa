        Alpha Kappa Alpha sorority. Coleman had trained in France and won her pilot's licence there in
        1921, because no flying school in America would take her.
      ru: В полёт на шаттле каждый член экипажа мог взять личный набор астронавта — маленький футляр
        размером примерно с книжку в мягкой обложке, куда помещалось не больше двадцати личных вещей
        общим весом в полтора фунта. Когда в сентябре 1992 года Мэй Джемисон, первая афроамериканка в
        космосе, полетела на «Индеворе», она взяла с собой фотографию лётчицы Бесси Коулман и знамя
        студенческого сестринства «Альфа Каппа Альфа». Коулман училась летать во Франции и там же в
