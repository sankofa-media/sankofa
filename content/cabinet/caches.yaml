    story:
      en: "In 1787 Thomas Clarkson became a founding member of the society for abolishing the slave trade,
        and he went round British ports collecting West African goods from merchant ships: textiles,
        seeds, dyes and leatherwork. He kept them in a chest made for the purpose, together with
        leg-shackles and thumbscrews bought in a Liverpool shop, and carried it all over Britain to
        show that Africa could trade in goods instead of people. In 1870 the chest was given to the
        museum of Wisbech, the town where he was born."
      ru: "В 1787 году Томас Кларксон стал одним из основателей общества за отмену работорговли и принялся
        объезжать британские порты, собирая с торговых судов западноафриканские товары: ткани, семена,
        красители, изделия из кожи. Всё это он хранил в сундуке, сделанном нарочно для этой цели,
        вместе с ножными кандалами и тисками для пальцев, купленными в ливерпульской лавке, и возил
        его по всей Британии, чтобы показать: Африка может торговать товарами, а не людьми. В 1870
        году сундук передали в музей Уисбека — города, где Кларксон родился."
