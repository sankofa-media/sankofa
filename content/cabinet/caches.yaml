  - id: sea-island-fanner-basket
    leads: amistad-sea-chest
    kind: basket
    name:
      en: A coiled basket like those of the Sea Islands
      ru: Шитая корзина вроде тех, что делают на Морских островах
    place:
      en: The rice coast of South Carolina and Georgia
      ru: Рисовое побережье Южной Каролины и Джорджии
    time:
      en: From the 1700s to today
      ru: С XVIII века до наших дней
    story:
      en: "A coiled basket like those sewn on the Sea Islands and along the rice coast of South Carolina
        and Georgia. On the rice plantations the grain could not have been processed without the
        fanner, a wide winnowing tray: the threshed rice was thrown into the air, and the wind carried
        the chaff away. The same basket was common in Senegambia, and enslaved Africans made it in
        their new country from marsh rush, bound with strips of saw palmetto or splints of white oak.
        Once coastal Highway 17 was paved and the Cooper River Bridge opened in 1929, basket makers
        could sell straight to travellers, and their stands still line the road at Mount Pleasant."
      ru: "Корзина, сшитая по спирали из травяного жгута, вроде тех, что шьют на Морских островах и по
        всему рисовому побережью Южной Каролины и Джорджии. На рисовых плантациях зерно невозможно
        было обработать без веялки — широкого плоского подноса: обмолоченный рис подбрасывали в
        воздух, и ветер уносил мякину. Точно такая же корзина была в ходу в Сенегамбии, и порабощённые
        африканцы делали её на новой земле из болотного камыша, обматывая жгут полосками карликовой
        пальмы или лучиной белого дуба. Когда прибрежное шоссе 17 покрыли асфальтом, а в 1929 году
        открыли мост через реку Купер, мастера стали продавать корзины прямо проезжающим, и их
        прилавки до сих пор стоят вдоль дороги у Маунт-Плезанта."
    hidden:
      at: feature
      feature: sea-lion-girls
      scene: ring
      block: book
      anchor:
        en: Georgia Sea Islands
        ru: Морских островов Джорджии
    clue:
      en: "At the bottom of the basket lies a slip of paper in a careful hand: “The griot who keeps this
        museum’s cluster writes notes in the margins of its Card objects, the margins every Kubernetes
        object keeps in its metadata. The Card amistad-case has such a note. Read it, and the word
        written there will open the next lock.”"
      ru: "На дне корзины лежит записка, выведенная аккуратным почерком: «Гриот, который хранит кластер
        этого музея, пишет заметки на полях его объектов Card — на тех полях, что есть в метаданных у
        любого объекта Kubernetes. Такая заметка есть и у карточки amistad-case. Прочтите её, и слово,
        записанное там, откроет следующий замок»."
