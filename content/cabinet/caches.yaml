    story:
      en: A garment bag like those in which graduates carry a kente stole to commencement. Kente came to
        the attention of most African Americans in 1958, when Kwame Nkrumah, the first prime minister
        of independent Ghana, wore it to meet President Eisenhower at the White House, and in the
        years of the civil rights movement it became a symbol of Black pride. In 1993 West Chester
        University in Pennsylvania held what is generally taken to be the first kente graduation
        ceremony. The custom spread from campus to campus, and today kente stoles are draped over
        graduates' shoulders all across the country.
      ru: В таком чехле выпускник везёт на торжественную церемонию свой палантин из кенте. Большинство
        афроамериканцев впервые обратили внимание на эту ткань в 1958 году, когда Кваме Нкрума, первый
        премьер-министр независимой Ганы, пришёл в ней в Белый дом на встречу с президентом
        Эйзенхауэром; в годы борьбы за гражданские права кенте стала знаком чёрной гордости. В 1993
        году Университет Уэст-Честера в Пенсильвании устроил, как принято считать, первую выпускную
        церемонию с кенте. Обычай пошёл от кампуса к кампусу, и теперь палантины из кенте ложатся на
        плечи выпускников по всей стране.
