    story:
      en: "A portfolio like those in which the human computers of Langley, in Virginia, kept their
        figures. Katherine Johnson came to the NACA's laboratory there in 1953 and started in the
        all-Black West Area Computing section: until 1958 Black workers at the NACA were kept apart
        from their white colleagues. She did the trajectory analysis for Alan Shepard's flight in May
        1961. Before John Glenn's orbital flight in 1962 the numbers were run on electronic computers,
        but Glenn asked for 'the girl' to check them by hand on her desk calculator."
      ru: "В таких папках «живые вычислители» из Лэнгли, что в Виргинии, хранили свои выкладки. Кэтрин
        Джонсон пришла в тамошнюю лабораторию НАКА, предшественника НАСА, в 1953 году и начинала в
        Западном вычислительном отделе, где работали одни чернокожие: до 1958 года чернокожих
        сотрудников НАКА держали отдельно от белых коллег. Она рассчитала траекторию полёта Алана
        Шепарда в мае 1961 года. Перед орбитальным полётом Джона Гленна в 1962 году цифры уже считали
        электронные машины, но Гленн попросил, чтобы «та девушка» проверила их вручную, на своём
