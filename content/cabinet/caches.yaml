  - id: windrush-suitcase
    kind: suitcase
    name:
      en: A Windrush passenger's suitcase
      ru: Чемодан пассажира «Уиндраша»
    place:
      en: From the Caribbean to Tilbury, Essex
      ru: С Карибских островов в Тилбери, Эссекс
    time:
      en: June 1948
      ru: июнь 1948 года
    story:
      en: A suitcase like those carried ashore at Tilbury on 22 June 1948, when HMT Empire Windrush docked
        with passengers from the Caribbean. Some were men who had served in the RAF during the war
        and were coming back, Sam King among them. Those with nowhere to go, 236 by the official
        count, were put up in the deep wartime shelter under Clapham South Tube station.
      ru: С такими чемоданами сходили на берег в Тилбери 22 июня 1948 года, когда к причалу подошёл
        «Эмпайр Уиндраш» с пассажирами с Карибских островов. Некоторые из них в войну служили в
        Королевских ВВС и теперь возвращались — среди них Сэм Кинг. Тех, кому некуда было идти, — по
        официальному счёту 236 человек — поселили в глубоком бомбоубежище военных лет под станцией
        метро «Клэпем-Саут».
