    story:
      en: "A kit bag like those packed aboard the Roosevelt, the ship that sailed north from New York in
        July 1908 on Robert Peary's last attempt at the North Pole. Matthew Henson had been with Peary
        on seven Arctic expeditions, and of all Peary's crew only he spoke Inuktitut and drove a dog
        sledge as well as the Inuit themselves. In February 1909 the party left Cape Sheridan for the
        sea ice, and on 6 April Peary, Henson and four Inuit men reached what they took to be the
