  - id: schomburg-box
    kind: archive-box
    name:
      en: Arturo Schomburg's archive box
      ru: Архивная коробка Артуро Шомбурга
    place:
      en: 135th Street branch of the New York Public Library, Harlem, New York
      ru: Отделение Нью-Йоркской публичной библиотеки на 135-й улице, Гарлем, Нью-Йорк
    time:
      en: "1926"
      ru: 1926 год
    story:
      en: "Arturo Alfonso Schomburg, a Puerto Rican of African descent living in New York, spent his life
        collecting books, pamphlets, manuscripts and prints by and about people of African descent,
        and not only in the United States. In 1926 the New York Public Library bought his collection
        for $10,000 with a grant from the Carnegie Corporation: 2,932 volumes and 1,124 pamphlets,
        with prints and manuscripts besides. It went to the library's 135th Street branch in Harlem,
        where it became the Division of Negro Literature, History and Prints."
      ru: "Артуро Альфонсо Шомбург, пуэрториканец африканского происхождения, живший в Нью-Йорке, всю
        жизнь собирал книги, брошюры, рукописи и гравюры, написанные людьми африканского
        происхождения или рассказывающие о них, — и не только в Соединённых Штатах. В 1926 году
        Нью-Йоркская публичная библиотека купила его собрание за 10 000 долларов на грант Корпорации
        Карнеги: 2932 тома и 1124 брошюры, а ещё гравюры и рукописи. Собрание отправилось в
        отделение библиотеки на 135-й улице в Гарлеме и стало там особым отделом литературы, истории и гравюр, посвящённых чернокожим."
    hidden:
      at: chapter-step
      chapter: v5
      anchor:
        en: Latin verse
        ru: латинские стихи
    gives:
      - iron-key
    contents:
      both:
        - schomburg-portrait
        - wheatley-poems-1773
        - juan-latino-austriad
    cards:
