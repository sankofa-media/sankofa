# The caches: containers hidden across the museum, each with its own history.
# hidden: card-image (x/y in % of the picture), card-text or chapter-step
# (the words it hides in, per language), workshop (the drawer under an object).
# lock/gives: keys (cabinet.yaml). contents: per copy of the museum (both, m, f).
caches:
  - id: sea-chest
    kind: chest
    name:
      en: A Black sailor's sea chest
      ru: Сундучок чернокожего моряка
    place:
      en: Philadelphia and the Atlantic
      ru: Филадельфия и Атлантика
    time:
      en: "1810"
      ru: 1810 год
    story:
      en: "Among a Black sailor's things, few were worth as much as a single sheet of paper. In 1796
        Congress created the seaman's protection certificate to keep American sailors from being
        seized into the British navy; for a man of color it was also proof that he was free. Sailors
        kept the certificates themselves, while the sworn proofs filed to obtain them stayed in
        customs records now held by the National Archives. A borrowed certificate could open a road
        too: in 1838 Frederick Douglass walked to freedom with one."
      ru: "Среди вещей чернокожего моряка мало что стоило дороже одного листа бумаги. В 1796 году Конгресс
        ввёл охранное свидетельство моряка, чтобы американских матросов не забирали силой в
        британский флот; чернокожему оно к тому же доказывало, что он свободен. Сами свидетельства
        моряки держали при себе, а показания под присягой, поданные ради их получения, оставались в
        таможенных делах, которые теперь хранит Национальный архив США. Чужое свидетельство тоже
        могло открыть дорогу: в 1838 году с таким, взятым взаймы, ушёл на свободу Фредерик Дуглас."
    hidden:
      at: card-image
      card: equiano
      x: 60
      y: 49
    contents:
      both:
        - seamens-protection-dunbar
      m:
        - equiano-bahama-banks
      f:
        - seacole-british-hotel
    cards:
      - equiano
      - mary-seacole
      - paul-cuffe
      - douglass-covey
  - id: box-brown-box
    kind: box
    name:
      en: Henry Box Brown's box
      ru: Ящик Генри «Бокса» Брауна
    place:
      en: Richmond, Virginia, to Philadelphia
      ru: Из Ричмонда (Виргиния) в Филадельфию
    time:
      en: March 1849
      ru: март 1849 года
    story:
      en: On 23 March 1849 friends in Richmond, Virginia, sealed Henry Brown into a wooden box and sent it
        by rail to Philadelphia. About twenty-six hours later the box was opened at the office of
        the Pennsylvania Anti-Slavery Society, and Brown rose out of it alive and free. William
        Still was among the witnesses.
      ru: 23 марта 1849 года друзья в Ричмонде (Виргиния) запечатали Генри Брауна в деревянный ящик и
        отправили поездом в Филадельфию. Примерно через двадцать шесть часов ящик вскрыли в конторе
        Пенсильванского антирабовладельческого общества, и Браун поднялся из него живым и свободным.
        Среди свидетелей был Уильям Стилл.
    hidden:
      at: chapter-step
      chapter: v2
      anchor:
        en: logged hundreds of fugitives
        ru: вносил в журнал сотни беглецов
    gives:
      - brass-key
    contents:
      both:
        - box-brown-resurrection
        - box-brown-narrative-1849
    cards:
      - underground-railroad-myths
  - id: pullman-grip
    kind: grip
    name:
      en: A Pullman porter's grip
      ru: Саквояж пульмановского проводника
    place:
      en: Chicago and the southbound trains
      ru: Чикаго и поезда, идущие на юг
    time:
      en: 1917–1919
      ru: 1917–1919
    story:
      en: A grip like those Black Pullman porters carried out of Chicago on trains bound south. In their
        luggage rode bundles of the Chicago Defender, the weekly that called Southerners north and
        named 15 May 1917 the day of the Great Northern Drive. Some Southern towns tried to stop its
        sale; the porters smuggled it in anyway, and by 1918 it sold 125,000 copies.
      ru: Такой саквояж чернокожий проводник пульмановского вагона брал в рейс из Чикаго на юг. В багаже
        ехали пачки «Чикаго дефендер» — еженедельника, который звал южан на Север и назначил на 15
        мая 1917 года «Великий поход на Север». Некоторые южные города пытались запретить его
        продажу, но проводники всё равно провозили газету, и к 1918 году она расходилась тиражом 125
        000 экземпляров.
    hidden:
      at: card-text
      card: chicago-defender
      anchor:
        en: Pullman porters
        ru: проводники пульмановских вагонов
    contents:
      both:
        - negro-migration-during-the-war
        - pullman-porter-union-station
    cards:
      - chicago-defender
      - migration-series
  - id: windrush-suitcase
    kind: suitcase
    name:
      en: A Windrush passenger's suitcase
      ru: Чемодан пассажира «Уиндраша»
    place:
      en: From the Caribbean to Tilbury, Essex
      ru: С Карибских островов в Тилбери, Эссекс
    time:
      en: June 1948
      ru: июнь 1948 года
    story:
      en: A suitcase like those carried ashore at Tilbury on 22 June 1948, when HMT Empire Windrush docked
        with passengers from the Caribbean. Some were men who had served in the RAF during the war
        and were coming back, Sam King among them. Those with nowhere to go, 236 by the official
        count, were put up in the deep wartime shelter under Clapham South Tube station.
      ru: С такими чемоданами сходили на берег в Тилбери 22 июня 1948 года, когда к причалу подошёл
        «Эмпайр Уиндраш» с пассажирами с Карибских островов. Некоторые из них в войну служили в
        Королевских ВВС и теперь возвращались — среди них Сэм Кинг. Тех, кому некуда было идти, — по
        официальному счёту 236 человек — поселили в глубоком бомбоубежище военных лет под станцией
        метро «Клэпем-Саут».
    hidden:
      at: card-text
      card: windrush-scandal
      anchor:
        en: to Tilbury
        ru: в Тилбери
    contents:
