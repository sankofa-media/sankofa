    story:
      en: A work bag like those Montgomery seamstresses carried home at the end of the day. On 1 December
        1955 Rosa Parks, a forty-two-year-old seamstress at the Montgomery Fair department store, was
        riding home on a city bus when the driver ordered her to give up her seat to white passengers,
        and she refused. She was arrested. Parks was also secretary of the local NAACP, and her arrest
        became the rallying point for the bus boycott, which lasted more than a year. Newspapers made
        her a tired seamstress; she later wrote that the only tired she was, was tired of giving in.
      ru: С такими сумками швеи Монтгомери возвращались домой после смены. 1 декабря 1955 года Роза Паркс,
        сорокадвухлетняя швея из универмага «Монтгомери фэр», ехала с работы на городском автобусе, и
        водитель велел ей уступить место белым пассажирам. Она отказалась, и её арестовали. Паркс к
        тому же была секретарём местного отделения NAACP, Национальной ассоциации содействия прогрессу
        цветного населения, и её арест стал той точкой, вокруг которой чернокожие горожане сплотились
        в бойкот автобусов, продлившийся больше года. Газеты сделали из неё усталую швею, а она потом
        написала, что устала лишь от одного — от того, что приходится уступать.
