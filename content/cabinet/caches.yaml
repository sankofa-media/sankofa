    story:
      en: A portfolio like those European artists carried through Brazil in the 1820s. The English painter
        Augustus Earle lived in Rio de Janeiro from 1820 to 1824 and painted two men at a game of
        capoeira, though he titled the picture only “Negroes fighting”. Johann Moritz Rugendas, a
        young German, came to Brazil in 1822 as draughtsman to Baron Langsdorff’s expedition, and the
        Paris printer Engelmann published his Voyage pittoresque dans le Brésil between 1827 and 1835.
        One of its lithographs, issued in 1835, shows the capoeira game, “or the dance of war”.
      ru: Папка вроде тех, с которыми европейские художники странствовали по Бразилии в 1820-е годы.
