    story:
      en: "A road trunk like those Parliament-Funkadelic's crew hauled from arena to arena on the P-Funk
        Earth Tour, which began in 1976. At the height of the show the band sang the old gospel song
        \"Swing Down, Sweet Chariot\", the lights dimmed, and amid smoke, sparks and flashing lights a
        huge silver spaceship came down onto the stage; out of it stepped George Clinton. The original
        Mothership did not survive: in the early 1980s, when the band was in debt, it was thrown
        away."
      ru: "Такие сундуки команда Parliament-Funkadelic возила с арены на арену во время P-Funk Earth Tour,
        начавшегося в 1976 году. В разгар концерта группа пела старый госпел «Swing Down, Sweet
        Chariot», свет гас, и в дыму, искрах и вспышках на сцену опускался огромный серебристый
        космический корабль, из которого выходил Джордж Клинтон. Сам корабль-матка не уцелел: в начале
