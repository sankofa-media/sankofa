    story:
      en: A basket like the African one that Albert Eckhout put into the hand of a woman he painted in
        Brazil. In 1630 the Dutch West India Company seized the sugar-rich captaincy of Pernambuco,
        and in 1637 Johan Maurits of Nassau-Siegen arrived to govern the colony, bringing the painters
        Eckhout and Frans Post with him. The Company had taken the sugar industry from the Portuguese,
        and the work on its plantations was forced out of enslaved people. Inland, in the hills, lay
        Palmares, the refuge of those who fled, and the Dutch sent expeditions against it just as the
        Portuguese did. In 1654 the Dutch surrendered Recife, and that same year Johan Maurits gave
        Eckhout's paintings to King Frederick III of Denmark.
      ru: Такую корзину — африканскую, как считают историки искусства, — Альберт Экхаут вложил в руку
        женщины, которую писал в Бразилии. В 1630 году Голландская Вест-Индская компания захватила
        Пернамбуку, капитанство, богатое сахаром, а в 1637 году править колонией приехал граф Иоганн
        Мориц Нассау-Зигенский и привёз с собой двух художников — Экхаута и пейзажиста Франса Поста.
        Сахарное дело компания отняла у португальцев, и на её плантациях трудились невольники, которых
        заставляли работать силой. А в глубине страны, в горах, лежал Палмарис — убежище тех, кто от
        этой работы бежал, и голландцы посылали против него экспедиции точно так же, как португальцы.
        В 1654 году голландцы сдали Ресифи, и в том же году Иоганн Мориц подарил картины Экхаута
        датскому королю Фредерику III.
