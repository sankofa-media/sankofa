  - id: rumba-shipping-crate
    kind: crate
    name:
      en: A rumbero's shipping crate
      ru: Портовый ящик румберо
    place:
      en: The ports of Havana and Matanzas, Cuba
      ru: Порты Гаваны и Матансаса, Куба
    time:
      en: Late 19th century
      ru: конец XIX века
    story:
      en: A wooden shipping crate like those the first rumberos drummed on in Havana and Matanzas. Toward
        the end of the nineteenth century people of many African backgrounds came to these port cities
        looking for work, many of them as stevedores, and in their poor neighbourhoods a rumba meant
        simply a party. At first they kept time on whatever lay to hand at home or at work, a drawer,
        a table, a frying pan, spoons; then crates of different sizes became rumba's first true
        instruments, and the two hardwood sticks of the clave set the rhythm. Over time conga drums
        took the crates' place, and in 2016 UNESCO inscribed rumba in Cuba on its list of the
        intangible cultural heritage of humanity.
      ru: "На таком деревянном портовом ящике отбивали ритм первые румберо Гаваны и Матансаса. В конце XIX
        века в эти портовые города стекались в поисках заработка люди самых разных африканских корней
        — многие из них нанимались грузчиками, — и в их бедных кварталах слово «румба» означало
        попросту праздник, вечеринку. Поначалу ритм выстукивали на том, что подворачивалось под руку
        дома или на работе: на выдвижном ящике, на столе, на сковороде, ложками. Потом их место заняли
        ящики разной величины — они и стали первыми настоящими инструментами румбы, а ритм ей задавали
        две палочки из твёрдого дерева, клаве. Со временем ящики уступили место барабанам-конга, а в
        2016 году ЮНЕСКО внесла кубинскую румбу в список нематериального культурного наследия
        человечества."
