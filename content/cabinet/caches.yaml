    story:
      en: A book chest like the one that followed Anton Wilhelm Amo from one German university to the
        next. Brought from the Gold Coast to the court of Brunswick-Wolfenbüttel as a small child, he
        enrolled at Halle in 1727 and two years later defended a disputation there on the rights of
        Moors in Europe. In 1730 he moved to Wittenberg, where in 1734 he took his doctorate; back in
