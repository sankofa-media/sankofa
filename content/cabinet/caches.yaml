        Брауншвейг-Вольфенбюттельских, а в 1727 году он поступил в университет Галле и через два года
        защитил там диспут о правах мавров в Европе. В 1730 году Амо перебрался в Виттенберг и в
        1734-м получил там докторскую степень; вернувшись в Галле уже преподавателем, он выпустил в
