  - id: benin-expedition-trunk
    kind: trunk
    name:
      en: A tin trunk like those of the Benin expedition
      ru: Жестяной сундук вроде тех, что возили с собой участники бенинского похода
    place:
      en: Benin City
      ru: Бенин-Сити
    time:
      en: February 1897
      ru: февраль 1897 года
    story:
      en: A tin trunk like those the officers of the Benin expedition took home in 1897. In January of
        that year a British party bound for Benin City was ambushed, and almost all of its members
        were killed; in February a large British force marched on the city in reprisal, captured it
        and burned it. The works of art of the royal court were gathered up as spoils of war. Many
        were shared out among officers and other servicemen as booty, and many more were sold to
        defray the cost of the campaign, and so they scattered into the museums of Europe and America.
      ru: "Такой жестяной сундук офицеры бенинского похода увозили домой в 1897 году. В январе того года
        британский отряд, направлявшийся в Бенин-Сити, попал в засаду, и почти все его участники
        погибли. В феврале в отместку на город двинулось большое британское войско; Бенин-Сити взяли и
        сожгли. Произведения искусства царского двора собрали как военную добычу, и дальше их судьбы
        разошлись: многое поделили между офицерами и рядовыми как трофеи, а ещё больше продали, чтобы
        покрыть расходы на войну. Так бенинские вещи и рассеялись по музеям Европы и Америки."
    hidden:
      at: country
      country: nigeria
      anchor:
        en: British troops attacked
        ru: напали британские войска
    gives:
      - bronze-key
    contents:
      both:
        - granville-oba-compound-1897
    cards:
      - benin-bronzes
      - queen-idia
  - id: ovonramwen-plate-case
    kind: case
    name:
      en: A photographer's plate case like Jonathan Adagogo Green's
      ru: Ящик для фотопластинок вроде того, с которым работал Джонатан Адагого Грин
    place:
      en: The yacht Ivy, on the way to Calabar
      ru: Яхта «Айви» на пути в Калабар
    time:
      en: "1897"
      ru: 1897 год
    story:
      en: "A plate case like those the photographers of the 1890s carried, Jonathan Adagogo Green among
        them. In 1897 Green photographed Oba Ovonramwen on board the British government yacht Ivy: the
        king sits in a wicker chair with shackles on his ankles, on his way into exile at Calabar. He
        never saw Benin City again. He died in exile in January 1914, and that same year his son
        returned to Benin City and was crowned Oba Eweka II. Some of the royal treasures that West
        Africa lost in those years have only lately come back: on 9 November 2021 France signed over
        to the Republic of Benin twenty-six royal treasures of Abomey."
      ru: "С таким ящиком для фотопластинок ездили фотографы 1890-х, и среди них Джонатан Адагого Грин. В
        1897 году Грин сфотографировал оба Овонрамвена на борту британской правительственной яхты
        «Айви»: царь сидит в плетёном кресле, на ногах у него кандалы, а везут его в ссылку, в
        Калабар. Бенин-Сити он больше не увидел. Овонрамвен умер в изгнании в январе 1914 года, а в
        том же году его сын вернулся в Бенин-Сити и был коронован как оба Эвека II. Кое-что из царских
        сокровищ, утраченных Западной Африкой в те годы, вернулось совсем недавно: 9 ноября 2021 года
        Франция подписала передачу Республике Бенин двадцати шести царских сокровищ Абомея."
    hidden:
      at: factoid
      fact: fx-obj-0031
      anchor:
        en: the transfer of ownership
        ru: права собственности
