    story:
      en: A sea bag like those the crew of the SS Booker T. Washington carried aboard. Hugh Mulzac, born
        in the British West Indies, became an American citizen in 1918 and passed for a master's
        licence by 1920, yet no shipping line would give a Black captain a ship, and for twenty years
        he worked mostly in ships' steward's departments. In September 1942 the first Liberty ship
        named for an African American was launched at Wilmington, California, and Mulzac became her
        captain, the first African American to command a ship of the US Merchant Marine. He was
        offered an all-Black crew and insisted on an integrated one.
      ru: С такими мешками поднималась на борт команда «Букера Т. Вашингтона». Хью Малзак родился в
        Британской Вест-Индии, в 1918 году стал гражданином США, а к 1920-му сдал экзамен на капитана.
        Только ни одна судоходная компания не доверяла судно чернокожему капитану, и двадцать лет он
        служил в основном по камбузной и буфетной части. В сентябре 1942 года в Уилмингтоне, в
        Калифорнии, спустили на воду первый «Либерти», названный в честь афроамериканца, и Малзак стал
        его капитаном — первым афроамериканцем, командовавшим судном торгового флота США. Ему
        предлагали команду из одних чернокожих, но он настоял на смешанной.
