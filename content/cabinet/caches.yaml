    story:
      en: A portfolio for papers like those Granville Sharp gathered about the Zong. Between 29 November
        and 1 December 1781 the crew of the Liverpool slave ship Zong threw 132 African captives into
        the sea, and the owners claimed them from their underwriters like any other insured cargo. The
        underwriters refused to pay, and in 1783 the case came to court. Olaudah Equiano told Sharp
        about it; Sharp had the hearing taken down and demanded that the Admiralty try the crew for
        murder. Nobody was ever prosecuted.
      ru: Папка для бумаг вроде тех, в которые Гренвилл Шарп собирал документы о «Зонге». С 29 ноября по 1
        декабря 1781 года команда ливерпульского невольничьего судна «Зонг» выбросила в море 132
        пленных африканца, а владельцы потребовали у страховщиков возмещения, как за любой
        застрахованный груз. Страховщики платить отказались, и в 1783 году дело дошло до суда. Олауда
        Эквиано рассказал о нём Шарпу; тот добился, чтобы слушание застенографировали, и потребовал от
        Адмиралтейства судить команду за убийство. Под суд так никто и не попал.
