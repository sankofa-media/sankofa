  - id: race-records-case
    kind: case
    name:
      en: A record case like those of the early 1920s
      ru: Футляр для пластинок начала двадцатых
    place:
      en: New York
      ru: Нью-Йорк
    time:
      en: 1920–1923
      ru: 1920–1923
    story:
      en: A case for shellac records like those of the early 1920s. When Mamie Smith's "Crazy Blues" came
        out on OKeh in the autumn of 1920, it reportedly sold 75,000 copies within months, and the
        record companies took note. By the summer of 1921 OKeh had launched a series of "race records"
        for Black buyers, and other labels soon opened their own. In Harlem Harry Pace went further
        and founded Black Swan, the first major record company owned by African Americans.
      ru: Футляр для шеллачных пластинок, какие были в ходу в начале двадцатых. Когда осенью 1920 года на
        OKeh вышла «Crazy Blues» Мейми Смит, её, по рассказам, за считаные месяцы раскупили в 75 000
        экземпляров, и звукозаписывающие компании это заметили. К лету 1921 года OKeh завела серию
        «расовых пластинок» для чернокожих покупателей, а вскоре свои серии открыли и другие фирмы. В
        Гарлеме Гарри Пейс пошёл дальше и основал Black Swan — первую крупную звукозаписывающую
        компанию, которой владели афроамериканцы.
