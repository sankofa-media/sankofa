    story:
      en: A metal chest like those in which the manuscripts of Timbuktu escaped from the city. In April
        2012 Timbuktu fell to armed rebels, and the keepers of its private libraries, aware of the
        danger, decided to smuggle their books south to Bamako. Metal chests the size of a large
        suitcase, the kind widely used in Africa for packing clothes, suited the purpose best;
        couriers took them by road and down the Niger by boat, past armed checkpoints, until January
        2013. When the militants left Timbuktu that January they set fire to the Ahmed Baba
        Institute's building, but by then at least 95 per cent of the city's manuscripts were safe.
      ru: В таких металлических сундуках рукописи Томбукту спаслись из города. В апреле 2012 года Томбукту
        захватили вооружённые повстанцы, и хранители частных библиотек, понимая, чем это грозит их
        книгам, решили тайком вывезти их на юг, в Бамако. Лучше всего для этого подошли металлические
        сундуки величиной с большой чемодан — в Африке в них обычно складывают одежду. Курьеры везли
        их по дорогам и на лодках вниз по Нигеру, мимо вооружённых постов, и последние добрались до
        места в январе 2013 года. Уходя тогда из Томбукту, боевики подожгли здание Института Ахмеда
