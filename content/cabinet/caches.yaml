  - id: baquaqua-bread-basket
    kind: basket
    name:
      en: A bread basket like the one Baquaqua carried
      ru: Хлебная корзина — вроде той, с которой ходил Бакуакуа
    place:
      en: Pernambuco, Brazil
      ru: Пернамбуку, Бразилия
    time:
      en: 1845–1847
      ru: 1845–1847
    story:
      en: "Mahommah Gardo Baquaqua was born around 1824 in Djougou, in present-day Benin; in 1845 he was
        captured, carried across the Atlantic to Recife, in Pernambuco, and sold to a baker. The baker
        sent him out to sell bread, first round the town, then out into the country, and in the
        evening in the market till nine at night. When Baquaqua drank away the takings, his master
        counted the basket and beat him. He tried to drown himself, and was sold again and sent south
        to Rio de Janeiro. Nine years later, a free man, he told his story in a book printed in
        Detroit: the only known account by a man enslaved in Brazil."
      ru: "Махомма Гардо Бакуакуа родился около 1824 года в Джугу, на территории нынешнего Бенина. В 1845
        году его захватили, через Атлантику привезли в Ресифи, в провинцию Пернамбуку, и продали
        пекарю. Пекарь посылал его торговать хлебом: сначала по городу, потом по окрестным деревням, а
        вечером — на рынке, до девяти часов. Однажды Бакуакуа пропил выручку, и хозяин, пересчитав,
        что осталось в корзине, жестоко его избил. Бакуакуа пытался утопиться; его снова продали и
        отправили на юг, в Рио-де-Жанейро. Девять лет спустя, уже свободным человеком, он рассказал
        свою историю в книге, напечатанной в Детройте, — это единственное известное свидетельство
        человека, бывшего рабом в Бразилии."
