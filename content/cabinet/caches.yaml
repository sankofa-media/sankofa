    time:
      en: 18th–20th centuries
      ru: XVIII–XX века
    story:
      en: A fanner basket like those on the rice plantations of the Carolina and Georgia coast. Planters
        there sought out Africans from the rice-growing coast of West Africa, and the enslaved brought
        their own knowledge of rice with them, the fanner basket included, a wide, flat tray known in
        both Senegambia and South Carolina. After threshing, workers tossed the grain in it and let
        the wind carry off the chaff. The craft outlived the rice fields. In 1929, when Highway 17 was
        paved and the Cooper River Bridge opened, basket sewers from Mount Pleasant began selling
        their baskets by the road, and their stands still line it.
      ru: Такой корзиной-веялкой работали на рисовых плантациях побережья Каролины и Джорджии. Плантаторы
        нарочно искали невольников с рисового побережья Западной Африки, и порабощённые привезли с
        собой собственное знание риса, а вместе с ним и веялку — широкий плоский поднос, одинаково
        знакомый и в Сенегамбии, и в Южной Каролине. Обмолоченное зерно подбрасывали в нём, и ветер
        уносил мякину. Ремесло пережило рисовые поля. В 1929 году, когда заасфальтировали шоссе 17 и
        открыли мост через реку Купер, мастерицы из Маунт-Плезанта стали продавать свои корзины прямо
        у дороги, и их прилавки стоят вдоль неё до сих пор.
