        admitted him as a member only in 1937."
      ru: "Такой вещевой мешок могли уложить в трюм «Рузвельта» — судна, которое в июле 1908 года ушло из
        Нью-Йорка на север: Роберт Пири в последний раз пытался добраться до Северного полюса. Рядом с
        ним, как и в семи прежних арктических экспедициях, был Мэтью Хенсон, и из всей команды Пири
        только Хенсон говорил на инуктитуте и правил собачьей упряжкой не хуже самих инуитов. В
        феврале 1909 года отряд двинулся от мыса Шеридан на морской лёд, и 6 апреля Пири, Хенсон и
