  - id: stedman-portfolio
    kind: portfolio
    name:
      en: A portfolio like the one that held John Gabriel Stedman's Surinam drawings
      ru: Папка вроде той, где Джон Габриэль Стедман хранил суринамские рисунки
    place:
      en: Suriname and London
      ru: Суринам и Лондон
    time:
      en: 1770s–1796
      ru: 1770-е — 1796 год
    story:
      en: A portfolio like the one in which John Gabriel Stedman kept his Surinam drawings. Stedman, a
        Scottish captain in Dutch service, was sent to Suriname in the 1770s to fight the Maroons,
        people who had escaped slavery and lived in the forest. He kept a journal and drew what he
        saw, and in 1796 his Narrative came out in London with engravings after his drawings by the
        city's best engravers, William Blake among them. He also brought back to Europe a banjo made
        by an enslaved person in Suriname, the oldest banjo known to survive.
      ru: "Папка вроде той, в которой Джон Габриэль Стедман хранил свои суринамские рисунки. Стедмана,
        шотландского капитана на голландской службе, в 1770-е годы отправили в Суринам воевать с
        маронами — людьми, которые бежали из рабства и жили в лесу. Он вёл дневник и зарисовывал всё,
        что видел, а в 1796 году в Лондоне вышло его «Повествование» с гравюрами по его рисункам — их
        делали лучшие лондонские граверы, и среди них Уильям Блейк. А ещё Стедман привёз в Европу
        банджо, которое сделал в Суринаме порабощённый человек: это самое старое из сохранившихся
        банджо."
