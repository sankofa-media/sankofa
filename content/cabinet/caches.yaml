  - id: festac-despatch-case
    kind: case
    name:
      en: A despatch case like those that carried the letters about Idia's mask
      ru: Дипломатический портфель вроде тех, в которых возили письма о маске Идии
    place:
      en: Lagos and London
      ru: Лагос и Лондон
    time:
      en: 1974–1977
      ru: 1974–1977
    story:
      en: A despatch case like those in which letters about Queen Idia's mask went between Lagos and
        London in the 1970s. For FESTAC, the Second World Black and African Festival of Arts and
        Culture held in Lagos in 1977, Nigeria chose as its emblem the ivory pendant mask of Idia that
        colonial troops had looted from Benin City and that the British Museum held. Nigeria asked the
        museum to return the mask, or at least to lend it for the festival, and brought the matter
        before UNESCO, but London would agree to neither. So Nigeria had copies carved by artists of
        Benin City, and during the festival Idia's face looked down on Lagos from flags, banners and
        lamp posts.
      ru: В таких дипломатических портфелях в 1970-е годы ходили между Лагосом и Лондоном письма о маске
        царицы Идии. Нигерия готовилась принять в Лагосе ФЕСТАК — Второй всемирный фестиваль
        чернокожих и африканских искусств и культуры, назначенный на 1977 год, — и выбрала ему
        эмблемой ту самую подвесную маску Идии из слоновой кости, которую колониальные войска вывезли
        из Бенин-Сити и которая хранилась в Британском музее. Нигерия просила музей вернуть маску, а
        если не вернуть, то хотя бы дать её на время фестиваля, и даже вынесла этот вопрос в ЮНЕСКО,
        но Лондон не согласился ни на то, ни на другое. Тогда Нигерия заказала копии мастерам из
        Бенин-Сити, и во время фестиваля лицо Идии смотрело на Лагос с флагов, полотнищ и фонарных
        столбов.
    hidden:
      at: card-image
      card: queen-idia
      x: 41
      y: 8
