    time:
      en: 1849–1853
      ru: 1849–1853
    story:
      en: A trunk like those students brought to New York Central College in McGrawville, a village in
        upstate New York. Antislavery Baptists of the American Baptist Free Mission Society founded
        it, and it took in Black and white students, young women as well as young men; it was also
        among the first colleges in the country to hire Black professors. In 1849 Mahommah Gardo
        Baquaqua enrolled there, an African who had been enslaved in Brazil and had escaped in New
        York two years before, and he studied at McGrawville until 1853. Later the same school took in
        a girl named Edmonia Lewis, who would grow up to be a sculptor.
      ru: С такими сундуками студенты приезжали в Нью-Йоркский центральный колледж — в Макгроувилл,
        деревню на севере штата Нью-Йорк. Основали колледж баптисты-аболиционисты из Американского
        баптистского общества свободной миссии, и учиться туда принимали и чернокожих, и белых, и
        юношей, и девушек; к тому же это был один из первых колледжей в стране, где преподавали
        чернокожие профессора. В 1849 году сюда поступил Махомма Гардо Бакуакуа — африканец, которого
        обратили в рабство в Бразилии и который двумя годами раньше бежал от хозяина в Нью-Йорке. В
        Макгроувилле он проучился до 1853 года. А позже в ту же школу отдали девочку по имени Эдмония
        Льюис, которой предстояло стать скульптором.
