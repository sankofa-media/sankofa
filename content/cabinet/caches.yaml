        coffee to New York. The first English word Baquaqua learned on board was “F-r-e-e”, and in New
        York he ran. Abolitionists took up his case; when the courts would not set him free, they got
        him out of jail and away to Boston, and from Boston he sailed for Haiti.
      ru: В Рио-де-Жанейро Махомма Гардо Бакуакуа две недели простоял на невольничьем рынке, пока его не
        купил капитан Клементе Жозе да Коста. На капитанском судне — оно называлось «Лембранса», что
        по-португальски значит «память», — Бакуакуа дослужился до помощника стюарда, а когда стюард
        оставил место, «ключи от его хозяйства доверили мне». В 1847 году судно повезло в Нью-Йорк
        груз кофе. Первым английским словом, которое Бакуакуа выучил на борту, было «F-r-e-e» —
        «свободен», и в Нью-Йорке он бежал. За его дело взялись аболиционисты; суд не захотел признать
        его свободным, и тогда они вызволили Бакуакуа из тюрьмы и переправили в Бостон, а оттуда он
        уплыл на Гаити.
    hidden:
