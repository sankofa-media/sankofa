  - id: djenne-mud-pail
    kind: tin
    name:
      en: A tin pail like those that carry mud to the Great Mosque of Djenné
      ru: Жестяное ведро вроде тех, в которых носят глину к Большой мечети Дженне
    place:
      en: Djenné, Mali
      ru: Дженне, Мали
    time:
      en: Every year before the rains
      ru: каждый год перед дождями
    story:
      en: "A tin pail like those in which the people of Djenné carry mud to their Great Mosque. The mosque
        is the largest mud-brick building in the world, and before every rainy season it needs a new
        coat of mud, or the Sahel rains will wear it away. Thousands of townspeople come out for the
        replastering, carrying buckets and jugs: by tradition women and girls fetch water to mix with
        the clay, and men and boys climb the walls and lay on the new layer. The present building was
        raised in 1907 on the site of the old mosque, and since 2016 UNESCO has listed it as World
        Heritage in danger."
      ru: "В таких жестяных вёдрах жители Дженне носят глину к своей Большой мечети. Это самое большое в
        мире здание из сырцового кирпича, и перед каждым сезоном дождей его нужно заново обмазать
        глиной, иначе сахельские ливни его размоют. На обмазку выходят тысячи горожан с вёдрами и
        кувшинами, и роли расписаны издавна: женщины и девочки носят воду, чтобы замешивать глину, а
        мужчины и мальчики взбираются на стены и кладут свежий слой. Нынешнее здание поднялось в 1907
        году на месте старой мечети, а с 2016 года ЮНЕСКО числит его среди памятников всемирного
        наследия, которым грозит опасность."
    hidden:
      at: card-image
      card: djenne-mosque
      x: 62
      y: 51
    contents:
      both:
        - fortier-djenne-ruins-1906
    cards:
      - djenne-mosque
