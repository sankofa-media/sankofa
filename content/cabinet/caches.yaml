    kind: box
    name:
      en: An exhibitor's box of phonograph cylinders
      ru: Ящик с фонографными валиками, какие возили по городам
    place:
      en: New York and the roads of America
      ru: Нью-Йорк и дороги Америки
    time:
      en: The 1890s
      ru: 1890-е годы
    story:
      en: A box of wax cylinders like those that phonograph exhibitors carried from town to town in the
        early 1890s, and no exhibition box was thought complete without two records by George W.
        Johnson, "The Laughing Song" and "The Whistling Coon", minstrel numbers that mocked Black
        people. Johnson had been born into slavery in Virginia and sang for coins on the streets of
        New York; in 1890 he became the first African American to make commercial records. A wax
        cylinder could not yet be copied, so he sang the same songs over and over, and "The Laughing
        Song" became one of the best-selling records of the decade.
      ru: В таких ящиках демонстраторы фонографа в начале 1890-х возили восковые валики из города в город,
        и ни один такой ящик не считался полным без двух записей Джорджа У. Джонсона — «The Laughing
        Song» и «The Whistling Coon», номеров из менестрель-шоу, которые высмеивали чернокожих.
        Джонсон родился рабом в Виргинии и пел за мелочь на улицах Нью-Йорка, а в 1890 году стал
        первым афроамериканцем, чьи записи пошли в продажу. Копировать восковой валик тогда ещё не
        умели, поэтому он пел одни и те же песни снова и снова, и «The Laughing Song» стала одной из
        самых продаваемых записей десятилетия.
