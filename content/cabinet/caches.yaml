      ru: Такую сумку мог носить при дворе Мали джели — гриот народов манде. В 1352 году марокканский
        путешественник Ибн Баттута добрался до столицы мансы Сулеймана и видел, как придворный
        толмач Дуга играет на инструменте из тростника с маленькими тыквами-калебасами внизу. А по
        праздникам перед султаном читали стихи поэты, наряженные в птичьи костюмы из перьев.
    hidden:
