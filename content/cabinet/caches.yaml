  - id: griot-bag
    kind: bag
    name:
      en: A jeli's bag
      ru: Сумка джели
    place:
      en: The court of Mansa Sulayman, Mali
      ru: Двор мансы Сулеймана, Мали
    time:
      en: 1352–1353
      ru: 1352–1353
    story:
      en: A bag like one a jeli, a Mande griot, might have carried at the court of Mali. In 1352 the
        Moroccan traveller Ibn Battuta reached the capital of Mansa Sulayman and watched the court
        interpreter Dugha play an instrument made of reeds with small calabashes beneath it. On
        feast days poets in feathered bird costumes recited before the sultan.
      ru: Такую сумку мог носить при дворе Мали джели — гриот народов манде. В 1352 году марокканский
        путешественник Ибн Баттута добрался до столицы мансы Сулеймана и видел, как придворный
        толмач Дуга играет на инструменте из тростника с маленькими тыквами-калебасами внизу. По
        праздникам перед султаном читали стихи поэты в костюмах птиц из перьев.
    hidden:
      at: card-image
      card: sunjata
      x: 47
      y: 80
    contents:
      both:
