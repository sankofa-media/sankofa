    note:
      en: "Ole Worm (1588–1654), a Danish physician who taught at the university in Copenhagen, filled a
        room with his collections. His son published the catalogue in 1655, after Worm's death,
        opening with this view of the room packed with his collections. Frederik III, king of
        Denmark, then bought the collection: a cabinet like this one is where the museum, and its
        habit of gathering the world, began."
      ru: "Оле Ворм (1588–1654), датский врач, преподававший в Копенгагенском университете, заполнил
        комнату своими коллекциями. Каталог издал в 1655 году, уже после смерти Ворма, его сын, и
        открывается он этим видом комнаты, тесно заставленной его собраниями. Затем собрание купил
        датский король Фредерик III: с таких кабинетов и начался музей — и его привычка собирать к
