      ru: "Рид-Кэмп, Южная Каролина, декабрь 1934 года: заключённые в полосатых робах разом заносят топоры
        на тюремном дровяном дворе. На обороте от руки: «Заключённые поют на дровяном дворе, Рид-Кэмп,
