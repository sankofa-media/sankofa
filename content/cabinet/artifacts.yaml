    cards:
      - gullah
  - id: cinquez-sun-lithograph-1839
    drawer: voices
    shape: drawing
    image: cab-cinquez-sun-lithograph-1839.jpg
    caption:
      en: "“Joseph Cinquez, the brave Congolese Chief, who prefers death to slavery, and who now lies in
        jail…”: lithograph by Moses Yale Beach, 1839, probably after a drawing by James or Isaac
        Sheffield; below the portrait, the speech he was said to have made to his comrades."
      ru: "«Джозеф Цинквес, храбрый конголезский вождь, предпочитающий смерть рабству и ныне томящийся в
        тюрьме…»: литография Мозеса Йейла Бича, 1839 год, вероятно по рисунку Джеймса или Айзека
        Шеффилда; под портретом — речь, которую он будто бы произнёс перед товарищами."
    credit: Moses Yale Beach, lithographer; Library of Congress Prints and Photographs Division
      (LC-DIG-ppmsca-31280)
    license: Public domain
    url: https://www.loc.gov/item/2003690782/
    place:
      en: New York
      ru: Нью-Йорк
    year: "1839"
    note:
      en: "The print calls him a Congolese chief, but Sengbe Pieh was a Mende from Sierra Leone. The New
        York Sun put it out while he was awaiting trial, and its text quotes his speech to his
        comrades after the revolt: “I am resolved it is better to die than to be a white man’s
        slave.”"
      ru: "Гравюра называет его конголезским вождём, хотя Сенгбе Пие был менде из Сьерра-Леоне. Газета
        «Нью-Йорк сан» выпустила её, когда он ещё ждал суда, и в подписи приведена его речь перед
        товарищами после восстания: «Я решил: лучше умереть, чем быть рабом белого человека»."
    cards:
      - amistad-case
  - id: turner-slave-ship-1840
    drawer: seas
    shape: drawing
    image: cab-turner-slave-ship-1840.jpg
    caption:
      en: "J. M. W. Turner, Slavers throwing overboard the Dead and Dying — Typhoon coming on, 1840: a
        ship heads into a storm under a blood-red sky, while in the foreground shackled limbs sink
        among fish and gulls. Oil on canvas."
      ru: "Дж. М. У. Тёрнер, «Работорговцы выбрасывают за борт мёртвых и умирающих — надвигается тайфун»,
        1840 год: корабль уходит в бурю под кроваво-красным небом, а на переднем плане среди рыб и
        чаек тонут закованные в цепи тела. Холст, масло."
    credit: Joseph Mallord William Turner; Museum of Fine Arts, Boston (99.22, Henry Lillie Pierce
      Fund); image via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Slave-ship.jpg
    place:
      en: London (painted); Boston (since 1899)
      ru: Лондон (написана); Бостон (с 1899 года)
    year: "1840"
    note:
      en: Turner showed the canvas at the Royal Academy in 1840 with lines from his poem Fallacies of
        Hope, and behind it lies the Zong. The critic John Ruskin, given it by his father as a New
        Year present in 1844, called it Turner’s noblest work, yet he sold it in 1872, unable to bear
        the subject any longer. The Museum of Fine Arts in Boston bought it in 1899.
      ru: "Тёрнер выставил это полотно в Королевской академии в 1840 году со строками из своей поэмы
        «Обманчивые надежды», и за ним стоит история «Зонга». Критик Джон Рёскин, получивший картину
        от отца в подарок на Новый год в 1844 году, называл её благороднейшей работой Тёрнера и всё же
        в 1872 году продал: выносить её сюжет он больше не мог. В 1899 году картину купил Музей
        изящных искусств в Бостоне."
    cards:
      - zong
  - id: chatoyer-five-wives-1796
    drawer: heap
    shape: drawing
    image: cab-chatoyer-five-wives-1796.jpg
    caption:
      en: "“Chatoyer the Chief of the Black Charaibes in St. Vincent with his five Wives”: Chatoyer, sword
        in hand, smokes a pipe; the women carry baskets on their backs and one holds a child. Engraved
        by Grignion after Agostino Brunias, published in London in March 1796."
      ru: "«Шатуайе, вождь чёрных карибов на Сент-Винсенте, с пятью жёнами»: Шатуайе с саблей в руке курит
        трубку, женщины несут на спинах корзины, одна держит ребёнка. Гравюра Гриньона по рисунку
        Агостино Бруниаса, издана в Лондоне в марте 1796 года."
    credit: Charles Grignion after Agostino Brunias; published by J. Stockdale, London; John Carter
      Brown Library, Brown University, via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Chatoyer_the_Chief_of_the_Black_Charaibes_in_St._Vincent_with_his_five_Wives.,_1796._03044001.jpg
    place:
      en: London (print); Saint Vincent (scene)
      ru: Лондон (гравюра); Сент-Винсент (место действия)
    year: "1796"
    note:
      en: "The inscription says Brunias drew the scene from life in 1773. By the time the engraving came
        out, Chatoyer had been dead a year: he fell early in the Second Carib War. His brother, one of
        his sons and his daughter Gulisi survived the exile to Roatán, and Gulisi later settled in
        what is now Belize."
      ru: "Надпись сообщает, что Бруниас рисовал эту сцену с натуры в 1773 году. Когда гравюра вышла,
        Шатуайе уже год как не было в живых: он погиб в самом начале Второй карибской войны. Его брат,
        один из сыновей и дочь Гулиси пережили ссылку на Роатан, а Гулиси потом поселилась на землях
        нынешнего Белиза."
    cards:
      - garifuna
  - id: earle-negroes-fighting-brazils
    drawer: voices
    shape: drawing
    image: cab-earle-negroes-fighting-brazils.jpg
    caption:
      en: "Augustus Earle, Negroes fighting, Brazils, about 1822: two men face each other in the street,
        one kicking high; a soldier climbs over a fence, a man reclines to watch, and a woman with a
        child on her hip looks on. Watercolour."
      ru: "Огастес Эрл, «Негры дерутся. Бразилия», около 1822 года: двое мужчин сошлись посреди улицы,
        один высоко вскинул ногу; солдат перелезает через забор, полулежащий мужчина смотрит на игру,
        рядом стоит женщина с ребёнком на руках. Акварель."
    credit: Augustus Earle; National Library of Australia, Rex Nan Kivell Collection (NK12/103); image
      via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:CapoeiraEarle.JPG
    place:
      en: Rio de Janeiro
      ru: Рио-де-Жанейро
    year: about 1822
    note:
      en: Earle, an English painter who lived in Rio from 1820 to 1824, called the scene a fight, but the
        men’s movements are those of capoeira, and the people around them watch it as a game. The
        watercolour is now in the National Library of Australia in Canberra.
      ru: Эрл, английский живописец, живший в Рио с 1820 по 1824 год, назвал эту сцену дракой, но движения
        мужчин — движения капоэйры, и окружающие смотрят на неё как на игру. Сейчас акварель хранится
        в Национальной библиотеке Австралии в Канберре.
    cards:
      - capoeira
  - id: rugendas-negres-fond-de-cale
    drawer: seas
    shape: drawing
    image: cab-rugendas-negres-fond-de-cale.jpg
    caption:
      en: "Johann Moritz Rugendas, Nègres à fond de cale: Africans crowded on the floor and in tiers of
        berths in the hold of a slave ship; a man reaches up to the hatch while crewmen with a lantern
        lift out a limp body. Lithograph."
      ru: "Иоганн Мориц Ругендас, «Негры в трюме»: африканцы теснятся на полу и на ярусах нар в трюме
        невольничьего корабля; один тянется к люку, а матросы с фонарём выносят обмякшее тело.
        Литография."
    credit: "Johann Moritz Rugendas, Voyage pittoresque dans le Brésil (Paris: Engelmann); New York
      Public Library, Schomburg Center, via Wikimedia Commons"
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Rugendas_-_N%C3%A8gres_a_fond_de_cale.jpg
    place:
      en: Paris (print); the Atlantic (scene)
      ru: Париж (литография); Атлантика (место действия)
    year: 1827–1835
    note:
      en: Rugendas came to Brazil in 1822 with Baron Langsdorff’s expedition, and his Voyage pittoresque
        dans le Brésil, a hundred lithographs printed by Engelmann in Paris, became an important
        record of how large a part slavery played in Brazilian life. This plate takes the reader below
        deck, into the crossing itself.
      ru: Ругендас приехал в Бразилию в 1822 году с экспедицией барона Лангсдорфа, и его «Живописное
        путешествие по Бразилии» — сто литографий, отпечатанных у Энгельмана в Париже, — стало важным
        свидетельством того, какое место занимало рабство в бразильской жизни. Этот лист уводит
        читателя под палубу, в само плавание через океан.
    cards:
      - capoeira
  - id: christiano-junior-vendors-1864
    drawer: voices
    shape: photo
    image: cab-christiano-junior-vendors-1864.jpg
    caption:
      en: Christiano Junior, studio portrait of a seated woman in a head wrap and a standing boy, street
        vendors, with fruit heaped in baskets on a crate; Rio de Janeiro, 1864. Albumen carte de
        visite; the names were not recorded.
      ru: "Кристиану Жуниор, студийный портрет: сидящая женщина в тюрбане и стоящий мальчик, уличные
        торговцы, перед ними корзины с плодами на ящике; Рио-де-Жанейро, 1864 год. Визитная карточка
        на альбуминовой бумаге; имён никто не записал."
    credit: Christiano Junior; The Metropolitan Museum of Art (2017.69.13), Open Access
    license: Public domain
    url: https://www.metmuseum.org/art/collection/search/764808
    place:
      en: Rio de Janeiro
      ru: Рио-де-Жанейро
    year: "1864"
    note:
      en: "Christiano Junior, a photographer born in the Azores, worked in Rio de Janeiro from the early
        1860s and in 1864 became a partner in the Photographia do Commercio studio. There he portrayed
        people of African origin, enslaved or freed, posing them as if at their trades: basket makers,
        greengrocers, porters, fruit and chair vendors."
      ru: "Кристиану Жуниор, фотограф родом с Азорских островов, работал в Рио-де-Жанейро с начала 1860-х
        годов, а в 1864 году стал совладельцем ателье «Фотография ду Комерсиу». Там он снимал людей
        африканского происхождения, порабощённых и свободных, и ставил их перед камерой так, будто они
        заняты своим ремеслом: корзинщиков, зеленщиц, носильщиков, продавцов фруктов и стульев."
    cards:
      - capoeira
  - id: clarkson-jamaica-scroll-portrait
    drawer: letters
    shape: drawing
    image: cab-clarkson-jamaica-scroll-portrait.jpg
    caption:
      en: Thomas Clarkson leaning on a ledge with a scroll that reads “Slavery abolished, Jamaica August
        1st 1838”; mezzotint engraved by G. Lobel after a painting by H. Room, about 1840.
      ru: Томас Кларксон, облокотившийся на парапет, держит свиток с надписью «Рабство отменено. Ямайка, 1
        августа 1838 года»; меццо-тинто Г. Лобеля по картине Г. Рума, около 1840 года.
    credit: G. Lobel after H. Room; National Maritime Museum, Greenwich, London, Michael Graham-Stewart
      Slavery Collection (ZBA2504), via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Thomas_Clarkson,_1760-1846_RMG_E9112.tiff
    place:
      en: London
      ru: Лондон
    year: about 1840
    note:
      en: As a Cambridge student Clarkson won a Latin essay prize on the question whether it is lawful to
        make slaves of others against their will, and the question took over his life. By 1794 he had
        travelled some 35,000 miles, mostly on horseback, gathering evidence against the slave trade,
        with his chest of samples beside him.
      ru: Ещё студентом Кембриджа Кларксон получил премию за латинское сочинение на тему «Законно ли
        обращать людей в рабство против их воли?», и этот вопрос занял всю его жизнь. К 1794 году он
        проехал около 35 000 миль, большей частью верхом, собирая свидетельства против работорговли, и
        сундук с образцами ездил вместе с ним.
    cards:
      - brookes
      - wedgwood-medallion
  - id: nycc-main-building-1849
    drawer: letters
    shape: drawing
    image: cab-nycc-main-building-1849.jpg
    caption:
      en: "The main building of New York Central College at McGrawville: a woodcut printed in the Cortland
        County Express on 16 August 1849, the year the college opened."
      ru: "Главный корпус Нью-Йоркского центрального колледжа в Макгроувилле: гравюра на дереве из газеты
        «Кортленд каунти экспресс» от 16 августа 1849 года — того самого года, когда колледж
        открылся."
    credit: Cortland County Express, 16 August 1849, p. 3; via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:New_York_Central_College,_McGrawville.jpg
    place:
      en: McGrawville (now McGraw), Cortland County, New York
      ru: Макгроувилл (ныне Макгро), округ Кортленд, штат Нью-Йорк
    year: "1849"
    note:
      en: So the county paper showed the new college to its readers. Baquaqua came here from Haiti, where
        Baptist missionaries had taken him in, and he remembered the college president, C. P.
        Grosvenor, as a man who “made much of me, treating me in every way as an equal and a
        gentleman”.
      ru: Таким местная газета показала читателям новый колледж. Бакуакуа приехал сюда с Гаити, где его
        приютили миссионеры-баптисты, и президента колледжа К. П. Гровенора вспоминал как человека,
        который его «отличал и во всём обходился со мной как с равным и как с джентльменом».
    cards:
      - death-of-cleopatra-lewis
  - id: rugendas-marche-aux-negres
    drawer: seas
    shape: drawing
    image: cab-rugendas-marche-aux-negres.jpg
    caption:
      en: "“Marché aux nègres”: men, women and children offered for sale at a market in Brazil, some of
        them cooking over an open fire; hand-coloured lithograph by Deroi after Johann Moritz
        Rugendas, from Voyage pittoresque dans le Brésil, published in Paris by Engelmann, about
        1827."
      ru: "«Невольничий рынок»: мужчины, женщины и дети, выставленные на продажу на бразильском рынке;
        кое-кто из них стряпает у открытого огня. Литография Деруа по рисунку Иоганна Морица
        Ругендаса, раскрашенная от руки, из «Живописного путешествия по Бразилии» (Париж, Энгельман,
        около 1827 года)."
    credit: Deroi after Johann Moritz Rugendas (Paris, Engelmann & Cie); print in the Itaú Cultural
      collection, São Paulo, photographed by Wilfredor; via Wikimedia Commons
    license: CC0 (photograph); the print is in the public domain
    url: https://commons.wikimedia.org/wiki/File:March%C3%A9_aux_Negres_by_Johann_Moritz_Rugendas_2.jpg
    place:
      en: Paris (print); Brazil (scene)
      ru: Париж (литография); Бразилия (место действия)
    year: about 1827
    note:
      en: Rugendas drew such a market some twenty years before Baquaqua passed through one. In Rio,
        Baquaqua recalled, “I remained two weeks previous to being again sold”; a man of color there
        wanted to buy him but never completed the purchase, and in the end a ship's captain took him.
      ru: Ругендас нарисовал такой рынок лет за двадцать до того, как через подобный прошёл Бакуакуа. В
        Рио, вспоминал он, «я пробыл две недели, прежде чем меня снова продали»; один цветной хотел
        было его купить, но так и не довёл покупку до конца, и в конце концов Бакуакуа достался
        капитану корабля.
    cards:
      - cais-do-valongo
  - id: baquaqua-biography-1854
    drawer: letters
    shape: book
    image: cab-baquaqua-biography-1854.jpg
    caption:
      en: The cover of An Interesting Narrative. Biography of Mahommah G. Baquaqua, “written and revised
        from his own words” by Samuel Moore and “printed for the author” in Detroit in 1854, with
        Baquaqua's engraved portrait.
      ru: Обложка книги «Занимательное повествование. Жизнеописание Махоммы Г. Бакуакуа», которую Сэмюэл
        Мур «записал и выправил с его собственных слов» и которая была «напечатана для автора» в
        Детройте в 1854 году; на обложке — гравированный портрет Бакуакуа.
    credit: Mahommah G. Baquaqua and Samuel Moore (Detroit, Geo. E. Pomeroy & Co., 1854); photograph by
