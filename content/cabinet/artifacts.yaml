    year: "1726"
    note:
      en: A woman is being granted her freedom by her owner, and the certificate gives a detailed
        description of how she looks. The deed is drawn up in the manner prescribed by Islamic law.
        The Library of Congress showed it among the treasures of the Mamma Haidara library.
      ru: Владелец отпускает женщину на свободу, и в вольной подробно описано, как она выглядит. Бумага
        составлена по всем правилам исламского права. Библиотека Конгресса США показывала её среди
        сокровищ библиотеки Маммы Хайдары.
    cards:
      - timbuktu-manuscripts
  - id: black-star-line-broadside-1921
    drawer: seas
    shape: paper
    image: cab-black-star-line-broadside-1921.jpg
    caption:
      en: "Harlem, about 1921: a Black Star Line broadside with the “S.S. Phyllis Wheatley” under the
        words “Colored Men! Would you like to be Ship Masters? Engineers? Wireless Operators?”; shares
        at $5 each. The other side shows the Frederick Douglass."
      ru: "Гарлем, около 1921 года: листовка «Блэк Стар Лайн» с пароходом «Филлис Уитли» и призывом:
        «Цветные! Хотите стать капитанами? Механиками? Радистами?»; акции по пять долларов. На обороте
        — «Фредерик Дуглас»."
    credit: Black Star Line, Inc.; printed by the Hunt Printing Co., New York. Collection of the
      Smithsonian National Museum of African American History and Culture (2009.9.9)
    license: CC0
    url: https://nmaahc.si.edu/object/nmaahc_2009.9.9
    place:
      en: Harlem, New York
      ru: Гарлем, Нью-Йорк
    year: about 1921
    note:
      en: The ship on this side, the Phyllis Wheatley, never belonged to the line. In 1922 the mail-fraud
        indictment said that the mailer collecting money for her implied the line already owned her,
        and the photograph was in fact of the Orion, a ship the line had tried and failed to buy.
      ru: Пароход на этой стороне, «Филлис Уитли», линии так и не принадлежал. В 1922 году обвинение в
        почтовом мошенничестве гласило, что рассылка, собиравшая на него деньги, давала понять, будто
        линия уже им владеет, а на фотографии на самом деле был «Орион» — судно, которое компания
        пыталась купить, но не смогла.
