    image: cab-forever-changes-billboard-1968.jpg
    caption:
      en: "'Love Lives': Elektra's full-page advertisement in Billboard, 27 January 1968. The band's faces
        are drawn flowing into one another, and a handwritten line presents the group 'in their third
        incredible incarnation on Elektra titled Forever Changes'; catalogue numbers EKS-74013 stereo,
        EKL-4013 mono."
      ru: "«Love жива»: реклама Elektra на целую полосу в журнале Billboard от 27 января 1968 года. Лица
        музыкантов перетекают одно в другое, а рукописная строка представляет группу «в её третьем
        невероятном воплощении на Elektra под названием Forever Changes»; каталожные номера EKS-74013
        (стерео) и EKL-4013 (моно)."
    credit: Elektra Records; Billboard, 27 January 1968, p. 51; scan via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Forever_Changes_-_Billboard_ad_1968.png
    place:
      en: New York (Billboard); Los Angeles (Elektra and Love)
      ru: Нью-Йорк (Billboard); Лос-Анджелес (Elektra и Love)
    year: "1968"
    note:
      en: The third incarnation did sound like a new band. Elektra's founder, Jac Holzman, had suggested
        to Arthur Lee a quieter sound, the band's rock sensibility applied to songs with acoustic
        instruments, and Lee took the advice; the orchestral arrangements were by David Angel.
      ru: Третье воплощение и правда звучало как новая группа. Основатель Elektra Джек Хольцман предложил
        Артуру Ли звук потише — рок-чутьё группы, приложенное к песням под акустические инструменты, —
        и Ли этому совету последовал, а оркестровки написал Дэвид Энджел.
    cards:
      - rock-n-roll
  - id: aldridge-as-aaron-1852
    drawer: voices
    shape: drawing
    image: cab-aldridge-as-aaron-1852.jpg
    caption:
      en: "'Mr. Ira Aldridge as Aaron': full-length engraving from a daguerreotype by Paine of Islington,
        published in London by the London Printing and Publishing Company about 1852. Aaron stands
        with a drawn scimitar over his infant son; beneath are his lines from Titus Andronicus, Act 4,
        scene 2: 'He dies upon my scimetar's sharp point, / That touches this my first-born son and
        heir!'"
      ru: "«Мистер Айра Олдридж в роли Арона»: гравюра в полный рост по дагеротипу Пейна из Излингтона,
        изданная в Лондоне Лондонской печатной и издательской компанией около 1852 года. Арон с
        обнажённым ятаганом стоит над своим младенцем-сыном; внизу — его слова из «Тита Андроника»,
        акт 4, сцена 2: «Умрёт на острие моего ятагана тот, кто тронет моего первенца и наследника!»"
    credit: London Printing and Publishing Company, after a daguerreotype by Paine of Islington; Library
      of Congress, Prints and Photographs Division (LOT 8521)
    license: Public domain
    url: https://www.loc.gov/item/99471607/
    place:
      en: London
      ru: Лондон
    year: about 1852
    note:
      en: Aldridge made his name with two Moors of Shakespeare, Othello and Aaron. For Aaron he played a
        version of Titus Andronicus rewritten to turn the villain into a noble and tragic figure.
      ru: Славу Олдриджу принесли два шекспировских мавра — Отелло и Арон. Арона он играл в переделанном
        «Тите Андронике», где злодей стал благородной и трагической фигурой.
    cards:
      - ira-aldridge
  - id: wolcott-clarksdale-juke-1939
