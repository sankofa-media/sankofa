      - benin-bronzes
  - id: fortier-djenne-ruins-1906
    drawer: letters
    shape: paper
    image: cab-fortier-djenne-ruins-1906.jpg
    caption:
      en: "'413. Afrique Occidentale – Soudan – Djenné – Ruines de l'ancienne Mosquée': postcard,
        Collection Générale Fortier, Dakar. Women and children with vessels on their heads walk past
        the ruined walls."
      ru: "«413. Западная Африка — Судан — Дженне — Развалины старой мечети»: почтовая открытка из «Общей
        коллекции Фортье», Дакар. Мимо разрушенных стен идут женщины и дети с сосудами на головах."
    credit: Edmond Fortier, Dakar, 1906; via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Djenne_Fortier_413_-_Ruines_de_l%27ancienne_Mosqu%C3%A9e.jpg
    place:
      en: Djenné, French Soudan (now Mali)
      ru: Дженне, Французский Судан (ныне Мали)
    year: "1906"
    note:
      en: Edmond Fortier, a photographer and postcard publisher in Dakar, travelled through the French
        Soudan in 1906, and Djenné was on his way. His card shows what was left of the old mosque. On
        that site the town raised the Great Mosque that stands today, finished in 1907, so the ruins
        on this card were about to vanish.
      ru: Эдмон Фортье, фотограф и издатель открыток из Дакара, в 1906 году проехал по Французскому
        Судану, и Дженне оказался у него на пути. На его открытке — то, что осталось от старой мечети.
        Как раз на этом месте город и поднял нынешнюю Большую мечеть, достроенную в 1907 году, так что
        развалины, попавшие на открытку, вот-вот должны были исчезнуть.
    cards:
      - djenne-mosque
  - id: asante-kente-met
    drawer: heap
    shape: object
    image: cab-asante-kente-met.jpg
    caption:
      en: Man's kente (prestige cloth), Asante-Akan peoples, Ghana, 19th century; cotton, silk.
        Metropolitan Museum of Art, New York, 1972.56.1, draped on a mannequin as it would be worn
      ru: Мужское кенте (праздничная ткань), асанте-акан, Гана, XIX век; хлопок, шёлк. Метрополитен-музей,
        Нью-Йорк, 1972.56.1; ткань задрапирована на манекене так, как её носят
    credit: Metropolitan Museum of Art, Purchase, Irene Lewisohn Bequest, 1972
    license: CC0
    url: https://www.metmuseum.org/art/collection/search/85576
    place:
      en: Asante, Ghana
      ru: Асанте, Гана
    year: 19th century
    note:
      en: Kente is woven on a horizontal loom in narrow strips, and the strips are then sewn edge to edge
        into one large cloth; on this one the joins between them can be seen. The finest and most
        intricate kente was once reserved for Asante royalty. This nineteenth-century cloth is of
        cotton and silk.
      ru: Кенте ткут на горизонтальном станке узкими полосами, а потом сшивают их край к краю в одно
        большое полотно, и на этой ткани швы между полосами хорошо видны. Самые тонкие и замысловатые
        кенте когда-то предназначались только для царского дома асанте. Эта ткань XIX века соткана из
        хлопка и шёлка.
    cards:
      - kente
  - id: timbuktu-heavens-1733
    drawer: letters
    shape: book
    image: cab-timbuktu-heavens-1733.jpg
    caption:
      en: "Nasir al-Din Abu al-Abbas Ahmad ibn al-Hajj al-Amin al-Tawathi al-Ghalawi, Kashf al-Ghummah fi
        Nafa al-Ummah (The Important Stars Among the Multitude of the Heavens), copied 1733: a diagram
        of the rotation of the heavens. Mamma Haidara Commemorative Library, Timbuktu"
      ru: "Насир ад-Дин Абу-ль-Аббас Ахмад ибн аль-Хадж аль-Амин ат-Тавати аль-Галави, «Кашф аль-гумма фи
        наф аль-умма» («Важнейшие звёзды среди множества небес»), список 1733 года: схема вращения
        небесных сфер. Мемориальная библиотека Маммы Хайдары, Томбукту"
    credit: Mamma Haidara Commemorative Library, Timbuktu; Library of Congress exhibition Ancient
      Manuscripts from the Desert Libraries of Timbuktu, via Wikimedia Commons
    license: Public domain
    url: https://www.loc.gov/exhibits/mali/mali-exhibit.html
    place:
      en: Timbuktu
      ru: Томбукту
    year: "1733"
    note:
      en: The book was written to train scholars in astronomy. Its author explains how to use the
        movements of the stars to reckon the beginning of the seasons and how to cast horoscopes,
        among much else. This copy belongs to the Mamma Haidara Commemorative Library in Timbuktu,
        which lent it to the Library of Congress for an exhibition of the manuscripts of Timbuktu.
      ru: Эту книгу написали, чтобы учить знатоков астрономии. Автор объясняет, как по движению звёзд
        рассчитать начало времён года и как составлять гороскопы, и рассказывает ещё о многом. Список
        принадлежит Мемориальной библиотеке Маммы Хайдары в Томбукту, которая одолжила его Библиотеке
        Конгресса США для выставки рукописей Томбукту.
    cards:
      - timbuktu-manuscripts
  - id: ahmad-baba-miraj-al-suud
    drawer: letters
    shape: book
    image: cab-ahmad-baba-miraj-al-suud.jpg
    caption:
      en: "Ahmad Baba al-Timbukti, Mi'raj al-Su'ud ila nayl Majlub al-Sudan (The Ladder of Ascent in
        Obtaining the Procurements of the Sudan: Ahmad Baba Answers a Moroccan's Questions about
        Slavery), first page. Mamma Haidara Commemorative Library, Timbuktu"
      ru: "Ахмад Баба ат-Тимбукти, «Мирадж ас-суʿуд иля найль маджлюб ас-Судан» («Лестница восхождения к
        постижению привозимых из Судана: Ахмад Баба отвечает на вопросы марокканца о рабстве»), первая
        страница. Мемориальная библиотека Маммы Хайдары, Томбукту"
    credit: Mamma Haidara Commemorative Library, Timbuktu; World Digital Library (Library of Congress),
      via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:The_Ladder_of_Ascent_in_Obtaining_the_Procurements_of_the_Sudan-_Ahmad_Baba_Answers_a_Moroccan%E2%80%99s_Questions_about_Slavery_WDL9661.pdf
    place:
      en: Timbuktu
      ru: Томбукту
    year: 17th century
    note:
      en: The Timbuktu scholar Ahmad Baba answers questions sent from Morocco about slavery as it existed
        in West Africa in the seventeenth century. He argues from Islamic law, and he starts from the
        principle that the fundamental and original nature of humanity is freedom; a person may be
        enslaved only under certain very specific conditions.
      ru: Учёный из Томбукту Ахмад Баба отвечает на вопросы, присланные из Марокко, о рабстве, каким оно
        было в Западной Африке XVII века. Он рассуждает как знаток исламского права и исходит из того,
        что изначальная, коренная природа человека — свобода, а обратить человека в рабство можно лишь
        при немногих строго определённых условиях.
    cards:
      - timbuktu-manuscripts
