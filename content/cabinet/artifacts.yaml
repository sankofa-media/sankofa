    place:
      en: United States
      ru: США
    year: early 1920s
    note:
      en: No American flying school would accept her, so Coleman trained in France and on 15 June 1921
        received her licence from the Fédération Aéronautique Internationale. Back home she flew
        stunts at air shows and would perform only if the crowd was desegregated. Seventy-one years
        after her licence, Mae Jemison took a photograph of her into orbit.
      ru: Ни одна американская лётная школа её не приняла, поэтому Коулман училась во Франции и 15 июня
        1921 года получила свидетельство Международной авиационной федерации. Вернувшись домой, она
        выступала с фигурами высшего пилотажа на авиашоу и соглашалась летать только перед публикой,
        не разделённой по цвету кожи. Через семьдесят один год после её свидетельства Мэй Джемисон
        взяла её фотографию с собой на орбиту.
    cards:
      - bessie-coleman
  - id: parks-bus-diagram-1955
    drawer: seals
    shape: paper
    image: cab-parks-bus-diagram-1955.jpg
    caption:
      en: "Diagram of the bus showing where Rosa Parks was seated, marked Exhibit A and dated 22 February
        1956: the ten front seats, and in the row behind them, on the right, the seat labelled 'Rosa
        Parks'."
      ru: "Схема автобуса с местом, где сидела Роза Паркс, с пометкой «Приложение A» и датой 22 февраля
        1956 года: десять передних мест, а в ряду за ними, справа, — место с подписью «Rosa Parks»."
    credit: U.S. District Court for the Middle District of Alabama, Northern (Montgomery) Division,
      Browder v. Gayle, Civil Case 1147; National Archives at Atlanta, Record Group 21 (National
      Archives Identifier 596069)
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Diagram_of_the_Bus_Showing_Where_Rosa_Parks_Was_Seated_(6022921215).jpg
    place:
      en: Montgomery, Alabama
      ru: Монтгомери, Алабама
    year: 1955–1956
    note:
      en: On Montgomery's buses the front ten seats were kept for white passengers, and Parks sat in the
        first row behind them. When the white section filled, the driver ordered the four Black riders
        in her row to leave their seats, and Parks refused. The diagram was later entered as evidence
        in Browder v. Gayle, the federal case that ended segregation on the city's buses in 1956.
      ru: В автобусах Монтгомери десять передних мест держали для белых, а Паркс сидела в первом ряду
        сразу за ними. Когда белая часть салона заполнилась, водитель велел всем четверым чернокожим
        из её ряда освободить места, и Паркс отказалась. Позже схему приложили как доказательство к
        делу «Браудер против Гейла» — федеральному иску, который в 1956 году покончил с сегрегацией в
        городских автобусах.
