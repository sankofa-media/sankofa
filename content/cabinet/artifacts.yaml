      - cindy-campbell
  - id: kool-herc-hunts-point
    drawer: voices
    shape: photo
    image: cab-kool-herc-hunts-point.jpg
    caption:
      en: DJ Kool Herc at the turntables in Hunts Point, the Bronx, at an event on "The West Indian Roots
        of Hip-Hop", 28 February 2009.
      ru: Диджей Кул Херк за вертушками в Хантс-Пойнте, Бронкс, на вечере «Вест-индские корни хип-хопа»,
        28 февраля 2009 года.
    credit: Bigtimepeace, via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Herc_on_the_Wheels_of_Steel.JPG
    place:
      en: Hunts Point, the Bronx
      ru: Хантс-Пойнт, Бронкс
    year: "2009"
    note:
      en: Thirty-six years after his sister's party, Herc is still at two turntables in the Bronx. His
        merry-go-round, switching between two copies of the same record to keep the drum break
        going, shaped the Bronx DJs who came after him.
      ru: Через тридцать шесть лет после вечеринки сестры Херк всё так же стоит за двумя вертушками в
        Бронксе. Его «карусель» — переключение между двумя экземплярами одной пластинки, чтобы
        барабанный брейк не кончался, — повлияла на бронксских диджеев, пришедших следом.
    cards:
      - hip-hop
      - cindy-campbell
