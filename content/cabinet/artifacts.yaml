  - id: linden-idia-mask
    drawer: returned
    shape: object
    image: cab-linden-idia-mask.jpg
    caption:
      en: Miniature mask of the queen mother Idia, Edo, kingdom of Benin, 16th century; ivory, coral and
        glass beads, height 19.5 cm. Formerly Linden-Museum Stuttgart, F 50565
      ru: Миниатюрная маска царицы-матери Идии, эдо, царство Бенин, XVI век; слоновая кость, коралловые и
        стеклянные бусины, высота 19,5 см. Прежде — Линден-музей, Штутгарт, F 50565
    credit: Linden-Museum Stuttgart, photo Anatol Dreyer, via Wikimedia Commons
    license: CC BY-SA 3.0
    url: https://commons.wikimedia.org/wiki/File:Miniaturmaske,_Edo.jpg
    place:
