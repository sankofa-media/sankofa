  - id: carolina-rice-fanner-basket
    drawer: seas
    shape: object
    image: cab-carolina-rice-fanner-basket.jpg
    caption:
      en: A rice fanner coiled from reeds, rush and palmetto, made by an enslaved person on the South
        Carolina coast before 1863; a faded purple string is knotted inside.
      ru: Веялка для риса, свитая из тростника, камыша и пальмовых листьев; её сделал порабощённый мастер
        на побережье Южной Каролины до 1863 года. Внутри завязан выцветший лиловый шнурок.
    credit: Unidentified maker. Collection of the Smithsonian National Museum of African American
      History and Culture (2017.108.18.2)
    license: CC0
    url: https://nmaahc.si.edu/object/nmaahc_2017.108.18.2
    place:
      en: South Carolina coast
      ru: Побережье Южной Каролины
    year: before 1863
    note:
      en: "Without a fanner like this one the rice of the plantations could not have been cleaned: the
        threshed grain was tossed into the air, and the wind took the chaff. The basket once belonged
        to the Old Slave Mart Museum in Charleston, which Miriam B. Wilson founded in 1937 as a museum
        of crafts made by enslaved people."
      ru: "Без такой веялки рис с плантаций нельзя было бы очистить: обмолоченное зерно подбрасывали в
        воздух, и ветер уносил мякину. Когда-то корзина принадлежала Музею старого невольничьего рынка
        в Чарлстоне, который Мириам Б. Уилсон основала в 1937 году как музей ремёсел порабощённых
        людей."
    cards:
      - gullah
  - id: senegal-rice-fanner-basket
    drawer: seas
    shape: object
    image: cab-senegal-rice-fanner-basket.jpg
    caption:
      en: "A rice fanner from Senegal, 2010: a large, round, shallow tray of coiled sweetgrass and other
        plant fibres, 47 cm across."
      ru: "Веялка для риса из Сенегала, 2010 год: большой круглый плоский поднос из свитой спиралью
        душистой травы и других растительных волокон, 47 сантиметров в поперечнике."
    credit: Unidentified maker. Collection of the Smithsonian National Museum of African American
      History and Culture (2014.96.1)
    license: CC0
    url: https://nmaahc.si.edu/object/nmaahc_2014.96.1
    place:
      en: Senegal
      ru: Сенегал
    year: "2010"
    note:
      en: "The same wide tray is woven on both sides of the ocean. The fanner was common to Senegambia and
        South Carolina alike: West Africans brought the knowledge of rice and the skill of
        basket-making to the plantations of the Americas, where it built the wealth of the rice
        planters."
      ru: "Один и тот же широкий поднос плетут по обе стороны океана. Веялка была в ходу и в Сенегамбии, и
        в Южной Каролине: западноафриканцы принесли на плантации Америки умение растить рис и плести
