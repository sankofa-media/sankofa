        streamers, November 1939. Photograph by Marion Post Wolcott for the Farm Security
        Administration."
      ru: "«Субботний вечер в джук-джойнте под Кларксдейлом, дельта Миссисипи»: пары танцуют под бумажными
        гирляндами, ноябрь 1939 года. Фотография Мэрион Пост Уолкотт для Администрации по делам
