        company went bankrupt, and its catalogue passed to Paramount.
      ru: Гарри Пейс назвал свой лейбл в честь Элизабет Тейлор Гринфилд — певицы XIX века, которую звали
        «Чёрным лебедем». Первые пластинки вышли в мае 1921 года, и Пейс давал рекламу в чернокожей
        прессе. Вскоре «Down Home Blues» Этель Уотерс стала хитом, но в декабре 1923 года компания
        разорилась, и её каталог перешёл к Paramount.
    cards:
