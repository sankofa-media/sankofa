      ru: Это те самые девять студентов, которые в октябре 1871 года выехали из Нашвилла вместе с Джорджем
        Уайтом. Пели они поначалу в основном популярные и концертные вещи, а спиричуэлс оставляли на
        бис, но хвалили слушатели именно спиричуэлс, и именно эти песни принесли певцам славу.
