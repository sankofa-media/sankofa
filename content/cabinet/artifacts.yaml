      en: Alan Lomax took this photograph at the end of 1934, after he had joined his father and Lead
        Belly on a long round of Southern prisons that took them into South Carolina. Crews like this
        one had song leaders who called out a line while the others answered with a refrain, and the
        singing kept the movements of shared labour together, the swing of the axes among them.
      ru: "Алан Ломакс сделал этот снимок в конце 1934 года, когда присоединился к отцу и Лед Белли в
        долгой поездке по тюрьмам Юга, — она привела их и в Южную Каролину. У таких бригад был свой
        запевала: он выкрикивал строку, остальные отвечали припевом, и песня держала в одном ритме
        общую работу, в том числе взмахи топоров."
