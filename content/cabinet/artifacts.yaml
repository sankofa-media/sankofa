# The things the caches hold, and the drawers they belong in. Facts behind every
# note: ledger/cabinet.yaml; image rights: ledger/media-cabinet.yaml.
artifacts:
  - id: seamens-protection-dunbar
    drawer: seas
    shape: paper
    image: cab-seamens-protection-dunbar.jpg
    caption:
      en: "Philadelphia, 12 July 1810: before Alderman Alexander Tod, James Forten swears that
        eleven-year-old James Forten Dunbar was born in the city; the description adds 'Born free'.
        The boy signs with his mark."
      ru: "Филадельфия, 12 июля 1810 года: перед олдерменом Александром Тодом Джеймс Фортен клянётся, что
        одиннадцатилетний Джеймс Фортен Данбар родился в этом городе; к описанию приписано: «Рождён
        свободным». Мальчик вместо подписи ставит знак."
    credit: National Archives and Records Administration, RG 36, Proofs of Citizenship, Philadelphia;
      scan via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Seaman%27s_Protection_Certificate_issued_to_James_Forten_Dunbar_on_12_July_1810_at_Philadlphia_Pa.jpg
    place:
      en: Philadelphia, Pennsylvania
      ru: Филадельфия, Пенсильвания
    year: "1810"
    note:
      en: A boy of eleven bound for sea had to prove that he was an American, and in his case that he was
        free. The paper describes him down to an inoculation mark on his arm and a dog bite on his
        shin. His witness was James Forten, the wealthy Philadelphia sailmaker who used his fortune
        in the fight against slavery.
      ru: Одиннадцатилетнему мальчику, уходившему в море, нужно было доказать, что он американец, а в его
        случае ещё и что он свободен. Бумага описывает его до мелочей — вплоть до следа прививки на
        руке и шрама от собачьего укуса на голени. Поручился за него Джеймс Фортен — богатый
        филадельфийский парусный мастер, тративший своё состояние на борьбу с рабством.
    cards:
      - paul-cuffe
  - id: equiano-bahama-banks
    drawer: seas
    shape: drawing
    image: cab-equiano-bahama-banks.jpg
    caption:
      en: "'Bahama Banks, 1767': the sloop Nancy breaking up on the rocks, engraved by Barnes & Co. after
        Samuel Atkins; beneath it, lines from the Book of Job about God speaking to men in dreams."
      ru: "«Багамская банка, 1767»: шлюп «Нэнси» разбивается о скалы; гравюра «Барнс и К°» по рисунку
        Сэмюэла Аткинса. Под ней — строки из Книги Иова о том, как Бог говорит с людьми в
        сновидениях."
    credit: Barnes & Co. after Samuel Atkins; National Maritime Museum, Greenwich, London (PAD6489), via
      Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Bahama_Banks_1767_RMG_PU6489.jpg
    place:
      en: London (print); the Bahama Banks (scene)
      ru: Лондон (гравюра); Багамская банка (место действия)
    year: about 1790
    note:
      en: "Equiano was a working seaman as well as a writer, and his Narrative tells how the Nancy, on
        which he sailed, was wrecked on the Bahama Banks in 1767. She carried enslaved Africans in
        her hold: Equiano sailed inside the very trade he would later attack in print. This plate
        was made to illustrate his book."
      ru: "Эквиано был не только писателем, но и моряком, и в его «Удивительном повествовании» рассказано,
        как в 1767 году на Багамской банке разбился шлюп «Нэнси», на котором он ходил. В трюме шлюп
        вёз порабощённых африканцев: Эквиано плавал внутри той самой торговли, против которой потом
        выступит в печати. Гравюру сделали специально для его книги."
    cards:
      - equiano
  - id: seacole-british-hotel
    drawer: letters
    shape: book
    image: cab-seacole-british-hotel.jpg
    caption:
      en: "'Mrs. Seacole's Hotel in the Crimea': officers at a long table in a store stacked with bottles,
        jars and barrels; illustration from Wonderful Adventures of Mrs Seacole in Many Lands
        (London, 1857)."
      ru: "«Гостиница миссис Сикол в Крыму»: офицеры за длинным столом в лавке, заставленной бутылками,
        банками и бочками; иллюстрация из книги «Удивительные приключения миссис Сикол в разных
        странах» (Лондон, 1857)."
    credit: "Mary Seacole, Wonderful Adventures of Mrs Seacole in Many Lands (London: James Blackwood,
      1857); image from Project Gutenberg eBook #23031"
    license: Public domain
    url: https://www.gutenberg.org/files/23031/23031-h/23031-h.htm
    place:
      en: London (book); Spring Hill near Balaclava, Crimea (scene)
      ru: Лондон (книга); Спринг-Хилл под Балаклавой, Крым (место действия)
    year: "1857"
    note:
      en: In the Crimean War Mary Seacole and Thomas Day, a relative of her late husband, ran the British
        Hotel at Spring Hill near Balaclava, a store and canteen that sold supplies and medicines to
        the army. Her memoir, printed in London by James Blackwood in 1857, shows it crowded with
        officers, bottles and barrels.
      ru: Во время Крымской войны Мэри Сикол и Томас Дей, родственник её покойного мужа, держали
        «Британский отель» в Спринг-Хилле под Балаклавой — лавку и столовую, где армии продавали
        припасы и лекарства. В её воспоминаниях, напечатанных в Лондоне у Джеймса Блэквуда в 1857
        году, отель полон офицеров, бутылок и бочек.
    cards:
      - mary-seacole
  - id: box-brown-resurrection
    drawer: voices
    shape: drawing
    image: cab-box-brown-resurrection.jpg
    caption:
      en: "The Resurrection of Henry Box Brown at Philadelphia: Brown rises from the crate in the
        anti-slavery office as men look on; lithograph published by A. Donnelly, New York, 1850."
      ru: "«Воскресение Генри „Бокса“ Брауна в Филадельфии»: Браун поднимается из ящика в конторе
        противников рабства, вокруг стоят мужчины; литография, издатель А. Доннелли, Нью-Йорк,
        1850."
    credit: Published by A. Donnelly, New York; Library of Congress Prints and Photographs Division
    license: Public domain
    url: https://www.loc.gov/item/2004665363/
    place:
      en: New York
      ru: Нью-Йорк
    year: "1850"
    note:
      en: "Brown did not leave his story to others: the line under this print says it was entered for
        copyright in 1850 by Henry Box Brown himself. That April his moving panorama, Henry Box
        Brown's Mirror of Slavery, opened in Boston, and he later took it to England."
      ru: "Браун не отдал свою историю в чужие руки: строка под гравюрой сообщает, что права на неё в 1850
        году зарегистрировал сам Генри «Бокс» Браун. В апреле того же года в Бостоне открылась его
        движущаяся панорама «Зеркало рабства Генри „Бокса“ Брауна», а потом он повёз её в Англию."
    cards:
      - underground-railroad-myths
  - id: box-brown-narrative-1849
    drawer: letters
    shape: book
    image: cab-box-brown-narrative-1849.jpg
    caption:
      en: "Title page: Narrative of Henry Box Brown, who escaped from slavery enclosed in a box 3 feet
        long and 2 wide, 'written from a statement of facts made by himself', with remarks by
        Charles Stearns; Boston: Brown & Stearns. Boston Public Library copy."
      ru: "Титульный лист: «Повествование Генри „Бокса“ Брауна, бежавшего из рабства в ящике длиной в 3
        фута и шириной в 2», «записано по изложению фактов, сделанному им самим», с замечаниями
        Чарльза Стернса; Бостон: Brown & Stearns. Экземпляр Бостонской публичной библиотеки."
    credit: Boston Public Library copy, via Internet Archive (narrativeofhenry00brow_0) and Wikimedia
      Commons
    license: Public domain
    url: https://commons.wikimedia.org/w/index.php?title=File:Narrative_of_Henry_Box_Brown_-_who_escaped_from_slavery_enclosed_in_a_box_three_feet_long_and_two..._(IA_narrativeofhenry00brow_0).pdf&page=7
    place:
      en: Boston, Massachusetts
      ru: Бостон, Массачусетс
    year: "1849"
    note:
      en: "The first book about the escape came out in Boston in September 1849, half a year after the box
        was opened. Its title page is honest about who held the pen: Charles Stearns wrote it from
        Brown's statement. In 1851 Brown brought out a new version in Manchester, this time 'Written
        by Himself'."
      ru: "Первая книга о побеге вышла в Бостоне в сентябре 1849 года, через полгода после того, как
        вскрыли ящик. Титульный лист честно говорит, кто держал перо: Чарльз Стернс записал её со
        слов Брауна. В 1851 году Браун выпустил в Манчестере новую версию — на этот раз «написанную
        им самим»."
    cards:
      - underground-railroad-myths
  - id: still-underground-rail-road
    drawer: underground
    shape: book
    image: cab-still-underground-rail-road.jpg
    caption:
      en: "Title page of William Still's The Underground Rail Road (Philadelphia: Porter & Coates, 1872);
        it names him chairman of the Acting Vigilant Committee of the Philadelphia branch and adds
        'Sold only by subscription'."
      ru: "Титульный лист книги Уильяма Стилла «Подземная железная дорога» (Филадельфия: Porter & Coates,
        1872); автор назван председателем действующего Комитета бдительности филадельфийского
        отделения, внизу пометка: «Продаётся только по подписке»."
    credit: "William Still, The Underground Rail Road (Philadelphia: Porter & Coates, 1872); Johns
      Hopkins University copy, via Internet Archive (undergroundrailro00stil) and Wikimedia Commons"
    license: Public domain
    url: https://commons.wikimedia.org/w/index.php?title=File:The_underground_rail_road._A_record_of_facts,_authentic_narratives,_letters,_etc.,_narrating_the_hardships_(IA_undergroundrailro00stil).pdf&page=9
    place:
      en: Philadelphia, Pennsylvania
      ru: Филадельфия, Пенсильвания
    year: "1872"
    note:
      en: In 1872 Still printed the records he had once hidden. Among the stories is Henry Box Brown's
        arrival, told by one of the witnesses who saw the box opened, and there are several accounts
        of Harriet Tubman.
      ru: В 1872 году Стилл напечатал записи, которые когда-то прятал. Среди этих историй есть и прибытие Генри
        «Бокса» Брауна, рассказанное одним из тех, кто видел, как вскрывали ящик, и несколько
        рассказов о Гарриет Табмен.
    cards:
      - underground-railroad-myths
  - id: still-twenty-eight-fugitives
    drawer: underground
    shape: drawing
    image: cab-still-twenty-eight-fugitives.jpg
    caption:
      en: "Twenty-eight Fugitives Escaping from the Eastern Shore of Maryland: a group on foot in driving
        rain; engraving from William Still's The Underground Rail Road (Philadelphia, 1872)."
      ru: "«Двадцать восемь беглецов уходят с Восточного берега Мэриленда»: люди идут пешком под проливным
        дождём; гравюра из книги Уильяма Стилла «Подземная железная дорога» (Филадельфия, 1872)."
    credit: "From William Still, The Underground Rail Road (Philadelphia: Porter & Coates, 1872);
      Library of Congress Prints and Photographs Division"
    license: Public domain
    url: https://www.loc.gov/item/2002698205/
    place:
      en: Cambridge, Maryland, to Philadelphia (scene); Philadelphia (book)
      ru: Из Кембриджа (Мэриленд) в Филадельфию (место действия); Филадельфия (книга)
    year: "1872"
    note:
      en: In October 1857 twenty-eight people, whole families with small children among them, left
        Cambridge on Maryland's Eastern Shore together. Still recorded each name, and beside their
        story he printed the reward notice their enslaver Samuel Pattison issued on 26 October.
      ru: В октябре 1857 года двадцать восемь человек — среди них целые семьи с маленькими детьми — вместе
        ушли из Кембриджа на Восточном берегу Мэриленда. Стилл записал каждое имя, а рядом с их
        историей напечатал объявление о награде, которое 26 октября дал их хозяин Сэмюэл Паттисон.
    cards:
      - underground-railroad-myths
  - id: negro-migration-during-the-war
    drawer: letters
    shape: book
    image: cab-negro-migration-during-the-war.jpg
    caption:
      en: Page 30 of Emmett J. Scott, Negro Migration During the War (New York, 1920), on the Chicago
        Defender.
      ru: Страница 30 книги Эммета Дж. Скотта Negro Migration During the War (Нью-Йорк, 1920) — о
        «Чикаго дефендер».
    credit: Emmett J. Scott, Negro Migration During the War (Oxford University Press, 1920); scan via
      Internet Archive and Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Negro_migration_during_the_war_(IA_negromigration00scott).pdf
    place:
      en: New York
      ru: Нью-Йорк
    year: "1920"
    note:
      en: The paper enters the cabinet through a book that measured it. Emmett J. Scott's study of the wartime migration,
        written for the Carnegie Endowment for International Peace, gives the Defender's 1918 sale
        as 125,000, says it named the exodus the Great Northern Drive and set the date of 15 May,
        and notes that its sale was forbidden in several Southern towns.
      ru: Газета попадает в кабинет через книгу, которая её измерила. Своё исследование о переселении военных лет
        Эммет Дж. Скотт написал для Фонда Карнеги за международный мир, и в нём он приводит тираж
        «Дефендера» в 1918 году — 125 000 экземпляров, пишет, что газета назвала исход «Великим
        походом на Север» и назначила ему дату, 15 мая, и отмечает, что в нескольких южных городах
        её продажу запретили.
    cards:
      - chicago-defender
      - migration-series
  - id: pullman-porter-union-station
    drawer: heap
    shape: photo
    image: cab-pullman-porter-union-station.jpg
    caption:
      en: Pullman porter at Union Station, Chicago, January 1943. Photograph by Jack Delano for the Office
        of War Information.
      ru: Пульмановский проводник на вокзале Юнион-стейшн, Чикаго, январь 1943 года. Фото Джека Делано для
        Управления военной информации.
    credit: Jack Delano, U.S. Office of War Information; Library of Congress, Prints & Photographs
      Division, FSA/OWI Collection
    license: Public domain
    url: https://www.loc.gov/item/2017843898/
    place:
      en: Union Station, Chicago
      ru: Юнион-стейшн, Чикаго
    year: "1943"
    note:
      en: From its earliest days the Pullman Company hired Black men as its porters. The work was hard,
        yet it was one of the most prized and prestigious jobs open to Black men. Porters like this
        one, on the southbound runs, carried the Defender into towns that tried to keep it out.
      ru: С первых же лет компания Пульмана брала в проводники чернокожих мужчин. Работа была тяжёлой, и
        всё же из мест, открытых для чернокожего, это было одно из самых завидных и престижных.
        Такие проводники, как этот, на южных рейсах провозили «Дефендер» в города, которые пытались
        его не пустить.
    cards:
      - chicago-defender
  - id: empire-windrush
    drawer: seas
    shape: photo
    image: cab-empire-windrush.jpg
    caption:
      en: HMT Empire Windrush, photographed by a Royal Navy official photographer between 1945 and 1954
        (Imperial War Museums, FL 9448).
      ru: «Эмпайр Уиндраш» на снимке официального фотографа Королевского флота, 1945–1954 годы (Имперские
        военные музеи, FL 9448).
    credit: Royal Navy official photographer; Imperial War Museums (FL 9448), via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:HMT_Empire_Windrush_FL9448.jpg
    place:
      en: At sea
      ru: В море
    year: 1945–1954
    note:
      en: This is the troopship whose name became the name of a generation. She docked at Tilbury with her
        Caribbean passengers on 22 June 1948, and that date is now marked every year as Windrush
        Day.
      ru: Это военный транспорт, чьё имя стало именем целого поколения. 22 июня 1948 года он привёз в
        Тилбери пассажиров с Карибских островов, и теперь этот день ежегодно отмечают как День
        «Уиндраша».
    cards:
      - windrush-scandal
  - id: sam-king-plaque
    drawer: seas
    shape: photo
    image: cab-sam-king-plaque.jpg
    caption:
      en: "Blue plaque of the London Borough of Southwark for Sam King: Mayor of Southwark 1983–84,
        wartime RAF serviceman, passenger on the Empire Windrush. Photographed in 2015."
      ru: "Синяя табличка лондонского боро Саутуарк в честь Сэма Кинга: мэр Саутуарка в 1983–1984 годах,
        служил в Королевских ВВС в войну, пассажир «Эмпайр Уиндраша». Снимок 2015 года."
    credit: Warren Bennett, via Wikimedia Commons
    license: CC BY-SA 4.0
    url: https://commons.wikimedia.org/wiki/File:Sam_King_plaque.jpg
    place:
      en: Southwark, London
      ru: Саутуарк, Лондон
    year: "2015"
    note:
      en: Sam King, born in Jamaica, served as an RAF engineer in Britain during the Second World War,
        went home, and came back on the Windrush in 1948 to rejoin the RAF. In 1983 he was elected
        Mayor of Southwark, the borough's first Black mayor.
      ru: Сэм Кинг родился на Ямайке, в войну служил в Британии механиком Королевских ВВС, вернулся домой,
        а в 1948 году приплыл на «Уиндраше», чтобы снова поступить в ВВС. В 1983 году его избрали
        мэром Саутуарка — первым чернокожим мэром боро.
    cards:
      - windrush-scandal
  - id: clapham-south-shelter
    drawer: seas
    shape: photo
    image: cab-clapham-south-shelter.jpg
    caption:
      en: Bunks in the Clapham South deep-level shelter, photographed in 2016.
      ru: Нары в глубоком бомбоубежище «Клэпем-Саут», снимок 2016 года.
    credit: Matt Brown, via Flickr and Wikimedia Commons
    license: CC BY 2.0
    url: https://commons.wikimedia.org/wiki/File:Bunks_Clapham_South_Deep_Level_Shelter.jpg
    place:
      en: Clapham South, London
      ru: Клэпем-Саут, Лондон
    year: "2016"
    note:
      en: In June 1948, 236 Windrush passengers with nowhere to go were housed in this shelter deep under
        Clapham South Tube station; many spent their first month in Britain underground here. 
      ru: В июне 1948 года 236 пассажиров «Уиндраша», которым некуда было идти, поселили в этом убежище
        глубоко под станцией «Клэпем-Саут»; многие провели здесь, под землёй, свой первый месяц в
        Британии. 
    cards:
      - windrush-scandal
