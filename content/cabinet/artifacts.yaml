    place:
      en: Near Clarksdale, Mississippi
      ru: Окрестности Кларксдейла, Миссисипи
    year: "1939"
    note:
      en: Marion Post Wolcott photographed for the Farm Security Administration from 1938 to 1942. In
        November 1939 she spent a Saturday night in a juke joint just outside Clarksdale. Less than
        two years later, in August 1941, Alan Lomax and John Work recorded Muddy Waters in his own
        juke joint on the Stovall Plantation, near the same town.
      ru: Мэрион Пост Уолкотт снимала для Администрации по делам фермерских хозяйств с 1938 по 1942 год. В
        ноябре 1939 года она провела субботний вечер в джук-джойнте сразу за Кларксдейлом. А меньше
        чем через два года, в августе 1941-го, Алан Ломакс и Джон Уорк записали Мадди Уотерса в его
        собственном джук-джойнте в поместье Стовалл, под тем же самым городом.
    cards:
      - blues
  - id: skopinski-johnson-tn-d233
    drawer: sky
    shape: paper
    image: cab-skopinski-johnson-tn-d233.jpg
    caption:
      en: "NASA Technical Note D-233, Determination of Azimuth Angle at Burnout for Placing a Satellite
        over a Selected Earth Position, by T. H. Skopinski and Katherine G. Johnson, Langley Research
        Center, September 1960: the title page."
      ru: "Техническая записка НАСА D-233 «Определение азимута в момент выключения двигателя для вывода
        спутника в заданную точку над Землёй», авторы — Т. Х. Скопински и Кэтрин Г. Джонсон,
        Исследовательский центр Лэнгли, сентябрь 1960 года: титульный лист."
    credit: T. H. Skopinski and Katherine G. Johnson, NASA Technical Note D-233 (1960); NASA Technical
      Reports Server, 19980227091
    license: Public domain
    url: https://ntrs.nasa.gov/citations/19980227091
    place:
      en: Langley Research Center, Virginia
      ru: Исследовательский центр Лэнгли, Виргиния
    year: "1960"
    note:
      en: In those years no woman in Johnson's division had had her name on a report. Her co-author, Ted
        Skopinski, was about to leave for Houston, and he told their supervisor that Katherine should
        finish the report, since she had done most of the work. So her name went on it, the first time
        a woman of the Flight Research Division was credited as an author. The note lays out the
        equations for an orbital flight in which the landing point is chosen in advance.
      ru: "В те годы ни одной женщине в отделе, где работала Джонсон, ещё не доводилось увидеть своё имя
        на обложке отчёта. Её соавтор Тед Скопински собирался перебираться в Хьюстон и сказал
        начальнику, что дописывать отчёт должна Кэтрин — большую часть работы всё равно сделала она.
        Так её имя и появилось на титуле: впервые женщину из отдела лётных исследований указали
        автором. В записке выведены уравнения орбитального полёта, у которого место посадки выбрано
        заранее."
    cards:
      - katherine-johnson
  - id: voyager-golden-record-cover-1977
    drawer: voices
    shape: photo
    image: cab-voyager-golden-record-cover-1977.jpg
    caption:
      en: Engineers in clean-room suits secure the cover over the Golden Record on the side of Voyager 1,
        1977.
      ru: Инженеры в костюмах для чистых помещений закрепляют крышку над «Золотой пластинкой» на борту
        «Вояджера-1», 1977 год.
    credit: NASA/JPL-Caltech, PIA21740
    license: Public domain
    url: https://photojournal.jpl.nasa.gov/catalog/PIA21740
