    year: "1977"
    note:
      en: The record flew sealed in an aluminium jacket together with a cartridge and a needle, and the
        instructions on its cover, in symbolic language, show how it is to be played. Not every song
        got aboard easily. Chuck Berry's "Johnny B. Goode" met resistance in the group that chose the
        music, and almost stayed on Earth.
      ru: Пластинка улетела запечатанной в алюминиевый конверт вместе с головкой звукоснимателя и иглой, а
        на крышке символическим языком показано, как её проигрывать. Не всякая песня попала на борт
        легко. «Johnny B. Goode» Чака Берри встретила сопротивление среди тех, кто отбирал музыку, и
        едва не осталась на Земле.
    cards:
      - johnny-b-goode
  - id: jemison-spacelab-j-1992
    drawer: sky
    shape: photo
    image: cab-jemison-spacelab-j-1992.jpg
    caption:
      en: Mae Jemison floating in the Spacelab-J science module aboard the space shuttle Endeavour,
        STS-47, September 1992; a 35 mm frame taken in orbit.
      ru: Мэй Джемисон парит в научном модуле «Спейслэб-J» на борту шаттла «Индевор», миссия STS-47,
        сентябрь 1992 года; 35-миллиметровый кадр, снятый на орбите.
    credit: NASA, Johnson Space Center, STS047-37-003
    license: Public domain
    url: https://images.nasa.gov/details/STS047-37-003
    place:
      en: Earth orbit
      ru: Околоземная орбита
    year: "1992"
    note:
      en: STS-47, a joint mission of the United States and Japan, was Jemison's first and only flight; she
        went up on 12 September and came back on 20 September 1992. She opened her shifts in orbit
        with the line of Lieutenant Uhura from Star Trek, "Hailing frequencies open". In 1993 she left
        NASA.
      ru: "Совместная миссия США и Японии STS-47 стала для Джемисон первым и единственным полётом: она
        стартовала 12 сентября и вернулась 20 сентября 1992 года. Каждую смену на орбите она начинала
        словами лейтенанта Ухуры из «Звёздного пути»: «Частоты для связи открыты». В 1993 году она
        ушла из НАСА."
    cards:
      - mae-jemison
  - id: mcnair-saxophone-1984
    drawer: sky
    shape: photo
    image: cab-mcnair-saxophone-1984.jpg
    caption:
      en: Ronald McNair plays his saxophone in his off-duty time aboard the space shuttle Challenger,
        STS-41B, 8 February 1984.
      ru: Рональд Макнэр в свободное от вахты время играет на саксофоне на борту шаттла «Челленджер»,
        миссия STS-41B, 8 февраля 1984 года.
    credit: NASA, Johnson Space Center, S84-27211
    license: Public domain
    url: https://images.nasa.gov/details/S84-27211
    place:
      en: Earth orbit
      ru: Околоземная орбита
    year: "1984"
    note:
      en: McNair grew up in segregated Lake City, South Carolina, and in February 1984 became the second
        African American in space and the first person to play a saxophone in orbit. On his second
        flight he was to record a saxophone solo for Jean-Michel Jarre's next album. That flight was
        Challenger's last, on 28 January 1986, and Jarre named the track Last Rendez-Vous (Ron's
        Piece).
      ru: Макнэр вырос в Лейк-Сити, в Южной Каролине, где тогда царила сегрегация, а в феврале 1984 года
        стал вторым афроамериканцем в космосе и первым человеком, сыгравшим на саксофоне на орбите. Во
        втором полёте он должен был записать саксофонное соло для нового альбома Жан-Мишеля Жарра.
        Этим полётом стал последний полёт «Челленджера» 28 января 1986 года, и Жарр назвал пьесу «Last
        Rendez-Vous (Ron's Piece)».
    cards:
      - mae-jemison
  - id: coleman-flying-helmet
    drawer: sky
    shape: photo
    image: cab-coleman-flying-helmet.jpg
    caption:
      en: Bessie Coleman in a leather flying helmet with goggles, early 1920s. National Air and Space
        Museum photograph, released by NASA as GPN-2004-00027.
      ru: Бесси Коулман в кожаном лётном шлеме с очками, начало 1920-х годов. Фотография Национального
        музея авиации и космонавтики, опубликованная НАСА под номером GPN-2004-00027.
    credit: National Air and Space Museum, Smithsonian Institution; NASA Great Images in NASA,
