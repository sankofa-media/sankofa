        sword; behind him are a violin and a sheet of music."
      ru: "«Месье де Сен-Жорж, по оригинальной картине из академии мистера Г. Анджело»: меццо-тинто
        Уильяма Уорда по портрету кисти Мэзера Брауна, издано в Лондоне 4 апреля 1788 года. В руке у
