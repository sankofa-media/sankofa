      ru: Жозеф Болонь, шевалье де Сен-Жорж, родился на Гваделупе от французского плантатора и
        порабощённой женщины по имени Нанон, а в Париже стал и знаменитым фехтовальщиком, и скрипачом,
        возглавившим оркестр «Концерта любителей». В 1787 году он приехал в Лондон на показательные
        бои и 9 апреля в Карлтон-хаусе сошёлся на шпагах с шевалье д’Эоном на глазах у принца
        Уэльского — того самого принца, что взял под своё покровительство мальчика Бриджтауэра.
    cards:
