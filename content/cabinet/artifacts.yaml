      ru: В 1854 году Бакуакуа, живший тогда в Канаде, продиктовал свою историю Сэмюэлу Муру,
        аболиционисту ирландского происхождения, и переправился через границу в Детройт, чтобы
        напечатать книгу под собственным авторским правом. Вскоре он уплыл в Англию в надежде
        вернуться оттуда в Африку; после 1857 года никаких следов его не найдено.
