        вывезли из царского дворца в 1897 году; до 1909 года она оставалась у сэра Ральфа Мура и его
        семьи, потом у антрополога Чарльза Селигмана и его вдовы, в 1958 году её купил Нельсон
        Рокфеллер, и так она попала в Метрополитен-музей, где находится и сейчас.
    cards:
      - queen-idia
  - id: horniman-orhogbua-plaque
    drawer: returned
    shape: object
    image: cab-horniman-orhogbua-plaque.jpg
    caption:
      en: Plaque (ama) of Oba Orhogbua holding a staff, Benin City; 42.2 × 35.8 × 5.8 cm. Horniman Museum,
        London, 99.225, photographed in the gallery in February 2010; returned to Nigeria in November
        2022
      ru: Пластина (ама) с оба Орхогбуа, держащим посох, Бенин-Сити; 42,2 × 35,8 × 5,8 см. Музей
        Хорнимана, Лондон, 99.225; снимок сделан в зале музея в феврале 2010 года, в ноябре 2022 года
        пластину вернули Нигерии
    credit: Valerie McGlinchey (Britain Loves Wikipedia), via Wikimedia Commons
    license: CC BY-SA 2.0 UK
    url: https://commons.wikimedia.org/wiki/File:BLW_Oba_Orhogbua,_1550-1578_A.D._-_Nigeria.jpg
    place:
      en: Benin City (made); London (1899–2022)
      ru: Бенин-Сити (где создана); Лондон (1899–2022)
    year: about 1550–1578
    note:
      en: The plaque shows Oba Orhogbua, who reigned around 1550–1578, holding a staff of authority, with
        the royal tattoos called iwu on his body. Taken from Benin City in 1897, it was bought in 1899
        by Richard Quick, the Horniman's first curator. In 2022 the museum transferred ownership of
        its 72 Benin objects to Nigeria, and on 28 November this plaque was among the first six handed
        to Nigerian officials.
      ru: На пластине — оба Орхогбуа, правивший примерно в 1550–1578 годах; в руке у него посох власти, а
        тело покрывают царские татуировки иву. Из Бенин-Сити её вывезли в 1897 году, а в 1899-м её
        купил Ричард Квик, первый хранитель Музея Хорнимана. В 2022 году музей передал Нигерии право
        собственности на все свои 72 бенинских предмета, и 28 ноября эта пластина оказалась среди
        первых шести, которые вручили нигерийским представителям.
    cards:
