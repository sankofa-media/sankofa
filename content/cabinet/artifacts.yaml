    place:
      en: Detroit, Michigan
      ru: Детройт, штат Мичиган
    year: "1854"
    note:
      en: In 1854 Baquaqua, then living in Canada, dictated his story to Samuel Moore, an Irish-born
        abolitionist, and crossed the border to Detroit to have the book printed under his own
        copyright. Soon after he sailed for England, hoping to get back to Africa; after 1857 no
