    caption:
      en: "Bonn, N. Simrock, 1805: title page of the first edition of a sonata for piano and violin
        'written in a very concertante style, almost like a concerto', composed and dedicated 'to his
        friend R. Kreuzer' of the Paris Conservatoire by L. van Beethoven, Opus 47. Price, 6 francs."
      ru: "Бонн, Н. Зимрок, 1805: титульный лист первого издания сонаты для фортепиано и скрипки,
        «написанной в весьма концертном стиле, почти как концерт», сочинённой и посвящённой «своему
        другу Р. Крейцеру» из Парижской консерватории Л. ван Бетховеном, сочинение 47. Цена 6
        франков."
    credit: Ludwig van Beethoven; N. Simrock, Bonn, 1805; Ira F. Brilliant Center for Beethoven Studies,
      San José State University, via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Beethoven_Opus_47_Kreutzer_frontispiece.jpg
    place:
      en: Bonn (edition); Vienna (first performance)
      ru: Бонн (издание); Вена (первое исполнение)
    year: "1805"
    note:
      en: Beethoven wrote this sonata for George Bridgetower and gave its first performance with him in
        Vienna on 24 May 1803, so close to the deadline that parts of it were still in manuscript. By
        the time it was printed in 1805 the two men had quarrelled, and the dedication went to the
        French violinist Rodolphe Kreutzer, who, it seems, never played it.
      ru: Бетховен написал эту сонату для Джорджа Бриджтауэра и впервые сыграл её вместе с ним в Вене 24
        мая 1803 года — так впритык, что часть нот была ещё в рукописи. А когда в 1805 году соната
        вышла из печати, друзья уже успели поссориться, и посвящение досталось французскому скрипачу
        Родольфу Крейцеру, который её, судя по всему, так никогда и не сыграл.
    cards:
