  - id: havana-wharf-1899
    drawer: seas
    shape: photo
    image: cab-havana-wharf-1899.jpg
    caption:
      en: "'On the Wharf, Havana, Cuba': crates, barrels and bales piled on a pier beside the steamers,
        with workers and passers-by among them; stereograph no. 9955 of the Keystone View Company,
        copyright 1899 by B. L. Singley."
      ru: "«На пристани, Гавана, Куба»: ящики, бочки и тюки громоздятся на причале у пароходов, а между
        ними — рабочие и прохожие. Стереофотография № 9955 компании «Кистоун Вью», авторское право
        1899 года принадлежит Б. Л. Синглею."
    credit: Keystone View Company (B. L. Singley); Library of Congress Prints and Photographs Division,
      LC-DIG-stereo-1s20238
    license: Public domain
    url: https://www.loc.gov/item/2019635276/
    place:
      en: Havana, Cuba
      ru: Гавана, Куба
    year: "1899"
    note:
      en: This is the kind of waterfront rumba came from. According to the Cuban musicologist Leonardo
        Acosta, people of many African backgrounds moved to the port cities of Havana and Matanzas in
        search of work, particularly as stevedores, and built new communities there. The port itself
        gave rumba its first drums, wooden shipping crates of different sizes.
      ru: Румба родилась вот на такой портовой набережной. Кубинский музыковед Леонардо Акоста пишет, что
        в портовые города Гавану и Матансас перебирались в поисках работы люди самых разных
        африканских корней — чаще всего они шли в грузчики — и строили там новые общины. Сам порт и
        дал румбе её первые барабаны — деревянные грузовые ящики разной величины.
    cards:
      - independance-cha-cha
  - id: claves-and-conga
    drawer: voices
    shape: instrument
    image: cab-claves-and-conga.jpg
    caption:
      en: A pair of claves held ready to strike, with a conga drum behind them; photograph, 2011.
      ru: Пара клаве в руках музыканта, готового ударить палочкой о палочку; позади — барабан-конга.
        Фотография 2011 года.
    credit: Culturalis, via Flickr and Wikimedia Commons
    license: CC BY-SA 2.0
    url: https://commons.wikimedia.org/wiki/File:Latin_jazz_clave_percussion_sticks.jpg
    place:
      en: Place of the photograph not recorded
      ru: Место съёмки не указано
    year: "2011"
    note:
      en: "The clave is a simple pair of hardwood sticks struck against each other, and in rumba it
        sounded alongside the crates and spoons, giving the syncopated rhythm the whole performance
        rests on. The conga drum behind it is the crates' heir: the tumbadora originated in Cuba as
        part of the rumba, and over time it took the place of the boxes."
      ru: "Клаве — это всего лишь пара палочек из твёрдого дерева, которыми ударяют одна о другую. В румбе
        они звучали вместе с ящиками и ложками и задавали тот синкопированный ритм, на котором
        держится всё действо. А барабан-конга за ними — наследник ящиков: тумбадора родилась на Кубе
        внутри самой румбы и со временем вытеснила ящики."
    cards:
      - independance-cha-cha
  - id: post-landscape-in-brazil-1652
    drawer: heap
    shape: drawing
    image: cab-post-landscape-in-brazil-1652.jpg
    caption:
      en: "Frans Post, Landscape in Brazil, signed and dated 1652: through a screen of tropical plants, a
        pineapple and a bird in the foreground, a river winds towards a plantation, its sugar mill
        under a roof in the middle distance."
      ru: "Франс Пост, «Пейзаж в Бразилии», подписан и датирован 1652 годом: сквозь заросли тропических
        растений, мимо ананаса и птицы на переднем плане, взгляд уходит к реке и к плантации вдали,
        где под навесом стоит сахарная мельница."
    credit: Frans Post; Rijksmuseum, Amsterdam (SK-A-3224)
    license: Public domain
    url: https://www.rijksmuseum.nl/en/collection/object/Landscape-in-Brazil--c64d7560e2fbf84d34641bbf745fba01
    place:
      en: Dutch Brazil (the scene)
      ru: Голландская Бразилия (место действия)
    year: "1652"
    note:
      en: "Frans Post came to Brazil in the train of Johan Maurits and signed this canvas in 1652, eight
        years after the governor had sailed home. The Rijksmuseum's own label does not let the view
        stay pretty: the Company seized the sugar industry from the Portuguese, cane grew on
        plantations like this one, and violence forced enslaved people to do the work. What was
        painted as an idyll for Dutch buyers was a gruesome reality for those who worked there."
      ru: "Франс Пост приехал в Бразилию в свите Иоганна Морица, а этот холст подписал в 1652 году, через
        восемь лет после того, как губернатор отплыл домой. Подпись Рейксмюсеума не даёт зрителю
        залюбоваться видом: сахарное дело компания отняла у португальцев, тростник рос на таких вот
        плантациях, а работать на них невольников заставляли силой. То, что голландскому покупателю
        преподносили как идиллию, для тех, кто здесь трудился, было жестокой явью."
    cards:
      - palmares
  - id: eckhout-african-man-1641
    drawer: seas
    shape: drawing
    image: cab-eckhout-african-man-1641.jpg
    caption:
      en: "Albert Eckhout, African Man, 1641: a man with spears and a sword at his hip stands on a shore
        under a date palm, an elephant tusk on the ground at his feet."
      ru: "Альберт Экхаут, «Африканец», 1641 год: мужчина с копьями и мечом у пояса стоит на морском
        берегу под финиковой пальмой, у его ног лежит слоновый бивень."
    credit: Albert Eckhout; National Museum of Denmark (Nationalmuseet), Copenhagen; via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Albert_Eckhout_painting.jpg
    place:
      en: Painted for Johan Maurits of Dutch Brazil; the scene is the African coast
      ru: Написан для Иоганна Морица, правителя Голландской Бразилии; на картине — африканский берег
    year: "1641"
    note:
      en: "Eckhout painted his figures life-size, and this man is the pendant to his African woman. Of all
        of them only he stands not in Brazil but in Africa: the date palm and the ivory tusk, one of
        Africa's trade goods, set him there. Art historians note that Eckhout painted the African pair
        as representatives of a rich continent and kept out of sight the slavery on which the colony
        of his patron, Johan Maurits, depended."
      ru: "Экхаут писал свои фигуры в натуральную величину, и этот мужчина — парный портрет к его
        африканке. Из всех героев цикла только он стоит не в Бразилии, а в Африке: туда его переносят
        финиковая пальма и слоновая кость — один из товаров, которыми торговала Африка. Историки
        искусства замечают, что африканскую пару Экхаут написал посланцами богатого континента, а
        рабство, на котором держалась колония его покровителя Иоганна Морица, оставил за кадром."
    cards:
      - palmares
      - slavevoyages
  - id: eckhout-african-woman-1641
    drawer: seas
    shape: drawing
    image: cab-eckhout-african-woman-1641.jpg
    caption:
      en: "Albert Eckhout, African Woman and Child, 1641: under the palms of a Brazilian shore a woman in
        a broad hat holds up a woven basket of fruit; the boy beside her holds an ear of corn."
      ru: "Альберт Экхаут, «Африканка с ребёнком», 1641 год: под пальмами бразильского берега женщина в
        широкой шляпе поднимает плетёную корзину с плодами; мальчик рядом с ней держит початок
        кукурузы."
    credit: Albert Eckhout; National Museum of Denmark (Nationalmuseet), Copenhagen; via Wikimedia Commons
    license: Public domain
    url: https://commons.wikimedia.org/wiki/File:Eckhout,_Albert_-_Mulher_Africana.jpg
    place:
      en: Painted for Johan Maurits of Dutch Brazil; the scene is the Brazilian coast
      ru: Написан для Иоганна Морица, правителя Голландской Бразилии; на картине — бразильский берег
    year: "1641"
    note:
      en: "Eckhout painted her life-size. The plants and the Brazilians fishing on the shore behind her
        place her in Brazil, but her hat and her basket are African, while her jewellery and the pipe
        tucked into her waist are European: a woman carried across an ocean into a new world. She
        probably stands for an enslaved woman, yet the painter, as scholars point out, kept her
        slavery out of the picture."
      ru: "Экхаут написал её в натуральную величину. Растения и бразильцы, которые ловят рыбу у берега за
        её спиной, говорят, что дело происходит в Бразилии, но шляпа и корзина у неё африканские, а
        украшения и трубка, заткнутая за пояс, — европейские: перед нами женщина, которую увезли за
        океан в чужой мир. Скорее всего, Экхаут изобразил невольницу, однако, как замечают
        исследователи, само рабство он на картину не пустил."
    cards:
      - palmares
