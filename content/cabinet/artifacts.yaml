      ru: Бенин-Сити (где создана); Штутгарт (до 2022 года)
    year: 16th century
    note:
      en: Looted from the royal palace in 1897, the mask came through the art trade to Stuttgart, where it
        was the most important piece of the Linden-Museum's Benin collection. In December 2022 the
        state of Baden-Württemberg and the city of Stuttgart signed over the museum's 70 Benin objects
        to Nigeria, and the state's minister of art, Petra Olschowski, travelled to Nigeria with this
        mask. On 20 December in Abuja it was the first object of the collection to be handed back.
      ru: Маску вывезли из царского дворца в 1897 году, и через торговцев искусством она попала в
        Штутгарт, где стала главной вещью бенинского собрания Линден-музея. В декабре 2022 года земля
        Баден-Вюртемберг и город Штутгарт передали Нигерии право собственности на 70 бенинских
        предметов музея, и министр искусств земли Петра Ольшовски сама полетела с этой маской в
        Нигерию. 20 декабря в Абудже её вручили первой из всего собрания.
    cards:
