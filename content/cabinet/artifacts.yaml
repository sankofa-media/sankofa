        copies from a single master, they no longer needed him, and he died forgotten in 1914. In 2014
        the Library of Congress added “The Laughing Song” to the National Recording Registry.
      ru: В 1899 году Джонсона судили за убийство; люди из мира звукозаписи встали на его сторону, и сам
        окружной прокурор предложил его оправдать. Когда фирмы научились печатать копии с одной
        мастер-записи, Джонсон стал им не нужен и в 1914 году умер всеми забытым. А в 2014 году
        Библиотека Конгресса внесла «The Laughing Song» в Национальный реестр звукозаписей.
