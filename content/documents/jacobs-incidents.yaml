lines:
  - page: 0
    boxes: [[0.22, 0.197, 0.58, 0.027]]
    text: "THE LOOPHOLE OF RETREAT."
    ru: "Лазейка для отступления."
    note:
      en: "In 1835, escaping Dr. James Norcom and his years of sexual threats, Harriet Jacobs went into hiding."
      ru: "В 1835 году, спасаясь от доктора Джеймса Норкома, который годами домогался её и угрожал ей, Гарриет Джейкобс скрылась."
  - page: 0
    boxes: [[0.125, 0.243, 0.8, 0.025], [0.095, 0.269, 0.26, 0.025]]
    text: "A small shed had been added to my grandmother's house years ago."
    ru: "Много лет назад к дому моей бабушки пристроили небольшой сарай."
    note:
      en: "She hid in a crawlspace at her grandmother's house in Edenton, North Carolina."
      ru: "Она спряталась в тесном лазе под крышей дома своей бабушки в Идентоне, Северная Каролина."
  - page: 0
    boxes: [[0.475, 0.4, 0.45, 0.025], [0.095, 0.426, 0.83, 0.025], [0.095, 0.452, 0.83, 0.025], [0.095, 0.478, 0.08, 0.025]]
    text: "The garret was only nine feet long and seven wide. The highest part was three feet high, and sloped down abruptly to the loose board floor."
    ru: "Чердак был всего девять футов в длину и семь в ширину. В самом высоком месте он был три фута высотой и круто спускался к полу из незакреплённых досок."
    note:
      en: "For nearly seven years she lived in a space too low to stand in."
      ru: "Почти семь лет она прожила там, где нельзя было выпрямиться."
  - page: 0
    boxes: [[0.205, 0.478, 0.72, 0.025]]
    text: "There was no admission for either light or air."
    ru: "Туда не проникали ни свет, ни воздух."
    note:
      en: "From there, through a hole, she watched her children in the street."
      ru: "Оттуда, сквозь дырочку, она смотрела на своих детей на улице."
  - page: 0
    boxes: [[0.37, 0.897, 0.555, 0.025]]
    text: "I heard the voices of my children."
    ru: "Я слышала голоса моих детей."
    note:
      en: "In 1842 she escaped by boat to the North; in 1861 she published this book under the name Linda Brent."
      ru: "В 1842 году она бежала на лодке на Север, а в 1861-м издала эту книгу под псевдонимом Линда Брент."
