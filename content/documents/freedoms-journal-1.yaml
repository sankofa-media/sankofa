lines:
  - page: 0
    boxes: [[0.1, 0.0, 0.84, 0.045]]
    text: "FREEDOM'S JOURNAL."
    ru: "«Журнал свободы»."
    note:
      en: "The first African American owned and operated newspaper in the United States."
      ru: "Первая в Соединённых Штатах газета, которой владели и которую делали афроамериканцы."
  - page: 0
    boxes: [[0.22, 0.084, 0.52, 0.024]]
    text: "NEW-YORK, FRIDAY, MARCH 16, 1827."
    ru: "Нью-Йорк, пятница, 16 марта 1827 года."
    note:
      en: "The paper was launched in New York on 16 March 1827; this is its first issue."
      ru: "Газету основали в Нью-Йорке 16 марта 1827 года; перед нами её первый номер."
  - page: 0
    boxes: [[0.005, 0.088, 0.1, 0.016]]
    text: "CORNISH & RUSSWURM,"
    ru: "Корниш и Расуорм,"
    note:
      en: "Its founders were two free Black men, Samuel Cornish and John Russwurm."
      ru: "Её основали двое свободных чернокожих — Сэмюэл Корниш и Джон Расуорм."
  - page: 0
    boxes: [[0.035, 0.12, 0.135, 0.016]]
    text: "TO OUR PATRONS."
    ru: "К нашим читателям."
    note:
      en: "The weekly carried news, biographies, births and deaths, and attacks on slavery and discrimination."
      ru: "Еженедельник печатал новости, жизнеописания, известия о рождениях и смертях — и статьи против рабства и дискриминации."
  - page: 0
    boxes: [[0.018, 0.338, 0.222, 0.012], [0.005, 0.35, 0.18, 0.012]]
    text: "We wish to plead our own cause. Too long have others spoken for us."
    ru: "Мы хотим сами отстаивать своё дело. Слишком долго за нас говорили другие."
    note:
      en: "So began the first issue. The paper later split over Africa, and its last issue is dated 28 March 1829."
      ru: "Так начинался первый номер. Позже газету расколол вопрос об Африке; последний номер датирован 28 марта 1829 года."
