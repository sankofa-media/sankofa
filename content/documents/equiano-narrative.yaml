lines:
  - page: 0
    boxes: [[0.05, 0.165, 0.62, 0.185]]
    text: "THE INTERESTING NARRATIVE OF THE LIFE OF OLAUDAH EQUIANO,"
    ru: "Удивительное повествование о жизни Олауды Эквиано,"
    note:
      en: "Published in London in 1789, the book became a bestseller and ran to nine editions by 1794."
      ru: "Книга вышла в Лондоне в 1789 году, стала бестселлером и к 1794 году выдержала девять изданий."
  - page: 0
    boxes: [[0.1, 0.36, 0.51, 0.055]]
    text: "OR GUSTAVUS VASSA,"
    ru: "или Густава Васы,"
    note:
      en: "Olaudah Equiano was also called Gustavus Vassa."
      ru: "Олауду Эквиано называли также Густавом Васой."
  - page: 0
    boxes: [[0.225, 0.418, 0.255, 0.028]]
    text: "THE AFRICAN."
    ru: "африканца."
    note:
      en: "Yet a 1759 baptism record and a 1773 Navy muster roll both give his birthplace as Carolina; where he was born is still contested."
      ru: "Однако запись о крещении 1759 года и судовой список флота 1773 года называют местом его рождения Каролину; спор о том, где он родился, не решён до сих пор."
  - page: 0
    boxes: [[0.05, 0.452, 0.62, 0.03]]
    text: "WRITTEN BY HIMSELF."
    ru: "Написано им самим."
    note:
      en: "It tells of a childhood in Igbo country, kidnapping, the Middle Passage, and the day in 1766 when he bought his own freedom for £40."
      ru: "В ней — детство в земле игбо, похищение, Средний путь и день в 1766 году, когда он выкупил себя на свободу за 40 фунтов."
  - page: 0
    boxes: [[0.045, 0.633, 0.62, 0.058]]
    text: "LONDON: Printed for and ſold by the AUTHOR, No. 10, Union-Street, Middleſex Hoſpital;"
    ru: "Лондон. Напечатано для автора и продаётся у него: Юнион-стрит, дом 10, у Мидлсекской больницы;"
    note:
      en: "He published it himself, financed by subscribers who paid in advance."
      ru: "Он издал книгу на деньги подписчиков, заплативших вперёд."
  - page: 1
    boxes: [[0.375, 0.152, 0.55, 0.035]]
    text: "LIST OF SUBSCRIBERS."
    ru: "Список подписчиков."
    note:
      en: "The people who paid in advance for the book are named before the story begins."
      ru: "Те, кто заранее заплатил за книгу, названы поимённо ещё до начала рассказа."
  - page: 1
    boxes: [[0.365, 0.198, 0.565, 0.028]]
    text: "His Royal Highneſs the Prince of Wales."
    ru: "Его королевское высочество принц Уэльский."
    note:
      en: "The first name on the list was the Prince of Wales."
      ru: "Первым в списке стоял принц Уэльский."
