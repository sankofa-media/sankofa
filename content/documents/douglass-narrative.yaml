lines:
  - page: 0
    boxes: [[0.695, 0.262, 0.175, 0.023], [0.125, 0.286, 0.745, 0.023], [0.125, 0.309, 0.395, 0.023]]
    text: "I seized him with both hands by his collar, and brought him by a sudden snatch to the ground."
    ru: "…я схватил его обеими руками за ворот и резким рывком повалил на землю."
    note:
      en: "Edward Covey was a farmer near St. Michael's, Maryland. Douglass was sent to him in 1834; his own Narrative gives 1833."
      ru: "Эдвард Кови был фермером из-под Сент-Майклса в Мэриленде. Дугласа отправили к нему в 1834 году; в самом «Повествовании» значится 1833-й."
  - page: 0
    boxes: [[0.715, 0.594, 0.155, 0.023], [0.125, 0.617, 0.745, 0.023], [0.125, 0.64, 0.745, 0.023]]
    text: "The whole six months afterwards, that I spent with Mr. Covey, he never laid the weight of his finger upon me in anger."
    ru: "Все шесть месяцев, что я ещё провёл у мистера Кови, он ни разу не поднял на меня в гневе даже пальца."
    note:
      en: "Covey never laid a hand on him again."
      ru: "Кови больше ни разу не поднял на него руку."
  - page: 0
    boxes: [[0.16, 0.732, 0.71, 0.023], [0.125, 0.756, 0.305, 0.023]]
    text: "This battle with Mr. Covey was the turning-point in my career as a slave."
    ru: "Эта схватка с мистером Кови стала поворотным пунктом моей жизни в рабстве."
    note:
      en: "The fight changed everything inside him."
      ru: "Схватка перевернула всё в душе Дугласа."
  - page: 1
    boxes: [[0.795, 0.29, 0.07, 0.022], [0.105, 0.313, 0.76, 0.022], [0.105, 0.336, 0.66, 0.022]]
    text: "however long I might remain a slave in form, the day had passed forever when I could be a slave in fact."
    ru: "…сколько бы я ещё ни оставался рабом по форме, день, когда я мог быть рабом на деле, миновал навсегда."
    note:
      en: "The body was still owned; the will was not."
      ru: "Тело по-прежнему принадлежало хозяину; воля — уже нет."
  - page: 1
    boxes: [[0.66, 0.659, 0.205, 0.022], [0.105, 0.682, 0.76, 0.022], [0.105, 0.705, 0.46, 0.022]]
    text: "Mr. Covey enjoyed the most unbounded reputation for being a first-rate overseer and negro-breaker."
    ru: "Мистер Кови пользовался самой громкой славой первоклассного надсмотрщика и укротителя негров."
    note:
      en: "Covey was known as a “negro-breaker”, hired to tame him."
      ru: "Кови слыл «укротителем негров»; его наняли, чтобы сломать Дугласа."
  - page: 1
    boxes: [[0.42, 0.752, 0.395, 0.022]]
    text: "a boy about sixteen years old"
    ru: "мальчишку лет шестнадцати"
    note:
      en: "In 1838 he escaped north, and his pen went on to fight the whole system."
      ru: "В 1838 году он бежал на Север, и его перо пошло войной на всю систему."
