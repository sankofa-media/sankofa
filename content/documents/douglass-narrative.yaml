  title: "Wikimedia Commons: Narrative of the Life of Frederick Douglass, an American Slave.djvu"
  url: "https://commons.wikimedia.org/wiki/File:Narrative_of_the_Life_of_Frederick_Douglass,_an_American_Slave.djvu"
