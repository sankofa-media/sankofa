id: douglass-narrative
card: douglass-covey
title:
  en: "Narrative of the Life of Frederick Douglass, an American Slave"
  ru: "«Повествование о жизни Фредерика Дугласа, американского раба»"
imprint:
  en: "Boston, Anti-Slavery Office, 1845 · chapter X, pages 72–73"
  ru: "Бостон, Антирабовладельческое бюро, 1845 · глава X, с. 72–73"
