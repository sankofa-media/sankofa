  - context: "US school music education (Kodály and Orff classrooms)"
    detail: "Catalogued for teaching as a pentatonic call-and-response song (tone set s,l,drm; form AAAB), citing the Shipp disc; listed in the GAMEPLAN Grade 5 Orff curriculum; teachers play the LoC recording to pupils."
    sources:
      - title: "American Folk Song Collection, Kodály Center at the University of Redlands — 'Sea Lion Woman'"
        url: "https://kodalycollection.org/song.cfm?id=645&title=Sea+Lion+Woman"
        quote: "Form Type: Call-response"
      - title: "West Music — GAMEPLAN Grade 5 Curriculum Book (Jeff Kriske, Randy DeLelles)"
        url: "https://www.westmusic.com/gameplan-grade-5-curriculum-book-833957"
        quote: "Sambalele, Sea Lion Woman, Skin and Bones"
      - title: "GamePlan teacher blog (RaeAnna Goss), March 2011"
        url: "https://gameplanmusic.blogspot.com/"
        quote: "Sea Lion Woman lesson - the kids LOVED this!"
    note: "The Kodály entry also cites Erdei & Komlós (eds.), 150 American Folk Songs to Sing, Read and Play (Boosey & Hawkes, 1974) — inclusion in that book not independently confirmed."
