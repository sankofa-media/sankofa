      - title: "Discogs — Afro-American Blues And Game Songs, The Library Of Congress AAFS L4"
        url: "https://www.discogs.com/release/5239619-Various-Afro-American-Blues-And-Game-Songs"
        quote: "Originally released as a 78rpm set in 1942."
      - title: "CREM-CNRS archive, collection record for the 78-rpm album"
        url: "https://archives.crem-cnrs.fr/archives/items/CNRSMH_E_1948_001_016_005_005"
        quote: "Album IV : Afro-American Blues and Game Songs : from the Archive of American Folk Song [5 Disques]"
    note: "The Discogs tracklist places B6 'Old Uncle Rabbit' and B7 'Sea Lion Woman' (Shipp) on the same LP as A10/A11 by McKinley Morganfield. The CREM copy (collection code E_1948) shows a set had reached the Paris Musée de l'Homme by 1948."

