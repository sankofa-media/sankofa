  - id: simone-1964
    title: "See-Line Woman"
    artist: "Nina Simone"
    year: 1964
    kind: cover
    parents: [ shipp-1939 ]
    influences_in:
      - "Shipp field recording / folk song via George H. Bass (writer credit) and, per W. Jason Miller (single author), Langston Hughes's suggestion"
      - "Simone's classical training: Bach-centred study, Juilliard 1950, Curtis rejection (PBS American Masters; National Women's History Museum). PBS: 'a strong Bach influence can clearly be heard in Simone's improvisations' — a general statement, not about this track"
      - "Album personnel (official ninasimone.com credits): Rudy Stevenson flute, Lisle Atkinson percussion, Bobby Hamilton drums; Hal Mooney producer. Per-track assignment to B3 not confirmed"
    style_changes: "Kept the refrain and leader/answer; added syncopated handclaps and percussion, renamed it 'See-Line Woman' (Eats, Drinks & Leaves, Tim Cooper 2023) and made it a staged, rhythm-driven piece — the template most later versions copy"
    afterlife: [ "Template for nearly every later cover; officially remixed in 2002, 2022, 2026; sampled 2008" ]
    what_travelled: "Title (respelled), the leader/answer refrain, the verse frame; Simone's arrangement turned a playground chant into a percussion-driven performance piece. Writer credit went to George Houston Bass, arranger credit to Simone."
    playable_url: "https://www.youtube.com/watch?v=E17-0CuPb64"
    playable_verified: "2026-11-15 oEmbed author_name 'NinaSimoneVEVO', title 'Nina Simone - See-Line Woman (Audio)'"
    playable_note: "'Nina Simone - See-Line Woman (Audio)', NinaSimoneVEVO."
    album: "Broadway-Blues-Ballads (Philips PHM 200-148 / PHS 600-148), side B track 3"
    sources:
      - title: "Discogs — Broadway - Blues - Ballads, Philips PHM 200-148"
        url: "https://www.discogs.com/release/2660605-Nina-Simone-Broadway-Blues-Ballads"
        quote: "B3 See-Line Woman 2:20 — Nina Simone: Arranged By; George Houston Bass: Written-By"
      - title: "MusicBrainz — work 'See-Line Woman' (writers; based on 'Sea Lion Woman'; recording date)"
        url: "https://musicbrainz.org/work/09d6eb01-320c-33b6-85ca-00cd836e0a0a"
        quote: "writer: George Bass; writer: Nina Simone; based on: Sea Lion Woman; recording begin 1964-03-21"
      - title: "W. Jason Miller (NC State), 'The forgotten story behind Nina Simone and Langston Hughes' collaboration', The Conversation, 2026-10-03"
        url: "https://theconversationus.substack.com/p/the-forgotten-story-behind-nina-simone"
        quote: "Simone performed the song, \"See-Line Woman,\" for the first time at a March 21, 1964, concert in Carnegie Hall"
    note: "Album producer: Hal Mooney (Discogs). Album-level personnel per Discogs master notes: Rudy Stevenson (flute), Lisle Atkinson (percussion), Bobby Hamilton (drums); arrangers Hal Mooney and Horace Ott for other tracks — B3 is credited to Simone. Date conflict: MusicBrainz/Presto give a 21 March 1964 recording date, the same day as the Carnegie Hall concert Miller cites — see unconfirmed.md."
    story:
      en: Nina Simone recorded the song in 1964 and respelled its title her own way, “See-Line Woman”. Her arrangement turned a playground game into a concert piece driven by percussion, with the circle’s call and answer intact. The record names George Houston Bass as the writer and Simone as the arranger.
      ru: Нина Симон записала песню в 1964 году и переписала её название по-своему — «See-Line Woman». Её аранжировка превратила дворовую игру в концертную вещь, где всё держится на ударных, а вопрос и ответ круга сохранились. Автором на пластинке значится Джордж Хьюстон Басс, аранжировщиком — сама Симон.

  - id: simone-single-1964
    title: "Mississippi Goddam / Sea Lion Woman (Philips 40216)"
    artist: "Nina Simone"
    year: 1964
    kind: cover
    parents: [ simone-1964 ]
    what_travelled: "The children's song went out to radio as the flip side of Simone's protest anthem."
    playable_url: "https://www.youtube.com/watch?v=E17-0CuPb64"
    playable_verified: "2026-11-15 oEmbed author_name 'NinaSimoneVEVO', title 'Nina Simone - See-Line Woman (Audio)'; same 1964 studio master as the album track; no separate upload of the Philips 40216 single exists"
    sources:
      - title: "Discogs — Nina Simone, Mississippi *%??**&% (Philips 40216, US, July 1964)"
        url: "https://www.discogs.com/release/4985266-Nina-Simone-Mississippi-"
        quote: "B Sea Lion Woman — George Houston Bass: Written-By"
      - title: "Backlash Blues (W. Jason Miller), 1964 timeline"
        url: "https://www.backlash-blues.com/timeline"
        quote: "\"See-Line Woman\" was released in mid-July of 1964 as the B Side to \"Mississippi Goddam.\""
    note: "On this label the title is printed 'Sea Lion Woman', the folk spelling. A separate A-side single followed: Philips 40376 (1965), 'See-Line Woman' b/w 'I Love Your Lovin' Ways' (Discogs release 2329066) — single-sourced, kept as a note."
    story:
      en: In July of that year the song came out on a single, as the flip side of “Mississippi Goddam”. The label printed its title the old way, “Sea Lion Woman”, and the children’s game went out to radio together with one of the fiercest protest songs of the time.
      ru: В июле того же года песня вышла на сингле — оборотной стороной «Mississippi Goddam». На этикетке её название напечатали по-старому, «Sea Lion Woman», и детская игра пошла на радио вместе с одной из самых яростных песен протеста того времени.

  - id: lateef-1967
    title: "See Line Woman"
    artist: "Yusef Lateef Quartet"
    year: 1967
    kind: cover
    parents: [ simone-1964 ]
    style_changes: "Jazz quartet treatment (Lateef on flute/reeds and vocal, Hugh Lawson piano, Cecil McBee bass, Roy Brooks drums, Sylvia Shemwell tambourine — jazzdisco.org); the song becomes a modal-jazz vehicle"
    what_travelled: "The Simone spelling and the song as a jazz vehicle, three years after Simone. Recorded NYC 1 June 1967; Sylvia Shemwell on tambourine; issued on The Complete Yusef Lateef (Atlantic 1499, 1968)."
    playable_url: "https://www.youtube.com/watch?v=WEPP3yNFU6c"
    playable_verified: "2026-11-15 oEmbed author_name 'Yusef Lateef - Topic', title 'See Line Woman'; provided by Rhino Atlantic, ℗ 1967 Atlantic"
    playable_note: "'Yusef Lateef - Topic' (auto-generated, label-delivered)."
    sources:
      - title: "Discogs — The Complete Yusef Lateef (master)"
        url: "https://www.discogs.com/master/145291-Yusef-Lateef-The-Complete-Yusef-Lateef"
        quote: "See Line Woman 6:23"
      - title: "jazzdisco.org — Yusef Lateef discography, session 670601"
        url: "https://www.jazzdisco.org/yusef-lateef/discography/"
        quote: "NYC, June 1, 1967 ... 4. See Line Woman"
    note: "Parent inferred from the 'See Line' spelling, which originates with Simone's record; no Lateef statement found. Some listings spell it 'Sea Line Woman' and credit it as traditional."
    story:
      en: Three years after Simone the saxophonist Yusef Lateef recorded the song with his quartet, in New York on 1 June 1967. He took the title in Simone’s spelling and made the playground game into a jazz piece, with Sylvia Shemwell on tambourine.
      ru: Через три года после Симон песню записал саксофонист Юсеф Латиф со своим квартетом — 1 июня 1967 года в Нью-Йорке. Название он взял в написании Симон, а из дворовой игры сделал джазовую пьесу; бубен в ней ведёт Сильвия Шемвелл.

