        quote: "The track also features a sample from Nina Simone's “See-Line Woman,” which adds a unique texture to the song."
    claims_against:
      - who: "Official track credits, Silva Screen 'Luther' soundtrack booklet (SILCD1434), licensed from Virgin/Universal"
        url: "https://www.silvascreen.com/wp-content/uploads/SILCD1434-Luther-DigitalBooklet_V2.pdf"
        quote: "Written by Robert Del Naja / Grant Marshall / Hope Sandoval / Stew Jackson / Dan Brown ... Drums: Gerhardt ‘Jerry’ Fuchs"
      - who: "Discogs — Heligoland credits (UK/EU CD 2531311 and 7 further pressings checked): no Simone/Bass writer credit, no sample note"
        url: "https://www.discogs.com/release/2531311-Massive-Attack-Heligoland"
        quote: "Paradise Circus — Hope Sandoval: Vocals, Written-By; Dan Brown: Written-By; Stew Jackson: Written-By"
      - who: "NPR 'First Listen: Massive Attack, Heligoland', 2010-01-31 — album-level method, quoting Robert Del Naja"
        url: "https://www.npr.org/2010/01/31/123026141/first-listen-massive-attack-heligoland"
        quote: "Instead of sampling others, as they did on previous efforts, the two now record and reconstruct from their own instruments"
      - who: "Same NPR piece, Del Naja's words"
        quote: "using small loops of a part, as opposed to sampling, say, something from an obscure '70s funk tune."
    claps_in_track:
      - who: "NME review of Heligoland"
        url: "https://www.nme.com/reviews/massive-attack/11054"
        quote: "breathes Sandoval, over handclaps and chimes"
      - who: "The Line of Best Fit, Gina Louise, 2010-02-26"
        url: "https://www.thelineofbestfit.com/reviews/albums/massive-attack-heligoland-25398"
        quote: "layered over piano melodies and naïve hand clapping"
      - who: "Songfacts"
        url: "https://www.songfacts.com/facts/massive-attack/paradise-circus"
        quote: "contributes vocals to this track over handclaps and a minimalist chord progression"
      - note: "Claps are confirmed to be IN the track by three sources; none says where they come from."
    note: "Owner decision recorded above (status confirmed-by-owner). Research record: supporting sources are WhoSampled and blogs; the official credits name no Simone/Bass and NPR 2010 reports the band stopped sampling others — kept here for transparency. The live drummer Jerry Fuchs died 8 Nov 2009, three months before the album came out (Exclaim 2009-11-08: 'died early Sunday morning (November 8) from injuries sustained in a five-storey fall inside a broken elevator shaft'; UPI 2009-11-09: 'Drummer Jerry Fuchs, 34')."

