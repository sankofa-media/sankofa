# Sea Lion Woman / See-Line Woman — verified lineage
# Compiled 2026-11-15. Every node below has >= 2 independent sources that were actually opened.
# Quotes are verbatim and short. "Discogs" quotes are taken from the Discogs public API JSON
# (api.discogs.com) for the cited release; the URL given is the human-readable release page.
# Items that failed the two-source rule are in unconfirmed.md, not here.

nodes:

  - id: trad-ring-game
    title: "Sea Lion Woman (traditional ring game / playground song)"
    artist: "African American children, oral tradition (origin unknown)"
    year: null
    kind: original
    parents: []
    influences_in:
      - "African American ring-play / game-song tradition: call-and-response, ring or line formation, syncopated handclapping and foot-stomping (Carnegie Hall Timeline of African American Music: 'The singing employs call-and-response structure and repetitive choruses also associated with African musical practices.'; Association for Cultural Equity lesson: 'roles for a leader and group in both the singing and playing of the game')"
      - "Song-specific analysis (Kodály Center, Univ. of Redlands): pentatonic, tone set s,l,drm; form AAAB; form type call-response"
      - "Older roots before 1939: NOT established by any authoritative source opened (see influences.md)"
    afterlife:
      - "Taught in US school music classrooms as a pentatonic call-and-response song (Kodály Center collection; GAMEPLAN Orff curriculum, Kriske/DeLelles) — see top-level 'afterlife'"
    what_travelled: "The call-and-response frame: a leader sings a line, the group answers with the title phrase ('Sea lion'). This is the cell every later version keeps."
    playable_url: null
    playable_verified: "no recording exists: oral tradition node; the earliest recording is shipp-1939"
    sources:
      - title: "Library of Congress, Songs of America — Children's Songs (essay)"
        url: "https://www.loc.gov/collections/songs-of-america/articles-and-essays/musical-styles/traditional/childrens-songs/"
        quote: "was an African American ring game song"
      - title: "CREM-CNRS archive (Musée de l'Homme copy of LoC Album IV), item record"
        url: "https://archives.crem-cnrs.fr/archives/items/CNRSMH_E_1948_001_016_005_005"
        quote: "\"Negro children's games\""
    note: "No source fixes an origin date or place. Title spellings vary (Sea Lion, See-Line, C-Line, She-Lyin'). One scholar (W. Jason Miller) reads it as a song about sex workers greeting sailors in port; this is an interpretation, single-authored — see people.md."
    story:
      en: "Nobody knows where or when this game was born: it was not composed but handed on, from children to children, in the schoolyards of the American South. A leader sings a line, the circle answers with the words of the title, and every later version, however far from the playground, keeps that call and answer."
      ru: "Где и когда родилась эта игра, не знает никто: её не сочиняли, её передавали — от одних детей к другим, на школьных дворах американского Юга. Ведущая поёт строчку, круг отвечает словами из названия, и этот вопрос с ответом сохранят потом все версии, какими бы далёкими от двора они ни были."

  - id: shipp-1939
    title: "Old Uncle Rabbit and Sea Lion Woman"
    artist: "Katherine Shipp and Christine (Christeen) Shipp; recorded by Herbert Halpert"
    year: 1939
    kind: field-recording
    parents: [ trad-ring-game ]
    influences_in: [ "trad-ring-game (learned by ear within the family, per NPR 1998)" ]
    afterlife:
      - "The Kodály Center's teaching entry cites this exact disc as its source: 'Library of Congress AFS 3008 B3. Collected by Herbert Halpert.'"
      - "Teachers play this LoC recording in class (GAMEPLAN teacher blog, 2011)"
      - "Direct source for Feist (2007) and The General's Daughter (1999)"
    what_travelled: "The earliest surviving sound of the song: two voices, unaccompanied, barely a minute long — the title refrain answered line by line, the coffee/tea verse, the rhythm later artists clap to."
    playable_url: "https://www.loc.gov/item/ihas.200196570/"
    playable_audio_direct: "https://tile.loc.gov/storage-services/public/afc/afcihas-200196570/200196570.mp3"
    playable_verified: "2026-11-15 Library of Congress item ihas.200196570; plays the LoC file via playable_audio_direct (tile.loc.gov)"
    archive_ids: "AFS 03008 A01 and B03; collection AFC 1939/005 (Herbert Halpert 1939 Southern States Recording Expedition)"
    sources:
      - title: "Library of Congress item record ihas.200196570 (JSON view)"
        url: "https://www.loc.gov/item/ihas.200196570/"
        quote: "Halpert, Herbert (Recordist); Shipp, Katherine (Singer); Shipp, Christine (Singer)"
      - title: "Stephen Wade, The Beautiful Music All Around Us (Univ. of Illinois Press, 2012), ch. 4 abstract"
        url: "https://academic.oup.com/illinois-scholarship-online/book/30553/chapter/257923174"
        quote: "Christine and Katherine also recorded the piece \"Sea Lion Woman.\""
      - title: "Discogs — A Treasury of Library of Congress Field Recordings (Rounder CD 1500, 1997), notes"
        url: "https://www.discogs.com/release/1367582-Various-A-Treasury-Of-Library-Of-Congress-Field-Recordings"
        quote: "Track 6 rec. 13/5/1939 Byhalia, MS."
      - title: "NPR, 'Shipp Family Singers' (July 10, 1998)"
        url: "https://www.npr.org/1998/07/10/1034287/shipp-family-singers"
        quote: "One of the groups they recorded was the Shipp family from Byhalia."
    note: "Date 13 May 1939 (Wade; Rounder notes). Ages on that day: Christine 20, Katherine 18 (Wade). The LoC record itself carries no date; the CREM copy gives only '1939'."
    story:
      en: "The earliest sound of this song that has come down to us: two voices, no instruments, under a minute. Christine and Katherine Shipp sing the refrain, answering each other line by line, and between refrains the woman of the game drinks coffee, then tea. The folklorist Herbert Halpert recorded them on 13 May 1939."
      ru: "Самый ранний звук этой песни, который до нас дошёл: два голоса без инструментов, меньше минуты. Кристин и Кэтрин Шипп поют припев, отвечая друг другу строчка за строчкой, а между припевами женщина из игры пьёт то кофе, то чай. Записал их фольклорист Герберт Халперт 13 мая 1939 года."

  - id: afs-l4-1942
    title: "Afro-American Blues and Game Songs (LoC Album IV / AFS L4), track 'Sea Lion Woman'"
    artist: "Katherine Shipp, Christeen Shipp (ed. Alan Lomax)"
    year: 1942
    kind: field-recording
    parents: [ shipp-1939 ]
    what_travelled: "First publication of the Shipp recording, as a Library of Congress 78-rpm album set; it put the girls' voices on the same album as the first recordings of McKinley Morganfield (Muddy Waters)."
    playable_url: "https://www.loc.gov/item/ihas.200196570/"
    playable_verified: "2026-11-15 no official upload of the AFS L4 album found (searched YouTube for album/track title; only fan uploads and Document/Suncoast compilations); links to the Library of Congress page of the same 1939 Shipp recording that this album first issued"
    sources:
      - title: "Discogs — Afro-American Blues And Game Songs, The Library Of Congress AAFS L4"
        url: "https://www.discogs.com/release/5239619-Various-Afro-American-Blues-And-Game-Songs"
        quote: "Originally released as a 78rpm set in 1942."
      - title: "CREM-CNRS archive, collection record for the 78-rpm album"
        url: "https://archives.crem-cnrs.fr/archives/items/CNRSMH_E_1948_001_016_005_005"
        quote: "Album IV : Afro-American Blues and Game Songs : from the Archive of American Folk Song [5 Disques]"
    note: "The Discogs tracklist places B6 'Old Uncle Rabbit' and B7 'Sea Lion Woman' (Shipp) on the same LP as A10/A11 by McKinley Morganfield. The CREM copy (collection code E_1948) shows a set had reached the Paris Musée de l'Homme by 1948."
    story:
      en: Three years later the Library of Congress first published the recording, in a set of 78-rpm discs called “Afro-American Blues and Game Songs”. That put the Shipp sisters’ voices on the same album as the first recordings of McKinley Morganfield, whom the world would soon know as Muddy Waters.
      ru: Через три года Библиотека Конгресса впервые издала эту запись — в комплекте пластинок на 78 оборотов «Afro-American Blues and Game Songs». Так голоса сестёр Шипп оказались на одном альбоме с первыми записями Маккинли Морганфилда, которого мир вскоре узнает как Мадди Уотерса.

  - id: rounder-treasury-1997
    title: "A Treasury of Library of Congress Field Recordings (Rounder CD 1500), track 6 'Sea Lion Woman'"
    artist: "Christine and Katherine Shipp; compiled and annotated by Stephen Wade"
    year: 1997
    kind: field-recording
    parents: [ shipp-1939 ]
    what_travelled: "Reissue that returned the Shipp recording to circulation and became the licensed source for the 1999 film use."
    playable_url: "https://www.loc.gov/item/ihas.200196570/"
    playable_verified: "2026-11-15 no official upload of Rounder CD 1500 found (searched YouTube for album/track title); links to the Library of Congress page of the same 1939 Shipp recording"
    sources:
      - title: "Discogs — Rounder CD 1500 credits"
        url: "https://www.discogs.com/release/1367582-Various-A-Treasury-Of-Library-Of-Congress-Field-Recordings"
        quote: "Stephen Wade — Compilation Producer, Liner Notes; Herbert Halpert — Recorded By 6, 11, 23"
      - title: "TriQuarterly review of Wade's book (which grew out of the CD)"
        url: "https://www.triquarterly.org/the-latest-word/reviews/beautiful-music-all-around-us-stephen-wade"
        quote: "barely a minute in length but as strong as an ox and playful as a sprite"
    note: "TriQuarterly confirms the 1997 Rounder release as the basis of the book."
    story:
      en: For more than half a century the recording lay in the archive. In 1997 the folklorist Stephen Wade put it on a collection of the best Library of Congress field recordings, released by the Rounder label, and the sisters’ song began to be heard again.
      ru: Больше полувека запись лежала в архиве. В 1997 году фольклорист Стивен Уэйд включил её в сборник лучших полевых записей Библиотеки Конгресса, выпущенный лейблом Rounder, и песня сестёр снова начала звучать.

