  - id: simone
    kind: simone
    nodes: [ simone-1964 ]
    photo: simone-1965
    art:
      generated: true
      layers:
        - { file: simone-r2-plate.webp, depth: 3, alt: "" }
        - { file: simone-r2-grand.webp, depth: 8, alt: { en: "A grand piano on a dark stage", ru: "Рояль на тёмной сцене" } }
        - { file: simone-r2-figure.webp, depth: 12, role: figure, pivot: "34 88", alt: { en: "A woman at the piano, upright, her hands on the keys", ru: "Женщина за роялем, прямая, руки на клавишах" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "1964"
        ru: "1964"
      - id: route
        role: text
        draft: false
        en: "Twenty-five years later the song was offered to Nina Simone by the poet Langston Hughes. His secretary, George Houston Bass, had adapted the old folk song, and Hughes sent it to Simone with a note that it suited her particularly well, as if it had been made for her."
        ru: "Через двадцать пять лет эту песню предложил Нине Симон поэт Ленгстон Хьюз. Его секретарь Джордж Хьюстон Басс обработал старую народную песню, а Хьюз послал её Симон и написал, что эта вещь ей особенно подходит, будто сделана для неё на заказ."
      - id: version
        role: text
        draft: false
        en: "In 1964 Simone recorded the song for the album “Broadway-Blues-Ballads”. She spelled the title her own way, “See-Line Woman”, and the record credits the arrangement to her. With drums and syncopated handclaps, the children’s game became a concert number."
        ru: "В 1964 году Симон записала песню для альбома «Broadway-Blues-Ballads». Название она написала по-своему — «See-Line Woman», а аранжировщиком на пластинке указана она сама. С ударными и синкопированными хлопками детская игра превратилась у неё в концертный номер."
      - id: bach
        role: text
        draft: false
        en: "Simone had trained to be a classical pianist: she played Bach and studied at the Juilliard School, but the Curtis Institute turned her down. And so a children’s game that the Shipp sisters had once sung in a church in Mississippi came into the hands of a classically trained pianist brought up on Bach."
        ru: "Симон готовилась стать классической пианисткой: играла Баха, училась в Джульярдской школе, но в Кёртисовский институт её не приняли. И вот детская игра, которую сёстры Шипп когда-то спели в церкви в Миссисипи, попала в руки пианистки с классической выучкой, выросшей на Бахе."

  - id: single
    kind: single
    art:
      generated: true
      layers:
        - { file: single-r2-plate.webp, depth: 3, alt: "" }
        - { file: single-r2-sleeve-cups.webp, depth: 6, alt: { en: "A plain paper record sleeve with one red band, a cup of black coffee and a cup of tea", ru: "Простой бумажный конверт для пластинки с красной полосой, чашка чёрного кофе и чашка чая" } }
        - { file: single-r2-player.webp, depth: 8, alt: { en: "An open portable record player on a wooden table, seen from above", ru: "Раскрытый переносной проигрыватель на деревянном столе, вид сверху" } }
    nodes: [ simone-single-1964 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: July 1964
        ru: Июль 1964
      - id: two-sides
        role: text
        draft: false
        en: "In July 1964 the song also came out on a single. The A side was “Mississippi Goddam”; “Sea Lion Woman” was on the B side, spelled the old way, as it had been written down in 1939."
        ru: "В июле 1964 года песня вышла и на сингле. На стороне A была «Mississippi Goddam», а «Sea Lion Woman» стояла на стороне B — в старом написании, как её записали в 1939 году."
      - id: goddam
        role: text
        draft: false
        en: Simone wrote “Mississippi Goddam” in 1963, after Medgar Evers was murdered in Mississippi and a church was bombed in Birmingham, Alabama.
        ru: «Mississippi Goddam» Симон написала в 1963 году, после того как в Миссисипи убили Медгара Эверса, а в Бирмингеме, штат Алабама, взорвали церковь.
      - id: side-b
        role: text
        draft: false
        en: "So one record carried an angry protest against what was being done in Mississippi and a game sung by two young women from that same Mississippi."
        ru: "Так на одной пластинке оказались гневный протест против того, что творилось в Миссисипи, и детская игра, которую пели две девушки из того же Миссисипи."
      - id: label-a
        role: label
        draft: false
        en: Mississippi Goddam
        ru: Mississippi Goddam
      - id: label-b
        role: label
        draft: false
        en: Sea Lion Woman
        ru: Sea Lion Woman
      - id: credit
        role: label
        draft: false
        en: Written by George Houston Bass
        ru: Written by George Houston Bass
      - id: name
        role: caption
        draft: false
        en: "The label of the B side names one author: George Houston Bass. The names of Christine and Katherine Shipp, who sang the song in 1939, are not there."
        ru: "На этикетке стороны B автором песни указан один человек — Джордж Хьюстон Басс. Имён Кристин и Кэтрин Шипп, которые спели её в 1939 году, там нет."

  - id: bass
    kind: text
    photo: hughes-1936
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The man on the label
        ru: Человек на этикетке
      - id: who
        role: text
        draft: false
        en: From 1959 to 1964 George Houston Bass was secretary and literary assistant to Langston Hughes, the poet who suggested the song to Nina Simone. Later Bass founded the Rites and Reason theatre at Brown University, and he died in Providence in 1990.
        ru: Джордж Хьюстон Басс с 1959 по 1964 год был секретарём и литературным помощником Ленгстона Хьюза — того самого поэта, который предложил песню Нине Симон. Позже Басс основал театр Rites and Reason в Брауновском университете и умер в Провиденсе в 1990 году.
      - id: system
        role: text
        draft: false
        en: "Bass registered the copyright in the song. Ever since, where a record names an author, it has usually been him, and the names of Christine and Katherine Shipp appear nowhere. In 1965 Hughes himself wrote to a friend about “my ex-secretary’s SEA LION WOMAN”, which Simone was singing at every concert."
        ru: "Басс зарегистрировал на песню авторское право. С тех пор там, где на пластинке указан автор, обычно стоит его имя, а имён Кристин и Кэтрин Шипп нет нигде. В 1965 году Хьюз сам писал другу о «SEA LION WOMAN моего бывшего секретаря», которую Симон пела на каждом концерте."

  - id: jazz
    kind: stop
    photo: lateef-1964
    nodes: [ lateef-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · jazz
        ru: 1967 · джаз
      - id: text
        role: text
        draft: false
        en: "After that, other musicians took the song up, and here are a few of their versions. The first is jazz. On 1 June 1967, three years after Simone, the saxophonist Yusef Lateef recorded the song with his quartet in New York. He kept Simone’s spelling of the title and made the children’s game into a jazz piece."
        ru: "Потом песню стали петь и играть другие музыканты; вот несколько их версий. Первая — джазовая. 1 июня 1967 года, через три года после Симон, саксофонист Юсеф Латиф записал песню со своим квартетом в Нью-Йорке. Название он оставил в написании Симон, а из детской игры сделал джазовую пьесу."
      - id: listen
        role: note
        draft: false
        en: "Listen to Sylvia Shemwell’s tambourine: where the children’s game had clapping hands, Lateef’s piece has her tambourine."
        ru: "Прислушайтесь к бубну Сильвии Шемвелл: там, где в детской игре хлопали ладони, у Латифа звучит бубен."

  - id: beat
    kind: stop
    photo: easybeats-1967
    nodes: [ easybeats-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · beat
        ru: 1967 · бит
      - id: text
        role: text
        draft: false
        en: "In the same year, 1967, a beat group from the other side of the world took the song up: the Australians The Easybeats recorded it with the producer Shel Talmy. The record lists the song as traditional, arranged by the band’s guitarists Harry Vanda and George Young."
        ru: "В том же 1967 году за песню взялась бит-группа с другого края света: австралийцы The Easybeats записали её с продюсером Шелом Талми. На пластинке песня значится народной, в аранжировке гитаристов группы Гарри Ванды и Джорджа Янга."

  - id: house
    kind: stop
    photo: vega-2009
    nodes: [ songstress-1997, maw-remix-2002 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1997 → 2002 · house
        ru: 1997 → 2002 · хаус
      - id: text
        role: text
        draft: false
        en: "Thirty years later the song reached the house clubs of New York. In 1997 the producers Kerri Chandler and Jerome Sydenham released it under the name The Songstress, and in 2002 Masters At Work made a club remix of Nina Simone’s own recording."
        ru: "Ещё через тридцать лет песня зазвучала в нью-йоркских хаус-клубах. В 1997 году продюсеры Керри Чандлер и Джером Сайденхэм выпустили её под именем The Songstress, а в 2002 году Masters At Work сделали для клубов ремикс самой записи Нины Симон."
      - id: listen
        role: note
        draft: false
        en: "Listen to how one line of the refrain repeats over and over on top of an even kick drum, one beat on every count."
        ru: "Послушайте, как одна строчка припева повторяется раз за разом под ровные удары бас-барабана — по удару на каждый счёт."

  - id: feist
    kind: stop
    photo: feist-2006
    nodes: [ feist-sealion-2007 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2007"
        ru: "2007"
      - id: text
        role: text
        draft: false
        en: "The Canadian singer Feist came to the song not through Nina Simone but straight from the Shipp sisters. She found the 1939 field recording on a compilation and called her version “kind of a half cover of the little girls”, mentioning Simone’s famous version only after that."
        ru: "Канадская певица Feist пришла к песне не через Нину Симон, а прямо от сестёр Шипп. Она нашла полевую запись 1939 года на сборнике и назвала свою версию «наполовину кавером на тех девочек», а знаменитую версию Симон упомянула лишь потом."
      - id: chorus
        role: text
        draft: false
        en: "The choir that claps and answers her on the record sings the part the second sister sang for the whole ring in 1939."
        ru: "Хор, который на её записи хлопает и отвечает ей, поёт ту же партию, что в 1939 году пела за весь круг вторая сестра."
      - id: listen
        role: note
        draft: false
        en: "Listen to the choir answering each of her lines."
        ru: "Послушайте, как хор отвечает на каждую её строчку."

  - id: kanye
    kind: stop
    photo: kanye-2008
    nodes: [ kanye-bad-news-2008 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2008"
        ru: "2008"
      - id: text
        role: text
        draft: false
        en: "In 2008 Kanye West built his song “Bad News” on a piece of Nina Simone’s recording. The rights to it were bought, and the album booklet says so: the song uses a piece of “See Line Woman” performed by Nina Simone, written by George Bass."
        ru: "В 2008 году Канье Уэст построил свою песню «Bad News» на фрагменте записи Нины Симон. Права на него были куплены, и в буклете альбома так и написано: в песне использован фрагмент «See Line Woman» в исполнении Нины Симон, автор — Джордж Басс."
      - id: again
        role: line
        draft: false
        en: "Once again the only author named is George Bass. The Shipp sisters, who sang the song in 1939, are not in the booklet."
        ru: "И снова автором указан только Джордж Басс. Сестёр Шипп, которые спели эту песню в 1939 году, в буклете нет."

  - id: massive
    kind: flashes
    photo: massive-2010
    nodes: [ paradise-circus-2010, gui-boratto-2010, post-ghostpoet-2023 ]
    threads: [ simone-1964, shipp-1939 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2010"
        ru: "2010"
      - id: text
        role: text
        draft: false
        en: "In 2010 the Bristol band Massive Attack released “Paradise Circus”. Handclaps taken from Nina Simone’s “See-Line Woman” run through the whole song. While the track plays, the ink line in the picture flashes with those claps and runs back to Simone’s record of 1964, and from it to the Shipp sisters’ recording of 1939."
        ru: "В 2010 году бристольская группа Massive Attack выпустила «Paradise Circus». Через всю песню проходят хлопки, взятые из «See-Line Woman» Нины Симон. Пока трек звучит, линия туши на рисунке вспыхивает в такт этим хлопкам и тянется назад — к пластинке Симон 1964 года, а от неё к записи сестёр Шипп 1939 года."
      - id: on
        role: text
        draft: false
        en: "“Paradise Circus” had versions of its own. The producer Gui Boratto rebuilt it as an eight-minute melodic techno track, the producer Burial as a twelve-minute piece, and the song itself became the opening titles music of the BBC series “Luther”. In 2023 two members of Massive Attack recorded it again with Ghostpoet for the film “Luther: The Fallen Sun”."
        ru: "У «Paradise Circus» тоже появились свои версии. Продюсер Gui Boratto перестроил трек в восьмиминутную мелодичную техно-композицию, продюсер Burial — в двенадцатиминутную пьесу, а сама песня стала музыкой к заставке сериала BBC «Лютер». В 2023 году для фильма «Лютер: Павшее солнце» двое участников Massive Attack заново записали её с Ghostpoet."
      - id: fuchs
        role: note
        draft: false
        en: "The album credits the drums to Jerry Fuchs. He died in Brooklyn on 8 November 2009, three months before the album came out."
        ru: "Барабанщиком в титрах альбома указан Джерри Фукс. Он погиб в Бруклине 8 ноября 2009 года, за три месяца до выхода альбома."
      - id: label-1964
        role: label
        draft: false
        en: "1964"
        ru: "1964"
      - id: label-1939
        role: label
        draft: false
        en: "1939"
        ru: "1939"

