    nodes: [ shipp-1939 ]
    # What the sisters sing, line by line, as Stephen Wade transcribes the
    # recording (The Beautiful Music All Around Us, 2012) and NPR's 2007
    # transcript confirms; where the two hear different words, the line is
    # marked unclear and both readings are given.
    verse:
      lines:
        - { call: "See lie woman", answer: "See lie", gloss: { en: "the name of the game: the words mean nothing in particular (more on that below)", ru: "название игры; определённого смысла у этих слов нет, о них — ниже" } }
        - { call: "She drink coffee", answer: "See lie", gloss: { en: "she drinks coffee", ru: "она пьёт кофе" } }
        - { call: "She drink tea", answer: "See lie", gloss: { en: "she drinks tea", ru: "она пьёт чай" } }
        - { call: "And the gander lie", answer: "See lie", unclear: true, gloss: { en: "hard to make out: Stephen Wade hears “and the gander lie”, NPR’s transcript has “and he gamble lie”", ru: "неразборчиво: исследователь Стивен Уэйд слышит «and the gander lie» («а гусак…»), в расшифровке радио NPR — «and he gamble lie»" } }
      more:
        en: "More lines follow that are harder to make out (Wade hears “Way down yonder” among them), but the answer stays the same: “See lie”."
        ru: "Дальше идут ещё строчки, разобрать их труднее (Уэйд слышит среди них «Way down yonder» — «там, далеко-далеко»), но ответ всё тот же: «See lie»."
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The minute
        ru: Минута
      - id: listen
        role: text
        draft: false
        en: "Christine was twenty and Katherine eighteen, and they sang “Sea Lion Woman”. The recording lasts about a minute: two voices and no instruments. The Library of Congress still keeps it."
        ru: "Кристин было двадцать лет, Кэтрин — восемнадцать, и они спели «Sea Lion Woman». Запись длится около минуты: два голоса, ни одного инструмента. Её до сих пор хранит Библиотека Конгресса."
      - id: game
        role: text
        draft: false
        en: "This is the same ring game, only there is no ring here: just two voices. One sister leads and the other answers for the whole ring. Nobody taught them the song from notes: like any playground game, they picked it up from other children."
        ru: "Это та самая игра в круг, только круга здесь нет: поют всего двое. Одна сестра ведёт, другая отвечает ей за весь круг. По нотам их никто не учил: как и любую дворовую игру, эту песню они переняли от других детей."
      - id: yours
        role: caption
        draft: false
        en: "Clap along with the sisters: tap the circle or press the space bar whenever you want to clap. Each clap leaves a dot on the circle, and ink spreads in the picture where the sisters’ hands meet. Your claps are kept, and at the end of the story they will sound together with the children’s."
        ru: "Хлопайте вместе с сёстрами: нажимайте на круг или на пробел, когда хотите хлопнуть. Каждый хлопок оставит на круге точку, а на рисунке, там, где сходятся ладони сестёр, расплывётся пятно туши. Ваши хлопки сохранятся, и в конце истории они прозвучат вместе с детскими."
  - id: words
    kind: text
    art:
      generated: true
      layers:
        - { file: words-r2-plate.webp, depth: 3, alt: { en: "A lined school sheet on a table, covered in pencil marks rubbed out and drawn again", ru: "Тетрадный лист в линейку на столе, весь в стёртых и заново наведённых карандашных линиях" } }
        - { file: words-r2-label.webp, depth: 6, alt: { en: "A blank luggage tag on a red thread", ru: "Пустая багажная бирка на красной нитке" } }
        - { file: words-r2-girls.webp, depth: 10, role: figure, pivot: "50 95", alt: { en: "Two young women at either side of the table lean over the sheet; one writes on it with a pencil, the other watches", ru: "Две девушки по разные стороны стола склонились над листом: одна пишет на нём карандашом, другая смотрит" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: What the name means
        ru: Что значит название
      - id: heard
        role: text
        draft: false
        en: "A sea lion is the animal, so the title “Sea Lion Woman” reads as “the sea lion woman”. But listen to the 1939 recording and there is no sea lion in it. The sisters sing “See lie woman, see lie”, and that does not translate: “see” and “lie” side by side make no sense."
        ru: "Sea lion по-английски — морской лев, так что название «Sea Lion Woman» звучит как «Женщина — морской лев». Но вслушайтесь в запись 1939 года: никакого морского льва в ней нет. Сёстры поют «See lie woman, see lie», и перевести это нельзя: see значит «смотри», lie — «лежать» или «лгать», а вместе получается бессмыслица."
      - id: no-meaning
        role: text
        draft: false
        en: "The singers never looked for a meaning in it. “We just wanted to have something to be saying,” Christine explained. Another person Ferriss talked to put it more briefly still: “It’s just a word we use.”"
        ru: "Сами певицы смысла в этих словах и не искали. «Нам просто хотелось, чтобы было что говорить», — объясняла Кристин. Другой собеседник Ферриса сказал о таком слове ещё короче: «Это просто слово, которое мы говорим»."
      - id: spelling
        role: text
        draft: false
        en: "So where did the sea lion come from? From paper. Abbott Ferriss wrote the words down in his notes as “Sea Lion Woman”, and the sisters later spelled them the same way, though they went on singing “see lie”. Herbert Halpert, who made the recording, called that spelling “a beautiful example of folk etymology”: a phrase that means nothing is reshaped into familiar words that sound like it, and “see lie” turns into a “sea lion”."
        ru: "Откуда же взялся морской лев? С бумаги. Эббот Феррис записал эти слова в своих заметках как «Sea Lion Woman», и так же потом писали их сами сёстры, хотя пели по-прежнему «see lie». Герберт Халперт, сделавший запись, назвал такое написание «прекрасным примером народной этимологии». Так называют случай, когда непонятное слово переделывают в похожее понятное, как в русском просторечии «поликлиника» становится «полуклиникой»: бессмысленное «see lie» на бумаге превратилось в морского льва."
      - id: lying
        role: text
        draft: false
        en: "There is another reading. When the recording first came out on disc in 1942, the booklet printed the answer as “see-line” and asked in a footnote whether it might be “see lyin’”. The line would then mean “see the lying woman”: a woman who spreads gossip. Stephen Wade, who reissued the recording in 1997, also thinks this possible. There are bolder guesses too: that “Sea Line” is the Seaboard Coast Line, a Southern railroad, or that “C-Line” was a code name for one of the secret routes by which people escaped from slavery. None of these guesses is backed by any evidence."
        ru: "Есть и другое прочтение. Когда запись в 1942 году впервые вышла на пластинке, в буклете ответ напечатали как «see-line» и в сноске спросили: может быть, это «see lyin’»? Тогда строчка значила бы «гляньте на лгунью» — на женщину, которая разносит сплетни. Стивен Уэйд, переиздавший запись в 1997 году, тоже считает такое прочтение возможным. Есть догадки и посмелее: что «Sea Line» — это южная железная дорога Seaboard Coast Line или что «C-Line» было условным названием одной из тайных дорог, по которым бежали из рабства. Ни одна из этих догадок ничем не подтверждена."
      - id: simone
        role: text
        draft: false
        en: "In Nina Simone’s song the woman of the game is someone else. She still drinks coffee and tea, but new verses have appeared: in “See-Line Woman” she is “dressed in red” and makes “a man lose his head”. The children’s game has become a song about a dangerous woman."
        ru: "В песне Нины Симон женщина из игры уже другая. Кофе и чай у неё остались, но появились новые куплеты: в «See-Line Woman» она «одета в красное» и «сводит мужчину с ума». Детская игра превратилась в песню о роковой женщине."
      - id: together
        role: text
        draft: false
        en: "So the song ended up with three names. “See lie” is how the Shipp sisters sang it. “Sea Lion” is how Ferriss wrote it down: under that name it came out on the Library of Congress record of 1942 and on the B side of Simone’s single, and later, as “Sealion”, from Feist. “See-Line” is what Nina Simone called her version in 1964, and almost everyone who followed her, from Yusef Lateef to Masters At Work, kept that spelling."
        ru: "Так у песни оказалось три имени. «See lie» — так её пели сёстры Шипп. «Sea Lion» — так её записал Феррис: под этим названием она вышла на пластинке Библиотеки Конгресса в 1942 году и на стороне B сингла Нины Симон, а потом, как «Sealion», у Feist. «See-Line» — так в 1964 году назвала свою версию Нина Симон, и это написание сохранили почти все, кто пел песню после неё, от Юсефа Латифа до Masters At Work."

