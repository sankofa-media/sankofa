        en: "1942"
        ru: "1942"
      - id: album
        role: text
        draft: false
        en: Three years passed, and the Shipp sisters’ minute came out on record. In 1942 the Library of Congress issued a set of 78-rpm discs called “Afro-American Blues and Game Songs”, and Christine’s and Katherine’s voices were in it.
        ru: Прошло три года, и минута сестёр Шипп вышла на пластинке. В 1942 году Библиотека Конгресса выпустила комплект дисков на 78 оборотов под названием «Afro-American Blues and Game Songs», и голоса Кристин и Кэтрин оказались в нём.
      - id: muddy
        role: text
        draft: false
        en: The same set holds the first recordings of a young man from the Mississippi Delta named McKinley Morganfield. Very soon the world would know him as Muddy Waters.
        ru: В том же комплекте — первые записи молодого человека из Дельты Миссисипи по имени Маккинли Морганфилд. Совсем скоро мир узнает его как Мадди Уотерса.
      - id: paris
        role: text
        draft: false
        en: By 1948 a copy of the album had crossed the Atlantic to the Musée de l’Homme in Paris. The Shipp sisters’ voices had travelled further than the sisters themselves would ever go from home.
        ru: К 1948 году один экземпляр этого альбома пересёк Атлантику и попал в Музей человека в Париже. Голоса сестёр Шипп ушли дальше, чем когда-либо уезжали из дома они сами.
