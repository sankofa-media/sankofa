# Sea Lion Girls — the scenes of the longread and their text.
#
# Every text block is DRAFT copy taken from the storyboard
# (sankofa-features/sea-lion-woman/STORYBOARD.ru.md) with a faithful English
# draft; the editor replaces it and sets `draft: false`. A block with
# `hold: true` carries a fact that still has a single source ([проверить] in
# the storyboard): it is kept here for the editor and never shipped.
#
# Facts and sources: lineage.yaml next to this file (two sources per node).
id: sea-lion-girls
order: 1
title:
  en: "Sea Lion Girls: how two young women from Mississippi sang a song the whole world knows"
  ru: "Sea Lion Girls: как две девушки из Миссисипи спели песню, которую знает весь мир"
dek:
  en: "In 1939 two sisters sang a ring game for a folklorist's disc cutter. The song went on through Nina Simone, house music, Kanye West and Massive Attack, under someone else's name."
  ru: "В 1939 году две сестры спели игру в круг для фольклориста с записывающим аппаратом. Дальше песня прошла через Нину Симон, хаус, Канье Уэста и Massive Attack — под чужим именем."
reading: { en: "35–45 minutes, with sound", ru: "35–45 минут, со звуком" }
lineage: lineage.yaml

# Real photos. A photo needs a rights entry in content/ledger/media.yaml
# (source page, licence wording, checksum); a scene shows one with `photo:`.
#
# Generated illustrations are a scene's `art:`: layers in art/ next to this
# file, back to front, marked `generated: true` and never put in the photo
# ledger. They carry no caption of their own; the finale's closing credits
# say once that they are generated (ui.art-credit). Each layer has alt text
# in English and Russian, or alt: "" when it is decorative; `depth` is its
# parallax in pixels, role `figure` breathes, `state` shows it only while the
# picture is in that state, `open` swings it open over a stretch of the
# scene, `fit` registers it on the canvas (percent, scale). Sources: the art
# contact sheet (door v2 and its finale porch and light, expedition v2, album
# v1, piano v1, classroom v2, river v1) and the redraws (ring v3, family v4,
# minute v4), WebP at 1600 px. Role `step` comes half a step forward when
# the scene is reached; `claps` marks where hands meet, and a ripple of ink
# spreads there with every clap (the figures keep their own hands and never
# come apart). The sisters' layers are named left and right: the alt text
# does not say which sister is which.
art:
  - id: simone-1965
    kind: photo
    file: nina-simone-1965.jpg
    rights: nina-simone-1965.jpg
    alt: { en: "Nina Simone, a portrait, 1965", ru: "Нина Симон, портрет, 1965 год" }
    credit:
      en: "Nina Simone, December 1965. Photo: Ron Kroon / Anefo, Nationaal Archief, CC0"
      ru: "Нина Симон, декабрь 1965 года. Фото: Рон Крон / Anefo, Национальный архив Нидерландов, CC0"

