scenes:
  - id: door
    kind: door
    art: &door-art
      generated: true
      layers:
        - { file: door-r2-plate.webp, depth: 6, alt: { en: "A small wooden house in rural Mississippi, spring 1939", ru: "Небольшой деревянный дом в сельском Миссисипи, весна 1939 года" } }
        - { file: door-r2-porch.webp, depth: 10, state: closed, alt: { en: "Its porch, the front door closed", ru: "Крыльцо, входная дверь закрыта" } }
        - { file: door-r2-porch-open.webp, depth: 10, state: open, alt: { en: "Its porch, the front door ajar", ru: "Крыльцо, входная дверь приоткрыта" } }
        - { file: door-r2-light.webp, depth: 10, state: open, alt: "" }
        - { file: door-r2-tree.webp, depth: 18, alt: "" }
    blocks:
      - id: when
        role: kicker
        draft: false
        en: Byhalia, Mississippi, 13 May 1939
        ru: Байхейлия, Миссисипи, 13 мая 1939 года
      - id: lead
        role: text
        draft: false
        en: "The whole world knows this song. Nina Simone sang it, house DJs remade it again and again, Kanye West and Massive Attack built tracks on it, and it plays in films, series and video games. But the earliest recording of it that has come down to us is sung not by stars but by two young women from a small town in Mississippi, Christine and Katherine Shipp. Their names are on almost none of those records. This is the story of how their song went round the world while they themselves stayed unknown."
        ru: "Эту песню знает весь мир. Её пела Нина Симон, её снова и снова переделывали хаус-диджеи, на ней строили свои треки Канье Уэст и Massive Attack, она звучит в фильмах, сериалах и видеоиграх. Но в самой ранней записи, которая до нас дошла, поют не звёзды, а две девушки из маленького городка в штате Миссисипи — Кристин и Кэтрин Шипп. Их имён нет почти ни на одной из этих пластинок. Это история о том, как их песня обошла весь мир, а сами они так и остались безвестными."
      - id: why-knock
        role: note
        draft: false
        en: "This story has sound. It comes on when you knock at the door: quiet claps will play under the text, and in some scenes you can clap along with its heroines. The button at the top of the screen turns the claps off and on again."
        ru: "В этой истории есть звук. Он включится, когда вы постучите в дверь: под текстом тихо зазвучат хлопки, а в некоторых сценах вы сможете хлопать вместе с героинями. Выключить хлопки и включить их снова можно кнопкой вверху экрана."

  - id: ring
    kind: ring
    art:
      generated: true
      layers:
        - { file: ring-r2-plate.webp, depth: 3, alt: "" }
        - { file: ring-r2-children.webp, depth: 10, role: figure, pivot: "50 60", alt: { en: "Children in a ring, seen from a little above, clapping", ru: "Дети в кругу, вид чуть сверху, хлопают в ладоши" } }
      # Where each child's hands meet: a ripple of ink spreads there with every clap.
      claps:
        depth: 10
        at: [ [ 52.3, 13.2 ], [ 69.6, 16.5 ], [ 82.8, 33.9 ], [ 17.5, 31.9 ], [ 32.8, 15.5 ], [ 52.5, 59.6 ], [ 70.5, 58.5 ], [ 29.7, 56.3 ] ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Before 1939
        ru: До 1939 года
      - id: title
        role: title
        draft: false
        en: A game in a circle
        ru: Игра в круг
      - id: form
        role: text
        draft: false
        en: "Long before anyone began to record such songs, African American children in the American South played them in schoolyards. The players stand in a ring and one of them leads: the leader sings a line and the whole ring answers in chorus. The leader’s lines change, while the ring’s answer stays the same from line to line."
        ru: "Задолго до того, как такие песни начали записывать, афроамериканские дети на Юге Соединённых Штатов играли в них на школьных дворах. Играющие встают в круг, и кто-то один ведёт игру: ведущий поёт строчку, а весь круг хором ему отвечает. Строчки ведущего меняются, а ответ круга остаётся одним и тем же."
      - id: example
        role: text
        draft: false
        en: "This is how it goes in the song this story is about. The leader begins: “See lie woman”, and the ring answers: “See lie”. She sings: “She drink coffee”, and the ring again: “See lie”. Then: “She drink tea”, and once more: “See lie”. And so on: every line of the leader’s gets the same answer."
        ru: "Вот как это звучит в песне, о которой пойдёт речь. Ведущая начинает: «See lie woman», — и круг отвечает: «See lie». Она поёт: «She drink coffee» («Она пьёт кофе»), — и круг снова: «See lie». Потом: «She drink tea» («Она пьёт чай»), — и опять: «See lie». И так дальше: на каждую строчку ведущей круг отвечает одно и то же."
      - id: clap
        role: text
        draft: false
        en: "While the voices sing, everyone claps and stamps. The count goes in fours and the clap falls on the second and fourth beats: one, quiet; two, clap; three, quiet; four, clap. There are no instruments in such a game: the players’ hands and feet keep the time. The Shipps later explained that the answer, “See lie”, was called out during the game as a signal to move."
        ru: "Пока звучат голоса, все хлопают в ладоши и притопывают. Счёт идёт на четыре, и хлопок приходится на второй и четвёртый удар: раз — тихо, два — хлопок, три — тихо, четыре — хлопок. Инструментов в такой игре нет, ритм держат ладони и ноги играющих. А ответ «See lie», как объясняли потом сами Шиппы, выкрикивали по ходу игры как знак, что пора двигаться."
      - id: book
        role: text
        draft: false
        en: "In 1972 Bessie Jones, a singer from the Georgia Sea Islands, and the folklorist Bess Lomax Hawes published “Step It Down”, a book that collects such games and explains how they are played. The clapping of the whole group, they wrote, is the real “music” that goes with all these games."
        ru: "В 1972 году Бесси Джонс, певица с Морских островов у побережья Джорджии, и фольклорист Бесс Ломакс Хоуз выпустили книгу «Step It Down», где собрали такие игры и объяснили, как в них играют. Хлопки всех играющих они назвали настоящей «музыкой», под которую идут все эти игры."
      - id: no-roots
        role: text
        draft: false
        en: "This exchange between one voice and a chorus links these games to African musical practice. But where this particular song came from before it reached Mississippi, and who first sang it, we do not know. Nobody composes playground games: children pick them up from one another and play them the way they were played before."
        ru: "Такая перекличка запевалы и хора роднит эти игры с африканской музыкой. Но откуда пришла в Миссисипи именно эта песня и кто первым её спел, мы не знаем. Дворовые игры никто не сочиняет: дети перенимают их друг у друга и играют так, как играли до них."
      - id: hear
        role: caption
        draft: false
        en: "Under this scene that rhythm is playing quietly, still without voices: a clap on two and on four. If you cannot hear it, press “Turn the clap on”."
        ru: "Сейчас под текстом тихо звучит такой ритм, пока без голосов: хлопок на «два» и на «четыре». Если вы его не слышите, нажмите «Включить хлопок»."

  - id: expedition
    kind: expedition
    art:
      generated: true
      layers:
        - { file: expedition-r2-plate.webp, depth: 4, alt: { en: "A dirt road through low fields", ru: "Грунтовая дорога среди низких полей" } }
        - { file: expedition-r2-ambulance.webp, depth: 10, alt: { en: "An old army ambulance turned into a recording studio on wheels", ru: "Старая армейская санитарная машина, превращённая в студию на колёсах" } }
        - file: expedition-r2-machine.webp
          depth: 10
          open: "0.12 0.4"
          pivot: "63.3 59.4"
          alt: { en: "Its back doors open on a machine that cuts sound onto discs", ru: "Задние двери открыты, внутри аппарат, режущий звук на диски" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The expedition
        ru: Экспедиция
      - id: why
        role: text
        draft: false
        en: "In the 1930s the Library of Congress in Washington set out to record the songs ordinary Americans sang before they were forgotten. It sent folklorists with recording machines on journeys through the South, and the Federal Writers’ Project, a government programme that gave writers work during the Depression, helped them find singers in villages and small towns."
        ru: "В 1930-е годы Библиотека Конгресса в Вашингтоне взялась записывать песни, которые пели простые американцы, пока эти песни не забылись. Она посылала фольклористов с записывающими аппаратами в поездки по Югу, а Федеральный писательский проект, государственная программа, которая в годы Великой депрессии давала работу писателям, помогал им находить певцов в деревнях и маленьких городах."
      - id: halpert
        role: text
        draft: false
        en: "In the spring of 1939 the folklorist Herbert Halpert set off on such a journey. He drove an old army ambulance that had been turned into a studio on wheels: the machine inside recorded sound straight onto discs. In Mississippi his guide was Abbott Ferriss of the Writers’ Project, who took notes and photographs. In May they reached the small town of Byhalia."
        ru: "Весной 1939 года в такую поездку отправился фольклорист Герберт Халперт. Ездил он на старой армейской санитарной машине, которую превратили в студию на колёсах: аппарат внутри записывал звук прямо на диски. В Миссисипи его проводником стал Эббот Феррис из Писательского проекта: он делал заметки и фотографировал. В мае они добрались до городка Байхейлия."
      - id: byhalia
        role: label
        draft: false
        en: Byhalia
        ru: Байхейлия
  - id: arrival
