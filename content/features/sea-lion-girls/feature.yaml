      - id: text
        role: text
        draft: true
        en: "Massive Attack, “Paradise Circus”. At 1:49, 2:37 and 3:21 Nina Simone’s claps flash up; we found them by comparing the recordings. From each one the ink runs back, to 1964 and then to 1939."
        ru: "Massive Attack, «Paradise Circus». На 1:49, 2:37 и 3:21 вспыхивают хлопки Нины Симон — мы нашли их, сравнивая записи. От каждой вспышки тушь тянется назад: к 1964 году, потом к 1939-му."
      - id: on
        role: text
        draft: true
        en: "The branch goes on to Gui Boratto’s remix, to Burial’s twelve-minute rework and to the opening titles of “Luther”."
        ru: "Дальше ветвь идёт к ремиксу Gui Boratto, к двенадцатиминутной переработке Burial и к заставке сериала «Лютер»."
      - id: fuchs
        role: note
        draft: true
        en: "The drums on the album are credited to Jerry Fuchs, who died in Brooklyn on November 8, 2009, three months before “Heligoland” came out."
        ru: "Барабаны на альбоме записаны за Джерри Фуксом, который погиб в Бруклине 8 ноября 2009 года, за три месяца до выхода «Heligoland»."
