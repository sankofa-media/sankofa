scenes:
  - id: door
    kind: door
    art: &door-art
      generated: true
      layers:
        - { file: door-house.webp, depth: 6, alt: { en: "A small wooden house in rural Mississippi, spring 1939", ru: "Небольшой деревянный дом в сельском Миссисипи, весна 1939 года" } }
        - { file: door-porch.webp, depth: 10, state: closed, alt: { en: "Its porch, the front door closed", ru: "Крыльцо, входная дверь закрыта" } }
        - { file: door-porch-open.webp, depth: 10, state: open, alt: { en: "Its porch, the front door ajar", ru: "Крыльцо, входная дверь приоткрыта" } }
        - { file: door-light.webp, depth: 10, state: open, alt: "" }
        - { file: door-tree.webp, depth: 18, alt: "" }
    blocks:
      - id: when
        role: kicker
        draft: false
        en: Byhalia, Mississippi, 13 May 1939
        ru: Байхейлия, Миссисипи, 13 мая 1939 года
      - id: lead
        role: text
        draft: false
        en: The whole world knows this song. Nina Simone sang it, house DJs remixed it, Kanye West and Massive Attack built on it, films and games used it. But the first people whose voices we have singing it were two young women from a small town in Mississippi, Christine and Katherine Shipp. Their names are on almost none of those records. This is the story of how their song travelled without them.
        ru: Эту песню знает весь мир. Её пела Нина Симон, её переделывали хаус-диджеи, на ней строили свои треки Канье Уэст и Massive Attack, она звучит в фильмах и видеоиграх. Но первыми, чьи голоса с этой песней дошли до нас, были две девушки из маленького городка в Миссисипи — Кристин и Кэтрин Шипп. Их имён почти нет на всех этих пластинках. Это история о том, как их песня обошла мир без них.
      - id: why-knock
        role: note
        draft: false
        en: "The story has sound. It begins when you knock: your knock turns it on, and from then on you can clap along."
        ru: В этой истории есть звук. Он включается, когда вы постучите в дверь, и дальше вы сможете хлопать вместе с героинями.

  - id: ring
    kind: ring
    art:
      generated: true
      layers:
        - { file: ring-ground.webp, depth: 3, alt: "" }
        - { file: ring-children.webp, depth: 10, role: figure, pivot: "50 60", alt: { en: "Children in a ring, seen from a little above, clapping", ru: "Дети в кругу, вид чуть сверху, хлопают в ладоши" } }
      # Where each child's hands meet: a ripple of ink spreads there with every clap.
      claps:
        depth: 10
        at: [ [52.3, 13.2], [69.6, 16.5], [82.8, 33.9], [17.5, 31.9], [32.8, 15.5], [52.5, 59.6], [70.5, 58.5], [29.7, 56.3] ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Before 1939
        ru: До 1939 года
      - id: title
        role: title
        draft: false
        en: A game in a circle
        ru: Игра в круг
      - id: form
        role: text
        draft: false
        en: Long before anyone recorded such songs, African American children in the South played singing games in a ring. One child sings a line, the whole circle answers, and the answer comes round again and again. Hands and feet keep time on the second and fourth beats, so the game has its own rhythm section even with no instruments at all.
        ru: Задолго до того, как такие песни кто-нибудь записал, афроамериканские дети на Юге играли в игры с пением, стоя в кругу. Один поёт строчку, весь круг ему отвечает, и этот ответ возвращается снова и снова. Ладони и ноги отбивают вторую и четвёртую доли, так что у игры есть своя ритм-секция, хотя инструментов в ней нет вовсе.
      - id: book
        role: text
        draft: false
        en: Bessie Jones, a singer from the Georgia Sea Islands, and the folklorist Bess Lomax Hawes gathered such games in their book “Step It Down” (1972). They wrote that the real music of these games is the clapping of the circle.
        ru: Бесси Джонс, певица с Морских островов Джорджии, и фольклорист Бесс Ломакс Хоуз собрали такие игры в книге «Step It Down» (1972). По их словам, настоящая музыка этих игр — хлопки круга.
      - id: no-roots
        role: text
        draft: false
        en: This way of singing, where a leader calls and a group answers, links the games to African musical practice. Where our particular song came from before 1939, no source tells us, so we will not guess.
        ru: Такой способ петь, когда ведущий зовёт, а группа отвечает, роднит эти игры с африканской музыкальной практикой. Откуда пришла до 1939 года именно наша песня, не сообщает ни один источник, и гадать мы не будем.
      - id: hear
        role: caption
        draft: false
        en: Press “Hear the clap” to hear the circle’s rhythm on its own, before any voice comes in.
        ru: Нажмите «Послушать хлопок», чтобы услышать ритм круга сам по себе, ещё без голосов.

  - id: expedition
    kind: expedition
    art:
      generated: true
      layers:
        - { file: expedition-road.webp, depth: 4, alt: { en: "A dirt road through low fields", ru: "Грунтовая дорога среди низких полей" } }
        - { file: expedition-ambulance.webp, depth: 10, alt: { en: "An old army ambulance turned into a recording studio on wheels", ru: "Старая армейская санитарная машина, превращённая в студию на колёсах" } }
        - file: expedition-machine.webp
          depth: 10
          open: "0.12 0.4"
          pivot: "63.3 59.4"
          fit: { x: 7.04, y: 0, scale: 0.73 }
          alt: { en: "Its back doors open on a machine that cuts sound onto discs", ru: "Задние двери открыты, внутри аппарат, режущий звук на диски" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The expedition
        ru: Экспедиция
      - id: why
        role: text
        draft: false
        en: In the 1930s the Library of Congress in Washington set out to record the songs that ordinary Americans sang, before they were forgotten. It sent folklorists with recording machines across the South, and the Federal Writers’ Project, a government programme that gave work to writers during the Depression, helped them find singers.
        ru: В 1930-е годы Библиотека Конгресса в Вашингтоне взялась записать песни, которые пели обычные американцы, пока они не забылись. Она отправляла фольклористов с записывающими аппаратами по Югу, а Федеральный писательский проект — государственная программа, дававшая писателям работу во время Великой депрессии, — помогал им находить певцов.
      - id: halpert
        role: text
        draft: false
        en: "In the spring of 1939 the folklorist Herbert Halpert set off on such a journey. He drove an old army ambulance that had been turned into a recording studio on wheels: the machine inside cut sound straight onto discs. In Mississippi his guide was Abbott Ferriss of the Writers’ Project, who took notes and photographs. In May they came to the small town of Byhalia."
        ru: "Весной 1939 года в такую поездку отправился фольклорист Герберт Халперт. Он ездил на старой армейской санитарной машине, превращённой в студию на колёсах: аппарат внутри резал звук прямо на диски. В Миссисипи его проводником был Эббот Феррис из Писательского проекта — он вёл записи и фотографировал. В мае они приехали в городок Байхейлию."
      - id: byhalia
        role: label
        draft: false
        en: Byhalia
        ru: Байхейлия
  - id: arrival
    kind: arrival
    # The house of the cover: its door opens to the two strangers.
    art: *door-art
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 13 May 1939
        ru: 13 мая 1939 года
      - id: opened
        role: text
        draft: false
        en: On 13 May Halpert and Ferriss knocked at the door of John Shipp and his wife Luella. They had come for the singing family of John’s mother, Mary Shipp, and Luella and John opened the door to the two strangers.
        ru: Тринадцатого мая Халперт и Феррис постучали в дверь Джона Шиппа и его жены Луэллы. Они приехали к поющей семье матери Джона, Мэри Шипп, и Луэлла с Джоном открыли дверь двум незнакомцам.

  - id: family
    kind: family
    art:
      generated: true
      layers:
        - { file: family-church.webp, depth: 3, alt: { en: "A small wooden country church", ru: "Маленькая деревянная сельская церковь" } }
        - { file: family-family.webp, depth: 8, role: figure, pivot: "40 90", alt: { en: "An older woman, a young man and a boy in their Sunday clothes", ru: "Пожилая женщина, молодой человек и мальчик в воскресной одежде" } }
        - { file: family-sister-left.webp, depth: 12, role: step, pivot: "68 92", alt: { en: "Two young women standing half a step forward, one in a red dress", ru: "Две девушки на полшага впереди, одна в красном платье" } }
        - { file: family-sister-right.webp, depth: 12, role: step, pivot: "80 92", alt: "" }
    figures:
      - { id: mary, name: { en: "Mary Shipp", ru: "Мэри Шипп" }, age: 47, role: { en: "John’s mother", ru: "мать Джона" } }
      - { id: isaac, name: { en: "Isaac", ru: "Айзек" }, age: 23 }
      - { id: allison, name: { en: "Allison", ru: "Эллисон" }, age: 15 }
      - { id: christine, name: { en: "Christine", ru: "Кристин" }, age: 20, lead: true }
      - { id: katherine, name: { en: "Katherine", ru: "Кэтрин" }, age: 18, lead: true }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The family
        ru: Семья
      - id: who
        role: text
        draft: false
        en: "Halpert recorded Mary Shipp and four of her children: her sons Isaac and Allison and her daughters Christine and Katherine. They sang for him at the family’s church, Nichols Chapel."
        ru: "Халперт записал Мэри Шипп и четверых её детей: сыновей Айзека и Эллисона и дочерей Кристин и Кэтрин. Пели они ему в церкви семьи, Николс-Чепел."
      - id: step
        role: line
        draft: false
        en: Then the two sisters, Christine and Katherine, stepped forward.
        ru: Потом вперёд вышли две сестры — Кристин и Кэтрин.
      - id: by-ear
        role: text
        draft: true
        hold: true
        check: "One source (NPR 1998): the Shipps learned all their songs by ear."
        en: The Shipps knew their songs by ear.
        ru: Песни Шиппы знали на слух.

  - id: minute
    kind: minute
    art:
      generated: true
      layers:
        - { file: minute-wash.webp, depth: 3, alt: "" }
        - { file: minute-sister-left.webp, depth: 10, role: figure, pivot: "26 90", alt: { en: "Two sisters face each other and sing; one leads, the other answers", ru: "Две сестры стоят лицом друг к другу и поют: одна ведёт, другая отвечает" } }
        - { file: minute-sister-right.webp, depth: 10, role: figure, pivot: "71 90", alt: { en: "The second sister, in a red dress, claps as she sings", ru: "Вторая сестра, в красном платье, хлопает в ладоши и поёт" } }
      claps:
        depth: 10
        at: [ [39.6, 34.1], [63.2, 34.1] ]
    nodes: [ shipp-1939 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The minute
        ru: Минута
      - id: listen
        role: text
        draft: false
        en: "Christine and Katherine sang “Sea Lion Woman”. The recording lasts about a minute: two voices and no instruments. The Library of Congress still keeps it."
        ru: "Кристин и Кэтрин спели «Sea Lion Woman». Запись длится около минуты: два голоса и ни одного инструмента. Она до сих пор хранится в Библиотеке Конгресса."
      - id: game
        role: text
        draft: false
        en: It is the same ring game. One sister sings a line, and the other answers, as the whole circle would answer in the playground. Nobody wrote this song down for them; it came to them the way such games always came, from other children.
        ru: "Это та самая игра в круг. Одна сестра поёт строчку, другая отвечает, как ответил бы весь круг на школьном дворе. Никто не записывал для них эту песню: она пришла к ним, как всегда приходили такие игры, — от других детей."
      - id: yours
        role: caption
        draft: false
        en: "Clap with them: tap the circle or press the space bar in time. Each clap stays on the circle as a drop of ink, and the circle will stay with you until the end of the story."
        ru: "Хлопайте вместе с ними: касайтесь круга или нажимайте пробел в такт. Каждый хлопок останется на круге каплей туши, а сам круг будет с вами до конца истории."
  - id: words
    kind: text
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The words
        ru: Слова
      - id: heard
        role: text
        draft: false
        en: "Listen closely to the 1939 recording and you will not hear a sea lion in it. The sisters sing “See lie woman, see lie”, and the woman of the game drinks coffee and drinks tea. They are the words of a playground: sounds that drive the game along more than they tell a story."
        ru: "Если внимательно вслушаться в запись 1939 года, никакой «морской львицы» в ней не окажется. Сёстры поют «See lie woman, see lie», а женщина из игры пьёт кофе и пьёт чай. Это слова школьного двора: звуки, которые ведут игру, а не рассказывают историю."
      - id: spelling
        role: text
        draft: false
        en: "“Sea Lion Woman” is how the words looked once they were written down, and the sisters later spelled them that way too. Herbert Halpert, who made the recording, called that spelling “a beautiful example of folk etymology”: when a phrase no longer means anything, people hear in it something they know, such as a sea lion."
        ru: "«Sea Lion Woman» — так эти слова выглядели, когда их записали на бумаге, и так же их потом писали сами сёстры. Герберт Халперт, сделавший запись, назвал такое написание «прекрасным примером народной этимологии»: когда фраза уже ничего не значит, люди слышат в ней что-то знакомое, например морского льва."
      - id: lying
        role: text
        draft: false
        en: Other listeners heard another word in it. As early as 1942 the booklet of the Library of Congress album asked in a footnote whether “see lie” might be “see lyin’”, a lying woman, a gossip. Nobody has ever settled it, and the game never needed it settled.
        ru: Другие слушатели слышали в этих словах иное. Ещё в 1942 году в буклете альбома Библиотеки Конгресса в сноске спрашивали, не «see lyin’» ли это — «лгунья», сплетница. Никто так и не решил этот вопрос, и самой игре решать его было не нужно.
      - id: simone
        role: text
        draft: false
        en: By the time the song reached Nina Simone, the woman of the game had changed. In Simone’s “See-Line Woman” she is “dressed in red” and makes “a man lose his head”. The playground chant had turned into a song about a woman men lose their heads over, and the woman who drank coffee and tea was gone.
        ru: Пока песня шла к Нине Симон, женщина из игры изменилась. В «See-Line Woman» у Симон она «одета в красное» и «сводит мужчину с ума». Дворовая считалка превратилась в песню о женщине, из-за которой мужчины теряют голову, а женщина, пившая кофе и чай, исчезла.
      - id: together
        role: line
        draft: false
        en: "So even the song’s name went its own way: “See lie” in the sisters’ mouths, “Sea Lion” on paper, “See-Line” on Simone’s record."
        ru: "Так своей дорогой ушло даже название: «See lie» в устах сестёр, «Sea Lion» на бумаге, «See-Line» на пластинке Симон."

  - id: album
    kind: album
    art:
