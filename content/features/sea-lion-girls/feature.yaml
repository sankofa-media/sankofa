scenes:
  - id: door
    kind: door
    blocks:
      - {id: when, role: kicker, draft: true, en: "May 13, 1939. Byhalia, Mississippi", ru: "13 мая 1939 года. Байхейлия, Миссисипи"}
      - id: why-knock
        role: note
        draft: true
        en: "A browser will not start a sound until a person does something, so the sound of this story begins with your knock, the way the folklorist Herbert Halpert knocked at the Shipps’ door."
        ru: "Браузер не даёт звуку начаться без действия человека, поэтому звук этой истории начинается с вашего стука — так же, как фольклорист Герберт Халперт постучал к Шиппам."
      - {id: opened, role: line, draft: true, en: "Luella and John Shipp open the door.", ru: "Дверь открывают Луэлла и Джон Шипп."}

  - id: ring
    kind: ring
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "Before 1939", ru: "До 1939 года"}
      - {id: title, role: title, draft: true, en: "A game in a circle", ru: "Игра в круг"}
      - id: form
        role: text
        draft: true
        en: "African American children played singing games in a ring or in a line. One leads, the group answers, the refrain comes round again and again, and the hands and feet keep the second and fourth beats."
        ru: "Афроамериканские дети играли в игры с пением — в кругу или на линии. Одна ведёт, группа отвечает, припев возвращается снова и снова, а ладони и ноги держат вторую и четвёртую доли."
      - id: book
        role: text
        draft: true
        en: "Bessie Jones and Bess Lomax Hawes gathered such games in the book “Step It Down” (1972)."
        ru: "Бесси Джонс и Бесс Ломакс Хоуз собрали такие игры в книге «Step It Down» (1972)."
      - id: no-roots
        role: text
        draft: true
        en: "The call and response of the form is shared with African musical practice. Where this one song began before 1939, no source says, and we do not guess."
        ru: "Вопрос и ответ самой формы роднят её с африканской музыкальной практикой. Откуда пришла именно эта песня до 1939 года, не говорит ни один источник, и мы не гадаем."
      - {id: hear, role: caption, draft: true, en: "This is the clap, for now without a tune.", ru: "Это хлопок — пока без мелодии."}

  - id: expedition
    kind: expedition
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The expedition", ru: "Экспедиция"}
      - id: why
        role: text
        draft: true
        en: "In the 1930s the Library of Congress sent collectors with recording machines across the South, and the Federal Writers’ Project helped them find singers."
        ru: "В 1930-е годы Библиотека Конгресса отправляла собирателей с записывающими аппаратами по Югу, а Федеральный писательский проект помогал им находить певцов."
      - id: halpert
        role: text
        draft: true
        en: "In the spring of 1939 it was Herbert Halpert’s turn: the Herbert Halpert 1939 Southern States Recording Expedition. One of its stops was Byhalia."
        ru: "Весной 1939 года настала очередь Герберта Халперта: экспедиция Herbert Halpert 1939 Southern States Recording Expedition. Одна из её остановок — Байхейлия."
      - {id: byhalia, role: label, draft: true, en: "Byhalia", ru: "Байхейлия"}

  - id: family
    kind: family
    figures:
      - {id: mary, name: {en: "Mary Shipp", ru: "Мэри Шипп"}, age: 47, role: {en: "John’s mother", ru: "мать Джона"}}
      - {id: isaac, name: {en: "Isaac", ru: "Айзек"}, age: 23}
      - {id: allison, name: {en: "Allison", ru: "Эллисон"}, age: 15}
      - {id: christine, name: {en: "Christine", ru: "Кристин"}, age: 20, lead: true}
      - {id: katherine, name: {en: "Katherine", ru: "Кэтрин"}, age: 18, lead: true}
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The family", ru: "Семья"}
      - id: who
        role: text
        draft: true
        en: "Halpert had come to record John’s mother and her children. With him was Abbott Ferriss of the Federal Writers’ Project."
        ru: "Халперт пришёл записать мать Джона и её детей. С ним был Эббот Феррис из Федерального писательского проекта."
      - id: ambulance
        role: text
        draft: true
        hold: true
        check: "One source (NPR 1998): an old army ambulance refitted with a disc cutter."
        en: "Outside stood his car: an old army ambulance refitted with a machine that cut records."
        ru: "Рядом стояла машина: списанная армейская санитарная машина с аппаратом, который режет пластинки."
      - id: by-ear
        role: text
        draft: true
        hold: true
        check: "One source (NPR 1998): the Shipps learned all their songs by ear."
        en: "The Shipps knew their songs by ear."
        ru: "Песни Шиппы знали на слух."
      - {id: step, role: line, draft: true, en: "Christine and Katherine step forward.", ru: "Вперёд выходят Кристин и Кэтрин."}

  - id: minute
    kind: minute
    nodes: [shipp-1939]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The minute", ru: "Минута"}
      - id: listen
        role: text
        draft: true
        en: "The Library of Congress keeps the recording: about a minute, two voices, no instruments."
        ru: "Запись хранит Библиотека Конгресса: около минуты, два голоса, без инструментов."
      - id: game
        role: text
        draft: true
        en: "It is a ring game: the leader sings and the circle answers. Nobody taught it from notes; it passed from hand to hand."
        ru: "Это игра в круг: ведущая поёт, круг отвечает. Ей не учили по нотам, её передавали из рук в руки."
      - id: yours
        role: caption
        draft: true
        en: "Clap with them. Every clap stays on the circle as a drop of ink, and the circle stays with you to the end."
        ru: "Хлопайте вместе с ними. Каждый хлопок остаётся на круге каплей туши, а круг останется с вами до конца."

  - id: album
    kind: album
    nodes: [afs-l4-1942]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "1942", ru: "1942"}
      - id: album
        role: text
        draft: true
        en: "The Library of Congress put the minute on a set of 78-rpm records: “Afro-American Blues and Game Songs”, Album IV, 1942."
        ru: "Библиотека Конгресса выпустила минуту на комплекте пластинок на 78 оборотов: «Afro-American Blues and Game Songs», Album IV, 1942 год."
      - id: muddy
        role: text
        draft: true
        en: "On the same album are the first recordings of McKinley Morganfield, who would become Muddy Waters."
        ru: "На том же альбоме — первые записи Маккинли Морганфилда, который потом станет Мадди Уотерсом."
      - id: paris
        role: text
        draft: true
        en: "By 1948 a copy of the album had crossed the Atlantic to the Musée de l’Homme in Paris."
        ru: "К 1948 году экземпляр альбома пересёк Атлантику и оказался в Музее человека в Париже."
      - {id: label-paris, role: label, draft: true, en: "Paris", ru: "Париж"}
      - {id: label-washington, role: label, draft: true, en: "Washington", ru: "Вашингтон"}

  - id: simone
    kind: simone
    nodes: [simone-1964]
    art: simone-1965
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "1964", ru: "1964"}
      - id: version
        role: text
        draft: true
        en: "Nina Simone recorded “See-Line Woman” for the album “Broadway-Blues-Ballads” (1964)."
        ru: "Нина Симон записала «See-Line Woman» для альбома «Broadway-Blues-Ballads» (1964)."
      - id: arrangement
        role: text
        draft: true
        en: "The arrangement is hers: syncopated claps and percussion, and a changed spelling of the title."
        ru: "Аранжировка её: синкопированные хлопки и ударные, изменённое написание названия."
      - id: bach
        role: text
        draft: true
        en: "A classical pianist raised on Bach turned a children’s game into a concert piece."
        ru: "Классическая пианистка, выученная на Бахе, превратила детскую игру в концертную вещь."

  - id: single
    kind: single
    nodes: [simone-single-1964]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "July 1964", ru: "Июль 1964"}
      - id: two-sides
        role: text
        draft: true
        en: "In July 1964 a 45 came out. Side A: [[mississippi-goddam|“Mississippi Goddam”]]. Turn it over."
        ru: "В июле 1964 года вышла сорокапятка. Сторона A — [[mississippi-goddam|«Mississippi Goddam»]]. Переверните её."
      - id: side-b
        role: text
        draft: true
        en: "Side B: “Sea Lion Woman”, in the folk spelling. One summer record carried a protest about Mississippi and a game of two girls from Mississippi."
        ru: "Сторона B — «Sea Lion Woman», в народном написании. Одна пластинка лета 1964 года несла протест о Миссисипи и игру двух девушек из Миссисипи."
      - id: goddam
        role: text
        draft: true
        hold: true
        check: "The story behind “Mississippi Goddam”: one line, only after its sources are checked."
        en: "(One line on what lies behind “Mississippi Goddam”, after the sources are checked.)"
        ru: "(Одна строка о том, что стоит за «Mississippi Goddam», — после проверки источников.)"
      - {id: label-a, role: label, draft: true, en: "Mississippi Goddam", ru: "Mississippi Goddam"}
      - {id: label-b, role: label, draft: true, en: "Sea Lion Woman", ru: "Sea Lion Woman"}
      - {id: credit, role: label, draft: true, en: "Written by George Houston Bass", ru: "Written by George Houston Bass"}
      - {id: names, role: label, draft: true, en: "Christine and Katherine Shipp", ru: "Кристин и Кэтрин Шипп"}
      - id: name
        role: caption
        draft: true
        en: "The label names one writer. Under it, the two names that sang the song in 1939 run in the ink."
        ru: "Этикетка называет одного автора. Под ней расплываются в туши два имени тех, кто спел песню в 1939 году."

  - id: bass
    kind: text
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The man on the label", ru: "Человек на этикетке"}
      - id: who
        role: text
        draft: true
        en: "George Houston Bass was Langston Hughes’s secretary and literary assistant from 1959 to 1964. He later founded the Rites and Reason theatre at Brown University and died in Providence in 1990."
        ru: "Джордж Хьюстон Басс был секретарём и литературным помощником Ленгстона Хьюза с 1959 по 1964 год. Потом он основал театр Rites and Reason в Брауновском университете и умер в Провиденсе в 1990 году."
      - id: system
        role: text
        draft: true
        en: "He did not take the song from the girls. He wrote it down and shaped it, and copyright left a single name on it."
        ru: "Он не отнимал песню у девушек. Он записал и оформил её, а система авторского права оставила на песне одно имя."
      - id: route
        role: text
        draft: true
        hold: true
        check: "How the song reached Simone: one author so far (W. Jason Miller)."
        en: "(How the song reached Simone, if a second source confirms W. Jason Miller.)"
        ru: "(Как именно песня дошла до Симон — если подтвердится вторым источником, сейчас только У. Джейсон Миллер.)"

  - id: river
    kind: river
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The river", ru: "Река"}
      - id: intro
        role: text
        draft: true
        en: "From the 1939 recording and from the 1964 record, branches grow down. Every version is a medallion with its year; press one to hear its official recording in the player."
        ru: "От записи 1939 года и от пластинки 1964 года вниз растут ветви. Каждая версия — медальон с годом; нажмите на него, чтобы услышать официальную запись в плеере."
      - id: branches
        role: text
        draft: true
        en: "Two branches run side by side: those who took the girls’ voices and the circle’s answer, and those who took Simone’s title, arrangement and recording."
        ru: "Две ветви идут рядом: те, кто взял голоса девочек и ответ круга, и те, кто взял название, аранжировку и запись Симон."

  - id: jazz
    kind: stop
    nodes: [lateef-1967]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "1967 · jazz", ru: "1967 · джаз"}
      - {id: text, role: text, draft: true, en: "Yusef Lateef: the folk game becomes [[jazz]].", ru: "Юсеф Латиф: народная игра становится [[jazz|джазом]]."}
      - {id: listen, role: note, draft: true, en: "Listen for the tambourine keeping the old clap.", ru: "Слушайте бубен: он держит старый хлопок."}

  - id: beat
    kind: stop
    nodes: [easybeats-1967]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "1967 · beat", ru: "1967 · бит"}
      - {id: text, role: text, draft: true, en: "The Easybeats, an Australian beat group, in an arrangement by Vanda and Young.", ru: "The Easybeats, австралийская бит-группа, в аранжировке Ванды и Янга."}

  - id: house
    kind: stop
    nodes: [songstress-1997, maw-remix-2002]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "1997 → 2002 · house", ru: "1997 → 2002 · хаус"}
      - id: text
        role: text
        draft: true
        en: "New York [[chicago-house|house]]: The Songstress, produced by Kerri Chandler and Jerome Sydenham; then Masters At Work remix Simone’s own recording for the clubs."
        ru: "Нью-йоркский [[chicago-house|хаус]]: The Songstress, продюсеры Керри Чандлер и Джером Сайденхэм; потом Masters At Work делают ремикс самой записи Симон для клубов."
      - {id: listen, role: note, draft: true, en: "Listen for the refrain turned into a loop over the kick drum.", ru: "Слушайте, как припев становится петлёй над бочкой."}

  - id: feist
    kind: stop
    nodes: [feist-sealion-2007]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "2007", ru: "2007"}
      - id: text
        role: text
        draft: true
        en: "Feist found the field recording on a compilation and called her version “a half cover of the little girls”. Nina Simone is her second name for it."
        ru: "Feist нашла полевую запись на сборнике и назвала свою версию «наполовину кавером на тех девочек». Нина Симон для неё — второе имя."
      - id: chorus
        role: text
        draft: true
        en: "The clapping, singing chorus around her is the circle’s answer of 1939, come back as an arrangement."
        ru: "Хлопающий и поющий хор вокруг неё — тот же ответ круга 1939 года, вернувшийся в виде аранжировки."
      - {id: listen, role: note, draft: true, en: "Listen for the group answering her line by line.", ru: "Слушайте, как группа отвечает ей строка за строкой."}

  - id: kanye
    kind: stop
    nodes: [kanye-bad-news-2008]
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "2008", ru: "2008"}
      - id: text
        role: text
        draft: true
        en: "Kanye West, “Bad News”. The sample is licensed, and the booklet says it “contains a sample of the recording ‘See Line Woman’ as performed by Nina Simone”, written by George Bass."
        ru: "Канье Уэст, «Bad News». Сэмпл лицензирован, и в буклете сказано, что трек «contains a sample of the recording ‘See Line Woman’ as performed by Nina Simone», а автор — George Bass."
      - {id: again, role: line, draft: true, en: "Someone else’s name again, now in 2008.", ru: "Снова чужое имя, теперь в 2008 году."}

  - id: massive
    kind: flashes
