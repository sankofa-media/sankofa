        ru: На экране
      - id: text
        role: text
        draft: false
        en: "The song also found its way to the screen: into films, series and a video game. Scroll along the film strip to see where it sounded, year by year."
        ru: "Песня попала и на экран: в фильмы, сериалы и видеоигру. Прокрутите киноленту, чтобы увидеть, где она звучала, год за годом."

  - id: silence
    kind: silence
    blocks:
      - id: stop
        role: line
        draft: false
        en: Now the river stops, and the clap falls silent.
        ru: Здесь река останавливается, и хлопок затихает.
      - id: film
        role: text
        draft: false
        en: "In 1999 the Hollywood film “The General’s Daughter” opened with the 1939 recording: the voices of Christine and Katherine Shipp themselves."
        ru: В 1999 году голливудский фильм «Дочь генерала» открылся записью 1939 года — голосами самих Кристин и Кэтрин Шипп.
      - id: never-heard
        role: text
        draft: false
        en: Neither sister heard it. By then both had long been dead. Of everyone who sang at Nichols Chapel that day in 1939, only their brother Isaac was still alive.
        ru: "Ни одна из сестёр этого не услышала: обеих к тому времени давно не было в живых. Из всех, кто пел в тот день 1939 года в Николс-Чепел, оставался только их брат Айзек."
      - id: isaac-africa
        role: text
        draft: false
        en: Isaac had once sailed to Africa as a hand on a cargo ship and learned songs there too.
        ru: Айзек когда-то ходил в Африку матросом на грузовом судне и выучил песни и там.

  - id: classroom
    kind: classroom
    art:
      generated: true
      layers:
        - { file: classroom-room.webp, depth: 4, alt: { en: "A school music room, seen from its doorway", ru: "Музыкальный класс в школе, вид из дверей" } }
        - { file: classroom-children.webp, depth: 9, role: figure, pivot: "50 80", fit: { x: -2.5 }, alt: { en: "Children standing in a circle, clapping", ru: "Дети стоят в кругу и хлопают" } }
        - { file: classroom-teacher.webp, depth: 13, role: figure, pivot: "86 88", fit: { x: 3.19, y: 1.63, scale: 0.96 }, alt: { en: "Their teacher keeps the beat beside a small speaker", ru: "Учительница отбивает ритм рядом с небольшой колонкой" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The classroom
        ru: Класс
      - id: text
        role: text
        draft: false
        en: Today music teachers in American schools teach this song by the Kodály and Orff methods. So that the children can hear where it came from, they play them the recording Christine and Katherine made in 1939.
        ru: Сегодня учителя музыки в американских школах разучивают эту песню по методикам Кодаи и Орфа. Чтобы дети услышали, откуда она взялась, им ставят ту самую запись, которую Кристин и Кэтрин сделали в 1939 году.
      - id: ring
        role: line
        draft: false
        en: The children stand in a circle, and the circle claps again.
        ru: Дети встают в круг, и круг снова начинает хлопать.

  - id: finale
    kind: finale
    # The same house: its door opens as the story closes.
