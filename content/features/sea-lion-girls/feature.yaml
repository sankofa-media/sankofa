  - id: silence
    kind: silence
    blocks:
      - {id: stop, role: line, draft: true, en: "The river stops. The clap goes quiet.", ru: "Река останавливается. Хлопок затихает."}
      - id: isaac-1998
        role: text
        draft: true
        hold: true
        check: "One source (NPR 1998): by 1998 Isaac was the only one of the 1939 session still alive."
        en: "By 1998 only Isaac was still alive of those who recorded in 1939."
        ru: "В 1998 году из участников той записи 1939 года в живых оставался только Айзек."
      - {id: film, role: text, draft: true, en: "In 1999 the sisters’ voices opened a Hollywood film.", ru: "В 1999 году голоса сестёр открыли голливудский фильм."}
      - id: never-heard
        role: text
        draft: true
        hold: true
        check: "An inference from one source: neither sister lived to hear it."
        en: "As far as we could find, neither of them lived to hear it."
        ru: "По всему, что удалось найти, ни одна из них этого уже не услышала."
      - id: isaac-africa
        role: text
        draft: true
        hold: true
        check: "Isaac's voyage has two sources; his death in 2007 has one (a review quoting Wade)."
        en: "In 1935 Isaac had sailed on a freighter to Africa and learned songs there; he died in 2007."
        ru: "Айзек в 1935 году уходил на грузовом судне в Африку и выучил там песни; он умер в 2007 году."

  - id: classroom
    kind: classroom
    blocks:
      - {id: kicker, role: kicker, draft: true, en: "The classroom", ru: "Класс"}
      - id: text
        role: text
        draft: true
        en: "Music teachers in American schools teach the song by the Kodály and Orff methods. So that the children hear the original, they play them the 1939 recording."
        ru: "Учителя музыки в американских школах разучивают песню по методикам Кодаи и Орфа. Чтобы дети услышали оригинал, они ставят им ту самую запись 1939 года."
      - {id: ring, role: line, draft: true, en: "The children stand in a circle, and the circle claps again.", ru: "Дети встают в круг, и круг снова начинает хлопать."}

  - id: finale
    kind: finale
    nodes: [shipp-1939]
    blocks:
      - id: together
        role: text
        draft: true
        en: "Your claps from the whole evening, the children’s claps and the 1939 recording sound together. The circle closes."
        ru: "Вместе звучат хлопки, которые вы оставляли на круге весь вечер, хлопки детей и запись 1939 года. Круг замыкается."
      - {id: credit-1, role: quote, draft: true, en: "A folk ring game.", ru: "Народная игра в круг."}
      - {id: credit-2, role: quote, draft: true, en: "Sung by Christine and Katherine Shipp.", ru: "Пели Кристин и Кэтрин Шипп."}
      - {id: credit-3, role: quote, draft: true, en: "Byhalia, Mississippi, May 13, 1939.", ru: "Байхейлия, Миссисипи, 13 мая 1939 года."}
      - {id: last, role: line, draft: true, en: "The whole world knows the song. Now you know their names.", ru: "Песню знает весь мир. Теперь вы знаете их имена."}
