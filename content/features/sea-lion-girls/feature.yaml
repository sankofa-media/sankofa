        en: "By then the sisters had long been dead. Of everyone who sang at Nichols Chapel that day, only their brother Isaac was still alive."
        ru: "Сестёр к тому времени давно не было в живых. Из всех, кто пел в тот день в Николс-Чепел, оставался только их брат Айзек."
