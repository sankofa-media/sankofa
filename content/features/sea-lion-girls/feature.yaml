        en: "1942"
        ru: "1942"
      - id: album
        role: text
        draft: false
        en: "Three years later the Shipp sisters’ minute came out on disc. In 1942 the Library of Congress issued a set of 78-rpm records called “Afro-American Blues and Game Songs”, and their recording was in it."
        ru: "Через три года запись сестёр Шипп вышла на пластинке. В 1942 году Библиотека Конгресса выпустила комплект дисков на 78 оборотов «Afro-American Blues and Game Songs» («Афроамериканские блюзы и песни-игры»), и в него вошла их минута."
      - id: muddy
        role: text
        draft: false
        en: The same set holds the first recordings of a young man from the Mississippi Delta named McKinley Morganfield. Very soon the world would know him as Muddy Waters.
        ru: В том же комплекте — первые записи молодого человека из Дельты Миссисипи по имени Маккинли Морганфилд. Совсем скоро мир узнает его как Мадди Уотерса.
      - id: paris
        role: text
        draft: false
        en: By 1948 a copy of the album had crossed the Atlantic to the Musée de l’Homme in Paris. The Shipp sisters’ voices had travelled further than the sisters themselves would ever go from home.
        ru: "К 1948 году один экземпляр этого альбома пересёк Атлантику и попал в Музей человека в Париже. Голоса сестёр Шипп уехали от дома дальше, чем когда-либо уезжали они сами."
