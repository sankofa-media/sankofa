        en: "The drums on the album are credited to Jerry Fuchs, who died in Brooklyn on November 8, 2009, three months before “Heligoland” came out."
        ru: "Барабаны на альбоме записаны за Джерри Фуксом, который погиб в Бруклине 8 ноября 2009 года, за три месяца до выхода «Heligoland»."
