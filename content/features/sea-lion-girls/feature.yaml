      - { work: "Heated Rivalry (Crave/HBO Max), episode 1 'Rookies'", node: feist-sealion-2007, caption: { en: "Jacob Tierney, creator of the series “Heated Rivalry” (2025), used Feist’s “Sealion” in its first episode: the song, he said, had “the right nervous energy” for the scene. He was not sure the show could pay for the rights, but took it all the same.", ru: "Джейкоб Тирни, создатель сериала «Heated Rivalry» (2025), поставил «Sealion» Feist в первую серию: по его словам, у песни была «та самая нервная энергия», которая нужна сцене. Он сомневался, хватит ли у сериала денег на права, но песню всё же взял." } }
