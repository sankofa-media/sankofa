        en: 13 May 1939
        ru: 13 мая 1939 года
      - id: opened
        role: text
        draft: false
        en: "On the thirteenth of May Halpert and Ferriss knocked at the house of John Shipp and his wife, Luella. The couple opened the door to two strangers. The visitors had come not for them, though, but for the singers of the family: John’s mother, Mary Shipp, and her children."
        ru: "Тринадцатого мая Халперт и Феррис постучали в дом Джона Шиппа и его жены Луэллы. Хозяева открыли дверь двум незнакомцам. Приехали те, впрочем, не к ним, а к певцам этой семьи — к матери Джона, Мэри Шипп, и её детям."

