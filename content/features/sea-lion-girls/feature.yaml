        en: "Massive Attack, “Paradise Circus”. At 1:49, 2:37 and 3:21 Nina Simone’s claps sound under the song; comparing the two recordings, we found them there. From each one the ink runs back, to 1964 and then to 1939."
        ru: "Massive Attack, «Paradise Circus». На 1:49, 2:37 и 3:21 под песней звучат хлопки Нины Симон — мы нашли их, сравнив две записи. От каждой вспышки тушь тянется назад: к 1964 году, потом к 1939-му."
      - id: on
        role: text
        draft: true
        en: "The branch goes on to Gui Boratto’s remix, to Burial’s twelve-minute rework and to the opening titles of “Luther”."
        ru: "Дальше ветвь идёт к ремиксу Gui Boratto, к двенадцатиминутной переработке Burial и к заставке сериала «Лютер»."
      - id: fuchs
