scenes:
  - id: door
    kind: door
    art: &door-art
      generated: true
      layers:
        - { file: door-house.webp, depth: 6, alt: { en: "A small wooden house in rural Mississippi, spring 1939", ru: "Небольшой деревянный дом в сельском Миссисипи, весна 1939 года" } }
        - { file: door-porch.webp, depth: 10, state: closed, alt: { en: "Its porch, the front door closed", ru: "Крыльцо, входная дверь закрыта" } }
        - { file: door-porch-open.webp, depth: 10, state: open, alt: { en: "Its porch, the front door ajar", ru: "Крыльцо, входная дверь приоткрыта" } }
        - { file: door-light.webp, depth: 10, state: open, alt: "" }
        - { file: door-tree.webp, depth: 18, alt: "" }
    blocks:
      - { id: when, role: kicker, draft: true, en: "May 13, 1939. Byhalia, Mississippi", ru: "13 мая 1939 года. Байхейлия, Миссисипи" }
      - id: why-knock
        role: note
        draft: false
        en: "A browser will not let a sound begin until someone does something. So the sound of this story begins with your knock, the way it began for the Shipps with a knock at their door."
        ru: "Браузер не даёт звуку начаться, пока человек сам чего-нибудь не сделает. Поэтому звук этой истории начинается с вашего стука — так же, как для Шиппов он начался со стука в дверь."
      - { id: opened, role: line, draft: false, en: "Luella and John Shipp open the door to strangers.", ru: "Луэлла и Джон Шипп открывают дверь незнакомцам." }

  - id: ring
    kind: ring
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "Before 1939", ru: "До 1939 года" }
      - { id: title, role: title, draft: true, en: "A game in a circle", ru: "Игра в круг" }
      - id: form
        role: text
        draft: false
        en: "Long before anyone recorded them, African American children played singing games in a ring or in a line. One voice leads, the group answers, the refrain comes round again and again, and hands and feet keep the second and fourth beats."
        ru: "Задолго до того, как их кто-нибудь записал, афроамериканские дети играли в игры с пением — в кругу или в линию. Один голос ведёт, круг отвечает, припев возвращается снова и снова, а ладони и ноги держат вторую и четвёртую доли."
      - id: book
        role: text
        draft: false
        en: "Bessie Jones and Bess Lomax Hawes gathered such games in “Step It Down” (1972). In their book the clapping of the group is called the real music of the game."
        ru: "Бесси Джонс и Бесс Ломакс Хоуз собрали такие игры в книге «Step It Down» (1972). Хлопки круга там названы настоящей музыкой игры."
      - id: no-roots
        role: text
        draft: false
        en: "The call and the answer tie the form to African musical practice. Where this one song came from before 1939, no source says, and we will not guess."
        ru: "Вопрос и ответ роднят эту форму с африканской музыкальной практикой. Откуда пришла именно эта песня до 1939 года, не говорит ни один источник, и гадать мы не будем."
      - { id: hear, role: caption, draft: true, en: "This is the clap, for now without a tune.", ru: "Это хлопок — пока без мелодии." }

  - id: expedition
    kind: expedition
    art:
      generated: true
      layers:
        - { file: expedition-road.webp, depth: 4, alt: { en: "A dirt road through low fields", ru: "Грунтовая дорога среди низких полей" } }
        - { file: expedition-ambulance.webp, depth: 10, alt: { en: "An old army ambulance turned into a recording studio on wheels", ru: "Старая армейская санитарная машина, превращённая в студию на колёсах" } }
        - file: expedition-machine.webp
          depth: 10
          open: "0.12 0.4"
          pivot: "63.3 59.4"
          fit: { x: 7.04, y: 0, scale: 0.73 }
          alt: { en: "Its back doors open on a machine that cuts sound onto discs", ru: "Задние двери открыты, внутри аппарат, режущий звук на диски" }
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "The expedition", ru: "Экспедиция" }
      - id: why
        role: text
        draft: false
        en: "In the 1930s the Library of Congress sent collectors with recording machines across the South, and the Federal Writers’ Project helped them find singers."
        ru: "В 1930-е годы Библиотека Конгресса отправляла собирателей с записывающими аппаратами по Югу, а Федеральный писательский проект помогал им находить певцов."
      - id: halpert
        role: text
        draft: false
        en: "In 1939 it was the folklorist Herbert Halpert’s turn. He travelled in an old army ambulance turned into a recording studio on wheels, with a machine that cut the sound straight onto discs. In Mississippi his guide was Abbott Ferriss of the Writers’ Project, who took notes and photographs."
        ru: "В 1939 году настала очередь фольклориста Герберта Халперта. Он ездил на списанной армейской санитарной машине, превращённой в студию на колёсах: аппарат в ней резал звук прямо на диски. В Миссисипи его проводником был Эббот Феррис из Писательского проекта — он вёл записи и фотографировал."
      - { id: byhalia, role: label, draft: true, en: "Byhalia", ru: "Байхейлия" }

  - id: family
    kind: family
    figures:
      - { id: mary, name: { en: "Mary Shipp", ru: "Мэри Шипп" }, age: 47, role: { en: "John’s mother", ru: "мать Джона" } }
      - { id: isaac, name: { en: "Isaac", ru: "Айзек" }, age: 23 }
      - { id: allison, name: { en: "Allison", ru: "Эллисон" }, age: 15 }
      - { id: christine, name: { en: "Christine", ru: "Кристин" }, age: 20, lead: true }
      - { id: katherine, name: { en: "Katherine", ru: "Кэтрин" }, age: 18, lead: true }
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "The family", ru: "Семья" }
      - id: who
        role: text
        draft: false
        en: "Halpert had come for John’s mother, Mary, and her children. They sang for him at the family’s church, Nichols Chapel."
        ru: "Халперт приехал за матерью Джона, Мэри, и её детьми. Пели они ему в церкви семьи, Николс-Чепел."
      - id: by-ear
        role: text
        draft: true
        hold: true
        check: "One source (NPR 1998): the Shipps learned all their songs by ear."
        en: "The Shipps knew their songs by ear."
        ru: "Песни Шиппы знали на слух."
      - { id: step, role: line, draft: false, en: "Christine and Katherine step forward.", ru: "Вперёд выходят Кристин и Кэтрин." }

  - id: minute
    kind: minute
    nodes: [ shipp-1939 ]
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "The minute", ru: "Минута" }
      - id: listen
        role: text
        draft: false
        en: "The Library of Congress keeps the recording: about a minute, two voices, no instruments."
        ru: "Запись хранит Библиотека Конгресса: около минуты, два голоса, ни одного инструмента."
      - id: game
        role: text
        draft: false
        en: "It is a ring game. One sister leads, the other answers, as a circle of children would. Nobody wrote it down for them; it came to them the way such games come, from other children."
        ru: "Это игра в круг. Одна сестра ведёт, другая отвечает — как ответил бы круг детей. Никто не записывал её для них: она пришла к ним так, как приходят такие игры, — от других детей."
      - id: yours
        role: caption
        draft: false
        en: "Clap with them. Every clap stays on the circle as a drop of ink, and the circle stays with you to the end."
        ru: "Хлопайте вместе с ними. Каждый хлопок останется на круге каплей туши, а круг останется с вами до конца."

  - id: album
    kind: album
    art:
      generated: true
      layers:
        - { file: album-table.webp, depth: 3, alt: "" }
        - { file: album-sleeves.webp, depth: 8, alt: { en: "An open album of 78-rpm records, its sleeves fanned out", ru: "Раскрытый альбом пластинок на 78 оборотов, конверты веером" } }
        - file: album-disc.webp
          depth: 12
          role: spin
          spin: { x: 57.4, y: 69.19, ratio: 0.52, tilt: -5, face: [ 57.17, 71.4, 26.4, 19.9 ] }
          alt: { en: "One shellac disc with a blank red label", ru: "Шеллачная пластинка с пустой красной наклейкой" }
    nodes: [ afs-l4-1942 ]
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "1942", ru: "1942" }
      - id: album
        role: text
        draft: false
        en: "In 1942 the Library of Congress put their minute on a set of 78-rpm discs: “Afro-American Blues and Game Songs”, Album IV."
        ru: "В 1942 году Библиотека Конгресса выпустила их минуту на комплекте пластинок на 78 оборотов: «Afro-American Blues and Game Songs», Album IV."
      - id: muddy
        role: text
        draft: false
        en: "On the same album are the first recordings of a young man from the Delta, McKinley Morganfield. The world would know him as Muddy Waters."
        ru: "На том же альбоме — первые записи молодого человека из Дельты, Маккинли Морганфилда. Мир узнает его как Мадди Уотерса."
      - id: paris
        role: text
        draft: false
        en: "By 1948 a copy had crossed the Atlantic to the Musée de l’Homme in Paris. Two young women from Byhalia were already further from home than they would ever travel."
        ru: "К 1948 году экземпляр пересёк Атлантику и оказался в Музее человека в Париже. Голоса двух девушек из Байхейлии ушли дальше, чем когда-либо уезжали они сами."
      - { id: label-paris, role: label, draft: true, en: "Paris", ru: "Париж" }
      - { id: label-washington, role: label, draft: true, en: "Washington", ru: "Вашингтон" }

  - id: simone
    kind: simone
    nodes: [ simone-1964 ]
    photo: simone-1965
    art:
      generated: true
      layers:
        - { file: piano-stage.webp, depth: 3, alt: "" }
        - { file: piano-grand.webp, depth: 8, alt: { en: "A grand piano on a dark stage", ru: "Рояль на тёмной сцене" } }
        - { file: piano-figure.webp, depth: 12, role: figure, pivot: "34 88", alt: { en: "A woman at the piano, upright, her hands on the keys", ru: "Женщина за роялем, прямая, руки на клавишах" } }
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "1964", ru: "1964" }
      - id: version
        role: text
        draft: false
        en: "In 1964 Nina Simone recorded the song as “See-Line Woman” for the album “Broadway-Blues-Ballads”."
        ru: "В 1964 году Нина Симон записала песню как «See-Line Woman» для альбома «Broadway-Blues-Ballads»."
      - id: arrangement
        role: text
        draft: false
        en: "The arrangement is credited to her. She changed the spelling of the title, and the game became a concert piece."
        ru: "Аранжировка записана за ней. Она изменила написание названия, и игра стала концертной вещью."
      - id: bach
        role: text
        draft: false
        en: "She had trained as a classical pianist on Bach, studied at Juilliard and been turned away by the Curtis Institute. A children’s game from a Mississippi churchyard went into her hands."
        ru: "Она училась на классическую пианистку, на Бахе, занималась в Джульярде, и её не приняли в Кёртисовский институт. Детская игра с церковного двора в Миссисипи попала в эти руки."

  - id: single
    kind: single
    nodes: [ simone-single-1964 ]
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "July 1964", ru: "Июль 1964" }
      - id: two-sides
        role: text
        draft: false
        en: "In July 1964 a single came out. Side A: [[mississippi-goddam|“Mississippi Goddam”]]. Turn it over."
        ru: "В июле 1964 года вышел сингл. Сторона A — [[mississippi-goddam|«Mississippi Goddam»]]. Переверните его."
      - id: side-b
        role: text
        draft: false
        en: "Side B: “Sea Lion Woman”, in the folk spelling. One record carried a cry about Mississippi on one side and a game of two young women from Mississippi on the other."
        ru: "Сторона B — «Sea Lion Woman», в народном написании. На одной стороне пластинки — крик о Миссисипи, на другой — игра двух девушек из Миссисипи."
      - id: goddam
        role: text
        draft: false
        en: "Simone wrote it after the murder of Medgar Evers in Mississippi and the bombing of a Birmingham church in 1963."
        ru: "Симон написала её после убийства Медгара Эверса в Миссисипи и взрыва церкви в Бирмингеме в 1963 году."
      - { id: label-a, role: label, draft: true, en: "Mississippi Goddam", ru: "Mississippi Goddam" }
      - { id: label-b, role: label, draft: true, en: "Sea Lion Woman", ru: "Sea Lion Woman" }
      - { id: credit, role: label, draft: true, en: "Written by George Houston Bass", ru: "Written by George Houston Bass" }
      - { id: names, role: label, draft: true, en: "Christine and Katherine Shipp", ru: "Кристин и Кэтрин Шипп" }
      - id: name
        role: caption
        draft: false
        en: "The label names one writer. Under it, the names of the two who sang the song in 1939 run in the ink."
        ru: "Этикетка называет одного автора. Под ней расплываются в туши имена тех двоих, кто спел песню в 1939 году."

  - id: bass
    kind: text
    blocks:
      - { id: kicker, role: kicker, draft: true, en: "The man on the label", ru: "Человек на этикетке" }
      - id: who
        role: text
        draft: false
        en: "George Houston Bass was Langston Hughes’s secretary and literary assistant from 1959 to 1964. Later he founded the Rites and Reason theatre at Brown University. He died in Providence in 1990."
        ru: "Джордж Хьюстон Басс был секретарём и литературным помощником Ленгстона Хьюза с 1959 по 1964 год. Потом он основал театр Rites and Reason в Брауновском университете. Умер в Провиденсе в 1990 году."
      - id: system
        role: text
        draft: false
        en: "Bass registered the copyright. From then on, the writer’s line on every record of the song carried his name, and not theirs."
        ru: "Басс зарегистрировал авторское право. С тех пор в строке об авторе на каждой пластинке с этой песней стояло его имя — не их."
      - id: route
        role: text
        draft: false
        en: "It was Hughes who brought the song to Simone: he wrote to her that “See-Line Woman” was particularly suited to her. In 1965 he wrote to a friend about “my former secretary’s SEA LION WOMAN”, which she was singing at every concert."
        ru: "Песню Симон предложил Хьюз: он написал ей, что «See-Line Woman» подходит ей особенно. В 1965 году он писал другу о «SEA LION WOMAN моего бывшего секретаря», которую она пела на каждом концерте."

