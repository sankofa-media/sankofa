          spin: { x: 57.4, y: 69.19, ratio: 0.52, tilt: -5, face: [ 57.17, 71.4, 26.4, 19.9 ] }
          alt: { en: "One shellac disc with a blank red label", ru: "Шеллачная пластинка с пустой красной наклейкой" }
    nodes: [ afs-l4-1942 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "1942"
        ru: "1942"
      - id: album
        role: text
        draft: false
        en: Three years later the sisters’ minute came out on record. In 1942 the Library of Congress released a set of 78-rpm discs, “Afro-American Blues and Game Songs”, and Christine and Katherine were on it.
        ru: Через три года минута сестёр вышла на пластинке. В 1942 году Библиотека Конгресса выпустила комплект дисков на 78 оборотов «Afro-American Blues and Game Songs», и Кристин с Кэтрин были в нём.
      - id: muddy
        role: text
        draft: false
        en: On the same set are the first recordings of a young man from the Mississippi Delta, McKinley Morganfield. The world would soon know him as Muddy Waters.
        ru: В том же комплекте — первые записи молодого человека из Дельты Миссисипи, Маккинли Морганфилда. Скоро мир узнает его как Мадди Уотерса.
      - id: paris
        role: text
        draft: false
        en: By 1948 a copy had crossed the Atlantic to the Musée de l’Homme in Paris. The sisters’ voices had gone further than the sisters themselves would ever travel.
        ru: К 1948 году один экземпляр пересёк Атлантику и попал в Музей человека в Париже. Голоса сестёр ушли дальше, чем когда-либо уезжали они сами.
      - id: label-paris
        role: label
        draft: false
        en: Paris
        ru: Париж
      - id: label-washington
        role: label
        draft: false
        en: Washington
        ru: Вашингтон

  - id: simone
    kind: simone
    nodes: [ simone-1964 ]
    photo: simone-1965
    art:
      generated: true
      layers:
        - { file: piano-stage.webp, depth: 3, alt: "" }
        - { file: piano-grand.webp, depth: 8, alt: { en: "A grand piano on a dark stage", ru: "Рояль на тёмной сцене" } }
        - { file: piano-figure.webp, depth: 12, role: figure, pivot: "34 88", alt: { en: "A woman at the piano, upright, her hands on the keys", ru: "Женщина за роялем, прямая, руки на клавишах" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "1964"
        ru: "1964"
      - id: route
        role: text
        draft: false
        en: The song reached Nina Simone through the poet Langston Hughes. His secretary, George Houston Bass, had come across it, and Hughes wrote to Simone that “See-Line Woman” suited her particularly well.
        ru: До Нины Симон песня дошла через поэта Ленгстона Хьюза. На неё наткнулся его секретарь Джордж Хьюстон Басс, а Хьюз написал Симон, что «See-Line Woman» подходит ей особенно.
      - id: version
        role: text
        draft: false
        en: "In 1964 Simone recorded the song for her album “Broadway-Blues-Ballads”. She spelt the title her own way, as “See-Line Woman”, and the arrangement is credited to her: the playground game became a concert piece."
        ru: "В 1964 году Симон записала песню для альбома «Broadway-Blues-Ballads». Название она написала по-своему, «See-Line Woman», а аранжировка записана за ней: игра со школьного двора стала концертной вещью."
      - id: bach
        role: text
        draft: false
        en: Simone had trained to be a classical pianist on Bach and studied at Juilliard, but the Curtis Institute turned her down. So a children’s game from a Mississippi churchyard came into the hands of a pianist schooled on Bach.
        ru: Симон готовилась стать классической пианисткой, играла Баха и занималась в Джульярдской школе, но в Кёртисовский институт её не приняли. Так детская игра с церковного двора в Миссисипи оказалась в руках пианистки, выученной на Бахе.

  - id: single
    kind: single
    nodes: [ simone-single-1964 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: July 1964
        ru: Июль 1964
      - id: two-sides
        role: text
        draft: false
        en: In July 1964 the song came out on a single. On side A was “Mississippi Goddam”. Press “Turn the record over” to see what was on the other side.
        ru: В июле 1964 года песня вышла на сингле. На стороне A была «Mississippi Goddam». Нажмите «Перевернуть пластинку», чтобы увидеть, что было на другой стороне.
      - id: goddam
        role: text
        draft: false
        en: Simone wrote “Mississippi Goddam” in 1963, after Medgar Evers was murdered in Mississippi and a church was bombed in Birmingham, Alabama.
        ru: «Mississippi Goddam» Симон написала в 1963 году, после того как в Миссисипи убили Медгара Эверса, а в Бирмингеме, штат Алабама, взорвали церковь.
      - id: side-b
        role: text
        draft: false
        en: Side B was “Sea Lion Woman”, in the old folk spelling. So one record carried an angry protest about Mississippi on one side and a game sung by two young women from Mississippi on the other.
        ru: На стороне B была «Sea Lion Woman», в старом народном написании. Так на одной пластинке оказались гневный протест против того, что творилось в Миссисипи, и игра, которую пели две девушки из Миссисипи.
      - id: label-a
        role: label
        draft: false
        en: Mississippi Goddam
        ru: Mississippi Goddam
      - id: label-b
        role: label
        draft: false
        en: Sea Lion Woman
        ru: Sea Lion Woman
      - id: credit
        role: label
        draft: false
        en: Written by George Houston Bass
        ru: Written by George Houston Bass
      - id: names
        role: label
        draft: false
        en: Christine and Katherine Shipp
        ru: Кристин и Кэтрин Шипп
      - id: name
        role: caption
        draft: false
        en: "Look at the label: it names one writer, George Houston Bass. The names of Christine and Katherine Shipp, who sang the song in 1939, are not there; under the label they run in the ink."
        ru: "Посмотрите на этикетку: на ней один автор — Джордж Хьюстон Басс. Имён Кристин и Кэтрин Шипп, которые спели эту песню в 1939 году, там нет: под этикеткой они расплываются в туши."

  - id: bass
    kind: text
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The man on the label
        ru: Человек на этикетке
      - id: who
        role: text
        draft: false
        en: George Houston Bass was Langston Hughes’s secretary and literary assistant from 1959 to 1964. Later he founded the Rites and Reason theatre at Brown University, and he died in Providence in 1990.
        ru: Джордж Хьюстон Басс был секретарём и литературным помощником Ленгстона Хьюза с 1959 по 1964 год. Позже он основал театр Rites and Reason в Брауновском университете и умер в Провиденсе в 1990 году.
      - id: system
        role: text
        draft: false
        en: Bass registered the copyright in the song. From then on, wherever a record named the writer, it named him, and never Christine and Katherine Shipp. In 1965 Hughes himself wrote to a friend about “my former secretary’s SEA LION WOMAN”, which Simone was singing at every concert.
        ru: Басс зарегистрировал на песню авторское право. С тех пор везде, где на пластинке указан автор, стоит его имя, и ни разу — имена Кристин и Кэтрин Шипп. В 1965 году Хьюз сам писал другу о «SEA LION WOMAN моего бывшего секретаря», которую Симон пела на каждом концерте.

  - id: river
    kind: river
    art:
      generated: true
      aspect: "1 / 3"
      layers:
        - { file: river-ink.webp, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The river
        ru: Река
      - id: intro
        role: text
        draft: false
        en: "After 1964 the song began to branch. Below is its family tree, drawn as a river: every version is a circle with its year, and the lines show who took the song from whom. Press a circle to hear that version, where an official recording exists."
        ru: "После 1964 года песня начала ветвиться. Ниже — её родословная, нарисованная как река: каждая версия — кружок с годом, а линии показывают, кто у кого взял песню. Нажмите на кружок, чтобы послушать эту версию, если у неё есть официальная запись."
      - id: branches
        role: text
        draft: false
        en: "Two branches run side by side. On one are those who went back to the 1939 recording and took the sisters’ voices and the circle’s answer. On the other are those who took Nina Simone’s version: her title, her arrangement or her actual recording."
        ru: "Две ветви идут рядом. На одной — те, кто вернулся к записи 1939 года и взял голоса сестёр Шипп и ответ круга. На другой — те, кто взял версию Нины Симон: её название, её аранжировку или саму её запись."

  - id: jazz
    kind: stop
    nodes: [ lateef-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · jazz
        ru: 1967 · джаз
      - id: text
        role: text
        draft: false
        en: In 1967 the saxophonist Yusef Lateef recorded the song in New York, and the playground game became a piece of jazz.
        ru: В 1967 году саксофонист Юсеф Латиф записал песню в Нью-Йорке, и игра со школьного двора стала джазовой пьесой.
      - id: listen
        role: note
        draft: false
        en: "Listen to the tambourine: it keeps the old clap of the circle."
        ru: "Послушайте бубен: он держит старый хлопок круга."

  - id: beat
    kind: stop
    nodes: [ easybeats-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · beat
        ru: 1967 · бит
      - id: text
        role: text
        draft: false
        en: "The same year the song reached the other side of the world: the Australian beat group The Easybeats recorded it in an arrangement by their guitarists Harry Vanda and George Young."
        ru: "В том же году песня добралась до другого края света: австралийская бит-группа The Easybeats записала её в аранжировке своих гитаристов Гарри Ванды и Джорджа Янга."

  - id: house
    kind: stop
    nodes: [ songstress-1997, maw-remix-2002 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1997 → 2002 · house
        ru: 1997 → 2002 · хаус
      - id: text
        role: text
        draft: false
        en: Thirty years later the song came to the dance floors of New York house. In 1997 the producers Kerri Chandler and Jerome Sydenham released it as The Songstress, and in 2002 Masters At Work remixed Nina Simone’s own recording for the clubs.
        ru: Через тридцать лет песня попала на танцполы нью-йоркского хауса. В 1997 году продюсеры Керри Чандлер и Джером Сайденхэм выпустили её под именем The Songstress, а в 2002 году Masters At Work сделали для клубов ремикс самой записи Нины Симон.
      - id: listen
        role: note
        draft: false
        en: Listen to how the refrain becomes a loop over the kick drum.
        ru: Послушайте, как припев превращается в петлю над бас-барабаном.

  - id: feist
    kind: stop
    nodes: [ feist-sealion-2007 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2007"
        ru: "2007"
      - id: text
        role: text
        draft: false
        en: The Canadian singer Feist went past Nina Simone, straight back to the sisters. She found the 1939 field recording on a compilation and called her version “kind of a half cover of the little girls”, naming Simone’s famous version only second.
        ru: Канадская певица Feist прошла мимо Нины Симон прямо к сёстрам Шипп. Она нашла полевую запись 1939 года на сборнике и назвала свою версию «наполовину кавером на тех девочек», а знаменитую версию Симон упомянула лишь второй.
      - id: chorus
        role: text
        draft: false
        en: The clapping, chanting chorus around her on the record is the circle’s answer of 1939, come back as an arrangement.
        ru: Хлопающий и поющий хор вокруг неё на записи — это ответ круга 1939 года, вернувшийся в виде аранжировки.
      - id: listen
        role: note
        draft: false
        en: Listen to the group answering her line by line.
        ru: Послушайте, как хор отвечает ей строка за строкой.

  - id: kanye
    kind: stop
    nodes: [ kanye-bad-news-2008 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2008"
        ru: "2008"
      - id: text
        role: text
        draft: false
        en: "In 2008 Kanye West built his song “Bad News” on a sample of Nina Simone’s recording. The sample was licensed, and the album booklet says so: the track contains a sample of “See Line Woman” as performed by Nina Simone, written by George Bass."
        ru: "В 2008 году Канье Уэст построил свою песню «Bad News» на сэмпле из записи Нины Симон. Сэмпл был лицензирован, и в буклете альбома так и написано: трек содержит сэмпл «See Line Woman» в исполнении Нины Симон, автор — Джордж Басс."
      - id: again
        role: line
        draft: false
        en: Once again the writer’s line carries a single name, and it is not the name of either sister.
        ru: И снова в строке об авторе одно имя, и это не имя ни одной из сестёр.

  - id: massive
    kind: flashes
    nodes: [ paradise-circus-2010, gui-boratto-2010, post-ghostpoet-2023 ]
    threads: [ simone-1964, shipp-1939 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2010"
        ru: "2010"
      - id: text
        role: text
        draft: false
        en: "In 2010 the Bristol band Massive Attack released “Paradise Circus”. Through the whole song runs the clap from Nina Simone’s “See-Line Woman”. While the track plays, a line of ink pulses with that clap and runs back along the river: to Simone’s record of 1964, and from it to the sisters’ minute of 1939."
        ru: "В 2010 году бристольская группа Massive Attack выпустила «Paradise Circus». Через всю песню проходит хлопок из «See-Line Woman» Нины Симон. Пока трек звучит, линия туши пульсирует в такт этому хлопку и тянется назад по реке — к пластинке Симон 1964 года, а от неё к минуте сестёр Шипп 1939 года."
      - id: on
        role: text
        draft: false
        en: "From “Paradise Circus” the branch went on: the Brazilian producer Gui Boratto remixed it, the London producer Burial reworked it into a twelve-minute piece, and the track became the opening theme of the BBC series “Luther”."
        ru: "От «Paradise Circus» ветвь пошла дальше: бразильский продюсер Gui Boratto сделал на неё ремикс, лондонский продюсер Burial превратил её в двенадцатиминутную пьесу, а сам трек стал музыкой к заставке сериала BBC «Лютер»."
      - id: fuchs
        role: note
        draft: false
        en: The drums on the album are credited to Jerry Fuchs. He died in Brooklyn on 8 November 2009, three months before the album came out.
        ru: Барабаны на альбоме записаны за Джерри Фуксом. Он погиб в Бруклине 8 ноября 2009 года, за три месяца до выхода альбома.
      - id: label-1964
        role: label
        draft: false
        en: "1964"
        ru: "1964"
      - id: label-1939
        role: label
        draft: false
        en: "1939"
        ru: "1939"

  - id: burial
    kind: stop
    nodes: [ burial-2011 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2011"
        ru: "2011"
      - id: text
        role: text
        draft: false
        en: In Burial’s twelve-minute rework of “Paradise Circus” the song thins out almost to a shadow, but the clap is still there.
        ru: В двенадцатиминутной переработке «Paradise Circus», которую сделал Burial, песня истончается почти до тени, но хлопок в ней остаётся.

  - id: screen
    kind: filmstrip
    frames:
      - { work: "The General's Daughter", node: shes-began-to-lie-1999, caption: { en: "The film opens with their own voices.", ru: "Фильм открывается их собственными голосами." } }
      - { work: "Grey's Anatomy, Original Soundtrack Vol. 3 (series soundtrack album)", node: feist-sealion-2007, caption: { en: "Feist’s version on the “Grey’s Anatomy” soundtrack.", ru: "Версия Feist на саундтреке «Анатомии страсти»." } }
      - { work: "Luther (BBC One), opening titles, Series 1–3", node: paradise-circus-2010, caption: { en: "“Paradise Circus” over the opening titles of “Luther”.", ru: "«Paradise Circus» на заставке «Лютера»." } }
      - { work: "Far Cry 6", node: far-cry-6-2021, caption: { en: "A radio cover on the fictional island of Yara.", ru: "Радиокавер на вымышленном острове Яра." } }
