  - id: simone
    kind: simone
    nodes: [ simone-1964 ]
    photo: simone-1965
    art:
      generated: true
      layers:
        - { file: piano-stage.webp, depth: 3, alt: "" }
        - { file: piano-grand.webp, depth: 8, alt: { en: "A grand piano on a dark stage", ru: "Рояль на тёмной сцене" } }
        - { file: piano-figure.webp, depth: 12, role: figure, pivot: "34 88", alt: { en: "A woman at the piano, upright, her hands on the keys", ru: "Женщина за роялем, прямая, руки на клавишах" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "1964"
        ru: "1964"
      - id: route
        role: text
        draft: false
        en: A quarter of a century later the song reached Nina Simone, brought to her by the poet Langston Hughes. His secretary, George Houston Bass, had come across it, and Hughes wrote to Simone that “See-Line Woman” suited her particularly well.
        ru: "Прошла четверть века, и песня дошла до Нины Симон. Привёл её туда поэт Ленгстон Хьюз: на песню наткнулся его секретарь Джордж Хьюстон Басс, а Хьюз написал Симон, что «See-Line Woman» подходит ей особенно."
      - id: version
        role: text
        draft: false
        en: "In 1964 Simone recorded the song for her album “Broadway-Blues-Ballads”. She spelled the title her own way, “See-Line Woman”, and the record credits the arrangement to her. So a schoolyard game became a concert piece."
        ru: "В 1964 году Симон записала песню для альбома «Broadway-Blues-Ballads». Название она написала по-своему — «See-Line Woman», а аранжировка на пластинке записана за ней самой. Так игра со школьного двора стала концертной вещью."
      - id: bach
        role: text
        draft: false
        en: "Simone had trained to be a classical pianist: she played Bach and studied at Juilliard, but the Curtis Institute turned her down. And so a children’s game from a Mississippi churchyard came into the hands of a pianist schooled on Bach."
        ru: "Симон готовилась стать классической пианисткой: играла Баха, училась в Джульярдской школе, но в Кёртисовский институт её не приняли. И вот игра со школьного двора, которую сёстры Шипп спели когда-то в церкви в Миссисипи, оказалась в руках пианистки, выученной на Бахе."

  - id: single
    kind: single
    nodes: [ simone-single-1964 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: July 1964
        ru: Июль 1964
      - id: two-sides
        role: text
        draft: false
        en: In July 1964 the song came out on a single too. On side A was “Mississippi Goddam”. Press “Turn the record over” to see what was on the other side.
        ru: В июле 1964 года песня вышла и на сингле. На стороне A была «Mississippi Goddam». Нажмите «Перевернуть пластинку», чтобы увидеть, что было на другой стороне.
      - id: goddam
        role: text
        draft: false
        en: Simone wrote “Mississippi Goddam” in 1963, after Medgar Evers was murdered in Mississippi and a church was bombed in Birmingham, Alabama.
        ru: «Mississippi Goddam» Симон написала в 1963 году, после того как в Миссисипи убили Медгара Эверса, а в Бирмингеме, штат Алабама, взорвали церковь.
      - id: side-b
        role: text
        draft: false
        en: And on side B was “Sea Lion Woman”, in the old folk spelling. So one record carried an angry protest against what was happening in Mississippi and a game sung by two young women from that same Mississippi.
        ru: А на стороне B была «Sea Lion Woman» в старом, народном написании. Так на одной пластинке оказались гневный протест против того, что творилось в Миссисипи, и игра, которую пели две девушки из того же Миссисипи.
      - id: label-a
        role: label
        draft: false
        en: Mississippi Goddam
        ru: Mississippi Goddam
      - id: label-b
        role: label
        draft: false
        en: Sea Lion Woman
        ru: Sea Lion Woman
      - id: credit
        role: label
        draft: false
        en: Written by George Houston Bass
        ru: Written by George Houston Bass
      - id: names
        role: label
        draft: false
        en: Christine and Katherine Shipp
        ru: Кристин и Кэтрин Шипп
      - id: name
        role: caption
        draft: false
        en: "Look at the label: it names one writer, George Houston Bass. The names of Christine and Katherine Shipp, who sang the song in 1939, are not there; under the label they run in the ink."
        ru: "Посмотрите на этикетку: автором на ней указан один человек — Джордж Хьюстон Басс. Имён Кристин и Кэтрин Шипп, которые спели эту песню в 1939 году, там нет: под этикеткой они расплываются в туши."

  - id: bass
    kind: text
    photo: hughes-1936
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The man on the label
        ru: Человек на этикетке
      - id: who
        role: text
        draft: false
        en: From 1959 to 1964 George Houston Bass was secretary and literary assistant to Langston Hughes, the poet who suggested the song to Nina Simone. Later Bass founded the Rites and Reason theatre at Brown University, and he died in Providence in 1990.
        ru: Джордж Хьюстон Басс с 1959 по 1964 год был секретарём и литературным помощником Ленгстона Хьюза — того самого поэта, который предложил песню Нине Симон. Позже Басс основал театр Rites and Reason в Брауновском университете и умер в Провиденсе в 1990 году.
      - id: system
        role: text
        draft: false
        en: Bass registered the copyright in the song. From then on, wherever a record named the writer, it named him, and never Christine and Katherine Shipp. In 1965 Hughes himself wrote to a friend about “my former secretary’s SEA LION WOMAN”, which Simone was singing at every concert.
        ru: Басс зарегистрировал на песню авторское право. С тех пор везде, где на пластинке указан автор, стоит его имя — и ни разу имена Кристин и Кэтрин Шипп. В 1965 году Хьюз сам писал другу о «SEA LION WOMAN моего бывшего секретаря», которую Симон пела на каждом концерте.

  - id: jazz
    kind: stop
    photo: lateef-1964
    nodes: [ lateef-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · jazz
        ru: 1967 · джаз
      - id: text
        role: text
        draft: false
        en: From here the song passed from hand to hand, and its road is easiest to follow stop by stop. The first stop is jazz. On 1 June 1967, three years after Simone, the saxophonist Yusef Lateef recorded the song with his quartet in New York. He kept the title in Simone’s spelling and turned the schoolyard game into a jazz piece.
        ru: Дальше песня пошла по рукам, и её дорогу проще всего пройти по остановкам. Первая — джаз. 1 июня 1967 года, через три года после Симон, саксофонист Юсеф Латиф записал песню со своим квартетом в Нью-Йорке. Название он оставил в написании Симон, а из игры со школьного двора сделал джазовую пьесу.
      - id: listen
        role: note
        draft: false
        en: "Listen to Sylvia Shemwell’s tambourine: it keeps the circle’s old clap."
        ru: "Послушайте бубен Сильвии Шемвелл: он держит старый хлопок круга."

  - id: beat
    kind: stop
    photo: easybeats-1967
    nodes: [ easybeats-1967 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · beat
        ru: 1967 · бит
      - id: text
        role: text
        draft: false
        en: "In the same year, 1967, the song reached the other side of the world and entered beat music. The Australian band The Easybeats recorded it with the producer Shel Talmy; the record lists the song as traditional, arranged by the band’s guitarists Harry Vanda and George Young."
        ru: "В том же 1967 году песня добралась до другого края света и попала в бит-музыку. Австралийская группа The Easybeats записала её с продюсером Шелом Талми; на пластинке песня значится народной, в аранжировке гитаристов группы Гарри Ванды и Джорджа Янга."

  - id: house
    kind: stop
    photo: vega-2009
    nodes: [ songstress-1997, maw-remix-2002 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1997 → 2002 · house
        ru: 1997 → 2002 · хаус
      - id: text
        role: text
        draft: false
        en: Thirty years later the song came to the dance floors of New York house. In 1997 the producers Kerri Chandler and Jerome Sydenham released it as The Songstress, and in 2002 Masters At Work remixed Nina Simone’s own recording for the clubs.
        ru: Через тридцать лет песня попала на танцполы нью-йоркского хауса. В 1997 году продюсеры Керри Чандлер и Джером Сайденхэм выпустили её под именем The Songstress, а в 2002 году Masters At Work сделали для клубов ремикс самой записи Нины Симон.
      - id: listen
        role: note
        draft: false
        en: Listen to how the refrain becomes a loop over the kick drum.
        ru: Послушайте, как припев превращается в петлю над бас-барабаном.

  - id: feist
    kind: stop
    photo: feist-2006
    nodes: [ feist-sealion-2007 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2007"
        ru: "2007"
      - id: text
        role: text
        draft: false
        en: The Canadian singer Feist went past Nina Simone, straight back to the sisters. She found the 1939 field recording on a compilation and called her version “kind of a half cover of the little girls”, naming Simone’s famous version only second.
        ru: Канадская певица Feist прошла мимо Нины Симон прямо к сёстрам Шипп. Она нашла полевую запись 1939 года на сборнике и назвала свою версию «наполовину кавером на тех девочек», а знаменитую версию Симон назвала только во вторую очередь.
      - id: chorus
        role: text
        draft: false
        en: The clapping, chanting chorus around her on the record is the circle’s answer of 1939, come back as an arrangement.
        ru: Хлопающий и поющий хор вокруг неё на записи — это ответ круга 1939 года, вернувшийся в виде аранжировки.
      - id: listen
        role: note
        draft: false
        en: Listen to the group answering her line by line.
        ru: Послушайте, как хор отвечает ей строка за строкой.

  - id: kanye
    kind: stop
    photo: kanye-2008
    nodes: [ kanye-bad-news-2008 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2008"
        ru: "2008"
      - id: text
        role: text
        draft: false
        en: "In 2008 Kanye West built his song “Bad News” on a sample of Nina Simone’s recording. The sample was licensed, and the album booklet says so: the track contains a sample of “See Line Woman” as performed by Nina Simone, written by George Bass."
        ru: "В 2008 году Канье Уэст построил свою песню «Bad News» на сэмпле из записи Нины Симон. Сэмпл был лицензирован, и в буклете альбома так и написано: трек содержит сэмпл «See Line Woman» в исполнении Нины Симон, автор — Джордж Басс."
      - id: again
        role: line
        draft: false
        en: Once again the writer’s line carries a single name, and it is not the name of either sister.
        ru: И снова в строке об авторе одно имя, и это не имя ни одной из сестёр.

  - id: massive
    kind: flashes
    photo: massive-2010
    nodes: [ paradise-circus-2010, gui-boratto-2010, post-ghostpoet-2023 ]
    threads: [ simone-1964, shipp-1939 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2010"
        ru: "2010"
      - id: text
        role: text
        draft: false
        en: "In 2010 the Bristol band Massive Attack released “Paradise Circus”. Through the whole song runs the clap from Nina Simone’s “See-Line Woman”. While the track plays, a line of ink pulses with that clap and runs back: to Simone’s record of 1964, and from it to the sisters’ minute of 1939."
        ru: "В 2010 году бристольская группа Massive Attack выпустила «Paradise Circus». Через всю песню проходит хлопок из «See-Line Woman» Нины Симон. Пока трек звучит, линия туши пульсирует в такт этому хлопку и тянется назад — к пластинке Симон 1964 года, а от неё к минуте сестёр Шипп 1939 года."
      - id: on
        role: text
        draft: false
        en: "From “Paradise Circus” the branch went on. The producer Gui Boratto rebuilt the track as an eight-minute melodic techno piece, the producer Burial as a twelve-minute one, and the song itself became the opening theme of the BBC series “Luther”; in 2023, for the film “Luther: The Fallen Sun”, two members of Massive Attack recorded it again with Ghostpoet."
        ru: "От «Paradise Circus» ветвь пошла дальше. Продюсер Gui Boratto перестроил трек в восьмиминутную мелодичную техно-вещь, продюсер Burial — в двенадцатиминутную пьесу, а сама песня стала музыкой к заставке сериала BBC «Лютер»; в 2023 году для фильма «Лютер: Павшее солнце» двое участников Massive Attack заново записали её с Ghostpoet."
      - id: fuchs
        role: note
        draft: false
        en: The drums on the album are credited to Jerry Fuchs. He died in Brooklyn on 8 November 2009, three months before the album came out.
        ru: Барабаны на альбоме записаны за Джерри Фуксом. Он погиб в Бруклине 8 ноября 2009 года, за три месяца до выхода альбома.
      - id: label-1964
        role: label
        draft: false
        en: "1964"
        ru: "1964"
      - id: label-1939
        role: label
        draft: false
        en: "1939"
        ru: "1939"

  - id: burial
    kind: stop
    nodes: [ burial-2011 ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "2011"
        ru: "2011"
      - id: text
        role: text
        draft: false
        en: Burial’s rework came out in 2011, a thousand numbered copies. The song thins in it almost to a shadow, but the clap from Simone’s record stays.
        ru: Переработка Burial вышла в 2011 году тиражом в тысячу пронумерованных пластинок. Песня в ней истончается почти до тени, но хлопок с пластинки Симон остаётся.

  - id: screen
    kind: filmstrip
    frames:
      - { work: "The General's Daughter", node: shes-began-to-lie-1999, caption: { en: "The film opens with their own voices.", ru: "Фильм открывается их собственными голосами." } }
      - { work: "Grey's Anatomy, Original Soundtrack Vol. 3 (series soundtrack album)", node: feist-sealion-2007, caption: { en: "Feist’s version on the “Grey’s Anatomy” soundtrack.", ru: "Версия Feist на саундтреке «Анатомии страсти»." } }
      - { work: "Luther (BBC One), opening titles, Series 1–3", node: paradise-circus-2010, caption: { en: "“Paradise Circus” over the opening titles of “Luther”.", ru: "«Paradise Circus» на заставке «Лютера»." } }
      - { work: "Far Cry 6", node: far-cry-6-2021, caption: { en: "A radio cover on the fictional island of Yara.", ru: "Радиокавер на вымышленном острове Яра." } }
      - { work: "The Accountant 2", node: ponder-dessner-2025, caption: { en: "Danielle Ponder and Bryce Dessner open “The Accountant 2”.", ru: "Даниэль Пондер и Брайс Десснер открывают «Бухгалтера 2»." } }
      - { work: "Heated Rivalry (Crave/HBO Max), episode 1 'Rookies'", node: feist-sealion-2007, caption: { en: "Its creator wanted the song’s “nervous energy” and was not sure he could afford it.", ru: "Создатель сериала хотел «нервную энергию» этой песни и не был уверен, что сможет её себе позволить." } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: On screen
        ru: На экране
      - id: text
        role: text
        draft: false
        en: "The song also found its way to the screen: into films, series and a video game. Scroll along the film strip to see where it sounded, year by year."
        ru: "Песня попала и на экран: в фильмы, сериалы и видеоигру. Прокрутите киноленту, чтобы увидеть, где она звучала, год за годом."

  - id: river
    kind: river
    art:
      generated: true
      aspect: "1 / 3"
      layers:
        - { file: river-ink.webp, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The whole river
        ru: Вся река
      - id: intro
        role: text
        draft: false
        en: "We have walked only a few of its stops. Altogether the song has some thirty versions, drawn here as one river: each version is a circle with its year, and a line leads back to the one it took the song from. Tap a circle to read its story and, where there is an official recording, to hear it."
        ru: "Мы прошли лишь по нескольким остановкам. Всего у песни набралось около тридцати версий, и здесь они нарисованы одной рекой: каждая версия — кружок с годом, а линия ведёт к той, у кого песню взяли. Нажмите на кружок — откроется история версии, а если у неё есть официальная запись, её можно послушать."
      - id: branches
        role: text
        draft: false
        en: "Two branches run side by side. On one are those who went back to the 1939 recording and took the sisters’ voices and the circle’s answer. On the other are those who took Nina Simone’s version: her title, her arrangement or her actual recording."
        ru: "Две ветви идут рядом. На одной — те, кто вернулся к записи 1939 года и взял голоса сестёр Шипп и ответ круга. На другой — те, кто взял версию Нины Симон: её название, её аранжировку или саму её запись."

  - id: silence
    kind: silence
    blocks:
      - id: stop
        role: line
        draft: false
        en: Now the river stops, and the clap falls silent.
        ru: Здесь река останавливается, и хлопок затихает.
      - id: film
        role: text
        draft: false
        en: "In 1999 the Hollywood film “The General’s Daughter” opened with that very recording of 1939, the voices of Christine and Katherine Shipp themselves."
        ru: В 1999 году голливудский фильм «Дочь генерала» открылся той самой записью 1939 года — голосами самих Кристин и Кэтрин Шипп.
      - id: never-heard
        role: text
        draft: false
        en: "Neither sister heard it: both had long been dead by then. Of everyone who sang at Nichols Chapel that May day in 1939, only their brother Isaac was still alive."
        ru: "Ни одна из сестёр этого не услышала: обеих к тому времени давно не было в живых. Из всех, кто пел в тот майский день 1939 года в Николс-Чепел, оставался только их брат Айзек."
      - id: isaac-africa
        role: text
        draft: false
        en: Isaac had once sailed to Africa as a hand on a cargo ship and learned songs there too.
        ru: Айзек когда-то ходил в Африку матросом на грузовом судне и выучил песни и там.

  - id: classroom
    kind: classroom
    art:
      generated: true
      layers:
        - { file: classroom-room.webp, depth: 4, alt: { en: "A school music room, seen from its doorway", ru: "Музыкальный класс в школе, вид из дверей" } }
        - { file: classroom-children.webp, depth: 9, role: figure, pivot: "50 80", fit: { x: -2.5 }, alt: { en: "Children standing in a circle, clapping", ru: "Дети стоят в кругу и хлопают" } }
        - { file: classroom-teacher.webp, depth: 13, role: figure, pivot: "86 88", fit: { x: 3.19, y: 1.63, scale: 0.96 }, alt: { en: "Their teacher keeps the beat beside a small speaker", ru: "Учительница отбивает ритм рядом с небольшой колонкой" } }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The classroom
        ru: Класс
      - id: text
        role: text
        draft: false
        en: Today music teachers in American schools teach this song by the Kodály and Orff methods. And so that the children can hear where it came from, they play them the recording Christine and Katherine Shipp made in 1939.
        ru: А сегодня учителя музыки в американских школах разучивают эту песню с детьми по методикам Кодаи и Орфа. И чтобы дети услышали, откуда она взялась, им ставят ту самую запись, которую Кристин и Кэтрин Шипп сделали в 1939 году.
      - id: ring
        role: line
        draft: false
        en: The children stand in a circle, and the circle claps again.
        ru: Дети встают в круг, и круг снова начинает хлопать.

  - id: finale
    kind: finale
    # The same house: its door opens as the story closes.
    art: *door-art
    nodes: [ shipp-1939 ]
    blocks:
      - id: together
        role: text
        draft: false
        en: "Press “Clap together”: your claps from the whole story, the children’s claps and the 1939 recording will sound at once, and the circle will close."
        ru: "Нажмите «Хлопнуть вместе»: ваши хлопки за всю историю, хлопки детей и запись 1939 года прозвучат вместе, и круг замкнётся."
      - id: credit-1
        role: quote
        draft: false
        en: A folk ring game.
        ru: Народная игра в круг.
      - id: credit-2
        role: quote
        draft: false
        en: Sung by Christine and Katherine Shipp.
        ru: Пели Кристин и Кэтрин Шипп.
      - id: credit-3
        role: quote
        draft: false
        en: Byhalia, Mississippi, 13 May 1939.
        ru: Байхейлия, Миссисипи, 13 мая 1939 года.
      - id: last
        role: line
        draft: false
        en: The whole world knows the song. Now you know their names.
        ru: Песню знает весь мир. Теперь вы знаете их имена.
