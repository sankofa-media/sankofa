scenes:
  - id: door
    kind: door
    art: &door-art
      generated: true
      layers:
        - { file: door-house.webp, depth: 6, alt: { en: "A small wooden house in rural Mississippi, spring 1939", ru: "Небольшой деревянный дом в сельском Миссисипи, весна 1939 года" } }
        - { file: door-porch.webp, depth: 10, state: closed, alt: { en: "Its porch, the front door closed", ru: "Крыльцо, входная дверь закрыта" } }
        - { file: door-porch-open.webp, depth: 10, state: open, alt: { en: "Its porch, the front door ajar", ru: "Крыльцо, входная дверь приоткрыта" } }
        - { file: door-light.webp, depth: 10, state: open, alt: "" }
        - { file: door-tree.webp, depth: 18, alt: "" }
    blocks:
      - id: when
        role: kicker
        draft: false
        en: Byhalia, Mississippi, 13 May 1939
        ru: Байхейлия, Миссисипи, 13 мая 1939 года
      - id: lead
        role: text
        draft: false
        en: The whole world knows this song. Nina Simone sang it, house DJs remade it again and again, Kanye West and Massive Attack built tracks on it, and it plays in films, series and video games. But the first people whose voices singing it have come down to us were not stars but two young women from a small town in Mississippi, Christine and Katherine Shipp. Their names are on almost none of those records. This is the story of how their song went round the world while they stayed at home, unknown.
        ru: Эту песню знает весь мир. Её пела Нина Симон, её снова и снова переделывали хаус-диджеи, на ней строили свои треки Канье Уэст и Massive Attack, она звучит в фильмах, сериалах и видеоиграх. Но первыми, чьи голоса с этой песней дошли до нас, были не звёзды, а две девушки из маленького городка в штате Миссисипи — Кристин и Кэтрин Шипп. Их имён нет почти ни на одной из этих пластинок. Это история о том, как их песня обошла весь мир, а сами они остались дома, в безвестности.
      - id: why-knock
        role: note
        draft: false
        en: "This story has sound. It comes on when you knock at the door, and from then on you can clap along with its heroines."
        ru: В этой истории есть звук. Он включится, когда вы постучите в дверь, а дальше вы сможете хлопать в такт вместе с героинями.

  - id: ring
    kind: ring
    art:
      generated: true
      layers:
        - { file: ring-ground.webp, depth: 3, alt: "" }
        - { file: ring-children.webp, depth: 10, role: figure, pivot: "50 60", alt: { en: "Children in a ring, seen from a little above, clapping", ru: "Дети в кругу, вид чуть сверху, хлопают в ладоши" } }
      # Where each child's hands meet: a ripple of ink spreads there with every clap.
      claps:
        depth: 10
        at: [ [ 52.3, 13.2 ], [ 69.6, 16.5 ], [ 82.8, 33.9 ], [ 17.5, 31.9 ], [ 32.8, 15.5 ], [ 52.5, 59.6 ], [ 70.5, 58.5 ], [ 29.7, 56.3 ] ]
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Before 1939
        ru: До 1939 года
      - id: title
        role: title
        draft: false
        en: A game in a circle
        ru: Игра в круг
      - id: form
        role: text
        draft: false
        en: Long before anyone thought of recording such songs, African American children in the American South played singing games standing in a ring. One of them sings a line, the whole circle answers, and the answer comes round again and again until the game is over. Hands and feet beat out the second and fourth beats, so the game has a rhythm section of its own, though it has no instruments and needs none.
        ru: Задолго до того, как такие песни кто-нибудь догадался записать, афроамериканские дети на Юге Соединённых Штатов играли в игры с пением, встав в круг. Один из них поёт строчку, весь круг отвечает ему, и этот ответ возвращается снова и снова, пока игра не кончится. Ладони и ноги отбивают при этом вторую и четвёртую доли такта, так что у игры есть собственная ритм-секция, хотя никаких инструментов в ней нет и не нужно.
      - id: book
        role: text
        draft: false
        en: Bessie Jones, a singer from the Georgia Sea Islands, and the folklorist Bess Lomax Hawes collected such games in their book “Step It Down”, published in 1972. The real music of these games, they wrote, is not the tune but the clapping of the circle.
        ru: Бесси Джонс, певица с Морских островов Джорджии, и фольклорист Бесс Ломакс Хоуз собрали такие игры в книге «Step It Down», вышедшей в 1972 году. По их словам, настоящая музыка этих игр — не мелодия, а хлопки круга.
      - id: no-roots
        role: text
        draft: false
        en: "This way of singing, one voice calling and the rest answering, links these games to African musical practice. But where this particular song came from before it reached Mississippi, and who sang it first, nobody wrote down: playground games passed from older children to younger ones and had no authors."
        ru: "Такой способ петь, когда один зовёт, а остальные отвечают, роднит эти игры с африканской музыкой. А вот откуда пришла в Миссисипи именно эта песня и кто спел её первым, никто не записал: дворовые игры переходили от старших детей к младшим, и авторов у них не было."
      - id: hear
        role: caption
        draft: false
        en: Press “Hear the clap” to hear the circle’s rhythm on its own, before any voice comes in.
        ru: Нажмите «Послушать хлопок», чтобы услышать ритм круга сам по себе, пока ещё без голосов.

  - id: expedition
    kind: expedition
    art:
      generated: true
      layers:
        - { file: expedition-road.webp, depth: 4, alt: { en: "A dirt road through low fields", ru: "Грунтовая дорога среди низких полей" } }
        - { file: expedition-ambulance.webp, depth: 10, alt: { en: "An old army ambulance turned into a recording studio on wheels", ru: "Старая армейская санитарная машина, превращённая в студию на колёсах" } }
        - file: expedition-machine.webp
          depth: 10
          open: "0.12 0.4"
          pivot: "63.3 59.4"
          fit: { x: 7.04, y: 0, scale: 0.73 }
          alt: { en: "Its back doors open on a machine that cuts sound onto discs", ru: "Задние двери открыты, внутри аппарат, режущий звук на диски" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The expedition
        ru: Экспедиция
      - id: why
        role: text
        draft: false
        en: In the 1930s the Library of Congress in Washington set itself the task of recording the songs ordinary Americans sang, before they were forgotten altogether. It sent folklorists with recording machines on journeys through the South, and the Federal Writers’ Project, a government programme that gave writers work during the Depression, helped them find singers in villages and small towns.
        ru: В 1930-е годы Библиотека Конгресса в Вашингтоне поставила себе задачу записать песни, которые пели обычные американцы, — пока те не забылись совсем. Она отправляла фольклористов с записывающими аппаратами в поездки по Югу, а Федеральный писательский проект, государственная программа, дававшая работу писателям в годы Великой депрессии, помогал им находить певцов по деревням и маленьким городам.
      - id: halpert
        role: text
        draft: false
        en: "In the spring of 1939 the folklorist Herbert Halpert set off on such a journey. He drove an old army ambulance that had been turned into a studio on wheels: the machine inside cut sound straight onto discs. In Mississippi his guide was Abbott Ferriss of the Writers’ Project, who took notes and photographs. In May they reached the small town of Byhalia."
        ru: "Весной 1939 года в такую поездку отправился фольклорист Герберт Халперт. Ездил он на старой армейской санитарной машине, которую превратили в студию на колёсах: стоявший внутри аппарат резал звук прямо на диски. В Миссисипи его проводником стал Эббот Феррис из Писательского проекта — он вёл записи и фотографировал. В мае они добрались до городка Байхейлия."
      - id: byhalia
        role: label
        draft: false
        en: Byhalia
        ru: Байхейлия
  - id: arrival
    kind: arrival
    # The house of the cover: its door opens to the two strangers.
    art: *door-art
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 13 May 1939
        ru: 13 мая 1939 года
      - id: opened
        role: text
        draft: false
        en: "On the thirteenth of May Halpert and Ferris knocked at the house of John Shipp and his wife, Luella. The couple opened the door to two strangers, although the visitors had come not for them but for John’s singing family: his mother, Mary Shipp, and her children."
        ru: Тринадцатого мая Халперт и Феррис постучали в дом Джона Шиппа и его жены Луэллы. Хозяева открыли дверь двум незнакомцам, хотя приехали те не к ним самим, а к поющей семье Джона — к его матери Мэри Шипп и её детям.

