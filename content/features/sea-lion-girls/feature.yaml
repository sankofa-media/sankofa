    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: The minute
        ru: Минута
      - id: listen
        role: text
        draft: false
        en: "Christine was twenty and Katherine eighteen, and they sang “Sea Lion Woman”. The recording lasts about a minute: two voices and no instruments. The Library of Congress still keeps it."
        ru: "Кристин было двадцать лет, Кэтрин — восемнадцать, и они спели «Sea Lion Woman». Запись длится около минуты: два голоса, ни одного инструмента. Её до сих пор хранит Библиотека Конгресса."
      - id: game
        role: text
        draft: false
        en: "This is the same ring game we spoke of. One sister sings a line and the other answers, as the whole circle would answer in the schoolyard. Nobody wrote the song down for them or taught it from notes: it came to them the way such games always came, from other children."
        ru: "Это та самая игра в круг, о которой шла речь. Одна сестра поёт строчку, другая отвечает, как ответил бы весь круг на школьном дворе. Никто не записывал для них эту песню и не учил их ей по нотам: она пришла к ним так, как всегда приходили такие игры, — от других детей."
      - id: yours
        role: caption
        draft: false
        en: "Join the circle: clap with the sisters by tapping the circle above the picture, or the space bar, in time. Each clap stays on the circle as a drop of ink, the circle stays with you in the corner, and at the very end of the story you can hear your claps together with the children’s."
        ru: "Встаньте в круг: хлопайте вместе с сёстрами — касайтесь круга над рисунком или нажимайте пробел в такт. Каждый хлопок останется на круге каплей туши, круг будет с вами в углу экрана, а в самом конце истории вы сможете услышать свои хлопки вместе с детскими."
  - id: words
    kind: text
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: What the name means
        ru: Что значит название
      - id: heard
        role: text
        draft: false
        en: "Listen closely to the 1939 recording and you will not hear a sea lion in it. The sisters sing “See lie woman, see lie”, and the woman of the game drinks coffee and drinks tea. They are the words of a playground: sounds that drive the game along more than they tell a story."
        ru: "Если внимательно вслушаться в запись 1939 года, никакой «морской львицы» в ней не окажется. Сёстры поют «See lie woman, see lie», а женщина из игры пьёт кофе и пьёт чай. Это слова школьного двора: звуки, которые ведут игру, а не рассказывают историю."
      - id: spelling
        role: text
        draft: false
        en: "“Sea Lion Woman” is how the words looked once they were written down, and the sisters later spelled them that way too. Herbert Halpert, who made the recording, called that spelling “a beautiful example of folk etymology”: when a phrase no longer means anything, people hear in it something they know, such as a sea lion."
        ru: "«Sea Lion Woman» — так эти слова выглядели, когда их записали на бумаге, и так же их потом писали сами сёстры. Герберт Халперт, сделавший запись, назвал такое написание «прекрасным примером народной этимологии»: когда фраза уже ничего не значит, люди слышат в ней что-то знакомое, например морского льва."
      - id: lying
        role: text
        draft: false
        en: Other listeners heard another word in it. As early as 1942 the booklet of the Library of Congress album asked in a footnote whether “see lie” might be “see lyin’”, a lying woman, a gossip. Nobody has ever settled it, and the game never needed it settled.
        ru: Другие слушатели слышали в этих словах иное. Ещё в 1942 году в буклете альбома Библиотеки Конгресса в сноске спрашивали, не «see lyin’» ли это — «лгунья», сплетница. Никто так и не решил этот вопрос, и самой игре решать его было не нужно.
      - id: simone
        role: text
        draft: false
        en: By the time the song reached Nina Simone, the woman of the game had changed. In Simone’s “See-Line Woman” she is “dressed in red” and makes “a man lose his head”. The playground game had turned into a song about a woman men lose their heads over, and the woman who drank coffee and tea was gone.
        ru: Пока песня шла к Нине Симон, женщина из игры изменилась. В «See-Line Woman» у Симон она «одета в красное» и «сводит мужчину с ума». Дворовая игра превратилась в песню о женщине, из-за которой мужчины теряют голову, а женщина, пившая кофе и чай, исчезла.
      - id: together
        role: line
        draft: false
        en: "So even the song’s name went its own way: “See lie” in the sisters’ mouths, “Sea Lion” on paper, “See-Line” on Simone’s record."
        ru: "Так своей дорогой ушло даже название: «See lie» в устах сестёр, «Sea Lion» на бумаге, «See-Line» на пластинке Симон."

