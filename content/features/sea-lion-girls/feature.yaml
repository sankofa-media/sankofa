        draft: false
        en: The classroom
        ru: Класс
      - id: text
        role: text
        draft: false
        en: Today music teachers in American schools teach this song by the Kodály and Orff methods. And so that the children can hear where it came from, they play them the recording Christine and Katherine Shipp made in 1939.
        ru: А сегодня учителя музыки в американских школах разучивают эту песню с детьми по методикам Кодаи и Орфа. И чтобы дети услышали, откуда она взялась, им ставят ту самую запись, которую Кристин и Кэтрин Шипп сделали в 1939 году.
      - id: ring
        role: line
        draft: false
        en: "The children stand in a ring and begin to clap."
        ru: "Дети встают в круг и начинают хлопать."

  - id: finale
    kind: finale
    # The same house: its door opens as the story closes.
    art: *door-art
    nodes: [ shipp-1939 ]
    blocks:
      - id: together
        role: text
        draft: false
        en: "Press “Clap together”: the 1939 recording will play, and over it the claps you left on the circle during the story, together with the claps of the children in the classroom."
        ru: "Нажмите «Хлопнуть вместе»: зазвучит запись 1939 года, а поверх неё — хлопки, которые вы оставили на круге по ходу истории, вместе с хлопками детей из школьного класса."
      - id: credit-1
        role: quote
        draft: false
        en: A folk ring game.
        ru: Народная игра в круг.
      - id: credit-2
        role: quote
        draft: false
        en: Sung by Christine and Katherine Shipp.
        ru: Пели Кристин и Кэтрин Шипп.
      - id: credit-3
        role: quote
        draft: false
        en: Byhalia, Mississippi, 13 May 1939.
        ru: Байхейлия, Миссисипи, 13 мая 1939 года.
      - id: last
        role: text
