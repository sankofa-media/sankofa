        ru: "Песня попала и на экран: в фильмы, сериалы и видеоигру. Ниже — кадры, год за годом: прокрутите их вбок, чтобы увидеть, где она звучала."

  - id: river
    kind: river
    art:
      generated: true
      aspect: "1 / 3"
      layers:
        - { file: river-r2-plate.webp, alt: "" }
        - { file: river-r2-ink.webp, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: "All the versions"
        ru: "Все версии"
      - id: intro
        role: text
        draft: false
        en: "The text above names only a few versions. The song has about thirty, and the diagram below shows them all: each version is a circle with its year, and a line leads to the recording it took the song from. Press a circle to read the story of that version and, if it has an official recording, to listen to it."
        ru: "В тексте выше названы лишь несколько версий. Всего у песни их около тридцати, и на схеме ниже собраны все: каждая версия — кружок с годом, а линия ведёт к той записи, у которой песню взяли. Нажмите на кружок, чтобы прочитать историю версии и послушать её, если есть официальная запись."
      - id: branches
        role: text
        draft: false
        en: "The versions fall into two groups. Some musicians started from the 1939 recording: they put the Shipp sisters’ voices into their tracks, or sang the song the way the sisters did, a lead line and a chorus answering it. Others took the song from Nina Simone: her title, her arrangement or a piece of her recording."
        ru: "Версии делятся на две группы. Одни музыканты брали за основу запись 1939 года: вставляли в свои треки голоса сестёр Шипп или пели песню так, как пели её сёстры, — строчка ведущей и ответ хора. Другие брали песню у Нины Симон: её название, её аранжировку или кусок её записи."

  - id: silence
    kind: silence
    art:
      generated: true
      layers:
        - { file: silence-sky-fence.webp, depth: 3, alt: { en: "An empty schoolyard at dusk: a wire fence, a bare tree, a swing hanging still", ru: "Пустой школьный двор в сумерках: сетчатый забор, голое дерево, неподвижные качели" } }
        - { file: silence-ground.webp, depth: 6, alt: "" }
        - { file: silence-circle-ribbon.webp, depth: 9, alt: { en: "A chalk circle on the ground with nobody in it, and a small red ribbon at its edge", ru: "Меловой круг на земле, в нём никого, а у края — маленькая красная ленточка" } }
    blocks:
      - id: stop
        role: line
        draft: false
        en: "Here the list of versions ends, and the claps fall silent."
        ru: "Здесь список версий кончается, и хлопки затихают."
      - id: film
        role: text
        draft: false
        en: "In 1999 the Hollywood film “The General’s Daughter” came out, and the 1939 recording was heard in it: the voices of Christine and Katherine Shipp themselves."
        ru: "В 1999 году вышел голливудский фильм «Дочь генерала», и в нём прозвучала та самая запись 1939 года — голоса самих Кристин и Кэтрин Шипп."
      - id: never-heard
        role: text
        draft: false
        en: "Neither sister heard it: Christine died in 1966 and Katherine in 1978. Of everyone who sang at Nichols Chapel that May day in 1939, only their brother Isaac was still alive."
        ru: "Ни одна из сестёр этого не услышала: Кристин умерла в 1966 году, Кэтрин — в 1978-м. Из всех, кто пел в Николс-Чепел в тот майский день 1939 года, в живых оставался только их брат Айзек."
      - id: isaac-africa
        role: text
        draft: false
        en: "In 1998, at eighty-three, Isaac sang the song for the folklorist Stephen Wade, patting the rhythm with his hands. He sang verses of his own, not his sisters’: “Chop that cotton, sea lion, chop it good”."
        ru: "В 1998 году Айзеку было восемьдесят три. Он спел эту песню фольклористу Стивену Уэйду, отбивая ритм ладонями, и куплеты у него были свои, не те, что пели сёстры: «Chop that cotton, sea lion, chop it good» — «Пропалывай хлопок, sea lion, пропалывай как следует»."

  - id: classroom
    kind: classroom
    art:
      generated: true
      layers:
        - { file: classroom-room.webp, depth: 4, alt: { en: "A school music room, seen from its doorway", ru: "Музыкальный класс в школе, вид из дверей" } }
        - { file: classroom-children.webp, depth: 9, role: figure, pivot: "50 80", fit: { x: -2.5 }, alt: { en: "Children standing in a circle, clapping", ru: "Дети стоят в кругу и хлопают" } }
        - { file: classroom-teacher.webp, depth: 13, role: figure, pivot: "86 88", fit: { x: 3.19, y: 1.63, scale: 0.96 }, alt: { en: "Their teacher keeps the beat beside a small speaker", ru: "Учительница отбивает ритм рядом с небольшой колонкой" } }
    blocks:
