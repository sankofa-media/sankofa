        en: "The whole world knows this song: Nina Simone and Feist sang it, Kanye West and Massive Attack built tracks on it, it plays in films and series. But the first time it was recorded, on 13 May 1939 in Byhalia, Mississippi, it was sung by two young women, Christine and Katherine Shipp."
        ru: "Эту песню знает весь мир: её пели Нина Симон и Feist, на ней строили свои треки Канье Уэст и Massive Attack, она звучит в фильмах и сериалах. А впервые её записали 13 мая 1939 года в Байхейлии, штат Миссисипи, и пели её тогда две девушки — Кристин и Кэтрин Шипп."
