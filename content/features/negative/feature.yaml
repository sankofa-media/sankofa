  - id: chorus
    kind: chorus
    name:
      en: The feast
      ru: Застолье
    pictures:
      - chorus
    blocks:
      - id: title
        role: title
        draft: false
        en: The feast
        ru: Застолье
      - id: text-0
        role: text
        draft: false
        en: "A feast in an Abkhaz village is led by the tamada. He rises first and speaks for everyone, but no one at
          this table is just a passenger: each person has a voice. Raise the bowl. Voices join the table one
          by one, as in real polyphony, when a part enters and finds its line."
        ru: "Застолье в абхазском селе ведёт тамада. Он встаёт первым и говорит за всех, но за столом нет пассажиров:
          каждый здесь — со своим голосом. Поднимите чашу. К столу добавляются голоса — по одному, как поётся
          в настоящем многоголосии, когда партия входит и находит свою строку."
      - id: text-1
        role: text
        draft: false
        en: "Shirin Abash joins the chorus — Zarya Vostoka, 1958; then Nutsa Abash — MK, 2003. Next comes Shamil
          Chanba: a conversation with Allison Tynes, Afro-American, 1973, and a conversation around 1995 that
          Yuri Zotov recalled in AiF in 2020. Diana Bobyleva — Sputnik, 2017. Their words will come after the
          glass turns over. For now, names and years appear above the chorus, while the player carries Abkhaz
          polyphony."
        ru: "К хору присоединяется Ширин Абаш — «Заря Востока», 1958 год; затем Нуца Абаш — «МК», 2003-й. Следом —
          Шамиль Чанба: беседа с Эллисон Тайнс, Afro-American, 1973 год, и разговор около 1995-го, который
          Юрий Зотов вспомнил в «АиФ» в 2020-м. Диана Бобылева — «Спутник», 2017 год. Их слова прозвучат после
          переворота стекла. Пока над хором появляются имена и годы, а в плеере звучит абхазское
          многоголосие."
