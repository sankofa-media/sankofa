  - id: war
    kind: war
    name:
      en: War and after
      ru: Война и после
    pictures:
      - war
      - dispersal
    blocks:
      - id: title
        role: title
        draft: false
        en: War and after
        ru: Война и после
      - id: text-0
        role: text
        draft: false
        en: In 1992–1993 the region lived through war. In October 1992, according to an ITAR-TASS dispatch of 14
          October quoted by Human Rights Watch in its 1995 report, Adzyubzha, Kyndyg, Tamysh and Tkvarcheli
          were shelled. John Colarusso writes of the destruction of three villages and leaves the residents'
          fate unresolved. These sources do not establish what happened to Afro-Abkhaz homes.
        ru: В 1992–1993 годах край прожил войну. В октябре 1992-го, по сводке ИТАР-ТАСС от 14 октября, которую Human
          Rights Watch приводит в докладе 1995 года, обстреливали Адзюбжу, Кындыг, Тамыш и Ткварчели; Джон
          Коларуссо пишет об уничтожении трёх сёл — и оставляет судьбу жителей открытой. Судьба домов
          афроабхазов в этих материалах не установлена.
      - id: text-1
        role: text
        draft: false
        en: Then came dispersal. There are documented stories of intermarriage and moves to Sukhum. The total number
          who left is unknown. Accounts of relocation to Ethiopia and America have not yet been independently
          confirmed. Publications sometimes use the word “last”, but the family's descendants are still
          living.
        ru: Дальше — рассеяние. Известны истории смешанных браков и переезда в Сухум. Сколько всего людей уехало,
          неизвестно. Рассказы о переселении в Эфиопию и Америку пока не подтверждены независимо. В
          публикациях встречается слово «последний», но потомки семьи продолжают жить.
      - id: text-2
        role: text
        draft: false
        en: The family story continued. Nutsa lived in Sukhum and gave an interview in 2003; her granddaughter Diana
          spoke to Sputnik in 2017; independent accounts of descendants also appeared in 2020. Shirin has a
          great-granddaughter, Diana. “Where did they go?” is a question outsiders ask. Their own people do
          not ask it.
        ru: Семейная история продолжилась. Нуца жила в Сухуме и дала интервью в 2003-м; её внучка Диана говорила с
          «Спутником» в 2017-м; независимо друг от друга о потомках писали и в 2020-м. У Ширина есть правнучка
          Диана. Вопрос «куда они делись» задают чужие. Свои его не задают.
