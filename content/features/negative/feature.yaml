  - id: family
    kind: family
    name:
      en: The Abash family
      ru: Род Абаш
    pictures:
      - family
    blocks:
      - id: title
        role: title
        draft: false
        en: The Abash family
        ru: Род Абаш
      - id: text-0
        role: text
        draft: false
        en: The Abash family remembers its earliest ancestor, Amber. The family account says he was brought here as a
          child, bought by Prince Abashidze, married Sofia and had twelve children. That is how Amber's story
          was passed down; documents of his arrival have not been found. The family remembered Sofia as
          exceptionally long-lived; records of those memories give different ages, 115 and 112.
        ru: "Род Абаш помнит своего первого предка — Амбера. Рассказ семьи говорит: привезён ребёнком, куплен князем
          Абашидзе, женился на Софии, детей было двенадцать. Так историю Амбера передавали в семье; документы
          о его приезде не найдены. Софию семья помнила как очень долгоживущую; в записях этих воспоминаний
          названы разные возрасты — 115 и 112 лет."
      - id: text-1
        role: text
        draft: false
        en: Their son Shaaban served in the cavalry in the First World War, according to an archival roster and a
          family account; later he belonged to Abkhazia's central executive body. The identity of the person
          in the photograph circulated online under his name has not yet been established. Son Shirin was a
          tobacco grower and collective-farm organiser. Shirin's daughter Nutsa was a doctor in Sukhum. Her
          husband Semyon saw her photograph in a newspaper and wrote a letter; correspondence began, followed
          by marriage. She told the story herself to MK, and separately to Tynes in 1973. The letter's first
          words, as retold by Vitaly Sharia (Ekho Kavkaza, 2020), were “Hello, unfamiliar Nutsa!” Shamil
          Chanba was a bus driver from Adzyubzha. Diana Bobyleva is Nutsa's granddaughter; in her Sputnik
          interview (2017), she said, “now I am the one telling it.” On the family tree, solid lines join
          confirmed relationships and dotted lines mark connections from family tradition.
        ru: "Их сын Шаабан воевал в Первую мировую в коннице — об этом говорят архивный список и семейный рассказ;
          позже он входил в центральный исполнительный орган Абхазии. Кто изображён на снимке, который в сети
          подписывают его именем, пока не установлено. Сын Ширин — табаковод и организатор колхоза. Дочь
          Ширина Нуца — врач из Сухума; её муж Семён увидел её фотографию в газете и написал письмо — началась
          переписка, потом свадьба: она рассказывала об этом сама, в «МК», и отдельно — Тайнс в 1973-м. Первые
          слова письма в пересказе Виталия Шариа («Эхо Кавказа», 2020): «Здравствуйте, незнакомая Нуца!»
          Шамиль Чанба — водитель автобуса из Адзюбжи. Диана Бобылева — внучка Нуцы; в интервью «Спутнику»
          (2017) она сказала: «теперь её рассказываю я». На семейном дереве сплошные линии соединяют
          подтверждённые родственные связи, пунктирные — связи из семейных преданий."
