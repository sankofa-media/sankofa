        en: The caliper
        ru: Штангенциркуль
      - id: text-0
        role: text
        draft: false
        en: "The caliper is heavy and cold, marked in millimetres. Try measuring a face. It will not hold: it slips
          off cheekbones, catches awkwardly against a chin, and by the third attempt you realise that what you
          are measuring is not really a face but your own position. The person doing the measuring is always
          on this side of the glass."
        ru: "Штангенциркуль тяжёлый, холодный, с миллиметровой шкалой. Попробуйте измерить лицо. Он не держится:
          соскальзывает со скул, тупит о подбородок, и к третьей попытке вы понимаете, что измеряете на самом
          деле не лицо, а своё собственное положение. Человек, который мерит, всегда по эту сторону стекла."
      - id: text-1
        role: text
        draft: false
        en: The plate shows neither a caliper nor a measurement session. Here, the instrument receives no answer.
        ru: На пластинке нет ни циркуля, ни сеанса измерений. Здесь инструмент остаётся без ответа.
