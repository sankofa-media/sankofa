  - id: versions
    kind: versions
    name:
      en: Where from
      ru: Откуда
    pictures:
      - versions
    blocks:
      - id: title
        role: title
        draft: false
        en: Where from
        ru: Откуда
      - id: text-0
        role: text
        draft: false
        en: "The ethnographer asked “where from” in earnest, and many answers accumulated. Here they are on the map.
          Watch the labels: every answer has a status."
        ru: "Вопрос «откуда» этнограф задал всерьёз, и на него накопилось много ответов. Вот они — на карте. Смотреть
          надо на ярлыки: у каждого ответа есть свой статус."
      - id: text-1
        role: text
        draft: false
        en: "The Ottoman slave trade, purchase by local princes, is the explanation researchers regard as the
          principal one: Markov (1913), Lily Golden-Hanga (1966), Pachulia (1964), Maan (2006), Bogdanov
          (2009) and Blakely (1986) supported it; the Abash family's accounts name Abashidze. Two independent
          accounts agree on the central point: both Markov's 1913 letter and Nutsa's 2003 account describe
          captivity through Turkey. Exact dates and numbers of people brought here are unknown; no purchase
          records have been found."
        ru: "Османская работорговля, покупка у местных князей — версия, которую исследователи считают главным
          объяснением: её придерживались Марков (1913) и Лили Голден-Ханга (1966), Пачулия (1964), Маан
          (2006), Богданов (2009), Блейкли (1986); семья Абаш в рассказах называет Абашидзе. Два независимых
          свидетельства сходятся здесь в главном: и письмо Маркова 1913 года, и рассказ Нуцы 2003-го описывают
          неволю через Турцию. Точные даты и число привезённых людей неизвестны; счета о покупке не найдены."
      - id: text-2
        role: text
        draft: false
        en: "A ship wrecked off the coast is a legend, recorded by several writers, beginning with Isakov, then
          Halliburton, then Nutsa herself. The vessel, date and passenger list are unknown. Herodotus's
          dark-skinned Colchians are a hypothesis as old as Herodotus's text (II.104), and as new as Patrick
          English's 1959 article, which explicitly connected ancient Colchians with modern villages. No one
          has demonstrated a bridge from antiquity to the families of the Kodor. A tsar's gift, later a
          version involving Peter and [[gannibal|Gannibal]]: in 1958 Shirin told a family story about people
          given away “like kittens”, without naming a monarch; the later association with Peter has no
          documentary support. Narts returning from Africa belong to epic legend. The account of Sudanese
          mercenaries in the Ottoman Empire remains unconfirmed."
        ru: "Корабль, разбившийся у берега, — легенда: её записывали несколько писателей, начиная с Исакова, потом
          Галлибёртон, потом сама Нуца. Судно, дата крушения и список пассажиров неизвестны. Темнокожие колхи
          у Геродота — гипотеза, старая, как сам текст Геродота (II.104), и новая, как статья Патрика Инглиша
          (1959): он прямо связал древних колхов с современными сёлами. Мост от античности к семьям Кодора не
          показан никем. Дар царя, позже — вариант с Петром и [[gannibal|Ганнибалом]]: Ширин в 1958 году
          рассказал семейную историю «как дарят котят», не называя никакого монарха; поздняя привязка к Петру
          документов не имеет. Нарты, вернувшиеся из Африки, — легенда эпоса. Рассказ о суданских наёмниках
          Османской империи пока не подтверждён."
      - id: text-3
        role: text
        draft: false
        en: The routes on the map do not meet at one point.
        ru: Маршруты на карте не встречаются в одной точке.
