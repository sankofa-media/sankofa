  - id: reverse-camera
    kind: reverse-camera
    name:
      en: Who is in the frame
      ru: Кто в кадре
    pictures:
      - reverse-camera
    blocks:
      - id: title
        role: title
        draft: false
        en: Who is in the frame
        ru: Кто в кадре
      - id: text-0
        role: text
        draft: false
        en: Look at who is in the frame. People who have been asked “where from” for two centuries look straight
          ahead. The camera is behind them, and through its lens — through the glass, in the glint — you are
          visible.
        ru: Посмотрите, кто в кадре. Люди, которых два века спрашивали «откуда», смотрят прямо. Камера стоит у них за
          спиной, и в объектив — сквозь стекло, в блике — видно вас.
      - id: text-1
        role: text
        draft: false
        en: "An older resident of the region refused to speak to a reporter and explained why: “I feel like an animal
          in a zoo” (Yuri Zotov's unnamed interviewee, AiF, 2020). But the question that broke the instruments
          is no longer addressed to him."
        ru: "Пожилой житель края отказался говорить с репортёром и объяснил почему: «я себя чувствую вроде зверя в
          зоопарке» (безымянный собеседник Юрия Зотова, «АиФ», 2020). Но вопрос, от которого ломались
          инструменты, сегодня адресован уже не ему."
      - id: text-2
        role: text
        draft: false
        en: It is not the people in the photograph who must explain themselves. Serzhputovsky placed himself in the
          picture to show a contrast in skin colour — that is what he wrote in the inventory. There he is, in
          the frame. Now he is the one to be explained.
        ru: Объяснять придётся не тем, кто на снимке. Сержпутовский встал в кадр сам, чтобы показать контраст цвета
          кожи, — так он записал в инвентаре. Вот он, в кадре. Теперь это его объяснять.
