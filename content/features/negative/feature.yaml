  - id: own
    kind: own
    name:
      en: At home
      ru: Свои
    pictures:
      - vine
      - tobacco
      - table
    blocks:
      - id: title
        role: title
        draft: false
        en: At home
        ru: Свои
      - id: text-0
        role: text
        draft: false
        en: There is testimony about how they lived. Shirin Abash of Adzyubzha was a tobacco grower and
          collective-farm organiser. A Zarya Vostoka reporter visited him in August 1958, and the issue of 17
          August printed his account of hungry years, a fern-roofed house and work. His daughter Nutsa studied
          medicine in Tbilisi and worked as an obstetrician-gynaecologist in Sukhum. American journalist
          Allison Tynes wrote about this in 1973; thirty years later Nutsa told an MK reporter herself. Both
          Allison Tynes and Yuri Zotov wrote about Shamil Chanba, an Adzyubzha resident and bus driver.
        ru: "Как жили — об этом есть свидетельства. Ширин Абаш из Адзюбжи — табаковод и организатор колхоза: в августе
          1958 года к нему приехал корреспондент «Зари Востока», и в номере от 17 августа напечатан его
          рассказ — о голодных годах, о доме, крытом папоротником, о работе. Его дочь Нуца училась на врача в
          Тбилиси и работала акушером-гинекологом в Сухуме: об этом в 1973 году писала американская
          журналистка Эллисон Тайнс, а через тридцать лет Нуца рассказала сама — корреспонденту «МК». О Шамиле
          Чанба, жителе Адзюбжи и водителе автобуса, писали Эллисон Тайнс и Юрий Зотов."
      - id: text-1
        role: text
        draft: false
        en: "These are people tending their own households: tobacco, vines trained up trees, a table. To that table —
          and onto this stage — comes the tamada."
        ru: "Это люди, которые сами ведут свой двор: табак, виноград на деревьях, стол. На стол — и на сцену — выходит
          тамада."
