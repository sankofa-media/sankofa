id: negative
order: 4
title:
  en: Negative. Abkhaz, of course
  ru: Негатив. Абхазкой, конечно
dek:
  en: A glass plate, a question, and people speaking for themselves.
  ru: Стеклянная пластинка, вопрос и люди, которые говорят сами.
reading:
  en: 25–35 minutes · optional sound
  ru: 25–35 минут · звук по желанию
cover: glass
scenes:
  - id: glass
    kind: glass
    name:
      en: Glass
      ru: Стекло
    pictures:
      - glass
    blocks:
      - id: title
        role: title
        draft: false
        en: Glass
        ru: Стекло
      - id: text-0
        role: text
        draft: false
        en: "At first there is only glass. Dark, smooth, with the faintest glint. Then a line appears: an outline,
          like the trace of a pen. It runs around faces, shoulders, folds of clothing; then colour flows into
          it — warm, flat, without shadows — and last comes the ground, gold all the way to the edges. The
          glass is turned over, and only then does the picture become itself."
        ru: "Сначала — только стекло. Тёмное, ровное, с едва заметным бликом. Потом на нём проступает линия: контур,
          как след пера. Линия обегает лица, плечи, складки одежды; потом в контур льётся цвет — тёплый,
          плоский, без теней; и последним встаёт фон, золотой, до самых краёв. Стекло переворачивают — и
          только тогда картина становится собой."
      - id: text-1
        role: text
        draft: false
        en: "This is how Senegalese reverse-glass painting, suwer, works: outline first, then colour, then ground, all
          viewed through the glass from the other side. A photographic plate, too, once had to be developed.
          This feature works like glass: it develops as you read, and once, it turns over."
        ru: "Так устроена сенегальская живопись под стеклом, сувер: сначала контур, потом заливка, потом фон, и
          смотрится всё сквозь стекло, с обратной стороны. Так когда-то проявляли фотопластинку. Этот выпуск
          устроен как стекло: он проявляется, пока вы читаете, и один раз — переворачивается."
      - id: text-2
        role: text
        draft: false
        en: On the plate is a family group in Adzyubzha. Men, women and children in Abkhaz dress outside a wooden
          house; behind the house, behind everyone, stands one more person. The names of the people in the
          family group are unknown.
        ru: На пластинке — семейная группа, Адзюбжа. Мужчины, женщины, дети в абхазском платье у деревянного дома; за
          домом, позади всех, стоит ещё один человек. Имена людей в семейной группе неизвестны.
      - id: text-3
        role: text
        draft: false
        en: "Nineteenth- and early twentieth-century texts called this community “Abkhazian Negroes”: ethnographers
          and newspapers used a word then regarded as scholarly. Today it is considered offensive. In this
          feature it appears only in quotations; our term is Afro-Abkhazians."
        ru: "В текстах девятнадцатого и начала двадцатого века эту общину называли «абхазские негры» — так писали
          этнографы и газеты, слово считалось тогда учёным. Сегодня оно считается оскорбительным. В этом
          выпуске оно появляется только в цитатах, а мы пишем: афроабхазы."
