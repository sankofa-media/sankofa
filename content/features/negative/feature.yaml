  - id: words
    kind: words
    name:
      en: The flip
      ru: Переворот
    pictures:
      - words-before
      - words-after
    blocks:
      - id: title
        role: title
        draft: false
        en: The flip
        ru: Переворот
      - id: text-0
        role: text
        draft: false
        en: "Now let us turn the glass over. Now those who were measured and questioned speak: Shirin, Nutsa, Shamil and Diana."
        ru: "А теперь стекло перевернём. Теперь говорят те, кого мерили и спрашивали: Ширин, Нуца, Шамиль и Диана."
      - id: text-1
        role: text
        draft: false
        en: "Shirin Abash, interviewed by A. Kiknadze, Zarya Vostoka, 17 August 1958: “And all these years I have
          lived on Abkhaz soil.” And from the same answer: “The officials did not even regard us as people.”"
        ru: "Ширин Абаш, интервью А. Кикнадзе, «Заря Востока», 17 августа 1958 года: «И все эти годы живу я на
          абхазской земле». И ещё из того же ответа: «А нас чиновники и за людей не считали»."
      - id: text-2
        role: text
        draft: false
        en: "Nutsa Abash, interviewed by MK, 2003, asked about her ancestors: “To be honest, I don't know.” About
          Semyon: “At first we simply wrote to each other.” And you have already heard her answer to whether
          she was Abkhaz: it stands at the beginning of this feature and will remain at the end."
        ru: "Нуца Абаш, интервью «МК», 2003 год — на вопрос о предках: «Честно скажу — не знаю». О Семёне: «Мы с ним
          сначала просто переписывались». И на вопрос, абхазка ли она, вы уже слышали ответ — он стоит в
          начале выпуска и останется в конце."
      - id: text-3
        role: text
        draft: false
        en: "Nutsa Abash, speaking with Allison Tynes, Afro-American, 17 February 1973: “I have never encountered
          anything but respect.”"
        ru: "Нуца Абаш, беседа с Эллисон Тайнс, Afro-American, 17 февраля 1973 года (перевод с английского): «Я
          никогда не встречала ничего, кроме уважения»."
      - id: text-4
        role: text
        draft: false
        en: "Shamil Chanba, a conversation around 1995 recalled by Yuri Zotov (AiF, 2020): “I was born in the
          Caucasus!” And: “I am a Caucasian person.”"
        ru: "Шамиль Чанба, разговор около 1995 года в воспоминании Юрия Зотова («АиФ», 2020): «Я родился на Кавказе!»
          И ещё: «Я кавказский человек»."
      - id: text-5
        role: text
        draft: false
        en: "Diana Bobyleva, Sputnik, 2017, about her grandmother Nutsa: “now I am the one telling it.” About her
          great-grandfather Shirin, recalling family memory: “My great-grandfather was deeply respected by his
          neighbours.”"
        ru: "Диана Бобылева, «Спутник», 2017 год, о бабушке Нуце: «теперь её рассказываю я». О прадеде Ширине, по
          памяти семьи: «Моего прадеда глубоко уважали соседи»."
      - id: text-6
        role: text
        draft: false
        en: "In Fazil Iskander's novel Sandro of Chegem (1989 edition), the tamada says: “we are Abkhazians.” This is
          the voice of a fictional character."
        ru: "В романе Фазиля Искандера «Сандро из Чегема» (издание 1989 года) тамада говорит: «мы — абхазцы». Это
          голос литературного героя."
