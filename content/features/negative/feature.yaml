  - id: form
    kind: form
    name:
      en: The form
      ru: Анкета
    pictures:
      - form
      - form-torn
    blocks:
      - id: title
        role: title
        draft: false
        en: The form
        ru: Анкета
      - id: text-0
        role: text
        draft: false
        en: "The form ends with its main question: “Where are you from?” Type something. The form answers for itself,
          in the words Nutsa Abash spoke to an MK reporter in 2003: “Abkhaz, of course. I was born and grew up
          here. This is my home…”"
        ru: "В конце анкеты — главная графа: «Откуда вы?» Наберите что-нибудь. Анкета отвечает сама — словами Нуцы
          Абаш, сказанными корреспонденту «МК» в 2003 году: «Абхазкой, конечно. Я здесь родилась и выросла.
          Это — мой дом...»"
      - id: text-1
        role: text
        draft: false
        en: The form does not know how to record an answer like that. It opens across the screen, its ruled lines
          break, and the box remains empty. It will remember this answer until the end of the feature.
        ru: Такой ответ анкета записать не умеет. Бланк раскрывается на весь экран, линовка ломается, графа остаётся
          пустой. Этот ответ она будет помнить до конца выпуска.
