        ru: Человек за группой
      - id: text-0
        role: text
        draft: false
        en: Adzyubzha, 1912. The plate's author was A. K. Serzhputovsky. He placed himself in the picture to show a
          contrast in skin colour — that is what he wrote in the inventory. Kovalevsky published the
          photograph in 1914. Usually the photographer remained on this side of the glass. For the first few
          minutes of this feature, you see through his eyes.
        ru: Адзюбжа, 1912 год. Автор пластинки — А. К. Сержпутовский. Сержпутовский встал в кадр сам, чтобы показать
          контраст цвета кожи, — так он записал в инвентаре. В 1914 году снимок опубликовал Ковалевский.
          Обычно фотограф оставался по эту сторону стекла. Первые минуты выпуска вы смотрите его глазами.
      - id: text-1
        role: text
        draft: false
        en: The ethnographer arrived with instruments. Now they are in your hands, too.
        ru: Этнограф приехал с инструментами. Они у вас теперь тоже есть.
