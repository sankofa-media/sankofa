  - id: river
    kind: river
    name:
      en: The Kodor
      ru: Кодор
    pictures:
      - river
    blocks:
      - id: title
        role: title
        draft: false
        en: The Kodor
        ru: Кодор
      - id: text-0
        role: text
        draft: false
        en: "The Kodor comes down from the mountains and reaches the sea. Below, at its mouth on the coastal plain,
          are the villages of this story. Gold marks Adzyubzha, where the photograph was taken and where
          outsiders came twice, in different years, to record conversations. The second gold point is Sukhum:
          Nutsa lived and worked there. The other names — Kyndyg, Tamysh, Pokvesh, Merkula, Chlou, Tkhina,
          Reka, Ilor and Achandara — appear in lists and retellings, but the evidence for the community in
          each village has not yet been independently confirmed. These names are marked with dotted lines."
        ru: "Кодор выходит из гор и ложится в море. Внизу, у устья, на приморской равнине — сёла, о которых пойдёт
          речь. На карте золотом отмечена Адзюбжа, село, где сделан снимок и куда дважды, в разные годы,
          приезжали чужие записывать разговоры. Вторая золотая точка — Сухум: там жила и работала Нуца.
          Остальные имена — Кындыг, Тамыш, Поквеш, Меркула, Члоу, Тхина, Река, Илор, Ачандара — встречаются в
          списках и пересказах, но сведения об общине в каждом из этих сёл пока не подтверждены независимо.
          Эти названия нанесены пунктиром."
      - id: text-1
        role: text
        draft: false
        en: "The gold points open recordings of Abkhaz polyphonic singing from Melodiya's official album, played in
          the docked player. This is the music of the region, not the voices of the people in the photograph:
          no such recording survives."
        ru: "Золотые точки открывают записи абхазского многоголосия — официальный альбом «Мелодии», они звучат в
          закреплённом плеере. Это музыка края, а не голоса людей со снимка: такой записи не сохранилось."
