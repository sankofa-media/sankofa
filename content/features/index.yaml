# Special projects: multimedia longreads told in scenes.
# Each feature is a folder next to this file (feature.yaml, its data files).
# `order` is the order of the list; a folder not named here is not built.
# `ui` holds the labels of the engine itself (shared by every feature).
#
# Every feature built from this list also gets, with no further work, its
# own pages /features/<id>/ and /ru/features/<id>/ with search and
# link-preview metadata and JSON-LD, a 1200x630 preview picture drawn from
# its cover, its entries in sitemap.xml, llms.txt, llms-full.txt and the
# features.atom feeds (web/scripts/seo). The description is the dek, cut to
# about 160 characters. A feature may set its own, optionally:
#   seo:
#     description: {en: "...", ru: "..."}   # about 160 characters
#     image: some-file.webp                 # a file in its art/ folder
order:
  - sea-lion-girls
  - forever-changes
  - angel

ui:
  list-kicker: {en: "Features", ru: "Спецпроекты"}
  list-title: {en: "Special projects", ru: "Спецпроекты"}
  list-dek:
    en: "Long stories to read and to listen to, one scene at a time."
    ru: "Большие истории, которые читают и слушают — сцена за сценой."
  open: {en: "Begin", ru: "Начать"}
  back: {en: "All features", ru: "Все спецпроекты"}
  close: {en: "Close", ru: "Закрыть"}
  sound: {en: "Sound", ru: "Звук"}
  sound-on: {en: "Clap on", ru: "Хлопок включён"}
  sound-off: {en: "Clap off", ru: "Хлопок выключен"}
  scenes: {en: "Scenes", ru: "Сцены"}
  scene: {en: "Scene", ru: "Сцена"}
  draft:
    en: "Draft text: the final version is being written."
    ru: "Черновой текст: окончательная версия пишется."
  loading: {en: "Loading…", ru: "Загружается…"}
  error:
    en: "This feature could not be loaded. Try again."
    ru: "Не удалось загрузить спецпроект. Попробуйте ещё раз."
  retry: {en: "Try again", ru: "Попробовать ещё раз"}
