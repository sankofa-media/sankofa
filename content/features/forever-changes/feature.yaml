        en: "The Daily Planet is the newspaper Superman works for. In Lee’s song it is an ordinary man’s day: getting up, the news, work, the same again tomorrow, and a man who has long stopped believing in any of it. It is the one recording from that first day that stayed on the record: the session players laid down the track, and the band added its own parts on top."
