        - { file: alone-again-or-r2-instruments.webp, depth: 6, alt: "" }
        - { file: alone-again-or-r2-chair.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side A · 1 · Bryan MacLean
        ru: Сторона A · 1 · Брайан Маклин
      - id: title
        role: title
        draft: false
        en: Alone Again Or
        ru: Alone Again Or
      - id: lede
        role: lede
        draft: false
        en: "The record opens not with Lee but with Bryan MacLean, Love’s rhythm guitarist, who wrote the song and sings it, straight and without vibrato. A Spanish guitar comes in, then strings and a trumpet out of a Mexican band. The man in the song could love the whole world, waits and waits, and every time ends up alone. The title, “Alone again, or…”, breaks off on “or”: the other outcome is never named."
        ru: "Первую песню на пластинке написал и спел не Ли, а ритм-гитарист Love Брайан Маклин. Поёт он ровно, совсем без вибрато. Вступает испанская гитара, за ней струнные и труба, как в мексиканском оркестре. Человек в песне готов любить весь мир, ждёт и ждёт — и каждый раз остаётся один. Название, «Опять один, или…», обрывается на слове «или»: другой исход в нём так и не назван."
      - id: spanish
        role: text
        draft: false
        en: "The Spanish sound came from Echols’s guitar. He was warming up with flamenco runs, and Angel suggested putting them into Bryan’s song. The trumpet came from the radio: Herb Alpert’s Tijuana Brass were everywhere on the air then, and Botnick decided to borrow their trumpet sound but make it more Spanish than Mexican."
        ru: "Испанское звучание песне дала гитара Эколса. Разминая пальцы, он наигрывал пассажи в духе фламенко, и Энджел предложил вписать их в песню Брайана. Мысль о трубе подсказало радио: в эфире тогда без конца звучали Herb Alpert & the Tijuana Brass, и Ботник решил взять у них звучание трубы, но сделать его скорее испанским, чем мексиканским."
      - id: echols-banjo
        role: quote
        draft: false
        en: At first it was a banjo song. “Why don’t you play those runs in Bryan’s song?” Angel asked.
        ru: "Поначалу Маклин пел эту песню под банджо. «А почему бы тебе не сыграть эти пассажи в песне Брайана?» — спросил Энджел Эколса."
        lens: echols
      - id: botnick-spanish
        role: quote
        draft: false
        en: “Tijuana Brass was big on the radio … more Spanish than Mexican.”
        ru: "«Тогда по радио всюду звучали Tijuana Brass, и я подумал, что можно взять что-то от их звучания, не копируя впрямую: сделать его скорее испанским, чем мексиканским»."
        lens: botnick
      - id: stuart-title
        role: quote
        draft: false
        en: Asked what the song was called, Bryan said, “Well, ‘Alone Again’… or…”, and Arthur said that would be the title.
        ru: "Брайана спросили, как называется песня. «Ну, наверное, „Alone Again“… или…» И Артур сказал: так и назовём."
        lens: stuart-ware
      - id: afterlife
        role: text
        draft: false
        en: It is the best-known song on the album. UFO, the Damned and Calexico covered it, and the director Wes Anderson put it in his first film, “Bottle Rocket”.
        ru: "Это самая известная песня альбома. Её перепевали UFO, The Damned и Calexico, а режиссёр Уэс Андерсон поставил её в свой первый фильм, «Бутылочная ракета»."
    differ: true

  - id: a-house-is-not-a-motel
