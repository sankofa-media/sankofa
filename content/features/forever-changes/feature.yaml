    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Prologue · 1945–1967
        ru: Пролог · 1945–1967
      - id: title
        role: title
        draft: false
        en: The boy from Memphis
        ru: Мальчик из Мемфиса
      - id: lede
        role: lede
        draft: false
        en: "Arthur Lee was born in Memphis on 7 March 1945. His mother, Agnes, taught school; his father, Chester Taylor, played the trumpet. As a boy he came to Los Angeles, to West Adams, and grew up there under his stepfather’s name, Clinton Lee. Memphis, he remembered, was segregated, and the memory stayed: a band where Black and white musicians played together was his idea from the very start."
        ru: "Артур Ли родился в Мемфисе 7 марта 1945 года. Его мать, Агнес, была учительницей, а отец, Честер Тейлор, играл на трубе. Ещё ребёнком он попал в Лос-Анджелес, в район Уэст-Адамс, и вырос там под фамилией отчима, Клинтона Ли. В Мемфисе, вспоминал он потом, была сегрегация, и он этого не забыл: с первых шагов в музыке он хотел, чтобы в его группе чёрные и белые музыканты играли вместе."
      - id: dorsey
        role: text
        draft: false
        en: At Dorsey High he was a basketball player before he was a musician. He started making music with his childhood friend Johnny Echols, and by 1963 they had a band and a first single. A year later Lee wrote “My Diary” for the singer Rosa Lee Brooks, and a young Jimi Hendrix played the guitar on it.
        ru: "В старшей школе Дорси он сначала играл в баскетбол и только потом занялся музыкой. Начинал он вместе с другом детства Джонни Эколсом, и к 1963 году у них уже были своя группа и первый сингл. Через год Ли написал «My Diary» для певицы Розы Ли Брукс, и на гитаре в этой записи сыграл молодой Джими Хендрикс."
      - id: byrds
        role: text
        draft: false
        en: In 1965 Lee saw the Byrds at Ciro’s on the Sunset Strip, and everything fell into place. He left [[rhythm-and-blues|rhythm and blues]] for folk rock, brought in the guitarist Bryan MacLean, who had worked as a roadie for the Byrds, and called the band Love; the name Grass Roots had already been taken.
        ru: "В 1965 году Ли увидел The Byrds в клубе Ciro's на Сансет-Стрип и понял, чего хочет. Он ушёл от [[rhythm-and-blues|ритм-н-блюза]] к фолк-року, позвал гитариста Брайана Маклина, который работал у The Byrds техником, и назвал группу Love. Название Grass Roots к тому времени было уже занято."
      - id: name-lee
        role: quote
        draft: false
        en: "The word came to him on the freeway: rather than hate the people who took your name, “maybe you should love them.”"
        ru: "Слово «любовь» пришло Ли в голову на шоссе: вместо того чтобы ненавидеть тех, кто увёл у тебя название, «может, их стоит полюбить»."
        lens: lee
      - id: name-billboard
        role: quote
        draft: false
        en: Echols and MacLean remembered a billboard for Luv brassieres on Melrose.
        ru: "Эколс и Маклин вспоминали другое: рекламный щит бюстгальтеров Luv на Мелроуз-авеню."
        lens: echols
      - id: holzman
        role: text
        draft: false
        en: At Bido Lito’s in Hollywood they were heard by Jac Holzman, whose label Elektra had until then put out folk records. Love became the first rock band he signed. The singles “My Little Red Book” and “7 and 7 Is” reached the charts, and the band moved into the Castle, a run-down mansion in Los Feliz where they lived together, played together and took a great many drugs.
        ru: "В клубе Bido Lito's в Голливуде их услышал Джек Хольцман, владелец Elektra; до тех пор его лейбл выпускал фолк-пластинки. Love стали первой рок-группой, которую он подписал. Песни выходили одна за другой, синглы «My Little Red Book» и «7 and 7 Is» попали в чарты, а сама группа поселилась в «Замке» — обветшалом особняке в Лос-Фелисе, где музыканты жили вместе, вместе играли и принимали очень много наркотиков."
      - id: holzman-saw
        role: quote
        draft: false
        en: "“Thirty seconds into their version of ‘Hey Joe’, I knew this was the group I was looking for.” Bido Lito’s itself he remembered as “a scene from Dante’s Inferno”."
        ru: "Хольцман вспоминал: «Они заиграли „Hey Joe“, и через тридцать секунд я понял: вот она, группа, которую я искал». А сам клуб Bido Lito's он запомнил как сцену из „Ада“ Данте."
        lens: holzman
      - id: tour
        role: text
        draft: false
        en: "Love hardly ever left Los Angeles, and Echols, Holzman and Lee himself each explained why in his own way."
        ru: "Из Лос-Анджелеса Love почти не уезжали. Почему — Эколс, Хольцман и сам Ли объясняли каждый по-своему."
      - id: tour-echols
        role: quote
        draft: false
        en: “We were a mixed-race group in the sixties … all of the South, most of Middle-America, and many parts of the Midwest as well were simply off-limits to us.”
        ru: "«В нашей группе играли и белые, и чёрные, а на дворе были шестидесятые. Весь Юг, бо́льшая часть Средней Америки и многие места на Среднем Западе были для нас просто закрыты»."
        lens: echols
      - id: tour-holzman
        role: quote
        draft: false
        en: “He was jealous of The Doors’ success … But he wouldn’t travel far from his perch in LA.”
        ru: "«Он завидовал успеху The Doors. Но от своего насиженного места в Лос-Анджелесе далеко не уезжал»."
        lens: holzman
      - id: tour-lee
        role: quote
        draft: false
        en: "Touring meant going out to “eat shit”, and he wasn’t having it: “I always thought that if something was good, it would get through anyway.”"
        ru: "Для Ли гастроли значили «жрать дерьмо», и на это он не соглашался: «Я всегда думал: если вещь хорошая, она и так пробьётся»."
        lens: lee
      - id: dacapo
        role: text
        draft: false
        en: The second album, “Da Capo”, came out early in 1967, with one long piece, “Revelation”, filling its second side; it got no higher than number 80. San Francisco would call that summer the Summer of Love, and the band called Love was falling apart.
        ru: "Второй альбом, «Da Capo», вышел в начале 1967 года, и всю его вторую сторону занимала одна длинная вещь, «Revelation». В чарте пластинка поднялась только до восьмидесятого места. Лето 1967-го в Сан-Франциско назовут «летом любви», а группа под названием Love в это время разваливалась."

