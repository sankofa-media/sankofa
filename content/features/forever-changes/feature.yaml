        draft: false
        en: The Good Humor Man He Sees Everything Like This
        ru: The Good Humor Man He Sees Everything Like This
      - id: lede
        role: lede
        draft: false
        en: "After the grim “Live and Let Live”, childhood. Good Humor is the ice-cream van that drives through American streets in summer, and its driver sees everyone and everything. The strings are plucked, the orchestra is light as an old film, and Lee sings like a jazz singer. For three minutes the album remembers that the world can be kind."
        ru: "После мрачной «Live and Let Live» — детство. Good Humor — это фургончик с мороженым, который летом объезжает американские кварталы, а его продавец видит всех и всё. Струнные играют пиццикато, оркестр звучит легко, как в старом кино, и Ли поёт, как джазовый певец. На три минуты альбом напоминает, что мир бывает добрым."
      - id: echols-moody
        role: quote
        draft: false
        en: "Its root is [[jazz|jazz]] vocalese: “This song is a beautifully written homage to James Moody and King Pleasure.”"
        ru: "Песня выросла из [[jazz|джазового]] вокализа: «Это прекрасно написанное посвящение Джеймсу Муди и Кингу Плежеру» — двум джазовым музыкантам, которые прославились именно вокализами."
        lens: echols
      - id: stuart-suit
        role: quote
        draft: false
        en: Arthur teased Bryan, “Why do you always write about happy shit?”, and called Bryan’s white suit his “Good Humor Man suit”.
        ru: "Артур дразнил Брайана: «Почему ты всё время пишешь про счастливую хрень?» — а белый костюм Брайана прозвал «костюмом мороженщика»."
        lens: stuart-ware
    differ: true

