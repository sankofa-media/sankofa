    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: From 1968 to now
        ru: С 1968 года до наших дней
      - id: title
        role: title
        draft: false
        en: "How the album became a classic"
        ru: "Как альбом стал классикой"
      - id: lede
        role: lede
        draft: false
        en: The record that didn’t sell at home became one of the most revered in [[rock-n-roll|rock]] history. Rolling Stone put it at number 40 among the 500 greatest albums; it is in the Grammy Hall of Fame and in the Library of Congress’s National Recording Registry.
        ru: "Пластинка, которую в Америке почти не покупали, стала одной из самых почитаемых в истории [[rock-n-roll|рока]]. Rolling Stone поставил её на сороковое место среди пятисот величайших альбомов; она включена в Зал славы «Грэмми» и в Национальный реестр звукозаписей Библиотеки Конгресса."
      - id: influence
        role: text
        draft: false
        en: "It mattered most in England. Led Zeppelin, Echo and the Bunnymen, and Siouxsie and the Banshees named Love among their influences, and the Clash, Botnick says, were crazy about this album."
        ru: "Сильнее всего альбом повлиял на английских музыкантов. Led Zeppelin, Echo and the Bunnymen, Siouxsie and the Banshees называли Love среди тех, кто на них повлиял, а The Clash, по словам Ботника, были от этого альбома без ума."
      - id: bell
        role: quote
        draft: false
        en: "Andy Bell, the guitarist of Ride: “It’s a dark album, and good music can be dark and still uplifting. Love were on the front line.”"
        ru: "Энди Белл, гитарист группы Ride: «Это тёмный альбом, а хорошая музыка может быть тёмной и всё равно поднимать дух. Love были на передовой»."
        lens: critics
      - id: screen
        role: text
        draft: false
        en: “Alone Again Or” plays in Wes Anderson’s “Bottle Rocket” and at the end of the first season of “Russian Doll”. And Johnny Echols still plays the whole album with his Love Band.
        ru: "«Alone Again Or» звучит в «Бутылочной ракете» Уэса Андерсона и в финале первого сезона сериала «Жизнь на повторе». А Джонни Эколс до сих пор играет альбом целиком со своей группой Love Band."
      - id: echols-on
        role: quote
        draft: false
        en: “Forever Changes could only have happened in Los Angeles. And only at that particular moment in time.”
        ru: «Forever Changes мог случиться только в Лос-Анджелесе. И только в тот самый момент».
        lens: echols
    differ: true

