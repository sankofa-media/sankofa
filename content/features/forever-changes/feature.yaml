        - { file: a-house-is-not-a-motel-v2-rain-mud.webp, depth: 6, alt: "" }
        - { file: a-house-is-not-a-motel-v2-boots.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side A · 2 · Arthur Lee
        ru: Сторона A · 2 · Артур Ли
      - id: title
        role: title
        draft: false
        en: A House Is Not a Motel
        ru: A House Is Not a Motel
      - id: lede
        role: lede
        draft: false
        en: "Straight after the love song comes the war. One night in a San Francisco club a soldier back from Vietnam sat down with Lee and Echols and told them what it was like. One thing he said stayed in Lee’s head: blood mixed with mud turns grey."
        ru: "Сразу после песни о любви приходит война. Однажды в клубе в Сан-Франциско к Ли и Эколсу подсел солдат, вернувшийся из Вьетнама, и рассказал, какая она там. Одна его фраза осталась у Ли в голове: кровь, смешанная с грязью, становится серой."
      - id: song
        role: text
        draft: false
        en: "That line grew into a song that is less a story than a run of visions: blood and mud, schools that teach war, the news going on while the city goes about its day. It opens on a quiet acoustic guitar and builds into the hardest [[rock-n-roll|rock]] on the record; at the end Echols’s two guitars lock horns, and everything stops dead."
        ru: "Из этой фразы выросла песня — не рассказ, а череда видений: кровь и грязь, школы, где учат воевать, новости, которые идут своим чередом, пока город живёт обычной жизнью. Она начинается тихой акустикой и разгоняется до самого жёсткого [[rock-n-roll|рока]] на пластинке. В конце две гитары Эколса сцепляются друг с другом — и всё обрывается."
      - id: echols-soldier
        role: quote
        draft: false
        en: “This soldier … sat down with us … Things like how mixed blood turns grey. He said that, and it became the basis for ‘A House Is Not A Motel’.”
        ru: «Он подсел к нам и стал рассказывать. Вроде того, что смешанная кровь становится серой. Это и легло в основу „A House Is Not a Motel“».
        lens: echols
    differ: false

