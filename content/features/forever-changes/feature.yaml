        - { file: a-house-is-not-a-motel-r2-rain-mud.webp, depth: 6, alt: "" }
        - { file: a-house-is-not-a-motel-r2-boots.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side A · 2 · Arthur Lee
        ru: Сторона A · 2 · Артур Ли
      - id: title
        role: title
        draft: false
        en: A House Is Not a Motel
        ru: A House Is Not a Motel
      - id: lede
        role: lede
        draft: false
        en: "Straight after the love song comes the war. One night in a San Francisco club a soldier back from Vietnam sat down with Lee and Echols and told them what it was like. One thing he said stayed in Lee’s head: blood mixed with mud turns grey."
        ru: "Сразу после песни о любви приходит война. Однажды в клубе в Сан-Франциско к Ли и Эколсу подсел солдат, вернувшийся из Вьетнама, и рассказал, что там творится. Одна его фраза осталась у Ли в голове: кровь, смешанная с грязью, становится серой."
      - id: song
        role: text
        draft: false
        en: "That line grew into a song that is less a story than a run of visions: blood and mud, schools that teach war, the news going on while the city goes about its day. It opens on a quiet acoustic guitar and builds into the hardest [[rock-n-roll|rock]] on the record; at the end Echols’s two guitars lock horns, and everything stops dead."
        ru: "Из этой фразы выросла песня без связного сюжета: картины сменяют одна другую — кровь и грязь, школы, где учат воевать, новости, которые идут своим чередом, пока город живёт обычной жизнью. Начинается она с тихой акустической гитары, а к концу становится самой жёсткой [[rock-n-roll|рок-песней]] альбома: две соло-гитары Эколса спорят друг с другом, и музыка резко обрывается."
      - id: echols-soldier
        role: quote
        draft: false
        en: “This soldier … sat down with us … Things like how mixed blood turns grey. He said that, and it became the basis for ‘A House Is Not A Motel’.”
        ru: "«Этот солдат подсел к нам и стал рассказывать. Говорил что-то вроде: кровь, смешавшись с грязью, становится серой. Так он и сказал, и это легло в основу „A House Is Not a Motel“»."
        lens: echols
    differ: false

  - id: andmoreagain
    kind: song
    decay: 0.5
    name: { en: "Andmoreagain", ru: "Andmoreagain" }
    alias: { en: "And more again and more again", ru: "И снова и снова и снова" }
    song: { n: 3, side: a, title: "Andmoreagain", writer: "Arthur Lee", length: "3:15" }
    lenses:
      - lee
      - stuart-ware
      - botnick
    differ: true
    visions: [ rose, chairs ]
    art:
      generated: true
      layers:
        - { file: andmoreagain-r2-plate.webp, alt: { en: "A young man at the foot of a curving staircase looks up at a woman in a red dress on the landing", ru: "Молодой человек у подножия изогнутой лестницы смотрит вверх, на женщину в красном платье на площадке" } }
        - { file: andmoreagain-r2-upstairs.webp, depth: 8, role: figure, alt: "" }
        - { file: andmoreagain-r2-downstairs.webp, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side A · 3 · Arthur Lee
        ru: Сторона A · 3 · Артур Ли
      - id: title
        role: title
        draft: false
        en: Andmoreagain
        ru: Andmoreagain
      - id: lede
        role: lede
        draft: false
        en: "The gentlest song on the album: slow, with the strings wrapped around the voice. A man promises tenderness, and the three words of the title are written as one, like a promise said over and over: and more, again."
        ru: "Самая нежная песня альбома: медленная, и струнные будто обнимают голос. Человек обещает нежность, и три слова названия написаны слитно, как обещание, которое повторяют без конца: «и ещё раз, и снова»."
      - id: session
        role: text
        draft: false
        en: "It is one of the two songs cut on the first day, 1 August, when the Wrecking Crew played in the band’s place. Botnick, the Los Angeles Times and the notes to the reissue say that take is the one on the record; Stuart-Ware remembers that the band later recorded it again themselves. Echols adds that the tape was sped up a little to lift Lee’s voice."
        ru: "Это одна из двух песен, записанных в первый день, 1 августа, когда вместо группы в студии играли музыканты Wrecking Crew. Ботник, газета Los Angeles Times и примечания к переизданию утверждают, что на пластинке осталась именно та запись; Стюарт-Уэр помнит, что потом группа перезаписала песню сама. Эколс добавляет, что плёнку слегка ускорили, чтобы голос Ли зазвучал выше."
      - id: words
        role: text
        draft: false
        en: "The words are simple: the man promises love again and more again and keeps telling her she does not know how much he loves her. Lee sings softly, at the slow pace of a ballad, with the strings close around him. Reviewing the album for Rolling Stone in 1968, Jim Bickhart counted “Andmoreagain” among its good songs."
        ru: "Слова простые: герой обещает любить ещё и ещё и всё повторяет, что она даже не знает, как сильно он её любит. Ли поёт негромко, в неспешном темпе баллады, и струнные звучат совсем рядом с голосом. В рецензии на альбом в Rolling Stone в 1968 году Джим Бикхарт назвал «Andmoreagain» среди удачных песен пластинки."
      - id: origin
        role: quote
        draft: false
        en: "In 1975 Lee said he wrote it out of a bummer: he was upstairs with a girl he liked, and the next thing he knew she was downstairs in bed with Bryan MacLean."
        ru: "В 1975 году Ли рассказывал, что написал эту песню с досады: он сидел наверху с девушкой, которая ему нравилась, а не успел оглянуться, как она уже была внизу, в постели у Брайана Маклина."
        lens: lee
      - id: stuart-redone
        role: quote
        draft: false
        en: "“‘Andmoreagain’ was redone by us.” And Stuart-Ware overplayed a fill: “It was a mistake I was hoping I would have the opportunity to correct during the next take, but the next take never came.”"
        ru: "«„Andmoreagain“ мы потом перезаписали сами». А в одной сбивке Стюарт-Уэр перестарался: «Я надеялся исправить ошибку в следующем дубле, но следующего дубля так и не было»."
        lens: stuart-ware
      - id: botnick-two
        role: quote
        draft: false
        en: “The two songs I recorded with the Wrecking Crew ended up on the album.”
        ru: «Две песни, которые я записал с Wrecking Crew, в итоге попали на альбом».
        lens: botnick

