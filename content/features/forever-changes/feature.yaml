  - id: session-day
    kind: session
    decay: 0.15
    name: { en: "The session players' day", ru: "День студийных музыкантов" }
    lenses:
      - botnick
      - echols
      - stuart-ware
      - holzman
    differ: true
    visions: [ chairs, tape-reel ]
    art:
      generated: true
      layers:
        - { file: strangers-in-our-chairs-r2-plate.webp, alt: { en: "Session musicians play in a recording studio while a group of young musicians watch from the doorway", ru: "Студийные музыканты играют в студии звукозаписи, а молодые музыканты группы смотрят на них из дверей" } }
        - { file: strangers-in-our-chairs-r2-session-players.webp, depth: 6, alt: "" }
        - { file: strangers-in-our-chairs-r2-band.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1 August 1967 · Sunset Sound
        ru: 1 августа 1967 года · Sunset Sound
      - id: title
        role: title
        draft: false
        en: "Session players instead of the band"
        ru: "Вместо группы — студийные музыканты"
      - id: lede
        role: lede
        draft: false
        en: "The engineer Bruce Botnick was to produce the third album with Neil Young of Buffalo Springfield, but Young dropped out before it began. On the first day the members of Love walked into Sunset Sound and found strangers in their places: the best session players in Los Angeles, the crew that would later be called the Wrecking Crew. They were there to record Lee’s songs instead of his own band."
        ru: "Третий альбом должен был продюсировать звукорежиссёр Брюс Ботник вместе с Нилом Янгом из Buffalo Springfield, но Янг отказался ещё до начала работы. В первый день записи музыканты Love вошли в студию Sunset Sound и увидели, что на их местах сидят чужие: лучшие студийные музыканты Лос-Анджелеса, команда, которую потом назовут Wrecking Crew. Им предстояло записать песни Ли вместо его собственной группы."
      - id: botnick-why
        role: quote
        draft: false
        en: “They couldn’t play, basically … I did a little shock value … I did it intentionally, to shock the band into getting serious.”
        ru: "«Играть они, по сути, не могли. Я устроил небольшую встряску, и сделал это нарочно: хотел, чтобы группа наконец взялась за дело всерьёз»."
        lens: botnick
      - id: botnick-cry
        role: quote
        draft: false
        en: “I remember Bryan sitting there crying.”
        ru: «Помню, Брайан сидел и плакал».
        lens: botnick
      - id: echols-why
        role: quote
        draft: false
        en: The album was meant to be a double, and Elektra decided it cost too much. Bryan sulked and staged “a minor mutiny”, and “Jac Holzman decided to show us who was in charge.”
        ru: "Альбом задумывали двойным, но Elektra решила, что это слишком дорого. Брайан обиделся и «устроил небольшой бунт», а «Джек Хольцман решил показать нам, кто здесь главный»."
        lens: echols
      - id: echols-ten
        role: quote
        draft: false
        en: “They played for maybe less than 10 minutes and we knew that it just could not work.”
        ru: «Они играли, может, меньше десяти минут, и мы поняли, что так ничего не выйдет».
        lens: echols
      - id: stuart-booth
        role: quote
        draft: false
        en: “I look up in the booth and I see Arthur huddling with Bruce Botnick and the Elektra rep”, and then came the idea “to go ahead and bring studio cats in”, to save everyone money.
        ru: "«Поднимаю глаза на аппаратную и вижу: Артур шепчется с Брюсом Ботником и человеком из Elektra». Потом прозвучала идея «позвать студийных ребят» — чтобы всем сэкономить деньги."
        lens: stuart-ware
      - id: stuart-chairs
        role: quote
        draft: false
        en: "“We all walk in and there are strangers in our chairs.” Jim Gordon, one of the busiest session drummers in Los Angeles, was behind Stuart-Ware’s drums. “It was an honor to have him replace me, but painful, nonetheless.”"
        ru: "«Мы входим, а на наших местах сидят чужие». За барабанами Стюарт-Уэра сидел Джим Гордон, один из самых востребованных студийных барабанщиков Лос-Анджелеса. «Честь, что меня заменил именно он. Но всё равно было больно»."
        lens: stuart-ware
      - id: holzman-why
        role: quote
        draft: false
        en: “The album was plagued by internal problems within the band and lack of preparation … It clearly wasn’t happening.”
        ru: "«Записи альбома мешали раздоры внутри группы и неподготовленность. Было ясно, что дело не идёт»."
        lens: holzman
      - id: back
        role: text
        draft: false
        en: "The session players cut two songs, and the band asked for a second chance. Botnick remembers that he and Arthur exchanged a wink and gave it. The drummer Michael Stuart-Ware remembers a call from the man at Elektra the next day: the professionals had come out “too plastic”. Echols remembers bonuses all round. Either way, ten days later Love were back in the studio, making the album themselves."
        ru: "Студийные музыканты записали две песни, и группа попросила дать ей ещё один шанс. Ботник вспоминает, что они с Артуром переглянулись, подмигнули друг другу и согласились. Барабанщик Майкл Стюарт-Уэр — что на следующий день позвонил человек из Elektra и сказал, что у профессионалов вышло «слишком пластмассово». Эколс — что всем выдали премии. Так или иначе, через десять дней Love вернулись в студию и записали альбом сами."

