    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Through his eyes
        ru: Его глазами
      - id: lede
        role: lede
        draft: false
        en: From his hill above Los Angeles he saw the same city as everyone else, and saw sirens, death, delirium and beauty in it all at once. Take your phone, point the camera at your room, and see what this album does to it.
        ru: С холма над Лос-Анджелесом он видел тот же город, что и все, — и видел в нём сирены, смерть, бред и красоту сразу. Возьмите телефон, наведите камеру на свою комнату и посмотрите, что с ней сделает этот альбом.
      - id: privacy
        role: line
        draft: false
        en: Everything happens on your phone. The camera picture goes nowhere.
        ru: Всё происходит в вашем телефоне. Изображение с камеры никуда не уходит.
    differ: false
