      - id: lede
        role: lede
        draft: false
        en: "Here the album reaches the bottom. Lee is back on his hill, watching calmly, almost coldly, as people die below. The voice stays level while the words grow darker: skin colour, people being locked up today, who will be next. A harpsichord rings, the strings hold, and at the end the band’s voices fall into a spoken chant, like a fever, a prayer, a news bulletin."
        ru: "Здесь альбом спускается на самое дно. Ли снова сидит на своём холме и спокойно, почти равнодушно смотрит, как внизу умирают люди. Голос ровный, а слова всё страшнее: про цвет кожи, про тех, кого сегодня запирают, про то, кто будет следующим. Звенит клавесин, тянут струнные, а в конце музыканты хором монотонно проговаривают слова, похожие то на бред, то на молитву, то на сводку новостей."
      - id: marat
        role: quote
        draft: false
        en: "The closing lines came from a film. Echols and Arthur went to an art-house cinema to see “Marat/Sade”, and a line about everyone being normal and wanting freedom lodged in Lee’s head."
        ru: "Последние строки пришли из кино. Эколс и Артур пошли в артхаусный кинотеатр на «Марат/Сад», и фраза о том, что все нормальные и хотят свободы, засела у Ли в голове."
        lens: echols
      - id: lee-see
        role: quote
        draft: false
        en: “I write about what I see.”
        ru: «Я пишу о том, что вижу».
        lens: lee
      - id: prophecy
        role: text
        draft: false
        en: Less than thirty years later the man who sang about people being locked up would be locked up himself, in a California prison.
        ru: Меньше чем через тридцать лет человек, который пел о том, как людей запирают, сам окажется в калифорнийской тюрьме.
