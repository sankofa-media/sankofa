  - id: orchestra
    kind: orchestra
    decay: 0.18
    name: { en: "The orchestra", ru: "Оркестр" }
    lenses:
      - botnick
      - lee
      - echols
      - angel
    differ: true
    visions: [ notes, music-stand ]
    art:
      generated: true
      layers:
        - { file: the-orchestra-r2-plate.webp, alt: { en: "An empty recording studio", ru: "Пустая студия звукозаписи" } }
        - { file: the-orchestra-r2-section.webp, alt: { en: "In a studio a singer sings a part to a string and brass section while a young man writes out the score", ru: "В студии певец напевает партию струнным и духовым, а молодой человек записывает ноты" } }
        - { file: the-orchestra-r2-men.webp, depth: 6, alt: "" }
        - { file: the-orchestra-r2-sheets.webp, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 18 September 1967 · strings and horns
        ru: 18 сентября 1967 · струнные и духовые
      - id: title
        role: title
        draft: false
        en: "How Lee’s humming became an orchestra"
        ru: "Как напев Ли стал оркестром"
      - id: lede
        role: lede
        draft: false
        en: Lee heard the strings and the brass in his head. Botnick called his mother, Priscilla Nemoy, a copyist who had prepared parts for Frank Sinatra, and she suggested the arranger David Angel. Lee sat beside Angel and sang him the counter-melodies, and Angel turned what he sang into a score for a small orchestra.
        ru: "Партии струнных и духовых Ли слышал в голове. Ботник позвонил своей матери, Присцилле Немой, которая переписывала ноты для Фрэнка Синатры, и она посоветовала аранжировщика Дэвида Энджела. Ли садился рядом с Энджелом и напевал ему контрмелодии, а тот превращал напетое в партитуру для небольшого оркестра."
      - id: botnick-sang
        role: quote
        draft: false
        en: “Arthur would sing a counter-melody for the strings and brass and then David would turn that into arrangements.”
        ru: "«Артур напевал контрмелодию для струнных и духовых, а Дэвид превращал её в аранжировку»."
        lens: botnick
      - id: lee-told
        role: quote
        draft: false
        en: “David Angel’s great – he’s on the whole record! … I told him what to do – I helped orchestrate.”
        ru: «Дэвид Энджел великолепен — он на всей пластинке! Я говорил ему, что делать, я помогал оркестровать».
        lens: lee
      - id: echols-angel
        role: quote
        draft: false
        en: “He was a magnificent arranger and came up with the Mariachi horns.”
        ru: "«Он был великолепным аранжировщиком. Духовые в духе мариачи придумал он»."
        lens: echols
      - id: sound
        role: text
        draft: false
        en: "So a rock band got a sound that rock bands did not have then: acoustic guitars, strings, mariachi trumpets, everything soft and clear, and through all that beauty come words about death and war. Holzman, who had built Elektra on folk records, had suggested the direction before the sessions: “What would happen if you advanced backwards?”"
        ru: "Так у рок-группы появился звук, какого у рок-групп тогда не было: акустические гитары, струнные, трубы в духе мариачи. Всё звучит мягко и прозрачно, а сквозь эту красоту проступают слова о смерти и войне. Хольцман, поднявший Elektra на фолк-пластинках, ещё до начала записи подсказал Ли это направление: «А что, если идти вперёд, пятясь назад?»"

