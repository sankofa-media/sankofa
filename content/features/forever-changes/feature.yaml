        draft: false
        en: The closing lines came from a film. He and Arthur went to an art-house cinema to see “Marat/Sade”, and a line about everyone being normal and wanting freedom lodged in Lee’s head.
        ru: Последние строки пришли из кино. Они с Артуром пошли в артхаусный кинотеатр на «Марат/Сад», и фраза о том, что все нормальные и хотят свободы, засела у Ли в голове.
        lens: echols
      - id: lee-see
