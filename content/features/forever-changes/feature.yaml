      - id: kicker
        role: kicker
        draft: false
        en: 2006 · Memphis
        ru: 2006 · Мемфис
      - id: title
        role: title
        draft: false
        en: Where he was born
        ru: Там, где он родился
      - id: lede
        role: lede
        draft: false
        en: "In 2006 Lee was found to have leukaemia. He had no health insurance, and friends put on a benefit for him: on 23 June at the Beacon Theatre in New York, Robert Plant played. Into “Hey Joe”, the song with which Love had once won Holzman over, Plant wove a line from “Nature Boy”: the greatest thing is just to love and be loved in return."
        ru: "В 2006 году у Ли нашли лейкемию. Медицинской страховки у него не было, и друзья устроили благотворительный концерт: 23 июня в нью-йоркском театре «Бикон» играл Роберт Плант. В «Hey Joe», песню, с которой Love когда-то покорили Хольцмана, Плант вплёл строку из «Nature Boy»: самое главное — любить и быть любимым."
      - id: death
        role: text
        draft: false
        en: Arthur Lee died on 3 August 2006 in Memphis, the city where he was born. He was sixty-one, and his wife Diane was with him. He lived thirty-five years longer than he had promised himself when he wrote his last words.
        ru: "Артур Ли умер 3 августа 2006 года в Мемфисе, в городе, где родился. Ему был шестьдесят один год, рядом была его жена Дайан. Он прожил на тридцать пять лет дольше, чем отпускал себе, когда писал свои «последние слова»."
      - id: echols-hospital
        role: quote
        draft: false
        en: "“I’d just been at the hospital in Memphis with him. I got back to Los Angeles, and Diane called to say he had passed.” In the hospital Arthur had asked him: “Why don’t you guys do this until I’m ready to continue?”"
        ru: "«Я только что навещал его в больнице в Мемфисе. Вернулся в Лос-Анджелес, и тут позвонила Дайан: его не стало». А в больнице Артур успел попросить: «Играйте это без меня, пока я не смогу вернуться»."
        lens: echols
      - id: forever
        role: line
        draft: false
        en: The world changes. Forever changes.
        ru: Мир меняется. Forever changes.
    differ: false

