        en: MacLean’s second and last song on the album is a breath after the war and the newspaper noise. An old man passes on to a young one what life has taught him. A few years later MacLean would leave music and turn to faith, and the song can be heard as the first step down that road. Under his voice the strings play a melody of their own, as if coming to meet the words.
        ru: Вторая и последняя песня Маклина на альбоме — передышка после войны и газетного шума. Старик передаёт молодому то, что понял за жизнь. Через несколько лет Маклин уйдёт из музыки и обратится к вере, и эту песню можно услышать как первый шаг по той дороге. Под его голосом звучат струнные со своей мелодией, которая будто идёт навстречу словам.
      - id: botnick-bryan
        role: quote
        draft: false
        en: “As deep as what Arthur was writing, I think Bryan was easily as deep, but coming from a different direction.”
        ru: «Как глубоко ни писал Артур, Брайан был, по-моему, не менее глубок, — только шёл с другой стороны».
        lens: botnick
      - id: lee-bryan
        role: quote
        draft: false
        en: “I wanted it to be Lee and MacLean or MacLean and Lee. But we just never could … He was just another kind of guy than I am. But I think he was a fabulous writer.”
        ru: "«Я хотел, чтобы было „Ли и Маклин“ или „Маклин и Ли“. Но у нас ничего не вышло: мы были слишком разными. А автор он был потрясающий»."
