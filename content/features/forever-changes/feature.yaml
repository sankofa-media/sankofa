# Forever Changes — the scenes of the longread and their text.
#
# Every text block is DRAFT copy written from the storyboard
# (sankofa-features/forever-changes/STORYBOARD.ru.md) and the research
# (sankofa-features/research/forever-changes/): a faithful English draft and a
# Russian one. The editor replaces it and sets `draft: false`.
#
# Conventions:
# - A block without `lens` is the narrator's: only facts with two opened
#   sources (timeline.yaml, `status: verified` claims in songs.yaml, after.md
#   items not marked [single]).
# - A block with `lens: <id>` belongs to one witness (or to the critics and
#   fans) and is shown in the chapter's lens pane. It is that person's account,
#   phrased as such; where the witnesses contradict each other the scene is
#   marked `differ: true` and every version stays on the page, none declared
#   right. The lens `angel` is empty: David Angel left no account.
# - A block with `hold: true` carries a fact with a single source, or one
#   listed in unconfirmed.md; `check:` says why. The build drops it and it never
#   reaches a reader.
# - Lyrics are never quoted beyond a few words; the songs are paraphrased.
# - `decay` is the page's decay level in the chapter (0 calm .. 1 the peak);
#   `settle: true` makes it fall back to 0 over the chapter. `alias` is the
#   false name the chapter menu shows for a moment while the page decays.
#   `visions` are the objects the Arthur Lee mode shows in that chapter.
# - Dictionary links: [[card-id|words]].
id: forever-changes
order: 2
title:
  en: "Forever Changes: the last words that were not the last"
  ru: "Forever Changes: последние слова, которые не стали последними"
dek:
  en: "In 1967 a twenty-two-year-old from Memphis made an album he thought would be his last words. It flopped at home, broke his band and outlived almost everyone who made it."
  ru: "В 1967 году двадцатидвухлетний парень из Мемфиса записал альбом, который считал своими последними словами. Дома он провалился, группу развалил и пережил почти всех, кто его делал."
reading:
  en: "50–60 minutes; put your phone nearby"
  ru: "50–60 минут; держите телефон под рукой"

