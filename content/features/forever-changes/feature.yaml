        en: "The gentlest song on the album: slow, with the strings wrapped around the voice. A man promises tenderness, and the words of the title have run together into one, like a promise said over and over: and more, again."
        ru: "Самая нежная песня альбома: медленная, струнные будто обнимают голос. Человек обещает нежность, и слова в названии слиплись в одно, как обещание, которое повторяют без конца: «и ещё раз, и снова»."
