        - { file: the-castle-v2-house.webp, depth: 6, state: castle, alt: "" }
        - { file: the-castle-v2-windows.webp, depth: 6, state: castle, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Prologue · 1945–1967
        ru: Пролог · 1945–1967
      - id: title
        role: title
        draft: false
        en: The boy from Memphis
        ru: Мальчик из Мемфиса
      - id: lede
        role: lede
        draft: false
        en: "Arthur Lee was born in Memphis on 7 March 1945. His mother, Agnes, taught school; his father, Chester Taylor, played the trumpet. As a boy he came to Los Angeles, to West Adams, and grew up there under his stepfather’s name, Clinton Lee. Memphis, he remembered, was segregated, and the memory stayed: a band where Black and white musicians played together was his idea from the very start."
        ru: "Артур Ли родился в Мемфисе 7 марта 1945 года. Его мать, Агнес, была учительницей, а отец, Честер Тейлор, трубачом. Ещё ребёнком он попал в Лос-Анджелес, в район Уэст-Адамс, и вырос там под фамилией отчима, Клинтона Ли. В Мемфисе, вспоминал он потом, была сегрегация, и эта память осталась с ним навсегда: группу, где чёрные и белые играют вместе, он задумал с самого начала."
      - id: dorsey
        role: text
        draft: false
        en: At Dorsey High he was a basketball player before he was a musician. He started making music with his childhood friend Johnny Echols, and by 1963 they had a band and a first single. A year later Lee wrote “My Diary” for the singer Rosa Lee Brooks, and a young Jimi Hendrix played the guitar on it.
        ru: В школе Дорси он сначала был не музыкантом, а баскетболистом. Музыку он начал играть с другом детства Джонни Эколсом, и в 1963 году у них уже была своя группа и первый сингл. Через год Ли написал «My Diary» для певицы Розы Ли Брукс, и на гитаре там сыграл молодой Джими Хендрикс.
      - id: byrds
        role: text
        draft: false
        en: In 1965 Lee saw the Byrds at Ciro’s on the Sunset Strip, and everything fell into place. He left [[rhythm-and-blues|rhythm and blues]] for folk rock, brought in the guitarist Bryan MacLean, who had worked as a roadie for the Byrds, and called the band Love; the name Grass Roots had already been taken.
        ru: В 1965 году Ли увидел The Byrds в клубе Ciro's на Сансет-Стрип, и всё в его голове встало на место. Он ушёл от [[rhythm-and-blues|ритм-н-блюза]] к фолк-року, позвал гитариста Брайана Маклина, который работал у The Byrds техником, и назвал группу Love. Название Grass Roots к тому времени уже забрали другие.
      - id: name-lee
        role: quote
        draft: false
        en: "The word came to him on the freeway: rather than hate the people who took your name, “maybe you should love them.”"
        ru: "Слово пришло ему в голову на шоссе: вместо того чтобы ненавидеть тех, кто украл у тебя название, «может, их стоит любить»."
        lens: lee
      - id: name-billboard
        role: quote
        draft: false
        en: Echols and MacLean remembered a billboard for Luv brassieres on Melrose.
        ru: А Эколс с Маклином помнили рекламный щит бюстгальтеров Luv на Мелроуз.
        lens: echols
      - id: holzman
        role: text
        draft: false
        en: At Bido Lito’s in Hollywood they were heard by Jac Holzman, whose label Elektra had until then put out folk records. Love became the first rock band he signed. The singles “My Little Red Book” and “7 and 7 Is” reached the charts, and the band moved into the Castle, a run-down mansion in Los Feliz where they lived together, played together and took a great many drugs.
        ru: В клубе Bido Lito's в Голливуде их услышал Джек Хольцман, хозяин лейбла Elektra, который до тех пор выпускал фолк. Love стали первой рок-группой, которую он подписал. Песни выходили одна за другой, синглы «My Little Red Book» и «7 and 7 Is» попали в чарты, а сама группа поселилась в «Замке» — обветшалом особняке в Лос-Фелис, где жили вместе, играли и принимали много наркотиков.
      - id: holzman-saw
        role: quote
        draft: false
        en: “Thirty seconds into their version of ‘Hey Joe’, I knew this was the group I was looking for.” The club itself he remembered as “a scene from Dante’s Inferno”.
        ru: "«Через тридцать секунд их „Hey Joe“ я понял: вот она, группа, которую я искал». Сам клуб он запомнил как «сцену из Дантова „Ада“»."
        lens: holzman
      - id: tour
        role: text
        draft: false
        en: Love hardly ever left Los Angeles, and each of three men explained why in his own way.
        ru: Из Лос-Анджелеса Love почти не уезжали. Почему — каждый из троих объяснял по-своему.
      - id: tour-echols
        role: quote
        draft: false
        en: “We were a mixed-race group in the sixties … all of the South, most of Middle-America, and many parts of the Midwest as well were simply off-limits to us.”
        ru: «Мы были смешанной группой в шестидесятые. Весь Юг, бо́льшая часть Средней Америки и многие места на Среднем Западе были для нас просто закрыты».
        lens: echols
      - id: tour-holzman
        role: quote
        draft: false
        en: “He was jealous of The Doors’ success … But he wouldn’t travel far from his perch in LA.”
        ru: «Он ревновал к успеху The Doors. Но далеко от своего насеста в Лос-Анджелесе он не уезжал».
        lens: holzman
      - id: tour-lee
        role: quote
        draft: false
        en: "Touring meant going out to “eat shit”, and he wasn’t having it: “I always thought that if something was good, it would get through anyway.”"
        ru: "Гастроли означали «жрать дерьмо», а он на это не соглашался: «Я всегда думал: если вещь хорошая, она и так пробьётся»."
        lens: lee
      - id: dacapo
        role: text
        draft: false
        en: The second album, “Da Capo”, came out early in 1967, with one long piece, “Revelation”, filling its second side; it got no higher than number 80. San Francisco would call that summer the Summer of Love, and the band called Love was falling apart.
        ru: Второй альбом, «Da Capo», вышел в начале 1967 года, и всю его вторую сторону занимала одна длинная вещь, «Revelation». Пластинка дошла лишь до восьмидесятого места. Лето 1967-го в Сан-Франциско назовут «летом любви», а группа под названием Love в это время разваливалась.

