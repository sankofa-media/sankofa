      - id: lede
        role: lede
        draft: false
        en: "Here the album reaches the bottom. Lee is back on his hill, watching calmly, almost coldly, as people die below. The voice stays level while the words grow darker: skin colour, people being locked up today, who will be next. A harpsichord rings, the strings hold, and at the end the band’s voices fall into a spoken chant, like a fever, a prayer, a news bulletin."
        ru: "Здесь альбом спускается на самое дно. Ли снова сидит на своём холме и спокойно, почти равнодушно смотрит, как внизу умирают люди. Голос ровный, а слова всё страшнее: про цвет кожи, про тех, кого сегодня запирают, про то, кто будет следующим. Звенит клавесин, тянут струнные, в конце голоса группы начинают монотонно проговаривать слова — как бред, как молитва, как сводка."
      - id: marat
