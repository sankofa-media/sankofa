        ru: Сторона B · 2 · Артур Ли
      - id: title
        role: title
        draft: false
        en: Live and Let Live
        ru: Live and Let Live
      - id: lede
        role: lede
        draft: false
        en: "The song opens with an image fans and mockers still quote: snot dried on his trousers has turned to crystal. That was Lee’s humour, and from that joke comes a grim picture of a world where everyone fears everyone, splits into us and them and is ready to shoot. MacLean’s acoustic guitar and Echols’s electric lock together and won’t let go."
        ru: "Песня начинается с образа, который до сих пор цитируют и поклонники, и насмешники: засохшая на штанах сопля превратилась в кристалл. Таков был юмор Ли, и с этой шутки начинается мрачная картина мира, где все боятся всех, делятся на своих и чужих и готовы стрелять. Акустическая гитара Маклина и электрическая Эколса сцепляются и долго не отпускают друг друга."
      - id: echols-dystopia
        role: quote
        draft: false
        en: “It paints a picture of a dystopia, ruled by violence, mistrust and tribalism.”
        ru: «Песня рисует мир, которым правят насилие, недоверие и вражда своих с чужими».
        lens: echols
      - id: bell
        role: quote
        draft: false
        en: "Andy Bell, the guitarist of Ride, loves the album but couldn’t forgive that: “The greatest album in the world wouldn’t mention snot.”"
        ru: "Энди Белл, гитарист группы Ride, любит этот альбом, но одну строчку простить не смог: «Величайший альбом в истории не стал бы петь про сопли»."
        lens: critics
    differ: true

