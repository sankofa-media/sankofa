    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · Mulholland Drive
        ru: 1967 · Малхолланд-драйв
      - id: title
        role: title
        draft: false
        en: "The house above the city"
        ru: "Дом над городом"
      - id: lede
        role: lede
        draft: false
        en: "By 1967 Lee had left the Castle for a house high in the hills above the city. From there Los Angeles lay below him whole: the lights, the freeways and, at night, the flashing ambulances. He hardly went out. He sat, looked down and thought about dying."
        ru: "К 1967 году Ли переехал из «Замка» в дом высоко на холмах над городом. Оттуда Лос-Анджелес был виден целиком: огни, автострады, а по ночам мигалки скорой помощи. Ли почти не выходил из дома: сидел, смотрел вниз и думал о смерти."
      - id: forssi
        role: quote
        draft: false
        en: “Then we’d look down over the city, Arthur staring and wondering about the ambulances and the sirens.”
        ru: "«Мы сидели и смотрели сверху на город, а Артур не сводил глаз со скорых и всё думал о них, о сиренах»."
        lens: forssi
      - id: last-words
        role: text
        draft: false
        en: He was twenty-two and certain he would die soon, “about 26”, he said; he just had a feeling. He wrote the new songs as last words. Many years later he would call it, calmly, a stage that young people go through. At the time it was real.
        ru: "Ему было двадцать два, и он был уверен, что скоро умрёт, «лет в двадцать шесть». Почему, он и сам не знал: просто было такое предчувствие. Новые песни он писал как последние слова. Много лет спустя он спокойно скажет, что через это в молодости проходят многие. А тогда всё было всерьёз."
      - id: last-words-1991
        role: quote
        draft: false
        en: “The album Forever Changes was to be my last words to this life. And it’s like death is in there.”
        ru: "«Forever Changes должен был стать моими последними словами, обращёнными к этой жизни. В нём как будто живёт смерть»."
        lens: lee
      - id: echols-dark
        role: quote
        draft: false
        en: “We were scared to death that they were going to need more bodies for the Vietnam war … There was a dark side.”
        ru: "«Мы до смерти боялись, что для войны во Вьетнаме понадобится ещё пушечного мяса. У всего этого была и тёмная сторона»."
        lens: echols
      - id: botnick-stoned
        role: quote
        draft: false
        en: "Bruce Botnick, the engineer who recorded all of Love’s albums, on the days of the band’s first album: “Arthur was stoned twenty-four hours a day.”"
        ru: "О временах первого альбома Love звукорежиссёр Брюс Ботник, записавший все пластинки группы, говорил: «Артур был под кайфом круглые сутки»."
        lens: botnick
    differ: true

