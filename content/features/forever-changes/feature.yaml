        - { file: prison-r2-bunk.webp, depth: 6, state: prison, alt: "" }
        - { file: prison-r2-man.webp, depth: 12, role: figure, state: prison, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967–2001
        ru: 1967–2001
      - id: title
        role: title
        draft: false
        en: The record that didn’t sell
        ru: Пластинка, которая не продавалась
      - id: lede
        role: lede
        draft: false
        en: Forever Changes came out in November 1967, and America didn’t notice. On the Billboard chart it climbed to number 154 and vanished after ten weeks. In England it reached number 24 and stayed there for good, in the heads of musicians who would later call it theirs.
        ru: "Forever Changes вышел в ноябре 1967 года, и Америка его не заметила. В чарте Billboard он поднялся до 154-го места и через десять недель исчез. В Англии альбом дошёл до 24-го места и навсегда запомнился музыкантам, которые потом будут считать его своим."
      - id: breakup
        role: text
        draft: false
        en: "The band didn’t survive it. In 1968 Lee broke up the line-up and built a new one around himself. Echols remembers how MacLean was fired: Holzman had secretly offered Bryan a solo deal, Bryan told Arthur, and Arthur said, “Fantastic, congratulations, Bryan… You’re fired!” In 1970 MacLean left the music business and later became a born-again Christian; in 1985 he wrote “Don’t Toss Us Away” for Lone Justice, the band of his half-sister Maria McKee."
        ru: "Группа этого не пережила. В 1968 году Ли распустил состав и собрал новый вокруг себя. Эколс рассказывает, как уволили Маклина: Хольцман тайком предложил Брайану сольный контракт, Брайан рассказал об этом Артуру, и Артур ответил: «Потрясающе, поздравляю, Брайан. Ты уволен!» В 1970 году Маклин ушёл из музыкального бизнеса и позже стал глубоко верующим христианином, а в 1985 году написал песню «Don’t Toss Us Away» для группы Lone Justice, где пела его сводная сестра Мария Макки."
      - id: lee-slap
        role: quote
        draft: false
        en: “The last time I saw Bryan I slapped him. Not hard. I missed … He was a great musician, a great writer.”
        ru: «В последний раз, когда я видел Брайана, я дал ему пощёчину. Не сильно. Промахнулся. А музыкант и автор он был отличный».
        lens: lee
      - id: botnick-roxy
        role: quote
        draft: false
        en: “I was going to the Roxy, and coming out … this panhandler came up to me. It was a bum. And it was Arthur.”
        ru: «Я выходил из клуба Roxy, и ко мне подошёл попрошайка. Бродяга. Это был Артур».
        lens: botnick
      - id: prison
        role: text
        draft: false
        en: In the mid-nineties a gun went off outside Lee’s flat during a quarrel with a neighbour. Lee denied it, but he had earlier convictions, and under California’s three-strikes law he was given twelve years. While he was inside, Ken Forssi and Bryan MacLean both died, in 1998.
        ru: "В середине девяностых возле квартиры Ли во время ссоры с соседом прозвучал выстрел. Ли отрицал, что стрелял он, но у него были прежние судимости, и по калифорнийскому закону «о трёх преступлениях» его приговорили к двенадцати годам. Пока он сидел, в 1998 году умерли Кен Форсси и Брайан Маклин."
      - id: lee-head
        role: quote
        draft: false
        en: “In prison, I hardly touched a guitar … It was a test to me to see if I could do all these songs totally in my head. That kept me going.”
        ru: "«В тюрьме я почти не брал в руки гитару. Это была проверка: смогу ли я удержать все эти песни целиком в голове. Это меня и поддерживало»."
        lens: lee
      - id: released
        role: text
        draft: false
        en: "In December 2001 he was freed: a court found that the prosecution had acted improperly."
        ru: "В декабре 2001 года Ли освободили: суд признал, что обвинение допустило нарушения."

  # ---------------------------------------------------------------- return
  - id: return
    kind: return
    decay: 0
    name: { en: "The return", ru: "Возвращение" }
    lenses:
      - lee
      - echols
    visions: [ music-stand, notes ]
    art:
      generated: true
      layers:
        - { file: the-return-r2-plate.webp, alt: { en: "An older singer with a guitar performs with a band and a string section in an ornate hall; the audience applauds", ru: "Немолодой певец с гитарой выступает с группой и струнными в нарядном зале; публика аплодирует" } }
        - { file: the-return-r2-performers.webp, depth: 6, alt: "" }
        - { file: the-return-r2-audience.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 2002–2005
        ru: 2002–2005
      - id: title
        role: title
        draft: false
        en: The album back on stage
        ru: Альбом снова на сцене
      - id: lede
        role: lede
        draft: false
        en: "The musicians of Baby Lemonade, who had played with him before prison, were waiting. From 2002 they played Forever Changes whole, first song to last, with strings and horns: across England, at London’s Royal Festival Hall, in Chicago, in New York. What Lee had once sung to Angel now sounded every night from a live orchestra behind him."
        ru: "Ли ждали музыканты Baby Lemonade, которые играли с ним до тюрьмы. С 2002 года они вместе со струнными и духовыми исполняли Forever Changes целиком, от первой песни до последней, — по всей Англии, в лондонском Королевском фестивальном зале, в Чикаго, в Нью-Йорке. То, что Ли когда-то напевал Энджелу, теперь каждый вечер играл живой оркестр за его спиной."
      - id: lee-arm
        role: quote
        draft: false
        en: “It was a little rough at first … Now I don’t want to go on stage without my orchestra. It’s like a third arm.”
        ru: «Сначала было тяжеловато. А теперь я не хочу выходить на сцену без своего оркестра. Он мне как третья рука».
        lens: lee
      - id: parliament
        role: text
        draft: false
        en: "In 2002, when Lee toured England for the first time after prison, the Labour MP Peter Bradley tabled an Early Day Motion in the House of Commons, a short statement that MPs sign to put something on public record. It called Love the world’s greatest rock band and Forever Changes the greatest album of all time. Bradley, who said he had cherished the record for thirty-five years, welcomed Lee to the House of Commons."
        ru: "В 2002 году, когда Ли впервые после тюрьмы гастролировал по Англии, депутат-лейборист Питер Брэдли внёс в Палату общин так называемое Early Day Motion — короткое заявление, которое депутаты подписывают, чтобы публично что-то отметить. В нём Love были названы величайшей рок-группой мира, а Forever Changes — величайшим альбомом всех времён. Брэдли, по его словам, тридцать пять лет дорожил этой пластинкой; он и принимал Ли в Палате общин."
      - id: echols-bow
        role: quote
        draft: false
        en: “Nothing in this life will ever match the look on Arthur’s face when members of Parliament … actually bowed down in honor of our group.”
        ru: "«Ничто в этой жизни не сравнится с тем, какое лицо было у Артура, когда члены парламента поклонились в честь нашей группы»."
        lens: echols
    differ: true

