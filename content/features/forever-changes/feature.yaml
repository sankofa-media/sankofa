        draft: false
        en: "The longest title on the record is an address: the block of the Sunset Strip between Clark Street, home of the Whisky a Go Go, and Hilldale, where a cheap diner called The Eating Affair had Love on its jukebox. Lee paints the street from life, the people on the pavement, the clubs, the crowd, and says goodbye to them as if he knows he won’t be back."
        ru: "Самое длинное название на пластинке — это адрес. Квартал Сансет-Стрип между Кларк-стрит, где стоит клуб Whisky a Go Go, и Хиллдейл, где в музыкальном автомате дешёвой забегаловки The Eating Affair стояла пластинка Love. Ли рисует эту улицу с натуры: людей на тротуаре, ночные клубы, публику — и прощается с ними, словно знает, что больше сюда не вернётся."
      - id: stuart-tempo
        role: quote
        draft: false
        en: "Stuart-Ware remembers Arthur asking him to push the tempo because Bryan was dragging on all the up-tempo songs. On ‘Between Clark and Hilldale’ it is very noticeable, and today he says of the recording: “It sounds horrible. To me, anyway.”"
        ru: "Стюарт-Уэр вспоминает, что Артур просил его играть быстрее: Брайан, по словам Ли, затягивал все быстрые песни. В „Between Clark and Hilldale“ это особенно слышно, и сегодня Стюарт-Уэр говорит об этой записи: «Звучит ужасно. По крайней мере, на мой слух»."
        lens: stuart-ware
      - id: stuart-listen
        role: quote
        draft: false
        en: "Can Stuart-Ware listen to the album now? “Still ‘no’, and probably always will be.”"
        ru: "Может ли Стюарт-Уэр теперь слушать этот альбом? «По-прежнему нет. И, наверное, никогда не смогу»."
        lens: stuart-ware
      - id: echols-cafe
        role: quote
        draft: false
        en: Arthur called the place not The Eating Affair but The Slop Affair.
        ru: "Артур называл это кафе не The Eating Affair, а The Slop Affair, то есть примерно «Помои»."
        lens: echols
    differ: true

