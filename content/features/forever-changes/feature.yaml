        en: The Daily Planet
        ru: The Daily Planet
      - id: lede
        role: lede
        draft: false
        en: "The title comes from the Superman comics: the Daily Planet is the newspaper where Superman’s other self, the reporter Clark Kent, works. Lee’s song is an ordinary man’s day: getting up, the news, work, the same again tomorrow, and a man who has long stopped believing in any of it. Of everything the session players recorded on that first day, this song certainly made the album; on that all the witnesses agree. The Wrecking Crew played the backing track, then Lee sang over it and the band added its own parts; Stuart-Ware, for one, says he added drum fills."
        ru: "Название песни взято из комиксов о Супермене: «Daily Planet» — газета, в которой работает его второе «я», журналист Кларк Кент. А поёт Ли о дне обычного человека: подъём, новости, работа, назавтра всё то же самое, и человек, который давно перестал во всё это верить. Из всего, что студийные музыканты записали в первый день, на альбом точно попала эта песня: в этом сходятся все участники. Инструментальную основу сыграли музыканты Wrecking Crew, потом Ли спел поверх неё свою партию, а группа дописала свои; Стюарт-Уэр, например, говорит, что добавил барабанные сбивки."
      - id: echols-blaine
        role: quote
        draft: false
        en: "Echols is sure the drummer was the Wrecking Crew’s Hal Blaine: “I can state unequivocally and with absolute certainty that Hal Blaine played drums on ‘The Daily Planet’.”"
        ru: "Эколс уверен, что на барабанах играл Хэл Блейн из Wrecking Crew: «Могу сказать с абсолютной уверенностью: на барабанах в „The Daily Planet“ играл Хэл Блейн»."
        lens: echols
      - id: stuart-gordon
        role: quote
        draft: false
        en: “I’ve heard … that Hal Blaine played on ‘Daily Planet’, but that’s not true. It was Jim Gordon.”
        ru: «Говорят, на „Daily Planet“ играл Хэл Блейн. Это неправда. Это был Джим Гордон».
        lens: stuart-ware

