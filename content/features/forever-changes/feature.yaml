        en: Bummer in the Summer
        ru: Bummer in the Summer
      - id: lede
        role: lede
        draft: false
        en: "The shortest and strangest song on the album. It starts as bright country, falls into a beat of the rock and roll pioneer Bo Diddley out of fifties [[rhythm-and-blues|rhythm and blues]], and Lee fires the words off in bursts, like Bob Dylan. He wants her to stay, she wants to be free, and he lets her go: he has no claim on her."
        ru: "Самая короткая и самая странная песня альбома. Она начинается как бодрое кантри, потом срывается в ритм рок-н-ролльщика Бо Диддли из [[rhythm-and-blues|ритм-н-блюза]] пятидесятых, и Ли выпаливает слова очередями, как Боб Дилан. Он хочет, чтобы она осталась, она хочет свободы, и он её отпускает: никаких прав на неё у него нет."
      - id: echols-temptation
        role: quote
        draft: false
        en: “It’s about a relationship strained by temptation.”
        ru: "«Это песня об отношениях, которые трещат по швам из-за соблазна»."
        lens: echols

  - id: you-set-the-scene
    kind: song
    decay: 0.45
    settle: true
    name: { en: "You Set the Scene", ru: "You Set the Scene" }
    alias: { en: "You Set the Stage", ru: "You Set the Stage" }
    song: { n: 11, side: b, title: "You Set the Scene", writer: "Arthur Lee", length: "6:49" }
    lenses:
      - echols
      - lee
    visions: [ curtain, music-stand ]
    art:
      generated: true
      layers:
        - { file: you-set-the-scene-r2-plate.webp, alt: { en: "A conductor raises his baton before a full orchestra on a lit stage", ru: "Дирижёр поднимает палочку перед большим оркестром на освещённой сцене" } }
        - { file: you-set-the-scene-r2-orchestra.webp, depth: 6, alt: "" }
        - { file: you-set-the-scene-r2-conductor.webp, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side B · 5 · Arthur Lee
        ru: Сторона B · 5 · Артур Ли
      - id: title
        role: title
        draft: false
        en: You Set the Scene
        ru: You Set the Scene
      - id: lede
        role: lede
        draft: false
        en: "The last song is the one Lee thought would be his last words. It was never written as one song: the bass player Ken Forssi, on his own initiative, stitched it together from three of Lee’s unfinished songs. It holds life and death, war, and the need to change. To those who think life is a game, Lee puts a question: do you like the part you are playing? The music grows from a quiet guitar into a major-key orchestra, brass racing against strings, and everything that came apart over the album comes back together."
        ru: "Последняя песня альбома — та, которую Ли считал своими последними словами. Её не писали как одну песню: басист Кен Форсси по собственному почину сшил её из трёх незаконченных песен Ли. В ней говорится о жизни и смерти, о войне и о том, что человеку необходимо меняться. Тем, кто считает жизнь игрой, Ли задаёт вопрос: а нравится ли вам роль, которую вы играете? Музыка вырастает из тихой гитары в полнозвучный мажорный оркестр, духовые несутся навстречу струнным, и всё, что распадалось на протяжении альбома, снова собирается воедино."
      - id: echols-profound
        role: quote
        draft: false
        en: "Echols says Arthur himself did not realise how profound his line was: “for everyone who thinks that life is just a game, do you like the part you’re playing?” “He didn’t know.”"
        ru: "Джонни Эколс говорит, что Артур и сам не понимал, как глубока его строка: «всем, кто думает, что жизнь — всего лишь игра: а нравится ли вам роль, которую вы играете?» «Он этого не знал»."
        lens: echols
      - id: lee-mine
        role: quote
        draft: false
        en: “My thing was the Forever Changes album. That’s when I finally got a chance to do my thing and I wasn’t worried about whether the public was gonna buy it.”
        ru: "«Моим главным делом был альбом Forever Changes. Тогда я наконец смог сделать то, что хотел, и не думал, купит это публика или нет»."
        lens: lee
      - id: last
        role: text
        draft: false
        en: "Lee was sure he would be dead by twenty-six, yet he ended the album with a song not about death but about everything changing, in a major key, with an orchestra."
        ru: "Ли был уверен, что умрёт к двадцати шести, а закончил альбом песней не о смерти, а о том, что всё меняется, — в мажоре, с оркестром."
    differ: true

