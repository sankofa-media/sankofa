        draft: false
        en: "The shortest and strangest song on the album. It starts as bright country, falls into a Bo Diddley beat out of fifties [[rhythm-and-blues|rhythm and blues]], and Lee fires the words off in bursts, like Dylan. He wants her to stay, she wants to be free, and he lets her go: he has no claim on her."
        ru: "Самая короткая и самая странная песня альбома. Начинается как бодрое кантри, проваливается в ритм Бо Диддли из [[rhythm-and-blues|ритм-н-блюза]] пятидесятых, и Ли выпаливает слова очередями, как Дилан. Он хочет верности, она хочет свободы, и он её отпускает: никаких прав на неё у него нет."
      - id: echols-temptation
        role: quote
        draft: false
        en: “It’s about a relationship strained by temptation.”
        ru: «Это об отношениях, которые соблазн довёл до предела».
        lens: echols

  - id: you-set-the-scene
    kind: song
    decay: 0.45
    settle: true
    name: { en: "You Set the Scene", ru: "You Set the Scene" }
    alias: { en: "You Set the Stage", ru: "You Set the Stage" }
    song: { n: 11, side: b, title: "You Set the Scene", writer: "Arthur Lee", length: "6:49" }
    lenses:
      - echols
      - lee
    visions: [ curtain, music-stand ]
    art:
      generated: true
      layers:
        - { file: you-set-the-scene-v2-stage.webp, alt: { en: "A conductor raises his baton before a full orchestra on a lit stage", ru: "Дирижёр поднимает палочку перед большим оркестром на освещённой сцене" } }
        - { file: you-set-the-scene-v2-orchestra.webp, depth: 6, alt: "" }
        - { file: you-set-the-scene-v2-conductor.webp, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side B · 5 · Arthur Lee
        ru: Сторона B · 5 · Артур Ли
      - id: title
        role: title
        draft: false
        en: You Set the Scene
        ru: You Set the Scene
      - id: lede
        role: lede
        draft: false
        en: "The last song, and the last words he thought would be his last. It was never written as one song: the bass player Ken Forssi, on his own initiative, stitched it together from three of Lee’s unfinished songs. It holds life and death, war, and the need to change. To those who think life is a game, Lee puts a question: do you like the part you are playing? The music grows from a quiet guitar into a major-key orchestra, brass racing against strings, and everything that came apart over the album comes back together."
        ru: "Последняя песня — и последние слова, которые он считал последними. Её не писали как одну песню: басист Кен Форсси сам, по собственному почину, сшил её из трёх незаконченных песен Ли. В ней жизнь и смерть, война и то, что меняться необходимо. Тем, кто считает жизнь игрой, Ли задаёт вопрос: а нравится ли вам роль, которую вы играете? Музыка вырастает из тихой гитары в мажорный оркестр, медь несётся навстречу струнным, и всё, что весь альбом распадалось, собирается обратно."
      - id: echols-profound
        role: quote
        draft: false
        en: He counts the line about the part you play among the best ever written. “Arthur didn’t understand. He did not know.”
        ru: Строку о роли он считает одной из лучших когда-либо написанных. «А Артур этого не понимал. Он не знал».
        lens: echols
      - id: lee-mine
        role: quote
        draft: false
        en: “My thing was the Forever Changes album. That’s when I finally got a chance to do my thing and I wasn’t worried about whether the public was gonna buy it.”
        ru: «Это была моя вещь — Forever Changes. Наконец я сделал своё и не думал, купит это публика или нет».
        lens: lee
      - id: last
        role: text
        draft: false
        en: The young man who expected to be dead by twenty-six ends not with death but with change, in a major key, with an orchestra.
        ru: Молодой человек, который ждал смерти к двадцати шести, заканчивает не смертью, а тем, что всё меняется. Мажором и оркестром.
    differ: true

  # ---------------------------------------------------------------- after
  - id: after
    kind: after
    decay: 0
    name: { en: "After", ru: "После" }
    lenses:
      - lee
      - botnick
    differ: true
    visions: [ bars, newspaper ]
    art:
      generated: true
      layers:
        - { file: after-v1-street.webp, state: after, alt: { en: "A thin man in a long coat stands outside a club at night, its marquee lit in red", ru: "Худой человек в длинном пальто стоит ночью у клуба с красной подсветкой козырька" } }
        - { file: after-v1-club.webp, depth: 6, state: after, alt: "" }
        - { file: after-v1-man.webp, depth: 12, role: figure, state: after, alt: "" }
        - { file: prison-v1-cell.webp, state: prison, alt: { en: "A man in grey prison clothes sits on a cell bunk, eyes closed, playing a guitar that is not there", ru: "Человек в серой тюремной робе сидит на нарах с закрытыми глазами и играет на гитаре, которой нет" } }
        - { file: prison-v1-bunk.webp, depth: 6, state: prison, alt: "" }
        - { file: prison-v1-man.webp, depth: 12, role: figure, state: prison, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967–2001
        ru: 1967–2001
      - id: title
        role: title
        draft: false
        en: The record that didn’t sell
        ru: Пластинка, которая не продавалась
      - id: lede
        role: lede
        draft: false
        en: Forever Changes came out in November 1967, and America didn’t notice. On the Billboard chart it climbed to number 154 and vanished after ten weeks. In England it reached number 24 and stayed there for good, in the heads of musicians who would later call it theirs.
        ru: Forever Changes вышел в ноябре 1967 года, и Америка его не заметила. В чарте Billboard он поднялся до 154-го места и через десять недель исчез. В Англии он дошёл до 24-го места и остался там навсегда — в головах музыкантов, которые потом будут называть его своим.
      - id: breakup
        role: text
        draft: false
        en: "The band didn’t survive it. In 1968 Lee broke up the line-up and built a new one around himself. Echols remembers how MacLean was fired: Holzman had secretly offered Bryan a solo deal, Bryan told Arthur, and Arthur said, “Fantastic, congratulations, Bryan… You’re fired!” MacLean left music and became a Christian."
        ru: "Группа этого не пережила. В 1968 году Ли распустил состав и собрал новый вокруг себя. Как уволили Маклина, Эколс помнит так: Хольцман тайком предложил Брайану сольный контракт, Брайан рассказал об этом Артуру, и Артур ответил: «Потрясающе, поздравляю, Брайан. Ты уволен!» Маклин ушёл из музыки и стал христианином."
      - id: lee-slap
        role: quote
        draft: false
        en: “The last time I saw Bryan I slapped him. Not hard. I missed … He was a great musician, a great writer.”
        ru: «В последний раз, когда я видел Брайана, я дал ему пощёчину. Не сильно. Промахнулся. А музыкант и автор он был отличный».
        lens: lee
      - id: botnick-roxy
        role: quote
        draft: false
        en: “I was going to the Roxy, and coming out … this panhandler came up to me. It was a bum. And it was Arthur.”
        ru: «Я выходил из клуба Roxy, и ко мне подошёл попрошайка. Бродяга. Это был Артур».
        lens: botnick
      - id: prison
        role: text
        draft: false
        en: In the mid-nineties a gun went off outside Lee’s flat during a quarrel with a neighbour. Lee denied it, but he had earlier convictions, and under California’s three-strikes law he was given twelve years. While he was inside, Ken Forssi and Bryan MacLean both died, in 1998.
        ru: В середине девяностых возле квартиры Ли во время ссоры с соседом прозвучал выстрел. Ли это отрицал, но у него были прежние судимости, и по калифорнийскому закону «трёх ударов» его приговорили к двенадцати годам. Пока он сидел, в 1998 году умерли Кен Форсси и Брайан Маклин.
      - id: lee-head
        role: quote
        draft: false
        en: “In prison, I hardly touched a guitar … It was a test to me to see if I could do all these songs totally in my head. That kept me going.”
        ru: "«В тюрьме я почти не брал в руки гитару. Это была проверка: смогу ли я удержать все эти песни целиком в голове. Это меня и держало»."
        lens: lee
      - id: released
        role: text
        draft: false
        en: "In December 2001 he was freed: a court found that the prosecution had acted improperly."
        ru: "В декабре 2001 года его освободили: суд признал, что обвинение вело процесс нечестно."

  # ---------------------------------------------------------------- return
  - id: return
    kind: return
    decay: 0
    name: { en: "The return", ru: "Возвращение" }
    lenses:
      - lee
      - echols
    visions: [ music-stand, notes ]
    art:
      generated: true
      layers:
        - { file: the-return-v1-hall.webp, alt: { en: "An older singer with a guitar performs with a band and a string section in an ornate hall; the audience applauds", ru: "Немолодой певец с гитарой выступает с группой и струнными в нарядном зале; публика аплодирует" } }
        - { file: the-return-v1-performers.webp, depth: 6, alt: "" }
        - { file: the-return-v1-audience.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 2002–2005
        ru: 2002–2005
      - id: title
        role: title
        draft: false
        en: The orchestra comes back
        ru: Оркестр возвращается
      - id: lede
        role: lede
        draft: false
        en: "The musicians of Baby Lemonade, who had played with him before prison, were waiting. From 2002 they played Forever Changes whole, first song to last, with strings and horns: across England, at London’s Royal Festival Hall, in Chicago, in New York. What Lee had once sung to Angel now sounded every night from a live orchestra behind him."
        ru: Его ждали музыканты Baby Lemonade, которые играли с ним до тюрьмы. В 2002 году они вместе со струнными и духовыми стали играть Forever Changes целиком, от первой песни до последней, — по Англии, в лондонском Королевском фестивальном зале, в Чикаго, в Нью-Йорке. То, что Ли когда-то напевал Энджелу, теперь каждый вечер звучало живым оркестром за его спиной.
      - id: lee-arm
        role: quote
        draft: false
        en: “It was a little rough at first … Now I don’t want to go on stage without my orchestra. It’s like a third arm.”
        ru: «Сначала было тяжеловато. А теперь я не хочу выходить на сцену без своего оркестра. Он мне как третья рука».
        lens: lee
      - id: parliament
        role: text
        draft: false
        en: In 2002 the British MP Peter Bradley put a motion honouring Lee before the House of Commons, and Lee visited Parliament.
        ru: В 2002 году британский депутат Питер Брэдли внёс в Палату общин резолюцию в честь Ли, и Ли побывал в парламенте.
      - id: echols-bow
        role: quote
        draft: false
        en: “Nothing in this life will ever match the look on Arthur’s face when members of Parliament … actually bowed down in honor of our group.”
        ru: «Ничто в этой жизни не сравнится с лицом Артура, когда члены парламента поклонились в честь нашей группы».
        lens: echols
    differ: true

  # ---------------------------------------------------------------- end
  - id: end
    kind: end
    decay: 0
    name: { en: "The end", ru: "Конец" }
    lenses:
      - echols
    visions: [ lily ]
    art:
      generated: true
      layers:
        - { file: the-end-v1-memphis-dawn.webp, alt: { en: "Dawn over a river city and its bridge, seen through a window; a vase of daisies on the sill", ru: "Рассвет над городом на реке и мостом, вид из окна; на подоконнике ваза с ромашками" } }
        - { file: the-end-v1-window.webp, depth: 6, alt: "" }
        - { file: the-end-v1-flowers.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 2006 · Memphis
        ru: 2006 · Мемфис
      - id: title
        role: title
        draft: false
        en: Where he was born
        ru: Там, где он родился
      - id: lede
        role: lede
        draft: false
        en: "In 2006 Lee was found to have leukaemia. He had no health insurance, and friends put on a benefit for him: on 23 June at the Beacon Theatre in New York, Robert Plant played. Into “Hey Joe”, the song with which Love had once won Holzman over, Plant wove a line from “Nature Boy”: the greatest thing is just to love and be loved in return."
        ru: "В 2006 году у Ли нашли лейкемию. Медицинской страховки у него не было, и друзья устроили для него концерт: 23 июня в нью-йоркском театре «Бикон» играл Роберт Плант. В «Hey Joe», песню, с которой Love когда-то покорили Хольцмана, Плант вплёл строку из «Nature Boy»: самое главное — любить и быть любимым."
      - id: death
        role: text
        draft: false
        en: Arthur Lee died on 3 August 2006 in Memphis, the city where he was born. He was sixty-one, and his wife Diane was with him. He lived thirty-five years longer than he had promised himself when he wrote his last words.
        ru: Артур Ли умер 3 августа 2006 года в Мемфисе, в городе, где родился. Ему был шестьдесят один год, рядом была его жена Дайан. Он прожил на тридцать пять лет дольше, чем обещал себе, когда писал последние слова.
      - id: echols-hospital
        role: quote
        draft: false
        en: "“I’d just been at the hospital in Memphis with him. I got back to Los Angeles, and Diane called to say he had passed.” In the hospital Arthur had asked him: “Why don’t you guys do this until I’m ready to continue?”"
        ru: "«Я только что был у него в больнице в Мемфисе. Вернулся в Лос-Анджелес, и Дайан позвонила: его не стало». А в больнице Артур успел попросить: «Поиграйте это без меня, пока я не буду готов продолжить»."
        lens: echols
      - id: forever
        role: line
        draft: false
        en: The world changes. Forever changes.
        ru: Мир меняется. Forever changes.
    differ: false

  # ---------------------------------------------------------------- echoes
  - id: echoes
    kind: echoes
    decay: 0
    name: { en: "Echoes", ru: "Отголоски" }
    lenses:
      - critics
      - echols
    visions: [ record, eye ]
    art:
      generated: true
      layers:
        - { file: you-set-the-scene-v1-stage.webp, state: orchestra, alt: { en: "An orchestra plays under warm stage lights, a conductor seen from behind", ru: "Оркестр играет под тёплыми огнями сцены, дирижёр виден со спины" } }
        - { file: you-set-the-scene-v1-orchestra.webp, state: orchestra, depth: 6, alt: "" }
        - { file: you-set-the-scene-v1-conductor.webp, state: orchestra, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: From 1968 to now
        ru: С 1968 года до наших дней
      - id: title
        role: title
        draft: false
        en: The album that didn’t end
        ru: Альбом, который не кончился
      - id: lede
        role: lede
        draft: false
        en: The record that didn’t sell at home became one of the most revered in [[rock-n-roll|rock]] history. Rolling Stone put it at number 40 among the 500 greatest albums; it is in the Grammy Hall of Fame and in the Library of Congress’s National Recording Registry.
        ru: Пластинка, которая не продавалась дома, стала одной из самых почитаемых в истории [[rock-n-roll|рока]]. Rolling Stone поставил её на сороковое место среди пятисот величайших альбомов, она в Зале славы «Грэмми» и в Национальном реестре звукозаписей Библиотеки Конгресса.
      - id: influence
        role: text
        draft: false
        en: Its deepest roots grew in England. Led Zeppelin, Echo and the Bunnymen, and Siouxsie and the Banshees named Love among their influences, and the Clash, Botnick says, were crazy about this album.
        ru: Глубже всего она проросла в Англии. Led Zeppelin, Echo and the Bunnymen, Siouxsie and the Banshees называли Love среди тех, кто на них повлиял. The Clash, по словам Ботника, были от этого альбома без ума.
      - id: bell
        role: quote
        draft: false
        en: “It’s a dark album, and good music can be dark and still uplifting. Love were on the front line.”
        ru: «Это тёмный альбом, а хорошая музыка может быть тёмной и всё равно поднимать дух. Love были на передовой».
        lens: critics
      - id: bell-who
        role: caption
        draft: false
        en: Andy Bell, guitarist of Ride
        ru: Энди Белл, гитарист Ride
      - id: screen
        role: text
        draft: false
        en: “Alone Again Or” plays in Wes Anderson’s “Bottle Rocket” and at the end of the first season of “Russian Doll”. And Johnny Echols still plays the whole album with his Love Band.
        ru: «Alone Again Or» звучит в «Бутылочной ракете» Уэса Андерсона и в финале первого сезона «Жизни на повторе». А Джонни Эколс до сих пор играет альбом целиком со своей Love Band.
      - id: echols-on
        role: quote
        draft: false
        en: “Forever Changes could only have happened in Los Angeles. And only at that particular moment in time.”
        ru: «Forever Changes мог случиться только в Лос-Анджелесе. И только в тот самый момент».
        lens: echols
    differ: true

