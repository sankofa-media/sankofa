      - id: kicker
        role: kicker
        draft: false
        en: A mode for the phone
        ru: Режим для телефона
      - id: lede
        role: lede
        draft: false
        en: "In the years of Forever Changes, Louder magazine writes, Lee and Love took a great deal of LSD. This mode shows your room roughly as the world looks on it: the phone’s camera films the room, the walls slowly flow with colour, figures appear at the edge of the frame and melt when you turn to them, and things from the songs of the chapter you are reading come into the room: a red telephone, a newspaper, an old man. The longer the mode runs, the more the picture changes. On a computer it works over a still picture, and the QR code opens it on your phone."
        ru: "В годы Forever Changes, как пишет журнал Louder, Ли и музыканты Love принимали очень много ЛСД. Этот режим показывает вашу комнату примерно такой, какой мир видится под ним: камера телефона снимает комнату, стены медленно переливаются цветом, по краям кадра появляются фигуры и тают, когда вы к ним поворачиваетесь, а в комнату приходят вещи из песен той главы, которую вы читаете, — красный телефон, газета, старик. Чем дольше работает режим, тем сильнее меняется картинка. На компьютере он работает с неподвижной картинкой, а QR-код откроет его на телефоне."
      - id: privacy
        role: line
        draft: false
        en: Everything happens on your phone. The camera picture goes nowhere.
        ru: Изображение с камеры обрабатывается прямо в телефоне и никуда не отправляется.
    differ: false
