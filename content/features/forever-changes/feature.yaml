        - { file: bido-litos-v1-band.webp, depth: 6, state: bido, alt: "" }
        - { file: bido-litos-v1-listener.webp, depth: 8, state: bido, alt: "" }
        - { file: bido-litos-v1-crowd.webp, depth: 14, state: bido, alt: "" }
