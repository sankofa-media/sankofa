    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 1967 · Mulholland Drive
        ru: 1967 · Малхолланд-драйв
      - id: title
        role: title
        draft: false
        en: Looking down
        ru: Смотреть вниз
      - id: lede
        role: lede
        draft: false
        en: "By 1967 Lee had left the Castle for a house high in the hills above the city. From there Los Angeles lay below him whole: the lights, the freeways and, at night, the flashing ambulances. He hardly went out. He sat, looked down and thought about dying."
        ru: "К 1967 году Ли ушёл из «Замка» в дом высоко на холмах над городом. Оттуда Лос-Анджелес лежал под ним целиком: огни, шоссе и по ночам мигалки машин скорой помощи. Он почти не выходил. Сидел, смотрел вниз и думал о смерти."
      - id: forssi
        role: quote
        draft: false
        en: “Then we’d look down over the city, Arthur staring and wondering about the ambulances and the sirens.”
        ru: «Мы смотрели вниз на город, а Артур всё смотрел и думал о скорых, о сиренах».
        lens: critics
      - id: forssi-who
        role: caption
        draft: false
        en: Ken Forssi, Love’s bass player
        ru: Кен Форсси, басист Love
        lens: critics
      - id: last-words
        role: text
        draft: false
        en: He was twenty-two and certain he would die soon, “about 26”, he said; he just had a feeling. He wrote the new songs as last words. Many years later he would call it, calmly, a stage that young people go through. At the time it was real.
        ru: "Ему было двадцать два, и он был уверен, что скоро умрёт: «лет в двадцать шесть», говорил он, просто было такое чувство. Новые песни он писал как последние слова. Через много лет, уже спокойно, он назовёт это этапом, через который проходят молодые. А тогда это было всерьёз."
      - id: last-words-1991
        role: quote
        draft: false
        en: “The album Forever Changes was to be my last words to this life. And it’s like death is in there.”
        ru: «Forever Changes должен был стать моими последними словами этой жизни. Смерть в нём есть».
        lens: lee
      - id: echols-dark
        role: quote
        draft: false
        en: “We were scared to death that they were going to need more bodies for the Vietnam war … There was a dark side.”
        ru: «Мы до смерти боялись, что им понадобятся новые тела для войны во Вьетнаме. Была у того лета и тёмная сторона».
        lens: echols
      - id: botnick-stoned
        role: quote
        draft: false
        en: "Bruce Botnick, the engineer who recorded all of Love’s albums, on the year before: “Arthur was stoned twenty-four hours a day.”"
        ru: "Брюс Ботник, звукорежиссёр, записавший все альбомы Love, о годе перед этим: «Артур был под кайфом двадцать четыре часа в сутки»."
        lens: botnick
    differ: true

