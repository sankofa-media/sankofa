  # ---------------------------------------------------------------- 5
  - id: orchestra
    kind: orchestra
    decay: 0.18
    name: { en: "The orchestra", ru: "Оркестр" }
    lenses:
      - botnick
      - lee
      - echols
      - angel
    differ: true
    visions: [ notes, music-stand ]
    art:
      generated: true
      layers:
        - { file: the-orchestra-v2-section.webp, alt: { en: "In a studio a singer sings a part to a string and brass section while a young man writes out the score", ru: "В студии певец напевает партию струнным и духовым, а молодой человек записывает ноты" } }
        - { file: the-orchestra-v2-men.webp, depth: 6, alt: "" }
        - { file: the-orchestra-v2-sheets.webp, depth: 12, role: figure, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: 18 September 1967 · strings and horns
        ru: 18 сентября 1967 · струнные и духовые
      - id: title
        role: title
        draft: false
        en: A voice turned into notes
        ru: Голос, ставший нотами
      - id: lede
        role: lede
        draft: false
        en: Lee heard the strings and the brass in his head. Botnick called his mother, Priscilla Nemoy, a copyist who had prepared parts for Frank Sinatra, and she suggested the arranger David Angel. Lee sat beside Angel and sang him the counter-melodies, and Angel turned what he sang into a score for a small orchestra.
        ru: Струнные и медь Ли слышал в голове. Ботник позвонил своей матери, Присцилле Немой, которая переписывала ноты для Фрэнка Синатры, и она посоветовала аранжировщика Дэвида Энджела. Ли садился рядом и напевал Энджелу контрмелодии, а тот превращал напетое в партитуру для небольшого оркестра.
      - id: botnick-sang
        role: quote
        draft: false
        en: “Arthur would sing a counter-melody for the strings and brass and then David would turn that into arrangements.”
        ru: «Артур напевал контрмелодию для струнных и меди, а Дэвид превращал её в аранжировку».
        lens: botnick
      - id: lee-told
        role: quote
        draft: false
        en: “David Angel’s great – he’s on the whole record! … I told him what to do – I helped orchestrate.”
        ru: «Дэвид Энджел великолепен — он на всей пластинке! Я говорил ему, что делать, я помогал оркестровать».
        lens: lee
      - id: echols-angel
        role: quote
        draft: false
        en: “He was a magnificent arranger and came up with the Mariachi horns.”
        ru: «Он был великолепным аранжировщиком. Мариачи-духовые придумал он».
        lens: echols
      - id: sound
        role: text
        draft: false
        en: "So a rock band got a sound that rock bands did not have then: acoustic guitars, strings, mariachi trumpets, everything soft and clear, and through all that beauty come words about death and war. Holzman, who had built Elektra on folk records, had suggested the direction before the sessions: “What would happen if you advanced backwards?”"
        ru: "Так рок-группа получила звук, которого у рок-групп тогда не было: акустические гитары, струнные, мариачи-трубы, всё мягко и прозрачно — а сквозь эту красоту проступают слова о смерти и войне. Хольцман, сделавший Elektra на фолк-пластинках, ещё до сессий предлагал Ли этот путь: «А что, если двинуться вперёд назад?»"

  # ---------------------------------------------------------------- side A
  - id: alone-again-or
    kind: song
    decay: 0.25
    name: { en: "Alone Again Or", ru: "Alone Again Or" }
    song: { n: 1, side: a, title: "Alone Again Or", writer: "Bryan MacLean", length: "3:15" }
    lenses:
      - echols
      - botnick
      - stuart-ware
    visions: [ trumpet, guitar ]
    art:
      generated: true
      layers:
        - { file: alone-again-or-v1-window.webp, alt: { en: "A classical guitar and a trumpet on a sunny window sill, a rush-seat chair beside them", ru: "Классическая гитара и труба на солнечном подоконнике, рядом плетёный стул" } }
        - { file: alone-again-or-v1-instruments.webp, depth: 6, alt: "" }
        - { file: alone-again-or-v1-chair.webp, depth: 12, alt: "" }
    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Side A · 1 · Bryan MacLean
        ru: Сторона A · 1 · Брайан Маклин
      - id: title
        role: title
        draft: false
        en: Alone Again Or
        ru: Alone Again Or
      - id: lede
        role: lede
        draft: false
        en: "The record opens not with Lee but with Bryan MacLean: his song, his voice, straight and without vibrato. A Spanish guitar comes in, then strings and a trumpet out of a Mexican band. The man in the song could love the whole world, waits and waits, and every time ends up alone. “Alone again, or…” The title breaks off like the hope does."
        ru: Пластинку открывает не Ли, а Брайан Маклин. Это его песня и его голос — ровный, совсем без вибрато. Вступает испанская гитара, следом струнные и труба, как в мексиканском оркестре. Человек в песне готов любить весь мир, ждёт и ждёт — и каждый раз остаётся один. «Опять один, или…» — название обрывается на полуслове, как сама надежда.
      - id: spanish
        role: text
        draft: false
        en: "The Spanish turn came from Echols’s guitar. He was warming up with flamenco runs, and Angel suggested putting them into Bryan’s song. The trumpet came from the radio: Tijuana Brass was everywhere on the air then, and Botnick decided to take from it something Spanish rather than Mexican."
        ru: "Испанский поворот песне дала гитара Эколса. Он разминал пальцы фламенковскими пассажами, и Энджел предложил вписать их в песню Брайана. Трубу подсказало радио: в эфире тогда повсюду звучал Tijuana Brass, и Ботник решил взять у него не мексиканское, а испанское."
      - id: echols-banjo
        role: quote
        draft: false
        en: At first it was a banjo song. “Why don’t you play those runs in Bryan’s song?” Angel asked.
        ru: Поначалу это была песня под банджо. «А почему бы тебе не сыграть эти пассажи в песне Брайана?» — спросил Энджел.
        lens: echols
      - id: botnick-spanish
        role: quote
        draft: false
        en: “Tijuana Brass was big on the radio … more Spanish than Mexican.”
        ru: «В эфире царили Tijuana Brass. Можно было взять их вкус, не копируя, — испанское, а не мексиканское».
        lens: botnick
      - id: stuart-title
        role: quote
        draft: false
        en: Asked what the song was called, Bryan said, “Well, ‘Alone Again’… or…”, and Arthur said that would be the title.
        ru: "Брайана спросили, как песня называется. «Ну, наверное, „Alone Again“… или…» И Артур сказал: так и назовём."
        lens: stuart-ware
      - id: afterlife
        role: text
        draft: false
        en: It is the best-known song on the album. UFO, the Damned and Calexico covered it, and Wes Anderson put it in his first film, “Bottle Rocket”.
        ru: Эта песня — самая известная на альбоме. Её перепевали UFO, The Damned, Calexico, а Уэс Андерсон поставил её в свой первый фильм, «Бутылочная ракета».
    differ: true

