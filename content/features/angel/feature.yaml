    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: Bristol and London
        ru: Бристоль и Лондон
      - id: title
        role: title
        draft: false
        en: “It turned out it was me”
        ru: «Оказалось, что ищут меня»
      - id: favourite
        role: text
        draft: false
        en: For Grant Marshall, known as Daddy G, of the Bristol group Massive Attack, Horace Andy was his favourite reggae singer. Andy himself was living in London by then. One day, on his way home to Peckham, he heard that some group was looking for a singer, “and it turned out it was me”. Daddy G sent him a cassette, and with the keyboard player Caroline Williams Andy wrote “One Love” for the group's first album, “Blue Lines”, in 1991. He has sung on every Massive Attack album since; no other guest vocalist of theirs can say that.
        ru: Для Гранта Маршалла по прозвищу Daddy G из бристольской группы Massive Attack Хорас Энди был любимым певцом регги. Сам Энди к тому времени жил в Лондоне. Однажды по дороге домой, в Пекхэм, он услышал, что какая-то группа ищет певца, — «и оказалось, что ищут меня». Daddy G прислал ему кассету, и вместе с клавишницей Кэролайн Уильямс Энди написал «One Love» для первого альбома группы, «Blue Lines», вышедшего в 1991 году. С тех пор он поёт на каждой их пластинке; ни один другой приглашённый вокалист Massive Attack этим похвастаться не может.
      - id: freedom
        role: text
        draft: false
        en: No reggae producer, Andy says, ever let him sing the way Massive Attack do.
        ru: Ни один продюсер регги, говорит Энди, не позволял ему петь так, как позволяют Massive Attack.

  - id: studio
