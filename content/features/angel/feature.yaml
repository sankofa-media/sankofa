# Angel — the scenes of the special project and their text.
#
# A mood piece: the story of Massive Attack's "Angel" told along the shape of
# the track (bass and silence → the voice → the breakdown → the fade), and a
# warm last screen that leads to the pulse page on a phone.
#
# Storyboard: sankofa-features/angel/STORYBOARD.ru.md.
# Research: sankofa-features/research/angel/ (REPORT.md, timeline.yaml,
# afterlife.yaml; nothing from unconfirmed.md is used).
#
# Rules for this text (owner, 17.11.2026):
# - The feeling comes from the music and the facts; the text never builds it
#   up: no "piercing", "heartbreaking", no judging feelings.
# - No personal story. The pulse belongs to no one: nowhere say whose it is.
# - Lyrics are never quoted; song titles only.
# - Dictionary links: [[card-id|words]].
id: angel
order: 3
title:
  en: "Angel: the song that was never meant to be"
  ru: "Angel: песня, которой не должно было быть"
dek:
  en: "In 1973 a young singer in Kingston recorded a light love song. A quarter of a century later he sang it again in a London studio, and it became one of the darkest, heaviest songs of the decade. In all the years since, it has never been used up."
  ru: "В 1973 году молодой певец из Кингстона записал светлую песню о любви. Через четверть века он спел её снова, в лондонской студии, и она стала одной из самых тёмных и тяжёлых песен десятилетия. За все годы, что прошли с тех пор, её так и не исчерпали."
reading: { en: "20–30 minutes, with sound", ru: "20–30 минут, со звуком" }

