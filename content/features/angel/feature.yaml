        en: The voice
        ru: Голос
      - id: falsetto
        role: text
        draft: false
        en: Andy has a high falsetto that people know from the first note, and long notes with a low, slow vibrato. On “Mezzanine”, the AllMusic critic wrote, he went far beyond the familiar bounds of reggae. The Guardian writes that his declaration of love, which he repeats over and over in this song, is impossible to forget.
        ru: У Энди высокий фальцет, который узнают с первой ноты, и долгие ноты с низким, медленным вибрато. На «Mezzanine», писал критик AllMusic, он вышел далеко за привычные пределы регги. The Guardian пишет, что его признание в любви, которое он повторяет в этой песне снова и снова, невозможно забыть.

  - id: strata
    kind: strata
    act: 2
    art:
      generated: true
      aspect: "3 / 2"
      layers:
        - file: strata-r2-plate.webp
          alt: ""
        - file: strata-r2-bass.webp
          alt: { en: "A slow, thick wave: the bass", ru: "Медленная густая волна: бас" }
        - file: strata-r2-drums.webp
          alt: { en: "Sharp spikes at even distances: the drums", ru: "Острые всплески через равные промежутки: барабаны" }
