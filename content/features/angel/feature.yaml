        ru: 1973 год
      - id: title
        role: title
        draft: false
        en: You Are My Angel
        ru: You Are My Angel
      - id: record
        role: text
        draft: false
        en: In 1973 his song “You Are My Angel” came out, in Jamaica as a small seven-inch on the Soul Sound label, and in England as the title track of an LP on Trojan. The producer was Bunny Lee, the sleeve names King Tubby's as the studio, and the songwriter credit is Andy's own. It is a love song, light and unhurried.
        ru: "В 1973 году вышла его песня «You Are My Angel»: на Ямайке маленькой сорокапяткой лейбла Soul Sound, в Англии заглавной вещью долгоиграющей пластинки на лейбле Trojan. Продюсером был Банни Ли, записана она, если верить конверту, в студии Кинг Табби, а автором песни значится сам Энди. Это песня о любви, светлая и неторопливая."
      - id: paid
        role: text
        draft: false
        en: By his own account, Andy was never paid for this song. Half a century later he said that Bunny Lee was not a producer but a financier, who never paid him and sold his recordings to Trojan. Answering him, the company BMG said that those licences had expired long ago.
        ru: "Денег за эту песню Энди, по его словам, так и не получил. Через полвека он скажет, что Банни Ли был не продюсером, а финансистом: ничего ему не заплатил и продал его записи лейблу Trojan. Компания BMG, отвечая на эти слова, сообщила, что те лицензии давно истекли."

  # ------------------------------------------------ Act II. The voice
  - id: bristol
