        en: Kingston, 1970
        ru: Кингстон, 1970 год
      - id: title
        role: title
        draft: false
        en: A new name
        ru: Новое имя
      - id: school
        role: text
        draft: false
        en: Horace Hinds was born in Kingston, Jamaica. His cousin Justin Hinds was already a singer, and the boy boasted of him whenever Justin came on the radio. He listened to American soul first, and only later to Jamaican singers; Alton Ellis let him play his guitar. In 1970 he auditioned at Studio One for Clement Dodd, known as Coxsone, and sang him a song of his own, “Got To Be Sure”. Dodd gave him a new name, Horace Andy, after the singer Bob Andy, and also so that no one would compare him with his cousin.
        ru: Хорас Хайндс родился в Кингстоне, на Ямайке. Его двоюродный брат Джастин Хайндс уже был певцом, и мальчик хвастался им всякий раз, когда песни брата звучали по радио. Сначала он слушал американский соул и только потом ямайских певцов; знаменитый певец Элтон Эллис давал ему поиграть на своей гитаре. В 1970 году он пришёл на прослушивание в Studio One к Клементу Додду по прозвищу Коксон и спел ему собственную песню «Got To Be Sure». Додд дал ему новое имя, Хорас Энди, в честь певца Боба Энди, а заодно чтобы никто не сравнивал его с братом.
      - id: university
        role: text
        draft: false
        en: Andy would later call Studio One his “school, my college, my university”. There he recorded “Skylarking”, which became his signature song and a number one in Jamaica.
        ru: Позже Энди назовёт Studio One своей «школой, колледжем и университетом». Там он записал «Skylarking», песню, которая стала его визитной карточкой и поднялась на первое место на Ямайке.

