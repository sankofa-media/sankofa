        en: In 1973 a young singer from Kingston recorded a love song, light and unhurried. Nearly a quarter of a century later, in a London studio, he sang it again, though no one had planned that song for the album. It became one of the darkest and heaviest songs of its decade, and in all the years since it has never been used up.
        ru: В 1973 году молодой певец из Кингстона записал песню о любви, светлую и неторопливую. Почти через четверть века, в лондонской студии, он спел её снова, хотя этой песни в планах альбома не было. Она стала одной из самых тёмных и тяжёлых песен десятилетия, и за все годы, что прошли с тех пор, её так и не исчерпали.

