        draft: false
        en: The sleeve
        ru: Обложка
      - id: cover
        role: text
        draft: false
        en: "The sleeve of “Mezzanine” is a black stag beetle on white. The photograph is by Nick Knight; the art direction and design are by Robert Del Naja and Tom Hingston. The Museum of Modern Art in New York keeps the sleeve in its architecture and design collection."
        ru: "На обложке «Mezzanine» — чёрный жук-олень на белом. Фотографию сделал Ник Найт, оформление придумали Роберт Дель Ная и Том Хингстон. Нью-йоркский Музей современного искусства хранит этот конверт в своей коллекции архитектуры и дизайна."

  # ------------------------------------------------ Act IV. The fade that does not end
  - id: screens
    kind: screens
