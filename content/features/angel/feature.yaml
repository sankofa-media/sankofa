        en: Other people's screens
        ru: Чужие экраны
      - id: snatch
        role: text
        draft: false
        en: Soon film and television began to use the song. In Guy Ritchie's “Snatch” of 2000 it plays in the amusement arcade and in the scene where a caravan burns, and it is on the soundtrack album. The Guardian writes that three songs from “Mezzanine”, “Angel”, “Teardrop” and “Inertia Creeps”, were later taken up by countless film and television directors.
        ru: "Вскоре песню стали брать в кино и на телевидение. В «Большом куше» Гая Ричи 2000 года она звучит в зале игровых автоматов и в сцене, где горит фургон, и есть на альбоме саундтрека. The Guardian пишет, что три песни с «Mezzanine», «Angel», «Teardrop» и «Inertia Creeps», потом брали в свои фильмы и сериалы бесчисленные режиссёры."

