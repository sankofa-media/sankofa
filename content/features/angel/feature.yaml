        en: Bristol, 1997
        ru: Бристоль, 1997 год
      - id: title
        role: title
        draft: false
        en: Three people in different rooms
        ru: Трое в разных комнатах
      - id: trio
        role: text
        draft: false
        en: "By the third album there were three people left in Massive Attack: Robert Del Naja, Grant Marshall and Andrew Vowles. The producer Neil Davidge became almost a fourth member; he was hired for six months and stayed, he says, for three years. They recorded in Bristol, in the band's own studio and at Christchurch Studios, and for a while in a holiday cottage in Cornwall."
        ru: "К третьему альбому в Massive Attack оставалось три человека: Роберт Дель Ная, Грант Маршалл и Эндрю Воулз. Почти четвёртым участником стал продюсер Нил Дэвидж: его наняли на полгода, а остался он, по его словам, на три года. Альбом записывали в Бристоле, в собственной студии группы и на студии Christchurch, а какое-то время в снятом на лето коттедже в Корнуолле."
      - id: apart
        role: text
        draft: false
        en: "Work on the album went badly. The members of the band wrote their parts separately, recorded separately and gave interviews separately, and the manager texted Davidge to schedule who could use Christchurch when. Del Naja pulled the sound towards post-punk, and Vowles asked whether they had become a punk band. What finally broke them was “Teardrop”, which Vowles secretly sent to Madonna while the others wanted Elizabeth Fraser of Cocteau Twins to sing it. In the end Fraser sang it. Two decades later Marshall said that the album was bound up with a great deal of bad feeling for him, and Del Naja described that work in two words: the fight. And Vowles soon left the band."
        ru: "Работа над альбомом шла тяжело. Участники группы писали свои партии порознь, порознь записывались и порознь давали интервью, а менеджер присылал Дэвиджу сообщения, чтобы развести их по студийному времени. Дель Ная тянул звук к постпанку, и Воулз спрашивал, не стали ли они панк-группой. Окончательно их рассорила «Teardrop»: Воулз тайком отправил её Мадонне, а остальные хотели, чтобы её спела Элизабет Фрейзер из Cocteau Twins. В итоге её и спела Фрейзер. Двадцать лет спустя Маршалл говорил, что с этим альбомом у него связано много тяжёлого, а Дель Ная описал ту работу одним словом: драка. А Воулз вскоре ушёл из группы."

  - id: olympic
    kind: olympic
    act: 2
    art:
      generated: true
      aspect: "3 / 2"
