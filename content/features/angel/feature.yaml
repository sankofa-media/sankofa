    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: London, Olympic Studios
        ru: Лондон, студия Olympic
      - id: title
        role: title
        draft: false
        en: A song that was not in the plan
        ru: Песня, которой не было в планах
      - id: clash
        role: text
        draft: false
        en: The song “Angel” was not in the original plan for the album. Neil Davidge says it was plucked out of thin air during a mixing session at Olympic Studios in London. The idea had been to make a kind of cover of The Clash's “Straight to Hell” with Horace Andy singing, but Andy was not keen on singing the word “hell”.
        ru: Песни «Angel» не было в первоначальных планах альбома. По словам Нила Дэвиджа, песня родилась буквально из ничего, прямо во время сведения в лондонской студии Olympic. Группа собиралась записать с Хорасом Энди что-то вроде кавера на «Straight to Hell» группы The Clash, но Энди не захотел петь слово «ад».
      - id: angel
        role: text
        draft: false
        en: "So, as Del Naja told it, they stripped the music down almost to nothing and followed what Horace himself suggested: instead of The Clash's song he sang a melody and words taken largely from his own song of 1973, “You Are My Angel”. When Andy first sang the song in the studio, Davidge remembers, all he could say was that it was magic. As for “Straight to Hell”, Andy did record it after all, twenty years later: he released it in 2017 together with Big Youth."
        ru: "Тогда, как рассказывал Дель Ная, музыку разобрали почти до основания и пошли за тем, что предложил сам Хорас: вместо песни The Clash он спел мелодию и слова, взятые во многом из его же песни 1973 года, «You Are My Angel». Когда Энди впервые спел эту песню в студии, Дэвидж, как он сам вспоминает, только и сказал: «Это волшебство». А «Straight to Hell» Энди всё-таки записал, двадцать лет спустя: в 2017 году он выпустил её вместе с Биг Ютом."

