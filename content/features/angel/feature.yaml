    blocks:
      - id: kicker
        role: kicker
        draft: false
        en: What the song is made of
        ru: Из чего собрана песня
      - id: skeleton
        role: text
        draft: false
        en: "At first the song was put together on a computer: its rhythm and parts were programmed rather than played. Davidge describes going through parts and samples and throwing them out one after another. Then live musicians played over that computer draft, among them the guitarist Angelo Bruschini, and suddenly, Davidge says, it was something dark, made for a club and romantic all at once, with very heavy guitars and drums."
        ru: "Сначала песню собирали на компьютере: ритм и партии в ней были запрограммированы, а не сыграны. Дэвидж рассказывает, как они перебирали разные партии и сэмплы и выбрасывали их один за другим. Потом поверх этой компьютерной заготовки сыграли живые музыканты, среди них гитарист Анджело Брускини, и вдруг, по словам Дэвиджа, получилось что-то тёмное, клубное и романтическое разом, с очень тяжёлыми гитарами и барабанами."
      - id: not-the-same
        role: text
        draft: false
        en: "Even that was not yet the final version. At the final mix at Olympic they decided to bring in one more bass line and changed the rhythm patterns, so that, says Davidge, it was certainly no longer the song they had recorded before the mix. The credits name four writers, Del Naja, Marshall, Vowles and Hinds, that is, Horace Andy. The song runs six minutes and eighteen seconds, and its opening rests on a bass you feel in your body more than you hear: the hi-fi magazine What Hi-Fi? has long kept it among its regular test tracks for subwoofers."
        ru: "Но и это была ещё не окончательная версия. Уже на финальном сведении в Olympic музыканты решили добавить ещё одну басовую линию и поменяли ритмический рисунок, так что, говорит Дэвидж, это была уже совсем не та песня, что они записали до сведения. Авторами песни в выходных данных значатся четыре человека: Дель Ная, Маршалл, Воулз и Хайндс, то есть Хорас Энди. Длится песня шесть минут восемнадцать секунд, а её вступление построено на басе, который скорее чувствуешь телом, чем слышишь: журнал What Hi-Fi? давно проверяет на этой песне сабвуферы."

  # ------------------------------------------------ Act III. The breakdown
  - id: break
    kind: break
    act: 3
    photo: bruschini
    blocks:
      - id: guitars
        role: text
        draft: false
        en: In the middle of the song Angelo Bruschini's guitars come in, and the sound, which until then rested on the bass, the drums and the voice, turns dense and heavy. A love song of 1973 sounds here like what the AllMusic critic called perhaps the darkest and heaviest song Massive Attack have ever recorded.
        ru: В середине песни вступают гитары Анджело Брускини, и звук, который до этого держался на басе, барабанах и голосе, становится плотным и тяжёлым. Песня о любви 1973 года звучит здесь так, что критик AllMusic назвал её, пожалуй, самой тёмной и тяжёлой вещью, какую Massive Attack когда-либо записывали.

