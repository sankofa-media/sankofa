    blocks:
      - id: release
        role: text
        draft: false
        en: The album “Mezzanine” came out on 20 April 1998 and went straight to number one in the British charts. The single “Angel”, released on 13 July, got no higher than number thirty and fell to sixty a week later. It never became a hit in the usual sense, which makes it all the more remarkable that this is the song the band would go on to play in concert more than any other.
        ru: Альбом «Mezzanine» вышел 20 апреля 1998 года и сразу занял первое место в британском хит-параде. А сингл «Angel», вышедший 13 июля, поднялся только до тридцатого места и уже через неделю опустился на шестидесятое. Хитом в обычном смысле слова песня так и не стала, и тем удивительнее, что именно её группа потом будет играть на концертах чаще всех остальных.
      - id: video
        role: text
        draft: false
        en: "The video was directed by Walter Stern for Academy Films; for Massive Attack he also made the videos for “Risingson” and “Teardrop”. In it a man gets out of a car in a multi-storey car park, and one person, then two, then more and more begin to follow him. He walks faster, goes out into the open, the crowd keeps growing, and at the end he stops and turns to face it."
        ru: "Клип снял Уолтер Стерн для студии Academy Films; для Massive Attack он снял ещё клипы на «Risingson» и «Teardrop». Человек выходит из машины на многоуровневой парковке, и за ним начинают идти — сначала один, потом двое, потом всё больше. Он ускоряет шаг, выходит на открытое место, толпа растёт, а в самом конце он останавливается и поворачивается к ней лицом."

  - id: beetle
    kind: beetle
    act: 3
    photo: mezzanine-cover
    blocks:
      - id: kicker
