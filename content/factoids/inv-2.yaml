- {"id": "fx-inv-0079", "cat": "inv", "en": "Thomas Jennings patented a method of dry-scouring clothes in 1821.", "ru": "В 1821 году Томас Дженнингс запатентовал способ сухой чистки одежды.", "year": 1821, "place": {"name": "New York", "lat": 40.7128, "lon": -74.006}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "Smithsonian Lemelson Center: Black Inventors and Innovators, 2021 report", "url": "https://invention.si.edu/sites/default/files/Lemelson-Center-Black-Inventors-Innovators-Report-updated-2021-10.pdf", "quote": "Jennings owned a laundry business and was issued US patent X3306 in 1821 for a method of “dry scouring” clothes."}, {"title": "Brian L. Frye: Invention of a Slave, 2018, p. 185; copy hosted by USPTO", "url": "https://www.uspto.gov/sites/default/files/documents/SUCCESSAct-Martin.pdf", "quote": "Thomas Jennings, who patented a method of “dry scouring” clothing in 1821."}], "status": "drafted"}
