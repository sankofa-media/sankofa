- {"id": "fx-inv-0073", "cat": "inv", "en": "James West and Gerhard Sessler received their electret-microphone patent in 1964 (US 3118022).", "ru": "В 1964 году Джеймс Уэст и Герхард Сесслер получили патент на электретный микрофон (US 3118022).", "year": 1964, "place": {"name": "Bell Laboratories, Murray Hill", "lat": 40.6836, "lon": -74.4009}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 3118022", "url": "https://patents.google.com/patent/US3118022A/en", "quote": "US3118022A - Electroacoustic transducer"}, {"title": "Journal of the Franklin Institute: 2010 Benjamin Franklin Medal", "url": "https://www.sciencedirect.com/science/article/pii/S0016003212003043", "quote": "Their US Patent #3,118,022 was issued on January 14, 1964, and is the original patent on the electret microphone."}], "status": "drafted"}
- {"id": "fx-inv-0074", "cat": "inv", "en": "Mark Dean and Dennis Moeller’s 1985 patent let peripheral processors take control of a microcomputer’s bus (US 4528626).", "ru": "Патент Марка Дина и Денниса Мёллера 1985 года позволял периферийным процессорам управлять шиной микрокомпьютера (US 4528626).", "year": 1985, "place": {"name": "Boca Raton", "lat": 26.3683, "lon": -80.1289}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 4528626", "url": "https://patents.google.com/patent/US4528626A/en", "quote": "US4528626A - Microcomputer system with bus control means for peripheral processing devices"}, {"title": "National Inventors Hall of Fame: Mark Dean", "url": "https://www.invent.org/inductees/mark-dean", "quote": "Mark Dean and his co-inventor Dennis Moeller created a microcomputer system with bus control means for peripheral processing devices."}], "status": "drafted"}
