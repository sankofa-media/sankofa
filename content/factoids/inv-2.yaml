- {"id": "fx-inv-0009", "cat": "inv", "en": "Marjorie Joyner patented a permanent-waving machine in 1928, suspending electrically heated curling irons from a dome.", "ru": "В 1928 году Марджори Джойнер запатентовала аппарат для стойкой завивки: электрические щипцы свисали с купола.", "year": 1928, "place": {"name": "Chicago", "lat": 41.8781, "lon": -87.6298}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "National Archives: Celebrate National Women Inventors Month", "url": "https://www.archives.gov/press/press-releases/2020/nr20-46", "quote": "the National Archives is showing Marjorie Joyner’s 1928 patent for her groundbreaking permanent wave machine"}, {"title": "Google Patents: US1693515A", "url": "https://patents.google.com/patent/US1693515A/en", "quote": "M. S. JOYNER PERMANENT WAVING MACHINE -Nov. 27, 1928."}], "status": "drafted"}
- {"id": "fx-inv-0010", "cat": "inv", "en": "Miriam Benjamin patented a chair that summoned attendants with a gong and a red signal in 1888.", "ru": "В 1888 году Мириам Бенджамин запатентовала стул, вызывавший прислугу звоном и красным сигналом.", "year": 1888, "place": {"name": "Washington, DC", "lat": 38.9072, "lon": -77.0369}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Smithsonian Magazine: These Four Black Women Inventors Reimagined the Technology of the Home", "url": "https://www.smithsonianmag.com/science-nature/these-four-black-women-inventors-reimagined-technology-home-180962060/", "quote": "Benjamin was granted her patent by the District of Columbia in 1888 for something called the gong and signal chair."}, {"title": "Google Patents: US386289A", "url": "https://patents.google.com/patent/US386289A/en", "quote": "SPECIFICATION forming pari: of Letters Patent No. 386,289, dated July 17, 1888."}], "status": "drafted"}
- {"id": "fx-inv-0011", "cat": "inv", "en": "Sarah Goode’s 1885 cabinet-bed folded into a desk, saving space in cramped homes.", "ru": "Запатентованная Сарой Гуд в 1885 году кровать складывалась в письменный стол, освобождая место в тесном жилье.", "year": 1885, "place": {"name": "Chicago", "lat": 41.8781, "lon": -87.6298}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Clara Barton Missing Soldiers Office Museum: Sarah E. Goode", "url": "https://clarabartonmuseum.org/sarahegoode/", "quote": "In 1885, approximately twenty years after Clara Barton stopped working for the United States Patent Office, Mrs. Goode applied for a patent"}, {"title": "Google Patents: US322177A", "url": "https://patents.google.com/patent/US322177A/en", "quote": "US322177A - Cabinet-bed … 1885-07-14 Publication of US322177A"}], "status": "drafted"}
- {"id": "fx-inv-0012", "cat": "inv", "en": "Judy Reed patented a dough kneader and roller in 1884, enclosing the dough to protect it from airborne dirt.", "ru": "В 1884 году Джуди Рид запатентовала устройство для замешивания и раскатки теста с закрытым приёмником, защищавшим его от пыли.", "year": 1884, "place": {"name": "Washington, DC", "lat": 38.9072, "lon": -77.0369}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Oxford University Press: Celebrating African American inventors", "url": "https://blog.oup.com/2016/02/african-american-inventors/", "quote": "signing only “X” in place of a signature on her 1884 application. Reed created the “Dough Kneader and Roller,”"}, {"title": "Google Patents: US305474A", "url": "https://patents.google.com/patent/US305474A/en", "quote": "US305474A - Dough kneader and roller … 1884-09-23 Publication of US305474A"}], "status": "drafted"}
- {"id": "fx-inv-0013", "cat": "inv", "en": "Bessie Blount’s 1951 patent supported a food container from the neck so people without usable arms could feed themselves.", "ru": "Патент Бесси Блаунт 1951 года описывал крепление посуды на шее, позволявшее людям, утратившим возможность пользоваться руками, есть самостоятельно.", "year": 1951, "place": {"name": "Newark, New Jersey", "lat": 40.7357, "lon": -74.1724}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Lemelson-MIT: Bessie Blount", "url": "https://lemelson.mit.edu/resources/bessie-blount", "quote": "For this, she received a patent under her married name, Bessie Griffin, in 1951."}, {"title": "Google Patents: US2550554A", "url": "https://patents.google.com/patent/US2550554A/en", "quote": "comfortably worn upon the neck of the users and supported by the chest … 1951-04-24 Publication of US2550554A"}], "status": "drafted"}
- {"id": "fx-inv-0014", "cat": "inv", "en": "Lyda Newman’s 1898 hairbrush patent provided a removable bristle holder for easier cleaning.", "ru": "Патент Лайды Ньюман 1898 года описывал щётку для волос со съёмным держателем щетины, который облегчал чистку.", "year": 1898, "place": {"name": "New York", "lat": 40.7128, "lon": -74.006}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Lemelson-MIT: Lyda Newman", "url": "https://lemelson.mit.edu/resources/lyda-newman", "quote": "Newman received a patent for her invention on November 15, 1898."}, {"title": "Google Patents: US614335A", "url": "https://patents.google.com/patent/US614335A/en", "quote": "arranged to permit of conveniently cleaning the brush whenever desired. … 1898-11-15 Publication of US614335A"}], "status": "drafted"}
- {"id": "fx-inv-0015", "cat": "inv", "en": "Mary Kenner’s 1982 toilet-paper holder kept the loose end away from the roll, making it easier to grasp.", "ru": "Держатель туалетной бумаги Мэри Кеннер, запатентованный в 1982 году, отводил свободный конец от рулона, чтобы его было легче захватить.", "year": 1982, "place": {"name": "Williamsburg, Virginia", "lat": 37.2707, "lon": -76.7075}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Lemelson-MIT: Mary Beatrice Davidson Kenner", "url": "https://lemelson.mit.edu/resources/mary-beatrice-davidson-kenner", "quote": "In the 1980s, Kenner invented a toilet paper dispenser"}, {"title": "Google Patents: US4354643A", "url": "https://patents.google.com/patent/US4354643A/en", "quote": "the free end of the paper is always readily accessible … 1982-10-19 Publication of US4354643A"}], "status": "drafted"}
- {"id": "fx-inv-0016", "cat": "inv", "en": "Mary Kenner patented a wall-mounted back washer in 1987, allowing bathers to scrub hard-to-reach areas by moving against it.", "ru": "В 1987 году Мэри Кеннер запатентовала настенную мочалку: чтобы вымыть труднодоступные участки спины, достаточно было потереться о неё.", "year": 1987, "place": {"name": "Williamsburg, Virginia", "lat": 37.2707, "lon": -76.7075}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "Lemelson-MIT: Mary Beatrice Davidson Kenner", "url": "https://lemelson.mit.edu/resources/mary-beatrice-davidson-kenner", "quote": "a back washer that could be mounted to a shower wall."}, {"title": "Google Patents: US4696068A", "url": "https://patents.google.com/patent/US4696068A/en", "quote": "US4696068A - Shower wall and bathtub mounted back washer … 1987-09-29 Publication of US4696068A"}], "status": "drafted"}
- {"id": "fx-inv-0017", "cat": "inv", "en": "Juliana Rotich co-created Ushahidi, which mapped reports of Kenya’s post-election violence in 2008.", "ru": "Джулиана Ротич участвовала в создании «Ушахиди» — платформы, которая в 2008 году наносила на карту сообщения о насилии после выборов в Кении.", "year": 2008, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "MoMA: Ushahidi", "url": "https://www.moma.org/interactives/exhibitions/2011/talktome//objects/146234/", "quote": "It was launched in Kenya in 2008"}, {"title": "United Nations Africa Renewal: For girls, it is possible to dream big", "url": "https://africarenewal.un.org/en/magazine/girls-it-possible-dream-big", "quote": "Ushahidi, which means “testimony” in Swahili, was initially developed to map reports of post-election violence in Kenya in 2008."}], "status": "drafted"}
- {"id": "fx-inv-0018", "cat": "inv", "en": "Kenya’s Ushahidi platform helped locate survivors after Haiti’s 2010 earthquake.", "ru": "Созданная в Кении платформа «Ушахиди» помогала искать выживших после землетрясения на Гаити в 2010 году.", "year": 2010, "place": {"name": "Port-au-Prince", "lat": 18.5944, "lon": -72.3074}, "cards": [], "gender": "none", "region": "caribbean", "sources": [{"title": "MoMA: Ushahidi", "url": "https://www.moma.org/interactives/exhibitions/2011/talktome//objects/146234/", "quote": "from the 2010 earthquakes in Haiti and Chile"}, {"title": "University of Pennsylvania, Knowledge at Wharton: Ushahidi", "url": "https://knowledge.wharton.upenn.edu/article/ushahidi-the-african-software-platform-helping-victims-in-global-emergencies/", "quote": "The platform was used in the aftermath of the 2010 Haiti earthquake to find survivors"}], "status": "drafted"}
- {"id": "fx-inv-0019", "cat": "inv", "en": "By 2022, Norah Magero’s team had developed VacciBox, a solar-powered vaccine refrigerator transportable by bicycle, motorbike or boat.", "ru": "К 2022 году команда Норы Магеро разработала VacciBox — солнечный холодильник для вакцин, который можно перевозить велосипедом, мотоциклом или лодкой.", "year": 2022, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "Royal Academy of Engineering: First Kenyan wins Africa Prize", "url": "https://raeng.org.uk/news/first-kenyan-wins-africa-prize-for-engineering-innovation-for-portable-vaccine-fridge", "quote": "It can be wheeled or mounted on a bicycle, motorbike or boat"}, {"title": "MIT Solve: VacciBox, updated March 4, 2022", "url": "https://solve.mit.edu/solutions/59649", "quote": "Our solution, VacciBox is a portable solar powered fridge that can easily be mounted on a motorbike, bicycle or boat"}], "status": "drafted"}
- {"id": "fx-inv-0020", "cat": "inv", "en": "In 2024, Esther Kimani’s solar-powered crop monitor used machine vision to identify pests and send farmers text alerts.", "ru": "В 2024 году солнечное устройство Эстер Кимани распознавало вредителей посевов с помощью компьютерного зрения и отправляло земледельцам СМС.", "year": 2024, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "Royal Academy of Engineering: Africa Prize winner 2024", "url": "https://raeng.org.uk/news/africa-prize-winner-2024/", "quote": "The device then notifies the farmer via SMS."}, {"title": "African Development Bank: Esther Kimani, 2022 Youth Adapt Winner, Awarded 2024 Africa Prize", "url": "https://allafrica.com/stories/202407160446.html", "quote": "Solar-powered, the device employs cutting-edge computer vision algorithms and machine learning to identify crop pests and diseases."}], "status": "drafted"}
- {"id": "fx-inv-0021", "cat": "inv", "en": "Bernice Dapaah co-founded Ghana Bamboo Bikes in 2009 to develop bicycles using locally abundant bamboo.", "ru": "В 2009 году Бернис Дапаа стала соосновательницей Ghana Bamboo Bikes, разрабатывавшей велосипеды из местного бамбука.", "year": 2009, "place": {"name": "Kumasi", "lat": 6.6885, "lon": -1.6244}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "UNFCCC: Green Shoots", "url": "https://unfccc.int/news/green-shoots", "quote": "Bernice co-founded the Ghana Bamboo Bike Initiative in 2009"}, {"title": "WIPO: Women in Green: Passion and Innovation for Eco-Mobility", "url": "https://www3.wipo.int/wipogreen/en/news/2020/news_0024.html", "quote": "Her medium-sized company, Ghana Bamboo Bikes, creates bicycles from a locally available material - bamboo"}], "status": "drafted"}
- {"id": "fx-inv-0022", "cat": "inv", "en": "Charlot Magayi founded Mukuru Clean Stoves in 2017 to develop safer cooking technology after her daughter suffered burns.", "ru": "После ожогов у дочери Шарлот Магайи в 2017 году основала Mukuru Clean Stoves, чтобы разрабатывать более безопасные кухонные печи.", "year": 2017, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "The Earthshot Prize: Mukuru Clean Stoves", "url": "https://earthshotprize.org/winners-finalists/mukuru-clean-stoves/", "quote": "Seeking a better solution, in 2017 she founded Mukuru Clean Stoves."}, {"title": "Efficiency for Access: Interview with Charlot Magayi", "url": "https://efficiencyforaccess.org/updates/spotlight-charlot-magayi-of-mukuru-clean-stoves/", "quote": "which led me to start Mukuru Clean Stoves in 2017 in Nairobi."}], "status": "drafted"}
- {"id": "fx-inv-0023", "cat": "inv", "en": "In 2014, Thato Kgatlhanye and Rea Ngwane’s recycled-plastic schoolbags charged solar lamps while children walked to school.", "ru": "В 2014 году Тхато Кгатлханье и Реа Нгване выпускали рюкзаки из переработанного пластика, заряжавшие солнечные фонари по дороге в школу.", "year": 2014, "place": {"name": "Rustenburg", "lat": -25.6676, "lon": 27.2421}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "Brand South Africa: Solar schoolbag lights up homework for rural kids, September 23, 2014", "url": "https://www.brandsouthafrica.com/stay-updated/quick-facts/2014/solar-schoolbag-lights-up-homework-for-rural-kids/", "quote": "have embedded in them solar panels which charge a lantern during the child's walk to school."}, {"title": "CNN: Converting plastic bags into solar panel school bags, December 9, 2014", "url": "https://cisp.cachefly.net/assets/articles/attachments/52841_solar_panel_school_bags_edits%5B2%5D.pdf", "quote": "the solar panels charge while children walk to school and act as a light source when they need to study at night."}], "status": "drafted"}
- {"id": "fx-inv-0024", "cat": "inv", "en": "Nzambi Matee began developing recycled-plastic paving stones in 2017, starting her experiments in her mother’s backyard.", "ru": "В 2017 году Нзамби Мате начала разрабатывать брусчатку из пластиковых отходов, устроив лабораторию во дворе матери.", "year": 2017, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "UNEP: Building blocks for a greener Nairobi", "url": "https://www.unep.org/youngchampions/news/story/building-blocks-greener-nairobi", "quote": "In 2017, Matee quit her job as a data analyst and set up a small lab in her mother’s back yard."}, {"title": "The Explorers Club 50, 2025: Nzambi Matee", "url": "https://50.explorers.org/wp-content/uploads/2025/05/ec50_2025.pdf", "quote": "I founded Gjenge Makers in 2017"}], "status": "drafted"}
- {"id": "fx-inv-0025", "cat": "inv", "en": "William Kamkwamba built a windmill from scrap to bring electricity to his family’s Malawian home in 2002.", "ru": "В 2002 году Уильям Камквамба собрал в Малави ветрогенератор из найденных деталей, чтобы провести электричество в семейный дом.", "year": 2002, "place": {"name": "Wimbe, Malawi", "lat": -13.03, "lon": 33.49}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "University of Notre Dame: William Kamkwamba lecture, 2013", "url": "https://science.nd.edu/assets/91745/lynchlecuture_williamkamkwamba_march2013.pdf", "quote": "In 2002, he gained fame in his country when he built a windmill to power a few electrical appliances"}, {"title": "Hotchkiss School: Inventor and Author William Kamkwamba Shares His Story", "url": "https://www.hotchkiss.org/post-page/~board/school-news/post/inventor-and-author-william-kamkwamba-shares-his-story-humbly", "quote": "In 2002, following a severe drought, Kamkwamba built a windmill to bring electricity to his family’s home."}], "status": "drafted"}
- {"id": "fx-inv-0026", "cat": "inv", "en": "Beth Koigi co-founded Majik Water in 2017 to turn atmospheric moisture into drinking water for water-scarce communities.", "ru": "В 2017 году Бет Коиги стала соосновательницей Majik Water, превращающей влагу воздуха в питьевую воду для районов, страдающих от засухи.", "year": 2017, "place": {"name": "Nairobi", "lat": -1.2921, "lon": 36.8219}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "Majik Water: Beth Koigi", "url": "https://www.majikwater.africa/profiles", "quote": "In 2017, Beth cofounded Majik Water to turn an everyday phenomenon—atmospheric humidity—into lifegiving water."}, {"title": "UL Research Institutes: 2024 Symposium Proceedings, page 38", "url": "https://chemicalinsights.ul.org/wp-content/uploads/2025/02/ULRI_2024_Symposium_Proceedings.pdf", "quote": "Later, in 2017, Koigi co-founded an award-winning social enterprise (Majik Water)"}], "status": "drafted"}
- {"id": "fx-inv-0027", "cat": "inv", "en": "In 2018, Brian Gitta’s team presented Matibabu, a finger-clipping prototype designed to test for malaria without drawing blood.", "ru": "В 2018 году команда Брайана Гитты представила Matibabu — надеваемый на палец прототип для выявления малярии без забора крови.", "year": 2018, "place": {"name": "Kampala", "lat": 0.3476, "lon": 32.5825}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "Makerere University: CS Alumnus wins Africa prize, June 26, 2018", "url": "https://cs.mak.ac.ug/news/view/9", "quote": "Matibabu clips onto a patient's finger and does not require a specialist to operate."}, {"title": "Royal Academy of Engineering: Africa Prize 2018 shortlist", "url": "https://raeng.org.uk/media/211g0fcj/apei-2018-shortlist.pdf", "quote": "Matibabu, a low-cost reusable device that tests for malaria quickly and accurately without drawing blood."}], "status": "drafted"}
- {"id": "fx-inv-0028", "cat": "inv", "en": "By 2014, Thérèse Izay’s team had installed solar-powered humanoid traffic controllers in Kinshasa.", "ru": "К 2014 году команда Терез Изаи установила в Киншасе человекоподобных роботов-регулировщиков на солнечной энергии.", "year": 2014, "place": {"name": "Kinshasa", "lat": -4.4419, "lon": 15.2663}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "Inter Press Service: DR Congo’s Red Light to Invention, April 30, 2014", "url": "https://www.globalissues.org/news/2014/04/30/18601", "quote": "It is also solar-powered to ensure its independence from electricity."}, {"title": "Royal Museum for Central Africa: Kinshasa, press dossier", "url": "https://press.africamuseum.be/sites/default/files/media/Dossier-HK-UK.pdf", "quote": "An android robot regulates traffic on the streets of major Congolese cities."}], "status": "drafted"}
- {"id": "fx-inv-0029", "cat": "inv", "en": "Medieval Great Zimbabwe’s Great Enclosure used parallel walls to create a narrow passage leading toward its towers.", "ru": "В средневековом Большом Зимбабве параллельные стены Великой ограды образовывали узкий проход, ведущий к башням.", "year": 1400, "place": {"name": "Great Zimbabwe", "lat": -20.267, "lon": 30.933}, "cards": ["great-zimbabwe"], "gender": "none", "region": "africa", "sources": [{"title": "Metropolitan Museum: Great Zimbabwe", "url": "https://www.metmuseum.org/essays/great-zimbabwe", "quote": "the outer wall also forms a parallel passage with an inner wall from the northeastern entrance to the Conical Tower."}, {"title": "Smarthistory: Great Zimbabwe", "url": "https://smarthistory.org/great-zimbabwe/", "quote": "Inside the Great Enclosure, a smaller wall parallels the exterior wall creating a tight passageway leading to large towers."}], "status": "drafted", "note": "The year is an approximate medieval timeline anchor; sources differ on the construction chronology."}
- {"id": "fx-inv-0030", "cat": "inv", "en": "Third- and fourth-century Aksumite stone stelae imitate buildings, complete with false windows and doors.", "ru": "Аксумские каменные стелы III–IV веков изображают здания с высеченными в камне ложными окнами и дверями.", "year": 350, "place": {"name": "Aksum", "lat": 14.1311, "lon": 38.7186}, "cards": ["aksum-obelisk"], "gender": "none", "region": "africa", "sources": [{"title": "Metropolitan Museum: The Monumental Stelae of Aksum (3rd–4th Century)", "url": "https://www.metmuseum.org/essays/the-monumental-stelae-of-aksum-3rd-4th-century", "quote": "Further up the monoliths, false four-holed windows have been hewn into the rock."}, {"title": "German Archaeological Institute: The Stelae of Aksum", "url": "https://publications.dainst.org/books/dai/catalog/view/2050/2501/4644", "quote": "Decoration of the storey-decorated stelae might have imitated real buildings (e.g. false windows and doors)"}], "status": "drafted"}
- {"id": "fx-inv-0031", "cat": "inv", "en": "Medieval Kilwa’s Great Mosque used coral and lime to build a roof of domes and vaults.", "ru": "В средневековой Килве крышу Большой мечети составили купола и своды из кораллового камня с известью.", "year": 1400, "place": {"name": "Kilwa Kisiwani", "lat": -8.956, "lon": 39.522}, "cards": ["kilwa-kisiwani"], "gender": "none", "region": "africa", "sources": [{"title": "Archnet: Great Mosque of Kilwa", "url": "https://www.archnet.org/sites/3779", "quote": "the Great Mosque's vaults and domes are constructed out of lime coral concrete."}, {"title": "UNESCO: Ruins of Kilwa Kisiwani and Songo Mnara", "url": "https://whc.unesco.org/en/list/144/", "quote": "roofed entirely with domes and vaults"}], "status": "drafted"}
- {"id": "fx-inv-0032", "cat": "inv", "en": "Medieval Igbo-Ukwu metalworkers cast bronze bowls using lost-wax techniques instead of hammering them from sheet metal.", "ru": "Средневековые мастера Игбо-Укву отливали бронзовые чаши по выплавляемым моделям вместо того, чтобы выколачивать их из листового металла.", "year": 1100, "place": {"name": "Igbo-Ukwu", "lat": 6.0167, "lon": 7.0167}, "cards": ["igbo-ukwu"], "gender": "none", "region": "africa", "sources": [{"title": "Metropolitan Museum: Igbo-Ukwu", "url": "https://www.metmuseum.org/essays/igbo-ukwu-ca-9th-century", "quote": "employ the lost-wax casting techniques in the production of bronze sculptures."}, {"title": "African Archaeological Review: Igbo-Ukwu at 50 (2022)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9640786/", "quote": "The exclusive use of lost-wax casting for leaded bronze including items of sheet metal, such as bowls"}], "status": "drafted"}
- {"id": "fx-inv-0033", "cat": "inv", "en": "Sixteenth- and seventeenth-century Engaruka channelled water through feeder furrows into terraced fields.", "ru": "В XVI–XVII веках жители Энгаруки направляли воду по оросительным канавам на террасные поля.", "year": 1600, "place": {"name": "Engaruka", "lat": -2.995, "lon": 35.963}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "University of York: Geoarchaeological evidence for Engaruka", "url": "https://pure.york.ac.uk/portal/en/publications/geoarchaeological-evidence-for-the-construction-irrigation-cultiv/", "quote": "the construction, irrigation, cultivation and resilience of the 15th-18th-century AD terraced landscape at Engaruka, Tanzania"}, {"title": "UNESCO tentative list: Ziwa cultural landscape, comparison with Engaruka", "url": "https://whc.unesco.org/en/tentativelists/6935/", "quote": "Engaruka was occupied around the 16th and 17th centuries at the foot of the Crater Highlands where reliance on irrigation was essential."}], "status": "drafted"}
- {"id": "fx-inv-0034", "cat": "inv", "en": "Between the eleventh and fifteenth centuries, Ile-Ife maintained workshops that made glass and glass beads.", "ru": "С XI по XV век в Иле-Ифе работали мастерские, изготовлявшие стекло и стеклянные бусины.", "year": 1300, "place": {"name": "Ile-Ife", "lat": 7.4905, "lon": 4.5521}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "Antiquity: Ile-Ife and Igbo Olokun in the history of glass (2017)", "url": "https://www.cambridge.org/core/journals/antiquity/article/abs/ileife-and-igbo-olokun-in-the-history-of-glass-in-west-africa/271A101DC136996C91364464ED61A258", "quote": "the main timing of glass-working between the eleventh and fifteenth centuries AD."}, {"title": "African Archaeological Review: Science, Not Black Magic (2023)", "url": "https://link.springer.com/article/10.1007/s10437-023-09545-6", "quote": "Recent work has demonstrated that glass workshops existed in Sub-Saharan Africa, at least from the eleventh century AD."}], "status": "drafted"}
- {"id": "fx-inv-0035", "cat": "inv", "en": "In the first millennium BCE, Nok communities used stone tools alongside iron tools.", "ru": "В первом тысячелетии до нашей эры общины культуры Нок пользовались каменными орудиями наряду с железными.", "year": -400, "place": {"name": "Taruga", "lat": 9.05, "lon": 7.5}, "cards": ["nok-terracottas"], "gender": "none", "region": "africa", "sources": [{"title": "National Geographic Society: The Nok Culture", "url": "https://education.nationalgeographic.org/resource/nok-culture/", "quote": "while the Nok certainly had iron smelting technology, they also used stone tools as well as metal"}, {"title": "Trevor Getz, OER Project: Ancient Agrarian Societies: Nok Society", "url": "https://www.oerproject.com/en/oer-materials/oer-media/html-articles/origins/unit3/ancient-agrarian-societies-nok", "quote": "archaeologists have been able to show that stone and iron tools were in use at the same time."}], "status": "drafted"}
- {"id": "fx-inv-0036", "cat": "inv", "en": "Around 100,000 years ago, people at Blombos Cave mixed ochre compounds and stored them in abalone shells.", "ru": "Около 100 000 лет назад обитатели пещеры Бломбос готовили смеси с охрой и хранили их в раковинах морского ушка.", "year": -98000, "place": {"name": "Blombos Cave", "lat": -34.412, "lon": 21.215}, "cards": ["blombos-cave"], "gender": "none", "region": "africa", "sources": [{"title": "Science: A 100,000-year-old ochre-processing workshop (2011)", "url": "https://pubmed.ncbi.nlm.nih.gov/21998386/", "quote": "a liquefied ochre-rich mixture was produced and stored in two Haliotis midae (abalone) shells 100,000 years ago."}, {"title": "Smithsonian: The Earliest Known Artists’ Studio (2011)", "url": "https://www.smithsonianmag.com/science-nature/the-earliest-known-artists-studio-111717198/", "quote": "a 100,000-year-old paint-processing workshop in a cave in South Africa, where early humans stored paint mixtures in shell containers."}], "status": "drafted"}
- {"id": "fx-inv-0037", "cat": "inv", "en": "Around 77,000 years ago, Sibudu’s inhabitants made bedding from layers of plants.", "ru": "Около 77 000 лет назад обитатели Сибуду устраивали постели из растительных настилов.", "year": -75000, "place": {"name": "Sibudu", "lat": -29.522, "lon": 31.086}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "University of Tübingen: Bedding discovery, December 8, 2011", "url": "https://uni-tuebingen.de/uploads/media/11-12-08Pflanzenbettungengl.pdf", "quote": "77,000-year-old evidence for preserved plant bedding and the use of insect-repelling plants in a rock shelter in South Africa."}, {"title": "Smithsonian: The World’s Oldest Mattress (2011)", "url": "https://www.smithsonianmag.com/science-nature/the-worlds-oldest-mattress-7513279/", "quote": "This 77,000-year-old mattress was discovered in the Sibudu rock shelter in South Africa"}], "status": "drafted"}
- {"id": "fx-inv-0038", "cat": "inv", "en": "Fourteenth-century Husuni Kubwa palace at Kilwa included an octagonal bathing pool.", "ru": "Во дворце Хусуни-Кубва в Килве, построенном в XIV веке, был восьмиугольный бассейн для купания.", "year": 1320, "place": {"name": "Kilwa Kisiwani", "lat": -8.956, "lon": 39.522}, "cards": ["kilwa-kisiwani"], "gender": "none", "region": "africa", "sources": [{"title": "Archnet: Husuni Kubwa", "url": "https://next.archnet.org/sites/3780", "quote": "The pool itself is octagonal with a diameter of eight meters."}, {"title": "UNESCO: Ruins of Kilwa Kisiwani and Songo Mnara", "url": "https://whc.unesco.org/en/list/144/", "quote": "the palace Husuni Kubwa built between c1310 and 1333 with its large octagonal bathing pool"}], "status": "drafted"}
- {"id": "fx-inv-0039", "cat": "inv", "en": "By 2014, Arthur Zang’s Cardiopad prototype could send heart-test data from rural clinics over mobile networks.", "ru": "К 2014 году прототип Cardiopad Артура Занга позволял передавать результаты обследований сердца из сельских клиник по мобильной сети.", "year": 2014, "place": {"name": "Yaoundé", "lat": 3.848, "lon": 11.502}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "WIPO: Cardiopad, September 22, 2014", "url": "https://www.wipo.int/en/web/wipo-magazine/articles/cardiopad-reaching-the-hearts-of-rural-communities-in-africa-38958", "quote": "The readings are then transferred wirelessly, over the mobile-phone network to specialists in distant urban centers for interpretation, diagnosis and prescribed treatment."}, {"title": "Rolex: Arthur Zang, October 16, 2014", "url": "https://www.rolex.org/rolex-awards/video/applied-technology/arthur-zang", "quote": "His invention – a tablet-computer heart monitor called a Cardio Pad – needs only mobile phone network coverage"}], "status": "drafted"}
- {"id": "fx-inv-0040", "cat": "inv", "en": "By 2013, Richard Turere was using flashing lights to imitate moving guards and deter lions from livestock enclosures.", "ru": "К 2013 году Ричард Турере отпугивал львов от скота мигающими огнями, создававшими видимость движения сторожей.", "year": 2013, "place": {"name": "Kitengela", "lat": -1.45, "lon": 36.95}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "TED: Richard Turere at TED2013, February 26, 2013", "url": "https://blog.ted.com/a-12-year-old-learns-to-scare-lions-richard-turere-at-ted2013/", "quote": "The lights flash and trick the lions that I’m walking around the cowshed when I’m sleeping in my bed."}, {"title": "European Patent Office: Richard Turere", "url": "https://www.epo.org/en/news-events/european-inventor-award/meet-the-finalists/richard-turere", "quote": "In 2013, he established the Lion Lights organisation to deploy the automated lighting system"}], "status": "drafted"}
- {"id": "fx-inv-0041", "cat": "inv", "en": "By 2011, South African student Ludwick Marishane had developed DryBath, a lotion designed for washing without water.", "ru": "К 2011 году южноафриканский студент Людвик Маришане разработал DryBath — лосьон для очищения кожи без воды.", "year": 2011, "place": {"name": "Cape Town", "lat": -33.925, "lon": 18.424}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "University of Cape Town: Student awash with awards, November 28, 2011", "url": "https://www.news.uct.ac.za/article/-2011-11-28-student-awash-with-awards-for-bath-substituting-lotion", "quote": "A novel lotion, DryBath, has won its inventor (and UCT student) Ludwick Marishane top honours"}, {"title": "TED: Ludwick Marishane", "url": "https://www.ted.com/speakers/ludwick_marishane", "quote": "Student Ludwick Marishane invented a water-less bathing lotion and was named the 2011 Global Student Entrepreneur of the Year Award"}], "status": "drafted"}
- {"id": "fx-inv-0042", "cat": "inv", "en": "In 2013, Kodjo Afate Gnikou built a 3D-printer prototype in Lomé using discarded electronic components.", "ru": "В 2013 году Коджо Афате Гнику собрал в Ломе прототип 3D-принтера из выброшенных электронных деталей.", "year": 2013, "place": {"name": "Lomé", "lat": 6.1375, "lon": 1.2123}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "IDEASS: 3D printer made in Togo", "url": "https://www.ideassonline.org/public/pdf/Printer3DTogo2019-ENG.pdf", "quote": "built in 2013 the first 3D printer prototype, using parts from discarded e-waste."}, {"title": "Internet Society: From Inspiration to Innovation, June 16, 2014", "url": "https://www.internetsociety.org/blog/2014/06/from-inspiration-to-innovation-on-the-open-internet/", "quote": "he designed and built a 3D printer using discarded parts from computers and scanners"}], "status": "drafted"}
- {"id": "fx-inv-0043", "cat": "inv", "en": "GhanaSat-1, developed by Ghanaian university engineers, entered orbit from the International Space Station in July 2017.", "ru": "В июле 2017 года созданный ганскими университетскими инженерами GhanaSat-1 вышел на орбиту с Международной космической станции.", "year": 2017, "place": {"name": "All Nations University, Koforidua", "lat": 6.078, "lon": -0.271}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "All Nations University: Ghana’s first satellite", "url": "https://sstl.anuc.edu.gh/ghanas-first-satellite-launched-to-space/", "quote": "Ghanasat-1 was deployed from the International Space Station (ISS) under the JAXA/Kibo CubeSat Deployment Programme on July 7, 2017"}, {"title": "JAXA: BIRDS CubeSats, July 7, 2017", "url": "https://iss.jaxa.jp/en/kiboexp/news/170707_cubesat_birds.html", "quote": "a total of five \"BIRDS project\" CubeSats were successfully deployed from the Japanese Experiment Module \"Kibo\"."}], "status": "drafted"}
- {"id": "fx-inv-0044", "cat": "inv", "en": "In May 2018, the University of Nairobi’s 1KUNS-PF became Kenya’s first satellite in orbit.", "ru": "В мае 2018 года созданный Университетом Найроби аппарат 1KUNS-PF стал первым кенийским спутником на орбите.", "year": 2018, "place": {"name": "University of Nairobi", "lat": -1.279, "lon": 36.816}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "University of Nairobi: Nanosatellite research chair", "url": "https://www.uonbi.ac.ke/news/uon-host-nanosatelite-development-research-chair", "quote": "On May 11, 2018, UoN deployed Kenya’s first space satellite into orbit."}, {"title": "JAXA: CubeSat deployment history", "url": "https://iss.jaxa.jp/en/kiboexp/jssod/history/", "quote": "three CubeSats were successfully deployed on May 11, 2018 from the Japanese Experiment Module “Kibo”"}], "status": "drafted"}
- {"id": "fx-inv-0045", "cat": "inv", "en": "Uganda’s PearlAfricaSat-1 was released into orbit from the International Space Station in December 2022.", "ru": "В декабре 2022 года угандийский PearlAfricaSat-1 был выведен на орбиту с Международной космической станции.", "year": 2022, "place": {"name": "Kampala", "lat": 0.3476, "lon": 32.5825}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "JAXA: International cooperation, December 2, 2022", "url": "https://global.jaxa.jp/projects/activity/int/topics.html", "quote": "On December 2, 2022, First CubeSats of Uganda called ‘PearlAfricaSat-1’"}, {"title": "Uganda Embassy in Japan: Ministerial Policy Statement FY 2023/24", "url": "https://budget.finance.go.ug/sites/default/files/Sector%20Spending%20Agency%20Budgets%20and%20Performance/Uganda%20Embassy%20in%20Japan%2C%20Tokyo_5.pdf", "quote": "Deployment by Japan Aerospace Exploration Agency JAXA was finally held on 2nd December 2022."}], "status": "drafted"}
- {"id": "fx-inv-0046", "cat": "inv", "en": "Zimbabwe’s first satellite, ZIMSAT-1, reached orbit in 2022 through the BIRDS satellite-development programme.", "ru": "Первый спутник Зимбабве, ZIMSAT-1, вышел на орбиту в 2022 году благодаря программе разработки спутников BIRDS.", "year": 2022, "place": {"name": "Harare", "lat": -17.825, "lon": 31.05}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "JAXA: Four CubeSats successfully deployed, December 5, 2022", "url": "https://humans-in-space.jaxa.jp/en/biz-lab/news/detail/002666.html", "quote": "On December 2, 2022, following four CubeSats were successfully deployed from the Japanese Experiment Module (JEM) \"Kibo\":"}, {"title": "Zimbabwe National Geospatial and Space Agency: FAQ", "url": "https://zingsa.ac.zw/faq.html", "quote": "ZIMSAT-1, Zimbabwe’s first satellite, entered service in November 2022"}], "status": "drafted"}
- {"id": "fx-inv-0047", "cat": "inv", "en": "In 2019, Rwanda’s RWASAT-1 carried multispectral cameras designed to support agricultural monitoring.", "ru": "В 2019 году руандийский RWASAT-1 получил многоспектральные камеры для наблюдения за сельскохозяйственными угодьями.", "year": 2019, "place": {"name": "Kigali", "lat": -1.944, "lon": 30.062}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "Rwanda MINICT: Joint press conference on RWASAT-1", "url": "https://www.minict.gov.rw/news-detail/minict-rura-and-embassy-of-japan-held-a-joint-press-conference-on-the-launch-of-rwasat-1", "quote": "the two multi-spectral cameras on board the satellite communicating with already deployed ground sensors in Rwanda."}, {"title": "University of Tokyo ISSL: Space Missions, RWASAT-1", "url": "https://www.space.t.u-tokyo.ac.jp/missions/", "quote": "It is equipped with a weak signal reception mission (Store & Forward, S&F) and a multispectral camera."}], "status": "drafted"}
- {"id": "fx-inv-0048", "cat": "inv", "en": "In July 2017, Nigeria’s Federal University of Technology Akure deployed its NigeriaEduSat-1 CubeSat through the BIRDS programme.", "ru": "В июле 2017 года Федеральный технологический университет Акуре вывел спутник NigeriaEduSat-1 на орбиту в рамках программы BIRDS.", "year": 2017, "place": {"name": "Federal University of Technology Akure", "lat": 7.304, "lon": 5.137}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "FUTA: Collaboration with NASRDA", "url": "https://mail.futa.edu.ng/news/1337-futa-nasrda-to-deepen-collaboration-through-institute-of-aerospace-development", "quote": "On Friday July 7, 2017 FUTA launched the NIGERIA SATELLITE –EDUSAT -1 INTO ORBIT"}, {"title": "JAXA: BIRDS CubeSats, July 7, 2017", "url": "https://iss.jaxa.jp/en/kiboexp/news/170707_cubesat_birds.html", "quote": "Nigeria Edusat1 | Nigeria"}], "status": "drafted"}
- {"id": "fx-inv-0049", "cat": "inv", "en": "In 1969, Marie and Albert Brown patented a home security system combining television surveillance with two-way audio.", "ru": "В 1969 году Мари и Альберт Браун запатентовали домашнюю охранную систему, сочетавшую телевизионное наблюдение с двусторонней голосовой связью.", "year": 1969, "place": {"name": "Queens, New York", "lat": 40.728, "lon": -73.794}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US3482037A", "url": "https://patents.google.com/patent/US3482037A/en", "quote": "A video and audio security system for a house under control of an occupant thereof."}, {"title": "Lemelson-MIT: Marie van Brittan Brown", "url": "https://lemelson.mit.edu/resources/marie-van-brittan-brown", "quote": "In 1969, Brown and her husband received a patent for the invention under the U.S. Patent number 3,482,037."}], "status": "drafted"}
- {"id": "fx-inv-0050", "cat": "inv", "en": "After Hurricane Katrina in 2005, Marian Croak’s team adapted text-message technology to collect charitable donations.", "ru": "После урагана «Катрина» в 2005 году команда Мэриан Кроак приспособила технологию СМС для сбора пожертвований.", "year": 2005, "place": {"name": "AT&T Labs, New Jersey", "lat": 40.682, "lon": -74.4}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "National Inventors Hall of Fame: Marian Croak", "url": "https://www.invent.org/inductees/marian-croak", "quote": "a text-to-donate system for charitable organizations that first saw widespread use after Hurricane Katrina hit New Orleans in 2005"}, {"title": "USC Viterbi Magazine: Marian Croak, Fall 2020", "url": "https://magazine.viterbi.usc.edu/fall-2020/alumni/sending-your-voice-over-the-internet-some-called-it-a-toy-not-marian-croak/", "quote": "Croak and her team adapted the application into a text-to-donate system and made the patent freely available"}], "status": "drafted"}
- {"id": "fx-inv-0051", "cat": "inv", "en": "In 2006, Janet Bashen and her co-inventors received a patent for networked software handling employment-discrimination complaints.", "ru": "В 2006 году Джанет Башен с соавторами получила патент на сетевую систему обработки жалоб о дискриминации на работе.", "year": 2006, "place": {"name": "Houston", "lat": 29.7604, "lon": -95.3698}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US6985922B1", "url": "https://patents.google.com/patent/US6985922B1/en", "quote": "the present invention enables employees of companies to file discrimination complaints, have those complaints investigated"}, {"title": "University of Maine: African American Inventor Gallery", "url": "https://libguides.library.umaine.edu/c.php?g=1511685&p=11305545", "quote": "This led to Patent #6,985,922 in 2006"}], "status": "drafted"}
- {"id": "fx-inv-0052", "cat": "inv", "en": "Christina Jenkins’s 1952 patent described weaving commercial hair into a wearer’s natural hair.", "ru": "Патент Кристины Дженкинс 1952 года описывал вплетение покупных прядей в собственные волосы.", "year": 1952, "place": {"name": "Malvern, Ohio", "lat": 40.692, "lon": -81.182}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US2621663A", "url": "https://patents.google.com/patent/US2621663A/en", "quote": "Permanently attaching commercial hair to live hair"}, {"title": "Carol Frazier: Hair extension attachment, discussion of prior art", "url": "https://patents.google.com/patent/US20040129285A1/en", "quote": "2,621,663, issued on Dec. 16, 1952 to Christina M. Jenkins, titled “Permanently Attaching Commercial Hair To Live Hair,”"}], "status": "drafted"}
- {"id": "fx-inv-0053", "cat": "inv", "en": "In 1929, Marjorie Joyner patented a scalp protector for permanent-wave treatments.", "ru": "В 1929 году Марджори Джойнер запатентовала приспособление для защиты кожи головы при перманентной завивке.", "year": 1929, "place": {"name": "Chicago", "lat": 41.8781, "lon": -87.6298}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US1716173A", "url": "https://patents.google.com/patent/US1716173A/en", "quote": "the construction of a simple and efficient protector for the scalp, used by hairdressers in the permanent waving process."}, {"title": "Lemelson-MIT: Marjorie Joyner", "url": "https://lemelson.mit.edu/resources/marjorie-joyner", "quote": "In 1929, Joyner also patented a scalp protector to make the procedure more comfortable."}], "status": "drafted"}
- {"id": "fx-inv-0054", "cat": "inv", "en": "Patricia Bath’s 2000 patent used pulsed ultrasound to fragment cataract-clouded lenses.", "ru": "Патент Патрисии Бат 2000 года предусматривал дробление помутневшего хрусталика импульсным ультразвуком.", "year": 2000, "place": {"name": "Los Angeles", "lat": 34.0522, "lon": -118.2437}, "cards": ["patricia-bath"], "gender": "f", "region": "us", "sources": [{"title": "US Patent US6083192A", "url": "https://patents.google.com/patent/US6083192A/en", "quote": "Pulsed ultrasound method for fragmenting/emulsifying and removing cataractous lenses"}, {"title": "Martha Davidson, Smithsonian Lemelson Center: The Right To Sight, 2005", "url": "https://invention.si.edu/invention-stories/innovative-lives-right-sight-patricia-bath", "quote": "Pulsed ultrasound method for fragmenting/emulsifying and removing cataractous lenses, issued 4 July 2000"}], "status": "drafted"}
- {"id": "fx-inv-0055", "cat": "inv", "en": "In 2003, Patricia Bath patented an optical-fibre system combining laser and ultrasound energy for cataract removal.", "ru": "В 2003 году Патрисия Бат запатентовала оптоволоконную систему, сочетавшую лазер и ультразвук для удаления катаракты.", "year": 2003, "place": {"name": "Los Angeles", "lat": 34.0522, "lon": -118.2437}, "cards": ["patricia-bath"], "gender": "f", "region": "us", "sources": [{"title": "US Patent US6544254B1", "url": "https://patents.google.com/patent/US6544254B1/en", "quote": "Combined laser and ultrasound energy are transmitted by a flexible line containing at least an optical fiber"}, {"title": "Martha Davidson, Smithsonian Lemelson Center: The Right To Sight, 2005", "url": "https://invention.si.edu/invention-stories/innovative-lives-right-sight-patricia-bath", "quote": "Combination ultrasound and laser method and apparatus for removing cataract lenses"}], "status": "drafted"}
- {"id": "fx-inv-0056", "cat": "inv", "en": "Henrietta Bradberry’s 1943 patent turned a bed attachment into a rack for airing bedding.", "ru": "Патент Генриетты Брэдберри 1943 года превращал прикроватное приспособление в решётку для проветривания постельных принадлежностей.", "year": 1943, "place": {"name": "Chicago", "lat": 41.8781, "lon": -87.6298}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US2320027A", "url": "https://patents.google.com/patent/US2320027A/en", "quote": "exposing bed clothes to freshening by air after use."}, {"title": "Mid-Atlantic Equity Center: Biographies, 1992, p. 166", "url": "https://files.eric.ed.gov/fulltext/ED350369.pdf", "quote": "In 1943, she invented a rack that attached to a bed"}], "status": "drafted"}
- {"id": "fx-inv-0057", "cat": "inv", "en": "In 1945, Henrietta Bradberry patented a pneumatic mechanism for launching torpedoes below the waterline.", "ru": "В 1945 году Генриетта Брэдберри запатентовала пневматический механизм для запуска торпед под водой.", "year": 1945, "place": {"name": "Chicago", "lat": 41.8781, "lon": -87.6298}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US2390688A", "url": "https://patents.google.com/patent/US2390688A/en", "quote": "torpedo discharge means operated pneumatically and adapted to discharge torpedoes below the surface of a body of water"}, {"title": "Mid-Atlantic Equity Center: Biographies, 1992, p. 166", "url": "https://files.eric.ed.gov/fulltext/ED350369.pdf", "quote": "During World War II, Henrietta Bradberry invented a torpedo discharge system."}], "status": "drafted"}
- {"id": "fx-inv-0058", "cat": "inv", "en": "Virgie Ammons’s 1975 patent described a tool that operated a fireplace damper and secured it against fluttering in wind.", "ru": "Патент Вирджи Аммонс 1975 года описывал инструмент, который управлял каминной заслонкой и удерживал её от колебаний на ветру.", "year": 1975, "place": {"name": "Eglon, West Virginia", "lat": 39.301, "lon": -79.52}, "cards": [], "gender": "f", "region": "us", "sources": [{"title": "US Patent US3908633A", "url": "https://patents.google.com/patent/US3908633A/en", "quote": "A tool to open and close a fireplace damper and to operate also as a securing means to prevent fluttering"}, {"title": "Patent and Trademark Resource Center Association: Black inventors, p. 193", "url": "https://ptrca.org/files/handouts/stliblkin.pdf", "quote": "Virgie M. Ammons Sep. 30, 1975 3,908,633 Fireplace Damper Actuating Tool"}], "status": "drafted"}
- {"id": "fx-inv-0059", "cat": "inv", "en": "In the 1950s, Anthony Williams arranged steelpan notes in a circle of fourths and fifths.", "ru": "В 1950-х годах Энтони Уильямс расположил ноты стилпэна по кругу кварт и квинт.", "year": 1955, "place": {"name": "Port of Spain", "lat": 10.6603, "lon": -61.5086}, "cards": [], "gender": "m", "region": "caribbean", "sources": [{"title": "University of the West Indies: Anthony Williams, December 22, 2021", "url": "https://sta.uwi.edu/news/releases/release.asp?id=22369", "quote": "In the 1950s, Mr Williams invented the 4ths-and-5ths note layout pattern"}, {"title": "NIHERST: Anthony Williams", "url": "https://niherst.gov.tt/icons/icon/anthony-williams-tt1/", "quote": "each note is a fourth from its neighbour in a clockwise direction"}], "status": "drafted"}
- {"id": "fx-inv-0060", "cat": "inv", "en": "By 1956, Bertie Marshall was tuning steelpan notes with harmonics, transforming the instrument’s tone.", "ru": "К 1956 году Берти Маршалл освоил настройку обертонов стилпэна, преобразив его звучание.", "year": 1956, "place": {"name": "Port of Spain", "lat": 10.6603, "lon": -61.5086}, "cards": [], "gender": "m", "region": "caribbean", "sources": [{"title": "National Archives of Trinidad and Tobago: Bertie Marshall, 2012", "url": "https://nationalarchivestt.wordpress.com/2012/10/19/bertie-marshall-icon-of-our-culture/", "quote": "By 1956 Bertie Marshall had accomplished the most significant development in today’s steelpan tone"}, {"title": "Federation of Independent Trade Unions and NGOs: Tribute, 2012", "url": "https://www.panonthenet.com/news/2012/oct/bertie-marshall-fitun-tribute-10-24-2012.htm", "quote": "Marshall is credited with introducing the harmonic tuning of Steelpan notes in 1956"}], "status": "drafted"}
- {"id": "fx-inv-0061", "cat": "inv", "en": "Around 1960, Bertie Marshall developed the double-tenor steelpan, spreading one player’s notes across two drums.", "ru": "Около 1960 года Берти Маршалл создал двойной теноровый стилпэн, распределив ноты одного исполнителя между двумя барабанами.", "year": 1960, "place": {"name": "Port of Spain", "lat": 10.6603, "lon": -61.5086}, "cards": [], "gender": "m", "region": "caribbean", "sources": [{"title": "Aurélie Helmlinger, Anthropologie et Sociétés, 2014, p. 144", "url": "https://www.erudit.org/en/journals/as/2014-v38-n1-as01471/1025812ar.pdf", "quote": "D’après le tuner Tony Slater, l’instrument aurait été inventé au tournant des années 1960."}, {"title": "NIHERST: Bertie Marshall", "url": "https://niherst.gov.tt/icons/icon/bertie-marshall-tt1/", "quote": "he created the high tenor and then the double-tenor to accommodate lower notes."}], "status": "drafted"}
- {"id": "fx-inv-0062", "cat": "inv", "en": "Around 1946, Ellie Mannette made steelpan playing surfaces concave, increasing the space available for tuned notes.", "ru": "Около 1946 года Элли Мэннет сделал игровую поверхность стилпэна вогнутой, увеличив место для настроенных нот.", "year": 1946, "place": {"name": "Port of Spain", "lat": 10.6603, "lon": -61.5086}, "cards": [], "gender": "m", "region": "caribbean", "sources": [{"title": "Metropolitan Museum: American Musical Instruments, 1985, p. 57", "url": "https://www.survivorlibrary.com/library/american_musical_instruments_in_the_metropolitan_museum_1985.pdf", "quote": "Mannette sawed the end off a fifty-five-gallon drum, hammered the head concave to increase its surface area"}, {"title": "National Endowment for the Arts: Elliott Mannette", "url": "https://www.arts.gov/honors/heritage/elliott-ellie-mannette", "quote": "He sank the lid to create a tensed playing surface and fired the metal to improve the acoustic properties."}], "status": "drafted"}
- {"id": "fx-inv-0063", "cat": "inv", "en": "Introduced in 2007, Trinidad’s G-Pan used purpose-made steel sheets instead of recycled oil drums.", "ru": "Представленный в 2007 году тринидадский G-Pan делали из специально подготовленных стальных листов вместо старых нефтяных бочек.", "year": 2007, "place": {"name": "University of the West Indies, St Augustine", "lat": 10.639, "lon": -61.4}, "cards": [], "gender": "none", "region": "caribbean", "sources": [{"title": "Brian Copeland: Installation address, UWI, 2017", "url": "https://sta.uwi.edu/uwitoday/pdfs/address_bc.pdf", "quote": "The G-Pan was officially launched on July 14th, 2007 at the UWI JFK Quadrangle"}, {"title": "WIPO: Intellectual property and innovation in Trinidad and Tobago, p. 26", "url": "https://www.wipo.int/edocs/pubdocs/en/wipo_report_inn_tt.pdf", "quote": "unlike traditional pans that are made of oil drums, constructed from durable, high-grade steel sheets."}], "status": "drafted"}
- {"id": "fx-inv-0064", "cat": "inv", "en": "In 2008, UWI demonstrated the PHI, an electronic instrument shaped for steelpan players.", "ru": "В 2008 году Университет Вест-Индии продемонстрировал PHI — электронный инструмент с привычной для исполнителей на стилпэне формой.", "year": 2008, "place": {"name": "University of the West Indies, St Augustine", "lat": 10.639, "lon": -61.4}, "cards": [], "gender": "none", "region": "caribbean", "sources": [{"title": "UWI: Researchers invent electronic PHI-pan, February 6, 2008", "url": "https://sta.uwi.edu/news/releases/release.asp?id=93", "quote": "PHI merges the powerful facility of MIDI with a physical form inspired by the traditional Steel Pan."}, {"title": "WIPO: Intellectual property and innovation in Trinidad and Tobago, p. 26", "url": "https://www.wipo.int/edocs/pubdocs/en/wipo_report_inn_tt.pdf", "quote": "The PHI is an electronic instrument."}], "status": "drafted"}
- {"id": "fx-inv-0065", "cat": "inv", "en": "In the late 1990s, Maggie Aderin-Pocock developed handheld landmine-detection instruments.", "ru": "В конце 1990-х годов Мэгги Адерин-Покок разрабатывала переносные приборы для обнаружения противопехотных мин.", "year": 1998, "place": {"name": "London", "lat": 51.5074, "lon": -0.1278}, "cards": [], "gender": "f", "region": "europe", "sources": [{"title": "Science in School: Maggie Aderin-Pocock, 2012", "url": "https://scienceinschool.org/article/2012/aderin/", "quote": "Her next project involved developing hand-held land-mine detectors"}, {"title": "Royal Academy of Engineering: Maggie Aderin-Pocock", "url": "https://raeng.org.uk/about-us/fellowship/new-fellows-2025/dame-maggie-aderin-pocock-dbe-honfreng/", "quote": "landmine detection tools"}], "status": "drafted"}
- {"id": "fx-inv-0066", "cat": "inv", "en": "From 1999, Maggie Aderin-Pocock helped develop an optical spectrograph for Chile’s Gemini Observatory.", "ru": "С 1999 года Мэгги Адерин-Покок участвовала в создании оптического спектрографа для обсерватории Джемини в Чили.", "year": 1999, "place": {"name": "University College London", "lat": 51.5246, "lon": -0.134}, "cards": [], "gender": "f", "region": "europe", "sources": [{"title": "Science in School: Maggie Aderin-Pocock, 2012", "url": "https://scienceinschool.org/article/2012/aderin/", "quote": "managing a project making bHROS, an optical spectrograph for the Gemini Telescope in Chile."}, {"title": "Royal Academy of Engineering: Maggie Aderin-Pocock", "url": "https://raeng.org.uk/about-us/fellowship/new-fellows-2025/dame-maggie-aderin-pocock-dbe-honfreng/", "quote": "From 1999 to 2005, she developed a spectrograph for the Gemini Observatory in Chile."}], "status": "drafted"}
- {"id": "fx-inv-0067", "cat": "inv", "en": "In 1964, Melody Millicent Danquah became Ghana’s first female pilot.", "ru": "В 1964 году Мелоди Миллисент Данква стала первой женщиной-пилотом Ганы.", "year": 1964, "place": {"name": "Takoradi", "lat": 4.904, "lon": -1.759}, "cards": [], "gender": "f", "region": "africa", "sources": [{"title": "King’s College London: Melody Millicent Danquah", "url": "https://www.kcl.ac.uk/melody-millicent-danquah", "quote": "The first flight she accomplished by herself was in June 1964"}, {"title": "Ghana Civil Aviation Authority: Melody Millicent Danquah tribute", "url": "https://www.linkedin.com/posts/ghana-civil-aviation-authority_ghanamonth-female-pilot-activity-7308860559414747136-BlJ_", "quote": "In 1964, she made history by becoming the first Ghanaian woman to fly an aircraft"}], "status": "drafted"}
- {"id": "fx-inv-0068", "cat": "inv", "en": "In June 2021, Mauritius’s MIR-SAT1 satellite was deployed from the International Space Station.", "ru": "В июне 2021 года маврикийский спутник MIR-SAT1 был выведен на орбиту с Международной космической станции.", "year": 2021, "place": {"name": "Mauritius Research and Innovation Council, Ebène", "lat": -20.245, "lon": 57.492}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "JAXA: Two CubeSats successfully deployed, June 25, 2021", "url": "https://humans-in-space.jaxa.jp/en/biz-lab/news/detail/001514.html", "quote": "On June 22, 2021, two CubeSats, MIR-SAT1 developed by Mauritius Research and Innovation Council"}, {"title": "Mauritius Ministry of IT: Annual Report 2020–2021, p. 27", "url": "https://mitci.govmu.org/Lists/DocumentsLinks/Attachments/54/Annual%20Report%202020-2021.pdf", "quote": "The MIR-SAT1 was successfully deployed into Space from the International Space Station (ISS)"}], "status": "drafted"}
- {"id": "fx-inv-0069", "cat": "inv", "en": "Alexander Miles patented automatic elevator-door mechanisms in 1887 (US 371207).", "ru": "В 1887 году Александр Майлз запатентовал механизмы автоматического открывания и закрывания дверей лифта (US 371207).", "year": 1887, "place": {"name": "Duluth", "lat": 46.7867, "lon": -92.1005}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 371207", "url": "https://patents.google.com/patent/US371207A/en", "quote": "US371207A - Elevator"}, {"title": "National Inventors Hall of Fame: Alexander Miles", "url": "https://www.invent.org/inductees/alexander-miles", "quote": "Miles patented his design for an improved method for opening and closing elevators in 1887."}], "status": "drafted"}
- {"id": "fx-inv-0070", "cat": "inv", "en": "Dentist George Grant patented a golf tee in 1899 (US 638920).", "ru": "В 1899 году дантист Джордж Грант запатентовал подставку для мяча в гольфе (US 638920).", "year": 1899, "place": {"name": "Boston", "lat": 42.3601, "lon": -71.0589}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 638920", "url": "https://patents.google.com/patent/US638920A/en", "quote": "US638920A - Golf-tee."}, {"title": "Harvard Dental, Spring 2023", "url": "https://www.hsdm.harvard.edu/sites/g/files/omnuum6001/files/dental/files/harvarddental_spring2023_web.pdf", "quote": "On December 12, 1899, he received U.S. patent No. 638,920, the first patent for a wooden golf tee."}], "status": "drafted"}
- {"id": "fx-inv-0071", "cat": "inv", "en": "Elijah McCoy’s 1872 lubricator supplied oil while steam engines ran (US 129843).", "ru": "Маслёнка Элайджи Маккоя, запатентованная в 1872 году, смазывала паровой двигатель без остановки (US 129843).", "year": 1872, "place": {"name": "Ypsilanti", "lat": 42.2411, "lon": -83.613}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 129843", "url": "https://patents.google.com/patent/US129843A/en", "quote": "US129843A - Improvement in lubricators for steam-engines"}, {"title": "National Inventors Hall of Fame: Elijah McCoy", "url": "https://www.invent.org/inductees/elijah-mccoy", "quote": "He earned his first patent for this invention, known as the “oil-drip cup,” in 1872"}], "status": "drafted"}
