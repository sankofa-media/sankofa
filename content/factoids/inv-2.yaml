- { "id": "fx-inv-0036", "cat": "inv", "en": "Around 100,000 years ago, people at Blombos Cave mixed ochre compounds and stored them in abalone shells.", "ru": "Около 100 000 лет назад обитатели пещеры Бломбос готовили смеси с охрой и хранили их в раковинах морского ушка.", "year": -98000, "place": { "name": "Blombos Cave", "lat": -34.412, "lon": 21.215 }, "cards": [ "blombos-cave" ], "gender": "none", "region": "africa", "sources": [ { "title": "Science: A 100,000-Year-Old Ochre-Processing Workshop at Blombos Cave, South Africa (2011)", "url": "https://icomos.ng/Publications/Henshilwood_et_al_2011_A_100ka_year_old_ochre_processing_workshop_at_Blombos_cave_SCIENCE.pdf", "quote": "ochre-rich mixture was produced and stored in two Haliotis midae (abalone) shells 100,000 years ago." }, { "title": "PBS NewsHour: Ancient Paint Studio Unearthed (2011)", "url": "https://www.pbs.org/newshour/science/people-were-mixing-and", "quote": "two abalone shells from a South African cave that they believe were used to produce and store a mixture of pigmented paint" } ], "status": "checked" }
