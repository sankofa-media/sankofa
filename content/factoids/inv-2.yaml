- { "id": "fx-inv-0017", "cat": "inv", "en": "Ushahidi was developed in 2008 to map reports of post-election violence in Kenya.", "ru": "Платформа «Ушахиди» была создана в 2008 году, чтобы наносить на карту сообщения о насилии после выборов в Кении.", "year": 2008, "place": { "name": "Nairobi", "lat": -1.2921, "lon": 36.8219 }, "cards": [], "gender": "f", "region": "africa", "sources": [ { "title": "Institut Veolia: interview with Juliana Rotich, 2017", "url": "https://www.institut.veolia.org/sites/g/files/dvc2551/files/document/2017/05/08_Interview_Juliana_Rotich_SMART-CITIES-EN.pdf", "quote": "It was developed to map reports of violence in Kenya after the post-election violence in 2008." }, { "title": "United Nations Africa Renewal: For girls, it is possible to dream big", "url": "https://africarenewal.un.org/en/magazine/girls-it-possible-dream-big", "quote": "Ushahidi, which means “testimony” in Swahili, was initially developed to map reports of post-election violence in Kenya in 2008." } ], "status": "checked" }
