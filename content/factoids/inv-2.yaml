- {"id": "fx-inv-0081", "cat": "inv", "en": "Ancient Meroe’s industrial remains include iron-smelting workshops that helped sustain the Kushite kingdom.", "ru": "Среди промышленных сооружений древнего Мероэ сохранились следы железоплавильных мастерских, обеспечивавших могущество Кушитского царства.", "year": 200, "place": {"name": "Meroe", "lat": 16.938, "lon": 33.75}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "UNESCO: Archaeological Sites of the Island of Meroe", "url": "https://whc.unesco.org/en/list/1336/", "quote": "including ceramics and iron-works, testify to the wealth and power of the Kushite State."}, {"title": "Humphris et al., Journal of Field Archaeology, 2018: Iron Smelting in Sudan", "url": "https://www.repository.cam.ac.uk/items/ee03ff66-1277-4668-9830-43095946d816", "quote": "the workshop space created by the ancient iron smelters during the later and post-Meroitic times."}], "status": "drafted", "note": "The year is an approximate timeline anchor within the Meroitic period, not a claimed invention date."}
- {"id": "fx-inv-0082", "cat": "inv", "en": "Konso farmers’ centuries-old stone terraces retain soil and water on Ethiopia’s steep hillsides.", "ru": "Каменные террасы, которые земледельцы консо возводят веками, удерживают почву и воду на крутых склонах Эфиопии.", "year": 1600, "place": {"name": "Konso", "lat": 5.25, "lon": 37.4833}, "cards": [], "gender": "none", "region": "africa", "sources": [{"title": "UNESCO: Konso Cultural Landscape", "url": "https://whc.unesco.org/en/list/1333/", "quote": "The terraces retain the soil from erosion, collect a maximum of water, discharge the excess"}, {"title": "CIFOR-ICRAF: Indigenous Landscape Management in Konso, Southern Ethiopia", "url": "https://www.cifor-icraf.org/publications/downloads/Publications/PDFS/B19055.pdf", "quote": "Soil and water conservation terraces help to control land degradation, reduce run-off/soil erosion"}], "status": "drafted", "note": "The year is an approximate anchor: UNESCO describes a tradition spanning more than 400 years, not a precise construction date."}
- {"id": "fx-inv-0083", "cat": "inv", "en": "In fifteenth-century Benin, Oba Ewuare strengthened the capital’s monumental earthwork defenses.", "ru": "В Бенине XV века оба Эвуаре укрепил столицу монументальными земляными оборонительными сооружениями.", "year": 1450, "place": {"name": "Benin City", "lat": 6.335, "lon": 5.6037}, "cards": [], "gender": "m", "region": "africa", "sources": [{"title": "Metropolitan Museum of Art: Altar Tusk, curatorial essay", "url": "https://www.metmuseum.org/art/collection/search/312459", "quote": "During the fifteenth century reign of Oba Ewuare, Benin’s armies were formed and the fortification of its capital with a massive wall undertaken."}, {"title": "Philip Darling: Benin Earthworks, Africa Update, Spring 2008", "url": "https://sites.ccsu.edu/afstudy/africaupdate/upd15-2.html", "quote": "then deepened up to 20m by Oba Ewuare in the mid-15th century"}], "status": "drafted", "note": "The year marks the middle of the century; the claim does not give an exact construction year."}
