- {"id": "fx-inv-0076", "cat": "inv", "en": "Granville Woods’s 1887 railway telegraph connected moving trains with trackside telegraph wires without direct contact (US 373383).", "ru": "Телеграф Грэнвилла Вудса 1887 года связывал движущийся поезд с придорожными телеграфными проводами без прямого контакта (US 373383).", "year": 1887, "place": {"name": "Cincinnati", "lat": 39.1031, "lon": -84.512}, "cards": [], "gender": "m", "region": "us", "sources": [{"title": "US patent 373383", "url": "https://patents.google.com/patent/US373383A/en", "quote": "between the carroofs of a moving train or suitable apparatus carried thereon and the said telegraph-lines. … 1887-11-15 Publication of US373383A"}, {"title": "National Inventors Hall of Fame: Granville Woods", "url": "https://www.invent.org/inductees/granville-woods", "quote": "Based on telegraphony, Woods invented the induction telegraph in 1887."}], "status": "drafted"}
