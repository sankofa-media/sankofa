- { "id": "fx-inv-0029", "cat": "inv", "en": "Medieval Great Zimbabwe’s Great Enclosure used parallel walls to create a narrow passage leading toward its conical tower.", "ru": "В средневековом Большом Зимбабве параллельные стены Великой ограды образовывали узкий проход, ведущий к конической башне.", "year": 1400, "place": { "name": "Great Zimbabwe", "lat": -20.267, "lon": 30.933 }, "cards": [ "great-zimbabwe" ], "gender": "none", "region": "africa", "sources": [ { "title": "Zimbabwe Tourism Promotion Board: Great Zimbabwe, UN Trade Point mirror at University of Warsaw", "url": "https://sunsite.icm.edu.pl/untpdc/incubator/zwe/tphar/vrz10011.htm", "quote": "Two high walls form the narrow parallel passage, 180 feet long, that allows direct access from the north entrance" }, { "title": "OpenStax: World History, Medieval Sub-Saharan Africa", "url": "https://openstax.org/books/world-history-volume-1/pages/15-2-medieval-sub-saharan-africa", "quote": "Inside the Great Enclosure, a subsidiary wall forms a corridor and channels visitors to a conical stone tower" } ], "status": "unverified", "note": "The year is an approximate medieval timeline anchor; sources differ on the construction chronology." }
