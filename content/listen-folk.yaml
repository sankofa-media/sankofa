  about: "A full ring shout: dancers move counterclockwise, a leader calls and the group answers, and a stick beaten on the wooden floor keeps the beat; the tradition, first described in detail during the Civil War, was thought extinct until its rediscovery in McIntosh County in 1980."
  aboutRu: "Настоящий «ринг-шаут»: участники движутся по кругу против часовой стрелки, ведущий запевает, остальные отвечают, а палка, которой бьют по деревянному полу, держит ритм. Обычай, подробно описанный ещё в годы Гражданской войны, считали исчезнувшим, пока в 1980 году его не нашли в округе Макинтош."
