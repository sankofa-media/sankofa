story: "Jimmy Cliff’s soulful voice was formed on the American rhythm and blues he heard on Jamaican radio — Little Richard, Sam Cooke, Ray Charles. He began with ska singles in the early 1960s and became reggae’s first global star, carrying its live Kingston sound and its political edge around the world."
storyRu: "Проникновенный голос Джимми Клиффа сложился на американском ритм-н-блюзе, который он слышал по ямайскому радио, — Литл Ричард, Сэм Кук, Рэй Чарльз. Он начинал с синглов ска в начале 1960-х и стал первой мировой звездой регги, разнеся по миру его живое кингстонское звучание и политическую остроту."
