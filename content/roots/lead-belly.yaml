story: "Lead Belly carried the work songs he had learned onto the concert stage, with a percussive pulse and a spoken story before each song. As a blues singer he stood on the twelve-string guitar and a sharp, keening voice."
storyRu: "Ледбелли перенёс выученные рабочие песни на концертную сцену: ударный пульс и устный рассказ перед каждой песней. Как блюзовый певец он опирался на двенадцатиструнную гитару и пронзительный, причитающий голос."
