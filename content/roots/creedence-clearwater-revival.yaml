story: "John Fogerty took the rasp and howl of his singing from Little Richard, whose records also spurred his first songs. Creedence Clearwater Revival played the rock and roll they had grown up with, from fifties rockabilly on: concise, hard-driving three-minute songs blended with soul, R&B and country."
storyRu: "Хрипотцу и вопль своего пения Джон Фогерти взял у Литл Ричарда, чьи пластинки подтолкнули его и к первым песням. Creedence Clearwater Revival играли рок-н-ролл, на котором выросли, — от рокабилли пятидесятых и дальше: сжатые, напористые трёхминутные песни, сплавленные с соулом, ритм-н-блюзом и кантри."
