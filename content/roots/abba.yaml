story: "ABBA modelled their songwriting on the Beatles: every song written as a potential hit, every album varied, pop sources studied and reshaped with scholarly exactitude. From “Dancing Queen” to Voulez-Vous they turned to disco, looking for the African-American dance groove they admired in Stevie Wonder."
storyRu: "ABBA строили своё песенное мастерство по образцу The Beatles: каждая песня писалась как возможный хит, каждый альбом — разнообразным, а поп-источники изучались и переплавлялись с учёной точностью. От «Dancing Queen» до «Voulez-Vous» они обратились к диско в поисках афроамериканского танцевального грува, которым восхищались у Стиви Уандера."
