        text: "The Rock & Roll Hall of Fame credits the Clash with creating and defining punk, describing their uptempo manifestos and their political conscience."
        textRu: "Зал славы рок-н-ролла считает The Clash одними из создателей панка, говоря об их стремительных песнях-манифестах и политической совести."
        source:
