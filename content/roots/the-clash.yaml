    scope: "career"
  - to: "card:reggae"
    kind: "influence"
    how: "From reggae the Clash took a heavy, prominent bass that moves like dancing feet, Jamaican rhythm and later its DJ-style toasting and dub, and the idea of music as protest; they called the result punk reggae, not white reggae."
    howRu: "У регги The Clash взяли тяжёлый, выдвинутый вперёд бас, который движется как ноги в танце, ямайский ритм, позже — диджейскую декламацию и даб, а с ними и мысль, что музыка может быть протестом. Итог они называли панк-регги, а не «белым регги»."
    carries: []
    dimensions: ["rhythm", "sound", "melody-vocal", "image"]
    evidence:
      - type: "listening"
        dimensions: ["rhythm", "sound"]
        text: "Paul Simonon says he learned his bass lines by playing along to reggae records, which he heard growing up in Brixton and Ladbroke Grove."
        textRu: "Пол Симонон рассказывает, что учился басовым партиям, подыгрывая пластинкам регги, которые слышал, когда рос в Брикстоне и Ладброук-Гроуве."
        source:
          title: "Far Out: Why The Clash's Paul Simonon claims there's no bass in The Who"
          url: "https://faroutmagazine.co.uk/the-clash-paul-simonon-claims-no-bass-in-the-who/"
          quote: "Whereas reggae, I just put the record on and play along to it and work out the lines."
      - type: "testimony"
        dimensions: ["image"]
        text: "Simonon recalls reggae as the only music of the time that had something to say; Strummer called the band's version punk reggae."
        textRu: "Симонон вспоминает, что регги была тогда единственной музыкой, которой было что сказать; Страммер называл версию группы панк-регги."
        source:
          title: "KEXP (Janice Headley): Which Bands Mattered to the “Only Band That Matters”? (2021)"
          url: "https://kexp.org/read/2021/2/5/which-bands-mattered-only-band-matters/"
          quote: "that's the only music that seemed to me at that time that had something to say for itself."
      - type: "critics"
        dimensions: ["rhythm", "melody-vocal"]
        text: "Ian Thomson hears London Calling arrive in Jamaican reggae and ska, and Sandinista! take up Jamaican DJ delivery, dubbing and toasting."
        textRu: "Иэн Томсон слышит, как «London Calling» врывается ямайским регги и ска, а «Sandinista!» перенимает манеру ямайских диджеев — даб и тостинг."
        source:
          title: "The Irish Times (Ian Thomson): London Calling 40 years on (2019)"
          url: "https://www.irishtimes.com/culture/music/london-calling-40-years-on-how-the-clash-rewrote-the-rule-book-1.4102171"
          quote: "a blaze of righteous Jamaican reggae and driving dance-floor ska."
