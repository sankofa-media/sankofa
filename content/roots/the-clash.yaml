        text: "The band's own archive describes the debut album as the sound, attitude and image of London's DIY punk scene."
        textRu: "Архив группы описывает дебютный альбом как звук, настрой и облик лондонской панк-сцены «сделай сам»."
        source:
          title: "The Clash (official site): The Clash (1977)"
          url: "https://www.theclash.com/music/the-clash"
