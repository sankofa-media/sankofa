story: "The Clash were one of the bands that defined British punk: fast, explosive songs played as political manifestos. Into that punk they let the reggae of West London's streets — Paul Simonon learned his bass by playing along to Jamaican records, and the band called their mix punk reggae."
storyRu: "The Clash — одна из групп, из которых сложился британский панк: быстрые, взрывные песни, сыгранные как политические манифесты. В этот панк они впустили регги лондонских улиц: Пол Симонон учился играть на басу под ямайские пластинки, а сама группа называла свою смесь панк-регги."
links:
  - to: "style:punk"
    kind: "style"
    how: "Fast, uptempo songs played with raw adrenaline as political statements: the Clash carried punk's sound, attitude and image and gave the movement its political conscience."
    howRu: "Быстрые песни, сыгранные на голом адреналине как политические заявления: The Clash несли звук, настрой и облик панка и дали движению политическую совесть."
