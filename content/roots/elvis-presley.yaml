story: "Elvis Presley named Arthur Crudup as the model for how he banged his guitar and felt the blues. His rock and roll melded blues and R&B with country and gospel, sung with rough passion over a bump-and-grind rhythm and staged with provocative, hip-shaking performance."
storyRu: "Элвис Пресли называл Артура Крадапа образцом того, как сам колотил по гитаре и чувствовал блюз. Его рок-н-ролл сплавил блюз и ритм-н-блюз с кантри и госпелом: грубая страсть вокала, ритм с «покачиванием бёдер» и вызывающая сценическая пластика."
