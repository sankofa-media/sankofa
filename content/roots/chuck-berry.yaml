story: "Chuck Berry listened above all to the Chicago blues of Muddy Waters. He fused blues, R&B and country into the template of rock and roll: jazz-tinged guitar riffs over jump-blues rhythm, story lyrics in rhythmic bursts, and the duck walk."
storyRu: "Чак Берри слушал прежде всего чикагский блюз Мадди Уотерса. Он сплавил блюз, ритм-н-блюз и кантри в образец рок-н-ролла: гитарные риффы с джазовой закваской поверх ритма джамп-блюза, сюжетные тексты ритмичными очередями и «утиная походка»."
