story: "Howlin’ Wolf built on Charley Patton’s gruff vocals, riff-based blues and showmanship. He carried that Delta blues into an amplified band, with a voice ranging from growl to falsetto howl over slashing guitar riffs and pounding drums."
storyRu: "Хаулин Вулф строил своё на грубоватом вокале, риффовом блюзе и сценической хватке Чарли Паттона. Этот дельта-блюз он перенёс в электрический бэнд: голос от рыка до фальцетного воя поверх режущих гитарных риффов и тяжёлых барабанов."
