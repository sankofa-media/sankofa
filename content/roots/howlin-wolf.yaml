          quote: "On record, Wolf's huge, ferocious voice sounded as if it were torn from the back of his throat. His high-pressure moaning punctuated by a wolfish howl sounded like an amped-up Tommy Johnson. Wolf's harmonica playing held the melody while Willie Johnson played slashing guitar riffs and Willie Steel pounded the drums ferociously."
