    howRu: "Вулф перенёс полевые кличи и дельта-блюз в небольшой электрический бэнд: голос от утробного рыка до фальцетного воя, звучащий на равных с перегруженными гитарой и губной гармоникой, режущие гитарные риффы, тяжёлые барабаны и необузданное, телесное шоу."
