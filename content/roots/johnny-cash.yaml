    kind: "style"
    how: "Cash worked in country: plainspoken narrative songs of the everyman, a deep booming baritone, and a stripped, percussive sound of muted acoustic guitar, bass and lead guitar, framed by the image of the Man in Black."
    howRu: "Кэш работал в кантри: простые повествовательные песни о простом человеке, глубокий гулкий баритон и скупой, ударный звук — приглушённая акустическая гитара, бас и соло-гитара, а вокруг — образ Человека в чёрном."
