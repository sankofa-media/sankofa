story: "Johnny Cash worked in country music: plainspoken narrative songs, a booming baritone and a bare, stark sound of acoustic guitar, bass and lead guitar. As a boy he listened to Sister Rosetta Tharpe on the radio, and she remained his favourite singer, an influence on his music."
storyRu: "Джонни Кэш работал в кантри: простые повествовательные песни, гулкий баритон и голый, суровый звук — акустическая гитара, бас и соло-гитара. Мальчиком он слушал по радио Систер Розетту Тарп, и она осталась его любимой певицей, повлиявшей на его музыку."
