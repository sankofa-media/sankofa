        dimensions: ["harmony-form", "image"]
        text: "The Rock & Roll Hall of Fame calls Cash a country legend whose plainspoken narrative songs spoke to the American everyman."
        textRu: "Зал славы рок-н-ролла называет Кэша легендой кантри, чьи простые повествовательные песни говорили с американским простым человеком."
        source:
          title: "Rock & Roll Hall of Fame: Johnny Cash"
          url: "https://rockhall.com/inductees/johnny-cash/"
          quote: "Johnny Cash had all the qualities of a country legend: a rich life, a keen instinct for storytelling and an unflinching eye on the world around him. Cash’s humble beginnings made him an authentic storyteller whose plainspoken narrative songs spoke to the American everyman."
      - type: "critics"
        dimensions: ["melody-vocal", "sound", "image"]
        text: "The Guardian’s obituary places Cash at the mythic centre of country music and describes his sound as an acoustic guitar and a great booming baritone."
        textRu: "Некролог в Guardian ставит Кэша в мифический центр кантри и описывает его звук: акустическая гитара и великий гулкий баритон."
        source:
          title: "The Guardian: Adam Sweeting, Johnny Cash (obituary, 2003)"
          url: "https://www.theguardian.com/culture/2003/sep/12/johnnycash"
          quote: "The result, 1994's American Recordings, featured just Cash, his acoustic guitar and that great booming baritone voice, playing songs by Leonard Cohen, Tom Waits and Kris Kristofferson alongside strong material of his own."
      - type: "testimony"
        dimensions: ["sound"]
        text: "Cash described how he got his early sound: paper woven into the guitar strings for a percussive scratch, with bass and lead guitar, bare and stark."
        textRu: "Кэш рассказывал, как получился его ранний звук: бумага между струнами гитары для ударного шороха, бас и соло-гитара — голо и сурово."
        source:
          title: "NPR, Fresh Air: Johnny Cash — The ‘Fresh Air’ Interview (1997, rebroadcast 2016)"
          url: "https://www.npr.org/templates/transcript/transcript.php?storyId=503138966"
          quote: "And I put paper in the strings of my guitar to get that (vocalizing) sound, and with the bass and the lead guitar, there it was. Bare and stark, that song was when it was released."
  - to: "card:rosetta-tharpe"
    kind: "influence"
    how: "Sister Rosetta Tharpe was the voice young Cash heard on the family radio and his favourite singer; critics and his daughter count her among the formative influences on his music."
