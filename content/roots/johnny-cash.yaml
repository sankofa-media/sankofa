    evidence:
      - type: "listening"
        dimensions: ["melody-vocal"]
        text: "Rosanne Cash writes that Tharpe was her father’s favourite singer, heard as a boy on the family’s battery radio over the cotton fields, and a major influence on him."
        textRu: "Розанна Кэш пишет, что Тарп была любимой певицей её отца: мальчиком он слушал её по семейному радио на батарейках среди хлопковых полей, и она сильно на него повлияла."
        source:
          title: "Oxford American: Rosanne Cash, The Godmother of Soul (Issue 111, 2020)"
          url: "https://oxfordamerican.org/magazine/issue-111-winter-2020/the-godmother-of-soul"
          quote: "Dozens of musicians and performers credit her as a major influence, from Chuck Berry to Elvis to Keith Richards to my dad, who must have felt as if a spell had been cast on him as he sat glued to his family’s battery-powered radio and heard her voice pierce the gloaming over the cotton fields."
      - type: "critics"
        dimensions: []
        text: "The Encyclopedia of Arkansas lists Cash among the musicians who cited Tharpe as an influence and says he spoke of her impact on his music."
        textRu: "Энциклопедия Арканзаса называет Кэша среди музыкантов, признававших влияние Тарп, и пишет, что он говорил о её воздействии на свою музыку."
        source:
          title: "CALS Encyclopedia of Arkansas: Sister Rosetta Tharpe"
          url: "https://encyclopediaofarkansas.net/entries/sister-rosetta-tharpe-1781/"
          quote: "Her songs have been recorded by Elvis Presley, and Johnny Cash spoke of her impact on his music."
      - type: "critics"
        dimensions: []
        text: "PopMatters, drawing on Gayle Wald’s biography, notes that Cash called Tharpe his favourite artist."
        textRu: "PopMatters, опираясь на биографию Гейл Уолд, отмечает, что Кэш называл Тарп своей любимой исполнительницей."
        source:
          title: "PopMatters: Sister Rosetta Tharpe Got Rock Rolling Long Before Elvis"
          url: "https://www.popmatters.com/sister-rosetta-tharpe-got-rock-rolling-long-before-elvis-2495821302.html"
          quote: "Tharpe’s audience included jazz aficionados and discerning Southerners such as Johnny Cash, who called the gospel singer his favorite artist."
