story: "Rakim, who grew up in a house full of jazz and played saxophone himself, wrote his rhymes as if he were John Coltrane, matching his words to the patterns of sax lines and drums. With Paid in Full (1987) he moved the rhyme from the end of the bar into its middle and beginning, and internal rhyme schemes changed the flow of hip-hop."
storyRu: "Раким вырос в доме, где всегда звучал джаз, и сам играл на саксофоне; рифмы он писал так, будто он Джон Колтрейн, подгоняя слова под рисунок саксофонных линий и барабанов. С альбомом «Paid in Full» (1987) он перенёс рифму с конца такта в его середину и начало, и внутренние рифмы изменили флоу хип-хопа."
