        source:
          title: "Connecticut Public / NPR: Eric B. & Rakim change the flow of rap with ‘Paid in Full’ (2023)"
          url: "https://www.ctpublic.org/2023-08-04/eric-b-rakim-change-the-flow-of-rap-with-paid-in-full"
          quote: "\"I was shooting for something different,\" Rakim told NPR in 2009. \"You know, like, some of my influence was John Coltrane. I played the sax as well. So, listening to him play in the different rhythms that he had, I was trying to write my rhymes as if I was a saxophone player.\""
      - type: "testimony"
        dimensions: ["rhythm"]
        text: "In Westword he said his favourite rhythms came from Coltrane’s sax and that he emulated those patterns with words."
        textRu: "В интервью Westword он говорил, что любимые ритмы брал у саксофона Колтрейна и повторял их рисунок словами."
        source:
          title: "Westword (Dave Herrera): Q&A with Rakim"
          url: "https://www.westword.com/music/qanda-with-rakim-5676480/"
          quote: "When I started rhyming, my favorite rhythms were from John Coltrane and some of the things he did on sax. And certain rhythms that I hear on drums, I try to emulate with my words, dropping on the same patterns that them beats or them notes would hit. So I started developing a style, and it was alright."
