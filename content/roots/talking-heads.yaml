  - to: "root:fela-kuti"
    kind: "influence"
    how: "Listening to Fela Kuti, the band built Remain in Light from long overlapping loops of Afrobeat rhythm, parts meshing in a communal groove, with improvised, sermon-like vocal lines and call and response on top."
    howRu: "Слушая Фелу Кути, группа собрала «Remain in Light» из длинных накладывающихся петель афробита, где партии сцепляются в общий грув, а сверху ложатся импровизированные вокальные строки в духе проповеди и переклички."
    carries: []
