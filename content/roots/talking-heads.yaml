genre: "New wave and art rock"
genreRu: "новая волна и арт-рок"
story: "Talking Heads came out of the mid-1970s merging punk, rock and funk, and led new wave with artsy, nervous, funky songs. In 1980, for Remain in Light, they built long jams on looping Afrobeat rhythms after listening to Fela Kuti, with David Byrne improvising sermon-like lines over them."
storyRu: "Talking Heads появились в середине 1970-х, сплавив панк, рок и фанк, и повели за собой новую волну — артистичными, нервными, фанковыми песнями. В 1980 году для «Remain in Light», наслушавшись Фелы Кути, они строили долгие джемы на закольцованных ритмах афробита, а Дэвид Бирн импровизировал поверх них строки в духе проповеди."
