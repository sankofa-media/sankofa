        dimensions: ["rhythm", "melody-vocal"]
        text: "The Library of Congress essay says the sessions' jams were based on looping Afrobeat rhythms pioneered by Fela Kuti, and that Byrne scatted improvised lyrics drawing on African music."
        textRu: "Эссе Библиотеки Конгресса пишет, что джемы этих сессий строились на закольцованных ритмах афробита, открытых Фелой Кути, а Бирн, опираясь на африканскую музыку, импровизировал слова скэтом."
        source:
          title: "Library of Congress, National Recording Registry (Kevin Buck): “Remain in Light”"
          url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/RemainInLight.pdf"
          quote: "The resulting instrumental jams, based on looping Afrobeat rhythms (pioneered by Fela Kuti), were intended as a blending of music genres from around the world rather than just an imitation."
      - type: "listening"
        dimensions: ["rhythm"]
        text: "Byrne recalls the band listening to African pop such as Fela Kuti and King Sunny Adé, sharing its ecstatic communal feeling."
        textRu: "Бирн вспоминает, что группа слушала африканскую поп-музыку — Фелу Кути, Кинга Санни Аде — и разделяла её экстатическое чувство общности."
        source:
          title: "Far Out: The music that inspired Talking Heads' seminal album ‘Remain in Light’"
          url: "https://faroutmagazine.co.uk/the-music-that-inspired-talking-heads-album-seminal-remain-in-light/"
          quote: "We were listening to African pop music – such that was available – like Fela Kuti and King Sunny Adé"
