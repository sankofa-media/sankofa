id: "james-brown"
name: "James Brown"
nameRu: "Джеймс Браун"
aliases: ["джеймс браун"]
years: [1933, 2006]
place: {"name": "Barnwell, South Carolina", "lat": 33.2449, "lon": -81.3587}
