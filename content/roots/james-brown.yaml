story: "James Brown turned gospel fervour into rhythm and blues: he sang with gospel-driven vocals, rooted in the gospel quartet he formed as a teenager, and his shows went to the very edge of gospel abandon. Within R&B he made the groove, not the conventional song, the centre of the music, and backed it with precise choreography and dynamic showmanship."
storyRu: "Джеймс Браун превратил госпельный жар в ритм-н-блюз: его вокал шёл от госпела, от госпел-квартета, который он собрал подростком, а концерты доходили до самой грани госпельного самозабвения. Внутри ритм-н-блюза он сделал центром музыки грув, а не привычную песню, и подкрепил его точной хореографией и напористым шоу."
