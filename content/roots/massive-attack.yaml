        text: "Petridis traces Bristol hip-hop to the city’s reggae sound-system culture, audible all over Blue Lines."
        textRu: "Петридис выводит бристольский хип-хоп из городской культуры регги-саунд-систем, которая слышна на «Blue Lines» повсюду."
        source:
          title: "The Guardian (Alexis Petridis): Massive Attack — Blue Lines (remastered), review (2012)"
          url: "https://www.theguardian.com/music/2012/dec/06/massive-attack-blue-lines-review"
          quote: "But then, hip-hop had grown up rather oddly in Bristol, the result of the city's well-established reggae sound system culture and the lasting impact of its post-punk scene."
      - type: "critics"
