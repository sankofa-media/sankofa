      - type: "critics"
        dimensions: ["melody-vocal", "sound"]
        text: "MusicTech describes soul, reggae and hip-hop side by side on Blue Lines, which the band called “minimalist lover’s hip-hop”."
        textRu: "MusicTech описывает, как на «Blue Lines» — альбоме, который сама группа называла «минималистичным лаверс-хип-хопом», — соседствуют соул, регги и хип-хоп."
        source:
          title: "MusicTech (Andy Price): Landmark Productions — Massive Attack, Blue Lines (2015)"
          url: "https://musictech.net/guides/essential-guide/landmarks-massive-attack/"
          quote: "Achingly beautiful soul sits comfortably alongside restrained reggae and tough hip-hop, all backed with a detailed and suggestive musical texture."
      - type: "analysis"
        dimensions: ["rhythm", "sound"]
        text: "Sean O’Hagan calls Blue Lines the prototype of trip-hop, merging hip-hop, funk and dub reggae."
        textRu: "Шон О’Хаган называет «Blue Lines» прообразом трип-хопа, в котором сплавились хип-хоп, фанк и даб-регги."
        source:
          title: "The Guardian (Sean O’Hagan): Blue Lines — Massive Attack’s blueprint for UK pop’s future (2012)"
          url: "https://www.theguardian.com/music/2012/oct/28/massive-attack-blue-lines-remaster"
          quote: "Blue Lines is also viewed in pop historical terms as the prototype of trip-hop, a downbeat genre that merged elements of American hiphop, funk and Jamaican dub reggae into a somnambulant, skunk-fuelled soundtrack to British inner-city life."
  - to: "style:dub"
    kind: "influence"
