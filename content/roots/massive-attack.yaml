    how: "Massive Attack came from Bristol’s reggae sound-system culture: Daddy G’s reggae and sound-system background, Jamaican-accented MCing, dub-heavy bass and echo, and Horace Andy’s voice."
    howRu: "Massive Attack вышли из бристольской культуры регги-саунд-систем: регги и саунд-система за плечами Дэдди Джи, ямайский говорок эмси, тяжёлый дабовый бас и эхо, голос Хораса Энди."
