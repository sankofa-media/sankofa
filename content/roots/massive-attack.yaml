id: "massive-attack"
name: "Massive Attack"
aliases: ["массив атак", "мэссив атак"]
years: [1988]
place: {"name": "Bristol", "lat": 51.4545, "lon": -2.5879}
placeRu: "Бристоль"
genre: "Trip hop"
genreRu: "трип-хоп"
story: "Massive Attack grew out of the Wild Bunch, a Bristol sound system where Daddy G came from reggae, 3D from punk, and hip-hop brought them together. On Blue Lines (1991) they slowed hip-hop down, set soul vocals, raps in Bristol cadences and Jamaican-accented MCing over dragging beats and dub bass — the sound the world called trip-hop."
storyRu: "Massive Attack выросли из Wild Bunch — бристольской саунд-системы, где Дэдди Джи пришёл из регги, 3D — из панка, а соединил их хип-хоп. На «Blue Lines» (1991) они замедлили хип-хоп и положили на тяжело волочащиеся биты и дабовый бас соул-вокал, рэп с бристольской интонацией и ямайский говорок эмси — звук, который мир назвал трип-хопом."
