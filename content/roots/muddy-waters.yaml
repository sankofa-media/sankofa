          url: "https://64parishes.org/entry/son-house"
          quote: "Son House did not invent bottleneck guitar playing, but he excelled at it, significantly influencing younger African American blues guitarists such as Robert Johnson and Muddy Waters (born McKinley Morganfield)."
    scope: "career"
  - to: "card:blues"
    kind: "style"
    how: "Muddy amplified the Delta blues into the Chicago band sound: a rich tenor sung behind the beat, dark bass-heavy electric slide, a band that defined the genre, and a loud, raw, boastful attitude."
    howRu: "Мадди перевёл дельта-блюз в электрическое звучание чикагского бэнда: густой тенор чуть позади доли, тёмный, басовитый электрический слайд, состав, задавший канон жанра, и громкая, грубая, хвастливая повадка."
    carries: ["slide-guitar"]
    dimensions: ["melody-vocal", "rhythm", "sound", "performance", "image"]
    evidence:
      - type: "analysis"
        dimensions: ["melody-vocal", "rhythm", "sound"]
        text: "His rich tenor sung slightly behind the beat and his dark, bass-laden slide set him apart from the jazzy single-string guitarists of the day."
        textRu: "Густой тенор, звучащий чуть позади доли, и тёмный, басовитый слайд отличали его от джазовых гитаристов тех лет, игравших по одной струне."
        source:
          title: "National Park Service, Lower Mississippi Delta: Muddy Waters"
          url: "https://www.nps.gov/locations/lowermsdeltaregion/muddy-waters.htm"
          quote: "His strong, rich tenor, sung slightly behind the beat, had a drawl that appealed to southern-born black record buyers. Waters's dark, bass-laden slide guitar conjured shades of blue that stood in stark contrast to the jazzy, single-string guitarists such as T. Bone Walker who were then in vogue."
      - type: "analysis"
        dimensions: ["sound", "image"]
        text: "His Chicago music was loud, electric and raw, “amplified attitude” grafting southern roots onto South Side street life."
        textRu: "Его чикагская музыка была громкой, электрической и грубой — «усиленная повадка», привившая южные корни к уличной жизни Саут-Сайда."
        source:
          title: "Mississippi Encyclopedia: Muddy Waters"
          url: "https://mississippiencyclopedia.org/entries/muddy-waters/"
          quote: "Loud, electric, raw, aggressive, and sinuous, his new music grafted its unmistakably southern roots onto the gritty street life of Chicago’s South Side. It was amplified attitude, and the lyrics boldly proclaimed his new lifestyle."
      - type: "analysis"
        dimensions: ["performance", "sound"]
        text: "His band virtually defined Chicago blues, and his live shows were sensual and electrifying."
        textRu: "Его бэнд фактически задал канон чикагского блюза, а концерты были чувственными и электризующими."
        source:
          title: "Mississippi Blues Trail: Muddy Waters Birthplace"
          url: "https://msbluestrail.org/blues-trail-markers/muddy-waters-birthplace"
          quote: "Many of the finest musicians, including harmonica player Little Walter Jacobs, pianist Otis Spann, and guitarist Jimmy Rogers, worked in the seminal Muddy Waters Blues Band, which virtually defined the Chicago blues genre. Both through his recordings on the Aristocrat and Chess labels and through his sensual and electrifying live performances, he not only became a blues icon"
    scope: "career"
story: "Muddy Waters took up bottleneck slide from Son House, whose heavy, percussive guitar and deep, emotional singing were his most important model. In Chicago he amplified that Delta blues into a loud, raw band sound, with a rich tenor sung behind the beat over dark, bass-heavy slide."
storyRu: "Слайд с бутылочным горлышком Мадди Уотерс перенял у Сона Хауса, чья тяжёлая, ударная гитара и глубокое, страстное пение стали для него главным образцом. В Чикаго он превратил этот дельта-блюз в громкое, грубое звучание электрического бэнда: густой тенор чуть позади доли поверх тёмного, басовитого слайда."
