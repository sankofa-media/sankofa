          url: "https://mississippiencyclopedia.org/entries/muddy-waters/"
          quote: "the most important direct musical influence on Waters was Son House, a charismatic singer and guitarist who played a heavy, percussive style punctuated with stinging slides and deep, intensely emotional vocals."
      - type: "critics"
        dimensions: ["sound"]
        text: "House's bottleneck playing significantly influenced younger guitarists such as Muddy Waters."
        textRu: "Слайд Хауса заметно повлиял на гитаристов помоложе, таких как Мадди Уотерс."
        source:
