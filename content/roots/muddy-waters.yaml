        source:
          title: "EBSCO Research Starters: Son House"
          url: "https://www.ebsco.com/research-starters/history/son-house"
          quote: "Waters has been quoted as saying, “it was Son House who influenced me to play” and, in reference to bottleneck playing, that he “picked that up from Son House.”"
      - type: "testimony"
        dimensions: ["sound"]
        text: "Muddy recalled House playing with a bottle neck on his little finger and admitted getting the idea from him."
        textRu: "Мадди вспоминал, как Хаус играл с бутылочным горлышком на мизинце, и признавал, что взял эту идею у него."
        source:
          title: "Classic Rock (Louder), Jerry Gilbert: A Preacher, A Killer — the incredible story of Son House (2015)"
          url: "https://loudersound.com/features/a-preacher-a-killer-son-house-king-of-the-delta-blues"
          quote: "Muddy recalled that Son came from a plantation east of Clarksdale and played with the neck of a bottle over his little finger. Muddy admits to getting the idea from Son House, but felt that Son never came over as well on record as his live performances."
      - type: "analysis"
        dimensions: ["sound", "rhythm", "melody-vocal"]
        text: "House, with his heavy, percussive style, stinging slides and intensely emotional vocals, was Muddy's most important direct musical influence."
        textRu: "Главным прямым музыкальным влиянием на Мадди был Хаус с его тяжёлой, ударной манерой, жалящим слайдом и предельно страстным вокалом."
        source:
