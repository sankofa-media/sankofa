story: "Charlie Parker came up in Kansas City jazz, where the blues soaked everything and Lester Young was his idol and model of a light, quick tone. Working over the chords of “Cherokee”, he began playing the higher intervals of each chord as melody, and out of that bebop was born."
storyRu: "Чарли Паркер вырос в джазе Канзас-Сити, где всё было пропитано блюзом, а кумиром и образцом лёгкого, быстрого звука был для него Лестер Янг. Разбирая гармонию «Cherokee», он стал играть мелодию на верхних ступенях аккордов — так родился бибоп."
links:
