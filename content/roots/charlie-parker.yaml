    how: "Parker formed his voice in Kansas City jazz: a thin, coarse, blues-singer’s tone modelled on Lester Young, vocalized blues phrasing and the swing soloist’s craft learned in the city’s bands."
    howRu: "Паркер сложился в джазе Канзас-Сити: тонкий, шершавый звук блюзового певца по образцу Лестера Янга, блюзовая «говорящая» фразировка и ремесло солиста свинга, усвоенное в местных оркестрах."
