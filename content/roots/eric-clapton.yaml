      - type: "critics"
        dimensions: ["performance", "image"]
        text: "His official biography says Clapton did not simply replicate the blues riffs he heard on records but brought the emotion of the original performances into his own playing, and that the blues fitted his sense of himself as an outsider."
        textRu: "Официальная биография говорит, что Клэптон не просто повторял блюзовые риффы с пластинок, а переносил в свою игру чувство оригинальных исполнений и что блюз совпадал с его ощущением себя чужаком."
        source:
          title: "Eric Clapton: Official biography"
          url: "https://ericclapton.com/pages/about"
          quote: "Clapton was unique because he did not simply replicate the blues riffs he heard on records. He incorporated the emotion of the original performances into his own style of playing"
story: "Eric Clapton heard in Robert Johnson an intensity and a vocal cry more powerful than anything else he knew. The electric blues of Muddy Waters and the Chicago players set him on the electric guitar. He carried that emotion, not just the riffs, into the blues rock of the Yardbirds and Cream."
storyRu: "В Роберте Джонсоне Эрик Клэптон услышал напряжение и крик, сильнее которых он ничего не знал. Электрический блюз Мадди Уотерса и чикагских музыкантов привёл его к электрогитаре. В блюз-рок The Yardbirds и Cream он перенёс это чувство, а не одни только риффы."
