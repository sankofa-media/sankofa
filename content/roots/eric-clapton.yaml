    how: "From Robert Johnson Clapton took the measure of blues expression: an intense, uncompromising delivery and a voice he heard as the most powerful cry in human singing."
    howRu: "У Роберта Джонсона Клэптон взял мерило блюзовой выразительности — напряжённую, бескомпромиссную подачу и голос, в котором он слышал самый сильный крик, какой способен издать человек."
    dimensions: ["performance", "melody-vocal"]
    evidence:
      - type: "listening"
        dimensions: ["performance"]
        text: "Clapton first heard Johnson as a teenager, was overwhelmed and even repelled by the intensity, and got hooked because it was more powerful than anything else he was listening to; Johnson, he says, was talking from his soul without compromising for anybody."
        textRu: "Клэптон впервые услышал Джонсона подростком; его ошеломила и даже отпугнула эта сила, но он «подсел», потому что это было мощнее всего, что он тогда слушал. Джонсон, по его словам, говорил от души и ни под кого не подстраивался."
        source:
          title: "NPR Morning Edition: Eric Clapton takes on Robert Johnson's blues (2004)"
          url: "https://text.npr.org/1798862"
          quote: "I was definitely overwhelmed, but I was also a bit repelled by the intensity of it … I kind of got hooked on it because it was so much more powerful than anything else I had heard or was listening to."
      - type: "testimony"
        dimensions: ["melody-vocal"]
        text: "Clapton describes Johnson's voice as deeply soulful, the most powerful cry to be found in the human voice."
        textRu: "Голос Джонсона Клэптон называет глубоко проникновенным — самым сильным криком, какой только можно найти в человеческом голосе."
        source:
          title: "EBSCO Research Starters: Robert Johnson"
          url: "https://www.ebsco.com/research-starters/history/robert-johnson"
          quote: "deeply soulful…the most powerful cry that I think you can find in the human voice."
