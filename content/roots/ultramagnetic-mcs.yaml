story: "Ultramagnetic MCs grew up in the Bronx of park jams and crews, learning from MCs who had already changed rap’s vocals, from Cold Crush to Rakim. On Critical Beatdown (1988) Kool Keith swapped simple rhyme schemes for dense, off-kilter flows, while Ced Gee, a DJ turned producer, played the SP-1200 sampler as an instrument, flipping heavy funk records."
storyRu: "Ultramagnetic MCs выросли в Бронксе уличных вечеринок и рэп-команд и учились у эмси, которые уже изменили подачу рэпа, — от Cold Crush до Ракима. На «Critical Beatdown» (1988) Кул Кит сменил простые рифмовки на плотный, причудливый флоу, а Сед Джи, диджей, ставший продюсером, играл на сэмплере SP-1200 как на инструменте, перекраивая тяжёлый фанк."
