          title: "SPIN (Jonathan Rowe): Ultramagnetic MC’s interview (2023)"
          url: "https://www.spinmagazine.com/2023/11/ultramagnetic-mcs-interview/"
          quote: "MC Shan, Rakim and the Treacherous Three were really the first to ever change the vocals, you know what I’m saying?"
      - type: "testimony"
        dimensions: ["sound"]
        text: "Keith said that while making songs he bought funk records rather than rap — Con Funk Shun, Slave, Dazz Band."
        textRu: "Кит говорил, что, когда делал песни, покупал не рэп, а фанк — Con Funk Shun, Slave, Dazz Band."
        source:
          title: "SPIN (Jonathan Rowe): Ultramagnetic MC’s interview (2023)"
          url: "https://www.spinmagazine.com/2023/11/ultramagnetic-mcs-interview/"
          quote: "I really bought a lot of funk records when I was making songs, I got a lot of Con Funk Shun, Slave, Dazz Band."
      - type: "testimony"
        dimensions: ["sound", "rhythm"]
        text: "Ced Gee’s own biography describes him as a DJ first, then a pioneer of the SP-1200 drum machine in hip-hop production."
        textRu: "Собственная биография Седа Джи говорит, что сначала он был диджеем, а потом одним из первопроходцев драм-машины SP-1200 в хип-хоп-продакшне."
