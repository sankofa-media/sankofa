id: "mashina-vremeni"
name: "Mashina Vremeni"
nameRu: "Машина времени"
aliases: ["машина времени", "андрей макаревич", "Time Machine"]
years: [1969]
place: {"name": "Moscow", "lat": 55.7558, "lon": 37.6173}
placeRu: "Москва"
genre: "Rock"
genreRu: "рок"
story: "Andrey Makarevich’s school band started out under the deep spell of the Beatles, copying their lyrics off worn tapes and wanting to sound like them. Crossed with the Soviet bard song, that beat-group sound became one of the first workable forms of rock sung in Russian."
storyRu: "Школьная группа Андрея Макаревича начиналась под глубоким впечатлением от The Beatles: их тексты списывали с затёртых плёнок и хотели звучать так же. Скрещённый с советской бардовской песней, этот бит-групповой звук стал одной из первых жизнеспособных форм рока на русском языке."
links:
  - to: "root:the-beatles"
    kind: "influence"
    how: "The Beatles were Mashina Vremeni’s model of what a band is: guitar-bass-drums songwriting, McCartney’s piano and Harrison’s guitar as a sound to aim for, and the image of a group of friends writing their own songs."
    howRu: "The Beatles были для «Машины времени» образцом того, что такое группа: песни для гитар, баса и барабанов, фортепиано Маккартни и гитара Харрисона как звук, к которому стремиться, и образ компании друзей, сочиняющих свои песни."
    carries: []
    dimensions: ["sound", "image"]
    evidence:
      - type: "testimony"
        dimensions: ["sound"]
        text: "Makarevich names Dylan and the Beatles first among his influences, recalls copying Beatles lyrics off worn tapes in ninth grade, and hears McCartney’s piano and Harrison’s guitar in the band’s songs."
        textRu: "Макаревич первыми среди своих влияний называет Дилана и The Beatles, вспоминает, как в девятом классе списывал битловские тексты с затёртых плёнок, и слышит в песнях группы фортепиано Маккартни и гитару Харрисона."
        source:
          title: "Colta: Андрей Макаревич — «Ребята, это про вас про всех!» (Денис Бояринов, 2019)"
          url: "https://www.colta.ru/articles/music_modern/21682-andrey-makarevich-rebyata-eto-pro-vas-pro-vseh"
          quote: "Дилан и «Битлз» — конечно. … А я помню, что страшно обламывался в девятом классе, когда с ужасных пленок списывал битловские тексты. … Тем, как Пол играл на пианино и как Харрисон играл на гитаре."
      - type: "testimony"
        dimensions: ["image"]
        text: "Asked how the Beatles shaped Mashina Vremeni, Makarevich says the band was under a very deep impression."
        textRu: "На вопрос, как «Битлз» повлияли на «Машину времени», Макаревич отвечает, что группа находилась под очень глубоким впечатлением."
        source:
          title: "Радио Свобода: Андрей Макаревич (2003)"
          url: "https://www.svoboda.org/a/24197864.html"
          quote: "Никак не объясню. Находились под очень глубоким впечатлением."
      - type: "critics"
        dimensions: ["sound"]
        text: "Skillbox Media’s history of Russian rock names the Beatles among the main shapers of the band’s sound."
        textRu: "История русского рока Skillbox Media называет The Beatles среди главных источников звучания группы."
        source:
          title: "Skillbox Media: Русский рок — история, жанры, группы (Настя Сорокина, 2024)"
          url: "https://skillbox.ru/media/cinemusic/russian-rock/"
          quote: "Большое влияние на звучание группы оказали движение хиппи, бардовская песня и The Beatles."
      - type: "critics"
        dimensions: ["image"]
        text: "Vechernyaya Moskva’s 45th-anniversary piece quotes the band’s circle: Mashina Vremeni wanted all their lives to be like the Beatles, the music their generation grew up on."
        textRu: "«Вечерняя Москва» к 45-летию группы приводит слова её окружения: «Машина времени» всю жизнь хотела быть похожей на «Битлз», на музыке которых выросло их поколение."
        source:
          title: "Вечерняя Москва: «Машине времени» — 45. Она по-прежнему на ходу (Лада Ермолинская, 2014)"
          url: "https://vm.ru/society/494870-mashine-vremeni-45-ona-po-prezhnemu-na-hodu"
          quote: "Они, правда, всю жизнь и хотели быть похожими на «Битлз», ведь наше поколение выросло на музыке этой группы."
    scope: "career"
