        text: "The Rock and Roll Hall of Fame defines the band's signature as slap bass and rapping, names Parliament-Funkadelic and James Brown among its influences and stresses its reputation as a live act."
        textRu: "Зал славы рок-н-ролла называет фирменным знаком группы слэп-бас и речитатив, причисляет к её влияниям Parliament-Funkadelic и Джеймса Брауна и подчёркивает её славу концертной группы."
        source:
          title: "Rock & Roll Hall of Fame: Red Hot Chili Peppers (inducted 2012)"
          url: "https://rockhall.com/inductees/red-hot-chili-peppers/"
          quote: "Red Hot Chili Peppers’ signature blend of slap bass, rapping, and punk-metal guitar set the ‘80s on fire. Initially beloved as a formidable live act, they achieved breakthrough radio success with ‘91’s Blood Sugar Sex Magik."
      - type: "testimony"
        dimensions: ["rhythm"]
        text: "Drummer Chad Smith recalls that he grew up on James Brown and Sly and the Family Stone, and that Kiedis schooled him in funk with the Meters and Funkadelic, calling funk a really important part of the band."
        textRu: "Барабанщик Чед Смит вспоминает, что вырос на Джеймсе Брауне и Sly and the Family Stone, а Кидис доучивал его фанку на The Meters и Funkadelic, называя фанк очень важной частью группы."
        source:
          title: "Rolling Stone Australia: Red Hot Chili Peppers on 25 Years of Mother’s Milk (2014)"
          url: "https://au.rollingstone.com/music/music-news/red-hot-chili-peppers-on-25-years-of-mothers-milk-490/"
          quote: "I was into Tower of Power, James Brown, of course Sly and the Family Stone, ... Listen to 'Cissy Strut.' Listen to this Funkadelic stuff. ... We do the hard thing, the punk thing, but also the funk — it's a really important part of our band."
