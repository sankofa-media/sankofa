story: "Red Hot Chili Peppers built their sound on funk: slap bass and drumming schooled on James Brown, Sly and the Family Stone, the Meters and Funkadelic, with Anthony Kiedis rapping over the groove. They fused it with the speed and aggression of Los Angeles punk, which their own singer called the band's other half."
storyRu: "Red Hot Chili Peppers построили свой звук на фанке: слэп-бас и барабаны, выученные на Джеймсе Брауне, Sly and the Family Stone, The Meters и Funkadelic, а поверх грува читает Энтони Кидис. Этот фанк они сплавили со скоростью и напором лос-анджелесского панка — второй половиной группы, по словам её же певца."
links:
