    how: "The band's rhythm section and vocal manner came from funk: slap bass, a drummer raised on James Brown, Sly Stone and Tower of Power, and a singer who sent him to the Meters and Funkadelic, with rapping laid over the groove."
    howRu: "Ритм-секция и вокальная манера группы пришли из фанка: слэп-бас, барабанщик, выросший на Джеймсе Брауне, Слае Стоуне и Tower of Power, и певец, отправивший его слушать The Meters и Funkadelic, а поверх грува — речитатив."
