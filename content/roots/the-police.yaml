story: "The Police came up through the punk years but stood apart as a band of trained players inside new wave. Their signature was a reggae-infused rhythm: Sting absorbed Bob Marley's records and the weight of reggae bass, and only then could Stewart Copeland crack the reggae beat."
storyRu: "The Police выросли в годы панка, но выделялись в новой волне как группа выученных музыкантов. Их почерком стал ритм, пропитанный регги: Стинг заслушивался пластинками Боба Марли и проникся весом регги-баса, и только тогда Стюарт Коупленд смог «расколоть» регги-бит."
links:
