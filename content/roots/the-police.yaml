    kind: "influence"
    how: "Bob Marley's records taught Sting the reggae bass line, its weight and place in the mix; once the bass was there, Copeland's drums found the reggae feel, and the band built its new wave on that rhythm."
    howRu: "По пластинкам Боба Марли Стинг выучил басовую линию регги — её вес и место в звуке; когда бас встал на место, барабаны Коупленда нашли регги-ощущение, и на этом ритме группа построила свою новую волну."
