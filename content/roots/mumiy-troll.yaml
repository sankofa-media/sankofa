story: "Ilya Lagutenko grew up on the Leningrad rock club bands and then soaked up London’s Britpop years in the early 1990s. Mumiy Troll became a Russian version of Pulp and Suede — abrasive guitars, pop chords and a mannered, seductive vocal — and brought intonation, poses and theatre into Russian rock."
storyRu: "Илья Лагутенко вырос на группах ленинградского рок-клуба, а в начале 1990-х впитал Лондон времён брит-попа. «Мумий Тролль» стал русской версией Pulp и Suede — абразивные гитары, поп-аккорды и манерный, обольстительный вокал — и принёс в русский рок интонацию, позу и театр."
