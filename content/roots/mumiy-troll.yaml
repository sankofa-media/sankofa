  - to: "style:russian-rock"
    kind: "style"
    how: "Formed by the Leningrad rock club bands, Mumiy Troll renewed Russian rock’s theatre with ‘rokapops’: light, ironic songs without heartfelt rock ballads, where intonation, mannerisms and poses mattered."
    howRu: "Выросший на группах ленинградского рок-клуба, «Мумий Тролль» обновил театр русского рока «рокапопсом» — лёгкими, ироничными песнями без надрывных рок-баллад, где важны интонации, ужимки и позы."
    carries: []
    dimensions: ["melody-vocal", "performance", "image"]
    evidence:
      - type: "testimony"
        dimensions: ["image"]
        text: "Lagutenko names Auktyon and Zvuki Mu as his favourite bands and calls Auktyon the embodiment of real rock in the Leningrad rock club years."
        textRu: "Лагутенко называет «Аукцыон» и «Звуки Му» своими самыми любимыми группами, а «Аукцыон» — воплощением настоящего рока времён ленинградского рок-клуба."
        source:
          title: "Афиша — Волна: Илья Лагутенко слушает и комментирует чужую музыку (2003)"
          url: "https://daily.afisha.ru/archive/volna/archive/amba_lagytenko/"
          quote: "«Аукцыон» — очень близкая мне по духу группа … «Аукцыон» и «Звуки Му» — это были у меня самые любимые группы"
      - type: "critics"
        dimensions: ["melody-vocal", "performance", "image"]
        text: "Snob writes that with Lagutenko intonation, mannerisms and poses became important in Russian rock, and that he renewed the whole kit of the national rock theatre."
        textRu: "«Сноб» пишет, что с приходом Лагутенко в русском роке стали важны интонации, ужимки и позы и что он обновил весь инвентарь отечественного рок-театра."
        source:
          title: "Сноб: «Наступят времена почище» — 50 лет Илье Лагутенко (Александр Морсин, 2018)"
          url: "https://snob.ru/entry/166943/"
          quote: "Именно с приходом Лагутенко в русском роке стали важны интонации, ужимки и позы … обновил весь инвентарь отечественного рок-театра"
      - type: "critics"
        dimensions: ["melody-vocal"]
        text: "Sobaka.ru describes Lagutenko’s ‘rokapops’ as free of both heartfelt rock ballads and pompous pop — light in pictures and lyrics alike."
        textRu: "«Собака.ru» описывает «рокапопс» Лагутенко как музыку без надрывных рок-баллад и без напыщенной попсы — лёгкую и в картинках, и в текстах."
        source:
          title: "Собака.ru: Ксения Гощицкая о съёмке Ильи Лагутенко в Лос-Анджелесе (2014)"
          url: "https://www.sobaka.ru/entertainment/music/32147"
          quote: "Ни надрывных рок-баллад, ни напыщенной попсы, все было предельно легко — и в картинках, и в текстах."
