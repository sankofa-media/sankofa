        text: "Snob writes that the albums Morskaya and Ikra opened new British music to 1990s Russia, making the band a Russian version of Pulp, Suede and the Verve, with a powerful abrasive sound and pop chords."
        textRu: "«Сноб» пишет, что альбомы «Морская» и «Икра» открыли России 90-х новую британскую музыку и сделали группу русской версией Pulp, Suede и The Verve — с мощным абразивным звуком и поп-аккордами."
        source:
