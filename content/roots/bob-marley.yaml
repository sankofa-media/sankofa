    how: "The Wailers’ vocal sound — soulful close harmonies and a spiritual, socially minded voice — was modelled above all on Curtis Mayfield and the Impressions."
    howRu: "Вокальное звучание The Wailers — проникновенные плотные гармонии и одухотворённая, социально чуткая манера — строилось прежде всего по образцу Кёртиса Мейфилда и The Impressions."
    carries: ["gospel-vocal"]
