        text: "The official history says the Wailers’ soulful harmonies were influenced primarily by Curtis Mayfield and the Impressions."
        textRu: "Официальная история говорит, что проникновенные гармонии The Wailers сложились прежде всего под влиянием Кёртиса Мейфилда и The Impressions."
        source:
          title: "Bob Marley official site: History"
          url: "https://www.bobmarley.com/history/"
          quote: "With their soulful harmonies, influenced primarily by American vocal group Curtis Mayfield and the Impressions, and lyrics that echoed the struggles facing Jamaica’s poor"
      - type: "testimony"
        dimensions: ["melody-vocal"]
        text: "Fellow singer Junior Murvin, asked about Mayfield, said Mayfield came “spiritually and musically” to Marley and to him."
        textRu: "Певец Джуниор Мёрвин на вопрос о Мейфилде ответил, что тот пришёл к Марли и к нему самому «духовно и музыкально»."
        source:
          title: "Rebelbase: Junior Murvin interview (2004)"
          url: "https://rebelbase.be/interviews/detail/junior-murvin---handelsbeurs-102004"
          quote: "He was an American type roots singer. All black men come from the same root, so spiritually and musically Curtis Mayfield came to Bob and to me."
