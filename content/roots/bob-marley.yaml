story: "Bob Marley and the Wailers began as a vocal trio whose soulful harmonies were modelled above all on Curtis Mayfield and the Impressions. With them Marley took the brisk offbeat of ska and rocksteady, slowed it, deepened the groove and filled it with Rastafarian lyrics of resistance — and co-created reggae."
storyRu: "Боб Марли и The Wailers начинали как вокальное трио, чьи проникновенные гармонии строились прежде всего по образцу Кёртиса Мейфилда и The Impressions. Вместе с ними Марли взял бодрый офбит ска и рокстеди, замедлил его, углубил грув, наполнил растафарианскими текстами о сопротивлении — и стал одним из создателей регги."
