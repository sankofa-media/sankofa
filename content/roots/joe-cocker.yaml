story: "Joe Cocker modelled his singing on Ray Charles: as a teenager he copied the gritty, gospel-charged voice and even the bodily abandon of Charles’s performances, and critics heard him bring that influence into rock. Out of it grew his own soul manner — ragged, soulful readings that made other people’s songs sound like his."
storyRu: "Джо Кокер строил своё пение по Рэю Чарльзу: подростком он копировал его хрипловатый, заряженный госпелом голос и даже телесную самоотдачу на сцене, и критики слышали, как он принёс это влияние в рок. Отсюда выросла его собственная соул-манера — рваные, полные души прочтения, после которых чужие песни звучали как его."
