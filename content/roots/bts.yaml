        text: "Sheldon Pearce notes that BTS debuted as a rap outfit and that their rap verses are essential to the structure of their songs."
        textRu: "Шелдон Пирс отмечает, что BTS дебютировали как рэп-группа и что рэп-куплеты в их песнях — основа строения."
        source:
          title: "Pitchfork (Sheldon Pearce): BTS — Love Yourself 轉 ‘Tear’ (2018)"
          url: "https://pitchfork.com/reviews/albums/bts-love-yourself-tear/"
          quote: "Where rap verses are often stopgaps for other K-pop groups, obligatory aspects of pop roleplaying, they are essential to structure and composition here."
      - type: "listening"
        dimensions: ["melody-vocal"]
        text: "Rolling Stone Korea writes that Nas, Eminem and Epik High drew RM into music and an imagined underground hip-hop career."
        textRu: "Rolling Stone Korea пишет, что именно Nas, Эминем и Epik High привели RM в музыку и к мечте об андеграундном хип-хопе."
        source:
          title: "Rolling Stone Korea: RM and Pharrell Williams in conversation (2022)"
          url: "https://rollingstone.co.kr/the-cover/the-cover-print-cover/18024"
          quote: "When RM was growing up outside of Seoul, rap had already gone global, to the point where Nas, Eminem, and local groups like Epik High could seduce a studious South Korean kid into devoting his life to music — which, after some twists and turns, led him to BTS instead of the underground hip-hop career he imagined."
      - type: "testimony"
        dimensions: ["rhythm", "melody-vocal"]
        text: "RM told El País that he wanted to be a rapper, not an idol, and that what got him was rap: “rhythm plus poetry”."
        textRu: "RM рассказывал El País, что хотел быть рэпером, а не айдолом, и что его захватил рэп — «ритм плюс поэзия»."
        source:
          title: "El País: RM, the leader of K-pop band BTS — ‘We work so hard in Korea because 70 years ago there was nothing’ (2023)"
          url: "https://english.elpais.com/culture/2023-03-15/rm-the-leader-of-k-pop-band-bts-we-work-so-hard-in-korea-because-70-years-ago-there-was-nothing.html"
          quote: "What got me was rap: rhythm plus poetry."
