story: "BTS debuted as a hip-hop group: their leader RM grew up on Nas, Eminem and Epik High and meant to be an underground rapper, and the rappers RM, Suga and J-Hope still anchor the group’s songs. Around that core they built K-pop’s mix of American pop, choreography synchronized as tightly as their vocal routines, and visuals."
storyRu: "BTS начинали как хип-хоп-группа: их лидер RM вырос на Nas, Эминеме и Epik High и собирался стать андеграундным рэпером, и рэперы RM, Шуга и Джей-Хоуп по-прежнему держат на себе песни группы. Вокруг этого ядра они выстроили кей-поп — смесь американского попа, хореографии, сведённой так же точно, как их вокальные партии, и визуального ряда."
