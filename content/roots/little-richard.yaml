story: "Little Richard sang with gospel’s voice: a churchy tone, gospel-styled shouting and a whoop he said came from Marion Williams. He set rock and roll’s wildest pattern with pounding piano, explosive rhythm, screams and a flamboyant showman’s image."
storyRu: "Литл Ричард пел голосом госпела: «церковный» тембр, крик в духе госпела и «уханье», которое, по его словам, пришло от Мэрион Уильямс. Молотящим фортепиано, взрывным ритмом, криком и броским обликом шоумена он задал самый неистовый образец рок-н-ролла."
