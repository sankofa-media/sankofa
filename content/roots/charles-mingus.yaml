    claim: "Mingus brought the call-and-response and the shouting of the Holiness church he attended with his mother into pieces such as “Wednesday Night Prayer Meeting”."
    claimRu: "Мингус перенёс зов и отклик и выкрики церкви движения святости, куда ходил с матерью, в такие пьесы, как «Wednesday Night Prayer Meeting»."
