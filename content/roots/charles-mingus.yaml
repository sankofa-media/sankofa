story: "Charles Mingus’s early musical world included the singing he heard in church. The gospel singing and preaching of his youth later fed compositions such as “Better Git It in Your Soul”."
storyRu: "В раннем музыкальном мире Чарльза Мингуса звучало церковное пение. Позже госпел и проповеди его юности отозвались в таких сочинениях, как «Better Git It in Your Soul»."
