story: "Charles Mingus took Duke Ellington’s sonic blend and harmonies as his touchstone and pushed them further, with abrupt changes of meter and tempo. Into the same jazz he brought the Holiness church: gospel tremolo, call-and-response between the horns and shouting from the bandstand."
storyRu: "Чарльз Мингус взял за образец звуковую палитру и гармонии Дюка Эллингтона и повёл их дальше — к резким сменам размера и темпа. В тот же джаз он принёс церковь движения святости: госпельное тремоло, перекличку духовых и выкрики со сцены."
