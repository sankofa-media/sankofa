  - to: "card:gospel"
    kind: "influence"
    scope: "career"
    how: "Mingus wrote the Holiness church into his jazz: low gospel tremolo, antiphonal call-and-response between horns, guttural vocal textures, and his own shouting from the bandstand as from a pulpit."
    howRu: "Мингус вписал церковь движения святости в свой джаз: низкое госпельное тремоло, антифонная перекличка духовых, гортанные «вокальные» тембры и его собственные выкрики со сцены, словно с кафедры."
    carries: ["call-and-response", "gospel-vocal"]
    dimensions: ["harmony-form", "sound", "performance", "melody-vocal"]
    evidence:
      - type: "analysis"
        dimensions: ["harmony-form", "sound", "melody-vocal"]
        text: "Jason Bivins hears church influences on Oh Yeah, Ah Um and Blues and Roots: gospel tremolo, antiphonal call-and-response and vocal textures."
        textRu: "Джейсон Бивинс слышит в «Oh Yeah», «Ah Um» и «Blues and Roots» влияние церкви: госпельное тремоло, антифонную перекличку и «вокальные» тембры."
        source:
          title: "OUPblog (Jason C. Bivins): A holding corporation called old America — Charles Mingus’ religious multitudes"
          url: "https://blog.oup.com/?p=94894"
          quote: "It is meaningful, then, that records like Oh Yeah, Ah Um, and Blues and Roots brimmed with church influences: a low-end gospel tremolo; complex antiphonal work, trading phrases back and forth in a knowing echo of the call-and-response dialogism of African-American music; and a use of guttural, vocalic textures that connected New Orleans to the avant-garde."
      - type: "analysis"
        dimensions: ["performance"]
        text: "Bivins describes Mingus shouting encouragement to his band, the stage as his pulpit."
        textRu: "Бивинс описывает, как Мингус криками подбадривал своих музыкантов: сцена была его кафедрой."
        source:
          title: "OUPblog (Jason C. Bivins): A holding corporation called old America — Charles Mingus’ religious multitudes"
          url: "https://blog.oup.com/?p=94894"
          quote: "Mingus shouted encouragement to his bandmates, the stage his pulpit."
      - type: "critics"
        dimensions: ["sound"]
        text: "Blue Note’s biography lists gospel and blues first among the elements Mingus’s music drew on."
        textRu: "Биография Blue Note ставит госпел и блюз первыми среди истоков музыки Мингуса."
        source:
          title: "Blue Note Records: Charles Mingus — biography"
          url: "https://www.bluenote.com/artist/charles-mingus/"
          quote: "Intensely ambitious yet often earthy in expression, simultaneously radical and deeply traditional, Mingus’ music took elements from everything he had experienced — from gospel and blues through New Orleans jazz, swing, bop, Latin music, modern classical music, even the jazz avant-garde."
