      - title: "First Things: Holiness, folk culture, and the African-American experience"
        url: "https://firstthings.com/blogs/firstthoughts/2014/02/holiness-folk-culture-and-the-african-american-experience"
    carries: ["call-and-response"]
    how: "Call and response from Holiness worship: the band trades phrases back and forth and Mingus shouts from inside it, the stage his pulpit."
    howRu: "Зов и отклик из богослужений движения святости: оркестр перебрасывается фразами, а Мингус выкрикивает изнутри, и сцена становится его кафедрой."
