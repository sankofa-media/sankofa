    how: "Howlett began in hip-hop as a DJ and breakdancer; its hard-edged production — harsh sample collisions and heavy breakbeats, with Public Enemy as a model — shaped the Prodigy’s sound."
    howRu: "Хаулетт начинал в хип-хопе как диджей и брейкдансер; жёсткий хип-хоп-продакшн — грубые столкновения сэмплов и тяжёлые брейкбиты по образцу Public Enemy — сформировал звучание The Prodigy."
