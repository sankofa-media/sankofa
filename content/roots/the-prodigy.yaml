id: "the-prodigy"
name: "The Prodigy"
aliases: ["продиджи", "зе продиджи", "продижи"]
years: [1990]
place: {"name": "Braintree, England", "lat": 51.8787, "lon": 0.5529}
placeRu: "Брейнтри, Англия"
genre: "Big beat and rave"
genreRu: "биг-бит и рейв"
story: "The Prodigy grew out of the British rave scene: Liam Howlett was a rave DJ whose sampler-and-synth tracks fronted by dancers became the militant voice of the movement. Howlett had cut his teeth on hip-hop as a DJ and breakdancer, and its hard-edged production, plus punk energy, turned the group’s breakbeat rave into big beat."
storyRu: "The Prodigy вышли из британской рейв-сцены: Лиам Хаулетт был рейв-диджеем, а его треки из сэмплов и синтезаторов, исполнявшиеся с танцорами на авансцене, стали воинственным голосом движения. Начинал Хаулетт с хип-хопа — как диджей и брейкдансер, — и жёсткий хип-хоп-продакшн вместе с энергией панка превратил брейкбит-рейв группы в биг-бит."
