  - to: "card:reggae"
    kind: "influence"
    how: "At the turn of the 1980s Aquarium wrote songs such as “Vavilon” and “Aristokrat” to the reggae offbeat and made the first Soviet dub, bringing Jamaican rhythm into Russian rock."
    howRu: "На рубеже 1980-х «Аквариум» писал песни вроде «Вавилона» и «Аристократа» на офбит регги и сделал первый советский даб, принеся ямайский ритм в русский рок."
    carries: ["reggae-offbeat", "dub"]
    dimensions: ["rhythm", "sound"]
    evidence:
      - type: "critics"
        dimensions: ["rhythm"]
        text: "Boris Barabanov notes that “Vavilon” and “Aristokrat” were conceived as reggae from the start."
        textRu: "Борис Барабанов отмечает, что «Вавилон» и «Аристократ» изначально были придуманы как регги."
        source:
          title: "Коммерсантъ Weekend: 10 альбомов сентября (Борис Барабанов, 2020)"
          url: "https://www.kommersant.ru/doc/4493505"
          quote: "Помимо «Вавилона» и «Аристократа», изначально придуманных как регги"
      - type: "critics"
        dimensions: ["rhythm", "sound"]
        text: "Producer Levsha Patsan credits Grebenshchikov with bringing Caribbean music to the USSR, calling “Vavilon” the country’s first reggae song and “212-85-06” its first dub, and speaks of the band’s love of Jamaican music."
        textRu: "Продюсер Левша Пацан считает, что Гребенщиков принёс карибскую музыку в СССР, называет «Вавилон» первой регги-песней страны, а «212-85-06» — первым советским дабом, и говорит о любви «Аквариума» к ямайской музыке."
        source:
          title: "Colta: «Пришлось вымачивать голос БГ в эликсире молодости» — интервью с Левшой Пацаном (Денис Бояринов, 2020)"
          url: "https://www.colta.ru/articles/music_modern/26051-levsha-patsan-intervyu-albom-akvarium-in-dub-li-skretch-perri-pesni-bg"
          quote: "Борис Гребенщиков принес карибскую музыку в СССР … Зная любовь «Аквариума» к разным направлениям ямайской музыки"
