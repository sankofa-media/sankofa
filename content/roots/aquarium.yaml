story: "Boris Grebenshchikov looked for a Russian Dylan, found none and set out to become one: many early Aquarium songs grew from Dylan’s, and the band proved that original rock in Russian was possible. Around 1980 Aquarium also became the Soviet Union’s first reggae band, writing songs to the Jamaican offbeat."
storyRu: "Борис Гребенщиков искал «русского Дилана», не нашёл и решил стать им сам: многие ранние песни «Аквариума» выросли из песен Дилана, а группа доказала, что оригинальный рок на русском языке возможен. На рубеже 1980-х «Аквариум» стал и первой в СССР регги-группой, сочиняя песни под ямайскую слабую долю."
links:
  - to: "root:bob-dylan"
    kind: "influence"
    how: "Grebenshchikov modelled his songwriting on Dylan’s mid-1960s songs — many early Aquarium songs are free adaptations of them — and took on the role of the singer-poet as a ‘Russian Dylan’."
    howRu: "Гребенщиков учился сочинять по песням Дилана середины 1960-х — многие ранние песни «Аквариума» вольно их перелагают — и взял на себя роль поэта-певца — «русского Дилана»."
    carries: []
    dimensions: ["harmony-form", "image"]
    evidence:
      - type: "critics"
        dimensions: ["harmony-form"]
        text: "Artemy Troitsky says Dylan’s 1965–66 period shaped Grebenshchikov most, that many early Aquarium songs are in effect free adaptations of Dylan songs, and that Grebenshchikov told him ‘Poezd v ogne’ was largely inspired by Dylan."
        textRu: "Артемий Троицкий говорит, что сильнее всего на Гребенщикова повлиял Дилан 1965–1966 годов, что многие ранние песни «Аквариума» — фактически вольные переложения песен Дилана и что сам Гребенщиков признавался ему: «Поезд в огне» во многом навеян Диланом."
        source:
          title: "Meduza: «Такой американский Окуджава» — Артемий Троицкий о Бобе Дилане (2016)"
          url: "https://meduza.io/feature/2016/10/14/takoy-amerikanskiy-okudzhava"
          quote: "Этот период сильнее всего повлиял на Майка и БГ. … Многие ранние песни Гребенщикова и «Аквариума» фактически являются вольными переводами песен Дилана … Даже знаменитый перестроечный гимн «Поезд в огне», как мне Боря сам говорил, во многом навеян песней Дилана"
      - type: "testimony"
        dimensions: ["image"]
        text: "By his own account, Grebenshchikov looked for a ‘Russian Dylan’ and, finding none, decided to become one."
        textRu: "По собственным словам Гребенщикова, он искал «русского Дилана», не нашёл и решил стать им сам."
        source:
          title: "Профиль: Танцы на грани зимы — 70 лет Борису Гребенщикову (Александр Зайцев, 2023)"
          url: "https://profile.ru/culture/tancy-na-grani-zimy-70-let-borisu-grebenshhikovu-1422327/amp/"
          quote: "По его словам, он искал, не существует ли «русского Дилана», и когда понял, что еще не существует, решил сам стать им."
