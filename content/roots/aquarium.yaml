    how: "Aquarium made Russian rock a poetic art: original rock songs in Russian, built as a poetic-musical project rather than copies of Western hits."
    howRu: "«Аквариум» сделал русский рок поэтическим искусством: оригинальные рок-песни на русском языке, задуманные как поэтически-музыкальный проект, а не как копии западных хитов."
