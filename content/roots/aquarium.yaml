        source:
          title: "Skillbox Media: Русский рок — история, жанры, группы (Настя Сорокина, 2024)"
          url: "https://skillbox.ru/media/cinemusic/russian-rock/"
          quote: "В 1972 году Борис Гребенщиков (объявлен в России иностранным агентом) и Анатолий Гуницкий создали «постмодернистский поэтически-музыкальный проект» под названием «Аквариум»."
