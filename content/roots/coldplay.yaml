    kind: "influence"
    how: "From Radiohead's mid-1990s ballads Coldplay took the falsetto-led vocal over acoustic guitar, melancholy anthemic guitar rock and the very idea that a singer like Martin could make this music."
    howRu: "Из баллад Radiohead середины 1990-х Coldplay взяли фальцетный вокал под акустическую гитару, меланхоличный гимновый гитарный рок и саму мысль, что такой певец, как Мартин, может делать эту музыку."
