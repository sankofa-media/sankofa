story: "Coldplay formed in the wake of Radiohead: Chris Martin found his singing voice by hearing Thom Yorke and admits the band stole a lot from Radiohead in its early music. Critics hear in Radiohead's falsetto-and-acoustic-guitar ballads of The Bends the template that “essentially invented Coldplay”."
storyRu: "Coldplay сложились по следам Radiohead: Крис Мартин нашёл свой певческий голос, услышав Тома Йорка, и признаёт, что в ранних песнях группа многое у Radiohead украла. Критики слышат в балладах «The Bends» — фальцет под акустическую гитару — тот образец, который «по сути изобрёл Coldplay»."
