        text: "Chris Martin told Mojo that Radiohead's arrival first made him think people like him could make music, and that hearing Thom Yorke and Jeff Buckley showed him a singing voice that sounded do-able."
        textRu: "Крис Мартин рассказал Mojo, что именно с появлением Radiohead он впервые подумал, что музыку могут делать и такие, как он, а голоса Тома Йорка и Джеффа Бакли показали ему пение, которое ему по силам."
        source:
          title: "Mojo: Chris Martin Interviewed"
          url: "https://mojo4music.com/articles/stories/chris-martin-interviewed"
          quote: "And then, I guess, when Radiohead came around, that was the first time I thought, “Oh, people like me can make music also.” ... Then I heard Thom Yorke and Jeff Buckley and I thought, “OK, that sounds do-able.”"
      - type: "testimony"
        dimensions: ["sound", "melody-vocal"]
        text: "Martin told Rolling Stone that the band obviously stole a lot from Radiohead in its early music."
        textRu: "Мартин признался Rolling Stone, что в ранних песнях группа, конечно, многое украла у Radiohead."
        source:
          title: "Brian Hiatt, Rolling Stone India: Chris Martin — The Jesus of Uncool (2008)"
          url: "https://rollingstoneindia.com/chris-martin-feature"
          quote: "Our relationship with Radiohead is a funny one ... we were kids when they got huge, and we obviously stole a lot from them in our early music."
      - type: "critics"
        dimensions: ["sound", "melody-vocal"]
        text: "Ed Power writes that Coldplay built global stardom on the softest side of Radiohead and that “High and Dry” essentially invented Coldplay; producer Nigel Godrich sums up that style as a guy singing in falsetto with an acoustic guitar."
        textRu: "Эд Пауэр пишет, что Coldplay превратили самые слезливые куски Radiohead в мировую славу и что «High and Dry», по сути, изобрела Coldplay; продюсер Найджел Годрич сводит этот стиль к парню, поющему фальцетом под акустическую гитару."
        source:
          title: "Ed Power, The Irish Times: Why Radiohead’s The Bends is the worst great album of all time (2020)"
          url: "https://www.irishtimes.com/culture/music/why-radiohead-s-the-bends-is-the-worst-great-album-of-all-time-1.4199850"
          quote: "But what is indisputable is that Coldplay took the soggiest bits of Radiohead and parlayed them into a global stardom. ... High and Dry – which essentially invented Coldplay ... It's a guy singing in falsetto with an acoustic guitar."
