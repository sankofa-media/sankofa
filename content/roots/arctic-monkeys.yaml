story: "Arctic Monkeys grew out of Britpop and garage rock, and took their ideas of song structure from the Strokes and the Libertines — critics heard the Libertines with a sharper Northern edge. On AM (2013) Alex Turner rebuilt the band’s sound around rhythm, aiming for the feel of a Dr. Dre beat."
storyRu: "Arctic Monkeys выросли из брит-попа и гаражного рока, а представления о строении песни взяли у The Strokes и The Libertines: критики слышали в них The Libertines с более колючей северной интонацией. На «AM» (2013) Алекс Тёрнер перестроил звук группы вокруг ритма, добиваясь ощущения бита Доктора Дре."
