story: "Etta James was a rhythm and blues singer through and through: a powerhouse contralto with grit that could melt like sugar or rub like salt, a defiant, abrasive delivery and a formidable live act. That voice was built in gospel, where a choirmaster taught her to sing from the gut. From the mid-1990s she turned to jazz, channelling Billie Holiday."
storyRu: "Этта Джеймс была ритм-н-блюзовой певицей до мозга костей: мощное контральто с шершавостью, которая то таяла, как сахар, то въедалась, как соль в рану, вызывающая, колючая подача и грозная сила на концертной сцене. Этот голос сложился в госпеле, где хормейстер учил её петь нутром. С середины 1990-х она обратилась к джазу, следуя за Билли Холидей."
