    how: "Patton played Delta blues as polyrhythmic dance music: picking against a beat tapped on the guitar body, heavy bass notes, slide played with a knife, a loud rough voice and clowning showmanship."
    howRu: "Паттон играл дельта-блюз как полиритмичную танцевальную музыку: перебор поверх ритма, отстуканного по корпусу гитары, тяжёлые басы, слайд ножом, громкий хриплый голос и шутовское шоу."
