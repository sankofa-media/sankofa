story: "Charley Patton played the Delta blues as dance music: polyrhythmic picking over a beat tapped on the guitar, heavy bass notes and slide played with a knife. He sang in a loud, rough voice and clowned with the guitar for his audiences."
storyRu: "Чарли Паттон играл дельта-блюз как танцевальную музыку: полиритмичный перебор поверх ритма, отстуканного по гитаре, тяжёлые басы и слайд ножом. Пел он громким, хриплым голосом и паясничал с гитарой на потеху публике."
