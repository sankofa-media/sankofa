        source:
          title: "Classic Rock (Louder), Jerry Gilbert: A Preacher, A Killer — the incredible story of Son House (2015)"
          url: "https://loudersound.com/features/a-preacher-a-killer-son-house-king-of-the-delta-blues"
          quote: "From his second session with Alan Lomax for the Library Of Congress comes this demonstration of how close House was to Charley Patton – the snapped-string descending bass figure matches Patton’s on numbers like Moon Going Down."
