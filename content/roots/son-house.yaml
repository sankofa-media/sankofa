        source:
          title: "Classic Rock (Louder), Jerry Gilbert: A Preacher, A Killer — the incredible story of Son House (2015, with a 1970 Sounds interview)"
          url: "https://loudersound.com/features/a-preacher-a-killer-son-house-king-of-the-delta-blues"
          quote: "I was born and raised in Clarksdale but Charley [Patton] was living in Jackson, Mississippi when I first ran into him. I couldn’t play the blues like him by just learning straight off. So I stayed around with him for a little while, then I moved on and ran into Willie Brown."
