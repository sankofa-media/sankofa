story: "Madonna came out of the New York club scene of the early 1980s with demos that the industry found “too disco”, and the Rock & Roll Hall of Fame names Donna Summer and Giorgio Moroder among her influences. Her music stayed dance-pop for the dancefloor — synth-pop and R&B, then house, electronica and EDM — with the image of a Danceteria club kid."
