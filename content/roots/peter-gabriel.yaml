    how: "Gabriel came from soul: he played that material in a soul band, and Redding's commanding, passionate voice over great grooves became his model of a singer who puts the message over by feel rather than polish."
    howRu: "Гэбриел пришёл из соула: он играл этот материал в соул-группе, а властный, страстный голос Реддинга поверх мощного грува стал для него образцом певца, который доносит смысл чувством, а не шлифовкой."
