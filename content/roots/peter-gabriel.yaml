story: "Peter Gabriel started out in a soul band, and Otis Redding's commanding voice and grooves, heard live in Brixton in 1967, stayed his measure of a singer. With Genesis he made art rock: long multi-part suites, mellotron, and a frontman who played theatrical roles in masks and costumes."
storyRu: "Питер Гэбриел начинал в соул-группе, и властный голос и грув Отиса Реддинга, услышанные вживую в Брикстоне в 1967 году, остались для него мерой певца. В Genesis он делал арт-рок: длинные сюиты из многих частей, меллотрон и фронтмен, игравший театральные роли в масках и костюмах."
