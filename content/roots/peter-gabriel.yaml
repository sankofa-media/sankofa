        text: "Far Out notes that Redding's voice and emotion left Gabriel speechless, a formative experience nothing came close to."
        textRu: "Far Out пишет, что голос и чувство Реддинга лишили Гэбриела дара речи; ничто потом не сравнилось с этим переживанием."
