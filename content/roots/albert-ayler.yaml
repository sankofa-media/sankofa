        dimensions: ["sound", "performance"]
        text: "Richard Brody describes Ayler’s improvisations reaching for pure sound and his groups’ collective improvisations."
        textRu: "Ричард Броуди описывает, как импровизации Эйлера рвались к чистому звуку и как его ансамбли импровизировали коллективно."
        source:
          title: "The New Yorker (Richard Brody): The Jubilant Glory of Albert Ayler’s “Revelations”"
          url: "https://www.newyorker.com/culture/the-front-row/the-jubilant-glory-of-albert-aylers-revelations"
          quote: "Throughout his career, Ayler’s improvisations, mostly on tenor sax, roared and shrieked and shredded the very notion of chords and notes to reach a realm of pure sound."
      - type: "critics"
        dimensions: ["rhythm", "sound"]
        text: "Kevin Whitehead hears him stretch tempo, pitch and the saxophone’s sound itself."
        textRu: "Кевин Уайтхед слышит, как он растягивает темп, высоту и сам звук саксофона."
        source:
          title: "Texas Public Radio / NPR (Kevin Whitehead): Albert Ayler — Testifying the Breaking Point (2001)"
          url: "https://www.tpr.org/2001-05-07/albert-ayler-testifying-the-breaking-point"
          quote: "Ayler also liked slow-drag tempos, but he'd stretch time even further. He stretched everything: time, pitch, and the very fabric of a saxophone's sound."
