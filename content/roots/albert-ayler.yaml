story: "Albert Ayler’s tenor roared and shrieked past chords and notes into pure sound, stretching time and pitch in free collective improvisation. Yet his solos took off from ditty-like themes with the candor of spirituals, marches and gospel shouts, played with a gospel saxophonist’s wide, voice-like vibrato."
storyRu: "Тенор Альберта Эйлера ревел и визжал, прорываясь сквозь аккорды и ноты к чистому звуку, растягивая время и высоту в свободной коллективной импровизации. Но его соло вырастали из простых, как песенка, тем с бесхитростностью спиричуэлс, маршей и госпельных выкриков — и звучали с широким, похожим на голос вибрато госпельного саксофониста."
links:
