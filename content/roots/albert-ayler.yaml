    how: "Ayler played free jazz at its most extreme: improvisations that shredded chords and notes for pure sound, time and pitch stretched to the breaking point, and collective improvisation of several horns at once."
    howRu: "Эйлер играл фри-джаз в его самом крайнем виде: импровизации, разрывающие аккорды и ноты ради чистого звука, время и высота, растянутые до предела, и коллективная импровизация нескольких духовых сразу."
    carries: ["improvisation"]
