        text: "Brody hears in Ayler’s compositions the melodic candor of spirituals, marches, gospel shouts and folk songs."
        textRu: "Броуди слышит в сочинениях Эйлера мелодическую простоту спиричуэлс, маршей, госпельных выкриков и народных песен."
        source:
          title: "The New Yorker (Richard Brody): The Jubilant Glory of Albert Ayler’s “Revelations”"
          url: "https://www.newyorker.com/culture/the-front-row/the-jubilant-glory-of-albert-aylers-revelations"
          quote: "But he never dispensed with melody; his wildest expatiations took off from his compositions, often brief and ditty-like, that had the overt, ingenuous, melodic candor of spirituals and marches, gospel shouts and folk songs."
      - type: "critics"
        dimensions: ["sound", "melody-vocal"]
        text: "Whitehead traces Ayler’s exaggerated vibrato to gospel saxophonists and his folksy tunes to church music."
        textRu: "Уайтхед выводит преувеличенное вибрато Эйлера из манеры госпельных саксофонистов, а его простые мелодии — из церковной музыки."
        source:
          title: "Texas Public Radio / NPR (Kevin Whitehead): Albert Ayler — Testifying the Breaking Point (2001)"
          url: "https://www.tpr.org/2001-05-07/albert-ayler-testifying-the-breaking-point"
          quote: "Gospel saxophonists typically use a wide vibrato to make their sound more voice-like and unworldly. Ayler took that lesson to heart."
