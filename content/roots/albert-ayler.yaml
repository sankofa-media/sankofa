    how: Ayler took the plain, hymn-like melodies of spirituals and the wide vibrato of church saxophonists as starting points for free improvisation; that melodic debt is real but is not one of the elements traced here.
    howRu: Эйлер брал простые, похожие на гимны мелодии спиричуэлс и широкое вибрато церковных саксофонистов как отправную точку для свободной импровизации; этот мелодический долг реален, но в наш список элементов не входит.
