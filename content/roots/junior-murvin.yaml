story: "Junior Murvin was a roots-reggae singer whose high, pure falsetto — his “real-setto” — was modelled on the soul singer Curtis Mayfield. His 1976 “Police and Thieves”, a social comment in that voice, carried him from the Jamaican scene to the world."
storyRu: "Джуниор Мёрвин — певец рутс-регги, чей высокий чистый фальцет (он сам называл его «настоящим», real-setto) сложился по образцу соул-певца Кёртиса Мейфилда. Его «Police and Thieves» 1976 года, социальная зарисовка, спетая этим голосом, вывела его с ямайской сцены в мир."
