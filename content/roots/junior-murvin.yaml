        dimensions: ["melody-vocal"]
        text: "Asked about the singer who most shaped his style, Murvin named Curtis Mayfield, a “spiritual singer” who “sang for the people”."
        textRu: "На вопрос о певце, сильнее всех повлиявшем на его манеру, Мёрвин назвал Кёртиса Мейфилда — «духовного певца», который «пел для людей»."
        source:
          title: "Rebelbase: Junior Murvin interview (2004)"
          url: "https://rebelbase.be/interviews/detail/junior-murvin---handelsbeurs-102004"
          quote: "but Curtis Mayfield was a spiritual singer. He sang for the people, to help them to live better. He was an American type roots singer."
      - type: "critics"
        dimensions: []
        text: "Pitchfork’s obituary calls him a reggae singer best known for the 1976 hit “Police & Thieves”."
        textRu: "Некролог Pitchfork называет его певцом регги, известным прежде всего по хиту 1976 года «Police & Thieves»."
        source:
          title: "Pitchfork (Carrie Battan): R.I.P. Reggae Singer Junior Murvin (2013)"
          url: "https://pitchfork.com/news/53191-rip-reggae-singer-junior-murvin/"
          quote: "Murvin is best known as the man behind the 1976 reggae hit \"Police & Thieves\" (produced by Lee \"Scratch\" Perry), which broke him out of the local Jamaican scene and put him on the international radar"
      - type: "critics"
        dimensions: ["melody-vocal"]
        text: "Introducing the interview, Rebelbase calls his falsetto one of the most remarkable voices in reggae."
        textRu: "Во вступлении к интервью Rebelbase называет его фальцет одним из самых примечательных голосов в регги."
        source:
          title: "Rebelbase: Junior Murvin — Handelsbeurs (2004)"
          url: "https://rebelbase.be/interviews/detail/junior-murvin---handelsbeurs-102004"
          quote: "Fact is the man has one of the most remarkable voices in reggae music, even though he'd rather avoid using the term \"falsetto\"... Junior, your unmistakeable falsetto voice is still as strong as ever."
