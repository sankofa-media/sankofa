story: "Junior Murvin sang reggae in a high falsetto, one of the most remarkable voices of the music, and named the soul singer Curtis Mayfield as his model. His 1976 “Police and Thieves” carried him from the Jamaican scene to the world."
storyRu: "Джуниор Мёрвин пел регги высоким фальцетом — одним из самых примечательных голосов этой музыки — и называл своим образцом соул-певца Кёртиса Мейфилда. «Police and Thieves» 1976 года вывела его с ямайской сцены в мир."
