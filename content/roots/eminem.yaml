story: "Eminem learned rap from the golden-age MCs — LL Cool J made him want to rap, and Rakim’s multisyllabic, inside rhyme schemes taught him how. He came up battle-rapping in Detroit’s underground clubs and broke through with a rapid-fire delivery of raw, taboo stories, often voiced by his alter ego Slim Shady."
storyRu: "Эминем учился рэпу у эмси золотой эры: LL Cool J заставил его захотеть читать рэп, а многосложные внутренние рифмы Ракима научили, как это делать. Он вырос на рэп-баттлах в подпольных клубах Детройта и прорвался скороговоркой о самом сыром и запретном, часто голосом своего альтер эго Слима Шейди."
