story: "Black Sabbath started as a blues band playing twelve-bar blues in the wake of John Mayall and Eric Clapton. From it they made heavy metal: downtuned riffs on the tritone, crushing volume, Osbourne’s high urgent voice and lyrics of the occult and working-class despair."
storyRu: "Black Sabbath начинали как блюзовая группа, игравшая двенадцатитактовый блюз вслед за Джоном Мейоллом и Эриком Клэптоном. Из него они сделали хеви-метал: риффы на тритоне в пониженном строе, оглушительная громкость, высокий напряжённый голос Осборна и тексты об оккультизме и безысходности рабочих кварталов."
