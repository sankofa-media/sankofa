        dimensions: ["rhythm", "melody-vocal"]
        text: "John J. Winters at WBUR calls grunge punk's flannel-bedecked stepchild and hears in Nirvana great melodies harnessed to the maelstrom of the Grohl–Novoselic rhythm section."
