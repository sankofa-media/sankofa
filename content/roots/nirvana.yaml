        source:
          title: "Rock & Roll Hall of Fame: Nirvana (inducted 2014)"
          url: "https://rockhall.com/inductees/nirvana/"
          quote: "Nirvana accidentally kicked off a cultural revolution bred in the Pacific Northwest with 1991's Nevermind. ... Nirvana expressed angst, ennui and frustration – and plenty of melodic hooks. ... From the humble sludge-metal beginnings of Bleach to the polished grunge sheen of Nevermind"
