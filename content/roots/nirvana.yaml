        source:
          title: "John J. Winters, WBUR Cognoscenti: Twenty years later, Kurt Cobain's legacy still does not fade away (2014)"
          url: "https://www.wbur.org/cognoscenti/2014/04/01/twenty-years-later-kurt-cobains-legacy-still-does-not-fade-away"
