story: "Nirvana came out of the Pacific Northwest grunge scene, moving from the sludge-metal of Bleach to the polished grunge of Nevermind. Their raw, cathartic sound was punk-inspired — Kurt Cobain pictured pop bands “molested by Black Flag and Black Sabbath” — and their hooks came from the Beatles, whom Cobain called his biggest influence."
storyRu: "Nirvana вышли из гранжевой сцены тихоокеанского Северо-Запада и прошли путь от тяжёлого, вязкого метала «Bleach» до отполированного гранжа «Nevermind». Их сырой, исступлённый звук вырос из панка — Курт Кобейн представлял себе поп-группы, «над которыми надругались Black Flag и Black Sabbath», — а цепкие мелодии пришли от The Beatles, которых Кобейн называл своим главным влиянием."
