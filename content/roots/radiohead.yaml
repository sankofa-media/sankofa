story: "Radiohead work in the art-rock line that runs back to Pink Floyd: adventurous, challenging records that never settle for genre archetypes yet keep great songs at their heart. From guitar rock they moved to the electronica-soaked Kid A, and Thom Yorke heard the drums of “Pyramid Song” as something from a Charles Mingus record."
storyRu: "Radiohead продолжают линию арт-рока, идущую от Pink Floyd: смелые, непростые пластинки, которые не довольствуются жанровыми шаблонами, но в сердцевине держат отличные песни. От гитарного рока группа пришла к пропитанному электроникой «Kid A», а в барабанах «Pyramid Song» Тому Йорку слышалось что-то с пластинки Чарльза Мингуса."
