story: "Oasis built guitar-based British rock and roll on the Beatles: Noel Gallagher's Beatle-esque melodies and anthemic choruses, punchy guitars and Liam Gallagher's nasal vocal. Noel named the Beatles among the bands that made him a guitarist and wanted to sound like a cross of John Squire, Paul Weller and John Lennon."
storyRu: "Oasis строили гитарный британский рок-н-ролл на фундаменте The Beatles: битловские мелодии и гимновые припевы Ноэла Галлахера, напористые гитары и носовой вокал Лиама Галлахера. Ноэл называл The Beatles среди групп, сделавших его гитаристом, и хотел звучать как помесь Джона Сквайра, Пола Уэллера и Джона Леннона."
