          url: "https://www.bluenote.com/artist/john-coltrane/"
          quote: "By this time, his playing was frequently in a style alternately dubbed “avant-garde,” “free,” or “The New Thing.” Like Ornette Coleman, he played seemingly formless, extended solos that some listeners found tremendously impressive, and others decried as noise."
