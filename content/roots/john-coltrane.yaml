    kind: "teacher"
    scope: "career"
    how: "Coltrane took from Davis the move from chord-based forms to open modal structures and the freedom to stretch out, and developed modal improvisation further in his own 1960s groups."
    howRu: "Колтрейн взял у Дэвиса переход от аккордовых форм к открытым модальным структурам и свободу развёрнутой импровизации, а затем развил модальную игру в собственных ансамблях 1960-х."
    carries: ["improvisation"]
    dimensions: ["harmony-form", "performance"]
    evidence:
      - type: "testimony"
        dimensions: ["harmony-form", "performance"]
        text: "Coltrane said Davis’s music gave him freedom to apply his harmonic ideas; he called Davis “Teacher” and later developed modal ideas in his own groups."
        textRu: "Колтрейн говорил, что музыка Дэвиса дала ему свободу применять собственные гармонические идеи; он звал Дэвиса «Учителем», а модальные идеи потом развивал в своих ансамблях."
        source:
          title: "John Coltrane: official biography"
          url: "https://www.johncoltrane.com/biography"
          quote: "“Miles's music gave me plenty of freedom,\" he said. \"It's a beautiful approach...I found it easy to apply harmonic ideas that I had.\""
      - type: "critics"
        dimensions: ["harmony-form"]
        text: "Blue Note’s biography describes Kind of Blue, on which Coltrane played, as an album of modal improvisation on scales rather than chords."
        textRu: "Биография Blue Note описывает «Kind of Blue», где играл Колтрейн, как альбом модальной импровизации — на ладах, а не на аккордах."
        source:
          title: "Blue Note Records: John Coltrane — biography"
          url: "https://www.bluenote.com/artist/john-coltrane/"
          quote: "this landmark album known for its “modal” playing (improvisations based on scales or “modes,” rather than chords) became one of the best-selling and most-acclaimed recordings in the history of jazz."
