story: "John Coltrane was hooked by Charlie Parker’s bebop, with its rhythmic freedom and widened harmony, and it set the course of his saxophone playing. In Miles Davis’s band, whom he called “Teacher”, he found the modal freedom he later developed in his own quartet; in the 1960s, drawn by Ornette Coleman and Albert Ayler, he moved into free jazz."
storyRu: "Джона Колтрейна захватил бибоп Чарли Паркера с его ритмической свободой и расширенной гармонией — это и определило путь его саксофона. В ансамбле Майлза Дэвиса, которого он звал «Учителем», он нашёл модальную свободу и потом развил её в собственном квартете; в 1960-е, вслед за Орнеттом Коулманом и Альбертом Эйлером, ушёл во фри-джаз."
