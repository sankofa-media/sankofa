story: "Kraftwerk grew out of krautrock: Ralf Hütter and Florian Schneider started in Düsseldorf with free improvisation, on the same scene as Can and Faust, and set out to make music of their own, away from Anglo-American structures built on the blues. Krautrock itself stood on 1960s rock, whose electric band and driving beat come from rhythm and blues, and on the collective improvisation of free jazz. From the late 1970s, Karl Bartos says, James Brown’s funky beats came in more and more."
storyRu: "Kraftwerk выросли из краутрока: Ральф Хюттер и Флориан Шнайдер начинали в Дюссельдорфе со свободной импровизации — на одной сцене с Can и Faust — и хотели своей музыки — подальше от англо-американских структур на блюзовой основе. Сам краутрок стоял на роке 1960-х, чья электрическая группа и напористый бит пришли из ритм-н-блюза, и на коллективной импровизации фри-джаза. А с конца 1970-х, по словам Карла Бартоса, в музыку группы всё больше входили фанковые биты Джеймса Брауна."
