  - to: "style:synth-pop"
    kind: "style"
    scope: "career"
    how: "Kraftwerk laid the groundwork of synth-pop: songs built entirely from synthesizers, drum machines and vocoded voices, with regimented pulses and a formal, robotic image that synth-pop bands copied."
    howRu: "Kraftwerk заложили основу синти-попа: песни целиком из синтезаторов, драм-машин и голосов через вокодер, строгая пульсация и формальный, «роботизированный» образ, который переняли синти-поп-группы."
    carries: ["groove"]
    dimensions: ["sound", "rhythm", "image"]
    evidence:
