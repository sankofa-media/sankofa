id: "kraftwerk"
name: "Kraftwerk"
aliases: ["крафтверк", "крафтверкк"]
years: [1970]
place: {"name": "Düsseldorf", "lat": 51.2277, "lon": 6.7735}
placeRu: "Дюссельдорф"
genre: "Electronic music"
genreRu: "электронная музыка"
story: "Kraftwerk built a regimented electronic pop on drum machines, vocoders and synthesizers that became the groundwork of synth-pop. Florian Schneider told Juan Atkins the band was hugely influenced by James Brown, Ralf Hütter hears in rhythm machines the core of funk, and Karl Bartos says he brought Brown’s funky beats in more and more from the late 1970s — the American rhythm under the European melody that Detroit and the Bronx heard."
storyRu: "Kraftwerk построили строгий электронный поп на драм-машинах, вокодерах и синтезаторах, ставший основой синти-попа. Флориан Шнайдер рассказывал Хуану Аткинсу, что группа испытала огромное влияние Джеймса Брауна, Ральф Хюттер слышит в ритм-машинах самую суть фанка, а Карл Бартос говорит, что с конца 1970-х всё больше вносил фанковые биты Брауна, — американский ритм под европейской мелодией, который услышали Детройт и Бронкс."
