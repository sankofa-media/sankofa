        source:
          title: "Exclaim!: Kraftwerk — Days of Future Past"
          url: "https://exclaim.ca/music/article/kraftwerk-days_of_future_past"
          quote: "the album's regimented hypno-pulses lay the groundwork for electro-funk, ambient, and synth-pop."
