story: "Jack White heard in Son House the song he had been waiting for his whole life, and took from him the raw Delta voice of the White Stripes: bluesy slide guitar and a primal, percussive attack, retold rather than copied. With Meg White's hypnotic drums the duo set it inside the stripped-down punk-blues minimalism of the garage revival."
storyRu: "В музыке Сона Хауса Джек Уайт услышал песню, которую ждал всю жизнь, и взял у него необработанный дельта-блюзовый голос The White Stripes — блюзовый слайд и первобытную ударную атаку, пересказанные, а не скопированные. Вместе с гипнотическими барабанами Мег Уайт дуэт вписал этот голос в аскетичный панк-блюзовый минимализм гаражного возрождения."
