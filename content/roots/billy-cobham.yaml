        text: "His Blue Note biography calls him fusion’s greatest drummer and describes his jazz-rock hybrids, funky grooves and solos."
        textRu: "Биография Blue Note называет его величайшим барабанщиком фьюжна и описывает его джаз-роковые гибриды, фанковые грувы и соло."
        source:
          title: "Blue Note Records: Billy Cobham — biography"
          url: "https://www.bluenote.com/artist/billy-cobham/"
          quote: "At his best, Cobham harnessed his amazing dexterity into thundering, high-octane hybrids of jazz complexity and rock & roll aggression. He was capable of subtler, funkier grooves on the one hand, and awe-inspiring solo improvisations on the other"
      - type: "critics"
        dimensions: ["sound"]
        text: "Modern Drummer calls Spectrum his landmark fusion album and credits it with influencing rock, jazz, funk and fusion bands."
        textRu: "Modern Drummer называет «Spectrum» его этапным фьюжн-альбомом, повлиявшим на рок-, джаз-, фанк- и фьюжн-группы."
        source:
          title: "Modern Drummer: Billy Cobham (2013)"
          url: "https://www.moderndrummer.com/2013/03/billy-cobham/"
          quote: "Spectrum is Cobham’s landmark fusion album that was released in 1973 and, in addition to Cobham, features legendary musicians Jan Hammer, Tommy Bolin, Leland Sklar, and others. The album is largely credited as being a major influence on a generation of rock, jazz, funk, and fusion bands."
  - to: "root:miles-davis"
