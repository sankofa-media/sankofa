id: "billy-cobham"
name: "Billy Cobham"
nameRu: "Билли Кобэм"
aliases: ["билли кобэм", "билли кобхэм"]
years: [1944]
place: {"name": "Colón, Panama", "lat": 9.3547, "lon": -79.9006}
placeRu: "Колон, Панама"
genre: "Jazz fusion"
genreRu: "джаз-фьюжн"
story: "Billy Cobham became fusion’s defining drummer, welding jazz complexity to rock aggression in thundering, high-octane hybrids, with funky grooves and dazzling solos. He played in Miles Davis’s first electric bands around 1970 and took from Davis the habit of exploring and pressing on through mistakes."
storyRu: "Билли Кобэм стал главным барабанщиком фьюжна: он сплавил джазовую сложность с роковой агрессией в громовые, предельно напористые гибриды, с фанковыми грувами и ослепительными соло. Около 1970 года он играл в первых электрических составах Майлза Дэвиса и перенял у Дэвиса привычку искать и идти дальше, не застревая на ошибках."
