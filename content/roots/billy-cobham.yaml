    period: "1970–1971 (Miles Davis’s electric bands: Jack Johnson, Live-Evil)"
    how: "In Davis’s early electric bands Cobham played the aggressive jazz-rock of Jack Johnson and Live-Evil and, by his own account, learned to keep exploring and play on through mistakes."
    howRu: "В ранних электрических составах Дэвиса Кобэм играл агрессивный джаз-рок «A Tribute to Jack Johnson» и «Live-Evil» и, по его словам, научился продолжать поиск и играть дальше, не цепляясь за ошибки."
    carries: ["improvisation"]
    dimensions: ["performance"]
    evidence:
      - type: "testimony"
        dimensions: ["performance"]
        text: "Asked what he learned with Davis, Cobham said: keep going after a mistake, follow your heart and develop your own ideas."
        textRu: "На вопрос, чему он научился у Дэвиса, Кобэм ответил: после ошибки играть дальше, следовать сердцу и самому развивать свои идеи."
        source:
          title: "Hit Channel: Interview — Billy Cobham (2013)"
          url: "https://hit-channel.com/interviewbilly-cobham-solomahavishnu-orchestramiles-davis-56775/"
          quote: "To make sure that if you make a mistake, you continue. Don’t stick on that, follow your heart and develop a mean to your ideas yourself."
      - type: "critics"
        dimensions: ["performance"]
        text: "Blue Note’s biography places him in Davis’s new fusion ensemble and on its more aggressive albums."
        textRu: "Биография Blue Note отмечает его участие в новом фьюжн-ансамбле Дэвиса и в записи его более напористых альбомов."
        source:
          title: "Blue Note Records: Billy Cobham — biography"
          url: "https://www.bluenote.com/artist/billy-cobham/"
          quote: "From there, he landed a job in Miles Davis’ new fusion ensemble, and played a small part in the seminal Bitches Brew sessions; he also appeared more prominently on several other Davis albums of the time, including more aggressive classics like Live-Evil and A Tribute to Jack Johnson."
