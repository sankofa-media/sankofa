story: "Steve Harris and Adrian Smith grew up on Deep Purple’s hard rock, and Harris built his songs on its power and on frequent time changes. Iron Maiden turned this into a progressive heavy metal of twin harmony guitars and a bass played like a rhythm guitar."
storyRu: "Стив Харрис и Эдриан Смит выросли на хард-роке Deep Purple, и Харрис строил песни на его мощи и частой смене размеров. Iron Maiden превратили это в прогрессивный хеви-метал, где звучат две гитары в гармонии, а бас играет как ритм-гитара."
