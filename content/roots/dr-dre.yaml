id: "dr-dre"
name: "Dr. Dre"
nameRu: "Доктор Дре"
aliases: ["доктор дре", "доктор дрэ", "андре янг"]
years: [1965]
place: {"name": "Compton, California", "lat": 33.8958, "lon": -118.2201}
placeRu: "Комптон, Калифорния"
genre: "Hip-hop and G-funk"
genreRu: "хип-хоп и джи-фанк"
story: "Dr. Dre came out of N.W.A and gangsta rap, already experimenting with a new production style on the group’s last album. Taking Parliament-Funkadelic’s grooves as his North Star, on The Chronic (1992) he rebuilt ’70s P-Funk with live players, whining Moog synthesizers and deep bass at an unhurried tempo — the G-funk that gave West Coast rap its own sound."
storyRu: "Доктор Дре вышел из N.W.A и гангста-рэпа и ещё на последнем альбоме группы пробовал новую манеру продакшна. Взяв грувы Parliament-Funkadelic за путеводную звезду, на «The Chronic» (1992) он заново собрал пи-фанк 1970-х с живыми музыкантами, ноющими синтезаторами Moog и глубоким басом в неторопливом темпе — так появился джи-фанк, давший рэпу Западного побережья собственный звук."
links:
  - to: "style:g-funk"
    kind: "style"
    scope: "career"
    how: "Dre made G-funk his signature: high-pitched whining synthesizers, deep bass grooves, funk and soul elements and a leisurely, bouncing tempo, built from the drums and bass up."
    howRu: "Дре сделал джи-фанк своим почерком: высокие ноющие синтезаторы, глубокий басовый грув, элементы фанка и соула и неторопливый, пружинящий темп, выстроенный от барабанов и баса."
    carries: ["groove"]
    dimensions: ["sound", "rhythm"]
    evidence:
      - type: "critics"
        dimensions: ["sound", "rhythm"]
        text: "Rashad Grove calls “Nuthin’ But a ‘G’ Thang” the blueprint of G-funk: funk and soul samples, high-pitched synthesizers and deep bass grooves."
        textRu: "Рашад Гроув называет «Nuthin’ But a ‘G’ Thang» образцом джи-фанка: сэмплы фанка и соула, высокие синтезаторы и глубокий басовый грув."
        source:
          title: "Library of Congress, National Recording Registry (Rashad Grove): “The Chronic” — Dr. Dre (1992)"
          url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/the-chronic.pdf"
          quote: "“Nuthin' But a ‘G’ Thang” was released as the album’s first single on November 19, 1992 and it became the blueprint for the G-funk sound, with funk and soul samples, high-pitched synthesizers, and deep bass grooves that Dre had mastered adding to his mystic reputation as the ultimate perfectionist."
      - type: "critics"
        dimensions: ["rhythm"]
        text: "Sheldon Pearce hears G-funk’s songs move more leisurely than East Coast rap."
        textRu: "Шелдон Пирс слышит, что песни джи-фанка движутся неторопливее, чем рэп Восточного побережья."
        source:
          title: "Pitchfork (Sheldon Pearce): Dr. Dre — The Chronic"
          url: "https://pitchfork.com/reviews/albums/dr-dre-the-chronic/"
          quote: "The album’s reinterpretation of ’70s P-Funk, dubbed G-Funk, was altogether different. Dr. Dre’s songs moved more leisurely, a tonic for the hustle and bustle of East Coast rap."
  - to: "card:funk"
    kind: "influence"
    scope: "career"
    how: "Dre took Parliament-Funkadelic’s style as his North Star: the deep, alien grooves of George Clinton and Bernie Worrell, replayed by live musicians and bent into whining Moog lines."
    howRu: "Дре взял за путеводную звезду стиль Parliament-Funkadelic: глубокие «инопланетные» грувы Джорджа Клинтона и Берни Уоррелла, переигранные живыми музыкантами и вывернутые в ноющие партии Moog."
    carries: ["groove"]
    dimensions: ["rhythm", "sound"]
    evidence:
      - type: "critics"
        dimensions: ["rhythm", "sound"]
        text: "Grove writes that Dre used Parliament-Funkadelic’s grooves as his North Star, mixing samples with live instrumentation."
        textRu: "Гроув пишет, что Дре сделал грувы Parliament-Funkadelic своей путеводной звездой, соединяя сэмплы с живой игрой."
        source:
          title: "Library of Congress, National Recording Registry (Rashad Grove): “The Chronic” — Dr. Dre (1992)"
          url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/the-chronic.pdf"
          quote: "Using the timeless grooves of Parliament Funkadelic as his North Star, Dre seamlessly wielded samples with live instrumentation that created a unique sound that caused a seismic shift in the hip hop landscape."
      - type: "critics"
        dimensions: ["rhythm", "sound"]
        text: "Pearce describes live musicians channelling Bernie Worrell and George Clinton, and Dre’s whining Moog synthesizers."
        textRu: "Пирс описывает живых музыкантов, воскрешающих грувы Берни Уоррелла и Джорджа Клинтона, и ноющие синтезаторы Moog у Дре."
        source:
          title: "Pitchfork (Sheldon Pearce): Dr. Dre — The Chronic"
          url: "https://pitchfork.com/reviews/albums/dr-dre-the-chronic/"
          quote: "Instead of sampling records, as he had for N.W.A, Dre had his live musicians channeling the deep alien grooves of Bernie Worrell and George Clinton. Dre helped to reshape the sound of the West using whining Moog synthesizers."
