story: "Dinah Washington was above all a jazz vocalist: she sang with Lionel Hampton’s band and recorded straight jazz sessions with Clifford Brown and Clark Terry, reshaping a melody at will while keeping every syllable clear. In rhythm and blues she dominated the charts of the late 1940s and 1950s as the “Queen of the Blues”, with a penetrating, high-pitched voice and a taste for bawdy songs."
storyRu: "Дайна Вашингтон была прежде всего джазовой певицей: она пела в оркестре Лайонела Хэмптона и записывала чисто джазовые сессии с Клиффордом Брауном и Кларком Терри, перекраивая мелодию как хотела и не теряя ни одного слога. В ритм-н-блюзе «королева блюза» конца 1940-х и 1950-х годов царила в чартах — пронзительным высоким голосом и вкусом к озорным песням."
