  - to: "style:british-beat"
    kind: "style"
    scope: "career"
    how: "The Stones were the blues-and-R&B wing of British beat: American blues and rhythm and blues played with swagger, a dangerous image and a frontman who moved on stage as no white singer had."
    howRu: "Rolling Stones были блюзовым и ритм-н-блюзовым крылом британского бита: американский блюз и ритм-н-блюз, сыгранные с вызовом, опасный образ и фронтмен, который двигался на сцене так, как до него не двигался ни один белый певец."
    dimensions: ["sound", "image", "performance"]
    evidence:
      - type: "critics"
        dimensions: ["sound", "image"]
        text: "The Rock & Roll Hall of Fame describes a band that married its love of blues and American R&B to many styles, with swagger as the constant throughline; Pete Townshend: they had the sound, the image, and they were dangerous."
        textRu: "Зал славы рок-н-ролла пишет о группе, которая соединила любовь к блюзу и американскому ритм-н-блюзу со множеством стилей, и сквозная нить у неё — вызов. Пит Таунсенд: у них был звук, был образ, и они были опасны."
        source:
          title: "Rock & Roll Hall of Fame: The Rolling Stones"
          url: "https://www.rockhall.com/inductees/rolling-stones"
          quote: "They had the sound, they had the image, and they were dangerous."
      - type: "critics"
        dimensions: ["performance"]
        text: "The St. James Encyclopedia of Popular Culture says the Stones brought the Afro-American form of blues to a young white audience, with early records built on rhythm and blues and a stage image of surly sexuality; Lillian Roxon wrote that no one had seen a white man move on stage as Jagger did."
        textRu: "«Энциклопедия популярной культуры Сент-Джеймс» пишет, что Stones принесли афроамериканский блюз молодой белой публике: ранние записи держались на ритм-н-блюзе, а сценический образ — на угрюмой сексуальности. Лиллиан Роксон писала, что никто ещё не видел, чтобы белый человек так двигался на сцене, как Джаггер."
        source:
          title: "Martyn Bone, St. James Encyclopedia of Popular Culture: The Rolling Stones (via Encyclopedia.com)"
          url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/rolling-stones"
          quote: "No one had ever seen a white man move on stage the way Jagger moved."
story: "The Rolling Stones learned from the South Side Chicago blues of Muddy Waters: the amplified sound and tight interplay of a blues band. From Chuck Berry Keith Richards took his riff-driven guitar, and the band his energized stage manner. Together this made them the blues-and-R&B wing of British beat, with swagger, danger and Jagger's movement on stage."
storyRu: "Rolling Stones учились у чикагского блюза Саут-Сайда, у Мадди Уотерса, — электрическому звучанию и плотной сыгранности блюзового ансамбля. У Чака Берри Кит Ричардс взял гитару на риффах, а группа — заряженную сценическую подачу. Так они стали блюзовым и ритм-н-блюзовым крылом британского бита — с вызовом, ощущением опасности и пластикой Джаггера на сцене."
