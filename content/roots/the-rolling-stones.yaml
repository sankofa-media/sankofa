story: "Muddy Waters was one of the blues models around whom the young Rolling Stones shaped their sound. Their single “Little Red Rooster” carried a blues song into their own repertoire."
storyRu: "Молодые The Rolling Stones вырабатывали своё звучание, равняясь на Мадди Уотерса и его блюз. Выпустив сингл «Little Red Rooster», они включили блюзовую песню в собственный репертуар."
