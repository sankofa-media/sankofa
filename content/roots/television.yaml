story: "Before Television, Tom Verlaine’s musical education included the saxophone and the music of John Coltrane and Albert Ayler. The Velvet Underground were another early influence."
storyRu: "До Television Том Верлен учился музыке, играя на саксофоне и слушая Джона Колтрейна и Альберта Эйлера. Ещё одним ранним ориентиром для него стали The Velvet Underground."
