story: "Tom Verlaine came to the guitar from the saxophone and the free jazz of John Coltrane and Albert Ayler, and Television's long, exploratory guitar improvisations carry that jazz ambition. The band grew up in the New York punk scene around CBGB, pairing clean melodic leads with aggressive, staccato punk rhythm guitar."
storyRu: "Том Верлен пришёл к гитаре от саксофона и фри-джаза Джона Колтрейна и Альберта Эйлера, и в долгих ищущих гитарных импровизациях Television живёт эта джазовая планка. Группа выросла на нью-йоркской панк-сцене вокруг CBGB и соединяла чистые мелодичные соло с резкой, отрывистой панковской ритм-гитарой."
links:
  - to: "root:john-coltrane"
    kind: "influence"
    how: "Verlaine, a teenage saxophonist turned on by Coltrane, held the electric guitar to the standard of free jazz: long, exploratory improvisations that move from chaotic soundscapes to clean, finely tuned lines."
    howRu: "Верлен, подростком взявшийся за саксофон после пластинки Колтрейна, мерил электрогитару планкой фри-джаза: долгие ищущие импровизации, переходящие от хаотичных звуковых пейзажей к чистым, тонко выверенным линиям."
