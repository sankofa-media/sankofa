        dimensions: ["performance"]
        text: "Verlaine recalled taking up the saxophone in seventh grade after someone played him a Coltrane record."
        textRu: "Верлен вспоминал, что взялся за саксофон в седьмом классе, когда кто-то поставил ему пластинку Колтрейна."
        source:
          title: "Phil Weller: The songs that made Tom Verlaine take the guitar seriously, Guitar World (2026, from a 1981 interview)"
          url: "https://www.guitarworld.com/artists/guitarists/the-songs-that-made-tom-verlaine-take-the-guitar-seriously"
          quote: "“And then when somebody turned me on to a Coltrane record around seventh grade,” he continued. “I took up the saxophone."
      - type: "critics"
        dimensions: ["performance", "sound"]
        text: "The New York Times obituary, reprinted by the Irish Times, names Ayler and Coltrane among Verlaine's influences and quotes Lenny Kaye on his move from free-jazz soundscapes to delicate filigree."
        textRu: "Некролог New York Times, перепечатанный Irish Times, называет Эйлера и Колтрейна среди тех, кто повлиял на Верлена, и приводит слова Ленни Кея о том, как тот переходил от фри-джазовых звуковых пейзажей к тонкой филиграни."
        source:
          title: "Gavin Edwards and Peter Keepnews: Tom Verlaine obituary, The Irish Times / The New York Times (2023)"
          url: "https://www.irishtimes.com/culture/music/2023/01/30/tom-verlaine-guitarist-frontman-of-us-band-television-dies-at-73"
          quote: "He was equally influenced by rock bands such as the Yardbirds and the Rolling Stones and free-jazz musicians such as Albert Ayler and John Coltrane."
      - type: "critics"
        dimensions: ["sound", "performance"]
        text: "Lenny Kaye describes Verlaine's range from chaotic free-jazz soundscapes to delicate filigree."
        textRu: "Ленни Кей описывает диапазон Верлена — от хаотичных фри-джазовых звуковых пейзажей до тонкой филиграни."
        source:
          title: "Gavin Edwards and Peter Keepnews: Tom Verlaine obituary, The Irish Times / The New York Times (2023)"
          url: "https://www.irishtimes.com/culture/music/2023/01/30/tom-verlaine-guitarist-frontman-of-us-band-television-dies-at-73"
          quote: "“He could move from chaotic soundscapes of free jazz to delicate filigree. It wasn’t covered up with distortion. He had a real sense of the instrument and its expressive powers.”"
      - type: "critics"
        dimensions: ["sound"]
        text: "Matt Mitchell hears the jazz influence on Marquee Moon and says the band wanted to sound like the Velvet Underground jamming with Coltrane."
        textRu: "Мэтт Митчелл слышит джазовое влияние на «Marquee Moon» и пишет, что группа хотела звучать так, будто Velvet Underground джемуют с Колтрейном."
        source:
          title: "Matt Mitchell: Air Couldn’t Touch Us — Remembering Tom Verlaine, Paste (2023)"
          url: "https://www.pastemagazine.com/music/television/remembering-tom-verlaine-of-television"
          quote: "Television wanted to make records that sounded like the Velvet Underground jamming with John Coltrane."
