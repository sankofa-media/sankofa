story: "James Hetfield took his rhythm playing and songwriting from Tony Iommi’s menacing riffs. Metallica came out of the new wave of British heavy metal and sped it up into thrash, adding punk energy and progressive song structures."
storyRu: "Ритм-гитара и манера сочинять Джеймса Хэтфилда выросли из угрожающих риффов Тони Айомми. Metallica вышли из новой волны британского хеви-метала и разогнали её до трэша, добавив панковскую энергию и прогрессивное строение песен."
