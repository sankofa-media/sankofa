story: "Otis Redding began by trying to sound like Little Richard; critics hear in his mature voice the harshness of Little Richard joined to the softness of Sam Cooke. In soul he became a titan of emotion and live energy, building records on the Stax groove and on horn lines he sang to the players, over the triplet feel he called “church things”."
storyRu: "Отис Реддинг начинал с попыток звучать как Литл Ричард; критики слышат в его зрелом голосе резкость Литл Ричарда, соединённую с мягкостью Сэма Кука. В соуле он стал титаном чувства и концертной энергии: его записи держались на грувах Stax, на духовых партиях, которые он напевал музыкантам, и на триольном пульсе, который он называл «церковными штуками»."
