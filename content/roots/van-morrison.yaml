    kind: "influence"
    how: "Morrison took from Lead Belly the whole sound of the folk-blues singer — the voice and the ringing twelve-string guitar — and heard it as part of one blues-and-gospel world that stayed with him from Them onwards."
    howRu: "От Ледбелли Моррисон взял весь звук фолк-блюзового певца — голос и звенящую двенадцатиструнную гитару — и слышал его частью единого мира блюза и госпела, который остался с ним со времён Them."
