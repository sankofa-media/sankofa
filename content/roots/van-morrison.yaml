    how: "From Ray Charles, whose records he bought as a teenager, Morrison took the model of a soul singer who moves freely across rhythm and blues, jazz, gospel and country."
    howRu: "У Рэя Чарльза, чьи пластинки он покупал подростком, Моррисон взял образец соул-певца, который свободно переходит от ритм-н-блюза к джазу, госпелу и кантри."
