story: "Van Morrison built his voice on the Black American records of his father’s collection: Lead Belly’s voice and twelve-string guitar first, then Ray Charles, whose genre-crossing soul he idolised. His own career grew out of rhythm and blues, from the Monarchs and Them to the jazz-tinged soul of Astral Weeks and Moondance."
storyRu: "Ван Моррисон строил свой голос на чёрных американских пластинках из отцовской коллекции: сначала голос и двенадцатиструнная гитара Ледбелли, потом Рэй Чарльз, чей соул поверх жанровых границ он боготворил. Сама его карьера выросла из ритм-н-блюза — от Monarchs и Them до соула с джазовым отливом в Astral Weeks и Moondance."
links:
