story: "Edwin Birdsong was an organist and songwriter of 1970s jazz-funk: a funky, bluesy jazz built on his complex organ arrangements that worked both live and on the dance floor. At the end of the decade, drawn to Larry Levan and New York club culture, he moved to a more upbeat disco and boogie sound."
storyRu: "Эдвин Бёрдсонг был органистом и автором песен в джаз-фанке 1970-х — фанковом, блюзовом джазе, который держался на его сложных органных аранжировках и работал и на сцене, и на танцполе. В конце десятилетия, увлёкшись Ларри Леваном и нью-йоркской клубной культурой, он перешёл к более бодрому звучанию диско и буги."
