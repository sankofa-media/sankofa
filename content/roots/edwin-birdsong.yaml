        text: "Birdsong said he pushed Ayers from pure jazz towards a bluesier, more commercial sound with more singing."
        textRu: "Бёрдсонг говорил, что подтолкнул Айерса от чистого джаза к более блюзовому, доступному звучанию, где больше пели."
        source:
          title: "Wax Poetics (Andy Thomas): Edwin Birdsong — Cosmic Reverb"
          url: "https://magazine.waxpoetics.com/article/edwin-birdsong-cosmic-reverb/"
          quote: "“I think my main influence on Roy at that time was getting him to move from being a purely jazz musician to become more bluesy and commercial,” he says. “I also took him from just playing jazz into singing more.”"
