story: "Daft Punk built their music on Chicago house and Detroit techno: on “Teachers” they shouted out the pioneers they owed their art to, and Chicago’s Paul Johnson recalled they told him he was one of the reasons they started making house. Their debut Homework minted French house — rude 4/4 house heavy with the filter effect and sidechained drums — and from Discovery on they resurrected disco."
storyRu: "Daft Punk построили свою музыку на чикаго-хаусе и детройт-техно: в треке «Teachers» они перечислили первопроходцев, которым обязаны своим искусством, а чикагский продюсер Пол Джонсон вспоминал, что, по их словам, он был одной из причин, по которым они взялись за хаус. Их дебют «Homework» отчеканил французский хаус — грубый хаус на четыре четверти с фильтром и «дышащими» от сайдчейна барабанами, — а начиная с «Discovery» они воскресили диско."
