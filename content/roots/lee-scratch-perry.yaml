genre: "Reggae and dub"
genreRu: "регги и даб"
story: "Lee “Scratch” Perry’s off-kilter rhythm on “People Funny Boy”, taken from a pocomania church service, helped the new reggae style into being, and his loping tempos set the roots-reggae sound. At his Black Ark studio he treated the mixing desk as a living instrument, pioneering dub with emphasised bass, dropped vocals, reverb and echo."
storyRu: "Сбитый, «хромающий» ритм песни «People Funny Boy», подсмотренный на службе ямайской церкви покомания, помог родиться новому стилю — регги, а неторопливые темпы Ли «Скрэтча» Перри задали звучание рутс-регги. В студии Black Ark он обращался с пультом как с живым инструментом и стал одним из первооткрывателей даба: выдвинутый вперёд бас, исчезающий вокал, реверберация и эхо."
