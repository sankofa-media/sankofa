        text: "Perry described the studio as a living thing into which he put his mind."
        textRu: "Перри описывал студию как живое существо, в которое он вкладывал свой разум."
        source:
          title: "The Guardian (Ben Beaumont-Thomas): Lee ‘Scratch’ Perry, visionary master of reggae, dies aged 85 (2021)"
          url: "https://www.theguardian.com/music/2021/aug/29/lee-scratch-perry-visionary-master-of-reggae-dies-aged-85"
          quote: "“I see the studio must be like a living thing, a life itself,” he said. “The machine must be live and intelligent. Then I put my mind into the machine and the machine perform reality.”"
