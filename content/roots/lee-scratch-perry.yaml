        source:
          title: "Songlines: Obituary — Lee ‘Scratch’ Perry (1936–2021)"
          url: "https://www.songlines.co.uk/news/obituary-lee-scratch-perry-1936-2021"
          quote: "In 1973, Perry opened his own rudimentary four-track studio at his home on the outskirts of Kingston, known as the Black Ark, where Perry helped the dub art form to come into being through experimentation with reverb, echo, delay and other effects."
      - type: "critics"
        dimensions: ["sound"]
        text: "The Guardian describes his dub versions: bass emphasised, vocals removed, reverb added."
        textRu: "The Guardian описывает его даб-версии: бас подчёркнут, вокал убран, добавлена реверберация."
        source:
          title: "The Guardian (Ben Beaumont-Thomas): Lee ‘Scratch’ Perry, visionary master of reggae, dies aged 85 (2021)"
          url: "https://www.theguardian.com/music/2021/aug/29/lee-scratch-perry-visionary-master-of-reggae-dies-aged-85"
          quote: "He pioneered the technique of dub versions of reggae tracks, with the bass emphasised, vocals sometimes removed, and reverb added to create an eerie, echoing sonic space."
      - type: "testimony"
