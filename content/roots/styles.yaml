            source:
              title: "Rock & Roll Hall of Fame: The Yardbirds"
              url: "https://rockhall.com/inductees/yardbirds/"
              quote: "They started as a blues cover band, but their rave ups and innovations in feedback and distortion shaped such diverse genres as psychedelic rock, prog rock and punk."
          - type: "analysis"
            dimensions: ["harmony-form", "performance"]
            text: "Around 1965–66 the British Invasion gave way to an age of innovation and eclecticism, with Revolver, Aftermath and Roger the Engineer."
            textRu: "Около 1965–1966 годов британское вторжение сменилось эпохой новаторства и эклектики — «Revolver», «Aftermath», «Roger the Engineer»."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): British Invasion"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/british-invasion"
