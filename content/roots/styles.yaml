            dimensions: ["performance", "image"]
            text: "Synth-pop’s cool, detached stage persona set it apart from punk, which had tried to destroy the boundary between audience and performer."
            textRu: "Холодная отстранённость синти-попа на сцене отделила его от панка, который стремился стереть границу между залом и исполнителем."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): New Wave Music"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/new-wave-music"
              quote: "The stage persona of synthpop, with its cool detachment, also set it quite apart from punk music, whose purveyors were interested in destroying the boundary between audience and performer."
      - to: "style:disco"
