  - id: "russian-rock"
    name: "Russian rock"
    nameRu: "русский рок"
    years: [1969, 1991]
    place: "Moscow, Leningrad and Sverdlovsk"
    placeRu: "Москва, Ленинград и Свердловск"
    traits:
      - {en: "Beat-group rock and roll sung in Russian", ru: "Рок-н-ролл бит-групп, спетый по-русски"}
      - {en: "The lyric as the centre of the song, close to the bard tradition", ru: "Текст как центр песни — рядом с бардовской традицией"}
      - {en: "Beatles-style melody and harmony as the starting point", ru: "Мелодия и гармония в духе The Beatles как отправная точка"}
      - {en: "An unofficial, samizdat scene outside Soviet show business", ru: "Неофициальная, самиздатовская сцена вне советской эстрады"}
    sources:
      - title: "Radio Svoboda: Andrei Makarevich at 50 (with Ilya Smirnov)"
        url: "https://www.svoboda.org/a/24197864.html"
        quote: "Когда в 1970 году воспитанник 19-ой английской спецшколы вывел свою новорожденную группу на сцену ДК \"Энергетик\" с песнями на русском языке, аудитория недоумевала: кто ты такой?"
      - title: "Colta.ru: Andrei Makarevich interview, “Rebyata, eto pro vas pro vsekh” (2019)"
        url: "https://www.colta.ru/articles/music_modern/21682-andrey-makarevich-rebyata-eto-pro-vas-pro-vseh"
        quote: "— Дилан и «Битлз» — конечно. Джаггер, да даже Пит Сигер. А с другой стороны, прежде всего — Окуджава."
      - title: "Colta.ru: Andrei Makarevich interview, “Rebyata, eto pro vas pro vsekh” (2019)"
        url: "https://www.colta.ru/articles/music_modern/21682-andrey-makarevich-rebyata-eto-pro-vas-pro-vseh"
        quote: "В Питере была такая традиция — они серьезно изучали тексты. Не только Дилана, но и Донована, Леннона и Боуи, потом Talking Heads ."
    from:
      - to: "style:british-beat"
        kind: "style"
        how: "Russian rock began with Soviet beat groups copying the Beatles from worn tapes; it kept the Beatles’ melodic manner, and its decisive step was to sing that rock and roll in Russian, with the lyric moving to the centre."
        howRu: "Русский рок начался с советских бит-групп, которые снимали The Beatles с затёртых плёнок; он сохранил битловскую мелодику, а решающим шагом стало то, что этот рок-н-ролл запели по-русски и текст вышел в центр песни."
        carries: []
        dimensions: ["melody-vocal", "harmony-form", "image"]
        evidence:
          - type: "critics"
            dimensions: ["harmony-form", "melody-vocal"]
            text: "A samizdat rock magazine of the time called Mashina Vremeni’s music “pompous Beatling”."
            textRu: "Самиздатовский рок-журнал тех лет назвал музыку «Машины времени» «помпезным битлованием»."
            source:
              title: "Radio Svoboda: Andrei Makarevich at 50 (with Ilya Smirnov)"
              url: "https://www.svoboda.org/a/24197864.html"
              quote: "В те давние годы на страницах самиздата, в журнале \"Ухо\", который я имел удовольствие издавать, музыку \"Машины времени\" назвали \"помпезным битлованием\""
          - type: "critics"
            dimensions: ["melody-vocal", "image"]
            text: "Critic Ilya Smirnov: Makarevich was among those who taught rock and roll to speak Russian."
            textRu: "Критик Илья Смирнов: Макаревич был среди тех, кто научил рок-н-ролл говорить по-русски."
            source:
              title: "Radio Svoboda: Andrei Makarevich at 50 (with Ilya Smirnov)"
              url: "https://www.svoboda.org/a/24197864.html"
              quote: "Илья Смирнов: Андрей Макаревич - один из тех, кто взялся учить музу рок-н-ролла русскому наречию."
          - type: "testimony"
            dimensions: ["melody-vocal"]
            text: "Makarevich names Dylan, the Beatles and Jagger among his sources, and recalls copying Beatles lyrics as phonetic English from worn tapes."
            textRu: "Макаревич называет среди своих источников Дилана, The Beatles и Джаггера и вспоминает, как переписывал битловские тексты с затёртых плёнок на слух, по звучанию английских слов."
            source:
              title: "Colta.ru: Andrei Makarevich interview, “Rebyata, eto pro vas pro vsekh” (2019)"
              url: "https://www.colta.ru/articles/music_modern/21682-andrey-makarevich-rebyata-eto-pro-vas-pro-vseh"
              quote: "А я помню, что страшно обламывался в девятом классе, когда с ужасных пленок списывал битловские тексты."
          - type: "testimony"
            dimensions: ["melody-vocal", "image"]
            text: "In Leningrad musicians seriously studied the lyrics of Dylan, Donovan, Lennon and Bowie."
            textRu: "В Ленинграде рок-музыканты всерьёз изучали тексты Дилана, Донована, Леннона и Боуи."
            source:
              title: "Colta.ru: Andrei Makarevich interview, “Rebyata, eto pro vas pro vsekh” (2019)"
              url: "https://www.colta.ru/articles/music_modern/21682-andrey-makarevich-rebyata-eto-pro-vas-pro-vseh"
              quote: "В Питере была такая традиция — они серьезно изучали тексты. Не только Дилана, но и Донована, Леннона и Боуи, потом Talking Heads ."
        scope: "career"
  - id: "dub"
    name: "Dub"
    nameRu: "даб"
    years: [1968, 1985]
    place: "Kingston, Jamaica"
    placeRu: "Кингстон, Ямайка"
    traits:
      - {en: "Remixes of reggae rhythm tracks in which the vocal drops in and out or vanishes", ru: "Ремиксы ритм-треков регги, где голос то появляется, то исчезает совсем"}
      - {en: "Drum and bass pushed to the front, bass-heavy and spacious", ru: "Барабаны и бас выдвинуты вперёд: много низов и много воздуха"}
      - {en: "Echo, reverb and filter sweeps used as instruments", ru: "Эхо, реверберация и фильтр звучат как самостоятельные инструменты"}
      - {en: "The mixing desk played live: every mix of the same rhythm comes out different", ru: "На микшерном пульте играют вживую: каждый микс одного и того же ритма выходит другим"}
      - {en: "Made for sound-system dances and tested on them", ru: "Музыка для танцев у саунд-систем — там её и проверяли"}
    sources:
      - title: "The Quietus, David Katz: The Strange World Of… King Tubby (2026)"
        url: "https://thequietus.com/interviews/strange-world-of/king-tubby-best-music/"
        quote: "Tubby was an integral force in the development of dub, the abstract reggae subgenre defined by its bass-heavy remixes and echo-shrouded disappearing vocals, the idiosyncratic audio treatments tailored for sound system events."
      - title: "FACT, David Katz: A beginner’s guide to King Tubby, the producer who turned dub into an art form (2015)"
        url: "https://www.factmag.com/2015/05/19/king-tubby-beginners-guide-dub-reggae/"
        quote: "adding delay and reverb to the ‘version’ B-sides he was mixing, thus creating dub as we now know it."
      - title: "Sean Williams, “Tubby’s dub style: The live art of record production”, in The Art of Record Production (Ashgate, 2012)"
        url: "https://www.pure.ed.ac.uk/ws/portalfiles/portal/15441495/Tubbys_Dub_Style.pdf"
        quote: "Tubby fixes his improvisations in the form of records, and he draws on a number of structural, spatial, rhythmic, and timbral techniques to stamp his identity onto each version."
    from:
      - to: "card:reggae"
        kind: "style"
        scope: "career"
        how: "Dub is reggae taken apart at the mixing desk: the drum-and-bass rhythm track of a reggae record becomes the whole song, the vocal comes and goes, and echo, reverb and filter turn the studio into an instrument for the sound-system dance."
        howRu: "Даб — это регги, разобранное на микшерном пульте: ритм-трек из барабанов и баса становится всей песней, голос то возникает, то пропадает, а эхо, реверберация и фильтр превращают студию в инструмент для танцев у саунд-системы."
        carries: ["dub"]
        dimensions: ["rhythm", "harmony-form", "sound", "performance"]
        evidence:
          - type: "testimony"
            dimensions: ["rhythm", "sound"]
            text: "Lee Perry explained that dub began with reggae rhythm tracks: drums and bass were recorded first, and sometimes the producers simply played with the drum and bass alone."
            textRu: "Ли Перри объяснял, что даб начался с ритм-треков регги: сначала записывали барабаны и бас, и порой продюсеры просто играли с одной этой парой."
            source:
              title: "Danny Kelly: Lee Scratch Perry interview (reprinted at Uncarved)"
              url: "https://uncarved.org/dub/scratch.html"
              quote: "how had the idea of dub come about in the first place? \"We liked to record the drums and bass first, to get them perfect. The other instruments would be put on afterwards."
          - type: "critics"
            dimensions: ["harmony-form", "sound"]
            text: "Dub grew from the reggae ‘version’ B-side, a rhythm track with the vocal removed; King Tubby added delay and reverb to these versions."
            textRu: "Даб вырос из «версии» — оборотной стороны сингла регги, ритм-трека без голоса; Кинг Табби добавил к этим версиям задержку и реверберацию."
            source:
              title: "FACT, David Katz: A beginner’s guide to King Tubby, the producer who turned dub into an art form (2015)"
              url: "https://www.factmag.com/2015/05/19/king-tubby-beginners-guide-dub-reggae/"
              quote: "paving the way for the phenomenon of ‘version’ B-sides, in which previously recorded vocal songs would have their rhythm tracks removed for alternate instrumental versions or toasting deejay cuts"
          - type: "analysis"
            dimensions: ["harmony-form", "performance"]
            text: "Because reggae rhythms were recorded apart from the vocals, Tubby could remix the same rhythm into something new, and he tested each dub-plate on his own sound system."
            textRu: "Поскольку ритмы регги записывали отдельно от голоса, Табби мог перемикшировать один и тот же ритм во что-то новое — и проверял каждую пластинку-дабплейт на собственной саунд-системе."
            source:
              title: "Sean Williams, “Tubby’s dub style: The live art of record production”, in The Art of Record Production (Ashgate, 2012)"
              url: "https://www.pure.ed.ac.uk/ws/portalfiles/portal/15441495/Tubbys_Dub_Style.pdf"
              quote: "Tubby was able to take this same rhythm and with or without using the vocal track, was able to make a mix that was so substantially different to the original that it could be released as the b-side of the single"
          - type: "analysis"
            dimensions: ["performance"]
            text: "Running a sound system shaped Tubby’s mixing: new versions were played to a dancing audience within hours."
            textRu: "Саунд-система сформировала манеру Табби: новые версии через несколько часов уже звучали перед танцующей публикой."
            source:
              title: "Sean Williams, “Tubby’s dub style: The live art of record production”, in The Art of Record Production (Ashgate, 2012)"
              url: "https://www.pure.ed.ac.uk/ws/portalfiles/portal/15441495/Tubbys_Dub_Style.pdf"
              quote: "these versions could be played to, and tested on an audience using his own sound system within a matter of hours, allowing almost instant feedback and fine tuning of his mixes."
          - type: "critics"
            dimensions: ["sound"]
            text: "The accidental play of a reggae instrumental opened the way to dub, which King Tubby, Scientist and Lee Perry treated with warping effects."
            textRu: "Случайно поставленная инструментальная версия регги открыла дорогу дабу, а Кинг Табби, Сайентист и Ли Перри обрабатывали его искажающими эффектами."
            source:
              title: "Mixmag: How Jamaican soundsystem culture changed dance music forever"
              url: "https://mixmag.net/feature/how-jamaican-soundsystem-culture-changed-dance-music-forever"
              quote: "Ruddy Redwood’s first accidental play of an instrumental gave way to a new avenue in reggae, the advent of the dub. From straight up instrumentals to the scientific warping effects employed by pioneers like King Tubby, Scientist and Lee “Scratch” Perry"
  - id: "g-funk"
    name: "G-funk"
    nameRu: "джи-фанк"
    years: [1991, 1998]
    place: "Los Angeles and Long Beach, California"
    placeRu: "Лос-Анджелес и Лонг-Бич, Калифорния"
    traits:
      - {en: "Slowed-down P-Funk grooves, made for riding in a car rather than for dancing", ru: "Замедленные грувы пи-фанка — для езды в машине, а не для танцпола"}
      - {en: "Deep, bouncing, bass-driven grooves with funk’s bright horns stripped away", ru: "Глубокий пружинящий грув на басу, из которого убраны яркие фанковые духовые"}
      - {en: "A high-pitched, whining synthesizer melody over the bass", ru: "Высокая, подвывающая синтезаторная мелодия поверх баса"}
      - {en: "Funk and soul samples blended with live musicians replaying the grooves", ru: "Фанковые и соуловые сэмплы вперемешку с живыми музыкантами, которые переигрывают те же грувы"}
      - {en: "Laid-back West Coast gangsta storytelling", ru: "Неторопливые гангста-истории Западного побережья"}
    sources:
      - title: "Library of Congress, National Recording Registry: “The Chronic” — Dr. Dre (essay by Rashad Grove)"
        url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/the-chronic.pdf"
        quote: "it became the blueprint for the G-funk sound, with funk and soul samples, high-pitched synthesizers, and deep bass grooves"
      - title: "Carnegie Hall, Timeline of African American Music: Rap/Hip-Hop"
        url: "https://timeline.carnegiehall.org/genres/rap-hip-hop"
        quote: "utilizing the basics of classic funk songs, but slowing down the tempo for riding in a car (not dancing), adding menacing, bass-driven grooves (stripping funk’s bright sounds from the brass section), highlighted by integrating high-pitched synthesizer and chopped samples"
      - title: "Pitchfork, Sheldon Pearce: Dr. Dre, The Chronic (Sunday Review, 2019)"
        url: "https://pitchfork.com/reviews/albums/dr-dre-the-chronic/"
        quote: "Dre helped to reshape the sound of the West using whining Moog synthesizers."
      - title: "Contemporary Musicians (via Encyclopedia.com): Warren G"
        url: "https://www.encyclopedia.com/education/news-wires-white-papers-and-books/warren-g"
        quote: "bouncing bass lines and hypnotic, high-end melodies"
    from:
      - to: "card:funk"
        kind: "style"
        scope: "career"
        how: "G-funk is 1970s P-Funk slowed down for the car: Parliament-Funkadelic grooves, rebuilt from samples and by live players, keep their deep bass and their whining synthesizer lead but lose the bright horns."
        howRu: "Джи-фанк — это пи-фанк 1970-х, замедленный для езды в машине: грувы Parliament-Funkadelic, собранные из сэмплов и заново сыгранные живыми музыкантами, сохраняют глубокий бас и подвывающий синтезаторный голос, но теряют яркие духовые."
        carries: ["groove", "sampling"]
        dimensions: ["rhythm", "sound", "performance", "melody-vocal"]
        evidence:
          - type: "critics"
            dimensions: ["rhythm", "sound", "performance"]
            text: "Dre used the grooves of Parliament-Funkadelic as his guide, mixing samples with live musicians."
            textRu: "Ориентиром Доктора Дре были грувы Parliament-Funkadelic, а сэмплы он смешивал с живыми инструментами."
            source:
              title: "Library of Congress, National Recording Registry: “The Chronic” — Dr. Dre (essay by Rashad Grove)"
              url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/the-chronic.pdf"
              quote: "Using the timeless grooves of Parliament Funkadelic as his North Star, Dre seamlessly wielded samples with live instrumentation that created a unique sound that caused a seismic shift in the hip hop landscape."
          - type: "critics"
            dimensions: ["performance", "sound", "melody-vocal"]
            text: "Instead of sampling, Dre had live musicians channel the grooves of P-Funk’s Bernie Worrell and George Clinton, with whining Moog synthesizers."
            textRu: "Вместо сэмплов Доктор Дре поручил живым музыкантам воспроизвести грувы Берни Уоррелла и Джорджа Клинтона из P-Funk, а сверху — подвывающий «Муг»."
            source:
              title: "Pitchfork, Sheldon Pearce: Dr. Dre, The Chronic (Sunday Review, 2019)"
              url: "https://pitchfork.com/reviews/albums/dr-dre-the-chronic/"
              quote: "Instead of sampling records, as he had for N.W.A, Dre had his live musicians channeling the deep alien grooves of Bernie Worrell and George Clinton ."
          - type: "critics"
            dimensions: ["rhythm"]
            text: "The Chronic reinterpreted 1970s P-Funk at a more leisurely pace than East Coast rap."
            textRu: "«The Chronic» переосмыслил пи-фанк 1970-х в куда более неторопливом темпе, чем рэп Восточного побережья."
            source:
              title: "Pitchfork, Sheldon Pearce: Dr. Dre, The Chronic (Sunday Review, 2019)"
              url: "https://pitchfork.com/reviews/albums/dr-dre-the-chronic/"
              quote: "The album’s reinterpretation of ’70s P-Funk, dubbed G-Funk, was altogether different. Dr. Dre’s songs moved more leisurely, a tonic for the hustle and bustle of East Coast rap."
          - type: "analysis"
            dimensions: ["rhythm", "sound", "melody-vocal"]
            text: "G-funk took the basics of classic funk songs, slowed the tempo, kept a menacing bass-driven groove without funk’s brass, and added a high-pitched synthesizer."
            textRu: "Джи-фанк брал основу классических фанковых песен, замедлял темп, оставлял угрожающий грув на басу без фанковых духовых и добавлял высокий синтезатор."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Rap/Hip-Hop"
              url: "https://timeline.carnegiehall.org/genres/rap-hip-hop"
              quote: "utilizing the basics of classic funk songs, but slowing down the tempo for riding in a car (not dancing), adding menacing, bass-driven grooves (stripping funk’s bright sounds from the brass section), highlighted by integrating high-pitched synthesizer and chopped samples"
