        kind: "style"
        how: "From R&B and Chicago blues the beat groups took the harmonica-and-electric-guitar band sound, the gritty vocal manner of the Black records they hunted down, and the club practice of playing those songs live for dancing crowds."
        howRu: "У ритм-н-блюза и чикагского блюза бит-группы взяли звук ансамбля с губной гармошкой и электрогитарой, шершавую вокальную манеру чёрных пластинок, за которыми они охотились, и клубную привычку играть эти песни вживую для танцующей публики."
