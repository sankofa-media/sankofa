        kind: "style"
        how: "The beat groups began by copying American rock and roll: the backbeat on bass and drums, the guitar-led band, the shouted lead vocal of Little Richard and Chuck Berry, which they set against tight pop harmonies."
        howRu: "Бит-группы начинали с подражания американскому рок-н-роллу: бэкбит на басу и барабанах, группа во главе с гитарой, крикливый ведущий вокал Литл Ричарда и Чака Берри, который они оттеняли плотным поп-многоголосием."
