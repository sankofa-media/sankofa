            source:
              title: "Rock & Roll Hall of Fame: The Animals"
              url: "https://rockhall.com/inductees/animals/"
              quote: "Heavily influenced by American R&B, the Animals were master interpreters of existing songs, updating them with a working-class toughness and giving them new life."
          - type: "critics"
