  - id: "blues-rock"
    name: "Blues rock"
    nameRu: "блюз-рок"
    years: [1965, 1975]
    place: "London and the United States"
    placeRu: "Лондон и США"
    traits:
      - {en: "Electric Chicago and Delta blues played louder, faster and harder", ru: "Электрический чикагский и дельта-блюз, сыгранный громче, быстрее и жёстче"}
      - {en: "Fast blues-based riffs through overdriven amplifiers, with feedback and wah-wah", ru: "Быстрые блюзовые риффы через перегруженные усилители — с фидбэком и «квакушкой»"}
      - {en: "Long improvised guitar solos as the centre of the performance", ru: "Длинные импровизированные гитарные соло в центре выступления"}
      - {en: "Power trios and guitar-hero virtuosity", ru: "Пауэр-трио и виртуозность гитарного героя"}
    sources:
      - title: "Carnegie Hall, Timeline of African American Music: Rock (Maureen Mahon)"
        url: "https://timeline.carnegiehall.org/genres/rock"
        quote: "explosive, fast-paced blues-based riffs, overdriven amplifiers with high gain and treble to achieve guitar feedback (previously avoided by musicians), and the use of wah-wah pedal to distort sound and exaggerate timbral change, especially during solos."
      - title: "Rock & Roll Hall of Fame: Jimi Hendrix Experience"
        url: "https://rockhall.com/inductees/jimi-hendrix-experience/"
        quote: "Jimi Hendrix revolutionized electric guitar playing, expanding on blues by incorporating feedback, extended improvisation, and a distinctively fluid technique."
      - title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): Blues"
        url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/blues"
        quote: "In the later years of the decade new bands incorporated the blues into their overall sound, with British bands such as Cream (with guitarist Eric Clapton ) and Led Zeppelin foremost among them."
    from:
      - to: "card:blues"
        kind: "style"
        how: "Blues rock is the blues made loud: it took the electric Chicago band sound and the Delta repertoire of Robert Johnson, the riff and the bent guitar line, then amplified it into feedback and stretched it into long solos."
        howRu: "Блюз-рок — это блюз на полной громкости: он взял электрический звук чикагского бэнда и дельта-репертуар Роберта Джонсона, рифф и гитарную фразу с подтяжками — и усилил их до фидбэка, растянув в длинные соло."
        carries: ["riff", "improvisation"]
        dimensions: ["harmony-form", "sound", "performance"]
        evidence:
          - type: "analysis"
            dimensions: ["harmony-form", "sound"]
            text: "British bands such as Cream and Led Zeppelin played Chicago blues classics and reworked Robert Johnson’s Delta style."
            textRu: "Британские группы вроде Cream и Led Zeppelin играли классику чикагского блюза и перерабатывали дельта-стиль Роберта Джонсона."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): Blues"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/blues"
              quote: "Many of these groups not only played Chicago blues classics, but they reached even further back to rework Robert Johnson's delta blues style in such songs as \"Stop Breaking Down\" (The Rolling Stones ), \"Crossroads\" (Cream), and \"Travelling Riverside Blues\" ( Led Zeppelin )."
          - type: "analysis"
            dimensions: ["performance"]
            text: "Touring urban bluesmen had a strong influence on the formation of blues-rock groups in Britain and the US."
            textRu: "Гастроли городских блюзменов сильно повлияли на рождение блюз-роковых групп в Британии и США."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Urban Blues"
              url: "https://timeline.carnegiehall.org/genres/urban-blues"
              quote: "As a result, they had a strong influence on the formation of blues-rock groups in the United States and England, including the Rolling Stones, Led Zeppelin, Eric Clapton with Cream, Canned Heat, the Paul Butterfield Blues Band, and Mark Knopfler with Dire Straits."
          - type: "analysis"
            dimensions: ["sound", "performance"]
            text: "George Clinton heard the new rock as loud blues; Hendrix sped the blues up and added sound effects."
            textRu: "Джордж Клинтон услышал в новом роке громкий блюз; а Хендрикс разогнал блюз и добавил к нему звуковые эффекты."
            source:
