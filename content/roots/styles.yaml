        howRu: "Синти-поп вырос из постпанка и новой волны: группы без виртуозов сохранили панковское «без эго, играть может каждый» и сценические идеи постпанка, но сменили гитары на синтезаторы, а сценический образ сделали холодным и отстранённым."
