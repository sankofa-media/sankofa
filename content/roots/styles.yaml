# Styles of the Roots section: overall musical styles that later artists work in.
# Each style reaches a museum card through `from` steps; every step rests on
# quoted sources (see content/roots/README.md and the data spec).
styles:
  - id: "bebop"
    name: "Bebop"
    nameRu: "бибоп"
    years: [1943, 1955]
    place: "Harlem, New York"
    placeRu: "Гарлем, Нью-Йорк"
    traits:
      - {en: "Extremely fast tempos and long, flowing improvised lines", ru: "Предельно быстрые темпы и длинные текучие импровизационные линии"}
      - {en: "Solos built on the chord changes rather than the melody, with elaborated harmonies", ru: "Соло строятся на гармонической сетке, а не на мелодии; сами гармонии усложнены"}
      - {en: "Irregular accents, odd-length phrases and drumming that keeps time on the cymbal", ru: "Смещённые акценты, фразы неровной длины и барабаны, которые держат время на тарелке"}
      - {en: "Small combos and after-hours jam sessions instead of the dance big band", ru: "Небольшие составы и ночные джем-сейшны вместо танцевального биг-бэнда"}
      - {en: "A defiant, nonconformist stance: art music, not dance music", ru: "Вызывающая, нонконформистская позиция: искусство, а не музыка для танцев"}
    sources:
      - title: "Carnegie Hall, Timeline of African American Music: Bebop"
        url: "https://timeline.carnegiehall.org/genres/bebop"
        quote: "it is distinguished by extremely rapid tempos with improvisational lines based on the harmonic structure rather than the melody, and its rhythmic foundation was developed by innovative drummers such as Kenny “Klook” Clarke and Max Roach."
      - title: "Center for Jazz Studies, Columbia University, Jazz Glossary: bebop"
        url: "https://ccnmtl.columbia.edu/projects/jazzglossary/b/bebop.html"
        quote: "A style of jazz characterized by long flowing melodic lines, irregular accents, non-symmetrical written themes, and elaborated harmonies ; first heard c. 1943."
    from:
      - to: "card:jazz"
        kind: "style"
        scope: "career"
        how: "Bebop grew out of swing-era jazz: it kept the riffs, the 4/4 swing time and the standard tunes of the Kansas City and big-band players, then loaded the chords with higher intervals and moved the music from the dance hall to the small combo."
        howRu: "Бибоп вырос из джаза эпохи свинга: сохранил риффы, свинговый счёт на четыре и стандарты канзас-ситских и биг-бэндовых музыкантов — а затем нагрузил аккорды верхними ступенями и перенёс музыку из танцзала в маленький состав."
        carries: ["riff", "swing"]
        dimensions: ["rhythm", "harmony-form", "performance", "image"]
        evidence:
          - type: "analysis"
            dimensions: ["rhythm", "performance", "image"]
            text: "Bebop evolved out of the swing bands of the 1930s and drew on swing riffs, while musicians from the big bands moved into smaller combos with more room to improvise; the music carried a nonconformist stance."
            textRu: "Бибоп вырос из свинговых оркестров 1930-х и опирался на свинговые риффы; музыканты биг-бэндов уходили в маленькие составы, где было больше простора для импровизации, а сама музыка несла в себе нонконформизм."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Bebop"
              url: "https://timeline.carnegiehall.org/genres/bebop"
              quote: "Bebop is a jazz style that evolved during the 1940s, directly out of and as a reaction to the restrictions of the swing bands of the 1930s. Drawing upon some of the riffs characteristic of swing"
          - type: "analysis"
            dimensions: ["performance"]
            text: "Swing musicians retreated to smaller combos that gave individual players more freedom; some swing-era small groups already played music close to bebop."
            textRu: "Музыканты свинга уходили в небольшие составы, где у каждого было больше свободы; некоторые малые группы эпохи свинга уже играли музыку, близкую к бибопу."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Bebop"
              url: "https://timeline.carnegiehall.org/genres/bebop"
              quote: "many swing musicians of the 1940s retreated to smaller combos that were easier to organize and, likewise, provided more freedom for individual artists to express themselves."
          - type: "analysis"
            dimensions: ["harmony-form", "rhythm"]
            text: "Charlie Parker formed his style in the Kansas City bands and found bebop by improvising on the higher intervals of the chords of a swing-era standard, against the 4/4 swing time."
            textRu: "Чарли Паркер сложился в канзас-ситских оркестрах и нашёл бибоп, импровизируя на верхних ступенях аккордов свингового стандарта поверх свингового счёта на четыре."
            source:
              title: "Library of Congress, National Recording Registry: “Ko Ko” — Charlie Parker (essay by Ed Komara)"
              url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/ko-ko.pdf"
              quote: "They show him making use of these “higher intervals,” such as the 9th, 11th and 13th scale tones in addition to the more often used root (1st), 3rd, 5th and 7th scale tones. But playing those tones in an even 8/8 meter sometimes clashes with the 4/4 swing time."
          - type: "analysis"
            dimensions: ["performance"]
            text: "“Ko Ko” was conceived during Parker’s apprenticeship with Kansas City bands and worked out in New York’s after-hours clubs."
            textRu: "«Ko Ko» Паркер задумал, ещё учась ремеслу в канзас-ситских оркестрах, а отработал в ночных клубах Нью-Йорка."
            source:
              title: "Library of Congress, National Recording Registry: “Ko Ko” — Charlie Parker (essay by Ed Komara)"
              url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/ko-ko.pdf"
              quote: "“Ko Ko” was Charlie Parker’s signature jazz piece, conceived during his apprenticeship with Kansas City bands and hatched in the after-hours clubs of New York City."
  - id: "free-jazz"
    name: "Free jazz"
    nameRu: "фри-джаз"
    years: [1959, 1975]
    place: "New York"
    placeRu: "Нью-Йорк"
    traits:
      - {en: "Soloists leave the chord progression and pre-arranged structure behind after the theme", ru: "После темы солист уходит от аккордовой сетки и заранее заданной формы"}
      - {en: "No fixed beat: free rhythms, with the drums and piano treated as sources of rhythmic energy", ru: "Нет постоянного пульса: свободный ритм, а барабаны и фортепиано становятся источниками ритмической энергии"}
      - {en: "Dissonant collective improvisation, sound and texture over tune", ru: "Диссонантная коллективная импровизация: звук и фактура важнее мелодии"}
      - {en: "A political and spiritual voice of the Civil Rights and Black Power years", ru: "Политический и духовный голос эпохи борьбы за гражданские права и «Власти чёрных»"}
    sources:
      - title: "Carnegie Hall, Timeline of African American Music: Free Jazz/Avant-Garde"
        url: "https://timeline.carnegiehall.org/genres/free-jazz-avant-garde"
        quote: "Free jazz departs radically from past styles; after playing the theme of a song, the soloist typically does not follow a chord progression or a pre-arranged structure and may venture in unpredictable directions."
      - title: "Center for Jazz Studies, Columbia University, Jazz Glossary: free jazz"
        url: "https://ccnmtl.columbia.edu/projects/jazzglossary/f/free_jazz.html"
        quote: "A cluster of jazz styles (post-1954) that minimize the importance of a fixed beat and a given harmonic structure, and emphasize the sound and texture of music."
    from:
      - to: "style:bebop"
        kind: "style"
        scope: "career"
        how: "Free jazz started from bebop’s small-combo practice of a stated theme followed by long solos, and pushed it past its limits: the soloist kept bebop’s speed and freedom of line but stopped following the chord changes."
        howRu: "Фри-джаз отталкивался от бибоповой практики маленького состава — тема, а за ней длинные соло — и вывел её за всякие пределы: солист сохранил бибоповую скорость и свободу линии, но перестал следовать за аккордовой сеткой."
        carries: ["improvisation"]
        dimensions: ["harmony-form", "performance", "melody-vocal"]
        evidence:
          - type: "analysis"
            dimensions: ["performance"]
            text: "The free jazz of the 1960s carried on the stretching of limits that bebop and its offshoots had begun in the 1940s and ’50s."
            textRu: "Фри-джаз 1960-х продолжил то расширение границ, которое начали в 1940–1950-х бибоп и его ответвления."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Free Jazz/Avant-Garde"
              url: "https://timeline.carnegiehall.org/genres/free-jazz-avant-garde"
              quote: "Bebop and its spinoffs of the 1940s and ’50s took jazz to places that had been unimaginable to earlier generations of fans. During the following decades, the music continued to stretch limits."
          - type: "critics"
            dimensions: ["melody-vocal"]
            text: "Ornette Coleman’s jazz style was formed under the influence of Charlie Parker, among others."
            textRu: "Джазовая манера Орнетта Коулмана складывалась среди прочего под влиянием Чарли Паркера."
            source:
              title: "Encyclopedia.com (Gale biographies): Ornette Coleman"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ornette-coleman"
              quote: "His jazz styling was already being influenced by a combination of Charlie Parker, Jimmy Dorsey, and Pete Johnson."
          - type: "testimony"
            dimensions: ["harmony-form", "performance"]
            text: "Coleman to Charlie Haden: chord changes were offered but no longer binding."
            textRu: "Коулман — Чарли Хейдену: вот аккорды, но играть их не обязательно."
            source:
              title: "Encyclopedia.com (Gale biographies): Ornette Coleman"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ornette-coleman"
              quote: "Here are some chord changes, but you don’t have to play them."
          - type: "analysis"
            dimensions: ["harmony-form", "rhythm"]
            text: "Free jazz styles reduced the role of the fixed beat and the given harmonic structure on which earlier jazz rested."
            textRu: "Стили фри-джаза ослабили роль постоянного пульса и заданной гармонической структуры, на которых держался прежний джаз."
            source:
              title: "Center for Jazz Studies, Columbia University, Jazz Glossary: free jazz"
              url: "https://ccnmtl.columbia.edu/projects/jazzglossary/f/free_jazz.html"
              quote: "minimize the importance of a fixed beat and a given harmonic structure"
      - to: "card:jazz"
        kind: "style"
        scope: "career"
        how: "Beyond bebop, free jazz reached back to the oldest jazz texture — the many-voiced collective improvisation of New Orleans — and to the blues, now played with dissonance and a percussive attack."
        howRu: "Минуя бибоп, фри-джаз дотянулся до самой старой джазовой фактуры — многоголосой коллективной импровизации Нового Орлеана — и до блюза, только теперь их играли диссонантно и с ударной атакой."
        carries: ["improvisation"]
        dimensions: ["performance", "sound", "harmony-form"]
        evidence:
          - type: "analysis"
            dimensions: ["performance", "sound"]
            text: "Free jazz is best described as dissonant collective improvisation in the polyphonic manner of New Orleans jazz."
            textRu: "Точнее всего фри-джаз описывается как диссонантная коллективная импровизация в многоголосой манере новоорлеанского джаза."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Free Jazz/Avant-Garde"
              url: "https://timeline.carnegiehall.org/genres/free-jazz-avant-garde"
              quote: "Its style is best described as dissonant collective improvisation in the spirited and polyphonic vein of New Orleans jazz."
          - type: "critics"
            dimensions: ["sound", "harmony-form"]
            text: "Cecil Taylor treated the piano as a percussion instrument and mixed European avant-garde influences with the blues."
            textRu: "Сесил Тейлор обращался с фортепиано как с ударным инструментом и смешивал влияние европейского авангарда с блюзом."
            source:
              title: "Encyclopedia.com (Gale biographies): Cecil Taylor"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/cecil-taylor"
              quote: "His interpretation of the piano as a percussive, rather than string, instrument rather than string, mingled European avant-garde influences with the blues."
          - type: "testimony"
            dimensions: ["performance"]
            text: "Coleman described his free jazz as everyone soloing at once."
            textRu: "Свой фри-джаз Коулман описывал как игру, где солируют все сразу."
            source:
              title: "Encyclopedia.com (Gale biographies): Ornette Coleman"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/ornette-coleman"
              quote: "his singular playing style (rooted in his idea of free jazz — “everybody is soloing, harmolodically”)"
  - id: "jazz-fusion"
    name: "Jazz fusion"
    nameRu: "джаз-фьюжн"
    years: [1969, 1980]
    place: "New York and Los Angeles"
    placeRu: "Нью-Йорк и Лос-Анджелес"
    traits:
      - {en: "Jazz improvisation over rock rhythms and funk grooves", ru: "Джазовая импровизация поверх рок-ритмов и фанковых грувов"}
      - {en: "Electric guitar, electric bass, electric piano and synthesizers, amplified", ru: "Электрогитара, бас-гитара, электропиано и синтезаторы — всё через усилители"}
      - {en: "Mixed meters, odd time signatures, syncopation and complex chords", ru: "Переменный метр, непривычные размеры, синкопы и сложные аккорды"}
      - {en: "Studio techniques borrowed from rock: overdubbing and looping", ru: "Студийные приёмы, взятые у рока: наложения и закольцовки"}
    sources:
      - title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
        url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
        quote: "Jazz fusion often uses mixed meters, odd time signatures, syncopations, and complex chords and harmonies. The jazz fusion style also includes electric instruments, such as the electric guitar, electric bass, electric piano, and synthesizer keyboards."
      - title: "Center for Jazz Studies, Columbia University, Jazz Glossary: fusion"
        url: "https://ccnmtl.columbia.edu/projects/jazzglossary/f/fusion.html"
        quote: "A group of styles of jazz that merged post- bop music with soul, rock, and sometimes funk in an amplified form."
    from:
      - to: "card:jazz"
        kind: "style"
        scope: "career"
        how: "Fusion stayed jazz at its core: post-bop players kept extended solos, group improvisation and the unison themes of hard bop, and laid them over new electric rhythm sections."
        howRu: "В основе фьюжн остался джазом: музыканты пост-бопа сохранили длинные соло, групповую импровизацию и унисонные темы хард-бопа — и положили всё это на новую электрическую ритм-группу."
        carries: ["improvisation"]
        dimensions: ["performance", "melody-vocal", "harmony-form"]
        evidence:
          - type: "analysis"
            dimensions: ["performance", "harmony-form"]
            text: "Fusion merged post-bop jazz with soul, rock and funk, and bands such as Weather Report kept their ties to earlier jazz through extended solos and group improvisation."
            textRu: "Фьюжн соединил пост-боп с соулом, роком и фанком, а такие группы, как Weather Report, сохраняли связь с прежним джазом через длинные соло и групповую импровизацию."
            source:
              title: "Center for Jazz Studies, Columbia University, Jazz Glossary: fusion"
              url: "https://ccnmtl.columbia.edu/projects/jazzglossary/f/fusion.html"
              quote: "while maintaining ties to earlier forms of jazz through extended solos and group improvisation."
          - type: "analysis"
            dimensions: ["melody-vocal", "performance"]
            text: "Herbie Hancock’s “Chameleon” set the unison melodic phrases of hard bop and an improvised synthesizer solo over a funk groove."
            textRu: "В «Chameleon» Херби Хэнкок наложил на фанковый грув унисонные мелодические фразы хард-бопа и импровизированное соло на синтезаторе."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
              url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
              quote: "it’s a funk groove adopted by jazz musicians and combined with the unison melodic phrases of hard bop repeated over two verses, then followed by an improvised, synthesized solo."
          - type: "critics"
            dimensions: ["performance"]
            text: "Miles Davis, a veteran of bebop and hard bop, led the turn to fusion with young players from his own jazz groups."
            textRu: "Поворот к фьюжну возглавил Майлз Дэвис, ветеран бибопа и хард-бопа, вместе с молодыми музыкантами из собственных джазовых составов."
            source:
              title: "Encyclopedia.com (Gale biographies): Miles Davis"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/miles-davis"
              quote: "he has been the spearhead of at least five different stages in music: hard bop, cool jazz, orchestral jazz, modal improvising, and fusion."
      - to: "card:funk"
        kind: "style"
        scope: "career"
        how: "From funk, fusion took its rhythmic engine: James Brown’s and Sly Stone’s grooves, a syncopated, repeated bass line locked to the drums, and funky drumming under the solos."
        howRu: "У фанка фьюжн взял ритмический мотор: грувы Джеймса Брауна и Слая Стоуна, синкопированную повторяющуюся басовую линию, сцепленную с барабанами, и фанковые барабаны под соло."
        carries: ["groove"]
        dimensions: ["rhythm", "sound"]
        evidence:
          - type: "analysis"
            dimensions: ["rhythm", "sound"]
            text: "As soul turned into funk, the rhythms of James Brown and the electronic sounds of Sly and the Family Stone inspired the fusion sound."
            textRu: "Когда соул превращался в фанк, ритмы Джеймса Брауна и электронное звучание Sly and the Family Stone вдохновили звучание фьюжна."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
              url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
              quote: "As soul transformed into funk in the 1970s, the rhythms of James Brown and the electronic sounds of Sly and the Family Stone inspired a contemporary jazz fusion sound."
          - type: "analysis"
            dimensions: ["rhythm"]
            text: "“Chameleon” rests on a syncopated, repetitive bass line locked with the drums into a groove."
            textRu: "«Chameleon» держится на синкопированной повторяющейся басовой линии, которая сцепляется с барабанами в грув."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
              url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
              quote: "It features a syncopated, repetitive bass line that locks with a four-to-the-bar drum pattern to create a groove"
          - type: "critics"
            dimensions: ["rhythm", "sound"]
            text: "Davis electrified jazz inspired by the funk of Sly and the Family Stone and James Brown, as well as by Hendrix’s guitar."
            textRu: "Дэвис электрифицировал джаз под впечатлением от фанка Sly and the Family Stone и Джеймса Брауна, а также от гитары Хендрикса."
            source:
              title: "Encyclopedia.com (Gale biographies): Miles Davis"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/miles-davis"
              quote: "inspired by the power of rock guitarist Jimi Hendrix and the funk of rock and R&B acts Sly and the Family Stone and James Brown, Davis electrified jazz, pioneering what would later be called fusion."
          - type: "testimony"
            dimensions: ["rhythm"]
            text: "Herbie Hancock said James Brown’s beat drew him to R&B and that Sly Stone’s “Thank You” was the funkiest thing he had heard."
            textRu: "Херби Хэнкок говорил, что к ритм-н-блюзу его привёл бит Джеймса Брауна, а «Thank You» Слая Стоуна — самое фанковое из всего, что он слышал."
            source:
              title: "Encyclopedia.com (Gale biographies): Herbie Hancock"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/herbie-hancock"
              quote: "That made me start listening to R & B, because I liked that kind of beat."
      - to: "style:blues-rock"
        kind: "style"
        scope: "career"
        how: "From the loud blues-based rock of Jimi Hendrix and Cream, fusion took the electric, amplified sound and rock’s studio production."
        howRu: "У громкого, выросшего из блюза рока Джими Хендрикса и Cream фьюжн взял электрическое, усиленное звучание и студийную технику рока."
        carries: []
        dimensions: ["sound"]
        evidence:
          - type: "analysis"
            dimensions: ["sound"]
            text: "Inspired by Hendrix’s Are You Experienced, Davis set electric against acoustic instruments and used rock studio techniques; Hendrix and Cream had made rock complex enough for jazz players to borrow from."
            textRu: "Под впечатлением от «Are You Experienced» Хендрикса Дэвис столкнул электрические инструменты с акустическими и взял студийные приёмы рока; Хендрикс и Cream сделали рок достаточно сложным, чтобы джазмены стали у него заимствовать."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
              url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
              quote: "Inspired by Jimi Hendrix’s Are You Experienced (1967), Davis juxtaposed electronic with acoustic instruments and incorporated the post-production techniques of rock, such as overdubbing and looping."
          - type: "analysis"
            dimensions: ["sound"]
            text: "Rock grew more complex with Hendrix and Cream, and jazz players took elements of rock into their style."
            textRu: "С Хендриксом и Cream рок усложнился, и джазмены начали вносить его элементы в свою манеру."
            source:
              title: "Carnegie Hall, Timeline of African American Music: Jazz Fusion"
              url: "https://timeline.carnegiehall.org/genres/jazz-fusion"
              quote: "But rock became more complex and sophisticated through the music of Jimi Hendrix and Cream. Jazz and rock musicians traded ideas and jazz players incorporated elements of rock into their style."
          - type: "critics"
            dimensions: ["sound"]
            text: "The impact of electronics and of players who had mastered them, like Hendrix, pushed Davis to rethink his music and arrive at fusion."
            textRu: "Электроника и музыканты, освоившие её, вроде Хендрикса, заставили Дэвиса переосмыслить свою музыку и прийти к фьюжну."
            source:
              title: "Encyclopedia.com (Gale biographies): Miles Davis"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/miles-davis"
              quote: "The impact of electronics and musicians who were mastering them (like Jimi Hendrix) forced Davis to reevaluate his music and to come up with something fresh and exciting, thus fusion."
  - id: "soul"
    name: "Soul"
    nameRu: "соул"
    years: [1955, 1975]
    place: "Memphis, Detroit, New York and Muscle Shoals"
    placeRu: "Мемфис, Детройт, Нью-Йорк и Масл-Шолс"
    traits:
