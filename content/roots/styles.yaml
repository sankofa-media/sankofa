              title: "Contemporary Musicians (via Encyclopedia.com): Depeche Mode"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/depeche-mode"
              quote: "The combination of post-punk performance ideas, in which improvisation is beside the point, and consumer-driven images, in which people come to share space with a performer, has produced an audience that goes out for more than the pleasure of music."
          - type: "critics"
            dimensions: ["sound"]
            text: "New Order grew out of the post-punk band Joy Division and forged a new sound from synthesizers, effects-processed guitars and drums."
            textRu: "New Order выросли из постпанк-группы Joy Division и создали новое звучание из синтезаторов, гитар с эффектами и барабанов."
            source:
              title: "Contemporary Musicians (via Encyclopedia.com): New Order"
              url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/new-order"
              quote: "Tinkering with New Wave, they forged a new sound from synthesizers, effects-processed guitars, and real drums, rather than drum machines"
