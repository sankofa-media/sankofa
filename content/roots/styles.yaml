  - id: "post-punk"
    name: "Post-punk and new wave"
    nameRu: "постпанк и новая волна"
    years: [1978, 1985]
    place: "London, Manchester and New York"
    placeRu: "Лондон, Манчестер и Нью-Йорк"
    traits:
      - {en: "Punk’s simplicity and independent ethos turned toward experiment", ru: "Простота и независимость панка, обращённые к эксперименту"}
      - {en: "Bass-led grooves borrowed from funk and reggae", ru: "Басовый грув, взятый у фанка и регги"}
      - {en: "Angular, nervous guitars, minimalism and repetition", ru: "Угловатые, нервные гитары, минимализм и повтор"}
      - {en: "Danceable songs, synthesizers and a strong visual style", ru: "Танцевальные песни, синтезаторы и яркий визуальный стиль"}
    sources:
      - title: "Carnegie Hall, Timeline of African American Music: Punk & Alt-Rock"
        url: "https://timeline.carnegiehall.org/genres/punk-alt-rock"
        quote: "Post-punk embraced an Avant Garde approach to ’70s punk style. It opened the door for new wave (a synth-heavy, pop-oriented modern style) and alt-rock, a descendant of punk rock that moved away from the conventions of pop and rock."
      - title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): New Wave Music"
        url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/new-wave-music"
        quote: "New wave was not dangerous or anarchic; it was danceable, romantic, and fun."
      - title: "Rock & Roll Hall of Fame: Talking Heads"
        url: "https://rockhall.com/inductees/talking-heads/"
        quote: "Their blend of funk, minimalism and polyrhythmic world beats articulated the strangeness and anxiety of modern times."
    from:
      - to: "style:punk"
        kind: "style"
        scope: "career"
        how: "Post-punk kept punk’s musical simplicity, its independent do-it-yourself ethos and some of its look, but took an avant-garde turn: the urgent guitar band grew into experimental, atmospheric and danceable music."
        howRu: "Постпанк сохранил музыкальную простоту панка, его независимость и принцип «сделай сам», отчасти и внешний облик, но свернул к авангарду: напористая гитарная группа выросла в экспериментальную, атмосферную и танцевальную музыку."
