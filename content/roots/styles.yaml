            textRu: "Группы британского вторжения начинали с подражания американскому рок-н-роллу и ритм-н-блюзу; ранний рок сохранил сильный рок-н-ролльный бэкбит на басу и барабанах и инструменты ритм-н-блюзовой традиции."
