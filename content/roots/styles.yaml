    sources:
      - title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): Heavy Metal (Colby Vargas)"
        url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/heavy-metal"
        quote: "The heavy metal sound was characterized by loud and distorted guitars and vocals; its image by aggressive male posturing and a preoccupation with sexuality, identity, and the corrosion of traditional social institutions."
      - title: "Tony Iommi official site: Biography, chapter 1 (Hugh Gilmour)"
        url: "https://www.iommi.com/biography/"
        quote: "the name of Tony Iommi has become synonymous with heavy rock, his innovative, de-tuned, dark riffs a blueprint for successive generations of bands that followed."
      - title: "Guitar World: Original members of Black Sabbath look back (Dan Epstein, 2001)"
        url: "https://www.guitarworld.com/gw-archive/archive-original-members-black-sabbath-look-back-30-plus-years-demonic-riffing-2001"
        quote: "With their ominous riffs, fuzzed-out bass lines, earth-shuddering rhythms and desolate lyrical worldview, albums like Paranoid , Master of Reality and Sabbath Bloody Sabbath charted the course for the next three decades of heavy metal-influencing a fair number of punk and grunge bands along the way -- before the original partnership finally splintered in 1979."
    from:
      - to: "style:blues-rock"
        kind: "style"
        how: "Metal is blues rock pushed into darkness: Sabbath, Zeppelin and Deep Purple came out of the late-sixties blues bands, kept the twelve-bar blues, the blues riff and hook, the distorted guitar and the long solo, and made them heavier, slower or faster, and darker."
        howRu: "Метал — это блюз-рок, загнанный во тьму: Black Sabbath, Led Zeppelin и Deep Purple вышли из блюзовых групп конца шестидесятых, сохранили двенадцатитактовый блюз, блюзовый рифф и хук, перегруженную гитару и длинное соло — и сделали всё это тяжелее, медленнее или быстрее и мрачнее."
        carries: ["twelve-bar-blues", "riff"]
        dimensions: ["harmony-form", "sound", "performance", "image"]
        evidence:
          - type: "analysis"
            dimensions: ["harmony-form", "sound", "performance"]
            text: "The founders of the genre each stressed distorted guitar and long solos; Led Zeppelin applied the African American blues hook."
            textRu: "Каждая из групп-основательниц ставила во главу угла перегруженную гитару и длинные соло; Led Zeppelin перенесли в жанр афроамериканский блюзовый хук."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): Heavy Metal (Colby Vargas)"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/heavy-metal"
              quote: "Deep Purple brought classical influences, Led Zeppelin adapted and applied the African-American blues hook, and Black Sabbath lent an air of dark mysticism to their work. Each stressed the importance of distorted guitar sound and long guitar solos."
          - type: "testimony"
            dimensions: ["harmony-form"]
            text: "Before they wrote their own songs, Black Sabbath were a blues band playing twelve-bar blues."
            textRu: "Пока Black Sabbath не начали писать свои песни, они были блюзовой группой и играли двенадцатитактовый блюз."
            source:
              title: "Tony Iommi official site: Biography, chapter 1 (Hugh Gilmour)"
              url: "https://www.iommi.com/biography/"
              quote: "But the blues were the foundations for Black Sabbath, long before they began to write their first original songs, such as ‘Wicked World’, and their epic title song, ‘Black Sabbath’. “We were playing 12-bar blues,” is Iommi’s assertion."
          - type: "critics"
            dimensions: ["sound", "image"]
            text: "Hendrix, Cream and Led Zeppelin had already moved into darker, denser terrain; Sabbath made heavy a way of life."
            textRu: "Хендрикс, Cream и Led Zeppelin уже сдвигались к более тёмному и плотному звуку; Black Sabbath сделали тяжесть образом жизни."
