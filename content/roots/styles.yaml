            text: "Depeche Mode were post-punk pop performers who pioneered computer-assisted music; their shows combined post-punk performance ideas, in which improvisation does not matter, with pop imagery."
            textRu: "Depeche Mode — постпанковые поп-исполнители, проложившие путь музыке на компьютерах; их концерты соединяли сценические идеи постпанка, где импровизация не важна, с поп-образностью."
