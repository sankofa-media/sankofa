        howRu: "Арт-рок вырос из поворота самих бит-групп к эксперименту после 1965 года: студийные открытия The Beatles, психоделический поп и фидбэк The Yardbirds, психоделические синглы раннего Pink Floyd превратили бит-песню в произведение длиной в альбом, построенное на звуке."
        carries: []
        dimensions: ["sound", "harmony-form", "performance"]
        evidence:
          - type: "critics"
            dimensions: ["sound", "harmony-form"]
