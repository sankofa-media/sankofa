          - type: "critics"
            dimensions: ["melody-vocal", "rhythm"]
            text: "The Beatles’ sound was a synthesis of fifties rock and roll, tight pop harmonies and a Motown-inspired groove; Little Richard and Chuck Berry head the list of their influences."
            textRu: "Звук The Beatles был сплавом рок-н-ролла пятидесятых, плотного поп-многоголосия и грува в духе Motown; среди тех, кто на них повлиял, первыми названы Литл Ричард и Чак Берри."
            source:
              title: "Rock & Roll Hall of Fame: The Beatles"
              url: "https://rockhall.com/inductees/beatles/"
              quote: "Presenting irresistible tunes via a revolutionary synthesis of ‘50s rock & roll, tight pop harmonies, a Motown-inspired groove, and a taste for risk, the four lads from Liverpool changed everything."
          - type: "analysis"
            dimensions: ["melody-vocal"]
            text: "Lennon is said to have been shaped more by Chuck Berry and McCartney by Little Richard, and each sang lead on those covers."
