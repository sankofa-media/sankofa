      - to: "style:free-jazz"
        kind: "style"
        scope: "career"
        how: "Part of krautrock came straight from West German free jazz: Guru Guru, led by the drummer Mani Neumeier, fused acid rock with free jazz, and Can’s drummer Jaki Liebezeit and Neumeier had both played the free jazz of Manfred Schoof and Peter Brötzmann. From it came collective, free improvisation. But krautrock put back what free jazz had given up — a fixed, repeated pulse: Liebezeit left free jazz because it allowed nothing rhythmically structured."
        howRu: "Часть краутрока вышла прямо из западногерманского фри-джаза: Guru Guru во главе с барабанщиком Мани Ноймайером сплавили эйсид-рок с фри-джазом, а барабанщик Can Яки Либецайт и сам Ноймайер прежде играли фри-джаз Манфреда Шоофа и Петера Брётцмана. Оттуда пришла коллективная свободная импровизация. Но краутрок вернул то, от чего фри-джаз отказался, — постоянный, повторяющийся пульс: Либецайт ушёл из фри-джаза как раз потому, что там нельзя было играть ничего ритмически упорядоченного."
        carries: ["improvisation"]
        dimensions: ["performance", "rhythm", "sound"]
        evidence:
          - type: "critics"
            dimensions: ["performance"]
            text: "Reynolds describes Can’s core as lapsed avant-garde and free jazz musicians who decided rock was where it was at; of the four, it was Liebezeit who came from free jazz."
            textRu: "Ядро Can, по словам Рейнольдса, составили бывшие авангардисты и фри-джазмены, решившие, что настоящее дело теперь — рок; из четверых пришёл из фри-джаза Либецайт."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "CAN's core was a quartet of lapsed avant-garde and free jazz musicians (bassist Holger Czukay, guitarist Michael Karoli, keyboardist Irmin Schmidt and drummer Jaki Leibezeit) who--blown away by the VU and the Beatles' \"I Am The Walrus\"-- decided rock was where it was at."
          - type: "critics"
            dimensions: ["performance"]
            text: "Before Can, Liebezeit drummed in the Manfred Schoof Quintet, a pioneering European free jazz group, and on Globe Unity (1966) with Peter Brötzmann and Mani Neumeier, who later formed Guru Guru."
            textRu: "До Can Либецайт играл в квинтете Манфреда Шоофа, одном из первых европейских фри-джазовых составов, и на альбоме «Globe Unity» (1966) вместе с Петером Брётцманом и Мани Ноймайером, который потом основал Guru Guru."
            source:
              title: "The Quietus (Ben Graham): Still Growing — Hans-Joachim Irmler and Jaki Liebezeit interviewed (2015)"
              url: "https://thequietus.com/interviews/hans-joachim-irmler-jaki-liebezeit-interview/"
              quote: "He played with Chet Baker in Barcelona and then joined the Manfred Schoof Quintet, generally regarded as one of the pioneering European free jazz outfits. In 1966 he played on the album Globe Unity which featured Peter Brotzmann on alto saxophone and Liebezeit drumming in the left channel while Mani Neumeier, later to form Guru Guru, drummed in the right."
          - type: "testimony"
            dimensions: ["performance", "rhythm"]
            text: "Liebezeit: he was the first free jazz drummer in Germany, but left because free jazz allowed nothing harmonically or rhythmically structured — and repetition is a basic element of music."
            textRu: "Либецайт: он был первым фри-джазовым барабанщиком в Германии, но ушёл, потому что во фри-джазе нельзя было играть ничего гармонически или ритмически упорядоченного, а повтор — основа музыки."
            source:
              title: "Modern Drummer: Jaki Liebezeit — Hero to a Generation of Thinking Alternative Groovers (2017)"
              url: "https://www.moderndrummer.com/2017/01/jaki-liebezeit-hero-generation-thinking-alternative-groovers/"
              quote: "In the mid-’60s I was the first free jazz drummer in Germany. But I stopped that because, to my mind, I couldn’t develop any further in that genre. In free jazz you just weren’t allowed to play anything that was harmonically or rhythmically structured."
          - type: "testimony"
            dimensions: ["rhythm"]
            text: "Irmin Schmidt did not want a free jazz drummer for Can, and Liebezeit no longer wanted to be one."
            textRu: "Ирмин Шмидт не хотел брать в Can фри-джазового барабанщика — а Либецайт и сам больше не хотел им быть."
            source:
              title: "Louder / Prog (Rob Hughes): ‘We never saw ourselves as a rock group’ — the Prog interview with Can’s Irmin Schmidt (2019)"
              url: "https://www.loudersound.com/features/we-never-saw-ourselves-as-a-rock-group-the-prog-interview-with-cans-irmin-schmidt"
              quote: "I thought, “Shit, I don’t want a free jazz drummer.” And then it turned out that he didn’t want to be one anymore anyway."
          - type: "critics"
            dimensions: ["sound", "performance"]
            text: "Guru Guru, led by Mani Neumeier, fused acid rock, free jazz and avant-garde noise into improvisational chaos."
            textRu: "Guru Guru во главе с Мани Ноймайером сплавили эйсид-рок, фри-джаз и авангардный шум в импровизационный хаос."
            source:
              title: "Classical Music (Steve Wright): Ranked — the 17 greatest krautrock albums of all time (2025)"
              url: "https://www.classical-music.com/features/recordings/best-krautrock-albums"
              quote: "Fusing acid rock, free jazz, and avant-garde noise, Guru Guru—led by powerhouse drummer Mani Neumeier—created a cosmic freak-out that felt both anarchic and visionary. The album’s relentless energy and improvisational chaos"
