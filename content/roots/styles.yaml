              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): British Invasion"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/british-invasion"
              quote: "Among British youth, particularly the art school crowd, it became fashionable to study the blues devotedly, form bands, and strive for the \"purity\" of their black idols"
          - type: "analysis"
            dimensions: ["performance"]
            text: "Merseybeat bands raced to learn the Black American records sailors brought home and claimed those songs on stage."
            textRu: "Группы мерсибита наперегонки разучивали чёрные американские пластинки, которые привозили моряки, и закрепляли эти песни за собой на сцене."
            source:
