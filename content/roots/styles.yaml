              url: "https://www.udiscovermusic.com/stories/songs-that-influenced-the-rolling-stones/"
              quote: "Blues pioneers such as Howlin’ Wolf , John Lee Hooker , Elmore James, Muddy Waters , Chuck Berry , Big Bill Broonzy, and Robert Johnson had a huge impact on the young Rolling Stones , influencing Richards’ guitar licks and Mick Jagger’s vocals and songwriting."
          - type: "critics"
            dimensions: ["sound", "performance"]
            text: "London’s R&B club nights grew around Alexis Korner’s Blues Incorporated, where Brian Jones played Elmore James-style electric slide guitar."
            textRu: "Лондонские ритм-н-блюзовые вечера сложились вокруг Blues Incorporated Алексиса Корнера; там Брайан Джонс играл электрический слайд в манере Элмора Джеймса."
            source:
