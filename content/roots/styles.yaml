  - id: "heavy-metal"
    name: "Heavy metal"
    nameRu: "хеви-метал"
    years: [1968, 1990]
    place: "Birmingham and London, then worldwide"
    placeRu: "Бирмингем и Лондон, затем весь мир"
    traits:
      - {en: "Loud, distorted guitars and long guitar solos", ru: "Громкие перегруженные гитары и длинные гитарные соло"}
      - {en: "Dark, down-tuned riffs as the backbone of the song", ru: "Мрачные риффы в пониженном строе как хребет песни"}
      - {en: "Virtuosity grounded in blues and classical technique", ru: "Виртуозность, выросшая из блюзовой и классической техники"}
