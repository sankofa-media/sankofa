  - id: "krautrock"
    name: "Krautrock"
    nameRu: "краутрок"
    years: [1968, 1977]
    place: "West Germany (Cologne, Düsseldorf, Munich, Berlin, Hamburg)"
    placeRu: "ФРГ (Кёльн, Дюссельдорф, Мюнхен, Берлин, Гамбург)"
    traits:
      - {en: "Long, hypnotic pieces over a steady, repeated pulse: Can's locked grooves, the motorik beat of Neu!", ru: "Долгие гипнотические пьесы на ровном, повторяющемся пульсе: неотступный грув Can, моторик Neu!"}
      - {en: "Collective, unscored improvisation, often edited on tape into finished pieces (‘instant composition’)", ru: "Коллективная импровизация без нот, которую часто потом монтируют на плёнке в готовые вещи («мгновенная композиция»)"}
      - {en: "The electric guitar used as a source of sound and texture rather than riffs, joined by analog electronics", ru: "Электрогитара — источник звука и фактуры, а не риффов, и рядом с ней аналоговая электроника"}
      - {en: "A deliberate turn away from blues-based Anglo-American rock towards music drawn from their own, German experience", ru: "Сознательный отказ от англо-американского рока на блюзовой основе ради музыки, выросшей из собственного, немецкого опыта"}
    sources:
      - title: "Classical Music (Steve Wright): Ranked — the 17 greatest krautrock albums of all time (2025)"
        url: "https://www.classical-music.com/features/recordings/best-krautrock-albums"
        quote: "Emerging in late 1960s and early ’70s West Germany, this experimental genre rejected both American blues-rock and German pop convention. Instead, it carved out something visionary: hypnotic rhythms, improvisation, analog electronics, and cosmic ambition."
      - title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
        url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
        quote: "Expanding on the innovations of Hendrix, Syd Barrett, the VU, etc, the Krautrock bands explored the electric guitar's potential as source of sound-in-itself."
      - title: "KQED (Richie Unterberger): ‘A Good Way to Master the Future’ — an interview with Holger Czukay, 1997"
        url: "https://www.kqed.org/arts/13807595/a-good-way-to-master-the-future-an-interview-with-holger-czukay-1997"
        quote: "We liked to do something without notation. We didn’t want to read music off papers. We really tried to make instant compositions from the very beginning."
      - title: "Modern Drummer: Jaki Liebezeit — Hero to a Generation of Thinking Alternative Groovers (2017)"
        url: "https://www.moderndrummer.com/2017/01/jaki-liebezeit-hero-generation-thinking-alternative-groovers/"
        quote: "Repeating rhythms and grooves over and over again very consciously was a whole new thing at the time"
      - title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
        url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
        quote: "they jammed all day, then edited the juiciest chunks of improv into coherent compositions."
    from:
      - to: "style:art-rock"
        kind: "style"
        scope: "career"
        how: "Krautrock grew out of late-1960s rock: the Velvet Underground’s mesmerising repetition, Hendrix, Syd Barrett’s Pink Floyd and the studio experiments of the later Beatles — not the virtuoso suites of progressive rock. It kept what rock had inherited from rhythm and blues and rock and roll — the amplified electric band of guitar, bass and drums and the steady, driving beat — and stretched repetition into trance. Most of its bands rejected the blues idiom of that rock: blues-based song structures and harmonies, the blues-rock purism of Cream and the Stones, and the effort to sound English or American. Black music came back in another form, as the funk groove Can took from James Brown."
        howRu: "Краутрок вырос из рока конца 1960-х: из завораживающих повторов The Velvet Underground, из Хендрикса, из Pink Floyd времён Сида Барретта и студийных опытов поздних The Beatles — но не из виртуозных сюит прогрессив-рока. Он сохранил то, что рок унаследовал от ритм-н-блюза и рок-н-ролла, — громкую электрическую группу из гитары, баса и барабанов и ровный напористый бит — и растянул повтор до транса. А от блюзового языка этого рока большинство групп отказалось: от блюзовых форм и гармоний, от блюз-рокового пуризма Cream и The Rolling Stones, от желания звучать по-английски или по-американски. Чёрная музыка вернулась в краутрок в другом обличье — фанковым грувом, который Can взяли у Джеймса Брауна."
        carries: []
        dimensions: ["sound", "rhythm", "harmony-form", "performance", "image"]
        evidence:
          - type: "critics"
            dimensions: ["sound"]
            text: "Simon Reynolds hears krautrock’s main inputs in late-1960s rock: the Velvet Underground’s mantras, Hendrix, Syd Barrett’s Pink Floyd, Brian Wilson and the later Beatles."
            textRu: "Саймон Рейнольдс слышит главные истоки краутрока в роке конца 1960-х: в «мантрах» The Velvet Underground, у Хендрикса, у Pink Floyd времён Сида Барретта, у Брайана Уилсона и поздних The Beatles."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "Krautrock's primary inputs, and urgency, came from late '60s rock: Velvet Underground's mesmerising mantras, Hendrix's pyrotechnique, Syd Barrett-era Pink Floyd's chromatic chaos, plus dashes of West Coast folkadelic rock and the studio-centric experiments of Brian Wilson and the later Beatles."
          - type: "critics"
            dimensions: ["harmony-form"]
            text: "Reynolds is just as clear about what the German bands left out: the blues purism of Cream and the Rolling Stones."
            textRu: "Столь же ясно Рейнольдс говорит и о том, что немецкие группы оставили в стороне: блюзовый пуризм Cream и The Rolling Stones."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "Equally significant is what they didn't draw on, namely the blues-bore purism sired by Cream and the Stones."
          - type: "critics"
            dimensions: ["rhythm", "sound"]
            text: "Turning the guitar into a source of pure sound, the krautrock bands still kept the rhythmic thrust of rock and roll."
            textRu: "Превратив гитару в источник чистого звука, краутрок-группы всё же сохранили ритмический напор рок-н-ролла."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "the Krauts anticipated the soundpainting and texturology of today's post-rock, while still retaining the rhythmic thrust of rock'n'roll."
          - type: "critics"
            dimensions: ["rhythm"]
            text: "Reynolds hears krautrock bring out an idea latent in rock from Bo Diddley on: that its rhythmic essence, what set it apart from jazz, was a machine-like compulsion."
            textRu: "Рейнольдс слышит, как краутрок вывел на свет мысль, скрытую в роке начиная с Бо Диддли: ритмическая суть рока, то, что отличало его от джаза, — это почти машинная одержимость."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "Krautrock brought into focus an idea latent in rock, from Bo Diddley to the Stooges to the Modern Lovers: that the rhythmic essence of rock music, what made it different from jazz, was a kind of machinic compulsion."
          - type: "critics"
            dimensions: ["rhythm"]
            text: "Black music also came back into krautrock through funk: in Reynolds’s account, James Brown’s influence led Can to fuse atmosphere and groove."
            textRu: "Чёрная музыка вернулась в краутрок и через фанк: по Рейнольдсу, под влиянием Джеймса Брауна Can стали сплавлять атмосферу и грув."
            source:
              title: "Simon Reynolds: Krautrock (Melody Maker, July 1996), author’s archive"
              url: "https://reynoldsretro.blogspot.com/2013/03/krautrock-melody-maker-july-1996-by.html"
              quote: "As the influence of James Brownian motion kicked in, Can began to fuse 'head' and 'booty', atmosphere and groove, like nobody else save Miles Davis."
          - type: "testimony"
            dimensions: ["sound", "performance"]
            text: "Holger Czukay names the Beatles and above all the Velvet Underground as Can’s main rock influences; they encouraged the band to play rock rather than academic avant-garde music."
            textRu: "Хольгер Шукай называет главными рок-влияниями Can группу The Beatles и прежде всего The Velvet Underground: именно они убедили музыкантов играть рок, а не академический авангард."
            source:
              title: "KQED (Richie Unterberger): ‘A Good Way to Master the Future’ — an interview with Holger Czukay, 1997"
              url: "https://www.kqed.org/arts/13807595/a-good-way-to-master-the-future-an-interview-with-holger-czukay-1997"
              quote: "The influence, for me, of Beatles and Velvet Underground was most important. The Velvet Underground especially."
          - type: "testimony"
            dimensions: ["performance"]
            text: "Czukay: that feeling encouraged them to go on with rock music instead of academic avant-garde music."
            textRu: "Шукай: это чувство придало им смелости заниматься роком, а не академическим авангардом."
            source:
              title: "KQED (Richie Unterberger): ‘A Good Way to Master the Future’ — an interview with Holger Czukay, 1997"
              url: "https://www.kqed.org/arts/13807595/a-good-way-to-master-the-future-an-interview-with-holger-czukay-1997"
              quote: "This feeling made us encouraged to go on with rock music in general, instead of making avant-garde academic music."
          - type: "listening"
            dimensions: ["sound"]
            text: "Michael Rother grew up on the British beat groups, then on Cream and Jimi Hendrix, whom he once wanted to copy."
            textRu: "Михаэль Ротер вырос на британских бит-группах, а потом на Cream и Джими Хендриксе, которого одно время хотел копировать."
            source:
              title: "Red Bull Music Academy: Michael Rother lecture (Tokyo, 2014)"
              url: "https://www.redbullmusicacademy.com/lectures/michael-rother-tokyo-2014"
              quote: "Later on, of course, also bands like Cream and Jimi Hendrix, whom I still love, I can say. I mean, I don’t want to be Jimi Hendrix, I wanted to be a copy of Jimi Hendrix for a while when I was a teenager"
          - type: "testimony"
            dimensions: ["harmony-form"]
            text: "Rother’s main idea was to steer away from Anglo-American musical structures based on the blues."
            textRu: "Главной мыслью Ротера было уйти от англо-американских музыкальных структур, построенных на блюзе."
            source:
              title: "Red Bull Music Academy: Michael Rother lecture (Tokyo, 2014)"
              url: "https://www.redbullmusicacademy.com/lectures/michael-rother-tokyo-2014"
              quote: "different from Anglo-American musical structures that are mostly, or were mostly, based on the blues. That was one of the main ideas I had. I wanted to steer away from that."
          - type: "critics"
            dimensions: ["harmony-form"]
            text: "Clash describes Rother’s explicit rejection of the blues harmonies and structures that dominated pop and rock."
            textRu: "Clash пишет о том, как открыто Ротер отказался от блюзовых гармоний и структур, господствовавших тогда в поп- и рок-музыке."
            source:
              title: "Clash: Fortunes Of Krautrock — An Interview With Michael Rother (2020)"
