              title: "Rolling Stone: Heavy Metal, Year One — the inside story of Black Sabbath’s debut (Kory Grow, 2020)"
              url: "https://au.rollingstone.com/music/music-features/black-sabbath-debut-album-heavy-metal-origin-interview-7306/"
              quote: "Artists like Jimi Hendrix, Cream, and Led Zeppelin had spent the late Sixties edging into darker, denser terrain, but it was Black Sabbath who made heavy a way of life."
          - type: "testimony"
            dimensions: ["sound", "performance"]
            text: "Iommi grew up on the sixties British blues boom, above all Clapton with John Mayall, and listened to all kinds of blues records."
            textRu: "Айомми вырос на британском блюзовом буме шестидесятых — прежде всего на Клэптоне у Джона Мейолла — и слушал самые разные блюзовые пластинки."
            source:
              title: "Guitar World: Tony Iommi interview outtake (2008)"
              url: "https://www.guitarworld.com/magazine/tony-iommi-talks-dio-van-halen-judas-priest-and-more-outtake-2008-guitar-world-interview"
              quote: "I liked the work that Clapton did later with Cream, but I really liked what he was playing with John Mayall."
          - type: "critics"
            dimensions: ["sound", "harmony-form"]
            text: "Led Zeppelin’s blend of blues, soul and modal riffs paved the way for heavy metal."
            textRu: "Сплав блюза, соула и модальных риффов Led Zeppelin проложил дорогу хеви-металу."
            source:
              title: "Rock & Roll Hall of Fame: Led Zeppelin"
              url: "https://rockhall.com/inductees/led-zeppelin/"
              quote: "Led Zeppelin’s unique blend of blues, Celtic folk, soul, and modal riffs expanded the template of rock, paving the way for heavy metal, prog, and concerts as theatrical stadium events."
          - type: "analysis"
            dimensions: ["performance"]
            text: "Metal guitar heroes had to master the blues as well as classical music."
            textRu: "Гитарному герою метала полагалось владеть и блюзом, и классикой."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): Heavy Metal (Colby Vargas)"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/heavy-metal"
