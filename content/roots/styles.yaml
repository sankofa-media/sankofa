              url: "https://artsandculture.google.com/story/the-beatles-and-black-music-the-beatles-story/3QVhEdhba2lOBg?hl=en"
              quote: "In terms of the influence of Black rock ‘n’ roll stars (as opposed to soul stars), it’s often been said that John Lennon was more influenced by Chuck Berry, whereas Paul McCartney was practically obsessed with Little Richard."
          - type: "analysis"
            dimensions: ["image"]
            text: "British youth looked up to American rock and roll as wilder and freer than their own culture."
            textRu: "Британская молодёжь смотрела на американский рок-н-ролл снизу вверх: он казался ей куда более диким и свободным, чем родная культура."
            source:
              title: "St. James Encyclopedia of Popular Culture (via Encyclopedia.com): British Invasion"
              url: "https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/british-invasion"
              quote: "They had an inferiority complex towards American rock 'n' roll and American youth, which they perceived as more wild and carefree."
        scope: "career"
