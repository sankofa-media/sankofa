story: "Big Mama Thornton named Bessie Smith among her models and was billed as the “New Bessie Smith”. She sang rhythm and blues in a robust, moaning voice, played drums and harmonica herself, and challenged gender norms."
storyRu: "Биг Мама Торнтон называла Бесси Смит среди своих образцов, и её объявляли «новой Бесси Смит». Она пела ритм-н-блюз мощным, стонущим голосом, сама играла на барабанах и губной гармонике и бросала вызов гендерным нормам."
