story: "Big Mama Thornton named Bessie Smith among her models and was billed as the “New Bessie Smith”. She sang gutsy rhythm and blues in a guttural, moaning, growling voice, played drums and harmonica herself, and defied gender norms with a masculine wardrobe."
storyRu: "Биг Мама Торнтон называла Бесси Смит среди своих образцов, и её объявляли «новой Бесси Смит». Она пела напористый ритм-н-блюз гортанным, стонущим, рычащим голосом, сама играла на барабанах и губной гармонике и бросала вызов гендерным нормам мужским гардеробом."
