story: "Ray Charles built soul by putting gospel-powered vocals, the moan and fervour of the church, into rhythm and blues. His R&B rested on a tight horn-driven band, passionate piano and tireless showmanship. Underneath lay jazz: he began as a jazz and blues pianist in the manner of Nat King Cole and Charles Brown, admired Art Tatum and played with time like a jazzman."
storyRu: "Рэй Чарльз построил соул, вложив в ритм-н-блюз вокал на госпеловой тяге — церковный стон и церковный жар. Его ритм-н-блюз держался на плотном духовом бэнде, страстном фортепиано и неутомимом шоу. А в основании лежал джаз: начинал он джазовым и блюзовым пианистом в манере Ната Кинга Коула и Чарльза Брауна, восхищался Артом Тейтумом и обращался со временем как джазмен."
