story: "Amy Winehouse said she learned to sing from Dinah Washington: from her she took a smoky timbre, blues-drenched phrasing and the habit of making a song her own. She sang as a jazz singer, scatting on record and changing melodies night after night on stage, and on Back to Black turned this voice towards R&B and the girl groups of the 1960s."
