story: "Lou Reed's guitar and songs had two sources: the R&B, doo-wop and rockabilly of 1950s radio, with Steve Cropper's and James Burton's ensemble guitar parts, and the free jazz of Ornette Coleman and Cecil Taylor, whose energy he chased through feedback and long improvised solos."
storyRu: "У гитары и песен Лу Рида было два истока: ритм-н-блюз, ду-воп и рокабилли радио 1950-х с ансамблевыми гитарными партиями Стива Кроппера и Джеймса Бёртона — и фри-джаз Орнетта Коулмана и Сесила Тейлора, чью энергию он искал в фидбэке и долгих импровизированных соло."
