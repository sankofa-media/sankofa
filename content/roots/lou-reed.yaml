    carries: ["improvisation"]
    how: 'Free-jazz improvisation carried to rock guitar: Reed said his guitar solo in “European Son” channelled “Ornette Coleman on the guitar”, though by his own account he could not play like Coleman.'
    howRu: 'Фри-джазовая импровизация, перенесённая на рок-гитару: по словам Рида, в его гитарном соло в «European Son» звучал «Орнетт Коулман на гитаре», хотя сам он признавал, что играть как Коулман не умел.'
  - to: "root:marvin-gaye"
    kind: "interpolation"
    what: "“There She Goes Again”: the opening guitar figure replays the rhythmic pattern of the intro of Marvin Gaye’s “Hitch Hike”; no recording is reused."
    whatRu: "«There She Goes Again»: вступительная гитарная фигура повторяет ритмический рисунок вступления «Hitch Hike» Марвина Гэя; сама запись не используется."
    claim: "Lou Reed opened his song “There She Goes Again” with the intro of Marvin Gaye’s Motown single “Hitch Hike”."
    claimRu: "Лу Рид начал свою песню «There She Goes Again» со вступления мотауновского сингла Марвина Гэя «Hitch Hike»."
    sources:
      - title: "Aidan Levy: The Velvet Underground & Nico — Library of Congress"
        url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Velvet-Underground-and-Nico_Levy.pdf"
      - title: "Far Out: “There She Goes Again” — the Lou Reed song inspired by Marvin Gaye"
        url: "https://faroutmagazine.co.uk/lou-reed-song-inspired-by-marvin-gaye/"
    carries: ["riff"]
    how: "An R&B riff moved to rock guitar: Reed set the rhythmic figure that opens “Hitch Hike” at the head of his own song."
    howRu: "Ритм-н-блюзовый рифф, переложенный на рок-гитару: Рид поставил ритмическую фигуру из начала «Hitch Hike» в начало собственной песни."
