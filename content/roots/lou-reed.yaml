  - to: root:ornette-coleman
    kind: influence
    how: "Reed carried the energy of Ornette Coleman's free jazz into rock guitar: long improvised solos, noise and feedback in place of blues licks, without the jazz players' technique."
    howRu: "Рид перенёс энергию фри-джаза Орнетта Коулмана в рок-гитару: долгие импровизированные соло, шум и фидбэк вместо блюзовых ходов — без джазовой техники."
    carries: ["improvisation"]
    dimensions: ["performance", "sound"]
    evidence:
      - type: "testimony"
        dimensions: ["performance"]
        text: "Reed says he listened to Cecil Taylor and Ornette Coleman and, lacking their technique, brought their energy instead."
        textRu: "Рид рассказывает, что слушал Сесила Тейлора и Орнетта Коулмана и, не владея их техникой, взял у них энергию."
        source:
          title: "Alan di Perna: Lou Reed interview, Guitar World (1998)"
          url: "https://www.guitarworld.com/magazine/lou-reed-talks-about-velvet-underground-songwriting-and-gear-1998-guitar-world-interview"
          quote: "I’d been listening to [avant garde jazz artists] Cecil Taylor and Ornette Coleman. Of course I was not trained to play like them. I couldn’t read and write music. I couldn’t even begin to think of having technique like that. But I certainly had the energy—and a good ear."
      - type: "testimony"
        dimensions: ["performance"]
        text: "Reed recalls following Coleman around the Village and says his guitar on “European Son” channeled Coleman."
        textRu: "Рид вспоминает, как ходил за Коулманом по клубам Гринвич-Виллидж, и говорит, что его гитара в «European Son» шла от Коулмана."
        source:
          title: "Aidan Levy: The Velvet Underground & Nico, National Recording Registry essay, Library of Congress"
          url: "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/Velvet-Underground-and-Nico_Levy.pdf"
          quote: "I used to run around the Village following Ornette Coleman wherever he played.” That R&B influence would manifest in songs like “There She Goes Again,” with the intro sampling Marvin Gaye’s “Hitch Hike.” “European Son,” Reed said, channeled “Ornette Coleman on the guitar.”"
      - type: "critics"
        dimensions: ["sound"]
        text: "Far Out describes Reed hearing the future of music in the sheer noise of Coleman's playing that put others off."
        textRu: "Far Out пишет, что в шуме Коулмана, отпугивавшем других, Рид услышал будущее музыки."
        source:
          title: "Far Out: Ornette Coleman — Lou Reed’s greatest influence"
          url: "https://faroutmagazine.co.uk/ornette-coleman-lou-reeds-greatest-influence/"
          quote: "Whereas most were hearing raw noise being blasted in their ears for minutes on end, Reed heard the future of music."
    scope: "career"
