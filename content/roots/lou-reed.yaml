    how: "Reed grew up on R&B and doo-wop radio: vocal-group harmony and the ensemble guitar parts of R&B session players like Steve Cropper became the basis of his song-centred, part-based playing."
    howRu: "Рид вырос на ритм-н-блюзе и ду-вопе по радио: гармония вокальных групп и ансамблевые гитарные партии ритм-н-блюзовых сессионщиков вроде Стива Кроппера стали основой его игры, построенной на партиях, а не на соло."
