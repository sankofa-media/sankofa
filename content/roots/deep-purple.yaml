story: "Deep Purple pushed hard rock towards metal with breakneck riffs at overwhelming volume, Jon Lord’s overdriven Hammond duelling with Ritchie Blackmore’s guitar, orchestral ideas and long improvised jams. In the line-ups with Ian Gillan the band’s voice came from a singer who learned rock and roll by copying Elvis Presley."
storyRu: "Deep Purple подтолкнули хард-рок к металу: стремительные риффы на оглушительной громкости, перегруженный «Хаммонд» Джона Лорда в дуэли с гитарой Ричи Блэкмора, оркестровые идеи и долгие импровизированные джемы. В составах с Иэном Гилланом голосом группы стал певец, учившийся рок-н-роллу, подражая Элвису Пресли."
