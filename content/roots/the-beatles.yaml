  - to: "style:british-beat"
    kind: "style"
    scope: "career"
    how: "The Beatles built British beat: a guitar-bass-drums group playing Chuck Berry-style rock and roll, with a vocal style joining the hard rock-and-roll shout to the gospel call and response of American vocal groups, and a Motown-inspired groove."
    howRu: "The Beatles создали британский бит: группа из гитар, баса и барабанов играет рок-н-ролл в духе Чака Берри, вокал соединяет жёсткий рок-н-ролльный крик с госпельной перекличкой американских вокальных групп, а грув взят у Motown."
    carries: ["call-and-response"]
    dimensions: ["melody-vocal", "harmony-form", "rhythm"]
    evidence:
      - type: "critics"
        dimensions: ["melody-vocal"]
        text: "Charlie Gillett, quoted by Price, derives the group's vocal style from two American styles: the hard rock and roll of Little Richard and the soft gospel call and response of the Shirelles and the Drifters."
        textRu: "Чарли Гиллетт, которого цитирует Прайс, выводит вокальную манеру группы из двух американских стилей: жёсткого рок-н-ролла Литл Ричарда и мягкой госпельной переклички The Shirelles и The Drifters."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997), quoting Charlie Gillett"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "The group's vocal style was a derivative of two American styles. . . the hard rock and roll style of singers like Little Richard and Larry Williams and the soft gospel call-and-response style of the Shirelles, the Drifters, and the rest of the singers"
      - type: "analysis"
        dimensions: []
        text: "Price places the Beatles' early repertory within the shared practice of the Mersey beat groups of Liverpool."
        textRu: "Ранний репертуар The Beatles Прайс вписывает в общую практику мерсибит-групп Ливерпуля."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997)"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "Several of Chuck Berry's songs were part of the Beatles' early repertory, as they were for most Mersey beat groups from Liverpool."
      - type: "critics"
        dimensions: ["rhythm", "harmony-form"]
        text: "The Rock & Roll Hall of Fame describes the Beatles' sound as a synthesis of fifties rock and roll, tight pop harmonies and a Motown-inspired groove."
        textRu: "Зал славы рок-н-ролла описывает звучание The Beatles как синтез рок-н-ролла пятидесятых, плотных поп-гармоний и грува, вдохновлённого Motown."
        source:
          title: "Rock & Roll Hall of Fame: The Beatles"
          url: "https://www.rockhall.com/inductees/beatles"
          quote: "Presenting irresistible tunes via a revolutionary synthesis of ‘50s rock & roll, tight pop harmonies, a Motown-inspired groove, and a taste for risk"
story: "The Beatles' singing grew out of Little Richard's screaming, gospel-charged rock and roll, which McCartney made his own. Chuck Berry gave them riff-built electric guitar and an energized stage manner, and Lennon a model of songwriting. From these they made British beat, joining the rock-and-roll shout to gospel call and response and a Motown groove."
storyRu: "Пение The Beatles выросло из кричащего, напитанного госпелом рок-н-ролла Литл Ричарда — у Маккартни эта манера стала собственной. Чак Берри дал им электрогитару, построенную на риффах, и энергичную сценическую подачу, а Леннону — образец того, как писать песни. Из этого они сложили британский бит, где рок-н-ролльный крик встречается с госпельной перекличкой и грувом Motown."
