  - to: "root:little-richard"
    kind: "influence"
    scope: "career"
    how: "From Little Richard the Beatles took the hard rock-and-roll vocal: a screaming, gospel-charged delivery that McCartney made his own, and the uninhibited stage routine of their early years."
    howRu: "У Литл Ричарда The Beatles взяли жёсткий рок-н-ролльный вокал — крик с госпельным накалом, ставший собственной манерой Маккартни, — и раскованную повадку на сцене в ранние годы."
    carries: ["gospel-vocal"]
    dimensions: ["melody-vocal", "performance", "rhythm"]
    evidence:
      - type: "analysis"
        dimensions: ["melody-vocal", "rhythm", "performance"]
        text: "Musicologist Charles Gower Price calls Little Richard a formative influence: a frenzied gospel singing style over a raucous boogie beat, and the model for the Beatles' early performance routine."
        textRu: "Музыковед Чарльз Гауэр Прайс называет Литл Ричарда одним из тех, кто сформировал группу: исступлённую госпельную манеру пения поверх буйного ритма буги — образец для ранних выступлений The Beatles."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997)"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "Another formative influence on the Beatles was \"Little Richard\" Penniman, the dynamic African American singer and pianist from Macon, Georgia, who had adapted a frenzied gospel singing style to a raucous boogie beat … It is difficult to overestimate Little Richard's influence on the Beatles, particularly their early performance routine."
      - type: "analysis"
        dimensions: ["melody-vocal"]
        text: "Price hears McCartney's singing on “Helter Skelter” as a classic example of Little Richard's screaming vocal style."
        textRu: "В пении Маккартни в «Helter Skelter» Прайс слышит классический образец кричащей вокальной манеры Литл Ричарда."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997)"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "McCartney's singing on \"Helter Skelter\" is a classic example of Little Richard's screaming vocal style."
      - type: "critics"
        dimensions: ["melody-vocal", "performance"]
        text: "The Rock & Roll Hall of Fame essay says that for McCartney rock and roll meant first of all Little Richard and his rollicking, uninhibited approach."
        textRu: "В эссе Зала славы рок-н-ролла сказано, что для Маккартни рок-н-ролл означал прежде всего Литл Ричарда с его разудалой, раскованной манерой."
        source:
          title: "Rock & Roll Hall of Fame: The Beatles, 1988 induction essay"
          url: "https://rockhall25.wpenginepowered.com/wp-content/uploads/2025/09/essay-beatles-1.pdf"
          quote: "For McCartney rock and roll meant, on the one hand, Little Richard and his rollicking, uninhibited approach."
      - type: "listening"
        dimensions: []
        text: "The Beatles Story museum in Liverpool notes that McCartney was practically obsessed with Little Richard and sang lead on the group's Little Richard numbers."
        textRu: "Ливерпульский музей The Beatles Story пишет, что Маккартни был буквально одержим Литл Ричардом и был ведущим вокалистом в песнях Литл Ричарда из репертуара группы."
        source:
          title: "The Beatles Story (Google Arts & Culture): The Beatles and Black Music"
          url: "https://artsandculture.google.com/story/the-beatles-and-black-music-the-beatles-story/3QVhEdhba2lOBg?hl=en"
          quote: "Paul McCartney was practically obsessed with Little Richard."
  - to: "root:chuck-berry"
    kind: "influence"
    scope: "career"
    how: "From Chuck Berry the Beatles took the electric-guitar rock and roll of riff-built solos and driving rhythm parts, together with his energized stage presence; Lennon counted him the model songwriter."
    howRu: "У Чака Берри The Beatles взяли электрогитарный рок-н-ролл — соло на риффах и напористые ритм-партии — и его заряженную энергией сценическую подачу; Леннон считал Берри образцовым автором песен."
    carries: ["riff"]
    dimensions: ["sound", "performance", "harmony-form"]
    evidence:
      - type: "testimony"
        dimensions: ["harmony-form"]
        text: "Lennon called Berry a rock poet ahead of his time, in the tradition of the great blues artists but writing his own songs, and said: “We all owe him a lot.”"
        textRu: "Леннон называл Берри рок-поэтом, опередившим своё время: он продолжал традицию великих блюзменов, но писал собственные песни. «Мы все ему многим обязаны», — говорил Леннон."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997), quoting John Lennon"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "Chuck Berry is one of the all-time great poets, a rock poet you could call him. He was well advanced of his time lyric-wise. We all owe him a lot, including Dylan. I've loved everything he's ever done. He was in a different class from the other performers, he was in the tradition of the great blues artists but he really wrote his own stuff"
      - type: "analysis"
        dimensions: ["sound"]
        text: "Price locates Berry's contribution not in his vocal delivery but in his distinctive solo and rhythm guitar work and his youth-directed lyrics."
        textRu: "Вклад Берри Прайс видит не в манере пения, а в самобытной игре на гитаре — сольной и ритмической — и в текстах, обращённых к молодёжи."
        source:
          title: "Charles Gower Price: Sources of American Styles in the Music of the Beatles (American Music 15/2, 1997)"
          url: "https://static1.1.sqspcdn.com/static/f/221758/1911861/1221287203007/beatlessourcesGower.pdf"
          quote: "Berry's main contribution to rock and roll was not his vocal delivery, which could easily have been mistaken for a country or pop singer, but his distinctive solo and rhythm guitar work and the straightforward, youth-directed lyrics of his songs."
      - type: "critics"
        dimensions: ["sound", "performance"]
        text: "The Encyclopedia of African-American Culture and History names the Beatles among the rock performers who emulated both Berry's guitar style and his highly energized stage presence."
        textRu: "«Энциклопедия афроамериканской культуры и истории» называет The Beatles среди рок-музыкантов, перенявших у Берри и гитарную манеру, и его предельно энергичную сценическую подачу."
        source:
          title: "David Henderson, Encyclopedia of African-American Culture and History: Chuck Berry (via Encyclopedia.com)"
          url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/chuck-berry"
          quote: "He had a tremendous influence on rock performers who came after him, including Buddy Holly, the Beatles, the Beach Boys, and the Rolling Stones, who emulated both his guitar style and his highly energized stage presence."
      - type: "critics"
        dimensions: ["sound"]
        text: "Contemporary Musicians lists the Beatles among those who admit to having emulated Berry's complex guitar riffs in their early days."
        textRu: "Справочник Contemporary Musicians относит The Beatles к тем, кто признавал, что в ранние годы подражал сложным гитарным риффам Берри."
        source:
          title: "Michael P. Belfiore, Contemporary Musicians: Chuck Berry (via Encyclopedia.com)"
          url: "https://www.encyclopedia.com/people/literature-and-arts/music-popular-and-jazz-biographies/chuck-berry"
          quote: "Among those who admit to having emulated his complex guitar riffs and quick, witty lyrics in their early days are some of the most prominent bands and artists of the past 50 years— including the Beatles, the Rolling Stones, Bob Dylan, and Bruce Springsteen."
      - type: "critics"
        dimensions: ["sound", "performance"]
        text: "The Rock & Roll Hall of Fame credits Berry's technical prowess and showmanship with inspiring the Beatles."
        textRu: "Зал славы рок-н-ролла пишет, что техника и артистизм Берри вдохновили The Beatles."
        source:
          title: "Rock & Roll Hall of Fame: Chuck Berry"
          url: "https://www.rockhall.com/inductees/chuck-berry"
          quote: "his technical prowess and showmanship inspiring the Beatles, the Rolling Stones, Jimi Hendrix, and countless more."
    example:
      song: "“I Saw Her Standing There” (1963)"
      text: "McCartney said he played exactly the notes of the bass line of Berry's “I'm Talking About You” under this song."
      textRu: "Маккартни рассказывал, что сыграл в этой песне нота в ноту басовую партию из «I'm Talking About You» Берри."
      source:
