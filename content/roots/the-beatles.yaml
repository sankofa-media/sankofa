story: "The Beatles learned to play for an audience with songs by Little Richard and Chuck Berry. Their recording of “Twist and Shout” also followed the Isley Brothers’ R&B hit."
storyRu: "The Beatles учились играть перед публикой на песнях Литл Ричарда и Чака Берри. Записав «Twist and Shout», они также обратились к песне, которую The Isley Brothers сделали хитом ритм-н-блюза."
