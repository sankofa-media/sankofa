        text: "Aidan Levy's Library of Congress essay names Bowie among the listeners of the first Velvet Underground album who started a band, the album being a basis of many stars' sounds and styles."
        textRu: "Эссе Эйдана Леви для Библиотеки Конгресса называет Боуи среди слушателей первого альбома The Velvet Underground, создавших свои группы: на этой пластинке выросли звук и стиль многих звёзд."
        source:
          title: "Library of Congress, National Recording Registry (Aidan Levy): “The Velvet Underground & Nico”"
