  - to: "root:the-velvet-underground"
    kind: "influence"
    how: "From the Velvet Underground Bowie took rock fused with the avant-garde: cacophony used as background noise and ambience, and Lou Reed's lyrics drawn from the urban literature of the street."
    howRu: "У The Velvet Underground Боуи взял рок, сплавленный с авангардом: какофонию как фоновый шум и атмосферу и тексты Лу Рида, выросшие из городской литературы улицы."
    carries: []
    dimensions: ["sound", "image"]
    evidence:
      - type: "listening"
        dimensions: ["sound"]
        text: "Recalling the first Velvet Underground album, Bowie singles out its use of cacophony to create an ambience unknown in rock."
        textRu: "Вспоминая первый альбом The Velvet Underground, Боуи выделяет в нём какофонию, создающую неслыханную в роке атмосферу."
        source:
          title: "Far Out: David Bowie remembers the first Velvet Underground album he ever received (PBS interview)"
          url: "https://faroutmagazine.co.uk/david-bowie-first-velvet-underground-album/"
          quote: "One of them was the use of cacophony as background noise and to create an ambience that had been unknown in rock"
      - type: "testimony"
        dimensions: ["image"]
        text: "In the same interview Bowie links Reed's lyric writing to Hubert Selby Jr's Last Exit to Brooklyn."
        textRu: "В том же интервью Боуи связывает тексты Рида с романом Хьюберта Селби-младшего «Последний поворот на Бруклин»."
        source:
          title: "Far Out: David Bowie remembers the first Velvet Underground album he ever received (PBS interview)"
          url: "https://faroutmagazine.co.uk/david-bowie-first-velvet-underground-album/"
          quote: "the nature of his lyric writing which for me just smacked of things like Hubert Selby Jr, The Last Exit from Brooklyn"
      - type: "critics"
