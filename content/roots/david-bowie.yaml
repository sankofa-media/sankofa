story: "David Bowie's rock began with Little Richard: the boy took up the saxophone to play in his horn-heavy band. The Velvet Underground gave him rock built on noise and ambience and lyrics out of urban novels, and in 1975 he went to Philadelphia soul for what he called plastic soul."
storyRu: "Рок Дэвида Боуи начался с Литл Ричарда: мальчишкой он взялся за саксофон, чтобы играть в его группе с целой секцией духовых. The Velvet Underground дали ему рок, построенный на шуме и атмосфере, и тексты, будто из городских романов, а в 1975 году он обратился к филадельфийскому соулу ради того, что сам назвал «пластмассовым соулом»."
