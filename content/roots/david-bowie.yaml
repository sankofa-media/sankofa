  - to: "style:soul"
    kind: "style"
    how: "On Young Americans Bowie turned to the Philadelphia soul then filling the charts, singing what he himself called plastic soul — the squashed remains of Black music sung by a white Englishman."
    howRu: "На «Young Americans» Боуи обратился к филадельфийскому соулу, заполнявшему тогда чарты, и пел то, что сам называл «пластмассовым соулом», — расплющенные остатки чёрной музыки в исполнении белого англичанина."
    carries: []
