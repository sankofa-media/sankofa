        text: "Chris Wheatley stresses the band's fusion of rock with the avant-garde and how deeply it resonated with Bowie."
        textRu: "Крис Уитли подчёркивает, как группа сплавила рок с авангардом и как глубоко это отозвалось в Боуи."
        source:
          title: "CultureSonar (Chris Wheatley): 10 Artists Who Influenced David Bowie (2021)"
          url: "https://www.culturesonar.com/10-artists-who-influenced-david-bowie/"
          quote: "Their music certainly resonated deeply with Bowie, who would eventually work closely with Velvet frontman Lou Reed"
      - type: "analysis"
