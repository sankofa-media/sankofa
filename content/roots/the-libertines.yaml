    how: "The Libertines played indie guitar rock in its garage-revival form: purposefully lo-fi, mostly live-recorded twin guitars mixing poetry and punk rock."
    howRu: "The Libertines играли инди-рок в духе гаражного возрождения: нарочито лоу-фай, две гитары, записанные в основном вживую, смесь поэзии и панк-рока."
    carries: []
    dimensions: ["sound", "performance"]
    evidence:
      - type: "critics"
        dimensions: ["sound", "performance"]
        text: "Guitar.com calls the record mainly live and purposefully lo-fi, rooted in Britain’s punk and indie heritage, and a wake-up call for the 2000s ‘indie renaissance’."
        textRu: "Guitar.com называет пластинку записанной в основном вживую и нарочито лоу-фай, укоренённой в британском панке и инди, — пластинкой, разбудившей «инди-ренессанс» 2000-х."
        source:
          title: "Guitar.com: The Genius Of… Up the Bracket by The Libertines (Andy Price, 2022)"
          url: "https://guitar.com/reviews/album/the-genius-of-up-the-bracket-by-the-libertines/"
          quote: "Recorded mainly live … Purposefully lo-fi, Barât and Doherty's wilfully imprecise approach to guitar masked their true ability. … still sports the essence of Britain's punk and indie heritage."
      - type: "critics"
        dimensions: ["sound"]
        text: "Exclaim! describes a sound equal parts poetry and punk rock that kickstarted a new era of British guitar bands."
        textRu: "Exclaim! описывает звук, наполовину состоящий из поэзии, наполовину из панк-рока, — с него началась новая эпоха британских гитарных групп."
        source:
          title: "Exclaim!: The Libertines (Sarah Murphy, 2015)"
          url: "https://exclaim.ca/Music/article/libertines-boys_in_band"
          quote: "With a sound that was equal parts poetry and punk rock … kickstarted a new era in British rock and paved the way for future generation of guitar-wielding wannabes"
