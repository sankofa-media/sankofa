          quote: "Marrying the blunt fury of The Clash with the poeticism of The Smiths … Barât and Doherty's fuzz-soaked, galloping guitars ran roughshod over Hassall and Powell's solid rhythm section. … There's the Clash-like truculence of the whirlwind title track"
