    how: "Doherty’s formative listening was the Britpop of Pulp, Oasis, Blur and Elastica; the Libertines kept its romance of English rock and literary tradition, Smiths-like chords and two exchanging voices."
    howRu: "Доэрти сформировался на брит-попе Pulp, Oasis, Blur и Elastica; The Libertines сохранили присущую брит-попу романтику английского рока и литературной традиции, аккорды в духе The Smiths и перекличку двух голосов."
