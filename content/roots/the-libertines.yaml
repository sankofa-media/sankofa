story: "Pete Doherty grew up on Pulp, Oasis, Blur and the Smiths, and critics hear the Libertines marrying the blunt fury of the Clash to Britpop’s romance of the English song. Their scrappy, live-recorded twin-guitar rock made Up the Bracket a starting gun for the 2000s indie revival."
storyRu: "Пит Доэрти вырос на Pulp, Oasis, Blur и The Smiths, а критики слышат у The Libertines прямолинейную ярость The Clash, соединённую с брит-поповской романтикой английской песни. Их нарочито неряшливый рок на две гитары, записанный вживую, сделал «Up the Bracket» стартовым выстрелом инди-возрождения 2000-х."
links:
