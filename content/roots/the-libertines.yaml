        dimensions: ["harmony-form", "melody-vocal"]
        text: "Doherty says that as a teenager he fell for Pulp, Oasis, Blur and Elastica, also discovered Wire and the Smiths, and built songs for two voices — Up the Bracket on the chords of a Smiths song."
        textRu: "Доэрти рассказывает, что подростком влюбился в Pulp, Oasis, Blur и Elastica, открыл для себя Wire и The Smiths и сочинял песни на два голоса, а «Up the Bracket» построил на аккордах песни The Smiths."
        source:
          title: "Big Issue: Pete Doherty — ‘Living without heroin was very hard to imagine’ (Adrian Lobb, 2025)"
          url: "https://www.bigissue.com/culture/music/pete-doherty-interview-music-drugs-libertines/"
          quote: "This was the era of Pulp and Oasis and Blur and Elastica, all these bands I really fell for. I loved that music. And I was discovering older stuff too, listening to Wire and The Smiths."
      - type: "critics"
        dimensions: ["harmony-form", "melody-vocal", "image"]
        text: "Guitar.com describes Up the Bracket’s romantic veneration of Britain’s rock and literary canon, its Smiths-esque chords and the thrill of early Suede, with Barât and Doherty exchanging lead vocals."
        textRu: "Guitar.com пишет о романтическом преклонении «Up the Bracket» перед британским роком и литературой, об аккордах в духе The Smiths и азарте ранних Suede, а также о том, как Барат и Доэрти передают друг другу ведущий вокал."
        source:
          title: "Guitar.com: The Genius Of… Up the Bracket by The Libertines (Andy Price, 2022)"
          url: "https://guitar.com/reviews/album/the-genius-of-up-the-bracket-by-the-libertines/"
          quote: "With their romantic veneration of Britain's rock and literary canon … the nicotine-stained thrill of early Suede … punchy Smiths-esque chords … as he and Doherty exchange lead vocals."
