story: "Robert Plant fronted Led Zeppelin in the manner of Howlin’ Wolf, with an overpowering voice and long one-chord blues vamps. The band came out of the British blues scene and turned the blues into heavy, riff-built rock, stretched by improvisation on stage."
storyRu: "Роберт Плант вёл Led Zeppelin на манер Хаулина Вулфа — подавляющим голосом и долгими блюзовыми вампами на одном аккорде. Группа вышла из британской блюзовой сцены и превратила блюз в тяжёлый рок на риффах, который на сцене разрастался в импровизации."
