story: "Robert Plant names Howlin’ Wolf among his early musical roots. Led Zeppelin also transformed “When the Levee Breaks”, first recorded by Kansas Joe McCoy and Memphis Minnie."
storyRu: "Роберт Плант называет Хаулина Вулфа одним из своих ранних музыкальных ориентиров. Led Zeppelin также преобразили «When the Levee Breaks» — песню, впервые записанную Канзасом Джо Маккоем и Мемфис Минни."
