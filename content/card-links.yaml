# Why each genre card grows from the cards in its `roots`, told only from
# what the cards themselves say. Pairs the cards do not explain are listed
# under `unexplained`.
links:
- from: afrobeat
  to: highlife
  claim: "Afrobeat's maker began in highlife: before he built the new music in Lagos, Fela Kuti led a band that played highlife and jazz."
  claimRu: "Создатель афробита начинал с хайлайфа: прежде чем построить в Лагосе новую музыку, Фела Кути руководил группой, игравшей хайлайф и джаз."
  rests:
    card: highlife
    text: "Fela Kuti began in highlife before he built"
- from: afrobeat
  to: funk
  claim: "Fela Kuti took the drive of James Brown's funk into Afrobeat, the long Lagos dance music in which a big band builds a trance-like groove under punching horns."
  claimRu: "Фела Кути взял напор у фанка Джеймса Брауна и перенёс его в афробит — долгую лагосскую танцевальную музыку, где большой оркестр раскачивает похожий на транс грув, а духовые чеканят риффы."
  rests:
    card: afrobeat
    text: "took the drive of James Brown's funk"
- from: afrobeat
  to: jazz
  claim: "Afrobeat grew from jazz as well as highlife: before building the music in Lagos, Fela Kuti led a band that played both."
  claimRu: "Афробит вырос и из джаза: прежде чем создать эту музыку в Лагосе, Фела Кути руководил группой, игравшей не только хайлайф, но и джаз."
  rests:
    card: afrobeat
    text: "Fela had led a highlife and jazz band before it"
- from: blues
  to: work-songs
  claim: "The call and answer of work songs, one voice singing a line and the crew answering with a refrain, did not stay in the fields but ran on into the blues."
  claimRu: "Перекличка рабочих песен — один голос запевает строку, бригада отвечает припевом — не осталась в поле и зазвучала дальше, в том числе в блюзе."
  rests:
    card: work-songs
    text: "That call and answer did not stay in the fields."
- from: chicago-house
  to: funk
  claim: "House grew from the records Frankie Knuckles played at Chicago's Warehouse from 1977: disco and funk records he reworked for the dancers, later with a drum machine."
  claimRu: "Хаус вырос из пластинок, которые Фрэнки Наклз с 1977 года ставил в чикагском клубе Warehouse: записи диско и фанка он перекраивал для танцующих, а позже добавил драм-машину."
  rests:
    card: chicago-house
    text: "the disco and funk records he reworked, later with a drum machine"
- from: detroit-techno
  to: funk
  claim: "Techno was born in early-1980s Detroit among young Black musicians who loved two things at once, the funk of Parliament-Funkadelic and Kraftwerk's electronic pop, and made machine music about technology, space and the future."
  claimRu: "Техно родилось в Детройте начала 1980-х среди молодых чернокожих музыкантов, которые любили сразу и фанк Parliament-Funkadelic, и электронный поп Kraftwerk, и делали на машинах музыку о технологиях, космосе и будущем."
  rests:
    card: detroit-techno
    text: "the funk of Parliament-Funkadelic and the electronic pop of Germany's Kraftwerk"
- from: gospel
  to: spirituals
  claim: "Spirituals flowed on into gospel, but gospel changed how the songs were made: where no one person wrote a spiritual, gospel songs had composers such as Thomas A. Dorsey and were sold as sheet music."
  claimRu: "Спиричуэлс влились в госпел, но песни стали рождаться иначе: у спиричуэлс нет единственного автора, а песни госпела сочиняли композиторы, такие как Томас А. Дорси, и продавали в нотах."
  rests:
    card: gospel
    text: "which no one person wrote, gospel songs had composers and were sold as sheet music"
- from: gospel
  to: blues
  claim: "Thomas A. Dorsey first made his name in the blues as \"Georgia Tom\", leading Ma Rainey's band, then set sacred words to blues patterns, giving gospel the blues' melodies, harmonies and beat."
  claimRu: "Томаса А. Дорси сперва узнали в блюзе как «Джорджию Тома», руководителя группы Ма Рейни; потом он стал класть духовные тексты на блюзовые обороты, и госпел получил мелодии, гармонии и ритм блюза."
  rests:
    card: gospel
    text: "Then he began setting sacred words to blues patterns"
- from: funk
  to: gospel
  claim: "Gospel's sound passed from the churches to Rosetta Tharpe, who carried gospel and her guitar into the Cotton Club, and from there on into funk."
  claimRu: "Звук госпела перешёл из церквей к Розетте Тарп, которая вынесла госпел вместе со своей гитарой на сцену «Коттон-клаба», а оттуда влился и в фанк."
  rests:
    card: gospel
    text: "From the churches the sound passed to"
- from: funk
  to: rhythm-and-blues
  claim: "Funk came out of rhythm and blues by moving the beat: where R&B drums hit hard on the backbeat, two and four, James Brown put the weight on \"the one\", the first beat."
  claimRu: "Фанк вышел из ритм-н-блюза, сдвинув ритм: в ритм-н-блюзе барабаны жёстко били на бэкбит, вторую и четвёртую доли, а Джеймс Браун перенёс вес на первую долю такта — на «раз»."
  rests:
    card: funk
    text: "leaned on the backbeat, two and four, James Brown put the weight on the first"
- from: highlife
  to: jazz
  claim: "Its ballroom horns make highlife kin to jazz, and E. T. Mensah, the King of Highlife, led a small swing-style band and in 1956 shared a stage with Louis Armstrong."
  claimRu: "Духовые бальных залов роднят хайлайф с джазом, а Э. Т. Менса, король хайлайфа, играл с небольшим бэндом в духе свинга и в 1956 году вышел на одну сцену с Луи Армстронгом."
  rests:
    card: highlife
    text: "Its ballroom horns make it kin to"
- from: jazz
  to: blues
  claim: "The blues' forms and sounds, the twelve-bar verse and the blue notes, passed on into jazz, the music Black and Creole musicians made up on the spot in New Orleans around 1900."
  claimRu: "Формы и звучание блюза — двенадцатитактовая строфа и блюзовые ноты — перешли в джаз, музыку, которую чернокожие и креольские музыканты Нового Орлеана около 1900 года сочиняли прямо во время игры."
  rests:
    card: blues
    text: "its forms and sounds passed on into"
- from: hip-hop
  to: funk
  claim: "Hip-hop began with DJ Kool Herc's merry-go-round in the Bronx: two copies of one funk or soul record on two turntables, so the drum break ran as long as he liked."
  claimRu: "Хип-хоп начался с «карусели» диджея Кул Херка в Бронксе: две одинаковые фанковые или соул-пластинки на двух вертушках, чтобы барабанный брейк длился сколько захочется."
  rests:
    card: hip-hop
    text: "two copies of one funk or soul record on two turntables"
- from: hip-hop
  to: reggae
  claim: "Clive Campbell, a Kingston boy who moved to the Bronx in 1967, brought Jamaica's sound-system culture with him and, as DJ Kool Herc, played the parties hip-hop grew from."
  claimRu: "Клайв Кэмпбелл, мальчишка из Кингстона, в 1967 году переехал в Бронкс, принёс туда ямайскую культуру саунд-систем и под именем Кул Херк ставил пластинки на вечеринках, из которых вырос хип-хоп."
  rests:
    card: hip-hop
    text: "brought Jamaica's sound-system culture to the Bronx"
- from: rock-n-roll
  to: blues
  claim: "The blues' forms and sounds passed on into rock and roll, which even took its name from old blues slang for sex."
  claimRu: "Формы и звучание блюза перешли в рок-н-ролл, и даже само его название пришло из старого блюзового жаргона, где оно означало секс."
  rests:
    card: rock-n-roll
    text: "the phrase itself was old blues slang for sex"
- from: rock-n-roll
  to: gospel
  claim: "Under rock and roll lay gospel, carried out of the churches by Sister Rosetta Tharpe, who took gospel and her guitar into the Cotton Club."
  claimRu: "В основании рок-н-ролла лежал госпел, который вынесла из церквей Систер Розетта Тарп: вместе со своей гитарой она привела его на сцену «Коттон-клаба»."
  rests:
    card: gospel
    text: "who carried gospel and her guitar into the Cotton Club"
- from: rock-n-roll
  to: rhythm-and-blues
  claim: "Rock and roll grew out of rhythm and blues: in Cleveland in 1951 the DJ Alan Freed began playing rhythm and blues and calling it rock and roll."
  claimRu: "Рок-н-ролл вырос из ритм-н-блюза: в 1951 году в Кливленде диджей Алан Фрид начал ставить ритм-н-блюз и называть его рок-н-роллом."
  rests:
    card: rock-n-roll
    text: "began playing rhythm and blues and calling it rock and roll"
- from: spirituals
  to: work-songs
  claim: "Spirituals kept the call and answer of work songs and field hollers: a leader could improvise a verse while the others answered with a refrain."
  claimRu: "Спиричуэлс сохранили перекличку рабочих песен и полевых кличей, «зов и отклик»: запевала мог сымпровизировать куплет, а остальные отвечали ему припевом."
  rests:
    card: spirituals
    text: "A leader could improvise a verse while the others answered with a refrain"
